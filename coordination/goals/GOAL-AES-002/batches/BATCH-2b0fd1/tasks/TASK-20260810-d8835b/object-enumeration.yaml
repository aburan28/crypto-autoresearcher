  # =====================================================================
  # THE ENUMERATION.
  # =====================================================================
  candidates:

    # ---------------------------------------------------------------
    - id: C1
      title: >-
        Nerode/decision-diagram residual-equivalence width of the key-recovery
        predicate, built incrementally round by round
      class: measurement
      tracked_object: >-
        Fix P, C and a variable elimination order over the key bits (and, where
        needed, auxiliary intermediate-state bits). Define the predicate
        pi(K) = [E_K(P) = C]. Build, incrementally as more rounds are processed
        forward from P and backward from C, the ORDERED DECISION DIAGRAM (BDD/
        ZDD-style) representation of the RESIDUAL predicate at each round-
        boundary cut. The tracked quantity is W(r) = the number of live nodes
        (Nerode-equivalence classes of the residual predicate under the fixed
        variable order) at round r, for r = 0..10/12/14.
      mechanism: >-
        A node of the diagram at round r corresponds to an equivalence class of
        partial key/state assignments that are INDISTINGUISHABLE by every
        remaining constraint. Two assignments merge into one node exactly when
        the residual predicate cannot yet tell them apart — i.e. when the
        FORWARD-COMPUTABLE-SO-FAR state and the set of KEY BITS ALREADY FIXED
        do not yet determine a different eventual outcome. If W(r) stays small
        (sub-exponential in the number of key bits processed) at some interior
        r, that IS a computationally exploitable state-merging structure: an
        attacker enumerating only W(r) equivalence classes rather than 2^(bits
        fixed) individual assignments recovers the same information at lower
        cost. If W(r) blows up to track the full live key-and-state space, no
        such merging exists at that cut.
      novelty_status: unverified
      novelty_note: >-
        Recall confidence that BDD/ZDD-based automated search for state-merging
        structure has been applied to block ciphers in the literature is
        MEDIUM, UNVERIFIED-FROM-MEMORY (KS-1/KS-2/KS-4 found no AES-specific
        corroboration or refutation in this corpus; see knowledge_retrieval).
        Novelty against the external literature is UNRESOLVABLE in this
        environment and is NOT claimed in either direction.
      citations:
        - ref: null
          provenance: recalled
          claim: >-
            General recollection that decision-diagram / SAT-adjacent automated
            state-space tools have been applied to symmetric-cipher structural
            search in some form; no specific paper, author or venue is named
            because none is held with confidence.
          verified_by: null
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          The projection maps the full space of partial (key, state)
          assignments live at a round-boundary cut (up to 2^(bits committed so
          far) of them) to a single integer W(r), the count of Nerode-
          equivalence classes. What is discarded — which specific assignment a
          class contains, and every value not yet needed to decide the residual
          predicate — is discarded compatibly with the cipher's own operations:
          Nerode equivalence with respect to a fixed residual predicate is by
          definition invariant under any relabelling of assignments that
          preserves future behaviour, so merging two assignments into one node
          is sound exactly when the round function cannot yet distinguish them.
        not_a_change_of_coordinates_because: >-
          W(r) is one integer against up to 2^128 live partial assignments; it
          cannot determine the key, the state, or which specific assignments
          share a class. Two ciphers whose round-boundary width profiles are
          identical can have completely different S-boxes and key schedules.
      deduplication_verdict: REDISCOVERY
      deduplication_argument: >-
        THE POSITIVE OUTCOME OF THIS OBJECT — a small W(r) at an interior cut —
        IS, BY DEFINITION, A MEET-IN-THE-MIDDLE / DEMIRCI-SELCUK-STYLE STATE
        COMPRESSION, whichever construction happens to realise it. RQ-AES-002's
        off-limits declaration names "meet-in-the-middle and Demirci-Selcuk" and
        "biclique" as families to keep out of the PRIMARY LENS; the lens those
        families use is exactly "does the state space at some intermediate cut
        admit fewer equivalence classes than its raw size suggests", and an
        automated decision-diagram search is a general-purpose INSTRUMENT for
        finding instances of that same phenomenon rather than a differently-
        shaped phenomenon. The formalism (BDD/ZDD construction, Nerode
        equivalence) is not itself named in the off-limits list or in PRIOR-1/2/
        3's enumerations, so it is recorded as a REDISCOVERY OF THE SEARCH
        PRINCIPLE rather than of a specific named construction — a distinction
        that matters for how the object is scored below, not for whether it
        counts as a candidate under the primary-lens restriction. It does not
        count.
      axis_scores:
        novelty:
          score: low
          rationale: >-
            The instrument (build-and-measure a decision diagram) is not
            literally named in the off-limits list, but its useful outcome
            coincides exactly with what MITM/Demirci-Selcuk/biclique already
            search for by hand construction. Scored low because a positive
            finding here is not distinguishable, after the fact, from a
            rediscovery of one of those families.
        testability:
          score: low_at_full_scale
          rationale: >-
            One-step propagation IS definable (incremental diagram construction
            round by round), so the object is concretely testable IN PRINCIPLE.
            At TOY scale (small GF(2^4)-analogue ciphers, a handful of key
            bits) this is straightforwardly buildable in pure Python. AT REAL
            AES-128/192/256 SCALE this requires either an external BDD/ZDD
            engine (unavailable: no sage, no dedicated package in this
            envelope per CM-1's declared toolchain, and building one from
            scratch in pure Python with no numpy for up to 128 key bits and a
            200-S-box round structure is a substantial implementation
            project, not a 1600s task) or a heuristic proxy whose fidelity to
            the true width is itself unvalidated. RECORDED AS OUT OF SCOPE FOR
            EXECUTION AT FULL-ROUND, FULL-KEY-SIZE within this environment's
            measured envelope; a toy-scale instrument is the only thing this
            envelope could build, and per SC it must not be estimated into a
            full-scale result.
        survival:
          score: predicted_low_but_untested
          rationale: >-
            Independently re-derived here (not borrowed from PRIOR-1's
            treewidth/separator closure as authority): the AES round function
            is a BIJECTION on the full 128/192/256-bit state, so for a
            round-boundary cut placed well inside the cipher (away from round 0
            and the final round), no proper subset of the state at that cut can
            determine the next state without the rest — any variable order
            that has processed fewer than ~all state bits by that cut leaves
            the residual predicate needing the remaining bits, which is the
            same "no small separator" argument PRIOR-1's considered_and_rejected
            treewidth entry makes (cited by path, not by authority). This
            argument PREDICTS W(r) blows up rapidly away from the two
            boundaries at any round count, hence PREDICTED not to survive
            usefully past ~1-2 rounds from either end, well short of the FULL
            round-count survival target — but this prediction has never been
            MEASURED even at toy scale in this program, so it is recorded as a
            prediction, not a finding.
      survival_depth: >-
        DEFINED at every round by construction (a decision diagram exists at
        every cut, trivially, even if its width is astronomical). PREDICTED not
        to retain useful (sub-exponential) structure past 1-2 rounds from either
        boundary, i.e. NOT predicted to survive to the FULL round count in the
        sense that matters (small width). Not measured.
      minimal_test_sketch: >-
        NO COMPUTE REQUESTED IN THIS TASK. If pursued in a later batch: toy-
        scale only (a GF(2^4)-analogue block cipher, N <= 16-20 state bits, a
        handful of key bits), build the diagram incrementally and record W(r)
        against a matched-random-permutation null and an L0-style null (PRIOR-5
        pattern: replace the S-box by the identity) as a sensitivity anchor —
        L0's affine structure should give provably small W(r), which the
        instrument must detect or it is broken.
      out_of_scope_for_execution: true
      out_of_scope_reason: >-
        Full-round, full-key-size construction has no available engine in this
        environment's measured toolchain (CM-1 element (a) resource envelope:
        python3/pycryptodome, gcc with -maes, no sage, no numpy, no SAT/MILP);
        only a toy-scale, non-AES-shaped validation is buildable within budget.
      interpretation_limits:
        - No claim about AES security at any round count. No distinguisher, no
          key recovery, no barrier statement.
        - A toy-scale width measurement, if ever run, would NOT extrapolate to
          AES-128/192/256's real width without a validated scaling law; none
          is proposed here.

    # ---------------------------------------------------------------
    - id: C2
      title: >-
        Paired-independent-key data-path avalanche: the Hamming-distance
        profile between two unrelated random keys' encryption trajectories on a
        fixed plaintext
      class: measurement
      tracked_object: >-
        Fix a plaintext P. For two INDEPENDENTLY UNIFORM random keys K, K' (no
        assumed additive, coset, or any other algebraic relation between them —
        this is the point of difference from every coset/delta-based object in
        PRIOR-1/2), track h_r = d_Hamming(state_r under K, state_r under K') at
        every round boundary r = 0..10/12/14, where state_r is the full
        intermediate state after r rounds. The tracked quantity is the FULL
        empirical DISTRIBUTION of h_r over sampled (K, K') pairs at each r, not
        a single bit's correlation and not a single scalar bias.
      mechanism: >-
        For two independent uniform keys, if E behaved exactly like a family of
        two independent uniform random permutations, h_r at r = full round
        count should be distributed as Binomial(128, 1/2) (the standard
        "avalanche" null for two unrelated 128-bit strings). The tracked
        object asks whether AES's structure — which enters state ONLY through
        AddRoundKey (linear XOR) each round, amplified only by the nonlinear
        S-box — makes h_r deviate from that null at any round, and if so, at
        which round the deviation collapses. Unlike differential cryptanalysis
        (which fixes ONE key and a CHOSEN input difference) or class-B/D
        objects in PRIOR-1/2 (which fix an ADDITIVE key difference delta and
        track a PROJECTED, single-bit-style statistic), this object makes NO
        assumption that K and K' are related by any operation at all, and
        tracks the FULL distance histogram rather than one projected bit's
        equality probability.
      novelty_status: unverified
      novelty_note: >-
        The general question "does a keyed permutation family behave like a
        family of independent random permutations" (ideal-cipher-model testing)
        is textbook design-analysis territory; recall confidence that SOME form
        of it is standard is MEDIUM-HIGH, UNVERIFIED-FROM-MEMORY. What this
        session did not find any record of, in this corpus (KS-3/KS-8, 0 direct
        hits for the specific "paired independent-key Hamming profile" framing)
        or in PRIOR-1..5 (whose closest object, PRIOR-4/H-AES-77230c, measures
        the KEY SCHEDULE alone via SINGLE-BIT flips at REDUCED-round scope), is
        this exact combination: DATA-PATH-level, FULL-round-count, UNRELATED
        (not bit-flip-induced) key pairs, FULL Hamming-distance HISTOGRAM.
        Novelty against the external literature is UNRESOLVABLE in this
        environment and is NOT claimed.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          The projection discards, from a pair of full 128/192/256-bit
          trajectories under two full keys, everything except one integer per
          round (the Hamming distance), and further collapses many (K,K')
          pairs into the same integer. What is retained (the distance) is
          preserved compatibly with the cipher's own operations: AddRoundKey
          XORs a round key into BOTH trajectories independently, so it changes
          h_r by the Hamming weight of the round-key difference alone (a
          computable, key-schedule-determined quantity), and every other layer
          (ShiftRows permutation, MixColumns GF(2^8)-linear map, SubBytes
          byte-wise substitution) acts identically on both trajectories'
          underlying bytes, so h_r's evolution is a deterministic function of
          the two trajectories' actual bytes at each round, never of an
          assumption about K, K'.
        not_a_change_of_coordinates_because: >-
          h_r is one integer in {0,...,128} against 2^128 x 2^128 possible
          (K,K') pairs at each round; it determines neither key, nor either
          trajectory, nor the pair's relationship beyond one scalar. Contrast:
          if the tracked object were the FULL XOR difference (state_r under K)
          XOR (state_r under K'), that WOULD determine substantially more and
          would need its own, separate lossy-projection argument — this
          candidate deliberately tracks only the WEIGHT of that difference, one
          further discard beyond what a delta-based object would retain.
      deduplication_verdict: not_a_rediscovery
      deduplication_argument: >-
        Checked against every entry of objects_declared_off_limits_as_the_
        primary_lens: not differential (no chosen input difference, no fixed
        key, no propagated characteristic through a single trail); not linear
        (no linear approximation of the S-box, no correlation/bias statistic —
        the tracked quantity is an exact Hamming distance of exact computed
        bytes); not integral/square/division property (no structured SET of
        plaintexts under one key — there is exactly one plaintext and two
        keys); not impossible differential, boomerang, MITM/Demirci-Selcuk,
        biclique, algebraic/XSL, yoyo, mixture-differential, subspace trail, or
        partial sums (none of these involve a pair of UNRELATED keys on one
        fixed plaintext). Checked against PRIOR-1..5: distinct from PRIOR-1's
        CAND-FR-2 and PRIOR-2's CAND-FR2-B (both use a key DIFFERENCE / SINGLE
        BIT FLIP, not two unrelated keys, and both track a PROJECTED bit or an
        influence-matrix ENTRY, not a full Hamming-distance HISTOGRAM); distinct
        from PRIOR-4/H-AES-ecf3ad (a fixed-key, single-key, PLAINTEXT-coset
        interpolation object); distinct from PRIOR-5/H-AES-8c2d07 (a structural
        null-object control, not an attack-object candidate). Recorded as
        NOT_A_REDISCOVERY on this basis.
      axis_scores:
        novelty:
          score: medium
          rationale: >-
            Adjacent in spirit to standard ideal-cipher-model / avalanche
            testing (adaptation, not a fresh conjecture) but the specific
            statistic (unrelated-key-pair Hamming-distance HISTOGRAM at the
            DATA PATH, at FULL round count) is not found duplicated in this
            corpus or in the cited prior art after an explicit check.
        testability:
          score: high
          rationale: >-
            One-step propagation is directly definable: at each round boundary,
            compute both trajectories' states under independent keys and record
            the Hamming distance. Implementation is pure C, no AES-NI required
            (state instrumentation needed, matching PRIOR-2's own stated
            preference for a non-AES-NI, instrumented round function so a
            matched-null S-box substitution shares the identical code path —
            the same design discipline the unadopted report's CAND-FR2-B
            minimal_test used, applied here by independent reasoning about the
            same envelope). At N = 2^20-2^24 samples per round per variant this
            is well inside the measured 4-core, 15 GB, no-numpy envelope (the
            unadopted RANK-3 receipt's own machine-reach figure of ~2^38.8
            AES-equivalent evaluations per 1600 s task, cited by path and NOT
            adopted as this task's own measurement, gives a rough sense of
            scale only; RQ-AES-002's own resource-envelope constraint requires
            this campaign's RANK-3 task, TASK-20260810-2a0a37, to independently
            re-measure the actual envelope before any budget line is set on it,
            which this task does not do).
        survival:
          score: predicted_null_but_untested
          rationale: >-
            PREDICTED, by the same two-round-full-diffusion reasoning applied
            independently to the data path (AddRoundKey's XOR difference is
            amplified to full-state dependence within a small number of rounds
            once any nonzero round-key or state difference exists), that h_r
            reaches the Binomial(128,1/2) null by round ~2-4 and stays there —
            i.e. NOT predicted to retain exploitable structure at the FULL
            round-count survival target. THIS PREDICTION IS STATED WITH LOWER
            CONFIDENCE THAN IT WOULD OTHERWISE CARRY, because this exact
            program's own PRIOR-4-adjacent measurement (H-AES-77230c/MEAS-RT-D,
            cited by path, status `proposed`/unadopted respectively) found the
            AES-128 KEY SCHEDULE does NOT reach full bit-influence saturation
            (stuck at density 0.78125, never 1.0) even at round 10, contrary to
            a naive full-diffusion expectation — a demonstrated instance, in
            this exact campaign, of a diffusion assumption being WRONG in a
            measurable, structural way. Whether the DATA PATH under two
            UNRELATED keys shows an analogous non-saturation is exactly the
            open question this candidate would resolve; it is not assumed
            either way here.
      survival_depth: >-
        DEFINED at every round 1..10/12/14 by construction; PREDICTED to reach
        the null distribution by round ~2-4 (untested), which would mean it does
        NOT survive to the FULL round count in the sense of retaining
        exploitable structure. The prediction is flagged as carrying below-
        default confidence given this campaign's own key-schedule saturation
        finding (PRIOR-4/H-AES-77230c), cited as context per SC-5 and NOT used
        to promote or dismiss this candidate.
      minimal_test_sketch: >-
        NO COMPUTE REQUESTED IN THIS TASK. If pursued: C, instrumented (non-
        AES-NI) AES-128/192/256, N = 2^16-2^24 independent (K,K') pairs per
        round, report the full h_r histogram (not just mean/variance) against
        Binomial(128,1/2), against a matched null (independent uniformly random
        round-key sequences replacing the real key schedule, whitening key
        RK[0] preserved per the D-4 lesson PRIOR-2's own report names and which
        this session independently re-derives as sound practice rather than
        adopts on that report's authority), and against a sensitivity anchor
        (round 1, where a single-round-key XOR difference should produce a
        LARGE deviation from the null, detectable by construction). Void
