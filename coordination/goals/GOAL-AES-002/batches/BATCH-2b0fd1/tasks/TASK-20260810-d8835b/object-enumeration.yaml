          the tested sample count and round range — not that no exploitable
          cross-key structure exists at any finer resolution, exactly the
          PRIOR-3/OBJ-7 lesson (not adopted as authority; independently
          restated as a general property of any finite-sample statistical test).

    # ---------------------------------------------------------------
    - id: C3
      title: >-
        The structured-key-set sharing-cost object (per-candidate amortised
        verification cost over an arbitrary structured key SET, not a coset
        or a MITM split)
      class: measurement
      tracked_object: >-
        For a structured family F of key SETS (not necessarily cosets of a
        linear subspace, not necessarily split into two independent halves)
        of size 2^d, the object is mu(F,d) = (total distinct intermediate-byte
        values produced across the set, summed over all 200/224/276 S-box
        positions) / (200/224/276 x 2^d) — the fraction of per-candidate S-box
        work that is NOT eliminated by sharing within the set.
      mechanism: >-
        If mu(F,d) < 1 for some family and some d that scales with the key
        size, per-candidate verification cost is sub-linear in the number of
        candidates tested, which — IF the cost of constructing and indexing the
        shared work is also charged and remains sub-linear — could in
        principle move the definitional-reference exponent.
      novelty_status: unverified
      novelty_note: >-
        Recall confidence that this general accounting quantity is the
        underlying cost-optimisation question MITM, Demirci-Selcuk, biclique
        and partial-sums constructions all specialise (each names a specific
        family F and a specific construction realising a small mu) is HIGH.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          mu(F,d) discards which specific candidates collide and retains only
          the aggregate collision RATE, compatibly with the cipher's operations
          in the same sense as CAND-FR-1's activity-pattern discard (PRIOR-1,
          cited by path, not by authority): shared intermediate byte values ARE
          shared work regardless of which key produced them.
        not_a_change_of_coordinates_because: >-
          mu is one real number per (F,d) against up to 2^d individual
          candidates and their full intermediate trajectories.
      deduplication_verdict: REDISCOVERY
      deduplication_argument: >-
        THIS IS THE GENERIC COST-ACCOUNTING QUESTION THAT "meet-in-the-middle
        and Demirci-Selcuk", "biclique" and "partial sums as a cost
        reorganisation" — three separate entries of the off-limits list — each
        specialise to one particular construction. A candidate whose only
        content is "ask, in general, how small the specialised quantity these
        three families already optimise can be made" is a REDISCOVERY of the
        shared PRIMARY LENS those families use, stated at one level of
        abstraction higher, not a family-independent escape from it. It is
        recorded as a REDISCOVERY, not as a candidate, per the SC instruction
        that a candidate arriving in new notation is still a rediscovery.
      axis_scores:
        novelty: {score: low, rationale: "generic form of three off-limits families' shared cost quantity; abstraction level differs, mechanism does not."}
        testability: {score: high, rationale: "one-step propagation (distinct-value counting per S-box position, round by round, over an enumerated set) is directly definable and cheap; PRIOR-1's CAND-FR-1 minimal_test design already demonstrates the pattern fits the envelope."}
        survival: {score: not_scored_rediscovery, rationale: "scoring survival for a rediscovery is not meaningful; recorded for completeness of the axis fields only, at NONE (governed entirely by whichever specific construction realises F, which is off-limits territory)."}
      survival_depth: not_applicable_rediscovery
      out_of_scope_for_execution: null
      interpretation_limits:
        - Recorded to demonstrate the screening was actually applied to this
          object, per SC. No experiment is proposed on it under this task.

    # ---------------------------------------------------------------
    - id: C4
      title: >-
        Universal-compressibility / minimum-description-length object for the
        (K, P, C) triple
      class: measurement
      tracked_object: >-
        For a fixed reference machine, the Kolmogorov complexity K(K,P,C | P,C)
        — informally, how much shorter than |K| a description of the true key
        can be made given (P,C) and AES's definition as a decoder — or, as a
        computable proxy, the compressed length of a serialization of many
        (K, E_K(P)) pairs under a general-purpose compressor.
      mechanism: >-
        If AES's structure made a nonneglible fraction of keys compressible
        relative to (P,C), that fraction could in principle be searched first.
      novelty_status: unverified
      novelty_note: >-
        Recall confidence that description-length arguments have been applied
        to block-cipher security informally (as an intuition for "a secure
        cipher's key space should not compress") is MEDIUM, UNVERIFIED-FROM-
        MEMORY; a computable-proxy realisation of it as a concrete tracked
        object for AES specifically was not found in this corpus (KS-5, not
        individually opened) or in PRIOR-1..5.
      lossy_projection_test:
        verdict: PASSES
        argument: >-
          A compressed length is about as lossy a projection of a (K,P,C)
          triple as exists; it discards essentially everything except "how
          surprising is this triple under a fixed universal prior."
        not_a_change_of_coordinates_because: >-
          A compressed length is a single integer against a 2^128-2^256 space
          of triples.
      deduplication_verdict: not_a_rediscovery
      deduplication_argument: >-
        Not named in the off-limits list and not a specialisation of any entry
        on it under any framing this session could construct; it does not
        propagate a difference, a linear mask, a structured set, or a matched
        pair through the cipher at all.
      axis_scores:
        novelty: {score: medium, rationale: "not duplicated in this corpus or cited prior art, but the general intuition is textbook and a specific computable realisation for AES was not previously attempted here."}
        testability:
          score: fails
          rationale: >-
            KOLMOGOROV COMPLEXITY IS UNCOMPUTABLE IN GENERAL; that is a
            theorem, not an implementation gap. A COMPUTABLE PROXY (e.g. a
            general-purpose compressor's output length on a large batch of
            (K, E_K(P)) pairs) is buildable within the envelope (pure Python
            zlib/lzma is standard-library, no numpy needed), but nothing in
            this record connects a proxy compressor's output length to ATTACK
            COST — that connection would itself need to be derived (why would
            a shorter zlib output translate into a cheaper key search?) before
            any measurement of it would mean anything. FAILS the concrete-
            testability axis as a CANDIDATE OBJECT for THIS campaign's purpose,
            not as a mathematical question in general.
        survival: {score: undetermined, rationale: "no survival prediction is offered for an object that fails testability; offering one would be estimating a candidate into a result, which SC forbids."}
      survival_depth: undetermined_untestable
      out_of_scope_for_execution: true
      out_of_scope_reason: >-
        The cheapest falsification gate for the THEORETICALLY meaningful
        version (true Kolmogorov complexity) does not exist (uncomputable); the
        cheapest gate for the PROXY version (compressor length) exists but has
        no derived connection to attack cost, so any run of it would produce a
        number with no interpretation, which is not a falsification gate at all.
      interpretation_limits:
        - Recorded honestly as a candidate that dies on testability rather than
          on lossy-projection or dedup, per SC's instruction that a candidate
          failing every screen still gets recorded, including the ones it kills.

    # ---------------------------------------------------------------
    - id: C5
      title: Walsh-Hadamard spectral / correlation-immunity eigenstructure of the round function under a fixed round key
      class: measurement
      tracked_object: >-
        The Walsh-Hadamard transform (linear-approximation correlation table)
        of the round function restricted to a fixed round key, and its
        eigenstructure under composition across rounds.
      novelty_status: unverified
      lossy_projection_test:
        verdict: PASSES
        argument: A correlation spectrum discards the round function's full truth table, retaining only linear-approximation biases.
        not_a_change_of_coordinates_because: The spectrum is far smaller than the full function specification.
      deduplication_verdict: REDISCOVERY
      deduplication_argument: >-
        This is, by name, the Walsh/linear-approximation-table object that
        "linear and multidimensional linear" (an explicit off-limits entry)
        already IS. No reframing offered here discards anything a linear-hull
        analysis does not already discard. Killed at dedup immediately.
      axis_scores:
        novelty: {score: none, rationale: "literal name match to an off-limits family."}
        testability: {score: not_scored, rationale: "not scored for a clean off-limits rediscovery."}
        survival: {score: not_scored, rationale: "not scored for a clean off-limits rediscovery."}
      survival_depth: not_applicable_rediscovery
      out_of_scope_for_execution: null
      interpretation_limits:
        - Recorded to demonstrate the off-limits screen catches an exact-name match, as a sanity check on the screening procedure itself.

    # ---------------------------------------------------------------
    - id: C6
      title: Shannon mutual-information / entropy dependence statistic between an output byte and a key byte
      class: measurement
      tracked_object: >-
        The empirical mutual information I(output_byte ; key_byte) estimated
        from sampled (K,P,C) triples, as a generalisation of a linear
        correlation or a differential bias to an arbitrary (nonlinear)
        statistical dependence measure.
      novelty_status: unverified
      lossy_projection_test:
        verdict: PASSES
        argument: Mutual information discards the joint distribution's full shape, retaining one scalar dependence measure.
        not_a_change_of_coordinates_because: A single MI value cannot reconstruct the joint distribution.
      deduplication_verdict: REDISCOVERY
      deduplication_argument: >-
        In practice, any FINITE-SAMPLE estimator of mutual information between
        two byte-valued variables reduces to building and reading off a joint
        frequency table — exactly the object linear and differential
        cryptanalysis already build and read (a bias table / a difference-
        propagation table are both special cases of a joint frequency table
        over a structured event). Using Shannon entropy instead of a linear
        correlation coefficient changes the SUMMARY STATISTIC computed from
        that table, not the table itself or what is discarded to build it; it
        is therefore recorded as a REDISCOVERY-ADJACENT repackaging of the
        linear/differential lens rather than a fresh escape from it.
      axis_scores:
        novelty: {score: low, rationale: "different summary statistic over the identical underlying joint-frequency object linear/differential analysis already builds."}
        testability: {score: not_scored, rationale: "not scored for a dedup rejection."}
        survival: {score: not_scored, rationale: "not scored for a dedup rejection."}
      survival_depth: not_applicable_rediscovery
      out_of_scope_for_execution: null
      interpretation_limits: []

    # ---------------------------------------------------------------
    - id: C7
      title: >-
        Tower-field (GF((2^4)^2)) representation of the AES S-box for the
        algebraic (Groebner/Macaulay) attack lens
      class: representation
      tracked_object: >-
        Re-express the GF(2^8) field inversion underlying the AES S-box in a
        tower-field basis (GF(2^8) as a degree-2 extension of GF(2^4), as used
        in some compact hardware S-box implementations), and ask whether the
        resulting polynomial system over the tower basis admits a lower
        Groebner solving degree than PRIOR-2/CAND-FR2-A's direct GF(2)
        formulation.
      novelty_status: unverified
      lossy_projection_test:
        verdict: FAILS
        argument: >-
          A field-extension tower is an INVERTIBLE, GF(2)-LINEAR change of
          basis of the SAME underlying 8-dimensional GF(2) vector space (any
          GF(2^8) is an 8-dimensional GF(2) vector space regardless of which
          basis or tower construction names its elements). The rank of the
          degree-d Macaulay matrix of a polynomial system is INVARIANT under an
          invertible linear change of variables (a standard fact about matrix
          rank under change of basis; independently re-derived here, not
          borrowed from PRIOR-2/CAND-FR2-A's own use of the same fact for its
          own lossy-projection argument). Consequently, translating the AES
          S-box's defining relations into a tower-field basis changes the
          NAMES of the variables and coefficients but cannot change the
          Macaulay rank profile, hence cannot change the derived solving
          degree, at any degree.
        not_a_change_of_coordinates_because: >-
          It IS a change of coordinates — that is precisely the finding. Named
          here because failing the test is itself the useful, zero-compute
          result: this candidate is killed algebraically, before any Groebner
          computation, rather than discovered to be worthless after building
          one.
      deduplication_verdict: not_applicable_killed_at_lossy_projection
      axis_scores:
        novelty: {score: not_scored, rationale: "killed at the lossy-projection test, before dedup is even reached."}
        testability: {score: not_scored, rationale: "no test is proposed for a non-object."}
        survival: {score: not_scored, rationale: "no survival question arises for a non-object."}
      survival_depth: not_applicable_failed_lossy_projection
      out_of_scope_for_execution: null
      interpretation_limits:
        - >-
          This is a NEGATIVE, zero-compute algebraic result about REPRESENTATION
          CHOICE, not about AES security. It says nothing about whether the
          Groebner/algebraic lane (PRIOR-2/CAND-FR2-A, O-5/O-5') reaches the
          definitional reference; it only rules out ONE proposed way of trying
          to improve that lane's numbers by re-coordinatising the S-box.
        - >-
          Does not rule out representation choices that are NOT invertible
          linear changes of the same variable space (e.g. genuinely different
          equation SETS with more or fewer relations per S-box, which is a
          different, non-rediscovered question this candidate does not touch).

