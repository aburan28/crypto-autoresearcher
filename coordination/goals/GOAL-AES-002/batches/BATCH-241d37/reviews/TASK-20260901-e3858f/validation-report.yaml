  # ---------------------------------------------------------------- J3
  - joint: J3
    subject: protocol-amendment-GOAL-AES-002-004 (ITEM 1, TASK-20260901-e045b8)
    verdict: holds
    method: rule_applied_by_me_then_compared
    procedure_note: >-
      I extracted the two resolving-text blocks from the committed amendment,
      applied each rule myself to the required inputs, wrote down my own
      verdicts, and only then compared against the amendment's own worked
      checks. I did not derive my verdicts from theirs.
    checks:
    - check: GAP B, PROVES-TOO-MUCH, applied to the m=0 definitional reference
      my_application: >-
        Clause B-1 makes element (f)'s separate N-verification charge apply IFF
        the work already charged for producing the candidate set does NOT itself
        include, per candidate, a full AES-k evaluation on an element (d)
        plaintext under that candidate key. For m=0 (exhaustive search: pick the
        next key, encrypt, compare), the charged production work IS one full
        AES-k encryption per candidate. B-1's antecedent is therefore FALSE, the
        separate charge DOES NOT apply, and verification is BUNDLED.
      my_verdict: BUNDLED
      forced: >-
        YES. The reading that proves too much - treating "pick the key" as
        production and "encrypt and compare" as separate verification because
        they are two procedural steps - is explicitly foreclosed by B-1's
        sentence "PROCEDURAL SEPARATION IS NOT THE TEST AND NEVER TRIGGERS THE
        CHARGE". There is no second admissible reading.
      why_it_matters_arithmetically: >-
        I checked the absurdity the check is guarding against. Note that
        m=0 does NOT discriminate the two readings by TOTAL alone: bundled gives
        2^(k-1) AEU-k from production; unbundled-with-free-production gives
        2^(k-1) verification units; both total 2^(k-1). The real absurdity is
        DOUBLE charging - production AND verification - which would make the
        definitional reference cost about twice itself and would move CM-1's
        definitional 2^127 / 2^191 / 2^255 figures, which no amendment may move.
        B-1 plus B-3's "MAY NOT be charged ... more than once for the same
        candidate set" blocks it.
      agreement_with_amendment: >-
        The amendment reaches BUNDLED by the same route and names the same
        doubling absurdity. My independent application agrees.
      status: pass
    - check: GAP A applied to a fused T-table, a bitsliced and an AES-NI implementation
      method: >-
        I encoded clauses A-1/A-2/A-3 AND the red team's rejected candidate rule
        as two predicates and executed both on the same six inputs: three
        implementation techniques crossed with two specification-level attack
        descriptions (ATK-P, whose spec consumes no ShiftRows/MixColumns result;
        ATK-Q, whose spec consumes a MixColumns result).
      transcript: |
        attack                                 impl            AMD-004 verdict              rejected-rule verdict
        ATK-P (no MC/SR result consumed)       fused_T_table   ADMISSIBLE under Route 3     ADMISSIBLE under Route 3
        ATK-P                                  bitsliced       ADMISSIBLE under Route 3     INADMISSIBLE (no memory-access referent)
        ATK-P                                  aes_ni          ADMISSIBLE under Route 3     INADMISSIBLE (no memory-access referent)
        ATK-Q (spec consumes MixColumns)       fused_T_table   INADMISSIBLE/UNADJUDICABLE   ADMISSIBLE under Route 3
        ATK-Q                                  bitsliced       INADMISSIBLE/UNADJUDICABLE   INADMISSIBLE (no memory-access referent)
        ATK-Q                                  aes_ni          INADMISSIBLE/UNADJUDICABLE   INADMISSIBLE (no memory-access referent)
        AMD-004 implementation-invariant for ATK-P: True   ATK-Q: True
        REJECTED rule implementation-invariant for ATK-P: False   ATK-Q: False
        TOTALITY: AMD-004 total and single-valued on all 6 inputs -> FORCED, not ambiguous
      finding: >-
        THE CLASSIFICATION IS FORCED, NOT STILL AMBIGUOUS, and it is forced in
        the specific sense the gap required: the verdict is a function of the
        attack's specification-level description ALONE and is constant across
        the three implementation techniques. The structural reason, which I
        verified rather than assumed, is that A-3(ii) is a CONDITIONAL on table
        accesses (vacuously satisfied where there are none), whereas the
        rejected rule was a BICONDITIONAL definition of "independent" keyed on a
        memory access, so with no memory accesses every accompanying operation
        became independent and the two most auditable implementations became
        inadmissible. The amendment's stated rejection reason is reproduced by
        execution, not read back. The rejected rule also mis-classifies the red
        team's own headline counterexample - a fused T-table attack that
        computes rounds - as ADMISSIBLE, where A-2(i) forces the conservative
        INADMISSIBLE.
      status: pass
    - check: does A-2 leave a residual gap, and is it disclosed?
      finding: >-
        YES, one, and it IS disclosed. A-2's verdict is forced only once the
        attack's specification-level description is fixed; two readers could
        still differ on what a loosely described attack "requires" (e.g. "partly
        decrypt one round"). A-4 mitigates by making the complete spec-level
        inventory a mandatory disclosure whose omission is itself INADMISSIBLE,
        so the rule still terminates, but it relocates the disagreement rather
        than removing it. The amendment names exactly this as limitation L4
        ("CLAUSE A-2's TEST REQUIRES AN HONEST SPECIFICATION-LEVEL DESCRIPTION
        OF THE ATTACK, AND THAT IS ITS WEAKEST POINT"), and names the mirror
        exposure for B-1 as L5. Disclosed, not papered over.
      status: pass
    - check: amendment 003 and CM-1 byte-unchanged
      result: >-
        Independently confirmed by sha256 over committed blobs at the batch's
        opening commit 69f52eba4 and at HEAD:
        amendment-001, -002, -003 all BYTE_UNCHANGED;
        CM-1 (coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml)
        439f9fab57467fd1fb0927ce05a792876720d5d2ca676e63a835adddb8e56f00 at
        69f52eba4, at HEAD and in the working tree - BYTE-UNCHANGED. `git log`
        shows no commit touching amendments 001-003 since the batch opened.
      status: pass
    what_this_joint_does_not_establish: >-
      The amendment's classifications are RULE APPLICATIONS, not measurements.
      Nothing here says any AES attack exists, is cheap, or beats anything. The
      amendment's own limitation L3 says the same and I agree with it.

  # ---------------------------------------------------------------- J4
  - joint: J4
    subject: C2 paired-validation design v2 (ITEM 3, TASK-20260901-6afe39)
    verdict: holds
    method: parsed_traced_and_re_executed
    checks:
    - check: the deliverable parses
      result: >-
        yaml.safe_load succeeds. Top-level keys: supersession, experiment,
        defects_resolved, knowledge_retrieval, budget,
        covering_manifest_declaration, artifact_provenance,
        other_manifests_of_this_task, honest_accounting, r5_anti_laundering,
