        sha256 of the committed blob 0855a2f455fdaf9244b0d03eea1c9b817d089f539c6086e6a243451f9e8eabe4.
      status: pass
    - check: does the revised seed_policy actually deliver byte-identical state_0 across arms?
      method: >-
        I implemented S1 (the shared key stream) and S2 (the ARM-NULL-only
        round-key stream) exactly as the v2 text specifies - SHA-256 over the
        stated ASCII pre-image, random.Random seeded with the resulting integer,
        getrandbits(8L).to_bytes(L,"big") for K then K' from the SAME instance -
        and traced the draw order for both arms across 24 cases
        (key_size in {128,192,256}) x (tier in {pilot,primary}) x (i in {0,1,7,99}).
      transcript: |
        sample: kb=128 tier=pilot i=0
          K   ARM-REAL add550c6f646c21c0804cb738a0889e2
          K   ARM-NULL add550c6f646c21c0804cb738a0889e2
          K'  ARM-REAL df1b4cb8a1f91efe4a03864de48abd1f
          K'  ARM-NULL df1b4cb8a1f91efe4a03864de48abd1f
          state_0 ARM-REAL add452c5f243c41b000dc178860587ed
          state_0 ARM-NULL add452c5f243c41b000dc178860587ed
          S2 draw count = 20 = 2*R = 20; RK[0] not drawn from S2
        BYTE-IDENTICAL state_0 (and K,K') ACROSS ARMS ON ALL 24 TRACED CASES: True
        S1/S2 subseed collision over 1200 sampled indices: False
      the_defect_is_real: >-
        I confirmed the defect being repaired rather than assuming it. v1's own
        text reads "SEED(key_size, arm, tier) := BASE_SEED + 1000*ks_idx +
        100*arm_idx + tier_offset", i.e. `arm` DID index the key draw, so v1's
        ARM-REAL and ARM-NULL provably drew different key pairs and v1's own
        byte-identical-state_0 claim was false as written. v2's S1 index carries
        no `arm` term.
      adversarial_probe_i_ran: >-
        v2 declares "FOUR DECLARED STREAMS, and no others". state_0 =
        AddRoundKey(P, RK[0]), so if the PLAINTEXT were drawn from an undeclared
        fifth stream the byte-identical claim could still fail on the P term. I
        checked: P is `inputs.carried_forward_unchanged_from_v1.fixed_plaintext_P`,
        exactly one fixed plaintext per key size, not drawn. The claim survives
        the probe.
      structural_points_i_verified: >-
        (a) Because each sample index gets a FRESH random.Random, arm execution
        order, process separation and resumption cannot desynchronise the arms -
        this is a genuine improvement over the red team's own "single sequential
        stream" proposal and the design says so openly rather than silently
        deviating. (b) RK[0] is taken from the real FIPS-197 KeyExpansion in
        BOTH arms and is not drawn from S2, so state_0 agreement is by
        construction. (c) S2 draws exactly 2R 128-bit strings in a fixed order;
        20/24/28 for R=10/12/14, which I checked. (d) No S1/S2 sub-seed
        collision over 1200 sampled indices.
      status: pass
    - check: does a flat, non-jumping, ARM-NULL-only excess route to a NAMED falsification outcome?
      my_trace: >-
        A flat excess does not trip invalidation rule 1a (the jump detector), so
        the run reaches the 2x2 table on (A = CONVERGED(ARM-REAL),
        B = CONVERGED(ARM-NULL)). ARM-REAL fine, ARM-NULL alone in excess gives
