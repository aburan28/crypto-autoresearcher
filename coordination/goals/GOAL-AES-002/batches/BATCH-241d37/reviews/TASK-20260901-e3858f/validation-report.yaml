          1788235800). The file now hashes to
          392720a0316afacb73efb073d12cba1e114972f6f2d0c7cf221f92a156729109.
          THE PIN NO LONGER MATCHES. The other four pins in that block do match.
      (2) BATCH-241d37/dispatch_queue.json pins, for TASK-20260901-82ed73, its
          own snapshot-receipt.json = 55bf6f03c7da7268... . Commit 9bc9653c1
          edited that file in place after ee80ce456; it now hashes to
          bea5e8203dc35eea... . THE PIN NO LONGER MATCHES THE WORKING TREE,
          though it matches exactly at the bound commit ee80ce456.
    analysis: >-
      The substance of (1) is correct - 1788235800 really is 2026-09-01T04:10:00Z
      and 1788322200 is 2026-09-02T04:10:00Z, so the recorded epoch was a day
      out. The METHOD is the defect. CLAUDE.md states archive receipts bind to
      content first and that "a content mismatch is still fatal"; AGENTS.md
      rule 2 requires corrections to supersede rather than overwrite. This is
      the same class of hash-pinning integrity defect that F-VAL4c225b-1
      identified and that this very batch convened to repair, recurring inside
      the repair. Case (2) may be partly the unavoidable receipt
      self-reference problem, but a receipt that cannot contain its own hash
      should not be pinned to a value it will not hold.
    who: >-
      Both are Coordinator commits, not producer artifacts. NEITHER CHANGES ANY
      OF MY FOUR JOINT VERDICTS: all 17 snapshot pins verify byte-exactly at
      the bound commit ee80ce456, which is what the review reads.
    recommended_remedy: >-
      Supersede rather than overwrite: file a correction record and, if the
      queue must reflect it, re-pin in a new archive block that names the
      superseding receipt. Do not re-write the pinned bytes.
    for_the_coordinator: not_a_finding_i_may_act_on
  - id: OBS-E3858F-2
    severity: informational
    title: COORDINATOR DEVIATION 2 - the eb81f4 artifact_paths widening was the right call
    assessment: >-
      I checked the immutable card myself. Its WRITE SCOPE section already lists
      tools/validate_ledger.py, docs/claims-and-verification.md and
      docs/evidence-and-reproducibility.md alongside the task directory; only
      its DELIVERABLES section listed four paths. The producer therefore did NOT
      exceed its declared write authority, and the widening does not paper over
      an over-reaching producer - it closes a gap between a card's write scope
      and its artifact list. The card itself is byte-unchanged (one commit,
      69f52eba4, in its whole history). Committing three applied shared files
      unpinned would have reproduced F-VAL4c225b-1 inside the batch convened to
      repair it, so the alternative was worse. The widening was disclosed in
      the commit message. I endorse the call, with one note: the underlying
      defect is a card template that lets DELIVERABLES and WRITE SCOPE
      disagree, and that is worth fixing at the template rather than per task.
