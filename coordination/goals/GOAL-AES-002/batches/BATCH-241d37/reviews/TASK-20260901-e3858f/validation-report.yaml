  - id: OBS-E3858F-1
    severity: high_for_process
    title: TWO HASH-PINNED ARCHIVAL RECEIPTS WERE EDITED IN PLACE AFTER ARCHIVING
    evidence: |
      (1) BATCH-286bcd/dispatch_queue.json pins, for TASK-20260901-420f4b,
          coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/archives/TASK-20260901-420f4b/snapshot-receipt.json
