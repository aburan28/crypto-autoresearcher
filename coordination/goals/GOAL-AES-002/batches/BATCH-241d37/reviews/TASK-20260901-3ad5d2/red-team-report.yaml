  objections:
    - id: OBJ-1
      joint: J1
      target: 004 the_change.item_1_gap_a_definition_of_independent, clauses A-2 and A-3(i)
      severity: MEDIUM_HIGH
      title: >-
        A-2 AND A-3(i) HAVE NO PRECEDENCE RULE BETWEEN THEM, AND THE MOST ORDINARY
        ATTACK SHAPE THERE IS — LAST-ROUND PARTIAL KEY GUESSING — LANDS EXACTLY IN THE
        GAP, WITH THE TWO READERS DIFFERING BY "DETERMINATE AEU-k FIGURE" vs "UNADJUDICABLE".
      mechanism: >-
        A-2 defines independence by a REQUIREMENT test ("the attack consumes the output
        of that ShiftRows ... operation") and makes a required operation independent
        "EVEN IF a particular implementation obtains it for free". A-3(i) then exempts
        "A FIXED, DATA-INDEPENDENT PERMUTATION OF BYTE POSITIONS that the attack applies
        BY INDEXING ALONE — READING BYTES ALREADY COMPUTED AND ALREADY CHARGED". A-2
        makes every REQUIRED relabelling independent; A-3(i) exempts relabellings only of
        ALREADY-CHARGED bytes. The amendment never states which governs when both apply,
        and it never states what happens when the relabelled bytes are NOT already
        charged. Note by contrast that clause B-1 DOES carry an explicit precedence
        sentence for its own conflict case ("where it and clause B-1 could be read to
        differ, CLAUSE B-1 GOVERNS"); no such sentence exists anywhere in A-1..A-4.
      worked_counterexample: >-
        ATTACK Q (hypothetical, specification-level, asserted of no real cipher and of
        no round count). Element (d) data: D known plaintext/ciphertext pairs. For each
        of G guesses of a 4-byte subset of a final round key: for each of the D
        ciphertexts, (1) SELECT the four ciphertext bytes at positions {0, 7, 10, 13}
        — a fixed, data-independent set that is exactly one column's preimage under the
        inverse of the linear byte-position relabelling; (2) XOR the four guessed key
        bytes into them (4*D*G AddRoundKey byte-XORs, counted in X); (3) apply the
        inverse S-box to the four results (4*D*G S-box applications, counted in N);
        (4) evaluate a statistical predicate on the four output bytes. No MixColumns,
        no table access, no other bytewise operation. The submitter's A-4 disclosure is
        COMPLETE AND HONEST: "N = 4DG, X = 4DG, plus one fixed data-independent byte-
        position selection applied by indexing alone; implementation assumed plain
        byte-oriented".
        READER 1 applies A-3(i): step (1) is a fixed, data-independent permutation of
        byte positions applied by indexing alone with no bytewise arithmetic, therefore
        "not a ShiftRows COMPUTATION under this bar". Route 3 stands. Charged figure:
        (N/S_k + X/X_k) AEU-k — a determinate finite number.
        READER 2 applies A-3(i) literally and finds its antecedent UNMET: the bytes
        being relabelled are RECEIVED CIPHERTEXT BYTES, which are neither "already
        computed" by the attack nor "already charged" under Route 1 or Route 3 — they
        are element (d) inputs. The rider therefore does not reach this case. Falling
        back to A-2: the attack's own specification-level description REQUIRES the
        result of the selection (an algorithm not performing it would not compute what
        this attack computes), so by A-2(i) the operation IS independent, the Route 3
        bar fires, and the claim is INADMISSIBLE / UNADJUDICABLE.
        THE SPLIT IS TOTAL: a determinate AEU-k figure versus no figure at all, on the
        single most common shape a partial-key-recovery attack takes, with an honest
        A-4 disclosure that distinguishes the two readings not at all.
      why_a4_does_not_save_it: >-
        A-4 requires disclosure of the operation INVENTORY and of the implementation
        technique. Attack Q's inventory is disclosed completely and truthfully. The
        ambiguity is not in what the attack does; it is in which of two clauses of the
        amendment applies to what it does. A disclosure duty cannot resolve a
        precedence gap in the rule doing the reading.
      repair_direction_offered_not_concluded: >-
        Either (i) extend A-3(i)'s antecedent from "bytes already computed and already
        charged" to "bytes already computed and already charged, OR element (d) input
        bytes the attack has received", and add an explicit precedence sentence
        ("where A-2 and A-3 could be read to differ, A-3 GOVERNS for the operation
        classes it names"); or (ii) delete A-3(i) and accept the conservative verdict
        for every required relabelling. This session takes no position on which is
        right; it establishes only that the current text supports both verdicts.

    - id: OBJ-2
      joint: J1
      target: 004 the_change.item_1_gap_a_definition_of_independent, clause A-2's counterfactual gloss
      severity: HIGH
      title: >-
        A-2's TWO HALVES ARE NOT EQUIVALENT. THE CONSUMPTION TEST IS INTENSIONAL, THE
        "THAT IS" GLOSS IS EXTENSIONAL, AND UNDER THE EXTENSIONAL READING ROUTE 3's BAR
        IS VACUOUS FOR THE WHOLE LINEAR LAYER. NO DISHONEST DESCRIPTION IS REQUIRED —
        THE AMENDMENT'S OWN NAMED WEAK POINT IS NOT ITS WORST CASE.
      mechanism: >-
        A-2 reads: an operation is independent "IF AND ONLY IF THE ATTACK ALGORITHM'S OWN
        SPECIFICATION-LEVEL DESCRIPTION REQUIRES ITS RESULT — that is, the attack
        consumes the output of that ... operation, SO THAT AN ALGORITHM NOT PERFORMING
        IT WOULD NOT COMPUTE WHAT THIS ATTACK COMPUTES." The first half asks about THIS
        DESCRIPTION (intensional). The final clause quantifies over ALGORITHMS and asks
        about the FUNCTION COMPUTED (extensional). These are different tests, and the
        amendment offers them as one. ShiftRows and MixColumns are both invertible
        F_2-linear maps, so any predicate the attack evaluates downstream of them can be
        PULLED BACK through them at specification time, giving an algorithm that does not
        perform the operation and computes the identical function of the identical
        inputs. Under the extensional reading, therefore, NO linear-layer operation is
        ever independent, and Route 3's bar — which exists to exclude exactly the linear
        layer — excludes nothing. That is a proves-too-much failure of precisely the kind
        the amendment ran against draft B-0 for clause B-1 AND DID NOT RUN AGAINST A-2.
      worked_counterexample: >-
        ATTACK P (hypothetical, specification-level, asserted of no real cipher and of no
        round count). Per candidate key guess and per element (d) block: compute the
        4-byte column a = InvSubBytes(C_sel XOR k_hat) — 4 S-box applications into N,
        4 AddRoundKey byte-XORs into X — then compute m = MixColumns(a) and ACCEPT iff
        m equals a single fixed 4-byte constant s.
        ATTACK P' : identical up to and including a; ACCEPT iff a equals the single fixed
        4-byte constant s' := MixColumns^{-1}(s), computed ONCE at specification time.
        MixColumns is a bijection on 4-byte columns, so s' exists, is unique, and is a
        constant of the specification, not a table.
        FACTS: P and P' compute the SAME function of the SAME inputs, accept the SAME
        candidates, and have IDENTICAL N and IDENTICAL X. P' performs no MixColumns, no
        table access (the final test is an equality comparison against one constant, so
        A-3(ii) has no lookup to catch), and no bytewise arithmetic beyond the charged
        S-box and AddRoundKey operations.
        READER 1 (intensional half of A-2): P consumes MixColumns' output, so by A-2(i)
        MixColumns is independent, the bar fires, P is INADMISSIBLE / UNADJUDICABLE. P'
        is admissible and charges (N/S_k + X/X_k) AEU-k.
        READER 2 (the "that is" gloss of A-2): for P, an algorithm not performing
        MixColumns — namely P' — DOES compute what P computes. The gloss's condition
        fails, so MixColumns is NOT independent for P, and P is admissible too, at the
        same figure.
        SO A-2 GIVES THE SAME ATTACK TWO OPPOSITE VERDICTS OUT OF ITS OWN SINGLE
        SENTENCE. And under reader 2's reading the bar is not merely ambiguous but EMPTY:
        the pullback is available for every F_2-linear operation in the round function.
      why_this_is_worse_than_the_weakness_004_names: >-
        004's limitations block names the risk that "a submitter ... who declares a
        REQUIRED INTERMEDIATE RESULT TO BE A DISCARDED BY-PRODUCT can move the
        classification", and asks a red team to attack there. This session attacked there
        and found a WORSE case that requires NO dishonesty at all: attack P' is a
        complete, honest, fully A-4-compliant specification of the same attack, written
        in the pulled-back form from the start. There is nothing for a reviewer to catch,
        because there is nothing concealed. A-4's disclosure duty is therefore structurally
        incapable of covering this hole, and 004's own statement that A-4 "makes such a
        description checkable by a reviewer" is true of the case it names and false of this one.
      what_004_bought_and_what_it_sold: >-
        STATED PLAINLY, BECAUSE IT IS THE FINDING. Clause A-1 buys INVARIANCE UNDER
        IMPLEMENTATION TECHNIQUE, which is real and which does close AMB-5's T-table case.
        Clause A-2 then sells INVARIANCE UNDER SEMANTICS-PRESERVING REWRITING OF THE
        SPECIFICATION, which -003 never needed because -003 never located the test at the
        specification level. The ambiguity was not eliminated; it was moved from the
        implementation axis, where CM-1 had already declared it out of bounds, onto the
        specification-description axis, where nothing yet governs it. That is exactly the
        outcome the task card asked this session to test for, and it is present.
      repair_direction_offered_not_concluded: >-
        Two candidates, neither concluded here. (i) DELETE THE "that is ..." GLOSS and
        keep only the consumption test, making A-2 purely intensional — cheap, and it
        removes the internal split, but it leaves reader-2-style rewriting unaddressed.
        (ii) WORST-CASE-OVER-DESCRIPTIONS: rule that a Route 3 claim is INADMISSIBLE if
        ANY specification computing the same function with the same N and X triggers the
        bar, so the pullback rewriting cannot help a claimant. (ii) has a definite error
        direction (against the claimant), which is the only direction a rule of this kind
        may point, but it is harder to apply and its decidability is not established here.

    - id: OBJ-3
      joint: J1
      target: 004 the_change.item_2_gap_b_the_bundling_test, clause B-1's "FULL EVALUATION"
      severity: MEDIUM_HIGH
      title: >-
        B-1 SUPPLIES NO RULE FOR A DATA-DEPENDENT EARLY-ABORTED EVALUATION, WHICH IS
        NEITHER "A FULL EVALUATION" NOR ANY OF THE PARTIAL FORMS B-1 ENUMERATES. THE TWO
        READINGS DIFFER BY THE ENTIRE N-VERIFICATION TERM, IN THE DIRECTION OF A SMALLER
        TOTAL — THE EXACT DIRECTION 004's OWN LIMITATIONS BLOCK FLAGS AND DOES NOT CLOSE.
      mechanism: >-
        B-1's antecedent asks whether the charged production work "INCLUDE[S], FOR EACH
        CANDIDATE IN IT, A FULL EVALUATION OF AES-k ON A TARGET PLAINTEXT FROM THE
        ATTACK'S OWN ELEMENT (d) DATA UNDER THAT CANDIDATE KEY". Its disambiguating
        sentence enumerates what is NOT full: "one round, a truncated computation, an
        algebraic or statistical constraint check, a table match, a filter on a subset of
        the state". Every item in that list is a STATICALLY partial computation — the
        specification says to compute less. An EARLY-ABORTED evaluation is different in
        kind: the specification says COMPUTE THE WHOLE THING AND COMPARE, and the
        computation terminates early only on data, only on the overwhelming majority of
        candidates, at a point chosen by the implementation. B-1 does not say whether
        "includes a full evaluation" is a property of the SPECIFIED operation or of the
        EXPECTED WORK CHARGED. Both readings are available and they give opposite verdicts.
      worked_counterexample: >-
        ATTACK S (hypothetical, specification-level, asserted of no real cipher and of no
        round count). Element (d): at least one known pair (P1, C1). Production: for each
        of N candidate keys k_hat drawn from a precomputed structured pool, "EVALUATE
        AES-k(P1) UNDER k_hat AND COMPARE THE RESULT WITH C1; retain k_hat iff equal."
        Implementation, and the cost the submitter charges: the evaluation is interleaved
        with a stored partial-state match so that it ABORTS as soon as one intermediate
        byte disagrees with a stored value, which happens with probability 255/256 at the
        first checkpoint. Expected charged production work per candidate is therefore
        about 1/256 AEU-k, and the submitter charges about N/256 AEU-k in total.
        READER 1: the charged production work's SPECIFIED per-candidate operation IS a
        full evaluation of AES-k on an element (d) plaintext under that candidate key.
        B-1's antecedent is FALSE, so verification is BUNDLED and NO separate charge
        applies. Total: about N/256 AEU-k.
        READER 2: the work ACTUALLY CHARGED is a truncated computation, and B-1 says in
        terms that "A PARTIAL evaluation — one round, A TRUNCATED COMPUTATION ... IS NOT
        A FULL EVALUATION and DOES NOT bundle verification." B-1's antecedent is TRUE, so
        element (f)'s separate charge applies on all N. Total: about N/256 + N
        verification units, i.e. about N AEU-k.
        THE TWO CONFORMING READERS DIFFER BY A FACTOR OF ABOUT 256 ON THE SAME ATTACK,
        AND THE SUBMITTER'S READING IS THE CHEAPER ONE. B-4's mandatory disclosure asks
        the submitter to state "WHICH STAGE WAS FOUND TO CONTAIN — OR NOT TO CONTAIN — A
        FULL PER-CANDIDATE AES-k EVALUATION", a binary field that attack S cannot fill
        honestly in either value.
      does_it_break_the_definitional_reference: >-
        NO, AND THAT MATTERS. Applied to the m=0 definitional reference (pick the next
        key, encrypt, compare, stop at first match), attack S's construction is
        unavailable: the reference has no stored partial state to abort against and must
        finish the encryption before any ciphertext byte exists. The reference therefore
        still classifies as BUNDLED under both readings, and 004's
        `proves_too_much_check_m_equals_0_definitional_reference` remains PASSED. This
        counterexample is consequently a genuine uncovered case rather than a
        proves-too-much objection, and the check 004 did perform provably does not reach it.
      repair_direction_offered_not_concluded: >-
        Add one sentence to B-1: "An evaluation that the specification states as a full
        AES-k evaluation but whose CHARGED EXPECTED COST is less than one AEU-k does not
        bundle verification; bundling requires that the charged production cost be at
        least one AEU-k per candidate in the produced set." That ties the test to the
        charged number rather than to the sentence describing it, and its error direction
        is against the claimant. Not concluded here.

    - id: OBJ-4
      joint: J1
      target: 004 the_change.item_2_gap_b_the_bundling_test, clauses B-2 and B-3
      severity: MEDIUM
      title: >-
        B-2 LEVIES THE CHARGE ON "THE SURVIVORS OF THE LAST PRODUCTION STAGE THAT DOES NOT
        INCLUDE A FULL PER-CANDIDATE AES-k EVALUATION", AND NOTHING IN 004 INDIVIDUATES A
        STAGE. THE HYBRID GUESS-AND-DETERMINE ATTACK THAT AMB-6 NAMED IS STILL SPLIT — NOW
        ON STAGE BOUNDARIES INSTEAD OF ON "DISTINCT ACTS".
      mechanism: >-
        B-3 instructs a multi-stage pipeline to be "decomposed STAGE BY STAGE" and
        clause B-1's test to be applied "ONCE, at the boundary clause B-2 names". Both
        clauses presuppose that the stage decomposition is given. It is not. B-3's
        anti-abuse sentence forbids "RELABELLING its final full-evaluation pass as 'the
        candidate-generation mechanism'" — that is, it forbids a RENAMING of an existing
        separate pass. It does not reach a pipeline that has no separate pass to rename.
      worked_counterexample: >-
        ATTACK H (hypothetical, specification-level, asserted of no real cipher and of no
        round count), stated as ONE loop with no stage boundary anywhere in its text:
        "For each of the M candidate keys in the enumeration: evaluate the algebraic
        constraint T on the candidate; if T fails, discard and continue; if T holds,
        evaluate AES-k(P1) under the candidate and compare with C1, returning on a match."
        Let T hold with probability 2^-t, so about M*2^-t candidates reach the encryption.
        READER 1 (one stage): the produced candidate set is what the loop returns, and for
        every candidate in it the loop body performed a full AES-k evaluation on an
        element (d) plaintext under that candidate key. B-1's antecedent is FALSE →
        verification BUNDLED → no separate charge. Total = M constraint evaluations
        (charged under their own element) + about M*2^-t AEU-k.
        READER 2 (two stages, since the loop body plainly contains a filter and then a
        test): "the last production stage that does not include a full per-candidate
        AES-k evaluation" is the constraint filter; N = about M*2^-t survivors; the
        separate charge applies to them. Total = the same as reader 1 PLUS about M*2^-t
        verification units.
        The gap between the readers is EXACTLY the additive N_survivors term that
        RT-20260901-1af5d9's objection 2 identified as the unresolved quantity, and that
        004's AMB-6 states it is closing. The quantity is unchanged; only the word that
        fails to determine it has changed, from "distinct" to "stage".
      why_b3_does_not_close_it: >-
        Because B-3's prohibition is on RELABELLING, and attack H performs none: its full
        evaluation genuinely is inside its production loop and is described as such from
        the outset. A reviewer applying B-3's SPIRIT reaches reader 2; a submitter applying
        B-3's TEXT reaches reader 1 and has a defence. This is a weaker break than OBJ-3
        (an attentive reviewer will usually reach reader 2), which is why it is scored
        MEDIUM, but the mechanism is named and the split is real.
      repair_direction_offered_not_concluded: >-
        Define the stage boundary OPERATIONALLY rather than syntactically: "a stage
        boundary exists wherever the candidate count strictly decreases; the survivors at
        each such boundary are enumerated in the B-4 disclosure." Under that rule attack H
        has a boundary at the constraint filter regardless of how its loop is written, and
        reader 1 is unavailable. Not concluded here.

    - id: OBJ-5
      joint: J2
      target: 004 what_this_amendment_is_not, the element (d) clause, vs clause B-1's antecedent
      severity: LOW
      title: >-
        004 SAYS IT DOES NOT TOUCH ELEMENT (d)'s DATA RULE "BEYOND CITING" IT. IN FACT B-1
        MAKES MEMBERSHIP IN THE ELEMENT (d) DATA SET A PRECONDITION OF A COST
        CLASSIFICATION FOR THE FIRST TIME, AND B-4 DOES NOT REQUIRE THE SUBMITTER TO NAME
        WHICH ELEMENT (d) PLAINTEXT THE PRODUCTION STAGE EVALUATED.
      mechanism_and_worked_case: >-
        B-1's antecedent is quantified over "A TARGET PLAINTEXT FROM THE ATTACK'S OWN
        ELEMENT (d) DATA". Whether an attack bundles therefore now depends on the CONTENTS
        of its declared element (d) set, which -003's item_3 governs as a two-axis (kind,
        count) requirement. Worked case: an attack whose production stage evaluates AES-k
        on a plaintext it must CHOOSE cannot bundle unless that plaintext is inside its
        element (d) data — and putting it there strengthens the attack's data KIND from
        known to chosen, which under -003 item_3 forces the data coordinate to
        INCOMPARABLE. So a submitter now faces a live trade between the cost axis and the
        data axis that did not exist under -003, and B-4's disclosure list (stage
        decomposition, survivor counts, which stage contains a full evaluation) does not
        include the one field that would make the trade visible: WHICH element (d) datum
        the production evaluation used, and of what kind.
      what_this_is_and_is_not: >-
        This is NOT a reopening of item_3: item_3's (kind, count) rule is unchanged and
        this session found no reading of 004 that alters its verdicts. It is an
        UNDISCLOSED COUPLING plus a one-line disclosure gap. J2's mechanical check
        otherwise PASSES — see HELD-2.
      repair_direction_offered_not_concluded: >-
        Add to B-4: "and the identity and element (d) kind of the datum used in any
        production-stage evaluation relied on for bundling." One line, zero cost.

    - id: OBJ-6
      joint: J2
      target: 004 what_this_amendment_is_not, item "IT IS NOT A WIDENING OF ROUTE 3"
      severity: LOW
      title: >-
        THE NON-WIDENING CLAIM IS ARGUED FOR A-1..A-3 AND ASSERTED FOR THE WHOLE
        AMENDMENT, BUT A-4 AND B-4 ARE NARROWINGS THAT CREATE TWO NEW INADMISSIBILITY
        GROUNDS THE PACKAGE NOWHERE ACCOUNTS FOR.
      mechanism: >-
        The prose in the_change says "Clauses A-1 TO A-3 make an already-stated bar
        DECIDABLE; they admit no attack that -003's own specification-level reading did
        not already admit" — correctly scoped to A-1..A-3. The
        `what_this_amendment_is_not` bullet then generalises to "IT IS NOT A WIDENING OF
        ROUTE 3" without qualification, and no bullet anywhere states the converse fact:
        A-4 and B-4 each end "A [claim] omitting [the disclosure] is INADMISSIBLE under
        this model and its figure/number is not evidence." A claim that would have been
        admissible under -003 and that omits the new disclosures is inadmissible under
        004. That is a NARROWING, applied to future claims. It is harmless today because
        no Route 3 claim exists, and 004's non-retroactivity clause is explicit; but a
        record whose bookkeeping enumerates only the effects in one direction is
        under-describing itself, and this is precisely the kind of asymmetry a later
        reader would take at face value.
      repair_direction_offered_not_concluded: >-
        One bullet: "IT IS A NARROWING IN EXACTLY TWO PLACES — clauses A-4 and B-4 make a
        disclosure omission a new inadmissibility ground, prospectively only."

    - id: OBJ-7
      joint: J3
      target: c2-paired-validation-design-v2 seed_policy stream S2, and stopping_rules 2/2b
      severity: MEDIUM_HIGH
      title: >-
        v2 ADDS A TWO-LAYER RUN-TIME VERIFICATION FOR THE STREAM IT JUST FIXED (S1) AND
        NONE AT ALL FOR THE STREAM THAT CONSTITUTES THE NULL (S2). AN S2 IMPLEMENTATION
        FAULT SILENTLY REPLACES THE SPECIFIED NULL WITH A DIFFERENT NULL THAT STILL
        PASSES EVERY GATE AND EVERY INVALIDATION RULE.
      mechanism: >-
        DEFECT 1's repair makes state_0 byte-identical across arms by construction, and
        GATE-PAIRSYNC (Layer A exact comparison, Layer B streaming digest) verifies
        exactly that at run time. GATE-ROUND0 verifies h_0 against an independent
        recomputation from raw key bytes. Both are checks on S1. Stream S2 — the 2*R
        independent 128-bit replacement round keys that are the ENTIRE content of the
        structural null — is verified by nothing: no gate recomputes NULLRK_SUBSEED
        independently, no required artifact records any S2 value, and no invalidation
        rule references S2.
        Observe further that the DEFECT 1 fix makes GATE-ROUND0's ARM-NULL half
        DEGENERATE: since state_0 is now byte-identical across arms by construction and
        GATE-PAIRSYNC proves it, running GATE-ROUND0 on ARM-NULL is a byte-for-byte repeat
        of running it on ARM-REAL and carries zero information about S2. v2 carried
        GATE-ROUND0 forward "UNCHANGED FROM v1" without noting that its own fix hollowed
        out one of that gate's two arms.
      worked_counterexample: >-
        FAULT F (an ordinary implementation slip, not a contrivance): the executor derives
        the K-trajectory and K'-trajectory null round keys with the SAME sub-seed — for
        instance by writing NULLRK_SUBSEED once and re-instantiating random.Random(...)
        for the second trajectory instead of continuing the same nrng, which the design's
        own phrase "draw exactly 2*R independent 128-bit strings in this FIXED order"
        invites if read as two draws of R. Result: RKnull_K[r] == RKnull_Kprime[r] for
        every r.
        WHAT THE RUN THEN MEASURES: two trajectories that start from a byte-identical
        state_0 pair and are pushed through the SAME sequence of round keys — a
        common-round-key null, not the specified independent-round-key null. This is a
        DIFFERENT experiment with a different generating process.
        WHY NOTHING CATCHES IT: KAT passes (the real AES code path is untouched).
        GATE-ROUND0 passes (h_0 is computed from RK[0], which fault F does not touch).
        GATE-PAIRSYNC Layers A and B pass (K_i, K'_i, RK[0] and state_0 are byte-identical
        across arms — fault F is entirely downstream of every quantity either layer
        compares). ARM-ANCHOR passes (it uses S3, not S2). Two distinct states driven
        through the same round function still diffuse, so TVD_r(ARM-NULL) plausibly decays
        and CONVERGED(ARM-NULL) = TRUE, so invalidation rule 1b passes, rule 1a passes,
        rule 4 never fires, and success_criterion (b) is satisfied. THE RUN IS DECLARED
        INTERPRETABLE AND ITS NULL CONTROL IS NOT THE NULL CONTROL THE DESIGN SPECIFIES,
        WITH NO SIGNAL ANYWHERE IN THE ARTIFACT SET THAT THIS HAPPENED. That is the same
        failure class RT-20260901-1af5d9 established against v1 — "a future executor who
        follows the design would run a DIFFERENT experiment than the one the design
        describes" — reproduced one stream over.
      required_repair: see RC-4.

    - id: OBJ-8
      joint: J3
      target: c2-paired-validation-design-v2 invalidation rule 1b, the [5, R] window
      severity: MEDIUM
      title: >-
        THE CONVERGED WINDOW [5, R] IS CHOSEN FOR CROSS-ARM SYMMETRY WITH A FALSIFICATION
        THRESHOLD, NOT FROM ANY PROPERTY OF THE NULL OBJECT. IT MAKES A FOUR-ROUND
        ARM-NULL ANOMALY INVISIBLE TO EVERY BINDING RULE, AND v2 SAW THE CASE AND MADE THE
        ONLY CHECK THAT WOULD CATCH IT NON-BINDING.
      mechanism: >-
        1b defines CONVERGED(arm, key_size) over r in [5, R], and states its reason
        explicitly: "Using [5, R] therefore holds ARM-NULL to EXACTLY the test ARM-REAL
        already faces". But the [5, R] window was originally chosen as a FALSIFICATION
        margin — "materially past the predicted [2,4] convergence window, giving the naive
        prediction a comfortable margin before being judged falsified" — i.e. it is
        deliberately GENEROUS TO THE TREATMENT ARM. Transplanting a
        generous-to-the-treatment threshold onto the NULL control inverts its function: a
        null control's job is to demonstrate that the instrument nulls out, and holding it
        to a deliberately lenient bar is how a defective instrument passes. The design's
        own justification for expecting the null to converge — "no stated reason to deviate
        ... ONCE SEVERAL ROUNDS of SubBytes/MixColumns mixing have occurred" — supplies no
        number, and 5 does not come from it.
      worked_counterexample: >-
        Take AES-128 (R = 10) and a primary-tier tau. Suppose both arms report the
        identical series TVD_1..TVD_10 = 0.30, 0.28, 0.25, 0.20, tau, tau, tau, tau, tau,
        tau. Then: rule 1a passes for both arms (the series is monotone non-increasing, so
        TVD_{r+1} <= TVD_r + tau at every consecutive pair). CONVERGED(ARM-REAL) = TRUE and
        CONVERGED(ARM-NULL) = TRUE, since both are at-or-below tau for every r in [5, 10].
        Rule 4 does not fire. success_criterion (b) is satisfied. The outcome table routes
        to cell (i), A TRUE and B TRUE, which the design labels "CH-1 HOLDS".
        BUT THE NULL ARM SAT AT A LARGE, UNEXPLAINED EXCESS FOR FOUR CONSECUTIVE ROUNDS,
        in an arm whose round keys are independent uniform 128-bit strings and which
        therefore has no key-schedule structure available to explain a four-round
        excess at all. Nothing in the design requires that anomaly to be explained,
        reported as a flag, or even remarked on, and the run is reported as an
        interpretable CH-1 confirmation.
      what_v2_already_saw: >-
        1b states, "ALSO REPORTED, NON-BINDINGLY: whether TVD_4(arm) <= tau(N), so the
        stricter 'converged by round 4' reading the red team's own repair text suggested
        is visible in the reported data WITHOUT SILENTLY BECOMING THE DECISION RULE." The
        design therefore identified this exact case and deliberately declined to bind it,
        on the stated ground that changing a threshold would be "a third edit, outside this
        revision's scope". That is a defensible scope decision and an INDEFENSIBLE silence:
        the case is left uncovered and is not listed anywhere as an open item.
      required_repair: see RC-5.

  held_results:
    - id: HELD-1
      joint: J1
      what_was_attacked: >-
        The Gap B OVER-CORRECTION direction the task card names — whether B-1 now
        misclassifies a LEGITIMATELY DISTINCT two-stage attack as bundled, producing a
        total that is too SMALL.
      what_was_tried: >-
        Two constructions. (1) A sieve that uses AES-k(P1) under the candidate key as a
        bucket index, where P1 is in element (d): B-1 classifies it as bundled, which is
        CORRECT, because an attack that has computed AES-k(P1) already holds the value the
        comparison needs and the comparison is genuinely free. No over-correction.
        (2) The same sieve computing AES-k(P1) under a DERIVED key f(k_hat) != k_hat: B-1's
        "UNDER THAT CANDIDATE KEY" makes the antecedent TRUE, so the separate charge
        applies. Conservative, and correct.
      finding: >-
        NO BREAK FOUND IN THIS DIRECTION. B-1's error direction is, as 004 claims, against
        the claimant for statically-partial production work. The breaks this session did
        find (OBJ-3, OBJ-4) are in the OTHER direction and are not instances of
        over-correction.
    - id: HELD-2
      joint: J2
      what_was_attacked: >-
        Whether 004 reopens, re-scores or perturbs -003's item_3 (two-axis data
        sub-lattice), item_4 (separate distinguisher axis) or item_5.
      what_was_tried: >-
        (a) MECHANICAL: `git diff` of protocol-amendment-GOAL-AES-002-003.yaml between the
        commit that introduced it (df9f89135) and the snapshot under review (ee80ce45)
        returns EMPTY — -003's committed bytes are genuinely unedited, as 004 claims.
        (b) TEXTUAL: read every clause of 004's the_change looking for a side effect on
        item_3's (kind, count) verdicts and on item_4's separate-axis rule. Clause B-2
        cites element (d)'s relation_to_R1 for the meaning of "bundled" and changes no
        (kind, count) verdict. Clause A-4's disclosure duty extends to a
        distinguisher-to-key-recovery construction once specified, which is item_4's own
        stated consequence, not a change to it.
      finding: >-
        NO REOPENING FOUND at the level 004 denies one. The two blocks that survived round
        one are untouched by any clause here. What WAS found is one undisclosed coupling
        into element (d) (OBJ-5) and one under-described narrowing (OBJ-6), neither of
        which changes an item_3 or item_4 verdict.
    - id: HELD-3
      joint: J3
      what_was_attacked: >-
        Whether v2's purpose-indexed draw order still fails to give byte-identical state_0
        across arms.
      what_was_tried: >-
        Traced the construction: S1 is indexed by (key_size, tier, i) with `arm` absent, so
        both arms read the same K_i and K'_i; both derive RK[0] through the same real
        FIPS-197 KeyExpansion; the plaintext P is fixed and identical across arms
        (inputs.fixed_plaintext_P, carried forward from v1 and confirmed present in the v1
        record); so state_0 = AddRoundKey(P, RK[0]) is identical. Then searched for a
        stream the design NEEDS but does not DECLARE, since the policy says "FOUR DECLARED
        STREAMS, and no others": checked specifically whether any per-sample plaintext
        randomness is required, which would have to be improvised by an executor and would
        reintroduce the defect. It is not — P is fixed, so no fifth stream is needed.
      finding: >-
        DEFECT 1's REPAIR HOLDS AS CONSTRUCTED. No case was found in which the v2 draw
        order fails to give byte-identical state_0, and the indexed-sub-seed form is
        strictly better than the sequential single stream the predecessor proposed, for the
        three reasons v2 states (resumability, truncation, and making GATE-PAIRSYNC a
        genuine equality test rather than a tautology about a shared in-memory object).
        This session accepts that reasoning. The new hole (OBJ-7) is not in this repair; it
        is in the asymmetry between what the repair verifies and what it leaves unverified.
    - id: HELD-4
      joint: J1
      what_was_attacked: >-
        Whether a "table whose entries are computed on the fly" (a case the task card
        names) escapes clause A-3(ii).
      what_was_tried: >-
        Constructed an attack that specifies a difference-table lookup and then declares
        the table's entries to be computed at use time from already-charged S-box outputs,
        hoping to convert "a table access outside the S-box route" into "an S-box
        application already counted in N".
      finding: >-
        NO BREAK. A-3(ii)'s "IF AND ONLY IF it realises an S-box application ALREADY
        COUNTED IN N, AT MOST ONE SUCH APPLICATION PER ACCESS" is tight: computing the
        entry on the fly means the attack performs whatever operations the entry's
        definition requires, and those operations are then themselves subject to A-2 —
        either they are S-box applications (chargeable in N) or they are other bytewise
        operations (independent, bar fires). The one-application-per-access cap forecloses
        the amortisation move. This clause is the strongest text in the amendment.

  required_controls:
    - id: RC-1
      binds: OBJ-2 (highest priority)
      control: >-
        A SPECIFICATION-REWRITING INVARIANCE CHECK, run on paper, zero compute, before any
        further amendment is authored. Take the amended Route 3 text and one hypothetical
        attack that consumes a linear-layer output. Apply the pullback rewriting (replace
        "compute L(a); test m in S" with "test a in L^{-1}(S)", for L the invertible
        F_2-linear map). If the verdict changes, A-2 is not well-defined. This is the
        A-clause analogue of the proves-too-much check 004 already performs for B-1, and
        the amendment performs no such check for A-2.
      cost: zero compute, one page.
    - id: RC-2
      binds: OBJ-1
      control: >-
        Restate A-2 and A-3 with an explicit PRECEDENCE SENTENCE, in the same form B-1
        already uses ("where they could be read to differ, X GOVERNS"), and extend
        A-3(i)'s antecedent to cover element (d) input bytes the attack has received, or
        state in terms that relabelling un-charged input bytes triggers the bar.
      cost: zero compute.
    - id: RC-3
      binds: OBJ-3, OBJ-4
      control: >-
        Bind B-1's "full evaluation" to the CHARGED EXPECTED COST rather than to the
        specification's sentence (at least one AEU-k per candidate in the produced set),
        and individuate a stage OPERATIONALLY as any point where the candidate count
        strictly decreases. Then re-run 004's own
        proves_too_much_check_m_equals_0_definitional_reference against BOTH revised
        clauses — the reference must still classify as BUNDLED, or the repair is worse
        than the defect.
      cost: zero compute.
    - id: RC-4
      binds: OBJ-7
      control: >-
        GATE-NULLSTREAM, exactly parallel to GATE-PAIRSYNC and at the same negligible cost.
        (a) For every sample at the GATE-PAIRSYNC Layer A indices, ARM-NULL records and
        publishes the first and last of its 2*R null round keys and ASSERTS
        RKnull_K[r] != RKnull_Kprime[r] for every r in [1, R]. (b) ARM-NULL maintains a
        Layer-B-style streaming SHA-256 accumulator over
        (i, RKnull_K[1..R], RKnull_Kprime[1..R]) for EVERY sample, finalised per key size
        and tier, and a verifier independently recomputes the same digest from
        NULLRK_SUBSEED alone, with no access to the run. Any inequality HALTS the run and
        is recorded as `invalid_measurement`, an infrastructure signal per AGENTS.md rule
        5, never as evidence about AES. Note also that GATE-ROUND0's ARM-NULL half is now
        degenerate and should be recorded as such rather than carried forward as if it
        still tested two arms.
      cost: one hash update per sample, O(1) memory; negligible against a full AES encryption.
    - id: RC-5
      binds: OBJ-8
      control: >-
        EITHER make the TVD_4(ARM-NULL) <= tau(N) report BINDING for the NULL ARM ONLY —
        the treatment arm keeps its generous [5, R] margin, the control does not, and the
        asymmetry is stated as deliberate — OR state a round number derived from the null
        object's own generating process rather than borrowed from a falsification margin.
        If neither is adopted, the case must be entered in the design's own open-items list
        rather than left in a non-binding sentence.
      cost: zero compute; it is a re-reading of the TVD table the metrics block already requires.
    - id: RC-6
      binds: J4 — the cheapest falsification control the package still omits
      control: >-
        A PRE-REGISTERED BLIND ADJUDICATION PANEL FOR THE RULE TEXT. The amendment's
        operative claim is not about AES; it is "two conforming readers reach the same
        verdict." THAT CLAIM HAS NEVER ONCE BEEN MEASURED. Every round to date has
        established its failure by a single reader inventing a case after the fact, which
        is a fatigue report about the reader, not a measurement of the rule. Procedure:
        FREEZE a panel of 8-10 hypothetical attack specifications BEFORE the next
        amendment is authored, committed at a declared path with a content hash, spanning
        the shapes already known to be load-bearing (fused/unfused implementations,
        required vs discarded linear-layer results, pullback-rewritten pairs, on-the-fly
        tables, early-aborted evaluations, single-loop hybrids, and at least two shapes the
        current text handles correctly so the panel can produce a pass). Then have a
        reader classify all of them against the amended text WITHOUT having seen the
        amendment's own worked examples, and publish the verdict table. THE PARAMETER THAT
        SHOULD DESTROY THE SIGNAL: as the panel grows and is fixed in advance, the
        disagreement rate should FALL toward zero if the rule is genuinely determinate; if
        it stays flat at whatever the author's hand-picked examples showed, that is the
        artifact tell of docs/inventor-protocol.md section 3 and the rule is not
        determinate. THE NULL-OBJECT CONTROL for this: run the same panel against -003's
        SUPERSEDED text. If the disagreement rate is the same for -003 and -004, then -004
        bought nothing and the improvement seen so far is a property of who wrote the
        examples, not of the text. UNDER THE CORRELATED-PAIR LIMITATION a second reader of
        the same model family is one draw, not two, and must be reported as such; but even
        a SINGLE reader against a PRE-FROZEN panel removes the selection effect that
        currently dominates — the author choosing the examples the rule handles.
      cost: zero compute; one task card and one frozen panel file.
      why_this_is_the_cheapest: >-
        It is the only proposed control that tests the amendment's ACTUAL claim rather than
        an author's belief about it, it needs no implementation, no benchmark and no
        cryptanalysis, and it would have caught all four of the breaks recorded across the
        two red-team rounds so far — including the two in this report — before they were
        committed.

  counterexample_or_mutation:
    cheapest_discriminating_mutation: >-
      For OBJ-2, the single cheapest discriminator: write attack P and attack P' side by
      side on one page and ask any conforming reader to classify BOTH. They compute the
      same function with the same N and X. If the two receive different verdicts, A-2 is
      not invariant under semantics-preserving rewriting, which is the property A-1 promises
      on the neighbouring axis. Cost: one page, zero compute.

  baseline_comparison:
    performed: false
    reason: >-
      SC-6 BINDS AND IS OBSERVED. No comparison against the published state of the art was
      made in either direction, no recalled literature figure was cited as authority
      (SC-5), and no cryptanalytic baseline (Pollard-rho, BSGS, biclique, or any other) is
      named or relied on anywhere in this report. The artifacts under review make no cost
      claim and no margin, so there is nothing to compare: they are rule text and a
      measurement design.
    dominated_by: null
    dominated_by_note: >-
      NULL BECAUSE NO MARGIN IS STATED ANYWHERE IN THIS REPORT, which is the SC-4/SC-7
      precondition for the R5 clause. This report states no cost figure, no speedup, no
      advantage and no comparison. Were any margin stated here, SC-4 would require
      dominated_by to carry exactly the string "unresolvable in this environment: no
      primary source reachable; every recalled frontier row is unverified-from-memory".
      This is a scope statement, not an unchecked null under AGENTS rule 5.

  heuristic_challenges:
    - >-
      004's clause A-1 ASSUMES, and does not confirm, that CM-1's S_k (200/224/276) and
      X_k (176/208/240) are correct counts of the specification's own structure. 004
      discloses this itself as OU-4 and points at O-CM1-4. This session ALSO did not
      confirm them — no instrumented count was performed here — and records that as OPEN
      AND UNATTEMPTED, not as checked.
    - >-
      c2-v2 carries forward CH-1 at explicitly REDUCED confidence with no spectral-gap
      bound proven or cited. That disclosure is intact in v2 and this session found no
      erosion of it. Not an objection; recorded so silence is not read as endorsement of
      CH-1 in either direction.
    - >-
      v2's seed_policy asserts stream separation via distinct SHA-256 purpose tags and
      states explicitly that "NOTHING HERE IS A CRYPTOGRAPHIC CLAIM AND NONE IS NEEDED",
      routing PRNG adequacy to GATE-ROUND0. This session accepts that routing for S1,
      whose statistic GATE-ROUND0 directly tests, and REJECTS it for S2, whose adequacy no
      gate tests at all — see OBJ-7.

  cost_model_challenges:
    - >-
      OBJ-3 IS A COST-MODEL OBJECTION IN SUBSTANCE: the two readings of B-1 differ by the
      full N-verification term, about a factor of 256 in the worked case, in the direction
      that favours the claimant. 004's limitations block names this direction and does not
      close it.
    - >-
      NO PER-ENTRY CONSTANT, o(1) OVERHEAD OR MEMORY TERM IS CHALLENGED HERE, because none
      is claimed: 004 charges no cost and c2-v2 states costs only for its own instrument
      (one hash update per sample, O(1) memory), which this session did not re-derive and
      does not certify.

  reduction_and_scope_challenges:
    - >-
      NO CORROLARY-VIA-CITED-REDUCTION appears in either artifact, so there is no
      instantiation to check.
    - >-
      SCOPE INFLATION CHECK: neither artifact asserts anything about AES at any round
      count, and both state so explicitly. This session found no inflated scheme scope and
      no assertion above the SPECIFICATION-RESULT ceiling in either artifact.
    - >-
      CLOSURE CHALLENGE, PER THE ROLE CONTRACT. 004's `open_and_unattempted` block (OU-1
      through OU-4) is genuine forward guidance with named obstructions and is NOT a
      fatigue report; this session found no closure in it that overstates what was
      established. Specifically, OU-3's disclaimer that the C2 defects are named "so that
      no reader infers from this amendment's silence that they were considered and
      dismissed" is the correct discipline and is here endorsed.

  proof_architecture_challenges:
    - >-
      THE STRUCTURAL ASYMMETRY THAT PRODUCED OBJ-2. 004 performs a
      proves-too-much/nearby-object check on clause B-1 (against the m=0 definitional
      reference), records a REJECTED DRAFT (B-0) with its diagnosed defect, and thereby
      demonstrates it knows how to falsify its own rule text before shipping it. It
      performs NO analogous check on clauses A-1 to A-4: no rejected A-draft is recorded,
      no reference object is run through A-2, and the only adversarial pressure on the A
      block is the argument for rejecting the predecessor's candidate rule — which tests
      SOMEONE ELSE'S text, not its own. Two of this report's three J1 breaks are in the
      A block. The check the amendment already knows how to run is the check it did not run
      where it was most needed.

  narrowest_supported_statement: >-
    SCOPED EXACTLY, AND NO FURTHER. At snapshot ee80ce45691a791638a614c441d0904775cea142,
    protocol-amendment-GOAL-AES-002-004's Gap A resolving text admits at least two
    constructions on which two readers conforming to its own clauses reach opposite
    verdicts (a required relabelling of un-charged element (d) input bytes, OBJ-1; and a
    semantics-preserving pullback rewriting of a linear-layer consumption, OBJ-2), and its
    Gap B resolving text admits at least two more (a data-dependent early-aborted
    evaluation, OBJ-3; and a single-loop hybrid with no syntactic stage boundary, OBJ-4).
    Its supersession is otherwise confined as it claims: -003's committed bytes are
    verifiably unedited and its item_3 and item_4 verdicts are unperturbed (HELD-2).
    c2-paired-validation-design-v2's byte-identical-state_0 repair holds as constructed
    (HELD-3) but verifies only the stream it fixed, leaving the ARM-NULL round-key stream
    S2 unverified by any gate, so a specific ordinary implementation fault silently
    substitutes a different null control and passes every check in the design (OBJ-7); and
    its CONVERGED window is borrowed from a falsification margin rather than derived from
    the null object, leaving a four-round null-arm anomaly invisible to every binding rule
    (OBJ-8).
    THIS IS A SPECIFICATION RESULT AND NOTHING MORE. It asserts nothing about AES at any
    round count, states no cost, no margin and no comparison against any state of the art,
    and it does not establish that the amendment's text is unrepairable — only that these
    specific readings are open in it as committed. Each objection is scoped to the exact
    clause and construction named; none generalises to an impossibility claim about the
    approach.

  next_concrete_action: >-
    ONE ACTION. Before authoring protocol-amendment-GOAL-AES-002-005, freeze the RC-6
    adjudication panel: commit 8-10 hypothetical attack specifications (including attack Q
    of OBJ-1, the P/P' pair of OBJ-2, attack S of OBJ-3, and attack H of OBJ-4) at a
    declared path with a content hash, THEN write the amendment against the frozen panel,
    THEN publish the verdict table for -003's superseded text and -004's text side by side
    as the null-object control. Authoring the next amendment first and the panel afterwards
    reproduces the selection effect that has now produced two rounds of post-hoc breaks.

