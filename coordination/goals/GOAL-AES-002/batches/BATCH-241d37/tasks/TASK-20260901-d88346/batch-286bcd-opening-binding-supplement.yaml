standalone_receipt_note: 'The standalone file archives/TASK-20260901-d10bc6/snapshot-receipt.json DOES
  enumerate all 21 non-self opening paths, and every one of its declared hashes matches this task''s independent
  computation. But the validator''s finding is about the DISPATCHER-AUTHORITATIVE binding in dispatch_queue.json''s
  archive block, which lists only 3 paths and is what tools/research_dispatch.py machine-verifies. The
  standalone receipt''s own text calls the queue block the authoritative binding. The gap is therefore
  real: 20 paths were described in a prose-adjacent receipt but never machine-checked.'
receipt_commit_sha_discrepancy_observed:
  observation: The standalone receipt's `commit_sha` field reads 2c1aebf21ecfa403c65a2a01be41e43474fe2bdc,
    while dispatch_queue.json's archive block for the same task reads a2073bbbfdcb4057ffa2033df2a01ef603087dcc.
    Both are real commits with the same parent (6223df070) and the same subject line; a2073bbb IS an ancestor
    of HEAD and 2c1aebf2 is NOT.
  assessment: 'Consistent with the receipt''s own disclosed self-reference/amend limitation: 2c1aebf2
    is the pre-amend commit, superseded and unreachable from HEAD. Content binding is unaffected -- the
    receipt blob''s sha256 at a2073bbb and at HEAD are both 46ba5f6d5abc9680d81041b243a462e4bc741aad2b604036ed0652db6d38a378,
    matching the queue block''s declared value.'
  raised_as: OBSERVATION recorded for the Coordinator, not a new finding of this task and not in this
    task's assigned scope.
  in_scope_for_this_task: false
hash_method: sha256 of the raw blob bytes as produced by `git show <rev>:<path>`, computed in-process
