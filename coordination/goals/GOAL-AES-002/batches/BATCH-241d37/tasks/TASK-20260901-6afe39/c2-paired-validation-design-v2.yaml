    wall_clock_seconds_per_run: 1600
    total_cpu_hours: 1.0
    maximum_memory_gb: 2
    maximum_runs: 3
    maximum_workers: null

  stopping_rules:
    - >-
      1. FINAL-CIPHERTEXT KAT PRE-CHECK. UNCHANGED FROM v1. Before any
      sampling, the instrumented implementation must reproduce standard
      FIPS-197 known-answer vectors EXACTLY for AES-128/192/256,
      cross-checked against the openssl CLI and, if importable,
      pycryptodome. FAILURE HALTS the run; record as infrastructure signal /
      `invalid_measurement` per AGENTS.md rule 5, never as evidence about
      AES.
    - >-
      2. GATE-ROUND0. UNCHANGED FROM v1. On the first 1000 pilot-tier
      samples, h_0 (as computed by the instrumented state-tracking code path)
      must equal HammingWeight(RK[0](K) XOR RK[0](K')) computed
      INDEPENDENTLY from the raw key bytes (bypassing the round-function code
      path), for BOTH ARM-REAL and ARM-NULL, in EVERY sample. Any mismatch
      HALTS the run; `invalid_measurement`, an implementation defect, never
      evidence.
    - >-
      2b. GATE-PAIRSYNC - THE RUN-TIME CHECK THAT THE TWO ARMS ACTUALLY SHARE
      state_0. ADDED BY v2 AS THE OPERATIONAL HALF OF DEFECT 1'S RESOLUTION.
      The v2 seed policy makes byte-identical state_0 true BY CONSTRUCTION,
      but a design must not rely on its own construction being implemented
      correctly, so the executor VERIFIES it at run time, in two layers.
      LAYER A - FAIL-FAST EXACT COMPARISON. For every sample index i in
      0..999 of the pilot tier, and for i in {0, 1, 2} plus every i with
      i mod 4096 == 0 plus the FINAL achieved index at the primary tier, each
      arm records, from its OWN independently executed pipeline (not from a
      shared in-memory object): K_i, K'_i, RK[0](K_i), RK[0](K'_i), and the
      16 bytes of state_0. REQUIRED: byte-equality of ALL FIVE quantities
      between ARM-REAL and ARM-NULL at the same i. Note that comparing
      state_0 BYTES is required and comparing h_0 is NOT sufficient: h_0 is a
      Hamming weight, a lossy projection, and two different state_0 pairs can
      share one.
      LAYER B - COMPLETE-COVERAGE STREAMING DIGEST. Each arm maintains an
      incremental SHA-256 accumulator over EVERY sample it processes, updated
      as digest.update(i.to_bytes(8,"big") + K_i + K'_i + state_0_i) in
      ascending i, and finalises it at end of run (O(1) memory, one hash
      update per sample, negligible against a full AES encryption). REQUIRED:
      the ARM-REAL accumulator's final hex digest EQUALS the ARM-NULL
      accumulator's, per key size and tier, over the SAME achieved sample
      range. This closes the gap Layer A leaves - Layer A samples, Layer B
      covers every sample - and it is what makes the two arms verifiable
      against each other even when they are run as separate processes.
      DISPOSITION ON FAILURE: ANY Layer A mismatch or Layer B digest
      inequality HALTS that key size's run immediately. It is recorded as
      `invalid_measurement`, an INFRASTRUCTURE/IMPLEMENTATION signal per
      AGENTS.md rule 5, and NEVER as mathematical evidence about AES in
      either direction. Both layers' outputs are required artifacts (see
      required_artifacts). ORDERING: 2b runs concurrently with the pilot tier
      and must have passed on all 1000 pilot indices before primary-tier
      sampling begins.
    - >-
      3. ARM-ANCHOR SENSITIVITY GATE. UNCHANGED FROM v1. All 120
      deterministic checks (delta_low and delta_high, 20 K-draws each, x3 key
      sizes) must return h_1 EXACTLY equal to the declared delta's Hamming
      weight (1 or 64 respectively). Any mismatch HALTS the run;
      `invalid_measurement`, and per invalidation_rules item 2 below,
      retroactively invalidates any already-collected primary-tier data for
      that key size, because this gate is REQUIRED to run strictly before
      pilot/primary sampling, never after.
    - >-
      4. MANDATORY PILOT-BASED RECALIBRATION. UNCHANGED FROM v1. After the
      pilot tier completes with gates 1-3 (and now 2b) passed, measure the
      ACTUAL observed wall-clock cost per sample of the full instrumented
      pipeline. Re-derive the primary tier's expected wall-clock from this
      MEASURED throughput. If the re-derived estimate exceeds
      wall_clock_seconds_per_run, REDUCE N_primary to the largest power of
      two that fits under the measured throughput, record the reduction and
      its measured basis, and proceed at the reduced N - never silently
      proceed past a measured overrun, and never extrapolate past a measured
      shortfall.
    - >-
      5. PRIMARY-RUN WALL-CLOCK BUDGET STOP. UNCHANGED FROM v1 IN SUBSTANCE,
      with one consequence of the v2 seed policy made explicit. If a
      primary-tier run exceeds wall_clock_seconds_per_run before completing
      all rounds for all N samples, STOP at the current sample count, record
      the ACHIEVED N (never the target N), and report every statistic at the
      achieved N, explicitly flagged as reduced-from-preregistered N. MADE
      EXPLICIT BY v2: because stream S1 is indexed by sample index rather
      than consumed sequentially per arm, a truncation at achieved N leaves
      both arms holding the SAME prefix {0..N_achieved-1} of key pairs, so a
      truncated run remains a paired comparison rather than degrading into
      two differently-truncated independent samples.
    - >-
      6. PER-KEY-SIZE INDEPENDENCE. UNCHANGED FROM v1. Each of the three key
      sizes is its own independent stopping/decision unit; a halt or failure
      in one key size's run does not invalidate or block the other two.

  invalidation_rules:
    - >-
      1a. THE ROUND-TO-ROUND JUMP / RE-EMERGENCE CHECK. THIS IS v1's ITEM 1,
      CARRIED FORWARD UNCHANGED IN SUBSTANCE AND RENAMED TO WHAT IT ACTUALLY
      TESTS. For BOTH ARM-REAL and ARM-NULL, independently, at each key size:
      TVD_{r+1}(arm) must not exceed TVD_r(arm) + tau(N) for any consecutive
      round pair r, r+1 in [1, R] (the "+tau(N)" term tolerates genuine
      finite-sample noise in the TVD_r ESTIMATE itself, distinct from
      tau(N)'s use as the convergence threshold). ANY violation - a jump in
      excess-over-null exceeding one calibration-null-threshold's worth of
      sampling noise - INVALIDATES the interpretation of that arm's series at
      that key size as evidence about convergence or its absence. It is
      recorded and reported as an artifact tell, and the run's result for
      that (arm, key_size) is reported as UNINTERPRETABLE pending instrument
      investigation, NEVER as a null-convergence finding and NEVER as a
      structure-retention finding. PRECEDENCE: a 1a violation DOMINATES the
      falsification_criterion's outcome table below - if 1a fires for either
      arm at a key size, that key size is reported UNINTERPRETABLE and the
      (A,B) outcome routing is NOT applied to it.
      WHAT 1a IS NOT, STATED SO IT IS NEVER AGAIN READ AS MORE THAN IT IS
      (this is the RT-20260901-1af5d9 objection 6 disclosure): 1a is a JUMP
      detector. A FLAT, persistently-elevated, never-increasing TVD series -
      e.g. one sitting at 0.30 for every r = 1..R while tau(N) is far below
      0.30 - PASSES 1a cleanly at every consecutive pair, because
      TVD_{r+1} = TVD_r <= TVD_r + tau(N) holds trivially. v1 labelled this
      rule "THE ROUND-COUNT DECAY CHECK" and called it the design's central
      invalidation rule, which overstated what its wording tests. It is not
      deleted, because catching a re-emergence is a real and separate duty;
      it is renamed, and the missing duty is now discharged by 1b.
    - >-
      1b. THE CONVERGENCE-ATTAINMENT CHECK. NEW IN v2. THIS, NOT 1a, IS THE
      "did this series ever actually decay and stay decayed" test.
      DEFINITION, computed per arm per key size entirely from the TVD_r table
      the metrics block already requires: CONVERGED(arm, key_size) := TRUE if
      and only if TVD_r(arm, key_size) <= tau(N_achieved) for EVERY round r
      with 5 <= r <= R; FALSE otherwise.
      WHY THE WINDOW IS [5, R] AND NOT [4, R]. The window is taken from the
      one falsification_criterion ALREADY applies to ARM-REAL - v1's
      criterion is stated at "some round r* with 5 <= r* <= R (materially
      past the predicted [2,4] convergence window, giving the naive
      prediction a comfortable margin before being judged falsified)". Using
      [5, R] therefore holds ARM-NULL to EXACTLY the test ARM-REAL already
      faces, which is what this task's card requires, and changes NO decision
      threshold anywhere in the design - altering the threshold would be a
      third edit, outside this revision's scope. ALSO REPORTED, NON-BINDINGLY:
      whether TVD_4(arm) <= tau(N), so the stricter "converged by round 4"
      reading the red team's own repair text suggested is visible in the
      reported data without silently becoming the decision rule.
      A FLAT ELEVATED SERIES HAS CONVERGED = FALSE, which is precisely the
      case 1a cannot see. Note also, explicitly, that CONVERGED is NOT
      implied by the existence of the metric r* (first-crossing round): a
      series may cross below tau(N) at r* = 3 and rise back above it at
      r = 7, giving a defined r* and CONVERGED = FALSE. Both are reported.
    - >-
      2. ARM-ANCHOR ORDERING REQUIREMENT. UNCHANGED FROM v1 (it was v1's item
      2). Stopping rule 3 (the sensitivity gate) MUST run strictly BEFORE
      pilot and primary sampling for a given key size, never after or
      concurrently with it. If this design's own procedure is deviated from,
      ALL primary-tier data collected before the anchor check passed is
      retroactively INVALID and must be re-collected, because the anchor's
      purpose - confirming the pipeline has ANY sensitivity before trusting a
      "converged" reading - cannot certify data gathered before it ran.
    - >-
      3. KAT RE-FAILURE. UNCHANGED FROM v1 (it was v1's item 3). A KAT
      failure discovered at ANY later point invalidates ALL data collected
      under that implementation version, back to and including the pilot
      tier.
    - >-
      4. ARM-NULL FAILURE TO CONVERGE IS AN INSTRUMENT FLAG, NOT AN AES
      FINDING. REWRITTEN IN v2; v1's item 4 is quoted verbatim in
      `defect_2_v1_verbatim_text_being_replaced` below. TRIGGER, STATED
      SO THAT NO FAILURE SHAPE ESCAPES IT: CONVERGED(ARM-NULL, key_size) ==
      FALSE, as defined in 1b - that is, ANY failure of ARM-NULL to reach and
      remain at-or-below tau(N) for every round in [5, R] - REGARDLESS of
      whether the failure manifests as a jump (which 1a would also catch), a
      FLAT PERSISTENTLY-ELEVATED PLATEAU (which 1a would not), a slow drift, a
      single late re-emergence, or a failure to ever descend at all; and
      REGARDLESS of what ARM-REAL does at the same key size.
      DISPOSITION: the (arm=ARM-NULL, key_size) series and, with it, the
      ENTIRE key size's result are reported as a MEASUREMENT-PIPELINE DEFECT
      requiring investigation BEFORE any claim is drawn from ARM-REAL under
      the same pipeline. The structural null's generating process -
      independent uniform round keys through the unmodified AES round
      function - has no stated reason to deviate from Binomial(128,1/2) once
      several rounds of SubBytes/MixColumns mixing have occurred, so a
      persistent deviation in it indicts the instrument, per
      docs/inventor-protocol.md section 3 ("run the identical measurement
      against a null object... if the numbers match, record a controlled
      null, not a finding" - extended here to "if the null object itself
      fails to null out, the pipeline, not AES, is the subject").
      ROUTING, WHICH v1 LEFT INCOMPLETE: this trigger routes to
      falsification_criterion outcome (iii) when ARM-REAL also fails to
      converge, and to falsification_criterion outcome (iv) - NEW IN v2 -
      when ARM-REAL converges normally and ARM-NULL alone fails. Both
      outcomes are UNINTERPRETABLE-with-instrument-flag; neither is ever
      reported as evidence for or against CH-1. There is no longer any
      combination of arm behaviours that this rule fails to name.

  success_criterion: >-
    UNCHANGED FROM v1 IN SUBSTANCE, with clause (b) updated to cite the two
    renumbered invalidation rules and the new gate. The MEASUREMENT PIPELINE
    succeeds - produces an INTERPRETABLE result, independent of which way that
    result comes out - iff: (a) the final-ciphertext KAT pre-check,
    GATE-ROUND0, GATE-PAIRSYNC (stopping rule 2b) and the ARM-ANCHOR
    sensitivity gate all pass, in the required order; (b) neither ARM-REAL nor
    ARM-NULL triggers invalidation rule 1a at any key size, AND
    CONVERGED(ARM-NULL, key_size) is TRUE per invalidation rule 1b at that
    key size (a failed null control means the pipeline, not AES, is the
    subject, so the run is not interpretable as evidence about CH-1); (c) the
    achieved sample size at the primary tier, per key size, is at least the
    pilot-tier N=2^12. MEETING THIS BAR IS A CLAIM ABOUT MEASUREMENT
    VALIDITY, NOT ABOUT AES: it states the run is interpretable, not that
    CH-1 or its negation was confirmed.

  defect_2_v1_verbatim_text_being_replaced:
    v1_invalidation_rules_item_1: |-
      - >-
        THE ROUND-COUNT DECAY CHECK (this design's central, task-card-required
        invalidation rule, per docs/inventor-protocol.md section 3's canonical
        artifact tell). For BOTH ARM-REAL and ARM-NULL, independently, at each
        key size: TVD_{r+1}(arm) must not exceed TVD_r(arm) + tau(N) for any
        consecutive round pair r, r+1 in [1, R] (the "+tau(N)" term tolerates
        genuine finite-sample noise in the TVD_r ESTIMATE itself, distinct
        from tau(N)'s use as the convergence threshold). ANY violation — a
        jump in excess-over-null exceeding one calibration-null-threshold's
        worth of sampling noise — INVALIDATES the interpretation of that
        arm's series at that key size as evidence about convergence or its
        absence. It is recorded and reported as the canonical artifact tell
        (docs/inventor-protocol.md section 3: "an excess that stays constant
        [or reappears] across rounds is instead the signature of an
        artifact"), and the run's result for that (arm, key_size) is reported
        as UNINTERPRETABLE pending instrument investigation, NEVER as a
        null-convergence finding and NEVER as a structure-retention finding.
    v1_invalidation_rules_item_4: |-
      - >-
        ARM-NULL PERSISTENT EXCESS IS AN INSTRUMENT FLAG, NOT AN AES FINDING.
        If ARM-NULL's OWN TVD_r series fails the round-count decay check (a
        persistent, non-decaying excess in the STRUCTURAL null, whose true
        generating process — independent uniform round keys through the
        unmodified AES round function — has no stated reason to deviate from
        Binomial(128,1/2) once several rounds of SubBytes/MixColumns mixing
        have occurred), this is reported as a MEASUREMENT-PIPELINE DEFECT
        requiring investigation BEFORE any claim is drawn from ARM-REAL under
        the same pipeline, per docs/inventor-protocol.md section 3 ("run the
        identical measurement against a null object... if the numbers match,
        record a controlled null, not a finding" — extended here to "if the
        null object itself fails to null out, the pipeline, not AES, is the
        subject").
    v1_falsification_criterion: |-
      falsification_criterion: >-
        The preregistered prediction (CH-1: data-path convergence to
        Binomial(128,1/2) by round ~2-4, sustained through the full round
        count) is FALSIFIED, for a given key size, if: at some round r* with
        5 <= r* <= R (materially past the predicted [2,4] convergence window,
        giving the naive prediction a comfortable margin before being judged
        falsified), TVD_{r*}(ARM-REAL) > tau(N) WHILE, AT THE SAME ROUND r* AND
        KEY SIZE, TVD_{r*}(ARM-NULL) <= tau(N). This is a DIFFERENTIAL
        condition, and it is the design's actual discriminator among THREE
        possible outcomes, stated so each is defined before any data exists:
        (i) CH-1 HOLDS — both ARM-REAL and ARM-NULL converge (TVD_r <= tau(N))
        by some r* in {2,3,4} and stay there through R: the naive full-diffusion
        heuristic holds for the data path, in contrast to H-AES-77230c's
        key-schedule finding.
        (ii) CH-1 IS FALSIFIED WITH A DATA-PATH-SPECIFIC MECHANISM — ARM-REAL
        persists (TVD_r > tau(N)) past round 4 through some r* >= 5 while
        ARM-NULL has already converged at that same r*: the real key schedule's
        round-to-round CORRELATION structure (present in ARM-REAL, absent in
        ARM-NULL) is doing something ARM-NULL's independent-random-round-keys
        construction does not, an analogue of H-AES-77230c's key-schedule
        non-saturation finding surviving on the data path. THIS OUTCOME, IF
        OBSERVED, IS NOT ITSELF A DISTINGUISHER, A KEY-RECOVERY RESULT, OR A
        MARGIN AGAINST EXHAUSTIVE SEARCH — see interpretation_limits below — it
        is a falsification of CH-1 as stated, nothing more, and would itself
        need its own follow-up design before any cost claim could be considered.
        (iii) NEITHER ARM CONVERGES, OR BOTH PERSIST TOGETHER PAST ROUND 4 — per
        invalidation_rules, this is NOT read as (ii); a shared persistent excess
        in BOTH arms is the artifact signature docs/inventor-protocol.md section
        3 names, and the run is reported UNINTERPRETABLE pending instrument
        investigation, never as evidence for or against CH-1.

  falsification_criterion: >-
    REPLACEMENT (v2). The FALSIFICATION CONDITION ITSELF IS UNCHANGED FROM
    v1 and is restated first, word for word in effect: the preregistered
    prediction (CH-1: data-path convergence to Binomial(128,1/2) by round
    ~2-4, sustained through the full round count) is FALSIFIED, for a given
    key size, if at some round r* with 5 <= r* <= R (materially past the
    predicted [2,4] window, giving the naive prediction a comfortable margin
    before being judged falsified), TVD_{r*}(ARM-REAL) > tau(N) WHILE, AT THE
    SAME ROUND r* AND KEY SIZE, TVD_{r*}(ARM-NULL) <= tau(N). WHAT v2 CHANGES
    IS THE OUTCOME ENUMERATION AROUND IT, WHICH IN v1 WAS NOT EXHAUSTIVE.
    THE OUTCOME TABLE. Write A := CONVERGED(ARM-REAL, key_size) and
    B := CONVERGED(ARM-NULL, key_size), the predicate defined in invalidation
    rule 1b (TVD_r <= tau(N) for every r in [5, R]). The four outcomes below
    are the four cells of the 2x2 truth table on (A, B). THEY ARE THEREFORE
    EXHAUSTIVE AND MUTUALLY EXCLUSIVE BY CONSTRUCTION: every run that is not
    already UNINTERPRETABLE under invalidation rule 1a's precedence clause
    lands in exactly one of them, and no outcome-routing judgment is left to
    the executor.
    (i) A TRUE, B TRUE - CH-1 HOLDS. Both arms converge and stay converged:
    the naive full-diffusion heuristic holds for the data path, in contrast
    to H-AES-77230c's key-schedule finding. UNCHANGED FROM v1 in meaning.
    (ii) A FALSE, B TRUE - CH-1 IS FALSIFIED WITH A DATA-PATH-SPECIFIC
    MECHANISM. ARM-REAL persists past the window while ARM-NULL has already
    converged: the real key schedule's round-to-round CORRELATION structure
    (present in ARM-REAL, absent in ARM-NULL) is doing something ARM-NULL's
    independent-random-round-keys construction does not. This is the cell,
    and the only cell, in which the falsification condition above is met with
    a valid control. THIS OUTCOME, IF OBSERVED, IS NOT ITSELF A
    DISTINGUISHER, A KEY-RECOVERY RESULT, OR A MARGIN AGAINST EXHAUSTIVE
    SEARCH; it is a falsification of CH-1 as stated, nothing more, and would
    need its own follow-up design before any cost claim could be considered.
    UNCHANGED FROM v1 in meaning.
    (iii) A FALSE, B FALSE - BOTH ARMS PERSIST TOGETHER. A shared persistent
    excess in BOTH arms is the artifact signature docs/inventor-protocol.md
    section 3 names; the run is reported UNINTERPRETABLE pending instrument
    investigation, never as evidence for or against CH-1. UNCHANGED FROM v1
    in meaning, now stated as a cell of the table rather than as prose that
    happened to say "both".
    (iv) A TRUE, B FALSE - NULL-CONTROL-ONLY FAILURE. NEW IN v2. ARM-REAL
    converges normally while ARM-NULL ALONE fails to reach and hold
    at-or-below tau(N) across [5, R] - the mirror image of (ii), and the case
    v1's three-outcome enumeration did not name, which
    RT-20260901-1af5d9's objection 6 identified. DISPOSITION: invalidation
    rule 4 fires; the key size's result is reported as a MEASUREMENT-PIPELINE
    DEFECT and UNINTERPRETABLE, and is NEVER reported as CH-1 holding, even
    though ARM-REAL converged. The reason is stated so it is not mistaken for
    excess caution: ARM-REAL's converged reading was produced by the SAME
    instrument whose null object failed to null out, so the reading has no
    demonstrated validity; a null control that fails is not a weak control,
    it is a broken one. The plausible generating causes are instrument
    causes - insufficient entropy or a stride/aliasing bug in the S2
    round-key draws, a state-capture off-by-one in the null path, an
    accidental reuse of one round key across rounds - each of which produces
    a STABLE, non-jumping bias rather than an erratic one, i.e. exactly the
    shape 1a alone cannot see. WHAT IT WOULD MEAN, DEFINED BEFORE ANY DATA
    EXISTS, since an outcome nobody has interpreted in advance is not a
    discriminator: outcome (iv) discriminates "the pipeline is sound and AES's
    data path is the subject" (cells i and ii) from "the pipeline is not
    sound and nothing about AES has been measured" (cells iii and iv). It is
    a real, informative, negative outcome about the INSTRUMENT and it is
    reported as such - never as a null result about AES and never as a
    finding at any round count (SC-8).
    NEXT ACTION ON (iii) OR (iv): re-run the ARM-NULL path alone at the pilot
    tier with the S2 stream replaced by a second, independently derived
    round-key source (e.g. a different purpose tag), and separately with the
    round function replaced by an identity round, to localise whether the
    defect is in the draw or in the state capture. THAT DIAGNOSTIC IS NAMED,
    NOT AUTHORIZED: it is additional compute requiring its own Coordinator
    approval, exactly like everything else in this file.

  required_artifacts:
