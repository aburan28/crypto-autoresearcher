    - "Machine-readable per-round histograms (JSON/CSV): counts c_r(k) for k=0..128, per round, per arm, per key size, per tier (pilot and primary), streamed/accumulated per stopping_rules item 4 and maximum_memory_gb (never a dump of raw per-sample trajectories at the primary tier). [carried forward from v1, unchanged]"
    - "The calibration-null code/output computing tau(N_pilot) and tau(N_primary), with the M and RNG path (numpy vs pure-Python fallback) actually used recorded. [carried forward from v1, unchanged]"
    - "The 120 ARM-ANCHOR deterministic-check outputs (pass/fail per delta/K-draw/key-size). [carried forward from v1, unchanged]"
    - "GATE-ROUND0 pass/fail log for the first 1000 pilot samples per arm per key size. [carried forward from v1, unchanged]"
    - "GATE-PAIRSYNC evidence, ADDED BY v2 as part of DEFECT 1's resolution: (a) the Layer A comparison log - per checked sample index i, the two arms' K_i, K'_i, RK[0](K_i), RK[0](K'_i) and state_0 bytes as hex, with the pass/fail verdict; (b) the Layer B final streaming SHA-256 digest per arm, per key size, per tier, with the achieved sample range each digest covers, and the equality verdict. Absence of either is itself a completion failure of the run, not a silent omission."
    - "A run manifest per AGENTS.md 'Artifact policy': exact command, git commit and dirty-tree state, environment/dependency versions (Python version, numpy availability and version if used), the seed policy's actual seeds and sub-seed formulas used, requested model policy/backend and resolved runtime model identifier, stdout/stderr, raw machine-readable results, validity status and reason, timestamps and resource measurements. [carried forward from v1, updated only to say 'sub-seed formulas' because v2's seeds are derived rather than listed]"
    - "certificate: kind: none, per docs/claims-and-verification.md - this design claims no solve, no key recovery, no decomposition; there is nothing to certify. [carried forward from v1, unchanged]"

