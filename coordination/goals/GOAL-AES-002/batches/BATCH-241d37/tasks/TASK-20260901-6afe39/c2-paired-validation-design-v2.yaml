      - experiment.inputs.seed_policy
      - experiment.inputs.delta_values_for_ARM_ANCHOR.note
      - experiment.replication.seeds
    v1_block_the_defect_contradicted: >-
      experiment.inputs.arms[ARM-NULL].description, which claims "state_0 in
      this arm is BYTE-IDENTICAL, sample for sample, to state_0 in ARM-REAL
      for the same (K,K') pair." That sentence is NOT edited by v2 - it was
      correct, and the seed policy was what made it false.
    statement_of_the_defect: >-
      v1's SEED(key_size, arm, tier) was indexed by `arm` and declared "used
      ONLY for that (key_size, arm, tier) combination's KEY draws; no seed is
      shared or reused across combinations." ARM-REAL (arm_idx=0) and ARM-NULL
      (arm_idx=1) therefore drew K, K' from different independent streams and
      would, with probability overwhelmingly close to 1, hold different key
      pairs at the same sample index. The two statements cannot both hold. An
      executor following seed_policy exactly would run a DIFFERENT experiment
      from the one the prose describes, and the design's central
      confound-control logic - hold the one nuisance variable, the initial
      condition, constant across arms - would be false as written.
    how_v2_resolves_it: >-
      The key stream S1 is indexed by (key_size, tier, sample index) and NOT
      by arm; both arms read the same K_i, K'_i and both derive RK[0] from
      them through the same real FIPS-197 KeyExpansion, so state_0 =
      AddRoundKey(P, RK[0]) is byte-identical across arms BY CONSTRUCTION.
      Arm-specific randomness survives only where one arm alone needs it:
      stream S2 supplies ARM-NULL's 2*R replacement round keys and nothing
      else, and stream S3 supplies ARM-ANCHOR's key draws.
    why_the_construction_actually_delivers_byte_identical_state_0: >-
      state_0 is a deterministic function of exactly two things: the fixed
      plaintext P (identical across arms by inputs.fixed_plaintext_P, which
      v2 does not touch) and RK[0]. RK[0] is a deterministic function of the
      raw key alone - it is the first 128 bits of the key bytes verbatim, for
      every AES key size, per FIPS-197 KeyExpansion - and both arms take that
      raw key from the same S1 draw at the same index i. Neither S2 nor S3
      participates in state_0's computation at all: S2 supplies RK[1..R] only,
      by ARM-NULL's own definition, and the round function is not applied
      before state_0 by round_boundary_convention. Therefore state_0^REAL(i)
      == state_0^NULL(i) as 16 byte values, for every i, with no probabilistic
      qualifier. Note this is an argument, not a run-time guarantee, which is
      why 2b exists.
    run_time_check: >-
      stopping_rules item 2b (GATE-PAIRSYNC), two layers: Layer A compares
      K_i, K'_i, RK[0](K_i), RK[0](K'_i) and the 16 state_0 BYTES for
      byte-equality across arms at every one of the first 1000 pilot indices
      and at a declared deterministic subset of primary indices; Layer B
      requires the two arms' incremental SHA-256 accumulators over
      (i, K_i, K'_i, state_0_i) for the whole achieved range to finalise to
      the SAME hex digest, giving complete coverage at O(1) memory and one
      hash update per sample. Any mismatch HALTS the key size's run as
      `invalid_measurement` - an infrastructure signal per AGENTS.md rule 5,
      never mathematical evidence. Comparing h_0 instead of state_0 bytes is
      explicitly INSUFFICIENT and is called out in 2b: h_0 is a lossy
      projection of the pair.
  - id: DEFECT-2
    source: RT-20260901-1af5d9 objections item 6; required_controls item 4
    v1_blocks_replaced:
      - experiment.invalidation_rules item 1
      - experiment.invalidation_rules item 4
      - experiment.falsification_criterion
    statement_of_the_defect: >-
      v1's item 1, labelled the design's central invalidation rule and named
      "THE ROUND-COUNT DECAY CHECK", is worded as "TVD_{r+1}(arm) must not
      exceed TVD_r(arm) + tau(N)" - a round-to-round jump/re-emergence
      detector. A FLAT, persistently-elevated, never-increasing TVD series
      passes it cleanly at every consecutive pair, so the rule cannot detect
      a failure to decay at all. v1's item 4 was plainly intended to route an
      ARM-NULL failure to "instrument flag", but its trigger text pointed
      back at item 1's narrow jump test, so a flat ARM-NULL excess tripped
      nothing. And v1's falsification_criterion enumerated three outcomes
      that did not cover "ARM-NULL alone fails while ARM-REAL converges
      normally" - the mirror image of outcome (ii), distinct from outcome
      (iii)'s "both persist together".
    how_v2_resolves_it: >-
      Item 1 is SPLIT rather than rewritten: 1a keeps the jump test verbatim
      in substance under a name that says what it tests, with its blindness
      to a flat series disclosed in its own text; 1b adds the attainment
      predicate CONVERGED(arm, key_size) := [TVD_r <= tau(N) for every r in
      [5, R]], which a flat elevated series fails by definition. Item 4 is
      rewritten to trigger on CONVERGED(ARM-NULL) == FALSE - any failure
      shape, any ARM-REAL behaviour - rather than on "fails the round-count
      decay check". falsification_criterion keeps v1's falsification
      CONDITION word-for-word in effect and replaces its three-outcome prose
      with the 2x2 table on (A, B) = (CONVERGED(ARM-REAL),
      CONVERGED(ARM-NULL)), whose four cells are exhaustive and mutually
      exclusive by construction; the previously uncovered case is cell (iv),
      NULL-CONTROL-ONLY FAILURE, named explicitly with its own disposition
      and its own stated meaning.
    why_the_window_is_5_to_R: >-
      Because that is the window v1's falsification_criterion ALREADY applies
      to ARM-REAL ("some round r* with 5 <= r* <= R"), and the task card asks
      that item 4 trigger on ARM-NULL's failure "by the convergence window
      falsification_criterion already applies to ARM-REAL". Holding the two
      arms to the same window keeps every decision threshold in the design
      exactly where v1 set it; moving to [4, R] would have tightened a
      threshold, which is a third change and out of scope. TVD_4 is
      nonetheless reported non-bindingly so the stricter reading is visible
      in the data.
    what_each_outcome_would_mean: >-
      Stated before any data exists, per this program's requirement that an
      experiment discriminate between explanations rather than merely
      observe. (i) the instrument is sound and the naive full-diffusion
      heuristic survives on the data path. (ii) the instrument is sound and
      CH-1 is false with a mechanism localised to the real key schedule's
      round-to-round correlation, since the only difference between the arms
      is the round-key source. (iii) and (iv) both mean the instrument is not
      sound and nothing about AES has been measured; they differ in which
      diagnostic is indicated first, and (iv) additionally forbids the
      tempting misreading "ARM-REAL converged, so CH-1 held."

