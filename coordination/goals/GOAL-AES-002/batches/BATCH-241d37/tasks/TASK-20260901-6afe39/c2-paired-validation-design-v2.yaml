  version: 2

  title: >-
    C2 paired-independent-key data-path Hamming-distance histogram vs
    Binomial(128,1/2), full round count, with matched structural null and
    deterministic sensitivity anchor (DESIGN CONTRACT v2, NOT EXECUTED) -
    seed policy made arm-independent and the convergence check made
    attainment-sensitive

  status: draft
  status_note: >-
    `draft` per the AGENTS.md experiment lifecycle, carried forward from v1.
    This record has not been submitted for Coordinator review under this
    batch's scope and stays `draft` until a future task explicitly moves it.
    STATED PLAINLY PER SC-9: NOT-YET-APPROVED, NOT-YET-EXECUTED, and nothing
    in this file authorizes its own dispatch.

  objective: >-
    UNCHANGED FROM v1. Convert candidate C2's `minimal_test_sketch`
    (object-enumeration.yaml, id C2) into a preregistered, control-bearing,
    fully budgeted experiment contract meeting docs/target-result-profile.md's
    heuristic-validation standard (A7) and docs/inventor-protocol.md section
    3's controls-before-belief discipline, BEFORE any compute is spent: does
    the paired-independent-key data-path Hamming-distance histogram converge
    to Binomial(128,1/2) by round ~2-4 and stay there through the full round
    count, for BOTH the real cipher and a matched structural null in which the
    key schedule is replaced by independent uniform round keys (whitening key
    RK[0] preserved) - or does the real-cipher arm retain detectable
    cross-key structure past the predicted convergence window while the
    matched-null arm does not?

  inputs:
    carried_forward_unchanged_from_v1: >-
      fixed_plaintext_P, key_sizes_and_round_counts,
      round_boundary_convention, implementation_basis, arms (ARM-REAL,
      ARM-NULL, ARM-ANCHOR, GATE-ROUND0), sample_size_tiers,
      delta_values_for_ARM_ANCHOR.deltas, delta_values_for_ARM_ANCHOR.draws_per_delta,
      and statistical_procedure (null_model,
      primary_statistic_total_variation_distance,
      secondary_statistic_chi_square_goodness_of_fit,
      sampling_noise_calibration_null, tail_check). These blocks are NOT
      restated here; they are read from v1 at the path named in
      `supersession.supersedes_path` and are unaffected by this revision.
      ARM-NULL's own sentence - "state_0 in this arm is BYTE-IDENTICAL,
      sample for sample, to state_0 in ARM-REAL for the same (K,K') pair" -
      is carried forward VERBATIM and unchanged, because DEFECT 1's fix makes
      that sentence TRUE BY CONSTRUCTION rather than contradicted; it was the
      seed policy, not the ARM-NULL prose, that was wrong.

    seed_policy_v1_verbatim_text_being_replaced: |-
      seed_policy: >-
        Deterministic, reproducible, and fully specified so no executor
        judgment call is needed. BASE_SEED := 20260901 (this task's dispatch
        date, YYYYMMDD, as an integer). For key_size in {128,192,256} (index
        ks_idx in {0,1,2} respectively) and arm in {real, null, anchor} (index
        arm_idx in {0,1,2} respectively): SEED(key_size, arm, tier) :=
        BASE_SEED + 1000*ks_idx + 100*arm_idx + tier_offset, where
        tier_offset is 0 for pilot and 1 for primary. Each such SEED
        initializes an independent `random.Random(SEED)` instance (Python
        standard library) used ONLY for that (key_size, arm, tier)
        combination's key draws; no seed is shared or reused across
        combinations. The calibration-null draws (below) use a SEPARATE,
        declared seed: CAL_SEED := BASE_SEED + 900000.

    seed_policy: >-
      REPLACEMENT (v2). PURPOSE-INDEXED, NOT ARM-INDEXED. The defect the
      replaced text carried is that `arm` appeared in the index of the KEY
      stream, which forced ARM-REAL and ARM-NULL to draw DIFFERENT (K,K')
      pairs and thereby contradicted ARM-NULL's own byte-identical-state_0
      claim. In v2 the key stream is indexed by PURPOSE (what the randomness
      is for), and `arm` indexes only the randomness that ONE arm alone
      consumes. BASE_SEED := 20260901 (unchanged). ks_idx in {0,1,2} for
      key_size in {128,192,256}; tier in {"pilot","primary"}; L := key length
      in bytes (16/24/32); R := full round count (10/12/14); i := the sample
      index, 0 <= i < N. FOUR DECLARED STREAMS, and no others:
      (S1) THE SHARED KEY STREAM, ARM-INDEPENDENT.
      KEY_SUBSEED(key_size, tier, i) := int.from_bytes(SHA256(ASCII(
      "C2-V2|KEY|" + str(BASE_SEED) + "|" + str(key_size_bits) + "|" + tier +
      "|" + str(i))).digest(), "big"). Set rng := random.Random(
      KEY_SUBSEED(key_size, tier, i)); then K_i := rng.getrandbits(8*L)
      .to_bytes(L, "big") and, from the SAME rng instance immediately
      afterwards, K'_i := rng.getrandbits(8*L).to_bytes(L, "big").
      (`getrandbits(...).to_bytes(...)` is specified rather than
      `random.Random.randbytes` deliberately: getrandbits is stable across
      every CPython 3.x, randbytes exists only from 3.9. No executor judgment
      call is left.) EVERY ARM THAT NEEDS A KEY PAIR - ARM-REAL AND ARM-NULL
      ALIKE - READS K_i AND K'_i FROM EXACTLY THIS STREAM, at exactly this
      index i. `arm` does NOT appear anywhere in S1's index. This is what
      makes ARM-NULL's byte-identical-state_0 claim true: both arms derive
      RK[0] from the SAME K_i and K'_i through the SAME real FIPS-197
      KeyExpansion, so state_0 = AddRoundKey(P, RK[0]) is the same 16 bytes in
      both arms by construction, not by assertion.
      (S2) THE ARM-NULL-ONLY ROUND-KEY STREAM, ARM-SPECIFIC.
      NULLRK_SUBSEED(key_size, tier, i) := int.from_bytes(SHA256(ASCII(
      "C2-V2|NULLRK|" + str(BASE_SEED) + "|" + str(key_size_bits) + "|" +
      tier + "|" + str(i))).digest(), "big"). Set nrng :=
      random.Random(NULLRK_SUBSEED(...)); draw exactly 2*R independent
      128-bit strings in this FIXED order: first RKnull_K[1..R] (the
      K-trajectory's replacement round keys, r ascending), then
      RKnull_Kprime[1..R] (the K'-trajectory's, r ascending), each as
      nrng.getrandbits(128).to_bytes(16, "big"). ONLY ARM-NULL consumes S2.
      ARM-REAL never touches it. RK[0] is NOT drawn here - ARM-NULL takes
      RK[0](K_i) and RK[0](K'_i) from the real KeyExpansion, exactly as v1's
      ARM-NULL prose requires.
      (S3) THE ARM-ANCHOR STREAM, ARM-SPECIFIC. ANCHOR_SUBSEED(key_size,
      delta_id, j) := int.from_bytes(SHA256(ASCII("C2-V2|ANCHOR|" +
      str(BASE_SEED) + "|" + str(key_size_bits) + "|" + delta_id + "|" +
      str(j))).digest(), "big") for j = 0..19, delta_id in
      {"delta_low","delta_high"}; K_j := random.Random(ANCHOR_SUBSEED(...))
      .getrandbits(8*L).to_bytes(L, "big"). ARM-ANCHOR needs no K' (it builds
      K'' deterministically from K_j and delta) and therefore shares nothing
      with S1 or S2.
      (S4) THE CALIBRATION-NULL STREAM. CAL_SEED := BASE_SEED + 900000,
      UNCHANGED FROM v1, used only for the tau(N) replicates, which involve
      no AES computation at all.
      WHY PER-SAMPLE SUB-SEEDS RATHER THAN THE RED TEAM'S "SINGLE STREAM".
      required_controls item 3 of RT-20260901-1af5d9 proposes "a SINGLE,
      arm-independent stream per (key_size, tier, sample index)". This design
      adopts that requirement and implements it in the STRONGER indexed form
      above, for three stated reasons rather than by preference: (a) a single
      SEQUENTIAL generator requires both arms to consume it in lockstep, so
      running ARM-REAL and ARM-NULL in separate processes, or in either order,
      or resuming after an interruption, silently desynchronises them and
      re-creates the very defect being fixed; an indexed sub-seed is
      addressable, so sample i is the same key pair no matter who computes it,
      when, or in what order. (b) stopping_rules item 5 permits truncation at
      an ACHIEVED N below the target; with a sequential stream the two arms
      could truncate at different points and no longer be comparing the same
      pairs, whereas indexed sub-seeds make the achieved prefixes identical by
      construction. (c) an indexed stream makes the run-time check in
      stopping_rules item 2b (below) a genuine equality test on independently
      recomputed values rather than a tautology about a shared object in
      memory. The red team's stated requirement - arm must not index the key
      draw - is met exactly; only the implementation form differs, and the
      difference is stated here rather than left silent.
      INDEPENDENCE PROPERTIES ASSERTED, AND WHAT IS AND IS NOT PROVED. S1, S2
      and S3 are distinct because their SHA-256 pre-images carry distinct
      ASCII purpose tags ("KEY", "NULLRK", "ANCHOR") and distinct index
      tuples, so no two of them can collide except through a SHA-256
      collision. NOTHING HERE IS A CRYPTOGRAPHIC CLAIM AND NONE IS NEEDED:
      the design's statistical null is Binomial(128,1/2) under the assumption
      that the PRNG's output is adequate for this purpose, which is exactly
      what GATE-ROUND0 tests empirically (h_0's empirical distribution against
      the exact Binomial(128,1/2)) and what stopping_rules item 2 halts on.
      Mersenne-Twister adequacy for this statistic is NOT proved here and is
      NOT assumed silently: it is the object of an existing gate.

    delta_values_for_ARM_ANCHOR_note_v1_verbatim_text_being_replaced: |-
      note: >-
        20 independent K draws (per the seed policy's arm_idx=2 "anchor"
        stream) per delta value, 2 delta values, 3 key sizes = 120
        deterministic checks total, each requiring one key-schedule pair and
        one round of encryption — well under a second of compute in
        aggregate; negligible relative to the pilot/primary tiers.

    delta_values_for_ARM_ANCHOR_note: >-
      REPLACEMENT (v2), CROSS-REFERENCE REPAIR ONLY - the arithmetic, the
      count and the cost statement are unchanged. 20 independent K draws (per
      stream S3, ANCHOR_SUBSEED(key_size, delta_id, j), j = 0..19, of the v2
      seed_policy above; the phrase "arm_idx=2" no longer names anything,
      because v2's seed policy is purpose-indexed rather than arm-indexed)
      per delta value, 2 delta values, 3 key sizes = 120 deterministic checks
      total, each requiring one key-schedule pair and one round of encryption
      - well under a second of compute in aggregate; negligible relative to
      the pilot/primary tiers.

  controls:
  - 'ARM-NULL (matched_null_control): structural null isolating whether the real key schedule''s
    round-to-round correlation is load-bearing for any observed convergence, versus generic
    to any round-key sequence.'
  - 'sampling_noise_calibration_null (tau(N)): statistical null fixing the materiality threshold
    from the actual finite-sample noise floor of the theoretical Binomial(128,1/2), not an arbitrary
    cutoff.'
  - 'ARM-ANCHOR (sensitivity_anchor_planted_difference): deterministic positive control verifying
    the measurement pipeline can detect a KNOWN, engineered, large deviation before any ARM-REAL/ARM-NULL
    result is trusted.'
  - 'GATE-ROUND0 (round_0_sanity_gate): implementation-correctness check independent of the
    AES round function, verifying key generation and state-0 bookkeeping are not the source
    of any observed pattern.'
  - Final-ciphertext FIPS-197 KAT cross-check of the instrumented implementation against the
    openssl CLI (and pycryptodome if importable), re-run fresh for THIS instrumented build before
    any sampling — the RANK 3 receipt's 4/4 KAT agreement (run3-python.json) was measured on
    a DIFFERENT, non-instrumented, ciphertext-only implementation and does not transfer automatically
    to a round-state-exposing build.
  controls_restored_note: UNCHANGED FROM v1 AND NOT RESTATED. v1's five control entries (ARM-NULL;
    the tau(N) sampling-noise calibration null; ARM-ANCHOR; GATE-ROUND0; the fresh final-ciphertext
    FIPS-197 KAT cross-check of the instrumented build) all stand as written. v2 does not remove,
    weaken or add a control; it makes the FIRST of them (ARM-NULL) actually implementable as
    specified, and adds one run-time CHECK (stopping_rules item 2b) that the control is in fact
    operating.

  independent_variables:
    - "round r, r = 0..R (R = 10/12/14 by key size)"
    - "key_size_bits, in {128, 192, 256}"
    - "arm, in {real_cipher, matched_null_control, sensitivity_anchor_planted_difference}"
    - "sample_size_tier, in {pilot (N=2^12), primary (N=2^20), escalation (N=2^24, named but not authorized)}"

  metrics:
    primary:
      - "TVD_r(arm, key_size): total variation distance between the empirical h_r histogram and Binomial(128,1/2), per round, arm, and key size, at the primary tier (N=2^20)"
      - "first-convergence round r*(arm, key_size) := min{r in [1,R] : TVD_r(arm,key_size) <= tau(N_primary)}, or 'no convergence within [1,R]' if none exists"
    secondary:
      - "X2_r(arm, key_size) and its chi-square p-value, per round/arm/key size, diagnostic only"
      - "empirical mean and variance of h_r per round, vs the theoretical 64 and 32, per arm/key size"
      - "tail_check outputs (m_min, m_max, Pr[H<=m_min], Pr[H>=m_max], N*Pr[H<=m_min]) at round R, per arm/key size"
      - "GATE-ROUND0 pass/fail and ARM-ANCHOR exact-match pass/fail counts (120 checks), per key size"
    metrics_unchanged_from_v1_note: >-
      IDENTICAL TO v1, DELIBERATELY. DEFECT 2's fix introduces the derived
      predicate CONVERGED(arm, key_size) (defined in invalidation_rules item
      1b below), but that predicate is computed ENTIRELY from the TVD_r table
      this metrics block already requires - it needs no new measurement, no
      new sample, and no new instrument - so no metric is added, removed or
      redefined. Note carefully that r* (a first-crossing round) is NOT the
      same quantity as CONVERGED (a reach-AND-HOLD predicate): r* can exist
      while CONVERGED is false. That distinction is the whole content of
      DEFECT 2 and is why the predicate is stated explicitly rather than left
      implicit in r*.

  heuristic_under_test: >-
    UNCHANGED FROM v1 AND NOT RESTATED HERE. Candidate heuristic CH-1, stated
    formally in v1's `heuristic_under_test` block, with its random-model
    justification, its explicit disclosure that NO spectral-gap bound is
    proven or cited for AES's actual round function, its status as a
    LOCALLY-SCOPED CANDIDATE (no canonical HEUR-NNN ledger entry exists), and
    its REDUCED (not default) confidence sourced from H-AES-77230c's
    key-schedule non-saturation precedent - all carried forward verbatim from
    v1 at the path in supersession.supersedes_path. v2 changes nothing about
    what is being tested; it changes only the seed plumbing and the
    convergence bookkeeping.

  preregistered_prediction:
    carried_forward_verbatim_from_v1: true
    quantity: >-
      The full empirical distribution (129-point histogram, k=0..128) of
      h_r, the Hamming distance between the two independent-key
      trajectories' COMPLETE intermediate state, at every round boundary
      r=0..R, for BOTH ARM-REAL and ARM-NULL, at each of the three key
      sizes, at the primary sample-size tier (N=2^20).
    formula: >-
      H0 per (round, arm, key_size): h_r ~ Binomial(128, 1/2) i.i.d.
      PREDICTION (CH-1, stated at REDUCED CONFIDENCE per H-AES-77230c's
      precedent, named explicitly rather than assumed): for BOTH ARM-REAL
      and ARM-NULL, TVD_r exceeds tau(N) at r=1 (confirming, jointly with
      GATE-ROUND0 and ARM-ANCHOR, that the instrument starts from a
      genuinely non-null, detectable state rather than trivially reporting
      "converged" from round 0 onward) and decays to at-or-below tau(N) by
      some r* in {2,3,4}, remaining at-or-below tau(N) for every subsequent
      round through R, for every key size. The possibility that r* does not
      exist within [2,4] for ARM-REAL specifically, or exists but excess
      later re-emerges past it (an event this design's own invalidation
      rule would flag rather than silently absorb), is the substantive
      open question this design is built to discriminate - it is NOT
      assumed to resolve either way by this record.
    below_default_confidence_disclosure: >-
      PRESERVED FROM v1 AND RESTATED HERE SO IT CANNOT BE LOST IN THE
      SUPERSESSION. This prediction is held at BELOW-DEFAULT confidence. The
      reason is named, not gestured at: this campaign's own structurally
      adjacent finding H-AES-77230c (ledger/hypotheses/H-AES-77230c.yaml)
      reports the AES-128 KEY SCHEDULE's bit-influence density stuck at
      0.78125 at round 10 rather than reaching 1.0, which contradicts a naive
      full-diffusion expectation for a structurally similar quantity. That
      record is explicitly scoped to the key schedule under RQ-AES-001 and is
      cited here ONLY as the reason CH-1's confidence is reduced, NEVER as
      authority transferred across questions and NEVER as a statement about
      the cipher at full round count (SC-8).
    source: >-
      object-enumeration.yaml, id C2, fields `mechanism` and
      `axis_scores.survival.rationale`
      (coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-d8835b/object-enumeration.yaml);
      the reduced-confidence qualifier is sourced from H-AES-77230c.yaml
      `statement` and `predictions[0]`.

  scale_relevance:
    tier: toy
    justification: >-
      UNCHANGED FROM v1. `toy` per RQ-AES-002 R7's explicit, question-specific
      ruling, which ceilings the claim tier for every evidence record under
      this question regardless of the parameters actually tested. NOTED
      EXPLICITLY SO THE TENSION IS NOT SILENT, exactly as v1 noted it: the
      ACTUAL TESTED PARAMETERS are cryptographic-size keys (128/192/256 bits)
      at their FULL published round counts (10/12/14); the `toy` LABEL
      reflects R7's blanket ceiling, not parameter smallness. Transfer
      assumption, unchanged: exactly ONE fixed plaintext P per key size;
      nothing is asserted about any other plaintext, about related-key
      structure, or about any statistic finer-grained than the full-state
      Hamming weight.
    correspondence: null
    correspondence_note: >-
      NULL, unchanged from v1. No correspondence or scaled-analogue sampling
      trick is used to reach scale; K, K' and P are drawn or fixed directly at
      their real cryptographic size and the real full round count.

  tail_checks:
    - >-
      UNCHANGED FROM v1. At round R (full round count), per arm, per key
      size, the extreme observed h_R value (min and max across the primary
      tier's N samples) is compared against its exact Binomial(128,1/2) tail
      probability, with the order-statistic consistency check
      N*Pr[H<=m_min] ~ O(1), per docs/target-result-profile.md A7's exemplar
      pattern.
    - >-
      UNCHANGED FROM v1. GATE-ROUND0 and ARM-ANCHOR are themselves EXACT (not
      statistical) checks: their predicted values (Binomial(128,1/2) for h_0;
      the deterministic weight(delta) for h_1 under ARM-ANCHOR) are checkable
      with zero sampling uncertainty, so any deviation is unambiguous
      instrument failure rather than a borderline statistical call.

  replication:
    seeds_v1_verbatim_text_being_replaced: |-
      seeds: >-
        Deterministic per seed_policy above (BASE_SEED=20260901,
        CAL_SEED=BASE_SEED+900000); every (key_size, arm, tier) combination's
        seed is derived by the stated formula, requiring no executor judgment.
    seeds: >-
      REPLACEMENT (v2), CROSS-REFERENCE REPAIR ONLY. Deterministic per the v2
      seed_policy above (BASE_SEED = 20260901; CAL_SEED = BASE_SEED + 900000,
      unchanged). Every draw in the design is derived by the stated
      SHA-256-indexed formulas from streams S1 (shared key pairs, indexed by
      (key_size, tier, sample index) and NOT by arm), S2 (ARM-NULL's own
      round-key draws), S3 (ARM-ANCHOR's key draws) and S4 (calibration),
      requiring no executor judgment. The phrase "(key_size, arm, tier)
      combination's seed" from the replaced text no longer describes this
      design: `arm` indexes S2 and S3 only, never the key pairs.
    independent_instances: 1
    independent_instances_note: >-
      UNCHANGED FROM v1. A single seeded primary-tier run per key size
      suffices to evaluate the falsification_criterion, since N supplies its
      own internal statistical power (tau(N) is derived from that same N). A
      SECOND, independently-seeded full replication is RECOMMENDED, not
      required, for any key size whose result lands within a factor of 2 of
      tau(N) at any decision-relevant round - a future Coordinator decision,
      not mandated here, and named so it is not silently skipped.

  budget:
    carried_forward_unchanged_from_v1: true
    carried_forward_note: >-
      EVERY FIGURE IN v1's `experiment.budget` BLOCK IS CARRIED FORWARD
      UNCHANGED AND IS NOT RE-DERIVED, RE-MEASURED OR RESTATED HERE BEYOND
      THE POINTER BELOW: wall_clock_seconds_per_run 1600 with its full
      derivation; total_cpu_hours 1.0; maximum_memory_gb 2 with its STREAMING
      (not batch-buffered) implementation requirement; maximum_runs 3;
      maximum_workers null (= single process, deliberately, because the
      primary tier is sized to fit under the worst-case single-core
      assumption and this environment's multi-core scaling is UNMEASURED for
      the only valid implementation). v2's two fixes change no cost: stream
      S2 draws exactly the same 2*R round keys per ARM-NULL sample that v1
      drew, S1 draws exactly the same 2 keys per sample that v1 drew (once
      instead of twice across arms, if anything marginally cheaper), the
      SHA-256 sub-seed derivation is one hash per sample per stream against a
      whole AES key schedule plus R rounds of encryption, and DEFECT 2's fix
      is arithmetic on an already-required table.
    measured_throughput_figure_citation: >-
      CITED BY PATH ONLY, NOT RE-MEASURED AND NOT RE-STATED FROM MEMORY, per
