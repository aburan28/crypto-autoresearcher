claim_ceiling: SPECIFICATION, TOOLING AND ARCHIVE REPAIR ONLY. No task in this batch may assert anything
  about AES at any round count, in either direction. The four items are a cost-model reading repair, a
  validator-tooling vocabulary repair, an experiment-design revision, and an archive-coverage repair.
  None of them measures a cipher.
objective: 'Execute DEC-20260901-1fc2f5''s four named next actions and no more. (1) File protocol-amendment-GOAL-AES-002-004
  closing the two narrower CM-1 reading gaps RT-20260901-1af5d9 established against amendment 003: element
  (a) Route 3''s undefined "independent" for a fused table-driven (T-table) AES implementation, and elements
  (c)/(f)''s under-determined "genuinely distinct computational acts" test for a guess-and-determine hybrid
  whose naive reading would misclassify the definitional reference itself. (2) Find and verify a genuinely
  DIFFERENT fix for BLK-1, since the amendment''s specified edit is confirmed by two independent sessions
  to desynchronize 112 baseline-suppressed tools/validate_ledger.py errors by changing the grandfathered
  error string. (3) Author a superseding v2 of candidate C2''s paired-validation design, fixing the seed_policy/ARM-NULL
  contradiction and extending the round-count decay check so a flat, non-jumping, ARM-NULL-only excess
  routes to a named falsification outcome. (4) Resolve validator finding F-VAL4c225b-1 by hash-binding
  the 20 BATCH-286bcd opening files that were genuinely committed but never individually pinned by any
  archive receipt.'
