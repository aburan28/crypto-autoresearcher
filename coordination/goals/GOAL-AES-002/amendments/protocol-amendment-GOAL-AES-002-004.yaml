  # =====================================================================
  # THE TWO GAPS BEING RESOLVED.
  # =====================================================================
  ambiguities_resolved:
    - id: AMB-5
      numbering_note: >-
        Continues -003's AMB-1..AMB-4 series. AMB-5 and AMB-6 are NEW
        ambiguities constructed by RT-20260901-1af5d9 AGAINST -003's own text;
        they are not restatements of AMB-1..AMB-4, each of which
        RT-20260901-1af5d9 independently re-applied and found CLOSED.
      element: (a) UNIT — the undefined word "independent" in ADMISSIBLE CONVERSION ROUTE 3
      source: >-
        RT-20260901-1af5d9 objections[0] and amendment_block_dispositions[0]
        (block item_1_element_a_route_3), disposition NEEDS REPAIR, severity
        MEDIUM.
      what_was_ambiguous: >-
        -003's Route 3 bars "no independent ShiftRows/MixColumns computation"
        without defining "independent". A FUSED TABLE-DRIVEN (T-table)
        implementation, in which one memory access performs a SubBytes
        substitution, its ShiftRows relabelling and its contribution to
        MixColumns simultaneously, is classifiable oppositely by two conforming
        readers: as the S-box route (Route 1's N being a specification-structure
        count, agnostic to implementation fusion) giving a determinate
        (N/S_k + X/X_k) AEU-k figure, or as an independent ShiftRows/MixColumns
        computation (the linear step did happen, merely for free) giving
        UNADJUDICABLE. T-table implementations are the ordinary fast way to
        implement AES, not a contrived edge case.
      resolved_by: the_change.item_1_gap_a_definition_of_independent (below)
    - id: AMB-6
      element: (c)/(f) — the under-determined "genuinely distinct computational acts" test
      source: >-
        RT-20260901-1af5d9 objections[1] and amendment_block_dispositions[1]
        (block item_2_elements_c_f_joint), severity MEDIUM, with an explicit
        repair_action; AND, independently and from a different session,
        VAL TASK-20260901-4c225b finding F-VAL4c225b-3 (severity LOW, "a
        narrow, unaddressed edge case in the amended element (c)/(f)
        bundled-verification rule (hybrid candidate-production pipelines)").
        BOTH ARE INPUTS; neither is treated as corroboration of the other,
        since the two reviews are one draw from a correlated pair under
        standing inference basis 0137a051.
      what_was_ambiguous: >-
        On its literal wording, "generating a candidate and verifying it against
        the target ciphertexts are genuinely distinct computational acts" is
        satisfied by ANY two procedurally separate steps, which would also
        capture the DEFINITIONAL REFERENCE's own pick-a-key-then-encrypt-and-
        compare loop that the SAME resolving text explicitly classifies as
        BUNDLED encrypt-and-compare enumeration. The text therefore presupposed
        an UNSTATED narrower sense of "distinct" — distinct in computational
        KIND or COST, not merely in procedural sequencing — and a genuine
        guess-and-determine hybrid (an algebraic pre-filter followed by a final
        encrypt-and-compare on survivors) sat exactly on the unresolved
        boundary, with the two readers differing by an additive N_survivors
        AEU-k term.
      resolved_by: the_change.item_2_gap_b_the_bundling_test (below)

  # =====================================================================
  # THE CHANGE — TWO RESOLVING-TEXT BLOCKS. THE TEXT UNDER
  # `resolving_text_verbatim` IS THE OPERATIVE RULE TEXT AND IS WHAT A
  # LATER RECORD QUOTES AND APPLIES.
  # =====================================================================
  the_change:
    item_1_gap_a_definition_of_independent:
      closes: AMB-5 (RT-20260901-1af5d9 objections[0] / amendment_block_dispositions[0])
      supersedes_sentences: [SUP-A-1, SUP-A-2]
      resolving_text_verbatim: >-
        CLAUSE A-1 — THE LEVEL AT WHICH N AND X ARE COUNTED. In ADMISSIBLE
        CONVERSION ROUTE 1 and in ADMISSIBLE CONVERSION ROUTE 3, N (S-box
        applications) and X (AddRoundKey byte-XORs) are counts of
        SPECIFICATION-LEVEL operations that the ATTACK ALGORITHM performs, in
        exactly the sense in which CM-1's own S_k and X_k are
        specification-structure counts of the operations one AEU-k performs.
        They are NOT counts of machine instructions, memory accesses, table
        lookups, register operations, cache lines or gates, and they do not
        change when the same attack algorithm is re-implemented by a different
        technique. An attack's Route 1 / Route 3 classification and its charged
        figure are therefore INVARIANT UNDER IMPLEMENTATION TECHNIQUE, and no
        implementation technique — plain byte-oriented, table-driven or fused
        T-table, bitsliced, or hardware round instruction — is by itself either
        admissible or inadmissible under these routes.
        CLAUSE A-2 — THE DEFINITION OF "INDEPENDENT". For the purpose of Route
        3's bar ("no independent ShiftRows/MixColumns computation, no table
        access outside the S-box route"), an operation is INDEPENDENT of the
        S-box route IF AND ONLY IF THE ATTACK ALGORITHM'S OWN
        SPECIFICATION-LEVEL DESCRIPTION REQUIRES ITS RESULT — that is, the
        attack consumes the output of that ShiftRows, MixColumns or other
        bytewise operation, so that an algorithm not performing it would not
        compute what this attack computes. Consequently: (i) an operation whose
        result the attack's specification-level description REQUIRES IS
        independent and DOES trigger inadmissibility, EVEN IF a particular
        implementation obtains it for free, fused into the same memory access,
        the same instruction or the same Boolean circuit as an S-box
        application already charged under Route 1; and (ii) an operation whose
        result the attack's specification-level description DOES NOT REQUIRE,
        and which arises only as a discarded by-product of how an
        implementation realises an S-box application already charged under
        Route 1, IS NOT independent, does NOT trigger inadmissibility, and
        carries NO additional charge. THE TEST IS WHAT THE ATTACK NEEDS, NEVER
        HOW IT IS COMPUTED.
        CLAUSE A-3 — TWO RIDERS, STATED HERE SO THEY ARE NOT IMPROVISED LATER.
        (i) A FIXED, DATA-INDEPENDENT PERMUTATION OF BYTE POSITIONS that the
        attack applies BY INDEXING ALONE — reading bytes already computed and
        already charged, in a different order, performing no bytewise
        arithmetic on them — is not a ShiftRows COMPUTATION under this bar.
        MixColumns NEVER qualifies for this rider, because it forms bytewise
        linear combinations (field multiplications and XORs of distinct bytes)
        rather than relabelling positions. (ii) A TABLE ACCESS IS WITHIN THE
        S-BOX ROUTE IF AND ONLY IF it realises an S-box application already
        counted in N, at most one such application per access; every other
        table access — a difference table, a sieve table, a precomputed
        candidate table, or any lookup not standing in that correspondence — is
        OUTSIDE the S-box route and triggers inadmissibility exactly as before.
        NOTHING IN CLAUSES A-1 TO A-3 CONVERTS A TABLE-ACCESS COUNT INTO AN
        AEU-k FIGURE: O-CM1-3 REMAINS OPEN, and an attack whose work is
        expressible only as table accesses, XORs or unqualified "operations"
        and NOT as a count of specification-level S-box applications and
        AddRoundKey byte-XORs remains INADMISSIBLE and is recorded as
        UNADJUDICABLE.
        CLAUSE A-4 — MANDATORY DISCLOSURE. Every cost claim citing Route 3
        states, in its own text: (i) the attack's COMPLETE specification-level
        bytewise operation inventory — N, X, and every other
        specification-level bytewise operation it performs, or the explicit
        statement that there is none; and (ii) the implementation technique
        used or assumed (plain byte-oriented, table-driven or fused T-table,
        bitsliced, hardware round instruction, or other), together with the
        explicit statement that (ii) does not affect the Route 3 classification
        and is disclosed for auditability under this clause. A Route 3 claim
        omitting either disclosure is INADMISSIBLE under this model and its
        figure is not evidence, exactly as element (c) already rules for an
        unstated success probability.
      why_this_and_not_the_red_teams_own_candidate_rule: >-
        RT-20260901-1af5d9 offered, explicitly as a starting point and not as a
        conclusion, the rule "an operation is independent of the S-box route if
        and only if its cost is not already fully absorbed into a single memory
        access whose count is already being charged under Route 1." THAT RULE
        WAS TESTED AGAINST THE THREE IMPLEMENTATIONS THE TASK CARD NAMES AND IS
        REJECTED, for two independent reasons worked in full in
        amendment-004-report.md: (1) IT DOES NOT TERMINATE ON TWO OF THE THREE.
        A bitsliced implementation performs NO memory access at all (the S-box
        is a Boolean circuit), and an AES-NI implementation performs none
        either (the round is a register instruction), so "absorbed into a single
        memory access whose count is already being charged under Route 1" has no
        referent for either, and on its plain wording every accompanying
        operation in both is INDEPENDENT and both become INADMISSIBLE —
        including the most auditable implementation of all. (2) IT DECIDES
        ADMISSIBILITY AT THE IMPLEMENTATION LEVEL, which is the exact level
        CM-1 already ruled out of the unit system: CM-1's own
        `element_a_unit.inadmissible_until_measured_stated_so_it_is_not_improvised`
        names T-table, bitsliced and AES-NI implementations BY NAME and rules
        that "a T-table implementation, a bitsliced implementation and an
        AES-NI implementation do not agree on how many XORs or table accesses
        one encryption performs", which is why those units are inadmissible.
        A rule keyed to memory accesses would reintroduce, into the
        admissibility test, exactly the implementation dependence CM-1
        excluded from the charging test. Clauses A-1 to A-3 keep the red team's
        INTENT — fused work already paid for is not charged twice and does not
        void the route — while relocating the test to the level at which N and
        X are already counted.
      effect_on_O_CM1_1: >-
        NONE. O-CM1-1 (the materiality threshold) is untouched and remains OPEN
        exactly as -003 left it: closed for the AddRoundKey-only auxiliary case
        alone, open for every other auxiliary-operation mix. This amendment
        does not widen Route 3's class of admissible attacks by a single case
        relative to -003's own specification-level reading; it forces the two
        readers of a T-table, bitsliced or AES-NI attack to the SAME verdict,
        which in the red team's own headline counterexample (a fused T-table
        attack that computes rounds) is the CONSERVATIVE verdict,
        INADMISSIBLE/UNADJUDICABLE.
      anti_laundering_note: >-
        CLAUSE A-2(ii) CANNOT BE USED TO OBTAIN FREE WORK. An operation whose
        result the attack does not consume contributes nothing to what the
        attack computes; the moment its result is consumed, A-2(i) makes it
        independent and voids the route. The exemption therefore covers only
        by-products that are genuinely discarded, and buys an attack no
        cryptanalytic capability it is not separately charged for.

    item_2_gap_b_the_bundling_test:
      closes: >-
        AMB-6 (RT-20260901-1af5d9 objections[1] / amendment_block_dispositions[1];
        independently located as F-VAL4c225b-3 by TASK-20260901-4c225b)
      supersedes_sentences: [SUP-B-1]
      resolving_text_verbatim: >-
        CLAUSE B-1 — THE OPERATIVE TEST, REPLACING "GENUINELY DISTINCT
        COMPUTATIONAL ACTS". Element (f)'s separate N-verification-unit charge
        applies to a candidate set of size N IF AND ONLY IF THE WORK ALREADY
        CHARGED FOR PRODUCING THAT SET DOES NOT ITSELF INCLUDE, FOR EACH
        CANDIDATE IN IT, A FULL EVALUATION OF AES-k ON A TARGET PLAINTEXT FROM
        THE ATTACK'S OWN ELEMENT (d) DATA UNDER THAT CANDIDATE KEY. Where the
        charged production work DOES include that full per-candidate evaluation
        — as DIRECT ENCRYPT-AND-COMPARE ENUMERATION does, since the encryption
        that tests a candidate IS the work charged for producing it —
        verification is ALREADY BUNDLED and NO separate charge applies.
        PROCEDURAL SEPARATION IS NOT THE TEST AND NEVER TRIGGERS THE CHARGE:
        that a mechanism is written as two steps, two loops, two functions or
        two passes ("pick the next key, then encrypt and compare") is
        IRRELEVANT; the only question is whether the charged production work
        already contains the full per-candidate AES-k evaluation that
        verification would otherwise cost. A PARTIAL evaluation — one round, a
        truncated computation, an algebraic or statistical constraint check, a
        table match, a filter on a subset of the state — IS NOT A FULL
        EVALUATION and DOES NOT bundle verification.
        CLAUSE B-2 — WHICH CANDIDATES CARRY THE CHARGE, AND WHAT "BUNDLED"
        MEANS. Where clause B-1 makes the charge apply, it is levied on the
        SURVIVORS of the LAST production stage that does not include a full
        per-candidate AES-k evaluation — N is that survivor count — and NEVER
        on candidates eliminated at or before that stage, whose cost is already
        charged as production work under whichever element governs their own
        operation type. Where clause B-1 makes verification BUNDLED, "bundled"
        carries exactly the meaning element (d)'s `relation_to_R1` clause
        already gives it on the reference side: one evaluation per candidate
        against the first pair, with confirmation against the remaining element
        (d) pairs costing a further AEU-k only for the candidates that survive
        the first pair, of which there is on average about one. That is element
        (b)'s same-convention-on-both-sides rule applied to the attack side; it
        CREATES NO NEW CHARGE AND REMOVES NONE.
        CLAUSE B-3 — MULTI-STAGE PIPELINES. An attack whose candidate
        production has several stages is decomposed STAGE BY STAGE: each
        stage's own cost is charged under whichever element governs its own
        operation type (for bytewise work, under element (a)'s admissible
        conversion routes as amended, and UNADJUDICABLE where no route
        applies), and clause B-1's test is applied ONCE, at the boundary clause
        B-2 names. A pipeline MAY NOT escape the charge by relabelling its
        final full-evaluation pass as "the candidate-generation mechanism", and
        MAY NOT be charged the N-verification-unit term more than once for the
        same candidate set.
        CLAUSE B-4 — MANDATORY DISCLOSURE. Every cost claim whose total depends
        on clause B-1's test states, in its own text, the stage decomposition
        of its candidate production, the survivor count at each stage boundary,
        and which stage was found to contain — or not to contain — a full
        per-candidate AES-k evaluation. A claim omitting this decomposition is
        INADMISSIBLE under this model and its number is not evidence.
      proves_too_much_check_m_equals_0_definitional_reference: >-
        MANDATORY CHECK, PERFORMED, AND IT PASSES. Apply clause B-1 to the m=0
        DEFINITIONAL REFERENCE (exhaustive key search: pick the next key,
        encrypt a target plaintext under it, compare with the target
        ciphertext, stop at the first match). The work charged for producing
        each candidate IS one AEU-k, and one AEU-k is by element (a)'s own
        definition ONE FULL AES-k ENCRYPTION OF ONE 128-BIT BLOCK AT THE FULL
        ROUND COUNT INCLUSIVE OF ONE FRESH KEY EXPANSION — i.e. a full
        evaluation of AES-k on a target plaintext under that candidate key.
        Clause B-1's antecedent ("does NOT itself include ... a FULL
        evaluation") is therefore FALSE, so element (f)'s separate charge DOES
        NOT APPLY and verification is BUNDLED. THAT IS EXACTLY THE
        CLASSIFICATION -003's OWN RESOLVING TEXT GIVES THE REFERENCE, and it is
        the classification the literal reading of "genuinely distinct
        computational acts" failed to give it. The check is also confirmable
        against element (b) independently: had the charge applied to the
        reference, the reference would be charged 2^(k-1) AEU-k PLUS 2^(k-1)
        verification units, roughly doubling CM-1's
        `element_b_success_convention.the_charged_definitional_reference`
        figures of 2^127 / 2^191 / 2^255 AEU-k, which are definitional and
        which no amendment may move. Clause B-1 leaves them exactly where CM-1
        put them.
      rejected_draft_recorded_not_deleted: >-
        DRAFT B-0, TESTED AND REJECTED, RECORDED HERE BECAUSE THE TASK CARD
        REQUIRES THE FAILED DRAFT TO BE RECORDED RATHER THAN DELETED. Draft
        B-0 read: "Two computational acts are DISTINCT IN KIND — the only sense
        of 'distinct' that triggers element (f)'s separate charge — if and only
        if the act that PRODUCES a candidate does not itself compute the
        quantity that the act of VERIFYING that candidate compares against the
        target ciphertext." IT FAILS THE PROVES-TOO-MUCH CHECK. In the m=0
        reference the producing act is "pick the next key", a counter
        increment, which does NOT compute E_K(P); the verifying act does.
        Draft B-0 therefore classifies the reference's two acts as distinct in
        kind, applies element (f)'s charge to the reference, and roughly
        doubles a definitional figure — the very outcome both reviewers
        independently predicted for a wrong reading. THE DEFECT DIAGNOSED: B-0
        drew the boundary between CHOOSING and COMPUTING, when the boundary
        that matters is between WORK ALREADY CHARGED and WORK NOT YET CHARGED.
        Clause B-1 draws it there instead.
      relation_to_what_003_already_closed: >-
        CLAUSE B-1 PRESERVES -003's ALREADY-HELD RESOLUTION OF THE ORIGINAL
        RT-20260831-1166f2 COUNTEREXAMPLE. A partial-key-recovery attack whose
        residual over the unrecovered bits is an ordinary exhaustive
        encrypt-and-compare search performs a full per-candidate AES-k
        evaluation as its production work, so verification is BUNDLED and
        element (f)'s separate charge does not additionally apply — the same
        answer -003 gave and RT-20260901-1af5d9 confirmed closed. The two
        exemplars -003 names, ALGEBRAIC ELIMINATION and SIEVING, are likewise
        re-confirmed rather than displaced: neither performs a full
        per-candidate AES-k evaluation while producing its candidate set, so
        both still carry the separate charge.

  # =====================================================================
  # HOW THIS RECORD APPLIES.
  # =====================================================================
  application: >-
    NO CODE OR DOCUMENT OUTSIDE THIS FILE IS EDITED BY THIS AMENDMENT OR BY
    ANYTHING IT SPECIFIES. CM-1.yaml's committed bytes are unedited and remain
    byte-identical to their BATCH-2b0fd1-committed form;
    protocol-amendment-GOAL-AES-002-003.yaml's committed bytes are unedited and
    remain byte-identical to their BATCH-286bcd-committed form. FROM THIS
    RECORD'S COMMIT AND POST-COMMIT VERIFICATION FORWARD, any cost claim under
    GOAL-AES-002 reads CM-1, protocol-amendment-GOAL-AES-002-001,
    protocol-amendment-GOAL-AES-002-002, protocol-amendment-GOAL-AES-002-003
    AND THIS RECORD TOGETHER as "the frozen cost model as amended", with the
    three sentence fragments named in `superseded_sentences` read subject to
    the numbered clauses of `the_change`. Like -003 and unlike -001, this
    amendment requires NO further applying act: the resolving text is itself
    the complete resolution.

  # =====================================================================
  # WHAT THIS AMENDMENT IS NOT.
  # =====================================================================
  what_this_amendment_is_not:
    - >-
      IT IS NOT A COST CLAIM, A MARGIN, OR AN ASSERTION ABOUT AES AT ANY ROUND
      COUNT. It resolves READING interpretation only — how CM-1's already-frozen
      elements, as already amended by -003, are applied to a hypothetical
      attack — and names no candidate, no mechanism, no margin, no
      distinguisher result and no barrier. It performed ZERO COMPUTE: no
