  approved_by: coordinator
  approved_at: '2026-08-12'
  decision_ref: DEC-20260812-f30c6e

  numbering_note: >-
    FILED AS -002, NOT -001, DELIBERATELY. "protocol-amendment-GOAL-AES-002-001"
