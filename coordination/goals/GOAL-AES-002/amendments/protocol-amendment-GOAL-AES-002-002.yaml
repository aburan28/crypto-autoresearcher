  approval_basis:
    authority: >-
      THE USER, via AskUserQuestion, directly to the Coordinator this session
      (2026-08-12). A single explicit, program-wide instruction to raise
      campaign_budget.maximum_batches by exactly one batch on every currently
      active research goal with a finite (non-null) cap, applied identically
      across the program rather than negotiated goal by goal.
    what_was_authorized: >-
      EXACTLY ONE THING: campaign_budget.maximum_batches 3 -> 4 on
      GOAL-AES-002. Nothing about claim_tier_ceiling, completion_criteria,
      pause_conditions, objective_and_scope, authority_and_review_requirements,
      total_wall_clock_seconds (22500, unchanged), accounting_basis
      (measured_wall_clock_of_completed_tasks, unchanged), max_concurrent (3,
      unchanged), or any hypothesis status is authorized or touched.

  unchanged:
    total_wall_clock_seconds: 22500
    accounting_basis: measured_wall_clock_of_completed_tasks
    max_concurrent: 3
    claim_tier_ceiling: >-
      UNCHANGED per RQ-AES-002's claim_tier_ceiling. No comparison to the
      published state of the art may be asserted in either direction.
    completion_criteria: unchanged
    pause_conditions: >-
      UNCHANGED IN TEXT. The batch-count clause of the pause condition now
      binds at 4 rather than 3.
    objective_and_scope: unchanged
    authority_and_review_requirements: unchanged

  what_this_amendment_is_not:
    - >-
      It is NOT a widening of research scope, claim tier, authority, review
      requirement, completion criterion or pause condition.
    - >-
      It does NOT open a fourth batch or authorize any run.
    - >-
      It does NOT raise total_wall_clock_seconds or max_concurrent.
    - >-
      It asserts NOTHING about AES at any round count.
    - >-
      It is NOT the BLK-1 certificate-vocabulary extension and does not
      substitute for it; that gate remains required before any card is issued
      that could produce a solve.

  confirmatory_status: preserved
  affected_runs: []
