protocol_amendment:
  id: protocol-amendment-GOAL-AES-002-001
  # Filed under the goal rather than under experiments/<EXP-ID>/amendments/ for the
  # same reason as protocol-amendment-GOAL-AES-002-002 and the GOAL-AES-001 series:
  # the protocol being amended is a PROGRAM-LEVEL certificate discipline invoked by a
  # campaign-level blocker, and GOAL-AES-002 has no EXP-* record.
  experiment_id: null
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  scope_of_amendment: >-
    certificate_vocabulary_extension. Adds a `key_recovery` certificate kind to
    docs/claims-and-verification.md and the corresponding accepted-kind change to
    `check_run` in tools/validate_ledger.py, resolving the named infrastructure
    blocker BLK-1 of RQ-AES-002. NOTHING ELSE MOVES: no claim tier, no completion
    criterion, no pause condition, no budget, no scope, no hypothesis status and
    no existing record.
  version_from: null
  version_to: null
  version_note: >-
    NULL, MIRRORING protocol-amendment-GOAL-AES-002-002. This goal record carries
    no version-number scheme, so version_from/version_to have nothing to count
    and are left null rather than invented.

  numbering_note: >-
    THIS IS THE "-001" RESERVED FOR EXACTLY THIS PURPOSE.
    protocol-amendment-GOAL-AES-002-002 was deliberately filed out of
    chronological order as -002 so that -001 would remain available for the BLK-1
    certificate-vocabulary extension, which was already a committed
    forward-reference in ledger/hypotheses/H-AES-8c2d07.yaml and in
    GOAL-AES-002's own next_action text. That reservation is honoured here; the
    forward-references now resolve to the record they promised.

  authored_by_task: TASK-20260810-4a478d
  authored_by_role: coordinator
  authored_at: '2026-08-19'
  authored_at_note: >-
    The task identifier carries 2026-08-10, the date its queue entry, card and
    handoff were recorded. The card was blocked behind TASK-20260810-c1cfd5 until
    the DEF-3 repair completed (DEC-20260810-334c34, DEC-20260815-cd90d4), so it
    is authored on the date stated by this session's runtime context.
  approved_by: coordinator
  approved_at: '2026-08-19'
  decision_ref: null
  decision_ref_note: >-
    NULL BY SCOPE, NOT BY OMISSION, AND THE DISTINCTION IS LOAD-BEARING. Every
    Coordinator decision must persist as a `coordinator_decision` record under
    ledger/decisions/, and this amendment is approved by the Coordinator. But
    TASK-20260810-4a478d's write_scope covers ONLY
    coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol and
    coordination/goals/GOAL-AES-002/amendments, so no ledger/decisions/ file may
    be written by this task. NAMING A DEC IDENTIFIER HERE WOULD BE A FABRICATED
    CITATION: no such record exists, and identifiers are minted with
