  # =====================================================================
  # THE CHANGE, SPECIFIED EXACTLY.
  # =====================================================================
  the_change:
    change_1_certificate_vocabulary:
      path: docs/claims-and-verification.md
      exact_replacement_of_the_enum_line:
        from: 'kind: discrete_log | decomposition | none'
        to: 'kind: discrete_log | decomposition | key_recovery | none'
      exact_block_to_add_to_the_certificate_discipline_yaml_example: |
        # key_recovery: claim that `key` is the AES key producing the named
        # ciphertexts from the named plaintexts, at the named key size and full
        # round count. Full-round only; a reduced-round claim is not this kind.
        key_bits: 128 | 192 | 256
        rounds: 10 | 12 | 14
        statement:
          pairs:                        # >= 2 for 128/192, >= 3 for 256
            - plaintext: <32 hex chars>
              ciphertext: <32 hex chars>
          key: <hex, key_bits/4 chars>
        verified: true
        verifier: independent-recompute-two-implementations
        verifier_detail:
          pycryptodome: {version: <str>, agrees: true}
          openssl_cli: {version: <str>, agrees: true}
        verifier_commit: <git-sha>
      exact_rules_bullet_to_add: >-
        "**`kind: key_recovery`** certifies a claimed AES key recovery. The
        statement names the key size, the round count, the exact
        plaintext/ciphertext pairs and the recovered key. THE VERIFIER RE-ENCRYPTS
        EACH NAMED PLAINTEXT UNDER THE CLAIMED KEY WITH BOTH pycryptodome AND THE
        openssl CLI AND COMPARES AGAINST THE NAMED CIPHERTEXTS, in the run
        wrapper and never in the attack code. Both implementations must agree and
        both must match; a disagreement between them is an instrument failure and
        invalidates the run as `invalid_measurement`, not as a negative
        observation. A certificate proves the SOLVE, never the COST MODEL that
        predicts the attack's cost at scale."
      statement_fields_enumerated_because_the_card_requires_them_exactly:
        - >-
          KEY SIZE. `key_bits`, one of 128, 192, 256. Stated explicitly and never
          inferred from the length of the key string, because an inference is not
          a statement and a truncated key would silently pass.
        - >-
          ROUND COUNT. `rounds`, one of 10, 12, 14, and REQUIRED TO MATCH the key
          size (128/10, 192/12, 256/14). A key_recovery certificate at any other
          round count is not this kind - a reduced-round result belongs to
          RQ-AES-001's ceiling and is cross-filed there (GOAL-AES-002
          non_completion_criteria (iii)).
        - >-
          THE EXACT PLAINTEXT/CIPHERTEXT PAIRS. `statement.pairs`, a list of
          hex-encoded 128-bit blocks, carrying the pairs THE VERIFIER ACTUALLY
          RE-CHECKS, not a pointer to them and not a count of them.
        - >-
          THE RECOVERED KEY. `statement.key`, hex-encoded at the full key length.
      pair_count_requirement: >-
        AT LEAST 2 PAIRS FOR AES-128 AND AES-192, AND AT LEAST 3 FOR AES-256,
        matching CM-1 element (d). The reason is uniqueness, not verification
        strength: two 128-bit pairs impose exactly 256 bits of constraint on a
        256-bit key, which leaves an expected spurious count of about 1 and does
        not pin the key. This is the one place where the certificate schema and
        the cost model must agree, and they are written to agree.
    change_2_validator_check_run:
      path: tools/validate_ledger.py
      function: check_run
      exact_current_text_to_be_replaced: |
        if kind in ("discrete_log", "decomposition"):
            if cert.get("verified") is not True:
                ctx.err(path, f"run claims a {kind} but certificate.verified "
                              f"is not true")
        elif kind != "none":
            ctx.err(path, "run.result.certificate.kind must be one of "
                          "discrete_log|decomposition|none")
      exact_replacement_text: |
        if kind in ("discrete_log", "decomposition", "key_recovery"):
            if cert.get("verified") is not True:
                ctx.err(path, f"run claims a {kind} but certificate.verified "
                              f"is not true")
        elif kind != "none":
            ctx.err(path, "run.result.certificate.kind must be one of "
                          "discrete_log|decomposition|key_recovery|none")
      the_change_in_one_sentence: >-
        ONE STRING ADDED TO THE ACCEPTED-KIND TUPLE AND ONE ERROR MESSAGE UPDATED
        TO MATCH IT. Nothing else in check_run, in validate_ledger.py, or in any
        other tool is touched by this amendment.
      why_the_verified_check_is_reused_rather_than_specialised: >-
        DELIBERATE, AND STATED SO A REVIEWER CAN ATTACK IT. Adding key_recovery
        to the existing tuple gives it the SAME enforcement the other two claim
        kinds already get - a run claiming the kind must carry
        `certificate.verified is True` or the validator errors. Writing a
        bespoke branch that additionally inspected `verifier_detail` was
        considered and NOT specified here, on the ground that this amendment's
        remit is to unblock BLK-1 with the minimum change that is
        provably backward-compatible; a deeper structural check is a separate
        amendment on its own rationale, and is named as a residual below rather
        than smuggled into this one.
    change_3_documentation_echo_found_by_search_not_named_by_BLK_1:
      path: docs/evidence-and-reproducibility.md
      line_as_read: '119'
      exact_current_text: 'kind: discrete_log | decomposition | none'
      exact_replacement_text: 'kind: discrete_log | decomposition | key_recovery | none'
      why_it_is_included: >-
        FOUND BY SEARCH S-6, NOT BY BLK-1, AND INCLUDED BECAUSE LEAVING IT WOULD
        CREATE A DOCUMENTED CONTRADICTION. That file carries a run-manifest
        TEMPLATE echoing the same enum. It is NON-NORMATIVE - no tool reads it,
        and the enforcement lives entirely in check_run - so leaving it stale
        would break nothing mechanically while making two committed documents
        disagree about what a conforming run may emit. THIS IS A DECLARED
        ADDITION TO WHAT THE CARD SPECIFIED, disclosed here rather than
        performed quietly; the card names two files and this amendment names
        three, and the third is a documentation-consistency edit with no
        behavioural effect.

  other_sites_examined_and_declared_out_of_scope:
    - path: tools/port_autolab_experiments.py
      finding: >-
        EMITS `"kind": "none"` for every imported historical run and contains
        prose stating that imported certificates were not re-verified. It does
        NOT constrain or validate the enum.
      ruling: >-
        UNAFFECTED. No edit required or specified. Adding an accepted kind cannot
        change the behaviour of a producer that emits `none`.
    - path: docs/cairn-integration-plan.md
      finding: >-
        A PLAN DOCUMENT mapping this program's two existing certificate shapes to
        external checker shapes, and noting that no cairn example covers
        `decomposition`.
      ruling: >-
        OUT OF SCOPE AND NOT EDITED. It describes an integration that does not
        exist yet; a third certificate shape would give it a third row to plan
        for. RECORDED AS A RESIDUAL FOR THAT PLAN'S OWNER, not as an obligation
        of this amendment, and explicitly NOT a defect in this amendment.
    - path: tools/validate_ledger_baseline.txt
      finding: >-
        The prune-only grandfathering baseline. It lists historical
        `invalid certificate.kind` errors among 680 pre-current-schema run
        manifests.
      ruling: >-
        UNAFFECTED BY THIS AMENDMENT, AND THE REASONING IS RECORDED RATHER THAN
        ASSUMED. A baseline line goes stale only if the record it covers stops
        erroring. Adding `key_recovery` to the accepted set can only stop an
        error on a record whose kind IS `key_recovery`, and search S-4 found ZERO
        such run manifests under experiments/. NO BASELINE LINE IS THEREFORE
        RENDERED STALE, no baseline regeneration is required by this amendment,
        and NO LINE MAY BE ADDED to it under this amendment - the baseline is
        prune-only and regenerating it to absorb a new violation defeats the
        check.
    - path: tools/prerelocation_error_snapshot.txt
      finding: A historical error snapshot.
      ruling: >-
        UNAFFECTED. It is a frozen record of past validator output and is not
        re-evaluated by anything.

  # =====================================================================
  # BACKWARD COMPATIBILITY. THE LOAD-BEARING ARGUMENT.
  # =====================================================================
  backward_compatibility:
    the_claim: >-
      THE CHANGE IS PURELY ADDITIVE AND BACKWARD-COMPATIBLE. NO EXISTING RECORD
      CAN BE INVALIDATED BY IT, AND NO EXISTING RUN, EVIDENCE RECORD OR DECISION
      IS RE-SCORED, RE-GRADED OR WITHDRAWN.
    the_mechanism_not_merely_the_assertion: >-
      STATED AS A MECHANISM BECAUSE THE CARD CALLS THIS ARGUMENT LOAD-BEARING FOR
      REVIEW. check_run has exactly two rejection paths for a certificate kind.
      The first fires for a kind INSIDE the accepted claim set whose `verified`
      is not True; widening the accepted set adds a member and changes nothing
      about the existing members' handling. The second, `elif kind != "none"`,
      fires ONLY for kinds OUTSIDE the accepted set. Widening that set therefore
      strictly SHRINKS the second path's domain and can only ever turn an error
      into a non-error, never the reverse. A record that validates today
      validates after the change, byte for byte, because every input that took a
      non-error path still takes one.
    the_factual_half: >-
      Search S-4 establishes that ZERO run manifests under experiments/ carry
      `kind: key_recovery`, so not even the benign direction of the change - an
      existing record that currently errors and would stop erroring - actually
      occurs. The change is a no-op on every existing record in this repository.
      Search S-7 confirms that the one run manifest matching the token
      `key_recovery` at all carries `kind: none` and mentions the token only
      inside a free-text `reason` string.
    what_is_NOT_claimed_here: >-
      NO CLAIM IS MADE THAT THE CHANGE IS UNTESTED, NOVEL, OR STANDARD. The
      knowledge corpus was unreachable from this session (CM-1
      knowledge_retrieval), and an unavailable index licenses no absence, novelty
      or non-novelty inference in either direction.

  # =====================================================================
  # SCOPE BOUNDARY. STATED PLAINLY RATHER THAN SMUGGLED.
  # =====================================================================
  application:
    files_edited_by_the_authoring_task: none
    the_boundary: >-
      TASK-20260810-4a478d's write_scope is EXACTLY
      coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol and
      coordination/goals/GOAL-AES-002/amendments. IT DOES NOT INCLUDE
      docs/claims-and-verification.md, docs/evidence-and-reproducibility.md OR
      tools/validate_ledger.py, AND NONE OF THOSE THREE FILES WAS EDITED, OPENED
      FOR WRITING, OR ALTERED IN ANY WAY BY THAT TASK. They were READ ONLY, to
      quote their current text verbatim above. AN AMENDMENT THAT EDITS THE
      DOCUMENT IT AMENDS, INSIDE A TASK WHOSE SCOPE EXCLUDES THAT DOCUMENT, IS
      EXACTLY THE SCOPE EXPANSION THE ARCHIVAL VERIFIER EXISTS TO CATCH.
    how_the_edits_are_applied: >-
      IN A SEPARATE DECLARED ACT, dispatched as its own queue task with its own
      budget and its own archival task, whose write_scope covers exactly
      docs/claims-and-verification.md, docs/evidence-and-reproducibility.md and
      tools/validate_ledger.py, and which cites this amendment by id as its
      authority. THAT TASK DOES NOT YET EXIST IN THE BATCH-2b0fd1 QUEUE and is
      not created by this record - creating it is a queue act outside this task's
      write scope. It is named here as the required next step so that no reader
      mistakes a specified edit for an applied one.
    completion_gate_for_the_applying_act:
      - >-
        The three edits are applied by locating the quoted TEXT, never by line
        number.
      - >-
        `python3 tools/validate_ledger.py` is run before and after, and both
        outputs are recorded in the applying task's receipt. A NEW ERROR IS A
        STOP CONDITION, and the additive argument above predicts none.
      - >-
        No line is added to tools/validate_ledger_baseline.txt, which is
        prune-only.
      - >-
        This amendment's `commit` field is bound in a follow-on write once the
        post-commit verifier accepts the commit carrying it.
    until_then: >-
      BLK-1 REMAINS OPEN AND NO CARD THAT COULD PRODUCE A SOLVE MAY BE
      DISPATCHED. RQ-AES-002's pause condition P3 continues to name BLK-1 as a
      live infrastructure blocker. This is infrastructure signal, never a
      negative mathematical result (AGENTS.md rule 5).

  # =====================================================================
  # WHAT THIS AMENDMENT IS NOT.
  # =====================================================================
  what_this_amendment_is_not:
    - >-
      IT IS NOT A CLAIM THAT A KEY RECOVERY EXISTS, IS LIKELY, OR IS APPROACHING.
      It makes a certificate EXPRESSIBLE. Building the vocabulary to record an
      outcome is not evidence about the outcome, and this amendment asserts
      NOTHING about AES at any round count.
    - >-
      IT IS NOT A WIDENING OF THE CLAIM-TIER CEILING. RQ-AES-002 R7 is unchanged:
      the `crypto` tier remains admissible through exactly one gate, a
      re-verified full-round key-recovery certificate, and ANY COST CLAIM STILL
      REACHES `analyzed` AT BEST in this environment. A certificate proves a
      solve is real on the instance solved; it does not validate the cost model
      that predicts the attack's cost at scale.
    - >-
      IT IS NOT A BUDGET ACT, a scope change, a re-prioritisation, or a change to
      any completion criterion or pause condition of GOAL-AES-002.
    - >-
      IT IS NOT RETROACTIVE IN ANY PART. No run, receipt, evidence record,
      decision, queue, knowledge entry or goal checkpoint is altered, re-scored,
      re-graded, re-interpreted or withdrawn.
    - >-
      IT IS NOT AN APPROVAL OF ANY EXPERIMENT, does not change any hypothesis,
      research-question, experiment or goal status, promotes no knowledge, and
      records no attestation and no review verdict.
    - >-
      IT DOES NOT TOUCH ANY GOAL-AES-001 OR GOAL-AES-003 RECORD. The certificate
      vocabulary it extends is program-wide, so other campaigns gain an available
      kind they are free to ignore; none of their records is affected, and
      EV-AES-005 and the GOAL-AES-003 lane in particular are neither read into
      this change nor altered by it.

  residuals_named_rather_than_hidden:
    - id: RES-001-A
      item: >-
        THE VALIDATOR CHECK REMAINS SHALLOW. After this change, check_run
        verifies that a key_recovery run carries `verified: True`. It does NOT
        parse `verifier_detail`, does not confirm that two implementations were
        actually used, and does not check the pair count against the key size.
        A run could therefore declare `verified: True` untruthfully and pass.
      why_it_is_left: >-
        The minimum provably-additive change is the right remit for a blocker
        amendment, and a deeper structural check has its own design questions
        (what to do about historical records, whether to require agreement
        fields, whether to enforce the pair count). NAMED AS OPEN, NOT SOLVED
        HERE, AND NOT CLAIMED AS SOLVED.
      who_it_binds: >-
        The run wrapper and the Executor card that first emits such a
        certificate, which must perform the two-implementation recomputation
        whether or not the validator can see that it did, and the independent
        reviewers, who must check it by reading the run artifacts.
    - id: RES-001-B
      item: >-
        THE `key_recovery` KIND IS SPECIFIED FOR FULL-ROUND AES ONLY, with the
        rounds field constrained to match the key size. A future campaign wanting
        to certify a key recovery on a different primitive, or at a reduced round
        count, needs its own amendment.
      why_it_is_left: >-
        Scoping the kind narrowly is deliberate: a permissive schema would let a
        reduced-round result be recorded under a vocabulary the full-round
        question created, which is precisely the cross-ceiling leak SC-8 and
        GOAL-AES-002 non_completion_criteria (iii) forbid.

