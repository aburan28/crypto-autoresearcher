      - id: S-7
        pattern: key_recovery
        paths: [experiments/EXP-MLKEM-010/runs/RUN-MLKEM-010-001/manifest.yaml]
        mode: content
        matches: 1
        what_it_establishes: >-
          THE ONE RUN-MANIFEST HIT IS NOT A CERTIFICATE KIND. It reads
          `kind: none` with
          `reason: estimate_or_coverage_analysis_no_key_recovery` - the token
