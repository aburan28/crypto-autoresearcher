  # =====================================================================
  # WHAT IS BEING RESOLVED.
  # =====================================================================
  blocker_resolved:
    id: BLK-1
    source: ledger/questions/RQ-AES-002.yaml, constraints, third entry
    statement_as_committed: >-
      NAMED INFRASTRUCTURE BLOCKER BLK-1, WHICH MUST BE RESOLVED BEFORE ANY CARD
      THAT COULD PRODUCE A SOLVE IS DISPATCHED. The certificate vocabulary in
      docs/claims-and-verification.md admits only
      `discrete_log | decomposition | none`, and `check_run` in
      tools/validate_ledger.py errors on any other value, so an AES KEY-RECOVERY
      certificate CANNOT CURRENTLY BE EMITTED by a conforming run record.
      Extending the vocabulary with a `key_recovery` kind (statement: key size,
      round count, the exact plaintext/ciphertext pairs, the recovered key;
      verifier: independent-recompute under two implementations) requires a
      versioned protocol amendment under GOAL-AES-002 BEFORE any such run. This
      is an infrastructure blocker, never a negative mathematical result
      (AGENTS.md rule 5).
    what_this_amendment_does_and_does_not_do_about_it: >-
      STATED PRECISELY, BECAUSE THE TASK TITLE'S PHRASE "resolve BLK-1" IS EASY
      TO OVERREAD. This amendment SPECIFIES the resolution exactly and, on
      commit, is the versioned protocol amendment BLK-1 requires. BLK-1 IS NOT
      DISCHARGED UNTIL BOTH OF THE FOLLOWING HAVE HAPPENED: (i) this record is
      committed by TASK-20260810-f7bc82 and the post-commit verifier accepts it;
      and (ii) the file edits specified below are APPLIED under it in the
      separate declared act described in `application`. Until then a conforming
      run still cannot emit a key_recovery certificate, and no card that could
      produce a solve may be dispatched. A blocker is discharged by the change
      landing, not by the amendment describing it.

  # =====================================================================
  # THE CURRENT STATE, QUOTED RATHER THAN CHARACTERISED.
  # =====================================================================
  current_state:
    accepted_kinds_today:
      - discrete_log
      - decomposition
      - none
    normative_site_1:
      path: docs/claims-and-verification.md
      section: Certificate discipline
      exact_current_text_of_the_enum_line: 'kind: discrete_log | decomposition | none'
      surrounding_block_as_committed: |
        certificate:
          kind: discrete_log | decomposition | none
          # discrete_log: claim that k solves Q = k*P on the named curve
          curve_id: TOY-P<bits>-<hash>
          statement:
            P: [x, y]
            Q: [x, y]
            k: <integer>            # discrete_log
            # decomposition:
            target: [x, y]
            summands: [[x, y], ...]
          verified: true
          verifier: independent-recompute   # NOT the solver's own code path
          verifier_commit: <git-sha>
    normative_site_2:
      path: tools/validate_ledger.py
      function: check_run
      lines_as_read: '540-550'
      exact_current_text: |
        # Certificate discipline (docs/claims-and-verification.md).
        result = body.get("result") or {}
        cert = result.get("certificate") or {}
        kind = cert.get("kind")
        if kind in ("discrete_log", "decomposition"):
            if cert.get("verified") is not True:
                ctx.err(path, f"run claims a {kind} but certificate.verified "
                              f"is not true")
        elif kind != "none":
            ctx.err(path, "run.result.certificate.kind must be one of "
                          "discrete_log|decomposition|none")
      line_number_caveat: >-
        THE LINE NUMBERS ARE AS READ IN THIS WORKING TREE AT AUTHORING TIME AND
        ARE ADVISORY ONLY. tools/validate_ledger.py is edited by other campaigns;
        the applying act MUST locate this block by its TEXT, quoted verbatim
        above, and not by line number. An applying act that trusts a line number
        and edits the wrong block is a foreseeable failure and is foreclosed
        here.

  # =====================================================================
  # R-10 COMPLIANCE. EVERY ABSENCE CLAIM CARRIES ITS EXACT SEARCH.
  # =====================================================================
  recorded_searches:
    why_this_block_exists: >-
      R-10, standing as ruled in DEC-20260818-c52d54: any claim that a value is
      ABSENT from a committed artifact must record the exact search - pattern,
      paths and match count - and must vary its search shape, because a
      separator-free pattern has already produced a false "not found" that both a
      red team and a validator endorsed in this program. Every absence asserted
      in this amendment is backed by an entry below.
    tool_used: >-
      The session's ripgrep-backed content search over the working tree at
      /private/tmp/claude-501/-Volumes-SSD990-crypto-autoresearcher/c016eeee-1f89-4348-9809-2b92fafafa85/scratchpad/aes002-wt,
      branch claude/aes-002-cm1-freeze-20260819. NOT a knowledge-corpus
      retrieval, which was unavailable (see CM-1 knowledge_retrieval).
    searches:
      - id: S-1
        pattern: key_recovery
        paths: [tools/validate_ledger.py]
        mode: count
        matches: 0
      - id: S-2
        pattern: 'key[ _\-]?recover'
        case_insensitive: true
        paths: [tools/validate_ledger.py]
        mode: count
        matches: 0
        why_this_shape: >-
          DELIBERATELY DIFFERENT IN SHAPE FROM S-1, per R-10. It matches
          key_recovery, key-recovery, "key recovery", keyrecovery and every
          capitalisation, so a hit that S-1's exact token would miss is caught.
          Both return zero, from two differently-shaped patterns.
      - id: S-3
        pattern: 'key[ _\-]?recover'
        case_insensitive: true
        paths: [docs/claims-and-verification.md]
        mode: count
        matches: 0
      - id: S-4
        pattern: 'kind:\s*key_recovery'
        paths: [experiments/]
        mode: count
        matches: 0
        what_it_establishes: >-
          NO RUN MANIFEST ANYWHERE UNDER experiments/ CARRIES
          `certificate.kind: key_recovery`. This is the search that supports the
          backward-compatibility argument's factual half, and it is recorded
          because that argument would otherwise rest on an assumption.
      - id: S-5
        pattern: key_recovery
        paths: [repository root, whole working tree]
        mode: count
        matches: 116
        matched_files: 88
        what_it_establishes: >-
          THE TOKEN IS WIDESPREAD IN PROSE AND ABSENT FROM THE TWO NORMATIVE
          FILES, AND BOTH HALVES MATTER. It appears in RQ-AES-002, in
          GOAL-AES-003 and RQ-AES-003, in the BATCH-2b0fd1 cards and handoffs, in
          IDEA records and in review reports - all as a DESCRIPTION OF A KIND
          THAT DOES NOT YET EXIST. That is exactly the condition BLK-1 names.
          RECORDED EXPLICITLY SO THE ZERO COUNTS ABOVE ARE NOT MISREAD as "the
          token appears nowhere".
      - id: S-6
        pattern: 'certificate\.kind|kind: discrete_log|discrete_log \| decomposition|discrete_log\|decomposition'
        paths: [docs/, tools/]
        mode: files_with_matches
        matches: 7
        matched_files:
          - tools/validate_ledger_baseline.txt
          - tools/validate_ledger.py
          - tools/prerelocation_error_snapshot.txt
