  # =====================================================================
  # SCOPE.
  # =====================================================================
  scope_of_amendment: >-
    cm1_element_disambiguation, THIRD ROUND. This amendment supplies operative
    rule text addressed to EXACTLY the reading gaps enumerated in
    `ambiguities_addressed` below: the four constructions the independent red
    team RT-20260901-3ad5d2 established against protocol-amendment-GOAL-AES-002-004
    (OBJ-1, OBJ-2, OBJ-3, OBJ-4), the three substantive defects the independent
    validator TASK-20260903-373afa recorded against -004 and CM-1 while
    classifying the frozen RC-6 panel (DEF-004-1, DEF-004-2, DEF-004-3), and the
    two MEDIUM reading gaps GOAL-AES-002's BATCH-286bcd checkpoint named — CM-1
    element (a) ROUTE 3's undefined "independent" for a fused table-driven
    implementation, and elements (c)/(f)'s under-determined "genuinely distinct
    computational acts" test — which DEC-20260901-d264ea ruled NOT closed by
    -004 (item_dispositions ITEM 1, "REMAINS OPEN"). IT ADDRESSES NOTHING ELSE.
    No claim tier, no completion criterion, no pause condition, no budget, no
    scope, no hypothesis status and no existing record moves. CM-1.yaml's
    committed bytes are NOT edited by this amendment or by anything it
    specifies, and the committed bytes of protocol-amendment-GOAL-AES-002-001,
    -002, -003 and -004 are NOT edited either: this record is a standalone
    superseding amendment read jointly with CM-1 and with -001/-002/-003/-004
    from its own commit forward, per CM-1's own `changed_only_by` clause.
  version_from: null
  version_to: null
  version_note: >-
    NULL, mirroring -001, -002, -003 and -004. This goal record carries no
