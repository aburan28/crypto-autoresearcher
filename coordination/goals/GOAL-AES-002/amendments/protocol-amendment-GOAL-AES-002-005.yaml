      not_edited_by_this_task: true
    how_it_was_used: >-
      AS A CONSTRAINT ON THIS AUTHOR, NOT AS AN INPUT TO BE SATISFIED. Two uses,
      both declared. (1) The panel's freeze predates this text by construction
