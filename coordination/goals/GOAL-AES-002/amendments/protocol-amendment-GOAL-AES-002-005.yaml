      blocks closed every counterexample the first red-team round constructed and
      were then broken by two new counterexamples in the second; -004's blocks
      were broken by four in the third. The same may happen to these, and a defect
      found in them is a specification result requiring a further superseding
      amendment, NOT an edit to this file.
