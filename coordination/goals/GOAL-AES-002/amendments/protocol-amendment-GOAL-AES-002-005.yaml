  # =====================================================================
  # WHAT IS SUPERSEDED. -004 IS NOT EDITED. Its file is untouched.
  # =====================================================================
  supersedes: protocol-amendment-GOAL-AES-002-004
  supersedes_scope: >-
    PARTIAL AND CLAUSE-SCOPED. This amendment supersedes
    protocol-amendment-GOAL-AES-002-004 ONLY in the clauses enumerated in
    `superseded_clauses` below, and ONLY in the sense that from this record's
    commit forward those clauses are read SUBJECT TO the numbered clauses of
    `the_change`. Their own words are unchanged and -004's file is unedited.
    Everything else in -004 stands exactly as committed and is untouched here —
    in particular CLAUSE A-1 (the level at which N and X are counted) is NOT
    reopened, NOT re-scored and NOT perturbed by any clause here; it is the one
    clause of -004 that both the independent validator of BATCH-241d37 (VAL J3,
    executed as code over six inputs, single-valued and implementation-invariant
    on all six) and the red team that broke the rest of the block
    (RT-20260901-3ad5d2 OBJ-2, "Clause A-1 buys INVARIANCE UNDER IMPLEMENTATION
    TECHNIQUE, which is real") record as holding, and this amendment builds on
    it rather than replacing it. -003's `item_3_element_d_two_axis_sublattice`
    and `item_4_elements_b_c_distinguisher_bridge` are likewise NOT reopened.
  superseded_clauses:
    - superseded_id: SUP-005-A2
      located_in: >-
        protocol-amendment-GOAL-AES-002-004.the_change.item_1_gap_a_definition_of_independent.resolving_text_verbatim,
        clause A-2 including its two limbs (i) and (ii)
      quoted_verbatim_from_004: >-
        an operation is INDEPENDENT of the S-box route IF AND ONLY IF THE ATTACK
        ALGORITHM'S OWN SPECIFICATION-LEVEL DESCRIPTION REQUIRES ITS RESULT —
        that is, the attack consumes the output of that ShiftRows, MixColumns or
        other bytewise operation, so that an algorithm not performing it would
        not compute what this attack computes
      how_it_is_now_read: >-
        Unchanged in its words and NOT AN OPERATIVE TEST from this record's
        commit forward. Clause A5-3 below replaces it. A-2 survives as
        descriptive gloss only, and where it and clause A5-3 could be read to
        differ, CLAUSE A5-3 GOVERNS. Its limb (ii) — that a discarded
        implementation by-product is not independent and carries no charge — is
        preserved in substance by clause A5-3's closing sentence on fused
        implementations, which reaches the same result from clause A-1 instead.
    - superseded_id: SUP-005-A3i
      located_in: >-
        protocol-amendment-GOAL-AES-002-004.the_change.item_1_gap_a_definition_of_independent.resolving_text_verbatim,
        clause A-3(i)
      quoted_verbatim_from_004: >-
        reading bytes already computed and already charged, in a different
        order, performing no bytewise arithmetic on them
      how_it_is_now_read: >-
        Unchanged in its words; its antecedent is EXTENDED, never narrowed, by
        clause A5-2 below, which states the qualifying byte origins as a closed
        list of three. A-3(i)'s exclusion of MixColumns from the rider
        ("MixColumns NEVER qualifies for this rider") is unchanged and is not
        touched.
    - superseded_id: SUP-005-B1
      located_in: >-
        protocol-amendment-GOAL-AES-002-004.the_change.item_2_gap_b_the_bundling_test.resolving_text_verbatim,
        clause B-1
      quoted_verbatim_from_004: >-
        Element (f)'s separate N-verification-unit charge applies to a candidate
        set of size N IF AND ONLY IF THE WORK ALREADY CHARGED FOR PRODUCING THAT
        SET DOES NOT ITSELF INCLUDE, FOR EACH CANDIDATE IN IT, A FULL EVALUATION
        OF AES-k ON A TARGET PLAINTEXT FROM THE ATTACK'S OWN ELEMENT (d) DATA
        UNDER THAT CANDIDATE KEY
      how_it_is_now_read: >-
        REPLACED AS THE OPERATIVE TEST by clause B5-1 below. B-1's declaration
        that procedural separation is not the test and never triggers the charge
        is PRESERVED and restated in B5-1; its enumeration of partial forms
        ("one round, a truncated computation, an algebraic or statistical
        constraint check, a table match, a filter on a subset of the state") is
        no longer an operative list, because B5-1 does not ask what kind of
        computation was performed. Where B-1 and B5-1 could be read to differ,
        CLAUSE B5-1 GOVERNS.
    - superseded_id: SUP-005-B2
      located_in: >-
        protocol-amendment-GOAL-AES-002-004.the_change.item_2_gap_b_the_bundling_test.resolving_text_verbatim,
        clause B-2, first limb only
      quoted_verbatim_from_004: >-
        it is levied on the SURVIVORS of the LAST production stage that does not
        include a full per-candidate AES-k evaluation — N is that survivor count
        — and NEVER on candidates eliminated at or before that stage
      how_it_is_now_read: >-
        REPLACED AS THE OPERATIVE RULE by clause B5-3 below. B-2's SECOND limb —
        what "bundled" MEANS, by reference to element (d)'s `relation_to_R1`
        clause — is NOT superseded, is unchanged, and continues to fix the
        magnitude of a verification unit. Where B-2's first limb and clause B5-3
        could be read to differ, CLAUSE B5-3 GOVERNS.
    - superseded_id: SUP-005-B4
      located_in: >-
        protocol-amendment-GOAL-AES-002-004.the_change.item_2_gap_b_the_bundling_test.resolving_text_verbatim,
        clause B-4
      quoted_verbatim_from_004: >-
        which stage was found to contain — or not to contain — a full
        per-candidate AES-k evaluation
      how_it_is_now_read: >-
        This binary disclosure field is REPLACED by the numeric disclosures of
        clause B5-4 below, for the reason RT-20260901-3ad5d2 OBJ-3 states: there
        is a construction that cannot fill it honestly in either value. B-4's
        remaining requirements (stage decomposition, survivor counts) are
        retained and restated with a determinate individuation rule. B-4's
        inadmissibility consequence is unchanged.
  clause_B3_is_not_superseded: >-
    STATED EXPLICITLY BECAUSE IT IS LOAD-BEARING BELOW. -004's clause B-3 —
    stage-by-stage decomposition, each stage charged under whichever element
    governs its own operation type, the prohibition on relabelling a final
    full-evaluation pass as the candidate-generation mechanism, and the
    prohibition on charging the N-verification-unit term more than once for
    the same candidate set — is NOT superseded. Its two prohibitions are
    carried forward unchanged and clause B5-3 relies on the second of them.

  # =====================================================================
  # THE GAPS THIS AMENDMENT ADDRESSES. Each names its source finding.
  # =====================================================================
  ambiguities_addressed:
    - id: AMB-7
      continues_series_note: >-
        Continues -003's AMB-1..AMB-4 and -004's AMB-5..AMB-6. AMB-7..AMB-12 are
        NEW ambiguities constructed by independent reviewers AGAINST -004's own
        text; they are not restatements of AMB-1..AMB-6.
      element: (a) UNIT — no precedence rule between -004's clauses A-2 and A-3(i)
      source: RT-20260901-3ad5d2 objections[0] (OBJ-1), severity MEDIUM_HIGH
      what_is_ambiguous: >-
        A-2 makes every operation whose result the attack requires INDEPENDENT.
        A-3(i) exempts a fixed data-independent byte-position permutation applied
        by indexing alone to bytes "already computed and already charged". For an
        attack that relabels RECEIVED element (d) input bytes, both clauses apply
        and A-3(i)'s antecedent is literally unmet, and -004 states no precedence
        anywhere in A-1..A-4 although B-1 carries an explicit precedence sentence
        for its own conflict case. The two readings differ by "determinate AEU-k
        figure" versus "UNADJUDICABLE".
      addressed_by: [A5-1, A5-2]
    - id: AMB-8
      element: (a) UNIT — clause A-2's two halves are not equivalent
      source: RT-20260901-3ad5d2 objections[1] (OBJ-2), severity HIGH
      what_is_ambiguous: >-
        A-2's first half is INTENSIONAL (does THIS description consume the
        result). Its "that is" gloss is EXTENSIONAL (would an algorithm not
        performing it compute the same function). The linear layer is invertible,
        so any downstream predicate can be pulled back through it at
        specification time; under the extensional reading no linear-layer
        operation is ever independent and ROUTE 3's bar excludes nothing. Under
        the intensional reading two specifications of the same function with
        identical N and identical X receive opposite verdicts. No dishonest
        description is required for either.
      addressed_by: [A5-3, A5-4]
    - id: AMB-9
      element: (c)/(f) — clause B-1 supplies no rule for a data-dependent early-aborted evaluation
      source: RT-20260901-3ad5d2 objections[2] (OBJ-3), severity MEDIUM_HIGH
      what_is_ambiguous: >-
        B-1 asks whether the charged production work "includes a full evaluation"
        and disambiguates by a list of STATICALLY partial computations. An
        evaluation the specification states in full but which terminates early on
        data is in neither category, and B-1 does not say whether "includes a
        full evaluation" is a property of the SPECIFIED operation or of the
        EXPECTED WORK CHARGED. The two readings differ by the entire
        N-verification term, in the direction of a smaller total.
      addressed_by: [B5-1, B5-3, B5-4]
    - id: AMB-10
      element: (c)/(f) — nothing in -004 individuates a "stage"
      source: RT-20260901-3ad5d2 objections[3] (OBJ-4), severity MEDIUM
      what_is_ambiguous: >-
        B-2 levies the charge on the survivors of "the LAST production stage that
        does not include a full per-candidate AES-k evaluation" and B-3
        decomposes a pipeline "STAGE BY STAGE", but no clause says what
        individuates a stage. A single-loop hybrid with a filter and a test in
        one loop body is one stage or two depending on the reader, and the two
        readings differ by exactly the additive survivor-count term that AMB-6
        stated it was closing. The quantity is unchanged; only the word that
        fails to determine it moved, from "distinct" to "stage".
      addressed_by: [B5-2, B5-3, B5-4]
    - id: AMB-11
      element: (c)/(f) — clauses B-1 and B-2 give different answers for a two-phase attack
      source: >-
        VAL-20260904-373afa defects_found DEF-004-3, evidenced by PVF-1 (a blind
        reader's SEPARATE_CHARGE_APPLIES against -004's own committed BUNDLED,
        on one of the two panel items RC-6 designated pass-capable) and PVF-2
        (-004's m=0 proves-too-much check cannot reach the clause the
        disagreement turns on).
      what_is_ambiguous: >-
        For an attack with a genuinely two-phase pipeline, B-1 applied to the
        candidate set and B-2's survivor-boundary rule select different answers,
        because -004 never says WHICH SET element (f)'s charge and B-1's test are
        applied to, and because the words "production" and "verification" do the
        work of the distinction without being defined against each other. The
        clauses are not reconciled anywhere in -004's text.
      addressed_by: [B5-1, B5-3]
    - id: AMB-12
      element: (a) UNIT — "bytewise operation" is undefined and A-2's iff is stated over it
      source: >-
        VAL-20260904-373afa defects_found DEF-004-1, severity "substantive,
        open", with the note that -003 carries the same defect in its closing
        catch-all so it is inherited rather than introduced by -004.
      what_is_ambiguous: >-
        Read literally, an iff stated over an undefined "bytewise operation"
        makes ANY operation whose result the attack requires independent and
        inadmissible — including the accept test or statistical predicate every
        attack must perform — which would leave ROUTE 3 empty. The escape is to
        read the term as cipher-structural work only, which no committed text
        says.
      addressed_by: [A5-4]
    - id: AMB-5-REOPENED
      element: (a) UNIT — the fused table-driven implementation, MEDIUM reading gap 1 of the BATCH-286bcd checkpoint
      source: >-
        GOAL-AES-002 `next_action_batch_286bcd_closed_20260901` item (1), first
        limb, quoting DEC-20260901-1fc2f5; originally RT-20260901-1af5d9
        objections[0]; carried as -004's AMB-5.
      status_note: >-
        -004 stated it closed AMB-5. DEC-20260901-d264ea item_dispositions ITEM 1
        ruled otherwise: "what is NOT accepted is its `scope_of_amendment` claim
        to close AMB-5 and AMB-6 ... AMB-5 and AMB-6 are therefore NOT closed".
        It is therefore restated here as an addressed gap rather than an
        inherited closure.
      addressed_by: [A5-3, A5-4]
    - id: AMB-6-REOPENED
      element: (c)/(f) — "genuinely distinct computational acts", MEDIUM reading gap 2 of the BATCH-286bcd checkpoint
      source: >-
        GOAL-AES-002 `next_action_batch_286bcd_closed_20260901` item (1), second
        limb; originally RT-20260901-1af5d9 objections[1] and, independently,
        VAL TASK-20260901-4c225b finding F-VAL4c225b-3; carried as -004's AMB-6.
      status_note: >-
        As AMB-5-REOPENED. -004 replaced the phrase with a full-evaluation test
        and DEC-20260901-d264ea recorded the break as having RELOCATED into that
        replacement rather than being closed.
      addressed_by: [B5-1, B5-2, B5-3, B5-4]

  # =====================================================================
  # THE CHANGE — TWO RESOLVING-TEXT BLOCKS. THE TEXT UNDER
  # `resolving_text_verbatim` IS THE OPERATIVE RULE TEXT AND IS WHAT A
  # LATER RECORD QUOTES AND APPLIES. NO WORKED EXAMPLE APPEARS IN IT.
  # =====================================================================
  the_change:
    item_1_a_block_route_3_admissibility:
      addresses: [AMB-7, AMB-8, AMB-12, AMB-5-REOPENED]
      supersedes_clauses: [SUP-005-A2, SUP-005-A3i]
      resolving_text_verbatim: >-
        CLAUSE A5-0 — PRECEDENCE OF THIS BLOCK. Clauses A5-1 to A5-5 are read
        jointly with CM-1 element (a), with protocol-amendment-GOAL-AES-002-003's
        ADMISSIBLE CONVERSION ROUTE 3 text, and with
        protocol-amendment-GOAL-AES-002-004's clauses A-1, A-3 and A-4, whose
        words are unchanged. Where a clause of this block and clause A-2 of -004
        could be read to give different answers, THE CLAUSE OF THIS BLOCK
        GOVERNS; clause A-2 is no longer an operative test and survives as
        descriptive gloss only. CLAUSE A-1 IS NOT REOPENED and continues to fix
        the level at which the attack's operations are counted: N and X are
        counts of specification-level operations of the attack algorithm, not of
        machine instructions, memory accesses, table lookups, register
        operations, cache lines or gates, and the classification is invariant
        under implementation technique.
        CLAUSE A5-1 — WHICH CLAUSE READS WHICH OPERATION. Clause A-3 names
        exactly two classes of operation and no others: (i) a fixed,
        data-independent permutation of byte positions applied by indexing
        alone, and (ii) a table access. AN OPERATION FALLING IN EITHER CLASS IS
        CLASSIFIED BY CLAUSE A-3 ALONE, and no other clause of this block or of
        -004 is applied to it. Every operation falling in neither class is
        classified by clause A5-3. THIS ROUTING IS UNCONDITIONAL: it does not ask
        whether two clauses in fact differ, and no reader is required to form a
        view about that.
        CLAUSE A5-2 — THE ANTECEDENT OF A-3(i), AS A CLOSED LIST OF BYTE
        ORIGINS. Clause A-3(i)'s phrase "reading bytes already computed and
        already charged" names exactly the following three byte origins and no
        others. A byte qualifies if it is (alpha) a byte the attack received as
        its own element (d) data; or (beta) a byte the attack computed by an
        operation already counted in N under ADMISSIBLE CONVERSION ROUTE 1 or in
        X under ADMISSIBLE CONVERSION ROUTE 3; or (gamma) a byte obtained from a
        byte of origin (alpha) or (beta) by a further permutation itself
        qualifying under clause A-3(i) as extended here. A byte of no such origin
        does not qualify, clause A-3(i) does not reach the operation, and the
        operation is classified by clause A5-3 instead. Origin (gamma)
        terminates, because an attack's specification is finite and each
        application consumes a byte that already qualifies. A-3(i)'s exclusion of
        MixColumns from the rider is unchanged: MixColumns NEVER qualifies,
        whatever the origin of the bytes it consumes.
        CLAUSE A5-3 — WHAT THE ROUTE 3 BAR TESTS, REPLACING CLAUSE A-2. An
        operation TRIGGERS ROUTE 3's BAR IF AND ONLY IF ALL THREE OF THE
        FOLLOWING HOLD: (1) it is a CIPHER-STRUCTURAL BYTEWISE OPERATION as
        clause A5-4 defines that term by closed enumeration; (2) THE ATTACK
        ITSELF PERFORMS IT, at the specification level clause A-1 fixes, at any
        point in the attack, INCLUDING AS PRECOMPUTATION AND INCLUDING THE
        CONSTRUCTION OF ANY CONSTANT THE ATTACK COMPUTES FOR ITSELF; and (3) its
        cost is counted NEITHER in N under ROUTE 1 NOR in X under ROUTE 3. Where
        the bar fires, the claim is INADMISSIBLE under ROUTE 3 and is recorded as
        UNADJUDICABLE, exactly as before. THREE READINGS ARE EXPRESSLY NOT TESTS
        UNDER THIS MODEL, AND NO CLAUSE OF THIS MODEL IS TO BE READ AS MAKING ANY
        OF THEM ONE: whether the attack's description REQUIRES the operation's
        result; whether an algorithm not performing the operation would compute
        the same function as this attack; and whether some other specification of
        the same function would avoid the operation. An operation the attack does
        not perform is not charged and does not fire the bar, however it is
        described; an operation the attack does perform fires the bar unless its
        cost is counted, however the description characterises it. OPERATIONS
        BELONGING TO THE AES SPECIFICATION AS GIVEN — the S-box table, Rcon, the
        MixColumns matrix and the round structure themselves — ARE NOT PERFORMED
        BY THE ATTACK and are not counted against it; an operation the attack
        applies in order to compute a value of its own IS performed by the
        attack, whether it is applied once at specification time or once per
        candidate. NO MATERIALITY THRESHOLD APPLIES: ROUTE 3 is by its own
        committed text "an exact additional charge, not a threshold below which
        auxiliary work is ignored", so a bounded or one-time count of uncounted
        cipher-structural operations is not excused by its size, and nothing here
        converts such a count into AEU-k. FUSED IMPLEMENTATIONS, STATED SO THEY
        ARE NOT IMPROVISED: an operation occurring only in the machinery by which
        an implementation realises an operation the attack does perform, and
        appearing nowhere in the attack's specification-level description, is NOT
        performed by the attack for the purpose of this clause; clause A-1's
        invariance under implementation technique governs and is not weakened
        here, and no implementation technique — plain byte-oriented, table-driven
        or fused T-table, bitsliced, or hardware round instruction — is by itself
        either admissible or inadmissible.
        CLAUSE A5-4 — CIPHER-STRUCTURAL BYTEWISE OPERATION, BY CLOSED
        ENUMERATION. A CIPHER-STRUCTURAL BYTEWISE OPERATION is exactly one of the
        following six, AND NOTHING ELSE IS ONE: (1) an S-box (SubBytes)
        application, or an inverse S-box application; (2) a ShiftRows
        byte-position permutation, or its inverse; (3) a MixColumns column
        transformation, or its inverse; (4) an AddRoundKey byte-XOR; (5) a
        key-schedule operation, namely RotWord, SubWord, or an Rcon XOR; (6) a
        table access. Items (1) to (5) are read by their FIPS-197 definitions,
        and a step computing the same function as one of those five named maps IS
        an instance of it however it is written, decomposed or renamed; THIS IS A
        QUESTION ABOUT FIVE FULLY SPECIFIED MAPS AND IS NEVER A QUANTIFICATION
        OVER ALGORITHMS COMPUTING THE ATTACK'S OWN FUNCTION. Item (6) is routed
        to clause A-3(ii) by clause A5-1 and is decided there. CONSEQUENTLY AND
        EXPRESSLY: a comparison of computed bytes against a constant or a set
        fixed at specification time, a counter increment, loop control, candidate
        bookkeeping, and the evaluation of a statistical or algebraic predicate
        that itself performs none of (1) to (6), ARE NOT cipher-structural
        bytewise operations, do NOT fire ROUTE 3's bar, and are NOT made
        admissible, convertible or free by this clause. THIS IS NOT A RULING THAT
        SUCH WORK IS FREE: it is charged, or left unconverted, exactly as CM-1
        already leaves it; O-CM1-1, the materiality threshold, REMAINS OPEN;
        O-CM1-3 REMAINS OPEN; and no operation count of any kind is converted
        into AEU-k by anything in this block.
        CLAUSE A5-5 — DISCLOSURE, EXTENDING CLAUSE A-4(i). Clause A-4(i)'s
        required inventory is stated as a COUNT PER KIND over clause A5-4's six
        kinds, and it covers the attack's whole execution, INCLUDING every
        instance performed as precomputation or in constructing a constant the
        attack computes for itself, each such instance stated separately from the
        per-candidate counts. A claim omitting a per-kind count, or stating a
        run-time inventory only, is INADMISSIBLE under this model on clause A-4's
        existing ground and its figure is not evidence. THIS IS A PROSPECTIVE
        NARROWING AND IS DECLARED AS ONE: it creates no new KIND of defect, but a
        claim that would have satisfied clause A-4 with a run-time inventory
        alone no longer does.

      clause_records:
        - clause_id: A5-0
          what_it_does: >-
            States precedence over clause A-2 by naming clause identifiers, and
            restates that clause A-1 is not reopened.
          addresses: [AMB-7, AMB-8]
          panel_specs_this_clause_is_addressed_to:
            note: >-
              THESE ARE THE FROZEN PANEL SHAPES THE CLAUSE IS AIMED AT. NO
              VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-01, SPEC-02, SPEC-03, SPEC-06, SPEC-07]
          what_it_is_claimed_to_fix: >-
            The absence, recorded by OBJ-1, of any precedence sentence in
            A-1..A-4 where clause B-1 carries one for its own conflict case.
          relocation_argument: >-
            REQUIRED FIELD. A precedence clause whose operands are CLAUSE
            IDENTIFIERS introduces no predicate a reader must interpret, so it
            has nowhere to relocate an ambiguity to: its whole content is an
            ordering over a two-item list of names that already exist in
            committed text. The one interpretive phrase it does contain — "could
            be read to give different answers" — is quoted from clause B-1's own
            committed precedence sentence and is NOT load-bearing here, because
            clause A5-1 states the routing unconditionally and a reader who never
            forms a view about whether the clauses differ still reaches a
            verdict.
        - clause_id: A5-1
          what_it_does: >-
            Routes every operation to exactly one deciding clause by membership
            in a closed two-item list quoted from clause A-3.
          addresses: [AMB-7]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-01, SPEC-08]
          what_it_is_claimed_to_fix: >-
            OBJ-1's split, in which two clauses both apply to one operation and
            nothing says which governs.
          relocation_argument: >-
            REQUIRED FIELD. The routing predicate is membership in a list of TWO
            classes that clause A-3 already individuates and that this clause
            enumerates rather than describes. Relocation would require a third
            class, or a class whose membership is undetermined; the clause states
            "and no others", so a third class cannot arise, and the two
            memberships are decided by antecedents that exist in committed text
            and are made determinate here — A-3(i)'s by clause A5-2's closed
            origin list, A-3(ii)'s by its own committed one-application-per-access
            correspondence test, which is a count. The ambiguity therefore has no
            new word to move into: the clause adds no term of its own.
        - clause_id: A5-2
          what_it_does: >-
            Replaces one antecedent phrase of A-3(i) with a closed list of three
            byte origins, EXTENDING the clause's reach and narrowing nothing.
          addresses: [AMB-7]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-01]
          what_it_is_claimed_to_fix: >-
            OBJ-1's second limb: that the bytes an ordinary last-round key-guessing
            attack relabels are element (d) inputs, which are neither "already
            computed" nor "already charged", so A-3(i)'s antecedent is literally
            unmet and the reader falls back to A-2. RC-2's stated repair
            direction, adopted.
          relocation_argument: >-
            REQUIRED FIELD. Each of the three origins has a referent fixed in
            committed text that is NOT this amendment's: (alpha) is CM-1 element
            (d)'s data, which element (d) defines in kind and count; (beta) is
            "counted in N under ROUTE 1 or in X under ROUTE 3", which are declared
            numbers in the claim itself; (gamma) is a recursive application of
            A-3(i) as extended, and it terminates because an attack specification
            is finite and each step consumes an already-qualified byte. The list
            is closed by an explicit "a byte of no such origin does not qualify",
            so a byte of unlisted origin does not create an undetermined case: it
            routes to clause A5-3, which is total. The residual risk is NOT a
            relocation but a disclosure risk that pre-exists this clause — an
            attack must state truthfully where its bytes come from — and it is
            carried in `limitations`, where -004's own limitation L4 already
            located it, and not claimed closed.
        - clause_id: A5-3
          what_it_does: >-
            Replaces clause A-2's semantic test with a three-limb test on what
            the attack performs and whether its cost is counted; expressly
            disqualifies the requirement reading, the counterfactual-algorithm
            reading and the alternative-specification reading.
          addresses: [AMB-8, AMB-5-REOPENED]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-02, SPEC-03, SPEC-06, SPEC-07]
          what_it_is_claimed_to_fix: >-
            OBJ-2, by removing BOTH halves of A-2 from the operative test rather
            than choosing between them, so the intensional/extensional split has
            no clause left to live in; and AMB-5's fused case, by deciding it
            from clause A-1's level rule rather than from a definition of
            "independent".
          relocation_argument: >-
            REQUIRED FIELD, AND THE MOST IMPORTANT ONE IN THIS RECORD. The test's
            three limbs turn on: (1) membership in clause A5-4's closed
            enumeration; (2) "the attack performs, at the specification level
            clause A-1 fixes"; (3) "counted in N or in X", which are declared
            numbers. Limb (2) is the only term that is not new-and-closed or a
            number, AND IT IS NOT NEW: it is clause A-1's own term, committed
            since -004, and it is the one clause of -004's A block that BOTH
            independent reviews record as holding — the BATCH-241d37 validator
            executed A-1 as code over six inputs and found it single-valued and
            implementation-invariant on all six (VAL J3), and the red team that
            broke the rest of the block states in its own OBJ-2 that "Clause A-1
            buys INVARIANCE UNDER IMPLEMENTATION TECHNIQUE, which is real". SO
            THE TEST IS NOT RELOCATED ONTO A NEW UNDETERMINED WORD; IT IS
            RELOCATED ONTO AN EXISTING TERM THAT HAS ALREADY SURVIVED AN
            ADVERSARIAL ROUND. Two further guards close the routes by which the
            ambiguity might still move. First, the extensional escape is
            foreclosed BY NAME: the clause states that the counterfactual-algorithm
            reading and the alternative-specification reading are not tests, so a
            pullback rewriting cannot be argued from any clause of this model.
            Second, the materiality escape is foreclosed by quotation from -003's
            own committed ROUTE 3 sentence, so "the operation is too small to
            matter" is not available either. WHAT REMAINS, AND IS NOT CLAIMED
            CLOSED: an attack description that is honest about what it performs
            is presupposed. That is -004's own limitation on clause A-2, it is
            carried forward in `limitations`, and it is a disclosure problem
            rather than an ambiguity in the rule — a red team should attack
            exactly there again.
        - clause_id: A5-4
          what_it_does: >-
            Defines "cipher-structural bytewise operation" by a closed
            six-item enumeration and states what is expressly outside it.
          addresses: [AMB-12, AMB-8]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-01, SPEC-06, SPEC-07, SPEC-08]
          what_it_is_claimed_to_fix: >-
            DEF-004-1: an iff stated over an undefined "bytewise operation",
            whose literal reading empties ROUTE 3 and whose escape reading is
            stated nowhere. The defect is INHERITED from -003's closing
            catch-all, as the validator records, and is addressed here for both.
          relocation_argument: >-
            REQUIRED FIELD. The definition is an enumeration closed by an
            explicit "and nothing else is one", over five maps that FIPS-197
            specifies completely plus one term ("table access") already used
            operatively by committed clause A-3(ii). The one extensional sentence
            the clause does contain — that a step computing the same function as
            one of the five named maps IS an instance of it — is bounded in a way
            A-2's gloss was not, and the distinction is stated in the clause
            itself: deciding whether a step computes ShiftRows is a question about
            ONE fully specified map, whereas A-2's gloss quantified over ALL
            algorithms computing the attack's own function. A finite question
            about five fixed maps cannot relocate into an unbounded search, and
            its error direction is against the claimant, since a decomposed or
            renamed instance still counts. The clause also states in terms that
            excluding an operation from the enumeration is NOT a ruling that it is
            free, so nothing is laundered out through the exclusion: O-CM1-1
            remains open and is named in the clause text itself.
        - clause_id: A5-5
          what_it_does: Disclosure only. Adds no test and decides no verdict.
          addresses: [AMB-8, AMB-12]
          panel_specs_this_clause_is_addressed_to:
            note: >-
              NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT. This clause
              is addressed to no panel item in particular; every panel item is a
              declared verbatim PREFIX and none purports to reproduce a whole cost
              claim's disclosure text, so no panel item can exercise it.
            specs: []
          what_it_is_claimed_to_fix: >-
            That clause A5-3's limb (2) is checkable only if precomputation and
            specification-time constant construction are disclosed, which clause
            A-4(i)'s "performs" does not clearly reach.
          relocation_argument: >-
            REQUIRED FIELD. A disclosure clause can relocate an ambiguity only if
            the thing it requires to be disclosed is itself undetermined. What it
            requires is a count per kind over clause A5-4's closed six-item list,
            plus the separation of precomputation instances from per-candidate
            instances — and CM-1 element (f) already individuates precomputation
            and already charges it in full without amortisation, so the boundary
            is not introduced here. It creates no new ground of inadmissibility;
            it widens the reach of clause A-4's existing ground, which is declared
            in the clause text as a prospective narrowing.

    item_2_b_block_element_f_separate_charge:
      addresses: [AMB-9, AMB-10, AMB-11, AMB-6-REOPENED]
      supersedes_clauses: [SUP-005-B1, SUP-005-B2, SUP-005-B4]
      resolving_text_verbatim: >-
        CLAUSE B5-0 — PRECEDENCE OF THIS BLOCK. Clauses B5-1 to B5-4 are read
        jointly with CM-1 elements (b), (c), (d) and (f) and with
        protocol-amendment-GOAL-AES-002-004's clause B-3, whose words are
        unchanged and whose two prohibitions — that a pipeline may not escape the
        charge by relabelling its final full-evaluation pass as the
        candidate-generation mechanism, and that the verification term may not be
        charged more than once for the same candidate set — are carried forward
        and relied on below. Where a clause of this block and clause B-1, B-2 or
        B-4 of -004 could be read to give different answers, THE CLAUSE OF THIS
        BLOCK GOVERNS. CLAUSE B-2's SECOND LIMB IS NOT SUPERSEDED and continues
        to fix what "bundled" means and what a verification unit costs: one
        evaluation per candidate against the first element (d) pair, with
        confirmation against the remaining element (d) pairs costing a further
        AEU-k only for the candidates that survive the first, of which there is
        on average about one. This block decides WHETHER the separate charge
        applies and TO WHICH SET, and it changes no magnitude.
        CLAUSE B5-1 — THE OPERATIVE TEST IS AN INEQUALITY BETWEEN TWO DECLARED
        NUMBERS, REPLACING CLAUSE B-1. Element (f)'s separate verification charge
        APPLIES to a candidate set IF AND ONLY IF THE TOTAL COST THE CLAIM
        ALREADY CHARGES FOR WORK PERFORMED PER MEMBER OF THAT SET IS LESS THAN
        ONE AEU-k PER MEMBER. Where the claim already charges AT LEAST one AEU-k
        per member of the set, verification is ALREADY BUNDLED for that set and
        no separate charge applies to it. THE TEST IS THE NUMBER ON THE BILL, PER
        MEMBER OF THE SET, AND NOTHING ELSE. It is not the sentence describing
        the operation; it is not whether the specification says to evaluate AES-k;
        it is not whether an evaluation runs to completion or terminates early on
        data; it is not whether the work is called production or called
        verification; and it is not whether the mechanism is written as one loop
        or several, one pass or several, one function or several. A claim whose
        SPECIFIED per-candidate operation is a full AES-k evaluation but whose
        CHARGED expected cost per member of the set is less than one AEU-k does
        NOT bundle verification, and the separate charge applies. A claim
        charging at least one AEU-k per member bundles, whatever it calls the
        work. PROCEDURAL SEPARATION IS NOT THE TEST AND NEVER TRIGGERS THE
        CHARGE, exactly as clause B-1 already ruled.
        CLAUSE B5-2 — STAGE BOUNDARIES, INDIVIDUATED OPERATIONALLY. A STAGE
        BOUNDARY of an attack exists at every point in its candidate pipeline at
        which THE CANDIDATE COUNT STRICTLY DECREASES, and at no other point. The
        boundaries of an attack are therefore fixed by its own declared candidate
        counts and not by the arrangement of its text: one loop or several, one
        function or several, fused or separated, makes no difference, and no
        reader is asked to decide what a stage is. The SURVIVOR SET at a boundary
        is the candidate set immediately after the decrease. An attack whose
        candidate count never strictly decreases has no stage boundary and
        exactly one stage. THIS CLAUSE IS AN INPUT TO THE DISCLOSURE OF CLAUSE
        B5-4 AND IS NOT AN INPUT TO THE CHARGE: clause B5-1's test does not
        depend on where a stage boundary falls, and no verdict under this block
        turns on the word "stage".
        CLAUSE B5-3 — WHICH SETS THE TEST IS APPLIED TO. A VERIFYING TEST is an
        operation the attack performs per candidate that EVALUATES THE AES-k
        ENCRYPTION FUNCTION, WHOLLY OR IN PART, UNDER THAT CANDIDATE KEY ON A
        PLAINTEXT OR CIPHERTEXT FROM THE ATTACK'S OWN ELEMENT (d) DATA, and
        retains or discards the candidate on a comparison involving the result.
        An evaluation that terminates before completion, for any reason including
        a data-dependent early abort, IS a verifying test; so is a comparison
        against a stored partial value. An operation that evaluates no part of
        AES-k under the candidate key on element (d) data is NOT a verifying
        test, whatever it is called. A CANDIDATE-KEY SET is a set each of whose
        members determines a full key of the declared key size. CLAUSE B5-1's
        TEST IS APPLIED TO EVERY CANDIDATE-KEY SET EACH OF WHOSE MEMBERS THE
        ATTACK SUBJECTS TO AT LEAST ONE VERIFYING TEST, AND TO NO OTHER SET. The
        attack's separate verification charge is the LARGEST charge the test
        yields over those sets, it is levied EXACTLY ONCE and on that set alone,
        and a claim may not select the set that suits it. Where the test yields
        no charge on any such set, no separate verification charge applies to the
        attack at all. A set of PARTIAL-key values is not a candidate-key set;
        an attack recovering m of the k key bits is charged under CM-1 element
        (c)'s partial-key-recovery clause, which is UNCHANGED, whose residual
        exhaustive search is NEVER omitted, never described as trivial and never
        left for the reader to add, and which this block neither displaces nor
        duplicates.
        CLAUSE B5-4 — DISCLOSURE, REPLACING CLAUSE B-4's BINARY FIELD. Every
        claim whose total depends on clause B5-1 states, in its own text: (i) the
        list of its stage boundaries under clause B5-2, each with the candidate
        count immediately before and immediately after it; (ii) for each
        candidate-key set to which clause B5-1's test applies under clause B5-3,
        the total cost the claim charges for work performed per member of that
        set, expressed in AEU-k; and (iii) which of those sets is the maximising
        set of clause B5-3. CLAUSE B-4's BINARY FIELD — which stage was found to
        contain, or not to contain, a full per-candidate AES-k evaluation — IS
        REPLACED by the quotients in (ii) and is no longer required, and is no
        longer accepted in place of them. A claim omitting (i), (ii) or (iii) is
        INADMISSIBLE under this model and its number is not evidence, exactly as
        clause B-4 already rules. THIS IS A PROSPECTIVE NARROWING AND IS DECLARED
        AS ONE.

      clause_records:
        - clause_id: B5-0
          what_it_does: >-
            States precedence over clauses B-1, B-2 and B-4 by identifier;
            preserves B-2's second limb and clause B-3 explicitly.
          addresses: [AMB-11]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-04, SPEC-05, SPEC-09, SPEC-10]
          what_it_is_claimed_to_fix: >-
            That -004's B block contains two rules (B-1 and B-2) which
            DEF-004-3 records as unreconciled, with no precedence between them.
          relocation_argument: >-
            REQUIRED FIELD. Its operands are clause identifiers, so it introduces
            no predicate. It carries one substantive act — preserving B-2's
            second limb and B-3 by name while superseding B-2's first limb and
            B-1 — and preservation-by-quotation of committed text cannot relocate
            an ambiguity, since the preserved words are unchanged and their
            reading is unchanged.
        - clause_id: B5-1
          what_it_does: >-
            Replaces the full-evaluation predicate with a comparison of the
            claim's own charged cost per member of a set against one AEU-k.
          addresses: [AMB-9, AMB-11, AMB-6-REOPENED]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-01, SPEC-02, SPEC-03, SPEC-04, SPEC-05, SPEC-09, SPEC-10]
          what_it_is_claimed_to_fix: >-
            OBJ-3, by binding "full evaluation" to the charged expected cost as
            RC-3 directs; and the SPEC-10 disagreement, by abolishing the
            production-versus-verification distinction the disagreement turned
            on rather than adjudicating it.
          relocation_argument: >-
            REQUIRED FIELD. The test contains exactly three terms and none of
            them is a predicate a reader interprets: "the total cost the claim
            already charges" is a number the claim must state under clause B5-4
            and under CM-1 element (c); "one AEU-k" is defined completely by CM-1
            element (a); "per member of that set" is fixed by clause B5-3. An
            inequality between two declared numbers has no undetermined word to
            move into, which is precisely the property the predicates it replaces
            lacked — "genuinely distinct computational acts" in -003, "a FULL
            evaluation" in -004. The one remaining interpretive act is
            identifying the set, and that act is not left here: it is discharged
            by clause B5-3 and audited by clause B5-4. FOUR CANDIDATE
            RELOCATION SITES WERE CHECKED AND ARE FORECLOSED IN THE CLAUSE TEXT
            BY NAME: the describing sentence, the completeness of the evaluation,
            the production/verification label, and the procedural arrangement.
        - clause_id: B5-2
          what_it_does: >-
            Individuates a stage boundary operationally, as RC-3 directs, and
            then states that no charge depends on it.
          addresses: [AMB-10]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-04, SPEC-05, SPEC-10]
          what_it_is_claimed_to_fix: >-
            OBJ-4, in which a single-loop hybrid is one stage or two depending on
            the reader and the two readings differ by the whole survivor-count
            term.
          relocation_argument: >-
            REQUIRED FIELD, AND IT IS STRONGER THAN A DEFINITION. The clause does
            define the boundary by a declared-number criterion — a strict
            decrease in the candidate count, which is not a property of the text's
            arrangement and which the claim must enumerate under clause B5-4 — so
            the word "stage" is determinate wherever it is used. But the clause
            then REMOVES the charge's dependence on it: clause B5-1's test is
            applied to sets, not to stages, and no verdict under this block turns
            on where a boundary falls. AN AMBIGUITY CANNOT RELOCATE INTO A TERM
            THAT NO LONGER DECIDES ANYTHING. That is a deliberate strengthening
            beyond RC-3's letter, and it is declared as a deviation in
            `required_controls_incorporated`, not smuggled.
        - clause_id: B5-3
          what_it_does: >-
            Names the sets element (f)'s charge is tested against, defines a
            verifying test, restricts the sets to candidate-KEY sets, and takes
            the maximising set once.
          addresses: [AMB-9, AMB-10, AMB-11]
          panel_specs_this_clause_is_addressed_to:
            note: NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT.
            specs: [SPEC-04, SPEC-05, SPEC-09, SPEC-10]
          what_it_is_claimed_to_fix: >-
            DEF-004-3 and PVF-1: that -004 never says which set element (f)'s
            charge and B-1's test are applied to, which is what allowed the
            author and a blind reader to reach opposite answers on the same
            construction while each applied the amendment's own clauses.
          relocation_argument: >-
            REQUIRED FIELD. Three terms are introduced and each is bounded.
            (1) VERIFYING TEST is defined by an operation kind ("evaluates the
            AES-k encryption function, wholly or in part, under that candidate key
            on element (d) data") plus an effect ("retains or discards the
            candidate"), and the one reading that broke -004's B-1 — whether a
            partial or aborted evaluation counts — is settled IN THE CLAUSE, in
            the inclusive direction, so it cannot be reopened by a reader.
            (2) CANDIDATE-KEY SET is defined by a property of its members
            (each determines a full key of the declared key size) that the claim
            must state anyway under CM-1 element (c). (3) THE MAXIMISING SET is a
            maximum over a finite enumerated family, taken once; a maximum over an
            enumerated list is not a judgement. THE ONE BOUNDARY THIS CLAUSE
            DRAWS THAT COULD MOVE — whether an operation evaluates part of AES-k
            or merely computes a function of the candidate — IS NAMED IN
            `limitations` AS A LIVE ATTACK SURFACE AND IS NOT CLAIMED CLOSED; a
            claimant who could describe a partial cipher evaluation as pure
            algebra would move the classification, and clause A5-5's per-kind
            inventory is the check that makes such a description auditable
            without making it self-verifying.
        - clause_id: B5-4
          what_it_does: >-
            Disclosure only. Replaces a binary field with three declared
            quantities.
          addresses: [AMB-9, AMB-10, AMB-11]
          panel_specs_this_clause_is_addressed_to:
            note: >-
              NO VERDICT IS ASSERTED FOR ANY OF THEM UNDER THIS TEXT. As with
              clause A5-5, no panel item can exercise a disclosure clause,
              because every panel item is a declared verbatim PREFIX and none
              purports to reproduce a whole claim's disclosure text. The validator
              recorded exactly this for -004's B-4 on nine of ten items
              ("B-4 decomposition absent from the quoted specification; recorded
              only") and kept it out of the axis verdicts under its rule R-a.
            specs: []
          what_it_is_claimed_to_fix: >-
            OBJ-3's closing observation that B-4 asks for a binary field which
            the early-abort construction cannot fill honestly in either value.
          relocation_argument: >-
            REQUIRED FIELD. Replacing a binary judgement field with three
            quantities moves the disclosure from an opinion to declared numbers,
            which is the opposite direction from relocation: there is no longer a
            field whose truth depends on how the claimant reads a rule. The
            quantities are the candidate counts either side of each boundary
            (clause B5-2), a cost quotient per set in AEU-k (CM-1 element (a)'s
            unit), and the identity of the maximising set (clause B5-3) — all
            three already required or derivable from what CM-1 elements (a), (c)
            and (f) demand.

  # =====================================================================
  # REQUIRED CONTROLS INCORPORATED, AND ONE DECLARED DEVIATION.
  # =====================================================================
  required_controls_incorporated:
    - id: RC-1
      binds: OBJ-2
      required: >-
        A SPECIFICATION-REWRITING INVARIANCE CHECK, on paper, zero compute,
        before any further amendment is authored: apply the pullback rewriting to
        an attack that consumes a linear-layer output; if the verdict changes,
        clause A-2 is not well-defined.
      how_incorporated: >-
        RUN AS CONTROL PT-A1 in `controls_run` below, against clauses A5-3 and
        A5-4 rather than against A-2, which is no longer an operative test.
      status: INCORPORATED AND RUN.
    - id: RC-2
      binds: OBJ-1
      required: >-
        Restate A-2 and A-3 with an explicit PRECEDENCE SENTENCE in the form
        clause B-1 already uses, and extend A-3(i)'s antecedent to cover element
        (d) input bytes the attack has received, or state in terms that
        relabelling un-charged input bytes triggers the bar.
      how_incorporated: >-
        Both limbs adopted. The precedence sentence is clause A5-0 and is made
        unconditional by clause A5-1; the antecedent extension is clause A5-2,
        which takes RC-2's first option (extend to element (d) input bytes)
        rather than its second.
      status: INCORPORATED.
      which_option_was_taken_and_why: >-
        RC-2's second option (state that relabelling un-charged input bytes
        triggers the bar) would make the most ordinary partial-key-guessing shape
        inadmissible on a pure bookkeeping ground, with no cost consequence
        anywhere: the relabelling performs no arithmetic and consumes no
        countable operation, so the bar would fire on work that costs nothing
        under any element of CM-1. The first option is taken. THE COST OF THAT
        CHOICE, STATED: it is the more permissive of the two, and a reviewer who
        thinks an indexing-only relabelling of received bytes should nonetheless
        bar the route should attack clause A5-2 directly.
    - id: RC-3
      binds: OBJ-3, OBJ-4
      required: >-
        Bind clause B-1's "full evaluation" to the CHARGED EXPECTED COST rather
        than to the specification's sentence (at least one AEU-k per candidate in
        the produced set), individuate a stage OPERATIONALLY as any point where
        the candidate count strictly decreases, and then re-run -004's own
        proves-too-much check against BOTH revised clauses — the reference must
        still classify as BUNDLED, or the repair is worse than the defect.
      how_incorporated: >-
        First limb: clause B5-1, at the threshold RC-3 names (at least one AEU-k
        per member). Second limb: clause B5-2, in RC-3's own words. Third limb:
        the m=0 definitional reference is re-run as control PT-1 below and
        classifies as BUNDLED.
      status: INCORPORATED, WITH ONE DECLARED DEVIATION BY STRENGTHENING.
      declared_deviation: >-
        NAMED RATHER THAN ABSORBED. RC-3 asks for the stage to be individuated so
        that clause B-2's survivor rule becomes determinate — that is, it treats
        the stage as an INPUT TO THE CHARGE. Clause B5-2 individuates the stage
        exactly as RC-3 specifies, and clause B5-3 then REMOVES the charge's
        dependence on it, applying clause B5-1's test to sets rather than to
        stages. This goes beyond what RC-3 asked and it is a deviation from the
        control as written. The reason is the failure mode this batch exists to
        stop: a term that still decides a verdict is a term an ambiguity can move
        into, and "stage" had already absorbed one relocation (from "distinct" in
        -003 to "stage" in -004). A REVIEWER WHO PREFERS RC-3's LITERAL FORM
        SHOULD SAY SO; nothing here is hidden behind the control's name.
    - id: RC-6
      binds: the amendment's operative claim
      required: >-
        A pre-registered blind adjudication panel, frozen before the next
        amendment is authored, classified against the amended text and, as the
        null-object control, against the superseded text.
      how_incorporated: >-
        NOT INCORPORATED BY THIS RECORD, AND CORRECTLY SO. RC-6 is discharged for
        -004 by TASK-20260903-59e9b9 (the frozen panel) and TASK-20260903-373afa
        (the two verdict tables), which precede this text. For -005 it is
        DISCHARGED BY NOTHING YET: the third column is step (iv) of
        DEC-20260901-d264ea's next action and is UNRUN. This record's own
        contribution to RC-6 is negative and structural — its operative text
        carries no worked example, so the third column can be classified blind.
      status: OPEN FOR THIS TEXT. Not tried, not screened, not negative.

  # =====================================================================
  # CONTROLS RUN BY THIS TASK. ZERO COMPUTE, ON PAPER.
  # EVERY CONTROL CARRIES ITS NON-DEGENERACY ARGUMENT: A BAND THAT
  # CANNOT FIRE IS NOT A CONTROL. THIS CAMPAIGN HAS ALREADY RECORDED
  # DEGENERATE DISCRIMINATORS, ONE OF THEM INSIDE A REPAIR.
  # =====================================================================
  controls_run:
    preamble: >-
      SIX CONTROLS, ALL ON PAPER, ZERO COMPUTE, ZERO NETWORK. Each names the
      clause it tests, the object it is run on, the outcome, and — REQUIRED — why
      the band CAN fire, stated as a nearby wrong rule that the same object
      would detect. NONE OF THESE IS A MEASUREMENT AND NONE IS EVIDENCE ABOUT
      AES; they are the author's own application of the author's own text, which
      is exactly the kind of check -004 recorded as "arguments, not
      measurements", and they are reported at that ceiling.
    controls:
      - id: PT-1
        name: m=0 DEFINITIONAL-REFERENCE PROVES-TOO-MUCH CHECK, RE-RUN AGAINST CLAUSES B5-1 AND B5-3
        clause_under_test: B5-1
        object: >-
          The m=0 definitional reference as CM-1 and -004 both state it:
          exhaustive key search — pick the next key, encrypt a target plaintext
          under it, compare with the target ciphertext, stop at the first match.
        application: >-
          The reference subjects every enumerated candidate key to a verifying
          test under clause B5-3, and every member of that set determines a full
          key, so it is a candidate-key set to which clause B5-1's test applies.
          The cost the reference charges for work performed per member of that
          set is ONE AEU-k, which is by CM-1 element (a)'s own definition one
          full AES-k encryption of one block at the full round count inclusive of
          one fresh key expansion. One AEU-k is NOT LESS THAN one AEU-k, so
          clause B5-1's antecedent is false.
        outcome: >-
          VERIFICATION IS BUNDLED AND NO SEPARATE CHARGE APPLIES. That is the
          classification -003's resolving text and -004's clause B-1 both give
          the reference, and CM-1 element (b)'s definitional figures are left
          exactly where CM-1 put them. RC-3's stated pass condition is met.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE, AND THIS OBJECT SITS EXACTLY ON IT. The reference's
          charged cost per member is one AEU-k, which is the threshold value
          itself, so the object discriminates the inclusive threshold from the
          strict one: a clause reading "MORE than one AEU-k per member" would fire
          here, apply element (f)'s charge to the reference, and roughly double a
          definitional figure — the exact failure -004's rejected draft B-0
          exhibited and the exact failure this control exists to detect. The
          control is therefore live for clause B5-1 at its most sensitive point.
        what_this_control_does_NOT_cover: >-
          STATED BECAUSE THE INDEPENDENT VALIDATOR ESTABLISHED IT AGAINST -004
          AND IT REMAINS TRUE HERE. At m=0 the pipeline has one production stage,
          so any clause about boundaries between stages is INACTIVE on this
          object. PVF-2 records that -004's version of this check therefore could
          not reach the B-1/B-2 conflict the SPEC-10 disagreement turns on. THIS
          CONTROL INHERITS THAT LIMIT AND DOES NOT CLAIM OTHERWISE; controls PT-2
          and PT-4 exist because of it.
      - id: PT-2
        name: TWO-PHASE PROVES-TOO-MUCH CHECK AT m GREATER THAN 0, WITH THE BOUNDARY ACTIVE
        clause_under_test: B5-3, and clause B5-1 through it
        object: >-
          A hypothetical two-phase attack, asserted of no real cipher and of no
          round count: phase 1 recovers m of the k key bits by some mechanism
          that evaluates no part of AES-k on element (d) data; phase 2 searches
          the residual over the remaining bits by ordinary exhaustive
          encrypt-and-compare. The candidate count strictly decreases at the
          phase boundary, so clause B5-2's boundary is ACTIVE and clause B5-3 has
          more than one set to consider.
        application: >-
          Phase 1's own candidates are PARTIAL-key values and are not a
          candidate-key set, so clause B5-1's test is not applied to them and CM-1
          element (c)'s partial-key-recovery clause governs them, charging the
          residual exhaustive search and never omitting it. The residual set IS a
          candidate-key set and each of its members is subjected to a verifying
          test, and the cost charged per member of it is one AEU-k. Clause B5-1's
          antecedent is false for it.
        outcome: >-
          VERIFICATION IS BUNDLED FOR THE RESIDUAL SET AND NO SEPARATE CHARGE
          APPLIES; the residual search is charged in full under element (c) and is
          neither dropped nor charged twice.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE, AND TWO DIFFERENT NEARBY RULES WOULD MAKE IT FIRE IN
          OPPOSITE DIRECTIONS. (1) A rule levying the charge on the survivors of
          the last production stage without a full per-candidate evaluation —
          which is -004's clause B-2 first limb, and which is the reading the
          independent validator recorded blind as better supported — adds a
          verification term on the residual set ON TOP of element (c)'s residual
          charge, roughly doubling the dominant term. (2) A rule treating the
          residual as verification and then treating verification as free removes
          the residual term entirely. The object separates clause B5-3 from both,
          so this control reaches the exact clause interaction the m=0 object
          cannot, which is the gap PVF-2 named.
        what_it_does_not_establish: >-
          It does not establish that clause B5-3 gives the RIGHT answer, only that
          it gives a determinate one and that the two nearby wrong answers are
          excluded. AND IT IS AGAINST THE INTEREST OF THIS TEXT TO SAY SO: on this
          object clause B5-3 reaches -004's answer and NOT the blind validator's,
          which is recorded and reasoned about in `the_spec_10_disagreement`
          rather than presented as a vindication.
      - id: PT-3
        name: EARLY-ABORTED-EVALUATION CHECK
        clause_under_test: B5-1
        object: >-
          A hypothetical attack, asserted of no real cipher and of no round
          count, that draws candidate keys from a precomputed pool, specifies a
          full AES-k evaluation and comparison per candidate, and charges an
          expected cost per candidate far below one AEU-k because the evaluation
          aborts on data at an early checkpoint.
        application: >-
          The pool is a candidate-key set and every member is subjected to a
          verifying test, which clause B5-3 states an aborted evaluation to be.
          The cost the claim charges per member of the pool is the aborted
          expected cost, which is less than one AEU-k. Clause B5-1's antecedent is
          true.
        outcome: >-
          THE SEPARATE CHARGE APPLIES to the pool. The claim does not obtain the
          bundling exemption by describing an operation it does not pay for.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE. A rule keyed to the SPECIFICATION SENTENCE rather
          than to the charged number — which is one of the two readings -004's
          clause B-1 supports, and the one the submitter would choose — yields
          BUNDLED on this object and a total smaller by the whole verification
          term. The object therefore discriminates the two readings OBJ-3
          identified, which is what it was constructed to do.
      - id: PT-4
        name: TRIVIAL-BOUNDARY CHECK ON THE DEFINITIONAL REFERENCE
        clause_under_test: B5-2 and B5-3 jointly
        object: >-
          The m=0 definitional reference, modified only by a bookkeeping filter
          that discards a small number of candidates on a property of the
          candidate value alone, before the encrypt-and-compare. A stage boundary
          now exists under clause B5-2 where none existed in PT-1.
        application: >-
          The filter evaluates no part of AES-k on element (d) data, so it is not
          a verifying test and the pre-filter set is not one clause B5-1 is
          applied to. The post-filter set is a candidate-key set whose members are
          each verified at one AEU-k. Clause B5-1's antecedent is false for it.
        outcome: >-
          BUNDLED; the reference's charged figure is unmoved by the introduction
          of a boundary.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE. A rule that levied element (f)'s charge at EVERY
          stage boundary, or on every set from which candidates are eliminated,
          would charge the reference a verification term it does not owe and
          double a definitional figure. This object is the cheapest instance of
          that error, and it exists because clause B5-2 makes boundaries very
          easy to create — a permissive boundary rule must be shown not to be
          exploitable in either direction, and this is the direction that would
          inflate.
      - id: PT-A1
        name: RC-1 SPECIFICATION-REWRITING INVARIANCE CHECK, THE A-BLOCK ANALOGUE -004 NEVER RAN
        clause_under_test: A5-3 and A5-4
        object: >-
          The pullback pair: a hypothetical attack that computes an invertible
          F_2-linear map of the round function per candidate and accepts on a test
          of the result, and its rewriting that pulls the test back through the
          map at specification time and computes the map once, or not at all, at
          run time. Both are asserted of no real cipher and of no round count.
        application: >-
          FORM ONE performs a cipher-structural operation of clause A5-4 item (3)
          once per candidate whose cost is counted neither in N nor in X, so all
          three limbs of clause A5-3 hold and the bar fires. FORM TWO performs no
          such operation per candidate, but it computes its own accept constant by
          applying the inverse of that same map, once, at specification time — a
          cipher-structural operation the attack performs for itself, not one
          belonging to the AES specification as given, whose cost is counted
          neither in N nor in X. Clause A5-3's limb (2) reaches precomputation by
          name and clause A5-3 forbids excusing it by its size, quoting -003's own
          ROUTE 3 sentence. All three limbs hold and the bar fires.
        outcome: >-
          THE VERDICT IS INVARIANT UNDER THE PULLBACK REWRITING: both forms are
          INADMISSIBLE under ROUTE 3 and recorded as UNADJUDICABLE. RC-1's stated
          pass criterion — "if the verdict changes, the clause is not
          well-defined" — is MET for clauses A5-3 and A5-4.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE, AND THE EVIDENCE THAT IT CAN IS INDEPENDENT OF THIS
          AUTHOR. Under -004's text the two forms receive DIFFERENT verdicts: the
          independent validator's T-004 table records the consuming form as
          INADMISSIBLE_UNADJUDICABLE (FORCED) and the pulled-back form as
          ADMISSIBLE_ROUTE_1_PLUS_3 (BEST_SUPPORTED), classified blind
          (VAL-20260904-373afa, table_T_004, SPEC-02 and SPEC-03 axis A). A check
          that a predecessor text demonstrably fails is not a check that cannot
          fail.
        cost_of_this_outcome_stated_against_this_text: >-
          THIS IS A NARROWING AND IT IS NOT COST-FREE. Under -004 as one blind
          reader read it, the pulled-back form was ADMISSIBLE with a determinate
          charging form; under clauses A5-3 and A5-4 it is UNADJUDICABLE. -004
          stated of itself that it "IS NOT A WIDENING OF ROUTE 3"; THIS
          AMENDMENT MAKES THE OPPOSITE DISCLOSURE — IT IS A NARROWING. The error
          direction is against the claimant, which is the only direction a rule of
          this kind may point, but a reviewer who thinks a one-time
          specification-time constant should not bar a route should attack clause
          A5-3's precomputation limb directly. The alternative the red team
          offered — declaring a claim inadmissible if ANY specification computing
          the same function with the same N and X triggers the bar — was
          CONSIDERED AND REJECTED here, and the reason is recorded in
          `rejected_drafts`.
      - id: PT-A2
        name: ROUTE-3-NOT-EMPTIED CHECK
        clause_under_test: A5-4
        object: >-
          A hypothetical attack, asserted of no real cipher and of no round
          count, whose entire cipher-structural inventory is S-box applications
          counted in N and AddRoundKey byte-XORs counted in X, which performs no
          other operation of clause A5-4's list at any time including
          precomputation, and which evaluates an accept predicate performing none
          of them.
        application: >-
          No operation satisfies all three limbs of clause A5-3: the accept
          predicate fails limb (1) because clause A5-4 states in terms that a
          predicate performing none of the six kinds is not a cipher-structural
          bytewise operation; every cipher-structural operation the attack does
          perform fails limb (3) because it is counted.
        outcome: >-
          THE BAR DOES NOT FIRE and the attack is admissible under ROUTE 1 plus
          ROUTE 3 at the charging form -003 already fixed. ROUTE 3 IS NOT EMPTIED
          BY THIS BLOCK.
        non_degeneracy_argument: >-
          THE BAND CAN FIRE. On the literal reading of clause A-2's iff over an
          undefined "bytewise operation" — the reading DEF-004-1 identifies, and
          which -003's closing catch-all also supports — the accept predicate IS a
          bytewise operation whose result the attack requires, so the bar fires,
          this object is INADMISSIBLE, and ROUTE 3 admits nothing at all. The
          object therefore discriminates clause A5-4's closed enumeration from the
          inherited undefined term, which is what it was constructed to do.
    controls_considered_and_not_run:
      - id: NOTRUN-1
        control: A second null-object column against an EMPTY rule text (CM-1 alone, no ROUTE 3 amendment, no (c)/(f) amendment).
        why_not_run: >-
          It is a classification task, not an authoring task: it must be run by a
          reader against the frozen panel, and this task's write scope, objective
          and deliverable list contain no verdict table. The independent
          validator proposed it and recorded it unrun.
        status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
      - id: NOTRUN-2
        control: The frozen panel classified against THIS text (the -005 column).
        why_not_run: >-
          Authoring the text and classifying the panel against it in the same
          session destroys the blindness the freeze exists to protect. It is step
          (iv) of DEC-20260901-d264ea's next action and belongs to a separate,
          independent session that has not read this record's non-operative
          fields.
        status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.
      - id: NOTRUN-3
        control: Inter-reader agreement, on any text.
        why_not_run: >-
          ONE READER CANNOT MEASURE IT, and this task is one author with no
          reader at all. RC-6's operative question — whether two conforming
          readers reach the same verdict — has never been measured for -003, for
          -004 or for this text.
        status: OPEN AND UNATTEMPTED. Not tried, not screened, not negative.

  # =====================================================================
  # HOW EACH ADDRESSED GAP IS ARGUED TO CLOSE. ARGUMENTS, NOT
  # MEASUREMENTS. THE BLIND CLASSIFIER OF THE -005 COLUMN MUST NOT READ
  # THIS BLOCK BEFORE RECORDING ITS VERDICTS.
  # =====================================================================
  closure_arguments:
    reader_warning: >-
      BINDING ON ANY TASK THAT CLASSIFIES THE FROZEN PANEL AGAINST THIS TEXT.
      This block, `controls_run`, `limitations` and `changes_of_reading_relative_to_004`
      are this author's own application of this author's own rules to described
      constructions. They are the analogue of the worked examples the panel's
      `reader_blindness_obligation` forbids reading before verdicts, and the same
      prohibition applies to them. Read only the two `resolving_text_verbatim`
      blocks and CM-1.
    arguments:
      - gap: AMB-7 / OBJ-1
        argument: >-
          The split OBJ-1 constructs requires two clauses to both apply to one
          operation with nothing choosing between them. Clause A5-1 makes the
          routing unconditional, so exactly one clause applies; clause A5-2 then
          supplies the antecedent A-3(i) was missing for received element (d)
          bytes, so the clause A5-1 routes to actually reaches the case. The
          mechanism OBJ-1 exploits is gone.
        what_is_not_claimed: >-
          THAT THE CONSTRUCTION OBJ-1 USES NOW HAS A DETERMINATE OVERALL VERDICT.
          It does not, and the reason is a DIFFERENT and independently identified
          open defect: DEF-CM1-A, recorded by the independent validator against
          CM-1 element (a) and NOT against any amendment, observes that ROUTE 1
          charges "N S-box applications" and nowhere says whether an INVERSE
          S-box application counts. That construction charges its N in inverse
          S-box applications. Under clause A5-3 limb (3) a reader who holds that
          the inverse counts reaches a determinate charging form and a reader who
          holds that it does not reaches UNADJUDICABLE. THIS AMENDMENT DOES NOT
          CLOSE DEF-CM1-A and does not disguise the consequence: OBJ-1's
          precedence mechanism is argued closed, and that construction's verdict
          now turns on an open question in CM-1 that pre-exists -003, -004 and
          this record. Naming it is not a relocation by this amendment; it is a
          defect this amendment declines to rule on, for the reason in
          `open_and_unattempted` OU-005-1.
      - gap: AMB-8 / OBJ-2
        argument: >-
          OBJ-2's break requires clause A-2 to contain two non-equivalent tests.
          Clause A5-3 removes BOTH from the operative text rather than choosing
          between them, and forecloses the extensional reading by name in three
          forms — the requirement reading, the counterfactual-algorithm reading
          and the alternative-specification reading — so the pullback argument
          has no clause of this model to be made from. What replaces them is a
          cost-accounting test: does the attack perform a cipher-structural
          operation whose cost is not counted. THE RELOCATION OBJ-2 DIAGNOSED —
          the ambiguity moving from the implementation axis, where CM-1 had
          already excluded it, onto the specification-description axis, where
          nothing governed it — is answered by moving the test onto the AXIS CM-1
          IS ABOUT, which is what is on the bill.
        what_is_not_claimed: >-
          That the two forms of the pullback pair are now the same object. They
          are not: they differ in a declared, countable quantity — the number of
          uncounted cipher-structural operations, per candidate in one form and
          once at specification time in the other — and under clauses A5-3 and
          A5-4 both are barred. Nor is it claimed that this is costless: see
          PT-A1's `cost_of_this_outcome_stated_against_this_text`.
      - gap: AMB-9 / OBJ-3
        argument: >-
          OBJ-3's break requires "includes a full evaluation" to be readable
          either as a property of the specified operation or as a property of the
          expected work charged. Clause B5-1 states the second and only the
          second, as an inequality between the claim's own declared cost per
          member and one AEU-k, and clause B5-3 settles in the inclusive
          direction the sub-question OBJ-3 turned on — whether an aborted
          evaluation is a verification operation at all. B-4's binary field, which
          OBJ-3 showed the construction cannot fill honestly, is replaced by
          clause B5-4's quotients.
        what_is_not_claimed: >-
          That a claimant cannot misstate its own charged cost. It can; that is a
          disclosure failure, caught if at all by clause B5-4's audit and by
          element (c)'s existing rule, and it is carried in `limitations`.
      - gap: AMB-10 / OBJ-4
        argument: >-
          OBJ-4's break requires the verdict to depend on how many stages a
          reader sees. Clause B5-2 individuates the boundary by a declared-number
          criterion, and clause B5-3 then applies clause B5-1's test to SETS
          rather than to stages, so no verdict under this block depends on the
          word "stage" at all. The quantity OBJ-4 identified as unresolved — the
          additive survivor-count term — is now read off whichever candidate-key
          set maximises it, once.
        what_is_not_claimed: >-
          That the maximising rule is the only defensible one, or that it is
          neutral. It is deliberately the conservative choice among the sets the
          attack itself declares, and a claimant may not select a cheaper set.
      - gap: AMB-11 / DEF-004-3 and the SPEC-10 disagreement
        argument: See `the_spec_10_disagreement`, which is stated separately because it is the load-bearing one.
      - gap: AMB-12 / DEF-004-1
        argument: >-
          The undefined term is replaced by a closed six-item enumeration with an
          explicit "nothing else is one" and an explicit list of what is outside
          it. The literal reading that would empty ROUTE 3 is unavailable, and
          PT-A2 shows the route is not emptied. The defect was inherited from
          -003's closing catch-all rather than introduced by -004, and the
          enumeration reaches both.
        what_is_not_claimed: >-
          That excluding an operation from the enumeration decides what it costs.
          It does not: O-CM1-1 remains open and the clause says so in its own
          operative text.
      - gap: AMB-5-REOPENED / the fused table-driven implementation
        argument: >-
          The fused case is decided by clause A-1's level rule, which is unchanged
          and not reopened, together with clause A5-3's closing sentence stating
          that an operation occurring only in the machinery of an implementation
          and appearing nowhere in the specification-level description is not
          performed by the attack. -004 reached the same place through clause
          A-2(ii)'s by-product limb; this text reaches it without needing a
          definition of "independent" at all, which is what AMB-5 was about.
        what_is_not_claimed: >-
          That -004 failed on the fused case specifically. DEC-20260901-d264ea
          records the opposite — "Clause A-1's invariance-under-implementation-technique
          gain is real and closes AMB-5's fused T-table case" — while ruling that
          AMB-5 as a whole is not closed. Both statements are in that decision and
          neither is dropped here.
      - gap: AMB-6-REOPENED / genuinely distinct computational acts
        argument: >-
          -003's phrase was replaced by -004 with a full-evaluation predicate and
          the break relocated into it. This text replaces the predicate with a
          number, so there is no predicate left for a break to relocate into on
          that axis. The two exemplars -003 names, algebraic elimination and
          sieving, are re-confirmed rather than displaced: neither charges one
          AEU-k per member of the candidate-key set it produces, so both still
          carry element (f)'s separate charge under clause B5-1.
        what_is_not_claimed: >-
          That a number cannot be misdeclared, or that clause B5-3's identification
          of which sets are tested is beyond dispute. Its one movable boundary is
          named in `limitations`.

  # =====================================================================
  # THE SPEC-10 DISAGREEMENT. THE EVENT RC-6 EXISTS TO DETECT.
  # =====================================================================
  the_spec_10_disagreement:
    what_happened: >-
      Blind, before opening -004's own `relation_to_what_003_already_closed`
      field, the independent validator classified the frozen panel's
      PARTIAL KEY RECOVERY WITH AN EXHAUSTIVE RESIDUAL on axis B as
      SEPARATE_CHARGE_APPLIES, determinacy BEST_SUPPORTED, with
      BUNDLED_NO_SEPARATE_CHARGE recorded as a reachable alternative, and hashed
      that verdict before reading the field. -004's committed text says BUNDLED.
      The reader and the author disagree, on one of the two items RC-6
      designated pass-capable, with the reader in the same model family as the
      author — which, as the validator states, makes the disagreement harder to
      explain away rather than easier.
    how_005_resolves_it: >-
      NOT BY ADJUDICATING BETWEEN THE TWO READINGS, BUT BY REMOVING THE
      DISTINCTION THEY DISAGREED ABOUT. The validator's own account of the
      substantive disagreement is that -004 "treats the residual search as
      production work" while clause B-2 levies the charge on the survivors of the
      last production stage, so "B-1 read alone gives BUNDLED; B-2 and B-3 read
      as the boundary rule they announce themselves to be give SEPARATE. The
      clauses are not reconciled in the text." CLAUSE B5-1 DOES NOT ASK WHETHER
      WORK IS PRODUCTION OR VERIFICATION, and says so in its own operative words.
      It asks one question of one set: is the claim already charging at least one
      AEU-k per member. For the construction at issue, the residual set is
      charged one AEU-k per member, so verification is bundled for it, and CM-1
      element (c)'s partial-key-recovery clause — unchanged, and cited in clause
      B5-3 — charges the residual search in full and never omits it.
    why_a_blind_reader_could_reach_this_from_the_text_alone: >-
      Because both inputs to the test are numbers the construction itself states,
      and clause B5-3 names the set without asking the reader to decide what
      counts as production. A reader who never forms a view about the
      production/verification boundary still reaches a verdict, and the clause
      that could have made that view necessary has been removed from the
      operative text.
    the_honest_residual_risk_stated_plainly: >-
      THIS RESOLUTION LANDS ON THE ANSWER -004's AUTHOR GAVE AND NOT ON THE
      ANSWER THE BLIND READER GAVE, AND THAT IS THE FIRST THING A REVIEWER
      SHOULD BE SUSPICIOUS OF, BECAUSE THIS RECORD'S AUTHOR IS THE SAME MODEL
      FAMILY AS -004's. Three things are stated against that suspicion rather
      than around it. (1) The route to the answer is different in kind: -004
      asserted the classification in a prose field applying B-1's antecedent;
      clause B5-1 derives it from a declared number, and clause B5-3 states which
      set the number is about, which is exactly what -004 omitted and what the
      validator identified as the cause. (2) Clause B5-3 EXCLUDES a charge -004's
      clause B-2 would have levied elsewhere and would have double-counted
      against element (c)'s residual rule; that exclusion is a reduction in
      charge and is disclosed as such in `changes_of_reading_relative_to_004`,
      against this text's interest. (3) The claim that a blind reader will now
      agree IS NOT MADE. It is the single most valuable thing the unrun -005
      column would measure, and if a blind reader of clauses B5-1 and B5-3
      records SEPARATE on this shape, the repair has failed in exactly the way
      the two before it failed, and that finding should be recorded and acted on
      rather than argued away.
    what_is_expressly_not_said: >-
      That the validator's blind verdict was wrong. It was a correct reading of
      -004, which is what it was a reading of; the defect it exposes is in -004's
      text, and DEF-004-3 is accepted here as established rather than contested.

  # =====================================================================
  # CHANGES OF READING RELATIVE TO -004, INCLUDING THE ONES AGAINST
  # THIS RECORD'S INTEREST. NO VERDICT IS ASSERTED FOR ANY PANEL ITEM.
  # =====================================================================
  changes_of_reading_relative_to_004:
    preamble: >-
      -004 declared of itself that it was NOT a widening of ROUTE 3 and that it
      admitted no attack -003's specification-level reading did not already
      admit. THIS RECORD MAKES A DIFFERENT AND LESS COMFORTABLE DISCLOSURE: it
      changes readings in both directions, and both directions are listed.
    narrowings_this_text_makes:
      - >-
        A ROUTE 3 CLAIM WHOSE ATTACK COMPUTES A CIPHER-STRUCTURAL CONSTANT FOR
        ITSELF, ONCE, AT SPECIFICATION TIME, IS BARRED. Under -004 as one blind
        reader read it, such a claim was admissible with a determinate charging
        form. This is the narrowing PT-A1 buys RC-1 invariance with, and it is
        the largest single change in this record. Its ground is -003's own
        committed sentence forbidding a materiality threshold under ROUTE 3.
      - >-
        A ROUTE 3 CLAIM DISCLOSING A RUN-TIME OPERATION INVENTORY ONLY IS
        INADMISSIBLE UNDER CLAUSE A5-5, where clause A-4(i) alone might have been
        satisfied by it.
      - >-
        A CLAIM STATING CLAUSE B-4's BINARY FIELD INSTEAD OF CLAUSE B5-4's THREE
        QUANTITIES IS INADMISSIBLE.
      - >-
        A CLAIM WHOSE CHARGED COST PER MEMBER OF A VERIFIED CANDIDATE-KEY SET IS
        BELOW ONE AEU-k CARRIES ELEMENT (f)'s SEPARATE CHARGE WHATEVER ITS
        SPECIFICATION SENTENCE SAYS.
    the_one_reduction_in_charge_this_text_makes:
      change: >-
        ELEMENT (f)'s SEPARATE CHARGE IS NOT APPLIED TO SETS OF PARTIAL-KEY
        VALUES. Clause B5-3 restricts the test to candidate-KEY sets, so a set of
        subkey guesses carries no element (f) verification term.
      why: >-
        Because CM-1 element (c) already charges a partial-key-recovery attack
        its own cost PLUS the residual exhaustive search over the remaining bits,
        and levying element (f)'s verification term on the partial-key guess set
        as well would charge the same "the key is not yet recovered" fact twice,
        under two elements, which clause B-3's own prohibition on charging the
        term more than once is written against.
      disclosure: >-
        STATED AS A REDUCTION AND NOT DRESSED AS A CLARIFICATION. It is the only
        place this record charges LESS than a reading of -004 would, its direction
        is toward the claimant, and a reviewer should test whether it opens a
        laundering route. The check this author ran is PT-2, which shows element
        (c)'s residual charge is not reachable by this restriction; that check is
        an argument, not a measurement.
    what_this_block_is_not: >-
      IT IS NOT A PREDICTION OF ANY PANEL CELL AND NOT A VERDICT ON ANY PANEL
      ITEM. It describes changes to the rule text's reading, which is what an
      amendment can speak to. What a blind reader records against this text is
      unmeasured.

  # =====================================================================
  # REJECTED DRAFTS, RECORDED RATHER THAN DELETED.
  # =====================================================================
  rejected_drafts:
    - id: DRAFT-A-WORSTCASE
      draft: >-
        The red team's second offered repair for OBJ-2: "a ROUTE 3 claim is
        INADMISSIBLE if ANY specification computing the same function with the
        same N and X triggers the bar", so the pullback rewriting cannot help a
        claimant.
      why_rejected: >-
        IT RELOCATES THE AMBIGUITY INTO AN UNBOUNDED QUANTIFICATION, which is the
        failure mode this batch was convened to stop, in its most expensive form.
        Deciding it requires a reader to search the space of ALL specifications
        computing the attack's function; the red team offering it said in the
        same sentence that "its decidability is not established here". A rule a
        conforming reader cannot apply produces UNDETERMINED verdicts, which is
        the outcome the whole exercise exists to reduce. Clause A5-4's bounded
        extensional sentence keeps what this draft was for — a renamed or
        decomposed instance of one of five fixed maps still counts — while
        quantifying over five named maps instead of over algorithms.
      what_is_conceded_to_it: >-
        It would have been strictly more conservative, and if a later reviewer
        establishes that it is decidable in a stated scope, it is a better rule
        than clause A5-3 on the axis that matters most. Rejected on decidability,
        not on direction.
    - id: DRAFT-A-DELETE-GLOSS
      draft: >-
        The red team's first offered repair for OBJ-2: delete clause A-2's "that
        is" gloss and keep only the consumption test, making A-2 purely
        intensional.
      why_rejected: >-
        CHEAP AND INSUFFICIENT, AS THE RED TEAM ITSELF SAID: it removes the
        internal split and leaves the pullback rewriting unaddressed, so the two
        forms of the pair still receive opposite verdicts and RC-1's check still
        fails. It also leaves the operative test on the specification-description
        axis, which is where OBJ-2 located the relocation in the first place.
    - id: DRAFT-B-SCALING-ONLY
      draft: >-
        Restrict clause A5-3's bar to cipher-structural operations whose count
        SCALES with the attack's data, guess or candidate parameters, excusing a
        bounded one-time count.
      why_rejected: >-
        IT IS A MATERIALITY-ROUNDING ARGUMENT, AND -003's COMMITTED ROUTE 3 TEXT
        FORBIDS ONE IN TERMS: ROUTE 3 "may not be combined with any
        materiality-rounding argument — it is an exact additional charge, not a
        threshold below which auxiliary work is ignored". It would also have
        failed PT-A1: the pulled-back form's single specification-time operation
        is exactly the bounded count this draft would excuse, so the pair would
        again receive opposite verdicts. Recorded because it was the more
        natural-looking rule and because its rejection is what makes the
        narrowing above unavoidable rather than chosen.
    - id: DRAFT-B-LASTBOUNDARY
      draft: >-
        Levy element (f)'s charge on the survivor set at the LAST stage boundary
        of the pipeline, with production defined as everything strictly before it
        and verification as everything after.
      why_rejected: >-
        IT PROVES TOO MUCH ON THE m=0 DEFINITIONAL REFERENCE, AND THE CONTROL
        CAUGHT IT DURING AUTHORING RATHER THAN AFTER. In the reference the final
        comparison strictly decreases the candidate count, so a boundary exists
        there; the survivor set is the single match, the production work before it
        is the whole search, and one reading levies a verification term the
        reference does not owe while another empties the term entirely. Recorded
        because a draft the campaign's own control killed is more useful to a
        successor than a draft that never appears.

