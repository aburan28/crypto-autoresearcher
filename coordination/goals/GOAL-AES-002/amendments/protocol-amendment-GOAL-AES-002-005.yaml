      CLAUSE A5-3's TEST REQUIRES AN HONEST SPECIFICATION-LEVEL DESCRIPTION OF THE
      ATTACK, AND THAT IS ITS WEAKEST POINT — CARRIED FORWARD FROM -004's OWN
      LIMITATION RATHER THAN RE-DISCOVERED. A submitter who describes an attack at
      the wrong granularity, or who omits an operation it performs, can move the
      classification. Clause A5-5's per-kind inventory makes such a description
      auditable; it does not make it self-verifying. A RED TEAM SHOULD ATTACK
      EXACTLY HERE, AS -004's LIMITATION ALREADY INVITED.
