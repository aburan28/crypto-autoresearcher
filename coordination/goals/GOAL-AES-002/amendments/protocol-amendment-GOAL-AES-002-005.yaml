  # =====================================================================
  # THE CLAIM CEILING OF THIS RECORD. STATED FIRST, BECAUSE THE TWO
  # AMENDMENTS BEFORE IT EACH OVERSTATED EXACTLY THIS.
  # =====================================================================
  what_this_amendment_claims_and_what_it_does_not:
    claimed: >-
      That the operative text below states, for each addressed gap, a test whose
      inputs are either a closed enumeration or a comparison of numbers the
      claimant is already required to declare, and that the term each earlier
      text failed to determine has been REMOVED from the operative test rather
      than redefined. THAT IS AN ARGUMENT ABOUT TEXT, MADE BY ITS AUTHOR.
    not_claimed: >-
      THAT ANY GAP IS CLOSED AS A MEASURED FACT. -003 claimed to close four
      ambiguities and was broken on two; -004 claimed to close two and
      DEC-20260901-d264ea ruled both still open. THIS RECORD MAKES NO
      DETERMINACY CLAIM AND NO AGREEMENT CLAIM FOR ITS OWN TEXT, because none
      has been measured: the frozen panel
      PANEL-BATCH-ae07ce-TASK-20260903-59e9b9 has been classified against -004
      and against superseded -003 and NOT against this text. The -005 column is
      step (iv) of DEC-20260901-d264ea's single next action and it has NOT BEEN
      RUN.
    not_claimed_about_the_measured_gain_of_004: >-
      THIS RECORD CLAIMS NO GAIN, FOR -004 OR FOR ITSELF, AND DOES NOT
      DOUBLE-COUNT THE ONE MEASUREMENT THAT EXISTS. What exists is ONE reader's
      classification (VAL-20260904-373afa), whose own comparison block bounds it
      three ways: 2 of -004's 12 forced cells are decided by clauses that quote
      the item verbatim (INFL-1); 7 of 20 cells per text are
      NOT_ENGAGED_BY_THIS_SPECIFICATION under BOTH texts and discriminate
      nothing (LIM-5), leaving 13 informative cells; and "forced" is that one
      reader's judgement, a PROXY for agreement and not agreement (INFL-3). The
      reader was also the same model family as the author of -004, of the panel,
      and of this record (INFL-2, LIM-2). No sentence in this amendment adds
      those bounds together into a net figure, and none asserts that -004's
      12-of-13 forced count transfers to this text.
    claim_ceiling: SPECIFICATION RESULT ONLY.
    no_assertion_about_aes: >-
      NOTHING IN THIS FILE ASSERTS, IMPLIES OR DEPENDS ON ANY PROPERTY OF AES AT
      ANY ROUND COUNT, IN EITHER DIRECTION. Every construction referred to
      anywhere in this record is explicitly hypothetical and is asserted of no
      real cipher and of no round count.

  # =====================================================================
  # HOW THE FROZEN PANEL WAS USED, AND HOW IT WAS NOT.
  # =====================================================================
  how_the_frozen_panel_was_used_and_how_it_was_not:
    the_panel:
      id: PANEL-BATCH-ae07ce-TASK-20260903-59e9b9
      path: coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-59e9b9/panel-spec.yaml
      sha256_declared_by_the_orchestrator_of_this_task: e9fe9f9138118ac41d9568199a898163fbd3c3863cad6cdecfb76a03340ee29b
      sha256_recomputed_by_this_task: null
      sha256_recompute_note: >-
        NOT RECOMPUTED AND NOT ESTIMATED. This session has no command-execution
        tool, so it cannot hash a file. The value above is quoted from this
        task's dispatch and is independently corroborated by
        VAL-20260904-373afa, which recomputed it with sha256sum and against
