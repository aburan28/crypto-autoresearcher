      KEY ON ELEMENT (d) DATA" AND "COMPUTES SOME OTHER FUNCTION OF THE CANDIDATE"
      IS THE ONE PLACE IN THE B BLOCK WHERE A DESCRIPTION CAN STILL MOVE A
      CLASSIFICATION. A claimant who could present a partial cipher evaluation as
