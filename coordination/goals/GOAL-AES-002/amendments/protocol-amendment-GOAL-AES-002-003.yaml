  version_from: null
  version_to: null
  version_note: >-
    NULL, mirroring protocol-amendment-GOAL-AES-002-001 and -002. This goal
    record carries no version-number scheme, so version_from/version_to have
    nothing to count and are left null rather than invented.

  authored_by_task: TASK-20260901-d08b9f
  authored_by_role: coordinator
  authored_at: '2026-09-01'
  approved_by: coordinator
  approved_at: '2026-09-01'
  decision_ref: null
  decision_ref_note: >-
    NULL BY SCOPE, NOT BY OMISSION, mirroring -001's identical clause. This
    task's write_scope is EXACTLY
    coordination/goals/GOAL-AES-002/amendments, so no ledger/decisions/ file
    may be written by this task, and no DEC identifier is named here — that
    would be a fabricated citation, since identifiers are minted only by the
    task that actually writes the record. THE COVERING DECISION IS OWED by
    the Coordinator decision that closes BATCH-286bcd, which must cite this
    amendment by id and bind this field in a follow-on write, exactly as
    -001's field was bound after the fact.

  # =====================================================================
  # WHAT IS BEING RESOLVED — THE THREE-PLUS-ONE READING AMBIGUITIES.
  # =====================================================================
  ambiguities_resolved:
    - id: AMB-1
      element: (a) UNIT — conversion route for AddRoundKey-only auxiliary work
      source: >-
        RT-20260831-1166f2 r2_element_dispositions[0] (element "(a) UNIT"),
        disposition CONCRETE_READING_FOUND, severity HIGH; independently
        re-confirmed by VAL-20260831-9fc65d consistency_check.
      what_was_ambiguous: >-
        CM-1's Route 1 (S-box applications) leaves auxiliary AddRoundKey XORs
        with no stated rule, while a separate clause categorically forbids
        converting non-S-box work by any factor, so two conforming readers
        could assign the identical attack either a finite N/S_k AEU-k figure
        or UNADJUDICABLE.
      resolved_by: the_change.item_1_element_a_route_3 (below)
    - id: AMB-2
      element: (c)/(f) — bundled verification vs. separate N-unit charge
      source: >-
        RT-20260831-1166f2 r2_element_dispositions[2] (element "(c) SUCCESS
        PROBABILITY") and r2_element_dispositions[4] (element "(f)
        PRECOMPUTATION AND VERIFICATION", same defect cross-referenced),
        both severity HIGH; internally consistency-checked by RT-20260831-1166f2
        itself against CM-1's own required_controls entry 2 (the m=0
        reference-case check); independently re-confirmed by
        VAL-20260831-9fc65d consistency_check.
      what_was_ambiguous: >-
        Whether a residual encrypt-and-compare search's own AEU-k units
        already bundle candidate verification, or element (f)'s separate
        N-verification-unit charge applies additionally — a spread of close
        to a factor of 2, which R2(b) itself names as claim-relevant.
      resolved_by: the_change.item_2_elements_c_f_joint (below)
    - id: AMB-3
      element: (d) DATA — how kind combines with count in the domination order
      source: >-
        RT-20260831-1166f2 r2_element_dispositions[3] (element "(d) DATA"),
        disposition CONCRETE_READING_FOUND, severity MEDIUM; independently
        re-confirmed by VAL-20260831-9fc65d consistency_check.
      what_was_ambiguous: >-
        CM-1 orders data kind (known < chosen < adaptive) but never states
        how kind combines with count into the single order the four-tuple
        domination rule needs; three genuinely different readings were
        constructed by the red team, none of which CM-1's text rules out.
      resolved_by: the_change.item_3_element_d_two_axis_sublattice (below)
    - id: AMB-4
      element: (b)/(c) — the distinguisher bridge (lower severity)
      source: >-
        RT-20260831-1166f2 r2_element_dispositions[1] (element "(b) SUCCESS
        CONVENTION"), disposition
        HOLDS_FOR_KEY_RECOVERY__GAP_FOR_DISTINGUISHER_CLASS, severity MEDIUM;
        independently re-confirmed by VAL-20260831-9fc65d consistency_check.
      what_was_ambiguous: >-
        CM-1's element (b)/(c) is written entirely in "repeated attempts to
        first success" vocabulary and states no bridge to a distinguisher's
        measured false-positive rate, though RQ-AES-002 R7 keeps
        distinguisher claims explicitly in scope.
      resolved_by: the_change.item_4_elements_b_c_distinguisher_bridge (below)

  # =====================================================================
  # THE CHANGE — THE FOUR RESOLVING-TEXT BLOCKS, TRANSCRIBED VERBATIM FROM
  # THIS TASK'S CARD (TASK-20260901-d08b9f.md), PLUS ONE DILIGENCE NOTE.
  # The markdown blockquote markers ("> ") of the card are formatting only
  # and are not part of the rule text; the wording, capitalisation and
  # punctuation below are transcribed exactly, reflowed from the card's
  # display line-wrap into continuous prose.
  # =====================================================================
  the_change:
    item_1_element_a_route_3:
      closes: AMB-1 (RT-20260831-1166f2 r2_element_dispositions[0])
      resolving_text_verbatim: >-
        ADMISSIBLE CONVERSION ROUTE 3 — ADDROUNDKEY-ONLY AUXILIARY XORS. An
        attack whose cost is dominated by N S-box applications (converted
        under Route 1) accompanied ONLY by AddRoundKey byte-XORs performed to
        combine partial key guesses with data — and by no other bytewise
        operation (no independent ShiftRows/MixColumns computation, no table
        access outside the S-box route) — additionally charges those
        AddRoundKey XORs at X / X_k AEU-k, where X is the count of
        AddRoundKey byte-XORs the attack performs and X_k is the
        per-key-size `add_round_key_byte_xors_per_AEU` figure already fixed
        in element (a) (176 for AES-128, 208 for AES-192, 240 for AES-256).
        The total charged cost under Routes 1+3 combined is (N/S_k + X/X_k)
        AEU-k. An attack whose auxiliary work includes ANY operation outside
        S-box applications and AddRoundKey XORs (ShiftRows, MixColumns,
        table accesses not already counted, or any other bytewise operation)
        remains INADMISSIBLE under this route and is recorded as
        UNADJUDICABLE exactly as before; Route 3 may not be combined with
        any materiality-rounding argument — it is an exact additional
        charge, not a threshold below which auxiliary work is ignored.
      effect_on_O_CM1_1: >-
        THIS CLOSES O-CM1-1 (the materiality threshold) FOR THE
        ADDROUNDKEY-ONLY CASE ONLY. O-CM1-1 REMAINS OPEN for any OTHER
        auxiliary-operation mix (ShiftRows, MixColumns, table accesses
        outside the S-box route, or any combination of those with
        AddRoundKey XORs) — Route 3 does not address that case, and a margin
        expressed for such a mix is still recorded as UNADJUDICABLE, not
        estimated at a guessed materiality threshold.
    item_2_elements_c_f_joint:
      closes: AMB-2 (RT-20260831-1166f2 r2_element_dispositions[2] and [4])
      resolving_text_verbatim: >-
        A residual search that proceeds by DIRECT ENCRYPT-AND-COMPARE
        ENUMERATION (stopping at the first matching candidate) charges
        verification as ALREADY BUNDLED into each search AEU-k, exactly as
        the definitional reference itself is charged under element (d)'s
        `relation_to_R1` clause; element (f)'s separate N-verification-unit
        charge ("an attack that reduces the key space to a set of size N has
        paid, at minimum, N verification units on top of whatever it paid to
        produce the set") applies ONLY to a candidate set produced by a
        mechanism OTHER than encrypt-and-compare enumeration — e.g.
        algebraic elimination, sieving, or any method where generating a
        candidate and verifying it against the target ciphertexts are
        genuinely distinct computational acts.
    item_3_element_d_two_axis_sublattice:
      closes: AMB-3 (RT-20260831-1166f2 r2_element_dispositions[3])
      resolving_text_verbatim: >-
        THE DATA COORDINATE IS A TWO-AXIS SUB-LATTICE (kind, count), not a
        single scalar. Kind is ordered known < chosen < adaptive (weakest to
        strongest requirement). An attack's data requirement A = (kind_A,
        count_A) is NO WORSE than reference data requirement R = (kind_R,
        count_R) — and therefore does not lose the data coordinate of the
        four-tuple domination comparison — IF AND ONLY IF kind_A is no
        stronger than kind_R AND count_A <= count_R. If kind_A is no
        stronger than kind_R but count_A > count_R, OR if kind_A is strictly
        stronger than kind_R regardless of count, the data coordinate is
        INCOMPARABLE (neither dominates), and the four-tuple comparison as a
        whole is reported as an incomparable point on the frontier — never
        as beating the reference on a scalar time comparison alone — with
        both (kind, count) pairs stated explicitly. A chosen-plaintext
        requirement, however few queries, is therefore a strictly stronger
        requirement than the reference's known-plaintext requirement and
        never wins the data coordinate outright on count alone.
    item_4_elements_b_c_distinguisher_bridge:
      closes: AMB-4 (RT-20260831-1166f2 r2_element_dispositions[1])
      resolving_text_verbatim: >-
        DISTINGUISHER CLAIMS ARE COMPARED ON A SEPARATE, NAMED AXIS AND ARE
        NOT FOLDED INTO THE AEU-k COST-TO-SUCCESS FRAMEWORK OF ELEMENT
        (b)/(c). A distinguisher's admissibility and strength under this
        question are reported as the tuple (measured false-positive rate
        against a matched random-permutation control at a stated data
        complexity D, in queries and kind per element (d); the round-count
        decay check result). NO AEU-k figure is computed or claimed for a
        distinguisher under this model, and no comparison of a distinguisher
        against the 2^(k-1)/2^(k-1)/2^(k-1) reference figures is made or
        implied by CM-1. Converting a distinguisher into a key-recovery
        attack, if attempted, is a SEPARATE construction whose own cost is
        charged under elements (a)-(f) as an ordinary key-recovery attack
        once specified.
    item_5_diligence_record_supplement_bc1:
      is_a_rule_change: false
      note: >-
        SUPPLEMENTARY OBSERVATION, NOT A RULE CHANGE, extending
        protocol-amendment-GOAL-AES-002-001's
        `other_sites_examined_and_declared_out_of_scope` BY REFERENCE, without
        reopening or editing amendment-001 itself. RT-20260831-1166f2 found
        (`backward_compatibility_disposition.finding_bc1_third_normative_site_located`
        and `.finding_bc1_effect_on_backward_compatibility_traced_and_confirmed_benign`)
        that `tools/cairn_bridge.py`'s `SUPPORTED_KINDS` gate, called from
        `harness/runner.py:489`, is a THIRD normative certificate-kind site
        that amendment-001's own R-10 search (searches S-1 through S-7) did
        not match — none of S-1/S-2/S-3/S-6's patterns or paths cover
        `cairn_bridge.py`'s dict-literal syntax. Both BATCH-2b0fd1 reviewers
        independently traced its effect on a future `key_recovery`
        certificate and confirmed it BENIGN: a run carrying
        `kind: key_recovery` fails the `SUPPORTED_KINDS` membership test and
        `harness/runner.py:489` returns `None`, so cairn cross-verification is
        SKIPPED for it — exactly the treatment any other unrecognised kind
        already receives today, per RT-20260831-1166f2's
        `disposition_of_the_backward_compatibility_claim` and
        VAL-20260831-9fc65d's independent re-verification of the same file
        and line number (VAL-20260831-9fc65d, entry citing "finding BC1
        (tools/cairn_bridge.py / harness/runner.py:489) is independently
        re-verified by this session reading both files directly ... the
        quoted code, line numbers, and 'confirmed benign' trace are all
        accurate"). Amendment-001's SUBSTANCE (backward compatibility) is
        UNCHANGED and HOLDS; what is added here is the diligence-record
        correction that its own R-10 search set did not have full recall
        over the codebase's certificate-kind-vocabulary sites, and that this
        third site's benign outcome was confirmed by manual review trace, not
        by amendment-001's own search finding and clearing it.

  # =====================================================================
  # HOW THIS RECORD APPLIES.
  # =====================================================================
  application: >-
    NO CODE OR DOCUMENT OUTSIDE THIS FILE IS EDITED BY THIS AMENDMENT OR BY
    ANYTHING IT SPECIFIES. CM-1.yaml's committed bytes are unedited and remain
    byte-identical to their BATCH-2b0fd1-committed form; this record is a
    standalone superseding protocol amendment under GOAL-AES-002, filed at
    coordination/goals/GOAL-AES-002/amendments/, per CM-1's own
    `changed_only_by` clause. FROM THIS COMMIT FORWARD, any cost claim under
    GOAL-AES-002 reads CM-1 AND this amendment TOGETHER as "the frozen cost
    model as amended." Unlike -001 (which specified code edits requiring a
    separate applying act), this amendment requires no further applying act:
    the resolving text above is itself the complete resolution, effective on
    this record's own commit and post-commit verification.

  # =====================================================================
  # WHAT THIS AMENDMENT IS NOT.
  # =====================================================================
  what_this_amendment_is_not:
    - >-
      IT IS NOT A COST CLAIM, A MARGIN, OR AN ASSERTION ABOUT AES AT ANY
      ROUND COUNT. It resolves READING interpretation only — how CM-1's
      already-frozen elements are applied to a hypothetical attack — and
      names no candidate, no mechanism, no margin, no distinguisher result
      and no barrier.
    - >-
      IT IS NOT A WIDENING OF THE CLAIM-TIER CEILING. RQ-AES-002 R7 is
      unchanged: the `crypto` tier remains admissible through exactly one
      gate, a re-verified full-round key-recovery certificate, and any cost
      claim still reaches `analyzed` at best in this environment.
    - >-
      IT IS NOT A FULL CLOSURE OF O-CM1-1. It closes the materiality
      threshold for the AddRoundKey-only auxiliary-operation case alone
      (the_change.item_1_element_a_route_3.effect_on_O_CM1_1); O-CM1-1
      remains OPEN for every other auxiliary-operation mix.
    - >-
      IT DOES NOT TOUCH ELEMENT (e) MEMORY. RT-20260831-1166f2
      r2_element_dispositions[5] found no demonstrated two-party divergence
      there (disposition ATTEMPTED__NO_CONCRETE_TWO_PARTY_DIVERGENCE_DEMONSTRATED,
      severity LOW) and this task's card does not authorize resolving it;
      that residual gap (whether "peak" memory spans precomputation) is left
      open, named here rather than silently closed by omission.
    - >-
      IT IS NOT A BUDGET ACT, a scope change, a re-prioritisation, or a
      change to any completion criterion or pause condition of GOAL-AES-002.
    - >-
      IT IS NOT RETROACTIVE IN ANY PART. No run, receipt, evidence record,
      decision, queue, knowledge entry or goal checkpoint is altered,
      re-scored, re-graded, re-interpreted or withdrawn.
    - >-
      IT IS NOT AN APPROVAL OF ANY EXPERIMENT, does not change any
      hypothesis, research-question, experiment or goal status, promotes no
      knowledge, and records no attestation and no review verdict.
    - >-
      IT DOES NOT REOPEN OR EDIT protocol-amendment-GOAL-AES-002-001. Item 5
      is recorded as an extension by reference, not as an edit to that
      record's own bytes.
    - >-
      IT DOES NOT TOUCH ANY GOAL-AES-001 OR GOAL-AES-003 RECORD.

  limitations:
    - >-
      THIS RECORD IS UNCOMMITTED AT THE TIME OF WRITING AND IS THEREFORE NOT
      YET DURABLE (AGENTS.md, durable research commits). It is committed by
      TASK-20260901-420f4b alone, before independent review, and the branch
      must be pushed with a PR against main naming this amendment before
      review or closure.
    - >-
      RESOLVES INTERPRETATION ONLY. This amendment charges no cost, claims no
      margin and asserts nothing about AES at any round count; it makes a
      previously ambiguous comparison ADJUDICABLE, not TRUE.
    - >-
      THE FOUR RESOLVING-TEXT BLOCKS ARE THEMSELVES UNREVIEWED AS OF THIS
      RECORD'S AUTHORING. They resolve the specific counterexamples
      RT-20260831-1166f2 constructed; this batch's own review_plan (Joint 1,
      TASK-20260901-1af5d9) re-applies those same counterexamples to the new
      text and additionally searches for new counterexamples the resolving
      text might not close. A defect found there is a specification result
      requiring a further superseding amendment, not an edit to this file.
    - >-
      O-CM1-1 IS ONLY PARTIALLY CLOSED (AddRoundKey-only case). A margin
      expressed for any other auxiliary-operation mix remains inadmissible
      and unadjudicable under CM-1 as amended here.
    - >-
      ELEMENT (e)'s LOW-severity residual (peak-memory window versus
      precomputation) IS NOT ADDRESSED and remains open for a future
      amendment if it becomes load-bearing.
    - >-
      NO MEASUREMENT, TIMING, THROUGHPUT, RUN, REVIEW VERDICT OR COMMIT SHA
      IS ASSERTED ANYWHERE IN THIS RECORD. Fields not yet knowable are null
      and are named as such.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE campaign-wide under
      standing basis 0137a051; this record's own authorship and its two
      planned reviews (TASK-20260901-4c225b, TASK-20260901-1af5d9) supply
      session independence only, not model independence.

  confirmatory_status: preserved
  confirmatory_status_note: >-
    PRESERVED. This amendment resolves interpretation the campaign already
    committed to resolving before any cryptanalytic dispatch under
