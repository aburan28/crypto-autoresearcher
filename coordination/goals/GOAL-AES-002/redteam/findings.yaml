  heuristic_and_cost_model_challenges:
    - heuristic: semi-regularity of the AES quadratic system
      status_in_record: named as an assumption in not_established, contradicted by the verdict line
      challenge: >-
        The random-model justification does not transfer to the structured object. Each of
        the 39 quadrics per S-box has rank <= 16 as a form in N = 1408 variables; with fresh
        S-box-input variables the generators are variable-disjoint across 200 blocks with
        all coupling linear. A semi-regular sequence has nothing like this. Measured null
        control: a random 8-bit bijection satisfies 0 quadratic equations, the AES S-box
        satisfies 39.
      cheapest_experiment_to_expose_the_deviation: >-
        Build a scaled-down AES-shaped system (small S-box, 2-4 rounds, N ~ 20-40 GF(2)
        variables) and a RANDOM quadratic system with the identical (N, M) - the null object
        - and measure the first-fall degree of the Macaulay matrix by GF(2) rank at
        increasing round counts. Feasible here: a degree-4 Macaulay matrix at N=24 is about
        13k x 13k bits, seconds to minutes in C with the bitset elimination already written
        in sbox_eq.c.
      pre_registered_discriminator: >-
        ROUND COUNT is the parameter that must destroy any apparent advantage. If the
        structured first-fall degree sits below the null's AND THE GAP WIDENS WITH ROUNDS,
        the closure is wrong. If the gap is flat or narrows, the closure is supported and
        the semi-regular reference is vindicated for the right reason. A FLAT GAP IS THE
        ARTIFACT TELL (docs/inventor-protocol.md section 3).
    - heuristic: '"batch elimination moves the attack into class A under O-1/O-2"'
      status_in_record: asserted in O-3 forward guidance, never derived
      challenge: >-
        A deterministic consistency test on a structured key set is neither a statistical
        distinguisher of the data path (class A) nor an approximate MITM (class B by
        recomputation). The trichotomy has no cell for it, so the assertion is a
        classification claim disguised as a bound.
    - cost_model_challenge: total cost is per-attempt cost times INVERSE SUCCESS PROBABILITY
      where_it_bites: >-
        NC-1 (TMTO coverage < 1) and NC-3 (weak-key density). Both closures are only valid
        WITH that factor, and neither pass wrote it. Charged here; the inequality direction
        is safe in both cases.
    - cost_model_challenge: precomputation and table-building must be charged
      where_it_bites: >-
        NC-1. Charging it is exactly what makes the TMTO verdict definitional rather than
        empirical.
    - cost_model_challenge: >-
        an eliminated search dimension is not a speedup until the invariant's own cost is in
        the total (KN-LIT-7593)
      where_it_bites: >-
        NC-6. Any set-amortized test must charge the cost of constructing the structured set
        and of the shared intermediate work, which is precisely what the mu measurement in
        next_action does.
    - open_and_unresolved: >-
        CM-1 IS STILL NOT COMMITTED. RQ-AES-002 makes it a hard pre-dispatch gate; pass 2
        says so explicitly. Every cost figure in the four receipts is therefore an
        unadjudicated number under the question's own rules, including the ones I reproduced.

  baseline_comparison:
    reference: >-
      DEFINITIONAL exhaustive key search, 2^128 / 2^192 / 2^256 full-AES evaluations,
      O(1) memory, about 2 known pairs, success probability 1. No literature figure used.
    published_frontier: >-
      UNADJUDICABLE in this environment, asserted in NEITHER direction, per DEC-20260731-019
      rulings 2 and 3. No primary source reachable, no WebSearch run this session.
    dominated_by: >-
      unresolvable in this environment; no primary source reachable; every recalled frontier
      row is unverified-from-memory. Written INSTEAD OF null, because null would assert a
      row-by-row Pareto check that cannot be performed here (AGENTS rule 5). AGAINST THE ONE
      ADJUDICABLE REFERENCE, checked axis by axis: nothing in this report claims an attack,
      so the reference dominates every item here on TIME; every measurement here uses O(1)
      to a few MB of memory and 0 oracle queries (all encryptions are offline, self-chosen),
      so nothing here is dominated on MEMORY or DATA; and for the classes adjudicated in
      classes_neither_pass_considered, TIME/MEMORY/DATA were each checked separately - NC-1
      is dominated on time AND memory, NC-2 and NC-3 on time, NC-4/NC-5/NC-7 on time.
    sota_delta: >-
      0 bits. This red team produces no attack, no distinguisher and no speedup. Its
      quantitative content is five measurements (MEAS-RT-A..E), one derived-and-verified
      structural property (the mixture quadruple round-1 difference identity), one
      one-round correction to a published closure, and one named hole in the enumerative
      closure.

  scope_limits:
    - >-
      Every measurement is AES-128 unless explicitly stated; MEAS-RT-D is the only one
      covering AES-192/256, and it covers only the key schedule.
    - >-
      MEAS-RT-B resolves per-cell correlations only to about 2^-8.8 and uniform biases to
      about 2^-13.5. It says NOTHING about the 2^-40 regime O-8 identifies as decisive.
    - >-
      MEAS-RT-C tested ONE readout of the mixture object. Its null result closes that
      readout, not the object.
    - >-
      MEAS-RT-D's saturation figures are empirical over 200000 keys per round; they are not
      a proof of exact independence, and my attempted symbolic proof was wrong in the
      unsafe direction and is retracted.
    - >-
      MEAS-RT-A is exact (a GF(2) rank over all 256 S-box points) and is the only result
      here that is not statistical.
    - >-
      NOTHING HERE IS A CLAIM ABOUT AES SECURITY, A BARRIER STATEMENT, OR AN IMPOSSIBILITY
      CLAIM. No scoped result is broadened into impossibility.
    - >-
      This red team ran on a Claude model and therefore shares an unknown fraction of the
      campaign's blind spots. It is not model-independent review.

  is_any_closure_wrong_or_overstated:
    wrong: none
    overstated:
      - >-
        Closure 4, measurably, by one round (MEAS-RT-B).
      - >-
        Closure 2's generalization from one property to "the structural classes", plus two
        untagged recalled figures used to dismiss.
      - >-
        Closure 3's verdict sentence, which contradicts its own not_established entry.
      - >-
        Closure 1's ARGUMENT, which covers exact MITM only while the closure it supports is
        stated over the whole enumerative class.
    conclusions_that_stand: all four

  next_action:
    one_concrete_action: >-
      MEASURE mu, THE MINIMUM PER-CANDIDATE S-BOX COST OVER STRUCTURED KEY SETS, FOR SET
      FAMILIES OTHER THAN THE BICLIQUE COSET. O-3's ceiling assumes mu >= 1. GATE 1 measured
      mu ~ 0.77 for exactly one family. Nobody measured any other.
    protocol:
      - >-
        Enumerate structured key-set families reachable at this envelope: affine cosets of
        the master key of dimension d = 8..24; cosets of the last-round-key subspace pulled
        back through the inverted key schedule; cosets induced by the key-schedule sparsity
        structure MEAS-RT-D exposes (the 3584 permanently-independent cells define a natural
        non-obvious coordinate split); and sets closed under the diagonal byte-swap whose
        round-1 difference identity MEAS-RT-C verified on the machine.
      - >-
        For each family and each d, instrument a reduced-round AES to count DISTINCT
        intermediate byte values across the set at each of the 200 S-box positions. Shared
        values are shared work. mu(F,d) = (sum of distinct counts) / (200 * 2^d).
      - >-
        PRE-REGISTER THE DISCRIMINATOR: mu must INCREASE TOWARD 1 as d grows, because full
        diffusion should destroy sharing. A mu that stays FLAT or FALLS as d grows is either
        a real sublinear set test - which breaks O-3 outright - or an artifact, and must be
        chased either way.
      - >-
        NULL-OBJECT CONTROL, MANDATORY: run the identical count against a same-shape random
        family (for example an independent-round-key AES, same wiring, no key schedule). If
        AES's mu curve matches the null's, that is a controlled null and O-3's premise is
        confirmed BY MEASUREMENT for the first time.
    cost: about 30 minutes on 4 cores with AES-NI, no new dependency
    why_this_one: >-
      It is the cheapest experiment that could still overturn the overall conclusion. If mu
      falls below 1/N_S = 1/200 for any family at any d, the O-3 ceiling is void and the
      enumerative class reopens. If mu tends to 1 on every family and matches the null, O-3
      stops being a counting argument with an unproved forward clause and becomes a measured
      obstruction, which is what docs/inventor-protocol.md section 4 requires of a closure.
    second_cheapest_if_the_first_returns_a_null: >-
      The structured-versus-random d_reg first-fall experiment in
      heuristic_and_cost_model_challenges, with round count as the pre-registered
      discriminator.

