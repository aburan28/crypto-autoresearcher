red_team_report:
  id: RT-GOAL-AES-002-FULLROUND-001
  produced_by: red-team
  produced_for: >-
    Red-team of the completed GOAL-AES-002 full-round search: two ideation passes
    and four measurement receipts concluding that every identified object class is
    closed. Both passes and all four measurements ran on the same model, so
    correlated blind spots were the expected failure mode.
  reviewed_snapshot:
    - coordination/goals/GOAL-AES-002/throughput_receipt.json
    - coordination/goals/GOAL-AES-002/depth_wall_receipt.json
    - coordination/goals/GOAL-AES-002/algebraic_lane_receipt.json
    - coordination/goals/GOAL-AES-002/influence_support_receipt.json
    - coordination/goals/GOAL-AES-002/integral_depth_probe.c
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation/candidate_report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation/baseline_map.md
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation2/candidate_report2.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation2/gap_analysis.md
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/gates/
    - ledger/questions/RQ-AES-002.yaml
    - ledger/goals/GOAL-AES-002.yaml
    - ledger/decisions/DEC-20260731-019.yaml
    - knowledge/findings/KN-FIND-017.md
    - knowledge/findings/KN-FIND-018.md
  snapshot_caveat: >-
    Reviewed as working-tree artifacts under an explicit red-team directive, NOT as
    a Coordinator-committed snapshot. Nothing here is durable evidence and nothing
    here is a ledger record.
  timebox:
    start_utc: '2026-08-01T19:53:24Z'
    hard_halt_utc: '2026-08-01T20:23:24Z'
    measurement_complete_utc: '2026-08-01T20:07:02Z'
    measured_elapsed_at_measurement_complete_s: 818
    honesty_note: >-
      Elapsed reported as measured. No result was extrapolated beyond what was run
      inside the window.
  environment:
    toolchain: gcc 13.3.0, -O3 -maes -msse4.1, 4 cores, AES-NI verified working
    absent: numpy, sage, MILP, SAT, GPU
    machine_reach_log2_aes_evals: {per_1600s_task: 38.81, whole_campaign: 42.63}
    literature: >-
      NO primary source consulted, NO WebSearch run. Every recalled fact is tagged
      UNVERIFIED-FROM-MEMORY with a recall confidence and is used to neither promote
      nor dismiss, per DEC-20260731-019 ruling 3.
  scope_and_claim_tier:
    - NO CLAIM ABOUT AES SECURITY AT ANY ROUND COUNT IS MADE OR IMPLIED.
    - NO IMPOSSIBILITY CLAIM. No barrier statement about AES.
    - No ledger record written, no state changed, nothing committed.
    - >-
      Every measurement below is toy tier and is scoped to the exact instrument,
      round counts, key size, sample counts and seeds stated.

  verdict_on_the_four_closures:
    overall: >-
      ALL FOUR CONCLUSIONS SURVIVE. TWO ARE OVERSTATED AS WRITTEN, ONE IS
      MEASURABLY OFF BY A ROUND, AND THE SEARCH HAS ONE REAL HOLE.
    closure_1_enumerative_O3_and_MITM:
      status: CONCLUSION STANDS, ARGUMENT HAS A GENUINE HOLE
      what_is_right: >-
        N_S = 200 is correctly re-derived from FIPS-197, and the D-3 conclusion (no
        exact MITM factorization at 10/12/14 rounds for any nontrivial key partition)
        is correct.
      what_is_wrong: >-
        D-3 covers only EXACT factorization. O-3's premise (>=1 S-box per enumerated
        candidate) is broken by a test amortized over a structured SET, which is
        neither a MITM factorization nor a statistical distinguisher. Pass 1 disposed
        of it with the sentence "the only escape is batch elimination, which moves the
        attack into class A under O-1/O-2" - an assertion, not a derivation, and the
        load-bearing step of the whole enumerative closure.
      correction_to_D3s_own_reasoning: >-
        D-3's stated ground (full key-and-state dependence in two rounds) is a data-path
        claim that was never measured, and its key-schedule analogue is FALSE at the bit
        level (see finding F-5). The conclusion is airtight on a simpler ground that was
        not used: for AES-128 round key 0 IS the master key, and for AES-256 round keys
        0-1 ARE the master key, so no nontrivial partition leaves forward-eligible round
        keys independent of K_2. Rewrite the closure on that ground.
      dismissal_of_approximate_factorization: >-
        The dismissal ("pays recomputation, hence stays inside O-3") IS load-bearing and
        IS correct for approximate MITM specifically, because recomputation is per
        candidate by construction. It does NOT extend to set-amortized tests, and the
        record treats the two as the same object. They are not.
    closure_2_structural_depth_wall:
      status: MEASUREMENT SOUND, GENERALIZATION OVERSTATED
      what_is_right: >-
        The 2^32 full-diagonal integral measurement is well built and its own
        not_established block correctly says it measures ONE property.
      what_is_wrong:
        - >-
          influence_support_receipt.json promotes it to "the structural classes"
          (plural) closed by "the measured depth wall". One property is not a class.
        - >-
          depth_wall_summary uses a recalled figure to DISMISS - "even granting the
          classical 2-3 round key-guessing extension, that reaches roughly 6-7 of 10" -
          untagged, doing dismissive work. Same for "the partial-sum technique ...
          extends such a distinguisher by roughly one round". Symmetric-prohibition
          violation under DEC-20260731-019 ruling 3. The conclusion does not need them.
        - >-
          integral_depth_probe.c line 42 evaluates (unsigned long long)argv[2] ? ... as
          the ternary condition, casting the POINTER, and calls atoi/strtoull with no
          <stdlib.h>. The printed seed is correct only by accident. Provenance defect in
          a receipt-grade artifact; accumulator values unaffected.
        - >-
          The conclusion is stated for AES-128/192/256 but measured on AES-128 only, and
          the key schedules differ measurably (F-5).
      independent_test_run_here: >-
        I derived and machine-verified a SECOND structural property never enumerated by
        either pass (the mixture/exchange quadruple, F-6) and measured it to r=10. It
        came back at a matched null. The depth-wall CONCLUSION is therefore supported -
        by my measurement, not by theirs.
    closure_3_algebraic:
      status: CONCLUSION STANDS ON ITS OWN TERMS, VERDICT SENTENCE READS PAST ITS OWN CAVEAT
      what_is_right: >-
        Arithmetic fully reproduced independently. d_reg 62/45/37/33/26 at
        M=4000/6000/7800/9000/12000, N=1408, costs 2^859.1/2^671.6/2^575.9/2^525.9/
        2^434.3 at omega=2.37. Pass 2's correction of O-5 (Groebner/XL is C(N,d)^omega,
        not 2^cN) is right.
      soft_input_now_hardened: >-
        The "39 equations per S-box, UNVERIFIED-FROM-MEMORY" is now DERIVED here and is
        exactly 39. M = 200 x 39 = 7800 for AES-128 is measured, not recalled.
      what_is_wrong: >-
        The verdict line "The algebraic lane does NOT reach exhaustive key search"
        contradicts the receipt's own not_established entry that semi-regularity is an
        assumption. The not_established entry is the correct sentence. 2^434..2^859 is a
        reference point for a system AES demonstrably is not, and is a bound in NEITHER
        direction.
      why_semi_regularity_is_worse_than_admitted: >-
        Each of the 39 quadrics per S-box involves only 16 bits, so as a quadratic form
        in the N=1408 variables it has RANK <= 16 out of 1408. With fresh variables for
        S-box inputs the quadratic generators become VARIABLE-DISJOINT across the 200
        blocks with all coupling carried by linear equations. A semi-regular sequence has
        nothing like this. Null-object control run here: a uniformly random 8-bit
        bijection satisfies ZERO quadratic equations; the AES S-box satisfies 39.
    closure_4_key_indexed_influence:
      status: MEASURABLY OVERSTATED BY ONE ROUND
      what_is_wrong:
        - >-
          The density statistic has no power by construction: any function with balanced
          output bits has expected support density exactly 1/2, so 0.4996 could not have
          come out otherwise past round 2. A controlled null was read as a closure.
        - >-
          MEASURED HERE: the finer per-cell BIAS statistic on the same object is +43.84
          standard deviations from null at r=3, where the density statistic reported
          saturation. It reaches null only at r=4.
        - >-
          Neither probe can see the regime that matters. At 2^20 samples my per-cell sd
          is 4.9e-4, bounding any single-cell key-bit-to-ciphertext-bit correlation only
          below ~2^-8.8. O-8 says a usable filter must be within ~2^-40 of deterministic.
          "At the null" here means "below an instrument ~30 bits too blunt", and that
          limitation is absent from the receipt.
      why_severity_is_high_anyway: >-
        Not because 4-of-10 changes the verdict (it does not) but because the MECHANISM
        generalizes: a coarse projection of an object reports death earlier than the
        object dies. Every "dead at round k" in this campaign was measured through a
        projection with no finer-statistic control. This is the correlated blind spot the
        single-model search was expected to have, and here it is, measured.

  objections:
    - id: OBJ-1
      severity: high
      target: O-3 amortization ceiling, and pass 1's forward guidance for it
      objection: >-
        The S-box is not established as the right atom and the test is not established as
        per-candidate. A procedure spending c S-boxes to eliminate a structured set of
        2^t candidates pays c/2^t per candidate; O-3's ceiling assumes t = 0. Nothing in
        O-3, D-3, O-7 or O-8 bounds t. The disposal sentence "batch elimination moves the
        attack into class A" is unproved and is the whole closure.
      why_it_is_a_hole_not_a_candidate: >-
        The program already owns the instrument. GATE 1 measured rho_min = 0.77 for ONE
        coset family (the biclique-style one). The quantity that decides O-3 is the
        minimum over structured set families of (work per set)/(set size), and no other
        family was ever measured.
      required_control: the mu-curve experiment in next_action, with its null object
    - id: OBJ-2
      severity: high
      target: influence_support_receipt.json verdict "D3 is closed ... dead at round 3"
      objection: >-
        Off by one round, measured. The density statistic is a lossy projection with no
        power; the per-cell bias statistic on the identical object is 43.84 sd from null
        at r=3.
      measured_refutation: MEAS-RT-B (below)
      residual: >-
        The corrected death round is 4 of 10, so the closure's CONCLUSION is unchanged.
        The objection is to the method and to its generalization to the other closures.
    - id: OBJ-3
      severity: high
      target: >-
        the promotion of one measured property (integral) into a class-wide "depth wall"
      objection: >-
        depth_wall_receipt.json says correctly that it measured ONE property;
        influence_support_receipt.json then cites it as closing "the structural classes".
        Properties whose survival depth was NEVER measured here, all cheap on 4 cores
        with AES-NI, listed in required_controls below.
      also: >-
        Two recalled figures inside depth_wall_receipt.json are used to DISMISS without a
        recall tag. That is the half of DEC-20260731-019 ruling 3 most likely to be
        forgotten, and it was forgotten.
    - id: OBJ-4
      severity: medium-high
      target: algebraic_lane_receipt.json verdict sentence
      objection: >-
        Reads past its own not_established. Semi-regularity is not merely "an assumption";
        the AES system is provably far from it (rank-16 forms out of 1408, block-disjoint
        generators, 39 quadrics per S-box against 0 for a random bijection). The number is
        a reference point, not a bound in either direction, and the verdict should say so.
    - id: OBJ-5
      severity: medium-high
      target: both ideation passes - the key schedule as a standalone object
      objection: >-
        Never treated as an object. Pass 1 reached it only via sigma(K) (LP-1) and the key
        mask (LP-2); pass 2 only via D-6. Nobody measured it. Measured here for the first
        time in this program (MEAS-RT-D): the AES-128 key-schedule bit-level influence
        support SATURATES AT EXACTLY 25/32 = 0.78125 and never reaches 1 - 3584 of 16384
        (master-bit, round-key-bit) pairs flip in ZERO of 200000 random keys at every
        round from 5 to 10. AES-192 saturates at 0.8750, AES-256 at 0.78125. The data path
        saturates; the key schedule never does.
      does_it_give_an_attack: >-
        NO. The AES-128 key schedule is invertible from any single round key, so this is a
        statement about coordinates, not information, and it is exactly the shape LP-1
        correctly rejected. It is reported because it FALSIFIES the diffusion reasoning
        that D-3 and the two-round-full-dependence claims rest on.
      self_correction: >-
        My own symbolic transitive-closure computation says support reaches 1.0 at round 5
        and is WRONG, because OR-propagation cannot represent XOR cancellation. The
        sampled measurement against the CPU's own aeskeygenassist schedule is the correct
        one. Anyone re-deriving this by dependency-graph reasoning gets the wrong answer,
        which is plausibly why both passes' diffusion arguments read as obviously true.
    - id: OBJ-6
      severity: medium
      target: baseline_map.md deduplication register
      objection: >-
        Invariant subspaces and NONLINEAR invariants are merged into one table row with
        one shared verdict. They are different objects (a preserved set versus a preserved
        function). Neither pass noticed. Closed on cost grounds by OBJ-8's weak-key
        arithmetic rather than by the merged row's argument.
    - id: OBJ-7
      severity: medium
      target: instrument resolution across the whole campaign
      objection: >-
        Both the published influence probe (8 trials) and mine (2^20 samples) are roughly
        30 bits too blunt to see the bias regime O-8 identifies as decisive. No receipt
        states its own detection floor against the threshold its companion obstruction
        demands. "At the null" is being reported as "no structure".

  measurements_taken_by_this_red_team:
    - id: MEAS-RT-A
      name: exact low-degree equation count for the AES S-box, with a null bijection control
      source: sbox_eq.c
      provenance: >-
        S-box rebuilt from the GF(2^8) inverse and the fixed affine map; cross-checked
        against the CPU's AESENCLAST on all 256 inputs, 0 mismatches.
      result:
        deg2_all: {monomials: 137, rank: 98, independent_equations: 39}
        deg2_biaffine: {monomials: 81, rank: 58, independent_equations: 23}
        deg3_all: {monomials: 697, rank: 226, independent_equations: 471}
        null_random_bijection_deg2: {monomials: 137, rank: 137, independent_equations: 0}
      consequence: >-
        The receipt's "39 UNVERIFIED-FROM-MEMORY" is exactly right and is now derived.
        M = 7800 for AES-128 is measured. The null control (0 quadrics for a random
        bijection) is the structured-vs-generic separation that makes the semi-regular
        reference the wrong reference.
    - id: MEAS-RT-B
      name: per-cell key-bit -> ciphertext-bit influence BIAS, with matched null
      source: infl_bias.c
      method: >-
        For each of 128 key bits, flip it and record for each of 128 ciphertext bits the
        empirical probability of flipping, over 2^18 or 2^20 random (K,P). Null: second
        encryption uses an independent random key instead of the flipped key.
        chi^2 over 16384 cells, E = 16384, sd = 181.0.
      result_chi2_deviation_in_sd:
        r3_flip_2p18: 43.84
        r4_flip_2p18: -0.06
        r4_flip_2p20: -0.92
        r5_flip_2p20: -0.74
        r6_flip_2p20: 0.06
        r6_null_2p20: 0.10
        r10_flip_2p18: -0.50
        r10_null_2p18: -1.96
      consequence: closure 4 is off by one round; the finer statistic dies at r=4, not r=3
      honest_limit: >-
        per-cell sd 4.9e-4 at 2^20 samples; bounds a single-cell correlation only below
        about 2^-8.8 and a uniform per-cell bias below about 2^-13.5. O-8 needs 2^-40.
    - id: MEAS-RT-C
      name: mixture / exchange quadruple - a structural property neither pass enumerated
      source: mixture.c, mixture2.c
      derivation_verified_on_machine: >-
        TEST0 HOLDS, 2000/2000 quadruples, every run. For p1,p2 differing only in the
        ShiftRows diagonal and T a proper nonempty subset of it, the mixture pair (p3,p4)
        has an IDENTICAL state difference after one full round while the absolute states
        differ. Derived from scratch: {p3,p4} = {p1,p2} bytewise as multisets, so
        S(p3_i)+S(p4_i) = S(p1_i)+S(p2_i), and the rest of the round is GF(2)-affine.
      raw_first_run_2p24:
        r4_mix: {ratio: 1.0354, z: 8.81}
        r5_mix: {ratio: 1.0306, z: 7.61}
        r4_null: {ratio: 1.0020, z: 0.50}
        r5_null: {ratio: 1.0009, z: 0.22}
      self_red_team: >-
        Signal was nearly FLAT from r=4 to r=5, which is the artifact tell. Computed the
        degeneracy exactly: when the diagonal bytes of p1,p2 coincide on all of T the
        mixture pair IS the original pair, probability 1.12e-3, excess 6.4e-5 - about HALF
        the observed 1.31e-4. Added an all-four-bytes-differ guard and re-ran.
      guarded_run_2p25:
        r4_mix: {ratio: 1.0121, z: 4.20}
        r4_null: {ratio: 1.0178, z: 6.17}
        r5_mix: {ratio: 1.0118, z: 4.11}
        r5_null: {ratio: 1.0153, z: 5.31}
        r6_mix: {ratio: 1.0182, z: 6.31}
        r10_mix: {ratio: 1.0091, z: 3.15}
        r10_null: {ratio: 1.0147, z: 5.11}
      verdict: >-
        CONTROLLED NULL, NOT A FINDING. The residual excess is present equally in the null,
        is flat from r=4 to r=10, and the mixture arm is never above the null arm. Its
        source (shared key within a quadruple, or my xorshift64 PRNG) is UNIDENTIFIED and
        is an unexplained artifact in my own instrument, flagged rather than hidden.
      what_this_does_NOT_license: >-
        The object is verified to exist; exactly ONE lossy readout of it was tested.
        Calling the object dead on this evidence would be the fatigue report this red team
        exists to police. The r=2/r=3 identical-difference survival probability and the
        joint difference distribution are untested.
    - id: MEAS-RT-D
      name: the AES key schedule as a standalone object
      source: ks_standalone.c, ks_verify.c, ks_zero.c
      provenance: >-
        Key schedule rebuilt from the FIPS-197 word recurrence and cross-checked word by
        word against the CPU's aeskeygenassist path, 0 mismatches on all 11 AES-128 round
        keys. The saturation result was then re-measured using the CPU's schedule only.
      result_aes128_support_density_by_round:
        r1: 0.0820
        r2: 0.3242
        r3: 0.5137
        r4: 0.7090
        r5_through_r10: 0.781250
      permanently_zero_cells_aes128: 3584 of 16384 (0.218750) at every round 5..10, in 200000 keys
      saturation_aes192: 0.8750
      saturation_aes256: 0.781250
      slide_precondition: >-
        0 repeated round keys in 200000 random schedules for each of AES-128/192/256,
        null expectation ~1e-31. The single-key slide precondition is now measured rather
        than asserted from Rcon.
      my_own_error_reported: >-
        A naive OR-based symbolic dependency closure gives support 1.0 at round 5 and is
        wrong; it cannot represent XOR cancellation.
    - id: MEAS-RT-E
      name: independent reproduction of the algebraic lane arithmetic
      result: >-
        Hilbert-series d_reg 62/45/37/33/26 at M=4000/6000/7800/9000/12000, N=1408, and
        costs 2^859.1/2^671.6/2^575.9/2^525.9/2^434.3 at omega=2.37. Exact agreement with
        algebraic_lane_receipt.json. Its arithmetic is correct.

  classes_neither_pass_considered:
    - id: NC-1
      name: time-memory(-data) tradeoffs (Hellman / rainbow / Biryukov-Shamir style)
      evidence_of_omission: >-
        "TMTO", "Hellman", "rainbow", "Biryukov" appear ZERO times in either candidate
        report, either companion document, or baseline_map.md.
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        Building any table over the key space applies the target function to 2^128 points,
        so PRECOMPUTATION ALONE equals the worst-case reference and exceeds the 2^127
        expected-case reference. Charging inverse success probability (coverage < 1) only
        raises the total, so the direction of the inequality is safe. Additionally the
        reference has O(1) memory and a TMTO does not, so on the Pareto frontier the TMTO
        is dominated on the MEMORY axis as well. This needs no literature: it follows from
        "the table must be built". The van Oorschot-Wiener-style interpolation back to the
        baseline is the honest framing - a TMTO relocates cost along the memory axis and
        does not move the exponent - and belongs in the record.
      recall_marker: >-
        That block-cipher TMTOs are classically presented as amortizing over MANY targets
        is UNVERIFIED-FROM-MEMORY, recall MEDIUM, and is used for neither promotion nor
        dismissal. The arithmetic above stands without it.
    - id: NC-2
      name: multi-target / multi-key
      evidence_of_omission: >-
        One clause in baseline_map.md ("changes the problem, not the cipher"), no
        arithmetic anywhere.
      in_scope_as_single_key_full_round: false
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        Out of scope because the success criterion changes, AND it does not help: exhaustive
        search against m targets costs 2^128 evaluations TOTAL (one pass over the key
        space, testing each trial key against a hash table of the m ciphertexts at O(1)
        amortized cost), i.e. 2^(128 - log2 m) per key. THE REFERENCE AMORTIZES OVER
        MULTIPLE TARGETS EXACTLY AS WELL AS ANY TMTO DOES. The one-clause dismissal reaches
        the right answer without this arithmetic; the arithmetic is what makes it a closure
        rather than a preference.
    - id: NC-3
      name: weak-key classes of nonzero density
      evidence_of_omission: >-
        Appears twice, both times as a sampling caveat inside CAND-FR-2, never as an attack
        class. "weak key"/"weak keys" appear zero times.
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        Total cost = per-attempt cost x inverse success probability. For density 2^-d and
        in-class gain g bits, E[total] = 2^-d * 2^(128-d-g) + (1 - 2^-d) * 2^128, which
        gives 2^127.9944 at (d=8,g=8), 2^128.0000 at (d=32,g=32), 2^128.0000 at
        (d=64,g=64) and 2^127.3219 at (d=1,g=1). ONLY A CLASS OF CONSTANT DENSITY MOVES
        ANYTHING, and then only by its own gain. Sharp consequence for pass 1: its own
        record says "a weak-key class of density below 2^-30 is INVISIBLE to this
        experiment" - correct, and now also IRRELEVANT, since a class that thin cannot beat
        the reference even if it exists. Four lines neither pass wrote.
    - id: NC-4
      name: the key schedule as a standalone object
      evidence_of_omission: >-
        45 mentions of "key schedule", every one of them through the data path (LP-1, LP-2,
        D-6). No standalone measurement.
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        Measured for the first time in this program (MEAS-RT-D). Does not beat the
        reference: the AES-128 schedule is invertible from any single round key, so its
        coordinate sparsity carries no entropy loss. Reported because it FALSIFIES the
        diffusion reasoning D-3 rests on, not because it is an attack.
    - id: NC-5
      name: single-key slide / self-similarity of the round sequence
      evidence_of_omission: '"slide attack" appears zero times; one table row asserts Rcon breaks it.'
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        Closed by MEAS-RT-D: 0 repeated round keys in 200000 schedules per key size,
        plus the elementary fact that round constants differ per round. Now measured
        rather than asserted.
    - id: NC-6
      name: set-amortized (non-MITM, non-statistical) candidate elimination
      evidence_of_omission: >-
        Named in one clause of O-3's forward guidance and disposed of by assertion. Never
        given an object, a test, or a measurement.
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: NOT ADJUDICABLE FROM THE EXISTING RECORD
      adjudication: >-
        THIS IS THE LIVE GAP. See OBJ-1 and next_action. It is not closed and it is not a
        candidate either; it is an unmeasured quantity (mu, the minimum over structured key
        set families of work-per-set divided by set size) on which the entire enumerative
        closure depends.
    - id: NC-7
      name: nonlinear invariants as objects distinct from invariant subspaces
      evidence_of_omission: merged into a single deduplication-register row with a shared verdict
      in_scope_as_single_key_full_round: true
      beats_exhaustive_search_when_everything_charged: false
      adjudication: >-
        For a single-key attack a nonlinear invariant generically requires a weak-key class,
        which NC-3's arithmetic closes on cost grounds regardless of whether one exists.
        Named because the register merged two distinct objects and neither pass noticed.

  required_controls:
    - >-
      NULL-OBJECT CONTROL FOR EVERY "DEAD AT ROUND k" IN THE CAMPAIGN. Each was measured
      through one projection with no finer-statistic companion. MEAS-RT-B shows the error is
      at least one round in the one case checkable inside this timebox.
    - >-
      DETECTION FLOOR STATED IN EVERY RECEIPT, against the threshold its companion
      obstruction demands. O-8 demands 2^-40; the influence probes resolve ~2^-9. No receipt
      currently states this.
    - >-
