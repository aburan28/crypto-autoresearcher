  honest_accounting:
    protocol_reference: docs/inventor-protocol.md section 5.
    objects_considered:
      - object: the residue class of A modulo p
        verdict: retained. Lossy-projection test PASSED (discards seed, hash chain and B;
          what is discarded is discarded compatibly with the F_p-isomorphism action
          A -> A*Z^4). Used by L02 and L07.
      - object: the pair (t, s) - trace and conductor of the endomorphism order
        verdict: retained. PASSED (t is an isogeny-class invariant; s can only shrink
          along an isogeny). Used by L06 and D05, and it is where this session's one
          sharp numeric prediction lives (s = 11).
      - object: the multiplicative order ord_ell(p)
        verdict: retained by REUSE of IDEA-20260807-98a970, not re-derived. PASSED there.
      - object: the 2-primary structure of E(F_p)
        verdict: retained. PASSED (invariant under F_p-isomorphism; it is exactly the
          datum on which Montgomery-model existence, complete-Edwards existence and
          Elligator 2 all turn, so what it discards is discarded compatibly with all
          three). This is the session's one genuine consolidation - three separate
          SafeCurves criteria (ladder, complete, ind) collapse onto ONE measurement with
          three readouts.
      - object: the deterministic SHA-1 generation transcript
        verdict: retained WITH AN EXPLICIT FAILURE of the lossy-projection test, stated
          rather than hidden. It is a preimage, not a lossy projection. Kept only because
          it yields a cheap, contested bit (reproduces / does not reproduce) against a
          named procedure. It is NOT offered as a new tracked object.
      - object: the hex-digit overlap statistic between A and B
        verdict: retained as a MEASUREMENT with a null calibration, not as a mechanism.
          SRC-BADA55-BRAINPOOL already attributes the overlap to the Brainpool seed
          schedule, so reproducing it is a reproduction of a documented artefact.
      - object: the isogeny-volcano position implied by s
        verdict: CONSIDERED AND NOT PURSUED as an attack lane. Small s places the curve
          low in its volcano, but at |D| approximately 2^377.5 there is no known ECDLP
          consequence, and proposing a lane on that basis would have been an experiment
          with no possible informative negative. Recorded in D05 as a structural
          observation with the explicit statement that it carries no known consequence.
    dominated_by: >-
      Checked, not left null. As an ATTACK: nothing is claimed, and the plan is dominated
      on time, memory and data by rho at 0.886*sqrt(ell) with O(1) memory (KN-TECH-001,
      KN-TECH-006), by BSGS (KN-TECH-031, KN-TECH-035), by automorphism-discounted rho on
      small-|D| curves (KN-TECH-018), by MOV/Frey-Ruck at small embedding degree
      (KN-TECH-032) and by the anomalous additive transfer (KN-TECH-033). As an AUDIT
      INSTRUMENT: dominated by SafeCurves itself, which has published all eleven cells
      and most of the additional-diagnostic quantities for this exact curve since 2013
      and dominates on authority, completeness and priority; and on specific cells by RFC
      5639 Section 3's own security requirements and by ANSI X9.62 / SEC 1
      parameter-validation procedures. This session's artifacts dominate none of them on
      any axis except LOCALITY - re-verifiable certificates inside this program's ledger
      instead of third-party assertions - plus four checks the cited sources publish
      conclusions for without publishing the check (audit-plan L05 T3, L06 T2, L08's
      two-route disagreement test, D08's null-calibrated statistic).
    sota_delta: >-
      Zero speedup against any attack baseline on any axis; no attack is proposed.
      Quantitatively as DATA: a grep over knowledge/ for 'brainpool' returned NO FILES, so
      this program's corpus currently holds zero parameters, zero embedding degrees, zero
      discriminants, zero traces and zero orders for any Brainpool curve. This session
      adds a sourced 8-field parameter tuple with per-field provenance, 13 hand
      verifications, and 19 preregistered comparison targets. The audit plan, if run,
      would add an estimated 14 rows with certificates re-verifiable in under one second,
      3 rows with a non-succinct bound whose verification cost is stated, and 2 rows
      recorded UNRESOLVED with named successor conditions.
    closures_enumerated:
      - closure: The blocker 'no primary source for the brainpoolP384t1 parameter tuple is
          reachable by this role' is CLOSED.
        mechanism: RFC 5639 is present in the committed hash-pinned mirror
          SAFECURVES-20260825 and was read with the Read tool. The obstruction was a tool
          defect (WebFetch returns 502 on cr.yp.to; also returns summarizer-corrupted
          numbers generally), not a source availability problem, and the mirror routes
          around it.
        forward_guidance: no producer in this campaign should spend budget on WebFetch for
          any source already in the mirror; and the mirror's extraction_fidelity block
