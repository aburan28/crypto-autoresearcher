  limitations_of_this_task:
    - This role has no Bash and no computer-algebra backend, so it executed no arithmetic.
      Every verification here is a hand check whose method is written out. Anything
      requiring 384-bit computation is delegated, and the artifacts say so at each point
      rather than asserting an unverified equality.
    - The staged mirror is retrieved primary text but THIS PRODUCER DID NOT FETCH IT. Its
      provenance label throughout is 'retrieved (staged mirror SAFECURVES-20260825)' plus
      the per-file sha256, never 'retrieved by this producer'.
    - The intake row is character-identical to the SafeCurves table (capsule V2, V5), so
      intake and SafeCurves are not independent witnesses. Only RFC 5639 provides
      independence, and it supplies no decimal for B.
    - Every SafeCurves-published quantity carried forward (trace, discriminant and its
      factorisation, embedding degree, ell', twist cofactor, and all cost exponents) is a
      third-party computation reproduced nowhere in this task. V13 shows only that three
      of them are mutually coherent.
    - The two order-of-magnitude predictions this producer derived by hand (the conductor
      s = 11, and the leading-digit consistency checks V6 and V7) rest on 8-10
      significant digits of hand arithmetic. They are preregistered predictions, not
      results, and V6/V7 in particular check roughly 33 of 384 bits and cannot see an
      error in the low bits.
    - The audit plan's budgets are estimates for a pure-Python environment. If the
      executing environment differs, the budgets and the stopping rules must be
      renegotiated before the plan is run, and a lane that stops on budget is an
      operational observation and never a negative mathematical result.
    - The object assignments in the plan are a sketch, not a taxonomy: this program has no
      written object-enumeration for the ECDLP (KN-OPEN-019).

