  hand_verifications:
    preamble: >-
      Each item states the exact comparison performed, the exact source lines, and what
      the item does NOT establish. These are string comparisons and small hand
      computations by a tool-less role. A reviewer can redo every one of them by eye.
    - id: V1
      claim: The intake decimal modulus is character-identical to RFC 5639 Appendix A.1's
        decimal `p_384`.
      method: >-
        Digit-by-digit comparison in groups of ten. RFC line 1318 supplies the first 58
        digits and line 1319 the remaining 58; concatenated they give 116 digits. The
        intake string is 116 digits. All 116 positions agree.
      result: EXACT MATCH
      strength: strong. This is the one place where the intake decimal meets a PRIMARY
        source in the same base, so no conversion assumption is involved.
      does_not_establish: that p is prime; that the RFC hex p equals this decimal.
    - id: V2
      claim: The intake decimal modulus is character-identical to the SafeCurves decimal p.
      method: comparison against SRC-SC-FIELD line 203 (and the repeat at line 207).
      result: EXACT MATCH
      note: >-
        Corollary that matters for provenance hygiene - the intake row is a faithful
        transcription of the SafeCurves table, so intake and SafeCurves are NOT two
        independent sources. Independence comes only from RFC 5639.
    - id: V3
      claim: The RFC 5639 Section 3.6 hexadecimal p equals the SafeCurves hexadecimal p.
      method: >-
        96 hex characters compared in twelve 8-character blocks, case-insensitively
        (RFC upper case, SafeCurves lower case). RFC line-wrap after `...7FB711` was
        rejoined with line 684's leading `23ACD3...` before comparison.
      result: EXACT MATCH, 96/96 characters, 384 bits.
      consequence: >-
        Two independent sources (RFC 5639 and SafeCurves) each assert the SAME hex string
        and the SAME decimal string for p. The hex-to-decimal bridge is therefore
        CONCORDANTLY ASSERTED by two independent sources. It was not computed here.
    - id: V4
      claim: The brainpoolP384t1 coefficient A equals p - 3, i.e. A is congruent to -3 mod p.
      method: >-
        The 96-hex-character strings for p (lines 683-684) and for the t1 A (lines
        710-711) were compared position by position. They agree in the first 94
        characters; p ends `...EC53` and A ends `...EC50`. A single final-digit
        difference of 3 with no borrow (3 -> 0) gives A = p - 3 exactly.
      result: CONFIRMED by string comparison.
      significance: >-
        This is the retrieved-source confirmation of the `-3x` in the intake equation and
        of the defining property of the Brainpool `t1` family. It also confirms that the
        t1 curve is in the a = -3 class, which is the reason the twisted variant exists.
      does_not_establish: that the r1 -> t1 isomorphism via Z is correct (lane L07 T3).
    - id: V5
      claim: The intake equation string is character-identical to the SafeCurves equation
        string for brainpoolP384t1.
      method: comparison against SRC-SC-EQUATION line 190; the same string also occurs at
        SRC-SC-INDEX line 313.
      result: EXACT MATCH, including the `y^2 = x^3-3x+` prefix and all 116 digits of B.
      note: same non-independence corollary as V2.
    - id: V6
      claim: The RFC 5639 hexadecimal B for brainpoolP384t1 is CONSISTENT with the
        SafeCurves decimal B to about ten significant decimal digits.
      method: >-
        Leading-32-bit magnitude check, done by hand. 0x7F519EAD = 2136055469.
        2136055469 / 2^32 = 0.49733917 (to 8 places). 2^384 = 3.940200619639448e115.
        Product = 1.959616106e115. The SafeCurves decimal B, read as a magnitude, is
        1.9596161053e115 and has 116 digits, consistent with a 384-bit value whose
        leading hex digit is 7.
      result: CONSISTENT to ~10 significant decimal digits.
      explicitly_not_a_verification: >-
        This checks roughly 33 of 384 bits. It CANNOT detect an error in the low 350
        bits. Full equality is DELEGATED (lane L02 sub-test T1). Reported as a
        consistency check precisely so it is not mistaken for a match.
    - id: V7
      claim: The RFC 5639 hexadecimal p is CONSISTENT with the shared decimal p to about
        nine significant decimal digits.
      method: >-
        Same leading-32-bit method. 0x8CB91E82 = 2360942210; /2^32 = 0.5496996944;
        times 2^384 = 2.165927068e115, against the decimal magnitude 2.1659270770e115.
      result: CONSISTENT to ~9 significant decimal digits (residual difference is within
        this producer's hand-arithmetic error).
      explicitly_not_a_verification: same limitation as V6.
    - id: V8
      claim: The RFC 5639 t1 order `q` in hexadecimal equals the SafeCurves `ell` in
        hexadecimal.
      method: 96 hex characters compared in 8-character blocks, case-insensitively, after
        rejoining the RFC's line wrap after `...CAC0425`.
      result: EXACT MATCH, 96/96.
    - id: V9
      claim: The RFC 5639 t1 base-point coordinates in hexadecimal equal the SafeCurves
        base-point coordinates in hexadecimal.
      method: as V8, for x and for y separately, after rejoining RFC line wraps.
      result: EXACT MATCH for both coordinates.
    - id: V10
      claim: The cofactor is 1 in all three retrieved sources.
      method: direct read of RFC line 725 (`h = 1`), SRC-SC-LADDER line 227, SRC-SC-TWIST
        line 698.
      result: CONCORDANT.
    - id: V11
      claim: RFC 5639 gives brainpoolP384r1 and brainpoolP384t1 the SAME order `q`.
      method: 96-character comparison of lines 698-699 against lines 722-723.
      result: EXACT MATCH.
      significance: consistent with t1 being F_p-isomorphic to r1 (an isomorphism
        preserves the group order), and it is the reason the r1 lane's order data
        transfers to t1. It is a consistency check, not a proof of the isomorphism.
    - id: V12
      claim: p, B and ell each have exactly 116 decimal digits.
      method: hand count in groups of ten.
      result: CONFIRMED for all three.
      significance: consistent with all three lying in [2^383, 2^384), which for p is
        also required by RFC 5639 Appendix A.1 step 3.
    - id: V13
      claim: >-
        p + 1 - ell equals EXACTLY the trace t that SafeCurves reports for
        brainpoolP384t1, namely
        5973228999478432667446284273866865475630836211106699249391.
      method: >-
        Full 116-digit decimal subtraction p - ell by hand. The leading 57 digits of p
        and ell are identical, so the subtraction reduces to a 59-digit subtraction of
        the tails, performed in six blocks from the right with borrows and checked block
        by block against the target - blocks obtained were 6699249390, 3083621110,
        8668654756, 7446284273, 9947843266, 59732289, which reassemble to the 58-digit
        value 5973228999478432667446284273866865475630836211106699249390. Adding 1 gives
        the SafeCurves trace exactly.
      result: EXACT MATCH.
      strength: >-
        The single strongest internal-consistency result in this capsule. It ties three
        independently tabulated SafeCurves decimal strings (p from field.html, ell from
        base.html, t from disc.html) into one arithmetic identity, by hand, with no tool.
      does_not_establish: >-
        that #E = p + 1 - t for this curve. That requires verifying that the base point
        has order ell and that the cofactor is 1 (lane L03). V13 shows the tabulated
        numbers are arithmetically coherent under the assumption #E = h*ell with h = 1.

