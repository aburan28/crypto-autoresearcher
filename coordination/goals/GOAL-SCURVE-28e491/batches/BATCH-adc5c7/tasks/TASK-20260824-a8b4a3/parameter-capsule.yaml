  generation_procedure_as_retrieved:
    note: Recorded verbatim-in-structure from SRC-RFC5639 Appendix A so lane L07 has a
      concrete, reproducible target rather than a description.
    seed_p_384: 5F12C7F9924A19947B3916CF70801F2E2858EFC1
    seed_p_384_source: SRC-RFC5639 lines 1281-1282
    seed_ab_384: BCFBFA1C877C56284DAB79CD4C2B3293D20E9E5E
    seed_ab_384_source: SRC-RFC5639 lines 1434-1435
    seed_derivation_asserted:
      primes: the seven Seed_p values are the first seven 160-bit substrings of
        Q = Pi * 2^1120 (SRC-RFC5639 lines 1295-1300)
      coefficients: the seven Seed_ab values are the first seven 160-bit substrings of
        R = floor(e * 2^1120) (SRC-RFC5639 lines 1440-1445)
    update_seed: s -> bit string of ((integer(s) + 1) mod 2^160) (lines 1202-1207)
    find_integer: v = floor((L-1)/160), w = L - 160v; h_0 = w rightmost bits of SHA-1(s);
      h_i = SHA-1(bitstring((z+i) mod 2^160)) for i = 1..v; x = integer(h_0||...||h_v)
      (lines 1217-1248)
    prime_procedure: c = find_integer(s); p = smallest prime >= c with p = 3 mod 4;
      accept iff 2^(L-1) <= p <= 2^L - 1, else update seed and retry (lines 1250-1259)
    find_integer_2: identical to find_integer except w = L - 160v - 1 (lines 1330-1362)
    curve_procedure_steps_1_to_14: A = find_integer_2(s); require -3 = A*Z^4 mod p
      solvable; Z is one solution; s = update_seed(s); B = find_integer_2(s); require B
      a non-square mod p; require 4A^3 + 27B^2 nonzero mod p; require the Section 3
      security and functional requirements; s = update_seed(s); k = find_integer_2(s);
      P = one of the two points with the smallest x-coordinate; G = k*P (lines 1364-1409)
    retrieved_source_defect_observed:
      what: SRC-RFC5639 line 1437 reads 'Seed_ab_512 for brainpoolP384r1:' where the
        surrounding list structure and lines 1440-1445 indicate it labels the 512-bit
        curve.
      classification: apparent editorial typo in the primary specification, recorded
        because lane L07 must not silently "correct" a primary document.
      impact_on_this_curve: none for the 384-bit seeds, which are at lines 1434-1435 and
        are unambiguous. Recorded for completeness and for any successor task that
        extends to brainpoolP512t1.
    third_party_challenge_to_the_transcript:
      source: SRC-BADA55-BRAINPOOL
      verbatim: 'none of the standard Brainpool curves below 512 bits were generated by
        the standard Brainpool curve-generation procedure.'
      also_verbatim: 'A different procedure that does generate the Brainpool curves
        appeared a few years later in the first Brainpool RFC.'
      also_verbatim: 'there is a highly nonrandom overlap of digits between the
        "pseudo-random" coefficients A and B in most of the Brainpool curves
        y^2 = x^3+Ax+B'
      also_verbatim_caveat_on_their_scripts: 'For simplicity, these implementations skip
        checking a few security criteria that have negligible probability of failing,
        such as having large CM field discriminant.'
      consequence_for_this_curve: >-
        brainpoolP384r1 is below 512 bits, so this assertion covers it. The audit
        therefore has TWO candidate generation procedures and must name which one it
        reproduces. Only the RFC 5639 procedure is retrieved; the 2005 standard
        procedure is not (see sources_unretrieved).

  conflicts_and_granularity_notes:
    - id: C1
      type: granularity collapse, NOT a contradiction
      statement: >-
        The intake records `rigid: true` (a boolean). SRC-SC-RIGID records
        'somewhat rigid (check)' for brainpoolP384t1, on a three-valued scale whose other
        values are 'fully rigid (check)' (e.g. Curve41417, line 284) and 'manipulatable'
        (e.g. NIST P-384, line 277). The boolean True in the intake and in the
        SafeCurves index column is the site's own collapse of 'somewhat rigid' to True.
      status: RESOLVED as a labelling nuance. Recorded so no later task reports
        'rigidity reproduced: True' without the qualifier.
      audit_consequence: lane L07 preregisters the THREE-valued target, not the boolean.
    - id: C2
      type: provenance non-independence
      statement: >-
        By V2 and V5 the intake's modulus and equation strings are character-identical to
        the SafeCurves index/field/equation strings. The intake is therefore a
        transcription of SafeCurves, not an independent witness. Agreement between intake
        and SafeCurves is expected and carries no confirmatory weight.
      status: RESOLVED as an interpretation constraint.
      audit_consequence: RFC 5639 is the only independent parameter source available;
        the capsule's cross-checks are RFC-vs-SafeCurves, never intake-vs-SafeCurves.
    - id: C3
      type: primary-source editorial defect
      statement: RFC 5639 line 1437 mislabels Seed_ab_512 as belonging to brainpoolP384r1.
      status: RECORDED, no impact on the 384-bit tuple (see above).
    - id: C4
      type: open gap, not a conflict
      statement: >-
        The hexadecimal-to-decimal bridge for p, ell, x_1 and y_1 is CONCORDANTLY
        ASSERTED by two independent sources (RFC 5639 and SafeCurves) and was checked
        here only in the leading ~32 bits (V6, V7). This producer performed no base
        conversion.
      status: OPEN, delegated to lane L02/L03.
      falsifier_if_it_ever_fails: a computed conversion disagreeing with either tabulated
        decimal would invalidate that decimal and every downstream lane using it,
        including V13.
    - id: C5
      type: open gap, sharpest one
      statement: >-
        The coefficient B of brainpoolP384t1 exists in the PRIMARY source only in
        hexadecimal (RFC 5639 lines 713-714). Its decimal form comes solely from
        SafeCurves. The 116-digit decimal B has NO independent primary corroboration.
      status: OPEN, delegated to lane L02 sub-test T1, which is a single base conversion.
      why_it_is_the_sharpest: the intake's entire equation string rests on this one
        unbridged number, and the check that closes it costs microseconds.
    - id: C6
      type: two competing procedures for the same criterion
      statement: >-
        The intake attributes the curve to the '2005 Brainpool' standard; the only
        generation procedure retrievable here is RFC 5639 (2010) Appendix A;
        SRC-BADA55-BRAINPOOL asserts these differ and that the 2005 procedure does not
        produce the sub-512-bit curves.
      status: PARTIALLY OPEN. The RFC procedure is reproducible now; the 2005 procedure
        is blocked on an unretrieved document.
      audit_consequence: lane L07 is split into T1/T2 (RFC procedure, runnable) and T5
        (2005 procedure, blocked with a named successor condition).
    - id: C7
      type: unverified third-party arithmetic carried forward
      statement: >-
        The trace, D and its factorisation, the embedding degree, ell', the twist
        cofactor factorisation, and every cost exponent are SafeCurves' own computed
        outputs. They are preregistered targets. This capsule reproduces none of them,
        and V13 shows only that three of them are mutually coherent.
      status: OPEN by design; lanes L04, L05, L06, L09 and D01-D05 exist to reproduce them.

