audit_plan:
  task_id: TASK-20260824-a8b4a3
  goal_id: GOAL-SCURVE-28e491
  question_id: RQ-SCURVE-826a9f
  batch_id: BATCH-adc5c7
  curve: brainpoolP384t1
  produced_by: idea-generator
  produced_at: '2026-08-25'
  companion_artifact: ./parameter-capsule.yaml
  status: PLAN ONLY. Nothing here has been executed. No lane below has a result.

  authority_and_claim_boundary:
    - This is a proposal. It assigns no work, approves no experiment, and changes no
      hypothesis status. Only the Coordinator may do those things.
    - No curve attack was run and none is proposed. Every lane is a parameter
      measurement or a transcript reproduction on public parameters and generated
      controls.
    - No lane may conclude that brainpoolP384t1 is safe, unsafe, vulnerable, or free of
      vulnerabilities. Lanes reproduce or fail to reproduce specific published numbers.
    - Per the goal's claim boundaries, a failure of rigidity, ladder availability,
      completeness, or indistinguishability is NOT an ECDLP break, and no lane may be
      reported as if it were.
    - Infrastructure errors, timeouts, unavailable dependencies and budget stops are
      operational observations, never mathematical evidence. Any lane that stops on
      budget is reported as INCOMPLETE, never as a negative result.
    - Only public parameters and generated controls are used. No live private key is
      tested, requested, stored, or derived.

  internal_dependency_reuse:
    id: IDEA-20260807-98a970
    what_is_reused: >-
      Its embedding-degree audit design is reused verbatim in structure for lane L05 and
      diagnostic D04 - the two certificate forms (EXACT-k via the factorisation of
      ell-1 with one witness exponentiation per prime factor; LOWER-BOUND k > K via K
      modular multiplications with the honest disclosure that verification also costs K),
      the three degenerate flags (p = 1 mod ell, ell = p, ell^2 | #E), the
      representability wall k*ceil(log2 p) bits, and its null_object_control set (toy BN
      k = 12, toy p = 1 mod ell giving k = 1, toy supersingular giving k = 2, and the
      decay parameter K swept from 10^2 to 10^6).
    what_is_NOT_duplicated: >-
      No new mechanism proposal is minted for embedding degree, anomalous behaviour, or
      full N-torsion. L05 and D04 are a SPECIALISATION of IDEA-20260807-98a970 to one
      curve, adding only the brainpoolP384t1 row, the SafeCurves-published (l-1)/4
      comparison target, and the cheap upper-bracket test T3 below, which that record
      does not contain.
    inherited_limitation_carried_forward: >-
      That record states plainly that its verdict column depends on the crossover
      k*(p, N) from IDEA-20260807-5f24d7 and that any verdict before k* exists is
      provisional. This plan inherits that: L05 reports k or a bracket on k, never a
      verdict.

  object_first_framing:
    protocol_reference: docs/inventor-protocol.md sections 1-2 (object-first generation
      and the lossy-projection test); KN-TECH-056.
    taxonomy_caveat_mandated_by_the_program: >-
      This program has NO written object-enumeration for the ECDLP - that is KN-OPEN-019.
      The object assignments below are therefore a SKETCH, not a taxonomy, and no lane
      may cite them as if a taxonomy existed.
    saturation_note: >-
      Standardised-curve parameter validation is a heavily worked area. This plan does
      NOT treat that as a reason to decline: premature closure is a failure mode
      symmetric with overclaiming (KN-LIT-7594, KN-TECH-056). What the maturity of the
      area DOES justify is the honest expectation, preregistered below, that most lanes
      will reproduce the published values, and that the plan's value lies in converting
      third-party assertions into locally re-verifiable certificates rather than in
      finding a surprise.
    lossy_projection_test_applied:
      - object: the residue class of A modulo p (lanes L02, L07)
        lossiness: >-
          Genuinely lossy - it discards the entire seed, the hash chain, and B. Not a
          change of coordinates: nothing about the generation transcript is recoverable
          from A mod p.
        compatibility: >-
          What is discarded is discarded compatibly with the F_p-isomorphism class
          operation, because an isomorphism (x,y) -> (Z^2 x, Z^3 y) acts on A as
          A -> A*Z^4, which is well defined on residues alone. The retained part
          propagates deterministically without the seed. PASSES.
      - object: the integer pair (t, s) - the trace and the conductor of the endomorphism
        order (lanes L06, D05)
        lossiness: >-
          Extremely lossy - the entire curve collapses to two integers. Not a change of
          coordinates: the curve is not recoverable from (t, s).
        compatibility: >-
          t is an F_p-isogeny class invariant and s can only shrink along an isogeny, so
          the discarded data is discarded compatibly with the operation the lane cares
          about (passage within the isogeny class). PASSES.
      - object: the multiplicative order ord_ell(p) (lane L05, diagnostic D04)
        lossiness_and_propagation: as argued in IDEA-20260807-98a970 - constant under
          F_p-isogeny, maps to k/gcd(k,m) under base change to F_{p^m}. PASSES, by that
          record's argument, which this plan does not restate.
      - object: the 2-primary structure of E(F_p), i.e. the pair (number of points of
        order 2, number of points of order 4) (lanes L08, L10, L11)
        lossiness: >-
          Lossy to two small integers. NOT a change of coordinates. It is invariant under
          F_p-isomorphism, and it is exactly the datum on which Montgomery-model
          existence, complete-Edwards-model existence, and Elligator 2 applicability all
          turn - so what it discards is discarded compatibly with all three model
          conversions. PASSES, and it is the reason L08, L10 and L11 collapse into one
          cheap measurement with three readouts.
      - object: the deterministic SHA-1 transcript (seed, counter, accept/reject trace)
        (lane L07)
        lossiness: >-
          FAILS the lossy-projection test in the strict sense - the transcript determines
          the parameters and is not a lossy projection of them; it is a preimage.
        why_it_is_still_in_the_plan: >-
          Stated explicitly rather than hidden: L07 is not an object-propagation lane. It
          is a REPRODUCTION lane, whose value is a bit (reproduces / does not reproduce)
          against a named procedure. It is included because RFC 5639 states the procedure
          and SRC-BADA55-BRAINPOOL challenges it, so the bit is cheap and contested. It
          must not be marketed as a new tracked object.

  instrument_gate:
    rule: >-
      BLOCKING AND ORDERED FIRST. A measurement instrument that has never been shown to
      fire cannot certify a negative. No lane result on brainpoolP384t1 may be recorded,
      interpreted, or believed until G1-G4 have passed in the SAME code path, on the same
      run, and the passes are recorded in the run record.
    G1_arithmetic_self_test:
      what: SHA-1 against published test vectors; modular exponentiation, integer square
        root, and Jacobi symbol against small hand-checkable cases; short-Weierstrass
        point addition/doubling against a toy curve with a fully enumerable group.
      must_pass: exact equality on every vector.
      budget: under 1 CPU-second.
    G2_positive_controls_must_fire:
      what: the Anomalous curve and BN(2,254), with parameters transcribed from
        SRC-SC-FIELD / SRC-SC-EQUATION / SRC-SC-BASE and then self-checked (base point on
        curve, ell*G = O) before use, per the goal's claim boundary that these rows are
        control CANDIDATES whose parameters still require sourced reproduction.
      must_pass:
        - Anomalous - the additive-transfer flag ell = p must FIRE; the |D| > 2^100 check
          must FAIL with |D| = 11.
        - BN(2,254) - the embedding-degree instrument must return exactly 12; the
          |D| > 2^100 check must FAIL with |D| = 3.
        - the toy planted positives of IDEA-20260807-98a970 (k = 1 curve, supersingular
          k = 2 curve) must return 1 and 2.
      if_any_fails: every lane result in this plan is VOID and nothing is reported.
      budget: under 10 CPU-seconds.
    G3_parameter_matched_negative_controls_must_stay_silent:
      what: NIST P-384, transcribed from SRC-SC-FIELD / SRC-SC-EQUATION / SRC-SC-BASE and
        cross-checked against inputs/SAFECURVES-20260825/specs/fips186-5.txt and
        specs/sp800-186.txt (digits only; verify any digit string against the PDF per the
        mirror's extraction-fidelity note).
      why_it_is_the_right_negative: >-
        384-bit prime field, short Weierstrass with a = -3, cofactor 1, standardised, and
        SafeCurves reports it with the SAME ladder/complete/ind cells and a DIFFERENT
        rigid cell ('manipulatable'). It is matched on every parameter the instruments
        read and differs on exactly one criterion, which is what a negative control is
        for.
      must_pass: no degenerate flag fires; |D| > 2^100 holds; embedding degree exceeds
        10^6; rigid classification comes out 'manipulatable', not 'somewhat rigid'.
      budget: under 30 CPU-seconds.
    G4_same_shape_null_controls:
      what: >-
        N = 20 synthetic curves generated in-session over the SAME prime p as
        brainpoolP384t1, with a = -3 and B drawn uniformly at random from F_p, rejecting
        singular B. Same shape, same field, same code path; the DESIGN INTENT has been
        deliberately removed, which is the structure every rigidity, seed-overlap, and
        digit-pattern instrument claims to detect.
      must_pass:
        - the rigidity instrument must classify all 20 as non-reproducible from any seed
          (it has no seed), i.e. it must NOT emit 'somewhat rigid' for a curve with no
          procedure;
        - the A/B hex-overlap statistic (D08) must have its null distribution measured on
          these 20 before any statement about the real curve's overlap;
        - the |D| > 2^100, embedding-degree and 2-torsion instruments must behave as on
          random curves, giving the reference distribution the real curve is read
          against.
      budget: under 300 CPU-seconds (dominated by 20 point-counting-free checks; note
        that computing #E for the nulls is NOT required and is NOT budgeted - see the
        honest limitation in D01).

  controls_summary_required_before_any_belief:
    positive: >-
      Anomalous (additive transfer, |D| = 11) and BN(2,254) (embedding degree 12,
      |D| = 3), plus the three toy planted positives inherited from
      IDEA-20260807-98a970. Their parameters are third-party and must be sourced and
      self-checked before use, per the goal's claim boundary.
    negative_parameter_matched: >-
      NIST P-384 for every ECDLP and ECC lane (matched: 384-bit prime field, a = -3,
      h = 1, short Weierstrass, standardised). brainpoolP384r1 additionally for lane L07,
      since it is the SAME curve up to the isomorphism under test and differs only in the
      model.
    'null': >-
      The 20 same-shape synthetic curves of G4 over the same p with random B, plus, for
      lane L07, the seed-perturbation null (re-run the RFC procedure with Seed_p_384 and
      Seed_ab_384 each incremented by one) which must NOT reproduce the published curve.
    ordering_rule: controls run FIRST and their outcomes are recorded BEFORE the
      brainpoolP384t1 numbers are looked at, so no lane can be interpreted post hoc.

  lanes:

    - id: L01
      criterion: field
      category: basic_parameter_requirements
      tracked_object: the prime p as an integer, with a primality certificate.
      preregistered_target:
        intake_cell: true
        safecurves_cell: 'True (check)'
        source: SRC-SC-FIELD line 201; requirement verbatim 'However, SafeCurves requires
          prime fields.' (line 262)
      mechanism: >-
        SafeCurves' field criterion is satisfied by a prime field. The lane converts the
        RFC 5639 hexadecimal p to decimal, checks it against both tabulated decimals, and
        then certifies primality.
      quantitative_prediction:
        - metric: computed decimal of the RFC hex p versus the tabulated decimal
          direction: different
          minimum_effect: exact equality on all 116 digits. Any difference is a
            transcription error in one of the sources and stops the goal (see falsifier).
        - metric: bit length of p
          direction: different
          minimum_effect: exactly 384; and 2^383 <= p < 2^384, as RFC 5639 Appendix A.1
            step 3 requires.
        - metric: p mod 4
          direction: different
          minimum_effect: exactly 3, as RFC 5639 Appendix A.1 step 2 requires.
      certificate: >-
        (a) the base conversion, re-verifiable by one multiplication chain;
        (b) a Pocklington primality certificate for p if p-1 can be partially factored to
        more than sqrt(p) within budget, else a BPSW plus 64-round Miller-Rabin
        compositeness-test record, EXPLICITLY LABELLED probabilistic;
        (c) the bit length and p mod 4 as exact integers.
      controls: G1 (integer arithmetic); G2 (the primality routine must call every
        planted composite composite and every small known prime prime); G3 (NIST P-384's
        p must certify); G4 (a random 384-bit odd composite must be rejected).
      budget: 30 CPU-seconds for (a) and (c); 600 CPU-seconds ceiling for the Pocklington
        attempt.
      stopping_rule: stop the Pocklington attempt at 600 s and record the probabilistic
        result with the reason. Do not extend.
      falsifier: >-
        The computed decimal differs from either tabulated decimal; or bit length is not
        384; or p mod 4 is not 3; or any compositeness test succeeds. Any of these is a
        parameter-tuple conflict and triggers the goal's pause condition rather than a
        silent correction.
      honest_limitation: >-
        A BPSW/Miller-Rabin outcome is a probabilistic statement about p, not a proof.
        The lane reports which of the two certificate forms it produced and never
        upgrades the weaker one in prose. SafeCurves' own primeproofs.html links are
        unretrieved (see capsule) and are not cited as a substitute.

    - id: L02
      criterion: equation
      category: basic_parameter_requirements
      tracked_object: the residue pair (A mod p, B mod p) and the nonsingularity residue
        4A^3 + 27B^2 mod p.
      preregistered_target:
        intake_cell: true
        safecurves_shape: short Weierstrass
        safecurves_elliptic_cell: 'True (check)'
        safecurves_elliptic_result: '5181212714295366734216266753166056344803944016281454944474282600874932100420353077879019424596754753434846239416135'
        source: SRC-SC-EQUATION lines 186-190, 315-319
      mechanism: >-
        Convert the RFC 5639 hexadecimal A and B for brainpoolP384t1 to decimal, confirm
        A = p - 3 as an integer identity, and evaluate 4A^3 + 27B^2 mod p.
      sub_tests:
        T1: base-convert the RFC hex B and compare against the SafeCurves decimal B. THIS
          IS THE CAPSULE'S SHARPEST OPEN GAP (conflict C5) and costs microseconds.
        T2: confirm A = p - 3 as integers, corroborating capsule verification V4 by
          computation rather than by string comparison.
        T3: compute 4A^3 + 27B^2 mod p and compare against the SafeCurves 'Result' value.
      quantitative_prediction:
        - metric: computed decimal of the RFC hex B versus the SafeCurves decimal B
          direction: different
          minimum_effect: exact equality on all 116 digits.
        - metric: 4A^3 + 27B^2 mod p
          direction: different
          minimum_effect: exactly the SafeCurves 'Result' value above, and in particular
            nonzero.
      certificate: the three residues as exact integers, each re-verifiable by one
        modular evaluation.
      controls: G1; G3 (the same three sub-tests on NIST P-384 must reproduce its own
        SafeCurves 'Result' value 34547176980116681824645216591738245691976440597762634059085075689656433507713054265850219419421678489421763812122908);
        G4 (a deliberately singular synthetic curve with 4A^3 + 27B^2 = 0 mod p must be
        rejected by the same code path - if the instrument cannot reject a singular
        curve, its nonzero answers mean nothing).
      budget: 5 CPU-seconds.
      stopping_rule: none needed; if it does not finish in 5 s the arithmetic layer is
        broken and G1 has failed.
      falsifier: >-
        T1 disagreeing on any digit would show that the intake's and SafeCurves' 116-digit
        B is not the RFC's B, which would be a genuine primary-versus-secondary conflict
        in the parameter tuple and a goal pause condition. T3 disagreeing would show the
        SafeCurves 'Result' column is not 4A^3 + 27B^2 for this curve, or that the
        instrument is wrong - G3 discriminates between those two.
      honest_limitation: >-
        This lane certifies that a triple (p, A, B) defines a nonsingular curve. It says
        nothing about which curve any deployed implementation actually uses.
      priority_note: HIGHEST INFORMATION PER SECOND IN THE PLAN. See ranking.

    - id: L03
      criterion: base
      category: basic_parameter_requirements
      tracked_object: the point (x_1, y_1) together with the integer ell and the boolean
        ell*(x_1, y_1) = O.
      preregistered_target:
        intake_cell: true
        safecurves_cells: on-curve True; ell prime True; ell*(x_1,y_1) = 0 True
        source: SRC-SC-BASE lines 197-205, 435-445
      mechanism: >-
        Base-convert the RFC hex x_1, y_1 and ell; verify y_1^2 = x_1^3 + A x_1 + B mod
        p; verify ell*(x_1,y_1) = O by double-and-add; certify ell prime.
      quantitative_prediction:
        - metric: y_1^2 - (x_1^3 + A x_1 + B) mod p
          direction: different
          minimum_effect: exactly 0.
        - metric: the point ell*(x_1,y_1)
          direction: different
          minimum_effect: exactly the point at infinity; and additionally
            (ell/r)*(x_1,y_1) must be non-infinite for every prime r | ell found, which
            for prime ell is the single check that (x_1,y_1) is not itself O.
      certificate: >-
        the on-curve residue (exactly 0); the double-and-add addition chain result; a
        Pocklington certificate for ell if ell-1 factors far enough within budget, else a
        labelled probabilistic primality record. NOTE the dependency: the EXACT-k
        certificate of L05 needs the same factorisation of ell-1, so L03(c) and L05 share
        one attempt and one budget.
      controls: G1 (toy-curve point arithmetic); G2 (Anomalous and BN(2,254) base points
        must pass their own on-curve and order checks, which is also the sourcing step
        the goal's claim boundary requires before they may be used as controls); G3 (NIST
        P-384's base point); G4 (a point NOT on the curve must be rejected, and a random
        point of composite order on a synthetic curve must fail the order check).
      budget: 60 CPU-seconds for the conversion, on-curve and order checks; the ell-1
        factorisation attempt is budgeted once, in L05.
      stopping_rule: as L01 for the primality certificate.
      falsifier: a nonzero on-curve residue, or ell*(x_1,y_1) not O. Either would mean the
        published tuple is internally inconsistent, which is a pause condition.
      honest_limitation: >-
        Verifying ell*(x_1,y_1) = O with ell prime shows the base point has order ell or
        1. Combined with h = 1 and Hasse it pins #E, but ONLY once h = 1 is itself
        checked - see D01, which is where that check lives. This lane does not assume it.

    - id: L04
      criterion: rho
      category: ecdlp_security_requirements
      tracked_object: the integer ell, projected to (bit length, isqrt).
      preregistered_target:
        intake_cell: true
        safecurves_cell: 'True (check)'
        safecurves_cost: 2^191.4
        threshold_verbatim: 'SafeCurves requires l to be at least 2^200.' (SRC-SC-RHO
          line 189)
        column_header_verbatim: 'Cost for rho above 2^100?' (SRC-SC-RHO line 53)
        threshold_adjudication_note: >-
          The page states the requirement as ell >= 2^200 while the table column asks
          whether the COST is above 2^100. These are the same condition
          (0.886*sqrt(2^200) = 2^99.8, so the two thresholds are within a rounding of each
          other) and the lane reports BOTH readings explicitly rather than choosing one.
      mechanism: >-
        Exact integer computation of ell's bit length and of floor(0.886*sqrt(ell)) via
        integer square root, then comparison against 2^200 and against 2^100.
      quantitative_prediction:
        - metric: log2(ell)
          direction: different
          minimum_effect: 383.14 +/- 0.01 (this producer's hand estimate; the lane must
            reproduce it to that tolerance or the instrument is wrong).
        - metric: log2(0.886*sqrt(ell))
          direction: different
          minimum_effect: 191.39 +/- 0.05, rounding to the tabulated 2^191.4.
        - metric: 'ell >= 2^200?'
          direction: different
          minimum_effect: TRUE, by a margin of 183 bits.
      certificate: bit length and isqrt as exact integers, plus the two comparisons; a
        third party re-verifies with one isqrt.
      controls: G1 (isqrt against hand-checkable cases); G2 (a synthetic curve with
        ell < 2^200 must be flagged - if the rho instrument never fails, its passes carry
        no information); G3 (NIST P-384, expected 2^191.8); G4 (the 20 nulls give the
        instrument's spread on same-size random orders).
      budget: 5 CPU-seconds.
      stopping_rule: none needed.
      falsifier: a computed exponent outside 191.39 +/- 0.05, or ell < 2^200.
      honest_limitation: >-
        This is a group-size arithmetic statement under the standard rho cost model. It
        is not a claim that 0.886*sqrt(ell) is the true attack cost, and it takes no
        account of the automorphism and endomorphism discounts, which are D03's job.

    - id: L05
      criterion: transfer
      category: ecdlp_security_requirements
      tracked_object: the multiplicative order ord_ell(p), plus three degenerate flags.
      specialises: IDEA-20260807-98a970 (see internal_dependency_reuse; not duplicated)
      preregistered_target:
        intake_cell: true
        safecurves_additive: 'True (check)'
        safecurves_multiplicative: 'True (check)'
        safecurves_embedding_degree: '5414817692529829043267309210583151244949029096754412150018911318705402875339628884490673779342225813057400429680985'
        safecurves_form: (l-1)/4
        source: SRC-SC-TRANSFER lines 239-246
      mechanism: >-
        Three degenerate checks, then a cheap two-sided bracket on k, then a best-effort
        exact determination.
      sub_tests:
        T1_degenerate: ell = p? (additive transfer); p mod ell = 1? (k = 1); ell | h,
          i.e. ell^2 | #E? Three comparisons, microseconds.
        T2_lower_bound: compute p^j mod ell for j = 1..K with K = 10^6, recording the
          smallest j with p^j = 1 if any. Certifies k > 10^6 if none appears.
        T3_upper_bracket_CHEAP_AND_NEW_HERE: verify 4 | ell-1, then compute
          p^((ell-1)/4) mod ell in ONE modular exponentiation. If it equals 1 then
          k divides (ell-1)/4, which is exactly the SafeCurves claim's upper side. If it
          does not equal 1, the published (l-1)/4 is WRONG. This single exponentiation is
          the cheapest available discriminator against the published value and
          IDEA-20260807-98a970 does not contain it.
        T4_exact_best_effort: attempt the factorisation of ell-1 (trial division to 10^7,
          Pollard rho, Pollard p-1, ECM within budget); on success emit the EXACT-k
          certificate of IDEA-20260807-98a970 part (C).
      quantitative_prediction:
        - metric: number of degenerate flags fired
          direction: lower
          minimum_effect: predicted ZERO on all three. One or more is a material finding
            and routes to independent review before any statement, per
            IDEA-20260807-98a970's own falsification clause.
        - metric: 'smallest j <= 10^6 with p^j = 1 mod ell'
          direction: different
          minimum_effect: predicted NONE, certifying k > 10^6.
        - metric: p^((ell-1)/4) mod ell
          direction: different
          minimum_effect: predicted exactly 1. This is the discriminating prediction of
            the lane.
        - metric: fraction of the lane carrying an EXACT-k certificate rather than a
          bracket
          direction: different
          minimum_effect: no target set. Factoring a 384-bit ell-1 in pure Python is
            likely out of reach and the plan says so IN ADVANCE, so a bracketed result is
            an honest environment outcome and not a shortfall.
      certificate: >-
        LOWER BOUND - the assertion that p^j is not 1 mod ell for all j <= K, whose
        verification genuinely costs K modular multiplications. Stated as non-succinct,
        exactly as IDEA-20260807-98a970 requires.
        UPPER BRACKET - the single residue p^((ell-1)/4) mod ell, verifiable in one
        exponentiation.
        EXACT - only if ell-1 factors: the factorisation with a primality record per
        factor plus one witness exponentiation per prime factor.
      controls: G2 (BN(2,254) must return exactly 12; the toy k = 1 and k = 2 planted
        positives must return 1 and 2; Anomalous must fire the additive flag); G3 (NIST
        P-384 must show no flag and k > 10^6); G4 (random (p, ell) pairs give the
        arithmetic null for the order distribution); DECAY CONTROL - sweep K from 10^2 to
        10^6 and confirm the not-yet-excluded set shrinks monotonically to the planted
        positives and then stops changing. A curve that appears at one K and disappears at
        a larger K indicates a modular-arithmetic bug and voids the lane.
      budget: 5 s for T1 and T3; 120 s for T2 at K = 10^6; 900 s ceiling for T4.
      stopping_rule: stop T4 at 900 s and record a bracketed row with the reason. Do not
        extend. Record the largest factor found.
      falsifier: >-
        p^((ell-1)/4) mod ell not equal to 1 falsifies the published embedding degree.
        Any j <= 10^6 with p^j = 1 mod ell falsifies the transfer cell and is a material
        finding. Any degenerate flag firing is likewise material.
      honest_limitation: >-
        A bracket 10^6 < k <= (ell-1)/4 is a bracket, not a value. Reporting it as
        'k is about ell' would overstate the certificate. The verdict column depends on
        the crossover k*(p, ell), which this program has not produced
        (IDEA-20260807-5f24d7), so no verdict is emitted - only k data and the
        representability wall k*ceil(log2 p) bits.

    - id: L06
      criterion: disc
      category: ecdlp_security_requirements
      tracked_object: the pair (t, D) - the trace and the CM field discriminant.
      preregistered_target:
        intake_cell: true
        safecurves_cell: 'True (check)'
        safecurves_t: '5973228999478432667446284273866865475630836211106699249391'
        safecurves_D: '-421137342150968156401073657463902608517955808599119887457074293277751733352456681547155756681917575445787031884483'
        safecurves_D_factorisation: -1 * 6857 * 379795560371 *
          37573380636081815018124278995574282493401057 *
          4303872990401223419424669070518309027547364146662699977
        safecurves_D_magnitude: approximately -2^377.5
        threshold_verbatim: 'SafeCurves requires the absolute value of this
          complex-multiplication field discriminant D to be larger than 2^100.'
          (SRC-SC-DISC lines 61-63)
        source: SRC-SC-DISC lines 127-129, 271-277
      mechanism: >-
        Compute t = p + 1 - #E (with #E from D01), then t^2 - 4p, then divide out the
        largest square factor and apply the mod-4 rule of SRC-SC-DISC lines 57-60.
        The expensive step - finding the largest square divisor in general - is AVOIDED
        here by verifying the published D directly, which is a multiplication.
      sub_tests:
        T1: recompute t = p + 1 - ell (given h = 1 from D01) and compare against the
          SafeCurves t. The capsule's V13 already did this BY HAND and got an exact
          match; T1 is the machine corroboration of a hand result, which is cheap and
          worth having.
        T2: verify D * 121 = t^2 - 4p exactly. See the sharp prediction below.
        T3: verify D mod 4 = 1, which is required for the unfactored-by-4 branch of the
          SafeCurves definition.
        T4: verify the published factorisation of |D| multiplies back to |D|, that its
          factors are pairwise distinct (hence D squarefree, hence s determined), and
          certify each factor prime.
        T5: report bit length of |D| and compare against 2^100.
      quantitative_prediction:
        - metric: t recomputed
          direction: different
          minimum_effect: exactly the SafeCurves t. Predicted with high confidence
            because the hand computation V13 already matched all 58 digits.
        - metric: (t^2 - 4p) / D
          direction: different
          minimum_effect: >-
            PREDICTED EXACTLY 121, i.e. the conductor s = 11 and D = (t^2-4p)/s^2 with
            no factor of 4. Derivation - hand magnitude arithmetic gives
            4p - t^2 = 5.0957619e115 and |D| = 4.21137342e113, whose ratio is
            5.095761838e115 / 4.21137342e113 = 121.00 to eight significant digits. This
            is a PREREGISTERED PREDICTION from ~8 significant digits of hand arithmetic,
            NOT a computation and NOT a finding.
        - metric: bit length of |D|
          direction: different
          minimum_effect: 378 (log2|D| = 377.45 by hand from the 114-digit decimal),
            hence |D| > 2^100 by a margin of 277 bits.
        - metric: number of repeated primes in the published factorisation of |D|
          direction: lower
          minimum_effect: predicted ZERO (squarefree).
      certificate: t, t^2 - 4p, the quotient 121, D mod 4, the factorisation product, the
        per-factor primality records, and the bit length - each an exact integer.
      controls: G2 (Anomalous must give |D| = 11 and FAIL the 2^100 test; BN(2,254) must
        give |D| = 3 and FAIL it - a discriminant instrument that never fails certifies
        nothing); G3 (NIST P-384, expected |D| approximately 2^386, must pass); G4 (the 20
        nulls give the |D| distribution for random same-size curves).
      budget: 60 CPU-seconds for T1-T3 and T5; 300 CPU-seconds for T4's primality records.
      stopping_rule: if any published factor resists a primality decision in 300 s, record
        that factor as UNRESOLVED with its size and stop; do not extend.
      falsifier: >-
        (t^2 - 4p)/D not an integer, or not 121, falsifies either the published D or this
        producer's s = 11 prediction - and T2's exact quotient discriminates between
        those two outcomes, which is precisely why the prediction is stated as a number
        rather than as 'small'. D mod 4 not 1 falsifies the branch choice. A repeated
        prime falsifies squarefreeness and hence the conductor reading. |D| <= 2^100
        would falsify the disc cell.
      honest_limitation: >-
        Verifying a published D is weaker than deriving D from scratch: it can confirm a
        published value and can detect a wrong one, but it cannot detect a D that is
        wrong in a way that happens to satisfy D*121 = t^2-4p with D squarefree and
        D = 1 mod 4 - which, since those conditions determine D uniquely given t and p,
        is in fact no gap at all ONCE t is correct. The real dependency is therefore on
        t, i.e. on D01. Stated so the lane's strength is not overread.

    - id: L07
      criterion: rigid
      category: ecc_security_beyond_ecdlp
      tracked_object: the accept/reject transcript of the stated generation procedure -
        with the caveat in object_first_framing that this is a preimage, not a lossy
        projection.
      preregistered_target:
        intake_cell: true
        safecurves_cell_verbatim: 'somewhat rigid (check)' - NOT 'fully rigid', see
          capsule conflict C1
        safecurves_pointer: 'See brainpoolP256t1.' (SRC-SC-RIGID line 273)
        third_party_challenge: SRC-BADA55-BRAINPOOL - 'none of the standard Brainpool
          curves below 512 bits were generated by the standard Brainpool curve-generation
          procedure', and 'A different procedure that does generate the Brainpool curves
          appeared a few years later in the first Brainpool RFC.'
      mechanism: >-
        Re-execute the RFC 5639 Appendix A procedure from the published 384-bit seeds and
        compare the outputs to the published parameters, then verify the r1 -> t1
        derivation, then quantify the A/B digit overlap against the G4 null.
      sub_tests:
        T1_prime_transcript: run find_integer and the prime procedure of RFC 5639
          Appendix A.1 from Seed_p_384 = 5F12C7F9924A19947B3916CF70801F2E2858EFC1 with
          L = 384, and compare the output with p. Record the number of update_seed
          iterations consumed.
        T2_curve_transcript: run the Appendix A.2 procedure from
          Seed_ab_384 = BCFBFA1C877C56284DAB79CD4C2B3293D20E9E5E, producing A_r1, Z,
          B_r1, and G_r1 = k*P, and compare with the published brainpoolP384r1 values.
          Record the full accept/reject trace: which candidates failed step 3
          (-3 = A*Z^4 unsolvable), step 7 (B a square), step 8 (singular), step 9
          (security requirements).
        T3_r1_to_t1_derivation: verify that Z satisfies -3 = A_r1 * Z^4 mod p; then
          verify A_t1 = A_r1 * Z^4 mod p (which must equal p - 3 by capsule verification
          V4) and B_t1 = B_r1 * Z^6 mod p; then verify the base-point correspondence in
          BOTH directions - (x_t1, y_t1) = (Z^2 x_r1, Z^3 y_r1) and
          (x_t1, y_t1) = (Z^-2 x_r1, Z^-3 y_r1) - and RECORD WHICH ONE HOLDS. The
          direction is not assumed.
        T4_digit_overlap_statistic: measure the length of the longest common hex
          substring between A_r1 and B_r1 and its position. The capsule records a
          hand-observed 16-hex-character coincidence (04A8C7DD22CE2826 as the tail of
          A_r1 and the head of B_r1). Compare against the null distribution measured in
          G4 and against SRC-BADA55-BRAINPOOL's documented 24-hex-character overlap for
          brainpoolP256r1.
        T5_2005_procedure_BLOCKED: reproduce the 2005 Brainpool standard procedure and
          test SRC-BADA55-BRAINPOOL's assertion directly.
      deferral_record_for_T5:
        status: DEFERRED, with reason and successor condition, not silently dropped.
        concrete_reason: the 2005 standard document is unretrieved (see capsule
          sources_unretrieved). This role has no Bash and WebFetch is under a standing
          numeric-corruption warning, so the document cannot be obtained here and its
          procedure must not be reconstructed from memory.
        successor_condition: a Bash-capable executor stages
          https://www.teletrust.de/fileadmin/files/oid/oid_ECC-Brainpool-Standard-curves-V1.pdf
          hash-pinned in the style of inputs/SAFECURVES-20260825, with a source_record
          entry; T5 then runs against staged bytes.
        what_the_deferral_costs: the lane can say whether the RFC procedure reproduces the
          curve, but cannot independently confirm or refute the BADA55 assertion about
          the 2005 procedure. It must report the BADA55 statement as an unreproduced
          third-party claim.
      quantitative_prediction:
        - metric: 'T1 output equals p?'
          direction: different
          minimum_effect: predicted YES (SRC-BADA55-BRAINPOOL states the RFC procedure
            generates the standard curves).
        - metric: 'T2 output equals (A_r1, B_r1, G_r1)?'
          direction: different
          minimum_effect: predicted YES on all three simultaneously.
        - metric: 'T3 - which base-point direction holds'
          direction: different
          minimum_effect: exactly one of the two must hold; predicted the
            (Z^2 x, Z^3 y) direction, but the lane records the observed one either way.
            Neither holding falsifies the published Z.
        - metric: T4 longest common hex substring between A_r1 and B_r1
          direction: higher
          minimum_effect: >-
            predicted 16 hex characters (64 bits) at the A-tail/B-head position. Under
            the G4 null the expected longest common substring between two independent
            96-hex-character strings is about 4-5 characters, so 16 is roughly a
            2^-44 event under independence. THE LANE MUST NOT CALL THIS A WEAKNESS: it
            is a measurement of a documented artefact of the Brainpool seed-scheduling
            mechanism, and SRC-BADA55-BRAINPOOL already attributes it to overlapping
            counters rather than to any secret.
      certificate: the full transcript - seed, per-iteration hash inputs and outputs,
        accept/reject reasons, and final parameters - re-executable byte for byte from
        the published seeds by any third party with SHA-1.
      controls:
        positive: run the SAME code on brainpoolP224r1 or brainpoolP256r1 from their
          published seeds; SRC-BADA55-BRAINPOOL states the RFC procedure generates these,
          so the instrument MUST reproduce at least one smaller Brainpool curve before
          its 384-bit output is believed.
        negative_parameter_matched: NIST P-384, whose SafeCurves rigid cell is
          'manipulatable' and whose seed a335926aa319a27a1d00896a6773a4827acdac73 is
          recorded on SRC-SC-RIGID line 280 as unexplained. The instrument must NOT
          classify it as reproducible-from-a-systematic-seed.
        'null': seed perturbation - re-run T1 and T2 with Seed_p_384 and Seed_ab_384 each
          incremented by one. The procedure must produce DIFFERENT parameters. If a
          perturbed seed also produces the published curve, the transcript test has no
          resolving power and T1/T2 mean nothing.
        second_null: the 20 same-shape synthetic curves of G4, which have no seed at all
          and must not be classified as reproducible.
      budget: 900 CPU-seconds for T1; 1800 CPU-seconds for T2 (the step-9 security checks
        are the expensive part and may require point counting - see stopping rule);
        60 CPU-seconds for T3; 30 CPU-seconds for T4.
      stopping_rule: >-
        T2's step 9 requires checking the Section 3 security requirements on each
        candidate curve, which needs the curve order and is the dominant cost. Adopt the
        BADA55 scripts' documented simplification EXPLICITLY AND IN THE RECORD - skip the
        large-CM-discriminant check, which they state has negligible probability of
        failing - and if T2 still exceeds 1800 s, stop and report T2 as INCOMPLETE with
        the number of seed iterations completed. An incomplete T2 is an operational
        observation and must not be reported as 'the transcript does not reproduce'.
      falsifier: >-
        T1 or T2 producing parameters different from the published ones, WITH the
        positive control (a smaller Brainpool curve) having reproduced successfully -
        that conjunction is what distinguishes a real non-reproduction from a bug, and
        it is why the positive control is blocking. T3 failing in both directions would
        falsify the published Z or the r1/t1 relation.
      honest_limitation: >-
        Rigidity is a property of a GENERATION PROCESS, not of a curve. Reproducing the
        transcript shows the published parameters follow from the published seeds under
        the published procedure; it does not bound how many curves the designer could
        have searched over, and it is not an ECDLP statement of any kind. The SafeCurves
        cell being 'somewhat rigid' rather than 'fully rigid' rests on the seven
        unexplained design decisions quoted in the capsule, none of which any computation
        can settle.

    - id: L08
      criterion: ladder
      category: ecc_security_beyond_ecdlp
      tracked_object: the 2-primary structure of E(F_p) - specifically whether 4 divides
        #E - plus the solvability of the two SafeCurves conversion equations.
      preregistered_target:
        intake_cell: false
        safecurves_cell: False
        safecurves_cofactor: 1
        source: SRC-SC-LADDER lines 223-227
        site_mechanism_verbatim: 'curves of prime order or 2*prime order can never be
          converted to Montgomery curves over F_p - Montgomery curves always have order
          divisible by 4.' (lines 115-117)
      mechanism: >-
        Two independent routes to the same answer, which is what makes the lane a
        discriminator rather than a restatement.
        ROUTE A (structural) - if #E = ell with ell an odd prime and h = 1, then 4 does
        not divide #E, so no F_p-isomorphic Montgomery model exists. One divisibility
        check, given D01.
        ROUTE B (direct) - attempt the explicit conversion of SRC-SC-LADDER lines 95-99:
        search for r in F_p with r^3 + Ar + B = 0 (a cubic root-finding, done by
        gcd(x^p - x, f(x)) in F_p[x]), then for s with s^2 = 3r^2 + A. Report which of
        the two steps fails and for which roots.
      quantitative_prediction:
        - metric: 'does 4 divide #E?'
          direction: different
          minimum_effect: predicted NO, since #E = ell is predicted to be an odd prime
            with h = 1.
        - metric: number of roots r in F_p of x^3 + Ax + B
          direction: different
          minimum_effect: >-
            no target preregistered. This is genuinely open and is the reason ROUTE B is
            run at all - it discriminates between 'no Montgomery model because there is
            no r' and 'no Montgomery model because for every existing r, 3r^2 + A is a
            non-square'. The two are different facts about the curve and SafeCurves'
            single False cell does not distinguish them.
        - metric: 'for each root r found, is 3r^2 + A a square mod p?'
          direction: different
          minimum_effect: predicted NO for every r, since ROUTE A already forbids a
            Montgomery model. A YES here with ROUTE A saying NO is an instrument
            contradiction and voids the lane.
      certificate: the divisibility residue; the degree of gcd(x^p - x, x^3 + Ax + B) in
        F_p[x]; and for each root, the Legendre symbol of 3r^2 + A, all exact.
      controls:
        positive: Curve25519 - a Montgomery curve with cofactor 8; ROUTE B must SUCCEED
          on it and return a valid (r, s). An instrument that never finds a Montgomery
          model cannot certify the absence of one.
        negative_parameter_matched: NIST P-384 (384-bit, a = -3, h = 1) - must also come
          out False, and must fail at the SAME step as brainpoolP384t1 or the difference
          must be explained.
        'null': the 20 same-shape synthetic curves of G4 over the same p with random B.
          Their #E is not prime in general, so a nonzero fraction should admit a
          Montgomery model; measuring that fraction is what shows ROUTE B can succeed on
          this field at all.
      budget: 120 CPU-seconds (dominated by the x^p mod f(x) computation, one 384-bit
        exponentiation in a degree-3 quotient ring).
      stopping_rule: none needed at this size.
      falsifier: ROUTE A and ROUTE B disagreeing; or a valid Montgomery model being found
        while #E is an odd prime, which would be arithmetically impossible and would
        indicate a bug.
      honest_limitation: >-
        A False ladder cell is a statement about simple constant-time single-coordinate
        scalar multiplication, NOT about ECDLP hardness. SRC-SC-LADDER itself notes the
        Brier-Joye ladder applies to every short Weierstrass curve at 19 field operations
        per bit, so 'no Montgomery ladder' is a
        simplicity-and-efficiency statement, not an impossibility. The lane must say so.

    - id: L09
      criterion: twist
      category: ecc_security_beyond_ecdlp
      tracked_object: the pair (#E', factorisation of #E') for the nontrivial quadratic
        twist, projected to (ell', h') and then to a combined-attack cost exponent.
      preregistered_target:
        intake_cell: true
        safecurves_combined_cell: 'True (check)', cost 2^118.5
        safecurves_twist_rho_cell: 'True (check)', cost 2^118.1
        safecurves_twist_transfer_cells: 'True (check)' additive and multiplicative,
          embedding degree (l'-1)/1
        safecurves_ell_prime: '151574876586344350951092838162750565943171857126657289419000711361563821'
        safecurves_twist_cofactor: 7 * 11^2 * 241 * 5557 *
          125972502705620325124785968921221517
        threshold_verbatim: 'SafeCurves requires the resulting security level to be at
          least 2^100.' (SRC-SC-TWIST line 230)
        source: SRC-SC-TWIST lines 367-371, 558-564, 696-700, 822-826, 992-999
      mechanism: >-
        #E' = p + 1 + t, which is one addition once t is known from L06. The published
        factorisation is then VERIFIED (a multiplication plus primality records) rather
        than recomputed, which is what makes the lane cheap. The combined-attack cost is
        re-derived from the model stated verbatim on SRC-SC-TWIST lines 234-266 and
        compared to the published exponent.
      sub_tests:
        T1: verify p + 1 + t = ell' * 7 * 11^2 * 241 * 5557 *
          125972502705620325124785968921221517 exactly.
        T2: certify ell' and 125972502705620325124785968921221517 prime; verify the small
          factors are prime by trial division.
        T3: recompute the twist rho cost 0.886*sqrt(ell') and compare to 2^118.1.
        T4: re-derive the combined-attack cost with the published model - brute force n
          mod h at cost h, n mod each small factor of h' at cost that factor, CRT, then a
          kangaroo attack on the remaining ell/(product) possibilities - and compare to
          2^118.5.
      quantitative_prediction:
        - metric: 'p + 1 + t equals the published h'' * ell''?'
          direction: different
          minimum_effect: exact equality.
        - metric: log2(0.886*sqrt(ell'))
          direction: different
          minimum_effect: 118.05 +/- 0.05 (hand estimate from log2(ell') = 236.46),
            rounding to the tabulated 2^118.1.
        - metric: re-derived combined-attack exponent
          direction: different
          minimum_effect: 118.5 +/- 0.3. A larger discrepancy means the plan has
            mis-implemented the published model, which G3 (NIST P-384, twist cofactor 1,
            published 2^191.8) discriminates.
        - metric: 'does the combined-attack cost exceed 2^100?'
          direction: different
          minimum_effect: predicted YES, by about 18 bits - a much smaller margin than the
            rho lane's 91 bits, which is worth reporting explicitly rather than as a
            bare True.
      certificate: the product identity; the primality records for ell' and the 36-digit
        factor; the two cost exponents with their arithmetic.
      controls:
        positive: brainpoolP256t1, whose published combined-attack cost is 2^44.5 and
          whose cell is False - the instrument must FIRE on it. A twist instrument that
          never fails certifies nothing, and this control is the parameter-matched
          sibling in the same curve family, which makes it far stronger than a toy.
          Additionally NIST P-224 (published 2^58.4, False).
        negative_parameter_matched: NIST P-384 (twist cofactor 1, published 2^191.8) must
          not fire.
        'null': for the 20 synthetic curves of G4, the twist order is p + 1 + t' for their
          own traces; their h' distribution is the reference against which the real
          curve's h' = 7 * 11^2 * 241 * 5557 * (36-digit prime) is read. Without this the
          plan cannot say whether that cofactor is unusual, and it must not guess.
      budget: 60 CPU-seconds for T1, T3, T4; 300 CPU-seconds for T2's primality records.
      stopping_rule: as L06.
      falsifier: the product identity failing; a published factor proving composite;
        a re-derived exponent outside tolerance with the negative control in tolerance.
      honest_limitation: >-
        Twist security is a property of protocols that feed unvalidated single-coordinate
        input into a ladder. brainpoolP384t1 has no Montgomery ladder (L08), so the
        threat model in which the twist cost matters is narrower for this curve than for a
        Montgomery curve, and the lane must state that rather than reporting a bare True.
        Also, verifying a published factorisation is weaker than producing one: it cannot
        rule out that the published h' omits a factor, EXCEPT that T1's exact product
        identity does rule exactly that out. Stated so the strength is neither over- nor
        under-claimed.
      cross_lane_observation_to_be_tested_not_asserted: >-
        The published twist cofactor contains 11^2, and this producer's L06 prediction is
        that the CM conductor is s = 11. These may be related or may be coincidence. The
        plan does NOT assert a relation. It records the coincidence and specifies the
        test: measure, over the 20 G4 nulls plus the standardised curves already in the
        control set, whether s | h' occurs more often than chance. With N = 20 the test
        has almost no power, so the honest preregistered outcome is 'underpowered', and
        the lane must report it that way rather than as a null result.

    - id: L10
      criterion: complete
      category: ecc_security_beyond_ecdlp
      tracked_object: the same 2-primary structure as L08, read out as (number of points
        of order 2, number of points of order 4).
      preregistered_target:
        intake_cell: false
        safecurves_single_scalar: False
        safecurves_multi_scalar: False
        safecurves_points_of_order_2: 0
        safecurves_points_of_order_4: 0
        source: SRC-SC-COMPLETE lines 298-306
      mechanism: >-
        Count points of order 2 as the number of roots of x^3 + Ax + B in F_p (each root
        gives the point (r, 0)); points of order 4 follow from the 2-Sylow structure.
        Independently, if #E = ell is an odd prime then both counts are 0 immediately.
        Then attempt the complete-Edwards conversion, which requires a point of order 4.
      quantitative_prediction:
        - metric: number of points of order 2
          direction: different
          minimum_effect: predicted exactly 0, and this is the SAME cubic root count as
            L08 ROUTE B - so L08 and L10 share one computation and must agree. A
            disagreement is an instrument failure, not a finding.
        - metric: number of points of order 4
          direction: different
          minimum_effect: predicted exactly 0.
        - metric: 'complete Edwards model over F_p exists?'
          direction: different
          minimum_effect: predicted NO, because a complete Edwards curve has order
            divisible by 4.
      certificate: the root count of the cubic (already certified in L08), the
        divisibility of #E by 2 and by 4, and the failed conversion with the step at
        which it fails.
      controls:
        positive: Curve25519 and Curve1174 - published as 1 point of order 2 and 2 points
          of order 4, with complete formulas True. The instrument must return those exact
          counts.
        negative_parameter_matched: NIST P-384 (published 0 and 0).
        'null': the G4 synthetics, where the order-2 count should be 0, 1 or 3 with the
          frequencies of a random cubic over F_p (roughly 1/3, 1/2, 1/6 for a random
          cubic with distinct roots), which is also the validation route for heuristic H3
          below.
      budget: shared with L08; no additional budget.
      stopping_rule: none needed.
      falsifier: a nonzero order-2 count with #E odd prime (arithmetically impossible,
        hence a bug); or disagreement with L08.
      honest_limitation: >-
        Per the goal's claim boundary, absence of complete formulas is an implementation
        simplicity-and-safety property. It is NOT an ECDLP break and must never be
        reported as one. SRC-SC-COMPLETE itself notes that completeness of a curve does
        not guarantee completeness of a given addition law.

    - id: L11
      criterion: ind
      category: ecc_security_beyond_ecdlp
      tracked_object: the same 2-primary structure again, read out as Elligator 2
        applicability, plus the j-invariant exception.
      preregistered_target:
        intake_cell: false
        safecurves_cell: False
        safecurves_note_verbatim: 'Elligator 2: No.'
        site_criterion_verbatim: '"Elligator 2" works for any odd prime and any curve of
          the form y^2=x^3+Ax^2+Bx with nonzero AB(A^2-4B) ... it includes all curves
          with points of order 2, except for j-invariant 1728.' (SRC-SC-IND lines 85-91)
        source: SRC-SC-IND lines 189-193
      mechanism: >-
        Elligator 2 needs the curve in the form y^2 = x^3 + Ax^2 + Bx over F_p, which
        requires a rational point of order 2, i.e. a root of the cubic. Reuse L10's root
        count. Separately compute the j-invariant and check it against 1728, and check
        whether Elligator 1's preconditions (p = 3 mod 4 and a complete Edwards model of
        the required shape) hold.
      quantitative_prediction:
        - metric: 'Elligator 2 applicable?'
          direction: different
          minimum_effect: predicted NO, following directly from a zero order-2 count.
        - metric: j-invariant equal to 1728?
          direction: different
          minimum_effect: predicted NO. Note this check is only REACHED if the order-2
            count is nonzero, so it is expected to be vacuous here; run and report it
            anyway so the instrument is exercised.
        - metric: 'Elligator 1 applicable?'
          direction: different
          minimum_effect: predicted NO. p = 3 mod 4 is predicted to HOLD (RFC 5639
            requires it), so the failure must come from the Edwards-model requirement -
            and reporting WHICH precondition fails is the lane's discriminating output,
            since SafeCurves' single False does not say.
      certificate: the order-2 count (shared with L10), the j-invariant as an exact
        residue, p mod 4, and the per-precondition pass/fail table for both Elligator
        variants.
      controls:
        positive: Curve25519 and M-221 - published 'Elligator 2: Yes'. The instrument must
          return Yes.
        negative_parameter_matched: NIST P-384 (published No).
        'null': the G4 synthetics; the fraction with a rational point of order 2 gives the
          instrument's base rate on this field.
      budget: 30 CPU-seconds beyond L10.
      stopping_rule: none needed.
      falsifier: Elligator 2 reported applicable while the order-2 count is 0.
      honest_limitation: >-
        Indistinguishability is a protocol-level encoding property for
        censorship-circumvention and PAKE settings. Per the goal's claim boundary it is
        not an ECDLP break. A False cell here says a published encoding does not apply,
        not that no encoding could exist.

  additional_diagnostics:

    - id: D01
      diagnostic: complete curve and twist order factorization with checkable certificates
      status: PLANNED
      tracked_object: the pair (#E, #E') with full factorisations.
      mechanism: >-
        #E is determined WITHOUT point counting - verify ell*(x_1,y_1) = O (L03), verify
        ell prime (L03), then use Hasse: since ell > 4*sqrt(p) for this curve, there is
        exactly one multiple of ell in the Hasse interval [p+1-2sqrt(p), p+1+2sqrt(p)],
        so #E = ell and h = 1 follow. This is exactly the argument SRC-SC-DISC lines
        319-328 states verbatim ('Typically l is above 4 sqrt(p), so there is only one
        multiple of l between p+1-2 sqrt(p) and p+1+2 sqrt(p); this multiple must be
        p+1-t'). #E' = 2(p+1) - #E is then one subtraction, and its factorisation is
        verified against the published one in L09.
      quantitative_prediction:
        - metric: 'number of multiples of ell in the Hasse interval'
          direction: different
          minimum_effect: exactly 1. This is the check that makes h = 1 a CERTIFIED
            consequence rather than a copied cell, and it is what L06 and L09 depend on.
        - metric: '#E'' + #E - 2(p+1)'
          direction: different
          minimum_effect: exactly 0.
      certificate: the Hasse interval endpoints, the unique multiple, and the two order
        values; a third party re-verifies with two comparisons.
      controls: G2 (Anomalous, where #E = p, must be handled correctly); G3 (NIST P-384);
        G4 (for the synthetics ell is not known, so the Hasse argument is unavailable -
        this is stated as the reason the nulls are NOT used for #E and why D01 has no
        null control, rather than pretending one exists).
      budget: 30 CPU-seconds.
      stopping_rule: none needed.
      falsifier: more than one multiple of ell in the Hasse interval (which would mean
        ell < 4*sqrt(p) and the argument does not apply), or the twist identity failing.
      honest_limitation: >-
        This derives #E from the base point's order plus Hasse. It is NOT an independent
        point count (SEA), so it inherits L03's correctness entirely. An independent SEA
        count is out of reach in pure Python at 384 bits and the plan says so rather than
        claiming an order it did not compute.

    - id: D02
      diagnostic: subgroup, cofactor, and invalid-curve confinement costs
      status: PLANNED
      tracked_object: the multiset of small prime orders reachable on curves y^2 = x^3 +
        Ax + c for c not equal to B, i.e. the invalid-curve family at fixed A.
      mechanism: >-
        With h = 1 there is no small-subgroup attack on the curve itself: the only point
        orders are 1 and ell. Quantify that as a bound. For invalid curves, SRC-SC-TWIST
        lines 143-149 states that at fixed nonzero a the curves y^2 = x^3+ax+c cover
        roughly 25-50 percent of isomorphism classes with roughly 4*sqrt(p) different
        orders. Sample M = 200 random c, compute the smooth part of each order up to a
        bound - NOTE the honest problem: computing those orders needs point counting.
        The lane therefore does NOT compute them. Instead it measures the reachable
        SMALL-ORDER POINTS directly: for each sampled c, search for points of order q for
        q in the first 100 primes by testing whether the q-division polynomial has a root
        in F_p, which is a gcd computation and needs no point count.
      quantitative_prediction:
        - metric: number of distinct point orders on E(F_p) itself
          direction: different
          minimum_effect: exactly 2 (namely 1 and ell), given h = 1 from D01.
        - metric: fraction of sampled invalid curves admitting a rational point of order q
          for q the first 100 primes
          direction: different
          minimum_effect: predicted approximately 1/q for each q, the Chebotarev-type base
            rate; a large excess for some q would be the interesting outcome and would be
            the signal the diagnostic exists to look for.
      certificate: the divisor count for E; per sampled c, the list of q with a root of
        the division polynomial, each re-verifiable by one gcd.
      controls: positive - a synthetic curve deliberately constructed with a point of
        order 3 must be detected; negative - NIST P-384's invalid-curve family sampled the
        same way must give the same base rates; null - the G4 synthetics.
      budget: 900 CPU-seconds for M = 200 samples times 100 primes (the division-polynomial
        gcd for small q is cheap; q up to the 100th prime, 541, keeps degrees manageable).
      stopping_rule: reduce M rather than q-range if over budget, and record the M
        actually used. A reduced M is a reduced-power measurement, reported as such.
      falsifier: a q for which the observed frequency exceeds the 1/q base rate by more
        than 4 standard errors at the achieved M, with the negative control at base rate.
      honest_limitation: >-
        This measures what an invalid-curve attacker could REACH, not what any
        implementation accepts. It is a property of the curve family and of the
        SafeCurves-documented attack, not a statement about any deployed code, and it
        must not be reported as one.

    - id: D03
      diagnostic: automorphism- and endomorphism-adjusted rho cost
      status: PLANNED
      tracked_object: the automorphism group order of E over F_p, and the CM order's
        small-norm elements.
      mechanism: >-
        The generic negation speedup gives sqrt(2), already in the 0.886 constant. Extra
        speedups need extra automorphisms, which for j not in {0, 1728} do not exist over
        F_p; and endomorphism-based speedups need small |D|. Compute j, compare against 0
        and 1728, and read |D| from L06.
      quantitative_prediction:
        - metric: '#Aut(E) over F_p'
          direction: different
          minimum_effect: predicted exactly 2 (only [+-1]), since j is predicted to differ
            from 0 and 1728.
        - metric: adjusted rho exponent minus the L04 exponent
          direction: different
          minimum_effect: predicted 0.00 +/- 0.01, i.e. NO measurable discount, because
            |D| is approximately 2^377.5 and SRC-SC-DISC lines 330-342 states the
            speedups apply where |D| is 'very small'.
      certificate: j as an exact residue; the two comparisons; |D| from L06.
      controls: positive - secp256k1 (|D| = 3, j = 0, known sqrt(3) or better discount
        available) and BN(2,254) (|D| = 3) must show a nonzero discount under the same
        code path; negative - NIST P-384; null - the G4 synthetics.
      budget: 30 CPU-seconds.
      stopping_rule: none needed.
      falsifier: j equal to 0 or 1728; or a nonzero discount computed with |D| large,
        which would indicate the discount model is mis-implemented (the secp256k1
        positive control discriminates).
      honest_limitation: >-
        SRC-SC-DISC states the limits of these speedups are 'reasonably well understood'
        but the page also says explicitly that it is conceivable small-|D| curves are much
        easier and conceivable large-|D| curves are. A zero discount here is a statement
        about KNOWN discounts only.

    - id: D04
      diagnostic: embedding-degree certificate or explicit search bound
      status: PLANNED, fully covered by lane L05
      note: >-
        Not restated. L05 IS this diagnostic, specialised from IDEA-20260807-98a970. The
        certificate forms, the degenerate flags, the representability wall and the decay
        control all live there. Recorded here so the diagnostic list has no silent gap.

    - id: D05
      diagnostic: CM discriminant and conductor structure
      status: PLANNED
      tracked_object: the pair (D, s) - the fundamental discriminant and the conductor of
        the endomorphism order.
      mechanism: >-
        s^2 = (t^2 - 4p)/D once D is known and squarefree; L06's T2 and T4 supply both.
        Then End(E) = Z + s*O_K with K = Q(sqrt(D)), and the diagnostic reports whether s
        has small prime factors, which is what determines the nearby orders reachable by
        horizontal isogenies of small degree.
      quantitative_prediction:
        - metric: s
          direction: different
          minimum_effect: >-
            PREDICTED EXACTLY 11, from the same hand magnitude arithmetic recorded in L06
            (ratio 121.00 to eight significant digits). This is a preregistered
            prediction from hand arithmetic, not a result.
        - metric: number of prime factors of s
          direction: different
          minimum_effect: predicted exactly 1.
        - metric: class number of the order, or a bound on it
          direction: higher
          minimum_effect: >-
            NO exact target. SRC-SC-DISC lines 354-366 records that Brainpool requires the
            class number above 10^6 and that GRH implies the class number is not far from
            sqrt(|D|), which here would be about 2^188. The diagnostic reports the GRH
            heuristic estimate EXPLICITLY LABELLED as conditional on GRH, and reports the
            exact class number as NOT COMPUTED - a 378-bit discriminant class number is
            out of reach in this environment and the plan says so in advance rather than
            reporting a shortfall.
      certificate: s as an exact integer with the identity s^2 * D = t^2 - 4p; the prime
        factorisation of s (trivial at this size); the GRH-conditional class-number
        estimate with its conditionality in the record.
      controls: positive - Anomalous (D = -11, and its own s) and BN(2,254) (D = -3) must
        come out with the published D under the same code path; negative - NIST P-384;
        null - the G4 synthetics give the s distribution for random curves over the same
        p, which is the reference for whether s = 11 is unusual.
      budget: 60 CPU-seconds.
      stopping_rule: none needed; the class number is NOT attempted.
      falsifier: s^2 * D not equal to t^2 - 4p; or s not equal to 11, which falsifies this
        producer's prediction while leaving L06's D verification intact - the two are
        deliberately separated so one can fail without the other.
      honest_limitation: >-
        Small s means the curve sits low in its isogeny volcano. That is a structural
        observation with no known ECDLP consequence at |D| approximately 2^377.5, and the
        diagnostic must not imply otherwise. The class number is not computed and no
        statement about it is made beyond the labelled GRH heuristic.

    - id: D06
      diagnostic: model-conversion exceptional sets
      status: PLANNED - and singled out by the handoff as mattering specially for a
        twisted variant.
      tracked_object: the exceptional set of the isomorphism phi: E_r1 -> E_t1,
        (x, y) -> (Z^2 x, Z^3 y), and of each conversion attempted in L08/L10/L11.
      mechanism: >-
        An F_p-isomorphism given by (x,y) -> (u^2 x, u^3 y) with u nonzero is defined
        everywhere on affine points and sends O to O, so its exceptional set is EMPTY as a
        map of curves. The non-trivial content is at the level of the COORDINATE MAPS an
        implementation actually uses: x-only conversion x -> Z^2 x is total, but the
        INVERSE requires Z^-2, and any implementation that computes Z^-2 by inversion has
        an exceptional case at 0. The diagnostic enumerates, for each conversion in the
        plan, the exact set of inputs on which the stated formula is undefined, and gives
        its cardinality.
      sub_tests:
        T1: verify Z is nonzero and invertible mod p; exhibit Z^-1 and check Z*Z^-1 = 1.
        T2: enumerate the exceptional set of the r1 -> t1 map and of its inverse. Predicted
          cardinality 0 for the projective form, 1 (the point at infinity) for the affine
          form.
        T3: for the Montgomery conversion of SRC-SC-LADDER lines 95-99, enumerate the
          exceptional set - it is undefined when s = 0, i.e. when 3r^2 + A = 0. Check
          whether any root r of the cubic satisfies 3r^2 + A = 0, which happens exactly
          when the cubic has a repeated root, i.e. when the curve is singular. Predicted
          impossible here by L02.
        T4: for the short-Weierstrass addition formulas, enumerate the documented
          exceptional cases (Q = P, Q = -P) that SRC-SC-COMPLETE lines 70-80 describes,
          and record their count as a function of the scalar-multiplication chain used.
          This is the bridge to D07.
      quantitative_prediction:
        - metric: cardinality of the exceptional set of the r1 -> t1 isomorphism in
            projective coordinates
          direction: different
          minimum_effect: predicted exactly 0.
        - metric: number of roots r of the cubic with 3r^2 + A = 0
          direction: different
          minimum_effect: predicted exactly 0, since a common root of f and f' would make
            4A^3 + 27B^2 = 0, contradicting L02.
      certificate: Z^-1 with its product check; the explicit exceptional-set enumerations
        with their defining equations; the gcd(f, f') degree in F_p[x] (predicted 0,
        i.e. the resultant is nonzero, which is L02's discriminant restated as a
        polynomial fact).
      controls: positive - a deliberately singular synthetic curve, where gcd(f, f') has
        positive degree and the Montgomery conversion's exceptional set is nonempty, must
        be detected; negative - brainpoolP384r1 itself, whose r1 -> t1 map is the one
        under test and which must give the same empty exceptional set from the other side;
        null - the G4 synthetics with random B.
      budget: 60 CPU-seconds.
      stopping_rule: none needed.
      falsifier: a nonempty exceptional set for the projective isomorphism, which would
        contradict Z being a unit; or gcd(f, f') of positive degree, which would
        contradict L02.
      honest_limitation: >-
        Exceptional sets of FORMULAS are implementation properties. This diagnostic
        enumerates them for the formulas SafeCurves and RFC 5639 state; it does not and
        cannot enumerate them for formulas some other implementation might use, and it
        makes no claim about any deployed code.

    - id: D07
      diagnostic: scalar and multiscalar formula exceptional-case search
      status: PLANNED
      tracked_object: the set of scalar/point pairs at which a named short-Weierstrass
        addition chain hits a documented exceptional case.
      mechanism: >-
        Implement the two chains SRC-SC-COMPLETE lines 47-80 describes - the naive
        Q <- Q+Q; Q <- Q+P chain, and the fixed Q <- dbl(Q); Q <- Q+P chain - with
        exception detection instrumented, and search for scalars n at which the second
        chain reaches Q = P or Q = -P. For the double-scalar case, search for (n, m) at
        which the interleaved chain hits an exception.
      quantitative_prediction:
        - metric: fraction of uniformly random 384-bit scalars n for which the fixed chain
            hits an exception on the base point
          direction: different
          minimum_effect: >-
            predicted approximately 2*B/ell for a search over B scalars, i.e.
            indistinguishable from zero at any feasible B. This is precisely why
            SRC-SC-COMPLETE says 'This will not be caught by random tests', and the
            diagnostic's real output is the CONSTRUCTED exception below, not the random
            search.
        - metric: 'can an exception be CONSTRUCTED?'
          direction: different
          minimum_effect: >-
            predicted YES and cheaply - for the fixed chain, choose n whose leading bits
            make the accumulator equal P at some step; this is a solvable small problem
            and its existence is the point. The number of constructible exceptional
            scalars is predicted to be at least 383 (one per bit position at which the
            accumulator can be steered), and the diagnostic reports the exact count it
            constructs.
      certificate: for each constructed exception, the scalar n, the step index, and the
        two colliding points, re-verifiable by re-running the chain.
      controls: positive - the SAME construction on NIST P-384 and on a toy curve must
        also produce exceptions, showing the search is not curve-specific; negative - the
        complete Edwards formulas on Curve25519 must produce NO exception under the same
        search, which is the whole content of completeness; null - random scalars, which
        must produce no exception, confirming SRC-SC-COMPLETE's 'not caught by random
        tests' claim empirically.
      budget: 600 CPU-seconds.
      stopping_rule: stop the random search at 10^6 scalars regardless; the constructed
        exceptions are the deliverable and are not budget-sensitive.
      falsifier: >-
        The construction failing to produce any exception would falsify the mechanism and
        indicate the chain implemented is not the one SRC-SC-COMPLETE describes - which
        the toy-curve positive control discriminates. The Edwards negative control
        producing an exception would indicate a bug in the complete formulas.
      honest_limitation: >-
        Constructing an exceptional scalar for a textbook chain is a statement about that
        chain, not about brainpoolP384t1, and certainly not about ECDLP. Per the goal's
        claim boundary it is not a break. It is the concrete content behind the 'complete'
        cell being False, and reporting it as anything more would be overclaiming.
      exposure_note: no live key material is involved; all scalars are generated in
        session and discarded.

    - id: D08
      diagnostic: deterministic parameter-generation transcript audit
      status: PLANNED - core content in lane L07; the STATISTICAL part is here.
      tracked_object: the hex-digit overlap statistic between A and B, and the
        seed-schedule structure.
      mechanism: >-
        L07 T4 measures the longest common hex substring between A_r1 and B_r1. This
        diagnostic supplies its null distribution and its interpretation. Measure the
        same statistic on: (a) the 20 G4 synthetics; (b) the other Brainpool r1 curves in
        RFC 5639, whose coefficients are all in the staged mirror; (c) NIST P-384.
      quantitative_prediction:
        - metric: longest common hex substring, Brainpool r1 curves
          direction: higher
          minimum_effect: >-
            predicted 16 or more hex characters for MOST Brainpool r1 curves and 24 for
            brainpoolP256r1 (SRC-BADA55-BRAINPOOL documents 26DC5C6CE94A4B44F330B5D9,
            24 hex characters, for that curve). The prediction that makes this a test
            rather than a restatement: the effect should be present ACROSS the Brainpool
            family and ABSENT for NIST P-384 and for the synthetics.
        - metric: longest common hex substring, G4 null and NIST P-384
          direction: lower
          minimum_effect: predicted 4-6 hex characters, the chance level for two
            independent 96-character strings.
      certificate: the statistic per curve with the matching substring exhibited, so a
        reader can see it.
      controls: as listed in the mechanism; the G4 nulls ARE the null control and must be
        measured before the Brainpool numbers are interpreted.
      budget: 30 CPU-seconds.
      stopping_rule: none needed.
      falsifier: >-
        The overlap being at chance level for the Brainpool family would falsify the
        documented mechanism and would contradict SRC-BADA55-BRAINPOOL; the overlap being
        HIGH for NIST P-384 or for the random synthetics would falsify the claim that the
        statistic detects the Brainpool seed schedule specifically, and would void the
        interpretation.
      honest_limitation: >-
        SRC-BADA55-BRAINPOOL already attributes this overlap to overlapping counters in
        the Brainpool seed schedule and quotes the Brainpool RFC's lead author calling it
        'unfortunate'. Reproducing the statistic is therefore a REPRODUCTION, not a
        discovery, and the diagnostic must be reported as confirming a documented
        artefact. It is NOT evidence of a backdoor, NOT evidence of manipulation, and NOT
        an ECDLP statement.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For an integer n of 384 bits that passes a Baillie-PSW test together with 64
        independent Miller-Rabin rounds with random bases, n is prime.
      rigorous_support: >-
        Miller-Rabin's error bound is at most 4^-r per round for a composite input,
        giving at most 4^-64 for the stated rounds; BPSW has no known counterexample and
        is verified exhaustively below 2^64 in the literature. Neither is a proof for a
        384-bit input. The rigorous alternative is a Pocklington certificate, which
        requires a partial factorisation of n-1 exceeding sqrt(n).
      classical_statement_imitated: the Pomerance-Selfridge-Wagstaff conjecture that no
        BPSW pseudoprime exists.
      validation_plan: >-
        Sample 10^4 known primes and 10^4 known composites of 384 bits generated in
        session (composites as products of two 192-bit primes, the hardest case for trial
        division and the easiest for Miller-Rabin), run the identical routine, and require
        zero misclassifications in both directions. Additionally, for every prime the
        audit certifies probabilistically, attempt a Pocklington certificate and report
        the fraction achieved. Sampled parameters and the achieved fraction go in the run
        record.
      transfer_assumption: none - the sampled objects are the same size and shape as the
        audited ones. Stated because the absence of a transfer assumption is itself worth
        recording.
      where_it_binds: L01, L03, L06 T4, L09 T2.

    - id: H2
      statement: >-
        ell - 1 for this curve behaves, with respect to factorisation difficulty, like a
        uniformly random integer of 384 bits.
      rigorous_support: >-
        No rigorous bound on the largest prime factor of this specific ell - 1 is
        available. The classical statement being imitated is Canfield-Erdos-Pomerance /
        Dickman-de Bruijn: the density of y-smooth integers up to x is x*rho(u) with
        u = log x / log y, so a random 384-bit integer has its largest prime factor above
        2^128 with probability approximately 1 - rho(3) = 0.95.
      validation_plan: >-
        Sample 200 uniformly random 384-bit integers, run the IDENTICAL factorisation
        pipeline under the IDENTICAL 900-second budget, and record the empirical
        distribution of (largest factor found, fraction fully factored). Compare the
        empirical CDF of log(largest prime factor)/log(ell-1) against the Dickman-de
        Bruijn rho(u), and apply a tail consistency check on the smoothest sample
        observed against the rho(u) prediction for that smoothness. Sampled parameters,
        the budget, and the achieved fraction go in the run record.
      transfer_assumption: >-
        EXPLICIT AND POSSIBLY FALSE. ell - 1 is not a random integer - ell was selected by
        the Brainpool procedure subject to security requirements, which could correlate
        with the factorisation of ell - 1. SafeCurves' published embedding degree
        (l-1)/4 implies 4 | ell-1 and is itself evidence of structure. The prediction in
        L05 that most rows will be bracketed rather than exact is stated IN ADVANCE
        precisely so a bracketed outcome is an honest environment measurement and not a
        retrofitted excuse.
      where_it_binds: L05 T4, and hence the availability of an exact-k certificate and of
        a Pocklington certificate for ell in L03.

    - id: H3
      statement: >-
        For the 20 same-shape synthetic curves of G4 (fixed p, fixed a = -3, uniformly
        random B), the number of rational roots of x^3 - 3x + B in F_p is distributed as
        for a uniformly random separable cubic over F_p, i.e. 0, 1 or 3 roots with
        limiting frequencies 1/3, 1/2, 1/6.
      rigorous_support: >-
        The frequencies follow from the Chebotarev density theorem applied to the Galois
        group S_3 acting on the roots, in the form of the standard count of cubics over a
        finite field by splitting type; the limiting frequencies are exact as p tends to
        infinity with an O(1/sqrt(p)) error term from Weil, which at p approximately
        2^383 is utterly negligible.
      classical_statement_imitated: the equidistribution of Frobenius conjugacy classes.
      validation_plan: >-
        Increase the null sample from 20 to 2000 for THIS statistic alone (it costs one
        gcd per curve, so 2000 samples is under 60 seconds) and compare the observed
        (0, 1, 3)-root counts against (1/3, 1/2, 1/6) with a chi-squared test at 2
        degrees of freedom. Report the p-value. A significant deviation means the root
        finder is wrong, not that the theorem is.
      transfer_assumption: none material; the nulls share the exact field of the audited
        curve.
      where_it_binds: L08 ROUTE B, L10, L11, D06 - the null base rates against which
        'no Montgomery model' and 'no point of order 2' are read.

    - id: H4
      statement: >-
        The SafeCurves combined-attack cost exponent is reproducible from (ell, h, ell',
        h') by the optimisation stated verbatim on SRC-SC-TWIST lines 234-266, to within
        0.3 in the exponent.
      rigorous_support: >-
        The cost model is stated explicitly on the page with two fully worked examples,
        which fix the intended optimisation (balance brute force over selected small
        factors against a kangaroo attack on the residual). It is a stated model, not a
        theorem, and reproducing it is an interface check on the plan's implementation,
        not a mathematical validation of the model.
      validation_plan: >-
        Re-derive the exponent for every curve in the SafeCurves twist table for which the
        plan already has (ell, h, ell', h') - at minimum brainpoolP256t1 (published
        2^44.5), NIST P-224 (2^58.4), NIST P-256 (2^120.3), NIST P-384, BN(2,254)
        (2^93.2) - and require agreement within 0.3 on ALL of them before the
        brainpoolP384t1 exponent is reported. Report the maximum residual observed.
      transfer_assumption: >-
        The plan assumes the published exponents were computed with the model as written.
        If several published exponents cannot be reproduced within tolerance, the honest
        conclusion is that the plan misread the model, and the lane reports its own
        exponent as UNRESOLVED rather than declaring the published one wrong.
      where_it_binds: L09 T4.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. This plan proposes no algorithm for the ECDLP and
      moves no exponent. The dominant audit costs are: K = 10^6 modular multiplications
      for L05's lower bound; one 384-bit exponentiation for L05 T3; one x^p mod f(x)
      computation for L08; a best-effort factorisation of ell - 1; and the SHA-1
      transcript replay of L07, whose cost is the number of seed iterations times one
      SHA-1 plus one primality test per candidate.
    memory_exponent: O(log p) throughout for the audit; O(1) for every certificate except
      L05's lower bound, whose verification is O(1) memory but K time.
    best_known: >-
      Against the ECDLP on this curve the incumbent is rho at 0.886*sqrt(ell) with O(1)
      memory, i.e. approximately 2^191.4 group operations, parallelisable with negligible
      communication (van Oorschot-Wiener) and vectorisable (Bernstein-Lange-Schwabe).
      This plan does not approach it and does not try to.
    hidden_overhead: >-
      The k > K certificate is NOT succinct: verifying it costs K modular
      multiplications, the same as producing it. Presenting it as a short proof would be
      dishonest. L05's honest output is a bracket 10^6 < k <= (ell-1)/4, with the upper
      side resting on one exponentiation and the lower side on 10^6 multiplications.
    tradeoff_note: >-
      One real tradeoff inside the audit: an exact k requires factoring ell - 1
      (expensive to produce, succinct to verify) versus a bound requiring K
      multiplications (cheap to produce, expensive to verify). The run record must state
      which route each lane took. No time-memory tradeoff of the van Oorschot-Wiener kind
      arises, because no attack is mounted.

  dominated_by: >-
    Checked across the frontier rows this program records, on time, memory, and
    data/queries. As an ATTACK this plan mounts none and is dominated on every axis by:
    rho at 0.886*sqrt(ell) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
    sqrt(ell) time and sqrt(ell) memory (KN-TECH-031) and its n^{2/3+o(1)} full cost
    (KN-TECH-035); automorphism-discounted rho on small-|D| curves (KN-TECH-018), which
    D03 predicts does not apply here; MOV/Frey-Ruck at small embedding degree
    (KN-TECH-032), which L05 predicts does not apply; and the anomalous additive transfer
    (KN-TECH-033), which L05 T1 predicts does not fire.
    As an AUDIT INSTRUMENT the incumbent is SafeCurves itself, which has published every
    one of the eleven cells and most of the additional-diagnostic quantities for this
    exact curve since 2013, and which dominates this plan on authority, on completeness,
    and on having been done first. Also dominating on specific cells: RFC 5639's own
    Section 3 security requirements, and the parameter-validation procedures mandated by
    ANSI X9.62 and SEC 1. This plan dominates none of them on any axis EXCEPT locality:
    its outputs would be re-verifiable certificates inside this program's ledger rather
    than third-party assertions, and four of its outputs (L05 T3's single-exponentiation
    upper bracket, L06 T2's conductor identity, L08's two-route disagreement test, and
    D08's null-calibrated overlap statistic) are checks the cited sources publish
    conclusions for without publishing the check.
  sota_delta: >-
    Zero speedup against any attack baseline on any axis; the plan proposes no attack.
    Quantitatively as DATA: the program's knowledge corpus currently contains ZERO
    records mentioning brainpool (grep over knowledge/ returned no files), so the corpus
    holds no embedding degree, no discriminant, no trace, and no order for this curve.
    This plan would produce 11 criterion rows plus 8 diagnostic rows, of which an
    estimated 14 would carry a certificate re-verifiable in under one second by a third
    party, 3 would carry a non-succinct bound whose verification cost is stated, and 2
    (L07 T5 and D05's class number) would be recorded as UNRESOLVED with named successor
    conditions. As SCOPE: it converts 19 third-party assertions about one curve into
    locally checkable artifacts, and it converts one hand-verified arithmetic identity
    (capsule V13) into a machine-checked one.

  ranking_rationale: >-
    Ordered by expected information gain per CPU-second, with the instrument gate
    unconditionally first because every downstream number is void without it.
    TIER 1 (seconds, and each closes a named open gap in the capsule): L02, L05 T3, L06
    T2, L03, D01. L02 T1 closes conflict C5 - the 116-digit decimal B that the entire
    intake equation rests on has no primary corroboration, and one base conversion
    settles it. L05 T3 is a single modular exponentiation that either confirms or
    destroys the published embedding degree (l-1)/4, which is the largest published claim
    in the transfer lane. L06 T2 is one multiplication that tests a sharp numeric
    prediction (s = 11) derived here from hand arithmetic. D01 turns h = 1 from a copied
    cell into a Hasse-certified consequence and is the dependency of L06 and L09.
    TIER 2 (minutes): L01, L04, L08+L10+L11 as one shared computation, D03, D05, D06.
    L08/L10/L11 collapse into a single cubic root count with three readouts, which is the
    plan's best information-per-second ratio after Tier 1 and is why they share a budget.
    TIER 3 (up to half an hour each, and the only lanes that can fail on budget): L05 T4,
    L07 T1/T2, L09, D02, D07.
    DEFERRED with successor conditions: L07 T5 (2005 standard unretrieved) and D05's
    exact class number (out of reach at 378 bits in this environment).
    TEST FIRST: L02 sub-test T1 - base-convert the RFC 5639 hexadecimal B for
    brainpoolP384t1 and compare it to the 116-digit decimal in the intake. It is the
    cheapest valid discriminator in the whole plan: it costs microseconds, it is the ONLY
    parameter in the tuple with no independent primary corroboration in the same base
    (capsule conflict C5), and it discriminates between exactly two explanations - either
    the intake equation is the RFC's curve, in which case every downstream lane inherits
    a sourced tuple, or it is not, in which case the goal has hit its own pause condition
    on an unresolved parameter conflict and no further compute should be spent at all.
    No other lane can invalidate the whole plan for that price.
