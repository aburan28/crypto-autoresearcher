  # ===========================================================================
  verdict: failed
  # ===========================================================================
  verdict_scope: >-
    `failed` here means TWO NAMED CLAIMS DO NOT HOLD AS STATED and must not be
    carried into EV-MCE-3d6e9a as written. It does NOT mean the artifacts are
    fabricated, inaccurate in their affirmative content, or inadmissible in
    whole. The producers were unusually scrupulous — the tagging producer
    declared in bold that it could not run its own command, the correction
    producer declared its quotations second-hand, and the transcription producer
    logged a TLS failure it fixed the hard way. Most of what was declared
    verifies. The two failures are:
      F-1  TASK-20260808-f9374d's central deliverable — "the constraint is now
           grep-enforceable" — is falsified by construction. I built FIVE corpus
           entries that carry both claim classes, that a YAML parser reads as
           `tags: [distinguisher, key-recovery]`, and that BOTH audits miss.
           Neither audit's disclosed limitation list covers this. Details:
           control_checks C-4.
      F-2  TASK-20260808-843c87's corrected boundary is verbatim-accurate in
           every affirmative statement it makes and materially incomplete in one
           direction. The source states, in the same paragraph and again in its
           concluding remarks, that the Goppa exclusion is provisional,
           unproved, scoped to one phase of the attack, and conjectured to fall.
           None of the three superseding sites carries any of it. Details:
           source_checks S-1.
  what_is_admissible_notwithstanding: >-
    Recorded explicitly so the Coordinator can carve rather than discard.
    ADMISSIBLE AS VERIFIED: the SEC Table 1 transcription in full (150/150 cells
    re-verified first-hand by me from an independent retrieval and by a second
    modality); the identifier remap (the collision is real, the replacements are
    genuinely free); the citation_verified split (honest, and conservative in
    the safe direction); the dropping of the IR 8545 SIKE assertion (correct);
    the non-editing of all superseded originals; and the fact that both audits
    DO print nothing against the corpus as it stands today.

  # ===========================================================================
  # 1. ARTIFACT AND ARCHIVE INTEGRITY
  # ===========================================================================
  artifact_checks:

    - id: A-1
      what: Recompute every sha256 in the snapshot receipt's archive.path_sha256.
      method: sha256 of each path in the working tree at HEAD, compared to the declared value.
      declared_count: 19
      result: 19 of 19 match. 0 mismatches, 0 missing.
      status: pass

    - id: A-2
      what: Recompute the queue's copy of the same archive block, which declares 20 paths.
      result: >-
        19 of 20 match. ONE MISMATCH, and it is the receipt itself:
        archives/TASK-20260808-2de410/snapshot-receipt.json is declared at
        360045a3245bb6e0b64cc3a25535fea7110b74535b8b1cc6a014fce3e1669a1c and
        hashes to e36c97eb14f825eafb8966aa77ec957dd569365686b2d0c1eddc5190247245f3
        in the tree.
      cause_traced: >-
        Commit ed5cc287d ("record a Coordinator archive-scope defect"), TWO
        commits after the snapshot, appended the
        `archive_scope_defect_recorded_by_the_coordinator` block to the receipt
        and did not update the queue's declared hash for it.
      significance: >-
        The one object that binds all the others was edited after it was
        committed, and the record that declares its hash was not updated. The
        producer artifacts are unaffected. But an archive receipt that no longer
        matches its own declared hash cannot be used as the anchor of a
        content-verification argument without this exception being stated.
      status: fail

    - id: A-3
      what: Does the receipt bind itself, as its own completion gate requires?
      gate_text: "path_sha256 covers every artifact produced by the four preceding tasks and the receipt."
      result: >-
        NO. The receipt's own path_sha256 has 19 entries and does not include
        the receipt. Only the queue's copy has 20. A receipt cannot self-hash,
        so this gate is unsatisfiable as literally written inside the receipt;
        it is satisfied only in the queue, which is a coordination record and is
        itself mutable (it has been rewritten five times since the batch opened).
      status: fail_as_written

    - id: A-4
      what: Per-artifact git history — when did each declared artifact enter the record, and has it moved since?
      method: >-
        For each declared path, compare the blob id at 04c41125a with the blob
        id at HEAD, and read `git log` for the path.
      result: >-
        All 18 producer artifacts are BYTE-IDENTICAL between the snapshot
        commit's tree and HEAD. ledger/questions/RQ-MCE-3f7c02.yaml likewise.
        Only the receipt differs (A-2).
      status: pass

    - id: A-5
      what: The three superseded originals were not edited.
      result: >-
        Confirmed. knowledge/literature/KN-LIT-4c8135.md last touched by
        10dc665c6; ledger/questions/RQ-MCE-e65b3c.yaml and
        BATCH-001-OPENING.md last touched by a6a045469. None appears in
        c32b4b5dc or 04c41125a. The four both-tagged originals (13a01d, 71d1a0,
        7ee1a9, e37d4c) likewise retain `superseded_by: null` and were not
        opened for write.
      status: pass

    - id: A-6
      what: knowledge/INDEX.md.
      result: >-
        It is listed in .gitignore (line 134) as a generated artifact CLAUDE.md
        says is never committed — and it IS tracked, and commit c32b4b5dc
        modified it. .gitignore has no effect on an already-tracked file. This
        predates the batch and is not this batch's defect, but c32b4b5dc did
        commit a change to it, outside the declared archive set. Recorded under
        AGENTS.md rule 8 rather than scored.
      status: observation

    - id: A-7
      what: Ledger validity of the new records.
      command: python3 tools/validate_ledger.py
      result: >-
        exit 0. Pre-existing errors only (1211 grandfathered, 981 legacy schema
        issues). I grepped the full error output for every identifier this batch
        created — 3f7c02, c41d8b, 3c9f21, a4d70e, 6b1fc8, d82a53, 84b674,
        6da230, 7d2077, 4fa25d, eb2b9b, TAG-CLAIM — and got ZERO hits. The
        producers' "zero new errors" claim holds.
      note: >-
        RQ-MCE-3f7c02's required research_question fields (id, title, scope,
        status, owner) are all present; status is `active`.
      status: pass

  # ===========================================================================
  # 2. THE COORDINATOR'S SELF-REPORTED ARCHIVE-SCOPE DEFECT
  #    — assessed independently, not accepted
  # ===========================================================================
  archive_scope_defect_assessment:

    the_coordinators_claim: >-
      "Nothing is lost or unverifiable. Every one of the 20 artifacts is
      committed, and this receipt binds all 20 by sha256, so the archive is
      CONTENT-VERIFIED... What fails is the commit-scope check, which is about
      how the commit was assembled, not about whether the artifacts are what
      they claim to be."

    is_the_content_verification_claim_correct: partly

    findings:

      - id: D-1
        finding: >-
          "This receipt binds all 20 by sha256" is FALSE. The receipt binds 19.
          It does not bind itself. The 20-path block is in the dispatch queue,
          not the receipt.
        severity: minor_but_it_is_the_load_bearing_sentence

      - id: D-2
        finding: >-
          "Every one of the 20 artifacts is committed" is TRUE, and I verified
          it: all 18 producer artifacts are in c32b4b5dc, RQ-MCE-3f7c02.yaml and
          the receipt are in 04c41125a. Every one is reachable and unmodified
          since — EXCEPT the receipt, which the Coordinator edited two commits
          later to insert the defect disclosure, breaking its own declared hash
          (A-2). The Coordinator's disclosure of the defect is itself the act
          that broke the last hash. That is not stated in the disclosure.
        severity: material

      - id: D-3
        finding: >-
          THE STATED CAUSE IS WRONG. The receipt says: "I committed each
          producer's artifacts as its task closed, so by the time the snapshot
          commit was made there was nothing left for it to contain." The history
          does not show that. `git show --name-status c32b4b5dc` shows ALL
          EIGHTEEN producer artifacts entering in ONE commit, the immediate
          parent of the snapshot. The three earlier batch commits (eaafdb711,
          111d04124, 64fdf09aa) touch ONLY dispatch_queue.json — they close
          queue states, exactly as the receipt's own "correct_procedure_going
          _forward" recommends. So the artifacts were not dribbled out per task.
          They were staged in one commit that landed one commit too early, under
          a message naming only TASK-20260808-f9374d while carrying four tasks'
          output.
        why_it_matters: >-
          The receipt proposes a remedy — "close queue STATES as tasks finish;
          do not commit their ARTIFACTS early" — that was ALREADY being followed
          for the queue and that does not describe what actually went wrong.
          The actual error is narrower and easier to fix: one commit, one commit
          too soon, with a message attributing four tasks' work to one task. A
          remedy aimed at the wrong cause will not prevent the recurrence.
          This is the one place where accepting the Coordinator's own
          characterisation of its own defect would have propagated an error.
        severity: material

    does_the_ordering_guarantee_hold: >-
      NO, NOT AS THE MECHANISM INTENDS — but the damage is smaller than the
      defect's framing implies, and larger than "only the commit-scope check
      failed" implies.

      WHAT A SNAPSHOT IS FOR. The snapshot task's own stated uncertainty is
      "Whether the review scores artifacts that cannot move." The guarantee is
      not "the artifacts were eventually committed"; it is "the artifacts were
      frozen at a named commit BEFORE any reviewer read them, so the reviewer's
      finding and the producer's text are causally ordered."

      WHAT ACTUALLY HOLDS HERE. I verified by blob comparison that all 18
      producer artifacts are byte-identical at 04c41125a and at HEAD, and that
      each entered at c32b4b5dc and has one commit in its history. So AS A
      MATTER OF FACT nothing I read could have moved, and every finding below is
      about frozen bytes. That is a strong result and I state it plainly.

      WHAT DOES NOT HOLD. It holds as a fact I established, NOT as a guarantee
      the mechanism provided. The distinction is the whole point of the
      mechanism:
        (i) The freezing commit is c32b4b5dc, which is NOT the snapshot commit
            and is NOT named as an archive anywhere. Its message names one task
            and carries four. A future reader reconstructing "what was fixed
            before review" from the archive record will be pointed at
            04c41125a, which contains 2 of the 20 files.
        (ii) The receipt — the object that carries the hashes — was ITSELF
            modified after the snapshot, at ed5cc287d, and no longer matches its
            declared hash. An immutable-record mechanism whose receipt is edited
            in place has demonstrated that it does not prevent the thing it
            exists to prevent. AGENTS.md rule 4 ("corrections create new
            records") applies to receipts too; the correct move was a
            superseding receipt or a separate defect record, not an edit.
        (iii) `tools/research_dispatch.py`'s refusal is therefore CORRECT and
            should not be worked around. The dispatcher is not being pedantic
            about assembly; it is detecting that the declared archive and the
            commit that supposedly created it are different objects.

      SO: I did not have to trust the ordering, because I could check it, and it
      checks out. A reviewer who could only read the receipt would have been
      trusting a hash that no longer matches, pointing at a commit that does not
      contain the files.

    what_i_did_not_do: >-
      I did not repair, restate, or re-commit anything, and I did not run the
      dispatcher against this batch to "make it render." Both would be outside
      my scope and the second would destroy the evidence of the defect.

  # ===========================================================================
  # 3. SOURCE CHECKS — both papers, first-hand
  # ===========================================================================
  source_checks:

    - id: S-0
      subject: Is the arXiv:2304.14757 provenance chain the producer relied on sound?
      the_chain_as_declared: >-
        The producer declared the boundary quotation RE-QUOTED, not re-read,
        from BATCH-001's committed transcription at
        .../TASK-20260803-292b99/rate_regime_extraction.md lines 273-274, marked
        VERBATIM, derived from a PDF fetched at sha256 ebbd94ac3cd00b0f0e723aea
        b56fd3b0820c89d47072fc8241f12c5f93c564b8.
      what_i_checked_first: >-
        rate_regime_extraction.md lines 271-274 read exactly:
        "VERBATIM:" / "> Interestingly our attack does not work at all when the
        alternant code has the additional structure of being a Goppa code."
        So the internal link from the correction to the transcription is exact.
      is_the_pdf_readable_in_this_environment: YES
      first_hand_acquisition: >-
        I fetched it myself. `curl -sS -L --max-time 120 https://arxiv.org/pdf/2304.14757`
        → HTTP 200, 526690 bytes, sha256
        ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8 —
        BYTE-IDENTICAL to the hash the chain is bound to. 36 pages. Written only
        to the session scratchpad, outside the repository; not committed.
      extraction_independence: >-
        DELIBERATELY A DIFFERENT TOOL FROM THE ONE THAT MADE THE TRANSCRIPTION.
        BATCH-001 used pdfminer.six. I used poppler pdftotext 26.04.0, and for
        the load-bearing pages I additionally rendered the page to PNG at 150-170
        dpi with pdftoppm and READ THE RENDERED PAGE, a modality that shares no
        code path with any text extractor.
      verdict_on_the_chain: >-
        SOUND. Every link holds and the terminal object is reproducible. The
        chain was in fact stronger than it needed to be: the PDF is directly
        retrievable here, so the second-hand step was avoidable. That is not a
        criticism of the producer, whose role has no fetch capability and which
        said so; it is a note that the batch could have had a first-hand read
        for the cost of one curl if the task had been given to a role that can
        execute.
      status: pass

    - id: S-1
      subject: The three-conjunct boundary claim, checked against the source by me.
      quotations_verified_first_hand:

        - text: >-
            Interestingly our attack does not work at all when the alternant
            code has the additional structure of being a Goppa code.
          located: >-
            PDF page 7, immediately following the run-in paragraph heading
            "Opening the road for attacking the CFS scheme."
          result: VERBATIM CORRECT, character for character.

        - text: >-
            this paper | q “ 2 or q “ 3, m arbitrary + high rate condition (6)
            (does not apply in the particular case of Goppa codes)
          located: PDF page 7, Table 1, "restriction" column, row "this paper".
          result: >-
            VERBATIM CORRECT, including the `“` artifact the producer refused to
            normalise. Caption verified: "Table 1. Summary of polynomial time
            attacks on McEliece schemes based on alternant codes with the
            conditions to apply them."

        - text: >-
            Goppa codes behave differently from random alternant codes and
            provide counterexamples to Heuristic 18.
          located: PDF page 15, section 3.2, headed "What is wrong with Goppa codes?"
          result: VERBATIM CORRECT. The section heading is also verbatim correct.

        - text: >-
            we can actually attack McEliece-alternant for any extension degree m
            provided that the rate of the alternant code is sufficiently large
            (6) and the field size sufficiently low q “ 2 or q “ 3.
          located: PDF page 7.
          result: VERBATIM CORRECT.

      three_conjunct_claim: >-
        CORRECT AS FAR AS IT GOES. All three conjuncts are in the source:
        (1) family — generic/random alternant, Goppa excluded; (2) q ∈ {2,3}
        with m arbitrary; (3) high rate per condition (6). The title
        "POLYNOMIAL TIME KEY-RECOVERY ATTACK ON HIGH RATE RANDOM ALTERNANT
        CODES" carries both the rate half and the family half, as the correction
        says. The abstract confines the positive answer to "a generic alternant
        code" and "q P t2, 3u", as the correction says. Condition (6) is indeed
        not transcribable from a clean extraction and the producer correctly
        refused to reconstruct it.

      # ---- THE FINDING -------------------------------------------------------
      material_omission_found:
        severity: material
        summary: >-
          The correction quotes the Goppa-exclusion sentence and STOPS AT THE
          FULL STOP. The very next sentence in the same paragraph, and two
          passages in the paper's concluding remarks, all run the other way. The
          paper does not present the Goppa exclusion as a structural boundary of
          the result. It presents it as a present-tense obstruction to one phase
          of the attack, explicitly not proved, which the authors conjecture
          will fall.
        verbatim_from_the_source_that_no_superseding_site_carries:

          - locus: PDF page 7, the sentence immediately after the quoted one
            text: >-
              However this work could open the road for also attacking this
              subcase, in which case we could hope to break the CFS scheme
              [CFS01] which operates precisely in the high rate regime where the
              square of the dual of the Goppa code behaves abnormally.
            note: >-
              The paragraph's own run-in heading is "Opening the road for
              attacking the CFS scheme." The correction quotes the heading and
              the next sentence, and omits the sentence that explains why the
              heading says "opening the road."

          - locus: PDF page 32, concluding remarks
            text: >-
              Therefore it is tempting to conjecture that Goppa codes, at least
              in the regime where they are distinguishable from random codes
              (which applies in particular to the CFS scheme [CFS01]) should
              eventually be attacked in polynomial by some variation the attack
              that has been given here.
            note: >-
              Verified twice — poppler text extraction and a 150 dpi render of
              page 32 that I read directly. Transcribed as printed, including
              the source's own missing "of".

          - locus: PDF page 32, "Understanding the Gröbner basis approach"
            text: >-
              However, unlike the case of the filtration where right now this
              part of the attack does not work at all, it seems that here even
              if the Gröbner basis computation consists of more steps, solving
              the whole system should still be polynomial.
            note: >-
              This SCOPES the "does not work at all". It is the FILTRATION phase
              that fails on Goppa codes, and it fails "right now". The authors
              expect the Gröbner phase to remain polynomial.

          - locus: PDF page 15, section 3.2, opening
            text: >-
              The discussion below does not represent a proof that computing a
              filtration is impossible for Goppa codes, but rather an intuition
              about what hampers it.
            note: >-
              THIS ONE IS ALREADY IN THIS PROGRAM'S OWN RECORDS. BATCH-001's
              heuristics_enumerated.md line 332 transcribes it and line 348
              flags Heuristic 23 as "explicitly 'does not represent a proof'".
              The correction re-quoted from a sibling file in the SAME task
              directory and did not carry it forward. So this omission was not
              caused by the producer's inability to read the PDF.

        why_this_is_a_defect_and_not_a_completeness_quibble: >-
          The task card that governs me says: "A correction that replaces one
          mis-scoping with another is still a defect. Check what the SOURCE
          says." The correction does not assert anything false. But it converts
          a provisional, phase-scoped, explicitly-unproved obstruction into "the
          decisive conjunct", "STRUCTURAL", and "settles applicability to binary
          Goppa codes before any rate arithmetic is performed" — for a campaign
          whose stated question is whether the structural line threatens Classic
          McEliece. On the axis that the campaign turns on, the correction moves
          the record toward dismissal using material the source qualifies in the
          same breath.

          The correction report NAMES this failure mode itself, in §4: "Treating
          it as licence to dismiss the 2026 line would be the dismissal-side
          error that BATCH-001-OPENING §7 defines as this campaign's failure
          condition — symmetric with alarm." It names the error and then omits
          the four passages that are the source's own guard against it.

        what_the_correction_DID_get_right_here: >-
          Recorded so this finding is not read as broader than it is. §4 of the
          report and the matching section of KN-LIT-c41d8b both state: "It is not
          a theorem that Goppa codes resist algebraic attacks, and this program
          asserts nothing about Classic McEliece's security." That hedge is
          correct and it points the right way. What is missing is the
          affirmative evidence FROM THE SOURCE that the hedge is not merely
          formal caution — the authors' own conjecture. A hedge the reader may
          discount is not a substitute for a quotation the reader cannot.

      additional_first_hand_findings:

        - id: S-1a
          finding: >-
            THE ARXIV VERSION NUMBER IS RECOVERABLE, and the record says it is
            not. correction_report.md §6 item 4 and KN-LIT-c41d8b's "Not
            verified here" both state the served version was not recorded. The
            PDF's own left-margin stamp, at the bound sha256, reads
            "arXiv:2304.14757v3 [cs.IT] 29 May 2023". The quotations are from
            v3. This closes a declared gap.
          status: gap_closed_by_validator

        - id: S-1b
          finding: >-
            A "VERBATIM" BLOCK THAT IS NOT FROM THE BOUND ARTIFACT.
            KN-LIT-c41d8b lines 80-83 and correction_report.md §3 quote the
            abstract as: "when the code is {\em a generic alternant code} ...
            $q \in \{2,3\}$ and for {\em all} regime ...", attributed to the
            transcription of the PDF at sha256 ebbd94ac…. The string `{\em` does
            NOT occur anywhere in the text of that PDF (grep count: 0); the PDF
            renders the same sentence as "when the code is a generic alternant
            code ... q P t2, 3u and for all regime ...". The LaTeX markup can
            only have come from a different acquisition route (the arXiv
            abstract listing serves the abstract's LaTeX). The WORDS are
            identical and no meaning is affected. But a block labelled verbatim
            and bound to a sha256 reproduces bytes that are not at that sha256 —
            in a batch whose entire method is hash-bound provenance, and whose
            own convention records exactly this class of defect as V-1.
          severity: minor_but_in_kind
          status: fail

        - id: S-1c
          finding: >-
            KN-LIT-c41d8b's frontmatter is the IEEE journal version (year 2024,
            venue IEEE Trans. IT, doi 10.1109/tit.2023.3334592) while every
            quotation is from arXiv v3. The entry does say quotations are scoped
            to the sha256. Recorded as a provenance seam, not scored: a journal
            version may differ, and nobody in this program has read it.
          status: observation

    - id: S-2
      subject: SEC Table 1, checked against the source by me.
      first_hand_acquisition: >-
        `curl -sS -L https://classic.mceliece.org/mceliece-security-20221023.pdf`
        → HTTP 200, 332574 bytes, sha256
        db17ef0879cb8822120c312b7290f7db82fe9fc356bd16058ad334a512b523fa, 36
        pages. Matches the declared hash and the hash BATCH-001's
        TASK-20260803-f3aece recorded at seq 7. Scratchpad only; not committed.
      sample_declared_by_the_gate: "a sample of transcribed values"
      what_i_actually_checked: ALL 150 CELLS, TWICE, BY TWO MODALITIES.
      method_1: >-
        pdftotext -layout page 10 → parsed the 15×10 array in code → compared
        by string equality against every `value_printed` in sec_table1.json,
        keyed on (row_label_verbatim, column_header_verbatim).
      result_1: "agree=150  disagree=0  unmatched=0"
      method_2: >-
        The same comparison against the Markdown table in sec_table1.md:
        150/150 agree. So md and json are mutually consistent AND both agree
        with my extraction.
      method_3: >-
        NO SHARED CODE PATH WITH ANY TEXT EXTRACTOR. pdftoppm rendered page 10
        to PNG at 170 dpi and I read the rendered table directly. Every row,
        every column, header order, and the caption match. This is what closes
        the circularity risk noted in self_audit SA-1.
      other_claims_checked:
        - "150 cells, 15 rows × 10 columns: confirmed."
        - "Every value_printed is a JSON string: confirmed (all 150)."
        - "Every status is OK; every unit_status is NOT-STATED-BY-SOURCE: confirmed."
        - >-
          "No unit appears in any column header" — confirmed by reading the
          header row, the caption, the introducing sentence and the rendered
          page. There is no unit row; the header row is followed directly by
          the first data row. The transcription's refusal to infer a unit
          (its Rule 1.1.3 = §1.1 item 3) is correct, and is in fact BETTER
          supported than it claims: SEC's own prose says "the 140.8 actually
          counts more than 2^143 bit operations", which positively establishes
          that the entries are NOT log2 of bit operations. An inferred unit
          would have been wrong, not merely unlicensed.
        - >-
          The convention citations the transcription uses (Rule 1.1.2, 1.1.3,
          2.1.7, 3.1.5, 3.1.7, 5.2.4, 5.2.5, 5.2.6, 6.1.2, 6.1.4, 6.1.5, 7.2,
          8.5) resolve as §X.Y item Z in transcription_convention.md. I resolved
          a sample and they are accurate: 1.1.3 is the never-infer-a-unit rule;
          6.1.5 is "any passage whose absence is being reported ... is quoted so
          the absence is checkable"; 6.1.2 is unit/cost-model/assumption. The
          transcription applied its own convention faithfully.
        - >-
          Encoding of transcription_convention.md: valid UTF-8, 46018 bytes, no
          BOM, no CRLF, trailing newline. The Coordinator's figure is confirmed.
        - >-
          source_access_log.yaml records three retrievals (two curl, one python
          urllib with certifi), a crashed pdftotext -bbox recorded as
          infrastructure_error rather than discarded, and a TLS verification
          failure fixed by ADDING a CA bundle rather than disabling
          verification, with the note "the tempting fix is the forbidden one".
          I did not re-run those; I record that the log is internally coherent
          and that the one hash it turns on reproduces here.
      status: pass

  # ===========================================================================
  # 4. CONTROLS — THE AUDIT COMMANDS
  # ===========================================================================
  control_checks:

    - id: C-1
      what: AUDIT-1, run by me, verbatim from knowledge/TAG-CLAIM-CLASS.md §2.
      command_run_exactly: |
        cd "$(git rev-parse --show-toplevel)"
        grep -rlE '^tags:.*(\[|,) ?distinguisher(,|\])' knowledge/ \
        | xargs -r grep -lE '^tags:.*(\[|,) ?key-recovery(,|\])' \
        | while read -r f; do
            grep -qE '^superseded_by: *KN-' "$f" && continue
            id=${f##*/}; id=${id%.md}
            grep -rhE '^supersedes:' knowledge/ \
              | grep -oE 'KN-[A-Z]+-[0-9A-Za-z]+' \
              | grep -qx "$id" || printf '%s\n' "$f"
          done
      output: ""
      output_byte_count: 0
      result: PRINTS NOTHING.
      environment: >-
        BSD/macOS grep and xargs, zsh. The producer's stated portability
        concerns (`xargs -r` a no-op on BSD, exit status not the signal) held:
        the pipeline ran clean and I checked output length, not $?.
      status: pass

    - id: C-2
      what: AUDIT-2, run by me, verbatim from §3.
      command_run_exactly: |
        cd "$(git rev-parse --show-toplevel)"
        grep -rlE '^[[:space:]]*-[[:space:]]+(distinguisher|key-recovery)[[:space:]]*$' knowledge/
      output: ""
      output_byte_count: 0
      result: PRINTS NOTHING.
      status: pass

    - id: C-3
      what: Positive control — does AUDIT-1 fire when it should?
      why: >-
        A command that prints nothing is indistinguishable from a command that
        cannot print anything. Neither producer ran this check.
      method: Ran stage 1 and stage 2 of AUDIT-1 without the supersession filter.
      result: >-
        Stage 1 returns 13 files carrying `distinguisher` as an exact list
        token. Stage 2 narrows to exactly FOUR: KN-LIT-13a01d, KN-LIT-71d1a0,
        KN-LIT-7ee1a9, KN-LIT-e37d4c — precisely the four the task card named,
        and no others. So the empty output of C-1 is produced by the
        supersession filter correctly retiring four real hits, not by a
        pipeline that matches nothing. THE AUDIT IS LIVE.
      status: pass

    - id: C-4
      what: NEGATIVE CONTROL — can I break the audits? I was asked to try. I succeeded.
      method: >-
        Built a scratch corpus at <scratchpad>/auditbreak/knowledge/literature/
        and ran BOTH commands against it with ONLY the root path substituted
        (`knowledge/` relative to the scratch root instead of the repo root);
        every regex, pipe and filter is byte-identical. NOTHING WAS WRITTEN
        UNDER knowledge/ IN THE REPOSITORY — that is outside my write scope.
        The scratch tree contains no `supersedes:` lines, so AUDIT-1's retirement
        filter drops nothing; that biases toward PRINTING, so every evasion
        below is a genuine evasion and not a filter artifact.
      controls_that_MUST_be_caught:
        - {id: C1, form: "tags: [distinguisher, key-recovery]", audit1: CAUGHT, audit2: not_applicable}
        - {id: C2, form: "block sequence, bare tokens", audit1: not_applicable, audit2: CAUGHT}
      evasions_constructed:
        - id: B1
          form: "tags nested one level under a mapping key, flow style"
          yaml_parses_to: "{'meta': {'tags': ['distinguisher','key-recovery']}}"
          audit1: MISSED
          audit2: MISSED
          note: >-
            Weakest of the five — the index builder wants a top-level `tags`, so
            this entry would likely be rejected elsewhere. Listed for
            completeness, not relied on.
        - id: B2
          form: "legal multi-line YAML flow sequence — `tags: [distinguisher,` newline `  key-recovery]`"
          yaml_parses_to: "{'tags': ['distinguisher', 'key-recovery']}"
          audit1: MISSED
          audit2: MISSED
          why: >-
            AUDIT-1 matches `distinguisher` on the `^tags:` line, then the
            second grep needs `key-recovery` ALSO on a line starting `tags:`.
            It is on the continuation line. AUDIT-2 needs a `- token` block
            item; the continuation is not one. This is the cleanest break: a
            top-level `tags` key with both tokens, valid YAML, invisible to both.
        - id: B3
          form: 'tags: ["distinguisher", "key-recovery"]'
          yaml_parses_to: "{'tags': ['distinguisher', 'key-recovery']}"
          audit1: MISSED
          audit2: MISSED
          why: >-
            The regex requires the delimiter `[` or `, ` to be IMMEDIATELY
            followed by the bare token. A quote character intervenes. YAML
            treats the quoted and unquoted scalars as the same value.
        - id: B4
          form: "block sequence with a trailing comment — `  - distinguisher  # claim class`"
          yaml_parses_to: "{'tags': ['distinguisher', 'key-recovery']}"
          audit1: MISSED
          audit2: MISSED
          why: >-
            AUDIT-2 anchors with `[[:space:]]*$`. A comment after the token
            breaks the anchor. AUDIT-2 is described as "deliberately over-broad"
            and here it is under-broad.
        - id: B5
          form: 'block sequence, quoted items — `  - "distinguisher"`'
          yaml_parses_to: "{'tags': ['distinguisher', 'key-recovery']}"
          audit1: MISSED
          audit2: MISSED
      observed_output_of_the_two_audits_on_the_scratch_corpus:
        audit1: "knowledge/literature/KN-LIT-c00001.md"
        audit2: "knowledge/literature/KN-LIT-c00002.md"
        interpretation: >-
          Both controls caught, all five evasions missed, 5/5. Every one of the
          seven files parses under PyYAML to a tags value containing BOTH
          claim-class tokens; I printed the parse of each to confirm the
          evasions are semantically identical to the controls and not merely
          syntactically odd.
      is_this_disclosed_by_the_producer: >-
        NO. TAG-CLAIM-CLASS.md §4 "What the audit does NOT do" lists four
        limitations: form-not-correctness, silence-means-nothing,
        tags-not-prose, scoped-to-knowledge/. AUDIT-2's own section discloses
        that AUDIT-1 is blind to block style, and claims AUDIT-2 "is what makes
        that blindness safe." B4 and B5 show it does not. Nothing in either
        document discloses that FLOW-style variants (quoting, line-wrapping)
        evade AUDIT-1 while remaining valid YAML with identical semantics.
        The tagging report goes further and calls the expected post-state
        "AUDIT-2 prints nothing, because no entry lists either token in block
        style" — which is true of the corpus and does not support the
        enforceability claim.
      the_partial_mitigation_that_exists: >-
        R-CC-5 requires flow style with one space after each comma, and R-CC-6
        requires supersession rather than in-place retagging. If every future
        entry obeys R-CC-5, B2/B3 cannot arise. But NOTHING CHECKS R-CC-5.
        There is no audit for it, and the corpus already contains 56 literature
        and 23 findings entries in block style that R-CC-5 does not reach. An
        enforcement mechanism whose correctness depends on an unenforced
        convention is a convention, not an enforcement mechanism.
      what_would_fix_it_cheaply: >-
        Stated because a finding without forward guidance is a fatigue report
        (inventor-protocol §4). Parse the frontmatter and test the tag LIST,
        rather than matching the tag LINE — roughly: for each knowledge/**/*.md
        with frontmatter, yaml.safe_load it and print the path if
        {'distinguisher','key-recovery'} ⊆ set(tags). That is immune to
        quoting, wrapping, comments, block-vs-flow and indentation, and it
        subsumes both audits. It costs one small script and it is the only form
        of this check that is actually enforcement. This is a suggestion to the
        Coordinator; I did not write it into knowledge/ and it is outside my
        scope to do so.
      status: FAIL_of_the_enforceability_claim

    - id: C-5
      what: Is the tag scheme's classification CORRECT, as opposed to consistent?
      result: >-
        NOT ESTABLISHED, AND THE PRODUCER SAYS SO. All four reclassified papers
        are titled as distinguishers ("A distinguisher for high rate McEliece
        cryptosystems"; "The syzygy distinguisher"; "Understanding the new
        distinguisher of alternant codes at degree 2"; "A note on the Goppa code
        distinguishing problem"), which makes `distinguisher` the plausible
        class. But nobody in this program has read any of the four, the
        classification rests on titles and relayed descriptions at
        `confidence: reported`, and each entry carries an explicit falsification
        condition. TAG-CLAIM-CLASS §4 states the audit enforces form, not
        correctness. I did not read the four papers either and do not certify
        the classifications.
      status: correctly_scoped_by_the_producer

    - id: C-6
      what: Null-object / decay control, per inventor-protocol §3.
      result: >-
        NOT APPLICABLE, and the reason is worth stating rather than omitting.
        This batch reports no correlation, bias, excess or statistical signal.
        Its quantitative content is a transcription of a third party's table,
        for which the correct control is source re-verification (done, S-2), not
        a random-instance null. The one place a null-object argument WOULD bite
        — SEC's Table 1 numbers as evidence about attack cost — is exactly where
        every artifact refuses to make a claim. Recorded as non-applicable with
        cause, not silently omitted.
      status: not_applicable

