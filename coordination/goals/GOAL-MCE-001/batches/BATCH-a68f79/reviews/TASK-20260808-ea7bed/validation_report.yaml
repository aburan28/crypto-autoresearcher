        is independently well known is irrelevant and is exactly the trap:
        relaying it would have attributed to NIST IR 8545 a sentence nobody in
        this program had read, which is a fabricated citation under AGENTS.md
        rule 9 regardless of whether the world agrees with it. Dropping it was
