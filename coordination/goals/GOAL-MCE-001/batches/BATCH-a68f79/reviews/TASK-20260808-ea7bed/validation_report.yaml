  # ===========================================================================
  # 9. SELF-AUDIT — the arrangement in which my own check could not fail
  # ===========================================================================
  self_audit:
    required_by: The task card, in both directions.
    findings:

    - id: SA-1
      direction: "could_not_fail_NEGATIVE (an arrangement in which I would always pass the producers)"
      the_trap: >-
        The obvious one, and I was one step from it. The correction was WRITTEN
        FROM rate_regime_extraction.md. If I had "verified" its quotation by
        comparing it to rate_regime_extraction.md, agreement would have been
        guaranteed by construction and would have carried exactly zero
        information — I would have been checking that copy-paste works. The same
        trap sits in the transcription: sec_table1.md and sec_table1.json were
        written by one task from one extraction, so checking them against each
        other tests consistency, not correctness.
      how_i_am_not_in_it: >-
        I went to the primary object in both cases. I fetched arXiv:2304.14757
        and mceliece-security-20221023.pdf myself, confirmed both against their
        recorded sha256, and extracted with poppler pdftotext — a DIFFERENT tool
        from the pdfminer.six that produced the transcription I was scoring.
        Because poppler is also one of the six configurations the SEC
        transcription used, I closed that residual overlap by RENDERING page 10
        to an image and reading it, which shares no code path with any text
        extractor. For the arXiv finding I did the same on page 32. The
        page-7/page-32 passages at S-1 were confirmed in the rendered image, so
        the load-bearing finding of this report does not depend on any text
        extractor at all.
      residual: >-
        My arXiv page-7 and page-15 quotation checks rest on poppler text plus
        the page-32 render. They are plain prose in undamaged regions and I
        consider them solid, but I did not render pages 7 and 15, and I say so.

    - id: SA-2
      direction: could_not_fail_POSITIVE (an arrangement in which I would always fail the producers)
      the_trap: >-
        "The correction does not mention everything the paper says" is a
        standard no correction can meet. If I scored completeness in general, a
        `failed` would be automatic and therefore meaningless — and it would be
        unfair to producers who disclosed more of their own limits than any
        artifact set I have read in this program.
      how_i_am_not_in_it: >-
        F-2 is bound to a specific, quotable, decision-relevant omission that
        runs in ONE direction on the axis the campaign turns on, that the
        correction's own §4 names as the campaign's failure condition, and one
        instance of which (§3.2's "does not represent a proof") WAS ALREADY IN
        THIS PROGRAM'S OWN RECORDS in a sibling file in the same directory the
        producer quoted from. I separately and explicitly certified that every
        affirmative statement the correction makes is verbatim-correct, and I
        recorded what the correction got right. F-1 is likewise not a judgement
        call: I constructed five files, printed both audits' output on them, and
        printed the YAML parse of each to show the evasions are semantically
        identical to the caught controls.
      the_other_half_of_this_trap: >-
