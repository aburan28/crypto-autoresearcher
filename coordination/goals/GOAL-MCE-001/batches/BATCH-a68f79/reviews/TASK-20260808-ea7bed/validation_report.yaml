      status: pass

  # ===========================================================================
  # 7. THE GATE QUESTION, ANSWERED PLAINLY
  # ===========================================================================
  does_any_corrected_site_still_carry_the_rate_scoped_reading:
    answer: YES — ALL THREE ORIGINALS DO, BY DESIGN, AND ONE HAS NO FORWARD POINTER AT ALL.
    detail:
      - site: coordination/goals/GOAL-MCE-001/batches/BATCH-001/BATCH-001-OPENING.md
        line: 115
        still_reads: "**The rate threshold is the whole question.** `KN-LIT-4c8135` is genuinely..."
        forward_pointer: >-
          NONE. This is the worst of the three. Its supersession lives in §5.1 of
          a report in a DIFFERENT batch directory. The file itself contains no
          note, no marker, and no reference to RQ-MCE-3f7c02. Nothing a reader
          of BATCH-001-OPENING.md can grep for will lead them to the correction.
          The correction report discloses the arrangement honestly ("Stated
          plainly so nobody mistakes the arrangement for an oversight") — but
          disclosure in the superseding document does not help a reader of the
          superseded one, which is the only reader who needs it.
      - site: ledger/questions/RQ-MCE-e65b3c.yaml
        still_reads: "Rate-scoping is load-bearing... the threshold is the practically decisive number"
        status_field: "status: active"
        forward_pointer: >-
          NONE in the record itself. RQ-MCE-3f7c02 points at it; it does not
          point back. The clause-scoped design is defensible and well argued
          (§5.2 explains that a wholesale replacement would have to carry two
          already-known-defective clauses forward), but the live record a reader
          reaches first still carries the withdrawn clause.
      - site: knowledge/literature/KN-LIT-4c8135.md
        lines: [31, 53]
        still_reads: >-
          "The attack is **rate-scoped** — it does not claim to break alternant
          or Goppa codes at arbitrary rate." / "The precise rate threshold..."
        superseded_by_field: "null"
        forward_pointer: >-
          One-way only. KN-LIT-c41d8b carries `supersedes: KN-LIT-4c8135`;
          4c8135 carries `superseded_by: null`. Corpus retrieval that filters on
          `superseded_by` — which AGENTS.md's retrieval policy says excludes
          superseded material by default — WILL STILL SURFACE THE DEFECTIVE
          ENTRY AND WILL NOT SURFACE IT AS SUPERSEDED. The producer flagged this
          explicitly as a "Known limitation, recorded not hidden".
    assessment: >-
      This is a genuine tension, not a producer failure: the task card forbade
      editing the originals, and immutability is the right default. But the
      combination — originals unedited, `superseded_by` unfilled, one site with
      no pointer at all — means the corrected reading is reachable only by a
      reader who already knows to look for it. The Coordinator flagged this as
      "the Coordinator's to settle" and it is; filling `superseded_by` on the
      five originals is a one-field change using the corpus's own designated
      mechanism (knowledge/README.md), it would let AUDIT-1 drop its most
      complex stage, and it is the single highest-value follow-up in this batch.
    and_separately: >-
      The corrected text at all three superseding sites states the boundary
      accurately as far as it goes. NONE of them re-installs a rate-scoped
      reading. The defect in the correction is the omission recorded at S-1, not
      a substituted mis-scoping on the rate axis.

