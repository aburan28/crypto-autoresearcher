  # ===========================================================================
  # 6. THE ITEMS THE COORDINATOR FOUND AND ASKED ME NOT TO TAKE ITS WORD ON
  # ===========================================================================
  coordinator_findings_independently_rechecked:

    - id: R-1
      claim: "Five identifiers collided with an unmerged concurrent branch and were re-minted."
      checked:
        - >-
          THE COLLISION IS REAL. `git ls-tree -r 774633b8a -- knowledge/literature`
          lists all five as actual files: KN-LIT-209151.md, KN-LIT-48b4eb.md,
          KN-LIT-7b78de.md, KN-LIT-9a7860.md, KN-LIT-b7f8f8.md, on
          origin/claude/mceliece-bibliography-aggregate-7ogd0d. The branch is
          working this same goal. The re-mint was necessary, not defensive.
        - >-
          THE REPLACEMENTS ARE FREE. None of 84b674, 6da230, 7d2077, 4fa25d,
          eb2b9b (nor 3c9f21, a4d70e, 6b1fc8, d82a53, c41d8b) appears on
          774633b8a. `tools/allocate_id.py --check` reports 0 occurrences across
          the 11446-file union for the id I minted for this report, confirming
          the checker works as advertised.
        - >-
          THE REMAP WAS LEGITIMATE UNDER AGENTS.md RULE 15. Rule 15 forbids
          renaming a record named in a COMPLETED ARCHIVE's binding fields. I
          searched BATCH-001's four archive receipts: none names any of the five.
          They were named only in a proposal document. So supersession was not
          required and renaming was permissible.
      but: >-
        "ZERO RESIDUAL REFERENCES TO THE FIVE COLLIDING IDS" IS FALSE AS
        STATED. `git grep` finds each of the five in
        BATCH-001/tasks/TASK-20260803-f3aece/proposed_kn_lit_entries.md — the
        reservation document itself, which is immutable and carries no forward
        pointer to the remap. A reader of that document sees KN-LIT-48b4eb as
        the identifier for the specification entry and has no mechanical route
        to KN-LIT-84b674. The five also appear in the snapshot receipt's remap
        table, which is intended and is the only place the mapping exists.
        The substantive risk — a live corpus entry holding a colliding id — IS
        eliminated. The bookkeeping claim overstates.
      status: substantively_correct_claim_overstated

    - id: R-2
      claim: "citation_verified is `read` for exactly one entry and `web` for four."
      checked: >-
        CORRECT, when scoped to the five specification entries: KN-LIT-6da230 is
        `read`; 84b674, 7d2077, 4fa25d, eb2b9b are `web`. (The four
        reclassification entries are also `web`, and KN-LIT-c41d8b uses
        `transcription_of_full_text_at_recorded_sha256`, so the corpus-wide
        count is not 1-and-4; the claim is accurate for the family it describes.)
      is_the_split_honest: >-
        YES, AND IT UNDER-CLAIMS RATHER THAN OVER-CLAIMS.
        `read` on 6da230 (SEC) is EARNED: TASK-20260808-1985f1 retrieved it three
        times in this environment at the recorded sha256 and transcribed 150
        cells — and I re-retrieved it and re-verified all 150. That entry
        additionally marks provenance PER CLAIM ([SEC-READ] / [B1-READ] /
        [B1-DRAFT]) rather than per entry, and states that 31 of 36 pages were
        not read here. That is stronger discipline than the field requires.
        `web` on the other four is if anything too conservative: those documents
        WERE fetched, hashed and read — by TASK-20260803-f3aece, corroborated by
        validator TASK-20260803-409c5e — just not in this session. Each carries
