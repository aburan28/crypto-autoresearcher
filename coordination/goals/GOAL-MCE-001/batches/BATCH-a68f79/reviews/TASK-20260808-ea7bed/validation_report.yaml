  # 8. CONTRACT-SPECIFIC CHECK BLOCKS
  # ===========================================================================
  heuristic_validation_checks:
    - status: not_applicable
      reason: >-
        No heuristic is validated, pre-registered or sampled anywhere in this
        batch. There is no prediction, no sample, no CDF, no correspondence
        substitution and no seed, because nothing was computed. Recorded as
        non-applicable with cause rather than omitted (inventor-protocol §8).
      one_thing_worth_noting: >-
        arXiv:2304.14757 IS a heuristic-conditional result (its Heuristics 18
        and 23, and §3.2's explicit "does not represent a proof"). This program
        has enumerated those heuristics in BATCH-001's heuristics_enumerated.md
        but has validated none of them, and this batch does not either. Any
        future record that leans on the Goppa exclusion is leaning on an
        unvalidated heuristic of a third party's paper, which the source itself
        flags as unproved.

  cost_model_checks:
    - id: CM-1
      what: SEC Table 1 is a concrete cost table, so the cost-model contract engages.
      unit_declared: >-
        NO — and the transcription is RIGHT to record the absence rather than
        supply one. Under my contract "a table without a declared unit is
        incomplete." That verdict lands on SEC, not on the transcription: SEC
        states no unit at any of the five loci, and the transcription quoted all
        five so the absence is checkable rather than asserted. This is the
        correct handling of an incomplete third-party cost table.
      optimistic_assumptions_flagged: >-
        YES, and quoted from the source rather than summarised: "the underlying
        estimator from [33] counts each vector operation as just 1 operation",
        "Consequently, the 140.8 actually counts more than 2^143 bit
        operations", and "The exact numbers in Table 1 should be expected to be
        superseded by larger numbers from future estimators that count bit
        operations." I verified all three verbatim on page 10.
      memory_reported_alongside_time: >-
        NOT IN THE TABLE. Table 1 is time-only. SEC gives exactly one memory
        figure in prose — the 140.8 entry is "for an attack using memory 2^86.6"
        — and the transcription deliberately did NOT transcribe the exponent,
        because the extraction flattened the superscript and its convention
        forbids a conjectured reading from travelling. That refusal is correct
        as transcription discipline AND it leaves sec_table1 as a time-only cost
        record. FORWARD CONSTRAINT: any downstream record using these numbers as
        a cost model is incomplete under the memory-alongside-time rule until
        the memory figures are obtained. The `mem` column is a cost-model
        selector (0, 1/3, 1/2), not a memory quantity.
      per_attempt_cost_times_inverse_success_probability: >-
        NOT APPLICABLE. No expected-cost bookkeeping is performed anywhere in
        this batch, and none is claimed.
      status: pass_with_a_named_forward_constraint

