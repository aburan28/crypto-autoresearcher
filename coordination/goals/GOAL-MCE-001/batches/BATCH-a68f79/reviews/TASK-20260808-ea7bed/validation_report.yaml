  # ---------------------------------------------------------------------------
  inference:
    verbatim_as_required_by_the_task_card: >-
      requested_policy: review-adversarial; resolved anthropic:claude-opus-5
      (effort=xhigh) via `orchestration.adapter resolve --role validator
