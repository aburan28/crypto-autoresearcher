      status: pass

    - id: R-3
      claim: "One proposed claim was dropped — the IR 8545 entry's SIKE assertion."
      checked: >-
        CONFIRMED ABSENT AND CORRECTLY DROPPED. The BATCH-001 draft
        (proposed_kn_lit_entries.md) contains the bullet "The report also
        records that SIKE was broken early in the fourth round and removed from
