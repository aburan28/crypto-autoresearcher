# Deviation ids are shared with transcription_report.md § Deviations and are
# numbered once across both files. DEV-2, DEV-4 and DEV-5 concern the
# transcription's form rather than source access and are recorded there only.
deviations:
  - id: DEV-1
    what: >-
      `pdftotext -bbox` was planned as one of the pass-2 extractor
      configurations and CRASHED on this document.
    detail: >-
      Both `pdftotext -bbox -f 10 -l 10 SEC_pass2.pdf -` and the same command
      writing to a file terminated with
      `libc++abi: terminating due to uncaught exception of type
      std::out_of_range: basic_string`, exit 134 (SIGABRT), producing a 179-byte
      truncated XML file. poppler 26.04.0.
    classification: infrastructure_error
    resolution: >-
      Replaced with `pdftotext -raw` (a different poppler code path from pass
      1's `-layout`). Recorded, not discarded: this is a tool defect and is not
      evidence about the source. It cost no coverage — pass 2 still ran three
      distinct extractor configurations.
  - id: DEV-3
    what: >-
      This task writes a fourth file, this one, beyond the three declared
      deliverables.
    detail: >-
      Rule 3.1.7 of the binding convention requires retrieval-side facts to live
      in `source_access_log.yaml` in the same task directory, and the deliverable
      list in the task card names only sec_table1.md, sec_table1.json and
      transcription_report.md. This file is inside the task's declared
      write_scope and is required by the convention the task card declares
      binding, so it was written. It is reported to the Coordinator as a fourth
      artifact path rather than silently added.
  - id: DEV-6
    what: >-
      The first attempt at the seq 3 retrieval FAILED, and was fixed by adding a
      CA bundle rather than by weakening TLS.
    detail: >-
      `urllib.request.urlopen` on the host Python raised
      `ssl.SSLCertVerificationError: [SSL: CERTIFICATE_VERIFY_FAILED]
      certificate verify failed: unable to get local issuer certificate`,
      because that interpreter ships no CA bundle. TLS verification was NOT
      disabled and no `ssl._create_unverified_context` was used; `certifi
      2026.07.22` was installed into the scratchpad venv and passed explicitly
      as `cafile`. Recorded because the tempting fix is the forbidden one.
    classification: infrastructure_error
    resolution: >-
      Retried with the certifi CA bundle; HTTP 200, same 332574 bytes, same
      sha256.
