unexpected_observations:
  - id: O1
    severity: material_to_other_records
    statement: >-
      csrc.nist.gov and www.nist.gov BOTH returned HTTP 200 from this harness on
      2026-08-03 (seq 10, seq 11), and nvlpubs.nist.gov served a 589 KB PDF
      (seq 14). The task card and RQ-HQC-001.provenance both record NIST domains
      as UNREACHABLE from this harness via proxy CONNECT 403.
    what_this_is: >-
      A measurement of network reachability at one moment from one harness. It
      is NOT a claim that the earlier RQ-HQC-001 record was wrong when written:
      proxy behaviour and host behaviour both change over time, and the two
      observations may simply be at different times. GOAL-HQC-001 BATCH-001's
      red team specifically corrected a Coordinator claim of the form "the
      blocker did not reproduce"; this entry deliberately does not re-make that
      error in the opposite direction.
    what_it_is_not: >-
      It says nothing about eprint.iacr.org's PDF endpoint, which this task did
      not test at all (deviation D2).
    consequence_for_this_task: >-
      Materially better than planned: the standardization question is settled
      against NIST's OWN text rather than against the designers' quotation of
      NIST.
    recommended_follow_up: >-
      A Coordinator or Validator may wish to re-probe and, if it holds, record a
      superseding provenance note on RQ-HQC-001. This task does not edit that
      record; it is outside this task's write scope and outside its mandate.

  - id: O2
    severity: incidental
    statement: >-
      comparison.html (seq 8) carries primary designer-published CryptAttackTester
      bit-operation estimates: 2^156.96 (isd1) and 2^150.59 (isd2) for problem
      size (3488,64), and 2^275.41 / 2^257.36 for (6688,128), plus 2^70.05 /
      2^69.78 for (1024,50).
    why_recorded: >-
      Not requested by this task and NOT transcribed into any deliverable here.
      Recorded because GOAL-MCE-001's second completion criterion needs a
      memory-charged ISD baseline, and a future task should know these primary
      numbers exist and where they live rather than rediscover them. They are
      logged as a pointer, not as a baseline; this task asserts nothing about
      their cost model.

  - id: O3
    severity: scoping_material
    statement: >-
      The ISO parameter-set list (seq 4) does NOT include any mceliece348864
      variant, while the cryptosystem specification's Section 7 does. The set of
      "standardized" parameter sets is therefore strictly smaller than the set of
      "selected" parameter sets.
    why_it_matters: >-
      GOAL-MCE-001 and RQ-MCE-e65b3c both speak of "the standardized parameter
      sets". Under the ISO list that phrase excludes 348864 — which is exactly
      the parameter set the security guide assigns the LOWEST category and the
      one both 2025-2026 attack-claim notes on the designers' NIST page are
      about. Any later deliverable using the phrase must say which set it means.

