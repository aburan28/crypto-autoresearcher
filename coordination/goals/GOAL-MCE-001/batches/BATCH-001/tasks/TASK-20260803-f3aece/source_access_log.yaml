route_order_deviations:
  - id: D1
    description: >-
      R4 was executed before R5/R6 and R5 was then SKIPPED as unnecessary: R4
      (the specification PDF) succeeded outright, and the designers publish no
      HTML rendering of the specification (spec.html is a landing page linking
      the PDF, not the document). R5's purpose — reducing extraction damage —
      was met instead by extracting every PDF with TWO independent extractors
      (pypdf and pdfminer.six) and requiring agreement. Recorded rather than
      silently dropped.
  - id: D2
    description: >-
      R6 (eprint.iacr.org) was NOT attempted. Its declared purpose was to serve
      as a fallback if the specification could not be obtained from the
      designers' site. R4 succeeded, so the fallback had no purpose and firing
      it would have produced a log entry with no informational content. This
      means THIS TASK CONTRIBUTES NO NEW EVIDENCE about the eprint PDF endpoint;
      the separate question of that endpoint's 403 status is untouched by this
      task and must not be treated as tested here.
  - id: D3
    description: >-
      Four additional primary documents from the same designers' host, not
      individually enumerated in the declared order, were fetched under R4's
      scope once R1/R2 revealed that the specification alone does NOT contain
      security categories or numeric key/ciphertext sizes: the round-4
      submission overview, the guide for security reviewers, the guide for
      implementors, and the plaintext-confirmation (pc) specification. The
      submission overview explicitly delegates "Expected strength for each
      parameter set" to the guide for security reviewers, so following that
      pointer is the specification's own designated route to the category
      claims, not a substitution of source.
  - id: D4
    description: >-
      R7 was attempted and SUCCEEDED, contrary to the inherited expectation.
      This opened an authoritative route (NIST IR 8545) that the declared order
      did not anticipate, and it was followed. See unexpected_observations O1.
  - id: D5
    description: >-
      R8's declared precondition was NOT met: the designers' ISO page states
      that ISO standardized Classic McEliece but does NOT name a standard
      number, so no catalogue entry could be addressed. Two exploratory
      iso.org requests were nonetheless made (root-relative catalogue path and
      the site search endpoint); both returned HTTP 403. No attempt was made to
      circumvent that block.
  - id: D6
    description: >-
      Install deviation: `pip install pypdf pdfminer.six` into the system
      interpreter left an importable pypdf whose `cryptography` dependency
      raised pyo3 PanicException. Rather than work around a broken dependency
      in the shared interpreter, a scratchpad venv was created and used for all
      extraction. No repo file was touched by either install.

