self_check_finding:
  id: S1
  where: parameter_sets.md section 2
  finding: >-
    An independent gcd/Fraction re-computation of the rate reductions confirmed
    all five rates and all five gcds, and CAUGHT ONE ERROR in this executor's
    own prose: the first draft justified 5413/6960's irreducibility with the
    false assertion "5413 = 7*773" (7*773 = 5411). 5413 is prime. The
    conclusion was correct; the stated reason was not.
  disposition: >-
    Corrected in place before delivery and disclosed in the document itself
    rather than silently repaired. No transcribed value from any source was
    affected; the error was in explanatory prose only.
  why_recorded: >-
    AGENTS.md rule 8. A reviewer is entitled to know which claims survived a
    check and which were merely produced by one.

outcome_summary:
  primary_specification_obtained: true
  parameter_sets_transcribed: 10   # the ten "selected parameter sets", spec Section 7
  parameter_triples_extractor_agreement: >-
    All ten (m, n, t) triples were extracted independently by pypdf and by
    pdfminer.six and agree character-for-character. No [EXTRACTION-DAMAGED]
    marker was needed for Section 7, which is running prose, not a table.
  size_table_extractor_agreement: >-
    The implementors'-guide Table 1 is a genuine table and was read by both
    extractors. pypdf renders it row-major and pdfminer.six renders it
    column-major; the two reconstruct to the same 10x4 array. Additionally every
    public-key and ciphertext figure was re-derived from the transcribed
    (m, n, t) via the specification's own formulas and matched exactly (10/10),
    which is an independent arithmetic check on both transcriptions at once.
  categories_obtained: true
  categories_caveat: >-
    Obtained as a prose sentence listing five numbers "respectively", not as a
    per-set table. The mapping to parameter sets is corroborated by two separate
    explicit sentences in the same document. See parameter_sets.md.
  standardization_status_settled: true
  standardization_residual_gap: >-
    The ISO standard's designation NUMBER was not obtained (iso.org 403, two
