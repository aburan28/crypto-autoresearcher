  # ===========================================================================
  # COMPLETION-GATE ITEM 1: independently reconstructed evasion case
  # ===========================================================================
  reconstructed_evasion_case:
    form_chosen: B4
    why_this_form: >-
      Picked B4 (block sequence with a trailing comment) because it exercises
      a distinct failure mode from B2/B3/B5 -- it breaks AUDIT-2's
      `[[:space:]]*$` anchor rather than AUDIT-1's delimiter-adjacency
      regex -- and because it is easy to build a version that is structurally
      distinguishable from the Executor's fixture (different tag order, an
      extra decoy tag, different frontmatter fields, different comment
      wording) while remaining a faithful instance of the specification.
    specification_source: >-
      coordination/goals/GOAL-MCE-001/batches/BATCH-a68f79/reviews/TASK-20260808-ea7bed/validation_report.yaml
      lines 644-652, control_checks C-4, entry `id: B4`: form "block sequence
      with a trailing comment -- `  - distinguisher  # claim class`"; why
      "AUDIT-2 anchors with [[:space:]]*$. A comment after the token breaks
      the anchor." Read directly from that file by me before writing the
      fixture below; not copied from tools/fixtures/claim_class_evasions/b4_block_trailing_comment.md
      (which I also read, separately, for the "does the fixture correctly
      live outside knowledge/" check -- but did not use as a template).
    my_constructed_yaml_verbatim: |
      ---
      id: KN-LIT-zz9999
      title: "Reviewer-constructed R-CC-1 evasion probe (independent reconstruction of C-4 form B4)"
      tags:
        - key-recovery  # deliberately listed first, opposite order from the executor's fixture
        - some-other-tag
        - distinguisher  # trailing inline comment breaks AUDIT-2's [[:space:]]*$ anchor
      supersedes: null
      superseded_by: null
      ---

      This file is a REVIEWER-BUILT (not executor-copied) regression probe. It was
      constructed directly from validation_report.yaml's control_checks C-4 entry
      for evasion B4: "block sequence with a trailing comment -- `  - distinguisher
      # claim class` ... AUDIT-2 anchors with [[:space:]]*$. A comment after the
      token breaks the anchor." The exact wording, tag order, extra decoy tag
      (`some-other-tag`), and surrounding frontmatter fields here are my own and do
      not appear in tools/fixtures/claim_class_evasions/b4_block_trailing_comment.md.
      It is a genuine R-CC-1 violation under the vocabulary in
      knowledge/TAG-CLAIM-CLASS.md section 1: both `distinguisher` and
      `key-recovery` are top-level list tags on this entry.
    file_location: >-
      <scratchpad>/reviewer-independent-check/probe_root/knowledge/literature/my_b4_reconstruction.md
      -- session scratchpad only, outside the repository; nothing written
      under the repo's knowledge/ or elsewhere.
    step_1_semantic_sanity_check:
      command: |
        python3 -c "
        import yaml
        text = open('.../my_b4_reconstruction.md').read()
        block = text.split('---', 2)[1]
        fm = yaml.safe_load(block)
        print('parsed frontmatter tags:', fm['tags'])
        print('is a violation under R-CC-1 (both tokens present)?', {'distinguisher','key-recovery'} <= set(fm['tags']))
        "
      output: |
        parsed frontmatter tags: ['key-recovery', 'some-other-tag', 'distinguisher']
        is a violation under R-CC-1 (both tokens present)? True
    step_2_confirm_old_audit_1_misses_it:
      command: |
        cd <probe_root>
        grep -rlE '^tags:.*(\[|,) ?distinguisher(,|\])' knowledge/ \
        | xargs -r grep -lE '^tags:.*(\[|,) ?key-recovery(,|\])' \
        | while read -r f; do
            grep -qE '^superseded_by: *KN-' "$f" && continue
            id=${f##*/}; id=${id%.md}
            grep -rhE '^supersedes:' knowledge/ \
              | grep -oE 'KN-[A-Z]+-[0-9A-Za-z]+' \
              | grep -qx "$id" || printf '%s\n' "$f"
          done
      output: "(empty)"
      result: MISSED, as expected -- confirms the evasion is genuine against AUDIT-1, verbatim from knowledge/TAG-CLAIM-CLASS.md section 2.
    step_3_confirm_old_audit_2_misses_it:
      command: |
        grep -rlE '^[[:space:]]*-[[:space:]]+(distinguisher|key-recovery)[[:space:]]*$' knowledge/
      output: "(empty)"
      result: MISSED, as expected -- the trailing `# ...` comment breaks the `$` anchor, verbatim from knowledge/TAG-CLAIM-CLASS.md section 3.
    step_4_confirm_new_audit_catches_it:
      command: |
        cd /Volumes/SSD990/wt-mce-reviewer
        python3 tools/claim_class_audit.py <probe_root>/knowledge --report-skipped
      output: >-
        <probe_root>/knowledge/literature/my_b4_reconstruction.md
      exit_code: 0
      result: CAUGHT. tools/claim_class_audit.py, run exactly as committed in the
        reviewed snapshot (no modification), reports the path of my
        independently constructed fixture. No skip was reported, so the
        catch is not an accidental parse-error side effect.
    conclusion: >-
      PASS on this completion-gate item. I built a B4-form evasion myself
      directly from the validation_report.yaml specification text, verified
      it is semantically a genuine R-CC-1 violation, confirmed both legacy
      regex audits miss it, and confirmed tools/claim_class_audit.py (the
      committed, unmodified script) catches it. This is independent of, and
      was performed before consulting the outcome of, the Executor's own
      test suite.

  # ===========================================================================
  # COMPLETION-GATE ITEM 2: byte-identity of TAG-CLAIM-CLASS.md
  # ===========================================================================
  byte_identity_check:
    method: >-
      git history + sha256, not a visual diff. First found every commit that
      ever touched the file, then compared its content across three points:
      the commit that introduced it, this batch's parent commit, and HEAD.
    commands_and_output:
      - command: "git log --oneline -- knowledge/TAG-CLAIM-CLASS.md"
        output: "c32b4b5dc research: GOAL-MCE-001 — \"distinguisher is not break\" is now machine-enforceable"
        note: >-
          Exactly ONE commit in the file's entire history. It was never
          touched again, including by this batch.
      - command: "git diff 86eeab38b -- knowledge/TAG-CLAIM-CLASS.md"
        output: "(empty)"
        exit_code: 0
        note: "86eeab38b is BATCH-73a1b7's opening commit, i.e. this batch's starting point."
      - command: "git diff HEAD -- knowledge/TAG-CLAIM-CLASS.md"
        output: "(empty)"
        exit_code: 0
      - command: "git diff --exit-code c32b4b5dc HEAD -- knowledge/TAG-CLAIM-CLASS.md"
        output: "(empty)"
        exit_code: 0
      - command: "git show c32b4b5dc:knowledge/TAG-CLAIM-CLASS.md | shasum -a 256"
        output: "94d2aeb1aa06e9ec57059fb5e9b02d3469e38c2169c12f2704d6330213492ecd"
      - command: "git show 86eeab38b:knowledge/TAG-CLAIM-CLASS.md | shasum -a 256"
        output: "94d2aeb1aa06e9ec57059fb5e9b02d3469e38c2169c12f2704d6330213492ecd"
      - command: "git show HEAD:knowledge/TAG-CLAIM-CLASS.md | shasum -a 256"
        output: "94d2aeb1aa06e9ec57059fb5e9b02d3469e38c2169c12f2704d6330213492ecd"
      - command: "shasum -a 256 knowledge/TAG-CLAIM-CLASS.md   # working tree"
        output: "94d2aeb1aa06e9ec57059fb5e9b02d3469e38c2169c12f2704d6330213492ecd"
    result: >-
      CONFIRMED BYTE-IDENTICAL across its introducing commit, this batch's
      parent commit, HEAD, and the working tree -- four independent sha256
      computations agree, plus a zero-exit-code git diff at three different
      base points. This is a re-derivation, not a re-assertion of the
      Executor's or Coordinator's own "git diff --exit-code" claim.

  # ===========================================================================
