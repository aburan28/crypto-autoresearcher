      never index them either.
    status: pass

  # ===========================================================================
  # COMPLETION-GATE ITEM 4 (part A): GATE-A break-attempt genuineness
  # ===========================================================================
  gate_a_assessment:
    what_gate_a_required: >-
      Per the original TASK-20260809-3e30b8 handoff (read from
      dispatch_queue.json): "(i) Recorded attempt to break YOUR OWN new
      script -- try genuinely adversarial cases beyond B1-B5 ... and report
      the outcome for each, whether or not it broke the script. (ii)
      Positive control ... 'it prints nothing' is not by itself a result."
      completion_gate literally requires "a recorded attempt ... with
      outcomes reported whether or not they succeeded."
    what_i_could_actually_check: >-
      tools/claim_class_audit.py's and tools/test_claim_class_audit.py's
      docstrings/comments repeatedly cite "the execution report" as the
      authoritative source of the GATE-A log (e.g. "See the execution
      report's GATE-A log (case G11)"; "GATE-A case G12 (see execution
      report)"; "GATE-A case G13"). I searched the entire reviewed commit
      and the whole repository for any file literally named
      execution_report* or containing the string "execution report" that
      is NOT tools/claim_class_audit.py or tools/test_claim_class_audit.py
      themselves, and found none for this task. TASK-20260809-3e30b8's
      write_scope in dispatch_queue.json is exactly
      [tools/claim_class_audit.py, tools/test_claim_class_audit.py,
      tools/fixtures/claim_class_evasions, knowledge/TAG-CLAIM-CLASS-v2.md]
      -- there was never a declared path for a durable execution-report
      artifact, even though the task's own return_format asked for
      "the GATE-A break-attempt log with outcomes." That log therefore
      only ever existed, at best, in the Executor's own chat response,
      which AGENTS.md's messaging section is explicit is not a durable
      deliverable ("a result that exists only in a peer's message never
      happened"). CONSEQUENCE: the citations to "the execution report" in
      the committed code are DANGLING -- they point at a document that was
      never committed and is not recoverable from this repository.
    what_IS_verifiable_and_genuine: >-
      The specific adversarial cases that got baked into
      tools/test_claim_class_audit.py (which IS committed and IS in
      write_scope) are real, non-decorative, and cover genuinely distinct
      failure modes:
      - G11 (tags as a YAML `!!set` node): I MUTATION-TESTED this claim
        rather than trusting the docstring. I copied claim_class_audit.py,
        removed `set`/`frozenset` from the isinstance check in `tag_set()`
        (simulating the "before the fix" version the docstring describes),
        and re-ran `tag_set({'tags': {'distinguisher', 'key-recovery'}})`
        against both versions. The mutated (naive) version returns `set()`
        (MISSES the violation); the real, committed version returns
        `{'distinguisher', 'key-recovery'}` (CATCHES it). This directly
        confirms the docstring's claim that "the set/frozenset branch is
        load-bearing, not decorative" and that G11 was a genuine
        find-and-fix, not padding.
      - G12 (mapping-shaped tags, `tags: {distinguisher: true, key-recovery:
        true}`): disclosed as a KNOWN, DELIBERATELY UNFIXED gap, both in
        the script's docstring and in TAG-CLAIM-CLASS-v2.md section 4. A
        padding-only GATE-A attempt would not disclose an unfixed gap in
        the artifact it is trying to look thorough for; disclosing it
        against one's own interest is evidence of genuineness, not against
        it.
      - G13 (`!!python/tuple` type tag): security-relevant -- confirms
        `yaml.safe_load` (never `yaml.load`/`full_load`) is used and that
        an attempt to smuggle an arbitrary Python object through the tags
        value is refused, not executed or silently accepted. I confirmed
        by direct import that `extract_frontmatter` on this input returns
        `(None, "YAML parse error: ...")`, i.e. rejected, not raised.
      - Additional genuinely distinct cases exercised in
        ExtractFrontmatterTests/ScanRobustnessTests/TagSetUnitTests: two
        `---`-delimited blocks in one file (only the first is frontmatter),
        a non-mapping frontmatter block (bare YAML list), unterminated
        frontmatter, invalid YAML syntax, a bare-string `tags` value (the
        classic `set("distinguisher")` character-exploding bug), non-string
        list members (int/dict/bool), and a nonexistent scan root. These
        are not near-duplicates of each other or of B1-B5; each targets a
        different code path (type confusion, YAML security, malformed
        input, scan robustness).
    genuineness_verdict: >-
      SUBSTANCE: genuinely adversarial, not trivial padding -- confirmed by
      a mutation test on the one case (G11) where genuineness was
      independently checkable, and by the disclosed-but-unfixed status of
      G12, which a padding exercise would not produce.
      TRACEABILITY: broken. The completion gate asks for "a recorded
      attempt ... with outcomes reported," and what is actually recorded is
      only the subset of cases that survived into permanent unit tests
      (all "caught"/"handled correctly" outcomes), plus dangling citations
      to a non-existent "execution report" that would have been the only
      place a case that was TRIED AND DID NOT NEED FIXING, or tried and
      abandoned, would show up. I cannot rule out that some attempted case
      is missing from this account, because the only place that would be
      recorded is gone. This is a real, in-kind gap (comparable to
      VAL-20260808-71bdb1's S-1b: a citation that does not resolve to what
      it claims to), not a fabrication -- everything the citations point at
      that I COULD check turned out to be true.
    status: genuine_but_incompletely_traceable

  # ===========================================================================
  # COMPLETION-GATE ITEM 4 (part B): does v2 correctly supersede v1?
  # ===========================================================================
  superseding_relationship_check:
    non_edit_of_v1_confirmed: see byte_identity_check above -- v1 is untouched.
    scope_of_supersession_as_declared: >-
      TAG-CLAIM-CLASS-v2.md states explicitly it "supersedes sections 2 and
      3 ONLY" (AUDIT-1, AUDIT-2) and carries section 1 (the vocabulary,
      R-CC-1 through R-CC-6) forward "unchanged," restating it in full for
      readability, and restates+extends section 4 ("what the audit does NOT
      do").
    vocabulary_diff_performed: >-
      I extracted each RULE R-CC-N block from both files by regex and diffed
      them programmatically rather than eyeballing.
    vocabulary_diff_result:
      R-CC-1: "identical content; only line-wrap whitespace differs."
      R-CC-2: "identical content; only line-wrap whitespace differs."
      R-CC-3: "identical content; only line-wrap whitespace differs (one 'below' dropped, harmless -- v2 no longer has an 'AUDIT below' to refer to)."
      R-CC-4: >-
        Core normative sentence preserved verbatim ("A tag that merely
        *contains* one of these strings is a different tag and is
        unaffected," same three example tags). v2 ADDS a paragraph
        explaining the new audit satisfies the same rule structurally (set
        membership) rather than by regex boundary logic. Addition, not
        contradiction.
      R-CC-5: >-
        Core normative sentence preserved verbatim ("Every new or
        superseding entry writes `tags` as a YAML flow list..."). v2 ADDS
        that the new audit does not depend on this rule for correctness
        (since it parses any legal serialisation) but the rule itself still
        binds for readability/other tooling. Addition, not contradiction --
        and this addition is important: it correctly does NOT claim R-CC-5
        is obsolete, which would have been the actual contradiction risk.
      R-CC-6: >-
        Core normative sentence preserved verbatim ("A wrongly-classified
        entry is never re-tagged in place..."). v2 REMOVES v1's explanation
        of how AUDIT-1's shell pipeline specifically parsed `supersedes:`
        lines (no longer applicable -- the new script does not implement a
        supersession-drop stage at all) and REPLACES it with an explicit
        statement that this is so, cross-referenced to section 4. This is
        the one rule where v2's restatement is NOT merely additive -- it
        drops operative detail because the new mechanism genuinely doesn't
        do what that detail described. This is disclosed accurately, not
        silently: v2 states in its own "Why this file exists" preamble and
        again in section 4 that the new audit "does NOT replicate AUDIT-1's
        supersession-drop stage, and this is a deliberate scope decision."
    consequence_of_dropping_supersession_awareness_independently_verified: >-
      Ran `python3 tools/claim_class_audit.py` (default root, i.e. against
      the real knowledge/ corpus) myself. Output: exactly
      knowledge/literature/KN-LIT-13a01d.md, KN-LIT-71d1a0.md,
      KN-LIT-7ee1a9.md, KN-LIT-e37d4c.md -- four lines, matching
      TAG-CLAIM-CLASS-v2.md section 4's stated consequence exactly. I then
      independently confirmed each of these four IS already retired via a
      `supersedes:` pointer from a live entry (KN-LIT-3c9f21 supersedes
      13a01d; KN-LIT-a4d70e supersedes 71d1a0; KN-LIT-6b1fc8 supersedes
      7ee1a9; KN-LIT-d82a53 supersedes e37d4c), i.e. these four "hits" are
      the same four VAL-20260808-71bdb1 control_check C-3 identified as
      real-but-retired, not a new or hidden regression. So v2's disclosure
      is accurate and its behavior claim reproduces exactly.
    contradiction_check: >-
      No sentence in v2 asserts something v1 denies, or vice versa. v2's
      "What this audit does NOT do" (section 4) is a superset of v1's four
      original bullets plus new ones specific to the new mechanism
      (mapping-shaped tags, unsafe YAML type tags, no supersession-drop
      stage, `*.md`-only scope) -- it does not delete or soften any of v1's
      original four.
    status: correctly_supersedes_no_duplication_no_contradiction

  # ===========================================================================
  # TEST SUITE INDEPENDENT RERUN -- NOT my independent evasion case
  # ===========================================================================
  test_suite_independent_rerun:
    label: >-
      THIS IS NOT THE INDEPENDENT EVASION CASE REQUIRED BY THE TASK CARD.
      It is a rerun, by me, of the Executor's OWN test file
      (tools/test_claim_class_audit.py), which the task card explicitly
      says does not by itself count as independent verification. Recorded
