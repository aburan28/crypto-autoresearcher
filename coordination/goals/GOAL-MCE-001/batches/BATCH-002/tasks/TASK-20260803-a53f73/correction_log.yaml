      SOURCES.md and sources.json as a bibliographic identifier; a prose
      `sha256_note` key would emit an entire sentence as one.
    finding: >-
      A filing-quality defect in all five BATCH-001 proposed entries. Corrected
      throughout this package by a top-level `source_artifact:` block, which is
      inert in the derived index (unknown top-level keys are ignored) and is new
      to the corpus (0 occurrences at this commit). Flagged for Coordinator
      decision as a schema extension; the non-negotiable part is only that
      sha256 must NOT sit under `identifiers`.

  - id: M-4
    what: dedup for the five specification documents
    method: >-
      14 string probes over the whole of knowledge/ plus a sha256 probe on all
      five documents; every near-miss opened and read individually.
    result: >-
