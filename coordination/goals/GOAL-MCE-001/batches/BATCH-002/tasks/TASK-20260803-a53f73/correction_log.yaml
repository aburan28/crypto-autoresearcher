    what: occurrences of "Goppa" in KN-LIT-4c8135
    method: 'grep -c -i goppa and grep -o -i goppa | wc -l'
    result: 2 lines, 2 occurrences
    finding: >-
      DEC-20260803-a5b9b1 D-4 and BATCH-002-OPENING section 2 both say the entry
      "mentions Goppa once". It mentions it TWICE. The red team's published
      cheapest control (red_team_report.md section 6a, `grep -c -i goppa` -> 1)
