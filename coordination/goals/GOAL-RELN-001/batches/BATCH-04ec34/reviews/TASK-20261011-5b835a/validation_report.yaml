      evidence:
        - experiments/EXP-RELN-dc761f/implementation/run_reln.py:1088-1101,1192-1241,1499-1533,1626-1661
        - experiments/EXP-RELN-dc761f/trial-plan-v1.json:1553-1559
    - id: J3-M2-C7-M1
      status: holds
      result: >-
        M-2 is fail-closed: RSS sampling failure, RSS excess, unavailable
        watchdog, or stopped watchdog raises a watchdog failure; the scientific
        path starts the watchdog before the first protocol draw. C-7/M-1
        checks enforce load <=14, system free >=5 GiB, repository free >=20
        GiB, one worker, nice 10, available RSS watchdog, and writable TMPDIR.
      evidence:
        - experiments/EXP-RELN-dc761f/specification.yaml:477-479
        - experiments/EXP-RELN-dc761f/implementation/run_reln.py:350-467,532-588,1477-1487,1662-1690
    - id: J3-ADMISSION-REFUSAL
      status: holds
      result: >-
        Static control-flow inspection places the explicit Coordinator decision
        check, snapshot check, immutable run-directory check, and TMPDIR/M-1
        check before the call to run_scientific. The supplied checker contains
        bounded absent-admission refusal and no-protocol-draw checks; it was not
        executed because doing so would invoke a driver refusal path outside
        the explicitly authorized source-read/inline-check scope.
      evidence:
        - experiments/EXP-RELN-dc761f/implementation/run_reln.py:1707-1786
        - experiments/EXP-RELN-dc761f/implementation/check.py:118-149
    - id: J3-NO-DRAW-READINESS
      status: holds
      result: >-
        The readiness function contains no protocol_uniform call and returns
        execution_authorized false and protocol_label_draws_performed false;
        source-level ordering places watchdog installation before the first
        target protocol_uniform call in the admitted path.
      evidence:
