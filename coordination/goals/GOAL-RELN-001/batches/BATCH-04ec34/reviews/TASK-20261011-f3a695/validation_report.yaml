  joints:
    J1:
      verdict: holds
      scope: exact F-1/F-2/P-5 input binding and 48-cell plan binding
      findings:
        - The nine F-1 fixtures from specification.yaml and the three amended F-2 fixtures match the plan, implementation constants, and all fixture fields.
        - The amendment F-2 identities pass independent deterministic checks for p and N primality, nonzero discriminant, listed point-on-curve, N times G equal to the identity, and p^k not equal to 1 modulo N for k=1..20.
        - An independent pure point-arithmetic rederivation of the first-pair P-5 rule reproduced all 12 rows exactly, including B, B2, L, factor-base and large-prime counts, scan size, R class counts, and all four exact budgets.
        - The plan contains exactly 12 fixtures, exactly 48 unique fixture/kappa cells, and every cell budget is bound to its fixture P-5 row.
        - Current files and the three allowed snapshot commit blobs have identical hashes.
    J2:
      verdict: holds
      scope: required artifact contract, validity controls, certificate replay, and all-cell gate
      findings:
        - The required artifact tuple contains manifest.yaml, command.txt, stdout.log, stderr.log, environment.json, per-fixture attempts JSONL, per-cell JSON, pooled-analysis.json, accounting-certificate.json, and all three provenance files.
        - Static source inspection confirms the scientific runner emits every required artifact and writes partial failure artifacts in its finalization path.
        - The plan and runner gate require K-POS, K-FALSE-1, K-FALSE-2, K-ID, K-AUD, and len(rows)==48 before completed_valid.
        - Static control inspection confirms 999 rewires, 199 ER references, 100 pseudo-treatments, the K-POS 1.5 multiplier and 20000 proposal cap, and the K-FALSE-2 threshold of at most four enriched pseudo-treatments.
        - A no-draw certificate replay unit check accepted a valid double-generator certificate and rejected a tampered coefficient.
        - The supplied non-protocol checker passed its K-POS/K-FALSE-1/K-FALSE-2/K-ID/K-AUD path checks without scientific execution.
    J3:
      verdict: holds
      scope: M-2, C-7/M-1 admission safeguards, absent-admission refusal, and protocol-draw exclusion
      findings:
        - AST ordering places RSSWatchdog.start before the first protocol_uniform call in run_scientific.
        - Injected initial over-limit RSS fails closed with RSSWatchdogFailure; injected RSS sampling failure also fails closed.
        - Injected C-7/M-1 readings pass, while each missing/invalid load, disk, watchdog, TMPDIR, worker, and nice field is rejected by check_machine.
        - With passing injected machine readings and no admission decision, the driver returns 4, prints exactly "REFUSED: an explicit admitted Coordinator decision is required", and creates no run directory.
        - Readiness with protocol_uniform monkeypatched records zero sampler calls and returns execution_state ready, execution_authorized false, and protocol_label_draws_performed false.
        - The current host-level admission probe itself was refused because sysctl load parsing failed and system-volume free space was below 5 GiB; this is correctly fail-closed and is not treated as a scientific result.
