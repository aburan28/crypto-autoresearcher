decomp_probability_protocol:
  schema: crypto.autoresearch.reln_decomp_probability_protocol.v1
  task_id: TASK-20260725-661
  goal_id: GOAL-RELN-001
  batch_id: BATCH-001
  research_question_ids: [RQ-RELN-001]
  open_problem_refs: [KN-OPEN-001]
  literature_refs: [KN-LIT-009, KN-LIT-025]
  technique_refs: [KN-TECH-002, KN-TECH-003]
  status: review_only_design
  terminal_verdict: PROTOCOL_COMPLETE_REVIEW_REQUIRED
  authorization: >-
    No implementation, decomposition campaign, Groebner run, enumeration
    campaign, relation campaign, rho/BSGS control run, or experiment is
    authorized by this artifact. Independent red-team PASS on this package is
    not auto-execution license: a separate Coordinator ledger authorization is
    required before any measurement task may be admitted. Present-tense
    non-authorization is hard-gated below.

  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; authorized
      fallback under AMEND-PATH-001-001. Fallback is infrastructure/policy
      metadata, not mathematical evidence. Equivalence to research-sol-max is
      not claimed.

  # ---------------------------------------------------------------------------
  # Certificate-contract pin (read-only from GOAL-ECDLP-001)
  # ---------------------------------------------------------------------------
  certificate_contract_pin:
    path: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
    schema: crypto.autoresearch.rank_failure_conservation_certificate
    version: "1.0.0-review"
    claim_tier_maximum: toy
    ecdlp_alignment:
      toy_validation_protocol_path: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/toy_validation_protocol.yaml
      toy_validation_decision: DEC-20260725-025
      rule: >-
        This RELN protocol may not authorize execution. Measurement admission
        requires (i) this protocol's independent review PASS, (ii) separate
        Coordinator ledger authorization, and (iii) GOAL-ECDLP-001 activation
        residuals closed or an explicit Coordinator amendment naming a
        substitute activation gate with equal hardness.
    obligations_inherited:
      - id: OBL-CLAIM-BOUNDARY
        requirement: >-
          maximum_tier toy; no attack improvement, ECDLP lower bound,
          crypto-scale conclusion, breakthrough, solution, universal
          impossibility, or fallback-equivalence claim.
      - id: OBL-NO-SCALARIZATION
        requirement: >-
          Resource vectors remain multi-coordinate. No cross-unit sum. No
          illicit scalar cost. Comparisons only under predeclared coordinatewise
          dominance with identical counter conventions.
      - id: OBL-FULL-COST-STAGES
        requirement: >-
          Charge setup, relation_collection, linear_algebra, descent, and
          verification as named stages; audit overhead included. Relation
          search has no hidden oracle: every probability trial that feeds
          ICEX p_solve must charge the algebraic attempt that produced the
          outcome.
      - id: OBL-DECOMPOSITION-CERTIFICATE
        requirement: >-
          Every claimed success carries an independently re-verified
          decomposition certificate (kind: decomposition) before counting as
          Y=1 for either p_exist or p_solve.
      - id: OBL-TERMINAL-VOCABULARY
        requirement: >-
          Use exhaustive rank-failure-terminal-v1 codes; timeouts/infra/
          implementation failures are costs, not negative mathematical evidence.
      - id: OBL-PROBABILITY-GATE
        requirement: >-
          Forbid ceil(r/p_L). Finite-tail / ICEX relation-supply claims require
          declared stratified fixed-IID assumptions and Clopper-Pearson p_L;
          drop finite-tail claim if IID indefensible.
      - id: OBL-VERIFIER-HASH-ACTIVATION
        requirement: >-
          independent_verifier_artifact_sha256 must be non-null at seal time
          or activation fails closed. This design leaves the hash null —
          activation blocked by construction.

  # ---------------------------------------------------------------------------
  # Claim boundary
  # ---------------------------------------------------------------------------
  claim_boundary:
    maximum_tier: toy
    field_bit_size_max: 32
    passing_claim: >-
      After authorized sealed campaigns under this protocol, a later independent
      verifier may conclude only that measured decomposition probabilities
      (p_exist and charged p_solve) versus factor-base size B on the named toy
      prime-field cells behave as recorded — suitable as a scoped ICEX
      relation-supply calibration package — without asserting that contested
      KN-LIT-009 asymptotic heuristics are established, and without claiming
      crypto-scale index-calculus advantage.
    prohibited_claims:
      - kn_lit_009_heuristic_established_or_asymptotically_validated
      - asymptotic_advantage_alpha_less_than_1_2
      - crypto_scale_relevance
      - ecdlp_attack_improvement
      - ecdlp_lower_bound
      - breakthrough_or_solution
      - universal_impossibility
      - treating_oracle_enumeration_as_free_relation_supply
      - ceil_r_over_p_L_as_budget
      - fallback_equivalence_to_research_sol_max
    exclusions:
      - no_live_keys_or_private_targets
      - timeouts_infra_failures_are_costs_not_negative_math
      - medium_or_crypto_ladder_forbidden_until_separate_tier_gate
      - kn_lit_009_complexity_exponents_remain_reported_until_reproduced

  # ---------------------------------------------------------------------------
  # Novelty / literature diff
  # ---------------------------------------------------------------------------
  protocol_class: measurement
  novelty_status: adaptation
  novelty_screen:
    corpus_checked:
      - knowledge/literature/KN-LIT-009.md
      - knowledge/literature/KN-LIT-025.md
      - knowledge/open-problems/KN-OPEN-001.md
      - knowledge/techniques/KN-TECH-002.md
      - knowledge/techniques/KN-TECH-003.md
      - ledger/questions/RQ-RELN-001.yaml
      - ledger/goals/GOAL-RELN-001.yaml
      - ledger/goals/GOAL-ICEX-001.yaml
      - ledger/evidence/EV-SEMAEV-001.yaml
      - ledger/hypotheses/H-SEMAEV-001.yaml
      - experiments/EXP-SEMAEV-001/specification.yaml
    web_literature_check: performed
    web_sources_consulted:
      - https://eprint.iacr.org/2015/310
      - https://eprint.iacr.org/2015/310.pdf
    classification: >-
      Known Semaev / Petit-Kosters-Messeng decomposition-probability and
      factor-base constructions (KN-LIT-009, KN-LIT-025, KN-TECH-003) adapted
      to a Tier-path contested-claim audit with dual metrics (p_exist vs
      charged p_solve), full relation-search cost charging, and ICEX p_L
      packaging under certificate contract 1.0.0-review. Matching the
      literature constructions is adaptation, not novelty.
    honesty_note: >-
      KN-LIT-009 §4.3 reports the random-mapping heuristic
      P(q,m,t,|V|) ≈ 1-(1-1/q)^{|V|^t/t!} ≈ |V|^t/(q·t!) when small, and
      uses it inside contested asymptotic ECDLP claims. Those complexity
      claims remain confidence: reported. This protocol audits the
      probability model at toy prime-field scope; it does not reproduce or
      endorse the binary-field FFD/asymptotic claims. KN-LIT-025 is the
      direct prime-field prior art; PKM cells require materializing the
      published construction before sealing — inventing PKM maps is forbidden.

  contested_heuristics:
    status: reported_not_established
    primary_ref: KN-LIT-009
    labeled_reference_curve:
      id: HEUR-SEMAEV-2015-4.3
      formula_exact: "1 - (1 - 1/q)^{K}"
      K_approx: "|V|^t / t!"
      small_limit_approx: "|V|^t / (q * t!)"
      symbols: {q: field_cardinality, t: decomposition_length_m, V: factor_base_x_set}
      regime_note: >-
        Semaev 2015 states the model for the Boolean/summation zero-finding
        setting; for prime-field cells of this protocol set q = p. The
        formula is a REPORTING REFERENCE ONLY until a sealed measurement
        cell upgrades it to measured-at-toy-scope for that cell.
      forbidden_uses:
        - treat_as_established_complexity_input
        - feed_ICEX_without_measured_p_L_or_explicit_reported_tag
        - extrapolate_to_crypto_scale
    secondary_ref: KN-LIT-025
    pkm_note: >-
      Petit-Kosters-Messeng (PKC 2016) supply the prime-field algebraic
      decomposition construction prior art. Their small-parameter experiments
      and hedged practicality claims are reported; this protocol diffs against
      them and does not claim a new prime-field attack.

  # ---------------------------------------------------------------------------
  # Exact claim frozen by this protocol
  # ---------------------------------------------------------------------------
  frozen_claim:
    statement: >-
      On the sealed toy prime-field ladder below, for Semaev-style (and, when
      materialized, PKM-style) constructions with decomposition length m and
      factor-base size B = |V|, the empirical decomposition probabilities
      p_exist(B) and charged p_solve(B) are measurable under matched controls
      and independent certificates, and may be compared to the reported
      HEUR-SEMAEV-2015-4.3 curve without promoting that heuristic to
      established status outside the tested cells.
    discriminates:
      - id: H-HEURISTIC-TRACKS
        meaning: >-
          For a sealed cell, |hat_p_exist - P_reported| lies inside the
          predeclared absolute tolerance band (or CI overlap rule) across the
          B ladder. Meaning: at that toy cell, the reported random-mapping
          heuristic is a usable calibration reference — still scoped, not
          asymptotic validation of KN-LIT-009 complexity claims.
      - id: H-HEURISTIC-MISSES
        meaning: >-
          Systematic signed residual of hat_p_exist vs P_reported across B
          (or vs B-scaling shape) exceeds the tolerance after controls.
          Meaning: do not feed ICEX the reported formula; feed measured
          p_L only, labeled heuristic_rejected_at_toy_scope for those cells.
      - id: H-SOLVE-GAP
        meaning: >-
          hat_p_solve is materially below hat_p_exist under the charged solver
          budget (solver incompleteness / degree / timeout). Meaning: ICEX
          relation supply must use p_solve_L, not oracle p_exist.
      - id: H-COST-HONEST
        meaning: >-
          Every ICEX-feeding trial records a full relation_collection resource
          vector; no trial counts Y=1 from an uncharged enumeration oracle.
    falsification_of_protocol_honesty:
      - counting_uncertified_decomposition_as_success
      - feeding_ICEX_with_p_exist_as_if_it_were_charged_p_solve
      - treating_KN-LIT-009_exponents_as_established
      - illicit_scalarization_of_resource_vector
      - treating_TIMEOUT_or_INFRASTRUCTURE_FAILURE_as_negative_math_evidence
      - asserting_medium_or_crypto_tier_from_toy_ladder
      - inventing_PKM_maps_without_literature_materialization
      - using_ceil_r_over_p_L

  # ---------------------------------------------------------------------------
  # Base constructions (pinned)
  # ---------------------------------------------------------------------------
  constructions:
    - id: ARM-SEMAEV-SP
      status: primary_pinned
      novelty_vs_literature: adaptation_of_KN-TECH-002_003_and_KN-LIT-009_model
      description: >-
        Prime-field short-Weierstrass Semaev summation-polynomial decomposition:
        seek x_1..x_m in factor-base set V such that S_{m+1}(x_1,...,x_m,x(R))=0,
        then lift to points and verify R = sum ε_i P_i with ε_i in {±1}.
      summation_polynomials:
        primary: S_3   # m = 2
        secondary: S_4 # m = 3
      factor_base_rule: >-
        V is a deterministic set of |V|=B distinct on-curve x-coordinates,
        built by a sealed seeded sampler (harness/semaev.py:build_factor_base
        semantics or an equal-hardness sealed replacement). Points of the
        factor base are the lifts (±y) of those x-coordinates as required by
        the decomposition certificate schema.
      solver_for_p_solve: >-
        Frozen grevlex Groebner (or sealed equal-hardness algebraic solver)
        on the ideal generated by S_{m+1} and the factor-base vanishing
        polynomials f_V(x_i), matching EXP-SEMAEV-001 / harness conventions
        unless a sealed schedule names a substitute with identical claim
        boundary.
      oracle_for_p_exist: >-
        At toy B only: exhaustive or meet-in-the-middle enumeration over V^m
        (up to sign/permutation symmetry) used solely to establish mathematical
        existence. Enumeration for p_exist is NEVER a free ICEX relation;
        ICEX uses p_solve.

    - id: ARM-PKM-PRIME
      status: secondary_materialization_required
      novelty_vs_literature: adaptation_of_KN-LIT-025
      description: >-
        Petit-Kosters-Messeng-style prime-field algebraic/rational-map
        decomposition construction as published (PKC 2016). Exact map,
        factor-base definition, and polynomial system are NOT invented here.
      materialization_gate: >-
        Before any ARM-PKM-PRIME cell may be sealed, Coordinator must freeze a
        literature-derived fixture binding: curve family constraints (e.g.
        smooth factor of p-1 if required by the published construction),
        factor-base rule, decomposition map, and polynomial system, with
        fixture_sha256 under contract digest rules. Until that binding exists,
        ARM-PKM-PRIME cells remain design pins only and cannot activate.
      comparison_role: >-
        Diff arm: measure the same (B, m, p) probability schema on the
        materialized PKM construction to separate Semaev-SP behavior from
        PKM-map behavior at toy scope.

  # ---------------------------------------------------------------------------
  # Public fixture / cell ladder (design pins; bytes not sealed here)
  # ---------------------------------------------------------------------------
  fixture_ladder:
    status: design_pin_not_executable
    model: short_weierstrass
    field_kind: prime_field
    curve_family: generic_ordinary
    encoding: uncompressed_sec1_xy_hex_width_by_field
    bit_sizes_toy_ordered: [8, 10, 12, 16]
    hard_cap_bits: 32
    decomposition_lengths_m: [2, 3]
    factor_base_size_ladder_rule: >-
      For each cell with prime p and length m, seal an explicit increasing
      integer sequence B_1 < ... < B_k with k >= 4, each B_j satisfying
      2 <= B_j <= min(floor(p/4), B_hard_cap_for_bits), and spanning at least
      a 4x ratio B_k/B_1 when p permits. Default design targets (override only
      by sealed schedule with justification):
      bits=8  -> B in {4, 6, 8, 12}
      bits=10 -> B in {6, 10, 14, 20}
      bits=12 -> B in {8, 14, 20, 28}
      bits=16 -> B in {12, 20, 32, 48} for m=2; for m=3 drop the largest B
      if per-attempt budget cannot host V^3 oracle enumeration for p_exist.
    cells_design:
      - cell_id: CELL-RELN-TOY-008-M2-B*
        field_bits: 8
        m: 2
        arm: ARM-SEMAEV-SP
        summation_polynomial: S_3
      - cell_id: CELL-RELN-TOY-010-M2-B*
        field_bits: 10
        m: 2
        arm: ARM-SEMAEV-SP
        summation_polynomial: S_3
      - cell_id: CELL-RELN-TOY-012-M2-B*
        field_bits: 12
        m: 2
        arm: ARM-SEMAEV-SP
        summation_polynomial: S_3
      - cell_id: CELL-RELN-TOY-012-M3-B*
        field_bits: 12
        m: 3
        arm: ARM-SEMAEV-SP
        summation_polynomial: S_4
        note: secondary; admit only if m=2 primary cells seal first
      - cell_id: CELL-RELN-TOY-016-M2-B*
        field_bits: 16
        m: 2
        arm: ARM-SEMAEV-SP
        summation_polynomial: S_3
      - cell_id: CELL-RELN-PKM-TOY-PLACEHOLDER
        field_bits: null
        m: null
        arm: ARM-PKM-PRIME
        status: blocked_on_literature_fixture_materialization
    fixture_materialization_rule: >-
      Before any executable campaign, Coordinator must freeze one public
      fixture JSON per (bits, curve, B-ladder) binding containing
      curve_or_group_parameters, subgroup_order, factor_base_points (or
      deterministic builder + seed + B), encodings, and fixture_sha256 under
      RFC 8785 JCS digest rules from contract 1.0.0-review. This BATCH-001
      design does not materialize fixture bytes and does not seal schedules.
    ecdlp_reference_fixture_for_schema_alignment:
      fixture_id: FIXTURE-ECDLP-TOY-RANKFAIL-001
      fixture_sha256: 4c82f5e43efce185a2ecbf2cbcc24b6da7a1bddadd1176007427be350494c4a8
      use: >-
        Schema/encoding alignment reference only. Not a substitute for RELN
        ladder fixtures.

  # ---------------------------------------------------------------------------
  # Sampling model (IID trials)
  # ---------------------------------------------------------------------------
  sampling:
    target_model: >-
      For each trial, sample (a,b) uniformly in the sealed scheme and set
      R = a*P + b*Q on the public fixture subgroup; reject and resample if R
      is the point at infinity. Targets are unconditional roots (no
      outcome-triggered retries inside the probability cohort).
    factor_base_fixed_within_stratum: true
    strata_definition: >-
      One stratum per sealed (arm, field_bits, curve_id, m, B, solver_id)
      tuple. Stratum membership is static from schedule metadata before
      execution.
    replications:
      trials_per_stratum_minimum: 64
      trials_per_stratum_target: 128
      note: >-
        N is sealed per stratum. For rare events (expected P_reported << 1/N),
        either increase N under a sealed amendment or report p_L=0 with
        explicit finite-tail gate inactive for that stratum — never impute
        successes.
    seeds:
      scheme: seed_256_hex
      rule: >-
        Exactly 64 lowercase hex characters per attempt, unique within a sealed
        schedule, echoed on every receipt. Future schedules derive attempt
        seeds as SHA-256("reln-pdecomp-v1" || stratum_id || trial_index_u32be ||
        campaign_id) truncated/encoded to 64 hex chars — listed exhaustively
        before seal; no adaptive reseeding after seal.

  # ---------------------------------------------------------------------------
  # Success criteria and metrics
  # ---------------------------------------------------------------------------
  success_criteria:
    Y_exist:
      definition: >-
        1 iff an independent decomposition certificate verifies that the
        target R equals a signed sum of exactly m factor-base points whose
        x-coordinates lie in V for that stratum; else 0.
      finder_allowed: enumeration_oracle_at_toy_B
      does_not_feed_ICEX_alone: true
    Y_solve:
      definition: >-
        1 iff the charged algebraic solver (within sealed per-attempt budget)
        emits a witness that independently verifies as a decomposition
        certificate for the same R and V; else 0.
      finder_required: charged_algebraic_solver
      feeds_ICEX: true
    invalid_measurement: >-
      Solver or oracle claims success but certificate fails independent
      recompute — terminal invalid_measurement, not a Bernoulli failure.

  metrics:
    primary:
      - metric_id: hat_p_exist
        type: rational
        definition: "x_exist / N within stratum"
        direction_of_interest: different_across_B
      - metric_id: hat_p_solve
        type: rational
        definition: "x_solve / N within stratum"
        direction_of_interest: different_across_B
      - metric_id: declared_p_lower_solve
        type: rational
        definition: >-
          One-sided Clopper-Pearson lower endpoint on p_solve at sealed
          alpha_estimation (contract probability_gate); 0 if x_solve=0.
        direction_of_interest: higher_for_relation_supply
      - metric_id: residual_vs_reported_heuristic
        type: rational
        definition: "hat_p_exist - P_reported(HEUR-SEMAEV-2015-4.3)"
        direction_of_interest: different
        label: audit_against_reported_not_established
    secondary:
      - metric_id: hat_p_exist_CI95
        type: interval
        definition: two-sided Clopper-Pearson 95% interval on p_exist
      - metric_id: solve_gap
        type: rational
        definition: "hat_p_exist - hat_p_solve"
      - metric_id: C_rel_trial
        type: resource_vector
        schema: rank-failure-resource-v1
        definition: >-
          Per-trial charged resource vector for the algebraic solve path
          (setup + relation_collection attempt + verification). Aggregates
          to stratum and campaign vectors without scalarization.
    reported_reference_only:
      - metric_id: P_reported
        definition: HEUR-SEMAEV-2015-4.3 evaluated at (q=p, t=m, |V|=B)
        confidence: reported
        may_not_be_labeled: established

  heuristic_match_rule:
    id: RULE-HEUR-TRACK
    predeclared: true
    absolute_tolerance_default: 0.05
    ci_overlap_alternative: >-
      Alternatively, declare match if P_reported lies inside the sealed
      two-sided 95% CI for p_exist. The sealed schedule must choose exactly
      one rule before observing outcomes.
    shape_secondary: >-
      Optional post-hoc (non-admission) log-log slope of hat_p_exist vs B^m
      may be reported as descriptive only; slope claims are not ICEX pins.

  # ---------------------------------------------------------------------------
  # Cost honesty (no hidden oracle)
  # ---------------------------------------------------------------------------
  cost_honesty:
    charge_relation_search_fully: true
    forbidden:
      - assume_decomposition_oracle_for_ICEX
      - omit_failed_Groebner_attempts_from_resource_vector
      - count_enumeration_only_success_as_p_solve
      - amortize_shared_factor_base_build_into_zero_without_registry
    required_stage_attribution:
      - setup
      - relation_collection
      - linear_algebra
      - descent
      - verification
    note: >-
      Sparse linear algebra and descent may be zero/undefined for pure
      probability-calibration campaigns that do not assemble a full index-
      calculus matrix; those stages must still be named and recorded as
      zero or not_applicable rather than silently omitted from the schema.

  # ---------------------------------------------------------------------------
  # Budgets / stopping / terminals
  # ---------------------------------------------------------------------------
  budgets:
    per_attempt_defaults:
      wall_clock_seconds: 120
      memory_gb: 4
      maximum_groebner_degree_cap: 32
      maximum_cpu_time_ns: "120000000000"
    per_stratum_defaults:
      wall_clock_seconds: 3600
      memory_gb: 8
      maximum_trials: 256
    exhaustion_mapping:
      wall_cap: TIMEOUT_CENSORED
      memory_or_degree_cap: RESOURCE_EXHAUSTION
      coordinator_cancel: BUDGET_CANCELLATION
      env_fail: INFRASTRUCTURE_FAILURE
      impl_fail: IMPLEMENTATION_FAILURE
    censored_trials: >-
      TIMEOUT / RESOURCE_EXHAUSTION trials contribute Y_solve=0 if no
      verified certificate was produced, and remain in the denominator N of
      the sealed cohort. They are costs, not evidence against the mathematical
      existence of a decomposition (p_exist may still be evaluated via the
      oracle path if that path completed).

  stopping_rules:
    - id: STOP-STRATA-COMPLETE
      condition: >-
        All sealed strata have terminal receipts for every schedule attempt
        (including NOT_ACTIVATED) and conservation/probability gates evaluated.
    - id: STOP-HARD-CAP
      condition: field_bits would exceed 32
      action: do_not_admit_cell
    - id: STOP-ACTIVATION-BLOCKED
      condition: >-
        independent_verifier_artifact_sha256 is null OR precommit
        verified_before_execution is false
      action: fail_closed_no_activation
    - id: STOP-PKM-UNMATERIALIZED
      condition: ARM-PKM-PRIME cell lacks literature fixture binding
      action: do_not_seal_pkm_cell
    - id: STOP-HEURISTIC-OVERCLAIM
      condition: temptation to label KN-LIT-009 exponents established
      action: reject_publication_path
    - id: STOP-ORACLE-LEAK
      condition: ICEX package uses p_exist without charged p_solve_L
      action: reject_icex_feed
    - id: STOP-NO-CEIL-RP
      condition: emission of ceil(r/p_L) as budget guarantee
      action: mark_invalid_interpretation

  terminal_vocabulary: rank-failure-terminal-v1
  probability_gate:
    forbid: ceil(r/p_L)
    model: prespecified_stratified_fixed_iid
    p_L_source_for_ICEX: declared_p_lower_solve
    require_when_finite_tail_claimed: binomial_or_negative_binomial_tail_at_declared_alpha
    default_for_calibration_campaign: >-
      Probability-calibration campaigns may set finite_tail_gate_active false
      when no rank-yield completion claim is made; they must still emit
      hat_p_solve, CIs, and declared_p_lower_solve for ICEX packaging.

  # ---------------------------------------------------------------------------
  # Controls and confounders
  # ---------------------------------------------------------------------------
  controls:
    conservation_planted:
      source: certificate_contract.planted_controls
      required_when_full_campaign_certificate_sought: true
      note: >-
        Pure probability-calibration schedules that do not claim a rank-yield
        campaign certificate may defer the nine planted conservation controls
        to a later ICEX-linked campaign, but any schedule that claims
        RELATION_VALID rank credit inherits all nine.
    measurement:
      - id: CTRL-PLANTED-DECOMPOSITION
        purpose: positive_control
        design: >-
          Plant R known to equal a signed sum of m factor-base points; require
          Y_exist=1 and Y_solve=1 (within budget) on at least one sealed
          positive-control attempt per (arm, m) family.
        fail_effect: IMPLEMENTATION_FAILURE_or_invalid_measurement
      - id: CTRL-NEGATIVE-RANDOM-TARGET
        purpose: negative_control
        design: >-
          Uniform random target; must not emit a verified certificate unless
          a true decomposition exists. False-positive certificate is fatal.
      - id: CTRL-ORACLE-SOLVE-SEPARATION
        purpose: cost_honesty
        design: >-
          For a planted cell, confirm that disabling the algebraic solver and
          using enumeration alone can raise Y_exist without raising Y_solve,
          and that the ICEX export rejects p_exist-only packages.
      - id: CTRL-B-MONOTONE-SANITY
        purpose: shape_sanity
        design: >-
          On fixed (p,m,arm), the sealed B ladder is increasing; report whether
          hat_p_exist is nondecreasing up to sampling noise (one-sided trend
          screen). A sharp decrease after controls suggests sampler/bug
          confound, not a heuristic win.
      - id: CTRL-MATCHED-RANDOM-FB
        purpose: structure_control
        design: >-
          Optional matched stratum with an independent random on-curve V' of
          the same size B (different seed). Large yield gap vs primary V
          flags factor-base structure effects (links RQ-FB-001) without
          changing this protocol's primary ICEX pin.
      - id: CTRL-ORDER-AND-FIELD
        purpose: schema_integrity
        design: >-
          Verifier checks modulus primality method, subgroup order ell,
          ell*P=O for named points; FIELD_MISMATCH otherwise.
      - id: CTRL-REPORTED-LABEL
        purpose: contested_claim_hygiene
        design: >-
          Any artifact quoting HEUR-SEMAEV-2015-4.3 or KN-LIT-009 complexity
          exponents must carry confidence: reported unless the cell's measured
          upgrade predicate passes — and even then only as
          measured_at_toy_scope for that cell.

