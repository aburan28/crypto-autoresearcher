  quantity: >-
    For fixture b16-s13 at L = ceil(q^{1/5}): the 2-large-prime summation graph
    built from the protocol-defined relation stream (seed rule SHA256 of
    'EXP-RELN-c5a377/v1|label|args', budgets as frozen). Report |V|, |E|, number
    of components, components_with_cycle, cycle_rank, giant-component fraction,
    and the resulting classification under the frozen rules. (Copied from the
    review plan.)

  headline: >-
    The protocol text available to me does NOT uniquely determine the b16-s13
    relation stream, so no single (|V|, |E|, cycle_rank) triple can be
    re-derived blind. The fixed parameters are uniquely determined and given
    below. Across all 48 enumerated readings per budget, three things hold
    everywhere: (1) the cell fails the certified-subcritical condition at both
    budgets, with giant fraction >= 0.10 at A1 and >= 0.50 at A2; (2) at A1,
    cycle_rank is 0..2, so delta_proof <= -0.61 or is undefined; (3) at A2,
    cycle_rank is 3..14 and the graph is mostly one component. Whether A2
    delta_proof exceeds 1/4 depends on two choices: which L the log uses
    (C-2's count L = 6, or ceil(q^{1/5}) = 9), and whether the graph is a
    multigraph. With L = 9 it never exceeds 1/4. With L = 6 it exceeds 1/4 in
    13/48 multigraph readings and 6/48 simple-graph readings. Agreement with
    the run should therefore be judged on the reading-invariant facts and on
    whether the run's values fall inside the ranges below. An exact match is
    only expected if the run used the same reading on every underdetermined
    point.

  determined_parameters:  # uniquely fixed by C-1..C-3 and the fixture; exact integer arithmetic
    fixture: {bits: 16, seed: 13, p: 39607, a: 28493, b: 1765, q_N: 39581, G: [0, 15550]}
    fixture_sanity: {G_on_curve: true, qG_is_O: true, q_in_hasse_interval: true, nonsingular: true,
                     q_prime: true, p_prime: true, j_is_0_or_1728: false}
    B_ceil_p_1_5: 9
    B2_ceil_p_2_5: 70
    ceil_q_1_5: 9
    L_C2_liftable_x_classes_below_B: 6
    points_with_x_lt_B2: 70
    factor_base_x_classes: 6
    large_prime_x_classes: 29
    vertex_universe_if_all_classes_plus_root: 30
    A1_ceil_q_1_2: 199
    A2_ceil_q_3_5: 574
    budget_cross_check: >-
      AMD-20260929-cc7226 states A1 = 249 and A2 = 751 for b16-s11 (q = 61979).
      My exact ceil(q^{1/2}) and ceil(q^{3/5}) reproduce both, which confirms
      that q = N (not p) in the budget rule.

  computed_values:
    reading_space: >-
      2 label prefixes x 4 seed-to-integer schemes x 2 attempt-index bases x
      3 decomposition-choice rules x 2 vertex-set rules x 2 edge rules
      = 48 readings per (budget, graph-rule) family and 192 rows per budget.
      Full per-reading values: raw_b16-s13_all_readings.json and
      summary_b16-s13.json (rows).
    ranges_over_all_readings:
      A1:
        touched_vertices_multigraph: {V: [12, 25], E: [7, 18], components: [3, 9], components_with_cycle: [0, 2],
                                      cycle_rank: [0, 2], giant_fraction: [0.231, 0.733],
                                      delta_proof_L6: '[-1.0, -0.613], undefined (cycle_rank 0) in 30/48',
                                      cell_subcritical_condition_true: 0/48}
        touched_vertices_simple: {V: [12, 24], E: [7, 16], components: [3, 8], components_with_cycle: [0, 0],
