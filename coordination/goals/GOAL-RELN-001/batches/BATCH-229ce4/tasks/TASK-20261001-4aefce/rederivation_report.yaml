                                  cell_subcritical_condition_true: 0/48}
        all_classes_plus_root_multigraph: {V: 30, E: [7, 18], components: [14, 23], components_with_cycle: [0, 2],
                                           cycle_rank: [0, 2], giant_fraction: [0.100, 0.367],
                                           cell_subcritical_condition_true: 0/48}
        all_classes_plus_root_simple: {V: 30, E: [7, 16], components: [14, 23], components_with_cycle: 0,
                                       cycle_rank: 0, giant_fraction: [0.100, 0.367],
                                       cell_subcritical_condition_true: 0/48}
      A2:
        touched_vertices_multigraph: {V: [22, 29], E: [24, 40], components: [1, 4], components_with_cycle: [1, 2],
                                      cycle_rank: [3, 14], giant_fraction: [0.556, 1.0],
                                      delta_proof_L6: [-0.387, 0.473], delta_proof_L9: [-0.500, 0.201],
                                      delta_proof_L6_gt_quarter: 13/48, delta_proof_L9_gt_quarter: 0/48,
                                      cell_subcritical_condition_true: 0/48}
        touched_vertices_simple: {V: [22, 29], E: [24, 37], components: [1, 4], components_with_cycle: [1, 2],
                                  cycle_rank: [3, 10], giant_fraction: [0.556, 1.0],
                                  delta_proof_L6: [-0.387, 0.285], delta_proof_L9: [-0.500, 0.048],
                                  delta_proof_L6_gt_quarter: 6/48, delta_proof_L9_gt_quarter: 0/48,
                                  cell_subcritical_condition_true: 0/48}
        all_classes_plus_root_multigraph: {V: 30, E: [24, 40], components: [2, 9], components_with_cycle: [1, 2],
                                           cycle_rank: [3, 14], giant_fraction: [0.500, 0.967],
                                           cell_subcritical_condition_true: 0/48}
        all_classes_plus_root_simple: {V: 30, E: [24, 37], components: [2, 9], components_with_cycle: [1, 2],
                                       cycle_rank: [3, 10], giant_fraction: [0.500, 0.967],
                                       cell_subcritical_condition_true: 0/48}
    illustrative_rows:
      note: >-
        Prefix 'EXP-RELN-c5a377/v2' (literal C-3), attempts indexed from 0,
        first decomposition in scan order, vertices = LP x-classes touched by
        an edge plus the root, multigraph with loops. This row is illustrative
        and is NOT asserted to be the protocol's value. Four seed schemes are
        shown because the protocol does not pick one. Columns:
        full, 1LP, 2LP, V, E, components, components_with_cycle, cycle_rank,
        giant_fraction, delta_proof(L=6), delta_proof(L=9).
      mod_halves:     {A1: [1, 2, 9, 16, 11, 6, 1, 1, 0.25, -1.0, -1.0],  A2: [1, 9, 25, 25, 34, 1, 1, 10, 1.0, 0.2851, 0.0480]}
      mod_divmod:     {A1: [0, 4, 10, 20, 14, 6, 0, 0, 0.30, null, null], A2: [2, 11, 25, 29, 36, 1, 1, 8, 1.0, 0.1606, -0.0536]}
      mod_ctr:        {A1: [1, 1, 6, 12, 7, 5, 0, 0, 0.25, null, null],   A2: [2, 5, 26, 25, 31, 1, 1, 7, 1.0, 0.0860, -0.1144]}
      maskreject_ctr: {A1: [1, 0, 12, 16, 12, 4, 0, 0, 0.5625, null, null], A2: [1, 7, 28, 29, 35, 2, 1, 8, 0.931, 0.1606, -0.0536]}
    relation_yield: >-
      An attempt produces a relation (full, 1-LP or 2-LP) in roughly 6-7% of
      attempts in every reading: 7-17 relations by A1 and 24-40 by A2. The
      choice of decomposition rule barely matters on this fixture. 'first'
      and 'best' gave identical counts in every reading, and 'all' added at
      most 2 edges.
    informational_er_comparison:
      note: >-
        This is not a protocol control. ER replicate seeds are unspecified
        (see U-12), so I used the non-protocol seed string
        'TASK-20261001-4aefce|informational-ER|not-a-protocol-seed' with
        32 simple G(|V|,|E|) replicates per row. For the four illustrative A2
        rows, the mean ER cycle rank is 9.1..11.4 and the mean ER
        delta_proof(L=6) is 0.230..0.357. So ER meets or exceeds the observed
        cycle rank, consistent with the AMD-20260929-988139 OQ-4 disclosure.
        Values are in summary_b16-s13.json.

  classification:
    per_fixture_frozen_verdict: >-
      UNDEFINED. The C-5 verdict rule is an aggregate over three sizes, two
      budgets, three seeds, a 95% CI and a trend. One fixture cannot be
      classified under it. What b16-s13 contributes is set out below.
    certified_subcritical_condition_at_this_cell: >-
      FAILS at both budgets under all 48 readings. Giant fraction < 0.05 is
      violated everywhere: the minimum is 0.100 at A1 and 0.500 at A2.
      cycle_rank <= 2 * components_with_cycle holds at A1 and fails at A2 in
      most readings.
    implication_for_aggregate: >-
      Certified subcritical requires the condition "at all sizes". If the
      condition is applied per cell, or the giant fraction is averaged over
      seeds at A2, or touched-vertex graphs are used at A1, then b16-s13
      alone rules out a certified-subcritical verdict. The only reading where
      b16-s13 does not settle it alone is: all-classes vertex set, A1 only,
      and seed-mean aggregation. There the A1 giant fraction of >= 0.10
      contributes >= 0.033 to the 16-bit mean.
      Supercritical-enriched requires the lower 95% CI of delta_proof to
      exceed 1/4 at both budgets. In every reading, b16-s13 A1 has
      delta_proof <= -0.61 or undefined. A 16-bit A1 interval that includes
      this cell therefore cannot clear 1/4 unless the other two seeds are
      extreme or undefined values are dropped.
      The reading-invariant implication is that the 16-bit evidence from
      b16-s13 is consistent with an overall 'inconclusive' verdict. I do not
      assert the aggregate verdict, because I computed one of nine fixtures.

  underdetermination_findings:
    - id: U-1
      severity: blocking_for_exact_rederivation
      where: AMD-20260929-988139 rulings, item OQ-1..OQ-3, OQ-5..OQ-13, OQ-15..OQ-20
      text: "Accept the literal readings implemented, exactly as recorded in implementation_report.yaml (literal_reading_implemented)."
      finding: >-
        Protocol v4 adopts by reference 18 open-question rulings whose content
        is only in implementation_report.yaml (TASK-20260929-7e6ea7). That
        file is not in my read scope, and it is plausibly under a blind_from
        path. So the frozen protocol is not self-contained: an independent
        re-deriver cannot know what was frozen on those points. U-2..U-13 are
        my guesses at what those OQs covered; I have not verified that.
    - id: U-2
      where: specification.yaml inputs.seed_rule vs AMD-20260926-a7d25d C-3; review_plan blind_rederivation.quantity
      text: >-
        "SHA256 of UTF8 EXP-RELN-c5a377/v1|label|args" vs "SHA256
        'EXP-RELN-c5a377/v2|target|<bits>|<seed>'" and "'.../attempt|<bits>|<seed>|<j>'"
      finding: >-
        The label prefix is v1 in the spec and the review plan but v2 in C-3,
        which governs as v2+. The attempt label elides its prefix with '...'.
        Both prefixes were computed. They give different streams: b16-s13
        target k = 36579 (v2, mod_halves) vs 24907 (v1, mod_halves).
    - id: U-3
      where: specification.yaml inputs.seed_rule
      text: "rejection sampling for uniform draws"
      finding: >-
        The digest-to-integer map is not given. Unspecified points: bit
        extraction (full digest mod q, which equals rejection at the largest
        multiple of q, vs top bitlen(q) bits with rejection); the re-hash
        counter format; whether k may be 0; and the range of a_j and b_j.
        I implemented four schemes: mod_halves, mod_divmod, mod_ctr and
        maskreject_ctr.
    - id: U-4
      where: AMD-20260926-a7d25d C-3
      text: "(a_j, b_j) from '.../attempt|<bits>|<seed>|<j>'"
      finding: >-
        Two integers come from one label, but the split is unspecified:
        digest halves, divmod of the digest, or sub-labels/counters. This is
        covered by the same four schemes.
    - id: U-5
      where: AMD-20260926-a7d25d C-3
      finding: >-
        The attempt index base (j from 0 or from 1) is unspecified. Both were
        computed. A2 is a "prefix-continuation" of A1, which fixes the order
        but not the base.
    - id: U-6
      where: AMD-20260926-a7d25d C-3
      text: "Decide exactly whether R_j = e1*P1 + e2*P2 ... by scanning P1 over all points with x < B2"
      finding: >-
        Unspecified: the scan order, and which decomposition is recorded when
        several exist (first found, best class full>1LP>2LP, or all distinct
        decompositions). Also unspecified: e1, e2 (taken as +-1, since both
        signs are scanned); P2 = O (excluded); and P2 = +-P1, i.e. R = 2P1
        (kept, as a loop). Impact on b16-s13 is small: 'first' == 'best', and
        'all' adds <= 2 edges.
    - id: U-7
      where: AMD-20260926-a7d25d C-2 / C-4
      text: >-
        "vertex = one x-class" ; "cycle_rank = |E| - |V| + c on the LP graph (root vertex included)"
      finding: >-
        The vertex set is unspecified: only LP x-classes incident to an edge
        (plus the root), or every liftable LP x-class in [B, B2) plus the
        root. cycle_rank does not change, because isolated vertices add 1 to
        |V| and 1 to c. But |V|, the component count and the giant fraction
        change a lot: at A1, components 3..9 vs 14..23, and giant 0.23..0.73
        vs 0.10..0.37. It is also unspecified whether the root exists when
        there are no 1-LP edges.
    - id: U-8
      where: AMD-20260926-a7d25d C-3 / C-4
      finding: >-
        Unspecified: multigraph vs simple graph, and how repeated relations
        and loops are treated. This changes |E|, cycle_rank and
        components_with_cycle (A2 cycle_rank max 14 vs 10). One indirect
        hint: the F-3 ruling (ER null infeasible) implies the observed |E|
        can exceed C(|V|,2), which is possible only for a multigraph or a
        graph with loops. That favours the multigraph reading but does not
        state it.
    - id: U-9
      severity: outcome_relevant
      where: AMD-20260926-a7d25d C-2 / C-4 vs review plan and task wording
      text: >-
        "L := number of liftable x-classes below B (recorded)" ; "delta_proof
        := log_L(cycle_rank) - 1" vs "at L = ceil(q^{1/5})"
      finding: >-
        C-2 defines L as a count (6 for b16-s13). The task and review plan
        say L = ceil(q^{1/5}) (9). C-2 also defines B from p, not q (both
        give 9 here). With L = 6, A2 delta_proof exceeds 1/4 in up to 13/48
        readings. With L = 9 it never does. Both are reported.
    - id: U-10
      where: AMD-20260926-a7d25d C-5 verdict_rule
      finding: >-
        Unspecified aggregation:
        - Whether "at all sizes" means every seed-cell, or a seed mean/median
          per size.
        - Whether the subcritical clause must hold at both budgets (the
          supercritical clause says so explicitly; the subcritical clause is
          silent).
        - The CI method for the "lower 95% CI" with n = 3 seeds (t, bootstrap,
          or Wilson).
        - How undefined delta_proof (cycle_rank = 0, which is common at A1)
          enters a CI.
        - The definition of "flat or rising trend".
    - id: U-11
      where: AMD-20260926-a7d25d C-4 / C-5
      finding: >-
        The giant-component fraction's denominator is unspecified. I used
        the largest component's vertex count over |V|, root included.
        Edge-based or root-excluded variants were not computed.
    - id: U-12
      where: AMD-20260926-a7d25d C-6
      finding: >-
        Seeds are given for rewire replicates ('.../rewire|<i>') but not for
        the 32 ER replicates. ER is G(|V|,|E|), presumably simple, which is
        consistent with F-3 infeasibility.
    - id: U-13
      where: AMD-20260926-a7d25d C-2
      finding: >-
        I read "x(P) < B" as the least non-negative residue of x in [0, p),
        with x = 0 allowed. This is the natural reading; recorded for
        completeness.

  interpretive_choices_made:
    - Implemented every alternative in U-2..U-8 and U-9. None was chosen silently, and no reading is asserted to be the protocol's.
    - The edge to the root for a 1-LP relation joins the LP x-class to a single root vertex. All factor-base classes collapse into the root, and full relations are counted but contribute no edge (C-3, "standard convention").
    - "components_with_cycle = number of components whose edge count >= vertex count (multigraph count, loops included)."
    - Fixture curve parameters taken verbatim from inputs_fixtures.json. Not regenerated from ic_leads_fixtures_v2.py, which is outside my read scope.
    - No Horton minimum cycle basis, rewire null, LP log recovery or cost accounting. These are not part of the J3 quantity.

