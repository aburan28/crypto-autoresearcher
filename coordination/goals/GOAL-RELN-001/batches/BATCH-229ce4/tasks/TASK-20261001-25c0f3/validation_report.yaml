  findings:
    - id: F-1
      severity: must-fix
      detail: >-
        Scope of the 'inconclusive' verdict. Certified-subcritical requires
        giant fraction < 0.05 at every fixture-budget. Any graph with a
        non-loop edge has giant >= 2/|V|, so the branch needs |V| > 40. All
        six 16-bit fixture-budgets have |V| <= 34, so the branch was
        unreachable there for any graph structure. The protocol has no
        "power" control for the subcritical side analogous to F-4 for the
        known positive. The verdict does not depend on this: the rule also
        fails on measured structure at 11 of 12 fixture-budgets at 20 and 24
        bits, and the supercritical rule fails on several independent
        clauses. But an evidence record must not attribute the 16-bit
        subcritical failure to graph structure. It should state that the
        subcritical branch was only testable at 20 and 24 bits. This is
        for the evidence record and the J2 owner; it is not a run-integrity
        defect.
    - id: F-2
      severity: advisory
      detail: >-
        The run manifest records the admission decision DEC-20260929-74b866 by
        id and absolute path but not by sha256, whereas protocol records, the
        v3/v4 decisions, trial plan and snapshot receipt are hash-pinned.
        Verified here: the decision file is unchanged between the run
        commit 3feb2916 and HEAD (sha256 b869c4b6...).
    - id: F-3
      severity: advisory
      detail: >-
        The review plan's attack plan says to run make_report.py read-only
        into the task directory. make_report.py writes implementation_report.yaml
        inside implementation/ (a pinned tree) and computes no verdict. The
        frozen verdict path is analysis.py, which was run with --out into this
        task directory instead. make_report.py was not executed.
    - id: F-4
      severity: advisory
      detail: >-
        The ER-clause mean excludes feasible ER replicates whose cycle rank is
        0 (delta_proof undefined): for example, only 46 of 96 are averaged in
        16-A1. This biases the ER mean upward in sparse cells. The accepted
        OQ-4 wording "(null replicates excluded)" does not say whether "null"
        means infeasible or undefined delta. No effect on this run: every A1
        ER mean is negative under either reading, and all A2 replicates have
        defined deltas.
    - id: F-5
      severity: advisory
      detail: >-
        PTM-4 DENSE: with b16-s12 at L=2, a 3-sample Student-t lower CI on
        delta_proof can fail even when every 16-bit fixture's delta is far
        above 1/4, because a small L inflates delta and its spread. Together
        with the pre-registered ER-null disclosure (OQ-4), supercritical-enriched
        is reachable only for fragmented graphs whose delta is roughly matched
        across fixtures of different L (PTM-4 FRAG). This is a power property
        of the frozen rule, relevant to J2, and does not affect this run's
        verdict.
    - id: F-6
      severity: advisory
      detail: >-
        Manifest inference block is null/unverified (AUTORESEARCH_* unset under
        the Cursor runtime), disclosed in DEC-20260929-74b866
        procedure_deviations. Manifest code.dirty is true only because the
        run directory itself was untracked at write time; implementation_dirty
        is false.
    - id: F-7
      severity: advisory
      detail: >-
        Rewire degree preservation and ER/rewire draws were not independently
        regenerated: the replicate edge lists are not stored, and regenerating
        them would evaluate frozen-namespace labels. Only the recorded
        replicate summaries were checked for shape and internal consistency.

