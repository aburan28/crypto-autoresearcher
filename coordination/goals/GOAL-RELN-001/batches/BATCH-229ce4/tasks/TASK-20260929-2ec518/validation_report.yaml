  proves_too_much_control:
    result: PASS
    method: >-
      For each size, the treatment graph was itself an ER G(n, m) graph (validator smoke namespace, 3 seeds
      x 3 sizes x 2 budgets), measured with the same lpgraph.metrics, 32 ER null replicates at identical
      |V|,|E| as in celltask.budget_block, and scored by analysis.verdict. Densities: sparse (m = 0.4n),
      near-critical (0.55n), supercritical (1.5n), dense (4n), each with L = (6,10,14) and (3,4,5).
    outcome: >-
      8/8 configurations -> inconclusive, never supercritical-enriched. Wherever the treatment lower CI
      exceeded 1/4 (supercritical and dense), the ER-null clause also fired (er_exceeds_any True), which is
      the intended blocking behaviour. A ninth 'very dense' configuration was not scored because my own
      probe chose an m above C(n,2), so the treatment ER graph was infeasible. That is a probe construction
      error, not a code defect.
  findings:
    - id: R-1
      severity: major
      must_fix_before_admission: true
      title: Driver interruption orphans the running celltask child
      detail: >-
        driver.run_cell's finally clause only calls proc.kill() when `status is None`. os.wait4(pid,
        WNOHANG) returns (0, 0) while the child is alive, so status is 0 after the first poll and the kill
        is skipped. On SIGTERM/SIGHUP/SIGINT or any exception during a cell, the driver correctly writes a
        failed_infrastructure manifest and exits 8, but the child keeps running as an orphan (reproduced
        twice). Consequences: (a) the 8 GiB RSS watchdog stops while the process keeps running, which is a
        machine-protection gap on a heavily loaded host; (b) on the scientific path the orphan has already
        passed the frozen-namespace guard and will still create cells/<fixture>.json and grow the
        attempts file in a run directory whose manifest is final, which breaks the finality of that run
        record; (c) repair_report_v4.yaml FX-1 states "child process killed on interruption", which is
        false. The unit test does not signal while a real child is running.
      remedy: >-
        Track reaping explicitly (e.g. `reaped = False`; set True only when wait4 returns pid != 0) and
        kill + wait in finally when not reaped. Consider start_new_session=True with os.killpg to cover
        grandchildren. Add a test that SIGTERMs the driver while a real slow child runs and asserts the
        child is gone and no cell JSON appears afterwards. Correct the repair report statement through a
        superseding record. New snapshot and re-check before admission.
    - id: R-2
      severity: minor
      must_fix_before_admission: false
      title: Exception before the first manifest leaves a run directory without manifest.yaml
      detail: >-
        execute() creates the run directory, the logs and command.txt, then calls environment_info()
        (three sage --version attempts with 120 s timeouts each) before RunRecord exists. An exception or
        signal there is recorded only in stderr.log and the exit code; the directory has no manifest.
        FX-1 requires the initial manifest before the first cell, which is satisfied, but an exception at
        this point is not recorded as failed_infrastructure in a manifest.
      remedy: >-
        Write a minimal running manifest before environment_info(), or write a failed_infrastructure
        stub manifest in the except branch when rec is None.
    - id: R-3
      severity: minor
      must_fix_before_admission: false
      title: The OQ-24 1.25 margin is procedural only; code enforces exact equality
      detail: >-
        driver --smoke-dry-run accepted budgets 198/573 on b16-s13, whose frozen pair is 199/574, and ran a
        smoke cell. That is a nearly exchangeable replicate of scientific cells b16-s13-A1/A2 in the smoke
        namespace, the situation F-2 describes. The coordinator ruling makes the margin a procedure rule
        for future smoke runs, but nothing enforces it.
      remedy: >-
        Enforce a same-fixture ratio of at least 1.25 (or across all fixtures) in driver --smoke-dry-run and
        smoke.check_budgets, with a test.
    - id: R-4
      severity: informational
      must_fix_before_admission: false
      title: OQ-21 literal wording versus implementation, unreachable case
      detail: >-
        The executor reading accepted in OQ-21 says "inconclusive, never certified-subcritical". The code
        returns certified-subcritical when every ER cell is undetermined, the subcritical rule fires and
        the supercritical CI fails. The combination is unreachable: a subcritical fixture needs
        cycle_rank <= 2 * components_with_cycle, so |E| <= 2|V|; ER infeasibility needs
        |E| > |V|(|V|-1)/2, so |V| < 5; but giant fraction < 0.05 needs |V| > 20. No code change is needed.
        Recording the argument in the admission decision avoids a later dispute.
      remedy: Coordinator notes the unreachability in DEC-20260929-74b866, or the code adds the extra fail-closed branch.
    - id: R-5
      severity: low
      must_fix_before_admission: false
      title: Snapshot receipt and run-manifest provenance are not authenticated
      detail: >-
        verify_snapshot accepts any readable JSON with path_sha256 that matches the tree. A synthetic,
        uncommitted receipt passed in the throwaway repo. celltask.admission_guard accepts any running
        manifest.yaml naming the admitted decision and namespace. This meets FX-5 as written but depends
        on operator discipline.
      remedy: >-
        Require the receipt to be tracked and clean at HEAD, under an archives/ directory, with kind
        'snapshot'. Optionally pin the expected receipt task id or sha256 in the admission decision.
