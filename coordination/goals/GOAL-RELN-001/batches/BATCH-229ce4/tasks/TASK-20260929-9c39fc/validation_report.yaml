    - "All processes started were verified gone, including every celltask after the SIGTERM and SIGKILL probes. No shared TMPDIR content from other sessions was touched."
    - "SIGHUP and SIGINT go through the same handler as SIGTERM (code inspection) and were not separately signalled."
