    - "python3 driver.py --run-id RUN-validator-probe --admission-decision DEC-20260929-74b866 --runs-dir $TMPDIR/val-4626a5-probe/runs -> exit 3 (C-7)"
    - "in-process driver.main with hostinfo.readings monkeypatched to passing values, runs-dir in TMPDIR -> exit 4/4/4/4/4 and 5 (smoke outside); check_decision on 74b866, 3d166b and a synthetic superseded decision"
