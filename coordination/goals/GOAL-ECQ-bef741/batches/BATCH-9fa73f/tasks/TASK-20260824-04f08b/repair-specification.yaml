    "fixed_null_controls": {
      "definition_of_nullness": "Each CTRL-NULL object is node-null at all nine nonbase Mestre nodes: the exact ordinate value is a negative rational and hence not a square in Q. The base node t=0 deliberately retains (0,+/-e). These controls must never be described as having no rational points.",
      "construction": "For ordered A=(a_0,...,a_9), let p_A(u)=product_i(u-a_i), and let g_A be the unique monic degree-five polynomial with degree(p_A-g_A^2)<=4. Put S_A(t)=g_A(t+a_0)^2-p_A(t+a_0).",
