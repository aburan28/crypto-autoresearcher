      "parameter_existence_proof": "S_delta and its derivative can share t only if S_A(t)-t*S_A'(t)=0. That polynomial has degree at most four and is nonzero because its t^4 coefficient is -3 times the nonzero leading coefficient of S_A. Hence at most four delta values are singular, so exactly one least j_A exists among the five frozen candidates.",
