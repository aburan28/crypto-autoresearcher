  blocking_defects:
    count: 5
    defects:
      - id: T29-SCHEMA-METASCHEMA
        severity: blocking
        affected_repairs:
          - R3-WITNESS-SCHEMAS
          - R6-MATRIX-BASIS-BINDING
        exact_observation: >-
          All four purported JSON Schemas fail Draft 2020-12 metaschema
          validation. Draft202012Validator.check_schema reports a SchemaError
          for symbolic_identity because "canonical_rational" is not an object
          or Boolean schema. It reports a SchemaError for raw_kummer,
          prime_ideal, and valuation because "sha256" is not an object or
          Boolean schema. Bare aliases such as items: canonical_rational and
          canonical_sha256: sha256 are not JSON Schema $ref values, and the
          external common_scalar_definitions mapping is not a $defs scope.
        required_additive_correction: >-
          Publish each witness schema as a complete Draft 2020-12 schema with
          $schema, $id, an in-schema $defs block, and only valid local $ref
          values. Validate all four exact schema documents against the Draft
          2020-12 metaschema before independent design review.
        acceptance_test: >-
          Draft202012Validator.check_schema succeeds independently on each of
          the four exact schema documents.
        falsifier: Any schema contains a bare alias or fails metaschema validation.
      - id: T29-SCHEMA-UNSATISFIABLE
        severity: blocking
        affected_repair: R3-WITNESS-SCHEMAS
        exact_observation: >-
          The symbolic schema requires line_coefficients keys m and c while
          setting additionalProperties false but defines no properties for m
          or c, making the object unsatisfiable. Several nested objects and
          array items similarly use required without complete type and
          properties definitions. The promised four complete machine-readable
          schemas are therefore absent.
        required_additive_correction: >-
          Define type, required, properties, additionalProperties, item
          schemas, cardinalities, and local references recursively for every
          object and array node. Supply one valid positive instance and
          field-deletion/type-mutation negatives per schema for later tooling.
        acceptance_test: >-
          A fully populated canonical instance validates for each schema and
          deletion or type mutation of every required field fails.
        falsifier: Any required property is undefined or no conforming instance exists.
      - id: T29-R6-SCHEMA-DISCONNECT
        severity: blocking
        affected_repairs:
          - R3-WITNESS-SCHEMAS
          - R6-MATRIX-BASIS-BINDING
        exact_observation: >-
          R6 requires the semantic descriptor fields exact_model_sha256,
          etale_algebra_defining_polynomial,
          ordered_integral_basis_sha256, prime_ideal_hnf_sha256,
          valuation_definition, and model_transport_witness_sha256. The R3
          schema at /witnesses/prime_ideals/ordered_characters does not require
          those fields. Consequently the identity-only semantic list cannot be
          schema-enforced at its own normative path.
        required_additive_correction: >-
          Make the single normative ordered-character item schema require,
          type, and validate every R6 semantic descriptor field, including
          exact hashes, definition value, provenance, and transport binding.
          R6 must reference that same schema $id and JSON pointer without a
          second divergent field list.
        acceptance_test: >-
          Deleting or mutating any R6 semantic descriptor field makes the
          normative raw-result instance fail schema validation before rank.
        falsifier: R6 names a semantic field not required by its normative R3 schema.
      - id: T29-LINE-NORMALIZATION
        severity: blocking
        affected_repairs:
          - R2-MODEL-TRANSPORT
          - R3-WITNESS-SCHEMAS
        exact_observation: >-
          The draft defines Y=2*y+a1*x+a3 and Y^2=4*f(x), but later requires
          (m*theta+c)^2 equal to the product of x(P_i)-theta without defining
          whether m,c parameterize Y or Y/2. If the line is Y=m*x+c, the exact
          identity has an additional factor 4. If the intended line is
          Y=2*(m*x+c), that normalization must be explicit in the interface and
          the symbolic witness schema. Parity is unchanged because 4 is a
          square, but the promised exact identity is ambiguous and presently
          unsupported.
        required_additive_correction: >-
          Choose exactly one frozen normalization. Prefer y_bar=Y/2 and define
          y_bar=m*x+c, so (m*theta+c)^2 equals the exact three-factor product.
          Bind that normalization, m, c, the completed-square equation, and
          both coefficient vectors in the valid symbolic-identity schema.
        acceptance_test: >-
          Independent coefficient expansion under the frozen normalization
          yields an exact zero difference with no omitted scalar factor.
        falsifier: The interface and schema permit both Y=m*x+c and Y=2*(m*x+c).
      - id: T29-OUTPUT-CAP-LABEL
        severity: blocking
        affected_repair: R4-WALL-CAP
        exact_observation: >-
          campaign_102_runs.aggregate.per_run_output_bytes is set to
          27380416512, which equals 102 times 268435456 and is therefore the
          aggregate run-output cap, not the per-run cap. The actual per-run cap
          is 268435456. The label conflicts with runner enforcement semantics.
        required_additive_correction: >-
          Rename the aggregate field to aggregate_output_bytes with value
          27380416512, while retaining per_run.output_bytes_all_files as
          268435456. Use those exact names consistently in accounting,
          terminal receipts, and the wrapper contract.
        acceptance_test: >-
          Static inspection finds exactly one per-run output cap of 268435456
          and one 102-run aggregate output cap of 27380416512, with
          102*268435456=27380416512.
        falsifier: A field named per-run carries the aggregate value or either cap is ambiguous.

