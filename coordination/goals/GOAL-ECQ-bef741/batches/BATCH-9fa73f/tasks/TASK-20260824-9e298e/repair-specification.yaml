  exact_mestre_bindings:
    construction_definition: >-
      For ordered A=(a_0,...,a_9), let p_A(u)=product_i(u-a_i). Let g_A be
      the unique monic degree-5 polynomial for which deg(p_A-g_A^2)<=4, and
      let s_A(u)=g_A(u)^2-p_A(u). The positive quartic is v^2=s_A(u).
    A1:
      ordered_A: [-20, -16, -14, -13, -7, -6, 2, 3, 14, 19]
      base_index: 0
      base_parameter_a0: -20
      exact_e: "-1089143/8"
      exact_e_nonzero: true
      immutable_minimal_model: [1, 0, 0, -10735733389588488545, 13386166243940268673745678025]
      mapped_campaign_runs:
        frontier: [MF-001, MF-002, MF-003, MF-004, MF-005, MF-006, MF-007, MF-008, MF-009, MF-010, MF-011, MF-012, MF-013, MF-014, MF-015, MF-016]
        controls: [CTRL-POS-01, CTRL-NULL-01]
    A2:
      ordered_A: [-12, 5, 6, 7, 9, 10, 11, 13, 14, 17]
      base_index: 0
      base_parameter_a0: -12
      exact_e: "-1230950"
      exact_e_nonzero: true
      immutable_minimal_model: [1, -1, 1, -97623025006346669, 342379984015184906117269]
      mapped_campaign_runs:
        frontier: [MF-017, MF-018, MF-019, MF-020, MF-021, MF-022, MF-023, MF-024, MF-025, MF-026, MF-027, MF-028, MF-029, MF-030, MF-031, MF-032]
        controls: [CTRL-POS-02, CTRL-NULL-02]
    replay_runs_use_no_A_label: true

  replacement_null_controls:
    identities:
      CTRL-NULL-01: A1
      CTRL-NULL-02: A2
    definition:
      shifted_coordinate: "t=u-a_0"
      positive_equation: "v^2=S_A(t)=a*t^4+b*t^3+c*t^2+d*t+e^2"
      delta_selector: >-
        delta_A is the smallest integer in the ordered set {1,2,3,4,5}
        for which the exact discriminant of S_A(t)+delta_A*t is nonzero.
      null_equation: "v^2=S_A_null(t)=S_A(t)+delta_A*t"
      frozen_scan_box: "0<|n|<=400, 1<=d<=12, gcd(|n|,d)=1, u=n/d"
      measurement: exact rational-square test followed by the total common u/t/m interface
    exact_proof_obligations_preserved:
      rational_base_point: >-
        At t=0, S_A_null(0)=S_A(0)=e^2. Therefore (t,v)=(0,e) is a
        rational point on the null quartic. For A1, e=-1089143/8; for A2,
        e=-1230950. Both are nonzero, so division by 2e is defined.
      quartic_shape: >-
        Adding delta_A*t changes only the linear coefficient d to d+delta_A.
        The nonzero leading coefficient a and degree four are unchanged.
      finite_nonsingular_selector: >-
        A repeated root r of S_A(t)+delta*t satisfies
        S_A(r)+delta*r=0 and S_A'(r)+delta=0, hence
        H(r)=S_A(r)-r*S_A'(r)=0. H has nonzero leading coefficient -3a
        and at most four roots. Since S_A(0)=e^2 is nonzero, r=0 is not a
        repeated root. At most four delta values are bad, so the first good
        value in 1,2,3,4,5 is total and deterministic.
      forced_signature_destroyed: >-
        For i not equal to zero, t_i=a_i-a_0 is nonzero and
        S_A_null(t_i)-g_A(a_i)^2=delta_A*t_i is nonzero. A different chance
        square is retained and never suppressed.
      identical_mapper: >-
        Positive and null evaluation call the same total interface below.
        The only mode-dependent data is d_effective=d for positive and
        d_effective=d+delta_A for null. No branch is permitted to inspect mode.

  R1_total_utm_interface:
    repair_id: R1-TOTAL-UTM
    status: specified_for_independent_review
    exact_types:
      canonical_rational: "{numerator: integer, denominator: positive_integer, gcd_abs_numerator_denominator: 1}"
      finite_quartic_point: "{kind: finite, t: canonical_rational, v: canonical_rational}"
      quartic_infinity_point: "{kind: infinity, leading_value: canonical_rational s, invariant: s^2=a}"
      finite_discriminant_point: "{kind: finite, m: canonical_rational, w: canonical_rational}"
      discriminant_infinity_point: "{kind: infinity}"
      multiplicity: positive_integer
      branch_tag:
        - generic_quadratic_root
        - double_root
        - linear_finite_root
        - base_contact
        - base_conjugate
        - quartic_infinity
        - infinity_multiplicity_two
        - no_finite_root
    common_input:
      coefficients: "a,b,c,d_effective,e in Q with a!=0 and e!=0"
      equation: "C: v^2=a*t^4+b*t^3+c*t^2+d_effective*t+e^2"
      nonsingularity: exact discriminant_nonzero
      source_parameter: "u in Q in canonical form; t=u-a_0"
      mode: "positive_or_additive_null_provenance_only"
    derived_values:
      r: "d_effective/(2*e)"
      q_m: "q_m(t)=e+r*t+m*t^2"
      A_m: "m^2-a"
      B_m: "m*d_effective/e-b"
      C_m: "d_effective^2/(4*e^2)+2*e*m-c"
      Delta_m: "B_m^2-4*A_m*C_m"
      exact_factorization: "q_m(t)^2-S(t)=t^2*(A_m*t^2+B_m*t+C_m)"
      discriminant_curve: "E_Delta: w^2=Delta_m, with its unique projective cubic point O_Delta"
    scan_selector:
      u_order: >-
        Preserve the frozen canonical order of reduced n/d in the scan box.
        For each u compute t and S(t) exactly once.
      square_rule: >-
        If S(t) is not a rational square, emit one no_quartic_point observation.
        If S(t)=rho^2, choose the canonical rho>=0; evaluate v=rho first and,
        only if rho is nonzero, v=-rho second. These are observations inside
        the same run identity, never retries or additional attempts.
      common_mode_rule: >-
        The selector, rational normalization, sign order, branch order,
        recovery checks, and output schema are byte-for-byte common to positive
        and null modes. Only d_effective and provenance mode differ.
    quartic_to_discriminant_forward:
      finite_t_nonzero:
        precondition: "t!=0 and v^2=S(t)"
        formulas:
          m: "(v-e-r*t)/t^2"
          w: "2*(m^2-a)*t + (m*d_effective/e-b)"
        invariants:
          - "q_m(t)=v"
          - "w^2=Delta_m"
          - "A_m*t^2+B_m*t+C_m=0"
        output_branch: generic_quadratic_root
      positive_base_contact:
        precondition: "t=0 and v=e"
        formulas:
          m_0: "(c-r^2)/(2*e)"
          w_0: "B_(m_0)"
        invariants:
          - "C_(m_0)=0"
          - "w_0^2=Delta_(m_0)"
        output_branch: base_contact
        note: This is the exact removable value of the finite formula and is emitted once.
      base_conjugate:
        precondition: "t=0 and v=-e"
        output: O_Delta
        output_branch: base_conjugate
      quartic_infinity:
        precondition: "I_s=[T:Z:V]=[1:0:s] with s^2=a"
        formulas:
          m: s
          w: "-B_s"
        invariants:
          - "A_s=0"
          - "w^2=Delta_s=B_s^2"
        output_branch: quartic_infinity
      invalid_finite_base:
        predicate: "t=0 and v not in {e,-e}"
        failure: invalid_input
    discriminant_to_quartic_inverse:
      projective_infinity:
        precondition: O_Delta
        output: "{kind: finite, t: 0, v: -e}"
        branch: base_conjugate
      generic_A_nonzero:
        precondition: "finite (m,w), w^2=Delta_m, A_m!=0"
        formulas:
          t: "(-B_m+w)/(2*A_m)"
          v: "q_m(t)"
        branch_rules:
          - "If Delta_m!=0 and t!=0, tag generic_quadratic_root with multiplicity 1."
          - "If Delta_m=0, tag double_root with multiplicity 2 and emit only once."
          - "If t=0, require C_m=0 and v=e, tag base_contact, and emit only once."
        recovery: forward output must reproduce the same canonical m,w exactly
      linear_A_zero_B_nonzero:
        precondition: "A_m=0 and B_m!=0"
        finite_sign:
          predicate: "w=B_m"
          t: "-C_m/B_m"
          v: "q_m(t)"
          branch: linear_finite_root
          base_factor_rule: "If C_m=0 then t=0 and the branch is retagged base_contact."
        infinity_sign:
          predicate: "w=-B_m"
          output: "{kind: infinity, leading_value: m}"
          branch: quartic_infinity
        exclusivity: "Because B_m!=0, w=B_m and w=-B_m are distinct."
      further_degeneration_A_zero_B_zero:
        precondition: "A_m=0 and B_m=0"
        valid_C_nonzero:
          invariant: "Delta_m=0 and w=0"
          finite_roots: 0
          output: "{kind: infinity, leading_value: m}"
          multiplicity: 2
          branch: infinity_multiplicity_two
        invalid_C_zero:
          predicate: "C_m=0"
          implication: "q_m^2=S identically, contradicting exact quartic nonsingularity"
          failure: invalid_input
      base_factor_accounting:
        rule: >-
          The t^2 factor is always the registered osculation at (0,e). A
          residual t=0 root when C_m=0 raises its intersection multiplicity
          but never creates a second output point. If additionally B_m=0,
          the residual base root is double. Multiplicity is recorded; outputs
          are deduplicated by exact projective coordinates.
      no_other_branch: >-
        A_m is zero or nonzero. If zero, B_m is zero or nonzero. If both are
        zero, C_m is zero or nonzero. Together with projective infinity and
        the exact w sign, these predicates are exhaustive and mutually exclusive.
    recovery_and_failure:
      mandatory_round_trips:
        - "Every accepted finite quartic point maps forward then inverse to identical canonical (t,v)."
        - "Every accepted finite E_Delta point maps inverse then forward to identical canonical (m,w)."
        - "O_Delta and the base-conjugate point round-trip exactly."
        - "Every rational quartic infinity I_s round-trips through (m,w)=(s,-B_s)."
      failures:
        invalid_input:
          - noncanonical rational
          - a=0 or e=0
          - singular quartic
          - point not exactly on its source curve
          - A=B=C=0
        implementation_error:
          - branch predicate not exhaustive or not unique
          - exact round-trip mismatch
          - positive and null enter different function or schema
        mathematical_invalid:
          - requested rational square or curve-point predicate is exactly false
      no_numeric_roots: true
      no_outcome_selected_base: true
    acceptance_tests_for_future_tooling:
      - generic A nonzero and Delta nonzero for both w signs
      - A nonzero and Delta zero double root
      - A nonzero with C zero base factor
      - A zero B nonzero finite and infinity signs
      - A zero B zero C nonzero infinity multiplicity two
      - A zero B zero C zero exact invalid-input rejection
      - t zero points v=e and v=-e
      - rational quartic infinity
      - nonsquare u observation
      - identical positive/null function-entry and branch trace

  R2_exact_model_transport:
    repair_id: R2-MODEL-TRANSPORT
    status: specified_for_independent_review
    source_model: "E: y^2+a1*x*y+a3*y=x^3+a2*x^2+a4*x+a6 over Q"
    target_model: "E': y'^2+a1'*x'*y'+a3'*y'=x'^3+a2'*x'^2+a4'*x'+a6'"
    admissible_tuple:
      notation: "tau=(u,r,s,tau_y)"
      domain: "u in Q nonzero; r,s,tau_y in Q, all canonical"
      target_to_source_coordinates:
        x: "u^2*x'+r"
        y: "u^3*y'+u^2*s*x'+tau_y"
      source_to_target_coordinates:
        x_prime: "(x-r)/u^2"
        y_prime: "(y-s*(x-r)-tau_y)/u^3"
      point_at_infinity: "O maps to O in both directions"
    coefficient_transport:
      equations:
        - "u*a1'=a1+2*s"
        - "u^2*a2'=a2-s*a1+3*r-s^2"
        - "u^3*a3'=a3+r*a1+2*tau_y"
        - "u^4*a4'=a4-s*a3+2*r*a2-(tau_y+r*s)*a1+3*r^2-2*s*tau_y"
        - "u^6*a6'=a6+r*a4+r^2*a2+r^3-tau_y*a3-r*tau_y*a1-tau_y^2"
      verifier_rule: recompute all five target coefficients and both coordinate substitutions exactly
    inverse_and_composition:
      inverse_tuple: "(1/u,-r/u^2,-s/u,(r*s-tau_y)/u^3)"
      composition: >-
        For tau1=(u1,r1,s1,t1) from E1 to E0 and
        tau2=(u2,r2,s2,t2) from E2 to E1, tau1 composed with tau2 is
        (u1*u2, r1+u1^2*r2, s1+u1*s2,
        t1+u1^2*s1*r2+u1^3*t2).
      obligations:
        - exact identity tuple is (1,0,0,0)
        - composing with the stated inverse gives identity on coefficients and points
        - three-model composition is associative by exact coordinate substitution
    theta_and_etale_algebra:
      source_completed_square: "Y=2*y+a1*x+a3"
      target_completed_square: "Y'=2*y'+a1'*x'+a3'"
      completed_square_transport: "Y=u^3*Y'"
      x_root_transport: "theta=u^2*theta'+r"
      forward_algebra_isomorphism: "phi:A'=Q[theta']/f'(theta') -> A=Q[theta]/f(theta), phi(theta')=(theta-r)/u^2"
      inverse_algebra_isomorphism: "theta maps to u^2*theta'+r"
      polynomial_obligation: "phi(f'(theta'))=0 and transformed completed-square cubics agree exactly"
    canonical_point_and_kummer_transport:
      source_x: "x=N/D with gcd(N,D)=1 and D>0"
      target_x: "x'=N'/D' recomputed canonically from (x-r)/u^2"
      source_alpha: "alpha=D*(N-D*theta)"
      target_alpha: "alpha'=D'*(N'-D'*theta')"
      exact_square_relation: "alpha/phi(alpha')=(D*u/D')^2"
      squareclass_invariance: "[alpha]=[phi(alpha')] in A*/A*2"
      denominator_rule: >-
        N',D' are reduced from the transported coordinate; they are never
        obtained by copying source denominator fields. The exact square ratio
        and its canonical rational square root D*u/D' are emitted.
    character_and_witness_transport:
      prime_ideal: >-
        Each target maximal-order prime ideal p' is transported by phi to the
        source ideal p. Publish the rational basis matrix of phi, its inverse,
        source and target integral bases, and source and target HNF ideals.
      valuation: "v_p(alpha)-v_p'(alpha')=2*v_p(D*u/D') exactly"
      parity: "v_p(alpha) mod 2 = v_p'(alpha') mod 2"
      character_order: >-
        Character IDs and column order are invariant. Every source character
        descriptor names exactly one transported target descriptor and both
        prime-ideal witness hashes.
      symbolic_identity: transform every coefficient and variable through phi and require coefficientwise equality
      raw_kummer: publish source alpha, target alpha, phi(alpha'), and the exact square-ratio witness
      exceptional_cases:
        - O uses alpha=1 and remains O
        - inverse points retain the same x and alpha squareclass
        - rational two-torsion remains routed candidate_route_inapplicable on the main branch
        - zero or malformed denominators are invalid_input before transport
        - noninvertible u is invalid_input
    invariance_gate:
      - source and target points are exactly on their models
      - forward then inverse returns identical canonical coordinates
      - coefficient tuple, theta algebra, alpha square relation, ideals, valuations, and character bits all verify
      - composition witness equals direct transport witness
      - any failed transport predicate blocks matrix construction
    falsifier: >-
      Any model or point is transported one-way only, N/D is copied instead of
      recanonicalized, alpha lacks the exact square relation, an ideal lacks an
      isomorphism witness, parity changes, or a character column survives a
      failed transport check.

