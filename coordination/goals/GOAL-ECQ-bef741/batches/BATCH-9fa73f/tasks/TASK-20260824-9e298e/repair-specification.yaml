  R6_semantic_matrix_basis_binding:
    repair_id: R6-MATRIX-BASIS-BINDING
    status: specified_for_independent_review
    current_allowed_mode: identical_character_list_identity_only
    reason: >-
      No retrieved or internal declared input supplies a separately published
      verified character basis for a nonidentity column change. This task ran
      no source or network search. Therefore nonidentity B is prohibited.
    ordered_character_descriptor_schema:
      path_template: "{campaign_root}/{run_id}/raw-result.json"
      json_pointer: /witnesses/prime_ideals/ordered_characters
      required_semantic_fields:
        - column_index
        - character_id
        - exact_model_sha256
        - etale_algebra_defining_polynomial
        - ordered_integral_basis_sha256
        - prime_ideal_hnf_sha256
        - valuation_definition
        - model_transport_witness_sha256
        - provenance_path
        - provenance_sha256
      valuation_definition_exact_value: "P maps to v_p(D*(N-D*theta)) mod 2"
      canonical_list_hash: sha256_RFC8785_of_complete_ordered_descriptor_list
    identity_gate:
      producer_descriptor_list_hash: required
      rederived_descriptor_list_hash: required
      equality_requirement: byte_for_byte_canonical_descriptor_list_equality
      matrix_dimensions: "both 31 by m for identical frozen m, 31<=m<=256"
      ordered_rows: identical ordered selected point IDs and canonical point bytes
      B: I_m
      B_inverse: I_m
      required_matrix_equation: M_rederived=M_producer
      required_checks:
        - B*B_inverse=I_m
        - B_inverse*B=I_m
        - every corresponding column has identical semantic descriptor
        - every corresponding bit is independently recomputed
        - both matrices independently have exact rank 31
    nonidentity_rule_for_this_specification:
      permitted: false
      disposition: invalid_certificate_before_rank
      forbidden_shortcut: existence_of_some_GL_m_matrix
      future_amendment_minimum: >-
        A later additive independently reviewed amendment may permit
        nonidentity B only if it binds each output column j to a coefficient
        vector over an explicitly published ordered character basis; publishes
        basis order, exact character functions, provenance paths and hashes,
        coefficient matrix and inverse, schema and immutable paths; verifies
        each pointwise combination before rank; and preserves all transport
        witnesses. Rank equality alone can never satisfy that amendment.
    model_change_control: >-
      Transport the same curve and points through a nontrivial exact admissible
      R2 tuple and require the transported descriptor list to normalize back to
      the identical semantic list and therefore B=I_m.
    falsifier: >-
      Any nonidentity B is accepted, descriptor hashes omit semantic fields,
      columns are matched by position alone, row order differs, or rank
      agreement substitutes for bitwise equality.

  R5_total_terminal_precedence:
    repair_id: R5-TERMINAL-PRECEDENCE
    status: specified_for_independent_review
    terminal_labels:
      - invalid_input
      - implementation_error
      - uncaught_exception
      - external_incident
      - malformed_output
      - timeout
      - resource_exhaustion
      - infrastructure_failure
      - mathematical_valid
      - mathematical_invalid
    evidence_record:
      required_fields:
        - run_id
        - admitted
        - arithmetic_started
        - wrapper_first_cause
        - process_exit_kind
        - structured_preflight_verdict
        - output_schema_verdict
        - exact_mathematical_verdict
        - external_incident_attestation
        - monotonic_event_sequence
      wrapper_first_cause_values: [none, timeout, cpu, address_space, output_bytes, storage, worker_limit]
      process_exit_kind_values: [not_started, normal_zero, normal_nonzero, uncaught_exception, signal]
      exact_mathematical_verdict_values: [not_reached, valid, invalid]
      event_rule: >-
        Events carry strictly increasing wrapper sequence numbers. Duplicate or
        decreasing sequence numbers make the evidence record malformed. The
        wrapper atomically freezes the first registered limit cause.
    classifier_semantics: first_matching_predicate_in_the_normative_order_below
    normative_order:
      - priority: 1
        label: external_incident
        predicate: >-
          A cryptographically bound external incident attestation names the
          host or scheduler and run window, incident onset precedes admission,
          admitted=false, and arithmetic_started=false.
        excludes: [infrastructure_failure, uncaught_exception, implementation_error]
      - priority: 2
        label: invalid_input
        predicate: >-
          No priority-1 predicate; structured preflight deterministically
          rejects an immutable hash, schema, parameter, model, nonsingularity,
          identity, environment, or source binding before arithmetic_started.
        tie_break: structured rejection outranks any later generic nonzero exit
      - priority: 3
        label: timeout
        predicate: >-
          No earlier predicate; wrapper_first_cause=timeout. The wrapper cause
          is authoritative even if termination also produces a signal.
        tie_break: timeout precedes every resource cause if a corrupt record presents both
      - priority: 4
        label: resource_exhaustion
        predicate: >-
          No earlier predicate; wrapper_first_cause is cpu, address_space,
          output_bytes, storage, or worker_limit.
        tie_break: choose the first strictly sequenced resource event; equal sequence is malformed_output
      - priority: 5
        label: infrastructure_failure
        predicate: >-
          No earlier predicate; admitted=true and arithmetic_started is either
          true or launch was in progress; an authenticated external incident
          began after admission and exact wrapper evidence identifies it as the
          causal first terminal event.
        excludes: [external_incident]
      - priority: 6
        label: uncaught_exception
        predicate: >-
          No earlier predicate; process_exit_kind=uncaught_exception or an
          unregistered fatal signal has an exact runtime exception witness.
        tie_break: authenticated registered limits and infrastructure causes at earlier priorities win
      - priority: 7
        label: malformed_output
        predicate: >-
          No earlier predicate; event sequence is malformed, a required one of
          six files is absent, terminal receipt hashes disagree, JSON/YAML does
          not parse, an R3 schema fails, or required output fields are missing.
        tie_break: output integrity failure precedes generic implementation_error
      - priority: 8
        label: implementation_error
        predicate: >-
          No earlier predicate; any unexplained nonzero exit, failed exact
          implementation invariant, branch nonexhaustiveness, round-trip
          mismatch, or launched noncompletion remains. This is the operational
          fallback and never enters scientific metrics.
      - priority: 9
        label: mathematical_invalid
        predicate: >-
          No earlier predicate; process exited normally, all six files and all
          schemas/invariants pass, exact_mathematical_verdict=invalid.
        note: An exact no-hit or rejected candidate is a valid observation classified mathematical_invalid, not an operational failure.
      - priority: 10
        label: mathematical_valid
        predicate: >-
          No earlier predicate; process exited normally, all six files,
          schemas, transports, controls, and exact invariants pass, and
          exact_mathematical_verdict=valid.
    totality_and_exclusivity:
      proof_obligation: >-
        First-match semantics makes labels disjoint. Every nonadmitted run has
        a preadmission external incident or a structured aggregate-limit
        timeout/resource receipt; every admitted noncompletion reaches one of
        priorities 2 through 8; every well-formed exact completion has the
        Boolean mathematical verdict and reaches priority 9 or 10.
      aggregate_nonadmission: >-
        When the frozen batch wall cap is reached, remaining identities receive
        timeout with a structured aggregate_not_admitted subtype and no
        arithmetic. They are not retries.
      metrics:
        operational_labels:
          - invalid_input
          - implementation_error
          - uncaught_exception
          - external_incident
          - malformed_output
          - timeout
          - resource_exhaustion
          - infrastructure_failure
        scientific_labels: [mathematical_valid, mathematical_invalid]
      retry_eligible_labels: []
    acceptance_tests_for_future_tooling:
      - every single predicate fixture
      - external incident before versus after admission
      - invalid input plus generic nonzero exit
      - timeout plus fatal signal
      - resource cause plus external incident
      - malformed output plus implementation invariant
      - duplicate event sequence
      - normal exact valid and invalid completions
      - exhaustive generated Boolean predicate table maps to exactly one label

