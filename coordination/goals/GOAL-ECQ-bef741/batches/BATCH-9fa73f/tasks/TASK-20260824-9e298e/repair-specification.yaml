  exact_character_and_denominator_verifier:
    applicability_gate:
      curve: exact nonsingular generalized Weierstrass model over Q
      points: ordered exact rational points with canonical denominators
      two_torsion: >-
        Exact factorization of the transformed cubic must prove no rational
        root. Otherwise return candidate_route_inapplicable before rank.
    model_interface:
      definitions:
        b2: "a1^2+4*a2"
        b4: "2*a4+a1*a3"
        b6: "a3^2+4*a6"
        completed_square_coordinate: "Y=2*y+a1*x+a3"
        monic_cubic: "f(x)=x^3+(b2/4)*x^2+(b4/2)*x+b6/4"
        etale_algebra: "A=Q[theta]/(f(theta)) with ordered basis (1,theta,theta^2)"
      checks:
        - recompute b2 b4 b6 and verify Y^2=4*f(x) exactly
        - verify f separable and irreducible over Q on the main branch
        - require the complete R2 transport gate for every nonidentity model change
    canonical_denominator_rule: >-
      Write x=N/D uniquely with gcd(N,D)=1 and D>0. Define
      alpha_P=D*(N-D*theta). Since alpha_P/(x-theta)=D^2, alpha is the
      same squareclass and retains denominator contributions. The verifier
      recomputes N,D and alpha and rejects producer alternatives.
    exceptional_points:
      point_at_infinity: delta(O)=1
      rational_two_torsion: prohibited_on_main_route_and_routed_inapplicable
      inverse_pair: same x gives same alpha squareclass
      tangent_and_vertical_cases: exact line identity or inverse-pair rule
    character_contract:
      domain: "E(Q)/2E(Q) on exact E(Q)[2]=0 branch"
      allowed_character: >-
        For a verified prime ideal p of the exact maximal order,
        chi_p(P)=v_p((alpha_P)) mod 2, including numerator and denominator.
      unit_and_class_group_policy: >-
        Only verified valuation-parity characters enter the matrix. Unused
        unit/class-group data can reduce separating power but cannot create
        false rank.
    exact_homomorphism_obligation: >-
      Exact line/tangent substitution at theta must yield
      (m*theta+c)^2=(x(P)-theta)*(x(Q)-theta)*(x(R)-theta).
      Valuation parity kills squares, so each allowed character is an F2
      homomorphism. The symbolic identity witness is mandatory.
    rank_gate:
      matrix_orientation: ordered_points_by_semantically_bound_characters
      minimum_rows: 31
      maximum_character_columns: 256
      arithmetic: exact_bit_operations_only
      acceptance: first 31 selected point rows have exact F2 rank 31
      rejection_before_rank:
        - malformed rational or zero denominator
        - model or point transport mismatch
        - reducible or inseparable cubic
        - missing or malformed embedded witness
        - unverified prime ideal or valuation
        - alpha mismatch
        - failed homomorphism or known-false control
        - failed R6 semantic character-list identity

  exact_known_false_controls:
