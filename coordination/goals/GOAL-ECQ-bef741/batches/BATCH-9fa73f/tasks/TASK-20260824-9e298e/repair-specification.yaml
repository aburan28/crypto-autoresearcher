  R3_embedded_witness_schemas:
    repair_id: R3-WITNESS-SCHEMAS
    status: specified_for_independent_review
    container_file_template: "{campaign_root}/{run_id}/raw-result.json"
    container_media_type: application/json
    canonicalization: RFC8785_JSON_Canonicalization_Scheme
    hash_rule: "sha256 of canonicalized witness object bytes, lowercase 64-hex"
    additional_files_created: 0
    path_accounting_after_embedding: "102 identities * 6 files = 612 paths"
    common_scalar_definitions:
      rational:
        type: object
        additionalProperties: false
        required: [numerator, denominator]
        properties:
          numerator: {type: integer}
          denominator: {type: integer, minimum: 1}
        invariant: gcd(abs(numerator),denominator)=1
      rational_vector: {type: array, items: canonical_rational}
      sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
      hnf_matrix: {type: array, items: {type: array, items: {type: integer}}}
    witnesses:
