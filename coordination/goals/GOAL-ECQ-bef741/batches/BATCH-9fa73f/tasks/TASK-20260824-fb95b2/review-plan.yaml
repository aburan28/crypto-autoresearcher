  joints:
    - joint: J-FRONTIER-COUNT-AND-YIELD
      assigned_to: TASK-20260824-91e078
      attack_plan: >-
        From only the raw row, source-edge, and unordered-pair projection,
        independently enumerate row membership, empty and nonempty
