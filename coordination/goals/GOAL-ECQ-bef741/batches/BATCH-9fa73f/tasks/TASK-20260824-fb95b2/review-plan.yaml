        point-set, row-order, and matrix-basis preimages, and mutate each
        component, ordering, normalization, and transport source to test
        whether a foreign semantic system can retain the accepted digest.
      breaking_artifact: >-
        A semantically distinct character, point order, model transport, or
        matrix basis accepted under the same candidate descriptor binding.
    - joint: J-PRIME-MAXIMAL-ORDER
      assigned_to: TASK-20260824-ed233a
      attack_plan: >-
        Re-derive irreducibility over Q, the cubic discriminant, the
        squarefree-discriminant index implication, reduction at 7, residue
        map, HNF ideal closure, and theta-action identities from the raw
        fixture. Apply a nonsquarefree-order control and reject any conclusion
        that depends on a merely declared integral basis.
      breaking_artifact: >-
        A failed polynomial, discriminant, index, residue, HNF, theta-action,
        or nonsquarefree-control check, or any omitted lemma needed for the
        maximal-order conclusion.
    - joint: J-PRESERVATION-AND-OVERCLAIM
      assigned_to: TASK-20260824-a48d18
      attack_plan: >-
        Audit every prior repair and the exact 102-run-identity by six-file
        equals 612-path accounting; inject dependent-point, rational
        two-torsion, positive-yield, old-frontier, malformed-membership,
        descriptor-permutation, incomplete-order, and nonsquarefree-order
        controls; then trace every sentence that could imply a curve, rank,
        certificate, tooling, campaign, novelty, SOTA, or goal authority.
      breaking_artifact: >-
        Any control accepted, prior repair regressed, accounting drifted, or
        design-only conclusion promoted beyond future tooling consideration.
