    replay_runs_use_no_A_label: true

  replacement_null_controls:
    identities:
      CTRL-NULL-01: A1
      CTRL-NULL-02: A2
    definition:
      shifted_coordinate: "t=u-a_0"
      positive_equation: "v^2=S_A(t)=a*t^4+b*t^3+c*t^2+d*t+e^2"
      delta_selector: >-
        delta_A is the smallest integer in the ordered set {1,2,3,4,5}
        for which the exact discriminant of S_A(t)+delta_A*t is nonzero.
      null_equation: "v^2=S_A_null(t)=S_A(t)+delta_A*t"
      frozen_scan_box: "0<|n|<=400, 1<=d<=12, gcd(|n|,d)=1, u=n/d"
      measurement: exact rational-square test followed by the same osculating-parabola map and exact on-curve checks
    exact_proof:
      rational_base_point: >-
        At t=0, S_A_null(0)=S_A(0)=e^2. Therefore (t,v)=(0,e) is a
        rational point on the null quartic. For A1, e=-1089143/8; for A2,
        e=-1230950. Both are nonzero, so every division by 2e in the map is valid.
      quartic_shape: >-
        Adding delta_A*t changes only the linear coefficient d to d+delta_A.
        The nonzero leading coefficient a and degree four are unchanged.
      finite_nonsingular_selector: >-
        A repeated root r of S_A(t)+delta*t must satisfy
        S_A(r)+delta*r=0 and S_A'(r)+delta=0. Eliminating delta gives
        H(r)=S_A(r)-r*S_A'(r)=0. Since S_A has nonzero quartic leading
        coefficient a, H has leading coefficient -3a and is not zero, so it
        has at most four roots. The base r=0 cannot be repeated because
        S_A(0)=e^2 is nonzero. Each remaining repeated root determines at most
        one bad delta=-S_A'(r). Thus at most four delta values are bad, and at
        least one of the five distinct rationals 1,2,3,4,5 gives nonzero
        discriminant. The smallest-good selector is total and deterministic.
      forced_signature_destroyed: >-
        For every original Mestre node a_i with i not equal to 0, its shifted
        value t_i=a_i-a_0 is nonzero and
        S_A_null(t_i)=g_A(a_i)^2+delta_A*t_i differs exactly from
        g_A(a_i)^2 because delta_A and t_i are nonzero. Hence p_A(a_i)=0 no
        longer mechanically forces the archived square g_A(a_i)^2. The value
        may still be a different rational square by chance; that is retained
        as a null observation and is never suppressed.
      identical_quartic_to_cubic_path: >-
        The positive path applied to coefficients (a,b,c,d,e) uses the
        osculating parabola v=e+(d/(2e))*t+m*t^2 and
        D(m)=(b-(d/e)*m)^2-4*(a-m^2)*(c-d^2/(4e^2)-2e*m).
        The null uses the identical formula and code path with the sole data
        substitution d_null=d+delta_A. Its parabola is
        v=e+(d_null/(2e))*t+m*t^2 and its D_null is the same expression with
        d_null. The base point, rational operations, hit mapping, raw fields,
        and exact checks are identical; no chance hit is selected as a base.
    implementation_contract:
      - Reconstruct p_A, g_A, s_A and e from the exact ordered A; reject any mismatch with the frozen e and minimal model as invalid_input.
      - Compute exact discriminants for delta 1 through 5, record all five values, and select the first nonzero one; no numerical root or adaptive outcome is permitted.
      - Emit delta, positive and null quartic coefficients, base-point substitution, discriminant, and every square-test denominator in raw-result.json.
      - Use one function and one output schema for positive and null mapping, with d_effective=d for positives and d_effective=d+delta for nulls.
      - A null chance square is recorded normally; only the archived forced equality is expected to disappear.
    acceptance_tests:
      - Exact substitution proves S_A_null(0)=e^2 for both A1 and A2.
      - The selected delta is in 1..5, every earlier delta has exact zero discriminant, and the selected discriminant is exactly nonzero.
      - For all nine i other than zero, S_A_null(a_i-a_0)-g_A(a_i)^2 equals delta_A*(a_i-a_0) and is nonzero.
      - Positive and null runs emit the same field names and traverse the same mapper entry point; only mode and d_effective differ.
    falsifiers:
      - Either base substitution is not exactly e^2.
      - The selector finds no nonzero discriminant in 1..5.
      - Any nonbase archived forced equality remains equal to g_A(a_i)^2.
      - The null implementation uses a different mapping function, selects a base from observed hits, or omits chance square hits.
    future_owner:
      implementation: TASK-20260824-e38d5e
      design_review: TASK-20260824-6d9168
      final_protocol_binding: TASK-20260824-b97619

  terminal_state_machine:
    terminal_states:
      completed:
        definition: >-
          The runner reached its registered end, all exact checks and required
          artifacts passed, and a terminal receipt was durably finalized.
        enters_scientific_metrics: true
        consumes_admission: true
        retry_eligible_in_this_protocol: false
      censored_at_preregistered_limit:
        definition: >-
          A registered internal time, outer wall, CPU, address-space, or output
          byte limit was reached with a functioning wrapper. Aggregate-cap
          nonadmission is a subtype and receives a receipt without arithmetic.
        enters_scientific_metrics: only_as_censored_denominator
        consumes_admission: true
        retry_eligible_in_this_protocol: false
      invalid_input:
        definition: >-
          Before campaign arithmetic, an immutable hash, schema, environment,
          parameter, identity, model, nonsingularity, or source-binding gate failed.
        enters_scientific_metrics: false
        consumes_admission: true
        retry_eligible_in_this_protocol: false
      implementation_error:
        definition: >-
          A parser defect, assertion, deterministic nonzero exit, uncaught
          program exception, malformed output, exact invariant failure,
          incorrect point/map result, or source-code contract violation occurred.
        enters_scientific_metrics: false
        consumes_admission: true
        retry_eligible_in_this_protocol: false
      failed_infrastructure:
        definition: >-
          Contemporaneous external evidence proves a host, scheduler, storage,
          container, hardware, or wrapper service failure not caused by the
          program or its registered limits.
        enters_scientific_metrics: false
        consumes_admission: true
        retry_eligible_in_this_protocol: false
    disjoint_precedence:
      - invalid_input is decided only before campaign arithmetic.
      - A registered resource limit is censored_at_preregistered_limit, never infrastructure.
      - A code exception or unexplained nonzero exit is implementation_error by default.
      - failed_infrastructure requires external wrapper or host evidence naming the incident; absence of that evidence defaults to implementation_error.
      - completed requires every exact check and artifact; it cannot coexist with any other terminal state.
    candidate_dispositions_separate_from_terminal_state:
      values: [no_candidate, candidate_deferred_at_cap, candidate_unproven, candidate_route_inapplicable, candidate_admitted]
      note: These never replace or alter the run terminal state.
    retry_and_replacement:
      retries_inside_102_identity_protocol: 0
      replacement_identities_inside_protocol: 0
      favorable_only_retry_permitted: false
      later_retry_rule: >-
        A retry requires an additive versioned Coordinator amendment, a fresh
        allocated run identity, a new budget, and a stated reason. Invalid
        input or implementation error first requires a repaired snapshot.
        Censoring is not retried merely to seek a favorable outcome.
    acceptance_tests:
      - Every synthetic terminal fixture maps to exactly one of the five states.
      - A deterministic thrown exception maps to implementation_error.
      - SIGXCPU, registered outer timeout, RLIMIT_AS, and storage cap map to censored_at_preregistered_limit.
      - A documented host I/O incident maps to failed_infrastructure; the same exit without incident evidence maps to implementation_error.
      - candidate_unproven appears only in candidate disposition fields.
    falsifier: Any one exit maps to two states, an unexplained crash maps to infrastructure, or a failed run enters positive scientific metrics.
    future_owner:
      implementation: TASK-20260824-e38d5e
      design_review: TASK-20260824-6d9168
      final_validation: TASK-20260824-4c8b6f

