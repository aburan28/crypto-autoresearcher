  proof_search_map:
    bottleneck: >-
      Prevent false approval caused by an invalid control, ambiguous run state,
      unbounded workflow, or arbitrary full-rank bit matrix before any campaign execution.
    baseline_embedding:
      parameter_slice: >-
        The immutable 66/65/32/4/102 cardinalities and command identities are
        preserved. Exact positive baseline is a self-contained rank-30
        character fixture; absence keeps certificate execution blocked.
      reproduction_check: >-
        Static cardinality/path/budget checks plus exact synthetic positive,
        P31=2P1, P31=P1+P2, denominator-mutation, rational-2-torsion, state,
        and F2-equivalence fixtures under zero campaign input.
    observation_collision:
      observable: >-
        Final rank integer alone collides for inequivalent or unsound matrices;
        failed_infrastructure collides with implementation error under a generic
        crash label; a null hit rate collides with a broken map without base preservation.
      distinct_preimage_search: >-
        Use paired synthetic states with the same exit code but different cause
        evidence, matrices with equal rank but no invertible equivalence, and
        positive/null quartics with the same mapper but different forced identities.
    constructive_transforms:
      - {transform: representation_reduction, proposed_object: exact valuation-character verifier with canonical denominators, predicted_gain: every matrix bit is traceable to a proved homomorphism}
      - {transform: stronger_invariant, proposed_object: five-state terminal receipt plus cause evidence, predicted_gain: implementation defects cannot be laundered as infrastructure}
      - {transform: boundary_lift, proposed_object: finite end-to-end envelope beyond the 102-run boundary, predicted_gain: search certification review and archive are bounded together}
    quantifier_order: >-
      For every one of the 102 frozen identities, exactly one terminal state and
      six paths are determined before results. For every admitted candidate up
      to K=4, all producer and blind costs are capped. There exists at most one
      deterministic passing candidate admitted to claim-changing review. No
      witness, retry, character, or basis change may depend on a favorable result
      except where candidate-specific dependence is explicitly permitted and checked.
    method_ceiling:
      strongest_certifiable_claim: >-
        This repair can make a future protocol reviewable and bounded. Even a
        passing exact matrix can prove only rank(E(Q))>=31 for one exact curve;
        this specification proves no curve, rank, search yield, novelty, or SOTA.
      nearby_object_control: >-
        P31=P1+P2 and P31=2P1 must both fail rank 31; a denominator mutation
        must fail before rank; a rational-2-torsion object must route inapplicable.
    proof_obligations:
      - {claim: additive null selector is total and preserves the rational base point and map, responsibility: correctness}
      - {claim: terminal states are disjoint and exhaustive for launched runs, responsibility: interface}
      - {claim: every resource and archive component is finite, responsibility: size}
      - {claim: valuation characters factor through E(Q)/2E(Q), responsibility: correctness}
      - {claim: blind matrices are related by checked GL_m(F2) witness, responsibility: strictness}
      - {claim: current automated review-independence checker actually passes on final reports, responsibility: scope}
    not_applicable_reason: null

