  invertible_f2_equivalence_witness:
    ordered_rows: >-
      Producer and blind rederiver use the identical ordered selected point
      list. Row permutation, deletion, or point substitution is forbidden.
    dimensions: >-
      Both matrices must be 31 by m for the same frozen m, with 31<=m<=256.
      Different column counts or nonfrozen character spans are disagreement.
    required_artifacts:
      - producer-matrix.bin
      - rederived-matrix.bin
      - column-change-B.bin
      - column-change-B-inverse.bin
      - f2-equivalence-trace.json
    exact_predicates:
      - B and B_inverse are m by m bit matrices.
      - B*B_inverse=I_m and B_inverse*B=I_m by exact F2 multiplication.
      - M_rederived=M_producer*B with unchanged ordered rows.
      - Both matrices independently row-reduce to rank 31.
      - Matrix and witness SHA-256 values match the blind reports and snapshot receipts.
    preferred_strict_mode: >-
      Recompute identical frozen characters, yielding B=I_m and bit-for-bit
      matrix equality. A nonidentity B is allowed only when every column basis
      change is published and the predicates above pass.
    model_change_control: >-
      Transport the same curve and points through one nontrivial exact admissible
      rational model change; require exact on-curve agreement and the same
      checked B witness, not equal final ranks alone.
    acceptance_test: Independent verifier reconstructs both inverse identities and the matrix equation from artifact bytes.
    falsifier: Rank agreement without an invertible witness, row reordering, dimension mismatch, singular B, or failed matrix equation.
    future_owner:
