  exact_mestre_bindings:
    construction_definition: >-
      For ordered A=(a_0,...,a_9), let p_A(u)=product_i(u-a_i). Let g_A be
      the unique monic degree-5 polynomial for which deg(p_A-g_A^2)<=4, and
      let s_A(u)=g_A(u)^2-p_A(u). The positive quartic is v^2=s_A(u).
