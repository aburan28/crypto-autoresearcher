      mapped_campaign_runs:
        frontier: [MF-017, MF-018, MF-019, MF-020, MF-021, MF-022, MF-023, MF-024, MF-025, MF-026, MF-027, MF-028, MF-029, MF-030, MF-031, MF-032]
