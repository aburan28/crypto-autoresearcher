  exact_character_and_denominator_verifier:
    applicability_gate:
      curve: exact nonsingular generalized Weierstrass model over Q
      points: ordered exact rational points with nonzero canonical denominators
      two_torsion: >-
        Complete exact factorization of the transformed cubic proves no rational
        root. Otherwise return candidate_route_inapplicable and do not run the main rank gate.
    model_interface:
      definitions:
        b2: "a1^2+4*a2"
        b4: "2*a4+a1*a3"
        b6: "a3^2+4*a6"
        completed_square_coordinate: "Y=2*y+a1*x+a3"
        monic_cubic: "f(x)=x^3+(b2/4)*x^2+(b4/2)*x+b6/4"
        etale_algebra: "A=Q[theta]/(f(theta)) with ordered basis (1,theta,theta^2)"
      checks:
        - Recompute b2,b4,b6 and verify Y^2=4*f(x) exactly for every point.
        - Verify f is separable and irreducible over Q on the no-rational-2-torsion main branch.
        - Verify every admissible model change has nonzero u, exact inverse, and transports model and points in both directions.
    canonical_denominator_rule: >-
      Write each x-coordinate uniquely as N/D with integers gcd(N,D)=1 and
      D>0. Define alpha_P=D*(N-D*theta) in A. Since x-theta=(N-D*theta)/D,
      alpha_P/(x-theta)=D^2, so alpha_P is exactly the same squareclass while
      retaining every rational denominator contribution. The verifier
      recomputes N,D and alpha_P; producer-supplied alternatives are rejected.
    exceptional_points:
      point_at_infinity: delta(O)=1
      rational_two_torsion: prohibited_on_main_route_and_routed_inapplicable
      inverse_pair: same x gives the same alpha squareclass
      tangent_and_vertical_cases: handled by the exact line identity or the inverse-pair rule
    character_contract:
      domain: "E(Q)/2E(Q) on the exact E(Q)[2]=0 main route"
      codomain: F2
      allowed_character: >-
        For a published verified prime ideal p of the exact maximal order O_A,
        chi_p(P)=v_p((alpha_P))*mod 2, where the valuation is that of the
        principal fractional ideal generated by alpha_P and includes all
        numerator and denominator factors.
      prime_ideal_witness:
        - exact integral basis and multiplication table for O_A
        - exact index/discriminant check
        - rational prime l and irreducible factor defining p
        - HNF ideal basis, residue degree, norm, and primality check
      valuation_witness:
        - exact principal fractional-ideal numerator and denominator HNF bases
        - exact exponent or divisibility-chain witness for each selected prime ideal
        - parity bit recomputed by verifier, never accepted pointwise
      unit_and_class_group_policy: >-
        The rank matrix uses valuation-parity characters only. Unit and class
        group squareclass components remain recorded in the raw Kummer artifact
        when computed but are not converted into unchecked bits. Omitting them
        can reduce separating power and cause candidate_unproven; it cannot
        create a false full rank.
    exact_homomorphism_proof_obligation: >-
      For the monic cubic model, the line through P and Q, or tangent when
      P=Q, has equation Y/2=m*x+c after exact scaling. If R=P+Q, then evaluating
      the cubic intersection identity at theta gives
      (m*theta+c)^2=(x(P)-theta)*(x(Q)-theta)*(x(R)-theta).
      Thus delta(R)=delta(P)*delta(Q) in A*/A*2. Inverse points share x, and
      the vertical case is consistent with delta(P)^2=1. Valuation parity
      kills squares, so every allowed chi_p is an F2 homomorphism. The verifier
      must carry a self-contained symbolic identity artifact and exact special-case tests.
    rank_gate:
      matrix_orientation: ordered_points_by_characters
      minimum_rows: 31
      maximum_character_columns: 256
      arithmetic: exact_bit_operations_only
      acceptance: first 31 selected point rows have exact F2 rank 31
      rejection_before_rank:
        - malformed rational or zero denominator
        - model or point transport mismatch
        - reducible or inseparable cubic on main route
        - unverified prime ideal or valuation
        - alpha mismatch under canonical denominator rule
        - failed homomorphism or known-false control
    denominator_mutation_control: >-
      Change exactly one recorded D or delete exactly one denominator-prime
      valuation while leaving the point bytes fixed. Recomputed canonical N,D,
      alpha, and principal-ideal valuation must disagree and the verifier must
      return invalid_certificate before matrix rank.
    acceptance_tests:
      - Canonical alpha differs from x-theta by the exact square D^2 for every synthetic point.
      - Every published character bit is recomputed from a verified prime-ideal valuation.
      - The symbolic line identity and exact synthetic addition cases pass.
      - A denominator mutation and a pointwise nonhomomorphic bit assignment both fail before rank.
    falsifier: A producer can supply arbitrary bits, omit denominator valuations, use an unverified ideal, or reach rank acceptance after any interface failure.
    future_owner:
      implementation: TASK-20260824-e38d5e
      final_protocol: TASK-20260824-b97619
      red_team: TASK-20260824-09e130

