      reason: K=4 and one-review caps exist without a frozen or explicitly adaptive selector
    boundary_and_strictness:
      result: inconclusive
      reason: >-
        The method ceiling is rank at least 31, but the route stops before the
        implication from exact character rank to Z-independence is fully stated.
    method_ceiling:
