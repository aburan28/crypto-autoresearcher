  breaking_artifact:
    id: J-SCI-PROOF-ROUTE-AND-OVERCLAIM-BREAK-01
    kind: specification_level_observation_collision
    path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-e77946/repair-specification.yaml
    sha256: f0096c4bd9bc8c8e8c0d4e81d13e5a89f632083ba654331949cc3bf444c3e598
    load_bearing_locations:
      - repair_specification.R3_witness_schemas.schemas.raw_kummer.schema.properties.ordered_points
      - repair_specification.R3_witness_schemas.schemas.raw_kummer.schema.properties.model_transport
      - repair_specification.R3_witness_schemas.schemas.valuation.schema.properties.ordered_point_character_entries
      - repair_specification.R6_matrix_basis_binding.published_basis_case.required
      - repair_specification.exact_character_verifier.rank_gate
      - repair_specification.exact_character_verifier.line_identity
      - repair_specification.proof_search_map.quantifier_order
    missing_separator: >-
      There is no canonical, digest-bound rectangular row construction that
      joins each matrix row to the same ordered rational-point bytes across
      raw_kummer, valuations, model transport, producer, and rederiver in both
      R6 modes. The valuation witness carries point_id strings but no ordered
      point-set digest or canonical point bytes, permits duplicate or missing
      point-character pairs, and gives no first/last/duplicate rule. The
      published-basis case binds columns but, unlike the identical case, does
      not require equality of selected point IDs and canonical point bytes.
      Thus "exact F2 rank 31 on first 31 ordered point rows" does not identify
      one unique matrix on the intended points.
    proof_route_gap: >-
      Even after choosing a matrix, the affine-line identity is not a complete
      recorded proof that the squareclass/valuation map is a homomorphism on
      every group-law branch and that independent character rows imply
      Z-independence of the intended rational points. The symbolic witness
      always requires finite affine line coefficients while merely tagging
      vertical, inverse-pair, point-at-infinity, and two-torsion-inapplicable
      cases. No branch-specific identities or no-rational-2-torsion lifting
      lemma are stated. The only named squareclass-method reference is
      explicitly recalled, unverified, and non-evidentiary.
    consequence: >-
      Equal matrix rank can agree across implementations while referring to
      different or ambiguously assembled point rows, and a passing generic
      affine identity need not discharge the exceptional cases needed for the
      independence implication. This breaks the proposed certificate route
      before any rank or campaign claim can be admitted.

  objections:
    - id: RT-ROW-BINDING-01
      severity: blocking
      status: breaks
      assumption: >-
        "First 31 ordered point rows" denotes a unique rectangular matrix on
        the same canonical rational points in every witness and R6 mode.
      attack: >-
        Compare the raw_kummer ordered_points schema with the flattened
        valuation ordered_point_character_entries schema and the two R6
        cases. The latter has no ordered-point digest, row index, uniqueness,
        completeness, or canonical row assembly rule; the published-basis
        case omits the identical-case point-byte equality requirement.
      finding: >-
        Column semantics are substantially specified, but row semantics are
        not. Matrix-rank agreement is therefore not yet agreement about the
        intended rational points.
      cheapest_falsifier: >-
        Hold the character descriptor and rank-31 bit matrix fixed; replace a
        schema-valid raw_kummer ordered point with another schema-valid point
        under the same point_id and recompute only the raw_kummer canonical
        hash. A conforming successor must reject through a bound point-set
        digest before rank, independent of basis mode.

    - id: RT-HOMOMORPHISM-EXCEPTIONS-02
      severity: blocking
      status: breaks
      assumption: >-
        The generic finite affine-line identity proves the Kummer map law on
        all inputs needed to infer point independence.
      attack: >-
        Apply the unchanged proof to O, P plus negative P, a vertical line,
        tangent multiplicities, and the torsion-lifting step. The symbolic
        schema still requires finite m_line and c_line and supplies tags, not
        branch-specific equations or a total proof partition.
      finding: >-
        The generic identity is plausible and correctly normalized, but tags
        are not proofs. The recorded route does not establish the universal
        homomorphism statement or the lemma converting F2 independence in
        E(Q)/2E(Q) to Z-independence when E(Q)[2] is trivial.
      cheapest_falsifier: >-
        Require five static proof fixtures: O identity, inverse/vertical pair,
        generic secant, tangent with multiplicity, and a primitive-relation
        lifting lemma using E(Q)[2]=0. Each must fail closed before character
        bits when its premises are violated.

    - id: RT-TRANSPORT-PUBLICATION-03
      severity: major
      status: breaks
      assumption: >-
        The published-basis and transport fields retain enough material to
        prove every source and output character is the same character on every
        point after model transport.
      attack: >-
        Compare R2's requirement to publish source and target integral bases,
        HNF ideals, the isomorphism matrix and its inverse with the actual
        schemas. raw_kummer provides one unindexed model_transport object for
        up to 256 ordered points; prime_ideal_character provides one matrix but
        no inverse or explicit source/target pair; hash/path provenance is not
        bound to an archive commit in the witness.
      finding: >-
        The prose requirement is stronger than the retained witness shape.
        The single target_x/target_alpha tuple cannot identify a transport
        witness for every ordered point, and a digest alone cannot reconstruct
        missing inverse/source-target data.
      cheapest_falsifier: >-
        Use two ordered points with distinct transformed x-coordinates while
        retaining the one global target_x witness. A successor schema must
        either carry a per-point transport witness or state a deterministic
        recomputation whose inputs, output, and digest are bound per point.

    - id: RT-QUANTIFIER-SELECTION-04
      severity: major
      status: breaks
      assumption: >-
        Every selector is frozen before results, as proof_search_map claims.
      attack: >-
        Search the hash-bound specification for the rule selecting at most
        K=4 candidates from up to 102 candidates and the rule selecting at
        most one for claim-changing review.
      finding: >-
        Caps are frozen, but no candidate ranking, tie-break, or explicitly
        adaptive selection rule is present. Adaptive selection is not itself
        invalid for an exact existence certificate, but its omission makes the
        stated quantifier-order audit false and prevents any campaign-yield or
        selection-bias inference.
      narrow_effect: >-
        This does not refute a future exact certificate on one curve. It blocks
        claims about a preregistered search procedure, yield, or unbiased
        candidate selection.

    - id: RT-COST-CLOSURE-05
      severity: major
      status: inconclusive
      assumption: >-
        The finite wall cap is also a complete cost for successful end-to-end
        discovery and verification.
      attack: >-
        Reconcile every stated component, then add storage headroom and inspect
        the bit-length and success-probability quantifiers.
      finding: >-
        The component arithmetic reconciles, but it is a hard stopping budget,
        not a bound on successful verification or expected discovery cost.
        Schema integers and matrices have no arithmetic bit-length cap, no
        search-success probability is supplied, and temporary archive space is
        stated separately from persistent space.

  proves_too_much_and_nearby_controls:
    - id: CONTROL-DEPENDENCE-P31-EQUALS-P1-PLUS-P2
      object: P31=P1+P2
      known_false_conclusion: 31 independent point classes
      unchanged_argument_prediction: row31=row1+row2 and rank at most 30
      specified_failure_signature: certificate rejects before any rank-31 claim
      logical_result: holds_at_specification_level
      observed_result: not_executed
      interpretation: >-
        The control is correctly targeted and would reject if the intended
        character map and row assembly are homomorphic and correctly bound.
        Because the control was not executed and is itself testing the missing
        homomorphism/row joint, it cannot repair that joint by assertion.

    - id: CONTROL-DEPENDENCE-P31-EQUALS-2P1
      object: P31=2P1
      known_false_conclusion: 31 independent point classes
      unchanged_argument_prediction: row31=0 and rank at most 30
      specified_failure_signature: certificate rejects before any rank-31 claim
      logical_result: holds_at_specification_level
      observed_result: not_executed
      interpretation: >-
        This is the stronger direct test that doubles map to the trivial
        squareclass. It is correctly frozen, but remains an unexecuted control
        and does not substitute for the all-branches proof.

    - id: CONTROL-NEARBY-RATIONAL-2-TORSION
      object: a nonsingular completed-square cubic with a rational root
      known_false_conclusion: applicability of the irreducible-cubic certificate route
      unchanged_argument_prediction: >-
        exact_character_verifier.main_gate fails at irreducibility/no-rational-
        two-torsion before a character bit or matrix rank is admitted
      specified_failure_signature: inapplicable or invalid certificate before rank
      logical_result: holds_at_specification_level
      observed_result: not_executed
      interpretation: >-
        The nearby object is distinguished at the applicability gate. A
        successor still needs the explicit lemma that irreducibility of the
        completed-square cubic is equivalent to E(Q)[2]=0 in the exact model
        and that this fact discharges the lifting step.

  required_controls:
    - Bind one canonical point-set digest, exact curve-model digest, row index,
      point ID, and full canonical point bytes into raw_kummer, valuations, the
      matrix object, producer output, and blind rederivation in both R6 modes.
    - >-
      Require a complete rectangular matrix: exactly one entry for every
      selected point-character pair, no duplicates, no omissions, explicit
      ordering, and fail-closed construction before rank.
    - Add per-point transport witnesses or an exact deterministic per-point
      recomputation with source and target bases, HNF ideals, phi and inverse,
      and archive-bound provenance.
    - Add and independently verify the exceptional group-law proof fixtures
      and the no-rational-2-torsion lifting lemma.
    - Execute the two dependence controls and rational-2-torsion nearby object
      only after the successor proof route is frozen; a specification-level
      expected failure is not an observed PASS.
    - Freeze a candidate selection/tie-break rule, or explicitly declare
      adaptive selection and forbid all yield or unbiased-search inferences.

  counterexample_or_mutation:
    primary: >-
      Equal-rank unequal-point-semantics mutation: keep the published character
      basis, its coefficient matrix, valuation point_id labels, and the exact
      rank-31 bit matrix fixed; substitute a different schema-valid ordered
      rational-point byte sequence under the same labels. The published-basis
      requirements name complete source-column semantics but no canonical
      point-byte equality or point-set digest, so the specified R6 checks do
      not identify the collision. Required successor failure: point-set digest
      mismatch before valuation or rank.
    secondary: >-
      Exceptional-branch mutation: replace a generic secant triple by P,
      negative P, and O. The schema still demands finite affine line
      coefficients although the geometric line is vertical. Required successor
      failure or proof route: select the inverse/vertical branch and verify the
      square identity without using the generic affine formula.
    transport: >-
      Multi-point transport mutation: include two points with distinct target
      x-coordinates while retaining the one global target_x/target_alpha
      witness. Required successor failure: missing per-point transport binding.

  baseline_comparison:
    ecdlp_baselines:
      Pollard_rho: not_applicable_to_this_rank_certificate_joint
      BSGS: not_applicable_to_this_rank_certificate_joint
      closest_specialized_baseline: exact Cremona-Brumer-style 2-descent character certificate
    required_baseline_route:
      - exact canonical rational points on one exact curve
      - exact proof that E(Q)[2] is trivial for the admitted curve
      - a total squareclass homomorphism proof including exceptional branches
      - exact, semantically bound character evaluations on those same points
      - exact F2 row rank 31
      - the lemma that row independence modulo 2 implies Z-independence
    comparison_result: >-
      The proposal contains most intended ingredients and the correct generic
      line normalization, but it does not yet bind the rows or record the total
      implication chain needed to meet the specialized baseline.

