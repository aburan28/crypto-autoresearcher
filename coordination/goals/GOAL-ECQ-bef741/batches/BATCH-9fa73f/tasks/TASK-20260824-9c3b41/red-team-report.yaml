        to verify that 64800 seconds covers every independent scientific joint,
        rederivation, composition, and required rerun.
      - Archive maximum_paths and maximum_commits are caps without a complete
        future certification/review artifact inventory, so archive sufficiency
        is not yet demonstrated.

  reduction_and_scope_challenges:
    - >-
      The stated method ceiling is correctly narrow: a later fully reviewed
      exact certificate could establish rank at least 31 for one exact curve.
    - Exact rank, novelty, SOTA, campaign yield, or a general ECDLP improvement
      must not be inferred; the specification expressly establishes none.
    - Matrix-rank agreement is not point independence until row identity,
      character homomorphism, exceptional branches, and the E(Q)[2]=0 lifting
      step are proved on the same intended point bytes.
    - Rational 2-torsion is outside the route and is correctly rejected at the
      applicability gate; this does not justify a statement about curves with
      rational 2-torsion.
    - A path plus digest is not durable publication unless the referenced
      witness is reconstructible from an archived artifact or bound commit.

  proof_architecture_challenges:
    observation_fiber:
      result: collision_found
      invariant_held_fixed: exact F2 rank and published column semantics
