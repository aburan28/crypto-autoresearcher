      ceiling: rank at least 31 for one exact curve; no exact-rank, novelty, yield, or ECDLP claim
    nearby_object:
      result: holds_at_specification_level
      object: rational 2-torsion curve
      separator: irreducible-cubic main gate
    compositional_invariant:
      result: breaks
      deleted_component: canonical point-byte equality in published-basis mode
      first_failure: matrix rows cease to identify the intended rational points before rank

  narrowest_supported_statement: >-
    The hash-bound artifact is a nonexecutable, mechanically materialized
    proposal that states a correct generic normalized line identity, defines
    intended character-column semantics, freezes two dependence controls and a
    rational-2-torsion applicability gate, and reconciles a finite stopping
    budget. It establishes no curve, point, rank, independence certificate,
    campaign yield, novelty, SOTA result, or ECDLP improvement. Until a
    successor binds matrix rows to canonical point bytes and supplies the total
    squareclass-to-independence proof including exceptional branches, even a
    future rank-31 matrix agreement would not by itself certify the intended
    points.

  next_concrete_action: >-
    The Coordinator should commission a versioned successor specification, not
    edit this immutable one. Add a canonical curve-and-point-set digest to all
    four witnesses, a unique complete rectangular row schema, symmetric
    point-byte equality requirements in both R6 modes, per-point transport
    bindings, and a self-contained lemma chain for all group-law branches and
    the E(Q)[2]=0 lift. Freeze or explicitly declare adaptive candidate
    selection, add bit-length and 384-GiB additive disk-headroom preflights,
    then rerun the three controls under independent review before authorizing
    any campaign work.

