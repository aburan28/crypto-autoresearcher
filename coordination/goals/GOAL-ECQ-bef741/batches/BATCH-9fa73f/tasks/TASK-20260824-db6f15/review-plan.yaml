  joints:
    - id: J1-SCIENTIFIC-DESIGN
      owner_task_id: TASK-20260824-b883e1
      owner_role: reviewer
      statement: >-
        The 66-occurrence/65-class replay design, matched repeat, deterministic
        32-cell extension, four controls, metrics, stopping rules, and failure
        classifications form a nonadaptive and scientifically discriminating
        bounded experiment.
      worked_attack_plan:
        - Reconstruct the occurrence-to-equivalence-class mapping from the frozen protocol and immutable sources.
        - Confirm RP-022 mn:46 and RP-062 random:55 are both preserved but counted as one parameter class.
        - Prove the 32 ordered frontier cells are deterministic, previously untested, mutually distinct, and disjoint from replay classes and controls.
        - Confirm there are exactly four separately counted controls; two positive and two twist-null.
        - Attempt to construct a result-dependent selection, optional stopping, censoring, or timeout-classification path from the frozen rules.
        - Check that each metric has a null expectation and a falsification threshold fixed before execution.
        - Determine whether the tested scope and permitted conclusions are narrower than or equal to what the protocol claims.
      blocking_findings:
        - double counting or identity overlap
        - adaptive or underspecified cell selection
        - missing or non-shape-matched control
        - favorable-only stopping or censoring
        - infrastructure failure used as mathematical evidence
        - metrics incapable of discriminating the stated mechanism
    - id: J2-INTEGRITY-AND-BUDGET
      owner_task_id: TASK-20260824-1b50c6
      owner_role: validator
      statement: >-
        The immutable snapshot, statement-only run partition, run identities,
        cardinalities, per-run ceilings, aggregate resource totals, commands,
        and required artifacts are internally bound and reproducible.
      worked_attack_plan:
        - Verify the snapshot commit, parent, three-path diff, and supplied SHA-256 bindings without reading the producer protocol or task report.
        - From the statement-only packet, independently count replay occurrences, unique parameter classes, frontier cells, and controls.
        - Test pairwise disjointness of replay, frontier, and control run identifiers.
        - Independently rederive total planned invocation count and aggregate wall, CPU, memory, and storage ceilings from statement-only sets and per-run limits.
        - Check that all planned run IDs have commands, seeds or deterministic seed rules, environments, timeouts, output paths, and failure classifications.
        - Report the independently derived quantities without reading any producer-computed total.
      blocking_findings:
        - snapshot or hash mismatch
        - missing, duplicate, or overlapping run identity
        - independently derived run count other than 102
        - irreconcilable resource total
        - missing command, seed rule, environment, timeout, or artifact binding
        - access to a declared blind_from source
    - id: J3-PROOF-ROUTE-AND-OVERCLAIM
      owner_task_id: TASK-20260824-37f4ab
      owner_role: red-team
      statement: >-
        The proof-search map, exact candidate-to-certificate route, cost model,
        and claim boundaries cannot promote a false rank-at-least-31 result and
        reject a known-dependent 31-point-shaped control.
      worked_attack_plan:
        - Trace every transition from candidate curve and points to nonsingularity, exact on-curve checks, character construction, F2 rank, Z-independence, and torsion treatment.
        - Identify every unproved implication, heuristic, analytic assumption, floating computation, or saturation gap.
        - Apply the stated acceptance route to the known-false 31-point-shaped control with P31=P1+P2 and induced F2 relation c31=c1+c2.
        - Perform a bounded exact symbolic F2 accounting check showing the control matrix has rank at most 30.
        - Attempt a torsion-hidden relation, invalid-character, denominator, singular-curve, and wrong-model attack.
        - Recompute end-to-end cost categories and identify omitted certificate, storage, replay, and review costs.
        - Check that no search observation alone can trigger a rank, novelty, SOTA, or goal-completion claim.
      blocking_findings:
        - known-dependent control accepted
        - unjustified character homomorphism or independence implication
        - missing torsion or nonsingularity gate
        - floating or analytic evidence permitted as rank proof
        - omitted end-to-end cost capable of violating the declared bound
        - search output permitted to bypass exact certification and breakthrough review
