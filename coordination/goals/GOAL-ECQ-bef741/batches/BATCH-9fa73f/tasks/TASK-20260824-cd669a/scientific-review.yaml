  breaking_artifact:
    canonical: R1-BASE-DOUBLE-ROOT-BRANCH-COLLISION
    kind: exact_symbolic_counterexample
    load_bearing: true
    object:
      field: Q
      quartic_equation: "v^2=t^4+1"
      coefficients: {a: 1, b: 0, c: 0, d_effective: 0, e: 1}
      preconditions:
        a_nonzero: true
        e_nonzero: true
        quartic_discriminant_nonzero: true
        smoothness_argument: >-
          The quartic polynomial t^4+1 and its derivative 4*t^3 have no
          common root: the derivative can vanish only at t=0, where t^4+1=1.
      accepted_quartic_point: {kind: finite, t: 0, v: 1}
    exact_derivation:
      r: 0
      base_contact_m_utm: 0
      A_at_m_utm: -1
      B_at_m_utm: 0
      C_at_m_utm: 0
      Delta_at_m_utm: 0
      discriminant_point: {kind: finite, m_utm: 0, w: 0}
      inverse_t: 0
      inverse_v: 1
      quadratic_factor: "A*t^2+B*t+C=-t^2"
      root_multiplicity: 2
    simultaneous_predicates:
      - "A_nonzero.double_root because A=-1 and Delta=0"
      - "A_nonzero.base_factor because t=0, C=0, and v=e"
    exact_failure: >-
      The two advertised inverse sub-branches overlap on a valid smooth input.
      Both say emit once, but the specification supplies no ordering, combined
      label, or retag rule for this A_nonzero collision. This violates the
      correction matrix falsifier "missing or overlapping branch", and permits
      implementation-dependent branch identity even though the returned point
      itself is the same.
    minimal_repair_condition: >-
      Partition A_nonzero explicitly into mutually exclusive cases. One valid
      form is: first C=0 and w=B as base_contact, recording multiplicity two
      when B=0; otherwise Delta=0 as a nonbase double root; otherwise the
      remaining simple finite root. Freeze one emission/tag rule and require
      positive and null implementations to use it identically.

  secondary_breaking_artifact:
    canonical: NULL-SELECTOR-DOES-NOT-ESTABLISH-NONSQUARE-NODES
    kind: exact_design_countermodel_and_missing_fixed_control_certificate
    load_bearing_for_genuine_nullness: true
    object:
      field: Q
      positive_quartic: "v^2=t^4-2*t+1"
      coefficients: {a: 1, b: 0, c: 0, d: -2, e: 1}
      nonbase_parameter: 1
      positive_value: "S(1)=0=0^2"
      selected_delta: 1
      null_quartic: "v^2=t^4-t+1"
      null_value: "S(1)+1=1=1^2"
    exact_regularness_checks:
      positive: >-
        If S and S'=4*t^3-2 shared a root, then t^3=1/2 and
        S=t/2-2*t+1=1-3*t/2=0, forcing t=2/3, whose cube 8/27 is not 1/2.
        Hence S is squarefree.
      null_delta_one: >-
        If S+t and (S+t)'=4*t^3-1 shared a root, then t^3=1/4 and
        S+t=t/4-t+1=1-3*t/4=0, forcing t=4/3, whose cube 64/27 is not 1/4.
        Hence delta=1 is admissible and is the selector's first value.
    exact_failure: >-
      A nonzero delta*t changes the original ordinate equation but does not
      imply nonsquareness. The same nonbase parameter can remain a rational
      point, with a different ordinate. The generated specification expressly
      says chance null squares are retained and includes no exact nonsquare
      witness for the fixed CTRL-NULL-01 or CTRL-NULL-02 nodes. Therefore it
      supports only "original forced witness removed", not genuine node-null
      or point-null controls.
    scope_note: >-
      This countermodel attacks the sufficiency of the stated selector for the
      generic design. It does not assert that either fixed Mestre control has a
      chance square; those exact fixed-control nonsquare checks were absent and
      therefore remain unestablished.
    minimal_repair_condition: >-
      Define nullness precisely. If node-nullness is required, publish exact
      rational nonsquare certificates for every nonbase node of each fixed null
      control and fail control admission on any chance square. If only
      witness-destruction is intended, relabel the controls accordingly and do
      not use them as known-false objects for absence of rational nodes.

  exact_attacks:
    completed_square_and_line_normalization:
      verdict: holds
      derivation:
        - >-
          With Y=2*y+a1*x+a3, direct expansion gives
          Y^2=4*x^3+b2*x^2+2*b4*x+b6=4*f(x).
        - "Therefore y_bar=Y/2 satisfies y_bar^2=f(x)."
        - >-
          For a nonvertical group-law line y_bar=m_line*x+c_line,
          f(x)-(m_line*x+c_line)^2 is monic cubic with roots x(P),x(Q),x(R).
        - >-
          Evaluating at f(theta)=0 gives
          -(m_line*theta+c_line)^2=(theta-x(P))*(theta-x(Q))*(theta-x(R)),
          hence (m_line*theta+c_line)^2 is the product of x(T)-theta with no
          factor four.
      exceptional_vertical_case: >-
        For P,-P,O no finite affine line of the stated form is used. The
        squareclass relation instead follows from equal x-coordinates and the
        convention alpha(O)=1. This exception is compatible with R2, but an
        implementation must not route it through the affine-line formula.
      notation_separation_verified: true
      forbidden_Y_line_detected_as_allowed_form: false

    positive_and_null_construction:
      delta_existence:
        verdict: holds
        derivation: >-
          S_delta=S+delta*t is singular only if S(t)+delta*t=0 and
          S'(t)+delta=0. Eliminating delta gives S-t*S'=0, a nonzero quartic
          because its leading coefficient is -3*a and a is nonzero. Thus at
          most four delta values are bad, so one of 1 through 5 is admissible.
      same_shape_and_mapper_interface:
        verdict: holds_at_specification_level
        reason: >-
          The intervention changes only d_effective. R1 recomputes r, B, and C
          from d_effective and otherwise uses the same equations and branch
          schema for both modes.
      actual_implementation_equivalence:
        verdict: inconclusive
        reason: >-
          The bound artifact is nonexecutable and contains no implementation or
          execution receipt. This review can establish formula-level
          equivalence only, not that two future code paths are identical.
      original_forced_ordinate_removed:
        verdict: holds
        reason: >-
          At each nonbase t_i, delta*t_i is nonzero, so the original positive
          ordinate no longer satisfies the perturbed equation.
      genuine_nullness:
        verdict: breaks
        breaking_artifact: NULL-SELECTOR-DOES-NOT-ESTABLISH-NONSQUARE-NODES

    R1_factorization:
      verdict: holds
      derivation: >-
        Expanding q_m=e+r*t+m_utm*t^2 with r=d_effective/(2*e) gives
        q_m^2-S=t^2*((m_utm^2-a)*t^2+(m_utm*d_effective/e-b)*t+
        (d_effective^2/(4*e^2)+2*e*m_utm-c)).
      discriminant_degree: >-
        Delta=B^2-4*A*C is cubic in m_utm with leading coefficient -8*e,
        hence has one projective point at infinity because e is nonzero.

    R1_forward_and_inverse_partition:
      verdict: breaks
      cases:
        finite_t_nonzero:
          verdict: holds
          attack: >-
            Substituting m_utm=(v-e-r*t)/t^2 makes q_m(t)=v. The quadratic
            factor vanishes, and w=2*A*t+B satisfies w^2=Delta. Inverting with
            t=(-B+w)/(2*A) recovers t whenever A is nonzero.
        base_contact_t_zero_v_e:
          verdict: holds_as_map_but_collides_as_branch
          attack: >-
            The local expansion at (0,e) has slope r and second coefficient
            (c-r^2)/(2*e), so C=0 and w=B. The exact t^4+1 fixture shows this
            base factor can simultaneously be a double root.
        base_conjugate_t_zero_v_minus_e:
          verdict: holds
          attack: >-
            On the negative branch, v=-e-r*t+O(t^2), so
            (v-e-r*t)/t^2 has a pole and maps to O_Delta; the inverse convention
            returns (0,-e).
        quartic_infinity:
          verdict: holds
          attack: >-
            Write z=1/t and h=v/t^2 near I_s. Then h=s+(b/(2*s))*z+O(z^2)
            and m_utm=s+(b/(2*s)-r)*z+O(z^2). Since
            A=-B_s*z+O(z^2), w=2*A*t+B tends to -B_s, establishing the sign.
        A_nonzero_simple_nonbase:
          verdict: holds
          attack: >-
            Delta nonzero and t nonzero gives one selected simple root for each
            sign of w; the other sign selects the other root.
        A_nonzero_base_simple:
          verdict: holds
          attack: >-
            C=0 and B nonzero yields w=B,t=0 for base_contact, while w=-B
            yields the other finite root -B/A. These are disjoint.
        A_nonzero_double_root_nonbase:
          verdict: holds_when_t_nonzero
          attack: "Delta=0 forces w=0 and the unique root t=-B/(2*A) has multiplicity two."
        A_nonzero_double_root_at_base:
          verdict: breaks
          breaking_artifact: R1-BASE-DOUBLE-ROOT-BRANCH-COLLISION
        A_zero_B_nonzero:
          verdict: holds
          attack: >-
            Here Delta=B^2. The w=B sign selects the finite root t=-C/B;
            w=-B selects I_m. If C=0, the finite sign is base_contact exactly
            as specified.
        A_zero_B_zero_C_nonzero:
          verdict: holds
          attack: >-
            Delta=0 and the finite quadratic factor is the nonzero constant C,
            so no finite root exists. The point is I_m with multiplicity two.
            The smooth fixture t^4+1 reaches this branch at m_utm=1 and -1.
        A_zero_B_zero_C_zero:
          verdict: holds_as_unreachable_valid_input
          attack: >-
            q_m^2-S vanishes identically, so S is a polynomial square and the
            quartic polynomial has repeated roots. This contradicts the frozen
            nonzero-discriminant precondition and must fail closed.
        invalid_base_v_not_plus_or_minus_e:
          verdict: holds
          attack: "At t=0 the curve equation requires v^2=e^2, so no other rational v is on-curve."
      round_trip_disposition: >-
        The geometric point map is recoverable in every named high-level case,
        including infinity and the A=B=0 degeneration. What fails is the
        promised mutually exclusive implementation branch identity at the
        lawful base double root.

    R2_admissible_model_transport:
      verdict: holds_at_formula_level
      target_to_source_and_inverse:
        verdict: holds
        derivation: >-
          From x=u^2*x'+r and y=u^3*y'+u^2*s*x'+tau_y, solve
          x'=(x-r)/u^2 and y'=(y-s*(x-r)-tau_y)/u^3. Substitution into the
          generalized Weierstrass equation yields each of the five stated
          coefficient equations.
      inverse_tuple:
        verdict: holds
        derivation: >-
          Substituting (1/u,-r/u^2,-s/u,(r*s-tau_y)/u^3) into the composition
          law gives (1,0,0,0) in both orders.
      composition:
        verdict: holds
        derivation: >-
          Successive substitution gives u=u1*u2, r=r1+u1^2*r2,
          s=s1+u1*s2, and tau=t1+u1^2*s1*r2+u1^3*t2, exactly as stated.
      completed_square_transport:
        verdict: holds
        derivation: >-
          The coefficient equations give
          2*y+a1*x+a3=u^3*(2*y'+a1'*x'+a3'), so y_bar=u^3*y_bar'.
      normalized_line_transport:
        verdict: holds
        derivation: >-
          Substituting x'=(x-r)/u^2 into y_bar'=m_line'*x'+c_line' gives
          m_line=u*m_line' and c_line=u^3*c_line'-u*m_line'*r. Solving gives
          the stated inverse slope and intercept.
      theta_transport:
        verdict: holds
        derivation: >-
          Since f(x)=u^6*f'((x-r)/u^2), a target root maps by
          phi(theta')=(theta-r)/u^2 and theta=u^2*theta'+r.
      canonical_representative_square_relation:
        verdict: holds
        derivation: >-
          For x=N/D, alpha=D*(N-D*theta)=D^2*(x-theta). Likewise
          phi(alpha')=D'^2*(x-theta)/u^2, so
          alpha/phi(alpha')=(D*u/D')^2 exactly.
      valuation_and_character_parity:
        verdict: holds_conditionally_on_published_ideal_isomorphism
        derivation: >-
          Applying corresponding prime-ideal valuations to the exact square
          relation changes every valuation by twice the valuation of D*u/D'.
          Parity is invariant. The future witness must still publish and check
          the source and target integral bases, HNF ideals, and phi matrices.
      representative_invariance:
        verdict: holds
        reason: >-
          Reduced N/D with D positive is unique, target x' is recanonicalized,
          and the exact square ratio absorbs the denominator and scale change.
      exceptional_cases:
        point_at_infinity:
          verdict: holds
          reason: "Admissible projective model changes fix O; alpha(O)=1 is transport invariant."
        inverse_points:
          verdict: holds
          reason: "They have the same x-coordinate and therefore the same alpha and squareclass."
        rational_two_torsion:
          verdict: holds_with_declared_gate
          reason: >-
            The later exact-character gate requires a separable irreducible
            cubic, so rational two-torsion is absent and remains absent under a
            Q-isomorphism. Without that gate this exception would need a route.
        u_zero:
          verdict: holds
          reason: "u=0 is not an admissible change and must be invalid_input."
        malformed_denominator:
          verdict: holds
          reason: "It violates canonical-rational input and must be invalid_input before transport."
      implementation_equivalence:
        verdict: inconclusive
        reason: >-
          The formula contract is coherent, but no executable implementation,
          transport witness, or exact on-curve fixture was permitted or present
          in the review input. This report does not promote design algebra into
          implementation evidence.

