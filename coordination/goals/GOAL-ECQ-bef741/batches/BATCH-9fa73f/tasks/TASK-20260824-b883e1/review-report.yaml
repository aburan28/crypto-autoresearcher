  blocking_findings:
    - id: J1-B1
      severity: high
      title: Quadratic-twist nulls remove the rational base point required by the claimed identical map
      evidence: >-
        The pinned source report defines the M10 quartic-to-cubic reduction by
        choosing a base index with e=g(a_i0) nonzero, shifting that rational
        point to t=0, and using formulas containing e and d/(2e). The two exact
        pool fixtures use base index 0 and have e=-1089143/8 and e=-1230950.
        The frozen null replaces s by 2s. At the registered base point its
        equation is v^2=2e^2; because e is nonzero rational, a rational v would
        imply (v/e)^2=2. Therefore the archived rational base point, and hence
        the stated point-based transform over Q, is absent on each null.
      consequence: >-
        The null runs cannot both remove the forced squares and map hits
        through the same registered quartic-to-cubic transform. A future
        implementation would have to invent a different Jacobian map or choose
        a chance hit as an outcome-dependent base point, so the identical-path
        control claim, P3 discrimination, control-comparison artifact, and
        positive-versus-null metric are not executable as frozen.
      required_remediation: >-
        Amend and re-snapshot the protocol before approval. Either use an exact
        base-point-preserving null that destroys the tested forced signature,
        or preregister an exact Jacobian/twist representation and point-mapping
        procedure that requires no outcome-selected rational base point.
        Freeze the expected raw fields, positive/null comparison, exact checks,
        and a known-failure signature, then independently review the amended
        controls.

    - id: J1-B2
      severity: medium
      title: Failure taxonomy launders implementation crashes into infrastructure failures
      evidence: >-
        failure_classes assigns every nonzero exit or uncaught exception to
        failed_infrastructure_crash. The protocol has invalid_implementation
        for an exact check failure, but no failed_implementation status for a
        code defect, assertion, parser error, or deterministic uncaught
        exception. candidate_unproven is also listed beside terminal run
        failures even though it is a candidate disposition.
      consequence: >-
        An implementation defect can be misreported as an operational
        condition. This breaks the repository's required separation of
        implementation and infrastructure outcomes and can make the batch
        validity summary misleading even though no such failure is
        mathematical evidence.
      required_remediation: >-
        Add a cause-faithful failed_implementation terminal class, constrain
        failed_infrastructure_crash to externally evidenced infrastructure or
        wrapper failures, specify deterministic triage artifacts for ambiguous
        exits, and move candidate_unproven to a separate candidate disposition.

    - id: J1-B3
      severity: medium
      title: Aggregate stopping and retry boundaries are not fully frozen
      evidence: >-
        One stop says to run exactly 102 identities unless a pre-run integrity
        gate invalidates the batch, while another allows aggregate CPU, wall,
        or memory exhaustion to leave registered work not run. The budget block
        gives per-run maxima and derived values named worst_case, but does not
        name a scheduler-wide hard stop threshold or mandatory global launch
        order at concurrency two. The wrapper contract permits a retry under a
        new ID, but no retry IDs, eligibility rule, or relation to the 102-run
        maximum is frozen.
      consequence: >-
        Two conforming executors can start different subsets before an
        aggregate stop or handle a failed identity differently. Outcomes remain
        operationally censored rather than mathematical, but the experiment is
        not a uniquely specified nonadaptive 102-identity execution.
      required_remediation: >-
        Freeze one global launch order, explicit scheduler-wide hard CPU and
        wall thresholds or delete the aggregate-stop exception, define memory
        handling as per-process/concurrency enforcement, and state that no
        retries occur inside this 102-ID protocol unless a versioned amendment
        preregisters new IDs and accounting.

  nonblocking_findings:
    - id: J1-N1
      title: Null comparison is descriptive outside its forced-signature check
      evidence: >-
        The two nulls scan the historical box, while the 32 frontier cells are
        outside that box. No effect threshold or inferential decision rule is
        registered for positive-versus-null hit-rate difference.
      permitted_interpretation: >-
        After J1-B1 is repaired, these controls may validate the explicitly
        frozen implementation signature and exact point path. They may not by
        themselves support a frontier enrichment, causal yield, or generalized
        construction-signal claim. Exact newly mapped on-curve points remain
        exact observations, not rank evidence.

    - id: J1-N2
      title: The cross-arm repeat is not an independent class-level sample
      evidence: >-
        RP-022 and RP-062 share the exact t and five a-invariants and therefore
        are one parameter class represented by two historical occurrences.
      permitted_interpretation: >-
        Use the pair only for the preregistered path-consistency check and keep
        by-arm completion counts descriptive. Any later class-level or
        arm-effect analysis must collapse or explicitly model the matched pair.

  confirmed_properties:
    - The pinned raw empirical source contains exactly 31 mn-arm and 35 random-arm timeout occurrences.
    - All 66 source timeout identities map exactly to the 65 protocol classes; only timeout_fibre_022 repeats.
    - The 32 frontier identities match the frozen result-independent Cartesian ordering and are separated from the historical numerator box.
    - There are exactly two positive and two null control run IDs, all unique and separate from the matched repeat.
    - All 102 replay, frontier, and control run IDs are globally unique and satisfy 66 + 32 + 4 = 102.
    - The protocol forbids result-based early stopping and treats timeouts, crashes, OOM, dependency failures, and budget stops as nonmathematical.
    - The protocol explicitly forbids rank promotion from point count, solver fields, analytic rank, or floating regulators.

