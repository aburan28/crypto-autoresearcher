  findings:
    - id: R1-BASE-DOUBLE-ROOT-BRANCH-COLLISION
      owner_task_id: TASK-20260824-cd669a
      joint: J-SCI-ALGEBRA-AND-TRANSPORT
      blocking: true
      summary: >-
        On the smooth quartic v^2=t^4+1, the base point (t,v)=(0,1)
        maps to (m_utm,w)=(0,0) with r=0, A=-1 and B=C=Delta=0.
        The lawful inverse is therefore simultaneously tagged
        A_nonzero.double_root and A_nonzero.base_factor, but the proposal
        freezes no precedence rule, combined tag, or mutually exclusive
        partition.
      minimal_repair: >-
        Partition A_nonzero with an explicit base-contact precedence or a
        combined multiplicity rule, then re-review the total inverse branch
        semantics.
    - id: NULL-SELECTOR-DOES-NOT-ESTABLISH-NONSQUARE-NODES
      owner_task_id: TASK-20260824-cd669a
      joint: J-SCI-ALGEBRA-AND-TRANSPORT
      blocking: true
      summary: >-
        The generic selector implication is false: S=t^4-2t+1 with delta=1
        makes S and S+t squarefree, yet at t=1 their values are 0 and 1,
        both rational squares. CTRL-NULL-01 and CTRL-NULL-02 contain no exact
        nonsquare certificates for their fixed nodes.
      minimal_repair: >-
        Freeze exact node values and independently checkable rational
        nonsquare certificates for both null controls.
    - id: R3-R6-COMMON-DESCRIPTOR-DIGEST-NOT-ENFORCED
      owner_task_id: TASK-20260824-a97516
      joint: J-SCI-CHARACTER-AND-CERTIFICATE
      blocking: true
      summary: >-
        The raw Kummer witness uses digest 22...22, the valuation and
        descriptor witness uses 99...99, and independent RFC8785
        canonicalization yields
        46fd10e5c62f70c2a948f28c2160f9edc35776997e0b1a00285384c0e8f2169d.
        No rule forces the same descriptor digest across the R3 and R6
        witness families, so the semantic certificate chain is disconnected.
      minimal_repair: >-
        Require one canonical descriptor byte string and digest to be bound
        identically by every raw Kummer, valuation, transport, matrix, and
        published-basis witness.
    - id: PRIME-FIXTURE-IS-INVALID
      owner_task_id: TASK-20260824-a97516
      joint: J-SCI-CHARACTER-AND-CERTIFICATE
      blocking: true
      summary: >-
        The only prime fixture is invalid: x^3-x+1 reduces modulo 2 to
        x^3+x+1, the declared factor x+1 has remainder 1, and the stated
        HNF diagonal (2,1,1) is not theta-stable.
      minimal_repair: >-
        Replace the fixture with a correct prime-ideal and theta-stability
        witness and independently validate it.
    - id: PUBLISHED-BASIS-INVERSE-WITNESS-MISSING
      owner_task_id: TASK-20260824-a97516
      joint: J-SCI-CHARACTER-AND-CERTIFICATE
      blocking: true
      summary: >-
        The published-character-basis descriptor does not contain the
        required inverse witness, so its claimed basis transport is not a
        complete exact certificate.
      minimal_repair: >-
        Add the exact inverse transformation witness and verify both
        compositions against the canonical descriptor.
    - id: CANONICAL-POINT-SET-AND-MATRIX-ROW-BINDING-MISSING
      owner_task_id: TASK-20260824-9c3b41
      joint: J-SCI-PROOF-ROUTE-AND-OVERCLAIM
      blocking: true
      summary: >-
        The proposal freezes no canonical ordered point-set digest, point
        byte encoding, row index, uniqueness/completeness rule, or
        deterministic rectangular-matrix construction shared by raw Kummer,
        valuation, transport, producer, and blind rederiver. Published R6
        mode binds columns but not symmetric point bytes, and one unindexed
        transport tuple is offered for as many as 256 points. Equal rank can
        therefore refer to different or ambiguous rows.
      minimal_repair: >-
        Freeze canonical point bytes, a complete unique ordered point-set
        digest, per-point transport witnesses, deterministic row indexing,
        and one exact rectangular matrix construction used by every party.
    - id: GROUP-LAW-AND-TORSION-LIFTING-PROOF-INCOMPLETE
      owner_task_id: TASK-20260824-9c3b41
      joint: J-SCI-PROOF-ROUTE-AND-OVERCLAIM
      blocking: true
      summary: >-
        The generic affine identity is not total on the identity, inverses,
        vertical lines, or tangencies and is not accompanied by a proved
        E(Q)[2]=0 lifting lemma. Branch tags are not proofs, and the recalled
        source is non-evidence.
      minimal_repair: >-
        Supply a total exact group-law proof and an independently reviewable
        torsion/lifting argument, with retrieved or internal proof provenance.
    - id: CANDIDATE-SELECTION-AND-END-TO-END-YIELD-UNSPECIFIED
      owner_task_id: TASK-20260824-9c3b41
      joint: J-SCI-PROOF-ROUTE-AND-OVERCLAIM
      blocking: true
      summary: >-
        No deterministic candidate selector or tie-break is frozen, and no
        verified successful or expected discovery cost is established.
        Bit lengths and success probability are unbounded.
      minimal_repair: >-
        Freeze deterministic candidate selection and stopping semantics, then
        state finite bit-length, success-probability, and expected-cost bounds
        before any campaign approval is considered.
