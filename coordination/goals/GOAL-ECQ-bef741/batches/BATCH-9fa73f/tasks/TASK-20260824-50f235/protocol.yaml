  experiment_specification:
    objective: >-
      Determine, within the frozen finite scope, which formerly censored
      descents complete at 120 seconds and whether widening two immutable
      Mestre quartic scans produces exact new rational points, while measuring
      the identical path on two positives and two quadratic-twist nulls. No
      observation is rank evidence until the exact certificate route succeeds.
    proposed_runner_path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/FUTURE-EXECUTOR/src/erank_batch.py
    implementation_status: must_be_implemented_hash_bound_and_reviewed_before_approval
    exact_command_contract:
      working_directory: repository_root
      replay_template: >-
        python3 coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/FUTURE-EXECUTOR/src/erank_batch.py
        replay-timeout --protocol coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-50f235/protocol.yaml
        --run-id {RP_RUN_ID} --alarm 120 --seed 0 --out runs/{RP_RUN_ID}/raw-result.json
      frontier_template: >-
        python3 coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/FUTURE-EXECUTOR/src/erank_batch.py
        mestre-frontier --protocol coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-50f235/protocol.yaml
        --run-id {MF_RUN_ID} --seed 0 --out runs/{MF_RUN_ID}/raw-result.json
      control_template: >-
        python3 coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/FUTURE-EXECUTOR/src/erank_batch.py
        mestre-control --protocol coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-50f235/protocol.yaml
        --run-id {CTRL_RUN_ID} --seed 0 --out runs/{CTRL_RUN_ID}/raw-result.json
      substitution_rule: >-
        Substitute exactly one run_id from the corresponding ordered manifest;
        no other argument may vary. `--seed 0` asserts that execution uses no
        randomness. Historical selection seeds remain provenance fields only.
      wrapper_contract: >-
        Each literal command is executed under a run-record wrapper that sets
        an outer 600-second wall timeout, an 8-GiB address-space ceiling, one
        worker, captures stdout/stderr/resource use, and never edits a completed
        run directory. A new run ID is mandatory for any retry.
    environment:
      os: Linux x86_64 with glibc 2.39
      python: 3.11.15
      cypari2: 2.5.6
      pari_gp: 2.15.4
      numpy: 2.4.6
      sage: absent
      sympy: absent
      locale: C
      timezone: UTC
      hash_seed: PYTHONHASHSEED=0
      network: disabled_during_runs
      version_rule: exact equality or pre-run invalid_environment stop
      implementation_rule: future source commit and every source SHA-256 must be frozen in the approved handoff
    randomness:
      execution_rng_seed: 0
      execution_rng_use: forbidden
      replay_random_arm_selection_seed_provenance: 81141
      mestre_configuration_seed_provenance: 20260822
    budgets:
      maximum_runs: 102
      outer_wall_seconds_per_run: 600
      replay_internal_descent_alarm_seconds: 120
      frontier_internal_budget_seconds: 300
      control_internal_budget_seconds: 300
      maximum_memory_gb_per_run: 8
      maximum_workers_per_run: 1
      maximum_concurrent_runs: 2
      aggregate_peak_memory_gb: 16
      worst_case_total_cpu_hours: 17
      worst_case_aggregate_wall_seconds_at_concurrency_2: 30600
      budget_note: >-
        The 600-second outer ceiling follows the repository experiment floor;
        the smaller internal ceilings leave time for exact verification and
        immutable artifact finalization. No timeout carries mathematical sign.
    per_run_required_checks:
      - protocol and source hashes match before arithmetic
      - exact parameters match the class, cell, or control manifest
      - generalized Weierstrass discriminant is computed exactly and is nonzero
      - every emitted rational point is checked by exact numerator-denominator arithmetic
      - duplicate points and sign pairs are canonicalized without deleting raw observations
      - all numeric screening fields are labelled non_evidence
    metrics:
      primary:
        - completed_valid run count by arm and run kind
        - replay descent completion count at the frozen 120-second alarm
        - exact new rational points per replay class and per Mestre cell
        - exact square hits per numerator-denominator pair in positives and nulls
        - candidate curves having at least 31 distinct exact on-curve points
      secondary:
        - elapsed wall and CPU seconds and peak RSS per run
        - PARI descent status and returned lower/upper fields as raw nonclaim data
        - exact point duplication and overlap with archived point sets
        - multi-precision height-regulator and analytic-rank values as screening_only
        - matched-repeat agreement for RP-022 versus RP-062
        - positive-versus-null hit-rate difference with exact denominators
    preregistered_predictions:
      - id: P1-censoring
        statement: >-
          Some 8-second timeouts may complete under a 120-second alarm. Any
          count, including zero, is admissible; zero narrows only this solver,
          machine, alarm, and 65-class scope.
        discriminates: operational censoring from completed-descent behavior
      - id: P2-frontier
        statement: >-
          Exact square hits outside the old scan box are possible, but no
          positive count or rank increment is assumed. Every hit must survive
          exact mapping and on-curve verification.
        discriminates: genuine new quartic points from scan or mapping artifacts
      - id: P3-controls
        statement: >-
          Both positive fixtures must reproduce their immutable exact models
          and archived points; twist nulls should not reproduce the forced ten
          Mestre squares. Failure to distinguish them invalidates the path.
        discriminates: construction signal from same-shape measurement artifact
    stopping_rules:
      - Run exactly the 102 registered identities unless a pre-run integrity gate invalidates the entire batch.
      - Never stop the batch early because a promising or disappointing candidate appears.
      - A run reaching its internal or outer ceiling stops as failed_infrastructure_timeout and is retained.
      - OOM, crash, unavailable dependency, quota exhaustion, or wrapper failure stops only that run and is not mathematical evidence.
      - Any source/hash/environment mismatch stops before arithmetic with invalid_source_or_environment.
      - Any exact on-curve mismatch marks the run invalid_implementation and quarantines its downstream candidates.
      - A candidate with at least 31 exact points is queued only for a separately approved certificate task; this experiment does not claim rank.
      - Aggregate CPU, wall, or memory exhaustion ends remaining scheduled work as not_run_budget_exhausted, preserving completed artifacts.
    success_criterion: >-
      Mechanically complete, immutable artifacts for every started identity,
      exact coverage accounting, functioning positive/null discrimination, and
      zero unlabelled numerical rank claims. Discovery of a rank-31 candidate
      is not required for protocol success.
    falsification_criteria:
      - A positive control cannot reproduce its exact immutable model or archived exact points.
      - A null retains the positive's mechanically forced-point signature under the identical path.
      - Two purportedly distinct cells enumerate the same canonical (A,u) pair.
      - Any replay parameter differs from its frozen t-and-a-invariant class.
      - A reported rational point fails exact substitution.
      - A candidate is promoted from point count or a floating regulator without the exact certificate route.
    failure_classes:
      completed_valid: arithmetic and artifact checks complete
      invalid_source_binding: immutable input or manifest mismatch
      invalid_environment: exact dependency/version contract mismatch
      invalid_implementation: exact invariant, mapping, or point check fails
      failed_infrastructure_timeout: internal or outer wall ceiling reached
      failed_infrastructure_oom: memory ceiling reached
      failed_infrastructure_crash: nonzero exit or uncaught exception
      not_run_budget_exhausted: registered run not started after aggregate stop
      candidate_unproven: exact points found but no unconditional independence certificate
    per_run_artifacts:
      - manifest.yaml and manifest.json with run ID, status, command, source commit, dirty state, and hashes
      - command.txt containing the literal command
      - environment.json with dependency and host versions plus model provenance
      - stdout.log and stderr.log without trimming
      - raw-result.json with every enumerated input and outcome
      - resource.json with timestamps, wall, CPU, and peak RSS
      - exact-checks.json with discriminant, mapping, and on-curve checks
      - points.json with exact rational numerator-denominator coordinates
      - screening.json with all numerical fields explicitly marked non_evidence
    aggregate_artifacts:
      - occurrence-coverage.json proving 66 identities and 65 classes
      - matched-repeat.json comparing RP-022 and RP-062
      - frontier-coverage.json proving all 32 disjoint cells and canonical-pair counts
      - control-comparison.json with two positives and two nulls
      - candidate-index.json listing exact point counts without rank promotion
      - artifact-sha256.json binding every immutable file

  proof_search_map:
    bottleneck: >-
      Convert at least 31 exact points on one nonsingular rational curve into an
      unconditional proof that 31 chosen points are Z-linearly independent;
      point count and floating height determinants do not cross this boundary.
    baseline_embedding:
      parameter_slice: >-
        Before a candidate certificate is accepted, the exact verifier must
        reproduce the archived rank-30 fixture's curve and 30 supplied points,
        exact on-curve checks, and a rank-30 character or equally rigorous
        independence certificate. Separately, on the same fixture append
        P31=2*P1 to form a dependent 31-list.
      reproduction_check: >-
        The positive fixture must return exact matrix rank 30 for the certified
        30-list; the dependent 31-list must return rank at most 30. If the
        archived fixture lacks the exact character inputs needed for the first
        check, certificate execution remains unapproved until a frozen exact
        baseline fixture is supplied; a floating regulator is not substituted.
    observation_collision:
      observable: >-
        Naive observables are number of distinct exact points, numerical
        regulator nonzero at finite precision, or a solver lower bound. The
        load-bearing observable is instead the complete exact F2 character
        matrix together with proofs that its rows are homomorphisms on the
        torsion-free mod-2 quotient.
      distinct_preimage_search: >-
        Compare a 31-list whose last point is 2*P1 with any genuinely
        independent 31-list. They have the same point count and can both look
        numerically nonsingular under defective tolerances, but the exact
        character matrix must distinguish them. Search additionally for two
        point lists with equal squareclass support but different exact matrix
        rank; any collision forces stronger characters.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The exact Kummer image in the cubic etale algebra attached to
          Y^2=4x^3+b2*x^2+2*b4*x+b6, followed by justified valuation or local
          squareclass characters and exact Gaussian elimination over F2.
        predicted_gain: >-
          Replaces an unstable real determinant with a finite exact rank
          certificate whose implication to Z-independence is separately proved.
      - transform: stronger_invariant
        proposed_object: >-
          Publish algebra basis, squareclass representatives, selected local
          maps, torsion quotient, full matrix, pivots, and row-reduction trace,
          not merely the final integer 31.
        predicted_gain: independent implementations can reconstruct every load-bearing bit
    quantifier_order: >-
      For every exact nonsingular candidate E/Q and every chosen ordered list
      P1,...,P31 in E(Q), there must exist a finite list of exact characters
      chi_j, allowed to depend on E and the points but not on numerical
      precision or a random seed, such that each chi_j is proved to factor
      through the torsion-free quotient modulo 2; if the resulting matrix has
      F2 rank 31, then for every integer vector n, sum n_i P_i=O implies every
      n_i=0.
    method_ceiling:
      strongest_certifiable_claim: >-
        The method certifies only the F2 rank actually present in the published
        matrix, at most the number of justified independent characters. It
        proves a rank lower bound, not the exact Mordell-Weil rank and not a
        search-success probability.
      nearby_object_control: >-
        On the archived 30-point fixture, append P31=2*P1. The desired
        rank-at-least-31 conclusion for that ordered list is known false from
        the explicit relation P31-2*P1=O. Every certificate path must reject
        rank 31 on this proves-too-much control.
    proof_obligations:
      - {claim: exact admissible transformation from the supplied Weierstrass model to the cubic etale-algebra model, responsibility: interface}
      - {claim: every selected point maps to the recorded exact Kummer squareclass, responsibility: correctness}
      - {claim: every valuation or local bit is a well-defined homomorphism on the stated quotient, responsibility: correctness}
      - {claim: the complete published matrix has exact F2 rank 31, responsibility: strictness}
      - {claim: exact torsion handling makes the infinite-descent implication valid, responsibility: correctness}
      - {claim: the dependent 31-list and null certificate are rejected, responsibility: scope}
      - {claim: blind rederivation agrees bit-for-bit from only curve points and public certificate specification, responsibility: interface}
    not_applicable_reason: null

  exact_candidate_to_certificate_route:
    claim_tier: proposed_unconditional_lower_bound_route
    stage_1_curve:
      - Record [a1,a2,a3,a4,a6] as reduced rational numerator-denominator pairs.
      - Compute b2,b4,b6,b8,c4,c6 and discriminant exactly; require discriminant nonzero.
      - Record every admissible model change and its exact inverse.
    stage_2_points:
      - Record at least 31 ordered affine rational points as reduced numerator-denominator pairs.
      - Verify every generalized Weierstrass equation after clearing denominators exactly.
      - Canonicalize duplicates and inverse pairs; choose an explicit ordered 31-subset.
    stage_3_torsion:
      - >-
        Compute exact good-reduction group orders at at least three recorded
        primes and an order bound for E(Q)_tors; factor the corresponding
        division polynomials over Q, enumerate every rational torsion candidate,
        verify it on curve, and prove its exact order by the group law.
      - >-
        Main character route requires the transformed 2-division cubic to have
        no rational root, proving E(Q)[2]=0. If rational 2-torsion exists, the
        naive infinite-descent argument is forbidden; use a separately reviewed
        exact torsion-free quotient, descent, saturation, or height certificate.
      - Publish the exhibited torsion subgroup and the exact argument that no omitted torsion remains.
    stage_4_characters:
      - >-
        Form Y=2y+a1*x+a3 and the separable cubic
        F(x)=4x^3+b2*x^2+2*b4*x+b6. Construct the cubic etale algebra
        A=Q[theta]/(F(theta)) exactly and record its rational basis and multiplication.
      - >-
        Compute each point's exact Kummer class represented by x(P)-theta,
        with separately justified exceptional definitions. Reduce squareclasses
        exactly and select valuation or local characters whose homomorphism
        property is proved in the certificate.
      - >-
        Publish the complete point-by-character bit matrix, all character
        definitions, squareclass and ideal factorizations, pivot columns, and
        a row-reduction trace. Require exact rank over F2 equal to 31.
    stage_5_implication:
      - >-
        Prove in the certificate that any integer relation reduces modulo 2 to
        an F2 relation among the 31 Kummer images. Matrix rank 31 makes every
        coefficient even. With E(Q)[2]=0, divide the relation by 2 and repeat;
        infinite divisibility of a nonzero integer vector is impossible. The
        torsion-free-quotient alternative must prove the analogous implication.
      - Numerical regulators, analytic rank, BSD, GRH, solver upper bounds, and mere point count are excluded from this proof.
    stage_6_blind_rederivation:
      producer_inputs: [curve.yaml, points.yaml, certificate-spec.yaml]
      blind_from: [producer source code, producer row reduction, producer torsion notes, producer report]
      independent_outputs:
        - exact discriminant and on-curve ledger
        - exact torsion computation
        - independently constructed etale algebra and Kummer representatives
        - independently selected or verified characters and complete F2 matrix
        - independent row-reduction trace and rank
        - proves-too-much control result
      agreement_gate: >-
        Curve, selected points, torsion conclusion, matrix entries up to a
        declared basis transformation, and rank 31 must agree. Any disagreement
        blocks a rank claim and triggers a new correction or experiment.
    required_certificate_artifacts:
      - curve.yaml
      - points.yaml
      - exact-on-curve.json
      - torsion-certificate.json
      - etale-algebra.json
      - kummer-squareclasses.json
      - character-definitions.yaml
      - character-matrix.bin and character-matrix.txt
      - f2-row-reduction.json
      - implication-proof.md
      - blind-rederivation-report.yaml
      - exact-verifier source, lock file, commands, environment, stdout, stderr, and artifact hashes

