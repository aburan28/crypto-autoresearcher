  controls:
    count: 4
    counted_separately_from_replays_and_frontier: true
    duplicate_matched_repeat_is_control: false
    identical_measurement_path: >-
      All four reconstruct p,g,s from A in exact rational arithmetic,
      enumerate canonical u=n/d in the historical box, apply the exact integer
      square test, map hits through the same quartic-to-cubic transform, and
      emit the same raw fields. Nulls differ only by replacing s(u) with
      2*s(u), a deterministic quadratic-twist null of the same degree and
      coefficient shape that removes the forced nonzero g(a_i)^2 squares.
    ordered_controls:
      - run_id: CTRL-POS-01
        type: successful_cell_positive_replay
        A: A1
        scan_box: "0<|n|<=400, 1<=d<=12, gcd(n,d)=1"
        expected_fixture: exact reconstruction of the immutable A1 model and its archived exact points
      - run_id: CTRL-POS-02
        type: successful_cell_positive_replay
        A: A2
        scan_box: "0<|n|<=400, 1<=d<=12, gcd(n,d)=1"
        expected_fixture: exact reconstruction of the immutable A2 model and its archived exact points
      - run_id: CTRL-NULL-01
        type: same_shape_quadratic_twist_null
        A: A1
        twist: 2
        scan_box: "0<|n|<=400, 1<=d<=12, gcd(n,d)=1"
        expected_fixture: no mechanically forced base-point success; exact hit rate is an observation
      - run_id: CTRL-NULL-02
        type: same_shape_quadratic_twist_null
        A: A2
        twist: 2
        scan_box: "0<|n|<=400, 1<=d<=12, gcd(n,d)=1"
        expected_fixture: no mechanically forced base-point success; exact hit rate is an observation
    control_failure_rule: >-
      Any positive fixture mismatch invalidates the measurement implementation.
      If a twist null retains the same forced-point signature as its positive,
      the claimed control separation is falsified and all frontier signals stay
      artifacts pending repair. A chance null hit is recorded, not suppressed.
    raw_candidate_pairs_before_gcd_filter: 38400

