  joint_verdict:
    verdict: breaks
    verdict_scope: >-
      Breaks as an approval-ready, exact, end-to-end candidate-to-certificate
      route. The core F2-to-Z implication holds under its stated algebraic
      hypotheses, and the protocol's no-rank/no-SOTA boundaries largely hold,
      but the protocol does not yet make the character soundness and
      denominator/model interface machine-checkable, does not freeze the
      stronger compositional known-false control, and does not bound the
      certificate, independent-rederivation, review, archive, or storage costs.
    not_a_verdict_on:
      - whether any searched curve has rank at least 31
      - whether the 102 proposed runs should be executed
      - whether GOAL-ECQ-bef741 should change status
      - the J1 or J2 review joints

  attacks:
    - id: J3-ATTACK-01
      target: nonsingularity and model transport
      route_traced:
        - Rational a-invariants are required as reduced numerator-denominator pairs.
        - b2, b4, b6, b8, c4, c6, and the discriminant are computed exactly.
        - A zero discriminant is a mandatory rejection.
        - Every admissible model change and exact inverse is recorded.
      result: holds_conditionally
      reason: >-
        Exact nonzero discriminant is sufficient for a generalized
        Weierstrass equation over Q to define a nonsingular elliptic curve. The
        certificate still must check that each recorded change of variables is
        admissible, has nonzero scaling parameter, transports every point, and
        induces the claimed cubic-etale representation. Recording a formula
        and inverse without checking these identities is not enough.
      blocking: false

    - id: J3-ATTACK-02
      target: exact rational points and on-curve verification
      route_traced:
        - At least 31 affine rational points are recorded with reduced coordinates.
        - Each generalized Weierstrass equality is checked after exact denominator clearing.
        - Duplicate and inverse pairs are canonicalized before an ordered 31-subset is chosen.
      result: holds_conditionally
      reason: >-
        This is an adequate exact gate if every denominator is checked nonzero,
        the cleared equality is bound to the same recorded model, and inversion
        uses (x,-y-a1*x-a3) on the generalized model. It establishes point
        membership only; it does not establish independence.
      blocking: false

    - id: J3-ATTACK-03
      target: Kummer squareclasses and character homomorphisms
      route_traced:
        - The route forms Y=2y+a1*x+a3 and F(x)=4*x^3+b2*x^2+2*b4*x+b6.
        - It constructs A=Q[theta]/(F(theta)) and represents a point by x(P)-theta.
        - It then asks the later certificate to justify valuation or local characters.
      result: breaks_specification
      reason: >-
        The load-bearing soundness step is deferred to the phrase "whose
        homomorphism property is proved in the certificate." The protocol does
        not freeze a checkable domain/codomain, an order or fractional-ideal
        convention in A, rational-denominator normalization, exceptional-point
        rules, the unit/class-group component retained after valuation
        reduction, or a verifier predicate establishing that every published
        bit factors through E(Q)/2E(Q). A producer that drops denominator
        valuations or assigns pointwise bits can manufacture a full-rank matrix
        without a valid group homomorphism.
      blocking: true

    - id: J3-ATTACK-04
      target: exact F2 rank implication to Z-linear independence
      route_traced:
        - Let r_i be the complete character row for P_i.
        - A rank-31 row matrix makes every mod-2 relation coefficient zero.
        - Therefore every coefficient in an integral relation is even.
        - Dividing coefficients by two leaves a point Q with 2Q=O.
        - Exact E(Q)[2]=0 forces Q=O; iteration makes every coefficient divisible by every power of two.
      result: holds_under_explicit_preconditions
      reason: >-
        An integer vector divisible by every power of two is zero, so the
        infinite-descent implication is sound. It uses two indispensable
        premises: the rows are values of genuine homomorphisms on the mod-2
        quotient, and E(Q)[2] is exactly zero. Matrix arithmetic alone cannot
        supply either premise.
      blocking: false

    - id: J3-ATTACK-05
      target: torsion gate and rational-2-torsion branch
      result: holds_for_main_branch_but_alternative_is_unspecified
      reason: >-
        Exact absence of a rational root of the separable 2-division cubic is a
        sufficient main-route proof that E(Q)[2]=0; odd torsion does not spoil
        the repeated-halving argument. Good-reduction orders can bound the full
        rational torsion subgroup only when the primes are proved good and the
        injection and gcd/order-bound argument are explicit. For a candidate
        with rational 2-torsion, the protocol correctly forbids the naive
        argument but offers a menu of quotient, descent, saturation, or height
        methods rather than a frozen verifier. Such a candidate must be
        classified route_inapplicable_pending_separately_reviewed_certificate,
        never rejected and never promoted by this route.
      blocking: false
      blocks_only: any candidate with rational 2-torsion until a successor route is frozen

    - id: J3-ATTACK-06
      target: denominator, squareclass, saturation, and model-change risks
      result: breaks_specification
      reason: >-
        Exact affine on-curve checks do not automatically make x(P)-theta a
        correctly normalized squareclass. On a rational or nonminimal model,
        denominators contribute to fractional-ideal valuations and cannot be
        silently discarded. The protocol also permits basis changes and model
        changes without requiring a checked invertible F2 witness relating the
        old and new character matrices. Saturation is unnecessary on the
        E(Q)[2]=0 main route, but if invoked in the rational-2-torsion branch it
        needs a separately frozen prime-by-prime index certificate and cannot
        be inferred from a nonzero numerical regulator.
      blocking: true

    - id: J3-ATTACK-07
      target: blind rederivation comparison
      result: breaks_specification
      reason: >-
        The rederiver may "select or verify" characters, while the agreement
        gate permits matrices to agree up to a "declared basis
        transformation." The protocol does not require the transformation to
        be published, checked invertible over F2, and shown to preserve the
        ordered point rows. Equal final ranks from differently selected
        characters are not bit-for-bit agreement and can preserve a shared
        interface mistake.
      blocking: true

    - id: J3-ATTACK-08
      target: claim boundaries and failure interpretation
      result: holds
      reason: >-
        The protocol repeatedly states zero experiments, no curve, no point,
        no rank certificate, no novelty, no SOTA, and no closure. It excludes
        point count, floating regulators, analytic rank, BSD, GRH, and solver
        fields as rank evidence. Its strongest possible accepted mathematical
        conclusion is rank(E(Q)) >= 31, not exact rank, search success
        probability, exhaustiveness, or a result about every candidate.
      blocking: false

  known_false_control:
    id: J3-CONTROL-P31-SUM
    kind: proves_too_much_statement_only
    object: >-
      On one curve, append P31=P1+P2 to an ordered list; define r_i as the row
      of all justified F2 character values for P_i.
    known_false_conclusion: the resulting 31-point ordered list is Z-linearly independent
    explicit_relation: P1 + P2 - P31 = O
    exact_f2_trace:
      - "For every genuine character c_j, c_j(P31)=c_j(P1+P2)=c_j(P1)+c_j(P2)."
      - "Therefore r31=r1+r2 in F2^m."
      - "Hence r1+r2+r31=0, with nonzero coefficient vector e1+e2+e31."
      - "The point-by-character matrix has row rank at most 30 and cannot pass the exact-rank-31 gate."
    expected_failure_signature: exact row reduction reports rank at most 30
    result: rejected_at_statement_level
    executed_verifier_result: null
    interpretation: >-
      The declared mathematical route rejects the known-false object, provided
      the characters really are homomorphisms and the rows are assembled from
      those character values. This was exact symbolic accounting, not a curve
      computation or experiment.
    comparison_to_protocol_control: >-
      The protocol freezes P31=2*P1, which only forces r31=0. The P1+P2
      control is strictly more diagnostic because it exercises additivity on
      two distinct inputs. A pointwise nonhomomorphic bit assignment can be
      made to pass the doubling-zero check while violating r31=r1+r2.
    if_accepted_diagnosis:
      - a published character is not a homomorphism
      - x(P)-theta or denominator normalization is inconsistent with the group law
      - point ordering or matrix-row assembly is wrong
      - F2 row reduction is wrong
      - the control object was substituted or not actually evaluated

  proof_architecture_challenges:
    baseline_embedding:
      result: incomplete_gate_correctly_blocks
      detail: >-
        The protocol requires an exact rank-30 baseline and a dependent
        31-list, and correctly keeps certificate execution unapproved if the
        archived fixture lacks exact character inputs. The missing fixture is
        not evidence against the method; it is an approval blocker.
    observation_collision:
      result: partial
      detail: >-
        Point count, regulator, and solver fields are correctly identified as
        colliding observables. Exact matrix rank is identifying only after the
        character-homomorphism and torsion interfaces are proved. Otherwise an
        arbitrary full-rank bit matrix collides with a dependent point list.
    quantifier_order:
      result: soundness_statement_holds_but_totality_is_unclaimed
      detail: >-
        The stated order is: for every candidate and ordered point list, there
        may exist candidate-dependent exact characters. This can support a
        per-candidate certificate. It does not prove that the proposed
        valuation/local search will always find enough characters. Failure to
        find rank 31 is therefore certificate-inconclusive, not evidence of
        dependence or low curve rank.
    method_ceiling:
      result: holds
      detail: >-
        The ceiling is the exact rank of the justified character matrix and is
        at most the number of justified characters. Even rank 31 proves only a
        lower bound of 31 on the Mordell-Weil rank.
    nearby_object:
      result: protocol_control_too_weak_for_additivity
      detail: >-
        The frozen 2*P1 object catches failure to kill doubles. The handoff's
        P1+P2 object additionally catches a noncompositional point-to-bit map
        and must be retained as a separate control.

  blocking_findings:
    - id: J3-BLOCK-01
      title: Character soundness and denominator normalization are not an exact verifier contract
      impact: >-
        A full-rank matrix can be accepted even though its bits do not come
        from homomorphisms on E(Q)/2E(Q), invalidating the only step that turns
        F2 rank into point independence.
      cheapest_falsification: >-
        Freeze P31=P1+P2 and require every published character row to satisfy
        r31=r1+r2 before the rank gate. Also mutate one denominator valuation;
        the certificate verifier must reject the mutated artifact.
      required_correction: >-
        Freeze the exact etale-algebra basis/order, fractional-ideal and unit
        squareclass representation, denominator convention, exceptional cases,
        character domain and codomain, and a self-contained checked proof that
        each bit factors through E(Q)/2E(Q).

    - id: J3-BLOCK-02
      title: The stronger compositional known-false control is absent from the frozen protocol
      impact: >-
        The current 2*P1 control can pass for a fake map that kills doubles but
        is not additive on distinct points.
      cheapest_falsification: >-
        Materialize the exact P31=P1+P2 fixture, require r31=r1+r2 bit-for-bit,
        and require matrix rank at most 30.
      required_correction: add this control alongside, not instead of, the existing 2*P1 control

    - id: J3-BLOCK-03
      title: Blind matrix agreement is underspecified
      impact: >-
        Two implementations can report rank 31 without demonstrating that they
        computed the same characters or equivalent matrices.
      cheapest_falsification: >-
        Require the rederiver to publish the exact invertible F2 change-of-basis
        matrix and verify M_rederived = M_producer * B for the same ordered
        point rows, or require recomputation of the identical frozen characters.
      required_correction: make the matrix-equivalence witness a required machine-checked artifact

    - id: J3-BLOCK-04
      title: End-to-end cost, storage, and review accounting is incomplete
      impact: >-
        The protocol's 17 CPU-hour and 30,600-second ceilings cover only the
        102 registered search runs. They cannot support a claim that the whole
        candidate-to-certificate workflow is bounded or Pareto-complete.
      cheapest_falsification: >-
        Introduce K, the maximum number of candidates sent to certification,
        and freeze per-candidate CPU, wall, memory, disk, and artifact ceilings
        for both producer and blind rederivation. If no finite K and disk cap
        fit the campaign budget, the completeness claim fails before execution.
      required_correction: >-
        Add implementation, candidate-indexing, torsion, etale-algebra,
        factorization, character construction, matrix, implication-proof,
        known-false and baseline controls, blind rederivation, validation,
        adversarial/breakthrough review, archival, and durable-storage costs.

  nonblocking_findings:
    - id: J3-NONBLOCK-01
      title: The main repeated-halving implication is mathematically sound under its two explicit premises
      detail: genuine mod-2 homomorphisms plus exact E(Q)[2]=0 are sufficient; full saturation is not needed
    - id: J3-NONBLOCK-02
      title: Rational 2-torsion makes the main route inapplicable, not false
      detail: route such a candidate to a separately approved quotient, descent, saturation, or exact height certificate
    - id: J3-NONBLOCK-03
      title: A deficient selected character matrix is not a dependence certificate
      detail: it may mean the characters fail to separate independent classes; record candidate_unproven and strengthen the character family
    - id: J3-NONBLOCK-04
      title: The recalled Cremona-Brumer-style pointer remains non-evidence
      detail: >-
        Literature retrieval was prohibited by the handoff. The protocol
        correctly marks the pointer recalled and uses it to support no decision;
        a future certificate must be self-contained or retrieve and verify an
        exact theorem before relying on it.
    - id: J3-NONBLOCK-05
      title: Search-run resource arithmetic is internally exact but narrow
      detail: 102*600 seconds is 61,200 CPU-seconds or 17 hours; perfect two-way scheduling gives 30,600 wall-seconds and 2*8 GiB gives 16 GiB peak runner memory

  cost_model_challenges:
    registered_runner_recomputation:
      proposed_runs: 102
      outer_ceiling_seconds_per_run: 600
      total_cpu_seconds: 61200
      total_cpu_hours: 17
      concurrency: 2
      idealized_wall_seconds: 30600
      per_run_memory_gib: 8
      aggregate_runner_peak_memory_gib: 16
      result: arithmetic_matches_protocol
      limitation: excludes setup, scheduling gaps, implementation, certification, review, archival, and storage
    end_to_end_symbolic_accounting:
      candidate_count_symbol: K
      total_cost_form: >-
        C_end = C_102_runs + C_implementation + C_candidate_index +
        sum_{q=1..K}(C_model_q + C_oncurve_q + C_torsion_q + C_etale_q +
        C_fractional_ideal_and_unit_q + C_characters_q + C_matrix_q +
        C_implication_q + C_controls_q + C_blind_rederivation_q) +
        C_validation + C_red_team + C_breakthrough_review + C_archival.
      missing_numeric_bounds:
        - maximum K candidates admitted to certification
        - exact curve/model normalization CPU and memory
        - good-reduction point counts, torsion bounds, division-polynomial factorization, and order proofs
        - cubic field or etale algebra, order, ideal, fractional-ideal, unit, and squareclass computations
        - exact character construction and proof checking
        - independent blind rederivation, including alternative implementation setup
        - rank-30 baseline, 2*P1, P1+P2, denominator mutation, and rational-2-torsion controls
        - Validator, Red Team, review-breakthrough, Coordinator synthesis, and archive operations
        - disk and I/O caps for raw enumerations, untrimmed logs, exact factorizations, matrices, duplicate blind artifacts, reviews, and commits
      expected_cost_note: >-
        No search-success probability is claimed, so the protocol need not
        state an expected time-to-rank-31 result. If it later makes such a
        claim, the per-batch cost must be multiplied by the inverse of a
        justified candidate-and-certificate success probability.

  required_controls:
    - id: J3-CTRL-01
      priority: 1
      control: P31=P1+P2 on a frozen exact fixture
      acceptance: every character satisfies r31=r1+r2 and exact matrix rank is at most 30
      status_this_review: statement_only_rejected_as_required
    - id: J3-CTRL-02
      priority: 2
      control: same curve and points transported through a nontrivial exact admissible rational model change
      acceptance: on-curve results agree and matrices are related by a published checked invertible F2 witness
      status_this_review: proposed_not_run
    - id: J3-CTRL-03
      priority: 3
      control: mutate one numerator or denominator valuation in one Kummer representative
      acceptance: squareclass or homomorphism verification fails before the rank gate
      status_this_review: proposed_not_run
    - id: J3-CTRL-04
      priority: 4
      control: candidate fixture with rational 2-torsion
      acceptance: main infinite-descent route stops as inapplicable; no rank promotion occurs
      status_this_review: proposed_not_run
    - id: J3-CTRL-05
      priority: 5
      control: rank-30 exact positive fixture and its existing 2*P1 dependent extension
      acceptance: positive matrix rank is 30 and the dependent extension remains at most 30
      status_this_review: required_by_protocol_not_run

  reduction_and_scope_challenges:
    - >-
      The transformation from the generalized Weierstrass model to the
      cubic-etale Kummer representation must be an exact checked interface, not
      an appeal to the recalled method name.
    - >-
      Rank-31 of an unexplained bit matrix, rank-31 of characters not proved
      homomorphic, or rank-31 from mismatched model bases supports no rank claim.
    - >-
      A successful certificate supports rank(E(Q)) >= 31 only. It does not
      prove rank exactly 31, certify all found points, show the search family is
      exhaustive, establish novelty or SOTA, or imply an ECDLP result.
    - >-
      Failure of the character search, certificate implementation, resource
      budget, or rational-2-torsion main branch is operational or
      certificate-inconclusive and does not refute the candidate curve or goal.

  heuristic_challenges: []
  baseline_comparison: >-
    No cryptanalytic runtime baseline is implicated by this joint. Within the
    proof route, the exact rank-30 fixture is the relevant positive baseline;
    it remains a mandatory unexecuted gate. The proposed 102-run batch has a
    bounded runner ceiling but no end-to-end candidate-certificate baseline.
  counterexample_or_mutation: >-
    The cheapest counterexample is the dependent list with P31=P1+P2. A valid
    character matrix must contain the exact row dependency r31=r1+r2 and have
    rank at most 30. The cheapest implementation mutation is to flip or drop a
    single denominator-valuation bit; a sound verifier must reject before rank
    acceptance.

  narrowest_supported_statement: >-
    At immutable snapshot bde679c014bd0750feae058ca67d46a060dee35f, the
    protocol is a zero-run proposal with no rank result. Its repeated-halving
    lemma is sound conditionally: if 31 recorded exact points on a nonsingular
    E/Q yield a complete exact rank-31 matrix of genuinely justified
    homomorphisms on E(Q)/2E(Q), and exact arithmetic proves E(Q)[2]=0, then
    those points are Z-linearly independent and rank(E(Q)) >= 31. The current
    protocol does not yet provide an approval-ready machine-checkable
    character interface or complete end-to-end cost bound.
  next_concrete_action: >-
    The Coordinator should create an additive superseding protocol revision,
    not edit the immutable snapshot: freeze the exact character and
    denominator/model verifier contract; add P31=P1+P2 alongside 2*P1; require
    a checked invertible matrix-equivalence witness for blind rederivation; and
    cap K plus per-candidate CPU, wall, memory, disk, review, and archival
    costs. Then snapshot that revision before a new independent J3 review.

