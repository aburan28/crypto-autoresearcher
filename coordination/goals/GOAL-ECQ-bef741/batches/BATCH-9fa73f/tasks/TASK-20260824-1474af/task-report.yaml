    count: 1
    id: T33-MANUAL-SATISFIABILITY-INCOMPLETE
    severity: blocking
    affected_handoff_requirements:
      - complete manual satisfiability table
      - complete standalone reviewability
    exact_observation: >-
      Every row in
      R3_witness_schemas.manual_satisfiability_table.rows contains only the
      schema name, schema ID, local-reference inventory, fixture pointers, and
      expected outcomes, plus two descriptor fixture pointers for the
      prime-ideal row. No row maps each root required property, each nested
      required object or item, or each applicable const, enum, pattern,
      minimum, multipleOf, minItems, maxItems, uniqueItems, required, and
      additionalProperties constraint to the concrete positive-fixture value
      and an explicit satisfaction reason. A statement that the positive
      fixture is expected valid is not a complete manual satisfiability
      mapping. All four row-specific manual-mapping checks fail.
    required_additive_correction: >-
      A fresh standalone specification must retain the exact schemas and
      fixtures, then provide for each schema a finite exhaustive manual table.
      Every table entry must name schema_path, keyword, required constraint,
      concrete positive_instance_path, concrete positive value or value
      summary, and a plain satisfaction reason. It must cover every root and
      nested required property, every object additionalProperties rule, every
      array bound and uniqueness rule, every scalar type/bound/pattern/enum/
      const/multipleOf rule, and every local reference target. Descriptor
      identity and published-basis branches must each receive their own
      complete mapping. The table remains specified only; no producer
      validation execution is authorized.
    acceptance_test: >-
      An independent document walker enumerates every applicable schema
      constraint and every local ref edge and finds exactly one corresponding
      manual table entry whose positive instance path exists and whose stated
      value satisfies the constraint. There are no uncovered or duplicate
      constraint keys.
    falsifier: >-
      Any applicable root or nested schema constraint, either descriptor
      branch, or any local ref edge lacks a unique concrete positive-fixture
      mapping and satisfaction reason.

