    repair_id: R5-TERMINAL-PRECEDENCE
    classifier: first matching predicate only
    ordered_labels:
      - priority: 1
        label: external_incident
        predicate: authenticated incident before admission; admitted=false; arithmetic_started=false
      - priority: 2
        label: invalid_input
        predicate: structured immutable input or preflight rejection before arithmetic and no priority-1 match
      - priority: 3
        label: timeout
        predicate: atomic wrapper first cause is registered wall timeout and no earlier match
      - priority: 4
        label: resource_exhaustion
        predicate: atomic first cause is CPU, address-space, output-byte, storage, or worker limit and no earlier match
      - priority: 5
        label: infrastructure_failure
        predicate: authenticated causal external incident after admission and no earlier match
      - priority: 6
        label: uncaught_exception
        predicate: exact runtime exception or unregistered fatal signal and no earlier match
      - priority: 7
        label: malformed_output
        predicate: event sequence, six-file set, parse, hash, or R3 schema failure and no earlier match
      - priority: 8
        label: implementation_error
        predicate: unexplained nonzero exit, invariant failure, branch failure, round-trip failure, or other launched noncompletion
      - priority: 9
        label: mathematical_invalid
        predicate: normal schema-valid exact completion with exact mathematical verdict invalid
      - priority: 10
        label: mathematical_valid
        predicate: normal schema-valid exact completion with all exact gates valid
    tie_breaks:
      - structured preflight rejection outranks generic nonzero exit
      - atomic registered limit cause outranks its termination signal
      - timeout precedes resource if a corrupt record asserts simultaneous causes
      - first strictly sequenced resource event wins; equal sequence is malformed_output
      - preadmission external incident and postadmission infrastructure failure are disjoint
    totality: >-
      Every nonadmitted identity has a structured preadmission incident or
      aggregate-limit receipt; every admitted noncompletion reaches priorities
      2 through 8; every well-formed exact completion has a Boolean mathematical
      verdict and reaches priority 9 or 10.
