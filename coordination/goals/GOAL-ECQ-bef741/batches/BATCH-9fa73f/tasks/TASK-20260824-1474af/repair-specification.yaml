      y_bar: "Y/2"
      equation: "y_bar^2=f(x)"
      f: "x^3+(b2/4)*x^2+(b4/2)*x+b6/4"
    main_gate: exact separable irreducible cubic with no rational two-torsion
    canonical_alpha: "For x=N/D reduced, alpha=D*(N-D*theta) and alpha/(x-theta)=D^2."
    allowed_character: "chi_p(P)=v_p(alpha) mod 2 for a schema-valid verified maximal-order prime ideal"
    line_identity:
      line: "y_bar=m_line*x+c_line"
      exact: "(m_line*theta+c_line)^2=(x(P)-theta)*(x(Q)-theta)*(x(R)-theta)"
      factor_four_present: false
    required_witness_pointers:
      - /witnesses/symbolic_identity
      - /witnesses/raw_kummer
      - /witnesses/prime_ideals
      - /witnesses/valuations
    rejection_before_rank:
      - schema or fixture contract mismatch
      - line normalization mismatch
      - denominator or alpha mismatch
      - model transport mismatch
      - prime ideal or valuation failure
      - character_basis_binding failure
      - known-false control failure
    rank_gate: exact F2 rank 31 on first 31 ordered point rows

