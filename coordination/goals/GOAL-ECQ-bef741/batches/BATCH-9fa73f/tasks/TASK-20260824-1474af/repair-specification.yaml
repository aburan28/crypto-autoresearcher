  exact_mestre_bindings:
    construction: >-
      For ordered A=(a_0,...,a_9), p_A(u)=product_i(u-a_i). The unique monic
      degree-five g_A satisfying deg(p_A-g_A^2)<=4 defines
      s_A(u)=g_A(u)^2-p_A(u), and the positive quartic is v^2=s_A(u).
    A1:
      ordered_A: [-20, -16, -14, -13, -7, -6, 2, 3, 14, 19]
      base_index: 0
      base_parameter_a0: -20
      exact_e: "-1089143/8"
      exact_e_nonzero: true
      immutable_minimal_model: [1, 0, 0, -10735733389588488545, 13386166243940268673745678025]
      frontier_runs: [MF-001, MF-002, MF-003, MF-004, MF-005, MF-006, MF-007, MF-008, MF-009, MF-010, MF-011, MF-012, MF-013, MF-014, MF-015, MF-016]
      controls: [CTRL-POS-01, CTRL-NULL-01]
    A2:
      ordered_A: [-12, 5, 6, 7, 9, 10, 11, 13, 14, 17]
      base_index: 0
      base_parameter_a0: -12
      exact_e: "-1230950"
      exact_e_nonzero: true
      immutable_minimal_model: [1, -1, 1, -97623025006346669, 342379984015184906117269]
      frontier_runs: [MF-017, MF-018, MF-019, MF-020, MF-021, MF-022, MF-023, MF-024, MF-025, MF-026, MF-027, MF-028, MF-029, MF-030, MF-031, MF-032]
      controls: [CTRL-POS-02, CTRL-NULL-02]
    replay_runs_use_no_A_label: true

  positive_and_null_controls:
    positive_ids: [CTRL-POS-01, CTRL-POS-02]
    null_ids: [CTRL-NULL-01, CTRL-NULL-02]
    positive_equation: "v^2=S_A(t)=a*t^4+b*t^3+c*t^2+d*t+e^2"
    shifted_coordinate: "t=u-a_0"
    delta_selector: >-
      delta_A is the first integer in 1,2,3,4,5 for which the exact
      discriminant of S_A(t)+delta_A*t is nonzero.
    null_equation: "v^2=S_A(t)+delta_A*t"
    exact_properties:
      - "At t=0 both equations have the rational points (0,e) and (0,-e)."
      - "Adding delta_A*t preserves degree four and changes only d."
      - "At most four delta values are singular because S-r*S' is a nonzero quartic."
      - "For each nonbase Mestre node t_i, the forced square changes by nonzero delta_A*t_i."
      - "Chance null squares are retained."
    common_interface: R1_total_utm
    mode_difference_only: "d_effective=d for positive; d_effective=d+delta_A for null"

  exact_line_normalization:
    completed_square_coordinate: "Y=2*y+a1*x+a3"
    normalized_coordinate: "y_bar=Y/2"
    normalized_curve_equation: "y_bar^2=f(x)"
    affine_line: "y_bar=m_line*x+c_line"
    forbidden_forms:
      - "Y=m_line*x+c_line"
      - silent_rescaling_of_m_line_or_c_line
    exact_product_identity: "(m_line*theta+c_line)^2=(x(P)-theta)*(x(Q)-theta)*(x(R)-theta)"
    derivation_obligation: >-
      The monic polynomial f(x)-(m_line*x+c_line)^2 has roots
      x(P),x(Q),x(R). Evaluating its monic factorization at theta with
      f(theta)=0 gives the exact product identity with no factor 4.
    notation_separation: >-
      R1 uses m_utm as the osculating-parabola and discriminant-curve
      coordinate. Group-law lines use m_line,c_line only. No implementation
      may identify or silently rescale these distinct variables.

  R1_total_utm:
    repair_id: R1-TOTAL-UTM
    exact_types:
      canonical_rational: "integer numerator and positive integer denominator in lowest terms"
      finite_quartic_point: "{kind: finite, t, v}"
      quartic_infinity_point: "{kind: infinity, s} with s^2=a"
      finite_discriminant_point: "{kind: finite, m_utm, w}"
      discriminant_infinity: "{kind: infinity}"
    common_input:
      equation: "v^2=a*t^4+b*t^3+c*t^2+d_effective*t+e^2"
      preconditions: "a!=0, e!=0, exact quartic discriminant nonzero"
      source: "canonical u=n/d; t=u-a_0"
      mode_independence: positive and null call the same function and schema
    derived:
      r: "d_effective/(2*e)"
      q: "q_m(t)=e+r*t+m_utm*t^2"
      A: "m_utm^2-a"
      B: "m_utm*d_effective/e-b"
      C: "d_effective^2/(4*e^2)+2*e*m_utm-c"
      Delta: "B^2-4*A*C"
      factorization: "q_m(t)^2-S(t)=t^2*(A*t^2+B*t+C)"
      discriminant_curve: "w^2=Delta(m_utm), with projective infinity O_Delta"
    u_selector:
      order: frozen reduced n/d order
      nonsquare: emit one no_quartic_point observation
      square: >-
        For S(t)=rho^2 use canonical rho>=0, visit v=rho first, then v=-rho
        only when rho!=0. Both are observations in one run, not attempts.
    forward:
      finite_t_nonzero:
        m_utm: "(v-e-r*t)/t^2"
        w: "2*A*t+B"
        checks: ["q_m(t)=v", "w^2=Delta", "A*t^2+B*t+C=0"]
      base_contact:
        predicate: "t=0 and v=e"
        m_utm: "(c-r^2)/(2*e)"
        w: B
        checks: ["C=0", "w^2=Delta"]
      base_conjugate:
        predicate: "t=0 and v=-e"
        output: O_Delta
      quartic_infinity:
        predicate: "I_s=[1:0:s], s^2=a"
        output: "(m_utm,w)=(s,-B_s)"
      invalid_base:
        predicate: "t=0 and v not in {e,-e}"
        terminal: invalid_input
    inverse:
      O_Delta:
        output: "(t,v)=(0,-e)"
      A_nonzero:
        t: "(-B+w)/(2*A)"
        v: "q_m(t)"
        generic: "Delta!=0 and t!=0, multiplicity 1"
        double_root: "Delta=0, multiplicity 2, emit once"
        base_factor: "t=0 requires C=0 and v=e, emit once"
      A_zero_B_nonzero:
        finite_sign: "w=B gives t=-C/B and v=q_m(t)"
        infinity_sign: "w=-B gives I_m"
        base_factor: "C=0 retags the finite sign as base_contact"
      A_zero_B_zero:
        C_nonzero: "w=0 gives I_m with multiplicity 2 and no finite root"
        C_zero: "q_m^2=S identically, contradicting nonsingularity; invalid_input"
    totality: >-
      A is zero or nonzero; when zero B is zero or nonzero; when both are zero
      C is zero or nonzero. Together with O_Delta and the exact w sign, these
      cases are exhaustive and first-match disjoint.
    round_trip_obligations:
      - every accepted finite quartic point returns identically
      - every accepted finite discriminant point returns identically
      - O_Delta and base_conjugate return identically
      - every rational quartic infinity returns identically
    line_normalization_after_mapping: >-
      Any group-law or character identity on the resulting generalized
      Weierstrass model uses only y_bar=Y/2 and y_bar=m_line*x+c_line.
    failures:
      invalid_input: [noncanonical rational, a_zero, e_zero, singular_quartic, off_curve_point, A_B_C_all_zero]
      implementation_error: [nonunique_branch, missing_branch, round_trip_mismatch, mode_dependent_mapper]
      mathematical_invalid: [exact_nonsquare, exact_point_predicate_false]

  R2_model_transport:
    repair_id: R2-MODEL-TRANSPORT
    source_model: "y^2+a1*x*y+a3*y=x^3+a2*x^2+a4*x+a6"
    admissible_tuple: "tau=(u,r,s,tau_y), u in Q nonzero; r,s,tau_y in Q"
    target_to_source:
      x: "u^2*x'+r"
      y: "u^3*y'+u^2*s*x'+tau_y"
    source_to_target:
      x_prime: "(x-r)/u^2"
      y_prime: "(y-s*(x-r)-tau_y)/u^3"
    coefficient_equations:
      - "u*a1'=a1+2*s"
      - "u^2*a2'=a2-s*a1+3*r-s^2"
      - "u^3*a3'=a3+r*a1+2*tau_y"
      - "u^4*a4'=a4-s*a3+2*r*a2-(tau_y+r*s)*a1+3*r^2-2*s*tau_y"
      - "u^6*a6'=a6+r*a4+r^2*a2+r^3-tau_y*a3-r*tau_y*a1-tau_y^2"
    inverse_tuple: "(1/u,-r/u^2,-s/u,(r*s-tau_y)/u^3)"
    composition: >-
      (u1,r1,s1,t1) composed with (u2,r2,s2,t2) equals
      (u1*u2, r1+u1^2*r2, s1+u1*s2,
      t1+u1^2*s1*r2+u1^3*t2).
    normalized_line_transport:
      coordinate: "y_bar=u^3*y_bar'"
      target_line: "y_bar'=m_line'*x'+c_line'"
      source_slope: "m_line=u*m_line'"
      source_intercept: "c_line=u^3*c_line'-u*m_line'*r"
      inverse_slope: "m_line'=m_line/u"
      inverse_intercept: "c_line'=(c_line+m_line*r)/u^3"
      forbidden: transport_using_Y_equals_mx_plus_c
    theta_transport:
      relation: "theta=u^2*theta'+r"
      algebra_isomorphism: "phi(theta')=(theta-r)/u^2"
    canonical_representatives:
      source_x: "x=N/D, gcd(N,D)=1, D>0"
      target_x: "x'=N'/D' recanonicalized from (x-r)/u^2"
      alpha: "D*(N-D*theta)"
      alpha_prime: "D'*(N'-D'*theta')"
      square_relation: "alpha/phi(alpha')=(D*u/D')^2"
    witness_transport:
      prime_ideal: publish source and target integral bases, HNF ideals, phi matrix and inverse
      valuation: "v_p(alpha)-v_p'(alpha')=2*v_p(D*u/D')"
      parity: invariant
      character_order: invariant by canonical character_basis_binding_descriptor
      exceptional_cases:
        - O maps to O and alpha=1
        - inverse points retain x and alpha squareclass
        - rational two-torsion routes inapplicable
        - u=0 or malformed denominator is invalid_input
    gates:
      - exact on-curve forward and inverse
      - coefficient recomputation
      - inverse and composition
      - theta polynomial compatibility
      - alpha square relation
      - ideal valuation and parity invariance

