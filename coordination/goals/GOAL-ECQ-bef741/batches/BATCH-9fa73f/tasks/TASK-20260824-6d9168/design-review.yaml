    contamination_statement: >-
      This derivation uses only the cardinalities, distinctness premises, and
      zero ceilings stated in the frozen handoff.  The normative T25
      repair-specification had not been opened when this block was sealed.
  joint_results:
    J-NULL:
      verdict: breaks
      checks_that_hold:
        - >-
          For S(t)=a*t^4+b*t^3+c*t^2+d*t+e^2, adding delta*t preserves
          the exact rational base point (0,e).  The frozen A1 and A2 values of
          e are rational and nonzero, so the displayed 2e denominators are
          nonzero in both cases.
        - >-
          If S(t)+delta*t has a repeated root r, elimination of delta gives
          H(r)=S(r)-r*S'(r)=0.  H has leading term -3*a*r^4 and H(0)=e^2,
          so at most four delta values can be bad; the first-good selector
          over five distinct rational values is total.
        - >-
          At every nonbase Mestre node t_i, the former forced square changes
          by exactly delta*t_i, which is nonzero.  This proves only destruction
          of the archived forced signature; the specification correctly keeps
          chance squares as observations.
      attack: >-
        Substituting the osculating parabola leaves the residual equation
        t^2*((a-m^2)*t^2+(b-(d/e)*m)*t+
        (c-d^2/(4*e^2)-2*e*m))=0.  The specification gives the discriminant
        of the quadratic factor but gives no exact inverse/hit-map branch for
        a-m^2=0, the further-degenerate linear coefficient, the double-root
        case, the base-point factor t=0, or points at infinity.  It also freezes
        a scan box in the variable u while the displayed cubic-side formula
        is parameterized by m, without an exact u-to-m or t-to-m rule.  A
        shared function name does not determine these branches, so two
        conforming implementations can emit different hits while satisfying
        every currently stated field check.
      breaking_artifact:
        path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-793ed0/repair-specification.yaml
        fields:
          - replacement_null_controls.definition.frozen_scan_box
          - replacement_null_controls.exact_proof.identical_quartic_to_cubic_path
          - replacement_null_controls.implementation_contract
        witness: >-
          Missing exact recovery and exceptional-branch semantics for the
          quadratic residual, together with the unfrozen u/m interface,
          prevents implementation-equivalent positive and null evaluation.
      complete_boundary: >-
        The additive perturbation, rational base point, nonsingular selector,
        and forced-signature destruction are proved over Q; the break is the
        incomplete map/evaluation interface, not those algebraic facts.
    J-CHAR:
      verdict: breaks
      checks_that_hold:
        - >-
          With x=N/D in lowest terms and D>0,
          alpha=D*(N-D*theta) satisfies alpha/(x-theta)=D^2 exactly, so it is
          a canonical representative of the same squareclass and includes the
          denominator factor that N-D*theta alone would omit.
        - >-
          On the fixed exact no-rational-2-torsion model, evaluation at theta
          of the secant/tangent intersection identity proves multiplicativity
          of delta in A*/A*2.  Inverse pairs share x, the vertical case gives a
          square, O maps to 1, and valuation parity kills squares; therefore a
          verified prime-ideal valuation is an F2 homomorphism.
        - >-
          Exact irreducibility of the cubic is a sufficient main-route test for
          absence of rational 2-torsion, and the stated inapplicable branch is
          safe when this precondition is not proved.
      attack: >-
        The fixed-model homomorphism is sound, but the verifier contract also
        quantifies over every admissible model change without defining the
        admissible generalized-Weierstrass transformation tuple, its canonical
        direction, or the induced maps on theta, the maximal-order basis,
        prime ideals, principal fractional ideals, alpha, and character
        columns.  The later matrix B predicate cannot supply that missing
        semantic proof because it checks only evaluated bits.  In addition,
        the required self-contained symbolic identity, raw Kummer artifact,
        prime-ideal witnesses, and valuation witnesses have no frozen
        repository-relative paths or complete artifact schema.  The tooling
        implementation therefore has unfrozen acceptance choices and cannot
        bind all character evidence to immutable verifier inputs.
      breaking_artifact:
        path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-793ed0/repair-specification.yaml
        fields:
          - exact_character_and_denominator_verifier.model_interface.checks
          - exact_character_and_denominator_verifier.character_contract
          - exact_character_and_denominator_verifier.exact_homomorphism_proof_obligation
          - exact_artifact_namespace
        witness: >-
          Undefined model-change admissibility/transport and missing exact
          character-certificate artifact bindings leave the fixed-model theorem
          correct but the promised generic verifier semantics incomplete.
      complete_boundary: >-
        The verdict does not reject the canonical denominator formula or the
        fixed-model valuation homomorphisms; it rejects authorization of a
        generic implementation with an undefined transformation and evidence
        interface.
    J-RUNNER:
      verdict: breaks
      checks_that_hold:
        - >-
          The allowed identities are exactly 66 replay plus 32 frontier plus
          four control identities, hence 102.  Six literal file functions per
          pairwise-distinct identity yield exactly 612 unique paths; these are
          artifact paths, not attempts.
        - >-
          Retry and replacement ceilings are both zero.  The frozen protocol
