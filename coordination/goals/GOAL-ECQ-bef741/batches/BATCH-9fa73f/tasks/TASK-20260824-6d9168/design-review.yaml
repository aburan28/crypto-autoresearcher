        ambiguous terminal cause precedence.
    J-CERT:
      verdict: breaks
      checks_that_hold:
        - >-
          For P31=P1+P2, every valid F2 character gives
          row_31=row_1+row_2 bit-for-bit, so the 31 rows have rank at most 30
          and the exact verifier must reject known_false_rejected.
        - >-
          For P31=2*P1, every character factoring through E(Q)/2E(Q) gives
          row_31=2*row_1=0 over F2, so the 31 rows again have rank at most 30
          and the exact verifier must reject known_false_rejected.
        - >-
          Fixed row order, equal dimensions, exact inverse identities, and an
          identity-B bit-for-bit comparison are sound checks.
      attack: >-
        The allowed nonidentity witness proves too much.  Any two 31 by m
        matrices of row rank 31 are related by right multiplication by some
        B in GL_m(F2): extend each ordered list of 31 independent row vectors
        to a basis of F2^m and take the invertible linear map sending the first
        ordered basis to the second.  Thus the required B, B_inverse, inverse
        identities, matrix equation, and independent rank-31 predicates can
        all pass for arbitrarily different full-rank bit matrices.  No exact
        predicate binds B to verified linear combinations of the published
        character functions in the number-field/ideal witness space.
      breaking_artifact:
        path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-793ed0/repair-specification.yaml
        fields:
          - invertible_f2_equivalence_witness.exact_predicates
          - invertible_f2_equivalence_witness.preferred_strict_mode
          - invertible_f2_equivalence_witness.model_change_control
        witness: >-
          GL_m(F2) is transitive on ordered 31-element independent row lists,
          so the nonidentity-B predicate collapses to equal dimensions and
          rank agreement, the collision it claims to exclude.
      complete_boundary: >-
        Both known-false dependency controls have the exact required row
        relations and must be rejected.  The break is solely the claimed blind
        matrix-equivalence witness when B is nonidentity and semantically
        unbound.
