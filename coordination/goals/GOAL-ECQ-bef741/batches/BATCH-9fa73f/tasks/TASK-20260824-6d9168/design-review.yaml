        was reused as the wall total.  Separately, the terminal precedence is
        not disjoint for a documented host I/O incident that surfaces as an
        uncaught exception: failed_infrastructure has the required external
        incident evidence while implementation_error covers every uncaught
        exception by default, and no rule chooses between them.  A pre-arithmetic
        exact invariant failure similarly overlaps invalid_input and
        implementation_error.
      breaking_artifact:
        path: coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-793ed0/repair-specification.yaml
