          - finite_budget_envelope.end_to_end_hard_caps.wall_seconds_conservative_sequential
          - finite_budget_envelope.acceptance_tests
          - terminal_state_machine.disjoint_precedence
        witness: >-
          The frozen wall total is 6,120 seconds below the sum of its components,
          and at least two stated cause rules can classify the same exit.
      complete_boundary: >-
        Identity, namespace, retry, replacement, launch-order, and individual
