    derivation: >-
      Let I be the frozen set of 102 run identities and let F be the six
      frozen artifact-file slots for each identity.  The path map has domain
      I x F.  Pairwise-distinct identity prefixes separate paths belonging to
      distinct elements of I, while pairwise-distinct file paths within an
      identity separate the six elements of F.  Hence the path map is
      injective and its image has |I x F| = 102 times 6 = 612 unique artifact
      file paths.  Retry ceiling zero and replacement ceiling zero leave the
      run-identity universe equal to I: there are no retry identities,
      replacement identities, additional attempt identities, or attempt-ID
      suffixes.
    conclusion:
      run_identity_count: 102
      retry_identity_count: 0
      replacement_identity_count: 0
      additional_attempt_identity_count: 0
      unique_artifact_file_path_count: 612
