          archive count caps are finite.
      attack: >-
        The declared conservative sequential wall cap fails its own static
        accounting.  Summing the stated wall ceilings gives 14,400 tooling +
        61,200 campaign cumulative outer wall + 3,600 candidate index +
        4*93,600 candidate work + 64,800 claim-changing review + 14,400
        archival = 532,800 seconds, not 526,680.  The 6,120-second shortfall is
