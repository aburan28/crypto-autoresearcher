  narrowest_supported_statement: >-
    Snapshot 8cc51677 contains reproducible raw phases and cosine scores for
    17,919 bgj1_sieve vectors from one d=60, q=127 q-ary lattice database,
    scored against complete secret candidates on one LWE target, one uniform-b
    target and a coarse error sweep. The arithmetic summaries reproduce, and
    the omitted vectors can in fact be reconstructed uniquely from this
    archive. The measurement establishes a full-secret toy score table. It
    does not yet measure MATZOV's split FFT-bin object, does not estimate
    independence at the instance/database level, and has no pre-registered
    route to declare agreement with Nf.

  next_concrete_action: >-
    Do not compare the current table with Nf. First replace batch 2's measured
    object with an exact reduced-parameter split enumeration-plus-FFT
    implementation and pass the direct-enumeration bit-equality control; then
    freeze the correct-bin-versus-maximum-wrong-bin equivalence statistic and
    replicate it over independent instance/database clusters.

