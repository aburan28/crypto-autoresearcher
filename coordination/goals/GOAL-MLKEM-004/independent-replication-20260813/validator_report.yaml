  defects:
    - id: D-1
      severity: moderate
      class: producer_completion_gate_not_met_literally
      title: "The producer reused a pre-existing venv instead of rebuilding from scratch."
      detail: >-
        `Requirement already satisfied` is verification, not a rebuild. A later
        Coordinator session genuinely removed and recreated the venv; this
        validator verified it and reproduced the arrays. The mitigation does
        not rewrite producer history.
    - id: D-2
      severity: moderate
      class: omitted_binding_artifact
      title: "Original x,y vectors are absent, leaving the archived membership certificate unbound to the producer's pairs."
      detail: >-
        rank(A^T)=25 makes A^T surjective. The phase table recovers y but leaves
        two linear degrees of freedom in x after all target equations.
        Reproduction strongly corroborates the run but does not reveal the
        producer's omitted original x coordinates.
      batch2_fix: "Emit x and y per vector, or a lossless content-addressed vector artifact."
    - id: D-3
      severity: high_for_batch2_design
      class: null_candidate_class_dependence
      title: "The signal-removed null is materially structured by candidate class."
      detail: >-
        Fresh 4096-per-class candidates give centered-binomial mean +0.008567
        versus uniform mean +0.000184, difference +0.008384 (90.4 Monte Carlo
        SE). A pooled or uniform-only baseline would corrupt batch 2.
      batch2_fix: "Stratify or match the null by candidate prior before any model comparison."
    - id: D-4
      severity: minor
      class: inaccurate_dirty_tree_boolean
      title: "receipt.json records dirty_tree false while its transcript shows an untracked task directory."
      detail: >-
        The allowed output was later committed with exact hashes, so no content
        effect was observed. Future receipts should record dirty=true with an
        allowed-write-scope note.

