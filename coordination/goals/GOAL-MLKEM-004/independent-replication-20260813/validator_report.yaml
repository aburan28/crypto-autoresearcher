  control_checks:
    - control: secret_known_by_seeded_construction
      status: passed
      detail: "Independent reconstruction exactly reproduces A, s, e and b=A*s+e mod 127."
    - control: secret_leakage_audit
      status: passed_with_qualification
      detail: >-
        Line-by-line dataflow shows s does not enter the basis, LLL, Siever,
        coefficient extraction, reconstructed vectors or vector selection.
        These depend on A, q and independent solver seeds. s enters through
        b=A*s+e, as the labelled correct candidate, in decay targets, and as
        the base of eight declared near misses. All candidates use identical
        scoring arithmetic.
    - control: near_miss_construction
      status: passed_with_limitation
      detail: >-
        Building s+e_j does not leak s into the sieve or alter the correct
        score. It deliberately gives these wrong candidates a structural
        advantage: their phase differs by one y coordinate. They are a
        local-sensitivity control, not an exchangeable wrong-secret baseline.
    - control: null_signal_removal_shape
      status: passed_conditionally
      detail: >-
        Replacing b by an independent uniform vector while keeping A, vectors,
        candidates and scoring fixed removes the relation between the nominal
        secret and target. This is the right paired null for asking whether the
        fixed scoring pipeline uniquely privileges the named secret.
    - control: null_vector_population_axis
      status: unable_to_check
      detail: >-
        No null regenerates A and the sieve population. Such a null would test
        instance/population-specific sieve artifacts and between-population
        variation. Inventor-protocol section 3 permits a random instance of the
        same shape; this archive supplies only the conditional fixed-population
        version.
    - control: null_candidate_class_dependence
      status: failed
      seed: 5351520260813
      sample_size_per_class: 4096
      detail: >-
        Fresh uniform-Zq candidates have mean 0.0001835671 and sd across
        candidate means 0.0053236763; fresh centered-binomial eta=2 candidates
        have mean 0.0085673901 and sd 0.0026237434. Difference=0.0083838230,
        Monte Carlo SE=0.0000927361 (90.4 SE). The null is not
        candidate-class-exchangeable. See D-3.
    - control: decay
      status: passed_with_qualification
      detail: >-
        Finite-sigma correct means strictly decay. Uniform error is a separate
        terminal distribution, not an ordered sigma value, and its +0.00898
        rank 1/5 is class-confounded rather than residual signal.
    - control: lattice_membership_certificate
      status: unable_to_check_for_original_archive
      detail: >-
        rank(A^T mod 127)=25, so A^T is surjective. Candidate differences have
        rank 25, recovering y mod 127 for every vector; centered lifts match all
        norm2_y and max absolute entry is 10. The eight b rows have rank 8 and
        [A^T;b] rank 33 in 35 x coordinates, leaving nullity 2. Thus y is
        recoverable but x is not unique, and surjectivity makes recovered y
        alone no membership check. Exact-observable reconstruction passes
        membership but cannot bind omitted original x.

