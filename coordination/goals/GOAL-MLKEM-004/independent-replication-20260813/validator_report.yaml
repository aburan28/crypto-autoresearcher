  verdict_rationale: >-
    The package is admissible as raw data. All six artifacts are content-bound
    to a reachable Coordinator snapshot. Seeds reconstruct every generated
    input. Every report number derived from phases reproduces, all serialized
    cosine scores match, all arrays have the declared length, and an
    independent run on a freshly rebuilt but version-drifted instrument
    reproduces every scientific phase and norm array. The secret does not
    influence the basis, sieve or vector selection. Four defects remain:
    producer rebuild-gate failure, omitted original vectors, null
    candidate-class dependence, and an inaccurate dirty-tree boolean.
  what_this_verdict_does_not_support: >-
    It does not validate MATZOV.Nf's law, demonstrate a speedup, support an
    ML-KEM break or security proof, constitute crypto-scale evidence, affect or
    clear a FIPS 203 parameter set, authorize promotion, or change EV-* or KN-*
