    - check: inventor_protocol_section_6
      status: passed_for_applicable_step
      detail: >-
        No speedup or real-scale improvement is claimed, so ladder steps 1-3
        are not promotion gates here. Step 4 was exercised: the Coordinator
        rebuilt from scratch and the validator reconstructed the measurement.
        Environment drift is recorded rather than treated as negative evidence.
    - check: scale_binding
