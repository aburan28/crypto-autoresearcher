  defects:
    - id: D-1
      severity: moderate
      class: producer_completion_gate_not_met_literally
      title: The producer reused a pre-existing venv instead of rebuilding from scratch.
      detail: >-
        The transcript is honest, but `Requirement already satisfied` is
        verification, not a rebuild. This fails the producer card's literal
        Step-0 wording and inventor-protocol section 6 step 4.
      mitigation: >-
        A Coordinator session later performed a genuine rm/recreate/install/
        compile rebuild, and this validator verified it functional and
        reproduced all scientific arrays. The mitigation does not rewrite the
        producer history.
    - id: D-2
      severity: moderate
      class: omitted_binding_artifact
      title: Original x,y vectors are absent, so the archived membership certificate is not independently bound to the producer's pairs.
      detail: >-
        rank(A^T)=25 makes A^T surjective. The phase table recovers y but leaves
        two linear degrees of freedom in x even after all target equations.
        Recovered y alone therefore cannot falsify membership. Norms could
        constrain an existential x consistency check, and exact-observable
        reproduction strongly corroborates the run, but the producer's original
        x coordinates remain unbound.
      batch2_fix: Emit x and y per vector, or a lossless content-addressed vector artifact.
    - id: D-3
      severity: high_for_batch2_design
      class: null_candidate_class_dependence
      title: The signal-removed null is materially structured by candidate class.
      detail: >-
        Fresh 4096-per-class candidates give centered-binomial mean +0.008567
        versus uniform mean +0.000184, a +0.008384 difference (90.4 Monte Carlo
        SE). This explains why a centered-binomial nominal secret can outrank
        four uniform candidates after the LWE signal is destroyed. A pooled or
        uniform-only baseline would corrupt batch 2's comparison.
      consequence: >-
        Raw phases remain admissible; no inference across candidate classes is.
        Batch 2 must stratify or match the null by candidate prior before any
        model comparison.
    - id: D-4
      severity: minor
      class: inaccurate_dirty_tree_boolean
      title: receipt.json records dirty_tree false while its own transcript shows an untracked task directory.
      detail: >-
        The allowed task output was later committed with exact hashes, so the
        error has no observed effect on content. Future receipts should record
        dirty=true with an allowed-write-scope note.

  limitations:
    - >-
      One d=60, q=127 instance, one seed and one bgj1_sieve population only.
      Instance-to-instance and sieve-population variation are unmeasured.
    - >-
      The original Python-3.11.15 venv did not survive. The Coordinator rebuild
      uses Python 3.12.3, numpy 2.5.2 and passagemath 10.8.9 rather than Python
      3.11.15, numpy 2.4.6 and passagemath 10.8.7. fpylll 0.6.4 and g6k 0.1.2
      match. Scientific arrays reproduced exactly, but full-file bit identity
      is neither available nor claimed. This is infrastructure limitation under
      AGENTS.md rule 5, not evidence against the measurement.
    - >-
