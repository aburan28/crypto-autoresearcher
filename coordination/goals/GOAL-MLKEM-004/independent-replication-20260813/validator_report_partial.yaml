  control_checks:
    - control: secret_known_by_seeded_construction
      status: passed
      detail: >-
        Independent numpy reconstruction exactly reproduces A, s, e and
        b=A*s+e mod 127. The archived secret is genuinely known by construction.
    - control: secret_leakage_audit
      status: passed_with_qualification
      detail: >-
        Line-by-line dataflow shows s does not enter the basis, LLL, g6k
        Siever, coefficient extraction, reconstructed vectors, or vector
        selection. Those depend on A, q and independent solver seeds. s enters
        only through b=A*s+e, as the labelled correct candidate, in LWE decay
        targets, and as the base of eight declared near misses. Candidate index
        0 receives no scoring bonus; all candidates use identical arithmetic.
    - control: near_miss_construction
      status: passed_with_limitation
      detail: >-
        Building s+e_j does not leak s into the sieve or alter the correct
        score. It deliberately gives these wrong candidates a structural
        advantage: their phase differs by one y coordinate. They are a
        local-sensitivity control, not an exchangeable wrong-secret baseline,
        and pooling them with independent wrong candidates is invalid.
    - control: null_signal_removal_shape
      status: passed_conditionally
      detail: >-
        Replacing b by an independent uniform vector while keeping A, vectors,
        candidates and scoring fixed removes the relation between the nominal
        secret and target. This is the right paired null for asking whether this
        fixed scoring pipeline uniquely privileges the named secret.
    - control: null_vector_population_axis
      status: unable_to_check
      detail: >-
        No null regenerates A and the sieve population. Such a null would test
        instance/population-specific sieve artifacts and between-population
        variation, not the narrower fixed-population secret-leakage question.
        Inventor-protocol section 3 permits a random instance of the same shape;
        this archive supplies only the conditional, fixed-population version.
    - control: null_candidate_class_dependence
      status: failed
      seed: 5351520260813
      sample_size_per_class: 4096
      detail: >-
        On the archived NULL target, fresh uniform-Zq candidates have mean
        0.0001835671 and sd across candidate means 0.0053236763; fresh
        centered-binomial eta=2 candidates have mean 0.0085673901 and sd
        0.0026237434. Difference=0.0083838230, Monte Carlo SE across independent
        candidate draws=0.0000927361 (90.4 SE). This is material class
        dependence on a signal-removed target. The null does not select the
        nominal secret uniquely, but it is not class-exchangeable. See D-3.
    - control: decay
      status: passed_with_qualification
      detail: >-
        The finite-sigma correct means strictly decay. Uniform error is a
        separate terminal distribution, not an ordered sigma value, and its
        +0.00898 rank 1/5 is class-confounded rather than residual signal.
    - control: lattice_membership_certificate
      status: unable_to_check_for_original_archive
      detail: >-
        A^T has rank 25 mod 127 and is surjective. Candidate differences have
        rank 25, so the phase table recovers y mod 127 for every vector; the
        centered lift matches all archived norm2_y and has max absolute entry
        10. The eight b rows have rank 8. Combining them with A^T gives rank 33
        in 35 x coordinates, leaving nullity 2. Thus y is recoverable, x is not
        uniquely determined by the archived linear observations, and A^T's
        surjectivity makes recovered y alone no membership check at all. The
        archived norm2_x could support an existential short-x consistency
        search, but cannot identify or bind the producer's omitted original x.
        The independent exact-observable reconstruction passes membership with
        zero violations but likewise cannot bind an unarchived original x.

