    - id: MR-8
      claim: "7.126x and 9.385x below the iid prediction, against a reference of c4(8) = 0.96503, not 1.0"
      status: not_reproduced
      detail: >-
        The FACTORS reproduce, but they are computed against 1.0, not against
        c4(8): 1/0.140324 = 7.126358 and 1/0.106552 = 9.385127, and
        results.json computes them literally as 1.0/value. Against the c4(8)
        reference the same section insists on, the factors are 6.877x and
        9.057x. The report asserts the correct reference and then reports the
        wrong one in the same table, in the same paragraph that says using 1.0
        is "a 3.5% error, not negligible at this effect size". Carried into
        KN-TECH-9d21c4. See DEF-3.
    - id: MR-9
      claim: "closed form c4(8) rms(2 pi Y/q) rms(sin u)/sqrt(1/2) reproduces the archived rowperm arm to 0.6% pooled, max 1.1%"
      status: reproduced
      method: >-
        I re-derived the closed form from scratch before checking it. To first
        order in the phase, F_k = (1/N) sum_i cos(u_i) + (1/N) sum_i sin(u_i)
        phi_ik; under a row permutation the second term is a sum of N
        decoupled products, so sd_k(F) = rms(sin u) rms(phi)/sqrt(N), and
        dividing by sqrt(1/2N) gives rms(sin u) rms(phi) sqrt(2), times c4(8)
        for the sample-sd bias. E[sin^2 u] = (1 - exp(-2 Var u))/2 with
        Var u = 4 pi^2 sigma^2 ||x||^2/q^2 = 2 a_x, giving
        rms(sin u)^2 = (1 - exp(-4 a_x))/2. The derivation is correct.
      result: >-
        Recomputed on all nine archived instances: pooled prediction 0.10716077
        against measured 0.10655157, ratio 1.005717 (0.57%, the report's 0.6%);
        max per-instance |ratio - 1| = 0.011053 (the archived
        forced_value_max_rel_error to all digits). I also verified
        a_x = 2 pi^2 sigma^2 mean||x||^2/q^2 reproduces the archived
        a_x_measured exactly on every instance.
    - id: MR-10
      claim: "out of sample the closed form holds to 1.0 / 1.2 / 3.5% on the three families scored this run"
      status: reproduced
      detail: >-
        My independent run: SIEVE ratio 0.9898 (1.0%), MATCHED_BKZ 0.9881
        (1.2%), MATCHED_LONG 1.0353 (3.5%). Exactly the report's three numbers.
        I extended the test to two further families I built: VAL_SIEVE_SUMS
        0.9970 (0.3%) and VAL_POOL_PAIRRED 1.0126 (1.3%). Five out-of-sample
        families, all within 3.6%. The closed form is a prediction, not a fit.
    - id: MR-11
      claim: "the row-permuted arm was FORCED to fail the iid reference"
      status: reproduced
      detail: >-
        Verified as a matter of algebra, not of measurement. Every input to the
        closed form - mean ||y||^2 (through rms(2 pi Y/q)) and mean ||x||^2
        (through a_x) - is EXACTLY invariant under a row permutation. So the
        predicted row-permuted value is fixed by the real family's own norms and
        cannot approach c4(8) unless the family's ||y|| is large, which for a
        short dual family it is not. Every archived arm preserving the y
        multiset lands in [0.1053, 0.1131] as the report states. The forcing
        argument HOLDS.
    - id: MR-12
      claim: "the null placed on T2 (NULL-IID) can actually fail"
      status: reproduced
      detail: >-
        YES, and I re-measured it. NULL_IID_PHASE - the sieve's own X with
        uniform residues mod q for Y - returns near-miss 0.940056 against
        c4(8) = 0.965030, i.e. 2.6% low, while the real arms sit at 0.107-0.140.
        The uniform candidate group returns 0.9300-1.0043 across all seven
        families. So the statistic returns approximately the reference value
        when the offsets are uniform and an order of magnitude below it when
        they are short: the T2 comparison could have come out either way.
        Note the campaign's OTHER null (NULL-ROWPERM) could not - MR-11.
        Two residuals the producer recorded and I confirm: NULL_IID_PHASE's own
        excess is 1.0364 with z 2.0, and its uniform group sits at 0.9075, 6%
        below c4(8) rather than 2.6%. Small, reported, not explained.

    # ------------------------------------------------------------------ T4
    - id: MR-13
      claim: "Stage B shortfall 10.611x: measured N = 4253 vs modelled Nf = 45128.788121081096 for p = 2"
      status: reproduced
      detail: >-
        From the archived stage_b_results.json: B3_per_instance n_vectors =
        [4253, 4253, 4253]; B1_admissible_tuples Nf_modeled = 45128.788121081096
        (p=2), 716.5496009363183 (p=3), 99.26631959271373 (p=5). Ratios
        10.611048229739266 / 0.168481 / 0.023340 - the report's 10.611x, 0.168x
        and 0.023x. The measured-vs-modelled labelling is correct: N is a count
        of sieve vectors, Nf is a cost-model output.
    - id: MR-14
      claim: "the null-registry contradiction resolves as: both true of different statistics; section 5.3 is correct and the JSON field is defective"
      status: reproduced
      detail: >-
        Checked directly against the archived files. stage_b_results.json
        nulls[0].statistic names THREE group statistics under one field ("per
        candidate GROUP (adjacent-bin near-miss, uniform bin,
        secret-distribution bin): sd ratio to sqrt(1/2N), correct minus
        best-of-group, P(correct first)"), and statistic_reads_the_object says
        "YES" justified by the residual phase psi_i and explicitly by the
        CORRECT bin. Report section 5.3 says the opposite of the group
        statistics, with its own evidence: SENS-1 barely moves the near-miss sd
        ratio (1.09472 -> 1.14012 at p=2) and SENS-3 is non-monotone on 0 of 3
        instances at every p; and it separately confirms the correct bin DOES
        move (paired |z| median 14.8-31.3, max 101.0). So the two statements are
        about different statistics and the unqualified field is the defective
        one. The producer's resolution is correct.
      partial_dissent: >-
        The same registry entry also records can_it_fail: "YES, for every group
        AND for the correct bin". That one is not merely unqualified - "for
        every group" is contradicted by the package's own failed sensitivity
        demonstrations, and the producer's framing ("both statements are true of
        different statistics") does not cover it. A future correction should
        name can_it_fail as defective too, not only
        statistic_reads_the_object.

    # ------------------------------ the card's question 3 and question 4
    - id: MR-15
      claim: "the residual norm mismatch cannot explain the 1.27 vs 5.43 gap"
      status: reproduced
      confirmed_but_by_a_different_route: true
      producers_argument_as_stated: >-
        "excess is flat at 5.38-5.43 across a 2.2x range in mean ||x||^2 while
        the sieve at 181 sits at 1.27". The producer labelled this an argument
        for reviewers to test, not a result. It was right to. The evidence as
        given does not close it: the 2.2x range needs E3 (mean ||x||^2 470.5),
        an archived batch-3 red-team number measured with different scoring
        parameters and NOT re-measured here; the range measured in this run is
        1.85x (214.5 to 397.5); and every point in it comes from the SAME
        construction, so the argument extrapolates downward from 214 to 181 in a
        direction never sampled. See DEF-5.
      what_i_did: >-
        I built the family the producer's design excluded and the card asked
        for: VAL_SIEVE_SUMS, formed as v_i +- v_j over random pairs of g6k
        sieve vectors, deduplicated, N = 17919, certified 0/447,975 violating.
        It is a valid dual family of the same lattice with SIEVE provenance at
        MATCHED_LONG's norm scale.
      result: >-
        VAL_SIEVE_SUMS  mean||x||^2 362.5  mean||y||^2 258.1  excess 1.2115 (z 12.1)
        MATCHED_LONG    mean||x||^2 397.5  mean||y||^2 270.0  excess 5.3844 (z 695.7)
        Two certified valid dual families of the SAME lattice, within 10% of
        each other in mean ||x||^2 and 5% in mean ||y||^2, separating 4.4x
        apart. NORM SCALE THEREFORE DOES NOT DETERMINE THE EXCESS, and the
        residual +18%/+39% mismatch cannot be what separates 5.43 from 1.27.
        Further: doubling the sieve family's norms MOVES THE EXCESS DOWN
        slightly (1.2704 -> 1.2115), which also kills the reading that the
        sieve would climb toward 5.4 if its norms were raised. The producer's
        conclusion stands; its stated evidence did not establish it and mine
        does.
    - id: MR-16
      claim: "unexplained: the sieve database is the LEAST separating of three valid dual families, by 4x. Is that real, or an artifact of how the families were built?"
      status: reproduced
      answer: >-
        The observation is real - I reproduce all three excesses exactly - and
        it is an artifact of how the families were built. It is not about
        sieving in the sense the campaign meant, and it is not about norms.
      evidence_1_pair_reduction_moves_it: >-
        I built VAL_POOL_PAIRRED: one round of pair reduction on the SAME
        fpylll nearest-plane pool (pair reduction is precisely the operation the
        producer excluded on the grounds that "pair reduction is what a sieve
        does"), then the 17,919 shortest, deduplicated, disjoint from the sieve
        database (intersection 0), certified 0/447,975 violating.
        mean ||x||^2 211.2 (against MATCHED_BKZ's 214.5, essentially unchanged),
        mean ||y||^2 148.6 (against 179.1). Excess 3.2439, z 104.0. One
        sieve-like reduction step cuts excess-minus-one from 4.43 to 2.24 at
        unchanged ||x||^2. So the sieve/non-sieve axis IS doing work - but as a
        continuous property of database geometry, not as the binary the card's
        outcomes A and B assumed.
      evidence_2_a_model_that_predicts_all_five: >-
        Writing u_i = 2 pi x_i.E/q and phi_ik = 2 pi Y[i,k]/q, the near-miss
        spread is driven at first order by B_k = (1/N) sum_i sin(u_i) phi_ik,
        whose covariance over error draws is
        Cov[k,k'] = (1/N^2) phi_k^T S phi_k'  with
        S_ii' = 0.5 (exp(-c ||x_i - x_i'||^2) - exp(-c ||x_i + x_i'||^2)),
        c = 2 pi^2 sigma^2/q^2; the row-permuted arm replaces S by its diagonal.
        I computed this on the FULL 17,919-row databases (no subsampling) and
        Monte-Carlo'd the expected sample sd over the 8 near-miss candidates:
          family            measured excess   model excess
          SIEVE                 1.2704           1.290
          MATCHED_BKZ           5.4311           5.757
          MATCHED_LONG          5.3844           5.940
          VAL_SIEVE_SUMS        1.2115           1.235
          VAL_POOL_PAIRRED      3.2439           3.337
        Five families, 2-10% agreement, from a model whose only inputs are the
        x-database's pairwise-distance kernel and the y columns. Neither sieve
        provenance nor norm scale appears as a free parameter.
      what_the_quantity_actually_is: >-
        The excess measures the ALIGNMENT of the y columns with the
        near-neighbour structure of the x database. It is not raw clustering: I
        also measured the phase-free effective-neighbour count
        kappa = mean_i sum_{i'} (exp(-c||x_i-x_i'||^2) + exp(-c||x_i+x_i'||^2)),
        which is 6456 (SIEVE) > 4942 (PAIRRED) > 4761 (MATCHED_BKZ) > 1364
        (SUMS) > 1177 (LONG) - ANTI-correlated with the excess. So the sieve
        database is the most densely packed of the five and still the least
        separating; what varies is the quadratic form, not the clustering.
      placing_it_on_the_known_axis: >-
        This sits on the same one-parameter axis as the archived batch-3 red
        team's E1 (RT-20260803-d2e23e: no lattice, no sieve, no A, no modulus,
        y := x[0:25]) at excess 17.078. Ordered: SIEVE_SUMS 1.21 ~ SIEVE 1.27 <
        POOL_PAIRRED 3.24 < MATCHED_LONG 5.38 ~ MATCHED_BKZ 5.43 < E1 17.08. The
        producer's own section 5.1 hypothesis - "the nearest-plane families are
        internally structured, so their x-database is far more coherent at the
        frequencies a_k" - is essentially right and is now measured rather than
        named, with the correction that coherence AT THOSE FREQUENCIES, not
        coherence, is the operative quantity.

  # --------------------------------------------------------------- controls
  control_checks:
    - id: CC-1
      name: NULL-SIEVE (T1) - four-part obligation
      status: reproduced
      finding: >-
        Object, statistic, sensitivity demonstration and forced value are all
        stated, pre-registered in the archived script, and the forced values are
        stated for BOTH hypotheses (H_MEMBERSHIP: matched must separate;
        H_SIEVE: must not). The null could fail and did not fail in the way
        either hypothesis predicted. Admissible.
      objection: >-
        The sensitivity demonstration is scored against the WRONG arm. Report
        1.6 claims the statistic "separates a valid dual family from a
        norm-identical non-lattice family by a factor of ~50 in
        excess-minus-one", using MATCHED_BKZ (5.4311) as the comparison.
        Against the arm the null is actually about - the sieve, 1.2704 - the
        factor is (1.2704-1)/(1.0868-1) = 3.1, not 50. And NORMMATCH_RANDDIR is
        not itself cleanly null (z 2.4). See DEF-7.
    - id: CC-2
      name: NULL-IID (T2) - can it fail
      status: reproduced
      finding: >-
        Yes. Three sensitivity demonstrations, two archived and one live, and I
        re-measured the live one (0.940056 vs c4(8) 0.965030). Dynamic range
        [6.19e-15, ~1] on a statistic whose arms sit at 0.107-0.140. Admissible.
    - id: CC-3
      name: NULL-ROWPERM (the campaign's own null) - can it fail
      status: reproduced
      finding: >-
        No, and the producer says so and proves it. Every input to the closed
