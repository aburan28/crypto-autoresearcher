    ARGUMENT. I built two further certified valid dual families the producer's
    design excluded, and they settle it: the residual norm mismatch does not
    explain the 4x gap, and the gap is not about sieving either. It is a
    measurable property of the x-database's near-neighbour geometry, which I
    predict to 2-10 per cent for all five families from a first-order model
    containing neither provenance nor norms as a free input.
    The eight defects below are defects of reproducibility bookkeeping,
    archival completeness, an internal reference inconsistency carried into a
    durable knowledge entry, an unverifiable pre-registration claim, and two
    over-stated inferences. None is a fabrication. None changes a headline
