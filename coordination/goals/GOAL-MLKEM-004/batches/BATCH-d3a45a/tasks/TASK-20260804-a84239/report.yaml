    # ------------------------------------------------------------------ T2
    - id: MR-7
      claim: "pooled real 0.140324 and rowperm 0.106552; c4(8) = 0.96503"
      status: reproduced
      result: >-
        From the archived stage_a_results.json: real_mean 0.14032413691385667,
