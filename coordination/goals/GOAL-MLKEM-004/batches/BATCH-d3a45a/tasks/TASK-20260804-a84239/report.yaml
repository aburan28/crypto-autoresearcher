  # ------------------------------------------------------------- the defects
  defects:
    - id: DEF-1
      severity: medium
      class: reproducibility
      self_reported_by_producer: false
      title: The build stage is wall-clock-dependent, so the recorded command does not reproduce the recorded pool.
      detail: >-
        surrogate.py `_sample()` terminates its window loop on
        `time.time() - t0 < time_cap`, driven by `--pool-seconds 95`. The
        archived transcript shows this truncating window (k0=48, p=0.50) at
        350,000 of 1,200,000 draws and dropping both k0=54 windows entirely.
        A faster or slower machine therefore produces a different pool, a
        different matched family and different numbers, from the same command
        at the same revision. receipt.json completion_gate
        `reproduces_from_recorded_command_and_revision: true` is not correct as
        stated. MITIGATION, found by me: the transcript happens to record the
        realised per-window draw counts, and substituting them for the clock
        reproduces the entire build bit-for-bit - 8,750,000 drawn, 546,722 kept,
        27,550 distinct, 72 sieve collisions, match errors +0.0921/0.1142/0.1138
        and +0.1875/0.2178/0.1808, all identical. So the package IS
        reproducible, from the transcript rather than from the command. Fix is
        one argument: take a draw count, not a deadline.
    - id: DEF-2
      severity: medium
      class: archival_completeness
      self_reported_by_producer: false
      title: The raw vectors the entire task turns on are not in the snapshot.
      detail: >-
        results.json contains no vector data and the .npz work file lives only
        in /tmp. The headline certificate claim - "0 violating entries in
        2,032,675 checked, re-verified from A and the emitted integers" - is
        therefore NOT checkable from the snapshot, because the snapshot contains
        no emitted integers. I could only check it by regenerating the families,
        which required DEF-1's mitigation to work. AGENTS.md artifact policy
        requires "raw machine-readable results"; four int64 arrays of 17,919 x
        60 compress to a few MB. A validator who could not regenerate the pool
        would have had to take the certificate on trust.
    - id: DEF-3
      severity: medium
      class: internal_inconsistency
      self_reported_by_producer: false
      title: The "vs the model" factors are computed against 1.0 in the same paragraph that says the model is c4(8) and that using 1.0 is a non-negligible error.
      detail: >-
        7.126x = 1/0.140324 and 9.385x = 1/0.106552, i.e. against 1.0.
        results.json computes them literally as 1.0/value in the fields
        pooled_factor_below_iid_real and _rowperm. Against c4(8) = 0.9650304561
        they are 6.877x and 9.057x. Report section 2 asserts the correct
        reference, calls the 1.0 reference "a 3.5% error, not negligible at this
        effect size", and then tabulates the 1.0-referenced numbers under the
        column heading "vs the model". The same pair is carried into the durable
        knowledge entry KN-TECH-9d21c4 ("7.13x below", "9.39x below"). The
        qualitative conclusion is untouched; the durable artifact is
        self-contradictory. Note the archived stage_a.py already emits
        `sd_ratio_to_iid_c4_corrected`, so the corrected value was available at
        zero cost.
    - id: DEF-4
      severity: medium
      class: attribution
      self_reported_by_producer: false
      title: The both-arms-below-iid finding is presented as never reported; it was reported in the archived batch-3 red-team report.
      detail: >-
        Report section 2 says "This has never been reported in three batches and
        cost nothing to report." KN-TECH-9d21c4 repeats it: "The number cost
        zero compute, sat in the results file for three batches, and was never
        reported." It was reported, with the same two numbers, in
        BATCH-c45baf/tasks/TASK-20260803-d2e23e/notes.md section 3 ("What the
        heuristic's own null says, and nobody reported it": real arm 0.140, "a
        factor 7.1 below iid"; row-permuted 0.107, "a factor 9.4 below iid").
        KN-TECH-9d21c4 does list RT-20260803-d2e23e in source_refs, so this is
        not concealment, but a false priority claim now sits in a knowledge
        entry whose whole subject is intellectual honesty about controls. The
        batch-4 contribution here is the closed form and the forcing argument,
        which ARE new and ARE correct; the priority sentence should go.
    - id: DEF-5
      severity: medium
      class: overstated_inference
      self_reported_by_producer: partially
      title: The norm dose-response does not support the weight placed on it, and the 2.2x range imports an unmeasured number.
      detail: >-
        Report section 1.5 argues from flatness "across a 2.2x range in mean
        ||x||^2". The range measured in this run is 1.85x (214.5 to 397.5); 2.2x
        requires E3 (470.5), an archived batch-3 red-team number obtained under
        different scoring parameters (800 draws, 5 row-permutation realisations,
        different construction) and explicitly "not measured here". More
        seriously, all points lie in ONE construction and the inference runs
        DOWNWARD, from 214 to the sieve's 181 - a direction never sampled. The
        producer labelled this "an argument for you to test, not a result",
        which is the correct label and is why this is medium and not high. I
        tested it (MR-15) and the conclusion holds, by different evidence: two
        certified valid dual families at matched norms separating 4.4x apart.
    - id: DEF-6
      severity: medium
      class: unverifiable_claim
      self_reported_by_producer: partially
      title: The pre-registration ordering cannot be checked because v1 was not archived.
      detail: >-
        The claim that the PRE-REGISTRATION block was unedited between v1 and v2
        rests on a sha256 of surrogate.py v1 recorded at 07:02:02Z. v1 is not in
        the snapshot, so neither the hash nor the block's equality can be
        verified by anyone. This is exactly the check that separates
        pre-registration from post-hoc, and it was made uncheckable by not
        committing a 46 kB file. Recorded as unable_to_check, not as a finding
        against the producer: the frozen rule mechanically emits a verdict
        hostile to both of the card's named outcomes, which is evidence against
        post-hoc fitting, and the producer disclosed the edit itself.
    - id: DEF-7
      severity: low
      class: control_scoring
      self_reported_by_producer: false
      title: The T1 sensitivity demonstration is scored against the most-separating arm, not the arm under test.
      detail: >-
        Report section 1.6 states the statistic "separates a valid dual family
        from a norm-identical non-lattice family by a factor of ~50 in
        excess-minus-one", comparing NORMMATCH_RANDDIR (1.0868) against
        MATCHED_BKZ (5.4311). The arm the null is about is the SIEVE (1.2704),
        against which the factor is 3.1. Choosing the most favourable comparator
        overstates the demonstrated dynamic range by 16x. NORMMATCH_RANDDIR is
        also not itself cleanly null (z 2.4), which the receipt records as an
        anomaly but section 1.6 does not carry into the claim.
    - id: DEF-8
      severity: low
      class: bookkeeping
      self_reported_by_producer: partially
      title: Small internal discrepancies and a run-count that understates the build-and-select cycles.
      detail: >-
        (a) The "verbatim" transcript prints the fpylll discriminator at 0.23 s
        while report.md section 0 and receipt.json both say 0.24 s. My own
        measurement is 0.24 s; the discrepancy is between the producer's own
        transcript and its own summary. (b) receipt.json records
        measurement_runs_used: 2, counting only the score attempts. Build v1 was
        run, its match quality MEASURED (+37%/+75%), judged inadequate, and
        superseded by v2 with rejection sampling added. That is a
        build-measure-select cycle on a design target, so the reported match
        quality (11.4%/18.1%) is the better of two attempts. It is fully
        disclosed in the changelog and the transcript and the selection was on
        norm-match quality, not on the excess statistic - which is why this is
        low - but the run accounting does not show it. (c) "disjoint ... BY
        CONSTRUCTION" is a weaker justification than the claim; construction
        guarantees only that pool members equal to sieve members under
        sign-canonical keys were dropped. I verified the claim directly on the
        emitted family instead (MR-2), and it holds.

  # ------------------------------------------------ the technique entry (T3)
  technique_entry_review:
    entry: knowledge/techniques/KN-TECH-9d21c4.md
    read_as: a stranger who knows nothing about this campaign
    could_a_stranger_apply_it: mostly_yes
    what_works: >-
      The four-part obligation is ordered and short. The three failure modes are
      each given a worked case with a concrete, transferable tell - Mode 1's
      "the correct candidate's offset is y.(s-s) = 0, so the control is bitwise
      invariant"; Mode 2's "total removal must be at least as extreme as partial
      removal and on the same side"; Mode 3's "substitute the defining relation
      into the statistic and expand". "How to run step 4" gives three moves
      cheapest-first and correctly identifies move 3 (ask what the null
      hypothesis predicts NUMERICALLY for your statistic) as the one that gets
      skipped and is nearly free. The copyable YAML checklist is usable
      verbatim. The single most transferable line in the entry -
      `statistic_reads_the_object` is a property of an (object, statistic) PAIR
      and must be recorded per statistic, never per null - is stated precisely
      enough to check compliance mechanically, and is grounded in a real
      archived contradiction which I verified (MR-14).
    where_it_is_advice_rather_than_a_checkable_obligation:
      - >-
        OBLIGATION 3 IS THE WEAK ONE. "Exhibit a case where the statistic
        provably moves when the object is removed" states no threshold: how much
        movement, against what spread, at what sample size, and compared with
        which arm. This batch's own package shows why that matters -
        NORMMATCH_RANDDIR "moves" at z 2.4, and the entry gives no rule for
        whether that counts, while report 1.6 scores it against the most
        separating arm available (DEF-7). Concrete fix: require the
        demonstration to be reported as a signed effect against the SAME
        surrogate spread used for the headline, with the comparator arm named,
        and require the comparator to be the arm the null is about.
      - >-
        Obligation 4's exit condition - "if the derivation returns the observed
        sign and magnitude for free, stop" - is checkable only where a closed
        form exists. The entry partly repairs this with move 3, which is
        mechanical, but it should say plainly that move 3 alone discharges
        obligation 4 when moves 1 and 2 are infeasible.
      - >-
        Symbols are not defined for a stranger. `Y`, `q`, `k`, `u`, `N`, and the
        score itself appear in the closed form
        `c4(k) . rms(2 pi Y/q) . rms(sin u)/sqrt(1/2)` without saying that Y is
        the N x n matrix of dual y-vectors, that rms is over all its entries,
        that u is the error-induced phase, or what the underlying score is.
        a_x IS defined. I had to read the producer's code to get rms(Y) right.
        Three sentences would fix it.
      - >-
        `applicability` claims independence of cryptography, which is fair, but
        all three worked cases are the same campaign. A single non-lattice
        example would make the claim self-supporting.
    factual_defects_inherited_by_the_entry:
      - "the 7.13x / 9.39x table is referenced to 1.0, not to the c4(8) it advocates (DEF-3)"
      - "'was never reported' is false against the archived RT-20260803-d2e23e (DEF-4)"
    non_claims_carried_by_the_entry: adequate
    verdict_on_T3: >-
      Applicable by a stranger for moves 1 and 3 immediately; obligation 3 is
      currently advice and should be made checkable; two factual sentences
      should be corrected before the entry is relied on. This is a review
      finding only - AGENTS.md rule 12 is UNMET and UNWAIVED and I change the
      status of no KN-* entry and propose no change.

  # --------------------------------------------------------------- integrity
  fabrication_check:
    status: no_fabrication_found
    detail: >-
      Every number I could reach reproduced. I found no statistic, timing,
      command, citation or run in the package that does not correspond to
      something that happened. The producer volunteered eight items against
      itself, including that its central argument was untested, that its card's
      premise was wrong, and that total session wall clock exceeded budget while
      compute did not. Two of the eight defects above (DEF-5, DEF-6) are ones it
      partially flagged itself.
  rule12_status: >-
    UNMET and UNWAIVED, inherited from GOAL-MLKEM-003. This report changes the
    status of no EV-MLKEM-* record and no KN-* entry and proposes none.
  budget_note: >-
    The producer reported total session wall clock exceeding 3000 s against
    1055 s of compute and recorded it. I cannot verify either figure
    independently (self-reported timings, no external clock in the artifacts) -
    unable_to_check. My own compute: venv build 238 s, discriminators 10 s,
    build run 163 s, score run 187 s, coherence/clustering diagnostic 127 s;
    peak RSS 1211 MB (build) and 639 MB (score), both under the 6 GB cap.
    Two measurement runs used of two allowed (build, score); the clustering pass
    is a derived-statistics pass over the work file already produced, recorded
    here rather than hidden.

  limitations:
    - id: LIM-1
      text: >-
        ONE instance, toy scale (d = 60, q = 127). Nothing here replicates
        across instances. My two added families inherit that limitation exactly.
    - id: LIM-2
      text: >-
        My reproduction is CODE-independent, not SEED-independent or
        ENVIRONMENT-independent. I deliberately reused the producer's seeds and
        the same passagemath/fpylll/g6k versions so that an exact numerical
        comparison was possible. A seed-independent replication would be a
        different and additional check and I did not run one.
    - id: LIM-3
      text: >-
        "Valid dual family" throughout means membership in
        {(x,y) : y = A^T x mod q}. MATCHED_BKZ is a legitimate control for
        lattice membership; it is not a plausible dual-attack database. It
        consumes 65% of a 27,550-vector reachable pool that was hit 546,722
        times (a 20x internal duplication rate), and its norms are 18%/39% long.
        My VAL_POOL_PAIRRED shares that provenance.
    - id: LIM-4
      text: >-
        The first-order coherence model in MR-16 is exactly that: first order in
        the phase, with the expected sample sd obtained by Monte Carlo over the
        8x8 covariance. It agrees with measurement to 2-10% across five
        families, which is enough to identify the mechanism and not enough to be
        a quantitative theory. Its residual grows with the phase scale, in the
        same direction as the T2 closed form's does (0.6% -> 3.5%).
    - id: LIM-5
      text: >-
        VAL_SIEVE_SUMS was deduplicated but NOT screened against sieve
        membership, since it is sieve-derived by intent; a small number of its
        vectors may coincide with sieve database members. This does not affect
        its role, which is to hold provenance fixed while raising the norms.
    - id: LIM-6
      text: >-
        Certificates establish lattice membership only. No discrete-log solve,
        no factor-base relation, no attack and no solution certificate of any
        kind is claimed or verified anywhere in this package or this report.
    - id: LIM-7
      text: >-
        Independence is procedural, not model-level. Every participant across
        batches 1-4 of this campaign resolves to claude-opus-5, as the producer
        records. I ran in an independent session with my own instrument and my
        own code; that is the axis this check covers.

  answers_to_the_card:
    is_MATCHED_BKZ_a_valid_disjoint_dual_family: >-
      YES on both counts, verified independently. 0 violating entries in
      447,975 by int64 and by exact Python-bigint on a 400-row sample; 0 zero
      vectors, 0 duplicate (x,y), 0 duplicate x rows, 0 v/-v pairs;
      |MATCHED_BKZ intersect SIEVE| = 0 both sign-canonically and raw, checked
      on the emitted family rather than assumed from the construction; and the
      72 dropped collisions reproduce exactly.
    does_the_norm_mismatch_explain_the_4x_gap: >-
      NO. Established by construction, not by extrapolation: VAL_SIEVE_SUMS
      (362.5 / 258.1) separates at 1.2115 while MATCHED_LONG (397.5 / 270.0)
      separates at 5.3844 - matched norms, 4.4x apart. And raising the sieve
      family's norms 2x moves its excess slightly DOWN (1.2704 -> 1.2115). The
      producer's conclusion is right; the producer's stated evidence did not
      establish it.
    is_the_sieve_is_least_separating_observation_real_or_an_artifact: >-
      Real as a measurement, artifact as an interpretation. It is a property of
      how each family was built, and specifically of the alignment between the
      y columns and the near-neighbour geometry of the x database - a quantity I
      predict to 2-10% for all five families from a model containing neither
      provenance nor norms. One round of pair reduction on the fpylll pool - the
      sieve's own operation - moves the excess from 5.43 to 3.24 at unchanged
      ||x||^2, so the axis is continuous, not the binary that outcomes A and B
      assumed. It belongs on the same axis as the batch-3 red team's E1 (no
      lattice at all, excess 17.078). NONE OF THIS IS A MEASUREMENT OF THE
      INDEPENDENCE HEURISTIC, which remains untested after four batches - the
      producer's own section 5.4, which I confirm.

  artifact_paths:
