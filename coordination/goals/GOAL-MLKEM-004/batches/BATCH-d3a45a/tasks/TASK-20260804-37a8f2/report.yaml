  scope_banner: >-
    TOY SCALE. m=35, n=25, d=60, q=127, secret CB eta=2, error rounded-Gaussian
    sigma=2, ONE instance (BATCH-f75059 replicate 0). No ML-KEM break claim, no
    security proof, no FIPS 203 parameter set affected or cleared, no speedup, no
    cost claim, no exponent moved. AGENTS.md rule 12 UNMET and UNWAIVED: this
    report changes the status of no EV-MLKEM-* record and no KN-* entry and
    proposes none. Objections and observations only. I did not commit anything.

  verdict: blocking_objections

  verdict_note: >-
    The package's arithmetic is clean. Every number I could check reproduced,
    several of them from an instrument I rebuilt and a scorer I wrote from the
    definition rather than from surrogate.py. The producer's decision to emit
    C_NEITHER rather than pick a nearest label is correct and is the best thing
    in the batch. T2's forcing argument is CORRECT: I re-derived its closed form
    from first principles, independently, and obtained the producer's formula
    exactly, c4(8) and the 1/sqrt(1/2) included.

    The blocking objections are interpretive and there are two of them. FIRST:
    the producer's own null-admissibility argument is confounded, and I broke it
    by direct measurement. NORMMATCH_RANDDIR returns ~1 not because it is
    outside the lattice but because surrogate.py draws its Y independently of its
    X (lines 685-688). I built the arm the producer did not: the sieve's OWN
    ||x_i||, ||y_i|| row for row -- an EXACT norm match, better than
    MATCHED_BKZ's +17%/+40% -- on random directions NOT in the lattice, with y a
    fixed deterministic function of x. Excess 12.1507. A non-lattice family
    separates 9.4x harder than the sieve. Lattice membership is therefore not
    what the statistic reads, outcome A is excluded as an explanation exactly as
    outcome B is, and C_NEITHER was returned because the pre-registered
    dichotomy omitted the operative variable.

    SECOND: the "unexplained" 1.27 vs 5.43 is not unexplained. I give it in
    closed form. excess = sqrt(1 + rho) with
    rho = sum_{i!=i'} <y_i,y_i'> K(i,i') / sum_i ||y_i||^2 K(i,i),
    K(i,i') = .5[exp(-c||x_i-x_i'||^2) - exp(-c||x_i+x_i'||^2)], c = .5(2 pi
    sigma/q)^2. Measured with NO scoring at all: rho = 0.718 / 31.353 / 34.387
    giving predicted excess 1.3108 / 5.6880 / 5.9487 against measured 1.2937 /
    5.4461 / 5.4298 -- 1.3%, 4.4%, 9.6%. rho is linear in N, which I confirmed by
    subsampling to N' = 6000 (predicted 1.1138 / 3.3909, measured 1.1017 /
    3.3303). So the gap the producer proposes to spend batch 5 on is one
    computable functional of the two arrays, it carries no information about
    sieving or membership, and it is not even an intrinsic property of a
    construction because it scales with N. The producer's recommendation should
    be declined.

    I record in fairness what is NOT wrong here. No security claim anywhere in
    the package. Scope banners first and binding. states_a_conclusion false. The
    eight self-declarations are real and one of them corrects the Coordinator's
    own card. The design defect in T1 traces upstream to DEC-20260803-81b778
    NA-1, not to the producer, which executed the commissioned dichotomy exactly
    as commissioned.

  claim_under_review: >-
    That T1's C_NEITHER excludes outcome B while holding outcome A's direction;
    that the residual norm mismatch cannot explain 1.27 vs 5.43; that T1's null
    is admissible on the strength of the NORMMATCH_RANDDIR sensitivity arm; that
    the sieve database being the least separating of three valid dual families is
    "the first quantity in four batches whose sign was not forced in advance" and
    is worth batch 5; that T2's row-permuted arm was forced to fail the reference
    model; and that KN-TECH-9d21c4 is a reusable technique at
    confidence: verified_by_execution.

