  objections:

    - id: OBJ-1
      severity: blocking
      title: >-
        T1's null-admissibility argument is confounded. NORMMATCH_RANDDIR returns
        ~1 because its Y is drawn INDEPENDENTLY of its X, not because it is
        outside the lattice. I built the arm that separates the two and a
        NON-lattice family with the sieve's exact norms separates at 12.15.
      challenge: >-
        surrogate.py lines 684-688 draw Gx and Gy from the same generator as two
        INDEPENDENT normal matrices and rescale each to the sieve's row norms. So
        NORMMATCH_RANDDIR differs from a dual family in TWO ways at once: it is
        not in the lattice, AND its y carries no information about its x. The
        report's section 1.6 attributes its null to the first ("the statistic
        separates a valid dual family from a norm-identical NON-LATTICE family").
        That attribution is untested and it is wrong.

        MEASURED, by me. I ran two arms. (a) A replication of the producer's own
        construction: 0.9767 -- confirming the arm is null. (b) The same random
        directions, the same sieve norms ||x_i||, ||y_i|| row for row -- an EXACT
        norm match, strictly better than MATCHED_BKZ's +17%/+40% -- but with
        y_i := normalise(R^T x_i) * ||y_i||, R a fixed random 35x25 matrix, so y
        is a deterministic function of x. NOT in the lattice, no A, no modulus,
        no sieve. Result: excess 12.1507, z 530. Nine point four times the
        sieve's excess and 2.2x the matched family's. I swept induced clustering
        from none to strong (g = 1/30/30/100/300, eps = 1e9/0.25/0.10/0.10/0.06)
        and it stays at 10.7-12.2 throughout: the clustering is irrelevant, the
        COUPLING is everything.

        This is not new to the campaign and that is the aggravating part. The
        batch-3 red team wrote it in RT-20260803-d2e23e's
        counterexample_or_mutation, in these words: "Sieving is not necessary for
        the effect; the lattice is not necessary for the effect; a deterministic
        dependence of y on x is sufficient for it," with E1 at excess 17.078 and
        E2 (dependence removed at the source) at 1.0371. My arm is the
        norm-exact version of E1 and it agrees.
      consequence: >-
        The pre-registered dichotomy is a false dichotomy. Outcome B is excluded,
        as the producer says. Outcome A is ALSO excluded as an EXPLANATION -- not
        by magnitude, by a control: a family with no lattice membership at all
        separates 9.4x harder than the sieve. C_NEITHER is the right answer and
        the reason is that the operative variable, the strength of the y = f(x)
        coupling, was in neither branch. Section 1.6's "the null is admissible"
        does not follow from the evidence offered; the null happens to be
        admissible for the different reason my arm (b) and the archived E2
        supply, which is that the statistic can return 1 when the coupling is
        removed.
      cheapest_check: >-
        Change surrogate.py lines 685-688 to set Yr := normalise(Xr @ R) *
        sqrt(ys2) instead of drawing Gy independently, and rerun that one arm.
        Two seconds of numpy, no lattice, no sieve, no g6k, no fpylll. If it
        separates, outcome A is dead and batch 5 must not be spent on 1.27 vs
        5.43.

    - id: OBJ-2
      severity: blocking
      title: >-
        "The first quantity in four batches whose sign was not forced in advance"
        is also forced. I give 1.27 vs 5.43 in closed form, with no scoring, and
        it scales with N.
      challenge: >-
        Expand the score to first order in the phase offsets. For a near-miss
        candidate c_j = s + unit_j the offset is exactly -Y[i,j], one entry of y,
        so
          S_j - mean_j(S) ~= -(2 pi / qN) sum_i sin(psi_i) Y[i,j],
          psi_i = 2 pi x_i . e / q.
        Take the variance across candidates and average over error draws. The
        diagonal gives the producer's own forced rowperm value. The OFF-diagonal
        gives everything else:
          excess^2 = 1 + rho,
          rho = sum_{i != i'} <y_i,y_i'>_8 K(i,i') / sum_i ||y_i||^2_8 K(i,i),
          K(i,i') = .5[exp(-c||x_i - x_i'||^2) - exp(-c||x_i + x_i'||^2)],
          c = .5 (2 pi sigma / q)^2 = 0.00489525.
        MEASURED, with no scoring whatsoever, on the three families:
          SIEVE        rho  +0.718  -> predicted excess 1.3108, measured 1.2937 (1.3%)
          MATCHED_BKZ  rho +31.353  -> predicted 5.6880, measured 5.4461 (4.4%)
          MATCHED_LONG rho +34.387  -> predicted 5.9487, measured 5.4298 (9.6%)
        rho is a sum over pairs, so it is LINEAR IN N. Subsampling both families
        to N' = 6000 predicts sqrt(1 + rho N'/N) = 1.1138 and 3.3909 against
        measured 1.1017 and 3.3303 -- 1.1% and 1.8%.

        I also killed the obvious wrong reading, which was mine before I measured
        it. It is NOT near-duplicate clustering. The minimum sign-aware squared
        pairwise distance is MEDIAN 294 in the sieve and 364 in the matched
        family -- the matched family's vectors are FURTHER apart -- and neither
        family has a single pair below 100. Pair-separating each family with a
        greedy sieve-like filter at tau = 150/250/350 changes nothing (SIEVE
        1.0944 vs random-same-N 1.1017; MATCHED 3.2973 vs 3.3303). rho is a
        global second-moment covariance between <y_i,y_i'> and K(i,i'), not a
        near-neighbour effect.
      consequence: >-
        The 4x gap is one computable functional of the two arrays. It says the
        nearest-plane sampler produces a family whose y-inner-products co-vary
        with its x-inner-products 44x more strongly than a saturated sieve
        database does -- a statement about two vector-generation algorithms. It
        is not about sieving, not about lattice membership, and not about
        candidate-score independence. And because excess = sqrt(1 + rho_1 N), the
        campaign's headline 1.3169 is not an effect size at all: it is
        rho_1 = 4.1e-5 evaluated at whatever N bgj1 happened to return at d = 60.
        KN-TECH-9d21c4's own line 53-56 states this algebra; this is its first
        empirical confirmation, and it applies to the NEW quantity as much as to
        the old one.
      cheapest_check: >-
        Compute rho on each archived family and compare sqrt(1+rho) to the
        measured excess; then recompute at N' = N/3 by random subsample. Pure
        numpy on arrays the campaign already regenerates, one blocked N x N
        kernel pass, about 50 s per family at N = 17919, zero lattice compute. If
        it lands within ~10%, there is nothing left in 1.27 vs 5.43 to spend a
        batch on.

    - id: OBJ-3
      severity: major
      title: >-
        The norm-mismatch argument reaches the right conclusion by an
        under-powered route, and the report says so itself. Confirm it with the
        control, not with the two-point curve.
      challenge: >-
        Section 1.5 argues that because the non-sieve families sit at 5.38-5.43
        across a 2.2x range in mean ||x||^2, the residual +18%/+39% mismatch
        cannot explain 1.27 vs 5.43. The producer explicitly offers this as an
        argument for reviewers to test. Tested. The conclusion is CORRECT. The
        argument is not sufficient: two of the three points (214.5 and 397.5)
        come from the SAME sampler and the third (470.5) is E3, an archived
        number the table itself labels "not measured here", so the design cannot
        distinguish "excess does not depend on norms" from "excess is fixed by
        the construction, and these are all the same construction". Under OBJ-2,
        rho for MATCHED and LONG is 31.4 and 34.4 -- near-equal because they share
        a sampler, not because norms are irrelevant.

        The decisive version costs nothing: my OBJ-1 arm (b) has the sieve's
        norms EXACTLY, row for row, zero mismatch, and separates at 12.15 against
        the sieve's 1.29. Norm mismatch is thereby excluded at mismatch = 0.
      consequence: >-
        Keep the conclusion, discard the argument. A reviewer who accepted section
        1.5 as written would have accepted a within-construction comparison as
        evidence about a between-construction difference.
      cheapest_check: >-
        The same one-arm change as OBJ-1. It supplies a zero-mismatch point and
        retires section 1.5's dose-response entirely.

    - id: OBJ-4
      severity: major
      title: >-
        The design defect in T1 is upstream. DEC-20260803-81b778 NA-1 froze a
        dichotomy that the report proposing the control had already refuted in
        the same document.
      challenge: >-
        NA-1's why_it_decides says "If it separates at about 1.32, the central
        result is lattice membership and the lane is settled. If the sieve
        separates and the matched family does not, the red team is wrong."
        RT-20260803-d2e23e, the source of that control, records in the same file
        that its E3 -- a VALID dual family of the same A, fpylll BKZ, no sieve, 0
        membership violations on 447,975 entries -- separated at 5.4349, and
        states outright that the lattice is not necessary for the effect. So on
        the day NA-1 was written, the archived evidence already said the answer
        would be neither 1.32 nor 1.00. Outcome A was unreachable and outcome B
        was already dead.
      consequence: >-
        The producer executed the commissioned check faithfully and reported
        C_NEITHER honestly. The batch was nevertheless spent re-deciding a
        question the previous batch's own control had answered. Responsibility
        sits with the decision record, and the lesson is a fifth obligation for
        KN-TECH-9d21c4 (see OBJ-9): step 4 tells you to derive the forced value
        under "the alternative" and never asks whether your alternatives are
        exhaustive.
      cheapest_check: >-
        Before freezing any two-outcome decision rule, list every archived arm of
        the same statistic and check that at least one named outcome is
        consistent with all of them. Here: E1 17.078, E2 1.0371, E3 5.4349,
        rowperm 0.1058, y:=0 6e-15. Reading time, zero compute.

    - id: OBJ-5
      severity: major
      title: >-
        The headline object is not reproducible from the archived script and
        seeds. The pool construction is truncated on wall clock.
      challenge: >-
        surrogate.py _sample() runs `while done < per_window and time.time() - t0
        < time_cap` with --pool-seconds 110. On a machine that runs the windows
        at a different rate the cap fires at a different place. I ran the archived
        script, unmodified, with the archived seeds, in the producer's own venv,
        and got: 10,100,000 drawn (archive 8,750,000), 843,459 below cut (archive
        546,722), 29,032 distinct (archive 27,550), 74 sieve collisions (archive
        72), mean ||x||^2 212.67 (archive 214.54), mean ||y||^2 180.15 (archive
        179.08), median |rel err| 10.92%/18.94% (archive 11.38%/18.08%). The
        k0=54 windows produced 224,073 vectors for me and 0 for the producer.
        MATCHED_BKZ is therefore a different family in the two runs.
      consequence: >-
        Two things, opposite in sign. (a) A reproducibility defect: no future
        agent can regenerate the exact object behind "5.4311", and the receipt's
        seeds do not pin it. (b) A robustness result the producer could have
        claimed and did not: the PHENOMENON survives the nondeterminism -- I get
        5.4461 on a materially different pool with a scorer written from the
        definition. The number is fragile; the contrast is not.
      cheapest_check: >-
        Replace the wall-clock cap with a draw-count cap and record the resulting
        pool hash in the receipt. One line. Any future rerun then either matches
        the hash or is a different object, declared.

    - id: OBJ-6
      severity: moderate
      title: >-
        The 7.126x / 9.385x shortfalls are computed against 1.0, in the paragraph
        that insists 1.0 is the wrong reference. The snapshot commit message
        states them as being against c4(8).
      challenge: >-
        Report section 2 says the reference is "strictly c4(8) = 0.9650304561"
        and that "using 1.0 is a 3.5% error, not negligible at this effect size",
        then tabulates real 0.140324 -> "7.126x below" and rowperm 0.106552 ->
        "9.385x below". Those are 1/0.140324 and 1/0.106552. Against the stated
        c4(8) reference the factors are 6.877x and 9.057x. Commit message
        e8cc366e hardens the error: "Real 0.140324 = 7.126x below the iid
        prediction; row-permuted 0.106552 = 9.385x below, against a reference
        that is strictly c4(8) = 0.96503 and not 1.0." The clause is false of the
        two numbers it modifies.
      consequence: >-
        Small in magnitude, precise in kind: it is the exact error the paragraph
        exists to warn about, committed in the sentence that warns about it, and
        it has now propagated into KN-TECH-9d21c4's diagnostic table (0.1403 /
        0.1066 with "7.13x / 9.39x below") where it will be read by agents with
        no access to this campaign.
      cheapest_check: >-
        Divide 0.9650304561 by each arm and reprint. Two divisions.

    - id: OBJ-7
      severity: moderate
      title: >-
        Snapshot commit message e8cc366e says it draws no conclusion and then
        draws six, in the Coordinator's own present indicative, pre-review. This
        is the sixth commit-message defect in the program and the second of
        exactly this kind.
      challenge: >-
        The message opens "UNREVIEWED. Every number below is the producer's, with
        the producer's own qualifiers attached. I draw no conclusion." It then
        asserts, unattributed: (a) "T1 RETURNED NEITHER NAMED OUTCOME ... outcome
        B ... is EXCLUDED"; (b) "The matched family separates four times HARDER
        than the sieve" -- "separates" is an interpretation, not a number, so the
        every-number-is-the-producer's qualifier does not cover it; (c) "Outcome
        A's direction holds but not its magnitude"; (d) "T2, BOTH ARMS FAIL THE
        ASSUMPTION UNDER TEST" -- a heading that adopts as fact the very framing
        under review, that sd_ratio_to_iid IS the assumption under test (see
        RSC-1: it is a marginal-variance statistic, and the heuristic is about
        independence ACROSS candidate scores); (e) "the registry contradiction
        RESOLVED ... the JSON field is defective" -- a status word and a
        judgement on committed evidence, pre-review; (f) "The matched family is
        disjoint from the sieve database BY CONSTRUCTION", where the disjointness
        is produced by an explicit post-hoc filter, and where the count is
        build-dependent (OBJ-5). RT-20260803-d2e23e OBJ-9 raised item (b)'s exact
        class one batch ago and named the fix; it was not applied.
      security_claim_audit: >-
        NONE FOUND, and it should be said plainly. I searched report.md,
        surrogate.py, results.json, receipt.json, rebuild_transcript.txt,
        KN-TECH-9d21c4.md and the commit message for an ML-KEM break, a security
        proof, a FIPS 203 parameter set affected or cleared, a speedup, an
        exponent, a cost claim, or an EV-*/KN-* status change. There is none. The
        scope banner is first and binding in every artifact, states_a_conclusion
        is false in results.json, rule12_status is carried everywhere, and the
        commit message repeats the full non-claim paragraph. The seven items
        above are conclusion-drawing, one factual slip and one qualifier drop --
        NOT an overclaim.
      cheapest_check: >-
        Apply RT-20260803-d2e23e OBJ-9's own recipe, which this program already
        owns: grep the draft for evaluative adjectives and for any present-
        indicative verb applied to a producer conclusion, and prefix each
        survivor with "the producer reports". Under a minute.

    - id: OBJ-8
      severity: moderate
      title: >-
        The "factor of ~50 in excess-minus-one" divides by noise.
      challenge: >-
        Section 1.6 computes 50 as (5.4311-1)/(1.0868-1) = 4.4311/0.0868. The
        denominator is the NORMMATCH_RANDDIR arm's departure from 1, whose own
        reported z is 2.4 against six surrogate realisations. My replication of
        the identical construction returns 0.9767, i.e. -0.023. The ratio is
        therefore anywhere from "50" to negative depending on the draw, and
        quoting one digit of it as a dynamic-range figure overstates what six
        realisations support.
      consequence: >-
        The dynamic-range argument should rest on SENS-1 (y := 0, 6.19e-15), which
        is decisive and archived, not on a ratio with a noise denominator.
      cheapest_check: >-
        Report the RANDDIR arm as "consistent with 1" with its interval, and
        drop the ~50.

    - id: OBJ-9
      severity: moderate
      title: >-
        KN-TECH-9d21c4 is a real technique, not a rationalisation -- but
        confidence: verified_by_execution is not earned, it lacks the obligation
        that would have caught batch 4, and its cost paragraph overclaims.
      challenge: >-
        Would the four-part obligation have caught the three failures
        PROSPECTIVELY, at design time? My answer, mode by mode.
        MODE 1 (batch 1's null that could not fail): YES. Step 3 asks you to
        exhibit a case where the statistic moves; attempting that for the
        correct-secret score under row permutation fails in two lines
        (y_i.(s-s) = 0 for every i), and the failure IS the discovery. Cheap and
        prospective.
        MODE 2 (batch 2's NULL-V): YES. The maximal_removal_control -- total
        removal must be at least as extreme as partial and on the same side -- is
        a genuine forward test, runnable before you know the answer, and psi := 0
        landing on the opposite side would have fired it.
        MODE 3 (batch 3's forced excess): PARTIALLY, and this is where the entry
        overstates itself. Step 4 says derive the forced value under "the
        alternative". It does not ask whether your alternatives EXHAUST the
        space, and that is precisely how batch 4 failed. The producer executed
        step 4 impeccably -- two named hypotheses, both forced values derived and
        frozen before the run, mechanical verdict -- and got C_NEITHER, because
        the operative alternative (y = f(x) coupling strength, OBJ-1/OBJ-2) was
        in neither branch. A technique whose flagship step, correctly applied,
        returns "neither" on the batch that invented it has a demonstrated
        ceiling, and the entry does not record it.
        Three specific defects. (i) confidence: verified_by_execution -- verified
        by executing what? The entry was written in batch 4; its retrospective
        account of batches 1-3 is not execution, and its one live application
        returned C_NEITHER. (ii) source_refs lists TASK-20260804-7e6b54, the task
        that produced it: fine as provenance, not as corroboration. (iii) "Cost
        of not doing it: four batches of one campaign" asserts the check would
        have saved them. Unsupported, and batch 4 did the check and still did not
        answer the question. It should read "the check is cheap", not "it would
        have saved four batches".
        CREDIT, and it is substantial. The N-scaling algebra at lines 53-56 --
        "the ratio is sqrt(1 + 2Nb^2/k), which is NECESSARILY increasing in N" --
        is correct, non-obvious, and I have now confirmed it empirically for the
        first time (OBJ-2's subsample curve, 1.1% and 1.8%). The "which property
        causes the departure from your reference model, and does your null
        preserve it" generalisation is the best sentence in the campaign. Modes 1
        and 2 have real prospective catches. This is a technique.
      consequence: >-
        Keep the entry. Its confidence field and its cost paragraph should be
        corrected by a superseding entry, and a fifth obligation added:
        ALTERNATIVE EXHAUSTIVENESS -- before freezing a decision rule, list every
        archived measurement of the same statistic and verify that at least one
        named outcome is consistent with all of them. That obligation, and only
        that one, would have caught batch 4 prospectively.
      cheapest_check: >-
        Re-read the entry against its own checklist. `can_this_null_fail` is
        answered; `forced_value_derivation` is answered; there is no line asking
        `are_these_alternatives_exhaustive`. Reading time.
      rule12_note: >-
        I propose NO status change and NO edit. Under rule 12 UNMET and UNWAIVED,
        this is an objection for the Coordinator to weigh. I note only that a NEW
        knowledge entry asserting confidence: verified_by_execution on the
        strength of an unreviewed batch is functionally a promotion, and the
        creation-versus-transition distinction should not be allowed to carry it.

    - id: OBJ-10
      severity: minor
      title: Disjointness is not load-bearing and is presented as though it were.
      challenge: >-
        Both the report (section 1.1) and the commit message emphasise that the
        matched family is disjoint from the sieve database "by construction, not
        merely different from it". Two dense subsets of the short-vector region
        of the same 60-dimensional lattice are almost automatically disjoint as
        sets; the overlap before filtering was 72 of 27,550, i.e. 0.26%. And my
        OBJ-1 arm (b) is not merely disjoint from the sieve database, it is not
        in the lattice at all, and it separates at 12.15. Disjointness buys
        nothing here.
      cheapest_check: >-
        State the overlap fraction (0.26%) next to the word "disjoint" and let
        the reader price it.

  required_controls:
    - id: RC-1
      control: >-
        NORM-EXACT NON-LATTICE COUPLED ARM. The sieve's own ||x_i||, ||y_i|| row
        for row on random directions, with y a fixed deterministic function of x
        instead of an independent draw. One edit to surrogate.py lines 685-688.
      why: >-
        OBJ-1. It is the arm that separates "reads lattice membership" from
        "reads the x-to-y coupling", which no arm in four batches has done. I
        measure 12.1507 against the sieve's 1.29. Two seconds of numpy.
    - id: RC-2
      control: >-
        PAIR-COHERENCE FUNCTIONAL. Compute rho on each family and check
        excess = sqrt(1 + rho); recompute at N' = N/3 by random subsample.
      why: >-
        OBJ-2. Decides whether 1.27 vs 5.43 is an open question or a closed-form
        identity. I measure 1.3% / 4.4% / 9.6% agreement at full N and 1.1% /
        1.8% under subsampling. About 50 s per family, no lattice compute.
    - id: RC-3
      control: >-
        THE STATISTIC THE HEURISTIC ACTUALLY ASSERTS. The dual-attack
        independence heuristic is about independence ACROSS candidate scores.
        Measure the off-diagonal of the candidate-score covariance, and the
        distribution of max_k over K wrong candidates against its independent
        prediction -- not the marginal sd of 8 of them.
      why: >-
        RSC-1. Four batches have measured a marginal-variance statistic and
        called it a test of an independence assumption. This is the redirect and
        it needs no new lattice compute.
    - id: RC-4
      control: >-
        ADJACENT-FFT-BIN CANDIDATES through Stage A's comparison on all 9
        instances, with the N-dependence reported.
      why: >-
        Carried forward unmet from RT-20260803-d2e23e RC-4 / OBJ-3. It was not
        commissioned in batch 4. The s + e_k family is not one a dual attack
        enumerates, and on the family that IS enumerated (Stage B) the effect is
        absent and its p = 2 arm points the OPPOSITE way (0.9607 +/- 0.0187).
    - id: RC-5
      control: >-
        DIMENSION SWEEP AT FIXED N. rho is a second-moment covariance between
        <y_i,y_i'> and K(i,i'); isotropy in higher dimension should shrink it.
        Vary d at fixed N and report whether excess - 1 decays.
      why: >-
        This is the missing answer to "what parameter is supposed to destroy the
        signal". Growth in N is forced and proves nothing (KN-TECH-9d21c4 lines
        53-56, confirmed in OBJ-2). Decay in d at fixed N is not forced by
        anything I can derive, and it is the only direction in which this
        quantity could carry information that transfers toward scale. Untested in
        four batches.

  counterexample_or_mutation: >-
    The decisive mutation is one line and I ran it. Take the producer's
    NORMMATCH_RANDDIR arm -- the sieve's own ||x_i|| and ||y_i|| row for row on
    random directions not in the lattice -- and change ONE thing: instead of
    drawing Y independently of X (surrogate.py lines 685-688), set
    y_i := normalise(R^T x_i) * ||y_i||_sieve for a fixed random 35x25 matrix R,
    so that y is a deterministic function of x. Norms are then matched EXACTLY,
    row for row, mean ||x||^2 = 181.5 and mean ||y||^2 = 129.1 -- a strictly
    better match than MATCHED_BKZ's +17%/+40%. There is no lattice, no A, no
    modulus, no sieve, and no pair clustering (independent directions).
    Result: near-miss excess 12.1507, z 530.0, against the sieve database's
    1.2937 and the matched valid dual family's 5.4461. The producer's own
    construction, replicated in the same script, returns 0.9767.
    Sieving is not necessary. Lattice membership is not necessary. Clustering is
    not necessary. A deterministic dependence of y on x is sufficient, and its
    STRENGTH -- measured as rho -- orders all five families monotonically. That
    is the whole of 1.27 versus 5.43.

  baseline_comparison:
    applicable: partially
    note: >-
      No attack, no speedup, no cost claim and no exponent, so there is no
      Pollard-rho / BSGS / specialised-baseline row to contest and no
      time/memory/data axis is claimed on either side. What I DO charge, per
      KN-LIT-7593: nothing in this package eliminates a search dimension, so
      nothing is being taken for free. My own controls are charged in full --
      160.7 s to rebuild the instrument (one bgj1 sieve, one BKZ-20/30/40
      schedule, 10.1M nearest-plane draws) and 168.6 s for all scoring, pair
      kernels and subsample controls, single process, peak well under the 6 GB
      cap, 2 runs against a budget of 2. The rho computation that replaces batch
      5's proposed work costs one blocked N x N kernel pass per family, about
      50 s at N = 17919 and O(N^2 m) in general -- which is itself worth stating,
      because it does not scale, and any future use of rho at larger N must
      charge it.
    dominated_by: >-
      n/a (no attack, no cost, no speedup and no exponent claimed by the package
      or by this review). Checked against every axis: time unclaimed, memory
      unclaimed, data/queries unclaimed, on both sides. This is not an unchecked
      null.
    sota_delta: >-
      none claimed. This review contributes a measurement-validity result -- a
      closed form for the campaign's headline contrast and a control that
      excludes both of its candidate explanations -- and no attack.

  heuristic_challenges:
    - id: HC-1
      challenge: >-
        The package asserts no numbered extrapolation heuristic and says so. I do
        not fault it. For the record, transfer of anything here toward
        cryptographic parameters would additionally need: (HX-1) that d = 60,
        q = 127, one sieve, one modulus, ONE instance persists at ML-KEM
        dimensions -- untested, and T1 is one instance by the producer's own
        declaration; (HX-2) that s + e_k has an analogue in a real dual attack --
        the campaign's own Stage B says it does not; (HX-3) that excess measures
        anything other than rho -- OBJ-2 says it does not, at any scale, because
        the derivation is dimension-free; (HX-4) that rho itself carries
        information, which requires RC-5's decay in d and is the only open door I
        can see. None of these is asserted here.
    - id: HC-2
      challenge: >-
        The frozen decision rule is genuine pre-registration and I checked it for
        flattery: the bracket [1.135, 1.541] was declared before the run, the
        verdict was emitted mechanically, and the producer refused to re-score
        against a different rule. That is correct conduct and rare. The rule is
        nevertheless the wrong instrument, for OBJ-4's reason and not for any
        reason internal to it: a two-branch rule cannot return the right answer
        when the operative variable is in neither branch, and pre-registration
        does not protect against that. This is the gap KN-TECH-9d21c4 should
        close (OBJ-9).
    - id: HC-3
      challenge: >-
        The pre-registration block's integrity: the producer declares that
        surrogate.py was edited between build and score with the block unedited,
        and records a sha256 of v1 timestamped 2026-08-05T07:02:02Z. I can verify
        the block is textually consistent with the emitted PREREG dict and that
        the v2 changelog is present and specific. I CANNOT verify from artifacts
        that the block was unedited across that boundary, because the v1 file
        itself is not archived -- only its hash. unable_to_check, recorded, not a
        finding. Archiving v1 alongside v2 would have closed it for free.

  cost_model_challenges:
    - id: CMC-1
      challenge: >-
        No cost claim exists in this package to challenge. Stage B's modelled
        figures are labelled MODELED and I did not recompute them --
        unable_to_check, recorded as such.
    - id: CMC-2
      challenge: >-
        N is not a free parameter and the campaign keeps treating it as scenery.
        excess = sqrt(1 + rho_1 N) (OBJ-2, measured), so every statement about the
        excess must name the N that produced it and the sieve dimension and
        memory that supplied that N. The archived headline 1.3169 is
        rho_1 = 4.1e-5 at N = 17919. Quoting it without N is quoting a number
        with a free multiplier in it.
    - id: CMC-3
      challenge: >-
        The producer's recommended batch-5 work -- 1.27 vs 5.43 at more than one
        instance -- has a cost and it should be priced against what it buys.
        Nine instances of the T1 build is roughly nine times 160 s of sieve plus
        BKZ plus 10M nearest-plane draws, and it buys an error bar on a quantity
        that OBJ-2 computes in closed form from arrays already in hand. RC-1
        costs two seconds and decides more.

  reduction_and_scope_challenges:
    - id: RSC-1
      challenge: >-
        The load-bearing scope error in the campaign, and it is inherited, not
        introduced here. The dual-attack independence heuristic asserts that
        WRONG-CANDIDATE SCORES ARE INDEPENDENT ACROSS CANDIDATES. sd_ratio_to_iid
        is the MARGINAL standard deviation of 8 such scores divided by
        sqrt(1/2N). Its shortfall below 1 is explained entirely by a variance
        computation -- sd ~ rms(2 pi Y/q) * rms(sin psi) -- i.e. by the phase
        offsets being small, i.e. by ||y|| being short, which is the DEFINING
        property of a dual vector. "Short dual vectors have short y" is a
        tautology, not a test of independence. Both the report's section 2 and
        commit message e8cc366e call this quantity "the assumption under test".
        It is not. This is why both arms can fail it, why the ratio between two
        failing arms was uninformative, and why the new quantity is uninformative
        for the same reason one level up. The corpus records the actual live
        question -- KN-LIT-7666 describes the Ducas-Pulles (Crypto 2023)
        independence-heuristic objection and the contradictory regime -- and it is
        about across-candidate score behaviour, which this campaign has never
        measured. I cite that entry as a pointer to the record, not as a
        citation in itself.
    - id: RSC-2
      challenge: >-
        No scope inflation found in the package. It narrows itself repeatedly,
        declares T1 is one instance not nine, declares the norm match partial,
        declares its own section 1.5 an argument rather than a result, declares
        its script was edited mid-run, declares its wall clock over budget, and
        declares the Coordinator's card premise wrong. Section 6's non-claims are
        complete and correct. I could not find a sentence that inflates
        affected-versus-safe scheme scope, because there is no scheme scope
        statement at all -- correctly.
    - id: RSC-3
      challenge: >-
        The T4b resolution is correct on the merits and I endorse it: whether a
        statistic reads an object is a property of an (object, statistic) pair.
        But the package resolves an archived contradiction in a producer report
        and the Coordinator's commit message then states it RESOLVED and the JSON
        field DEFECTIVE. Under rule 4 a correction supersedes; it does not get
        settled by a producer paragraph and a commit message. This belongs in a
        decision record with a superseding entry, and rule 12 UNMET means it
        cannot be one yet. Record the observation, hold the transition.

  proof_architecture_challenges:
    - id: PAC-1
      challenge: >-
        No theorem, asymptotic bound, certificate family or reduction is
        proposed, so proof_search_map does not apply and its absence is correct,
        not an omission. I record why rather than omitting it silently, per
        inventor-protocol section 8.
    - id: PAC-2
      challenge: >-
        The one audit that DOES apply and was not run is the METHOD CEILING WITH
        A NEARBY-OBJECT CONTROL (inventor-protocol 8.4): bound what the method
        could show under ideal tuning, then apply it to the closest object where
        the hoped-for conclusion FAILS. The nearby object here is a family that
        is not in the lattice but has the same coupling -- my OBJ-1 arm (b). The
        method cannot distinguish it from a valid dual family; in fact it ranks
        it FURTHER from the sieve than the valid dual family is. A method that
        cannot distinguish that pair has not identified the load-bearing
        structure. This audit costs two seconds and it is the whole of RC-1.

  narrowest_supported_statement: >-
    On one toy instance (m=35, n=25, d=60, q=127, sigma=2, secret CB eta=2,
    BATCH-f75059 replicate 0), the near-miss sd-ratio excess over a
    row-permutation surrogate takes the values 1.27 for a g6k bgj1 sieve
    database of N=17919 dual vectors, about 5.43 for two valid dual families of
    the same lattice produced by randomised nearest-plane sampling over a BKZ-40
    basis, and about 1.0 for a norm-matched family of random directions whose y
    is drawn independently of its x. These values are reproduced on an
    independently rebuilt instrument and an independently written scorer, to
    1.8%, 0.3% and within noise respectively. They are predicted, without any
    scoring, by excess = sqrt(1 + rho) to 1.3%, 4.4% and 9.6%, where rho is the
    kernel-weighted pair covariance defined in OBJ-2, and rho is linear in N,
    confirmed by subsampling to 1.1% and 1.8%. A family with the sieve's exact
    norms, not in the lattice, whose y is a deterministic function of its x,
    gives 12.15. Therefore: the ordering of these numbers is a property of the
    coupling between x and y in each construction and of N; it is not evidence
    about sieving, about lattice membership, or about the dual-attack
    independence heuristic. Nothing here concerns ML-KEM, any FIPS 203 parameter
    set, any attack cost, or any security property in either direction.

  batch_5_recommendation:
    verdict: CHANGE
    do_not_close: >-
      Closing would be premature and I say so under inventor-protocol section 4.
      There is a named, unexhausted question with forward guidance: the campaign
      has never measured across-candidate score dependence (RC-3), has never run
      the candidate family a real dual attack enumerates through the comparison
      at 9 instances (RC-4, unmet since batch 3), and has never asked what
      parameter is supposed to DESTROY the quantity (RC-5). An obstruction has
      been named for the row-permutation excess specifically -- it equals
      sqrt(1 + rho_1 N) and rho is a construction property -- and that closes ONE
      COMPARISON, not the question behind it.
    do_not_continue: >-
      Decline the producer's own recommendation. Chasing 1.27 vs 5.43 at more
      than one instance would replicate a construction-determined ordering across
      instances, which is precisely the failure KN-TECH-9d21c4 was written to
      prevent, applied to a new number. Replication and informativeness are
      orthogonal, by the campaign's own new technique entry.
    cheapest_check_that_decides_it: >-
      RC-1. Edit surrogate.py lines 685-688 so the RANDDIR arm's Y is a fixed
      deterministic function of its X instead of an independent draw, and rerun
      that one arm. Two seconds of numpy, no lattice, no sieve, no g6k, no
      fpylll, one instance, arrays already in the work file. If it separates
      strongly -- I measure 12.1507 -- then lattice membership is excluded as the
      explanation exactly as sieving already is, the 1.27-vs-5.43 question is
      answered rather than opened, and batch 5 goes to RC-3 and RC-4. If it
      returns ~1, my OBJ-1 and OBJ-2 are wrong and the producer's open question
      stands, in which case chase it -- but chase rho (RC-2), not more instances.

  next_concrete_action: >-
    Coordinator: dispatch RC-1 as a single two-second arm before any batch-5
