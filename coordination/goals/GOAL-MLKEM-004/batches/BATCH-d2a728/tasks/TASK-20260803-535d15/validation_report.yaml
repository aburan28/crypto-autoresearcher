        re-run the deterministic script rather than reading from the file.
        The executor correctly identified this limitation and recommended
        emitting vectors in batch 2. It does not affect admissibility of the
        33 declared candidates' scores.
      action: batch-2 fix per executor's recommendation

    - id: DEF-2
      severity: deferred
      description: >-
        Single LWE instance (one draw of A, s, e from instance seed
        20260803001). Instance-to-instance variation is entirely unmeasured.
        All reported scores are statistics over the 17,919 sieve vectors from
        this one instance. This is a scope limitation, not a defect in the
        measurement.
      action: acknowledged limitation; batch 2 or later to assess multi-instance variation

    - id: DEF-3
      severity: minor
      description: >-
        Model fallback recorded: executor policy was executor-implementation
        (resolves to anthropic:claude-sonnet-5), but session ran claude-opus-5
        with AUTORESEARCH_* unset. fallback_allowed was true in the task card.
        This is correctly recorded in the receipt and snapshot receipt.
        The fallback does not affect data integrity.
      action: none; correctly documented

    - id: DEF-4
      severity: minor
      description: >-
        Sieve quality parameters (saturation_ratio, threads, etc.) left at
        g6k defaults, and their effect on the database size or vector
        distribution is uncharacterized. The measured norm range [218, 329]
        (median 315) is ~58% above the Gaussian heuristic minimum (~199),
        suggesting the sieve stopped before saturation. Whether different sieve
        parameters would change the scoring distribution is unmeasured. This
        is a scope limitation, not a defect.
      action: batch-2 investigation if relevant to the comparison

