    - id: L3
      producer_text: >-
        DECAY_uniform_error's "rank 1 of 5" at mean +0.009 is uninformative
        with 4 wrong candidates at noise level.
      status: reproduced
      finding: >-
        Accurate and appropriately self-critical. Reproduced: correct +0.008977
        against four uniform candidates at +0.003231 mean; the four
        wrong-candidate means span roughly the same 0.003-0.012 band. The
        producer names it as uninformative rather than reporting residual
        signal. The same caution applies to DECAY_sigma8's rank 3/5 and
        sigma16's 4/5, which are equally uninformative in the other direction
        and are not over-read either.
    - id: L4
      producer_text: >-
        Reproduction is bit-identical in content but not in sha256; five
        wall-clock timing leaves differ.
      status: reproduced_with_a_precision_correction
      finding: >-
