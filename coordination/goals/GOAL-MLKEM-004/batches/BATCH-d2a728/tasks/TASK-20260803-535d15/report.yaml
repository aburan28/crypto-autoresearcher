      consequence for independence: this validation was produced in a separate
      session from the producer's, satisfying independent_session_required,
      but by the same underlying model - the correlated-judgement failure mode
      AGENTS.md names for the closure quorum applies in weakened form here and
      should temper how much independent corroboration this report is read as
      providing.
    - >-
      Rule 12 is UNMET and UNWAIVED. Nothing in this report changes the status
      of EV-MLKEM-011/013/015/017/018/019/020/021/af61e7 or of any KN-* entry.

