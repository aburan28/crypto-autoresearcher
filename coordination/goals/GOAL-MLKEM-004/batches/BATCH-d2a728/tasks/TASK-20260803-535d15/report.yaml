  metric_recomputations:
    - metric: instance_regenerated_from_recorded_seeds
      status: reproduced
      method: my own generator, written from report.md section 2, not from measure_scores.py
      detail: >-
        numpy default_rng(20260803001) reproduces A (35x25) and the secret s
        (centred binomial eta=2) and e_main (rounded Gaussian sigma=2) EXACTLY
        as emitted; b_main == A s + e mod q recomputed exactly.
        default_rng(20260803003) reproduces b_null exactly.
        default_rng(20260803004) reproduces all six decay error vectors and all
        six decay targets' b exactly. default_rng(20260803002) reproduces all
        16 uniform and all 8 secret-distribution candidates exactly. The 8
        near-miss candidates equal s with +1 at coordinate i mod n as stated.
        All 33 candidate vectors are pairwise distinct; no wrong candidate
        coincides with s (the file's coincidence flags are correct).
        |s|_inf=2, |e|_inf=4, empirical e sd 1.929 - matches report.md.
    - metric: sieve_run_reproduced_independently
      status: reproduced
      detail: >-
        My own driver (dual basis built from A alone, FPLLL seed 20260803005,
        Siever seed 469431436621 = 0x6D4C4B454D, SieverParams(threads=1),
        initialize_local(0,0,60), bgj1_sieve) produced 17919 vectors in 16.76 s
        (producer 17919 in 16.55 s). LLL 0.03 s both.
    - metric: lattice_membership_certificate
      status: reproduced
      independence: recomputed by validator code, independent of g6k AND of measure_scores.py
      detail: >-
        On the re-run vectors I checked y == A^T x (mod q) over the full
        17919 x 25 residual matrix = 447975 integer entries: 0 nonzero entries,
        0 all-zero vectors. Second, fully independent route: B^-1 v is integral
        for all 17919 vectors against the ORIGINAL (unreduced) dual basis
        B = [[I_m, A],[0, q I_n]], maximum deviation from an integer 1.31e-13.
        The producer's claim of 17919 checked / 0 violations is exact.
      abort_path_check: >-
        measure_scores.py lines 241-246 write results.json with aborted=true
        and sys.exit(3) before any score is computed if cert["verified"] is
        false; scoring begins at line 342. The claimed abort ordering is real
        in the code.
    - metric: certificate_checkability_from_raw_scores_json_alone
      status: partially_checkable_see_defect_1
      detail: >-
        (x,y) are not emitted, so full membership cannot be re-verified from
        the JSON alone. What IS verifiable from the JSON: t_i(correct) on MAIN
        equals the independently emitted x_i.e for all 17919 vectors, which
        certifies (A^T x - y).s == 0 mod q per vector - one linear functional
        of the membership residual, not the whole certificate. Full
        verification required the re-run above, which I performed.
    - metric: results_json_fully_rederived_from_raw_scores_json
      status: reproduced
      detail: >-
        Recomputed from the raw integer phases with my own code: 72 cosine
        arrays equal round(cos(2*pi*t/q), 6) elementwise; 96 per-candidate
        means; 8 correct-label means; 8 wrong mean-of-means; 8 wrong max, min
        and sd of means (ddof=1); 8 ranks; all 105 array lengths equal
        N=17919; every phase centred in (-q/2, q/2]. TOTAL MISMATCHES: 0.
        The producer's "72 arrays / 96 means / 8 ranks" counts are exact.
    - metric: per_vector_norm_identity
      status: reproduced
      detail: >-
        ||v||^2 == ||x||^2 + ||y||^2 for all 17919 vectors. Norms
        min 218 / median 315 / max 329 / mean 311.405 match results.json
        exactly. No all-zero vector. Mean ||x||^2 = 181.85, mean ||y||^2 =
        129.56.
    - metric: dual_vector_y_recovered_from_phases_alone
      status: reproduced
      significance: stronger check than the producer performed
      detail: >-
        Using t(s') - t(s) = -y.(s'-s) mod q, the 32 candidate differences have
        rank 25 = n over Z_127, so y is fully determined for every vector from
        the emitted phases alone. Results: the 7 redundant equations give
        7 x 17919 = 125433 consistency constraints, ALL zero; ||recovered y||^2
        equals the independently emitted norm2_y for all 17919 vectors, 0
        mismatches; recovered y entries lie in [-9, 10] against q/2 = 63.
        The re-run's actual Y matrix equals the recovered y matrix elementwise
        and in the same row order.
    - metric: x_dot_e_main
      status: reproduced
      detail: >-
        Recomputed centre_mod(X.e, q) from the re-run vectors equals the
        emitted x_dot_e_main array exactly. Its sd is 25.63, range [-63, +63]
        against q/2 = 63.5, and 76.69 percent of vectors have |x.e| < q/4 -
        report.md's three figures reproduce to the digits quoted.
    - metric: report_md_group_tables
      status: reproduced
      detail: >-
        MAIN (sigma=2): correct +0.42738; near-miss n=8 mean +0.42496 min
        +0.42349 max +0.42672 sd 0.00108; secret-distribution n=8 mean
        +0.29062 min +0.26510 max +0.32165 sd 0.02396; uniform n=16 mean
        +0.00385 min -0.00708 max +0.01388 sd 0.00606. NULL: correct +0.00330;
        uniform mean +0.00112 min -0.01019 max +0.01010 sd 0.00504;
        secret-distribution mean +0.00828 min +0.00494 max +0.01056 sd 0.00216;
        near-miss mean +0.00337 min +0.00163 max +0.00408 sd 0.00086. Every
        cell of both tables reproduces.
    - metric: decay_sweep_seven_points
      status: reproduced
      detail: >-
        sigma 0.5 / 1 / 2(MAIN) / 4 / 8 / 16 / uniform ->
        +0.949240 / +0.841150 / +0.427375 / +0.018271 / +0.004641 / -0.003712 /
        +0.008977. Monotone non-increasing across sigma 0.5..16. Ranks
        1/5, 1/5, 1/33, 1/5, 3/5, 4/5, 1/5 reproduce. Note the sigma=2 point in
        the sweep table is the MAIN target, drawn from a different RNG stream
        (instance seed) than the five DECAY points (decay_errors seed); the
        splice is legitimate for the correct-secret mean, which does not depend
        on the candidate subset, and report.md labels the row "MAIN".
    - metric: independent_theoretical_prediction_of_the_decay
      status: reproduced
      method: validator-derived, not present in the producer package
      detail: >-
        For fixed x and Gaussian e, E[cos(2 pi x.e / q)] =
        exp(-2 pi^2 sigma^2 ||x||^2 / q^2). Averaging this over the emitted
        norm2_x array gives predicted correct-secret means
        +0.94592 / +0.80097 / +0.41466 / +0.03334 / +0.00001 / +0.00000 for
        sigma 0.5 / 1 / 2 / 4 / 8 / 16 against the observed
        +0.94924 / +0.84115 / +0.42738 / +0.01827 / +0.00464 / -0.00371.
        The prediction tracks the measurement across four orders of magnitude
        of decay (residual departures are consistent with the error being a
        ROUNDED rather than continuous Gaussian, which perturbs the effective
        variance most at small sigma). This independently confirms that the
        measured signal is the ||x||-driven dual-attack score and not an
        artifact of the scoring code.
    - metric: sieve_database_composition
      status: reproduced
      significance: not claimed by the producer; relevant to batch 2 sample size
      detail: >-
        All 17919 recovered y columns are pairwise distinct, and no y column's
        negation appears in the database. The db is therefore 17919 distinct
        vectors with one representative per +/- pair; there is no effective
        sample-size inflation from sign duplicates.
    - metric: rank_tie_breaking
      status: reproduced
      detail: >-
        rank = 1 + (means[1:] > means[0]).sum() uses a strict inequality, so an
        exact tie would be broken in favour of the correct label. No exact tie
        occurs in any of the 8 targets (smallest gap to the correct label is
        3.69e-05, in the NULL). The bias had no effect here; flagged for batch 2
        where coarser statistics could produce ties.
    - metric: reproduction_content_identity
      status: reproduced
      detail: >-
        I re-ran the archived measure_scores.py with the archived seeds into a
        fresh directory. Leaf-level recursive diff against the committed
        raw_scores.json over 2942 leaves (arrays longer than 200 compared by
        sha256 of their JSON serialisation, so every one of the ~2.5 million
        emitted integers is covered): 3 leaves differ, and all three are
        wall-clock timings - certificate.check_seconds 0.02 vs 0.022,
        targets[1].scoring_seconds 0.049 vs 0.035, targets[7].scoring_seconds
        0.007 vs 0.006. Every scientific value is identical. The producer's
        surviving repro directory also differs from the committed file in 5
        leaves, all timings. See defect 6 on the number "five".

  # ------------------------------------------------------------------ #
  secret_leakage_checks:
    - check: scoring_code_path_identity
      status: reproduced
      detail: >-
        measure_scores.py computes every candidate's phase in a single
        vectorised expression, phases_for_target() lines 280-284:
        center_mod(X.dot(bvec)[:, None] - Y.dot(cand_matrix.T), q).T. The
        correct secret is candidate index 0 of that same matrix. There is no
        branch on candidate index anywhere in the computation. The only
        `ci == 0` test in the file (line 359) governs whether a cosine array is
        EMITTED for decay targets; it does not affect any computed value.
    - check: instance_generation_cannot_favour_the_correct_candidate
      status: reproduced
      detail: >-
        The dual basis is a function of A only (lines 107-114). s and e are
        drawn from the same stream but are never referenced by the basis, LLL,
        or the siever. The candidate stream is separately seeded.
    - check: empirical_proof_that_the_vectors_are_a_function_of_A_alone
      status: reproduced
      significance: this is the decisive check
      detail: >-
        My driver executes in a deliberately different order from the
        producer's: it derives A from the instance seed, builds the dual basis,
        runs LLL and bgj1_sieve to completion, and only THEN draws the secret.
        The database it produces is identical to the producer's - proven three
        ways: its Y matrix equals the y matrix I recovered from the committed
        phases elementwise and in row order; its ||v||^2, ||x||^2 and ||y||^2
        arrays equal the emitted norm2_v, norm2_x, norm2_y exactly; and its
        x.e equals the emitted x_dot_e_main exactly. The producer's 17919
        vectors are therefore a function of A and the fixed seeds alone and
        cannot encode anything about the secret.
    - check: phases_recomputed_by_an_independent_single_path_scorer
      status: reproduced
      detail: >-
        I recomputed all 33 candidate phase arrays for MAIN and all 33 for NULL
        (66 arrays x 17919 vectors = 1182654 integers) with my own one-line
        vectorised scorer applied uniformly to the whole candidate matrix.
        Mismatches against the committed file: 0.
    - check: no_privileged_information_in_the_candidate_construction
      status: reproduced
      detail: >-
        The 8 near-miss candidates ARE constructed from s (s with +1 at one
        coordinate) and this is disclosed in report.md, results.json candidate
        metadata, and the score table. They are labelled a distinct population
        and their scores are reported separately. That is disclosure, not
        leakage. The 16 uniform and 8 secret-distribution candidates are drawn
        from an independently seeded stream and were reproduced by me from that
        seed.
      consequence: see defect 3

  # ------------------------------------------------------------------ #
  control_checks:
    - control: null_object
      required_by: task card completion gate; docs/inventor-protocol.md section 3
      status: reproduced
      shape_assessment: correct_shape_with_two_recorded_caveats
      detail: >-
        The null replaces b by a uniform draw from Z_q^m and changes nothing
        else. Verified rather than assumed: the candidate label list is
        identical to MAIN's in the same order; the vector count is identical;
        b_null regenerates from the declared seed 20260803003; no error vector
        is injected (error_vector is null); and - the decisive check - the 32
        phase differences under the NULL reproduce from the SAME recovered y
        matrix as the MAIN target's, as do all six DECAY targets'. All eight
        targets in the file were provably scored against one common set of dual
        vectors. The null removes the signal and nothing else.
      outcome_reproduced: >-
        Correct secret mean +0.003298, rank 18 of 33, z = -0.0370 against the
        pooled wrong-candidate mean (report.md's "-0.04"). Chi-squared of the
        null's correct-secret phase histogram over Z_q is 139.4 on 126 degrees
        of freedom, consistent with uniform; the same statistic on MAIN is
        6689.1, strongly non-uniform. Per-vector mean/sem is +0.62 under the
        null against +99.21 on MAIN. The pipeline does not find structure that
        is not there.
      caveats: see defects 2, 3 and 4
    - control: decay_control
      required_by: docs/inventor-protocol.md section 3, the canonical artifact tell
      status: reproduced
      detail: >-
        The quantity that should decay does decay: monotone non-increasing over
        sigma 0.5 -> 16, from +0.94924 to -0.00371, reaching the
        wrong-candidate noise level (~0.003) by sigma=8. report.md section 4.2
        states explicitly what the quantity should do and that it does it. The
        uniform-error point (+0.00898) sits above the sigma=16 point
        (-0.00371), but both are at noise and the producer flags exactly this
        row as uninformative on its own initiative.
      independent_corroboration: >-
        The validator-derived closed form exp(-2 pi^2 sigma^2 ||x||^2 / q^2),
        computed from the emitted norms, predicts the decay quantitatively.
        A decay that merely happened would be weaker evidence than a decay that
        matches its predicted functional form, and this one does.
    - control: positive_control
      status: reproduced
      detail: >-
        The MAIN target is the positive control for the null: the identical
        pipeline ranks the correct secret 1 of 33 with mean +0.42738 against a
        uniform-candidate mean of +0.00385. The contrast between rank 1/33 and
        rank 18/33 under identical code is the substance of the control pair.
    - control: certificate_control
      status: reproduced
      detail: See metric lattice_membership_certificate above, re-verified independently.
    - control: shortness_control
      status: absent
      detail: see defect 5

