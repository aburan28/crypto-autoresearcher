  producer_self_reported_limitations_audit:
    - id: L1
      producer_text: >-
        Dual vectors (x,y) are absent from raw_scores.json (only norms, phases,
        scores), so a reviewer cannot score a candidate of their own choosing
        without re-running.
      status: not_reproduced_overstates_the_loss
      finding: see defect 1
    - id: L2
      producer_text: >-
        Two failures in rebuild_transcript.txt are the producer's own coding
        errors, kept verbatim.
      status: reproduced
      finding: >-
        Accurate. Both failures are in the executor's verification script, not
        the instrument; both are kept verbatim with an annotation; and the
        instrument components that had already passed inside the second failing
