  # ------------------------------------------------------------------ #
  limitations:
    - >-
      This validation establishes the integrity of a measurement at d=60,
      q=127, m=35, n=25, on ONE LWE instance with ONE seed and ONE sieve
      algorithm. It is not crypto-scale evidence, it says nothing about any
      FIPS 203 parameter set, and it neither supports nor contradicts any
      claim about ML-KEM.
    - >-
      A passed validation means the receipt is admissible evidence. It does
      not demonstrate a speedup, does not support any claim about the
      dual attack's cost, and authorizes no promotion of any record.
    - >-
      The ordering claim "instrument verified before measurement" is
      corroborated by transcript timestamps and by filesystem mtimes that the
      recorder does not write, which agree. It is not cryptographically
      attested, and mtimes are settable in principle. The content of the
      measurement is independently reproduced regardless.
    - >-
      The full lattice-membership certificate is not checkable from
      raw_scores.json alone (defect 1); I verified it by re-running the sieve.
      A reviewer without the instrument could verify only the r.s == 0
      functional and the y-side consistency.
    - >-
      Instance-to-instance variation is entirely unmeasured. Every number
      validated here is a single draw, as report.md itself states.
    - >-
      My own session carries the same inference caveat as the producer's:
      the task card requests policy `validator-independent` (an alias of
      `review-adversarial` per orchestration/model-policies.yaml line 122),
      fallback_allowed true; no AUTORESEARCH_* variable is set and this session
