  # ------------------------------------------------------------------ #
  defects:
    - number: 1
      severity: minor
      class: reporting_accuracy
      title: >-
        Limitation 1 is false as written - a reviewer CAN score an arbitrary
        candidate secret from raw_scores.json alone.
      evidence: >-
        The 32 emitted candidate-difference vectors s'-s have rank 25 = n over
        Z_127, so the identity t(s') = t(s) - y.(s'-s) determines y completely
        for every one of the 17919 vectors from the JSON alone. I recovered y
        that way, then scored a candidate the producer never scored
        (s'' = [3,1,-1,-1,-3,1,0,3,-1,-2,-1,-1,-1,0,-1,0,0,2,-3,0,3,-3,1,-2,1])
        against MAIN using only raw_scores.json: mean +0.174586. The same
        candidate scored against the re-run's actual sieve vectors: +0.174586,
        with the two 17919-long phase arrays identical elementwise.
      what_is_actually_lost: >-
        x is NOT recoverable (33 independent linear constraints on 35 unknowns
        mod q at best), so a reviewer cannot score a NEW TARGET b, cannot
        recompute x.e for a new error vector, and cannot condition on anything
        about x beyond the emitted norm2_x. The full membership certificate is
        likewise not re-verifiable from the JSON without a re-run - which is
        the one place the limitation bites, and is why I re-ran.
      direction_of_error: conservative - the producer understated its own artifact
      recommendation: >-
        Batch 2 should restate the limitation in its true, narrower form and
        should still emit (x,y): the missing piece is x, and emitting it is the
        difference between a certificate a reviewer can check from the file and
        one that requires a 19-second re-run.
    - number: 2
      severity: minor
      class: statistical_presentation
      title: >-
        The null's headline "-0.04 sd" is a pooled statistic over the three
        populations the producer itself declares non-exchangeable.
      evidence: >-
        report.md observation 2 states that the three wrong-candidate
        populations are not exchangeable and that "any statistic quoted over a
        pooled wrong population depends on how the pool was built". The null's
        own z of -0.037 is exactly such a statistic. Group-wise the correct
        secret ranks 5 of 17 against the uniform group (z = +0.432), 9 of 9
        against the secret-distribution group (z = -2.312), and 6 of 9 against
        the near-miss group (z = -0.079).
      impact: >-
        The null's CONCLUSION is unchanged and survives every decomposition -
        the correct secret is mid-pack against the unconfounded uniform group
        (5/17) and nowhere near rank 1. But the specific number quoted is not
        robust to pool composition, by the producer's own stated criterion.
      recommendation: >-
        Batch 2 should quote the null against the uniform group alone, or quote
        all three, and should not use a pooled sd as a denominator.
    - number: 3
      severity: minor
      class: control_shape
      title: >-
        Under the null, 8 of the 32 "wrong" candidates are near-duplicates of
        the item being ranked.
      evidence: >-
        The near-miss candidates are s + e_j. Under the null their means
        cluster at sd 0.00086 around the correct secret's +0.00330 - roughly
        six times tighter than the uniform group's 0.00504. The pooled rank of
        18/33 therefore ranks an item against eight near-copies of itself,
        which compresses the rank toward the middle by construction.
      impact: >-
        Not fatal. The uniform-only rank of 5 of 17 is unconfounded and still
        mid-pack, so the null's conclusion holds. But "rank 18 of 33" is not
        the clean uniform-over-33 statistic a reader would assume, and
        report.md does not say so.
      recommendation: >-
        State the confound, or report the null rank against the uniform group.
    - number: 4
      severity: minor
      class: control_power
      title: The null was drawn once and its own resolution is not stated.
      evidence: >-
        One uniform b, from seed 20260803003. Under the null the correct
        secret's rank is (up to the defect-3 confound) uniform on 1..33, so a
        single realization cannot by itself exclude a roughly 3 percent chance
        of landing at rank 1. report.md reports the outcome but never states
        the null's resolution or that a single draw has none.
      impact: >-
        Low. The decay sweep supplies the independent evidence that a single
        null draw cannot, and the per-vector statistics (mean/sem +0.62 under
        the null against +99.21 on MAIN, chi-squared 139.4 on df 126 against
        6689.1) are decisive within the single draw. The gap is one of
        statement, not of substance.
      recommendation: Run several null draws in batch 2 and report the rank distribution.
    - number: 5
      severity: minor
      class: missing_control
      title: >-
        No control isolates "short" from "in the dual lattice"; the batch
        measures sieve-produced vectors without a long-vector comparator.
      evidence: >-
        The three controls vary the TARGET (null, decay) or certify MEMBERSHIP.
        None varies the vectors. Nothing in the package scores the same
        candidates against long dual-lattice vectors, or against a random
        lattice of the same shape.
      impact: >-
        Not a violation of the batch-1 contract, which asked for the score
        distribution of sieve output and its null. And the omission is
        substantially mitigated by the emitted norm2_x/norm2_y, which let a
        reviewer condition on length, and by my independent confirmation that
        exp(-2 pi^2 sigma^2 ||x||^2 / q^2) predicts the observed means - i.e.
        the signal demonstrably IS the ||x||-driven one. But batch 2's target,
        MATZOV.Nf, is a law about SHORT dual vectors, and comparing against it
        without a long-vector arm leaves "because they are short" untested.
      recommendation: Add a long-dual-vector arm in batch 2.
    - number: 6
      severity: cosmetic
      class: precision
      title: '"five wall-clock timing leaves" is run-specific, not a property.'
      evidence: >-
        My re-run differs from the committed file in three leaves
        (certificate.check_seconds, targets[1].scoring_seconds,
        targets[7].scoring_seconds); the producer's differed in five. The
        number of differing timing leaves is itself a timing coincidence.
      impact: >-
        None on the science. The invariant the producer meant - "differs only
        in wall-clock timing leaves" - is exactly right and I verified it over
        all 2942 leaves.
      recommendation: State the invariant, not the count.
    - number: 7
      severity: minor
      class: unreported_observation_agents_rule_8
      title: >-
        Under the null, all 8 secret-distribution candidates score ABOVE the
        nominal secret; the report notes the group's spread but not its
        location.
      evidence: >-
        Null: secret-distribution group mean +0.00828 against the correct
        secret's +0.00330, giving rank 9 of 9 within that group and z = -2.31
        against the group's own sd of 0.00216. report.md observation 3 remarks
        only on the group's smaller spread.
      impact: >-
        Small in absolute terms (0.005 of score) and in the SAFE direction -
        the null shows the nominal secret doing WORSE than a comparison group,
        which is the opposite of a leakage tell. The numbers are visible in the
        report's own null table, so this is under-remarked rather than
        concealed. But AGENTS.md rule 8 asks that unexpected observations be
        named, and a 2.3-sigma group-level offset in the null is one.
      recommendation: >-
        Name it in batch 2 and explain it - the likely mechanism is that all
        small-norm candidates share the x.b_null term and differ only by a
        small y.s' shift, so their means cluster near a common baseline that
        need not be centred on the nominal secret.

