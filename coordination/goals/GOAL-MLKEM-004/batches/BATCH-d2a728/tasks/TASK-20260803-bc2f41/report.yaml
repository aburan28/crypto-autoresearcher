  batch_2_recommendation:
    proceed: true
    proceed_as_planned: false
    statement: >-
      Batch 2 should proceed and the measurement design does NOT need redesign.
      Recommending redesign on a first measurement this clean would be premature
      abandonment. But batch 2 must not proceed "as planned" if that means
      substituting these numbers into MATZOV.Nf and reporting a residual, because
      MATZOV.Nf has no canonical instantiation on an object with no k_enum, no
      k_fft and no p (OBJ-1). Three additions are required first, all cheap:
    required_before_the_comparison:
      - >-
        (1) OBJ-1. Write down the exact parameter tuple that will be substituted
        into MATZOV.Nf and evaluate it against the pinned estimator, with
        CTRL-RT-6's known-answer control on the callable. If no tuple describes
        the measured object, restate batch 2's target as the law's two separable
        INGREDIENTS -- the per-vector advantage exp(-2 pi^2 l^2/q^2) and the
        1/sqrt(N) candidate-noise scaling -- and say so explicitly. That is a
        legitimate and sufficient batch-2 result.
      - >-
        (2) OBJ-2. Run the null object for the VECTORS (CTRL-RT-1) and the
        m-sweep (CTRL-RT-2) BEFORE quoting any variance-inflation or N_eff
        number. I have run both; batch 2 must reproduce them in its own package
        rather than cite mine, and must classify the result as a controlled null.
      - >-
        (3) OBJ-3. Emit x and y in the raw file and report mean +- sd over >=10^3
        fresh error draws for every quantity. One 19-second re-run.
    strongly_recommended:
      - >-
        Report success probability per candidate GROUP against subsample size
        (CTRL-RT-3), never a pooled wrong-candidate statistic. The
        uniform/secret-shaped/near-miss decomposition IS the result; the pooled
        number destroys it.
      - >-
        Use the within-database ||x||^2 conditioning (CTRL-RT-4) as the primary
        test of the exponent, in preference to the sigma sweep.
      - >-
        Add instance replication (CTRL-RT-5) if any departure is to be claimed.
    what_batch_2_must_not_do:
      - >-
        Must not report the 411x variance inflation / N_eff = 44 as evidence
        about sieve output. It is reproduced by random directions and is
        independent of N; it is a controlled null at m = 35.
      - >-
        Must not quote the pooled null rank 18/33 as showing the pipeline finds
        no structure. Report the three groups separately.
      - >-
        Must not convert any of this into a statement about FIPS 203 parameter
        sets without stating H-SCALE-1 and its known incompleteness, or must
        declare the extrapolation unreachable.

  narrowest_supported_statement: >-
    At m=35, n=25, d=60, q=127, secret centred-binomial eta=2, error
    rounded-Gaussian sigma=2, on one LWE instance with the recorded seeds, a
    single g6k 0.1.2 bgj1_sieve run returns 17,919 dual-lattice vectors -- every
    one of which lies in L = {(x,y) : y = A^T x mod q}, verified independently by
    the producer and re-derived independently by the Red Team including a full
    reconstruction of the vectors from the emitted phases and a reproduction of
    the database from the declared seeds -- and the per-vector dual-attack score
    cos(2 pi centre_mod(x.b - y.s', q)/q) was recorded for 33 candidates across 8
    targets. On this instance the correct secret ranks 1 of 33 on the LWE target
    and 18 of 33 on a uniform-target null (5 of 17 against the uniform candidate
    subgroup alone). All reported summary statistics reproduce exactly. Nothing
    here is a finding about any cost model, about sieve behaviour in general,
    about any other dimension, modulus, instance or sieve algorithm, or about the
    security of ML-KEM or any FIPS 203 parameter set.

