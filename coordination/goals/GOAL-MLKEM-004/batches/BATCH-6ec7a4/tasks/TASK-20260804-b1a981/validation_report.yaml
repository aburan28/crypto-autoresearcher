    - id: CHK-4
      name: wrong_secret_TN_plausibility
      status: pass_with_note
      detail: >
        Wrong-secret T_N values [4167.083, 4433.895, 4238.163, 4178.842] for the
        four outlier seeds are assessed against the null distribution from Test A
        (n=50, mean=4175.508, std=110.735).
        Z-scores vs null mean: [-0.08, +2.33, +0.57, +0.03].
        Seed 26883012 (z=+2.33) is high but within plausible sampling range for n=4.
        All T_N_wrong << T_N_correct (ratio 1.76-1.87 in all cases), confirming
        the outlier seeds' elevated T_N values are specific to correct-secret scoring.
        Per-vector cosine for wrong secret: ~0.233 vs ~0.435 for correct secret.
        Values are plausible and consistent with the null distribution.
        QUALIFICATION Q-1: The interpretation_note in outlier_rerun_results.json
        states "expected near batch-3 T_N mean (~7551) if wrong-secret scores are
        unstructured". This is inverted: if wrong-secret scores are unstructured,
        T_N_wrong should be near the NULL mean (~4175), not the correct-secret mean
        (~7551). The OBSERVED data (T_N_wrong ~4200) correctly falls near the null
        mean and is consistent with expected behavior. The note is a misstatement
        in the descriptive metadata only; the data itself is correct.

