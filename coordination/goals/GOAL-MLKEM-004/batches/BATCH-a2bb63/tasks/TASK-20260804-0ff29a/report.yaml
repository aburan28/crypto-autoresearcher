  objections:

    - id: OBJ-1
      severity: blocking
      title: >-
        The departure is reproduced by an object with no lattice, no sieve, no A,
        no modulus and no x-y coupling. 85-90% of the headline survives deleting
        everything the batch is about.
      challenge: >-
        The producer's own closed form says the entire across-candidate
        dependence is a functional of (X, Y) and the candidate offsets. I took
        that seriously and deleted the structure, one layer at a time, evaluating
        the SAME closed form with NO scoring. ST-6 as a ratio to K-1, on the
        producer's own candidate groups:

          arm                                        near-miss K=25   secret-dist K=25   uniform K=25
          SIEVE          (certified dual family)         0.7283            0.4149            0.9194
          SIEVE_SUMS     (certified dual family)         0.8746            0.4891            0.9872
          NULL-IIDPHASE  (the producer's null)           0.9281            0.9163            0.9136
          C1 ROWPERM-Y   (x-y coupling destroyed)        0.7579            0.4635            0.9292
          C2 RANDX       (no lattice in x, real Y)       0.7505            0.4575            0.9176
          C3 SYNTH       (NO LATTICE AT ALL)             0.7679            0.4503            0.9192
          C4 SYNTH + real Y column covariance            0.7556            0.4517            0.9221

        C3 is Gaussian random directions carrying the sieve's exact row norms,
        and Y iid rounded Gaussian at the sieve's entrywise sd. There is no A, no
        q-ary structure, no short vector, no dual relation and no dependence
        between X and Y of any kind. It returns 0.768 and 0.450 where the
        certified sieve database returns 0.728 and 0.415.

        The extreme-value statistic agrees: my closed-form ST-5c ratio for the
        secret-distribution group is 0.459 on the real sieve family and 0.426 on
        C3, against 0.985 for the producer's null.

        This is inventor-protocol section 3 exactly: the identical measurement
        against a null object of the same shape returns the same numbers, so the
        honest record is a CONTROLLED NULL, not a finding. It is also the
        campaign's own KN-TECH-6c0e15, "how to run obligation 4", move 2:
        "Build the null object with the mechanism deleted." That move was
        available for the price of one 20-second numpy pass on arrays the
        producer already had in memory, and it was not run.
      consequence: >-
        The sentence "the two certified valid dual families show a reduction ...
        and NO reduction on uniform candidates" is true of the numbers and is not
        about the dual families. The same reduction appears in an object that is
        not a dual family, not in any lattice, and not coupled.
      cheapest_check: >-
        RC-1. One blocked N x N kernel pass on Gaussian X with the sieve's row
        norms and iid Gaussian Y. About 20 s, no scoring, no g6k, no fpylll.
        Arrays already in the producer's work file.

    - id: OBJ-2
      severity: blocking
      title: >-
        NULL-IIDPHASE removes the wrong object. It destroys candidate-offset
        shortness, which is a property of the CANDIDATE SET; the contrast
        therefore cannot be read as a property of the family.
      challenge: >-
        Y -> uniform residues mod q makes y_i.(s - c_k) uniform for EVERY
        candidate group. The near-miss and secret-distribution groups exist
        precisely because their offsets are short. So the null does not remove
        "shortness/structure of phase offsets" from the family while holding the
        experiment fixed; it deletes the defining property of two of the three
        groups being compared. Everything downstream inherits that.

        Direct evidence that the operative variable is the candidate set:
        I measured three synthetic candidate groups on the REAL sieve database
        and on the C3 non-lattice object (run 2). ST-6 ratio to K-1:

          candidate group                                        SIEVE    SYNTH
          G-SD    the producer's secret-distribution group        0.4149   0.5039
          G-SDC   delta = CB - CB: same length, NO shared part    0.4880   0.5062
          G-UNIFSH delta = u + CB: LONG offsets, shared part      0.5537   0.5569

        G-UNIFSH candidates are as far from the secret as the uniform group
        (mean ||delta||^2 = 156,182 against the uniform group's 135,496) and they
        depart to 0.554 on the real family. So "short offsets" is not even
        necessary; a shared component in the candidate offsets is sufficient. And
        the producer's own secret-distribution group has one BY CONSTRUCTION:
        delta_k = s - c_k with c_k iid, so all 25 offsets share s. Measured mean
        pairwise cosine +0.5562, against my prediction
        ||s||^2/(||s||^2 + E||c||^2) = 30.0/(30.0 + 23.2) = 0.5643, computed with
        no lattice compute at all. The zero-shared-part version G-SDC has mean
        pairwise cosine -0.0195.

        KN-TECH-6c0e15's own closing line of the mode-3 section is the test that
        was owed: "Ask which property of the real object causes the departure
        from your reference model, then check whether your null preserves that
        property. If it does, the null is decorative." Here the null does not
        preserve it -- it deletes it -- which is the mirror-image failure and has
        the same consequence.
      consequence: >-
        real/null at matched K is not a valid contrast for the claim it is being
        asked to support. The correct comparator is a family-ablated object at
        FIXED candidate set, which is OBJ-1's C1/C2/C3, and against that
        comparator the departure is 3-11%, not a factor of 2.
      cheapest_check: >-
        RC-2. Recompute the three groups on C1 (row-permuted Y) instead of
        NULL-IIDPHASE. It preserves the offsets and destroys the coupling. 20 s,
        already run here.

    - id: OBJ-3
      severity: blocking
      title: >-
        The uniform arm is not a control. It sits at 0.919 +/- 0.005 for every
        object tested, including objects with no lattice, and it moves only with
        the rank of X, which is held fixed across every arm being compared.
      challenge: >-
        uniform_25 ST-6 ratio to K-1, across all eight arms I evaluated: 0.9194
        (SIEVE), 0.9872 (SIEVE_SUMS), 0.9136 (NULL), 0.9292 (C1), 0.9176 (C2),
        0.9192 (C3), 0.9221 (C4), 0.9243 (C5). Seven of the eight lie in
        [0.914, 0.929]. The arm is pinned, and it is pinned for a derivable
        reason: for uniform candidates the phase vectors are pseudo-random, so
        the K first-order Jacobians J_k = X^T sin(phi_k) are near-random
        directions in R^35 and their Gram has off-diagonals of order
        1/sqrt(35) = 0.169 whatever produced X and Y. I measured mean |offdiag|
        of that Gram at 0.132 for uniform and 0.126 for near-miss -- statistically
        the same -- against 0.640 for secret-distribution.

        It CAN move: my rank-5 X positive control (C6) takes uniform_25 to 0.4848.
        So the arm is sensitive to the effective rank of X and to nothing else
        that varies in this batch. Since every compared arm has full-rank X with
        matched norms, the uniform arm's 1.00 is a measurement of a quantity that
        was held constant.

        This is not a null that cannot fail (mode 1). It is worse in a specific
        way: it is a null that fails only on a nuisance parameter nobody varied,
        so it reads as a demonstrated dynamic range while demonstrating none for
        the comparison at hand. KN-TECH-6c0e15 obligation 3 requires the
        comparator to be "the arm the null is about". SENS-GRADED satisfies that
        for the instrument; the uniform arm does not satisfy it for the object.
      consequence: >-
        Section 2.5's central defence -- "The observable therefore has
        demonstrated dynamic range within one database" -- does not follow. The
        observable has demonstrated dynamic range across CANDIDATE GROUPS within
        one database, which is a property of the candidate construction (OBJ-2),
        not of the database. Across DATABASES at fixed candidate group the
        demonstrated range is 0.415 to 0.504 (real to synthetic), and my two
        synthetic draws alone span 0.450 to 0.504.
      cheapest_check: >-
        RC-3. Report every arm's uniform group as a control-of-the-control and
        state its across-arm spread. If it is 0.005 while the claimed contrast is
        0.5, the arm cannot separate the arms. Reading time, numbers already in
        results.json.

    - id: OBJ-4
      severity: major
      title: >-
        "The direction is DOWNWARD" is a theorem about ST-6, not a finding.
        ST-6 <= K-1 for every correlation matrix.
      challenge: >-
        R is a correlation matrix, so trace R = K and its eigenvalues
        lambda_1 >= ... >= lambda_K >= 0 sum to K. With T = K - lambda_1 the
        trailing sum and Q the trailing sum of squares, Cauchy-Schwarz gives
        Q >= T^2/(K-1), hence ST-6 = T^2/Q <= K-1, with equality iff every
        trailing eigenvalue is equal. ANY departure from R = I of ANY sign, in
        ANY direction, lowers ST-6. I checked 2000 random correlation matrices:
        0 exceeded K-1.

        The report says "DIRECTION, stated because it must be: the departure is
        DOWNWARD". For ST-6 the direction was fixed before the data existed. The
        frozen rule's D3 branch ("MORE effective independent candidates") is
        correspondingly near-unreachable through z1: at K=8 the maximum
        attainable z1 is (7 - 6.9904)/0.00328 = +2.93, below the +3.0 threshold,
        so the z1 channel alone can NEVER fire D3 at K=8. ST-5c is genuinely
        two-sided (I observe 1.0018 and 1.0025 on control arms), so the statement
        is not vacuous for that channel -- but the report and the commit message
        state the direction once, for both.
      consequence: >-
        Half of the reported direction is an identity. It should be stated as
        "ST-6 is bounded above by K-1; the informative quantity is the magnitude
        of the shortfall relative to a family-ablated comparator", which is
        OBJ-1's table.
      cheapest_check: "Three lines of Cauchy-Schwarz. Zero compute."

    - id: OBJ-5
      severity: major
      title: >-
        The "0.44x nominal / 0.22x" headline divides by a comparator that returns
        61.9 effective candidates out of 25, and by a denominator the commit
        message mislabels as nominal.
      challenge: >-
        Both figures are ratios to CAL-PERM, not to nominal K. Against nominal K
        they are 13.3060/25 = 0.532 (sieve) and 13.5322/25 = 0.541 (SIEVE_SUMS)
        -- indistinguishable from each other, not 2:1. The 0.22x arises because
        SIEVE_SUMS's CAL-PERM comparator returned K_eff_max_ctr = 61.9220 at
        K = 25, i.e. 2.5x the number of candidates that exist, and 249.4537 at
        K = 64, i.e. 3.9x. Every other arm's comparator sits at 27-30 for K=25.
        My own population-level comparator for the same family (independent
        columns, matched marginal variances, Gaussian) returns 27.5, so the
        inflation is a property of CAL-PERM under the SIEVE_SUMS group's
        strongly non-Gaussian empirical marginals (its var_cv is 0.373 against
        the sieve's 0.191), not a property of the family.

        A statistic whose comparator claims 2.5x more independent candidates than
        there are candidates is not calibrated on that arm, and a ratio taken
        against it is not "the effective number of independent candidates". The
        commit message then prints "0.44x nominal", which is the one word that
        makes the number unrecoverable: it is 0.44x CAL-PERM and 0.53x nominal.
      consequence: >-
        The strongest single number in the package (0.22x, a 4.5-fold reduction)
        is 0.54x against nominal and is an artifact of one anomalous comparator.
        The commit message's "0.44x nominal" is the third reference-model mislabel
        in three consecutive Coordinator commit messages (batch 3 OBJ-9 class;
        batch 4 OBJ-6, "1.0 versus c4(8)"), and the second consecutive one in
        which the mislabel enlarges the effect.
      cheapest_check: >-
        Print ST-5c against BOTH nominal K and CAL-PERM, and print CAL-PERM/K
        beside it. When CAL-PERM/K exceeds ~1.2 the arm is flagged. Two divisions.

    - id: OBJ-6
      severity: major
      title: >-
        LIM-T2 is wrong: the matched-K comparator for p=3 and p=5 is in the
        producer's own results.json, and using it the Stage B departure is
        +4.0%, +2.0%, -2.4% across p -- sign-inconsistent and consistent with zero.
      challenge: >-
        results.json T2.per_p carries `adjacent_bins_10` at K=10 for every p,
        alongside `uniform_bins_10` at K=10. The matched-K ratios are:
          p=2  0.8728 / 0.9087 = 0.960   (+4.0% extra departure)
          p=3  0.8947 / 0.9128 = 0.980   (+2.0%)
          p=5  0.9100 / 0.8886 = 1.024   (-2.4%, the WRONG SIGN)
        On ST-5c at the same matched K: 0.978, 1.015, 0.975. The p=5 row has the
        adjacent-bin family LESS depressed than its uniform comparator.

        This matters more than its size. The adjacent-FFT-bin family is the only
        candidate family in this campaign that a real dual attack enumerates --
        RT-20260803-d2e23e said so, RT-20260804-37a8f2 RC-4 repeated it, and the
        producer's own section 3 observation 1 confirms it has no common mode
        because its offsets are a full bin. On that family, at matched K, across
        three moduli, there is no consistent departure. The near-miss and
        secret-distribution groups that carry the headline are ad-hoc candidate
        constructions with no dual-attack analogue.
      consequence: >-
        The batch's own most attack-relevant arm does not reproduce its headline,
        and the limitation that concealed this ("I do not compare them") is
        factually incorrect against the archived file. I say explicitly: I do not
        read this as concealment -- the producer archived the very group that
        refutes its own limitation -- but the conclusion has to be corrected.
      cheapest_check: >-
        Read T2.per_p['3'].groups.adjacent_bins_10 and uniform_bins_10 out of the
        committed results.json and divide. Zero compute.

    - id: OBJ-7
      severity: major
      title: >-
        Commit message 82bcbbe4 adopted "the producer's words in quotes or
        nothing" and then quoted the Coordinator's own paraphrase at least seven
        times, twice under the word "verbatim". This is a citation defect, not a
        numbers defect.
      challenge: >-
        These strings appear in quotation marks in the commit message and are
        attributed to the producer. I searched all seven committed artifacts of
        the snapshot. Their only occurrence anywhere in the repository is inside
        the Coordinator's OWN snapshot_receipt.json fields
        `producer_numbers_pending_review` and `producer_declarations_against_itself`:

          "partly forced, partly not, and I can say exactly which part"
          "it is not fixed regardless of what is measured"
          "roughly a factor 2 on the operationally relevant group"
          "not settled here"
          "The proof was correct over the statistic's range and useless over the
           space of explanations, because the m=35 artifact fires in the null too"
          "because its offsets are a full bin 2pi/p, not small"
          "served unchanged" / "definitively not 1"

        The receipt's own text is third-person ("The producer's own read: PARTLY
        FORCED, PARTLY NOT, and IT SAYS exactly which part"); the commit message
        converts it to first person ("I can say exactly which part") and labels it
        "verbatim". The producer's actual words for the same content are
        different in each case -- e.g. report.md's DEV-3 says "my branches
        exhausted the OUTCOME SPACE OF THE STATISTIC but not the SPACE OF
        EXPLANATIONS FOR A D2", and section 3 says "an adjacent bin differs by a
        FULL bin, so the offset is 2 pi/p -- large, not small".

        Some quotes ARE genuine: "DOWNWARD -- fewer effective independent
        candidates than the law assumes" is verbatim report.md section 2.4. The
        m=35 quotation is a compression of two producer sentences into one pair
        of quotation marks.

        The alternative reading -- that these came from the executor's chat
        response, which DEV-5 says also carried the narrative -- is worse for
        review, not better: it means the snapshot did not archive the source of
        its own quotations, and a reviewer instructed to treat only committed
        artifacts as durable evidence cannot verify them at all.
      security_claim_audit: >-
        NONE FOUND, and it should be said plainly and first. I grepped the whole
        snapshot tree and the commit message for break/broken/insecure/security
        level/bits of security/FIPS/ML-KEM-512/speedup/faster/attack cost/
        exponent. Every hit is inside a non-claim disclaimer. results.json carries
        states_a_conclusion: false; the scope banner is first and binding in
        report.md, dependence.py, results.json, receipt.json and the receipt; the
        commit message repeats the full non-claim paragraph and the rule-12
        status. There is no security claim in this package or in this message,
        and the Coordinator's stated discipline did keep every CONCLUSION out of
        the message. What it did not keep out was a false attribution.
      consequence: >-
        Quotation marks are load-bearing precisely because they tell a reviewer
        not to re-derive the sentence. Six prior Coordinator messages carried a
        defect; this one fixed the previous defect (present-indicative
        conclusions) and introduced a new one in the mechanism adopted to fix it.
        Under AGENTS.md rule 9 a fabricated citation sits in the same clause as a
        fabricated statistic. No statistic is fabricated here.
      cheapest_check: >-
        Before committing, grep each quoted string against the declared path set
        with `git grep -F` and drop or re-attribute any that does not hit a
        PRODUCER file. Under a minute, and it is the mechanical version of the
        rule the Coordinator already adopted.

    - id: OBJ-8
      severity: moderate
      title: >-
        The operational sign is undetermined, and the two available readings point
        in OPPOSITE directions. Nothing in the package or the card establishes
        either, and the correct candidate is excluded from every group.
      challenge: >-
        The card states that a downward departure "makes the attack harder, not
        easier". That is an interpretation and it is not derived anywhere. The
        naive extreme-value reading points the other way: the sample count in a
        dual attack is set by requiring the correct candidate's score to exceed
        the maximum over wrong candidates, so FEWER effective independent wrong
        candidates means a SMALLER expected maximum, a smaller required gap, and a
        CHEAPER attack than the independence-based model predicts. The opposite
        reading -- the one the card assumes -- is also available and is arguably
        the better one here, because the correlated candidates are precisely those
        near the secret, whose scores track the correct candidate's score, which
        degrades distinguishing rather than helping it.

        Which reading holds depends on a quantity this batch did not measure: the
        correlation between the wrong-candidate scores and the CORRECT
        candidate's score. The candidate list contains a "correct" entry
        (index 0) and a "reference_zero" entry, and NEITHER appears in any of the
        five measured groups. Five batches have now measured wrong candidates
        against each other and never against the one they must be distinguished
        from.
      consequence: >-
        The package is right to make no operational claim, and I record that its
        section 6 non-claims are complete. But the direction should not be
        described as unflattering, or flattering, by anyone -- including the
        dispatching card -- until the correct candidate is in the group. Somebody
        downstream reading "fewer effective independent candidates" as a
        cost-model input would be reading it in the cheaper-attack direction, and
        nothing in the archive stops them.
      cheapest_check: >-
        RC-4. Add the correct candidate to each group and report
        corr(S_correct, S_k) and P(max_k S_k > S_correct) beside K_eff. No new
        lattice compute; the scores are already computed for candidate 0.

    - id: OBJ-9
      severity: moderate
      title: >-
        KN-TECH-6c0e15 mode 4 WOULD have caught DEV-3 prospectively -- and
        catching DEV-3 would not have prevented this batch's substantive error.
        That is the second consecutive entry that fixes the previous batch's
        failure and misses the current one.
      challenge: >-
        Taking the entry's own self-claim on its own terms, adversarially.

        DOES THE NULL-FIRST CHECK CATCH DEV-3? YES, and cleanly. "Emit the frozen
        rule's verdict on the null arm before looking at the real arm." The
        NULL-IIDPHASE arm was pre-registered and was going to be scored anyway;
        verdict_for() on its six cells would have returned D2 six times before any
        real cell was read, and the rule would have been rewritten. The only cost
        is arm ORDERING, and the check does not require knowing the answer. This
        is a genuine prospective catch and the entry has earned that claim. The
        archive sub-check is weaker here (the statistic is new to batch 5, so
        there were no archived measurements of it to list) and the entry should
        say that its two sub-checks are not interchangeable.

        DOES CATCHING DEV-3 SAVE THE BATCH? NO. The rule's non-discrimination is
        not the defect that matters. The defect that matters is OBJ-1/OBJ-2: the
        null removes a property of the candidate set rather than of the family, so
        the post-hoc real/null ratio the producer fell back to is itself
        uncontrolled. That failure is an obligation-1 failure
        (`object_removed` / `object_preserved`) and an obligation-4 failure
        (move 2, "build the null object with the mechanism deleted"), both of
        which the entry already contains and neither of which obligation 5 adds
        anything to. The producer filled `object_removed` as
        "shortness/structure of phase offsets; Y->unif" and never noticed that the
        same edit deletes the defining property of two of its three candidate
        groups.

        SECOND DEFECT, and it is now in the corpus. The entry's mode 4 case B
        states the cause of the all-D2 result as a rank bound: "the error vector
        was m-dimensional, so ... the score covariance has rank at most m to first
        order, forcing the statistic below its null value for any candidate count
        K > m." The rank bound is correct and it is VACUOUS at K = 8 and K = 25,
        which is where every headline cell lives (8 <= 35, 25 <= 35). What
        actually depresses ST-6 there is finite-m GEOMETRY -- K vectors in R^35
        have Gram off-diagonals of order 1/sqrt(35) = 0.169; I measure 0.126-0.132
        -- plus the estimator's finite-D negative bias, which the entry documents
        elsewhere and well. An entry read by an agent with no access to this
        campaign will take away a rank condition that does not bind in the regime
        the case study is about.

        CREDIT, and it is real. Obligation 3 as a criterion with a named
        comparator, a numeric threshold and both ends of the range exhibited is a
        genuine improvement and SENS-GRADED is its first correct instance. The
        "comparator supplies BOTH the reference and the spread; the asymptotic
        value is never the test reference" caution demonstrably caught a
        manufactured ~4-sigma out of iid data in this producer's own v1. The
        removal of the false novelty claim, the c4(8) correction, the drop of
        `verified_by_execution` to `single_run_experiment`, and the explicit "this
        entry does not claim the check would have saved any batch" are all
        corrections the previous entry was told to make, and all four were made.
      consequence: >-
        Keep the entry. Its mode-4 self-claim is supported for what it claims and
        should be read narrowly: it catches non-discriminating VERDICTS, not
        inadmissible NULLS. Its mode-4 case B causal sentence should be corrected
        by a superseding entry to distinguish the rank bound (K > m) from
        finite-m Gram geometry (K <= m), because the campaign's own headline sits
        in the second regime. Under rule 12 UNMET I propose no status change and
        no edit; this is an objection for the Coordinator to weigh.
      cheapest_check: >-
        Evaluate the entry's own claim at K = 8: is rank(Cov) <= 35 binding on a
        25 x 25 correlation matrix? Reading time, zero compute.

    - id: OBJ-10
      severity: moderate
      title: >-
        The m=35 argument is stated as a rank bound and used as if it were a
        continuous artifact floor; it is vacuous where the headline lives, and the
        matched-K comparison does not control for what actually operates there.
      challenge: >-
        Section 2.3 derives rank(Cov) <= m and concludes "for any K > m ...
        K_eff_trail is forced below K-1". Correct, and it explains K=512
        completely. At K=8 and K=25 the bound is inactive. The floor that IS
        active there is the Gram geometry of K near-random directions in R^35,
        which I measure directly: mean |offdiag| of the first-order J-Gram is
        0.126 (near-miss), 0.132 (uniform), 0.640 (secret-distribution), against
        the 1/sqrt(35) = 0.169 expectation for random directions. Matching K
        equalises this floor between arms only when the J-vectors are equally
        generic, which is exactly what fails for the secret-distribution group.
        So matched-K does NOT control for the operative effect; it controls for a
        different one.
      consequence: >-
        The report's claim that the matched-K comparisons survive the m=35
        artifact is correct as stated about the rank bound and does not establish
        what it is used for. OBJ-1's family-ablated controls are the comparison
        that does control for it, and they leave 3-11%.
      cheapest_check: >-
        Report mean |offdiag| of the J-Gram X^T sin(phi) per group beside every
        ST-6. One matrix product, under a second, no scoring.

    - id: OBJ-11
      severity: minor
      title: >-
        Pre-registration ordering is again unattestable, and the commit message
        asserts it as fact.
      challenge: >-
        dependence.py v3 is archived; v1 and v2 are not, and receipt.json records
        no hash for them. The commit message states "T1 PRE-REGISTERED, then
        measured" in the Coordinator's own indicative. RT-20260804-37a8f2 HC-3
        recorded the identical gap one batch ago and named the free fix. The
        strongest available evidence that the block was not written after the
        fact is the same as last batch's: the producer reported a frozen rule
        that FAILED and refused to re-score. That is real evidence and I weigh it,
        but it is inference, not attestation.
      cheapest_check: "Archive v1 and v2 alongside v3, or record their sha256 in the receipt."

    - id: OBJ-12
      severity: minor
      title: >-
        ST-5c reports an "effective number of independent candidates" by inverting
        E[max of K iid STANDARD NORMALS], on scores that are demonstrably not
        Gaussian.
      challenge: >-
        keff_from_max inverts a Gaussian extreme-value curve. The scores are
        bounded averages of cosines with a dominant common mode; the
        secret-distribution group's marginal variances differ across candidates by
        var_cv 0.19 (sieve) and 0.37 (SIEVE_SUMS), and its within-draw spread is
        5.5x the iid prediction. Under non-Gaussian marginals the inversion is not
        a count of anything; it is a monotone reparametrisation of E[max]. The
        CAL-PERM comparator absorbs part of this but not consistently -- OBJ-5's
        61.9-out-of-25 is that failure made visible.
      cheapest_check: >-
        Report zmax_mean itself, and a rank-based (copula) effective count that is
        invariant to marginal shape, beside the Gaussian inversion. Both are
        already computable from the stored score matrices.

  required_controls:
    - id: RC-1
      control: >-
        THE FAMILY-ABLATED NULL AT FIXED CANDIDATE SET. Gaussian random-direction
        X carrying the sieve's exact row norms, Y iid rounded Gaussian at the
        sieve's entrywise sd. Same candidates, same closed form, no scoring.
      why: >-
        OBJ-1. It is the only arm that removes the family while holding the
        candidate set fixed, and it reproduces 85-90% of the headline. I measure
        0.7679 / 0.4503 / 0.9192 against the sieve's 0.7283 / 0.4149 / 0.9194.
        About 20 s of numpy per arm.
    - id: RC-2
      control: >-
        ROW-PERMUTED Y AT FIXED CANDIDATE SET. Destroys the x-y coupling,
        preserves the Y column geometry and every candidate's offset multiset.
      why: >-
        OBJ-2. It separates "the dual family's coupling" from "the candidate
        offsets". I measure 0.7579 / 0.4635 / 0.9292. Same 20 s.
    - id: RC-3
      control: >-
        REPLICATION OF THE ABLATED NULL, n >= 8 draws, with an interval. Report
        the real family's ST-6 ratio against the ablated ensemble's mean and sd,
        not against a single draw.
      why: >-
        This is the measurement that decides whether ANYTHING survives. My two
        independent draws of the same synthetic ensemble returned 0.4503 and
        0.5039 on the secret-distribution group; the real family is 0.4149. With
        n = 2 the residual is unresolved, and it is the only live quantity left.
        8 draws x 20 s = under 3 minutes, no lattice compute.
    - id: RC-4
      control: >-
        INCLUDE THE CORRECT CANDIDATE. Report corr(S_correct, S_k) and the
        empirical P(max_k S_k > S_correct) beside every K_eff.
      why: >-
        OBJ-8. K_eff among wrong candidates does not determine the sign of the
        operational effect; the correlation with the correct candidate does. Five
        batches have never measured it, and candidate 0 is already scored in every
        run.
    - id: RC-5
      control: >-
        DIMENSION SWEEP AT FIXED N AND FIXED K -- carried forward UNMET from
        RT-20260804-37a8f2 RC-5, now two batches old.
      why: >-
        It is still the only named parameter that is supposed to destroy this
        class of quantity and it is still untested. Under my J-Gram picture the
        prediction is explicit and falsifiable: the uniform-group floor should
        track 1 - O(K/m), so raising m at fixed (N, K) must raise it toward 1. If
        it does not, my account in OBJ-10 is wrong and that is worth knowing.

  counterexample_or_mutation: >-
    The decisive mutation deletes the object rather than the null, and I ran it.
    Take the producer's own closed form, unchanged, and its own candidate set,
    unchanged. Replace X by Gaussian random directions rescaled to the sieve's
    exact row norms, and Y by iid rounded Gaussians at the sieve's entrywise
    standard deviation. There is now no A, no modulus, no q-ary lattice, no dual
    relation, no short vector, no sieve, and no dependence of any kind between X
    and Y. ST-6 as a ratio to K-1 returns 0.7679 on the near-miss group at K=25
    and 0.4503 on the secret-distribution group at K=25, against the certified
    sieve database's 0.7283 and 0.4149, and 0.9192 on the uniform group against
    the sieve's 0.9194. The extreme-value statistic agrees: 0.426 against 0.459.

    The mechanism is visible with no compute at all. For the secret-distribution
    group every offset is delta_k = s - c_k with c_k iid, so all 25 offsets share
    the vector s; measured mean pairwise cosine +0.5562 against the prediction
    ||s||^2/(||s||^2 + E||c||^2) = 0.5643. Remove the shared part while keeping
    the length (delta = CB - CB, cosine -0.0195) and the departure only partly
    lifts, to 0.4880, because short offsets alone suffice. Keep the shared part
    and make the offsets LONG (delta = u + CB, mean ||delta||^2 = 156,182,
    cosine +0.9998) and a group as far from the secret as the uniform group
    departs to 0.5537 on the real sieve database.

    So: the sieve is not necessary, the lattice is not necessary, the x-y
    coupling is not necessary, and the shortness of the dual vectors is not
    necessary. A candidate set whose offsets share a common component, or are
    short, is sufficient -- and both are properties the experimenter chose. That
    is the whole of 0.874 / 0.783 / 0.452, less a residual of 3-11% that two
    control draws cannot yet resolve.

  baseline_comparison:
    applicable: partially
    note: >-
      No attack, no speedup, no cost claim and no exponent, so there is no
      Pollard-rho / BSGS / specialised-baseline row to contest and no time,
      memory or data/query axis is claimed on either side. What I charge per
      KN-LIT-7593: this package eliminates no search dimension, so nothing is
      taken for free. My own controls are charged in full -- 206.2 s and 48.5 s,
      single process, peak well under the 6 GB cap, 2 runs against a budget of 2,
      no g6k and no fpylll. The closed-form kernel pass I lean on costs one
      blocked N x N pass per arm, about 20 s at N = 17919 and O(N^2 m + N^2 K) in
      general; it does NOT scale, and any future use at larger N must charge it.
      The producer charges its own 123.9 s and 706 MB peak, which I confirm are
      recorded.
    dominated_by: >-
      n/a (no attack, no cost, no speedup and no exponent claimed by the package
      or by this review). Checked against every axis: time unclaimed, memory
      unclaimed, data/queries unclaimed, on both sides, for the package and for
      this report. This is not an unchecked null.
    sota_delta: >-
      none claimed. This review contributes a measurement-validity result -- a
      constructive non-lattice reproduction of the campaign's fifth headline
      contrast, plus the identification of the candidate-set property that
      produces it -- and no attack.

  heuristic_challenges:
    - id: HC-1
      challenge: >-
        The package asserts no numbered extrapolation heuristic and says so
        explicitly, which is correct conduct and I do not fault it. For the
        record, what a transfer from d=60, q=127, m=35, ONE instance toward
        n=256k, q=3329 would additionally require, numbered so a later session can
        falsify each: (HX-1) that the effect is not the finite-m Gram floor --
        falsified in the direction of harmlessness if RC-5 shows the floor rising
        as m grows, since ML-KEM's m is three orders of magnitude larger; (HX-2)
        that a real dual attack enumerates a candidate group with correlated
        offsets -- the campaign's own Stage B family is the one it does enumerate,
        and OBJ-6 shows no consistent departure there; (HX-3) that the quantity
        is not determined by the candidate construction -- OBJ-2 says it is;
        (HX-4) that the sign of the operational effect is determined -- OBJ-8 says
        it is not, in either direction. My judgement: at present this quantity is
        UNREACHABLE toward cryptographic parameters, and saying so is not a
        closure, because HX-1 and HX-4 are both cheap and both untested.
    - id: HC-2
      challenge: >-
        The pre-registration is genuine in the way that matters and I checked it
        for flattery. Two forced values were declared UNINFORMATIVE in advance and
        both came out forced. The band on F-1 was declared and MISSED, and the
        producer recorded the miss rather than restating the prediction. The
        frozen rule failed and its verdicts are reported verbatim with no
        re-scoring. The headline ratio is marked POST HOC in the machine-readable
        file, not only in prose. That is the strongest pre-registration conduct in
        five batches. It does not repair OBJ-1 or OBJ-2, because
        pre-registration protects against choosing the analysis after the data and
        offers no protection at all against a null that removes the wrong object.
    - id: HC-3
      challenge: >-
        The closed form is exact for Gaussian e and the run uses a rounded
        Gaussian; LIM-3 bounds the disagreement at 0.24% via KAC-1. I confirm the
        derivation is exact for unrounded e (it is the Gaussian characteristic
        function, no expansion), and my own direct scoring with ROUNDED errors
        lands within 0.7% of the closed-form-derived values on every group, which
        is an independent check of that bound on the real object rather than on a
        synthetic one.

  cost_model_challenges:
    - id: CMC-1
      challenge: >-
        No cost claim exists in this package to challenge. The Stage B correction
        term is labelled MODELED, is not combined with any measurement, and
        reproduces exactly (3731.891 / 38.6833 / 3.7283). Recorded as checked.
    - id: CMC-2
      challenge: >-
        The observable's own cost should be stated wherever it is quoted. The
        closed form is O(N^2 m + N^2 K) and cost 15-20 s at N = 17919; at the N a
        real dual attack needs it is not computable, so "the closed form makes the
        prediction free" is true only at toy N. Any batch-6 design that leans on
        it must say so.
    - id: CMC-3
      challenge: >-
        Price batch 6 against what it buys. Replicating the producer's named
        S-orthogonalisation test costs one kernel pass and buys an algebraic
        identity (OBJ-1/notes section 5). Replicating the ablated null 8 times
        costs 8 kernel passes, under 3 minutes, and buys the only interval that
        can decide whether the residual is real. The second is strictly better
        per second.

  reduction_and_scope_challenges:
    - id: RSC-1
      challenge: >-
        The redirect from marginal variance to across-candidate dependence was
        correct and is the right question. But the scope error survived the
        redirect one level up: the heuristic is about wrong-candidate scores
        being independent ACROSS THE CANDIDATE SPACE THE ATTACK ENUMERATES. Two
        of the three groups measured are ad-hoc constructions (s + unit_k;
        c ~ secret distribution) that a dual attack does not enumerate and that
        are, respectively, one lattice point from the secret and drawn from a
        distribution centred on it. The group that IS enumerated -- adjacent FFT
        bins -- is measured, and at matched K it shows +4.0%, +2.0%, -2.4%
        across p (OBJ-6). The campaign has now measured the right STATISTIC on
        mostly the wrong CANDIDATES.
    - id: RSC-2
      challenge: >-
        No scope inflation found in the package, and this should be said as
        plainly as the objections. Section 6's non-claims are complete and
