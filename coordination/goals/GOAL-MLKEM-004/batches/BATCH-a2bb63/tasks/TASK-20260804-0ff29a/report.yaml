  verdict: blocking_objections

  verdict_note: >-
    Every number I could check reproduced, most of them twice: once from a closed
    form I derived from scratch before reading the producer's, and once from a
    direct Monte-Carlo scoring with my own error seed. The producer's own
    closed-form predictions came back to four decimals against my independent
    implementation (6.052 / 17.480 / 6.784 / 22.066). The package's conduct is
    the best in this campaign: it declares five deviations against itself,
    reports a frozen rule that failed, refuses to re-score, marks its own
    headline POST HOC, archives the raw vectors so a stranger can check the
    certificates without g6k, and states the direction of its own result in the
    unflattering-sounding form. I verified the membership certificates myself
    from vectors.json and A alone: 0 violating of 959,745 entries.

    The result is nevertheless a controlled null, and I can say so
    constructively rather than statistically. THE DEPARTURE REPRODUCES WITH NO
    LATTICE, NO SIEVE, NO A, NO MODULUS AND NO x-y COUPLING. Replace X by
    Gaussian random directions carrying the sieve's exact row norms and Y by iid
    rounded Gaussians of the same entrywise sd -- an object with no algebraic
    structure whatsoever -- and the closed form returns ST-6 ratios of 0.768
    (near-miss K=25) and 0.450 (secret-distribution K=25) against the certified
    sieve family's 0.728 and 0.415. Row-permuting the real Y (coupling destroyed,
    Y column geometry kept) gives 0.758 and 0.464. Between 85% and 90% of the
    headline departure survives the removal of everything the batch is about.

    The reason the producer's null did not show this is that NULL-IIDPHASE
    removes the wrong object. Replacing Y by uniform residues makes every
    candidate group's phase offsets uniform, and offset shortness -- a property
    of the CANDIDATE SET, not of the family -- is the cause. This is the exact
    generalisation KN-TECH-6c0e15 states on its own last line of the mode-3
    section: ask which property causes the departure, then check whether your
    null preserves it. It does not, so the null is decorative, and it is
    decorative in the one direction that mattered.

    I ran the producer's own named batch-6 test. S-orthogonalising the Y columns
    takes near-miss K=25 from 0.7283 to 0.9740 and leaves secret-distribution at
    0.4275 against 0.4149 -- it erases the group whose structure it zeroes by
    algebra and does not touch the group carrying the headline. It is a mode-1
    control by this campaign's own taxonomy and batch 6 should not be spent on it.

    What genuinely remains is small and unresolved: the real family sits 3-11%
    below every decoupled control on ST-6 ratio. I cannot separate that residual
    from control-draw variance -- two independent draws of the SAME synthetic
    ensemble returned 0.4503 and 0.5039 on the secret-distribution group, a
    spread larger than the real-vs-synthetic gap in one of them. That is the
    measurement batch 6 should make, and it costs no lattice compute.

