  narrowest_supported_statement: >-
    On one toy instance (m=35, n=25, d=60, q=127, sigma=2, secret CB eta=2,
    BATCH-f75059 replicate 0), for score matrices over D=4000 rounded-Gaussian
    error draws on one fixed database, the trailing-spectrum effective-candidate
    count ST-6, taken as a ratio to K-1, equals 0.728 (near-miss, K=25), 0.415
    (secret-distribution, K=25) and 0.919 (uniform, K=25) on a certified g6k
    bgj1 dual family of N=17919 vectors. These values are reproduced here by an
    independently derived exact covariance requiring no scoring, and by direct
    Monte-Carlo scoring with an independent error seed and an independently
    written scorer, to within 0.7%. The same three quantities take the values
    0.768, 0.450 and 0.919 on an object with no lattice, no modulus, no dual
    relation and no dependence between X and Y, whose X carries the sieve's row
    norms and whose Y matches its entrywise standard deviation; 0.758, 0.464 and
    0.929 on the real database with Y row-permuted; and 0.751, 0.458 and 0.918 on
    random-direction X with the real Y. The producer's uniform-phase null returns
    0.928, 0.916 and 0.914 because replacing Y by uniform residues removes the
    short and shared candidate offsets that produce the effect. Therefore: the
    reported real/null contrast at matched K is a controlled null with respect to
    the dual family, and the departure it measures is a property of the candidate
    set -- offsets that are short, or that share a common component, the latter
    forced by delta_k = s - c_k to mean pairwise cosine 0.556 by construction. A
    residual of 3-11% by which the real family sits below every family-ablated
    control is NOT resolved: two draws of the same ablated ensemble span 0.450 to
    0.504 on the secret-distribution group, and no replication was run on either
    side. Nothing here concerns ML-KEM, any FIPS 203 parameter set, any attack
    cost, or any security property in either direction, and no EV-MLKEM-* or KN-*
    record changes status on anything in this report.

  batch_6_recommendation:
    verdict: CHANGE
    do_not_run_the_producers_named_test: >-
      I ran it. S-orthogonalising the Y columns takes the near-miss group from
      0.7283 to 0.9740 and leaves the secret-distribution group at 0.4275 against
      0.4149. It cannot fail in the informative direction for the group it moves:
      for near-miss candidates the phase columns ARE the Y columns
      (y_i.(s - c_k) = -Y[i,k]), so orthogonalising them in the S metric sets the
      off-diagonal of the b-part covariance to zero BY ALGEBRA, and any
      diagonal covariance has correlation matrix exactly I, giving ST-6 = K-1
      identically. It is a mode-1 control in this campaign's own taxonomy. And it
      does not touch the group that carries the headline. Batch 6 must not be
      spent on it.
    do_not_close: >-
      Closing would be premature under inventor-protocol section 4 and I say so
      explicitly. An obstruction is named for ONE contrast, not for the question.
      Three concrete things remain open, each with a stated falsification
      condition: the residual (RC-3), the correlation with the correct candidate
      (RC-4), and the m-dependence at fixed (N, K) (RC-5, unmet for two batches).
      Recording five rejected observables as a closure would be a fatigue report
      about this campaign's search, and its honest status is `unverified`.
    what_batch_6_should_do: >-
      Two things, both cheap, both decidable within the batch, neither needing
      g6k or fpylll. FIRST, RC-3: replicate the family-ablated null 8-16 times and
      report the real family's position against its interval, on all three groups
      and both statistics. That is the measurement that decides whether anything
      in five batches survives. SECOND, RC-4 plus the Stage B family: put the
      CORRECT candidate into every group, report corr(S_correct, S_k) and
      P(max_k S_k > S_correct), and do it on the adjacent-FFT-bin family at
      matched K across p and across instances, because that is the only candidate
      set a dual attack enumerates and OBJ-6 shows it currently reads
      +4.0% / +2.0% / -2.4%. If budget forces a choice, take RC-3.
    cheapest_check_that_decides_it: >-
      RC-1 replicated: 8 draws of Gaussian random-direction X at the sieve's row
      norms with iid Gaussian Y at the sieve's entrywise sd, evaluated through the
      producer's own closed form on the producer's own candidate groups. About
      20 s per draw, under 3 minutes total, no scoring, no lattice, no sieve,
      arrays already in hand. If the real family lies inside that ensemble's
      interval on the secret-distribution group, the batch-5 result is a
      controlled null in full and the campaign should report exactly that. If it
      lies outside by more than the interval, then a small genuine family effect
      exists, it is worth 3-11% and not a factor of 2, and RC-5 is how to find out
      whether it survives dimension.

