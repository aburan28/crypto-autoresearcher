    TOY SCALE. m=35, n=25, d=60, q=127, secret CB eta=2, error rounded-Gaussian
    sigma=2, ONE LWE instance (BATCH-f75059 replicate 0, seed 20260803206). No
    ML-KEM break claim, no security proof, no FIPS 203 parameter set affected or
    cleared, no speedup, no cost claim, no exponent moved. AGENTS.md rule 12
