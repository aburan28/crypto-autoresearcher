  # =====================================================================
  # 7. T3 - THE SUPERSEDING TECHNIQUE ENTRY
  # =====================================================================
  technique_entry_review:
    entry: knowledge/techniques/KN-TECH-6c0e15.md
    read_as: a stranger with no campaign context
    supersession_mechanics:
      status: reproduced
      detail: >-
        Frontmatter carries supersedes: KN-TECH-9d21c4 and superseded_by: null.
        KN-TECH-9d21c4 is untouched at 0 diff lines (AC-4). All ten source_refs
        resolve to real records in ledger/ or coordination/. The self-citing ref
        is gone. confidence is downgraded to single_run_experiment with an
        explicit and unusually candid justification.
    are_the_obligations_checkable_criteria:
      verdict: YES for four of five, and the fifth ships a mechanical proxy that works
      detail: >-
        The operative artifact is the YAML checklist at the end, and it is what
        makes this entry different from its predecessor. Fields I can mechanically
        check compliance against, with no judgement call:
          comparator_spread_nonzero  - one number; zero means mode 1. Binary.
          forced_value_number        - demands an actual number BEFORE the run.
                                       Checkable against the archived artifact.
          sensitivity_comparator / _threshold / _dynamic_range - a name, a
                                       number declared before the run, and both
                                       ends exhibited. This is obligation 3
                                       converted from advice to a criterion, which
                                       is exactly where batch 4's version failed
                                       (DEF-7 / EV-MLKEM-ba6c25 INT-3), and the
                                       entry says so and names the failure.
          reference_is_finite_sample - checkable, and it encodes the 4-sigma
                                       artifact the producer manufactured out of
                                       iid data and then caught.
          verdict_on_the_null_arm    - "RUN IT FIRST. Same label as the real arm
                                       => mode 4." One comparison, binary outcome.
        The one soft field is exhaustive_over_MECHANISMS, which cannot be made
        fully checkable in principle - you cannot enumerate all mechanisms. The
        entry knows this and does the right thing: it supplies verdict_on_the_null_arm
        as the operational substitute. That is the difference between advice and a
        criterion, and this entry lands on the right side.
    does_mode_4_encode_the_DEV_3_failure:
      verdict: YES, accurately, including the correct diagnosis
      detail: >-
        Mode 4 case B is this batch's own failure, written up against itself: a
        five-branch rule with a correct written partition proof that emitted one
        label on every cell including its own null, caused by an underived forced
        value - the m-dimensional error - with the null reproducing it to 0.8%.
        The sharpened obligation 5 ("exhaustiveness is relative to the
        alternatives the rule can DISTINGUISH, not to the values the statistic can
        TAKE") is the correct generalisation and I could not improve on it. The
        null-first check would have caught DEV-3 in one line, and the entry says so.
    where_it_is_wrong:
      - "Mode 4 case B repeats the wrong cell count: 18 cells / six null cells, where results.json has 21 T1 cells / 7 null cells, and 33 including T2. The error propagates report.md -> results.json derived_post_hoc.why -> a permanent knowledge entry. This is precisely the hazard the entry itself names in its Priority-corrected section: 'an unchecked claim is inherited by everything downstream, and a knowledge entry is where it becomes permanent.' DEF-3."
      - "Mode 4 case B attributes the forcing to 'any candidate count K > m'. My controls show the same m-dimensional mechanism drives the K=8 and K=25 departures too, through channel composition rather than rank truncation. The entry understates the reach of the mechanism it correctly names. DEF-9."
    where_it_convicts_its_own_producer:
      detail: >-
        The entry's obligation-4 move 2 - "build the null object with the
        mechanism deleted; strip everything you believe is doing the work and
        check the effect survives ... that is a constructive refutation and it is
        far stronger than a statistical one" - is exactly the control T1's
        headline lacks and exactly the control I ran in CC-6. The entry is
        checkable enough that I used it to convict the batch that wrote it. That
        is the strongest thing I can say about a methodology entry.
    arithmetic_spot_checks:
      status: reproduced
      detail: >-
        c4(8) = 0.965030; 0.965030/0.140324 = 6.8772 and 0.965030/0.106552 =
        9.0569, matching the corrected 6.877x and 9.057x (the superseded entry's
        7.126 and 9.385 are 1/v, i.e. against 1.0 - the correction is right and
        correctly attributed). The SENS-GRADED worked positive case (t recovered
        to within 0.02, 24.21 -> 3.70 monotone) matches the archived log line for
        line. The T0 figures 12.15 and 12.96 match RT-20260804-37a8f2 and my own
        MR-6.
    verdict: >-
      ADMISSIBLE as a superseding entry. It carries all four owed corrections,
      it is materially better than KN-TECH-9d21c4 on the exact axis batch 4's
      review faulted, its confidence field is honest, and its checklist is
      usable by a stranger. Two factual corrections owed (DEF-3, DEF-9), both of
      which supersede rather than overwrite.

  # =====================================================================
  # 8. DEFECTS
  # =====================================================================
  defects:
    - id: DEF-1
      severity: high
      class: control_sufficiency
      self_reported_by_producer: partially
      title: The matched-K departure is 66-92% forced by the generation procedure, and the null cannot separate that.
      detail: >-
        The producer disclosed the m=35 forcing for K > m and stated that at
        K = 512 the statistic reads nothing about the dual family. It then claimed
        the matched-K contrast "survives the forced parts". It does not, mostly.
        Replacing X by a matched-norm Gaussian matrix and Y by an iid resample of
        its own entries - an object with no lattice, no sieve, no dual family and
        no modulus structure, but the same m, N, K and offset-magnitude
        distribution - reproduces 66% of the near-miss K=8 deficit, 71% of the
        near-miss K=25 deficit and 92% of the secret-distribution K=25 deficit
        against the producer's own null. The reported "roughly a factor 2 on the
        operationally relevant group" is a factor 1.10 once compared against that
        object. The cause is that NULL-IIDPHASE removes offset shortness AND the
        X-Y lattice pairing simultaneously, and the shortness carries nearly all
        of it: with short offsets the cos channel becomes a pure common mode
        (variance share 0.9999-1.0000 in every short-offset arm, real or random)
        and all discrimination is pushed into the rank-<=m sin channel.
      what_it_does_not_mean: >-
        The measurement is not wrong and the residual 4-9% is real, consistent in
        sign, and present on two independent certified dual families. This is a
        defect in what the contrast is OF, not in whether the numbers are right.
      remedy: >-
        The producer already names the right test (section 5.1: S-orthogonalise
        the Y columns and re-measure; the closed form makes it free). Add the
        structure-deleted control of KN-TECH-6c0e15 obligation-4 move 2 to it.
        Both are minutes of compute in the existing script.
    - id: DEF-2
      severity: medium
      class: statistic_validity
      self_reported_by_producer: false
      title: The ST-5c ratio's denominator is object-dependent, so the 0.44x-vs-0.22x cross-family contrast is a denominator artifact.
      detail: >-
        CAL-PERM's K_eff_max_ctr mean varies 9.55-13.30 at K=8, 27.41-62.68 at
        K=25 and 67.50-249.45 at K=64 - a factor up to 3.7 at fixed K - because
        centring by the across-candidate mean interacts with marginal
        heterogeneity and non-Gaussianity, which var_cv shows differs by 400x
        across arms (0.0007 to 0.372). For the headline cell the numerators are
        13.306 (sieve) and 13.532 (sums): the sums family's raw statistic is
        HIGHER, i.e. marginally less departed. The 2x difference in the reported
        ratio is entirely the denominator. ST-6, the declared primary observable,
        is free of this (CAL-PERM 6.990 +- 0.003 / 23.87 +- 0.01 / 453.4 across
        every arm), which is a point in favour of the producer's choice of primary.
        Additionally, the gloss "0.44x nominal" in the snapshot message and in my
        task card is wrong twice over: these are ratios to CAL-PERM, not to K, and
        on the nominal scale the two families are 0.532 and 0.541 - indistinguishable.
      remedy: Report ST-5c ratios only within an arm, or report the numerators beside them.
    - id: DEF-3
      severity: medium
      class: disclosure_accuracy
      self_reported_by_producer: false
      title: The DEV-3 cell count is wrong in three places including a permanent knowledge entry.
      detail: >-
        "D2 on all 18 family x group cells including all six NULL cells" appears
        in report.md section 2.7 and 4, in results.json derived_post_hoc.why, in
        the snapshot commit message, and in KN-TECH-6c0e15 mode 4 case B. The
        actual figure is 21 T1 cells (3 families x 7 groups) of which 7 are null
        cells, plus all 12 T2 cells, i.e. 33 of 33. Eighteen is the number of
        cells DISPLAYED in the log (SHOW_GROUPS has 6 entries), not the number
        scored. The error understates the severity of the producer's own
        self-reported failure, so it is not self-serving, but it is now in an
        immutable knowledge entry.
      remedy: Correct by superseding record; do not overwrite.
    - id: DEF-4
      severity: medium
      class: pre_registration_accuracy
      self_reported_by_producer: false
      title: The pre-registration's stated evidence for closed-form ordering is refuted by the archived log.
      detail: >-
        Section 3 states the closed form "is computed and printed BEFORE the
        scoring block in the measure run; the log ordering is the evidence." The
        log shows the three families scored at 69.7-99.3 s and the closed-form
        pass at 99.3-114.7 s. Mitigated by KAC-1 exercising the same code at 7.1 s
        before any research number, and by the formula itself being inside the
        hashed frozen docstring - so the FORMULA's pre-registration stands. Only
        the ordering claim about the run fails.
    - id: DEF-5
      severity: medium
      class: disclosure_completeness
      self_reported_by_producer: false
      title: A second missed pre-registered expectation is not in the deviations list.
      detail: >-
        PREREG.expectation_uniform is "agreement with the law within sampling
        error (D1)". All nine uniform cells returned D2. DEV-2 is presented as the
        producer's pre-registration miss; this is a second one. It is mechanically
        explained in section 2.3 but never labelled as a missed expectation.
        AGENTS rule 8.
    - id: DEF-6
      severity: medium
      class: comparator_selection
      self_reported_by_producer: false
      title: LIM-T2 declares matched-K comparators absent at p=3 and p=5; they are in the producer's own results.json.
      detail: >-
        The run scored adjacent_bins_10 (K=10) alongside uniform_bins_10 (K=10)
        for every p, and both are archived. The three available matched-K extra
        departures are p=2 -3.95%, p=3 -1.98%, p=5 +2.41% (adjacent HIGHER than
        uniform, i.e. no departure at all). The report presents only p=2's 4.0%
        while declaring the other two impossible. The omitted comparisons weaken
        the T2 reading rather than strengthen it, so this is an error of
        bookkeeping and not of advocacy - but reporting one of three available
        matched-K comparisons without saying so is comparator selection, which is
        the exact failure KN-TECH-6c0e15's own obligation 3 was rewritten to stop.
    - id: DEF-7
      severity: low
      class: provenance_reasoning
      self_reported_by_producer: false
      title: The 2.2e-05 mean||x||^2 gap is explained by inference where the archive supplies a check.
      detail: >-
        report.md concludes "the archived constant is a different row set, not a
        different database". The conclusion is right, the reason is not the
        demonstrable one. Batch 4's own results.json (in my read scope) records
        sieve_mean_xnorm2 = 181.4942798147218 - exactly what the archived X gives
        and exactly what I compute - while carrying the same hard-coded literal
        rep0_mean_xnorm2 = 181.49430213739606. The literal is stale and internally
        inconsistent with rep0_a_x (which IS consistent with the true value, at
        0.0e+00). It is a mis-transcribed constant carried forward across batches,
        not a different row set.
    - id: DEF-8
      severity: low
      class: artifact_labelling
      self_reported_by_producer: false
      title: The archived script self-labels as v1 while its changelog says v3 was the version run.
      detail: >-
        SCRIPT_VERSION = "dependence.py v1 TASK-20260804-f58d34" is stamped into
        results.json, vectors.json and every one of the 88 log lines, while the
        changelog states v1 was NEVER run against a research object and v3 is the
        version run. The archived code is v3 by content (ST-6 primary, CAL-IID
        present, comparator-supplied references). Cosmetic, but it is the string a
        future reader will cite.
    - id: DEF-9
      severity: low
      class: knowledge_entry_scope
      self_reported_by_producer: false
      title: KN-TECH-6c0e15 mode 4 confines the m-dimensional forcing to K > m.
      detail: >-
        My controls show the same mechanism operates at K = 8 and K = 25, both
        below m = 35, via channel composition rather than rank truncation. The
        entry's diagnosis is correct but its stated scope is too narrow, and the
        narrowness is what let the batch treat matched-K as clean.

