  # =====================================================================
  # 4. THE CENTRAL CHECK - WHAT THE GENERATION PROCEDURE FORCES
  # =====================================================================
  forced_value_derivation:
    question: >-
      Is the measured dependence structure a property of the scores, or forced by
      the producer's own generation procedure?
    answer: PREDOMINANTLY FORCED, and by a mechanism broader than the one disclosed.

    my_derivation: >-
      S_k = (1/N) sum_i cos(u_i + phi_ik) with u = (2 pi/q) X e and phi_ik the
      candidate offset. Expanding and using the exact Gaussian identities gives
      Cov(S) = (1/N^2)[A^T C A + B^T S B] with A = cos(phi), B = sin(phi),
      C = P.*(cosh T - 1), S = P.*sinh T, P = pp^T with p_i = exp(-c||x_i||^2),
      T = 2c X X^T, c = (2 pi sigma/q)^2/2. I re-derived this independently and
      it is correct. Expanding the Hadamard series, P.*sinh T = 2c diag(p) X X^T
      diag(p) + O(T^3), which has rank at most m = 35, while C's diagonal
      C_ii = (1+e^{-4a_x})/2 - e^{-2a_x} is O(1) and its off-diagonal decays.
      Two regimes follow, and BOTH are properties of the score definition and the
      error dimension, not of the dual family:
        (i) SHORT offsets. cos(phi_ik) ~ 1 for every k, so the cos channel is a
            pure rank-one common mode and carries no discriminating variance. I
            measure its variance share at 0.9999-1.0000 in EVERY short-offset arm,
            real or synthetic. All discrimination then comes from the sin channel
            b_k^T S b_k', which lives in a space of dimension at most m = 35 with
            a strongly anisotropic metric. K_eff_trail is forced well below K-1
            even for random b, and even for K < m.
        (ii) SPREAD offsets. The cos channel's near-diagonal, full-rank, white
            part dominates (variance share drops to ~0.41) and near-independence
            is restored. Hence uniform candidates return the law's value.
      So the departure is the m-dimensional shared error acting through CHANNEL
      COMPOSITION at matched K, and through RANK TRUNCATION at K > m. The producer
      derived only the second.

    my_controls_all_in_the_producers_own_closed_form:
      statistic: K_eff_trail / (K-1), no scoring, matched K, matched N, matched m
      table:
        - arm: "REAL           X = sieve,    Y = sieve"
          near_miss_K8: 0.8646
          near_miss_K25: 0.7283
          secret_dist_K25: 0.4149
        - arm: "NULL-IIDPHASE  X = sieve,    Y = uniform mod q   (the producer's null)"
          near_miss_K8: 0.9811
          near_miss_K25: 0.9281
          secret_dist_K25: 0.9163
        - arm: "CTRL-RP        X = sieve,    Y = sieve row-permuted"
          near_miss_K8: 0.9241
          near_miss_K25: 0.7572
          secret_dist_K25: 0.4220
          removes: the X-Y row pairing, i.e. lattice membership of the pairs; preserves Y's own column Gram exactly
        - arm: "CTRL-RANDX     X = matched-norm Gaussian, Y = sieve"
          near_miss_K8: 0.9091
          near_miss_K25: 0.7713
          secret_dist_K25: 0.4766
          removes: the sieve geometry of X entirely
        - arm: "CTRL-IIDSHORT  X = sieve,    Y = iid resample of Y's entries"
          near_miss_K8: 0.9081
          near_miss_K25: 0.7627
          secret_dist_K25: 0.4711
          removes: all structure in Y; preserves the offset magnitude distribution exactly for near-miss
        - arm: "CTRL-BOTHRAND  X = matched-norm Gaussian, Y = iid resample"
          near_miss_K8: 0.9040
          near_miss_K25: 0.7861
          secret_dist_K25: 0.4550
          removes: everything - no lattice, no sieve, no dual family, no modulus structure
      what_it_shows:
        - "My closed form reproduces the producer's headline real/null ratios to under 1% (0.881 / 0.785 / 0.453 against the reported 0.874 / 0.783 / 0.452), so the comparison below is on the same footing as the report's."
        - "CTRL-BOTHRAND / NULL = 0.921 (near-miss K=8), 0.847 (K=25), 0.497 (secret-distribution K=25)."
        - "Fraction of the reported deficit reproduced by an object with NO lattice at all: 66%, 71%, 92%."
        - "Residual object-specific part, real / CTRL-BOTHRAND: 0.956, 0.927, 0.912 - i.e. 4.4%, 7.3%, 8.8%."
        - "The reported 'roughly a factor 2 on the operationally relevant group' (1/0.452 = 2.21) becomes a factor 1.10 once the comparison is against a matched-shape object with no lattice structure."
        - "Isotropy check: the participation ratio of Sigma = X^T diag(p)^2 X is 34.853 for the real sieve X and 34.930 for a matched-norm random X, out of m = 35. The sieve database is isotropic in this metric to within 0.2%, so there is no special geometry here for the statistic to read."
    consequence: >-
      The producer's stated defence - "unlike batches 1-4 it is not fixed
      regardless of what is measured; it returns 0.999-1.011 for uniform and 0.45
      for secret-distribution candidates on the same database and the same error
      draws" - is factually true and I reproduce it. But dynamic range across
      CANDIDATE GROUPS is not sensitivity to the OBJECT, and (I-b) is a claim
      about the object. The functional does move; it moves with the offset
      length, which is a choice of candidate set, and it barely moves with the
      dual family, which is what was supposed to be measured. The producer names
      the right next test in section 5.1 and says it is not settled here. My
      controls settle most of it, in the forced direction.
    what_i_do_NOT_claim: >-
      A residual of 4-9% survives every structural control I ran, consistently
      signed, and is reproduced by two independent certified dual families. That
      is a real, small, object-specific component. I am not saying there is
      nothing here; I am saying the reported magnitude is not the object's.

  # =====================================================================
  # 5. PRE-REGISTRATION ORDERING
  # =====================================================================
  pre_registration_checks:
    - id: PR-1
      what: the law's predictions and the two forced values were stated before measuring
      status: reproduced
      detail: >-
        PREREG is a module-level constant in the hashed script, dumped verbatim
        into results.json. F-1 = 0.98258 with band [0.95, 0.995] and F-2 ~ 0 are
        both there, both declared UNINFORMATIVE in advance, and both are printed
        in the log at t = 62.8 s - before the first T1 research number at t =
        69.7 s. The SENS-GRADED gate also ran before the real arms, as required.
    - id: PR-2
      what: DEV-2, the self-reported miss of the producer's own band
      status: reproduced
      detail: >-
        Measured offdiag(R_raw) for near-miss is 0.999924, outside the
        pre-registered [0.95, 0.995]. The stated cause is right: the hand
        calculation used a diagonal approximation to C and S, and the exact form
        gives 0.9999. The producer records the band as MISSED rather than
        restating the prediction. This is the single strongest available evidence
        that the pre-registration is genuine: a retro-fitted prediction does not
        miss.
    - id: PR-3
      what: PREREG's expectation_uniform (D1) was also missed, and is NOT in the deviations list
      status: not_reproduced
      detail: >-
        PREREG says "expectation_uniform: agreement with the law within sampling
        error (D1)". All nine uniform cells across the three families returned D2
        (z1 = -71.3, -279.8, -1934.6 on SIEVE alone). This is a second missed
        pre-registered expectation. It is explained by the m=35 mechanism in
        section 2.3, but it is not listed as a deviation and DEV-2 is presented as
        the only pre-registration miss. DEF-5, AGENTS rule 8.
    - id: PR-4
      what: pre-registration section 3's claim that the closed form is computed BEFORE the scoring block
      status: not_reproduced
      detail: >-
        The archived pre-registration says "It is computed and printed BEFORE the
        scoring block in the measure run; the log ordering is the evidence." The
        archived log refutes it: SIEVE/NULL/SUMS are scored at 69.7-99.3 s and the
        closed-form kernel pass runs at 99.3-114.7 s. Mitigation: KAC-1 exercises
        the same closed_form_cov code at 7.1 s, before any research number, so the
        code was frozen and exercised early even though the research pass was not.
        DEF-4.
    - id: PR-5
      what: the changelog ordering for the three self-caught design defects
      status: reproduced
      detail: >-
        v1 is recorded as NEVER RUN against any research object - no build stage,
        no sieve call, no research number, only synthetic instrument checks.
        v2 records the offdiag(R_ctr) = -1/(K-1) mode-1 defect with a CAL-PERM
        spread of 0.0000. v3 records (a) the asymptotic-reference defect that
        "manufactured a ~4-sigma departure out of genuinely iid data" and (b) the
        var_cv/CAL-PERM invariance. The corresponding fixes are present in the
        archived code: ST-6 is the primary observable and is provably invariant to
        a rank-one common mode (I verified the algebra: R = (1-rho)I + rho.11^T
        has trailing eigenvalues all equal to 1-rho, so K_eff_trail = K-1 exactly
        for every rho); verdict_for takes both reference and spread from a named
        comparator (lines 1374-1391); CAL-IID exists and governs z3. The
        changelog's ordering claim is consistent with the code and with
        receipt.json's instrument_debugging block. It is corroborated but not
        independently timestamped - see LIM-V2.
    - id: PR-6
      what: was PREREG edited between the build run (08:24) and the measure run (08:25:45)
      status: unable_to_check
      reason: >-
        Only one copy of dependence.py exists in the snapshot and it is the
        post-run copy. There is no build-stage hash of the script, and vectors.json
        (written by build) does not carry PREREG. This is a structural limit of a
        single-file archive rather than a producer omission, and DEV-2 is strong
        circumstantial evidence against any tampering. A future contract could
        close it by having the build stage write the PREREG hash into vectors.json.

