          gauss_test.py:          f693d480b05292da020dca14f2f9d3733cbd331c8e28112a925254ae5b8f571d  MATCH
          gauss_results.json:     9decdb90aefa95ac46fe3a9ebd54b438e7d06eec33e2d87e9b8b70c8f60f95d3  MATCH
          receipt.json:           5b84b09a7d390c2da1394d33954d926143756a788f8f30d7e39f28d727371be1  MATCH
