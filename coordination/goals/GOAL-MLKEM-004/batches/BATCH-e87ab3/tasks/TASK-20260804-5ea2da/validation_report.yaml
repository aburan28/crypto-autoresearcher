        binding in the receipt metadata is broken.

    - id: CHK-2
      description: Variance arithmetic re-derivation
      result: pass
      detail: |
        All statistics recomputed from TN_values (50 floats) in gauss_results.json.
        Results match to full floating-point precision:

          empirical_var_TN (ddof=1):       17896.107290865486  MATCH (stated 17896.107290865486)
          N_run0 * single_score_var_run0:   6474.640214344130  MATCH (stated 6474.640214344130)
          variance_ratio:                   2.764031158244      MATCH (stated 2.764031158244)
          chi2_stat:                        135.437526753946    MATCH (stated 135.437526753946)
          p_value:                          4.9167e-10          MATCH (stated 4.9167e-10)
          95% CI ratio:                     [1.928694, 4.292121]  MATCH

        Normalization: independence_predicted_var = N_run0 × within_env_single_score_var_run0
                     = 18469 × 0.35056799038086145 = 6474.640214344130. Correct.

    - id: CHK-3
      description: N-variability adjustment (law of total variance)
      result: pass
      detail: |
        N_vectors loaded from run_records (50 entries):
          Unique N values: {18098, 18469, 18848}
          Count by value: 18098 → 2 runs, 18469 → 31 runs, 18848 → 17 runs
          N range: 18098–18848
          mean_N (ddof=0): 18613.34
          var_N (ddof=1):  45919.21

        Law-of-total-variance decomposition:
          E[s_i] ≈ mean_TN / mean_N = 7635.720 / 18613.34 = 0.41023
          Var_total = E[N] × Var[s_i] + Var[N] × (E[s_i])²
                    = 18613.34 × 0.350568 + 45919.21 × (0.41023)²
                    = 6525.24 + 7727.62
                    = 14252.86

          N-variability fraction: 7727.62 / 14252.86 = 54.2%

        N-corrected variance ratio:
          ratio_N_corrected = empirical_var_TN / Var_total
                            = 17896.107 / 14252.860
                            = 1.2556

        Statistical test after correction:
          chi2_N_corrected = 49 × 1.2556 = 61.52
          p_N_corrected = 1 - chi2.cdf(61.52, df=49) = 0.108  (NOT significant at α=0.05)

        Interpretation note (observation only — no finding stated):
        The raw ratio (2.764, p=4.9e-10) includes a large N-variability component
        (~54% of Var_total). After N-correction the ratio is 1.256 (p=0.108),
        consistent with the null of independent scores. The bgj1 algorithm produced
        constant N=17919 (no N-variability term in its denominator), so the two
        algorithms' ratios are not directly comparable without this correction.
        This substantially changes the picture and requires Coordinator attention
        before drawing inferences about algorithm-dependence of score correlation.

