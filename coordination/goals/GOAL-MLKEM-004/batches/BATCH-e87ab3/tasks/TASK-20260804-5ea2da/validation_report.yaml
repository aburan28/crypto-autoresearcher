        The receipt parent_sha prefix 61f668c99 resolves to a different real
        commit (61f668c99b73c640ff0da81302b081d39ad8f5d4 — the GOAL-MLKEM-004
        ledger commit from BATCH-1be68e), which is NOT the actual parent of the
        snapshot commit. Both SHA fields appear to be abbreviated hashes padded
