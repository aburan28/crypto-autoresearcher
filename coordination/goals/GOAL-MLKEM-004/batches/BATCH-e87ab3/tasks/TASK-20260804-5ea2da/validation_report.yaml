  qualifications:
    - id: Q-1
      severity: moderate
      category: receipt_metadata_integrity
      detail: >
        The snapshot_receipt.json records commit_sha = 891f85dd6060ef55e3c9b87e91c38e851c0e6c89
        and parent_sha = 61f668c99b1d9ef35f96d3148e5abe8a023f6803. Neither SHA
        exists in the repository. The actual snapshot commit is
        891f85dd655854515eefb665ec65c8c8ce05cc08 and its actual parent is
        7a6adc14d8c08e316e1ba26ed56e722a780131b4. The receipt appears to record
        abbreviated hashes padded to full length with wrong digits, which is a
        form of fabrication under AGENTS.md rule 9. Artifact content is verified
        and intact; only the receipt metadata binding is broken. The Coordinator
        must supersede or annotate the receipt before downstream binding checks
        can pass without manual inspection.

    - id: Q-2
      severity: moderate
      category: normalization_method
      detail: >
        The raw variance ratio (2.764) uses N_run0=18469 as the denominator
        normalization, but gauss_sieve produced variable N per run
        ({18098, 18469, 18848}; mean 18613.34). After law-of-total-variance
        correction (Var_total = 14252.86), the N-corrected ratio is 1.256
        (p=0.108) — not statistically significant. The executor correctly
        disclosed this as a protocol deviation, but the headline statistics in
        the report and receipt reflect the uncorrected ratio. The Coordinator
        should treat the N-corrected ratio as the primary statistic for
        inference about algorithm-dependent score correlation.

