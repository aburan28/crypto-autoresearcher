    - id: MR-11
      claim: >-
        DEV-5: SENS-T2 passed both declared gates but is NON-MONOTONE in between
        (NULL, HARDER, HARDER, HARDER, EASIER as the shared fraction rises
        monotonically), so the instrument detects a departure but cannot SIGN one
      result: reproduced_and_strengthened
      method: >-
        Three independent routes. (a) Re-derived with the producer's seed
        (MY_SEEDS['t2_sens'] = 20260805740700) and my OWN reimplementation of
        margin_stats, calperm11 and the frozen verdict rule, written from the
