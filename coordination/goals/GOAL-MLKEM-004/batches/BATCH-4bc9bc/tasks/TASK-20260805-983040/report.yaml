      detail: >-
        (a) Matches the archived
        .../TASK-20260805-74a8e9/results_t2.json T2_sensitivity rows to 4 decimals
        on every row: m_z -0.8947 / -1.0989 / -1.1482 / -1.1296 / -0.8498 and
