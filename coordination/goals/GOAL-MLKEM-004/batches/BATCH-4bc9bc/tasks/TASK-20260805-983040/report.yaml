  # ==================================================================
  control_checks:
    - id: CC-1
      check: >-
        Is the T1 interval constructed honestly -- same ablation, same K, same
        offset scale as the real arm, over the right ensemble?
      result: passed_on_pipeline_and_scale
      detail: >-
        PIPELINE: both arms go through the identical closure `cf_ratios` in
        .../TASK-20260805-74a8e9/resolve.py, which calls the archived
        `dep.phases` on the SAME candidate columns `C1[idx_cf]`, then the
        archived `dep.closed_form_cov` with the same sigma and q, then the same
        ST-6 index sets `SUB`. Only X and Y differ. Group sizes, and therefore
        K, are identical across arms by construction (8, 25, 8, 25, 25).
        X SCALE: the ablated X preserves the sieve's per-row ||x_i|| EXACTLY,
        row for row (`Xa = G/||G|| * sqrt(xs2)`), and `closed_form_cov` reads X
        only through those norms and through X X^T, so the ablation is exact on
        the first channel and random on the second, as declared.
        OFFSET SCALE -- I measured this rather than accepting it. Pushing the
        real Y and an ablated Y through `dep.phases` gives off = Y.(s-C)^T mod q
        with mean 59.2636 / sd 50.7728 (real) against 59.1189 / 50.7516
        (ablated), and cosPhi mean +0.56937 / sd 0.61907 against +0.56861 /
        0.61999, with per-column mean |max| 0.99390 against 0.99370. The offset
        scale is matched to three decimals. So the interval IS an interval over
        an ensemble that matches the real arm on the declared preserved
        quantities, and OUTSIDE is not an artifact of a mismatched phase scale.
        WHAT IT IS NOT: the ablation bundles several removals at once, and the
        bundle is not minimal. See CC-2 and DEF-1.
    - id: CC-2
      check: >-
        NULL-OBJECT DECOMPOSITION (docs/inventor-protocol.md section 3): which
        component of the ablation carries the shift? Run by me; ABSENT from the
        package.
      result: material_finding
      detail: >-
        The pre-registration in .../TASK-20260805-74a8e9/resolve.py declares that
        the ablation removes "the ENTIRE dual family: the q-ary lattice, the
        matrix A, the modulus, the sieve geometry of X, the shortness of the dual
        vectors, and the X-Y coupling. Nothing algebraic survives." I split that
        bundle in two and ran each half, 6 draws each, through the identical
        pipeline.
        ABL-X-ONLY (random-direction X at the sieve's exact row norms, REAL Y
        kept): near_miss_8 [0.8822, 0.9375]; near_miss_25 [0.7334, 0.7917];
        uniform_8 [0.9761, 0.9877]; uniform_25 [0.9108, 0.9270];
        secret_distribution_25 [0.4329, 0.4818].
        ABL-Y-ONLY (REAL sieve X kept exactly, only Y replaced by a rounded
        Gaussian at the matched entrywise sd): near_miss_8 [0.8990, 0.9308];
        near_miss_25 [0.7443, 0.8196]; uniform_8 [0.9740, 0.9860]; uniform_25
        [0.9078, 0.9274]; secret_distribution_25 [0.4578, 0.4929].
        EACH HALF ALONE REPRODUCES THE FULL ABLATION'S ENSEMBLE, and the real
        value lies below the minimum of each half on the SAME four of five groups
        (all but uniform_25) that it lies below under the full ablation. In
        particular the sieve geometry of X can be held EXACTLY FIXED and the
        entire departure is still present.
        Consequence: the departure is not attributable to the sieve geometry, the
        shortness of the dual vectors, or the lattice -- all of which ABL-Y-ONLY
        preserves untouched. See DEF-1.
    - id: CC-3
      check: >-
        Is 16 draws enough for the interval it produces? Pooled exact test.
      result: partly_yes_partly_no
      detail: >-
        The producer's 16 draws and my 16 draws are independent draws of the same
        ensemble under disjoint seeds, so I pooled them to 32. Exact one-sided
        exchangeability p = (1 + #{ABL <= real}) / 33:
        near_miss_8 p=0.0303 (0 of 32 below real);
        near_miss_25 p=0.0303 (0 of 32);
        secret_distribution_25 p=0.0303 (0 of 32);
        uniform_8 p=0.0606 (1 of 32);
        uniform_25 p=0.4545 (14 of 32).
        0.0303 is the FLOOR attainable with 32 draws, so the three surviving
        groups are as far into the tail as 32 draws can measure and no further.
        16 draws are enough to place those three at the ensemble floor. They are
        NOT enough to resolve uniform_8: see DEF-2.
    - id: CC-4
      check: "is uniform_8's INSIDE-by-0.0001 a real INSIDE or a coin flip?"
      result: coin_flip_quantified
      detail: >-
        Coin flip, and I can put a number on it. Resampling 16 of the 32 pooled
        draws 2000 times and applying the frozen rule gives
        P(OUTSIDE_LOW) = 0.495 for uniform_8, against 1.000 / 1.000 / 1.000 for
        near_miss_8, near_miss_25 and secret_distribution_25 and 0.000 for
        uniform_25. The 16-draw minimum for uniform_8 has 5th/50th/95th
        percentiles 0.9691 / 0.9691 / 0.9737 while the real value is 0.9692 --
        the real value sits inside the sampling distribution of the interval
        ENDPOINT. My own independent 16 draws did in fact return OUTSIDE_LOW.
        The producer flags the boundary as DEV-8 ("Not a robust INSIDE; a
        seventeenth draw could move it") and that flag is correct, but it is
        recorded as a caveat rather than measured; measuring it turns a caveat
        into a 49.5% flip probability. See DEF-2.
    - id: CC-5
      check: >-
        Does the two-INSIDE-groups-are-the-pinned-ones pattern make the test
        meaningful or vacuous?
      result: neither_the_pattern_does_not_survive
      detail: >-
        The framing assumes the uniform groups cannot move, so that INSIDE there
        is uninformative. That is not what I measure.
        (a) uniform_8 DID move: it is OUTSIDE_LOW on my ensemble and a 49.5% coin
        flip on the pooled resample (CC-4). Only uniform_25 is genuinely INSIDE,
        at pooled p = 0.4545 with the real value near the ensemble median.
        (b) The uniform groups have the NARROWEST ablated intervals of the five
        (uniform_8 width 0.0196, uniform_25 width 0.0276, against 0.0511, 0.0594
        and 0.0765 for the others), so if anything a departure should be EASIER
        to detect there, not harder.
        So the honest reading is neither "departure only where departure is
        possible" nor "the only groups that can move, moved". It is: four of the
        five groups sit at or near the bottom of the pooled 32-draw ensemble and
        one (uniform_25) does not, and the clean story "structured groups depart,
        unstructured ones do not" is an artifact of a single ensemble. That is a
        BROADER departure than the package claims and a WEAKER interpretation,
        simultaneously.
    - id: CC-6
      check: >-
