      detail: >-
        It does not. results_t1.json and results_t2.json carry
        `states_a_conclusion: false`; receipt.json `state_meaning` says "This is
        an EXECUTOR receipt: it records observations, not conclusions"; the
        producer records that it does NOT conclude the residual is
        object-specific and refers that to the Reviewer and Coordinator. On the
