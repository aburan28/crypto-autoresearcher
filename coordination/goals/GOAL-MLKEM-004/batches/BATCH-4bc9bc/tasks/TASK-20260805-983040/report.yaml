        (b) Same shape on my own seeds and a denser grid: OP-NULL at t=0, then
        OP-HARDER at t = .05, .10, .20, .25, .35, .50, .60, then OP-EASIER at
        t = .75, .85, .95. Mean corr(S_correct, S_k) rises monotonically
        throughout (+0.0035 to +0.9747), so the non-monotonicity is in the
        VERDICT, not in the dependence.
        (c) The construction admits a closed form. With mu = 0.5 and
        M = 0.5 + (1 - sqrt(t)) Z_0 - sqrt(1-t) max_k Z_k,
          m_z(t) = (0.5 - sqrt(1-t) E[max_10]) /
