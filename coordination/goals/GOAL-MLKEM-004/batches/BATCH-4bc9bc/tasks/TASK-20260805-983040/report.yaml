  # ==================================================================
  proof_architecture_checks:
    - id: PA-1
      check: exhaustiveness arguments for the two frozen decision rules
      result: passed
      detail: >-
        Both rules are total. t1_verdict: for finite r and finite lo <= hi,
        trichotomy gives exactly one of r < lo, lo <= r <= hi, r > hi, with
        NEITHER a catch-all for non-finite inputs or fewer than 8 usable draws.
        t2_verdict: z > 3, |z| <= 3, z < -3 partition R, with OP-NEITHER a
        catch-all for non-finite inputs and for sd <= 0. I read both
        implementations in resolve.py and they match their stated definitions
        exactly. The pre-registration explicitly separates exhaustiveness from
        discrimination and says the latter is addressed elsewhere -- which is the
