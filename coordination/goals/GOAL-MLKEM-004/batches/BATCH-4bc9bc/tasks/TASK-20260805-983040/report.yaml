  # ==================================================================
  defects:
    - id: DEF-1
      severity: material
      title: >-
        The ablation bundle is not minimal: ablating Y alone, with the real sieve
        X held exactly, reproduces the whole departure. OUTSIDE_LOW therefore
        carries no information about the sieve geometry or the lattice.
      evidence: CC-2
      detail: >-
        The pre-registration attributes the ablation to removing the whole dual
        family including "the sieve geometry of X" and "the shortness of the dual
        vectors". My ABL-Y-ONLY arm preserves BOTH exactly -- it uses the real
        sieve X unchanged -- and still places the real value below its minimum on
        the same four of five groups. Symmetrically, ABL-X-ONLY preserves the
        real Y and does the same. Since either half alone suffices, the
        experiment cannot distinguish "the real dual family is special" from
        "the exact algebraic coupling y = A^T x mod q is what the statistic
        reads, and no ablation matching only sd(Y) can preserve it". The second
        reading is the weaker and, on this evidence, equally supported one.
        This is the docs/inventor-protocol.md section 3 decay test: the quantity
        does NOT decay when the component the framing credits it to (the sieve
        geometry) is restored.
      what_would_settle_it: >-
        An ablation that preserves the coupling exactly while destroying only the
        sieve geometry -- e.g. resampling short dual vectors of the SAME lattice
        by a different method, or permuting rows within the true dual lattice --
        so that y = A^T x mod q still holds in the null arm.
      not_a_repair: >-
        I ran this as a check on the package's interpretation. I did not and must
        not add it to the producer's artifacts.
    - id: DEF-2
      severity: material
      title: >-
        uniform_8's INSIDE is a 49.5% coin flip, and it flips under an
        independent ensemble. The headline 3-OUTSIDE / 2-INSIDE pattern is
        4-OUTSIDE / 1-INSIDE on my draws.
      evidence: MR-2, CC-3, CC-4
      detail: >-
        Producer interval min 0.9691 against real 0.9692; my interval min 0.9725
        against the same real 0.9692, giving OUTSIDE_LOW. Resampling 16 of 32
        pooled draws 2000 times gives P(OUTSIDE_LOW) = 0.495. DEV-8 names the
        boundary honestly but does not measure it, and the snapshot commit
        message reproduces the 3/2 split as the headline. Any downstream reading
        that rests on "the uniform groups did not move" is unsupported.
    - id: DEF-3
      severity: material
      title: >-
        SENS-T1 certifies sensitivity to the one nuisance parameter that is held
        constant between the compared arms, on the one group a prior blocking
        objection named as pinned, at a threshold larger than every effect
        reported.
      evidence: CC-6, MR-7
      detail: >-
        Three separate problems, all measurable.
        (i) RANK: SENS-T1's RANK5 comparator collapses rank(X) from 35 to 5. I
        measured rank(real sieve X) = 35; the ablated X is Gaussian and is also
        rank 35. Effective rank is held constant across the arms actually
        compared, so the control varies a direction the experiment does not.
        (ii) PRIOR OBJECTION INVERTED: the pre-registration's stated
        justification is that "RT-20260804-0ff29a OBJ-3 establishes that the
        uniform group's ST-6 ratio moves with the effective rank of X and with
        nothing else that varies between arms. A rank-5 X is therefore an object
        the statistic is known to be able to read" (frozen PREREG block,
        .../TASK-20260805-74a8e9/resolve.py). OBJ-3 draws the opposite
        conclusion from the same premise:
        BATCH-a2bb63/tasks/TASK-20260804-0ff29a/report.yaml records "Since every
        compared arm has full-rank X with matched norms, the uniform arm's 1.00
        is a measurement of a quantity that was held constant" and calls it "a
        null that fails only on a nuisance parameter nobody varied, so it reads
        as a demonstrated dynamic range while demonstrating none for the
        comparison at hand". The batch-6 pre-registration cites that objection as
        its warrant for doing the thing the objection rules out.
        (iii) SCALE: the pre-declared threshold is a gap of 0.05 and the observed
        gap is 0.3952, but the effects actually reported are 0.0189, 0.0201 and
        0.0160 (real minus ensemble minimum on the three OUTSIDE_LOW groups). The
        threshold is about 2.5x larger than the largest effect claimed, and the
        demonstrated gap about 20x larger. No positive control was run at the
        scale of the effect, and none was run on ANY of the three groups that
        returned OUTSIDE_LOW -- SENS-T1's gate is evaluated only on uniform_25,
        which returned INSIDE.
      qualification: >-
        In fairness: SENS-T1 is declared as a demonstration that the 16-draw
        min/max rule CAN emit OUTSIDE, not as the T1 null, and the T1 null (ABL)
        is separately admissible and can fail. The defect is that the package
        treats a passed SENS-T1 as licence to call the T1 branches interpretable
        (`interpretable: bool(sens_pass)` in resolve.py), and that inference does
        not hold at the effect's scale.
    - id: DEF-4
      severity: minor
      title: >-
        The false-OUTSIDE_LOW rate is quoted as 1/16 = 6.25% where the applicable
        exchangeability rate is 1/17 = 5.88%, and KN-TECH-1a5b7e promulgates the
        1/16 form as a general prescription.
      evidence: MR-4
      detail: >-
        Conservative direction, so nothing is oversold. But
        knowledge/techniques/KN-TECH-1a5b7e.md mode 5 states the leave-one-out
        derivation as "the honest per-group false-positive rate to quote beside
        any OUTSIDE verdict", which is a reusable instruction, and the off-by-one
        will propagate to every future application. The correct general statement
        is: leave-one-out on n members gives 1/n and validates the rule's
        implementation; the rate applicable to a real value tested against an
        n-draw interval is 1/(n+1) by exchangeability of the n+1 values under the
        null.
    - id: DEF-5
      severity: material
      title: >-
        The five groups are three candidate families at two nesting levels;
        "OUTSIDE_LOW on three of five groups" over-counts the evidence.
      evidence: MR-5
      detail: >-
        near_miss_8's candidate columns are range(8), a strict subset of
        near_miss_25's range(25); uniform_8's are range(25,33), a strict subset
        of uniform_25's range(25,50). The producer correctly warns that the
        groups share the same ENSEMBLE DRAWS so rates must not be multiplied, but
        does not disclose that two pairs also share their CANDIDATE COLUMNS. The
        supported count is two of three families departing (near_miss and
        secret_distribution), not three of five groups. Under my own ensemble it
        becomes three of three families, which changes the qualitative story
        again -- see DEF-2.
    - id: DEF-6
      severity: minor
      title: >-
        The T2 |z| > 3 gate is anti-conservative at n = 8 comparator
        realisations, and two of the three adjacent-family labels sit within 6%
        of the threshold.
      evidence: CC-7, MR-9
      detail: >-
        The producer's own null-first leave-one-out fired a non-OP-NULL label in
        2 of 48 applications, about 4.2%, against roughly 0.27% nominal. The sd
        in the denominator of z is estimated from 8 values, carrying a relative
        uncertainty of about 1/sqrt(2(n-1)) = 27%. The two OP-HARDER labels on
        the adjacent family are z = -3.18 and z = -3.01, i.e. 6% and 0.4% past
        the threshold; only the OP-EASIER at z = +6.72 and the uniform-family
        OP-HARDER at z = -5.21 are robust to that uncertainty. The report does
        flag the tight comparator spread as the reason |z| exceeds 3
        (.../TASK-20260805-74a8e9/report.md lines 324-327), which is the right
        instinct; it does not flag the estimator uncertainty of that spread. The
        practical consequence is limited because DEV-5 already forbids reading
        the labels directionally.
    - id: DEF-7
      severity: minor
      title: >-
        The summary layer names three departing cells; there are four, and the
        fourth is in the group the framing treats as the control.
      evidence: MR-9
      detail: >-
        At p=5 the uniform+correct cell is also OP-HARDER, at z = -5.21, the
        largest magnitude among the three OP-HARDER labels. The producer's own
        table at .../TASK-20260805-74a8e9/report.md line 311 DOES carry it, in
        bold, so this is not a suppression in the artifact; the omission is in
        the narrative sentence at line 316-318 and in the snapshot commit
        message, both of which describe only the adjacent family. It matters
        because a departure of larger magnitude in the uniform family weakens any
        reading in which the adjacent-FFT-bin family is the structurally special
        one.

