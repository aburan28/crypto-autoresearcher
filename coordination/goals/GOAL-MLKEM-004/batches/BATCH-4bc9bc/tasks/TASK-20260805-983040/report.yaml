        with E[max_10 N(0,1)] = 1.53844 and sd = 0.58683 (4e6-sample MC on a
        separate seed). This curve is U-SHAPED: m_z(0) = -0.8956, minimum
        -1.1849 at t = 0.365, m_z(0.75) = -0.8346. My analytic values match my
        simulated ones to ~0.02 across the whole grid. It crosses back through
        the independence baseline at t* = 0.7259.
        CONSEQUENCE, CONFIRMED AND SHARPENED: OP-HARDER is emitted for every
        shared fraction t in (0, 0.726) and OP-EASIER for t > 0.726, so the map
        from dependence strength to verdict SIGN is not injective and not
        monotone. The producer's own pre-registered mechanism -- "as t grows the
        common part cancels in M and m_z rises", in the frozen PREREG block of
