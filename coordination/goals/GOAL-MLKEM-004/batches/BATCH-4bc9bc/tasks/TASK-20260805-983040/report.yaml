  # ==================================================================
  limitations:
    - >-
      TOY SCALE. m=35, n=25, d=60, q=127, one instance, one sieve database.
      Nothing here is crypto-scale evidence and nothing bears on any FIPS 203
      parameter set (AGENTS.md rules 4, 6, 7).
    - >-
      My confound decomposition (CC-2) used 6 draws per half-ablation, not 16.
      That is enough to show each half reproduces the ensemble's range and puts
      the real value below it, and NOT enough to compare the two halves to each
      other quantitatively. I state the qualitative conclusion only.
    - >-
      The pooled 32-draw exact p-value of 0.0303 is the FLOOR for 32 draws. It
      means "below every draw", not "p = 0.03 and no smaller". More draws could
      move it down; they could not move it up.
    - >-
      My analytic SENS-T2 curve uses E[max of 10 iid N(0,1)] = 1.53844 and
      sd = 0.58683 from a 4e6-sample Monte Carlo on a separate seed, not a closed
      form. The agreement with simulation is to ~0.02 in m_z across an 11-point
      grid, which is ample for the monotonicity question and is not a
      high-precision claim about the constants.
    - >-
      I did not re-run `resolve.py --stage t1` from the recorded command, because
      doing so writes results_t1.json and would have required either overwriting
      a producer artifact or a modified command. I substituted a stronger check:
      an independently written script reproducing the real arm to 0.00e+00 and
