  objections:

    - id: OBJ-1
      severity: major
      blocks: any object-specific or dual-family-specific reading of T1
      title: The null that OUTSIDE_LOW rejects was known false before the measurement
      detail: >-
        ABL (resolve.py lines 686-692) asserts three things jointly: X row
        directions isotropic, Y iid rounded Gaussian at matched entrywise sd, and
        X independent of Y. For the certified dual family all three are false by
        construction. The package's own certificate proves the third: the
        membership identity verified at 0 violating of 447,975 entries
        (results_t1.json /certificate) IS the statement that y is a deterministic
        function of x. So rejecting ABL licenses only "the real family is not the
        ablated object", which nobody disputed, and which the campaign already
        knew when it built the certificate. The interesting claim -- that DUAL
        structure or SIEVING produces the deficit, rather than any deterministic
        x-y coupling -- has no arm in this design. This program has already been
        burned on exactly that distinction: the goal record's batch_log for
        BATCH-d3a45a records "a family NOT in the lattice, with y a deterministic
        function of x, separates at 12.1507".
      cheapest_check: >-
        Build a family with an ARBITRARY deterministic x-y coupling unrelated to
        A, with row norms and Y entrywise sd matched to SIEVE, and run it through
        the identical closed form and the frozen rule. If it also lands
        OUTSIDE_LOW, the deficit is generic to deterministic coupling and says
        nothing about dual families. No lattice compute; about 20 s per draw.

    - id: OBJ-2
      severity: major
      blocks: reading OUTSIDE_LOW as a calibrated significance statement
      title: Widening the decoupled reference class from 16 to 40 draws deflates the headline
      detail: >-
        The min/max branch is a function of which 16 decoupled draws defined the
        interval. Pooling every decoupled draw now available -- the producer's 16
        ABL plus my 8 ROWPERM, 8 XABL and 8 YABL -- gives pool means 0.9150 /
        0.7710 / 0.9797 / 0.9214 / 0.4669 and puts the real value at rank 1, 1, 2,
        13 and 0 of 40, i.e. exact per-group p of 0.0488, 0.0488, 0.0732, 0.3415
        and 0.0244 (denominator in each case: 40 pooled decoupled draws plus the
        real value = 41). On TWO of the three OUTSIDE_LOW groups the real value is
        not extremal: ROWPERM draw 05 gives near_miss_8 = 0.8477 against real
        0.8646, and XABL draw 00 gives near_miss_25 = 0.7150 against real 0.7283.
        The best exact p anywhere in T1 is 0.0244, on one group, among five
        positively-correlated groups. That is a lead, not a result. Separately,
        ROWPERM -- the most faithful decoupled null, since it keeps the real X and
        the real Y and destroys only the pairing -- has sd 0.0333 over 8 draws on
        near_miss_8 against ABL's 0.0184 over 16, so the producer's comparator may
        be narrower than the class it stands for on that group.
      cheapest_check: >-
        Report the rank of the real value in the pooled decoupled ensemble and its
        exact p, instead of a min/max branch on one ensemble. Costs nothing: the
        draws already exist.

    - id: OBJ-3
      severity: major
      blocks: reading the deficit's sign as a property of certified dual families
      title: The second archived certified dual family sits on the other side
      detail: >-
        vectors.json archives SIEVE_SUMS, a second certified dual family for the
        SAME instance, same A, same secret. Through the identical closed form,
        candidate columns and statistic it gives 0.9645 / 0.8746 / 0.9977 /
        0.9872 / 0.4891, i.e. ABOVE SIEVE on every one of the five groups.
        CAVEAT STATED FIRST: SIEVE_SUMS has X row-norm^2 mean 363.3934 against
        SIEVE's 181.4943 and Y entrywise sd 3.214222 against 2.272274, so the ABL
        ensemble is not marginal-matched to it and its four OUTSIDE_HIGH labels
        against SIEVE's interval are NOT like-for-like verdicts; I do not offer
        them as such. What is marginal-independent is the spread: the two
        certified dual families of the same instance differ by 0.0999, 0.1463,
        0.0285, 0.0678 and 0.0742 in ST-6 ratio, against a SIEVE-vs-ABL-mean
        deficit of 0.0494, 0.0429, 0.0114, 0.0009 and 0.0589. The between-object
        variation is larger than the effect on four of five groups, and the
        package has ONE object on the arm that carries the claim. This is LIM-1
        with a number.
      cheapest_check: >-
        RC-6: 8 ABL draws matched to SIEVE_SUMS's row norms and Y entrywise sd,
        then the frozen rule. Under three minutes, no lattice compute. I did not
        run it because it would exceed my declared maximum_runs of 2.

    - id: OBJ-4
      severity: moderate
      blocks: reading SENS-T1 as showing the instrument resolves the effect
      title: The positive control is off-scale and there is no negative control at effect scale
      detail: >-
        results_t1.json /T1_sensitivity records gap 0.3952453396487522 against
        threshold 0.05, with RANK5 at 0.5091 and the ABL uniform_25 minimum at
        0.9043808564728013. The effects being read are 0.0009 to 0.0589 in the
        same units, five to sixty-five times smaller. The control establishes the
        statistic is alive; it does not establish resolution at the effect scale,
        and there is no negative control -- no perturbation known to be irrelevant
        that must come back INSIDE. This matters because I measured a real-vs-ABL
        second-moment anisotropy that ABL does not preserve (X^T X/N eigenvalue
        max/min 1.2865 real against 1.1673 ABL).
      cheapest_check: >-
        A graded rank ladder at rank 34, 33, 30, 25 instead of a single rank-5
        collapse, to locate the instrument's resolution and to test directly
        whether a drop of about 0.05 is producible by second-moment structure
        alone. Four extra draws, about 20 s each.

    - id: OBJ-5
      severity: moderate
      blocks: presenting the derived-value check as calibration evidence
      title: The derived-before-the-run false-positive value is forced by construction
      detail: >-
        "1 LOW / 14 INSIDE / 1 HIGH per group" is algebraically forced whenever
        the 16 draws are pairwise distinct, as the producer states at report.md
        line 109. It verifies distinctness and correct implementation of the
        frozen rule; it carries zero information about whether the instrument
        discriminates. Commit 0d34dfcb places it in a paragraph headed
        "Discipline", beside the genuine null-first timing evidence, where it
        reads as more than it is. This is the SIXTH quantity in this campaign
        forced by construction, and the first forced in the VERIFICATION rather
        than in the measurement -- which is a lesson worth carrying into
        KN-TECH-1a5b7e's mode list. Separately, the leave-one-out rate is exactly
        1/16 = 6.25% but the rate relevant to the real arm (an independent 17th
        draw against the minimum of 16) is 1/17 = 5.88%; the producer's figure is
        the conservative one.
      cheapest_check: >-
        State the derived value's information content -- distinctness and correct
        implementation only -- in the same sentence that reports it. Costs
        nothing.

    - id: OBJ-6
      severity: moderate
      blocks: reading T2's z as a 3-sigma result or the p-pattern as robust
      title: T2's z is a t on 7 degrees of freedom and two of three headline labels are unstable
      detail: >-
        The frozen rule fires on |z| > 3 where the denominator is an sd from 8
        CAL-PERM realisations. The correct reference is Student's t with 7 df:
        two-sided P(|t_7| > 3) = 0.0199, which is 7.4 times the Gaussian 0.0027,
        per cell. The exact rank-based permutation p floor with 8 realisations is
        1/9 = 0.111 (denominator: 8 comparator realisations plus the real
        statistic), so no exact p below 0.111 is attainable in this design, while
        the report cites |z| up to 5.21. Two of the three adjacent-family labels
        sit at z = -3.18 (p=2) and z = -3.01 (p=5), and the relative standard
        error of an sd from 8 draws is about 26.7%, so both flip to OP-NULL under
        a plausible re-estimation. The characterisation "sign-inconsistent across
        p" (report.md line 319) is therefore itself label-unstable: if both
        OP-HARDERs flipped, the adjacent family would read OP-NULL / OP-EASIER /
        OP-NULL. Four of six cells firing at t_7 p about 0.02 each still exceeds
        chance, so departures exist; it is the PATTERN that is not robust.
      cheapest_check: >-
        Raise CAL-PERM realisations from 8 to 200 and report exact ranks rather
        than a parametric z on 8 points. Linear in realisations, no new
        construction.

    - id: OBJ-7
      severity: major
      blocks: any directional reading of any T2 label
      title: DEV-5 holds, and it is understated in three ways
      detail: >-
        CONFIRMED from results_t2.json /T2_sensitivity/rows: branches OP-NULL,
        OP-HARDER, OP-HARDER, OP-HARDER, OP-EASIER at t = 0, 0.10, 0.25, 0.50,
        0.75, with mean correlations rising monotonically -0.0005489, +0.3059179,
        +0.4939149, +0.6956075, +0.8673897. Three additions the package does not
        make. (i) The DOMINANT response to increasing genuine dependence is
        OP-HARDER: three of five grid points return it at z = -34.83, -49.92,
        -36.01, while the declared OP-EASIER gate at t = 0.75 returns z = +6.40 --
        OP-EASIER occurs at exactly one grid point and it is the point the gate
        was placed at. (ii) The grid never reaches the regime the real measurement
        occupies: its smallest nonzero point has mean correlation +0.3059 while
        every real cell has |mean correlation| <= 0.03305, a factor of about 9;
        since correlation is about sqrt(t) here, the real cells sit near t = 0.001,
        a hundredfold below the grid's finest nonzero point. (iii) Therefore the
        correct statement is stronger than "detects but cannot sign": at the
        dependence levels actually measured, nobody has shown the instrument
        responds to dependence at all in a way distinguishable from the two
        competing mechanisms the producer names.
      cheapest_check: >-
        Extend the SENS-T2 grid to t in {0.001, 0.005, 0.01, 0.02}, giving mean
        correlations of roughly 0.03 to 0.14, which brackets the real cells.
        Synthetic only; seconds of compute.

    - id: OBJ-8
      severity: minor
      blocks: nothing
      title: Commit 0d34dfcb misstates the SENS-T1 margin
      detail: >-
        The message reads "SENS-T1 cleared its pre-declared 0.05 threshold by
        0.3952". results_t1.json /T1_sensitivity records gap 0.3952453396487522
        and threshold 0.05: the GAP is 0.3952 and the margin OVER the threshold is
        0.3452. The producer's own wording at report.md line 125 is correct --
        "gap **0.3952** against a threshold of 0.0500" -- and the message garbled
        a correct statement into a wrong one.
      cheapest_check: >-
        Supersede with the producer's form. Costs nothing.

    - id: OBJ-9
      severity: minor
      blocks: nothing
      title: One attribution in commit 0d34dfcb carries a phrase the producer did not use
      detail: >-
        "DEV-5, which the producer calls the most important thing T2 produced".
        The producer's string is "most important caveat in T2" (report.md line
        259). A caveat is not a thing produced. This is a Coordinator paraphrase
        carried by an attribution verb. I record it because seven prior
        Coordinator messages carried a defect and the most recent was fabricated
        attribution -- and I state plainly that THIS IS NOT THAT. Every string the
        message places inside quotation marks ("dependence makes the attack
        harder") appears in report.md at line 330, and every figure the message
        quotes traces to results.json, results_t1.json or results_t2.json; I
        checked each one. The quote-only-from-declared-paths rule was kept.
      cheapest_check: >-
        Attribute only strings that appear, or drop the attribution verb.

    - id: OBJ-10
      severity: moderate
      blocks: nothing in this package; binds the successor
      title: The design has one degree of freedom on the arm that carries the claim
      detail: >-
        40 decoupled draws against 1 real database. LIM-1 states this and OBJ-3
        prices it: the between-real-object spread I measured (0.0285 to 0.1463
        across the two archived certified dual families) is comparable to or
        larger than the deficit (0.0009 to 0.0589). Until the real arm has n > 1
        the T1 comparison is one-sided by construction, and replicating the
        COMPARATOR -- which is what KN-TECH-1a5b7e's new mode 5 prescribes -- is
        only half of the fix. Mode 5 as written should say so: replicate the
        comparator AND the real arm, or state that the real arm is n = 1.
      cheapest_check: >-
        R independent real sieve databases at fixed candidates, R >= 4. One sieve
        per replicate; the closed form is about 20 s each.

    - id: OBJ-11
      severity: major
      blocks: treating any ST-6-family quantity in this campaign as verified
      title: The parameter meant to destroy this class of quantity has never been varied
      detail: >-
        docs/inventor-protocol.md section 3 requires asking what a quantity should
        do as the parameter meant to destroy it increases. For this class that
        parameter is m, at fixed (N, K), and it has not moved in six batches.
        RC-5 is carried unmet from RT-20260804-37a8f2 and RT-20260804-0ff29a and
        is now three batches old; the producer names it first among what remains
        open and states the falsifiable prediction at report.md lines 450-452:
        "the uniform-group floor should track `1 - O(K/m)`, so raising m at fixed
        (N, K) must raise it toward 1." Until that is run, every ST-6-family
        quantity in this campaign, including this one, sits at the protocol's
        unverified tier on the decay axis.
      cheapest_check: >-
        The sweep itself: m in {35, 50, 70, 100} at fixed (N, K), closed form
        only, no scoring and no g6k. This is the cheapest thing that could move
        the result and it is the successor's first measurement.

  required_controls:
    - id: RC-A
      control: >-
        A family with an ARBITRARY deterministic x-y coupling unrelated to A,
        marginals matched to SIEVE, through the identical closed form and frozen
        rule. Separates "the dual family departs" from "any deterministic
        coupling departs". OBJ-1.
    - id: RC-B
      control: >-
        Report the real value's rank and exact p in the POOLED decoupled ensemble
        rather than a min/max branch on one 16-draw ensemble. OBJ-2. Already
        computable from existing draws.
    - id: RC-C
      control: >-
        RC-6: an ABL ensemble marginal-matched to SIEVE_SUMS (row norms and Y
        entrywise sd), so that the second certified dual family gets a
        like-for-like verdict. OBJ-3.
    - id: RC-D
      control: >-
        A graded rank ladder (34, 33, 30, 25) as the SENS-T1 positive control,
        plus one negative control at effect scale that must return INSIDE.
        OBJ-4.
    - id: RC-E
      control: >-
        200 CAL-PERM realisations with exact ranks, replacing the parametric z on
        8 points. OBJ-6.
    - id: RC-F
      control: >-
        SENS-T2 extended to t in {0.001, 0.005, 0.01, 0.02}, bracketing the
        dependence regime the real cells occupy. OBJ-7.
    - id: RC-5
      control: >-
        THE DIMENSION SWEEP AT FIXED (N, K), unmet for three batches. m in
        {35, 50, 70, 100}, closed form only. The only named parameter supposed to
        destroy this class of quantity. OBJ-11.
    - id: RC-G
      control: >-
        R >= 4 independent real sieve databases at fixed candidates, converting
        the real arm from n = 1. OBJ-10, LIM-1.

  counterexample_or_mutation: >-
    SIEVE_SUMS, the second archived certified dual family for the same instance,
    same A and same secret, through the identical closed form, candidate columns
    and statistic: 0.9645 / 0.8746 / 0.9977 / 0.9872 / 0.4891 against SIEVE's
    0.8646 / 0.7283 / 0.9692 / 0.9194 / 0.4149 -- above it on all five groups by
    0.0285 to 0.1463, which exceeds the 0.0009-0.0589 SIEVE-vs-ABL-mean deficit
    on four of five groups. Its marginals differ (X row-norm^2 mean 363.3934
    against 181.4943; Y entrywise sd 3.214222 against 2.272274), so this is a
    SPREAD counterexample and not a SIGN counterexample, and I state that limit
    rather than trading on the OUTSIDE_HIGH labels it produces against a
    non-matched interval.

    The mutation that would settle it is RC-C, three minutes and no lattice
    compute, deliberately not run against a declared maximum_runs of 2.

  baseline_comparison: >-
    No baseline comparison applies and none is claimed: this is a measurement
    package with no attack, no solve, no relation, no cost model and no
    complexity claim. There is no Pollard-rho, BSGS or specialised-baseline
    comparison to make, and the package correctly makes none. dominated_by is not
    null-by-omission here -- it is not a field this deliverable can have, since
    nothing on any cost axis is offered. sota_delta: "no attack; measurement and
    method contribution only". The one place a Pareto question could arise --
    whether the measured departure changes MATZOV.Nf's N -- is explicitly
    disclaimed by the producer at report.md line 15 and is NOT computed anywhere
    in six batches.

  heuristic_challenges:
    - >-
      The package states no numbered heuristic and needs none; it also declares
      none validated or refuted (report.md line 15). That is correct conduct and
      it is also the reason completion criterion C2 is not met.
    - >-
      The IMPLICIT heuristic in reading OUTSIDE_LOW as informative is that the
      ablated ensemble is the right null. I tested it and it holds (three nested
      nulls exchangeable with ABL at 7 of 120 below-minimum against 5.88%
      expected). The implicit heuristic that does NOT hold is that rejecting that
      null implicates the dual family, since the null is false by construction on
      three counts (OBJ-1).
    - >-
      T2's implicit heuristic is that m_z signs the operational effect. DEV-5
      refutes it and the producer says so. My addition: the instrument's response
      is not merely unsigned but uncharacterised in the regime measured (OBJ-7).

  cost_model_challenges:
    - >-
      No cost model is offered and none is challenged. The producer's own cost
      report -- 303.8 s total, 680 MB peak for 16 ablated draws plus the positive
      control plus the real arm, against RT-20260804-0ff29a's estimate at line
      786 of "8 draws x 20 s = under 3 minutes, no lattice compute." -- is
      consistent with my own runs at about 20-30 s per closed-form evaluation on
      4 cores.
    - >-
      Every control I name is cheap on the same scale: RC-A, RC-B, RC-C, RC-D and
      RC-5 need no g6k and no fpylll. RC-G needs one sieve per replicate and is
      the only expensive item. Cost is not what has been blocking this campaign.

  reduction_and_scope_challenges:
    - >-
      No reduction is invoked and none is challenged.
    - >-
      Scope is correctly and repeatedly stated: one instance, one database, dim
      60, q=127, toy scale, and the producer binds every sentence to it. I found
      no extrapolation to FIPS 203 dimensions anywhere in the package, the
      knowledge entry or the commit message.
    - >-
      SCOPE INFLATION RISK for the ledger, not for the producer: "the real family
      falls outside the ablated interval on the three groups that carry the
      headline" must not be recorded without "on one database, against one
      16-draw comparator, with best exact per-group p 0.0244 of five correlated
      groups, and with the second archived certified dual family on the other
      side."

  proof_architecture_challenges:
    - >-
      Not applicable: no theorem, asymptotic bound, certificate family, reduction
      or closure argument is proposed, so no proof_search_map is owed. The one
      formal argument the package does make -- that the frozen rule is exhaustive
      over its full input space by trichotomy plus a total catch-all (report.md
      lines 133-138) -- is correct, and the producer correctly notes that
      exhaustiveness is not discrimination.

  security_claim_scan:
    result: NONE FOUND
    method: >-
      Searched report.md, results.json, results_t1.json, results_t2.json,
      KN-TECH-1a5b7e.md and commit message 0d34dfcb for break / broken / insecure
      / vulnerable / bits of security / FIPS 203 / Kyber / speedup / faster /
      reduces the cost / affected / exploit shapes.
    findings: >-
      Every hit is an explicit disclaimer, plus one reference to a broken fpylll
      constant. The closest sentence to an operational claim is report.md line
      315, "**An operational sign now exists as a measurement, and it is not
      consistent.**", and line 330 forecloses it: OP-HARDER "must not be read as
      'the dependence makes the attack harder'". Commit 0d34dfcb carries the same
      disclaimer and repeats the DEV-5 caveat. No security claim exists in either
      direction in either place.

  dev5_ruling:
    holds: true
    statement: >-
      CONFIRMED, not refuted, and understated. SENS-T2 passed both declared gates
      and is non-monotone in between, so the instrument detects a departure and
      cannot sign one, and OP-HARDER must not be read as "dependence makes the
      attack harder". I add that the DOMINANT response to rising genuine
      dependence is OP-HARDER (three of five grid points, |z| 34.8 to 49.9, against
      the single OP-EASIER point at z = +6.40 where the gate was placed), and that
      the grid never reaches the dependence regime the real cells occupy
      (smallest nonzero grid |mean corr| 0.3059 against the real cells' maximum
      0.03305, a factor of about 9).
    campaign_consequence: >-
      CONFIRMED: after six batches this campaign has NO OPERATIONAL DIRECTION AT
      ALL, in either sense. In the T2 sense the sign cannot be read from the rule.
      In the T1 sense the direction is reported as downward but not attributed by
      the producer (report.md line 217), no Nf was recomputed (report.md line 15),
      and the second archived certified dual family sits on the other side of the
      same interval on four of five groups.

  terminal_disposition:
    should_the_goal_close: >-
      YES, at `closed_at_budget`, which asserts no success. NOT at `completed`.
    is_any_declared_completion_criterion_met: >-
      YES for three of the four, and I say so plainly because understating a met
      criterion is itself a contract violation. But the one criterion that
      asserts a scientific result is NOT met, and a goal chartered to make a
      measurement cannot close `completed` on procedural criteria alone.
    criteria_ruling:
      - criterion: >-
          C1 -- a measured score distribution of sieve-produced dual vectors at a
          stated set of reduced dimensions, with sieve algorithm, dimension,
          modulus, secret and error distributions, vector count and random seed
          recorded, reproducible from the archived script.
        ruling: MET
        evidence: >-
          EV-MLKEM-da9e3b (BATCH-d2a728, 17,919 g6k bgj1 vectors at dim 60 /
          q=127), re-verified in this snapshot at results_t1.json /certificate
          (447,975 entries checked, 0 violating, 60 exact-bigint rows, 0
          duplicate x rows) and /instance_regenerates_from_seed (A and s
          identical from seed 20260803206).
        scope_note: >-
          The "set of reduced dimensions" has exactly ONE element. RC-5 has gone
          unrun for three batches and the producer names it first among what
          remains open. If "a stated set" is read as requiring more than one
          dimension, C1 is not met either. The Coordinator must make that reading
          in the open.
      - criterion: >-
          C2 -- an explicit comparison of that distribution against the
          independence structure underlying MATZOV.Nf's closed-form advantage
          computation, reporting the direction and size of any departure or
          reporting agreement, with a null of the right shape run BEFORE any
          departure is believed.
        ruling: NOT MET
        evidence: >-
          The final package disclaims it in its own scope banner (report.md line
          15: "No Nf recomputed or corrected. No heuristic declared validated or
          refuted.") and its T1 measurement involves no scoring at all
          (results_t1.json /T1/what_is_measured). The one batch that did report a
          departure against that structure, EV-MLKEM-d777f0, carries
          `direction: mixed` and the headline "The across-candidate departure is
          MOSTLY FORCED", with the reported factor of 2 becoming 1.10 under both
          reviews. No direction stands. THIS IS THE CRITERION THAT CARRIES THE
          GOAL'S OBJECTIVE.
      - criterion: >-
          C3 -- independent Validator and Red Team sessions admit the run
          package.
        ruling: MET FOR ONE OF SIX BATCHES, PENDING FOR THIS ONE
        evidence: >-
          BATCH-d2a728: VAL-20260803-535d15 ADMISSIBLE_WITH_DEFECTS and
          RT-20260803-4064e1 pass_with_constraints. BATCH-f75059, BATCH-c45baf,
          BATCH-d3a45a and BATCH-a2bb63 each drew blocking_objections from the
          red team. For BATCH-4bc9bc I return pass_with_constraints; C3 is met for
          this package if TASK-20260805-983040 concurs.
      - criterion: >-
          C4 -- Coordinator evidence, decision and warranted knowledge entries
          committed through verified ledger archives, scoped to what was
          measured.
        ruling: MET
        evidence: >-
          Five batches carry decision_id, evidence_id, snapshot_commit and two
          reviews in ledger/goals/GOAL-MLKEM-004.yaml batch_log; this batch's
          snapshot 0d34dfcb verifies against its declared artifact set.
    ruling_rationale: >-
      C1, C3 and C4 are PROCEDURAL: they say the parameters were recorded, the
      archives verified and one package admitted. C2 is the only criterion that
      asserts a scientific result and it is not met. Closing `completed` on
      C1/C3/C4 would be closing on process while asserting a success the campaign
      did not achieve. The goal's own next_action sets the bar at `completed` only
      if "a declared completion criterion is actually met and cited" -- SINGULAR --
      and I flag that reading explicitly because it is exactly the seam where a
      criterion gets manufactured. My ruling: a procedural criterion cannot carry
      a `completed` on a measurement goal.
    not_a_closure_of_the_lane: >-
      This is a BUDGET EXHAUSTION, not a closure. Under docs/inventor-protocol.md
      section 4 a closure needs a named obstruction, an argument and forward
      guidance. THERE IS NO NAMED OBSTRUCTION HERE. The campaign did not hit one;
      it ran out of batches with a live, cheap-to-test lead. Six batches and five
      refuted observables is a fatigue report about the search, not a statement
      about the problem, and the decision record must say so in those terms and
      must not read as "the question is dead".
    should_a_successor_open: true
    successor_first_batch: >-
      1. RC-5, the dimension sweep at fixed (N, K): m in {35, 50, 70, 100}, closed
      form only, no scoring and no g6k. The prediction is already falsifiable and
      written down at report.md lines 450-452: the uniform-group floor should
      track 1 - O(K/m), so raising m at fixed (N, K) must raise it toward 1.
      2. RC-G, the complementary ensemble: R >= 4 independent real sieve
      databases at fixed candidates, converting the real arm from n = 1.
      3. RC-A, a family with an arbitrary deterministic x-y coupling unrelated to
      A, marginals matched.
    why_that_is_not_this_campaign_renamed: >-
      All six batches varied the OBJECT at fixed (m, n, N, K, one instance, one
      database), and every refutation came from exhibiting another object. The
      successor varies what six batches never varied: the PARAMETER (m) and the
      REPLICATE (R real databases). It also carries a pre-committed falsifiable
      stopping rule that this campaign never had: if the uniform floor tracks
      1 - O(K/m), the whole ST-6 family is finite-m Gram geometry and this program
      gets its FIRST closure with a named obstruction -- a better outcome than a
      seventh refuted observable. If it does not track, the residual has survived
      the one parameter that was supposed to destroy it and becomes worth real
      compute for the first time.
    what_six_batches_produced:
      real_and_durable:
        - A working instrument rebuilt from KN-TECH-14efa5 six times in an ephemeral container, with the version drift recorded each time.
        - A certified dual-vector database checkable without g6k -- 17,919 vectors, 0 violating of 447,975 entries, re-verified this batch by code that does not call the archived certify(). It outlives the campaign.
        - FIVE observables refuted BY CONSTRUCTION rather than by a p-value, each by exhibiting an object without the structure the observable was meant to detect that reproduced the number. That is the strongest form of negative result available and this program produced five in six batches.
        - Three superseding technique entries (KN-TECH-9d21c4 -> KN-TECH-6c0e15 -> KN-TECH-1a5b7e) codifying a forced-quantity taxonomy, now five modes with a forced_value_regime field and a monotonicity refinement. Method, transferable, not LWE-specific.
        - One quantity that survived comparator replication to n=16 and survived three nested nulls I built to kill it, localised entirely to the alignment between the sieve pool's Gram matrix and the candidate phase matrix.
      not_there:
        - No statement about MATZOV.Nf. The final package disclaims one.
        - No statement about the independence heuristic at any dimension.
        - No operational direction, in either sense.
        - No evidence at cryptographic scale, and none claimed.
        - The surviving quantity is one instance, one database, one statistic, best exact per-group p 0.0244 of five correlated groups, and it points the other way on the second archived family.
      honest_summary: >-
        Six batches converted a plausible measurement programme into a
        well-characterised method for killing plausible measurements, plus one
        lead smaller than the between-object variation nobody has measured. Under
        docs/inventor-protocol.md section 2 that is a real deliverable, and it is
        not the deliverable the goal was chartered to produce.

  narrowest_supported_statement: >-
    On one toy LWE instance (m=35, n=25, d=60, q=127, sigma=2, eta=2, seed
    20260803206) and one certified g6k bgj1 dual database of N=17,919 vectors,
    the ST-6 ratio K_eff_trail/(K-1) computed in closed form with no scoring on
    fixed candidate columns is lower for the real family than for 16 draws of a
    family-ablated null on three of five candidate groups, and lies within the
    null's range on the other two. Widening the decoupled reference class to 40
    draws by adding three nested nulls that preserve the real X, the real Y, or
    both, places the real value at rank 0, 1, 1, 2 and 13 of 40 across the five
    groups, i.e. exact per-group p of 0.0244, 0.0488, 0.0488, 0.0732 and 0.3415
    (denominator in each case: 40 pooled decoupled draws plus the real value =
    41), with five positively-correlated groups examined. The deficit is
    localised entirely to the alignment between the sieve pool's Gram matrix and
    the candidate phase matrix, since permuting that alignment while preserving
    both exactly recovers the null. The second archived certified dual family for
    the same instance lies above the first on all five groups by 0.0285 to
    0.1463, which exceeds the deficit on four of five. NOTHING follows about the
    dual family as a class, about sieving, about MATZOV.Nf, about the
    independence heuristic, about any dimension other than the one measured, or
    about ML-KEM.

  next_concrete_action: >-
    Record the terminal disposition as `closed_at_budget` with C2 named as the
    unmet criterion and C1/C3/C4 named as met-and-procedural, state in the
    decision record that no obstruction was found and the lane is NOT closed, and
    open a successor goal whose FIRST batch is RC-5 -- the dimension sweep at
    fixed (N, K), m in {35, 50, 70, 100}, closed form only, no scoring and no
    g6k -- pre-registered against the producer's own falsifiable prediction that
    the uniform-group floor tracks 1 - O(K/m). It is unmet for three batches, the
    producer names it as the cheapest thing that would move the result, and it is
    the one measurement that can convert this campaign's lead into either a
    finding or the program's first named obstruction.

  rule12_status: >-
    UNMET and UNWAIVED, inherited. No status change to any EV-MLKEM-* record and
    none proposed. No KN-* entry changed. This report is an objection record, not
