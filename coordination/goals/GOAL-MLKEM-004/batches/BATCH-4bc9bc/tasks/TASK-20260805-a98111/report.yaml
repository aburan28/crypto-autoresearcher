  verdict: pass_with_constraints

  verdict_note: >-
    Every quantity I could check reproduced. My own ST-6 implementation, fed the
    archived closed form on the archived candidate columns, returns the real arm
    to four decimals; two of the sixteen ABL draws reproduce from the producer's
    recorded seeds to four decimals; every T1 interval, mean, sd, z and branch
    recomputes from results_t1.json; every T2 z recomputes from the recorded
    8-realisation comparator arrays to 1e-6; report.md is byte-identical to
    results.json report_markdown at the sha256 declared in receipt.json; and
    KN-TECH-6c0e15 and KN-TECH-9d21c4 are at 0 diff lines. There is no security
    claim anywhere in the package or in the commit message.

    I attacked the ablation on the axis the card names -- does ABL differ from
    the real arm in a SECOND way -- and I FAILED, which I report because it
    failed. I built the three nested nulls that separate the three things ABL
    destroys at once (ROWPERM: X real, Y real, only the row pairing broken;
    XABL: X ablated, Y real; YABL: X real, Y ablated), 8 draws each. All fifteen
    group means sit within 0.68 ABL ensemble sd of the ABL mean, and 7 of 120
    control-draw/group cells (denominator: 3 constructions x 8 draws x 5 groups)
    fall below the ABL minimum, against the 1/17 = 5.88% rate expected under
    exchangeability. The producer's ablation is CALIBRATED. My conjectured
    mechanism -- that a sieve pool is pairwise-reduced and so has lighter Gram
    tails than the isotropic null -- is REFUTED by measurement: pairwise cosine
    off-diagonals on a common 3000-row subsample give real sd 0.16924 / kurtosis
    2.8460 against ABL 0.16890 / 2.8406. Because closed_form_cov depends on X
    only through X X^T and the row norms, ROWPERM is a complete decomposition:
    the whole deficit lives in the ALIGNMENT between the sieve pool's Gram matrix
    and the candidate phase matrix. That is stronger and cleaner than the package
    claims, in the producer's favour, and I record it as such.

    What the OUTSIDE does NOT survive is the interpretation. Three things.
    (i) The null being rejected is known false by construction on all three of
    its assertions -- the package's own membership certificate (0 violating of
    447,975 entries) IS the statement that y is a deterministic function of x --
    so OUTSIDE_LOW licenses "the real family is not the ablated object", which
    nobody disputed. (ii) Widening the decoupled reference class from 16 draws to
    40 (the producer's 16 ABL plus my 8 ROWPERM, 8 XABL, 8 YABL) moves the real
    value to rank 0-2 of 40 on the three OUTSIDE groups, with the best exact
    per-group p being 0.0244 (denominator: 40 pooled decoupled draws plus the
    real value = 41) on ONE group of five positively-correlated groups; and on
    two of the three OUTSIDE_LOW groups the real value is NOT extremal, since
    ROWPERM draw 05 gives near_miss_8 = 0.8477 against real 0.8646 and XABL draw
    00 gives near_miss_25 = 0.7150 against real 0.7283. (iii) The SECOND archived
    certified dual family for the SAME instance, SIEVE_SUMS, sits on the other
    side of the same interval on four of five groups; its marginals differ so
    those labels are not like-for-like, but what is marginal-independent is that
    the two certified dual families differ from each other by 0.0285 to 0.1463 in
    ST-6 ratio against a SIEVE-vs-ABL-mean deficit of 0.0009 to 0.0589.

    The package is admissible and its conduct is good: null arm demonstrably
    first, ten known-answer controls before any research number, ten deviations
    declared against itself including one caught by its own cross-check, a
    prediction recorded as WRONG, a refusal to predict where it could not derive,
    and an explicit refusal of the conclusion its own numbers invite. The
    constraints are that no object-specific reading of T1 and no directional
    reading of T2 may enter any ledger record.

  claim_under_review: >-
    That at n=16 the real certified dual family falls OUTSIDE the family-ablated
    null's interval, below it, on the three groups carrying the headline and
    INSIDE on the two uniform groups; that the derived-in-advance false-positive
    value being met on all five groups is evidence of instrument discipline; that
