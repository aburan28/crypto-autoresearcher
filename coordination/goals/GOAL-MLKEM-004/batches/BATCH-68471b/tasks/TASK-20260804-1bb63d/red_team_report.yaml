  # -----------------------------------------------------------------------
  # Outlier sensitivity (new blocking objection)
  # -----------------------------------------------------------------------
  outlier_sensitivity:
    outlier_runs:
      - run_index: 27
        seed: 2941775225
        T_N: 7789.567
        z_score: 2.588
        sieve_seconds: 14.108      # 0.71 s above mean (2.1 σ in sieve-time)
      - run_index: 67
