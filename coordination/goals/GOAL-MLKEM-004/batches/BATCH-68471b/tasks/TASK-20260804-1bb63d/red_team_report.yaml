  task_id: TASK-20260804-1bb63d
  producer_task_id: TASK-20260804-52cc2b
  snapshot_commit: a54fe74d94e796d4cb8d1d5fe90a48a768425e78
  verdict: blocking_objections
  summary: >
    The chi2 test arithmetic is correct and T_N passes normality, but two independently
    blocking concerns prevent interpretation as evidence against the Ducas-Pulles independence
    assumption: (1) every data point comes from QEMU x86_64 emulation on ARM64 hardware
    that demonstrably shifts the sieve vector distribution by ~107 T_N units relative to
    batch-1, and (2) three runs (indices 27, 67, 97) with near-identical extreme T_N values
    (~7790) drive p from 0.034 to 0.001, and their origin under QEMU warrants independent
    scrutiny before the significance level can be trusted.

