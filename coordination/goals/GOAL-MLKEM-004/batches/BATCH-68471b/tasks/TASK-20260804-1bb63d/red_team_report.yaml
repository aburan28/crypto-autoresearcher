      Using batch-1 Var[s_i]=0.332505 makes the test MORE significant (p=0.0005 vs
      0.001123). The within-env denominator is the correct choice for a self-contained
      test, and is conservative relative to batch-1.
    inflation_needed_to_lose_significance_pct: 16.2
    required_ssv_to_lose_sig: 0.395636
    conclusion: >
      The conclusion is robust to the choice between batch-1 and within-env denominators.
      The denominator would need to be 16.2% higher than run-0's estimate to make the
