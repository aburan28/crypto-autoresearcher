  scope_limits_of_this_review:
    - Toy scale throughout. d=60 and d=50, q=127, one modulus. Nothing here is a statement about ML-KEM or FIPS 203.
    - >-
      My control is three ensembles, one instance and one seed each, one statistic,
      800 draws, 5 surrogate realisations. E1's coupling is far stronger than a
      lattice's (excess 17 vs 1.32) and E3's norm profile is 2.6x the sieve's, so I
      reproduce the SIGN, the growth law, the flat surrogate and the group ordering
      -- NOT the magnitude. I claim exactly that and no more.
    - >-
      I did not re-run the sieve. g6k was not built in this session, so the
      producer's databases were not regenerated; provenance rests on the archived
      certificate arithmetic, which I did re-derive.
    - >-
      I did not exercise the pinned estimator. Every Nf and adjacent-bin figure is
      marked unable_to_check above.
    - >-
      OBJ-1 does NOT say the independence heuristic holds, that no measurable
      structure exists in a sieve database, or that this lane is dead. It says one
      specific comparison cannot distinguish the hypothesis from a definitional
      relation. Closing the lane on this basis would be exactly the premature
      closure inventor-protocol section 4 forbids, and I am not proposing it.
    - >-
      Model independence remains procedural, not model-level: the producer, both
      batch-2 reviewers and this red team all resolve to claude-opus-5.
      Rule 12 UNMET and UNWAIVED.

  narrowest_supported_statement: >-
    At m=35, n=25, q=127, on the nine BATCH-f75059 replicate instances
    (provenance verified: seeds and N match, a_x agrees at 0.0, 4,031,775
    certificate entries with 0 violations), a row-permutation surrogate that
    preserves both multisets and every column marginal differs from the real
    sieve database on near-miss group statistics by +31.7% (spread) and -11.1%
    (separation from the best near-miss), 9 of 9 instances, with the excess
    growing as sqrt(1 + 4.10e-05 N'). Those numbers are correct and I reproduce
    them. Independently, the same pattern -- separation, direction, growth in N',
    flat surrogate, and the uniform/secret-distribution/near-miss ordering -- is
    produced by iid Gaussian x with y := x[0:25] (no lattice, no sieve, no A, no
    modulus) and by a valid non-sieve dual-vector family from fpylll BKZ, and is
    absent when the same marginals are given an independent y. The comparison
    therefore measures that the real vectors satisfy y = A^T x mod q while the
    surrogate does not, which is true by the definition of a dual vector. It is
    not evidence about the dual-attack independence heuristic, at this or any
    scale. Nothing here is a statement about ML-KEM, FIPS 203, the cost of any
    attack, or any security property in either direction. No break, no security
    proof, no speedup, no status change.

  batch_4_recommendation:
    verdict: CHANGE
    do_not: >-
      Do not close. The lane is not dead, the producer did nothing wrong
      procedurally, and the package is the most disciplined in the campaign.
      Closing on OBJ-1 would be premature closure under inventor-protocol
      section 4, and the obstruction I name is to ONE COMPARISON, not to the
      question.
    do_not_2: >-
      Do not continue as planned. Replicating the row-permutation separation at
      more instances, more N, or a second (m,q) pair buys nothing: OBJ-1 says the
      answer is fixed a priori, and more instances of an a-priori-fixed answer is
      more of the same number.
    change_to: >-
      Retarget batch 4 at the heuristic's own null instead of the surrogate.
      Concretely: (1) report sd_ratio_to_iid against 1.0 with error bars for every
      group in both stages -- already in the archived JSON, zero compute; (2) run
      RC-1, the norm-matched valid-lattice surrogate, which is the null that could
      have distinguished sieving from membership and was never run; (3) run
      Stage A's comparison on ADJACENT-FFT-BIN candidates on all nine instances,
      the family a dual attack actually enumerates.
    cheapest_check_that_decides_it: >-
      RC-1, the norm-matched valid-lattice surrogate. Generate a second family of
      valid dual vectors from the SAME lattice with ||x||, ||y|| matched row-for-row
      to the sieve database, and score it identically. If it separates from its own
      row-permuted surrogate at the same 1.32, the effect is lattice membership and
      the campaign's central result is OBJ-1's tautology, settled. If the sieve
      database separates and the matched valid family does not, I am wrong, the
      effect is about SIEVING specifically, and that is a genuine and interesting
      finding worth batch 4 and 5. Under 10 minutes, fpylll only, no g6k required,
      no new instrument. This one experiment decides the whole campaign direction.

