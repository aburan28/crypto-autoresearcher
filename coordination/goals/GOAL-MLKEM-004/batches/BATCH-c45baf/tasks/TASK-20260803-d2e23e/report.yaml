  scope_banner: >-
    TOY SCALE. m=35, n=25, d=60, q=127, secret CB eta=2, error rounded-Gaussian
    sigma=2. No ML-KEM break claim, no security proof, no FIPS 203 parameter set
    affected or cleared, no speedup, no cost claim. AGENTS.md rule 12 UNMET and
    UNWAIVED: this report changes the status of no EV-MLKEM-* record and no KN-*
    entry and proposes no change. Observations and objections only.

  verdict: blocking_objections

  verdict_note: >-
    The arithmetic is clean and the scope discipline is the best in this
    campaign; nothing here is a fabrication or a computational error. The
    blocking objection is INTERPRETIVE and it is decisive: the row-permutation
    surrogate does not test the dual-attack independence heuristic. Its sign and
    its growth in N' are fixed a priori by the fact that a dual vector satisfies
    y = A^T x mod q, so on data that ARE lattice vectors the comparison cannot
    come out any other way. I reproduced the entire qualitative pattern --
    separation, direction, monotone increase in N', flat surrogate, and the
    graded uniform/secret-distribution/near-miss contrast -- on an object with no
    lattice, no sieve, no A and no modulus in the construction of y. The data
    stand; the reading "the campaign's central result" does not.

  claim_under_review: >-
    That the BATCH-f75059 row-permutation separation replicates on 9 of 9
    instances (near-miss sd-ratio excess 1.3169 +/- 0.0188, correct minus
    best-of-8 excess 0.8893 +/- 0.0115), that its monotone increase in N' against
    a flat surrogate is an anti-artifact signature, that the uniform group's
    null response is an internal contrast supporting the reading, and that the
    Stage B tuple bought a testable successor design.

  what_i_ran:
    id: RTC-1
    description: >-
      One control experiment, three ensembles, statistic reproduced from
      stage_a.py in independent code. No g6k and no sieve used anywhere. Full
      source, hashes, console output and limits in notes.md sections 2 and 8.
    command: /tmp/sagevenv-val3fc363/bin/python3 rt_controls.py
    wall_seconds: 96.4
    exit: 0
    script_sha256: 220aabdbeeb0a59bf6409767474912feee6948685c525745703e71c9254aec1b
    results_sha256: 86cc35be6ee7d4e782337b17188b08e0fca935124ef07bf0c0fd67178b9d02a2
    environment: numpy 2.4.6, fpylll 0.6.4 (existing venv /tmp/sagevenv-val3fc363, read-only use)
    rebuild_recipe_note: >-
      KN-TECH-14efa5's fpylll fix (Strategy(b) for b in range(41); BKZ.EasyParam
      unusable) was required and applied. The g6k half of the recipe was not
      needed and was not exercised in this session.
    certificate:
      kind: lattice_membership
      statement: every emitted (x,y) of ensemble E3 satisfies y == A^T x (mod q)
      checked_entries: 447975
      violating_entries: 0
      solve_claim_certificate: none -- no discrete-log solve and no relation is claimed
    discarded_or_repeated_runs: 0
    unreported_runs: 0

  objections:

    - id: OBJ-1
      severity: blocking
      title: >-
        The row-permutation null is not a null for the independence heuristic.
        Its sign and its N'-growth are forced by y = A^T x mod q, and I
        reproduced the whole pattern with no lattice at all.
      challenge: >-
        DERIVATION FIRST, before any number was consulted. For a near-miss
        candidate c_k = s + e_k the phase offset is -Y[i,k], and lattice
        membership gives Y[i,k] = a_k . x_i mod q with a_k = A[:,k]. Substituting,
        score_k(real) = (1/N) sum_i cos(2 pi (e - a_k).x_i / q) = F(e - a_k),
        a single Fourier coefficient of the x-database; the correct score is
        F(e). Because every emitted vector is short, a_k . x_i = Y[i,k] is small
        (measured mean||y||^2 = 129.5 over n=25, rms 2.28 per coordinate), so a_k
        is BY CONSTRUCTION a frequency at which the database is coherent, and the
        cross-moment (1/N) sum_i g(y_i) h(x_i) converges to a NON-ZERO ensemble
        limit. The across-candidate spread therefore carries an N-independent
        floor. Under the row permutation, E_pi[score_k] = <cos u><cos phi_k> -
        <sin u><sin phi_k>, a product of separately-averaged marginals with NO
        N-independent cross term, so its spread decays as N^{-1/2} and its ratio
        to sqrt(0.5/N) is flat. Both halves are consequences of the definition of
        a dual vector. Predicted: surrogate flat (measured 0.105557 / 0.106222 /
        0.106614 / 0.106552, range 0.001058) and real excess > 1 growing as
        sqrt(1 + beta N') (measured 1.0146 / 1.0434 / 1.1480 / 1.3169).
        EMPIRICAL CONFIRMATION. Ensemble E1: x ~ iid rounded Gaussian in Z^35
        with variance matched to the real a_x, and y := x[0:25]. No lattice, no
        sieve, no A, no LWE instance, no modular arithmetic in the construction
        of y. It matches the real a_x and a_y almost exactly by arithmetic
        accident (0.904 vs 0.888; 0.161 vs 0.158). Result: near-miss excess
        17.078 with row-permuted arm 0.1082 against the real data's 0.1066;
        decay 3.050 / 6.045 / 11.207 / 17.157, monotone increasing; uniform
        0.9833 (no separation); secret-distribution 1.4801 (intermediate). The
        ENTIRE qualitative pattern, including the graded internal contrast, on an
        object with no lattice in it. Ensemble E2 (identical marginals, y built
        from an INDEPENDENT x') gives near-miss excess 1.0371 and flat decay
        1.010 / 1.019 / 1.007 / 1.059, so the statistic is not broken and CAN
        return null -- it separates exactly when y depends on x.
      consequence: >-
        The measurement is not a logical tautology (E2 can return null), but on
        the class of data at hand it is: the real database consists of dual
        lattice vectors, so y IS a deterministic function of x, so the sign and
        the growth are determined before any sieve is run. The row-permutation
        surrogate therefore cannot discriminate "the dual-attack independence
        heuristic fails" from "these are lattice vectors and the surrogate is
        not". RT-20260803-dc7568's sentence "it is localised to the (x_i, y_i)
        pairing, which is the object whose independence MATZOV.Nf asserts" is the
        load-bearing error: Nf's heuristic asserts independence ACROSS CANDIDATE
        SCORES, not independence of x from y, which no dual attack ever assumes
        and which is false by definition.
      cheapest_check: >-
        Norm-matched valid-lattice surrogate. Take the same lattice, generate a
        SECOND valid dual-vector family whose ||x|| and ||y|| profiles match the
        sieve database row-for-row (rejection-sample sparse combinations of a
        BKZ-reduced basis into the sieve's norm band), and run the identical
        statistic. If it separates too -- E3 already says a non-norm-matched
        version does, at excess 5.43 -- the effect is lattice membership, not
        sieving and not the heuristic. Under 10 minutes of numpy plus fpylll; no
        g6k required. Cost of the control is fully charged: one BKZ-30 reduction
        (0.6 s) plus one enumeration pass.

    - id: OBJ-2
      severity: blocking
      title: >-
        The heuristic's own null was already in the code and was never reported.
        Both arms fail it by 7-9x; the headline compares two failing objects.
      challenge: >-
        The independence heuristic's reference model is "wrong-candidate scores
        iid N(0, 1/2N)" -- exactly the denominator sqrt(0.5/N) already computed
        in group_stats. Against it, the Stage A near-miss real arm is 0.140324
        (7.1x BELOW iid) and the row-permuted arm is 0.106552 (9.4x below). The
        campaign's headline 1.3169 is the ratio between two objects that both
        violate the reference model by roughly an order of magnitude, and OBJ-1
        shows that ratio is the one part of the comparison fixed a priori. The
        first-order fact -- a 7x concentration among near-miss candidates -- needs
        no surrogate, and the producer's own OBS-B1 attributes it to the ad-hoc
        s + e_k definition rather than to near-misses in general.
      consequence: >-
        The campaign has been reporting the second-order, a-priori-determined
        quantity as its central result while the first-order,
        surrogate-free quantity went unreported.
      cheapest_check: >-
        Report sd_ratio_to_iid against 1.0 with its across-instance error bar for
        every group in both stages. Already in the archived JSON; zero compute.

    - id: OBJ-3
      severity: major
      title: >-
        The candidate family on which the effect replicates is not one a dual
        attack enumerates, and on the family that IS enumerated the effect is
        absent -- in this very package.
      challenge: >-
        s + e_k adds 1 to one coordinate of the secret in Z_q. A real dual attack
        with FFT enumerates FFT BINS. Stage B implements the principled
        definition (adjacent bins c* +- e_j mod p) and its RAW real-arm sd-ratios
        are 1.074 / 1.049 / 0.989 for p = 2/3/5 -- consistent with the iid
        prediction, i.e. no anomaly. That comparison needs NO surrogate and NO
        null, so the producer's (correct) PD-2 refusal to report Stage B's null
        does not block it. The producer states the fact as OBS-B1 and then does
        not carry it back to Stage A's headline.
      consequence: >-
        Nine-instance replication on a candidate family whose relevance to the
        attack the same package disconfirms.
      cheapest_check: >-
        Run Stage A's exact row-permutation comparison on ADJACENT-FFT-BIN
        candidates in the Stage A design, all 9 instances. Same script, one new
        candidate group; minutes.

    - id: OBJ-4
      severity: major
      title: >-
        The four-point decay curve contains one number, and the same one-parameter
        law fits my no-lattice control.
      challenge: >-
        A constant across-candidate bias plus 1/sqrt(N) sampling noise forces
        excess(N') = sqrt(alpha + beta N') with alpha = 1. Forcing alpha := 1 and
        taking beta = 4.0981e-05 from the SINGLE N'=17919 point predicts
        1.0102 / 1.0402 / 1.1523 / 1.3169 against the observed
        1.0146 / 1.0434 / 1.1480 / 1.3169 -- every residual under 0.2 of the
        across-instance sd. Free two-parameter least squares returns
        alpha = 1.0053, i.e. the forced value. My E1 control obeys the same law
        (predicted 3.031 / 5.809 / 11.488 / 17.157 vs observed
        3.050 / 6.045 / 11.207 / 17.157). The report presents monotonicity as
        "the canonical artifact tell firing in the direction that says the effect
        is not a sampling artifact ... with nine instances rather than one";
        under inventor-protocol section 3 that is the right instinct, but here the
        growth is the trivially forced shape and its entire information content is
        beta.
      consequence: >-
        Four points, one degree of freedom. The decay control is not four
        independent confirmations and should not be weighted as such.
      cheapest_check: >-
        Fit sqrt(alpha + beta N') to the archived pooled decay array and report
        the residuals in sd units. Zero compute; three lines of numpy.

    - id: OBJ-5
      severity: major
      title: >-
        The two headline statistics are one effect. r = -0.9387 across the nine
        instances.
      challenge: >-
        Extra per-draw spread across the eight near-miss candidates mechanically
        raises max_k and so lowers correct - max_k. Pearson correlation of the
        per-instance sd-ratio excess against the per-instance correct-minus-best
        excess is -0.9387 (recomputed from the archived per_instance_excess
        arrays). "9/9 in the same direction on both statistics" is 9/9 on one
        statistic reported twice.
      consequence: >-
        The apparent double confirmation in the report's section 1 table and in
        the snapshot commit message overstates the independent evidence.
      cheapest_check: >-
        Print the cross-statistic correlation next to the two pooled z values.
        Zero compute.

    - id: OBJ-6
      severity: moderate
      title: >-
        The graded internal contrast is a distance curve, and it is reproduced by
        an object with no lattice.
      challenge: >-
        uniform ~0%, secret-distribution ~+2.4%, near-miss ~+32% is presented as a
        graded response to genuine structure. My E1 control -- no lattice -- gives
        the same ordering (0.9833 / 1.4801 / 17.078). My E3 distance sweep on a
        valid lattice, candidates c = s + delta e_k, gives excess
        5.358 / 5.044 / 5.023 / 4.484 / 4.010 / 2.925 / 1.284 at
        delta = 1/2/3/4/5/8/16 -- a smooth decay in distance from the secret.
        VAL-20260803-124629's Hamming sweep (EV-MLKEM-50901f OBS-5:
        0.146 / 0.213 / 0.234 / 0.325 / 0.352 / 0.352 at distance 1/2/3/5/8/12)
        is the same curve on another axis.
      consequence: >-
        The three groups are three points on one monotone function of phase
        magnitude. The contrast is consistent with the campaign's hypothesis and
        equally consistent with OBJ-1, so it discriminates nothing.
      cheapest_check: >-
        Sweep delta on the REAL sieve database, 9 instances, and check the excess
        against a one-parameter phase-magnitude model. Minutes; needs the emitted
        (x,y), which Stage A regenerates.

    - id: OBJ-7
      severity: moderate
      title: >-
        PD-2 applied asymmetrically, and the only in-class sensitivity
        demonstration that PASSES for the headline statistic is the finding itself.
      challenge: >-
        For the sd-ratio statistic the producer reports SENS-2 (rearrangement,
        analytic, inside the null's object class) FAILING its own pre-declared
        |z| > 5 criterion at z = 3.21, and falls back on SENS-3 (dose-response).
        But SENS-3 interpolates between t=0 (the real arm) and t=1 (the null arm):
        it necessarily varies whenever the finding is non-zero and is necessarily
        flat whenever it is zero. As a demonstration that the statistic reads the
        PAIRING rather than something else the permutation destroys, it carries no
        independent information. SENS-1 (y := 0) is decisive that the statistic
        reads y, but leaves the null's object class entirely. I record in fairness
        that PD-2's logic only strictly BINDS for null results, so the producer's
        asymmetry is defensible; the gap it leaves is exactly OBJ-1.
      consequence: >-
        No sensitivity demonstration in the package separates "reads the x-y
        pairing" from "reads the deterministic dependence of y on x".
      cheapest_check: >-
        Add a sensitivity arm inside the object class that PRESERVES lattice
        membership: re-pair each x with a DIFFERENT y from the same lattice coset
        so that y = A^T x mod q still holds. If the statistic does not move, it
        reads membership, not the pairing.

    - id: OBJ-8
      severity: moderate
      title: >-
        Stage B: the yardstick changed between stages, and the power question was
        never asked.
      challenge: >-
        Stage A pools with z = (mean - 1)/(sd/sqrt(n)). Stage B says "every excess
        lies within about one to two across-instance sd of 1", which is sd, not
        sd/sqrt(n). On Stage A's own convention the p=2 near-miss sd-ratio excess
        0.9607 +/- 0.0187 gives z = -3.64 with 3/3 below 1, and correct-minus-best
        1.0379 +/- 0.0199 gives z = +3.29 with 3/3 above 1 -- BOTH in the opposite
        direction to Stage A. Separately: with across-instance sd ~0.019 at n=3, a
        Stage-A-sized 32% excess would sit near 30 sigma, so Stage B's null is not
        a POWER failure; it is purely a sensitivity question. The producer's
        refusal to call it blindness is CORRECT and I endorse it; its silence on
        power is over-cautious and costs information.
      consequence: >-
        The strict yardstick was used where the answer was null and the loose one
        where it was positive. I do NOT propose the p=2 result as a finding at
        n=3 without a sensitivity demonstration.
      cheapest_check: >-
        Report Stage B excesses with the Stage A z convention, and state the
        minimum detectable effect at n=3. Zero compute.

    - id: OBJ-9
      severity: minor
      title: >-
        Snapshot commit message 555a5762 draws conclusions in a message that says
        it draws none, and drops one qualifier at its point of use.
      challenge: >-
        The message states "I draw no conclusion from them here", then states
        (a) "THE PRODUCER DECLARES ITS OWN STAGE B NULL INADMISSIBLE, and that is
        the most encouraging thing in this package" and (b) "The rule adopted last
        batch worked" -- an evaluative conclusion and a grade of the Coordinator's
        own prior decision, both pre-review. (c) "the separation REPLICATES on 9
        of 9 instances" is an interpretation, not a number, so the "every number
        below is the producer's" qualifier does not cover it. (d) "the nine
        instances are provably BATCH-f75059's own" -- a_x agreeing at 0.0 across
        nine instances is a strong reproduction check, not a proof. (e) At the
        point of use the ML-KEM-512 figure 2^11.391 carries "MODELED" but drops
        the producer's local disclaimer ("It is not a measurement ... asserts
        nothing about ML-KEM's security. Rule 4 applies in full."); the global
        non-claim paragraph later does catch it.
      security_claim_audit: >-
        NONE FOUND, and this deserves to be said plainly. I searched report.md,
        stage_a.py, stage_b.py, both results JSONs, receipt.json and the commit
        message for an ML-KEM break, a security proof, a FIPS 203 parameter set
        affected or cleared, a speedup, a cost claim, or an EV-*/KN-* status
        change. There is none. Scope banners are present, first and binding;
        states_a_conclusion is false in both results files; rule12_status is
        carried in every artifact. This is the cleanest scope discipline in the
        campaign, and the message reports the producer's self-declared weaknesses
        (SENS-2's failure, 3 instances not 9, the un-pre-registered aggregation
        rule) in the message itself. The five items above are conclusion-drawing
        and qualifier drift, NOT a fifth overclaim of the BATCH-010 / 1cd863b1 /
        8cc51677 / e08462ac kind.
      cheapest_check: >-
        Before committing, grep the draft message for evaluative adjectives and
        for any verb in the present indicative applied to a producer conclusion.

    - id: OBJ-10
      severity: minor
      title: Small precision drift in the report's own prose.
      challenge: >-
        "the surrogate stays flat to within 0.001 over a 36x range": the measured
        range is 0.001058 over 35.8x. True to one significant figure, not as
        stated. Everything else I checked matched to all printed digits.
      cheapest_check: Recompute max-min from the archived array. Zero compute.

  required_controls:
    - id: RC-1
      control: >-
        Norm-matched valid-lattice surrogate: a second dual-vector family from the
        same lattice with ||x||, ||y|| matched to the sieve database, scored
        identically. This is the null the package never ran, and it is the one
        that could distinguish sieving from membership.
      why: OBJ-1. E3 is the un-matched version and it separated at excess 5.43.
    - id: RC-2
      control: >-
        Membership-preserving re-pairing: re-pair x with a different y satisfying
        y = A^T x mod q. If the statistic does not move, it reads membership.
      why: OBJ-7. The only in-class demonstration that would be non-circular.
    - id: RC-3
      control: >-
        sd_ratio_to_iid reported against 1.0 with error bars, every group, both
        stages. The heuristic's own null.
      why: OBJ-2. Already in the archived JSON.
    - id: RC-4
      control: >-
        Adjacent-FFT-bin candidates run through Stage A's row-permutation
        comparison on all 9 instances.
      why: OBJ-3. Tests the candidate family the attack actually enumerates.
    - id: RC-5
      control: >-
        Distance sweep of the excess on the real sieve database against a
        one-parameter phase-magnitude model.
      why: OBJ-6. Decides whether the internal contrast is a finding or a curve.

  counterexample_or_mutation: >-
    The decisive mutation is the one the package's own null cannot survive:
    replace the lattice with nothing. Ensemble E1 -- x iid rounded Gaussian in
    Z^35 with variance matched to the real a_x, y := x[0:25], no lattice, no
    sieve, no A, no LWE instance, no modulus -- reproduces the separation
    (near-miss excess 17.078 with a row-permuted arm at 0.1082 against the real
    data's 0.1066), the monotone increase in N' (3.050 / 6.045 / 11.207 /
    17.157), the flat surrogate, and the graded three-group contrast
    (0.9833 / 1.4801 / 17.078). Ensemble E2, identical marginals with the
    dependence removed at the source, gives 1.0371 and a flat decay curve, so the
    instrument is not broken. Ensemble E3, a VALID dual-vector family of the real
    A produced by fpylll BKZ with no sieve and 0 membership violations on 447,975
    entries, separates at 5.4349 with decay 2.487 / 3.536 / 4.895 / 5.540.
    Sieving is not necessary for the effect; the lattice is not necessary for the
    effect; a deterministic dependence of y on x is sufficient for it.

  baseline_comparison:
    applicable: partially
    note: >-
      No attack, no speedup and no cost claim is made, so there is no
      Pollard-rho / BSGS / specialised-baseline row to contest, and time, memory
      and data/queries are all unclaimed. The package sets no dominated_by field;
      the governing record EV-MLKEM-50901f already carries the campaign's
      Pareto honesty and this task proposes no change to it. What I DO charge, per
      KN-LIT-7593: the row-permutation and column-permutation surrogates are not
      realisable vector families -- they are not lattice points and no attacker
      can obtain one -- so no eliminated search dimension is being claimed for
      free anywhere in this package, and none is. The cost of my own control is
      charged in full: one BKZ-30 reduction plus three numpy scoring passes,
      96.4 s, single process, no sieve.
    dominated_by: >-
      n/a (no attack, no cost and no speedup claimed by the package or by this
      review). Checked against time, memory and data/queries: all three are
      unclaimed on both sides.
    sota_delta: >-
      none claimed. This review contributes a measurement-validity result and a
      control experiment, not an attack.

  heuristic_challenges:
    - id: HC-1
      challenge: >-
        The package asserts no numbered extrapolation heuristic, and says so
        explicitly. Correct and I do not fault it. For the record, transfer of
        anything here to cryptographic parameters would need at least: (HX-1)
        that behaviour at d=60, q=127, one sieve, one modulus persists at ML-KEM
        dimensions -- untested, and EV-MLKEM-50901f OBS-4 already records one
        correction in this campaign behaving OPPOSITELY as scale grows; (HX-2)
        that the s + e_k candidate family has an analogue in a real dual attack --
        the producer's own OBS-B1 says it does not; (HX-3) that the
        row-permutation surrogate is a null for the independence heuristic --
        OBJ-1 says it is not, at ANY scale. I assert none of these; I name them so
        the gap is explicit. HX-3 is not a scale problem: it fails at toy scale.
    - id: HC-2
      challenge: >-
        The aggregation rule (excess ratio, pooling across instances, |z| > 5) is
        the producer's own, declared in the script header before the run but not
        Coordinator-pre-registered, and the producer flags this itself. I checked
        for flattery: the absolute differences are reported alongside every ratio,
        the uniform group's null is reported, the secret-distribution group's
        unexpected separation is reported, and the SENS-2 failure is reported. I
        find no evidence the rule was chosen to flatter the result. The rule is
        nevertheless the wrong summary for a different reason -- OBJ-4 and OBJ-5.

  cost_model_challenges:
    - id: CMC-1
      challenge: >-
        No cost claim exists to challenge. The Stage B adjacent-bin figures
        (2^11.87 / 2^5.27 / 2^1.90 and the ML-KEM-512 reference 2^11.391) are
        labelled MODELED and I did not recompute them -- unable_to_check, see the
        claim table. They are arithmetic inside a pinned cost model, not a
        measurement, and the package says so.
    - id: CMC-2
      challenge: >-
        N remains bounded by sieve memory and is not a free parameter. OBJ-4 shows
        the excess grows as sqrt(1 + beta N), so ANY future statement about it
        must name the sieve dimension supplying N and the memory it costs, or it
        charges an eliminated dimension for free. My own E3 obtained N = 17919
        valid lattice vectors from BKZ-30 plus enumeration in 30 s and 0.5 GB,
        which is itself a data point about how cheap the vector supply is at this
        scale and how little that says about crypto scale.

  reduction_and_scope_challenges:
    - id: RSC-1
      challenge: >-
        EV-MLKEM-50901f's what_is_established item 1 and DEC-20260803-264d6a's
        what_is_revised item 2 both record the row-permutation separation as
        established fact. Under OBJ-1 those records remain factually accurate as
        MEASUREMENTS and their interpretation is what I contest. Rule 12 is UNMET
        and UNWAIVED, so I propose NO status change to either record, and none to
        any KN-* entry. This is an objection for the Coordinator to weigh, not a
        transition.
    - id: RSC-2
      challenge: >-
        No scope inflation found. The package repeatedly narrows itself, refuses
        a blindness conclusion it was entitled to be tempted by, and states its
        non-claims in eight explicit bullets. The affected-vs-safe scope statement
        is correct: nothing is affected and nothing is cleared.

  proof_architecture_challenges:
    - id: PAC-1
      audit: nearby-object control (inventor-protocol section 8 audit 4)
      finding: >-
        FAILS. The method must distinguish the object from the closest object
        where the hoped-for conclusion does not hold. The closest such object is a
        vector family in which y depends deterministically on x but nothing about
        sieving or the independence heuristic is at stake. E1 IS that object and
        the method does not distinguish it -- it separates E1 more strongly than
        the real data. The load-bearing structure has not been identified.
    - id: PAC-2
      audit: observation collision
      finding: >-
        COLLISION FOUND, which is the direct falsifier this audit exists for. Two
        ground-truth objects on opposite sides of the claimed conclusion -- a sieve
        database of dual vectors, and iid Gaussian x with y := x[0:25] -- produce
        the same observable pattern (separation, direction, N'-growth, flat
        surrogate, group ordering). Identifiability fails unless an additional
        condition separates them; RC-1 and RC-2 are the candidate conditions.
    - id: PAC-3
      audit: quantifier order
      finding: >-
        The claim as written is "there exists a statistic and a null under which
        the real database differs from its surrogate on all 9 instances". The
        reading it is being given is "for the dual-attack independence heuristic,
        the real database violates it". The witness (the statistic, the candidate
        family, the null) is allowed to depend on the instance family in a way the
        second reading forbids. The package's own text is careful about this; the
        surrounding records are less so.
    - id: PAC-4
      audit: baseline reproduction
      finding: >-
        PASSES on provenance. The nine instances are BATCH-f75059's own: seeds
        match, N matches, a_x_abs_difference is 0.0 exactly on all nine, and all
        4,031,775 certificate entries verify with 0 violations, 0 all-zero
        vectors, 0 duplicate y parts. RT-20260803-dc7568's randx_randy values are
        reproduced on nine different instances with independent code. The
        reproduction is real; only its interpretation is contested.

