        defect DEF-8 on the selective quoting of the z values.
    - id: C-5
      check: SENS-3 dose-response, Stage A
      status: reproduced
      detail: >-
        Pooled near-miss curves are monotone in t on BOTH statistics
        (sd ratio 0.140324 -> 0.136897 -> 0.128694 -> 0.114948 -> 0.109177 ->
        0.107382; correct-best 0.001547 -> ... -> 0.001737) and the response is
        graded, not a step. Uniform curves are not monotone and per-instance
        strict monotonicity is 0/9 there, as reported. Per-instance strict
        monotonicity for near-miss is 5/9 (sd ratio) and 1/9 (correct-best),
        exactly as the producer's "honest limit" paragraph states. This -- not
        the N' control -- is the null-object decay control that AGENTS.md's
        inventor-protocol section 3 asks for, and it fires correctly: the
        parameter meant to destroy the effect is t, and the effect decays
        monotonically in t for the group that separates and is flat for the group
        that does not.
    - id: C-6
      check: >-
        MISSING CONTROL, SUPPLIED BY ME. Does a null that preserves the sieve's
        (||x||, ||y||) joint geometry still separate?
      status: reproduced
      finding: >-
        YES -- the separation survives. The leading alternative mechanism is
        REFUTED, by a control the package does not contain.
      detail: >-
        Motivation. A sieve emits vectors that are short in the JOINT lattice, so
        ||x_i||^2 + ||y_i||^2 concentrates on a shell and the two halves are
        forced to trade off. I measured that coupling, which the package never
        reports: corr(||x_i||^2, ||y_i||^2) = -0.8877 / -0.8863 / -0.8850 on
        instances 0/1/2. A plain row permutation destroys this geometric coupling
        at the same time as it destroys the algebraic pairing, so on the
        package's control set alone the 32% excess could be a norm-budget
        artifact rather than the algebraic dependence.
        Control run. NULL-NORMSTRAT: a row permutation of Y restricted to 60
        quantile bins of ||y_i||^2. It still destroys y = A^T x mod q, but it
        preserves the empirical joint law of (||x_i||, ||y_pi(i)||) to within a
        bin. Result (my code, my seeds, 500 draws, 5 realisations, instances
        0/1/2): excess real/NULL-NORMSTRAT = 1.3445 / 1.2705 / 1.3705, against
        excess real/NULL-ROWPERM = 1.2943 / 1.3190 / 1.3956 on the same runs.
        The separation is undiminished; restoring the norm coupling moves the
        surrogate slightly AWAY from the real database, not toward it.
        Conclusion. The norm-budget explanation does not account for the
        separation. This is a gap in the package's control set, not an error in
        its conclusion, and closing it favours the producer.
    - id: C-7
      check: internal contrast -- uniform group shows no separation on the same code and same instances
      status: reproduced
      detail: >-
        uniform sd-ratio excess 1.008741 +- 0.019188, t_8 = +1.37, 5 of 9 above 1;
        exact sign test p = 1.0, exact Wilcoxon p = 0.30. Correct-minus-best
        excess 0.999763 +- 0.000406. This is a genuine negative control measured
        on the same nine instances with the same code, and it behaves as a null
        object should.
    - id: C-8
      check: NULL-RANDDIR reproduces RT-20260803-dc7568's randx_randy values
      status: reproduced
      detail: >-
        Batch 2 reported 0.104707 +- 0.001475 and 0.001808 +- 0.000011 on one
        instance (BATCH-f75059/tasks/TASK-20260803-dc7568/notes.md:136-138). This
        task gives 0.107115 +- 0.001365 and 0.001812 +- 0.000019 on nine. Both
        pooled values recompute from per_arm. Note NULL-RANDDIR preserves the
        per-vector pairing of the two lengths and shows no separation, which is a
        second, weaker piece of evidence in the same direction as C-6.

