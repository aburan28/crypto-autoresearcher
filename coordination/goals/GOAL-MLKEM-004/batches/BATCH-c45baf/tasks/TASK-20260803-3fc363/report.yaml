  # =====================================================================
  # 6. WHAT ELSE COULD PRODUCE THE MONOTONE SHAPE (task card item 3)
  # =====================================================================
  mechanism_analysis:
    - id: MECH-1
      finding: >-
        A GROWING-WITH-N' RATIO IS ALGEBRAICALLY IMPLIED BY ANY NON-ZERO FIXED
        SEPARATION AT ANY SINGLE N'. It is not a second, independent line of
        evidence.
      derivation: >-
        The statistic is sd_across_candidates(score) / sqrt(1/(2N')), so the
        surrogate's ratio is flat exactly because its raw spread decays as
        1/sqrt(N') (I confirmed: implied raw sd 3.338e-03 / 1.680e-03 /
        8.429e-04 / 5.628e-04 at N' = 500/2000/8000/17919, i.e. the 1/sqrt(N')
        law to three digits). Fit the real arm to the two-parameter model
        sd_real(N')^2 = k/(2N') + b^2. Least squares on the four pooled points
        gives sqrt(k) = 0.1062 -- statistically indistinguishable from the
        surrogate's flat 0.1065 -- and b = 4.843e-04, and reproduces all four
        measured ratios to better than 0.4%
        (0.107263/0.110495/0.122571/0.140274 against
        0.107079/0.110822/0.122380/0.140324). Once b > 0, the ratio
        sqrt(k + 2N'b^2)/sqrt(k) MUST increase monotonically in N' with no
        further content. So "monotone increasing" and "excess > 1 at full N'"
        are the same fact, re-parameterised.
      what_it_does_and_does_not_rule_out: >-
        It DOES rule out the sampling-noise artifact class: an excess that were a
        finite-sample fluke would not grow. It does NOT rule out a systematic
        non-algebraic coupling, because any such coupling produces exactly this
        shape. The producer's framing -- "the canonical artifact tell fires here
        in the direction that says the effect is not a sampling artifact" --
        misapplies docs/inventor-protocol.md section 3: the parameter meant to
        destroy this effect is the fraction of the pairing removed (t), not the
        database size. Increasing N' should sharpen a real effect, not destroy
        it. The protocol's decay control is SENS-3, which the package DOES run
        and which DOES fire correctly (C-5).
    - id: MECH-2
      finding: >-
        The leading candidate systematic coupling -- the sieve's forced
        (||x||, ||y||) norm trade-off, measured here at corr = -0.886 -- is
        REFUTED as an explanation by the NULL-NORMSTRAT control I ran (C-6).
    - id: MECH-3
      finding: >-
        The separation does NOT live in the error-averaged mean scores, which
        undercuts the SENS-2 rearrangement argument more sharply than the
        producer states.
      detail: >-
        I computed the draw-free quantity sd_j( mean_i w_i cos(phi_ij) ), i.e.
        the across-candidate spread of E_e[score_j], with w_i the exact rounded-
        Gaussian characteristic function. Real vs row-permuted vs norm-stratified:
        5.620e-05 / 5.080e-05 / 5.487e-05 (rep0), 3.184e-05 / 2.878e-05 /
        3.139e-05 (rep1), 4.716e-05 / 4.255e-05 / 4.488e-05 (rep2). The real/
        surrogate ratio of the ERROR-AVERAGED spread is only about 1.11, against
        1.30 on the statistic actually reported. So roughly two thirds of the
        separation lives in the per-draw covariance between the x-side phase
        cos/sin(2 pi x_i.e/q) and the y-side phase, not in the mean scores. SENS-2
        is extremal for the mean-score functional only, which is exactly why it
        yields |z| = 0.35..3.79 on the sd ratio (0/9 pass the pre-declared 5) and
        |z| = 7.5..12.2 on correct-minus-best (9/9 pass). The producer says SENS-2
        is "the wrong functional for a spread across candidates"; this quantifies
        how wrong, and it means SENS-3 is not a convenience but the only
        demonstration carrying the sd-ratio statistic.
    - id: MECH-4
      finding: >-
        SCOPE. What separates is a 32% modulation on top of a much larger,
        entirely pairing-INDEPENDENT effect.
      detail: >-
        Both arms sit near 0.10-0.14, i.e. the near-miss candidate scores are
        roughly 7-10x MORE concentrated than the iid prediction in the SURROGATE
        too. That 7-10x concentration is a property of the y multiset and of the
        ad-hoc candidate definition c = s + e_k (whose phase offset is the single
        small integer -Y[i,k]), not of the pairing. The producer's own OBS-B1
        makes the corresponding point from the other side: under the principled
        adjacent-FFT-bin definition the raw ratio is about 1.0 and no separation
        is detected. Any downstream reading must keep this in view: the
        replicated effect is a second-order modulation of a first-order artifact
        of the candidate definition.

