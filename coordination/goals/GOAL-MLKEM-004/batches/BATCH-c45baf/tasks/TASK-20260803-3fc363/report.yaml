    - id: B-6
      claim: "Nf at the tuple: 45128.8 / 716.55 / 99.2663 for p = 2/3/5"
      status: reproduced
      detail: >-
        Re-derived from lwe_dual.py:544-557 by hand:
        lsigma_s = 2^(35/50) * 127^(15/50) * sqrt(4/3) * sqrt(50/(2 pi e))
                 = 13.727116155555624 (producer: identical);
        prefactor exp(4*(lsigma_s pi/127)^2) = 1.586012417989119 (identical);
