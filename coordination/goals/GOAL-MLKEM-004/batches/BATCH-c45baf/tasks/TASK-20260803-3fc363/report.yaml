        also matches batch 2's 64.38
        (BATCH-f75059/tasks/TASK-20260803-dc7568/notes.md:261-264).
        QUALIFIER: I verified the ARITHMETIC given (k_enum, k_fft, p) = (0, 40, 5).
        I did NOT re-run the estimator's optimiser to confirm that this really is
