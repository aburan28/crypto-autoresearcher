      status: reproduced
      detail: exp(0) = 1.0 exactly. Batch 2's design could not test this term in either direction.
    - id: B-5
      claim: "ML-KEM-512 reference reproduces at 2685.665 = 2^11.391 (KA-6)"
      status: reproduced
      detail: >-
        With sigma_s = sqrt(3/2) = 1.224744871391589 for CBD(eta=3), k_fft = 40,
        p = 5: exp(40/3 * (sigma_s pi/5)^2) = 2685.6646571506 = 2^11.3910634600.
        Matches the producer's 2685.6646571506376 and batch 2's card value
