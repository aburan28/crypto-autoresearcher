    - id: B-7
      claim: "all 8 known-answer controls pass"
      status: reproduced_with_qualification
      detail: >-
        KA-1..KA-6 I re-derived myself and all pass (B-1..B-6). KA-0a and KA-0b
        (LWE.dual_hybrid IS estimator.lwe_dual.matzov; type name MATZOV) are
        identity assertions about the installed estimator's namespace; I did not
        import Sage to re-run them, and they are not load-bearing for anything in
        this report.
    - id: B-8
      claim: "Stage B has 3 instances (2 dof), not 9 -- self-reported as D-9"
      status: reproduced
      detail: >-
        B3_n_instances_completed = 3. The across-instance sds carry 2 degrees of
        freedom, which is very weak; e.g. p=2 secret_distribution correct-best is
        1.1592 +- 0.1883. The producer records this and does not lean on it.
    - id: B-9
      claim: "Stage B null-object declaration -- IS THE PRODUCER'S REFUSAL WARRANTED?"
      status: reproduced
      finding: >-
        THE REFUSAL IS WARRANTED, AND THE REASON IS STRUCTURAL, NOT A
        SMALL-SAMPLE ACCIDENT. The producer has not been over-cautious and has
        not discarded a result.
      structural_argument: >-
        Compare where candidate-dependence lives in the two designs.
        STAGE A (stage_a.py:410-412): the candidate-discriminating phase is
        phi_ij = -2 pi Y[i,j]/q, a function of y_i. A row permutation of Y
        therefore rewires the candidate contrast row by row, at FIRST order.
        STAGE B (stage_b.py:386-393): the candidate-discriminating phase is
        theta_ij = 2 pi [ (x_i^T A_fft . s_fft)/q - (ahat_i . c_j)/p ], where
        ahat_i = round(p * (x_i^T A_fft mod q)/q). This is a function of x_i
        ALONE. The pairing carrier is psi_i = 2 pi (y_lat,i . s_lat)/q, and
        phase_arrays() applies it as cp*cosT - sp*sinT with cp, sp indexed by the
        permutation and cosT, sinT NOT -- i.e. psi_i is CANDIDATE-INDEPENDENT and
        multiplies every candidate's row-i term identically. A row permutation
        therefore cannot generate across-candidate contrast at first order; it
        can only act through a second-order correlation between the per-row
        rotation e^{i psi_i} and the x-side contrast structure.
      empirical_confirmation: >-
        SENS-1 sets psi identically 0 -- the MAXIMAL removal of the object. If
        the group statistic read the object, SENS-1 should be at least as extreme
        as NULL-ROWPERM and on the same side of real. Measured (p=2, three
        instances): real 1.09472 / 1.08974 / 1.03790; NULL-ROWPERM 1.11794 /
        1.13384 / 1.10194; SENS-1 1.14012 / 1.15133 / 1.13626. Total removal of
        the object lands BEYOND the random-repairing arm and on the OPPOSITE
        side from real. Same picture at p=3 and p=5 (SENS-1/real ratios
        0.9735..1.0948). SENS-3 is non-monotone on 0/3 instances at every p, and
        also on the uniform group at every p, so it separates nothing.
        The statistic has essentially no usable dynamic range with respect to the
        object. "No separation detected" from it is uninformative, exactly as the
        producer says.
      residual_inconsistency: >-
        The producer's own Stage B null registry
        (stage_b_results.json -> nulls[0]) asserts
        statistic_reads_the_object: "YES ... Every candidate's score carries the
        residual phase psi_i ... Note this includes the CORRECT bin". That is
        true of the SCORES and of the correct bin (M-10 confirms the correct bin
        moves), and false of the ACROSS-CANDIDATE CONTRAST that the group
        statistics measure. Section 5.3 of report.md corrects this in substance
        but the registry text is left standing. See DEF-4.
    - id: B-10
      claim: "SENS-2 demonstrates sensitivity for correct-best (z = -12.2) but not the sd ratio (z = 3.21)"
      status: reproduced
      detail: >-
        Both quoted numbers are instance 0's. Across all nine: sd-ratio
        |z| = 3.21, 3.79, 0.77, 0.64, 1.27, 1.81, 1.18, 1.05, 0.35 -- 0/9 pass
        the pre-declared 5, and instance 0's 3.21 is the LARGEST. correct-best
        |z| = 12.20, 8.19, 8.51, 10.39, 9.41, 9.03, 10.41, 8.20, 7.53 -- 9/9
        pass, and instance 0's 12.20 is again the LARGEST. Both quoted figures
        are the best case of nine. See DEF-8.

  # =====================================================================
  # 8. NUMBERED DEFECTS
  # =====================================================================
  defects:
    - id: DEF-1
      severity: moderate
      self_reported_by_producer: false
      title: >-
        The decay control's monotone increase is presented as an independent,
        decisive line of evidence. It is algebraically equivalent to the
        single-N' separation.
      detail: >-
        See MECH-1. Given that the surrogate's raw spread decays exactly as
        1/sqrt(N') (confirmed to three digits), the ratio must grow monotonically
        as soon as the real arm has ANY non-decaying component b > 0, and the
        two-parameter fit sd_real^2 = k/(2N') + b^2 with sqrt(k) = 0.1062 (the
        surrogate's own flat value) and b = 4.843e-04 reproduces all four points
        to <0.4%. The report's box "AND IT DOES NOT DECAY LIKE ITS SURROGATE ...
        the canonical artifact tell fires here" reads as though a second,
        stronger test had been passed. What was actually excluded is the
        sampling-noise artifact class alone; every systematic coupling, algebraic
        or not, produces the identical shape. It also misidentifies the
        protocol's decay parameter: docs/inventor-protocol.md section 3 asks
        about the parameter meant to DESTROY the effect, which here is t (SENS-3),
        not N'. Mitigation: SENS-3 exists in the package and does fire correctly,
        and report.md section 9.3 concedes "monotone-in-N' is consistent with
        more than one mechanism".
    - id: DEF-2
      severity: moderate
      self_reported_by_producer: false
      title: >-
        No control isolates the algebraic pairing from the sieve's geometric
        (||x||, ||y||) coupling. The package never reports that coupling exists.
      detail: >-
        A sieve emits jointly short vectors, forcing corr(||x_i||^2, ||y_i||^2)
        = -0.886 (measured by me on three instances; not reported anywhere in the
        package). NULL-ROWPERM, NULL-COLPERM and NULL-RANDDIR all destroy that
        geometric coupling along with the algebraic pairing, so on the package's
        own control set the excess is not attributable to either. RESOLVED
        FAVOURABLY: I ran the missing control (NULL-NORMSTRAT, C-6) and the
        separation survives at 1.3445 / 1.2705 / 1.3705. The defect is that the
        package could not have known this; it is a completeness gap, and the
        answer favours the producer.
    - id: DEF-3
      severity: minor
      self_reported_by_producer: partially
      title: >-
        "Pooled z = +50.6" is a one-sample t with 8 dof reported as a z, without
        dof, without a p-value, and without any distribution-free companion.
      detail: >-
        The producer self-reports that the aggregation rule is its own and asks a
        reviewer to check it (section 9.1) -- that disclosure is exemplary and is
        why the re-scoring in R-1..R-8 was possible. What it does not say is that
        with n = 9 the distribution-free floor is p = 0.0039 (exact sign and
        exact Wilcoxon both attain it), so "+50.6" cannot be read as a
        significance level; it is a normality extrapolation from 9 points. The
        strongest defensible distribution-free statement is the exact
        within-instance permutation result 11^-9 = 4.24e-10 (R-5), which the
        producer does not report even though its own data contain it.
    - id: DEF-4
      severity: minor
      self_reported_by_producer: partially
      title: >-
        Stage B's machine-readable null registry claims the group statistic reads
        the object; section 5.3 of the report says it does not. Both are archived.
      detail: >-
        stage_b_results.json -> nulls[0].statistic_reads_the_object says "YES"
        and can_it_fail says "YES, for every group AND for the correct bin",
        while report.md 5.3 declares the group-level null inadmissible. Only the
        correct-bin half of the registry claim is supported (M-10). A downstream
        consumer reading the JSON rather than the prose would draw the opposite
        conclusion. The prose is the correct one (B-9).
    - id: DEF-5
      severity: minor
      self_reported_by_producer: false
      title: >-
        Stage B's p=2 arm is measured at N = 4253 vectors against its own modelled
        requirement Nf = 45128.8 -- a 10.6x shortfall -- and this is stated nowhere.
      detail: >-
        Nf(p=3) = 716.5 and Nf(p=5) = 99.3 are comfortably below the measured
        N = 4253; only p=2 is not. OBS-B2 reports the 454x Nf range but never
        compares it to the N actually used. This does not invalidate a
        distributional null test, but p=2 is the arm carrying the largest
