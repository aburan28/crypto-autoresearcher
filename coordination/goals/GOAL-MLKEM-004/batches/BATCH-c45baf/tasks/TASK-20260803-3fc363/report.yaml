  # =====================================================================
  # 3. PROVENANCE AND INDEPENDENCE OF THE NINE INSTANCES
  # =====================================================================
  control_checks:
    - id: P-1
      check: are the nine Stage A instances genuinely independent draws, or nine views of one database?
      status: reproduced
      finding: GENUINELY DISTINCT DRAWS
      detail: >-
        stage_a.py:381-384 derives sd_ = 20260803206 + 1000*rep and then draws
        A = rng.integers(0,q,(35,25)) and s = centered_binomial(rng,2,25) from
        that single stream, so a different rep gives a different A AND a
        different secret AND a different fpylll/sieve seed (sd_+1, sd_+2). I
        confirmed the downstream consequences are all distinct across the nine:
        seed 9/9 distinct, sieve_seconds 9/9 distinct, mean_xnorm2 9/9 distinct
        (181.278..181.967), mean_ynorm2 9/9 distinct, a_x 9/9 distinct, a_y 9/9
        distinct, and the real near-miss sd ratio 9/9 distinct
        (0.137226..0.142994). Only n_vectors is identical (17919 on all nine),
        which is expected: the bgj1 database size at fixed dimension is a
        saturation target, not an instance property. These are nine independent
        LWE instances, not nine views of one database.
    - id: P-2
      check: provenance -- are these BATCH-f75059's own nine instances?
      status: reproduced
      detail: >-
        I regenerated instances 0, 1 and 2 myself from seed 20260803206 +
        1000*rep with my own code and my own g6k build, and recomputed a_x =
        2 pi^2 sigma^2 mean(||x||^2)/q^2 from the raw vectors. All three match
        BATCH-f75059's published a_x to 0.0e+00:
        rep0 0.888475041394716, rep1 0.8876366140975788, rep2 0.890787614568475.
        Provenance established independently of the producer's transcript.
    - id: P-3
      check: independence caveat that provenance does NOT establish
      status: reproduced
      detail: >-
        Nine instances from one seed family and one entropy source. Instance-level
        statistical independence is real; it is independence by distinct seeds,
        not by distinct entropy. All nine also share one design (m, n, q, sieve,
        candidate construction), so the across-instance sd measures
        instance-to-instance variation WITHIN that design and cannot support any
        statement beyond it. The producer states this at report.md section 9.2;
        I confirm it and it is not a defect.
    - id: P-4
      check: lattice-membership certificates, re-verified independently of g6k
      status: reproduced
      detail: >-
        I recomputed mod(X.dot(A) - Y, q) from my own regenerated A and my own
        reconstructed vectors for instances 0/1/2: 0 violating entries in each
        (3 x 17919 x 25 = 1,343,925 entries). The producer's 9-instance total of
        4,031,775 entries with 0 violations and 0 all-zero vectors is consistent.
        The 3 Stage B certificates (191,385 entries) I did not regenerate;
        the producer's own arithmetic route is recorded and self-consistent.
    - id: C-1
      check: >-
        IS THE SURROGATE REALLY A ROW PERMUTATION? Does it preserve the exact
        multiset of x, the exact multiset of y and every column marginal, and
        remove only the pairing?
      status: reproduced
      finding: YES, EXACTLY -- verified as multiset identity, not approximately
      detail: >-
        Code path (stage_a.py:426-429): the arm is built as
        (cosPhi[pi], sinPhi[pi]) with pi = rng.permutation(N); X is never
        touched, and cosPhi/sinPhi are row-indexed derivatives of Y. Indexing a
        row axis by a permutation vector is a bijection on rows, so the row
        multiset is preserved by construction.
        I did not rely on that reading. On my own regenerated instances 0/1/2 I
        applied my own permutation to Y and checked, as exact integer identities:
        (a) the sorted multiset of Y rows (structured-array sort over all 25
        coordinates) is identical before and after -- True on 3/3;
        (b) sorted(Y[:,k]) is identical before and after for every one of the 25
        columns -- True on 3/3, i.e. every column marginal is exactly preserved;
        (c) the sorted multiset of ||y_i||^2 is identical -- True on 3/3;
        (d) X, and hence the x multiset and every ||x_i||, is untouched.
        These are exact array equalities on int64, not tolerances. The surrogate
        removes the pairing and nothing else.
    - id: C-2
      check: SENS-0 -- correct-secret score is bitwise invariant under any row permutation
      status: reproduced
      detail: >-
        SENS0_correct_score_max_abs_change_under_rowperm is exactly 0.0 on all
        nine instances (the set of values across instances is {0.0}). This is the
        analytic proof of batch 2's NULL-V defect and it holds numerically.
    - id: C-3
      check: SENS-1 (y := 0) collapses the Stage A statistics
      status: reproduced
      detail: >-
        near-miss sd ratio max 6.235e-15 over the nine instances (report says
        6.2e-15); correct-minus-best exactly 0.0 on all nine. Against real values
        0.140 and 1.55e-3. The Stage A statistics demonstrably read y.
    - id: C-4
      check: SENS-2 rearrangement -- is the sensitivity demonstration as reported?
      status: reproduced
      detail: >-
        The analytic identity holds: max |predicted - measured| paired difference
        is 4.83e-06 on instance 0 and 3.758e-05 as a max over all nine, against
