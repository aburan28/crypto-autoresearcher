  # =====================================================================
  # 5. RE-SCORING OF THE AGGREGATION (task card item 4)
  # =====================================================================
  aggregation_rescoring:
    - id: R-1
      question: "Is the pooled z of +50.6 credible, or does it rest on treating 9 correlated instances as independent?"
      status: reproduced
      finding: >-
        The instances are NOT correlated in the sense feared (see P-1). The
        arithmetic is exact. The overstatement is of a different kind: "+50.6" is
        a one-sample t on 9 numbers with 8 degrees of freedom, reported as a "z"
        with no dof and no p-value, and no distribution-free scoring is offered.
      detail: >-
        Producer's rule: excess_i = T_real,i / mean_rho T_rowperm,i,rho; pooled
        z = (mean-1)/(sd/sqrt(9)). Recomputed exactly: +50.546 (near-miss sd
        ratio) and -28.757 (correct-minus-best).
    - id: R-2
      scoring: "one-sample t, 8 dof (the producer's own statistic, correctly labelled)"
      result: >-
        near-miss sd ratio t_8 = +50.55, two-sided p ~ 2.4e-11;
        correct-minus-best t_8 = -28.76. This is a normality extrapolation deep
        into the tail of a t_8 from 9 points and should not be quoted as a
        significance level.
    - id: R-3
      scoring: "exact sign test on the 9 excesses (distribution-free)"
      result: >-
        9/9 and 0/9 respectively, two-sided p = 2/2^9 = 0.003906 for both. This
        is the SMALLEST two-sided p attainable with n=9 -- the design's floor. A
        9-instance sign test cannot distinguish this effect from any other
        unanimous one.
    - id: R-4
      scoring: "exact Wilcoxon signed-rank on excess - 1, all 512 sign flips enumerated (distribution-free)"
      result: >-
        p = 0.003906 for near-miss sd ratio and for correct-minus-best; p = 0.3008
        for the uniform group. Again the n=9 floor.
    - id: R-5
      scoring: "exact within-instance permutation test, then joint across instances (distribution-free, uses the surrogate realisations as the reference set)"
      result: >-
        The real pairing is strictly the maximum of the 11 pairings (itself plus
        its 10 surrogate realisations) on the near-miss sd ratio in ALL NINE
        instances, and strictly the minimum on correct-minus-best in all nine.
        Under exchangeability each has probability 1/11, so the joint probability
        is 11^-9 = 4.24e-10. This is the strongest defensible distribution-free
        statement available from the package and it is much stronger than the
        sign test, because it uses the surrogate realisations rather than only
        the across-instance sign pattern. The producer does not report it.
    - id: R-6
      scoring: "per-instance z against the surrogate's OWN realisation spread"
