  # ==========================================================================
  batch_3_recommendation:
    continue_this_line: false
    abandon: false
    statement: >-
      CHANGE THE LINE -- but not by abandoning it, and not for the reason the
      card proposes. The premise "the instrument cannot see its object" is false
      (OBJ-2): the instrument sees the object on every statistic that reads y,
      and was pointed at the one statistic that does not. Abandoning here would be
      premature closure on a refuted premise. Equally, four more batches of the
      same corner cannot reach KN-OPEN-016, for a reason the package never states:
      at the pinned estimator's own ML-KEM-512 optimum the attack runs at
      k_enum = 0, k_fft = 40, p = 5, and this design's corner (k_enum = k_fft = 0)
      is the corner the optimiser never selects, with a factor 2^11.39 of N set
      identically to 1 (OBJ-8).
    the_specific_change: >-
      Adopt the successor design the producer already names in wellposedness.md
      section 6 and make it the batch-3 target: sieve on m + k_lat with
      k_lat < n, and FFT the remaining n - k_lat coordinates at a modulus p > 1.
      Concretely at this scale: m = 35, n = 25, k_lat = 15, k_fft = 10, p in
      {2, 3, 5}, beta_sieve = m + k_lat = 50. This single change does three things
      no amount of further measurement in the present corner can do -- (i) an
      admissible (m, k_enum, k_fft, p, beta_bkz, beta_sieve) tuple EXISTS, so
      MATZOV.Nf becomes a prediction about the measured object and P1 is answered
      constructively instead of by tautology; (ii) the term
      exp(k_fft/3 (sigma_s pi/p)^2), which exists precisely to charge the
      adjacent-FFT-bin penalty, becomes non-trivial and therefore FALSIFIABLE in
      both directions -- it is the law's own model of the near-miss phenomenon
      that is the campaign's only interesting observation; (iii) the near-miss
      population acquires a principled definition (an adjacent FFT bin) rather
      than an ad hoc one (+1 in one coordinate).
    the_cheapest_validating_check_before_committing_batch_3: >-
      CTRL-RT-9, run on the already-existing replicate instances: repeat my
      row-permutation and length-matched nulls against the near-miss statistics on
      all 9 instances. It needs no sieve, no estimator, and about ten minutes of
      numpy -- it needs only that the replicates' (x, y) be emitted (OBJ-9). It is
      the cheapest check because it decides the question the card actually asks. If
      the +35.6% / -13.6% separation replicates, the campaign has its first
      sieve-structure-sensitive observable and batch 3 should carry it INTO the
      redesigned corner, where the p-term makes it comparable against the law's own
      correction. If it does not replicate, PAC-1's generalisation is restored, the
      instrument really is blind on this instance class, and the redesign is still
      required -- for the independent reason in OBJ-8. Either outcome licenses the
      same change of design, which is why this is the check to run first.
    second_cheapest_check_worth_running_in_the_same_hour: >-
      The crypto-scale error-model arithmetic of OBJ-7 -- exact centred-binomial
      characteristic function against MATZOV's Gaussian idealisation at ML-KEM
      (q, eta) and a dual-attack a_x. Seconds, no sieve, no toy scale, and it is
