    At m=35, n=25, d=60, q=127, secret centred-binomial eta=2, error
    rounded-Gaussian sigma=2, on one LWE instance whose seeds are deliberately
    those of BATCH-d2a728, a rebuilt g6k 0.1.2 bgj1_sieve returned 17,919 dual
    vectors, all of which I independently certified to satisfy y = A^T x mod q
    (0 violating entries of 447,975). On that database: the per-vector advantage
    law exp(-2 pi^2 sigma_e^2 ||x||^2/q^2) holds to about 2% as written across
    ||x||^2 deciles spanning a 3.8x range, and to about 0.3% once the error's
    rounding is accounted for by Sheppard's correction sigma^2 + 1/12, which I
    re-derived in closed form with no free parameters; the iid noise model for
    uniform wrong candidates is consistent with unity within about 2%, where 2% is
    the batch's own across-instance spread and not the 0.2% quoted; the near-miss
    population is roughly 7x more concentrated than independence predicts, of which
    a factor about 9.5 is reproduced by vector families with the same lengths and a
    residual factor about 1.36 is NOT, being absent from a null that preserves both
    length multisets and every y-column marginal and removes only membership of the
    dual lattice; that residual grows with N over a 36x range and is invisible at
    N <= 2000; the correct-secret score's 403x variance inflation is a controlled
    null attributable entirely to the shared error vector, which I reproduce to
    0.34%; and MATZOV.Nf admits exactly one instantiation consistent with this run's
    vector family, namely k_enum = k_fft = 0, under which it predicts N = 2.98-5.65
    against a measured distinguishing threshold near N' = 8. Every one of these is a
    statement about one toy instance under one sieve at one modulus. None is a
    statement about ML-KEM, about FIPS 203 parameters, about the cost of any attack,
