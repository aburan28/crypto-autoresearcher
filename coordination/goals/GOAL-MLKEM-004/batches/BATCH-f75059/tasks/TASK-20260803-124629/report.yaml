  # =====================================================================
  proof_architecture_checks:
    - id: P-1
      check: "P1: does MATZOV.Nf line 540 make k_lat + k_fft + k_enum = n an identity, or is it a default that can be overridden?"
      status: reproduced
      finding: >-
        IDENTITY, confirmed by reading /tmp/le/estimator/lwe_dual.py at the pinned
        commit. Nf's signature is (cls, params, m, beta_bkz, beta_sieve, k_enum,
        k_fft, p) - k_lat is NOT a parameter. Line 540 is a local assignment
        `k_lat = params.n - k_fft - k_enum  # p.15` with no keyword override and
        no branch. MATZOV.cost repeats the same assignment at line 586. There is
        no call path by which a caller supplies k_lat independently. The
        producer's premise is exactly correct.
    - id: P-2
      check: "is requirement R1 (k_lat = n) forced by the run?"
      status: reproduced
      finding: >-
        Yes. The lattice sieved has dimension m + k_lat; the run sieved the full
        d = 60 dual lattice with m = 35, forcing k_lat = 25 = n. I confirmed from
        vectors.json that all 25 y-coordinates are short for every vector
        (<||y||^2> = 129.556, i.e. rms 2.28 per coordinate against ~36.6 for
        uniform mod 127), so every secret coordinate is genuinely absorbed by
        y-shortness. R1 is a fact of the run, not a modelling choice.
    - id: P-3
      check: "is requirement R2 (k_enum + k_fft = n) forced, or an artifact of this harness?"
      status: not_reproduced
      finding: >-
        DEFECT 2. R2's stated premise is contradicted by the producer's own
        emitted data. results.json S2 design_facts records
        candidates_differ_on_coordinates = 25 and compare.py:377 tests
        `r2 = (k_enum + k_fft == n)`. From vectors.json, only 14 of the 33 wrong
        candidates differ from s on all 25 coordinates: the 8 near-miss
        candidates differ on EXACTLY 1, the 8 secret-distribution candidates on
        16-23, zero_vector on 19, and 2 of the 16 uniform candidates on 24.
        The IMPOSSIBILITY CONCLUSION SURVIVES, and under a stronger premise: any
        candidate differing from s on at least one coordinate requires that
        coordinate to lie in MATZOV's guessed part, hence k_enum + k_fft >= 1,
        hence k_lat <= n - 1 = 24, hence m + k_lat <= 59 < 60 = d, contradicting
        R1. So emptiness holds for h >= 1 rather than only for h = n. But the
        proof AS CODED tests a design fact the archived data falsifies.
    - id: P-4
      check: "scope: 'no tuple for MATZOV.Nf and any distinguishing-only design' vs 'no tuple for the design this producer built'"
      status: reproduced
      finding: >-
        THE SECOND, NOT THE FIRST. This is the load-bearing scope distinction and
        the headline does not make it.
        A pure distinguisher - no candidate scored at all - ADMITS the tuple
        (m=35, k_enum=0, k_fft=0, p arbitrary, beta_bkz arbitrary, beta_sieve=60).
        I evaluated it independently: MATZOV.Nf returns 2.978518720180076, and by
        KA-3/KA-5 (which I reproduced exactly) it is invariant in p and in
        beta_bkz there, so the tuple is not merely admissible but essentially
        unique. wellposedness.md section 5 ITSELF COMPUTES WITH THAT TUPLE
        (lsigma_s = 24.406, which I reproduce to 24.40583).
        A split-secret design - sieve on m + k_lat with k_lat < n, enumerate or
        FFT the remaining n - k_lat - also admits tuples; the producer names it
        in section 6 as the concrete successor.
        The honest maximal scope of the impossibility is therefore: NO TUPLE
        EXISTS FOR ANY DESIGN THAT SIEVES THE FULL m+n DUAL LATTICE AND SCORES AT
        LEAST ONE CANDIDATE DIFFERENT FROM s. That is a statement about the
        producer's measurement design, NOT about MATZOV.Nf and not about
        distinguishing-only designs in general. It says nothing whatever about the
        cost model's correctness, which wellposedness.md section 6 states plainly
        and which report.md section 0's table row does not.
    - id: P-5
      check: "does the 351-pair enumeration carry independent computational content?"
      status: not_reproduced
      finding: >-
        DEFECT 3. It does not. 351 = (n+1)(n+2)/2 is exactly the count of pairs
        with k_enum + k_fft <= 25, so the enumeration is complete as advertised -
        but R1 forces the sum to 0 and R2 forces it to 25, so emptiness is
        immediate one-line algebra. More importantly the loop enumerates only
        INSIDE the fixed conjunction R1 and R2; it structurally cannot discover
        that a different design admits a tuple. The load-bearing content is the
        modelling judgement R1 and R2, which is prose, not the loop. Describing it
        as "checked in code, not asserted" and "verified by exhaustive
        enumeration" attributes computational force to a tautology.
    - id: P-6
      check: "was a tuple manufactured to make a comparison possible?"
      status: reproduced
      finding: >-
        NO. This is the thing the card most wanted and the package delivers it.
        admissible_tuples_found is [], tuple_exists is false, no residual against
        a predicted N is reported anywhere, and the producer explicitly declines
        to license the one sub-comparison it does report. Under the inventor
        protocol's closure standard, an honest declaration of ill-posedness is the
        correct and harder output, and the producer chose it.
    - id: P-7
      check: "unit inconsistency: Hf in bits while log p and log(1/mu) in the same sum are nats"
      status: reproduced
      finding: >-
        CONFIRMED against the pinned source and numerically.
        lwe_dual.py:560-564 returns `RR(1/2 + log(sqrt(2 pi) sigma) + log(coth(pi^2
        sigma^2))) / log(2.0)`, i.e. bits, while line 555 sums
        `k_enum*Hf(Xs) + k_fft*log(p) + log(1/mu)` where log is natural. I measured
        Hf = 2.0470955928998906 against the natural-log entropy 1.4189385385552487,
        ratio 1.4426950408889636 = 1/ln 2 exactly. MATZOV.cost line 610 uses
        `2**(k_enum*H)`, confirming bits is the intended unit for Hf. So any
        k_enum-bearing reading of the log-term carries a further factor-ln2
        ambiguity on top of the referent ambiguity. Correctly recorded as an
        observation about the callable and NOT as a claim that the estimator is
        wrong - which is the right restraint, since the discrepancy is confined to
        Nf's sample-count term and may be intentional there.
    - id: P-8
