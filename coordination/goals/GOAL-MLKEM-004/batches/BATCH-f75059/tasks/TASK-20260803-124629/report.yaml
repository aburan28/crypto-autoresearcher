  batch1_correction_adjudications:
    - id: BC-1
      batch1_record: "EV-MLKEM-da9e3b OBS-6 (from VAL-20260803-535d15 defect 7): under the null, all 8 secret-distribution candidates beat the nominal secret, 9 of 9, z = -2.31"
      batch2_claim: "a single-draw fluctuation; mean rank 5.051 +/- 2.571 of 9 over 1000 fresh null targets"
      status: reproduced
      adjudication: UPHELD, AND STRENGTHENED BY MY OWN MEASUREMENT
      finding: >-
        My 1000 fresh uniform targets give mean rank 4.910 +/- 2.625 of 9 - dead
        mid-pack, reproducing the producer's 5.051 +/- 2.571. But I can name the
        reason batch 1's statistic was wrong rather than merely unlucky, which
        batch 2 does not: I measured
        P(all 8 secret-shaped candidates beat the nominal secret in one draw) =
        0.1020 over 1000 draws. Under the null the nominal secret and the 8
        secret-shaped candidates are exchangeable, so P(nominal ranks last) = 1/9
        = 0.1111, and 0.1020 is that value. Batch 1 observed a ONE-IN-NINE event
        and scored it as z = -2.31, i.e. a one-in-a-hundred event, by treating a
        rank-among-9 as approximately normal. The z was mis-specified; the
        observation itself was the null behaving exactly as a null must.
        The associated near-miss figure also reproduces: P(nominal first within
        near-miss) = 0.004 (producer 0.002), an order-statistic effect since the
        8 near-misses are near-copies of the nominal secret. The uniform-group
        rank 8.774 +/- 4.830 of 17 reproduces the producer's 9.139 +/- 4.865.
      consequence: >-
        OBS-6 should be superseded, not deleted. Its factual content ("the
        producer did not name this") stands; its inferential content (z = -2.31)
        does not. No status change is made by this report - that is the
        Coordinator's act.
    - id: BC-2
      batch1_record: "EV-MLKEM-da9e3b OBS-4 (from RT-20260803-4064e1 OBJ-3): no error bars anywhere; resampling gives correct-secret mean +0.4029 +/- 0.0856, roughly 20%, and that uncertainty does NOT shrink with N"
      batch2_claim: "it is within-instance error-draw spread, not instance-to-instance; across 9 replicates the correct-secret mean varies by 0.0041, 22x smaller"
      status: reproduced
      adjudication: UPHELD ON ITS OWN TERMS, UNDERSTATED, BUT IT RECLASSIFIES ONLY THE FIRST HALF OF OBS-4 AND LICENSES AN OVERREACH
      finding: >-
        (a) The reclassification is correct and in fact conservative. The nine
        per-instance means (500 draws each) have across-instance sd 0.004070. The
        pure Monte-Carlo floor for a 500-draw mean is
        sqrt(mean(sd_i^2)/500) = 0.003880. So the GENUINE instance-to-instance sd
        is at most sqrt(0.004070^2 - 0.003880^2) = 0.00123, not 0.0041. The true
        ratio to the 0.089 per-draw spread is therefore >= 70x, not 22x. The
        producer's 0.0041 is an upper bound that it does not label as one.
        (b) It does NOT refute OBS-4's second clause. "That uncertainty does not
        shrink with N" remains true and is CONFIRMED by batch 2's own NULL-SWEEP:
        N_eff is ~44 and independent of N over a 60x range (C-5). Batch 2 does not
        claim otherwise, but section 7's framing invites the reading that OBS-4
        was wrong; OBS-4 was right, and was about a different thing.
        (c) The inference batch 2 draws is not supported in general. Section 7
        consequence 1 says "Every ingredient ratio in this report is therefore far
        better determined across instances than the per-draw sd suggests." Same
        decomposition per quantity: correct-secret mean, genuine instance sd
        <= 0.00123 (claim holds); ingredient-1 global ratio, 0.00254 (holds);
        near-miss delta vs best, 0.000030 on a delta of 0.001571, i.e. 1.9%
        (holds, and the departure genuinely replicates); BUT the ingredient-2
        uniform sd ratio has across-instance sd 0.05209 against an MC floor of
        0.01201, i.e. a GENUINE instance-to-instance sd of 0.0507 - four times its
        own per-instance sem and 13x the per-draw sem quoted in section 4.1.
      consequence: >-
        See DEFECT 4 and DEFECT 5. The "accurate to 0.2%" claim for ingredient 2
        uniform is not supported once instance variance is included; the supported
        figure is 1.00 +/- 0.05.

