      control: "NULL-V (vector-null): sieve database vs random directions of matched ||x||, paired error draws"
      status: reproduced
      producer: "sieve sd 0.088015 / N_eff 44.4 against surrogate sd 0.087785 / N_eff 44.7; agreement 0.3%"
      recomputed: "sieve sd 0.084160 / N_eff 49.0 against surrogate sd 0.083975 / N_eff 49.2; paired sd ratio 0.9978 (producer 0.9974)"
      assessment: >-
        The load-bearing quantity is the PAIRED RATIO, and it reproduces to
        0.04%. My absolute sds sit 4.4% below the producer's, which is ordinary
        Monte-Carlo variation for an sd estimated from 1000 draws of a
        heavy-tailed scalar (sd of an sd ~ 2.2% under normality, more here).
        CONCLUSION HOLDS: the 400x variance inflation is NOT a property of sieve
        output.
    - id: C-2
      control: "does NULL-V remove ONLY the object it names?"
      status: reproduced
      assessment: >-
        Yes, and the naming is honest. Named as removed: lattice membership,
        integrality, the exact 3-term relations, ball saturation. Named as
        preserved: N, m, q, sigma_e, and the exact empirical ||x|| distribution
        (each surrogate carries the norm of the vector it replaces), so a_x is
        identical by construction - I verified a_x is byte-identical between arms.
        One additional removal beyond "sieve structure" is INTEGRALITY of the
        phase (the surrogate is real-valued), but integrality is explicitly named
        in removes_object, so the null is not silently coarser than advertised.
        For this statistic the correct candidate is scored, so Dphase = 0 and the
        y-part is irrelevant to both arms - genuinely apples to apples.
        can_it_fail: YES, correctly.
    - id: C-3
      control: "NULL-IID: shared error vector removed, sieve database preserved exactly"
      status: reproduced
      producer: "sd 0.004368 against iid 0.004416, inflation 0.98x, N_eff 18319 vs N 17919"
