  post_hoc_correction_checks:
    - id: PH-1
      subject: "D1 - the discretised-error characteristic function (Var 4.0833, not 4)"
      question: "principled, or fitted?"
      status: reproduced
      verdict: PRINCIPLED, with a reporting caveat
      finding: >-
        compare.py:94 samples the error as `np.rint(rng.normal(0, sigma, ...))`.
        I derived the exact law of round(N(0,2)) from first principles and got
        Var = 4.083333333333334, matching the producer's 4.0833 - this is the
        exact variance of the distribution the code actually samples, not a fitted
        parameter, and it has ZERO free parameters.
        Decisive test of fitted-vs-principled: the mean predicted advantage under
        the exact discrete characteristic function is 0.4072111022 and under a
        plain continuous Gaussian at variance 4.0833 is 0.4072133231 - agreement
        to 5 decimals. So the whole effect is one derived number (the realized
        variance), not a curve with knobs. It is a specification/implementation
        mismatch in the frozen law, correctly identified.
        Reproduction: my own 2000 draws give decile ratio spread 0.0115 under the
        frozen sigma^2=4 law and 0.0030 under the exact discrete cf, a 3.8x
        reduction (producer claims 2.8x, from 0.0077 to 0.0028). The reduction
        reproduces; its exact factor is seed-dependent.
      caveat: >-
        DEFECT 6. "The -1.8% common offset disappears entirely ... A +0.15%
        residual remains, unexplained" reports below the noise floor. The global
        ratio's sem at 2000 draws is 0.0048 (0.48%), so a +0.15% residual is not
        resolvable. My run gives a post-correction global ratio of 0.9939 (-0.6%,
        also within 1.3 sem of unity) and a residual shape-trend correlation of
        -0.63 against the producer's +0.76 - the residual's SIGN is not stable
        across seeds. The correction's effect is real; the leftover is noise and
        should be reported as such.
    - id: PH-2
      subject: "D2 - the c4(16) sample-sd bias correction"
      status: reproduced
      verdict: PRINCIPLED
      finding: >-
        See M-9. c4 is the standard unbiasing factor for E[s] = c4(n) sigma under
        normal sampling, computed from n alone, not from the data. It is applied
        identically to all three groups, so it cannot manufacture the near-miss
        departure (0.1447 -> 0.1499 leaves the concentration at 6.7x), and both
        raw and corrected values are reported.
      caveat: >-
        Its normality/independence assumption is only approximately met - the
        candidate scores within a draw share the error vector e. The correction
        happens to move the uniform ratio TOWARD agreement (0.9814 -> 0.9978),
        which is the direction that flatters the "law holds" reading. Since the
        raw figure is reported alongside and the correction is 1.7%, this is a
        disclosure caveat, not a defect.

