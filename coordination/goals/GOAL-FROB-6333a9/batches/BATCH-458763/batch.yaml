      '6abf4ca9d293dc8275b80f9aa45e616bfb28e282a323e97501480e6631115365': Q2 margin, n=127, m=2, full precision
      'e8a2e64698a3129affa9671f0fd94a7ca777896ec1508820329e18c0b91c8321': Q3 ratio, n=13, full precision
      'acf93d30475d2453abc594d186e0832217523e6c54b853b0c3c2e3559576d683': Q3 ratio, n=13, 4 decimals as EV-FROB-d336b0 quotes it
      'abbb1ffe5a99f8f6e55e253ef4180673357a753ca8787c8394fed01bc54d8231': Q3 ratio, n=11, full precision
      'fc7cb3aa2ddeb489a9b9073349686105ea545170569366dfed835b31fc8ddbab': Q3 ratio, n=7, full precision
    excluded_from_protected_sha256:
      by_length_rule: >-
        EVERY INTEGER answer is excluded: Q1 counts, dimensions and d_min; Q2
        l*, l' and penalties; Q3 |F_V|, f, orbit counts and histograms. So are
        the ONE-DECIMAL margins EV-FROB-d336b0 quotes. The cut is by length, as
        in BATCH-ba0b0d, never by today's hit count. Integers of up to four
        digits collide with extension degrees, dimensions and PR numbers
        throughout this repository's history. A check that is red on unrelated
        history cannot tell a leak from noise, and it would also stop
        protecting the long literals that matter.
      measured_before_writing: >-
        Reported by the top-level session from the last 500 commit messages
        reachable from HEAD = origin/main 41a62a64b0, counts only:
        - The two literals that name the target degrees: 19 and 17 hits,
          everywhere in history, from the challenge and degree names.
        - Each of the four one-decimal margins: 1 hit, ALL IN THE SAME COMMIT,
          befcfb7d71 (the ecc2k130 analysis erratum).
        - The largest curve-cell factor-base size: 1 hit, in 6470354038 (the
          commit introducing EXP-FROB-ec08b5).
        - The four-decimal n = 13 ratio (PL-09): 0 hits.
        So --blind-history could never pass on the excluded values. That is
        why they are excluded rather than declared.
      named_commits_the_blind_reviewer_must_not_read:
        - befcfb7d71
        - 6470354038
      named_commits_note: >-
        TASK-20260923-21ae7f's card bans git history outright (BL-2). These two
        are named anyway, so that an attestation can be checked against them
        and a later reader can see where the known exposure sits.
      what_still_protects_the_excluded_values:
        - >-
          The whitelist read scope on TASK-20260923-21ae7f: five files, none of
          which states any answer.
        - >-
          The blanket ban on git log / show / blame / diff and on PR text for
          that task.
        - >-
          The launch prompt, which names the card and blind-inputs.yaml and
          says NOTHING about EXP-FROB-ec08b5, its results or this goal's
          history.
      residual_risk: >-
        STATED PLAINLY. The integer answers to Q1 and Q2 at n = 131 and 163
        follow from a classical computation (the order of q mod n). They are
        also written in several committed records, in commit messages, and in
        prose across the repository. A re-deriver that reads outside its
        whitelist could copy them, and --blind-history would not notice. So J6
        agreement on those integers is weaker evidence than J6 agreement on the
        protected long literals and on Q3. Where the two differ in what they
        show, composition weighs them that way.
