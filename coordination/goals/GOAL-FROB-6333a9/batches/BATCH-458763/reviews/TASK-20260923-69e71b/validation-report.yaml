      findings:
        - id: F-J2-0
          kind: values_hold
          text: >-
            All 14 rows reproduce exactly (see computed). F_V is pi-stable for every
            sigma-stable V of every cell's dimension on every recorded curve, not
            only for the V the producer picked.
        - id: F-J2-1
          kind: strength_wording
          text: >-
            P4 is not an implementation identity, since f is computed independently
            (driver.py:180). But under clause (iii)'s own premises it is a THEOREM:
            E defined over F_q, n prime, F_V pi-stable. pi^n = id on E(F_{q^n}),
            so every orbit length divides n. Length 1 holds exactly when pi(P) = P,
            which holds exactly when both coordinates lie in F_q. Hence
            #orbits = f + (|F_V| - f)/n, with no mathematical outcome in which it
            fails. The same argument gives "never more than n" for pi alone. A
            deviation could only have signalled an implementation defect, in the
            enumeration, pi, the orbit loop or the coordinate test. It could not
            falsify clause (iii) as H-FROB-6774fb P4's minimum_effect says. "EXACT
            on every curve cell" confirms that the implementation agrees with a
            theorem. It is not a test of a hypothesis that could have been false,
            and EV-FROB-d336b0's "now measured rather than assumed" overstates it.
            This matches the prior's J2(ii) concern on a different ground: the
            formula, not the code path, makes the check non-falsifiable.
        - id: F-J2-2
          kind: controls_genuinely_fail
          text: >-
            Both controls fail by MEMBERSHIP. V' is non-stable by the membership
            test `sigma * b in S` (curve_panel.py:102-105). pi-stability is
            `pi(P) not in S` (curve_panel.py:130). For the null curve, the failure is
            the exception raised when (x^q, y^q) is not on E'
            (curve_panel.py:132-133). Certificates in own code, for EVERY row:
            every non-stable V' whose factor base has the recorded control size has
            a non-pi-stable factor base (for example 1,414 of 1,414 at (2,7,3), size
            11, and 117 of 117 at (2,13,12), size 4043). The recorded failure is
            therefore certified, up to the unrecorded choice of V'. Same-size rows:
            at (4,3,2) curve 0 the control size 15 equals |F_V| = 15; nine
            non-stable V' have size 15 and none is pi-stable. At (2,13,12), 52
            non-stable hyperplanes have exactly 4005 points and none is pi-stable.
            Size is never the discriminator. Null: 0 pi-stable factor bases in every
            enumerated or sampled family. Algebraically, with j not in F_q,
            (a2 - a2^q) X^2 + (a6 - a6^q) = 0 (char 2 and 3 models) or
            (a - a^q) X + (b - b^q) = 0 (char 5) has at most 2 (resp. 1) roots. So at
            most 4 (resp. 2) points of E' map onto E', and failure is forced once
            |F_V(E')| > 4. Every recorded null factor base has at least 7 points.
        - id: F-J2-3
          kind: control_power
          text: >-
            The non-stable V' control COULD have passed only at (2,7,3): 182 of
            11,809 non-stable V' (1.54%) give a pi-stable factor base of 1 or 3
            pi-fixed points (F-J1-5). At every other cell no non-stable V' of that
            dimension passes on the recorded curve (exhaustive), so the control
            could not have passed there. The null control is forced by the algebra
            above. Both controls therefore check the implementation's membership
            logic. They do not test for an outcome the hypothesis could have
            produced. EV P3's "a uniformly random non-stable V' of the SAME
            dimension never does" is true of the draws made and false as a universal
            statement at (2,7,3).
        - id: F-J2-4
          kind: replication_count
          text: >-
            The Coordinator's reading is CONFIRMED from the bytes.
            trial-plan-v1.json lists 10 (q, n, dim) curve cells, and
            curve_panel.json has 14 (cell, curve) rows. The six q = 2 cells carry
            one curve each, because every ordinary curve over F_2 has j in
            F_2^* = {1}, and all six rows are the SAME curve y^2 + xy = x^3 + 1
            base-changed to six extensions. The four cells with q in {3,4,5} carry
            two curves each. Control instances number 10, not 14. U is drawn once
            per cell (driver.py:172). The null curve is drawn with the same seed for
            each row of a cell (driver.py:204), giving identical null factor-base
            sizes within a cell. EV's "Both controls failed on every cell" rests on
            10 V' draws and 10 null curves. The spec's replication plan says "cells
            where only one exists are recorded as such and their evidence strength
            is capped accordingly". That is not implemented: no field in
            curve_panel.json and no EV sentence records it.
        - id: F-J2-5
          kind: no_orbit_content_rows
          text: >-
            Rows (2,7,3) (1 point) and (2,7,4) (3 points) consist only of pi-fixed
            points and contain no orbit of length n. The EV scope_and_limits caveat
            names them. But the aggregates count them without qualification:
            EV P4 "14 of 14 cells", EV strength_basis "verified exactly at 14
            cells", H status_note, DEC D3 and metrics.json
            orbit_prediction_exact_cells = 14. Only 12 rows carry an orbit of
            length n. At both cells the OTHER stable subspace of the same dimension
            carries orbit content (15 points with two 7-orbits, and 17 points with
            two 7-orbits). The degenerate rows come from curve_panel.stable_subspace
            returning the first stable V in enumeration order
            (curve_panel.py:83-94), not from cell size alone.
        - id: F-J2-6
          kind: recording
          text: >-
