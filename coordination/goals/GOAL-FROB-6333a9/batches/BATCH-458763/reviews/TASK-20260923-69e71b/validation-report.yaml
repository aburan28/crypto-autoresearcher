      f_computation:
        where: experiments/EXP-FROB-ec08b5/impl/driver.py:180
        code: fixed = [P for P in Fb if P[0] in k and P[1] in k]
        how: >-
          Base-field membership of both coordinates of each factor-base point. The
          predicted count is built from it at driver.py:181-182 and compared at
          driver.py:192 with len(orbs) from curve_panel.pi_orbits
          (curve_panel.py:123-146). f is NOT read off the orbit partition, and
