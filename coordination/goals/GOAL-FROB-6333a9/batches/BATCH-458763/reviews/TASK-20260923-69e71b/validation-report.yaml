            never executes the predicate on (4,3), though: analysis.verdict and
            min_faithful_dimension run only on the 16 targets (driver.py:228-240),
            none of which has q = 1 mod n. The panel reaches (4,3) only in the
            lattice, census and curve phases. A second, different predicate exists
            in lattice.min_faithful_dimension (lattice.py:74-88), whose docstring
