            false when p | n: it returns None at (2,4) and (3,3), where the true
            value is 2. It is dead code with no caller (grep over impl/*.py).
        - id: F-J1-5
          kind: clause_wording_break
          text: >-
            Clause (i) "F_V is pi-stable ... exactly when V is sigma-stable" is
            false in its "only if" direction. On the run's own curve
            y^2 + xy = x^3 + 1 over F_{2^7}, 182 of the 11,809 non-stable 3-dim V'
            have a pi-stable F_{V'}. So do 462 of 2,667 non-stable 2-dim V', and 2 is
            OFF the attainable lattice {0,1,3,4,6,7}. Also 5 of 155 at (2,5) dim 2
            (off-lattice), and 5 of 1,210 at (3,5) dim 2 (off-lattice), on
            y^2 = x^3 + x^2 + 1. In EVERY such case, F_{V'} = F_{W'} as point sets,
            with W' the span of its x-coordinates. W' is sigma-stable, lies inside
            V', and has dimension 0 or 1. F_{V'} has 1 to 3 points, all pi-fixed,
            with no orbit content. A certificate (a V' basis and its points) is in
            computations.json (j1_clause_i.out). A statement the data support: F_V
            is pi-stable iff its set of x-coordinates is sigma-stable, iff
            F_V = F_W for the sigma-stable W spanned by those x. Hence V is
            sigma-stable whenever the liftable x span V. This leaves counts,
            spectra and every orbit-bearing factor base untouched. It affects the
            wording of clause (i), and of the H title "available only on an
            arithmetic lattice of dimensions", which is literally false at toy
            scale for degenerate factor bases.
      artifacts_read:
