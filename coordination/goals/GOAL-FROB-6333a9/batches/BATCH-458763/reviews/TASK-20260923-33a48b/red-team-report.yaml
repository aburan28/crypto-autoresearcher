      - id: S7
        record: EV-FROB-d336b0
        field: observations[9]
        quote: "INDEPENDENT VINDICATION OF GOAL-FROB-6333a9's OWN CELL CHOICES, arrived at from the module side and not from the WDSat side. [...] Those are exactly the cells at which the net-win margin is positive with zero dimension penalty: n = 41 admits a net win at m = 2 and at no other m in {2,3,4,5}; [...] The preregistered choice was correct for a reason the goal had not recorded."
        why: >-
          Five of the cells this sentence relies on are model-dependent.
          (2,41,3) is a C-dependent loss under variant A and a WIN under M1
          at C >= 2^20. (2,41,2) is a LOSS under M1 at C = 1. (2,43,2) is a
          WIN under M1 at every C. (2,43,5) is C-dependent under class A, and
          a loss under M1 with variant B at C = 1.
          The goal chose these cells for a different question: WDSat conflict
          pruning (GOAL-FROB-6333a9 objective). "Vindication" and "correct"
          are normative claims no artifact measures.
        scoped_replacement: >-
          "Under the pinned-dimension model the goal's cells (2, 41, 2) and
          (2, 43, 3) are zero-penalty cells for the pi-quotient; this is a
          property of the factor-base lattice, not a test of the goal's WDSat
          question."
      - id: S8
        record: H-FROB-6774fb
        field: statement (clause iv)
        quote: "and therefore (iv) against the unconstrained optimum l* = ceil(n/m), stability forces l' = min{attainable faithful l >= l*} and the orbit trick is a net win if and only if q^(l' - l*) < n."
        why: >-
          Three defects. "The unconstrained optimum" is a mislabel (J3_i M1).
          "Forces" hides the round-up-only restriction. "If and only if ...
          < n" fails literally at (2, 7, 7..12) and is model-dependent
          elsewhere.
        scoped_replacement: >-
          "(iv) with the baseline pinned at l* = ceil(n/m), the orbit pipeline
          at l' = min{attainable faithful l >= l*}, and per-relation cost
          independent of l (assumptions to be numbered), the pi-quotient is a
          net win in both stages iff q^(l' - l*) < g(l'), g the exact mean
          orbit size."
      - id: S9
        record: H-FROB-6774fb
        field: mechanism
        quote: "so the attainable dimensions are exactly {a + b*d : a in {0,1}, 0 <= b <= s}: a coarse lattice of spacing d, NOT an interval."
        why: >-
          False whenever q = 1 mod n, where d = 1. PTM-1 gives the full
          interval at all 13 such cells, and the code handles it correctly.
          This is prose only.
        scoped_replacement: "a lattice of spacing d = ord_n(q), which is the full interval exactly when q = 1 mod n."
      - id: S10
        record: H-FROB-6774fb
        field: proof_search_map.observation_collision.observable
        quote: "The pair (attainable dimension spectrum, mean orbit size), which is a function of (q, n) alone -- not of the curve, the basis, or the solver."
        why: >-
          The mean size of the orbits of the Frobenius actually available on
          E depends on the curve. It is about 3n for the PTM-7 curve at (8, 5),
          and there are no orbits for the null object (PTM-4). This is the
          observation-fiber break (proof_architecture_challenges PA-1). The
          missing separator is "E not defined over a proper subfield of F_q".
      - id: S11
        record: H-FROB-6774fb
        field: asymptotic_claim.prior_best
        quote: "Pollard rho with the sqrt(n) Frobenius-class speedup as the matched baseline"
        why: >-
          RQ-FROB-7d8dd4 constraints require rho on Frobenius AND negation
          classes, sqrt(2n). Low severity: H and EV explicitly claim nothing
          against rho.
      - id: S12
        record: IDEA-20260918-9abf42
        field: title
        quote: "At n = 131 that is FOUR subspaces, of dimensions 0, 1, 130 and 131 -- so no Frobenius-stable factor base of index-calculus dimension exists at the ECC2K-130 target for reasons having nothing to do with any degree bound, and this program's toy ladders have been measuring Frobenius structure at exactly the n where there is none"
        why: >-
          This is the upstream record, outside the four the plan names. It is
          reported because it is where the wording in S1 comes from. It
          slides from "subspace" to "factor base", and PTM-5 falsifies the
          latter. The proposal's own body is careful ("Frobenius-stable
          F_2-subspaces").
    J3_iii_correctly_scoped_fields_for_contrast: >-
      H-FROB-6774fb assumptions[0] and interpretation_limits[0],
      EV-FROB-d336b0 scope_and_limits[0] and [3], and the run's report.md
      "Scope" section all carry the linear-F_V qualifier and the cost-model
      caveat. The defect is that observation sentences, the title, the
      summary and the proposed KN-FIND drop qualifiers those fields carry.
    J3_iii_analysis_note_not_a_record: >-
      analysis/frobenius-orbit-ecc2k130/README.md, "The finding", says: "The
      orbit-union factor base is the **only** Frobenius-stable factor base
      available at ECC2K-130 -- part B rules out every linear one". Both
      halves are false. The linear dimension-130 subspace is stable, and
      orbit unions of other shapes exist. The README is an analysis note
      that is "not evidence", so this is reported for completeness only.

    J3_iv_strength_and_profile_honesty:
      strength_basis: >-
        strength_basis says "Every quantity is an exact finite count, not a
        sample". That holds for the P1-P4 quantities and for the dimension
        lattice at every enumerated n, which is computed exactly at n = 131
        and 163 too. It does NOT hold for the P5 and clause (iv) net-win
        verdicts. Those are outputs of a cost model the strength_basis never
        names.
        strength_basis also places the weak point in clause (iii), "argued,
        not measured, at cryptographic n". But clause (iii) is a short
        derivation for n an odd prime (pi^n = id, and F_{q^2} is not in
        F_{q^n}). What is argued and never measured at ANY n is clause (iv):
        no relation collection or linear algebra was run.
        So `strong` is supported for clauses (i)-(iii) as structural_exact
        facts, subject to J1/J2/J6. For clause (iv) it is supported only for
        the P5 loss verdicts, which are robust to every model examined. The
        other enumerated net-win and net-loss verdicts are model-dependent
        and should not be promoted at `strong`.
      claim_kind_constant_factor_carried: >-
        Carried in H-FROB-6774fb asymptotic_claim (hidden_cofactor,
        claim_kind) and in EV observations[4] ("a constant factor in the field
        size, not an exponent move"). Missing from DEC-20260922-5796b8 summary,
        from the proposed KN-FIND sentence, and from EV observations[5], [6],
        [7] and [9]. The scoped wording below carries it.
      target_result_profile_scoring: >-
        C1 no. The claim is honestly labelled constant_factor, so it is not
        target-class.
        C2 yes.
        C3 no. heuristic_assumptions is `[]`, yet clause (iv)'s verdicts rest
        on unnumbered model assumptions HA-HD (heuristic_challenges).
        C8 no. Clause (iv) compares per-attempt proportionalities and omits
        the inverse success probability 1/P(m, l). That is the exemplar's
        cost-bookkeeping item 5 defect.
        C13 partial. There is a target table, but its cost model is not
        stated as assumptions.
        C14 no. Memory is not disclosed; the quotient divides the sparse
        matrix's memory by g as well.
        C16 not scored, per RA-7.

