  # ---------------------------------------------------------------------------
  joint_J3:
    verdict: breaks
    verdict_rests_on: >-
      (i) The "if and only if" in clause (iv) is exact only inside one cost
      model, and H does not state that model as an assumption. Read literally,
      with n rather than the mean orbit size, it mis-decides six cells the run
      itself scanned. Under a rebalanced model that satisfies all four of H's
      stated assumptions, 23 of the 64 enumerated (q, n, m) cells take the
      opposite verdict for some per-attempt cost.
      (ii) "Exactly n and never more" is true of the q-power Frobenius alone.
      But three records let it read as a bound on all symmetry gains, and it
      is false for the Frobenius of a smaller field of definition.
      (iii) The KN-FIND sentence DEC-20260922-5796b8 proposes asserts
      unavailability at n = 131 and 163 with no linear-F_V qualifier. It is
      contradicted by the run's own target table, which records
      `available: true` there. Eleven further record sentences over-reach.
      (iv) strength_basis names the wrong part of the claim as argued rather
      than measured.
      What survives every model examined: the loss verdict at q = 2,
      n in {131, 163}, m in {2..5}, which is P5.

    J3_i_the_iff:
      symbols_and_models: >-
        Costs are in units of one sparse linear-algebra row operation. The
        row weight m is the same on both sides.
        N(l) = q^l classes before any quotient. g = mean pi-orbit size, which
        is spectrum()[l]['reduction_factor'] of the producer's analysis.py,
        and g = 1 with no quotient. C(m, l) = cost of ONE decomposition
        attempt. P(m, l) = 1 - exp(-lam) = probability that an attempt yields
        a relation, with two variants:
        variant A: lam = q^(m l - n)/m!, the form in analysis.py's own
        docstring;
        variant B: lam = 2^m q^(m l - n)/m!, from GGMP 2020 Theorem 2.4's
        proof, which counts the 2^m sign choices.
        Relation stage R = (N/g) * C/P. Linear algebra L = (N/g)^2.
        M0 (the hypothesis's own design): the baseline is pinned at
        l* = ceil(n/m) with g = 1; the orbit pipeline sits at l' = the least
        faithful attainable l >= l*, with g = g(l').
        M0 has two admissible classes for C:
        class A: the orbit pipeline solves at its full dimension l', and
        C(m, l') may exceed C(m, l*) without bound;
        class B: the orbit pipeline may restrict each attempt to an
        l*-dimensional subspace of V', paying C(m, l*) with probability
        P(m, l*). In both classes C(m, l) >= 1 and C is non-decreasing in l.
        M1 (rebalanced): each pipeline minimises R + L over its own admissible
        l. The baseline ranges over every l in [1, n-1]; the orbit pipeline
        over faithful attainable l in [1, n-1]. C is constant in l and takes
        each value in {1, 2^10, 2^20, 2^30, 2^40}.
        M1 violates none of H's four stated assumptions: the Gaudry/Diem F_V
        family; n prime with gcd(q, n) = 1; relation count proportional to
        classes and linear algebra quadratic, comparing the same pipeline with
        and without the quotient; and no claim about decomposition cost. It
        rejects only the statement's label "the unconstrained optimum
        l* = ceil(n/m)". That label is false in the model analysis.py itself
        writes down: with quadratic linear algebra, the optimum at fixed m is
        near l = (n + log_q(m! C))/(m + 1).
      literal_clause_iv_versus_code: >-
        Clause (iv) says "net win iff q^(l' - l*) < n". The code decides
        q^(l' - l*) < g(l'). These agree on all 64 preregistered cells, where
        m is in {2..5}. They DISAGREE at (2, 7, m) for m = 7..12. The run
        scanned those cells in max_usable_m with m_cap = 12, and H's
        quantifier_order reads "for all m >= 2". There l* = 1, l' = 3 and
        q^pen = 4, but g = 4.0, because |V| = 8 gives orbits {1, 7}. The code
        says loss and the literal clause says win.
        The run records max_m_with_net_win = 6 at (2, 7); the literal clause
        gives 12.
        The code is right. Clause (iv) must use g(l') =
        q^l'/(q^a + (q^l' - q^a)/n), with a = dim(V intersect F_q), in place
        of n. "Asymptotically n" is not n at small |F_V|.
        See computations.json COMP-J3-N-VS-G.
      M0_results: >-
        18 zero-penalty WIN cells are C-independent. Both pipelines can use
        the same V, so the quotient divides R by g and L by g^2.
        10 positive-penalty WIN cells are C-DEPENDENT under class A and
        C-independent under class B. Under class B the orbit pipeline's
        per-relation cost equals the baseline's, so both stages win whenever
        q^pen < g. The Coordinator's prior that positive-penalty wins depend on
        C therefore holds only when a full-dimension solve is forced. Under
        class A, when the relation stage dominates, the flip threshold on
        C(m, l')/C(m, l*) is small: 2^0.97 at (3, 41, 2) under variant A and
        2^0.61 under variant B.
        36 LOSS cells. Under variant A, 6 are C-DEPENDENT: (2,11,2), (2,11,4),
        (2,41,3), (2,43,2), (2,233,3), (2,233,5). P(m, l) rises with l, so the
        per-relation cost C/P can FALL even when C is non-decreasing. The
        relation stage then favours the orbit pipeline, and a
        relation-dominated total flips. The flip needs a per-attempt cost
        above 2^9.35, 2^10.50, 2^13.55, 2^25.70, 2^79.53 or 2^48.81 row
        operations respectively, with C(m, l') = C(m, l*). Under variant B all
        36 are C-independent.
        The Coordinator's prior, "every net-LOSS verdict survives any C that
        is non-decreasing in l", therefore holds under variant B and fails at
        those 6 cells under variant A. The P model decides which.
      M1_results: >-
        23 of 64 cells take the opposite verdict to the inequality for at
        least one (C, P variant) in the grid. For 18 of them the M1 verdict
        itself changes with C: (2,11,2), (2,41,2), (2,41,3), (2,43,5),
        (2,113,2), (2,113,3), (2,113,5), (2,233,2), (2,233,3), (2,233,4),
        (2,283,2), (2,571,4), (3,41,3), (3,41,4), (4,41,2), (4,41,3),
        (4,41,5), (8,41,2). For 5 it is constant but opposite: (2,43,2) is a
        WIN at every C, and (2,239,2), (2,283,3), (2,409,2), (2,571,5) are
        LOSSES at every C.
        Loss-to-win examples at C = 1 under variant A: (2,113,3) goes from
        -11.18 bits pinned to +8.03 rebalanced, with both pipelines at l = 29,
        a lattice point BELOW l* = 38. (2,571,4) goes from -75.84 to +9.89 and
        (2,283,2) from -37.86 to +9.46.
        Win-to-loss examples: (2,409,2) goes from +8.68 to between -89.6 and
        -116.3 at every C tested; the orbit pipeline cannot go below
        l = 204, while the baseline rebalances to l = 136..150.
        The 8 P5 cells never flip, and lose by at least 251.2 bits.
        Mechanism: H's "stability forces l' = min{attainable faithful
        l >= l*}" forbids rounding DOWN. At fixed m the quadratic
        linear-algebra stage dominates at l*, so the orbit pipeline's best
        lattice point can lie below l*. The unconstrained baseline also does
        better below l*.
      coordinator_prior_scorecard: >-
        Four expectations from the prior.
        "Every net-LOSS verdict survives any C non-decreasing in l": true
        under M0 with variant B. False at 6 cells under M0 with variant A.
        False at 9 loss cells under M1.
        "Every zero-penalty win survives trivially": true under M0. False
        under M1 at 10 of the 18 zero-penalty cells.
        "Win cells with l* < l' depend on C": true under M0 class A only.
        "Where I think it breaks: (iii), then (i) on the positive-penalty win
        cells": (iii) breaks as predicted. (i) breaks, but mainly on the
        loss cells and on the pinned-l* modelling choice, not on the
        positive-penalty wins.
      narrowest_valid_statement_for_clause_iv: >-
        Assume three things: the baseline is pinned at l* = ceil(n/m); the
        orbit pipeline sits at the least faithful attainable l' >= l*; and the
        per-relation cost is equal at l' and l*. Then the quotient is a net
        win in BOTH stages if and only if q^(l' - l*) < g(l'), with g the
        exact mean orbit size, not n.
        If the orbit pipeline may sub-sample l*-dimensional subspaces of V',
        the WIN direction is a sufficient condition for a net win for every
        per-decomposition cost.
        The LOSS verdicts at q = 2, n in {131, 163}, m in {2..5} are robust
        to every model examined here. At the other enumerated cells the
        verdict depends on the model; see per_cell_classification.

    J3_ii_never_more:
      of_the_q_power_frobenius_alone: >-
        TRUE, for pi(x, y) = (x^q, y^q) and n an odd prime. Orbits have length
        1 or n, so the mean orbit size is at most n, and it tends to n only
        as |F_V|/f grows. Measured values: g = 4 at (2, 7, l = 3); 12.96 at
        the run's (2, 13, 12) cell; 4.995 on the PTM-7 object. "Exactly n" is
        asymptotic, which is why clause (iv) must use g (J3_i).
      as_a_bound_on_all_symmetry_gains: >-
        FALSE, on three kinds of object, all inside the linear F_V family.
        (1) <pi, -1> gives classes of size 2n. On the run's own (2, 13, 12)
        cell the histogram is {1: 1, 26: 154}, with mean 25.84. Against a
        baseline that already quotients by negation the gain from pi is still
        n. GGMP 2020 Theorem 2.4 builds the 2^m sign factor into the baseline,
        and so does variant B here.
        (2) The run's OWN panel curve at (5, 3, 2), curve_index 0,
        y^2 = x^3 + x over F_5, has j = 1728 (printed as 3 in F_5). The
        automorphism [i](x, y) = (-x, 2y) is defined over F_5 and maps F_V to
        itself, because V is an F_5-subspace. <pi, [i]> classes are
        {1: 1, 12: 3}, of size 4n. The mean class size is 9.25, against 2.85
        for pi alone: a factor 2 beyond both negation and pi.
        (3) The Frobenius of a proper subfield over which E is defined (PTM-7)
        gives a gain of k*n: 14.80, or 3n, at (8, 5). On the ENUMERATED
        (4, 41) and (8, 41) cells a curve with F_2 coefficients has sub-family
        gains of about 82.0 = 2n and 123.0 = 3n. No enumerated verdict
        flips, but the "never more than n" wording is false there.
        computations.json COMP-PTM6, COMP-PTM7, COMP-SFSEARCH.
      records_that_let_it_read_as_a_bound_on_all_gains: [S3, S4, S5]

    J3_iii_offending_sentences:
      # Every quote is verbatim from the committed record at HEAD 08fc80753e.
      - id: S1
        record: DEC-20260922-5796b8
        field: next_actions[2] (the proposed KN-FIND)
        quote: "On successful review, promote to a KN-FIND entry: the availability of the Frobenius-orbit factor base is decided by ord_n(q) alone, and it is unavailable at the ECC2K-130 and K-163 degrees."
        why: >-
          Six defects.
          (a) No linear-F_V qualifier. A NON-linear pi-stable factor base of
          index-calculus size exists at n = 131 (PTM-5: |S| = 2^43.03). The
          corpus already says so: KN-FIND-47da4e has orbit unions "stable at
          any size", and KN-OPEN-095df5 has the same.
          (b) "Unavailable" is false even inside the linear family. The run's
          own checkpoint/target_table.json records `available: true` at every
          (2, 131, m) and (2, 163, m) cell, with l' = 130 and 162: a faithful
          sigma-stable subspace exists, and the quotient on it is a net loss.
          (c) "Decided by ord_n(q) alone" is false in four places. For
          composite n or p | n the full factorisation of T^n - 1 decides it.
          For E defined over a proper subfield of F_q it fails (PTM-7). For
          the null object it fails (PTM-4). And the net-win verdict depends on
          the cost model (J3_i).
          (d) It carries no q = 2, no m range, no cost model and no
          constant_factor qualifier.
          (e) It does not cite the prior art for the linear classification and
          the n / n^2 gains: GGMP 2020, KN-LIT-796, sections 3.2 and 4.1.
          (f) Adopting it as written fires T2.
        scoped_replacement: see proposed_scoped_kn_find_wording
      - id: S2
        record: EV-FROB-d336b0
        field: observations[6]
        quote: "Availability is governed entirely by d = ord_n(q): the attainable dimensions are the subset sums of the degrees of the irreducible factors of T^n - 1, which for n prime is the coarse lattice {a + b d : a in {0,1}, 0 <= b <= (n-1)/d}. It does not depend on the curve, on the basis used to write field elements, or on the solver. Where q is a primitive root mod n the lattice degenerates to {0, 1, n-1, n} and no index-calculus dimension survives."
        why: >-
          True of the LINEAR dimension lattice for n prime. False as a
          statement about availability of the orbit trick.
          "It does not depend on the curve" fails for the null object (PTM-4)
          and for curves over a proper subfield of F_q (PTM-7).
          "No index-calculus dimension survives" fails outside the linear
          family (PTM-5). Inside it, dimension n - 1 is available and merely
          a net loss.
        scoped_replacement: >-
          "For the linear family F_V with n prime, gcd(q, n) = 1, the attainable
          dimensions of sigma-stable V are {a + b d : a in {0,1},
          0 <= b <= (n-1)/d}, d = ord_n(q); where q is a primitive root mod n
          the only faithful ones are n - 1 and n. This lattice is a property of
          (q, n); whether the pi-quotient on it is a net win also depends on
          the curve's field of definition and on the cost model."
      - id: S3
        record: EV-FROB-d336b0
        field: observations[4]
        quote: "CONSEQUENCE OF P4, and the answer to the part of RQ-FROB-7d8dd4 this experiment owns: the Frobenius-orbit gain in the factor base is EXACTLY n asymptotically and never more. [...] The n-fold factor-base symmetry the research question calls trivial is now measured rather than assumed, and it is confirmed to be the whole of the gain available at this stage."
        why: >-
          "The whole of the gain available at this stage" is false. See
          J3_ii: <pi, -1> gives 2n; the run's own j = 1728 panel curve gives
          4n; a curve over F_2 at (8, 5) gives 3n under pi_2 on the same V.
          "Measured rather than assumed" was measured at 14 toy rows up to
          |F_V| = 4005. At cryptographic n it is derived.
        scoped_replacement: >-
          "For n an odd prime the q-power Frobenius alone has orbit lengths 1
          or n on F_V, so the pi-quotient's gain is the mean orbit size
          g <= n (exactly n only asymptotically); measured exactly on 14
          toy-scale rows; larger symmetry groups (negation, Aut(E) at special
          j, the Frobenius of a smaller field of definition) are not bounded
          by it."
      - id: S4
        record: H-FROB-6774fb
        field: title
        quote: "The Frobenius-orbit factor base is available only on an arithmetic lattice of dimensions, its gain is exactly n and never more, and the two facts together decide it by a single inequality"
        why: >-
          No linear-F_V qualifier on "available only on an arithmetic
          lattice". No pi-alone qualifier on "never more". "Decide it by a
          single inequality" is model-dependent (J3_i). The statement body is
          scoped; the title, which is the sentence most likely to be quoted,
