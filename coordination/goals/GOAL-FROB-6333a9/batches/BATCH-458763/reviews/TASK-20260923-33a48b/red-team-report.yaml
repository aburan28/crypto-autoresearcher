  # ---------------------------------------------------------------------------
  objections:
    # Each objection survives the reviewer's own attack; the counter-argument
    # tried is recorded.
    - id: O-1
      severity: material
      objection: >-
        Clause (iv)'s iff is an artifact of an unstated cost model: the
        pinned dimension, round-up only, a per-relation cost independent of l,
        and n in place of g. It mis-decides (2,7,7..12) literally. It is
        model-dependent at 23 of 64 enumerated cells.
      self_attack: >-
        Counter-argument: the hypothesis defines the comparison at
        l* = ceil(n/m), and GGMP 2020 Remark 2.3 calls n'm ~ n "the natural
        choice". That fails for three reasons. The statement calls l* "the
        unconstrained optimum", which is false in analysis.py's own
        probability model. GGMP Theorem 2.4's own formula takes n = n'm + k
        with k >= 0. And GGMP Remark 3.6 states that the speed-up "between n
        and n^2" depends on the relation/linear-algebra balance.
        The objection survives as a scoping objection, not a mathematical
        error.
    - id: O-2
      severity: material
      objection: >-
        Scope escape in the proposed KN-FIND (S1). "Unavailable at n = 131
        and 163" is contradicted by the run's own target_table (available:
        true), by the corpus (KN-FIND-47da4e), and by PTM-5.
      self_attack: >-
        Counter-argument: "Frobenius-orbit factor base" means the linear one
        in context. That fails because the sentence is meant to be promoted
        on its own. Even in the linear reading "unavailable" is false; what
        holds is "net loss". Survives in full.
    - id: O-3
      severity: material
      objection: >-
        "Never more than n" and "the whole of the gain available at this
        stage" are false beyond pi alone: 2n under <pi, -1>, 4n on the run's
        own j = 1728 panel curve, and k*n for curves over a proper subfield
        of F_q (PTM-7).
      self_attack: >-
        Counter-argument: the baseline already quotients by negation, so
        only the extra factor counts. That removes the 2n example as a gain
        beyond the baseline, but not the j = 1728 factor of 2 or the k*n
        cases. Survives for S3, S4 and S5.
    - id: O-4
      severity: material
      objection: >-
        H-FROB-6774fb's statement quantifies over "E/F_q ordinary". That
        admits curves defined over proper subfields of F_q, on which clause
        (iv)'s "only if" fails, e.g. at (8, 5, 2). The fix is one clause.
      self_attack: >-
        Counter-argument: the intended reading is q = the field of
        definition. The record does not say so, RQ-FROB-7d8dd4 admits prime
        powers q, and the run's panel includes q = 4. No run value is
        affected. Survives as a statement-scope correction.
    - id: O-5
      severity: moderate
      objection: >-
        The code does not enforce the n-odd-prime restriction. The P4 lines
        report prediction_exact true at even and composite n, and the
        target-table closed-form count is wrong at every composite n tested.
        The curve generator's j-dedup makes the twist unreachable, which
        hides the intermediate orbits at composite n.
      self_attack: >-
        Counter-argument: every run cell has n an odd prime, and exactness is
        only reported where it is true of the instance. Correct: no value is
        affected. The objection survives as a guard for any reuse of the
        driver, and as the plan's own failure signature.
    - id: O-6
      severity: moderate
      objection: >-
        strength_basis mislocates the unmeasured part (J3_iv), and "every
        quantity is an exact finite count" over-covers the clause (iv)
        verdicts.
      self_attack: >-
        Counter-argument: evidence strength is capped at strong anyway. The
        cap is justified by the wrong clause, and it is applied to
        model-dependent verdicts, so a later reader will take the P5-style
        robustness to hold at every cell. Survives.
    - id: O-7
      severity: moderate
      objection: >-
        Prior art is not cited. GGMP 2020 (KN-LIT-796, which this reviewer
        read) has the linear classification via X^n - 1 and Schur's lemma
        (section 3.2), the ord-of-2 obstruction for linearised polynomials
        (section 4.1, Lemma 4.1: "we do not have any fine control over the
        size of F when the order of 2 modulo n is large"), the n and n^2
        savings, and non-linear Galois-invariant factor bases (section 4.2).
        EV observations[9] ("INDEPENDENT VINDICATION") and [4] ("now
        measured rather than assumed") read as novelty claims.
      self_attack: >-
        Counter-argument: H adds p | n, exact spectra at 16 degrees, the orbit
        census and the net-win inequality. True, and those additions are
        worth a KN-FIND. But the KN-FIND must cite KN-LIT-796 for the rest.
        Survives.
    - id: O-8
      severity: low
      objection: >-
        GGMP 2020 Lemma 3.3 and Theorem 3.4 give a relation-collection saving
        of n' (the dimension of V), not n, for a SINGLE Frobenius-invariant
        factor base from a Galois-invariant subspace. H's mechanism asserts
        n (the mean orbit size). The records neither cite nor reconcile the
        discrepancy.
      self_attack: >-
        My own reading favours H. In the orbit-reduced system the unknowns
        number |F_V|/g, and conjugate relations are scalar multiples of one
        row, so about |F_V|/g relations suffice. GGMP's section 3.2 intro and
        section 6 also state an n-fold saving, and the tension appears to be
        internal to GGMP. It survives only as "unreconciled with the closest
        published source". RC-5 names the cheapest control.

  required_controls:
    - id: RC-1
      control: >-
        Restate clause (iv) as conditional on numbered cost assumptions HA-HD
        (heuristic_challenges), with n replaced by g(l'). Report each
        enumerated cell's verdict under the pinned model and under the
        rebalanced model, with the cells in
        cells_whose_verdict_depends_on_the_per_decomposition_cost marked.
        Cost: none; this report's COMP-J3-COST already computes it.
    - id: RC-2
      control: >-
        Add to the H-FROB-6774fb statement (by superseding correction) and to
        any KN-FIND: "E not defined over any proper subfield of F_q (automatic
        for q prime); pi is the q-power Frobenius; the bound is on the
        pi-quotient alone".
    - id: RC-3
      control: >-
        For any reuse of the driver, by additive amendment and never by
        editing the frozen code: refuse the P4 lines unless n is an odd prime
        with gcd(q, n) = 1. Take the target-table count from
        lattice.num_stable_subspaces rather than the n-prime closed form.
    - id: RC-4
      control: >-
        Any future curve panel that probes intermediate subfields must select
        curves by F_q-isomorphism class, both twists over F_2, not by j.
    - id: RC-5
      control: >-
        NOT PERFORMED, because it is a new measurement under RA-4. It would
        reconcile the relation-count saving with GGMP Lemma 3.3 / Theorem 3.4
        (n' versus g). Cheapest discriminator: at one toy cell, for example
        (2, 17, m = 2, l = 9), build the orbit-reduced relation matrix and
        record the number of relations needed to reach full rank against
        |F_V|/g.
    - id: RC-6
      control: >-
        NOT PERFORMED (new measurement). This tests whether the
        decomposition-probability model transfers to structured V. Exhaustive
        decomposition-count distribution over targets for a sigma-stable V
        against a random V of equal dimension, at the same toy cell.
        GGMP 2020 Table 2 measured only Groebner time: 2.95 / 3.15 / 3.15 s
        for standard / random / Frobenius-invariant V at (2, 31, m = 3,
        dimension 5). It did not measure success probability.
    - id: RC-7
      control: >-
        Cite KN-LIT-796 (GGMP 2020) as prior art in the KN-FIND. KN-OPEN-095df5
        already records a full read of it.

  counterexample_or_mutation: >-
    The cheapest discriminating counterexample: E: y^2 + xy = x^3 + 1 viewed
    over F_8, n = 5, on the producer's own sigma_8-stable V (21 s in Sage).
    pi_2-orbits of length 15 make clause (iv) a win where it predicts a loss
    (COMP-PTM7).
    The cheapest mutation of the claim: replace n by g(l') in clause (iv).
    That repairs (2, 7, 7..12) at no cost.
    The discriminating model mutation: unpin l*, i.e. let both pipelines
    rebalance. That flips 23 of 64 cells and leaves P5 intact.

  baseline_comparison: >-
    H-FROB-6774fb and EV-FROB-d336b0 explicitly claim nothing against Pollard
    rho or BSGS, and this review compares no pipeline cost with either. The
    matched rho baseline required by RQ-FROB-7d8dd4 constraints uses
    Frobenius AND negation classes (sqrt(2n)); H names sqrt(n) (S11).
    The closest specialised baseline is GGMP 2020 (KN-LIT-796), retrieved and
    read here. It has Frobenius-invariant factor bases with n / n^2 savings,
    a Koblitz symmetry-breaking variant that saves m! in relation collection
    for every Koblitz curve without any invariant subspace (Theorem 3.2), and
    non-linear Galois-invariant factor bases (section 4.2).
    dominated_by check: H's clauses (i)-(ii) for gcd(q, n) = 1 are contained
    in GGMP sections 3.2 and 4.1. H adds p | n, exact spectra, the census and
    the pinned-model inequality. H carries no dominated_by or sota_delta
    field; this review does not supply one on the producer's behalf.

  heuristic_challenges:
    - id: HA
      challenge: >-
        Factor-base size |F_V| ~ q^l classes. GGMP Theorem 2.4 calls this a
        heuristic assumption. H lists no heuristics.
    - id: HB
      challenge: >-
        Decomposition probability P(m, l) ~ q^(ml - n)/m!, with or without
        the 2^m sign factor. It appears only in analysis.py's docstring, yet
        it determines whether ceil(n/m) is optimal, and the loss-cell
        classification depends on the variant (6 cells).
        Random-model transfer: a sigma-stable V is structured (a sum of
        Galois-stable blocks, possibly containing F_q). The cheapest
        experiment that would expose a deviation is RC-6.
    - id: HC
      challenge: >-
        Per-relation cost independent of l. This is implicit in "divides the
        relation count by g" set against "multiplies by q^pen". It is the
        exemplar's per-attempt versus total-expected-cost confusion (item 5):
        the inverse success probability is omitted.
    - id: HD
      challenge: >-
        Pinned dimension, round-up only. It is stated as a fact ("the
        unconstrained optimum", "stability forces"), not as an assumption.
    - id: heuristic_inventory_verdict
      challenge: >-
        heuristic_assumptions `[]` is inaccurate for clause (iv). HA-HD should
        be numbered, with falsification conditions. Clauses (i)-(iii) need
        none.

  cost_model_challenges:
    - The iff decides both stages only when HA-HD hold together. See J3_i for the per-model cell lists.
    - Literal n rather than g mis-decides (2, 7, 7..12). The run's max_m_with_net_win = 6 at (2, 7) contradicts the literal clause.
    - Under decomposition-probability variant A, six loss cells are C-dependent even with per-attempt cost non-decreasing in l, because P rises with l.
    - Rebalancing (M1) changes 23 of 64 verdicts, both loss-to-win and win-to-loss; P5 survives by at least 251 bits.
    - Memory is not disclosed (profile C14). The quotient divides sparse-matrix memory by g, which does not change any verdict.
    - GGMP 2020 Remark 3.6 already states that the net speed-up of a pi-quotient lies between n and n^2 depending on the relation/linear-algebra balance. That is published confirmation that a single inequality cannot decide the trade without a balance assumption.

  reduction_and_scope_challenges:
    - >-
      reduction_chain corollary (n = 131 and the NIST binary degrees, by
      "direct specialisation", asymptotics_preserved: true). Specialisation is
      valid for clauses (i)-(iii) at q = 2 and n prime. For clause (iv) it
      inherits the model dependence. At P5 cells it is robust; at the other
      named degrees it is not. "asymptotics_preserved" is vacuous, since the
      claim is constant_factor.
    - >-
      DEC-20260922-5796b8 summary: "the factor-base half of RQ-FROB-7d8dd4 is
      answered". That over-reaches the question's decision target (a), which
      asks for measured stage-by-stage gains against the null object (S5).
    - >-
      No affected/safe statement is made or scored here (RA-7). The proposed
      wording names (q, n) only.
    - >-
      The KN-FIND scope must not be read as "Frobenius cannot be exploited at
      n = 131". GGMP Theorem 3.2's symmetry-breaking saving of m! needs no
      stable subspace. Non-linear constructions are open questions in the
      corpus (KN-OPEN-095df5), not closed ones.

  proof_architecture_challenges:
    - id: PA-1
      kind: observation-fiber
      challenge: >-
        Hold (q, n) fixed and vary the curve. A generic E/F_8 and an E with
        F_2 coefficients give different net-win verdicts at (8, 5, 2).
        H's observable "(spectrum, mean orbit size) is a function of (q, n)
        alone" therefore fails. The missing separator is "E not defined over
        a proper subfield of F_q".
    - id: PA-2
      kind: quantifier-order
      challenge: >-
        H's quantifier_order is "there EXISTS a faithful sigma-stable V with
        dim V >= ceil(n/m)...". Restricting the witness to
        dim V >= ceil(n/m) excludes lattice points below l*. Under M1 the
        winning witness at (2, 113, 3) is l = 29, below l* = 38.
    - id: PA-3
      kind: boundary-and-strictness
      challenge: >-
        The baseline embedding, "the unconstrained Gaudry/Diem choice
        l* = ceil(n/m)", does not embed the old method at its best. Under
        analysis.py's own P model and H's quadratic linear algebra, the
        baseline optimum is near (n + log_q(m! C))/(m + 1).
    - id: PA-4
      kind: method-ceiling
      challenge: >-
        H's own method_ceiling says "exact structural census ... no statement
        about end-to-end attack cost". Clause (iv)'s "net win iff" exceeds
        that ceiling. The strongest certifiable clause-(iv) statement is
        conditional on HA-HD.
    - id: PA-5
      kind: nearby-object
      challenge: PTM-7 and the j = 1728 panel curve (PTM-6), recorded above.
    - id: PA-6
      kind: compositional-invariant
      challenge: >-
        Delete HC (per-relation cost independent of l): 6 loss cells become
        C-dependent under variant A. Delete HD (pinned dimension): 23 cells
        change verdict. Replace g by n: 6 scanned cells flip. Delete "E not
        over a proper subfield": (8, 5, 2) flips.

  resource_check:
    examined: true
    obstruction: >-
      The measured obstruction: at (2, 131) and (2, 163) no faithful
      sigma-stable subspace has dimension in [2, n - 2]. For n prime this is
      equivalent to Phi_n being irreducible over F_2.
    reading: >-
      The same fact is the hypothesis under which every x outside F_2 has an
      orbit of full length n. That is exactly what makes non-linear orbit
      unions pi-stable at every size. The reading is already taken up by
      KN-FIND-47da4e and KN-OPEN-095df5, and the program's own
      analysis/frobenius-orbit-ecc2k130 Part C builds it. No further theory
      was found that reads the measurement as a resource.
    spawned_ids: []

  literature_checked:
    - source: Galbraith, Granger, Merz, Petit, "On Index Calculus Algorithms for Subfield Curves", IACR ePrint 2020/1315
      provenance: retrieved
      corpus_record: KN-LIT-796
      verified_by: TASK-20260923-33a48b (this reviewer)
      how: >-
        The abstract page was fetched from https://eprint.iacr.org/2020/1315.
        The PDF was fetched from https://eprint.iacr.org/2020/1315.pdf (sha256
        1f15e3da7d4b85c647348e06668cdb4ad60996c8800d320bf02720fa4a182c83,
        20 pages), and text was extracted with pypdf 6.19.0. Sections 1-6 were
        read. The verbatim excerpts relied on are embedded in
        computations.json LIT-GGMP2020.
      relied_on_for: >-
        Remark 2.3; Theorems 2.4 and 2.5 (the cost model with H1, 2^m, k >= 0);
        section 3.2 (the X^n - 1 / Schur classification); Lemma 3.3 and
        Theorem 3.4 (the n' saving); Remark 3.6 (speed-up between n and n^2
        depending on R and L); section 4.1 (Lemma 4.1 and the ord-of-2
        obstruction); section 4.2 (non-linear Galois-invariant sets and their
        conditions); Table 2; and section 6.
    - source: H-FROB-6774fb structural_ingredients[0], Lidl and Niederreiter Theorem 2.35
      provenance: recalled (as H records it); NOT read by this reviewer
      note: >-
        The classification it supports, for gcd(q, n) = 1, is stated in GGMP
        2020 section 3.2, which this reviewer did read. That is a pointer for
        a later provenance upgrade, and no record is changed here.

  narrowest_supported_statement: >-
    Scope: the linear Gaudry/Diem family, n an odd prime, gcd(q, n) = 1, and
    E ordinary and not defined over a proper subfield of F_q.
    Within that scope, the q-power Frobenius quotient on F_V has gain
    g(l') <= n, a constant factor.
    The attainable faithful dimensions form the divisor lattice of T^n - 1.
    Under an explicitly pinned-dimension cost model, with per-relation cost
    independent of dimension, the trade is decided by q^(l'-l*) < g(l').
    At q = 2, n in {131, 163}, m in {2..5}, the quotient on the only faithful
    linear factor base, of dimension n - 1, is a net loss in every cost model
    examined. It is not unavailable.
    The net-win verdicts at the other enumerated cells are
    cost-model-dependent.
