    proposed_scoped_kn_find_wording: >-
      "Within the linear Gaudry/Diem factor-base family F_V = {P in E(F_{q^n})
      : x(P) in V}, V an F_q-subspace of F_{q^n}, the sigma-stable V are
      exactly the ideals of F_q[T]/(T^n - 1). The attainable dim V are
      therefore exactly the subset sums of the degrees of the irreducible
      factors of T^n - 1. (For gcd(q, n) = 1 this classification is in
      Galbraith-Granger-Merz-Petit 2020, KN-LIT-796, sections 3.2 and 4.1;
      RUN-FROB-627924 re-derives it and, per EV-FROB-d336b0 and subject to
      J1/J6, cross-checks it by four methods on 12 lattice cells including
      p | n, 10 of them exhaustively.)
      For n an odd prime with gcd(q, n) = 1 and E/F_q ordinary, the q-power
      Frobenius pi splits F_V into orbits of length 1 or n. So the pi-quotient
      divides the number of factor-base classes by the mean orbit size
      g = q^l/(q^a + (q^l - q^a)/n), with a = dim(V intersect F_q). That is
      at most n: a constant factor, not an exponent change. It bounds the
      pi-quotient alone. Negation, extra automorphisms at special j, and the
      Frobenius of a proper subfield over which E is defined can each give
      larger classes on the same F_V.
      At q = 2 and n in {131, 163} the only faithful sigma-stable subspaces
      have dimension n - 1 and n. For m in {2, 3, 4, 5} the pi-quotient on the
      linear factor base of dimension n - 1 is a net loss against the
      unquotiented pipeline, in every cost model examined in
      REVIEW-FROB-20260923-458763. In the pinned-dimension model the loss is
      at least 56 bits in relation collection and at least 113 bits in linear
      algebra, for any per-decomposition cost non-decreasing in dimension. In
      the rebalanced model it is at least 251 bits, for per-attempt cost from
      1 to 2^40. At the other enumerated (q, n, m) the net-win verdict depends
      on the cost model.
      This finding is not about non-linear pi-stable factor bases: unions of
      Frobenius orbits exist at every size at n = 131 (KN-FIND-47da4e,
      KN-OPEN-095df5). Nor is it about decomposition cost, or about any
      comparison with Pollard rho."
    proposed_wording_note: >-
      The wording uses (q, n) only and names no standard or deployed curve
      (RA-7). Every number in it traces to computations.json COMP-J3-COST,
      COMP-J3-TABLE and COMP-PTM5. If it is adopted, the evidence strength
      behind its clause (iv) sentence is the P5 robustness shown here, not
      the other target-table cells.

