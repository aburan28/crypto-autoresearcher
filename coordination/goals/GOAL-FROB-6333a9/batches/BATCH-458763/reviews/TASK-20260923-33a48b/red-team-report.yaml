      - id: S6
        record: EV-FROB-d336b0
        field: observations[7]
        quote: "Net win available in the panel at n = 113 (m = 2, 4, 5), 127 (all of m = 2..5), 233 (m = 2, 4), 239 (m = 2), 283 (m = 3), 409 (m = 2), 571 (m = 5); never at n = 131 or 163."
        why: >-
          Every "net win" in this list depends on the model. Under M1:
          (2,239,2), (2,283,3), (2,409,2) and (2,571,5) are LOSSES at every C
          tested. (2,113,2), (2,113,5), (2,233,2) and (2,233,4) lose at some
