      - id: S5
        record: DEC-20260922-5796b8
        field: summary
        quote: "The factor-base half of RQ-FROB-7d8dd4 is answered: the Frobenius-orbit gain in a Gaudry/Diem factor base is exactly n and never more, it is available only on the coarse dimension lattice cut by the divisors of T^n - 1, and at the ECC2K-130 and NIST K-163 extension degrees it is a net loss at every m tested."
        why: >-
          "Exactly n and never more" lacks the pi-alone qualifier; see S3.
          "Answered" over-reaches RQ-FROB-7d8dd4's own decision target (a).
          That target asks for "a measured, stage-by-stage Frobenius gain on
