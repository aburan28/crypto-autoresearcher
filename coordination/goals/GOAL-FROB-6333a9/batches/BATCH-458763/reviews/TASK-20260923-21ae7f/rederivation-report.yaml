    controls:
      positive_brute_force: >-
        On 15 small instances of the same shape I enumerated every
        F_q-subspace of F_{q^n} by RREF and tested each one for sigma-stability
        and faithfulness directly. The instances were (q,n) = (2,2) (2,3) (2,4)
        (2,5) (2,6) (2,7) (3,2) (3,3) (3,4) (3,5) (4,2) (4,3) (4,4) (8,2) (8,3).
        Four of them, (2,4) (2,6) (3,3) and (4,2), have gcd(n,p) > 1 and a
        repeated-root x^n - 1. Several, e.g. (3,2) and (4,3), have linear
        factors other than x - 1, which gives faithful dimension 1. The prediction
        was the divisor lattice of x^n - 1, obtained by enumerating every monic
        polynomial and testing divisibility, with no factoring code. It matched
        brute force on all 15 in count, dimension set, faithful dimension set,
        and d_min. Where gcd(n,p) = 1 the factoring code matched as well. The
        subspace totals equal the Gaussian-binomial sums, e.g. 29212 for (2,7).
      negative_identity_operator: >-
        I replaced sigma by the identity on F_2^4, F_3^3 and F_4^2. Brute
        force gives 67, 28 and 7 stable subspaces, while the divisor lattice of
        the minimal polynomial x - 1 gives 2. The prediction fails, as it
        should for a non-cyclic operator, so the brute-force enumerator is not
        trivially agreeing with the prediction.
      null_object_random_matrices: >-
        I tested 16 seeded random invertible matrices over F_2 (n = 4, 5) and
        F_3 (n = 3). All 16 were cyclic, and brute force equalled the divisor
        count of the minimal polynomial for each. I also tested 10
        rejection-sampled non-cyclic, non-scalar matrices over F_2 (n = 4, 5)
        and F_3 (n = 3). Brute force exceeded the divisor count for every one
        (e.g. 27 vs 3, 14 vs 5). The divisor-lattice count is therefore exact
        exactly when the operator is cyclic, which is the property checked on
        each real instance.

