      - {q: 3, n: 41,  count: 64,     dimensions: [0, 1, 8, 9, 16, 17, 24, 25, 32, 33, 40, 41], d_min: 8,
         factor_degrees: '1 + 5x8', ord_n_q: 8, field_model: 'F_3[t]/(t^41 + 2t + 1), F_3 = Z/3Z'}
      - {q: 4, n: 41,  count: 32,     dimensions: [0, 1, 10, 11, 20, 21, 30, 31, 40, 41], d_min: 10,
         factor_degrees: '1 + 4x10', ord_n_q: 10, field_model: 'F_4[t]/(t^41 + t^3 + 1), F_4 = F_2[a]/(a^2 + a + 1)'}
