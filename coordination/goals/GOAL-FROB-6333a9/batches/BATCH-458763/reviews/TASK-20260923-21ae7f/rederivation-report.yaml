  # ---------------------------------------------------------------------------
  Q3:
    curve: 'E: y^2 + x*y = x^3 + 1, a-invariants [1, 0, 0, 0, 1], used in exactly this model over F_{2^n}'
    method: >-
      Method A (primary): for each n I used two field models, the first sparse
      irreducible polynomial found and its reciprocal, each certified by Rabin's
      test. In each model I enumerated every pair (x, y) in F_{2^n}^2 and kept
      those with y^2 + xy = x^3 + 1, using log/antilog tables for the product
      xy. Every point kept was re-verified with direct field multiplication.
      The table multiplication was checked against direct multiplication on
      20000 random pairs, and for n <= 11 a table-free double loop gave the
      same count. I kept the points with Tr(x) = 0, Tr computed as
      sum_{i<n} x^{2^i}. I then applied pi(x,y) = (x^2, y^2), checked that F_V
      maps into itself, and decomposed F_V into pi-cycles explicitly.
      Method B: a per-x count using the substitution y = xz, which gives
      z^2 + z = x + x^{-2}, solvable with 2 roots iff Tr(x + x^{-2}) = 0; x = 0
      gives only (0,1).
      Method C: #E(F_2) = 4 by enumeration, so t = -1 and
      #E(F_{2^n}) = 2^n + 1 - s_n with s_0 = 2, s_1 = -1, s_k = -s_{k-1} - 2 s_{k-2}.
      Method D, a closed form derived here: from Method B,
      |F_V| = 1 + (2^n - 3 + K)/2, where K = sum_{x != 0} (-1)^{Tr(x + 1/x)},
      and #E = 2^n + 1 + K, so K = -s_n. K was also computed directly.
      Every method agrees in both models. For odd prime n, the only pi-fixed
      point in F_V is (0,1), so the orbits are 1 + (|F_V| - 1)/n.
    results:
