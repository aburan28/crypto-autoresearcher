  # ---------------------------------------------------------------------------
  Q1:
    method: >-
      Make F_{q^n} an F_q[x]-module by letting x act as sigma. The
      sigma-stable F_q-subspaces are then exactly its submodules. On every
      instance I checked computationally, in an explicit field model, that
      sigma^n = id on a basis and that a cyclic vector exists (the Krylov
      sequence v, sigma v, ..., sigma^{n-1} v has rank n). The module is
      therefore cyclic with annihilator (x^n - 1), i.e. isomorphic to
      F_q[x]/(x^n - 1). Because F_q[x] is a PID, the submodules of
      F_q[x]/(m) correspond one-to-one to the monic divisors h of m, via
      V_h = ker h(sigma), with dim V_h = deg h. The minimal polynomial of
      sigma on V_h is h, so sigma|V_h = id iff h divides (x - 1), which leaves
      only V_1 = {0} and V_{x-1} = F_q unfaithful. Here gcd(n, q) = 1, so
      x^n - 1 is squarefree, count = 2^r for r distinct irreducible factors,
      the dimensions are the subset sums of the factor degrees, and d_min is
      the least degree of an irreducible factor other than x - 1.
    factorisation_evidence_per_instance:
      - own distinct-degree factorisation plus Cantor-Zassenhaus splitting; the product of the factors is checked to equal x^n - 1 exactly
      - every factor certified irreducible by Rabin's test; factors pairwise distinct; gcd(f, f') = 1
      - own Berlekamp Q-matrix count, n - rank(Q - I), equals the number of factors
      - order formula: number of factors = sum over d | n of phi(d)/ord_d(q), with ord computed by own code and by sympy n_order
      - for q in {2, 3}, sympy factor_list(x^n - 1, modulus=q) returns the identical factor set
      - in the concrete field model, dim ker g(sigma) = deg g for every irreducible factor g, and dim ker (g*(x-1))(sigma) = deg g + 1 for every g other than x - 1, so ker g(sigma) meets the fixed space F_q trivially and sigma is not the identity on it; dim ker(sigma - 1) = 1
    results:
