scaling_protocol:
  schema: crypto.autoresearch.sdeg_scaling_protocol.v1
  task_id: TASK-20260725-641
  goal_id: GOAL-SDEG-001
  batch_id: BATCH-001
  research_question_ids: [RQ-SDEG-001, RQ-ECDLP-001]
  open_problem_refs: [KN-OPEN-002]
  status: review_only_design
  terminal_verdict: PROTOCOL_COMPLETE_REVIEW_REQUIRED
  authorization: >-
    No implementation, solver campaign, relation campaign, Groebner run,
    rho/BSGS control run, or experiment is authorized by this artifact.
    Independent red-team PASS on this package is not auto-execution license:
    a separate Coordinator ledger authorization is required before any
    implementation or measurement task may be admitted. Runs remain
    unauthorized while GOAL-ECDLP-001 activation residuals remain open
    (independent_verifier_artifact_sha256 null; precommit snapshot fields
    unverified) or any precommit activation gate fails.

  inference:
    requested_policy: research-sol-max
    resolved_model_id: cursor-grok-4.5-high-fast
    fallback_used: true
    authorization_ref: AMEND-PATH-001-001
    note: >-
      Preferred research-sol-max unavailable in this harness; authorized
      fallback under AMEND-PATH-001-001. Fallback is infrastructure/policy
      metadata, not mathematical evidence. Equivalence to research-sol-max is
      not claimed.

  # ---------------------------------------------------------------------------
  # Certificate-contract pin (read-only from GOAL-ECDLP-001)
  # ---------------------------------------------------------------------------
  certificate_contract_pin:
    path: >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml
    schema: crypto.autoresearch.rank_failure_conservation_certificate
    version: "1.0.0-review"
    claim_tier_maximum: toy
    ecdlp_alignment:
      toy_validation_protocol_path: >-
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-004/tasks/TASK-20260725-697/toy_validation_protocol.yaml
      toy_validation_decision: DEC-20260725-025
      toy_validation_status: >-
        Protocol design PASS (fixture + sealable empty/pilot schedule pins
        discharged). Activation/executor still deferred: verifier artifact
        hash and precommit snapshot fields remain residuals.
      rule: >-
        This SDEG protocol may not authorize execution. Measurement admission
        requires (i) this protocol's independent review PASS, (ii) separate
        Coordinator ledger authorization, and (iii) GOAL-ECDLP-001 activation
        residuals closed or an explicit Coordinator amendment that names a
        substitute activation gate with equal hardness.
    obligations_inherited:
      - id: OBL-CLAIM-BOUNDARY
        source: certificate_contract.claim_boundary
        requirement: >-
          maximum_tier toy; no attack improvement, ECDLP lower bound,
          crypto-scale conclusion, breakthrough, solution, universal
          impossibility, or fallback-equivalence claim.
      - id: OBL-NO-SCALARIZATION
        source: certificate_contract.resource_vector.no_scalarization
        requirement: >-
          Resource vectors remain multi-coordinate. No cross-unit sum. No
          illicit scalar cost. Comparisons only under predeclared coordinatewise
          dominance with identical counter conventions.
      - id: OBL-FULL-COST-STAGES
        source: certificate_contract.resource_vector.required_stages
        requirement: >-
          Charge setup, relation_collection, linear_algebra, descent, and
          verification as named stages; audit overhead included.
      - id: OBL-DECOMPOSITION-CERTIFICATE
        source: certificate_contract.field_and_row_schema.relation_certificate
        requirement: >-
          Every claimed decomposition R = sum summands carries an independently
          re-verified decomposition certificate (fixture, points, statement
          hash, producer certificate hash) before RELATION_VALID / rank credit.
      - id: OBL-TERMINAL-VOCABULARY
        source: certificate_contract.terminal_vocabulary
        requirement: >-
          Use exhaustive rank-failure-terminal-v1 codes; timeouts/infra/
          implementation failures are costs, not negative mathematical evidence.
      - id: OBL-SCHEDULE-PRECOMMIT
        source: certificate_contract.preexecution_schedule
        requirement: >-
          Finite sealed schedule before activation; schedule/receipt bijection;
          no post-seal attempt append; NOT_ACTIVATED receipts for unactivated
          retries.
      - id: OBL-PLANTED-CONTROLS
        source: certificate_contract.planted_controls
        requirement: >-
          All nine conservation planted controls must be decisive before any
          campaign certificate PASS.
      - id: OBL-PROBABILITY-GATE
        source: certificate_contract.probability_gate
        requirement: >-
          Forbid ceil(r/p_L). Finite tail claims require declared stratified
          fixed-IID assumptions; drop finite-tail claim if IID indefensible.
      - id: OBL-VERIFIER-HASH-ACTIVATION
        source: >-
          GOAL-ECDLP-001 TASK-20260725-697 residual /
          PRECOMMIT_VERIFIER_HASH_MISSING
        requirement: >-
          independent_verifier_artifact_sha256 must be non-null at seal time
          or activation fails closed. This design leaves the hash null —
          activation blocked by construction.
      - id: OBL-ZERO-RANK-COST
        source: certificate_contract.independent_rank_verification.zero_gain_cost_rule
        requirement: >-
          When R_gain=0, resource-per-rank is componentwise undefined/infinity;
          do not fabricate a finite scalar numerator for ICEX.

  # ---------------------------------------------------------------------------
  # Claim boundary
  # ---------------------------------------------------------------------------
  claim_boundary:
    maximum_tier: toy
    field_bit_size_max: 32
    passing_claim: >-
      After authorized sealed campaigns under this protocol and contract
      1.0.0-review, a later independent verifier may conclude only that
      observed Groebner solving-degree proxies and charged multi-coordinate
      C_decomp resource vectors on the named toy prime-field ladder, with
      matched rho/BSGS control vectors and independently verified
      decomposition certificates where claimed, behave as recorded — suitable
      as a scoped ICEX numerator package without asserting asymptotic
      advantage.
    prohibited_claims:
      - asymptotic_advantage_alpha_less_than_1_2
      - crypto_scale_relevance
      - ecdlp_attack_improvement
      - ecdlp_lower_bound
      - breakthrough_or_solution
      - universal_impossibility
      - identification_of_proxy_with_theoretical_d_reg
      - fallback_equivalence_to_research_sol_max
      - complete_accounting_of_uninstrumented_machine_resources
    exclusions:
      - no_live_keys_or_private_targets
      - P1553_R4_out_of_scope
      - timeouts_infra_failures_are_costs_not_negative_math
      - medium_or_crypto_ladder_forbidden_until_separate_tier_gate

  # ---------------------------------------------------------------------------
  # Novelty / mechanism (measurement protocol)
  # ---------------------------------------------------------------------------
  protocol_class: measurement
  novelty_status: adaptation
  novelty_screen:
    corpus_checked:
      - knowledge/open-problems/KN-OPEN-002.md
      - knowledge/techniques/KN-TECH-002.md
      - knowledge/techniques/KN-TECH-004.md
      - knowledge/literature/KN-LIT-005.md
      - knowledge/literature/KN-LIT-010.md
      - knowledge/literature/KN-LIT-029.md
      - ledger/questions/RQ-SDEG-001.yaml
      - ledger/questions/RQ-ECDLP-001.yaml
      - ledger/hypotheses
    classification: >-
      Known Semaev S_3/S_4 + Groebner degree/cost measurement (KN-TECH-002/004,
      KN-LIT-010 methodology) adapted to the Tier-path full-cost certificate
      contract 1.0.0-review and multi-coordinate C_decomp packaging for
      GOAL-ICEX-001. Not claimed as a new mathematical mechanism.
    web_literature_check: not_performed_this_session
    honesty_note: >-
      Current harness (harness/semaev.py) exposes Groebner basis size and
      max total degree as implementation-bound proxies, not theoretical
      degree of regularity. Protocol metrics distinguish proxy vs theoretical
      labels; never equate them without an independent degree-profile instrument.

  # ---------------------------------------------------------------------------
  # Exact claim frozen by this protocol
  # ---------------------------------------------------------------------------
  frozen_claim:
    statement: >-
      On the sealed toy prime-field ladder below, for decomposition lengths
      m in {2,3} corresponding to Semaev systems S_3 and S_4, the charged
      multi-coordinate decomposition cost vector C_decomp(p,m) and the
      named solving-degree proxy profile are measurable under contract
      1.0.0-review conservation gates with matched Pollard-rho and BSGS
      control campaigns — without scalarizing costs or claiming alpha < 1/2.
    discriminates:
      - id: H-DEGREE-GROWS
        meaning: >-
          Observed solving-degree proxies (gb_max_total_degree and, when
          instrumented, d_ff_proxy / attained_d_solve) increase with field
          bit size and/or m under fixed solver/order conventions.
      - id: H-DEGREE-STABLE
        meaning: >-
          Proxies remain flat across the toy ladder within declared noise
          budgets — still a scoped toy observation, not crypto-scale evidence.
      - id: H-COST-DOMINATED-BY-LA
        meaning: >-
          Coordinatewise, linear_algebra stage dominates relation_collection
          and setup on the charged vector for the tested cells.
      - id: H-COST-DOMINATED-ELSEWHERE
        meaning: >-
          Another named stage dominates; C_decomp packaging must retain that
          stage for ICEX honesty.
    falsification_of_protocol_honesty:
      - illicit_scalarization_of_resource_vector
      - missing_matched_rho_or_bsgs_control_campaign
      - claimed_RELATION_VALID_without_independent_decomposition_certificate
      - treating_TIMEOUT_or_INFRASTRUCTURE_FAILURE_as_negative_math_evidence
      - asserting_medium_or_crypto_tier_from_toy_ladder
      - equating_gb_max_total_degree_with_theoretical_d_reg_without_instrument

  # ---------------------------------------------------------------------------
  # Public fixture ladder (design pins; concrete bytes sealed later)
  # ---------------------------------------------------------------------------
  fixture_ladder:
    status: design_pin_not_executable
    model: short_weierstrass
    field_kind: prime_field
    curve_family: generic_ordinary
    encoding: uncompressed_sec1_xy_hex_width_by_field
    bit_sizes_toy_ordered: [8, 10, 12, 16, 20, 24]
    hard_cap_bits: 32
    cells:
      - cell_id: CELL-SDEG-TOY-008-M2
        field_bits: 8
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(16, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-008-M3
        field_bits: 8
        summation_polynomial: S_4
        decomposition_length_m: 3
        factor_base_size_rule: "min(12, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-010-M2
        field_bits: 10
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(24, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-010-M3
        field_bits: 10
        summation_polynomial: S_4
        decomposition_length_m: 3
        factor_base_size_rule: "min(16, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-012-M2
        field_bits: 12
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(32, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-012-M3
        field_bits: 12
        summation_polynomial: S_4
        decomposition_length_m: 3
        factor_base_size_rule: "min(20, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-016-M2
        field_bits: 16
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(48, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-016-M3
        field_bits: 16
        summation_polynomial: S_4
        decomposition_length_m: 3
        factor_base_size_rule: "min(24, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-020-M2
        field_bits: 20
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(64, floor(p/4))"
      - cell_id: CELL-SDEG-TOY-024-M2
        field_bits: 24
        summation_polynomial: S_3
        decomposition_length_m: 2
        factor_base_size_rule: "min(80, floor(p/4))"
    fixture_materialization_rule: >-
      Before any executable campaign, Coordinator must freeze one public
      fixture JSON per cell (or a shared ladder document with per-cell
      bindings) containing curve_or_group_parameters, subgroup_order,
      factor_base_points, encodings, and fixture_sha256 under RFC 8785 JCS
      digest rules from contract 1.0.0-review. This BATCH-001 design does not
      materialize fixture bytes and does not seal schedules.
    ecdlp_reference_fixture_for_schema_alignment:
      fixture_id: FIXTURE-ECDLP-TOY-RANKFAIL-001
      fixture_sha256: 4c82f5e43efce185a2ecbf2cbcc24b6da7a1bddadd1176007427be350494c4a8
      use: >-
        Schema/encoding alignment reference only (p=19 toy conservation
        fixture from GOAL-ECDLP-001 BATCH-004). Not a substitute for the
        SDEG ladder fixtures above.

  # ---------------------------------------------------------------------------
  # Frozen metrics
  # ---------------------------------------------------------------------------
  metrics:
    solving_degree_profile:
      - metric_id: gb_basis_size
        type: integer
        direction_of_interest: higher_or_different_across_ladder
        definition: >-
          Number of polynomials in the reduced Groebner basis under frozen
          monomial order grevlex and frozen variable order.
        label: implementation_bound_proxy
      - metric_id: gb_max_total_degree
        type: integer
        direction_of_interest: higher_or_different_across_ladder
        definition: >-
          Maximum total degree among basis elements after reduction.
        label: implementation_bound_proxy_not_theoretical_d_reg
      - metric_id: d_ff_proxy
        type: integer_or_null
        direction_of_interest: higher_or_different_across_ladder
        definition: >-
          First degree at which a non-trivial degree fall is observed by the
          degree-profile instrument, if present; null if instrument absent.
        label: heuristic_proxy_kn_open_002
        null_policy: >-
          Missing instrument yields null; do not impute from gb_max_total_degree.
      - metric_id: attained_d_solve
        type: integer_or_null
        direction_of_interest: higher_or_different_across_ladder
        definition: >-
          Highest degree at which the solver performed non-trivial reduction
          work, if the instrument exposes it; null otherwise.
        label: instrument_dependent
      - metric_id: is_trivial_ideal
        type: boolean
        definition: "Basis equals [1] under the frozen solver (no decomposition in V)."
      - metric_id: decomposition_found
        type: boolean
        definition: >-
          True only when an independent decomposition certificate verifies.
    charged_cost_vector:
      schema: rank-failure-resource-v1
      symbol: C_decomp
      arguments: [p, m]
      no_scalarization: true
      definition: >-
        Campaign-aggregated resource_vector for a sealed Semaev decomposition
        measurement campaign on fixture cell (p,m), including all required
        stages and verification overhead. This is the lawful ICEX numerator
        package coordinate vector — not a single scalar.
      additive_coordinates:
        - cpu_time_ns
        - group_operations_by_declared_type
        - io_read_bytes
        - io_write_bytes
        - communication_sent_bytes
        - communication_received_bytes
      nonadditive_coordinates:
        - campaign_elapsed_wall_ns
        - active_wall_union_ns
        - peak_memory_bytes_by_domain
        - campaign_peak_observed_bytes
        - retained_unique_bytes
      stage_attribution_required:
        - setup
        - relation_collection
        - linear_algebra
        - descent
        - verification
      derived_reporting_allowed_without_scalarization:
        - per_stage_cpu_time_ns
        - per_stage_group_operations_by_declared_type
        - R_gain
        - resource_per_rank_coordinatewise_or_undefined
      forbidden_derived:
        - single_scalar_C_decomp
        - wall_plus_cpu_sum
        - ops_weighted_by_undeclared_constants_as_proof
    matched_baseline_vectors:
      vectors:
        - metric_id: C_rho
          definition: >-
            Same resource schema on a matched Pollard-rho discrete-log control
            campaign for the same fixture subgroup parameters and seed family.
        - metric_id: C_bsgs
          definition: >-
            Same resource schema on a matched BSGS discrete-log control campaign
            for the same fixture subgroup parameters and seed family.
      comparison_rule: >-
        Coordinatewise dominance only under identical counter conventions and
        coverage. Campaigns otherwise incomparable. No alpha<1/2 claim from
        toy ratios.

  group_operation_type_vocabulary:
    resource_schema: rank-failure-resource-v1
    frozen_types:
      - add
      - dbl
      - mixed_add
      - scalar_mul_fixed_window
      - endomorphism_apply
      - equality_test
      - encode_decode
      - polynomial_mul_mod_p
      - polynomial_reduce_mod_p
      - groebner_spoly_step
    note: >-
      Extends ECDLP conservation vocabulary with named polynomial/Groebner
      counters for honest LA-stage charging. Must be embedded in any later
      sealed schedule resource_schema before activation.

  # ---------------------------------------------------------------------------
  # Seeds, budgets, stopping rules
  # ---------------------------------------------------------------------------
  seeds:
    scheme: seed_256_hex
    rule: >-
      Exactly 64 lowercase hex characters per attempt, unique within a sealed
      schedule, echoed on every receipt (contract identity_rules).
    replications_per_cell_minimum: 3
    master_seed_derivation: >-
      Future sealed schedules derive attempt seeds as
      SHA-256("sdeg-scale-v1" || cell_id || replica_index_u32be ||
      campaign_id) truncated/encoded to 64 hex chars — listed exhaustively
      before seal; no adaptive reseeding after seal.

  budgets:
    per_attempt_defaults:
      wall_clock_seconds: 120
      memory_gb: 4
      maximum_groebner_degree_cap: 32
      maximum_cpu_time_ns: "120000000000"
    per_campaign_defaults:
      wall_clock_seconds: 1800
      memory_gb: 8
      maximum_attempts: 64
    control_campaigns:
      rho_wall_clock_seconds: 600
      bsgs_wall_clock_seconds: 600
      note: >-
        Control budgets are matched in accounting conventions, not necessarily
        equal wall caps; unequal caps must be declared in the sealed schedule
        and never hidden by scalarization.
    exhaustion_mapping:
      wall_cap: TIMEOUT_CENSORED
      memory_or_degree_cap: RESOURCE_EXHAUSTION
      coordinator_cancel: BUDGET_CANCELLATION
      env_fail: INFRASTRUCTURE_FAILURE
      impl_fail: IMPLEMENTATION_FAILURE

  stopping_rules:
    - id: STOP-LADDER-COMPLETE
      condition: >-
        All sealed cells have terminal receipts for every schedule attempt
        (including NOT_ACTIVATED) and conservation gates evaluated.
    - id: STOP-HARD-CAP
      condition: field_bits would exceed 32
      action: do_not_admit_cell
    - id: STOP-ACTIVATION-BLOCKED
      condition: >-
        independent_verifier_artifact_sha256 is null OR precommit
        verified_before_execution is false
      action: fail_closed_no_activation
    - id: STOP-CONSERVATION-FAIL
      condition: any mandatory planted control or bijection/rank/resource gate fails
      action: >-
        invalidate campaign certificate; preserve receipts; do not treat as
        mathematical negative evidence against Semaev mechanisms
    - id: STOP-NO-SCALAR-RESCUE
      condition: temptation to publish a single-number C_decomp or alpha
      action: reject_publication_path
    - id: STOP-PROXY-MISLABEL
      condition: report labels gb_max_total_degree as theoretical d_reg
      action: mark_invalid_interpretation

  # ---------------------------------------------------------------------------
  # Controls
  # ---------------------------------------------------------------------------
  controls:
    conservation_planted:
      source: certificate_contract.planted_controls
      required:
        - id: CTRL-OMISSION
          expected: BIJECTION_MISSING_RECEIPT
        - id: CTRL-DUPLICATE-ID
          expected: BIJECTION_DUPLICATE_ID
        - id: CTRL-RETRY-CYCLE
          expected: SCHEDULE_RETRY_CYCLE
        - id: CTRL-FIELD-SCHEMA
          expected: FIELD_OR_SCHEMA_MISMATCH
        - id: CTRL-SHARED-DOUBLE
          expected: SHARED_WORK_DOUBLE_COUNT
        - id: CTRL-SHARED-OMITTED
          expected: SHARED_WORK_UNOWNED
        - id: CTRL-CERTIFICATE-ROW
          expected: CERTIFICATE_ROW_MISMATCH_AND_ZERO_RANK
        - id: CTRL-WRONG-FIELD
          expected: INDEPENDENT_RANK_MISMATCH
        - id: CTRL-CLEAN
          expected: PASS_ONLY_IF_ALL_CONSERVATION_GATES_PASS
    measurement_and_baseline:
      - id: CTRL-PLANTED-DECOMPOSITION
        purpose: positive_control
        design: >-
          Plant a target known to equal a sum of factor-base points; require
          decomposition_found true and independent certificate PASS within
          budget on at least one sealed positive-control attempt per cell
          family (S_3 and S_4).
        fail_effect: IMPLEMENTATION_FAILURE_or_invalid_measurement
      - id: CTRL-NEGATIVE-RANDOM-TARGET
        purpose: negative_control
        design: >-
          Uniform random target outside the planted orbit window; must not
          emit RELATION_VALID without a true certificate. Absence of
          decomposition within budget is NO_RELATION_WITHIN_BUDGET, not
          evidence against the mechanism.
      - id: CTRL-MATCHED-RHO
        purpose: baseline_fairness
        design: >-
          Sealed Pollard-rho control campaign on the same public fixture
          subgroup, same resource schema/vocabulary, certificates for any
          claimed discrete log (kind: discrete_log).
      - id: CTRL-MATCHED-BSGS
        purpose: baseline_fairness
        design: >-
          Sealed BSGS control campaign matched as above.
      - id: CTRL-ORDER-AND-FIELD
        purpose: schema_integrity
        design: >-
          Verifier checks modulus primality method, ell = subgroup order,
          ell*P = O for all named points; FIELD_MISMATCH otherwise.
      - id: CTRL-MONOMIAL-ORDER-PIN
        purpose: confounder_control
        design: >-
          Freeze grevlex and variable order in the sealed schedule; a mutated
          order requires a new schedule seal and is not comparable under the
          same cell_id.

  confounders:
    - sympy_buchberger_not_optimized_F4
    - factor_base_sampling_seed_dependence
    - monomial_order_and_variable_order
    - planted_vs_random_target_mix_without_stratum_labels
    - wall_clock_noise_vs_exact_group_op_counters
    - shared_work_double_counting
    - treating_censored_timeouts_as_solves_or_as_refutations

  # ---------------------------------------------------------------------------
  # Schedule / seal obligations (not materialized in this batch)
  # ---------------------------------------------------------------------------
  schedule_obligations:
    mode: future_executable_requires_seal
    seal_before_activation: true
    required_root_fields:
      - contract_schema
      - contract_version
      - campaign_id
      - public_fixture
      - field
      - column_schema
      - canonical_row_format
      - terminal_vocabulary
      - resource_schema
      - probability_plan
      - attempts
      - initial_matrix
      - precommit
    precommit_fields_currently_null_by_design:
      - coordinator_snapshot_receipt_path
      - snapshot_commit_sha
      - snapshot_parent_sha
      - independent_verifier_artifact_sha256
    activation_blocked_until:
      - PRECOMMIT_VERIFIER_HASH_MISSING
      - PRECOMMIT_SNAPSHOT_UNVERIFIED
      - PRECOMMIT_SCHEDULE_UNSEALED
      - SDEG_PROTOCOL_REVIEW_NOT_PASSED
      - SEPARATE_COORDINATOR_LEDGER_AUTHORIZATION_MISSING
      - ECDLP_ACTIVATION_RESIDUALS_OPEN
    empty_or_pilot_note: >-
      Unlike GOAL-ECDLP-001 BATCH-004, this task does not freeze a sealable
      empty/pilot schedule JSON. Scaling measurement schedules are deferred to
      a post-PASS executor batch. Non-authorization is present-tense and
      hard-gated.

  independent_verifier:
    artifact_sha256: null
    obligation: >-
      Pin concrete independent_verifier_artifact_sha256 before any executable
      SDEG campaign. Decomposition and discrete-log certificates must carry
      independent_verifier_id/version/artifact_sha256.
    activation_gate: PRECOMMIT_VERIFIER_HASH_MISSING

  terminal_vocabulary: rank-failure-terminal-v1
  probability_gate:
    forbid: ceil(r/p_L)
    require_when_finite_tail_claimed: binomial_or_negative_binomial_tail_at_declared_alpha
    default_for_degree_ladder: >-
      Degree/cost ladder campaigns may set finite_tail_gate_active false when
      no rank-yield completion claim is made; C_decomp still requires full
      resource conservation.

  # ---------------------------------------------------------------------------
  # C_decomp packaging for GOAL-ICEX-001 (numerator honesty)
  # ---------------------------------------------------------------------------
  c_decomp_numerator_package:
    status: specification_only
    consumer_goal: GOAL-ICEX-001
    required_contents_after_future_measurement:
      - per_cell_C_decomp_resource_vector
      - per_cell_solving_degree_profile
      - matched_C_rho_and_C_bsgs_vectors
      - certificate_and_conservation_manifests
      - claim_boundary_echo_toy
      - R_gain_and_undefined_per_rank_flags
    forbidden_in_package:
      - scalarized_single_cost
      - undeclared_alpha_less_than_half
      - crypto_extrapolation

  # ---------------------------------------------------------------------------
  # Post-PASS executor gate (exact; for red-team survival)
  # ---------------------------------------------------------------------------
  post_pass_executor_gate:
    after_protocol_review_pass_allows: schedule_later_executor_task_only
    does_not_allow:
      - immediate_execution
      - hypothesis_status_change
      - ICEX_admission
      - medium_tier_upgrade
    executor_admission_requires_all_of:
      - independent_red_team_PASS_on_this_snapshot
      - coordinator_ledger_authorization_decision_id
      - concrete_public_fixtures_hash_bound_per_cell
      - sealed_schedules_with_embedded_group_op_and_poly_vocabulary
