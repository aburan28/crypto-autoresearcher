    protocol_design_note.md with digests matching the archive receipt. Full-cost
    no_scalarization, five required stages, nine planted controls, decomposition
    certificate obligations, toy ≤32-bit boundary, proxy≠d_reg labeling, matched
    rho/BSGS vectors, and multi-gate present-tense non-authorization survive
