  blocking_findings:
  - id: F-1
    severity: blocking (procedural; resolved by an additive Coordinator ruling)
    what: >-
      C-4 freezes B1 as a subresultant PRS "with fraction-free (Bareiss/Collins) steps". polyfp.prem
      computes the pseudo-remainder in field form: one charged inversion of lc(b), a charged
      reduction and one scaling. This is producer deviation D-1. The PRS polynomials are identical
      over F_p, but charged W is not. The first step reduces F_T (degree |T|, e.g. 1024 at L = 32) by
      b (degree 8), costing about 9|T| here versus about |T|^2/2 for literal pseudo-division. A1's
      own wording ("structured Gaussian elimination on the Sylvester matrix ... Bareiss/Collins")
      admits a third, costlier reading. The per-triple cost exponent in |T| differs across readings,
      so the reported beta_work(B1) value depends on the choice.
    why_blocking: >-
      AMD-20260928-7ce387 rules only OQ-1..OQ-16. D-1 was disclosed but not ruled, and the frozen
      text says fraction-free. Changing the charged algorithm of a frozen backend requires an
      additive pre-data amendment.
    evidence: polyfp.py:81-92, polyfp.py:120; implementation_report.yaml deviations D-1; AMD-20260926-3479cf C-4 B1_subresultant_prs_A1; AMD-20260928-7ce387 rulings list.
    remedy: >-
      A Coordinator ruling in an additive amendment. The field-form route looks like the right
      choice: over F_p it is the cheapest correct realization, so it cannot inflate cost toward
      outcome B, and any outcome A it produced would be achievable. Alternatively require literal
      Collins, which means a code change and re-audit of checks 4, 5 and 10.
  - id: F-2
    severity: blocking (procedural; resolved by an additive Coordinator ruling)
    what: >-
      OQ-17 defines where a member's decision cost stops: at the END of the first hit triple, with
      the amortized share added. OQ-18 asks whether the 0.02 flat criterion also applies to
      W_triple. Both are unruled (implementation_report blocking_for_scientific_run lists them).
      OQ-17 fixes the primary W of every member query. OQ-18 can change an outcome-A verdict.
    evidence: implementation_report.yaml open_questions_v3 OQ-17/OQ-18; cellrun.py:107-112; analysis.py:199-208, 228-236.
    remedy: >-
      Rule both pre-data. The implemented literal readings look sound: end-of-triple stopping,
      share added, flatness on total W only. OQ-19 (copy-back mechanism) is operational and not
      blocking.

  non_blocking_findings:
  - id: N-1
    what: >-
      driver.check_decision accepts ANY ledger decision whose text mentions EXP-SDEG-85eefd. Verified:
      DEC-20260928-6b03c5 (the v3 amendment approval, "Execution stays NOT admitted") and
      DEC-20260926-7f2cad (v2 approval) both return True. The admission-decision gate therefore does
      not distinguish admission from approval.
    remedy: Require an explicit admission field (e.g. execution_admission.currently_admitted true, naming EXP-SDEG-85eefd and snapshot 5254ab7e54).
  - id: N-2
    what: >-
      Linux C-9 fails open. If /sys/fs/cgroup/cpu.max is unreadable, the load limit becomes
      os.cpu_count(), which is 112 on the pod host, instead of v3's 23. Observation, not an
      implementation defect: /proc/loadavg inside a container usually reports host-wide load, so
      the frozen threshold may refuse spuriously.
    remedy: Fail closed (refuse) or hard-floor the limit at 23 when cpu.max is absent.
  - id: N-3
    what: The frozen bootstrap label is evaluated by unit tests on synthetic data (see check 7). It is data-independent and leaks nothing.
    remedy: Parameterize the label namespace in tests; correct the report wording.
  - id: N-4
    what: >-
      Part manifests do not carry reasoning_effort, fallback_used or degraded_requirements (AGENTS.md
      artifact policy). The resolved model is read from AUTORESEARCH_MODEL_ID, which may be unset.
      On the pod there is no git checkout, so git commit is null. This is mitigated by --source-commit
      plus per-file implementation sha256, and merge checks cross-host identity.
    remedy: Add the three inference fields; require --source-commit on hosts without a checkout.
  - id: N-5
    what: A B0/B1 hit-triple-set mismatch is not a stop, although primary W depends on the first hit triple (check 11).
    remedy: Treat hit_triple_sets_equal == false as a procedure defect.
  - id: N-6
    what: >-
      Minor uncharged arithmetic: small-constant scalings in point doubling; per-fixture reduction of
      S5's 131,005 Z[a,b] terms mod p (constant in L, about 1% of B1 W at L=8, amortized). Omitting a
      constant term biases the B1 slope slightly upward, not toward outcome A.
    remedy: Disclose in the run record, or charge the per-fixture reduction to the table cost.
  - id: N-7
    what: Per-cell peak_rss_bytes can be inherited from an earlier task in a reused worker process.
    remedy: ProcessPoolExecutor(max_tasks_per_child=1), or record the per-task RSS delta.
  - id: N-8
    what: Docstrings cite tests/test_fparith.py and tests/test_poly.py, which do not exist (the tests live in tests/test_arith.py).
    remedy: Cosmetic.
  - id: N-9
    what: Operational. The Mac C-9 precondition is currently unmet (repo volume 18.7 GiB free < 20 GiB), so the Sage part is not admissible at audit time.
    remedy: Recheck at claim time.

