rederivation_report:
  task_id: TASK-20260929-0bcd38
  role: blind re-deriver (joint J3 of review_plan_RUN-SDEG-3de103.yaml)
  experiment_id: EXP-SDEG-85eefd
  protocol_version: 4 (specification.yaml + AMD-20260926-3479cf + AMD-20260928-7ce387 + AMD-20260928-d3ed9e)
  quantity: >-
    W_query(B1) for each of the 384 L=8 queries: charged F_p operation count of
    the A1 per-triple field-form subresultant (Euclidean) PRS of (F_T, b)
    with early abort at the first verified hit, including the S5
    specialization that forms b(u) (v3 OQ-1).
  recorded_at: '2026-09-29'
  committed: false

  inference:
    runtime: Cursor (validator custom subagent)
    requested_policy: review-adversarial
    resolved_model_id: inherited from parent session (not exposed to this agent)
    reasoning_effort: xhigh requested; unverifiable on this runtime
    fallback_used: true
    fallback_reason: >-
      The Cursor runtime runs the subagent on the inherited session model. It
      cannot confirm that the review-adversarial policy was served at xhigh.
    degraded_requirements: [reasoning_effort xhigh unverifiable, model not probe-verified]

  artifacts:
    code:
      - path: derive_semaev.sage.py
        sha256: ff912da9415c81f9104c08fdf3960955d5958458a38de97f8a032267dec3e354
        role: >-
          Uncharged symbolic derivation of S4 = Res_z(S3(x1,x2,z), S3(x3,x4,z))
          and S5 = Res_y(S3(x1,x2,y), S4(x3,x4,x5,y)) over GF(p) for each L=8
          curve. Dumps dense coefficient arrays to scratch.
      - path: meter.py
        sha256: d1977c76fc6fcd0a28ebfdcd5863e1a14e0f1bdc5b13e11eeb2a593e050d0570
        role: >-
          Instrumented meter (plain Python/NumPy, no Sage), plus the
          identity checks, the per-triple point-arithmetic truth, the
          exhaustive 5-multiset oracle and witness verification.
    results:
      path: rederivation_results.json
      sha256: 27e2da2c5fdfb3121ecd442a4e63909457c2186e5ad46549bae0cf559d95c1fc
      rows: 384
    scratch_not_retained_in_task_dir:
      note: >-
        Deterministic Sage outputs, regenerable with the command below. They
        are kept in TMPDIR scratch rather than the task directory because of
