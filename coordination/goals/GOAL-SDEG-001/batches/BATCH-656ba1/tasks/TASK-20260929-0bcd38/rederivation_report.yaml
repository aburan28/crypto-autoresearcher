    - >-
      Non-member W on |V|=8 decks with |T|=64 is nearly constant (about
      210.85k-210.98k): 52,488 fixed + 78,624 specialization + about 79.8k PRS,
      which is about 665 per triple, about 10.4*|T|, consistent with the "about
      9|T|" of v4 D-1 plus the inversion and tail-division overhead.
    - >-
      Member W is dominated by the fixed term. The median member W_triple
      (10k-20k on |V|=8, |T|=64) reflects how early the first hit comes in
      lexicographic order, so the member medians depend on the enumeration
      order, not only on the algebra.
    - >-
      gcd degree at the first hit is 1 on 152 member queries and 2-4 on 61.
      The degree drop deg b < 8 occurred on 982 triples in the S5 path, always
      matching a genuine 3-term decomposition.
    - >-
      These are L=8 only. No slope is computed or implied here.

