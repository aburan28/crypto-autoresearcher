      semaev_L8_s1.json: 51fc0521f9ae4741b930e9fe4f4457ee466ae57010dca12a3121ca061a16ae38
      semaev_L8_s2.json: 58f8afabaff39a1830682044004d9648f1e22cb2674afdc6e82d48dabd90a2fe
      semaev_L8_s3.json: 883e8cd88d70e933b196a30f6c3bc42806f89faf8b41d6a970b7d1f06a3b0d59
    commands: |
      export TMPDIR=/Volumes/SSD990/.tmp-agent; mkdir -p $TMPDIR/s5
      T=coordination/goals/GOAL-SDEG-001/batches/BATCH-656ba1/tasks/TASK-20260929-0bcd38
      sage -python $T/derive_semaev.sage.py experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json $TMPDIR/s5
      python3 $T/meter.py experiments/EXP-SDEG-85eefd/amendments/ic_leads_fixtures_v2.json $T/inputs_L8_targets.json $TMPDIR/s5 $T/rederivation_results.json
    environment: macOS (darwin 25.6.0), Python 3.12.8, NumPy 2.4.4; Sage (python 3.14.3 build) for derivation only
    input_hashes:
      ic_leads_fixtures_v2.json: 543f49ca5304f4e61085305ca2ea01ccc0085298db26368d7362f96b1b6a5a45  # equals AMD-20260926-3479cf values_sha256
      inputs_L8_targets.json: 15217601f8c641de855108932207fabc6ef2f5cbbe9327f259e4a54703384559

  method:
    semaev: >-
      Derived S4 and S5 from the S3 formula in AMD-20260926-3479cf C-3 by
      iterated resultants over GF(p) with each curve's (a, b). For every L=8
      curve S5 has degree 8 in each variable, total degree 32, and 54,777 of
      the 9^5 = 59,049 possible monomials. S4 has 439 monomials. Point-arithmetic identity
      checks (1000 draws per curve, deterministic seed label): S5 vanishes on
      all effective relation 5-tuples (1000/1000, 999/999, 999/999; one draw on
      seeds 2 and 3 was skipped as degenerate), S4 vanishes on all relation
      4-tuples, S5 is nonzero on 1000/998/998 random 5-tuples (two random zeros
      at rate about 8/p are expected), and S5 is invariant under random
      permutations on every effective draw.
    forward_table: >-
      T = {x(Pa + Pb), x(Pa - Pb) : a <= b in V} as a set, with P the lift of
      each x in V. The point at infinity (Pa - Pa) is carried as an explicit
      element (v3 OQ-6). F_T = prod over finite T of (u - v), which is monic
      and squarefree with degree |T_finite|: 64 on interval_x/random_x, 16 on
      progression and on |V|=4 subgroup_x, 4 on |V|=2 subgroup_x.
    backward_polynomial: >-
      b(u) = S5(u, x_i, x_j, x_k, x(R)), obtained by Horner specialization of
      the dense S5 array: first x(R) (per query), then x_i, x_j and x_k in the
      nested lexicographic loop, leaving 9 coefficients in u.
    triple_enumeration: >-
      Multiset triples i <= j <= k over ascending V (repetition allowed, C-3),
      in lexicographic order: C(|V|+2, 3) = 120 for |V|=8, 20 for |V|=4 and 4
      for |V|=2.
    prs: >-
      Field-form Euclidean remainder sequence r0 = F_T, r1 = b (v4 D-1). Each
      division inverts lc(divisor) once. Stop at the first zero remainder,
      where the gcd is the previous term and a hit needs deg >= 1, or at a
      nonzero constant remainder (coprime). No composed resultant is formed.
    decision: >-
      A triple hits iff deg gcd(F_T, b) >= 1, or deg b < 8 (the
      infinity element of T: the u^8 coefficient vanishes exactly when R is a
      3-term sum over the triple), or b is identically 0 (never observed). The
      witness is verified uncharged by an explicit signed 5-term
      decomposition found by point arithmetic. The query stops at the first
      verified hit (v3 OQ-4, v4 OQ-17). Non-members pay full enumeration.
    cross_checks:
      oracle: >-
        An independent exhaustive enumeration of 5-multisets of signed
        factor-base points (C(2|V|+4, 5) sums) agrees with the B1 decision on
        384/384 queries, including the 5 R = O queries.
      per_triple: >-
        For every query and every triple, the set of B1-hitting triples
        equals the set of point-arithmetic-hitting triples.
      witnesses: every B1 hit had a verified witness.
      planted_vs_member: all 192 planted targets are members; 21 of the 192 random targets are members.

  conventions:
    unit_weights: >-
      One unit per F_p multiplication (squarings and multiplications by
      constants included). An inversion costs 1 plus its counted
      extended-gcd division steps (C-4). Additions are not charged. B1
      does no hash probes. Witness verification is not charged (v3 ruling).
    chosen_primary:
      W_fixed_xR: >-
        Dense Horner specialization of S5 at x(R): 9^4 fibers x 8 mults =
        52,488 per query, whatever the value of x(R). This reading was
        chosen to match the per-query fixed term that v3 OQ-1 states (about
        52,488), so agreement on W_fixed is NOT independent evidence.
      per_triple_specialization: >-
        Dense Horner with nested-loop reuse in lexicographic order: 9^3*8 =
        5,832 when i changes, 9^2*8 = 648 when (i,j) changes, and 9*8 = 72 per
        triple. For a full |V|=8 enumeration that is 8*5832 + 36*648 + 120*72 =
        78,624. Under early abort only the loop levels actually entered are
        charged.
      prs_division: >-
        For dividend degree n and divisor degree d: one inversion, then
        (n-d+1)*(1+d) mults (1 for the quotient coefficient and d for the
        update; the cancelled leading term is not computed). This is charged
        whether or not the quotient coefficient is zero.
      W_query: W_fixed_xR + per-triple specialization + PRS charges, up to and including the first verified hitting triple.
      W_triple: W_query - W_fixed_xR (v3 OQ-1).
      table: >-
        Construction of T and F_T is NOT included in primary W_query. It is
        reported per cell as W_table_unamortized (lifts at 3 mults + 2*bitlen((p-1)/2)
        for the square root; each pair 1 inversion + 4 mults; 1 probe per
        candidate; product expansion of F_T), and per query as
        plus_amortized_table = W_query + W_table/32 (per-deck amortization).
      R_equals_O: >-
        Five planted progression queries have R = O (s2: planted-02, 03, 11;
        s3: planted-09, 14). b(u) = S5(..., x(R)) is undefined for them, so
        primary W_query, W_fixed_xR and W_triple are null and those rows are
        excluded from the medians. They are members by the oracle.
        Alternative (W_query_R_infinity_S4_alternative): backward polynomial
        S4(u, x_i, x_j, x_k) of degree 4, no fixed term, dense Horner at degree
        4. Each hits at the first triple, with W = 726 (s2) and 735 (s3).
    ambiguities_and_alternatives:
      - item: specialization reuse across triples
        reading_chosen: nested-loop reuse (dense)
        alternative: >-
          Naive re-specialization per triple, 9^3*8 + 9^2*8 + 9*8 = 6,552 per
          triple (spec_naive_per_triple). This increases non-member W on
          |V|=8 from about 210.9k to about 918.5k and makes specialization,
          not the PRS, the dominant per-triple cost (6,552 against about 665).
        consequence: >-
          This is the reading most likely to cause a disagreement with the
          producer. Under reuse, per-triple work is dominated by the PRS at
          about 10.4*|T|. Under naive re-specialization it is dominated by a
          |T|-independent constant.
      - item: dense versus value-dependent sparse Horner
        alternative: >-
          Per fiber, Horner from its top nonzero coefficient
          (spec_sparse_value_dependent). The fixed term becomes 50,180 at every
          query, because the support is structural, and non-member W is about 208.6k.
      - item: PRS division form
        alternative: >-
          Make the divisor monic first (d mults) and then d mults per quotient
          step (prs_monic_divisor). Non-member W is about 206.7k.
      - item: inversion weight
        alternative: inversion = 1 unit with extended-gcd steps uncounted (inversion_unit_cost). Non-member W is about 202.0k.
      - item: additions
        alternative: additions charged at 1 each (with_additions), about 403.5k for non-members.
      - item: table amortization
        alternative: plus_amortized_table adds W_table/32, which is at most 92 per query and negligible.
      - item: infinity element and degree-drop test
        note: >-
          Detected as deg b < 8 at no charge, so the PRS is still run on that
          triple. 1,062 triples (including 80 in the R = O S4 alternative)
          were hit through the infinity element. Every one agreed with point
          arithmetic.
      - item: early abort inside a triple
        note: >-
          Read as the natural termination of the Euclidean sequence (a zero
          or constant remainder). No further truncation (e.g. stopping at deg
          remainder <= some bound) was applied.
      - item: fraction-free Bareiss/Collins
        note: Not metered; v4 D-1 excludes it.

