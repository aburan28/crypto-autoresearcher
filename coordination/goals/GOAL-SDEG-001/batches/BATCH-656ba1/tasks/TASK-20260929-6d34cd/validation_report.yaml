      - {e: 0.20, c: 1.0e6,   outcome: A,            worst: [0.193, [0.182, 0.206]], median: [0.203, [0.175, 0.228]]}
      - {e: 0.20, c: 1.8e6,   outcome: A,            worst: [0.202, [0.189, 0.212]], median: [0.198, [0.176, 0.231]]}
      - {e: 0.40, c: 1.0e4,   outcome: B,            worst: [0.393, [0.370, 0.408]], median: [0.369, [0.340, 0.410]], role: positive control}
      - {e: 0.40, c: 1.0e6,   outcome: B,            worst: [0.378, [0.372, 0.405]], median: [0.378, [0.366, 0.413]], role: positive control}
    verdict: pass
    reading: >-
      The pipeline never returns B on the planted-0.20 object at any c. It
      returns A when the planted term dominates. At small c it returns
      inconclusive: both B conditions fail, and the only failing A condition is
      "B1 below the null deck". That condition compares two synthetic decks with
      the same planted law, so it can go either way. With a planted 0.40 it does
      return B, so the mapping is not stuck on "not B". Across the sweep B0 stays
      at calibration 0.638, minimum point 0.5605, minimum lower CI 0.336.
      Observation (rule 8): with c <= 1e4 the fixed 52,488 term drags total-W
      beta far below the planted 0.20 (0.009-0.158), while W_triple recovers
      ~0.20-0.22. This is the downward bias OQ-1 anticipated. It can hide an
      exponent (toward A), never manufacture B.

