    object: >-
      The run's own 3456 records (same L, seeds, q, decks, 32 queries per cell,
      oracle member labels; B0 and B2 unchanged), with every B1 query's work
      replaced by W_fixed_xR + c * q^e * exp(N(0, 0.1)). Members pay a
      Uniform(0,1) fraction of the variable term, as with an early abort.
      W_full = W_fixed_xR + c*q^e, W_triple = W - W_fixed_xR, and W_fixed_xR is
