      memory through implementation/analysis.py compute_metrics + outcome. No
      protocol-labelled trial was run and nothing was written under experiments/.
    script: /Volumes/SSD990/.tmp-agent/val6d34cd/proves_too_much.py (sha256 4ff92d98...); results ptm.json (sha256 bd76d4d9...)
