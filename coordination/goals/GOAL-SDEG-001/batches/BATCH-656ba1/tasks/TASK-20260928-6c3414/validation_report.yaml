        No charging counter, statistic, tolerance, window or outcome label is touched. The v4
        dry-run charged op-counts (sha bf4f31fe...9fbac7) are identical to the v3 dry run.
    - id: C3
      name: protocol-v4 checks and trial-plan sha consistency
      result: PASS
      evidence: >-
        Regenerating the plan with make_trial_plan.py gives byte-identical output, sha
        4b1e11e7...215d41; this equals the receipt's trial_plan_sha256, and check_plan returns
        (True, []). Compared with the v3 plan, the cells, rho targets, fixtures and totals are
        identical. Only header keys changed: protocol_version 4, protocol_v4_note, trial_plan,
        amendment_v4, amendment_v4_decision and amendment_v4_sha256. amendment_v4_sha256 equals
        the actual AMD-20260928-d3ed9e sha (24febe93...ac33) and DEC-20260928-48a648's
        amendment_sha256_at_decision. PROTOCOL_VERSION = 4. Full pytest: 72 passed.
    - id: C4
      name: Mac smoke op-counts unchanged
      result: PASS
      evidence: >-
        The committed smoke/mac_v4/opcounts.json has sha 79e80dd11f48c5c6553e1782e74605656ca6c2a1178b2428c5c35eb00ca80651,
        identical to v3's smoke/mac/opcounts.json. I reran it myself: smoke.py --no-sage, run
        in the scratch mirror because smoke.py refuses an --out-dir outside
        implementation/smoke/, under Python 3.12.8. rc 0; op-counts sha 79e80dd1...ca80651;
        identity True; 4/4 cells with no defects; rho 8/8. Only the smoke namespace
        'smoke|EXP-SDEG-85eefd/v2' appears in the mac_v4 and DRYRUN-v4-mac artifacts; no frozen
        label was evaluated. The rerun printed per-query W values; I computed no slope or beta
        from them.
    - id: C5
      name: receipt correction that the earlier pod pytest never ran
      result: PASS
      evidence: >-
        The correction is accurate and properly disclosed. The v3 claim of "pod pytest 53/53
        passed" was unfounded, because the pod image lacked pytest. The only real v3 cross-host
        check was pod op-count equality with the Mac (79e80dd1...), and it still holds from the
        committed smoke/pod artifacts. The v4 receipt honestly records the pod as NOT RUN
        (endpoint refused 90/90 probes; container not found). pod_sync.sh now installs pytest
        into an isolated $POD_ROOT/.pytest_pkgs before running it. Consequence: the pod test
        suite has never been verified to pass under v3 or v4 (N-4).

  non_blocking_findings:
    - id: N-1
      area: FX-2 scope
      text: >-
        A readable cpu.max of "max <period>" (no quota) is still admitted, with
        load_limit = os.cpu_count() (112 on the pod host). This follows FX-2's literal wording
        (fail closed on unreadable or unparseable input), but on an unquota'd host the load
        admission becomes much looser than the v3 intent of 23. Consider failing closed or
        using the declared floor of 23 on "max".
    - id: N-2
      area: admission
      text: >-
        No admitting decision exists yet. DEC-20260928-48a648 has currently_admitted false and
        names a future DEC-20260928-ad6451. pod_sync.sh does not sync that future decision, so
        the pod would refuse until the script is updated. This fails safe, but it is a required
        step before execution.
    - id: N-3
      area: FX-5
      text: >-
        When the AUTORESEARCH_* variables are unset, the manifests record null or "unverified"
        and the driver does not refuse. The DRYRUN-v4-mac manifest shows exactly this. That is
        honest, but a protocol-labelled run should be launched with the variables set, or the
        driver should refuse a non-smoke run without requested_policy.
    - id: N-4
      area: pod verification
      text: >-
        The pod was unreachable for v4. Pod pytest has never run successfully, and FX-2's Linux
        cgroup path has been exercised only through synthetic test inputs, never on a real
        cgroup-v2 host. Run pod pytest and a pod dry run before the admitting decision.
    - id: N-5
      area: interpreter floor
      text: >-
        max_tasks_per_child requires Python 3.11 or later. Under Python 3.9 (my scratch shell's
        default pyenv shim), test_fx4 fails with a TypeError, so the run would crash loudly
        rather than degrade silently. The recorded Mac (3.12.8) and pod (3.12.3) interpreters
        are fine. An explicit version check in the driver would make the requirement visible.
    - id: N-6
      area: receipt / process
      text: >-
        The receipt's commit_sha is null, because it is written inside its own commit; binding
        is by content, and parent cd018399c7 is correct. The receipt records that origin/main
        was not re-fetched before the snapshot (base_check), and that the claim for
        TASK-20260928-5fb050 was not published (procedure_deviations). Both are disclosed
        deviations and are not integrity defects.
    - id: N-7
      area: carried from VAL-20260928-a2bc32
      text: >-
        Minor items N-6 (small uncharged arithmetic) and N-8 (docstrings) from the prior report
        were outside the FX scope and are unchanged. N-3 of the prior report (frozen bootstrap
        label evaluated in tests) was not re-examined here. The prior N-1, N-2, N-4, N-5 and
        N-7 are addressed by FX-1, FX-2, FX-5, FX-3 and FX-4 respectively.

