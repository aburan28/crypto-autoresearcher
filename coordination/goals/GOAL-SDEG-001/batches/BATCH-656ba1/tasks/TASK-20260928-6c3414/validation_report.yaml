  checks:
    - id: C0
      name: snapshot content binding
      result: PASS
      evidence: >-
        All 42 path_sha256 entries in the receipt match both the worktree and the blobs at
        8cd6700ea1 (git show). The commit has 43 changed paths; the extra one is the receipt
        itself. Binding mode is content_at_commit, with parent cd018399c7 as declared.
    - id: C1
      name: FX-1..FX-5 implemented as worded, with regression-sensitive tests
      result: PASS
      evidence:
        FX-1: >-
          driver.check_decision yaml-parses the explicitly passed file and requires: a
          coordinator_decision mapping; an id equal to the filename id; target_ids containing
          EXP-SDEG-85eefd; and execution_admission.currently_admitted `is True` (an exact
          boolean, so a string "true" or the integer 1 is not accepted). Run directly:
          DEC-20260928-6b03c5 is REFUSED (currently_admitted absent);
          DEC-20260928-48a648 is REFUSED (currently_admitted false);
          DEC-20260928-7f2cad is REFUSED; a synthetic DEC-20260928-c0ffee with
          currently_admitted true, the right target and a matching id is ADMITTED.
          tests/test_fx.py covers the same cases, plus refusal of driver.main in every mode.
        FX-2: >-
          hostinfo on Linux sets cpu_max_error when cpu.max is unreadable or unparseable
          (including a non-positive quota or period) or loadavg is bad; check_admission then
          refuses with "(fail closed)". The test cases None, "", "garbage", "max",
          "0 100000", "100000 0" and "abc 100000" all fail closed, and "2380000 100000" is
          admitted with limit 23. Scope caveat: see N-1.
        FX-3: >-
          In cellrun.py, a B0/B1 hit-triple set mismatch appends a cell defect. A defect stops
          the run through the same path as a decision disagreement. The test tampers with
          b1_query to drop a hit triple and asserts a defect and a stop.
        FX-4: >-
          driver._schedule now always uses ProcessPoolExecutor(spawn, max_tasks_per_child=1),
          including when workers is 1; the in-process path was removed. Each task therefore
          runs in a fresh process, and ru_maxrss is measured per cell. The test asserts
          distinct pids for 3 tasks with workers 1 and 2.
        FX-5: >-
          inference_block() reads AUTORESEARCH_* for requested_policy, resolved_model_id
          (default "unverified"), reasoning_effort, fallback_used, fallback_reason,
          degraded_requirements and independent_session. The INFERENCE_KEYS are copied to the
          top level of every part manifest and of the merged manifest (with parts_inference).
          The DRYRUN-v4-mac charged manifest carries them: all null or "unverified", because
          the environment variables were unset (see N-3).
        mutation_check: >-
          I copied the implementation, the amendments and the two real DEC files to a scratch
          mirror, reverted each fix separately, and ran tests/test_fx.py under Python 3.12.8.
          Unmutated: 19 passed. Each revert produced exactly one failure, in its own test:
          FX-1 (text-mention admission) failed test_fx1_real_non_admitting_decisions_refused[6b03c5];
          FX-2 (fallback to 'max') failed test_fx2_linux_cpu_max_fails_closed[None];
          FX-3 (defect removed) failed test_fx3_hit_triple_mismatch_is_defect_and_stops;
          FX-4 (max_tasks_per_child dropped) failed test_fx4_fresh_process_per_task_and_per_task_peak;
          FX-5 (manifest keys dropped) failed test_fx5_part_manifest_carries_inference.
    - id: C2
      name: no change to thresholds, statistics, cost accounting, backend paths or outcome mapping
      result: PASS
      evidence: >-
        git diff cd018399c7 8cd6700ea1 is empty for analysis.py, backends.py, audit, polyfp,
        fparith, semaev, oracle, decks, labels, celltask, b2split, rho and verify. The changed
