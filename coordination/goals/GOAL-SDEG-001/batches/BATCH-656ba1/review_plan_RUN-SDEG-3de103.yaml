    already saw an informal validator slope ~0.80 (AMD-20260928-d3ed9e), so
    my prior is contaminated toward B; this is disclosed, and reviewers
    should weigh it.
  joints:
    - joint: >-
        J1 run integrity: manifest/admission/plan/amendment hashes; 36/36
        cells complete; oracle/B0/B1 decision agreement and equal hit-triple
        sets on every query; audit accepted; B2 split and FGLM checks;
        compressed_cells.json round-trip; the failed attempt RUN-SDEG-5484a4
        contributes nothing; beta values reproduced from raw-result.json by
        an independent re-computation of the frozen statistic.
      assigned_to: TASK-20260929-6d34cd
      attack_plan: >-
        Decompress the three .zst cells and verify sha256. Recompute every
        beta_work(B0/B1) worst/median point and bootstrap CI from per-query W
        in raw-result.json with your own script from the specification's
        definition (log W vs log q over sizes), and diff against metrics.json.
        Grep all cells for any query with a B0/B1 disagreement, a watchdog
        stop or a lower-bound flag. I think it breaks, if anywhere, in the
        worst-statistic definition or the per-size log q used.
      breaking_artifact: a query or statistic where recomputation differs from metrics.json beyond bootstrap noise, or any unrecorded disagreement/watchdog
    - joint: >-
        J2 interpretation and scope: does outcome B follow for A1 as
        specified in RT-1476 (inputs/idea_generation_20260718_batch2.md lines
        88-212), and what exactly does it close?
      assigned_to: TASK-20260929-253523
      attack_plan: >-
        (a) Show whether B1's charged work is dominated by a term the A1
        idea would not pay (e.g. W_fixed_xR, table building, non-amortized
