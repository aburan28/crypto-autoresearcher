    far above the 0.30 gate; B0 calibration ~0.59-0.67; beta_elim(interval_x)
    ~0.598 (pre-registered ~3/5); W_triple beta ~1.0. Scope: L in {8,16,32},
    3 seeds, decks interval_x/subgroup_x/random_x + progression control,
    the Mac, one worker.
  coordinator_prior: >-
    I expect J1 to PASS (the implementation was audited and re-checked, and
    the run self-reports clean agreement). I expect outcome B to stand but
    ONLY for A1 as metered here: the red team will argue (correctly) that it
    closes nothing beyond L<=32 and this meter, that W_triple beta ~1.0 means
    the per-triple PRS cost tracks |T| ~ q, so the early-abort subresultant
