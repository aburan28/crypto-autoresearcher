        W_fixed dominates, which W_triple beta ~1.0 argues against.
      breaking_artifact: a computation from the run's own data showing beta for the A1-relevant cost below 0.30, or a named cost B1 pays that A1 does not
    - joint: >-
        J3 blind re-derivation of B1 per-query work for L=8 (see below).
      assigned_to: TASK-20260929-0bcd38
      attack_plan: see blind_rederivation
      breaking_artifact: per-query W for L8 cells that disagrees with raw-result.json
