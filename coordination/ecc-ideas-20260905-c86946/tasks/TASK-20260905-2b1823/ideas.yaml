      "claim": "A bounded polynomial certificate can prove that a declared set of addition formulas covers every valid pair in an explicit projective input domain, and can expose exactly which domain assumptions are needed.",
      "mechanism": "Treat each formula's simultaneous output-zero condition as its base locus. The curve equations, coordinate-validity conditions, and denominator exclusions define the input variety. An algebraic identity proving that the union of base loci has empty intersection with the permitted domain gives a completeness certificate. Saturation or explicitly introduced inverse variables handles forbidden zero coordinates without silently deleting valid identity or inverse-point cases. Several charts may jointly cover the domain even when no individual chart is complete. The mathematical search question is whether low-degree witnesses exist for a useful family after specialization; this is a conjectural proof-size benefit, not an assumed complexity theorem.",
