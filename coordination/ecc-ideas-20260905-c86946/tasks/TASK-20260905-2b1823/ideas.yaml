      "id": "IDEA-20260905-150c1b",
      "title": "Joint Hasse-window certificates from complementary order witnesses",
      "class": "composition",
      "claim": "Given independently checked point-order divisors on a curve and its twist, their congruence intersection with the Hasse interval can certify the exact trace even when neither arm alone isolates it. The claimed improvement is a shorter verification witness under an explicit input contract.",
      "mechanism": "Track an integer interval with congruences, rather than a transcribed order. A certified divisor D of #E gives t = p+1 modulo D; a divisor Dt of the twist order gives t = -(p+1) modulo Dt. Generalized CRT intersects these constraints, including noncoprime consistency checks. If exactly one integer survives |t|<=2sqrt(p), that integer determines both orders. Multiple point witnesses contribute their lcm, never their product unless coprimality is proved. This strengthens the consistency checksum into a one-sided mathematical certificate: a producer cannot compensate an erroneous curve order with an erroneous twist order while retaining independently verified torsion witnesses. Certificate generation remains charged and can fail to find useful divisors.",
      "question_id": "RQ-SCURVE-960dbd",
