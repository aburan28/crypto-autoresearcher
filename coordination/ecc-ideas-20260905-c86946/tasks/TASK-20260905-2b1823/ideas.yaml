      "title": "Bounded residual certificates for independent arithmetic checking",
      "class": "composition",
      "claim": "A fixed-width exact arithmetic certificate can be checked through independently selected modular projections with deterministic soundness when their combined modulus exceeds a proved bound on every residual.",
      "mechanism": "Track the residual integers of a certificate's arithmetic identities, together with a symbolic magnitude bound. Each checker evaluates identities modulo coprime small primes using a separately represented arithmetic path. If the product exceeds twice the residual bound and every residue vanishes, the residual is exactly zero. Without that product bound, report modular consistency only. This creates a precise bridge from several small checkers to a big-integer identity and a quantitative diagnosis when checker implementations disagree. It applies to order sum identities, coefficient substitutions and integer discriminant factorizations, while modular equations over Fp require an explicit quotient witness rather than being mistaken for integer equalities.",
