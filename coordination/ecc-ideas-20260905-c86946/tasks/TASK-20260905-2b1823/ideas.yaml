      "id": "IDEA-20260905-5c0924",
      "title": "Image-and-kernel certificates for cofactor policies",
      "class": "representation",
      "claim": "For a declared finite abelian curve-group decomposition, scalar cofactor clearing has a computable image and kernel; a policy certificate can distinguish annihilating unwanted torsion, retaining the intended subgroup, and validating its input domain.",
      "mechanism": "Represent the group by invariant factors and the clearing operator by multiplication on each cyclic factor. The kernel size is the product of gcd(c,ni), and the image factors have orders ni/gcd(c,ni). Compose this exact algebra with a domain tag specifying curve, twist, or a validated prime subgroup. A clearing scalar can annihilate the unwanted component while remaining invertible on the intended prime-order component only when the corresponding divisibility and coprimality obligations hold. For a shared x-line the curve and twist domains require separate certificates; a correct statement on one does not prove the other. The invariant deliberately forgets coordinates, but retains exactly the information needed to test the claimed group image.",
