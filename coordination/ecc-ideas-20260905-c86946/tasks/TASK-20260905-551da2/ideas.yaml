      "claim": "For a fixed public feature map v on a prime-order group, the total-variation defect of its transition kernels can bound the error of a feature-only simulator over a finite transcript. Conjecture: an efficiently represented, genuinely lossy coordinate feature can have a smaller defect than matched random balanced partitions for a restricted operation set, while its defect rises when independent translations are added.",
