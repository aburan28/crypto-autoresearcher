  control_check_method: >-
    For each declared control the question asked was the one this round was
    convened for: NAME A CONCRETE INPUT ON WHICH IT FAILS. A control with no
    such input is entailed and is not evidence. The contract's own assertion
    that a control discriminates was not accepted anywhere.

  control_checks:
    - name: C-A-RHO-THIRD-QUADRATURE
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        CONSTRUCTED AND OBSERVED IN THIS SESSION, NOT HYPOTHESISED. My first
        Chebyshev antiderivative used the general coefficient formula
        b_k = (a_{k-1} - a_{k+1})/(2k) at k = 1 instead of the correct
        b_1 = a_0 - a_2/2. That solver returned rho(2) = 0.66040621003332844 and
        rho(6) = 0.33625063114738052 against archived 0.30685282258145957 and
        1.9649696569618583e-05 - relative error 1.15 and 1.7e4. The control
        would have caught it at 1e-3 immediately. The control is REAL and NOT
        entailed.
      but: >-
        ITS DECLARED FAILURE WITNESS IS FALSE. The contract states "A naive
        Simpson solve at step 0.01 is expected to miss 1e-3 at u = 6" and that a
        delay-equation solver "loses relative accuracy fastest exactly there".
        I reimplemented composite Simpson on a uniform grid, implicit in the
        right endpoint, rho == 1 on [0,1], and measured relative error against
        the spectral solution: h=0.01 gives 1.638e-05 (u=2), 1.554e-05 (u=3),
        1.736e-05 (u=4), 1.751e-05 (u=5), 1.757e-05 (u=6). That is 57x INSIDE
        the 1e-3 gate, and the error is FLAT in u, not fastest-degrading at u=6.
        (h=0.005 -> 4.39e-06 at u=6; h=0.001 -> 1.76e-07.) A witness that does
        not fail invites an executor to accept a coarse solver as "the expected
        failure".
      second_defect: >-
        SCOPE TOO NARROW. The control's pass criterion is stated only at INTEGER
        u = 1..6. The rho values the whole re-derivation divides by are at the
        ARCHIVED NON-INTEGER u (bits 16: 2.999875, 5.006009, 6.012858; bits 20:
        3.000009, 5.994822). The secondary metric
        `rho_third_quadrature_discrepancy` is defined at the archived u; the
        BLOCKING control is not. The blocking gate does not cover the
        load-bearing values.
      verdict: real_but_misjustified_and_under_scoped
    - name: C-A-ARCHIVED-REDERIVATION
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        Evaluate rho at the integer u_target instead of the archived
        u_recomputed. That gives bits-16 R = 1.1701861466, 1.4525720872,
        2.0520520663, 4.4954421457, 11.1534950560, which misses the quoted
        4.5709 and 11.5937 by 1.651e-02 and 3.797e-02 - both above the
        control's 1 per cent gate at 2 of 5 rungs. The control is REAL and NOT
        entailed.
      but: >-
        ITS STATED PREMISE IS FALSE. The contract says "IT IS ALREADY
        HALF-FAILING". It is not. All five quoted bits-16 figures reproduce (see
        metric_recomputations and question_4); indeed the quoted values are
        already present verbatim in the committed archive as
        limb_b_absolute.rows[*].LPF_R_u_uniform_mean_over_replicates =
        1.170186146593335, 1.452189666846296, 2.0520520663207287,
        4.570887928556306, 11.593661937425654. The same false premise appears in
        DEC-20260904-3bb7fc's rationale, where it is one of the stated reasons
        for ranking this contract first.
      verdict: real_but_premise_false
    - name: C-A-NULL-REFERENCE-SHIFT
      blocking: true
      declared_kind: NULL OBJECT
      can_it_fail: >-
        NOT IN THE WAY THAT MATTERS. THIS IS THE ROUND'S PRINCIPAL FINDING.
      analysis_1_direction: >-
        REF-SHIFT = rho(1.15 * u_D) applies the knob in the DIRECTION OPPOSITE to
        the correction under test. The principled correction is
        u_X = u_D * ln(X)/ln(D) = 0.9693744651 * u_D at bits 16 - a DOWNWARD
        reparameterisation. 1.15 > 1 is UPWARD. Since rho is strictly
        decreasing, REF-SHIFT < REF-ASY-D pointwise at every rung, for every x
        and y, unconditionally. And REF-EXACT > REF-ASY-D at every bits-16 rung
        is established by committed data at overwhelming significance (the
        incumbent R exceeds 1 by 677, 687, 516, 707 and 848 se_rel at the five
        rungs). Therefore REF-SHIFT's disagreement with REF-EXACT STRICTLY
        EXCEEDS the incumbent's at every rung, always. The null cannot even beat
        the reference it is a perturbation of.
      analysis_2_the_contract_contradicts_its_own_hypothesis: >-
        H-ECDLP-d2aa2c's `proof_search_map.observation_collision` names the
        collision family precisely: "ANY monotone reparameterisation u -> c*u
        with c < 1 raises the reference and lowers R at every rung". c < 1. The
        contract implements c = 1.15. The contract's own "WHAT MAKES IT FAIL,
        CONCRETELY" paragraph reasons about "any downward reparameterisation of
        u" and about 1.15 sitting near ln(D)/ln(X) = 1.0315930902 - but
        ln(D)/ln(X) enters as a DIVISOR of u, not a multiplier. Writing
        rho(1.15*u_D) applies the intended knob in the inverse sense. The null
        object is aimed away from the only region where it could collide.
      analysis_3_the_dangerous_null_wins: >-
        MEASURED ON THE COMMITTED DATA, worst-rung |ln(reference/REF-EXACT)| over
        the five bits-16 rungs:
          REF-ASY-D  (c = 1)          2.4488
          REF-ASY-X  (c = 0.9693745)  1.8980   <- the principled correction
          REF-SHIFT  (c = 1.15)       5.2494   <- the contract's null
          same knob, right sense (c = 1/1.15 = 0.8695652)  0.5235
          best fitted single knob    (c = 0.8825)          0.4047
        A THEORY-FREE ONE-PARAMETER KNOB IN THE COLLISION DIRECTION BEATS THE
        PRINCIPLED ARGUMENT CORRECTION BY A FACTOR OF 3.6 (0.5235 vs 1.8980),
        with no tuning at all, and by 4.7x when fitted. That is exactly the
        collision the hypothesis identified, it is REAL on this data, and the
        contract's null object is constructed so that it cannot see it.
      analysis_4_the_pass_criterion_is_a_metric_artifact: >-
        The declared required outcome is "worst-rung RELATIVE disagreement
        strictly exceeds that of the selected principled reference by at least a
        factor of 2", with `reference_agreement_with_exact` defined as
        |ref - exact| / exact. For any reference BELOW the exact density that
        quantity is bounded above by 1, so a factor-2 ratio is arithmetically
        IMPOSSIBLE against any selected reference whose own disagreement exceeds
        0.5. Measured at bits 16: REF-SHIFT worst relative 0.9947, REF-ASY-X
        worst relative 0.8501 -> ratio 1.17, WHICH FAILS THE FACTOR-2 TEST AND
        FIRES F4 ("the arbitration has no power ... NO reference verdict is
        issued"). The null is rejected only if REF-SP is the selected reference
        (REF-SP worst relative 0.0070 -> ratio 142). So on the contract's own
        metric the blocking null control's outcome turns on the accuracy of the
        one arm whose formula the contract never writes down.
      analysis_5_undefined_branch: >-
        `reference_selection_by_exact_arbitration` explicitly admits "or none is"
        selected. On that reachable branch the BLOCKING control
        C-A-NULL-REFERENCE-SHIFT has NO DEFINED PASS CONDITION, because its
        criterion is stated relative to "the selected principled reference".
      verdict: >-
        NOT THE NULL OBJECT THIS DESIGN NEEDS. One arm of its outcome
        (REF-SHIFT loses to the incumbent) is entailed by monotonicity plus
        committed data; the other arm (factor-2 rejection) is decided by a
        saturating metric rather than by discriminating power; and the collision
        the design exists to guard against is in a direction the null does not
        probe. Under docs/inventor-protocol.md section 3 this is a control that
        does not control. THIS IS THE SAME DEFECT CLASS DEC-20260904-166ab5
        REFUTED IN THE PRECEDING ROUND.
    - name: C-A-PRODUCT-ARM-DERIVABLE-SIGN
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        Pair the product arm's p_hat with the wrong rung (e.g. index the ladder
        by position rather than by Bsm) and the excess collapses. Real pipeline
        check; not entailed by anything else in the design.
      but_1: >-
        THE FIRST CLAUSE IS REFERENCE-INDEPENDENT AND IS ONE STATEMENT, NOT FIVE.
        R(product)/R(uniform) = p_hat(product)/p_hat(uniform); the reference
        cancels identically. "Under every declared reference, R(product) >
        R(uniform) at every rung" is therefore ONE inequality about two archived
        arrays, restated five times. It is already determined by committed
        state: bits-16 ratios are 2.7849, 6.4007, 15.1704, 28.0264, 45.3244. The
        contract should say the first clause is reference-independent so a
        reader does not count it as five confirmations.
      but_2: >-
        REPLICATE COUNT IS WRONG. OBJ-CTRL-PRODUCT is archived with 20
        replicates, not 200 (raw-result.json movement_rows, `replicates: 20`).
        Every metric that says "the archived 200-replicate MEAN" or
        "se_rel = sd/(sqrt(200)*mean)" is wrong for that arm by a factor
        sqrt(10) in the error bar.
      but_3: >-
        At bits-16 u_target = 2 the product arm's p_hat is EXACTLY 1.0 with sd
        0.0, and it must be: p = 46663 < 65536, so every product of two integers
        below p is 65536-smooth by construction. That rung is entailed and
        should be labelled as such rather than reported as a measured excess.
      verdict: real_pipeline_check_with_wrong_replicate_count
    - name: C-A-EXACT-COUNT-CROSS-METHOD
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        Any off-by-one at a segment boundary, inclusion/exclusion of n = 1, or a
        double-counted prime power changes the integer by at least 1 and the
        control demands exact equality. Real and not entailed. I ran a
        structurally analogous pair (recursive subtree counting vs materialised
        enumeration) at Bsm 40, 84 and 256 and they agreed exactly, so the
        control is also passable.
      gap: >-
        The cross-check is at the u_target = 6 rung ONLY. The Bsm = 65536 rung is
        the one where the sieve's residual-cofactor logic ("a residual above
        65536 must be a single large prime") is load-bearing, and it is
        cross-checked by nothing. The one-large-prime identity supplies exactly
        such an independent check at that rung, valid because
        65536**2 = 4294967296 > X = 2177435569, and it costs about a second.
      verdict: real_but_cross_check_placed_at_the_wrong_rung
    - name: C-A-SYNTH-IDENTITY-READBACK
      blocking: false
      can_it_fail: NO - IT CANNOT BE RUN AT ALL
      finding: >-
        THE SYNTH ARM'S RATES ARE NOT ARCHIVED. lpf001_driver.py lines 1195-1226
        compute the synth arm's statistics and then record ONLY per-statistic
        REJECTION COUNTS against the LPF-CAL-A bands, for `uniform` and `synth`.
        No rate, no mean, no per-replicate array for OBJ-NULL-SYNTH survives
        anywhere: `movement_rows` in raw-result.json contains only
        OBJ-CTRL-PRODUCT, OBJ-PLANT-SMOOTH and OBJ-PLANT-ROUGH; grep for
        OBJ-NULL-SYNTH across experiments/EXP-LPF-001/ returns no rate data, and
        perturbation_movement_report.json contains zero occurrences of the
        string.
      consequence: >-
        (a) The independent variable level `archived_arm: OBJ-NULL-SYNTH` is
        unpopulated. (b) The required artifact "a machine-readable table of R(u)
        for every (cell, rung, reference, arm)" is NOT PRODUCIBLE for that arm.
        (c) The control's ONLY possible execution path - redrawing the synth arm
        - is forbidden by C-A-NO-NEW-SAMPLING (blocking) and by the first
        invalidation rule. The contract therefore contains a control whose
        execution is prohibited by another of its own controls.
      verdict: unexecutable_from_committed_state
    - name: C-A-NO-NEW-SAMPLING
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        Any call to CalibrationCell.draw_uniform / draw_synth / the product
        drawer, or any newly written sample array in the run directory. Directly
        checkable against the manifest and the run tree. Real procedural control.
      verdict: sound
    - name: C-A-READ-ONLY-EXP-LPF-001
      blocking: true
      can_it_fail: yes
      concrete_failing_input: >-
        Importing lpf001_driver as a module writes
        experiments/EXP-LPF-001/implementation/__pycache__/, changing the tree
        under EXP-LPF-001 even though no declared input file's sha256 moves. The
        control as written hashes "every input path", which would MISS that.
        Widen it to a recursive tree hash (or an explicit __pycache__
        prohibition) and it becomes both real and complete.
      verdict: real_but_incomplete_as_written

  falsification_criteria_checks:
    - name: F5 (post-correction residual non-monotone in u)
      finding: >-
        F5 FIRES ON THE SUCCESS CASE. It is stated with no significance
        qualifier: "the post-correction residual is non-monotone in u". Under
        REF-EXACT at bits 16 the residual ln R_exact is +4.60e-05, +8.24e-04,
        -2.81e-03, +2.53e-03, +1.62e-03 across the five rungs - NON-MONOTONE,
        with successive differences +7.78e-04, -3.64e-03, +5.34e-03, -9.11e-04 -
        while EVERY rung sits within 1.38 se_rel of 1. When a correction is
        perfect the residual is pure sampling noise and is non-monotone with
        probability close to 1. So the contract's declared branch (a) - the
        outcome its own coordinator_prior expects - automatically triggers F5 and
        is reported as branch (c) with "the residual as a named open item".
      severity: blocking_design_defect
      remedy: >-
        Gate F5 on significance against the archived per-rung standard errors:
        require a monotone-violating excursion exceeding k * se_rel with k
        declared in advance, or state F5 as a test on the trend rather than on
        the sign pattern.
    - name: F4 (null within a factor of 2 of the best principled reference)
      finding: >-
        Reachable as a METRIC ARTIFACT rather than as an epistemic failure - see
        C-A-NULL-REFERENCE-SHIFT analysis 4. On the contract's own saturating
        relative metric, F4 fires against REF-ASY-X (ratio 1.17) even though
        REF-SHIFT is 2.76x worse on the non-saturating log metric.
      severity: blocking_design_defect
    - name: F0, F1, F2, F3, F6
      finding: >-
        Well-posed, decidable, and each has a constructible failing input. F0 is
        exercised by the integer-u input above. F2 and F3 are one computed number
        against another. F6 is exact integer equality.
      severity: none

  heuristic_validation_checks:
    - check: pre_registered_prediction
      result: pass
      detail: >-
        `preregistered_prediction` is present in the committed contract at
        4d7685379, ahead of any run (none exists), states the quantity, the
        formula (|R_exact deviation| <= 4 se_rel at every bits-16 rung), retains
        the source proposal's looser [0.90, 1.11] window as an explicit
        SECONDARY, and requires a versioned protocol_amendment to change. The
        `coordinator_prior` block is recorded before execution as AGENTS.md
        "Review architecture" requires. This is the strongest part of the
        contract.
    - check: sample_integrity
      result: partial
      detail: >-
        Sample size (200 replicates x 130816), seed (master_seed 2301 with a
        named-Stream sha256 derivation) and the sampling procedure
        (numpy integers(1, X+1)) are recorded in the ARCHIVED manifest, which is
        a declared input. But NO RAW SAMPLE ARRAY SURVIVES. The deepest surviving
        level is `LPF_null_replicate_values`: 200 per-rung p_hat values per cell
        for the uniform arm. The contract reads the SUMMARY (`LPF_null_spread`)
        rather than those arrays, so it copies a reported statistic where a free
        recomputation is available. Verified in this review that the summaries
        recompute exactly from the arrays (mean to 1.11e-16, sd exactly, n-1
        convention). See change C13.
    - check: correspondence_validity
      result: not_applicable
      detail: >-
        `scale_relevance.correspondence: null - direct computation over archived
        arrays`. Correct: nothing is sampled and no substitute-sampling theorem
        is invoked.
    - check: scale_binding
      result: pass
      detail: >-
        tier toy; X = p**2 at 16 and 20 bits; NO TRANSFER IS CLAIMED, stated in
        scale_relevance, limitations and interpretation_limits.
    - check: recalled_citation_not_load_bearing
      result: fail
      detail: >-
        The contract's stated intent is right - REF-EXACT is the arbiter
        precisely so the unread Hildebrand / Hildebrand-Tenenbaum sources are not
        load-bearing, and an invalidation rule forbids "any statement resting on"
        them. But TWO things make REF-SP load-bearing in practice. (1) The
        contract defines only how alpha is found
        (sum_{p<=y} log p/(p**alpha - 1) = log x) and NEVER WRITES THE ESTIMATOR
        DOWN. An executor cannot implement REF-SP from the contract text; the
        only available source is the one AGENTS.md rule 9 forbids as
        load-bearing. (2) On the contract's own arbitration metric REF-SP is the
        ONLY reference that can reject the blocking null (see
        C-A-NULL-REFERENCE-SHIFT analysis 4), so a blocking control depends on
        an under-specified arm.

  cost_model_checks:
    - check: budget_internal_consistency
      result: fail
      detail: >-
        maximum_runs 6 x wall_clock_seconds_per_run 5400 at maximum_workers 1
        implies up to 32400 CPU-seconds = 9 CPU-hours, against the declared
        total_cpu_hours: 3. The two cannot both bind. State which is the cap.
    - check: memory_floor_compliance
      result: partial
      detail: >-
        maximum_memory_gb 4 is below the template's declared floor of 8
        (templates/research-records.md, Experiment budget note), which requires
        the sub-floor justification to be stated IN THE OBJECTIVE. It is stated,
        but in `sizing_rationale`. Substantively 4 GB is right: the declared
        working set is ~120 MB and everything I ran peaked below 0.2 GB.
    - check: servability_on_this_host
      result: pass_with_a_large_margin
      detail: >-
        Measured host: 4 cores, 15 GiB total RAM, 14 GiB available, 25 GiB free
        disk, numpy 2.4.6 on CPython 3.11.15. The only backend the adapter
        resolves is anthropic:claude-opus-5 for review-adversarial; the run
        itself is pure local CPU with no backend dependency. The declared 4 GB /
        5400 s per run fits with room to spare, and the 11.73 / 12.22 GiB
        failure mode of the related lane is not reachable at this working set.
    - check: cost_model_realism_of_the_expensive_stage
      result: fail_overstated_by_roughly_40x
      detail: >-
        The contract makes a 3000 s-capped segmented largest-prime-factor sieve
        over [1, 2177435569] the plan for REF-EXACT, and builds its stopping
        rules, its "REF-EXACT NOT ACHIEVED" branch and its UNARBITRATED outcome
        around that cost. Measured on this host, from the committed constants,
        all five bits-16 exact counts are obtainable in about 80 s total and
        under 0.2 GB by cost-proportional-to-COUNT methods:
          Bsm 40    -> 476442        in 0.11 s (recursive count)
          Bsm 84    -> 3463470       in 0.60 s (recursive count)
          Bsm 256   -> 22004862      in 5.03 s (recursive count)
          Bsm 1626  -> 153616031     in 72.9 s (recursive count)
          Bsm 65536 -> 781826538     in 0.22 s (one-large-prime identity + Lucy)
        The sieve is O(X); enumeration and counting are O(Psi(X,y)), and Psi/X
        is 2.2e-4 at the top rung. Ordering the rungs by count makes the
        DECISION-BEARING rungs (u = 6, 5, 4, where the departure is 11.6x, 4.6x
        and 2.1x) available in under six seconds, which strengthens the
        contract's own "cheap refutation before the expensive stage" property
        rather than weakening it.
    - check: cost_bookkeeping_per_attempt_times_inverse_success
      result: not_applicable_and_correctly_so
      detail: >-
        The contract produces no concrete cost table and explicitly refuses to
        make any ECDLP cost statement. The inverse-success-probability
        bookkeeping is the MOTIVATION for repairing the reference, not an output.
        That refusal is correct and should not be relaxed.

  proof_architecture_checks:
    - check: baseline_fixture
      result: pass
      detail: >-
        The frozen regression fixture is C-A-ARCHIVED-REDERIVATION and the
        boundary slice is the bits-16 u_target = 2 rung, where every candidate
        reference should agree. Verified: at that rung the exact density is
        0.3590584029814 and rho(u_X) is 0.3379571163, a 5.9 per cent
        disagreement, so even the "everything agrees" rung is discriminating.
    - check: observation_collision
      result: fail
      detail: >-
        The hypothesis IDENTIFIES the collision correctly (c < 1
        reparameterisations) and the contract then fails to instantiate it. See
        C-A-NULL-REFERENCE-SHIFT. Measured: the collision is real and the fitted
        knob wins.
    - check: quantifier_fidelity
      result: pass
      detail: >-
        "THERE EXISTS a reference among the four declared ones" over a CLOSED,
        pre-declared set, not over all functions. Correctly stated, and the
        quantifier explicitly excludes the real arm, other encodings and other
        instances.
    - check: method_ceiling_and_nearby_object
      result: pass
      detail: >-
        The ceiling is stated ("IT CAN NEVER CERTIFY: anything about the real
        arm, ... or that a repaired reference changes any cost exponent") and the
        nearby object is OBJ-CTRL-PRODUCT.
    - check: validation_ladder_docs_inventor_protocol_section_6
      result: not_applicable_declared
      detail: >-
        The ladder governs a claimed improvement that cannot be executed at the
        scale where it would matter. THIS CONTRACT CLAIMS NO IMPROVEMENT, NO
        SPEEDUP AND NO EXPONENT MOVEMENT, and is executed in full at its own
        declared scale. Steps 1-3 have no subject. Step 4 (the reproducibility
        pointer is not a lie) does apply and is honoured: required_artifacts
        demands the implementation committed by exact path with segment size,
        integer types, prime-table bound and sha256. Recorded here explicitly
        rather than silently omitted.

  question_1_can_each_control_fail:
    answer: >-
      SEVEN OF EIGHT CAN FAIL AND ONE CANNOT BE RUN AT ALL - BUT THE ONE THE
      ROUND WAS CONVENED FOR DOES NOT DISCRIMINATE.
    per_control:
      C-A-RHO-THIRD-QUADRATURE: "can fail (witness constructed); declared witness is false; scope too narrow"
      C-A-ARCHIVED-REDERIVATION: "can fail (integer-u input); stated premise false"
      C-A-NULL-REFERENCE-SHIFT: "outcome pre-determined in the direction that matters; does not test the named collision"
      C-A-PRODUCT-ARM-DERIVABLE-SIGN: "can fail as a pipeline check; first clause reference-independent; replicate count wrong"
      C-A-EXACT-COUNT-CROSS-METHOD: "can fail; placed at the rung that needs it least"
      C-A-SYNTH-IDENTITY-READBACK: "UNEXECUTABLE - the arm's rates are not archived"
      C-A-NO-NEW-SAMPLING: "can fail; sound"
      C-A-READ-ONLY-EXP-LPF-001: "can fail; misses __pycache__ under EXP-LPF-001"

  question_2_is_the_null_object_real:
    answer: >-
      NO, NOT AS WRITTEN. REF-SHIFT = rho(1.15 * u_D) is decorative in the
      direction that matters. Its knob points the opposite way from the
      correction under test, so its loss to the incumbent is entailed by
      monotonicity of rho plus committed data; and its declared factor-2
      rejection test runs on a metric that saturates at 1, so it FAILS that test
      against REF-ASY-X (ratio 1.17) and passes it only against REF-SP. The
      collision the hypothesis itself names - a knob with c < 1 - is REAL on this
      data and the null does not probe it: at c = 1/1.15 = 0.8696 a theory-free
      knob reaches worst-rung |ln(ref/exact)| = 0.5235 against the principled
      REF-ASY-X's 1.8980, i.e. THE FIT BEATS THE CORRECTION BY 3.6x WITH NO
      TUNING. It does NOT risk withholding the verdict; a c < 1 null genuinely
      would.

  question_3_is_the_range_argument_defect_reasoning_correct:
    committed_facts_verified: >-
      lpf001_driver.py:627 reads "range_matching_note: samples are drawn on
      [1, p**2], NOT on [1, D]"; :482 reads "u = lnD / math.log(bsm)"; the
      archived bits-16 descriptor gives X_over_D = 0.5069737250450999. All three
      confirmed independently. draw_uniform is rng.integers(1, self.X + 1), i.e.
      uniform on [1, X] inclusive, so the range claim is exact and not merely
      documentary.
    direction: >-
      CONFIRMED. ln(X)/ln(D) = 0.9693744651 at bits 16 (0.9774951544 at bits 20),
      so u_X < u_D; rho is strictly decreasing, so rho(u_D) < rho(u_X); the
      reference is understated and R = p_hat/reference is inflated. The
      inflation grows with u because |d ln rho / du| grows with u. Exactly as
      claimed.
    magnitude: >-
      MATERIALLY OVERSTATED IN THE SURROUNDING PROSE. At the bits-16 top rung the
      argument error is a factor rho(u_X)/rho(u_D) = 1.7346, i.e. |ln| = 0.551
      out of a total departure |ln 11.5937| = 2.4506 - 22.5 per cent of the
      effect. After the argument correction the residual against the exact count
      is still 6.6727x (|ln| = 1.898). Per-rung ratio exact/rho(u_X): 1.0624,
      1.1978, 1.5231, 2.9907, 6.6727. THE FINITE-y ERROR DOMINATES AND THE RANGE
      MISMATCH IS THE MINORITY TERM at every rung above u = 3.
    consequences_for_the_contract: >-
      (a) The first stage is NOT built on sand - the defect is real, correctly
      signed, cheap to test, and worth testing. (b) But H-ECDLP-d2aa2c's
      mechanism ("these two sources, IN THAT ORDER, account for the archived
      departure") has the order backwards by magnitude, and the coordinator_prior
      that REF-ASY-X "absorbs a substantial part" overstates 22.5 per cent.
      (c) Operationally important: REF-ASY-X ALONE FAILS the contract's own
      pre-registered secondary target max_u |ln R(u)| <= 0.82 - it reaches 1.898
      at bits 16. Stage 1 cannot succeed on its own and the contract should say
      so rather than calling it "the cheapest arm" as though it were the
      candidate answer.

  question_4_do_the_five_quoted_departure_figures_reproduce:
    answer: >-
      ALL FIVE REPRODUCE. THE CONTRACT'S AND THE DECISION'S CLAIM THAT TWO DO NOT
      IS WRONG, AND THIS IS THE CHEAPEST FINDING OF THE ROUND.
    detail: >-
      Recomputed independently from the archived arrays with my own rho solver:
      1.1701861586, 1.4521897284, 2.0520520886, 4.5708880162, 11.5936628520
      against quoted 1.1702, 1.4522, 2.0521, 4.5709, 11.5937 - worst relative
      2.335e-05. Moreover the quoted values are ALREADY IN THE COMMITTED ARCHIVE
      verbatim as null_replicate_statistics.json ->
      per_cell["16"].limb_b_absolute.rows[*].LPF_R_u_uniform_mean_over_replicates
      = 1.170186146593335, 1.452189666846296, 2.0520520663207287,
      4.570887928556306, 11.593661937425654. The bits-20 quoted figures likewise
      match the archive (1.1278780563857167, 1.3054772664107295,
      1.6442551769031821, 2.445280891038028, 5.038589527963218).
    where_the_coordinator_went_wrong: >-
      The 4.49543 and 11.15351 figures are CORRECT ARITHMETIC ON THE WRONG
      DENOMINATOR. I reproduce them exactly - 4.4954421457 and 11.1534950560 -
      by dividing the archived p_hat means by rho at INTEGER u (0.0003547247...
      and 1.9649696...e-05) instead of at the archived u_recomputed (5.006009227
      and 6.012858391, where rho is 3.488697...e-04 and 1.890367...e-05). Rungs 5
      and 6 at bits 16 are precisely the two where u_recomputed differs from
      u_target, which is why exactly two figures moved.
    consequence: >-
      The contract's "IT IS ALREADY HALF-FAILING" and DEC-20260904-3bb7fc's
      rationale bullet "two of IDEA-20260802-001's five quoted bits-16 departure
      figures do not reproduce from the archived arrays at integer u" are both
      false as characterisations of the archive. The proposal's figures are
      sound. The control should be KEPT (it has a real failing input) but its
      premise corrected, and the decision record's bullet superseded - it is
      currently one of the stated reasons for routing this contract first.

  question_5_is_it_servable_on_this_host:
    answer: yes, with a large margin, and the expensive stage is far cheaper than budgeted
    host_measured: {cores: 4, ram_total_gib: 15, ram_available_gib: 14, disk_free: 25G, numpy: 2.4.6, python: 3.11.15}
    backend: >-
      `orchestration.adapter resolve --role validator --independent-session`
      returns review-adversarial -> anthropic:claude-opus-5 (effort=xhigh). The
      RUN itself needs no inference backend; it is local CPU only.
    budget_fit: >-
      Declared 5400 s / 4 GB / 1 worker per run. The declared working set is
      ~120 MB; everything I executed peaked below 0.2 GB. The 11.73 / 12.22 GiB
      exhaustion of the related lane is not reachable at this working set.
    cheap_before_expensive: >-
      GENUINELY ORDERED. Stages 0 and 1 are zero compute, stage 2 is a 1-D solve,
      stage 3 is capped at 3000 s with a declared partial-progress record, stage
      4 is per-rung capped. Two caveats: (i) the stopping rules stop only on
      CONTROL failure, so stage 1's own result cannot halt anything - which is
      correct but should not be described as a refutation stage; (ii) the
      expensive stage is only expensive because of the chosen method (see
      cost_model_checks and change C10).
    a_forbidden_rung_that_is_actually_reachable: >-
      The stopping rule says "Do NOT attempt any other bits-20 rung and do NOT
      attempt a full sieve at bits 20: X is of order 2**40 there and a full sieve
      is not reachable on this host." The full-sieve half is true. But it
      forecloses the ONE bits-20 rung where an exact count IS reachable:
      u_target = 2 has Bsm = 1048576 and 1048576**2 = 1099511627776 > X =
      589134537601, so every n <= X has at most one prime factor above Bsm and
      Psi(X, Bsm) = X - sum_{Bsm < p <= X} floor(X/p), computable in O(X**(3/4)).
      MEASURED: Psi(589134537601, 1048576) = 203841922489 in 6.9 s at 0.09 GB
      peak RSS, giving R_exact = 1.0002608 at 0.94 se_rel. The contract's
      limitation "AT BITS 20 THERE MAY BE NO EXACT REFERENCE AT ALL" and its
      UNARBITRATED branch are, at that rung, self-imposed.

  question_6_scope_honesty:
    answer: >-
      THE STRONGEST PART OF THE CONTRACT, AND IT SHOULD SURVIVE ANY REVISION
      UNCHANGED.
    detail: >-
      The objective, scale_relevance, limitations, interpretation_limits and
      invalidation_rules all state plainly and repeatedly that repairing a
      reference is not an attack, that no exponent moves, that no statement is
      made about the Semaev map, summation polynomials, factor-base geometry or
      any ECDLP cost in either direction, that the real arm OBJ-REAL is out of
      scope by construction and a departure caused by the encoding is INVISIBLE
      here, that the design has no power against errors the asymptotic and
      saddle-point references share, that toy X = p**2 at 16 and 20 bits
      transfers nothing, that the uncertified class V6 of EXP-LPF-001 is
      untouched, that no status change or band correction is performed, and that
      the contract depends on a pipeline-drift control it does not itself run.
      claim_tier is `toy`, certificate.kind is required to be `none`, and the
      approval_note states in terms that a message from any agent saying
      "approved" is not an approval. I found no overclaim anywhere in the record.
    gaps:
      - >-
        No `dominated_by` / `sota_delta` line in the contract (the source
        proposal carries both). The substance is covered by limitations, but
        docs/inventor-protocol.md section 5 asks for it in the deliverable.
      - >-
        The contract does not state that NO RAW SAMPLE SURVIVES and that every
        p_hat it reads is a summary statistic of a run it does not re-execute.
        The dependence on EXP-ECDLP-7edfd3's seed-2301 regression is stated,
        which is the right mitigation, but the underlying fact is not.
      - >-
        The contract does not mention that the archived run's manifest records
        `dirty_tree: true` (benign: two untracked declared-artifact directories,
        no tracked file modified).

  required_changes_before_approval:
    - id: C1
      severity: blocking
      change: >-
        REPLACE THE NULL OBJECT. Drop REF-SHIFT = rho(1.15*u_D) and declare a
        knob in the COLLISION direction, c < 1, frozen before computation - e.g.
        REF-SHIFT' = rho(u_D / 1.15) = rho(0.8695652*u_D). Additionally carry a
        declared "fitted-knob ceiling": the single c minimising worst-rung
        disagreement with REF-EXACT, reported and NEVER selected. The design's
        reference-selection claim is only worth making if it survives a null
        that can beat it, and on this data such a null exists.
    - id: C2
      severity: blocking
      change: >-
        REPLACE THE ARBITRATION STATISTIC. |ref - exact|/exact saturates at 1 for
        every under-estimating reference, which makes the factor-2 criterion in
        C-A-NULL-REFERENCE-SHIFT and F4 arithmetically unreachable whenever the
        selected reference's own disagreement exceeds 0.5. Use
        |ln(ref/exact)| as the arbitration statistic and report the relative form
        alongside it.
    - id: C3
      severity: blocking
      change: >-
        DEFINE THE NULL'S PASS CONDITION ON THE "NONE SELECTED" BRANCH.
        `reference_selection_by_exact_arbitration` admits "or none is"; on that
        reachable branch a BLOCKING control currently has no defined criterion.
        Name the comparator explicitly (e.g. the best principled reference by
        worst-rung |ln|, whether or not it is selected).
    - id: C4
      severity: blocking
      change: >-
        GATE F5 ON SIGNIFICANCE. As written it fires on the success case. Require
        the monotonicity violation to exceed k * se_rel with k declared in
        advance.
    - id: C5
      severity: blocking
      change: >-
        WRITE DOWN REF-SP OR DROP IT. State the estimator, not only the
        definition of alpha, and record it as an implementation choice under test
        against REF-EXACT rather than as a cited theorem - the source is
        `provenance: recalled` and unread, and AGENTS.md rule 9 forbids it being
        load-bearing. Note that C1/C2 also remove REF-SP's accidental role as the
        only reference able to reject the null.
    - id: C6
      severity: blocking
      change: >-
        REMOVE OR RE-SCOPE OBJ-NULL-SYNTH. The arm's rates are not archived; the
        control's only execution path is forbidden by two of the contract's own
        rules. Either delete the arm level and the control, or restate the
        control against what IS archived: the identity report's per-statistic
