  control_check_method: >-
    For every declared control the question asked was the one this round was
    convened for: NAME A CONCRETE INPUT ON WHICH IT FAILS, AND CHECK THAT THE
    DECLARED THRESHOLD LIES INSIDE THE QUANTITY'S ATTAINABLE RANGE. No
    contract's assertion that its own control discriminates was accepted
    anywhere.

  control_checks_EXP_ECDLP_96b5d3:
    declared_blocking_controls: 10
    success_criterion_says: "all eight blocking controls pass"
    count_discrepancy: >-
      TEN controls are declared with `blocking: true`; the success criterion
      names eight. Two blocking controls therefore sit outside the stated
      success condition. Minor but mechanical.
    per_control:
      - name: C-B-AUDIT-CAN-FALSIFY
        can_it_fail: >-
          YES IN PRINCIPLE, AND IT PROBABLY SHOULD ALREADY HAVE FIRED - BUT NOT
          UNDER THE DECLARED SEARCH RULE.
        verdict: real_falsifier_but_the_search_is_aimed_away_from_it
        detail: see finding 96b5d3-B1
      - name: C-B-NULL-ZN-SAME-SHAPE
        can_it_fail: yes, but not as a null for the reported signal
        verdict: mislabelled_null_plus_an_over_strong_forced_value
        detail: see findings 96b5d3-N1 and 96b5d3-N2
      - name: C-B-RIVAL-LAW-PREREGISTERED
        can_it_fail: yes
        verdict: sound_at_the_decision_cell
        detail: >-
          The margin rule is attainable for both laws at sigma = 1/3 and each
          law's own prediction sits inside its own window (see
          rival_law_selection_windows). LAW B is a legitimate empirical rival -
          it asserts the construction fails to reach the frontier at reachable
          sizes, which is not forbidden by the lower bound (at S = N**(1/3),
          T = N**(1/2) gives S*T**2 = N**(4/3) > N). THIS IS THE STRONGEST
          CONTROL IN THE CONTRACT. Its one dependency is disclosed in finding
          96b5d3-N7.
      - name: C-B-RHO-REPRODUCTION
        can_it_fail: yes - and it fails on a CORRECT implementation
        verdict: blocking_false_positive
        detail: see finding 96b5d3-B2
      - name: C-B-DEGENERATE-MUST-SATURATE
        can_it_fail: yes
        verdict: two_clauses_sound_one_clause_false_threshold_undefined
        detail: see findings 96b5d3-N3 and 96b5d3-B4
      - name: C-B-PLANTED-POSITIVE
        can_it_fail: yes
        verdict: sound
        detail: >-
          A sign error across the offline-chain and online-walk offsets is a
          real and reachable defect that no aggregate timing statistic reveals,
          and the certificate is required to be re-verified by independent code
          in the run wrapper per docs/claims-and-verification.md. "An instrument
          that cannot recover a planted log has no power and NO NEGATIVE MAY BE
          READ FROM ANY OTHER ARM" is correct discipline. No defect found.
      - name: C-B-LOWER-BOUND-TRIPWIRE
        can_it_fail: >-
          IT CANNOT BE EVALUATED ON THE COORDINATOR'S OWN EXPECTED OUTCOME, AND
          UNDER THE ONLY PER-CELL READING IT FIRES ON A CORRECT MEASUREMENT.
        verdict: unevaluable_and_misstated
        detail: see finding 96b5d3-B5
      - name: C-B-THREE-COLUMN-OR-NONE
        can_it_fail: yes - it fires on the contract's own required artifact
        verdict: internal_contradiction_pointing_at_a_substantive_error
        detail: see finding 96b5d3-B8
      - name: C-B-NEARBY-OBJECT-EXTENSION-FIELD
        can_it_fail: yes, and it is well conceived
        verdict: right_control_under_specified
        detail: >-
          This is the proves-too-much control applied to an argument, which is
          exactly what AGENTS.md "Review architecture" asks for, and its stated
          disposition ("the audit reports the accounting defect rather than
          closing a lane") is right. BUT the contract names no record, no
          exponent and no memory value for the extension-field setting, so the
          executor has nothing to compute against. The general form of its
          firing condition is the arithmetic in finding 96b5d3-B8: a
          memory-matched ONLINE cost is an advice-model quantity and a
          no-advice algorithm's TOTAL cost is not commensurable with it, so a
          comparator built that way will erase advantages that are known to
          exist. I did not compute a specific extension-field exponent, because
          any figure I could supply would be `provenance: recalled` on my side
          and I will not put one in a review report.
