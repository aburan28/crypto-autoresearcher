  limitations:
    - >-
      THIS IS A CONTRACT REVIEW, NOT A RECEIPT VALIDATION. No run exists for
      either contract, so there is no manifest, no command record, no seed
      record, no environment record, no resource record and no full-run coverage
      record to check. Those artifact checks are UNDETERMINED and remain so until
      an approved run exists.
    - >-
      MY OWN COMPUTATIONS ARE NOT EVIDENCE. Every exact smooth count, density,
      ratio, coverage figure, hitting time, chi-square quantile and threshold
      window in this report was produced in this session's scratchpad to test
      whether the declared controls and thresholds can discriminate. They are
      uncommitted, unmanifested and session-local. They authorise nothing, they
      do not pre-empt either experiment's record, and if any of them is to be
      cited it must be produced again by an approved run under an approved
      contract.
    - >-
      THE COVERAGE AND HITTING-TIME SIMULATIONS ARE NOT THE CONTRACT'S
      CONSTRUCTION. I used a uniform random function on Z_N with no distinguished
      points, no r-adding walk structure and no restarts, because the contract
      specifies none (which is finding 96b5d3-B3). They test the coverage model
      the contract's own predictions rest on, not any implementation. The
      sigma = 0 arm additionally had a 33% non-solve rate within my cap, so its
      medians are conditional and biased downward; the model-independent argument
      in 96b5d3-B2 does not depend on the simulation.
    - >-
      THE ARM-UNIF FLOOR WAS COMPUTED AT BITS 16 ONLY, AND AT FOUR OF FIVE RUNGS.
      The u_target = 3 rung (Bsm = 1626) was not computed - about 1.5e8 smooth
      numbers per instance, beyond this review's budget - and by monotonicity
      lies between 17.8 and 6.7. THE ENTIRE BITS-20 CELL IS UNDETERMINED HERE.
    - >-
      THE FLOOR DEPENDS ON THE INSTANCE SEED SET, WHICH THE CONTRACT DOES NOT
      DECLARE. I used 24 instances from seeds 2301 and 4001+7i and measured
      sd(ln p) = 0.23882; a different seed set gives a different value. The
      generator's p distribution is fixed (nextprime of a hash mod 2**16 with the
      top bit set, so uniform over a full octave, sd(ln p) about 0.2001 in
      expectation), and the floor scales linearly in sd(ln p), so the figures are
      stable to roughly +/-20% - nowhere near enough to change any conclusion,
      but they are not the numbers the contract's own seed set will produce.
    - >-
      I DID NOT PERFORM EXP-ECDLP-96b5d3's CORPUS AUDIT OR ITS CLASSIFICATION. I
      exhibited two committed records whose text carries an explicit
      "memory-matched" comparator and showed that the declared search patterns
      return zero hits on them. Whether the contract's classification rule labels
      them MEMORY-MATCHED is the executor's adjudication and I make no verdict on
      it.
    - >-
      I DID NOT OPEN Corrigan-Gibbs and Kogan, and nothing here discharges that
      debt. Every statement I make about the preprocessing bound is taken from
      knowledge/literature/KN-LIT-013.md and knowledge/techniques/KN-TECH-005.md
      as committed, and I note where those two disagree (epsilon). The KN-LIT
      entry by an agent that actually read the source, which DEC-20260904-3bb7fc
      records as owed, is still owed.
    - >-
      THE EXTENSION-FIELD NEARBY-OBJECT ANALYSIS IS STRUCTURAL, NOT NUMERIC. I
      deliberately did not supply an index-calculus exponent for E(F_{q^n}),
      because any figure I could give would be `provenance: recalled` on my side
      and a review report is the last place a recalled number should appear.
    - >-
      NO REVIEW PLAN EXISTS FOR THIS ROUND, so the joints are self-declared and
      tools/check_review_independence.py could not be run.
    - >-
      A `failed` VERDICT HERE SAYS NOTHING ABOUT ECDLP, demonstrates no speedup,
      refutes no mathematical claim, and authorises no promotion. Neither
      contract has been run, and neither may be.

