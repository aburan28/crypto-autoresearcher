  metric_recomputation_method_note: >-
    Exact smooth counts Psi(x,y) were computed two ways, both written in this
    session: DFS enumeration over prime powers, and, for y**2 >= x, the
    one-large-prime identity Psi(x,y) = x - sum_{y<q<=x} floor(x/q) with
    Lucy_Hedgehog prime counting. Cross-validated against the three exact counts
    the PRECEDING round reported independently: Psi(2177435569, 40) = 476442,
    Psi(2177435569, 84) = 3463470, Psi(2177435569, 65536) = 781826538. ALL THREE
    REPRODUCE EXACTLY. Chain coverage and online hitting times were simulated
    under a uniform random function on Z_N. Chi-square quantiles were computed
    from the regularized lower incomplete gamma function via mpmath.

  metric_recomputations:
    - name: transcribed_constants_of_EXP-ECDLP-7edfd3
      recomputed_from: >-
        experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json and
        experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
      result: >-
        ALL FOURTEEN MATCH EXACTLY. The seven means and seven i.i.d. standard
        deviations transcribed in
        `inputs.archived_within_instance_reference_bits16` are byte-equal to
        per_cell["16"]["LPF-CAL-A"]["LPF_null_spread"][*]["mean"] and ["sd"], and
        p = 46663, X = 2177435569, n_per_sample_set = 130816 match the archived
        descriptor. Independently recomputing mean and sd from the 200 raw
        per-replicate values reproduces the archived mean to <= 1.11e-16 and the
        archived sd EXACTLY under the n-1 sample convention (max deviation
        5.55e-17), while the population convention differs at 1e-7 to 5e-4. The
        contract's transcription discipline is sound and the sd convention is
        n-1 (pinned here; the contract states "Sample standard deviation" for the
        between-instance sd, which is consistent, but does not pin the archived
        denominator's convention).
    - name: ARM-UNIF_derivable_floor_of_EXP-ECDLP-7edfd3
      what: >-
        The predicted between-instance / archived-i.i.d. standard-deviation
        ratio for the NULL arm that carries no curve structure at all, at bits
        16, computed from EXACT smooth counts rather than from any Dickman
        reference.
      method: >-
        Drew instances from the committed generator harness.toycurve.
        generate_instance(seed, 16); measured sd(ln p) = 0.23882 over 24
        instances (p ranged 32887 .. 65053; the generator takes
        nextprime(hash mod 2**16 | 2**15), so p is uniform over a full octave and
        sd(ln p) is about ln(2)/sqrt(12) = 0.2001 in expectation). Computed the
        exact density Psi(p_i**2, Bsm)/p_i**2 at each instance and took the
        sample sd across instances, then divided by the ARCHIVED i.i.d. sd for
        the same rung. Sampling noise added in quadrature for the "total"
        column.
      results:
        - {u_target: 2, Bsm: 65536, k: 24, exact_mean_rate: 0.3602553724, between_sd: 0.0227383, archived_iid_sd: 0.0012764339776488623, ratio: 17.81, total_ratio: 17.84}
        - {u_target: 4, Bsm: 256, k: 12, exact_mean_rate: 0.01024691944, between_sd: 0.00191489, archived_iid_sd: 0.00029057813703463163, ratio: 6.59, total_ratio: 6.67}
        - {u_target: 5, Bsm: 84, k: 24, exact_mean_rate: 0.001656063703, between_sd: 0.000417564, archived_iid_sd: 0.00011390534504310745, ratio: 3.67, total_ratio: 3.80}
        - {u_target: 6, Bsm: 40, k: 24, exact_mean_rate: 0.0002316836961, between_sd: 7.05701e-05, archived_iid_sd: 3.8692062669095765e-05, ratio: 1.82, total_ratio: 2.08}
      sanity_check: >-
        At p = 46663 the exact densities are 0.359058403, 0.010105861,
        0.001590619, 0.000218809 against the archived measured means
        0.359074922, 0.010077475, 0.001594644, 0.000219163 - agreement to
        0.005%, 0.28%, 0.25%, 0.16%, i.e. the exact counter reproduces the
        archived arm.
      not_computed: >-
        The u_target = 3 rung (Bsm = 1626, about 1.5e8 smooth numbers per
        instance) was NOT computed - too expensive within this review. By
        monotonicity it lies between 17.8 and 6.7. THE BITS-20 CELL WAS NOT
        COMPUTED AT ALL.
      why_it_matters: see finding 7edfd3-B1 and 7edfd3-B2.
    - name: log_sensitivity_decomposition
      expression: >-
        ratio(u) = |d ln rate / d ln p| * sd(ln p) / relative_iid_sd(u), with
        relative_iid_sd(u) = sd_iid / mean approximately sqrt((1-rho)/(n*rho)).
      values: >-
        |d ln rate/d ln p| (from the exact counts, dividing the between-instance
        relative sd by sd(ln p) = 0.23882): 0.264 at u = 2, 1.056 at u = 5,
        1.276 at u = 6 - a factor 4.8 rise across the ladder. Relative i.i.d.
        sd: 0.003555 at u = 2, 0.07143 at u = 5, 0.17654 at u = 6 - a factor
        49.7 rise. The DENOMINATOR rises ten times faster than the numerator, so
        the ratio FALLS with u.
      result: >-
        This is the arithmetic that inverts EXP-ECDLP-7edfd3's recorded
        coordinator prior (iii).
    - name: chi_square_interval_arithmetic_of_EXP-ECDLP-7edfd3
      expression: >-
        95% CI for a standard deviation from k observations is
        [sqrt((k-1)/chi2_{0.975,k-1}), sqrt((k-1)/chi2_{0.025,k-1})] * s_hat.
      values:
        k_20: {df: 19, chi2_0975: 32.8523, chi2_0025: 8.9065, multipliers: [0.7605, 1.4606]}
        k_32: {df: 31, chi2_0975: 48.2319, chi2_0025: 17.5387, multipliers: [0.8017, 1.3295]}
      derived_windows_on_the_measured_ratio_r:
        k_20:
          entire_interval_above_1_point_5: r > 1.9724
          interval_contains_1: r in [0.6847, 1.3149]
          interval_spans_1_point_5: r in (1.0270, 1.9724)
          OVERLAP_where_two_clauses_of_the_same_rule_both_fire: r in (1.0270, 1.3149)
        k_32:
          entire_interval_above_1_point_5: r > 1.8710
          interval_contains_1: r in [0.7522, 1.2473]
          interval_spans_1_point_5: r in (1.1283, 1.8710)
          OVERLAP_where_two_clauses_of_the_same_rule_both_fire: r in (1.1283, 1.2473)
      result: see findings 7edfd3-B1 and 7edfd3-N4.
    - name: two_column_threshold_table_of_EXP-ECDLP-96b5d3
      expression: >-
        column 1 = 1/2. column 2 = exponent of sqrt(N/B*) with B* = N**(1/(m+1)),
        = (1 - 1/(m+1))/2 = m/(2*(m+1)). difference = 1/2 - m/(2*(m+1)) =
        [(m+1) - m]/(2*(m+1)) = 1/(2*(m+1)).
      values_in_bits_at_N_2_to_the_256:
        m3: 32.000
        m4: 25.600
        m5: 21.333
        m6: 18.286
        m7: 16.000
        m8: 14.222
        m9: 12.800
        m10: 11.636
      offline_cost_of_the_memory_matched_column: >-
        Achieving online cost sqrt(N/B*) with a preprocessed generic algorithm
        costs B* * sqrt(N/B*) = sqrt(N*B*) offline, exponent
        (1 + 1/(m+1))/2 = (m+2)/(2*(m+1)). That EXCEEDS 1/2 by
        (m+2)/(2*(m+1)) - 1/2 = 1/(2*(m+1)) - EXACTLY the amount the online
        column falls below it, in the OPPOSITE direction. At m = 3: online
        0.375, total 0.625, both 0.125 from 0.500.
      result: see finding 96b5d3-B6 and 96b5d3-B8.
    - name: rival_law_selection_windows_of_EXP-ECDLP-96b5d3
      expression: >-
        R = P_B/P_A = sqrt(N)/sqrt(N/S) = sqrt(S) = N**(sigma/2); at sigma = 1/3,
        R = N**(1/6). LAW_A is selected iff measured is within a factor 2 of P_A
        AND at least a factor 4 from P_B, i.e. measured/P_A in
        [0.5, min(2, R/4)]. LAW_B iff measured/P_A in [max(R/2, 4), 2R].
      values_at_sigma_one_third:
        N_2_18: {R: 8.0000, LAW_A_window: [0.5, 2.0], LAW_B_window: [4.0, 16.0], NEITHER_gap: [2.0, 4.0]}
        N_2_20: {R: 10.0794, LAW_A_window: [0.5, 2.0], LAW_B_window: [5.0397, 20.1587], NEITHER_gap: [2.0, 5.0397]}
        N_2_22: {R: 12.6992, LAW_A_window: [0.5, 2.0], LAW_B_window: [6.3496, 25.3984], NEITHER_gap: [2.0, 6.3496]}
      result: >-
        AT THE DECLARED DECISION CELL THE RULE IS ATTAINABLE FOR BOTH LAWS, and
        each law's own prediction (r = 1 for A, r = R for B) sits inside its own
        window. The contract's quoted separations 8.0 / 10.1 / 12.7 reproduce.
        DEFECT CLASS 2 DOES NOT RECUR HERE. The NEITHER gap widens with N (it is
        the interval (2, R/2), log-width ln(R/4), 45% of the log separation at
        N = 2**22), which is a declared and legitimate outcome.
      values_at_the_other_declared_sigmas:
        sigma_0_1667: >-
          R = 2.8290 / 3.1755 / 3.5645 at the three sizes - all BELOW 4, so the
          LAW_A window collapses to [0.5, R/4] = [0.5, 0.707] / [0.5, 0.794] /
          [0.5, 0.891], every one of which EXCLUDES r = 1, the point at which
          LAW A is exactly true. Neither law can be selected even when one is
          exactly right.
        sigma_0_25: >-
          R = 4.757 / 5.657 / 6.727; windows [0.5, 1.189] / [0.5, 1.414] /
          [0.5, 1.682], all of which do contain r = 1.
        note: >-
          The contract declares a selection rule ONLY at sigma = 1/3
          (`rival_law_selection_at_sigma_one_third`), so this is a latent trap
          rather than a live defect - but sigma = 0.1667 and 0.25 are declared
          independent-variable levels with NO decision rule at all.
    - name: chain_coverage_simulation_for_C-B-DEGENERATE-MUST-SATURATE
      method: >-
        S chains of length L from random starts under a uniform random function
        on Z_N; exact distinct coverage by a boolean array; 3 repetitions.
        THIS IS NOT THE CONTRACT'S CONSTRUCTION, WHICH THE CONTRACT NEVER WRITES
        DOWN (see finding 96b5d3-B3). It tests the COVERAGE MODEL the contract's
        own predictions rest on.
      values:
        - {N: 262144, sigma: 0.333, S: 64, L: 64, regime: at_rule, S_times_L: 4096, distinct: 3551, frac_of_SL: 0.8669, N_over_distinct: 73.8}
        - {N: 262144, sigma: 0.333, S: 64, L: 256, regime: 16x_rule, S_times_L: 16384, distinct: 5574, frac_of_SL: 0.3402, N_over_distinct: 47.0}
        - {N: 262144, sigma: 0.0, S: 1, L: 512, regime: at_rule, S_times_L: 512, distinct: 509, frac_of_SL: 0.9948, N_over_distinct: 514.7}
        - {N: 262144, sigma: 0.0, S: 1, L: 2048, regime: 16x_rule, S_times_L: 2048, distinct: 392, frac_of_SL: 0.1912, N_over_distinct: 669.3}
        - {N: 1048576, sigma: 0.333, S: 102, L: 101, regime: at_rule, S_times_L: 10302, distinct: 8982, frac_of_SL: 0.8719, N_over_distinct: 116.7}
        - {N: 1048576, sigma: 0.333, S: 102, L: 404, regime: 16x_rule, S_times_L: 41208, distinct: 14541, frac_of_SL: 0.3529, N_over_distinct: 72.1}
      result: >-
        TWO OF THE CONTROL'S THREE CLAUSES CHECK OUT AND ONE IS FALSE. "Chains
        must merge" and "coverage must fall materially below S*L at 16x" are
        CORRECT: coverage falls to 34.0% / 35.3% of S*L at the two sigma = 1/3
        cells and to 19.1% at sigma = 0. "Measured online cost must stop
        improving" is FALSE at both sigma = 1/3 cells: N/distinct falls from
        73.8 to 47.0 and from 116.7 to 72.1, i.e. online cost keeps improving by
        about 1.6x. Only at sigma = 0 does it worsen (514.7 -> 669.3). I record
        this correction against my own first estimate: a naive with-replacement
        birthday count predicts only a 3% deficit at 16x and is WRONG, because a
        merged chain contributes nothing for its remaining length. The
        simulation settles it in the control's favour on two clauses.
    - name: online_hitting_time_simulation_for_C-B-RHO-REPRODUCTION
      method: >-
        Same random-function model; 400 random targets walked until they hit the
        stored set; median over solved targets. No distinguished points, no
        r-adding walk, no restarts - because the contract specifies none.
      values:
        - {N: 262144, sigma: 0.0, S: 1, L: 512, distinct: 512, median_online: 190.0, median_over_sqrtN: 0.3711, solved: "267/400"}
        - {N: 1048576, sigma: 0.0, S: 1, L: 1024, distinct: 1024, median_online: 579.5, median_over_sqrtN: 0.5659, solved: "268/400"}
        - {N: 262144, sigma: 0.333, S: 64, L: 64, distinct: 3569, median_online: 44.0, median_over_sqrt_N_over_S: 0.6875, solved: "388/400"}
        - {N: 1048576, sigma: 0.333, S: 102, L: 101, distinct: 8445, median_online: 90.0, median_over_sqrt_N_over_S: 0.8877, solved: "400/400"}
      control_band: >-
        C-B-RHO-REPRODUCTION demands the sigma = 0 median within 25% of
        sqrt(pi*N/2) = 1.2533*sqrt(N), i.e. in [0.9400, 1.5666]*sqrt(N)
        (641.7 -> [481.3, 802.1] at N = 2**18; 1283.4 -> [962.5, 1604.2] at
        2**20).
      result: >-
        THE BAND EXCLUDES THE CORRECT VALUE. Model-independent argument: at
        sigma = 0 the stored set has about L = sqrt(N) points; the hitting time
        of a size-D set under a random function is approximately geometric with
        mean N/D = sqrt(N), so the MEDIAN is about ln(2)*sqrt(N) =
        0.693*sqrt(N), which is 26% below the band's lower edge of
        0.940*sqrt(N). My simulation gives 0.371 and 0.566*sqrt(N), further
        below. sqrt(pi*N/2) is Pollard rho's expected SELF-collision time, not
        the hitting time of a precomputed sqrt(N)-point set; the two share an
        exponent and differ in constant.
      caveat: >-
        My sigma = 0 simulation has a 33% non-solve rate within the cap because
        the online walk enters its own cycle - which is exactly why real
        constructions use distinguished points and restarts, and the contract
        does cap at 8 restarts. So the exact sigma = 0 numbers are conditional
        and biased downward. The MODEL-INDEPENDENT argument above does not
        depend on the simulation and is the finding.
    - name: sigma_plus_two_tau_on_read_per_cell
      expression: >-
        With median = c*sqrt(N/S) and S = N**sigma, and tau_on read per cell as
        ln(median)/ln(N): sigma + 2*tau_on = sigma + 2*[ln c +
        ((1-sigma)/2)*ln N]/ln N = sigma + (2 ln c)/ln N + (1-sigma) =
        1 + (2 ln c)/ln N.
      values: >-
        At N = 2**18 (ln N = 12.4766): the quantity is 1 - 0.0588 = 0.9412 for
        c = 0.693 (the geometric-median constant my model and simulation both
        indicate), and 1 - 0.0374 = 0.9626 for c = 0.79. It equals 1 only when
        c = 1.
      result: see finding 96b5d3-B5.
    - name: declared_seed_list_of_EXP-ECDLP-96b5d3
      method: >-
        Ran harness.toycurve.generate_instance(seed, 18) on exactly the ten
        seeds the contract declares in `replication.seeds`. Total 3.2 s.
      values:
        - {seed: 3001, p: 164191, realised_N: 32801, N_over_2_18: 0.1251}
        - {seed: 3011, p: 199343, realised_N: 53, N_over_2_18: 0.0002}
        - {seed: 3019, p: 181873, realised_N: 181297, N_over_2_18: 0.6916}
        - {seed: 3023, p: 174431, realised_N: 127, N_over_2_18: 0.0005}
        - {seed: 3037, p: 235849, realised_N: 1867, N_over_2_18: 0.0071}
        - {seed: 3041, p: 176591, realised_N: 2753, N_over_2_18: 0.0105}
        - {seed: 3049, p: 243259, realised_N: 379, N_over_2_18: 0.0014}
        - {seed: 3061, p: 146917, realised_N: 9199, N_over_2_18: 0.0351}
        - {seed: 3079, p: 259499, realised_N: 3607, N_over_2_18: 0.0138}
        - {seed: 3083, p: 234791, realised_N: 181, N_over_2_18: 0.0007}
      result: >-
        ONE OF TEN is within a factor 1.5 of the declared "near 2**18"; five are
        below 2**12; the smallest is 53. This is structural, not bad luck: the
        generator returns n = the LARGEST PRIME FACTOR of #E, and
        P(largest prime factor > X**0.95) is about ln(1/0.95) = 5%. See finding
        96b5d3-B7.
    - name: audit_search_pattern_coverage_of_EXP-ECDLP-96b5d3
      method: >-
        Ran the contract's six declared comparator patterns over its ten
        declared audit_search_paths, and separately ran patterns for the shape
        the audit is hunting (sqrt(N/S), sqrt(N/B), S*T**2, S*T^2, N/S),
        "memory-matched"), then took the set difference.
      values:
        files_matching_the_declared_patterns: 860
        files_matching_memory_matched_shapes: 95
        files_matching_memory_matched_shapes_AND_MISSED_by_the_declared_patterns: 17
      named_missed_records:
        - ledger/proposals/IDEA-20260809-2ba70c.yaml
        - ledger/hypotheses/H-SYC-b854f4.yaml
        - ledger/evidence/EV-FALSIFY-89e414.yaml
        - ledger/hypotheses/H-PFDR-06fd60.yaml
        - ledger/hypotheses/H-REPL-6c431d.yaml
        - ledger/hypotheses/H-SSIQ-055a36.yaml
        - "(and 11 further IDEA-* records)"
      per_pattern_verification: >-
        For IDEA-20260809-2ba70c.yaml and H-SYC-b854f4.yaml I counted hits for
        EACH of the six declared patterns individually: 0, 0, 0, 0, 0, 0 in both
