  cost_model_checks:
    - check: budget_internal_consistency
      result: FAIL IN BOTH, AND IN a1c262 - A TRANCHE-WIDE DEFECT
      detail: >-
        EXP-ECDLP-96b5d3: 8 runs x 3600 s at 1 worker = 8 CPU-hours vs declared
        total_cpu_hours 4.
        EXP-ECDLP-7edfd3: 6 runs x 5400 s at 1 worker = 9 CPU-hours vs declared
        total_cpu_hours 6.
        EXP-ECDLP-a1c262 (v1, for comparison): 6 x 5400 = 9 vs 3.
        All three were designed in one act and all three carry the same defect.
        State which figure is the cap.
    - check: memory_floor_compliance
      result: PARTIAL IN BOTH
      detail: >-
        templates/research-records.md declares maximum_memory_gb >= 8 with the
        sub-floor justification required IN THE OBJECTIVE. 96b5d3 declares 2 and
        7edfd3 declares 4, both justified in `sizing_rationale`. Substantively
        both are right: 96b5d3's largest allocation is a 2**22-bit bitset
        (512 KB) and 7edfd3's is a 61553-entry prime table plus a 130816-integer
        array; the archived run peaked at 0.164 GB.
    - check: servability_on_this_host
      EXP-ECDLP-96b5d3: >-
        SERVABLE, BUT THE RATIONALE COSTS THE WRONG THING. The walk arithmetic
        checks out (1.55 us per EC addition measured; 2e8 group operations =
        0.09 CPU-hours). The dominant and unaccounted cost is instance
        generation: naive O(p) point counting at 5.17 s (22 bits) and 15.64 s
        (23 bits) per candidate curve, with about a 5% acceptance rate for a
        subgroup order near the target, i.e. 10**2 to 10**3 seconds per accepted
        large instance.
      EXP-ECDLP-7edfd3: >-
        SERVABLE AT BITS 16 WITH LARGE MARGIN (1113 s of 5400 s), AT BITS 20 WITH
        ESSENTIALLY NONE (5127 s of 5400 s), once the 200 regression replicates
        the contract's own first blocking control requires are counted. Measured
        directly. This host is about 2.9x slower than the archiving host.
    - check: cost_unit_honesty
      EXP-ECDLP-96b5d3: >-
        PASS AND BETTER THAN REQUIRED on the unit itself. `inputs.memory_unit`
        declares GROUP ELEMENTS "before any row is filled", requires every
        reported figure to restate it, and forbids comparison against a record
        counting memory in bits until both are restated - "and a record counting
