        blocking control forbids for every other table (96b5d3-B8).
      EXP-ECDLP-7edfd3: NOT APPLICABLE - the contract produces no cost table and correctly refuses to make any cost statement.
    - check: cost_bookkeeping_per_attempt_times_inverse_success
      EXP-ECDLP-96b5d3: >-
        PARTIAL. The contract does the right thing operationally - restart-cap
