  defect_class_1_did_it_recur:
    class_definition: >-
      A NULL OBJECT POINTING THE WRONG WAY: a perturbation that is a knob away
      from the collision direction, so it cannot discriminate the thing it was
      declared to control; or a declared failing input that has no real,
      reachable instantiation on a real anchor.
    EXP-ECDLP-96b5d3:
      recurred: YES, in two distinct forms
      form_a: >-
        THE AUDIT GATE'S SEARCH IS AIMED AWAY FROM ITS OWN FALSIFIER. The six
        declared patterns ("0.886*sqrt(N)", "sqrt(N)", "birthday bound",
        "exponent 1/2", "rho baseline", "B = rho 1/2") enumerate the ways of
        writing the MEMORY-BLIND baseline. The thing being hunted - a baseline
        evaluated at the candidate's own memory - is naturally written
        "sqrt(N/S)", "S*T**2", or "memory-matched", none of which is in the
        list, and "sqrt(N/S)" does not contain the substring "sqrt(N)".
        MEASURED: 17 records in the declared search paths carry memory-matched
        comparator shapes and match NONE of the six declared patterns. This is
        the same shape as REF-SHIFT: the perturbation points away from the
        collision direction.
      form_b: >-
        THE DECLARED NULL OBJECT CANNOT DESTROY THE SIGNAL. C-B-NULL-ZN-SAME-
        SHAPE carries `kind: NULL OBJECT of the same shape` and is counted as
        this contract's null in DEC-20260904-3bb7fc's rationale, but its
        declared expected outcome is AGREEMENT: the construction is generic, so
        replacing the curve by Z/N leaves the Law-A signal intact by
        construction. It is an implementation-cheat detector, not a null object.
        Under docs/inventor-protocol.md section 3 the design has NO arm in which
        the claimed advantage is predicted to decay when the parameter meant to
        destroy it is varied. The natural missing null is a same-memory RANDOM
        TABLE - store S random group elements with no chain structure, same
        memory, no advice content - whose online cost should revert to about
        min(N/S, sqrt(N)).
      mitigating: >-
        Unlike a1c262's REF-SHIFT, form_b is DISCLOSED in the control's own
        description ("This null is unusual in that its expected outcome is
        AGREEMENT ... stated in advance so agreement can never later be
        presented as corroboration of the frontier law"). That disclosure is
        good practice and materially reduces the severity: the contract does not
        claim discriminating power it lacks. The defect is the mislabel plus the
        missing arm, not a concealed non-control. Form_a is not mitigated.
    EXP-ECDLP-7edfd3:
      recurred: PARTIALLY - the a1c262 SHAPE DOES NOT RECUR, but the declared failing input does not exist
      the_null_itself_is_sound: >-
        ARM-FROZEN removes the instance dependence surgically - same sampler,
        same statistics, same pipeline, range and prime table held at the
        archived values - so the quantity under test (excess between-instance
        spread) MUST decay to nothing. Its forced value is 1 and a deviation in
        EITHER direction fires. That is a textbook
        docs/inventor-protocol.md section 3 null object, and it is the correct
        direction. NO DEFECT OF THE a1c262 KIND.
      what_did_recur: >-
        Its headline failing input, declared "CONCRETELY AND REACHABLY", DOES
        NOT EXIST AGAINST THE COMMITTED DRIVER. See finding 7edfd3-N1. The same
        non-existent input is asserted in DEC-20260904-3bb7fc's rationale
        bullet on null objects.
      severity_relative_to_a1c262: >-
        Materially milder. a1c262's null could not discriminate at all;
        7edfd3's null discriminates correctly and merely justifies itself with a
        mechanism that is not in the code. The control keeps a second, real
        failing input (wrapper state carried across instances - a cached
        factorizer, a module-level array).

  defect_class_2_did_it_recur:
    class_definition: >-
      A SATURATING OR OTHERWISE UNREACHABLE ARBITRATION STATISTIC: a threshold,
      ratio or criterion whose declared binding point lies outside the
      quantity's attainable range, so it cannot be met, or cannot be missed.
    EXP-ECDLP-96b5d3:
      at_the_decision_cell: >-
        NO. The sigma = 1/3 margin rule ("within a factor of 2 of one law's
        prediction and at least a factor of 4 from the other's") is attainable
        for both laws at all three sizes, and each law's own prediction sits
        inside its own window. Windows computed above. I looked hard for the
        a1c262 saturation and it is not here. SAY IT PLAINLY: on its headline
        arbitration statistic, this contract is clean.
      elsewhere_yes_in_four_places:
        - >-
          FOUR BLOCKING/FALSIFICATION THRESHOLDS ARE THE UNDEFINED WORD
          "materially" (lines 247, 273, 527, 531) and the expected values sit in
          the ambiguous zone. Simulated coverage AT THE RULE is 86.7% and 87.2%
          of S*L, so "falls materially below it at a cell at the rule ->
          HEUR-PRE-1 FALSIFIED" turns entirely on where "materially" is set
          AFTER the data. EXP-ECDLP-7edfd3 contains the word zero times and
          pins 1.5 and k >= 20 numerically; EXP-ECDLP-a1c262 contains it zero
          times. This is 96b5d3's own defect, not the tranche's.
        - >-
          TWO FALSIFICATION CRITERIA ARE ALGEBRAIC IDENTITIES THAT CANNOT FAIL.
          See finding 96b5d3-B6.
        - >-
          C-B-RHO-REPRODUCTION'S BAND EXCLUDES THE CORRECT VALUE (finding
          96b5d3-B2): a criterion that cannot be MET by a correct
          implementation.
        - >-
          THE LOWER-BOUND TRIPWIRE FIRES ON A CONSTANT (finding 96b5d3-B5):
          sigma + 2*tau_on = 1 + 2*ln(c)/ln(N) is below 1 whenever the online
          constant c < 1, which the design's own coverage model predicts.
        - >-
          AT sigma = 0.1667 THE SAME MARGIN RULE EXCLUDES THE TRUE LAW at all
          three sizes (window [0.5, 0.707..0.891] excludes r = 1). Latent
          because no rule is declared there; a declared level with no rule is
          itself a gap.
    EXP-ECDLP-7edfd3:
      recurred: YES, DECISIVELY - THIS IS THE PRINCIPAL FINDING OF THE ROUND
      statement: >-
        The pre-registered decision threshold of 1.5 is applied to a quantity
        whose value ON THE NULL ARM - the arm containing no curve structure at
        all - I compute EXACTLY as 17.84 (u=2), 6.67 (u=4), 3.80 (u=5) and 2.08
        (u=6). With the chi-square interval at k = 20 the EFFECTIVE threshold
        for "entire interval above 1.5" is r > 1.9724 (k = 32: r > 1.8710), and
        every rung's null floor exceeds it. Consequently:
          BRANCH "BANDS INVALIDATED AS STATED" is ENTAILED by the null arm alone
          at every rung I computed - it carries no information about curve
          structure;
          BRANCH "BANDS VINDICATED AT THE MEASURED k" requires the ratio's
          interval to contain 1, i.e. r in [0.6847, 1.3149] at k = 20, which is
          UNREACHABLE at every rung I computed.
        The success criterion's celebrated outcome - "THE CONTRACT SUCCEEDS
        WHETHER THE RATIOS ARE 1 OR 4 - a ratio near 1 is a genuine and valuable
        negative that keeps four evidence records at their stated strength" - is
        therefore arithmetically unreachable. That is exactly the a1c262 C2
        defect: a criterion that cannot be met, and a companion that cannot be
        missed.
      the_contract_half_knows_this: >-
        `falsification_criterion` appends "in excess of ARM-UNIF's floor" to the
        invalidation branch. But (a) `preregistered_prediction` - the
        pre-registration that binds - does NOT; (b) C-C-INTERVAL-MANDATORY does
        not; (c) the invalidation rules do not; and (d) NO STATEMENT QUANTIFIES
        "in excess of". Three of the four statements of the rule apply 1.5 to
        the RAW ratio and one applies it to the excess, and they give opposite
        verdicts on the same data.

  findings_EXP_ECDLP_96b5d3:
    - id: 96b5d3-B1
      severity: blocking
      title: >-
        The record's central claim looks ALREADY FALSE at HEAD, and the blocking
        audit designed to test it is specified so as not to find the falsifier.
      detail: >-
        The claim is that no committed record states a comparator threshold with
        the generic baseline evaluated at the candidate's own memory. Two
        committed records inside the audit's own declared search paths appear to
        do exactly that:
          ledger/proposals/IDEA-20260809-2ba70c.yaml -
            best_known: "... standard BSGS N^(1/2) raw and N^(2/3) full;
            memory-matched BSGS N^(2/3) raw and N^(7/9) full under the same
            abstract conversion."
            sota_delta: "... Against memory-matched BSGS, raw and full deltas
            are -gamma_s."
            and a Pareto repair row: "Candidate, rho, standard BSGS, and
            memory-matched BSGS all convert their primitive count vectors to
            SPE with weight one per declared event."
          ledger/hypotheses/H-SYC-b854f4.yaml -
            baseline_embedding.parameter_slice: "... storage N^(1/3+o(1)), and
            fully charged cost N^(7/9+o(1)), the memory-matched BSGS boundary."
        VERIFIED PER PATTERN: each of the six declared search patterns returns
        ZERO hits in each of those two files, while "memory-matched" returns 4
        and 1. Across the ten declared search paths, 17 records carry
        memory-matched comparator shapes and match none of the six patterns.
        Per the contract's own stopping rule - "IF THE AUDIT EXHIBITS A
        MEMORY-MATCHED COMPARATOR COLUMN, THE RECORD'S CLAIM IS FALSIFIED AND
        NOTHING ELSE RUNS" - the likely correct outcome is termination at stage
        0 with zero compute. I did NOT perform the audit or its classification;
        classifying those two records is the executor's adjudication and I make
        no verdict on it. What I establish is that a reachable falsifier
        candidate exists at HEAD and that the declared search rule would not
        surface it.
      also: >-
        The classification rule ("MEMORY-BLIND / MEMORY-MATCHED /
        NOT-A-COMPARATOR") is a subjective adjudication with no declared
        procedure, performed by the same agent, while the coordinator_prior
        pre-announces the expected answer ("(i) the audit to find NO
        memory-matched comparator column"). And the contract's own named anchor
        cuts against that prior: knowledge/techniques/KN-TECH-005.md carries
        "with S-bit preprocessing, S*T^2 = Omega~(n)" in its `complexity`
        frontmatter and states the preprocessing tradeoff under a section
        literally titled "The bound (the program's bar)".
      remedy: >-
        Widen the search rule to include the falsifier's own vocabulary
        (sqrt(N/S), sqrt(N/B), S*T^2, S*T**2, "memory-matched", "memory-charged",
        "at the candidate's memory"), adjudicate the named candidates
        explicitly, and remove the pre-announced expected answer from the prior
        or restate it as a prediction the audit may overturn.
    - id: 96b5d3-B2
      severity: blocking
      title: C-B-RHO-REPRODUCTION's band excludes the value a correct implementation produces.
      detail: >-
        See metric_recomputations/online_hitting_time_simulation. At sigma = 0
        the stored set has about L = sqrt(N) points and the median hitting time
        is about ln(2)*sqrt(N) = 0.693*sqrt(N); the band is
        [0.940, 1.567]*sqrt(N). The control conflates rho's expected
        SELF-collision time sqrt(pi*N/2) with the hitting time of a precomputed
        set. Every numeric prediction in the contract descends from this cell,
        because "the constants c_A and c_B are calibrated ONCE at sigma = 0".
      remedy: >-
        Derive the sigma = 0 expectation from the construction rather than
        importing rho's constant, or restate the control as an EXPONENT check
        (median proportional to sqrt(N) across the three sizes) with the
        constant estimated rather than asserted.
    - id: 96b5d3-B3
      severity: blocking
      title: The construction under test is never written down, and its only anchor is a record that says it was not read.
      detail: >-
        The objective says "Implement the known preprocessing chain
        construction". The contract does not state the chain-start rule, the
        step function, the distinguished-point condition, the online lookup
        procedure, or the boundary at which an operation is charged offline
        rather than online. The only source is KN-LIT-013, whose own
        "Not verified here" section states the full paper was not read and which
        the contract's own invalidation rule forbids asserting beyond. An
        executor cannot implement Part 2 from the contract text. This is the
        same defect as EXP-ECDLP-a1c262's C5 (REF-SP defined only by how alpha
        is found, never written down) - and here it is the whole measurement
        arm, not one reference among four.
      recalled_citation_bearing_load: >-
        Under AGENTS.md rule 9 and agents/validator.md responsibility 9, a
        source no agent in this program has read may not be load-bearing. The
        contract's stated intent is right - it forbids asserting the paper's
        contents - but forbidding assertions about a source does not remove the
        design's dependence on it for the object being built.
    - id: 96b5d3-B4
      severity: blocking
      title: Four blocking/falsification thresholds are the undefined word "materially", with the expected values sitting in the ambiguous zone.
      detail: >-
        Lines 247 (C-B-DEGENERATE-MUST-SATURATE), 273
        (C-B-LOWER-BOUND-TRIPWIRE), 527 (HEUR-PRE-1 falsification), 531
        (instrument-void condition). Simulated coverage at the rule is 86.7% /
        87.2% of S*L, so "falls materially below it at a cell at the rule"
        fires or not purely on a threshold not yet chosen. In a contract that is
        to be FROZEN, leaving the binding point to be set after the data is the
        pre-registration failure the whole freezing discipline exists to
        prevent. The sibling EXP-ECDLP-7edfd3 uses the word zero times.
    - id: 96b5d3-B5
      severity: blocking
      title: C-B-LOWER-BOUND-TRIPWIRE is unevaluable on the expected outcome, has no per-cell definition, mis-states the bound it cites, and false-positives on a constant.
      detail: >-
        (a) UNEVALUABLE. tau_on is defined in `metrics.secondary` as a FITTED
        exponent in realised N at fixed sigma, "REFUSED AND REPORTED AS UNFITTED
        whenever three sizes cannot support it", and the coordinator_prior
        expects exactly that: "(iii) the fitted exponent to be REFUSED as
        unfitted at three sizes". A blocking control whose only input the design
        expects not to exist cannot fire.
        (b) NO PER-CELL DEFINITION. The control asks for the quantity "at every
        cell", but a cell is a (sigma, N) pair and a fitted exponent is not a
        per-cell quantity. `measured_sigma_plus_two_tau_on` says only
        "Read off the measured numbers at every cell".
        (c) FALSE POSITIVE. Under the only available per-cell reading
        (tau_on = ln(median)/ln N), sigma + 2*tau_on = 1 + 2*ln(c)/ln(N), which
        is below 1 whenever the online constant c < 1 - and the design's own
        coverage model gives c near ln 2 = 0.693, for which the value is 0.9412
        at N = 2**18. The run HALTS and is routed to review on a correct
        measurement.
        (d) THE BOUND IS MIS-STATED, THROUGH A TWO-STEP PARAPHRASE.
        KN-LIT-013 records S*T^2 = Omega~(epsilon*N). KN-TECH-005 relays it as
        S*T^2 = Omega~(n), DROPPING epsilon. The contract then tests
        sigma + 2*tau >= 1 with no epsilon, no constant and a tilde, as a strict
        numeric inequality at N = 2**18. The contract's own restart cap
        guarantees epsilon < 1 and requires cap failures counted in every
        denominator, so with epsilon < 1 the recorded bound PERMITS
        sigma + 2*tau < 1.
    - id: 96b5d3-B6
      severity: blocking
      title: Two declared falsification criteria and two clauses of the success criterion are algebraic identities that cannot fail.
      detail: >-
        (a) "The frontier derivation is FALSIFIED if sigma + 2*tau_on != 1
        symbolically." With the design's own stopping rule S*L**2 = N and
        tau_on = log_N(L), tau_on = (1-sigma)/2 and sigma + 2*tau_on = 1
        identically. Nothing can make it fail.
        (b) "The quantified correction 1/(2*(m+1)) is WRONG if the two threshold
        columns agree at any m." The columns are 1/2 and m/(2*(m+1)) and their
        difference is exactly 1/(2*(m+1)) > 0 for every m >= 3 - verified at
        m = 3..10 as 32.000, 25.600, 21.333, 18.286, 16.000, 14.222, 12.800,
        11.636 bits at N = 2**256. The columns can never agree.
        The success criterion counts both as outcomes that must be MET, so two
        of its clauses are guaranteed to pass. This is the defect class
        DEC-20260904-166ab5 refuted (an algebraically entailed arm that passes
        on every possible input), recurring inside a contract whose own
        rationale in DEC-20260904-3bb7fc cites that refutation as the reason
        every contract in the tranche carries a reachable failing input.
      note: >-
        Both are worth computing as arithmetic self-checks on the executor's
        table. Neither is a falsification criterion, and neither should be
        counted as a passed control.
    - id: 96b5d3-B7
      severity: blocking
      title: The declared seed list does not produce the declared object, and no instance-acceptance rule exists.
      detail: >-
        `replication.seeds` lists ten seeds with `independent_instances: 10`,
        and `realised_N` declares "near 2**18, near 2**20, near 2**22".
        MEASURED on those exact ten seeds at field_bits = 18: realised prime
        subgroup orders 32801, 53, 181297, 127, 1867, 2753, 379, 9199, 3607,
        181. One of ten is within a factor 1.5 of 2**18; five are below 2**12.
        At N = 53 the metric "Median over at least 200 independent targets per
        cell" is impossible (52 non-trivial targets exist), S = round(N**(1/3))
        = 4, and R = N**(1/6) = 1.92 is below the factor 4 the selection rule
        requires, so no law can be selected. The contract declares no
        field_bits, no acceptance rule, no rejection rule and no re-draw rule.
        Its sentence "The realised subgroup order N is recorded per instance and
        every prediction is evaluated at the REALISED N, never at the nominal
        power of two" reads as discipline but in fact converts a missing
        acceptance rule into "we will report whatever we get".
      cost_consequence: >-
        Obtaining an instance with realised N near 2**22 requires rejecting
        about 19 of 20 candidate curves (P(largest prime factor > X**0.95) is
        about 5%), each costing a full naive point count - measured 5.17 s at 22
        bits and 15.64 s at 23 bits. That is 10**2 to 10**3 seconds per accepted
        large instance and it appears nowhere in the budget.
    - id: 96b5d3-B8
      severity: blocking
      title: A blocking reporting control invalidates the contract's own required artifact, and the contradiction points at a substantive accounting error.
      detail: >-
        C-B-THREE-COLUMN-OR-NONE: "Every cost table carries offline, online and
        TOTAL columns ... A table with fewer than three columns, or a single
        number not qualified by its policy, invalidates the run." The required
        `two_column_threshold_table` has two columns by name and construction,
        and its required row qualifier is the B* convention, not the
        amortization policy.
        THE SUBSTANCE, WHICH MATTERS MORE THAN THE CONTRADICTION: the
        memory-matched column sqrt(N/B*) is the ONLINE cost of a PREPROCESSED
        generic algorithm. Achieving it costs B* * sqrt(N/B*) = sqrt(N*B*)
        offline, exponent (m+2)/(2*(m+1)), which exceeds 1/2 by exactly
        1/(2*(m+1)) - THE SAME MAGNITUDE THE ONLINE COLUMN FALLS BELOW IT, IN
        THE OPPOSITE DIRECTION. At m = 3: online 0.375, offline+total 0.625,
        both 0.125 away from 0.500; at m = 10: 0.4545 and 0.5455, both 0.04545
        away. So charging the comparator its own offline cost - which this
        contract's own blocking control demands of every other table - exactly
        reverses the sign of the "correction". Index calculus's TOTAL cost is
        being compared against an advice-model ONLINE cost. The contract's
        headline limitation, "THE ONLY THING THAT MOVES IS THE NUMBER A
        CANDIDATE MUST BEAT, and it moves in the direction that makes this
        program's positive claims HARDER", is true only under an amortization
        policy that is never named in that table.
      remedy: >-
        Emit the threshold table with three columns for the comparator too
        (offline, online, total) and state the amortization policy in every row,
        or state explicitly that the comparison is marginal-cost-under-
        amortization and amortize BOTH sides.
    - id: 96b5d3-N1
      severity: named
      title: The declared null object cannot destroy the signal, and no arm does.
      detail: see defect_class_1_did_it_recur / EXP-ECDLP-96b5d3 / form_b.
      remedy: >-
        Relabel C-B-NULL-ZN-SAME-SHAPE as a structure-exploitation control (its
        actual function), and add a genuine null: a same-memory RANDOM TABLE of
        S group elements with no chain structure, whose online cost should
        revert to about min(N/S, sqrt(N)). State in advance what the measured
        advantage SHOULD do as the table's advice content is destroyed.
    - id: 96b5d3-N2
      severity: named
      title: C-B-NULL-ZN's forced value "IDENTICAL" is too strong and can void a correct instrument.
      detail: >-
        The premise is "the construction uses nothing elliptic - it is a
        generic-group algorithm and KN-TECH-005 applies to it in full". The
        ANALYSIS is generic; the REALISED WALK is not, because the contract's
        own description computes the step index from x-coordinates. Curve
        x-coordinates cover about half of F_p and the count in a residue class
        mod r deviates from p/(2r) by O(sqrt(p)); at r = 256 and p near 2**18
        that is an order-one relative deviation, and `walk_arity_r` spans
        exactly {16, 64, 256}. So the two arms' step functions are genuinely
        different random functions, and r-adding-walk performance is known to
        depend on partition uniformity. "The INSTRUMENT is VOID if the Z/N null
        arm differs materially from the curve arm" can therefore void a correct
        instrument.
      honesty_note: >-
        This is a bound-based argument (Weil-type character sum), not a
        measurement. I did not measure the x-coordinate residue distribution.
        Marked as such.
    - id: 96b5d3-N3
      severity: named
      title: C-B-DEGENERATE-MUST-SATURATE has three conjunctive clauses and one is measurably false.
      detail: >-
        Simulated: "chains must merge" and "coverage must fall materially below
        S*L at 16x" are CORRECT (34.0% / 35.3% of S*L at the two sigma = 1/3
        cells; 19.1% at sigma = 0). "Measured online cost must stop improving"
        is FALSE at both sigma = 1/3 cells: N/distinct falls from 73.8 to 47.0
        and from 116.7 to 72.1. Coverage saturates only when S*L approaches N,
        which is a multiplier of order L above the rule (64x at the
        sigma = 1/3, N = 2**18 cell), not 16x. A blocking control with a clause
        a correct implementation fails.
      correction_of_my_own_first_estimate: >-
        A naive with-replacement birthday count predicts only a 3% coverage
        deficit at 16x and is wrong, because a merged chain contributes nothing
        for its remaining length. The simulation settles it IN THE CONTROL'S
        FAVOUR on two of three clauses, and I record that rather than reporting
        the estimate I started from.
    - id: 96b5d3-N4
      severity: named
      title: Budget block internally inconsistent, below the template memory floor, and silent on the dominant cost.
      detail: >-
        maximum_runs 8 x wall_clock_seconds_per_run 3600 at maximum_workers 1 =
        28800 s = 8 CPU-hours against the declared total_cpu_hours: 4. The two
        cannot both bind. maximum_memory_gb 2 is below
        templates/research-records.md's declared floor of 8, whose sub-floor
        justification is required IN THE OBJECTIVE; it is in `sizing_rationale`.
        (Both halves are EXP-ECDLP-a1c262's C12 recurring.)
        The walk-cost arithmetic itself CHECKS OUT: measured 1.55 us per affine
        EC addition, so 2e8 group operations is 0.09 CPU-hours - "minutes of
        pure Python" is right, and memory really is trivial (a 2**22-bit bitset
        is 512 KB). What is omitted is instance generation, which dominates: see
        96b5d3-B7. The sizing enumeration also omits `stopping_rule_regime`
        (x2), a declared independent variable.
    - id: 96b5d3-N5
      severity: named
      title: scipy is absent and no dependency is declared.
      detail: >-
        `hit_rate_uniformity_chi_square` requires a chi-square p-value. numpy
        supplies none. Implementable via mpmath (bundled with sympy), which is
        what I used. DEC-20260806-8f7e4f records a dispatcher error of exactly
        this shape and it is worth not repeating.
    - id: 96b5d3-N6
      severity: named
      title: No selection rule is declared at two of the four sigma levels, and at sigma = 0.1667 the same rule would exclude the true law.
      detail: see metric_recomputations/rival_law_selection_windows, "values_at_the_other_declared_sigmas".
    - id: 96b5d3-N7
      severity: named
      title: >-
        The DEC-20260806-8f7e4f demotion IS carried into the contract - correctly
        and in three places - but the demoted cell is still the origin of every
        number the decision cell is judged against, and the contract does not
        say so.
      answer_to_the_task_question: >-
        THE DEMOTION WAS CARRIED. C-B-RHO-REPRODUCTION is declared
        "EXPLICITLY NON-DISCRIMINATING", its description states "PASSING THIS
        CONTROL SUPPORTS NEITHER LAW. Law B passes it identically", an
        invalidation rule forbids "Any use of the sigma = 0 cell as a
        discriminating control, or any ranking, priority or verdict resting on
        it", and C-B-RIVAL-LAW-PREREGISTERED explains why. That is a faithful
        and unusually thorough carrying of a binding prior verdict.
        AND sigma = 1/3 GENUINELY DISCRIMINATES rather than being asserted to:
        I verified independently that at S = N**(1/3) the two laws separate by
        N**(1/6) = 8.00 / 10.08 / 12.70 at the three sizes (the contract's
        quoted 8.0 / 10.1 / 12.7 reproduce), that the margin rule's windows are
        non-empty, and that each law's own prediction lies inside its own
        window. The demotion is real and the replacement is real.
      the_residual: >-
        `preregistered_prediction` states "the constants c_A and c_B are
        calibrated ONCE at sigma = 0, where both laws coincide, and are then
        held fixed across the whole sweep." Both laws' numeric predictions at
        sigma = 1/3 are therefore functions of the sigma = 0 measurement. That
        is not a verdict resting on sigma = 0 in the forbidden sense - the
        constant cancels out of the RATIO between the laws, which is why the
        discrimination survives - but the contract nowhere states this
        dependence, and the calibration is fragile: in my simulation of the
        most natural sigma = 0 reading the constant is 0.371*sqrt(N) at
        N = 2**18 and 0.566*sqrt(N) at 2**20, a 1.5x drift that would consume
        most of the factor-2 window when a constant calibrated at one size is
        applied at another.
      caveat: >-
        My sigma = 0 simulation has no distinguished points and no restarts and
        33% of targets never solved within the cap, so the drift may be partly
        an artifact of my simplification. Reported as a risk the contract should
        pin (calibrate c per size, or state that only the ratio is used), NOT as
        a measurement of the contract's construction - which cannot be measured
        because the construction is not written down (96b5d3-B3).
    - id: 96b5d3-N8
      severity: named
      title: B* = N**(1/(m+1)) is quoted with no source record named.
      detail: >-
        An invalidation rule forbids re-deriving or adjusting it and states it
        "is QUOTED from committed records", but
        `inputs.committed_anchors_to_be_re_read_not_assumed` names only
        KN-TECH-005, KN-LIT-013 and DEC-20260806-8f7e4f. The executor cannot
        check the quotation, and every threshold row is declared conditional on
        it.
    - id: 96b5d3-N9
      severity: named
      title: The declared one-way dependency on EXP-ECDLP-7edfd3 is contradicted by 7edfd3's own scope.
      detail: >-
        96b5d3 states, twice, that B* "rests on a mean-yield convention whose
        instance-level error bars are the subject of / this lane measures"
        EXP-ECDLP-7edfd3. 7edfd3's limitations say the EV-YIELD-e1adbf / ca4b02
        / 7c3195 ratios "are NOT covered, because their pipelines were not
        read", and its invalidation rules forbid "Any claim about STAT-CHI,
        STAT-KS1 or the EV-YIELD-* ratios beyond the zero-compute
        successor_scope_report". Both contracts assert the dependency; one of
        them refutes it. The overlap declarations were evidently written as a
        pair without re-reading the narrowed scope.
    - id: 96b5d3-M1
      severity: minor
      title: >-
        No pareto_position / dominated_by / sota_delta block
        (docs/inventor-protocol.md section 5) and no `inference` block declaring
        the executor run's requested policy. Both are EXP-ECDLP-a1c262's C15,
        recurring. Verified that committed a1c262 v1 also lacked them.
    - id: 96b5d3-M2
      severity: minor
      title: Ten blocking controls are declared; the success criterion says "all eight blocking controls pass".
    - id: 96b5d3-M3
      severity: minor
      title: >-
        `hit_rate_uniformity_chi_square` is binned "by target x-coordinate
        residue class"; the Z/N arm has no x-coordinate, so the metric is
        undefined on one of the two declared group arms.
    - id: 96b5d3-M4
      severity: minor
      title: >-
        `exact_distinct_coverage` is compared "against the predicted
        (1-o(1))*S*L". An o(1) is not a number at toy scale, and a blocking
        control's criterion rests on it. Measured value at the rule is 0.867 and
        0.872 of S*L.

  findings_EXP_ECDLP_7edfd3:
    - id: 7edfd3-B1
      severity: blocking
      title: >-
        The pre-registered 1.5 threshold sits below the NULL arm's own floor at
        every rung computed, so one declared branch is entailed and the other is
        unreachable.
      detail: see defect_class_2_did_it_recur / EXP-ECDLP-7edfd3, and
        metric_recomputations/ARM-UNIF_derivable_floor.
      arithmetic_to_re_derive: >-
        floor(u) = sd_across_instances[Psi(p_i**2, Bsm_u)/p_i**2] /
        archived_iid_sd(u), with p_i from
        harness.toycurve.generate_instance(seed, 16) and Psi exact. Values
        17.84 / 6.67 / 3.80 / 2.08 at u = 2 / 4 / 5 / 6. Effective invalidation
        threshold at k = 20 is 1.5 / 0.7605 = 1.9724; vindication window is
        [0.6847, 1.3149].
      remedy: >-
        Apply the decision threshold to `arm_real_excess_over_floor` (the
        contract's own declared FINDING) rather than to the raw between/iid
        ratio, state the threshold on the excess numerically, and make the four
        statements of the rule agree. Better: replace the ratio-of-SDs estimator
        entirely (see 7edfd3-N6).
    - id: 7edfd3-B2
      severity: blocking
      title: The recorded coordinator prior is inverted, and the contract's stated alternative is also wrong.
      detail: >-
        coordinator_prior (iii) expects the floor "well above 1 at u = 5 and 6
        and near 1 at u = 2". MEASURED EXACTLY: 17.84 at u = 2 falling
        monotonically to 2.08 at u = 6. The "well above 1 at u = 5 and 6" half is
        right (3.80, 2.08); "near 1 at u = 2" is wrong by about 18x and the
        ladder's direction is reversed. The stated reasoning - "the u-ladder
        amplifies that dependence exactly where rho is smallest" - is true of the
        absolute log-sensitivity (0.264 -> 1.276, x4.8) but the i.i.d. RELATIVE
        sd rises x49.7 (0.00355 -> 0.17654), because p_hat is a binomial rate
        with relative sd about sqrt((1-rho)/(n*rho)). The prior compares the
        wrong pair.
        Being wrong is not itself the defect - a pre-recorded prior the review
        overturns is exactly what AGENTS.md "Review architecture" wants, and this
        one was cheap to check (about 60 s of compute). THE DEFECT is that the
        contract's declared informative alternative is also wrong: "If (iii) is
        wrong and the null floor is FLAT AT 1 across the ladder, the code reading
        behind HEUR-IVAR-2 is incomplete". The floor is neither what the prior
        expects nor flat at 1; it is large and decreasing, and no branch of the
        contract anticipates that.
    - id: 7edfd3-B3
      severity: blocking
      title: >-
        The blocking floor control's prediction is undefined between three
        readings whose answers straddle its own factor-2 gate, and one reading
        kills the primary finding on a correct measurement.
      detail: >-
        C-C-DERIVABLE-FLOOR-UNIF requires the prediction to be computed "from the
        p values and the reference formula only". The reference formula is never
        stated. Three readings are available:
          (i) the driver's own u = ln(D)/ln(Bsm) with D = 2**32 FIXED
              (lpf001_driver.py:482) - p-independent, so predicted floor = 1 at
              every rung;
          (ii) Dickman rho at u = 2*ln(p)/ln(Bsm) - predicted floor about 15.5 at
              u = 2 and 1.8 at u = 6 (my Dickman estimate; it overstates the
              u = 6 sensitivity by about 26% against the exact count);
          (iii) exact Psi(p**2, Bsm)/p**2 - 17.84 at u = 2 and 2.08 at u = 6.
        The control fires on "A departure beyond a factor of 2" between predicted
        and measured, and its consequence is "ARM-REAL loses the baseline it is
        read against". Under reading (i) - the reading a wrapper importing the
        committed driver would most naturally inherit, since the driver computes
        u from D - the departure is 2.1x to 17.8x and the BLOCKING control FIRES
        on a correct measurement, destroying the contract's primary deliverable.
      also_breaks_the_reference_independence_claim: >-
        `between_instance_sd_raw` asserts "RAW AND REFERENCE-FREE FOR
        STAT-RATE-u ... so this metric is unaffected by whatever the sibling
        contract EXP-ECDLP-a1c262 decides about the reference". True of the raw
        sd. FALSE of the blocking floor control, which needs exactly the
        reference a1c262 exists to test - and under reading (i) inherits exactly
        the range/argument mismatch a1c262 exists to measure.
      remedy: >-
        State the floor's estimator explicitly. The exact route is cheap: I
        computed the u = 2, 4, 5, 6 floors from exact smooth counts in about
        170 s total on this host, using the one-large-prime identity at
        Bsm = 65536 (valid because 65536**2 > p**2 for every 16-bit p) and DFS
        enumeration below. That removes the reference dependence entirely and
        makes the floor a derived constant rather than a modelled one.
    - id: 7edfd3-B4
      severity: blocking
      title: >-
        The contract's mandated execution route is not implementable against the
        committed API, and the route that is triggers the contract's own
        invalidation rule while evading its own control.
      detail: >-
        (a) NOT IMPLEMENTABLE AS DECLARED. `inputs.immutability` says the sweep
        "IMPORTS the committed driver's functions and varies only the instance
        seed". But `CalibrationCell.__init__(self, bits)` takes NO seed - it
        hard-codes `generate_instance(MASTER_SEED, bits)` with the module
        constant MASTER_SEED = 2301 (lpf001_driver.py:85, :632-637). Varying the
        instance seed through the committed API requires rebinding
        lpf001_driver.MASTER_SEED in memory - precisely the shortcut
        C-C-READ-ONLY-EXP-LPF-001 calls out ("Varying the seed by rebinding a
        module global is the obvious implementation shortcut"). That control
        checks only before-and-after sha256 of files on disk, which an in-memory
        rebinding does not move; the invalidation rule's phrase "in-place
        monkey-patch of lpf001_driver.py" is ambiguous between the in-memory and
        on-disk cases.
        (b) ARM-FROZEN CANNOT USE THE COMMITTED SAMPLER AT ALL, because
        `draw_uniform` samples on `self.X = self.p*self.p`. Its sampler must be
        the wrapper's, so the null arm does not exercise the driver's sampler -
        which is consistent with the control's purpose but is not what
        `inputs.immutability` says.
        (c) THE MANDATED IMPORT WRITES INTO THE IMMUTABLE TREE AND FIRES THE
        CONTRACT'S OWN INVALIDATION RULE. Importing lpf001_driver creates
        experiments/EXP-LPF-001/implementation/__pycache__/
        lpf001_driver.cpython-311.pyc. VERIFIED on this host: no __pycache__
        currently exists under EXP-LPF-001, PYTHONDONTWRITEBYTECODE is unset, and
        __pycache__/ is gitignored so `git status` will not show it. The
        invalidation rule forbids "Any edit, write, move, regeneration ... of ...
        any file under experiments/EXP-LPF-001/"; the stopping rule "Stop
        immediately if any path under experiments/EXP-LPF-001/ changes hash"
        does not catch a NEW path; and the control hashes only paths "read by
        the run". This is EXP-ECDLP-a1c262's C14 recurring, and it is worse here
        because the import is MANDATORY rather than optional.
      remedy: >-
        Widen the read-only control to a recursive tree hash of
        experiments/EXP-LPF-001 (or set PYTHONDONTWRITEBYTECODE / sys.dont_write_
        bytecode in the wrapper and assert it), and state the seed-injection
        mechanism explicitly - either an approved wrapper-level reimplementation
        of CalibrationCell that takes a seed, or an explicit, disclosed in-memory
        rebinding with a stated integrity check.
    - id: 7edfd3-N1
      severity: named
      title: The null object's declared "CONCRETELY AND REACHABLY" failing input does not exist against the committed driver.
      detail: >-
        C-C-NULL-RANGE-FROZEN states: "The committed driver derives its streams
        as MASTER_SEED + STREAM_OFFSETS[name] + bits, so a wrapper that varies
        the instance seed by adding a small integer can collide two instances'
        streams outright, or place them at short offsets in the same generator
        state."
        THE DRIVER DOES NOT WORK THAT WAY. lpf001_driver.py:189-201:
        Stream.draw_seed(k) = int(sha256(f"{seed}:{name}:{k}").hexdigest()[:16],
        16), and Stream.generator(k) returns a FRESH
        np.random.default_rng(draw_seed(k)) per draw index. VERIFIED: a seed
        separation of 1 already gives unequal draw seeds; and a composite-seed
        collision across two different stream names (s_i - s_j = 100000, which
        makes the composite INTEGERS equal) still gives unequal draw seeds
        because the name is hashed. There is no generator state shared across
        draws at all, so the "short offsets in the same generator state" mode
        does not exist. The only collision mode is two literally identical
        instance seeds.
      consequences: >-
        (a) The requirement in `replication.seeds` that seed separations be
        "larger than the span of STREAM_OFFSETS plus the field-bits range"
        (i.e. >= 800004) is derived from the same misreading and is
        unnecessary - distinctness suffices, and the constraint would otherwise
        push seeds into a range nobody needs.
        (b) The same non-existent failing input is asserted in
        DEC-20260904-3bb7fc's rationale bullet: "ARM-FROZEN fails with a
        between/i.i.d. ratio below 1 when per-instance streams collide under the
        driver's MASTER_SEED + STREAM_OFFSETS + bits rule."
      what_survives: >-
        The control is NOT dead. Its second named mode - "wrapper state carried
        across instances (a cached factorizer, a module-level array) inflates or
        deflates it" - is real and reachable, and the arm is a genuine
        section-3 null. Restate the mechanism against the code as written.
    - id: 7edfd3-N2
      severity: named
      title: A frozen contract that does not freeze its seed list.
      detail: >-
        `replication.seeds` defers the k-1 seeds to "the run's input record
        before the first instance is generated". Every number in the deliverable
        is a function of that list, and the contract's own C-C-SEED-2301-
        REGRESSION exists because seeds determine results exactly. Contrast the
        sibling EXP-ECDLP-96b5d3, which does list ten seeds - and whose listed
        seeds turn out not to produce the declared object (96b5d3-B7). One
        contract in the tranche freezes the wrong seeds and the other freezes
        none.
    - id: 7edfd3-N3
      severity: named
      title: Budget block internally inconsistent, below the template memory floor, two bits-20 figures invented and wrong, and the bits-20 cell has no margin on this host.
      detail: >-
        (a) maximum_runs 6 x wall_clock_seconds_per_run 5400 at maximum_workers 1
        = 32400 s = 9 CPU-hours against total_cpu_hours: 6.
        (b) maximum_memory_gb 4 is below templates/research-records.md's floor of
        8, and the sub-floor justification is in `sizing_rationale` rather than
        the objective. (Both halves are a1c262's C12, recurring.)
        (c) TWO INVENTED BITS-20 NUMBERS, BOTH WRONG AGAINST THE ARCHIVE THAT
        CONTAINS THEM. `sizing_rationale` says "At bits 20 the table is roughly
        seventeen times larger" and "of order eighty thousand" primes. The
        archived descriptor records trial_division_prime_count = 61553 at bits 20
        against 4822 at bits 16 - a factor of 12.766, and 61553, not ~80000. This
        is in a contract that elsewhere states, correctly and admirably, "The
        bits-20 values are deliberately NOT transcribed because this coordinator
        did not read them; inventing them would be a fabrication." The budget
        rationale invents two of them anyway, from a file the contract already
        declares as an input.
        (d) THE SIZING ARITHMETIC OMITS THE CONTRACT'S OWN FIRST BLOCKING
        CONTROL. C-C-SEED-2301-REGRESSION must reproduce "the archived
        per-replicate values EXACTLY", i.e. all 200 replicates per cell.
        MEASURED on this host with the committed Factorizer (run from a
        scratchpad copy): 3.76 s per 130816-sample set at bits 16, 17.32 s at
        bits 20. Per cell the real total is 96 sweep sets + 200 regression
        replicates = 296:
          bits 16: 296 x 3.76 = 1113 s against the 5400 s cap - comfortable;
          bits 20: 296 x 17.32 = 5127 s against the same 5400 s cap - 95%
          utilisation BEFORE instance generation (about 55 s), per-instance
          factorizer table rebuilds (0.93 s x 32 = 30 s), statistics and I/O.
        The stated rationale - "96 sample sets per cell - under half the 200
        replicates the archived calibration already completed" - omits exactly
        the 200 that push it over, and uses the archived 200 as a yardstick
        rather than as a cost.
      not_a_stop: >-
        The stopping rules degrade safely: partial results are written per
        instance, the cell stops at the wall clock with the realised k, and a
        cell below k = 20 is reported UNRESOLVED rather than as a negative. So
        this is a sizing-rationale defect, not an unservable budget. The
        practical consequence is that the bits-20 cell will very likely land
        below k = 32 and may land below k = 20, in which case the contract's
        whole bits-20 verdict is UNRESOLVED by construction - which should be
        stated in advance rather than discovered.
    - id: 7edfd3-N4
      severity: named
      title: Two clauses of the pre-registered decision rule fire simultaneously with opposite verdicts on a reachable range.
      detail: >-
        At k = 20 a measured ratio r in (1.0270, 1.3149) yields an interval that
        BOTH contains 1 ("vindicates it at the realised k") AND spans 1.5
        ("UNRESOLVED"). At k = 32 the overlap is r in (1.1283, 1.2473). The
        contract's own C-C-INTERVAL-MANDATORY says "a true ratio of 1.2 is NOT
        resolvable at all" - which is inside the overlap it also calls
        vindicated. An invalidation rule elsewhere ("any ratio whose interval
        spans 1.5 reported as a verdict rather than as UNRESOLVED") does resolve
        the tie, but it lives in a different section from the pre-registration,
        and the ambiguity resolves in the direction of the null-preserving
        verdict, which is the one the success criterion celebrates.
    - id: 7edfd3-N5
      severity: named
      title: The ratio's confidence interval ignores the denominator's own sampling error.
      detail: >-
        The archived i.i.d. sd is itself an estimate from 200 replicates; its own
        95% chi-square multipliers are [0.9107, 1.1088], about +/-10%. The
        contract specifies "its chi-square confidence interval at the REALISED k"
        only - a one-sample interval for a two-sample ratio. The correct interval
        is F-based. The effect is an interval NARROWER than it should be, which
        makes both verdicts fire more readily and UNRESOLVED less readily - the
        opposite of the control's stated purpose.
    - id: 7edfd3-N6
      severity: named
      title: The estimator discards the design's own strongest information.
      detail: >-
        ARM-UNIF and ARM-REAL are measured on the SAME p_i, so the p-driven
        component - which I show is the dominant term, 2x to 18x the i.i.d. sd -
        is COMMON to both arms and can be removed by a paired analysis: regress
        each statistic on ln(p_i) across instances and compare RESIDUAL spreads.
        That estimates curve structure directly, has far more power at k = 20-32,
        and needs no floor prediction at all. The chosen estimator - a ratio of
        two separately-intervalled standard deviations - throws the pairing away
        and then has to compare two numbers whose null values are 2 to 18.
        THIS IS THE CONSTRUCTIVE FORM OF 7edfd3-B1 AND 7edfd3-B3: the research
        question is sound and valuable, and my exact computation makes a better
        design available rather than a worse one.
    - id: 7edfd3-N7
      severity: named
      title: The declared dependency on EXP-ECDLP-96b5d3 is contradicted by this contract's own scope.
      detail: mirror of 96b5d3-N9; the same sentence pair, written once from each side.
    - id: 7edfd3-N8
      severity: named
      title: The comparability of the two standard deviations depends on n matching exactly, and that requirement lives only in the budget rationale.
      detail: >-
        The between-instance sd is comparable to the archived within-instance sd
        only if each instance's statistic is computed from the SAME 130816
        samples one archived replicate used. That is stated in
        `budget.sizing_rationale` ("Three arms at 130816 samples per instance")
        and nowhere in the metric definitions or the controls. It is the single
        assumption that makes the primary ratio meaningful.
    - id: 7edfd3-M1
      severity: minor
      title: >-
        No pareto_position / dominated_by / sota_delta block and no `inference`
        block. a1c262's C15, recurring.
    - id: 7edfd3-M2
      severity: minor
      title: >-
        scipy is absent; C-C-INTERVAL-MANDATORY (blocking) needs a chi-square
        quantile function and no dependency is declared. Implementable via
        mpmath.
    - id: 7edfd3-M3
      severity: minor
      title: >-
        The archived sd convention is n-1 (verified: recomputation from the 200
        raw values reproduces it to <= 5.6e-17 under n-1 and differs at 1e-7 to
        5e-4 under the population convention). The contract says "Sample standard
        deviation" for the between-instance sd, which is right, but does not pin
        the archived denominator's convention. a1c262's C13.
    - id: 7edfd3-P1
      severity: none
      title: WHAT IS GOOD AND SHOULD SURVIVE ANY REVISION BYTE-FOR-BYTE.
      detail: >-
        All fourteen transcribed bits-16 constants match the archive EXACTLY, and
        the refusal to transcribe unread bits-20 values is correct discipline.
        ARM-FROZEN is a genuine null object in the inventor-protocol section 3
        sense, two-sided, with the parameter meant to destroy the signal
        surgically removed. Thresholds are pinned numerically and the word
        "materially" appears zero times. C-C-DECISION-READBACK converts an
        unread citation into a blocking zero-compute artifact instead of hiding
        it - exemplary handling of AGENTS.md rule 9. The scope discipline is
        complete and repeated: no ECDLP claim, no Semaev claim, no cost, no
        exponent, no status change, no band correction, claim_tier toy,
        certificate.kind none. The recognition that C-C-SEED-2301-REGRESSION is
        EXP-ECDLP-a1c262's pipeline-drift control, and the sequencing consequence
        drawn from it, are correct.

