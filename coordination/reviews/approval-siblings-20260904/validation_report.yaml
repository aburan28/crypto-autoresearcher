  answer_did_the_sigma_zero_demotion_get_carried_into_EXP_ECDLP_96b5d3:
    verdict: "YES, FAITHFULLY, AND sigma = 1/3 GENUINELY DISCRIMINATES."
    carried_where:
      - >-
        C-B-RHO-REPRODUCTION is declared "EXPLICITLY NON-DISCRIMINATING" in its
        `kind`, and its description states "DECLARED IN ADVANCE AND NOT ARGUED
        WITH: PASSING THIS CONTROL SUPPORTS NEITHER LAW. Law B passes it
        identically."
      - >-
        C-B-RIVAL-LAW-PREREGISTERED names the reason explicitly: "the source
        proposal ranked itself first on a sigma = 0 known-answer calibration, and
        DEC-20260806-8f7e4f found that calibration NOT DISCRIMINATING because Law
        B passes it identically. Ranking a design on a control that cannot fail
        is exactly the defect the last review round refuted."
      - >-
        An invalidation rule: "Any use of the sigma = 0 cell as a discriminating
        control, or any ranking, priority or verdict resting on it.
        DEC-20260806-8f7e4f found it non-discriminating and that finding binds."
      - >-
        The novelty framing is withdrawn in the objective, the limitations and
        the title.
    discrimination_verified_not_inherited: >-
      I checked the separation independently rather than accepting it. At
      S = N**sigma the two laws' predictions differ by sqrt(S) = N**(sigma/2); at
      sigma = 1/3 that is N**(1/6) = 8.0000 / 10.0794 / 12.6992 at
      N = 2**18 / 2**20 / 2**22, reproducing the contract's quoted 8.0 / 10.1 /
      12.7. The margin rule's windows are non-empty at all three sizes and each
      law's own prediction lies strictly inside its own window (LAW_A window
      [0.5, 2.0]*P_A contains r = 1; LAW_B window [R/2, 2R]*P_A contains
      r = R). So sigma = 1/3 is genuinely discriminating, not asserted to be.
    the_residual_dependence: see finding 96b5d3-N7.

  answer_does_the_ranking_argument_survive_CORR_20260904_f3aa7a:
    finding: >-
      THE RANKING ARGUMENT AS STATED DOES NOT SURVIVE, THOUGH THE CORRECTION SAYS
      THE RANKING ITSELF STANDS.
    detail: >-
      DEC-20260904-3bb7fc's next_action ranks EXP-ECDLP-a1c262 first on three
      stated grounds:
        (1) "Its first two stages are zero compute";
        (2) "its C-A-ARCHIVED-REDERIVATION control can void the tranche's
            motivating figures before anything expensive runs";
        (3) "EXP-ECDLP-7edfd3 reads the same archived arrays".
      CORR-20260904-f3aa7a removes (2) outright: "C-A-ARCHIVED-REDERIVATION
      therefore CANNOT void the tranche's motivating figures; at most it can
      confirm a readback of literals already in the archive."
      Of the two that remain: (1) DOES NOT DISTINGUISH - EXP-ECDLP-96b5d3's
      stages 0 and 1 are both declared zero compute, and EXP-ECDLP-7edfd3's
      stage 0 is too. (3) ARGUES THE OTHER WAY, and the same decision's own
      next_action says so: "EXP-ECDLP-7edfd3's C-C-SEED-2301-REGRESSION must be
      scheduled BEFORE any interpretation of EXP-ECDLP-a1c262: a drift failure
      there invalidates the archived arrays a1c262 reads."
      CORR-20260904-f3aa7a's `what_is_not_corrected` states that the ranking
      stands, but it does not re-derive it from the surviving grounds. On the
      decision's own stated criterion - cheapest genuine refutation first - the
      cheapest genuine refutation in the tranche is now EXP-ECDLP-96b5d3's
      stage-0 audit: zero compute, and a falsifier candidate already visible at
      HEAD (96b5d3-B1).
    what_i_am_not_doing: >-
      I am not issuing a ranking. Ordering the tranche is a Coordinator act on a
      committed decision. I record that the stated argument no longer supports
      its conclusion and that a re-derivation is owed.

  cross_cutting_findings_about_the_tranche:
    - >-
      THE BUDGET-BLOCK INCONSISTENCY IS TRANCHE-WIDE (a1c262 9 vs 3, 96b5d3 8 vs
      4, 7edfd3 9 vs 6 CPU-hours), as is the sub-floor memory justification in
      the wrong field, and the absence of a pareto_position and an `inference`
      block in the two siblings. A per-contract repair will miss the pattern; the
      contract template or the design checklist is where this belongs.
    - >-
      THE TWO OVERLAP DECLARATIONS BETWEEN 96b5d3 AND 7edfd3 WERE WRITTEN AS A
      MATCHED PAIR AND BOTH ASSERT A DEPENDENCY THAT 7edfd3's OWN NARROWED SCOPE
      REFUTES. The narrowing (excluding the EV-YIELD-* ratios because their
      pipelines were not read) is itself good practice and is recorded in
      DEC-20260904-3bb7fc's limitations; it simply was not propagated back into
      the overlap blocks.
    - >-
      DEC-20260904-3bb7fc's rationale bullet "EVERY CONTRACT CARRIES A NULL
      OBJECT WITH A NAMED, REACHABLE FAILING INPUT" is now, on this review's
      evidence, wrong for all three: REF-SHIFT does not probe the collision
      (prior round); the Z/N arm's expected outcome is agreement, so it is not a
      null for the reported signal; and ARM-FROZEN's named collision mode does
      not exist against the committed driver. The decision's INSTINCT was right
      and is the reason all three contracts are as good as they are; the
      execution of it failed the same way three times, which is what makes it a
      class rather than three slips.
    - >-
      A POSITIVE PATTERN WORTH PRESERVING. All three contracts state
      claim_tier toy, refuse every ECDLP/exponent/cost claim in both directions,
      forbid status changes on the records they read, require the certificate
      kind to be none where nothing is solved, and carry an approval_note saying
      in terms that a message from any agent is not an approval. I found no
      overclaim anywhere in either record under review. Whatever else is
      repaired, that should survive byte-for-byte.

  verdicts:
    EXP-ECDLP-96b5d3:
      verdict: failed
      scope: >-
        `failed` scores THE SPECIFICATION'S FITNESS TO BE APPROVED AS WRITTEN. It
        is NOT a judgement on the research question - the comparator question is
        real, was explicitly RETAINED by DEC-20260806-8f7e4f, and is worth
        answering - and it is NOT negative evidence about anything mathematical.
        The specific failures are: a blocking audit gate whose search rule is
        aimed away from its own falsifier while a falsifier candidate is already
        visible at HEAD (B1); a blocking control whose band excludes the correct
        value (B2); a measurement arm whose object is never written down and
        whose only source is a record declared unread (B3); four blocking or
        falsification thresholds that are an undefined adverb (B4); a blocking
        tripwire that is unevaluable on the expected outcome, mis-states the
        bound it cites, and false-positives on a constant (B5); two falsification
        criteria that are algebraic identities (B6); a declared seed list that
        does not produce the declared object (B7); and a blocking reporting
        control that invalidates the contract's own required artifact while
        pointing at a real accounting error (B8). Under the precedent of
        DEC-20260904-166ab5 and the preceding round, a control asserted to
        discriminate that cannot - or that a correct implementation fails - is a
        `failed`, not an `incomplete`.
    EXP-ECDLP-7edfd3:
      verdict: failed
      scope: >-
        `failed` on the same standard, and with more regret: this is the better
        of the two contracts and its research question is the more clearly
        answerable. The specific failures are: a pre-registered decision
        threshold of 1.5 applied to a quantity whose NULL-arm value is 2.08 to
        17.84, making one declared branch entailed and the other unreachable
        (B1); a coordinator prior inverted in direction, with the contract's own
        stated alternative also wrong (B2); a blocking floor control whose
        prediction is undefined between three readings, one of which fires on a
        correct measurement and destroys the primary finding (B3); and a mandated
        execution route that is not implementable against the committed API and
        that triggers the contract's own invalidation rule while evading its own
        control (B4). The design is repairable and my exact computation supplies
        the repair (N6).

  required_changes_before_approval:
    - id: S1
      contract: EXP-ECDLP-96b5d3
      severity: blocking
      change: >-
