        can_it_fail: yes
        verdict: sound
        detail: >-
          Its named failing input - "finding that c06631 or 013 already carries
          the offline/online split" - is a real, reachable, zero-compute
          discovery, and the AGENTS.md discipline of REPORTING disagreement
          without proposing a status change is correctly applied.

