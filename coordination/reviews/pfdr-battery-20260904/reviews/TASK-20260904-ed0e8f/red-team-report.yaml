red_team_report:
  id: RT-20260904-ed0e8f
  task_id: TASK-20260904-ed0e8f
  id_allocation_provenance: >-
    RT-* is not a managed identifier type in tools/allocate_id.py (--next
    accepts batch, coordinator_decision, correction, evidence, experiment,
    goal, handoff, hypothesis, idea, research_question). The report id is
    derived from the owning task id, which is unique by construction; no
    state was scanned for a next free number and no identifier was minted.
  experiment_id: EXP-PFDR-5726af
  hypothesis_id: H-PFDR-4148b8
  question_id: RQ-PFDR-ae2fba
  recorded_at: '2026-09-04'
  scope_note: >-
    Everything below is scoped to d = 2 and the tested (m, s, p). No statement
    here is an impossibility result; a bounded failure of a clause is reported
    as a bounded failure. Every derivation is labelled derivation, never
    proved. The joints R0-R4 and the proves_too_much control are the only
    things reported on; V1-V4 belong to TASK-20260904-642cf5 and were not
    reviewed here.

  claim_under_review: >-
    As frozen by the review plan: the Semaev arm of the d = 2 digit
    presentation has (d_ff, fall_dim) equal to the frozen closed-form
    prediction at every cell and every draw (residual 0/0); the block-factored
    null reproduces both integers exactly; the support-matched null falls
    strictly later; hence (H-PFDR-4148b8, title) d_ff(m, 2, s) = m 2^{m-1} +
    floor((s - 2^{m-1})/2) + 1 is a closed form in (m, s) alone, curve- and
    target-independent, and IDEA-20260830-84cdb7's H1 is 'refuted by
    derivation' with its Outcome 3 exponent stake 'closed at d = 2'.

  per_joint_result:
    - joint: 'R0 raw/summary agreement and residual regeneration from the raw records'
      attack_executed: >-
        Regenerated analysis.md sections B-K from runs/*/raw-result.json with
        my own code (r0_regen.py), reading only the `raw` block and never the
        `metrics` block, and re-deriving every (d_ff, fall_dim) from the
        per-layer profile as full_rank - top_rank rather than trusting the
        recorded fields; diffed against analysis.md and execution-report.yaml.
      computation: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-ed0e8f/r0_regen.py -> r0_regenerated.json; table in r0_diff.md
      result: holds
      decider: >-
        Zero recorded-vs-derived mismatches over 272 Semaev layers, 1490
        NULL-1 layers, 240 NULL-2 layers, 36 mixed-block objects and 24
        non-monomial readings; every table entry of sections B-K reproduces,
        including the boundary-cell NULL-2 differences (0, -3) at (2,2,2) and
        (0, -11) at (3,2,4) and the D-STOP-FIRST truncations
        (D_max_computed 7, 13, 13).
      caveats:
        - >-
          R0-OBS-1: table C's 'nonzero entries (count) 60' counts (draw, seed)
          PAIRS. Under D-NULL2-ONCE there are 10 distinct block-factored null
          objects per m = 2 cell and 5 per m = 3 cell. Section K states this at
          the deciding cell; table C does not. Independent-object count for
          P3 is 10 (resp. 5), not 60 (resp. 10).
        - >-
          R0-OBS-2: all 112 H-WIL cells are e = 2. The m = 3 arms use e = 4,
          for which the raw table has no cell (taken up under R2).
    - joint: 'R1 the fall_dim identity and the boundary-cell block-factored-null anomaly'
      attack_executed: >-
        Derived exactly when the meter's fall_dim(D) equals the top-form kernel
        dimension; identified the obstruction as row dependence in B and
        characterised it exactly as 'a degree-(D-delta) form vanishing on
        supp(S~)', an ideal-level quantity; built INHOMOGENEOUS block-factored
        nulls at the two boundary cells and at two strict cells; added a
        forcing control (dense random, no block structure) and a new
        degree-matched structure-free null; then swept the SMALLEST primes the
        hypothesis itself allows, exhaustively over all non-singular curves and
        all affine targets, for a counterexample.
      computation: r1_derivation.md, r1_falldim.py -> r1_results.json, r1b_rowdep_sweep.py -> r1b_results.json, r1c_sweep_ext.py -> r1c_results.json, counterexample_certificate.py
      result: breaks
      decider: >-
        (i) fall_dim(D) = dim ker(m_{S~_top}) - dim Rel_D with Rel_D = {h of
        degree D-delta vanishing on supp(S~)}; (D4) states the identity without
        the hypothesis Rel_D = 0. (ii) At s = e the homogeneous block-factored
        null is c times the product of ALL ms variables, whose support in
        {0,1}^{ms} is one point, so full_rank = 1 for every D and fall_dim = 1
        is FORCED: P3's 'forced 0 difference at every cell' was unsatisfiable
        at (2,2,2) and (3,2,4). (iii) An inhomogeneous block-factored null with
        no curve, no target and no x_R returns (5, 4) and (13, 12) exactly, so
        the discrepancy is homogeneity and F2 is NOT live. (iv) Counterexample
        certificate inside the hypothesis's own quantifier: p = 13,
        a = 12, b = 3, x_R = 11, s = 2 gives (d_ff, fall_dim) = (5, 3) against
        the frozen (5, 4), with N_sol = 8 and the vanishing linear form
        a_{1,0} - a_{2,0}; second instance p = 19, a = 2, b = 15, x_R = 9.
      supporting_negative_result: >-
        The rigorous sufficient condition N_sol < 2^{ms - a_0} makes the
        identity true, and it holds with orders of magnitude to spare at every
        tested cell (observed N_sol in {1, 2, 6} against thresholds 8, 32, 64,
        256, 512, 2^11, 2^14). Verified post hoc in the run records:
        full_rank == rows at 272/272 Semaev layers and 1490/1490 NULL-1
        layers. The bound is sharp: the counterexample sits at N_sol = 8 =
        2^{4-1} exactly.
    - joint: 'R2 exactness, the Wilson dependence and the scope of the refutation of 84cdb7 H1'
      attack_executed: >-
        Separated the unconditional upper bound from the lower bound;
        established that refuting boundedness needs only the lower bound;
        tested (D4)'s stated reason for full rank; swept p (including p <= s)
        and e = 4 for rank drops; independently reproduced the 112-cell table;
        performed a second retrieval of Wilson (1990).
      computation: r2_wilson_note.md, r2_wilson.py -> r2_results.json
      result: breaks
      decider: >-
        (D4) of H-PFDR-4148b8 justifies full rank by 'for p > s every
        binom(k-i, t-i) is a positive integer below p'. Computed witness:
        s = 10, j = 4, e = 2, p = 11 has diagonal entries 1, 3, 6, 10, 15 with
        15 >= p, so the stated reason is false, while the rank is full (210).
        The conclusion is right for a different reason (Kummer/Lucas:
        r + e <= s < p implies p does not divide binom(r+e, e)). The source
        proposal IDEA-20260903-e1e38b (D4) states the correct bound
        (binom(s, floor(s/2)) < 2^s <= p); the ledger record lost it.
      scope_correction: >-
        'Refuted by derivation' should read 'refuted at d = 2, m = 2
        conditional on H-WIL (Wilson), with H-WIL verified unconditionally at
        e = 2, s <= 8 (producer) and s <= 10 (this review) at the tested
        primes'. A finite s-range cannot refute a boundedness statement at all,
        so the s <= 8 check contributes no unconditional refutation.
    - joint: 'R3 H-TOP provenance, the ALPF-011 citation mislabel and the CAS substitution'
      attack_executed: >-
        Opened experiments/EXP-ALPF-011/source/round006_exp010_validated_resweep_result.md;
        checked whether [4, 4, 4, 12] is a per-variable profile; assessed
        D-HTOP-CAS; and closed the package's declared m = 4 gap by computing
        the top form of S_5.
      computation: r3_citation_note.md, r3_htop_m4.py -> r3_results.json, r3b_htop_m4.py -> r3b_results.json
      result: breaks
      decider: >-
        The archived column is 'leading-form degree profile ... actually fed to
        the meter' and its entry TRACKS |FB|: [4, 4, 4, 12] at |FB| = 4 and
        [5, 5, 5, 12] at |FB| = 5. A per-variable profile of S_4 cannot change
        with the factor base, so the list is a generator-degree list (three
        membership polynomials plus S_4 of total degree 12). The executor's
        A-ARCHIVED-PROFILE-CITATION is confirmed and HEUR-001's
        random_model_justification is factually wrong as written; the m = 3
        claim now rests entirely on the package's own symbolic run, which is
        sound and which I reproduced (c = 1, three random parameter sets).
      positive_finding: >-
        H-TOP at m = 4 (declared not attempted in stage0-htop.md 2.2) is now
        checked: deg_{(x1..x4)} S_5 = 32 and the coefficient of
        x_1^8 x_2^8 x_3^8 x_4^8 is 1 in six random (a, b, x_R), with x_R
        symbolic, and with a, b symbolic (no free symbols in the leading
        coefficient). m >= 5 remains an open symbolic obligation.
      cas_assessment: >-
        No objection to D-HTOP-CAS. The contract names the construction, not a
        CAS; sympy's resultant over Z[a, b, x_R] is exact and has no
        termination heuristic. Reproduced with independent code by a different
        extraction route.
    - joint: 'R4 nearby objects, confounds and conventions'
      attack_executed: >-
        (a) recomputed the executed mixed-block object and computed the literal
        3-shared-variable reading the package recorded but did not run;
        (b) built two genuinely non-tensor degree-4 top forms at s = 3 that do
        not collapse; (c) audited the three named confounds by code inspection
        and by derivation; (d) re-derived (D7)'s sigma bound from the column
        count at asymptotic and at cryptographic parameters.
      computation: r4_nearby_confounds_note.md, r4_nearby_and_ptm.py -> r4_results.json, r4d_sigma.py -> r4d_sigma.json, r4d_sigma_crypto.txt
      result: breaks
      decider: >-
        (b) 'ell_1^2 ell_2^2 + ell_1^3 ell_2' plus dense sub-top terms has a
        rank-2 (non-tensor) top form, so (D4) does not apply, and still gives
        d_ff = 5 (fall_dim 2, not 4). d_ff alone therefore does not identify
        block structure; F5's converse reading is too strong. The plan's own
        object 'ell_1^3 ell_2 + ell_1 ell_2^3' gives d_ff = 6, satisfying the
        declared failure signature.
      other_findings:
        - >-
          (a) The executed all-six-shared reading IS the nearest object the
          method ceiling names and returns (6, 14) on 3 independent draws
          (package: 36/36 at 6). The literal 3-shared reading, recorded as
          degenerate and not run, gives generator degree 3 and (4, 3).
        - >-
          (c-i) No metric reads an ideal invariant directly (verified in
          run_pfdr_5726af.py: N_sol and d_solve appear only in sol_covariate),
          but CTRL-CONFOUNDERS-NAMED's 'excluded by construction' is wrong:
          the solution set reaches full_rank through the row-collapse term.
          It is excluded NUMERICALLY at the tested cells and demonstrably not
          excluded in general (R1's counterexample).
        - >-
          (c-ii) No Groebner basis, reduced-basis degree or CAS termination
          event anywhere in the run script or the meter; d_solve is None at
          every draw.
        - >-
          (c-iii) The convention question is settled by derivation and by
          measurement: c_D = C(n,D) - C(n,D-delta) is < 0 iff
          D >= floor((n+delta)/2)+1 and = 0 at the balanced degree, so
          84cdb7's ceil convention names a degree where a generic object does
          NOT fall. NULL-1 falls at the contract's value in 60/60 seeds at each
          m = 2 cell and 10/10 at each m = 3 cell. No scored comparison
          changes, because every scored comparison is against the measured
          null. Separately, 84cdb7's formula uses generator degree 2m, correct
          only at m = 2; the D_null_84cdb7 column printed at (3,2,4) and
          (3,2,5) (9 and 11) is not a comparator and should be dropped or
          annotated.
        - >-
          (d) see cost_model_challenges below.

  proves_too_much:
    assigned: true
    argument_run: '(D1) -> (D3, H-TOP) -> (D4, tensor kernel + Wilson exactness) of H-PFDR-4148b8, unchanged'
    objects:
      - object: 'mixed-block linear map, m = 2, s = 3, all six digit variables shared (as executed)'
        what_the_argument_did: 'stops at (D4): the top form is a generic degree-4 form on 6 variables (15 top terms), not a tensor product over any block split'
        closed_form_value: 'd_ff 5, fall_dim 4'
        computed_first_fall: 'd_ff 6, fall_dim 14 (3 independent coefficient draws; package 36/36 at 6)'
        failure_signature_seen: true
      - object: 'non-tensor top form ell_1^3 ell_2 + ell_1 ell_2^3 plus dense random sub-top terms, m = 2, s = 3'
        what_the_argument_did: 'stops at (D4): coefficient matrix of the top form has rank 2, so the multiplication map is not a tensor product'
        closed_form_value: 'd_ff 5'
        computed_first_fall: 'd_ff 6, fall_dim 14 (3 reps)'
        failure_signature_seen: true
      - object: 'non-tensor top form ell_1^2 ell_2^2 + ell_1^3 ell_2 plus dense random sub-top terms (added by this review as the inconvenient variant)'
        what_the_argument_did: 'stops at (D4) as above, but the CONCLUSION for d_ff re-emerges'
        closed_form_value: 'd_ff 5, fall_dim 4'
        computed_first_fall: 'd_ff 5, fall_dim 2 (3 reps)'
        failure_signature_seen: false
        survival_location: >-
          The step 'AI_p(S~) = min_k a_0(A_k, ell_k^e)'. What produces
          d_ff = delta + 1 is the mere existence of SOME degree-1 annihilator
          of the top form; being a block tensor is sufficient, not necessary.
          fall_dim still separates (2 versus 4), so the mechanism claim
          survives if it is carried by the pair, not by d_ff alone.
      - object: 'DIRECT presentation, m = 2, membership degree B = 4 = 2^s at s = 2, generators (f_1, f_2, S_3) of degrees (4, 4, 4) in F_p[x_1, x_2]'
        what_the_argument_did: 'stops at (D1): there is no squarefree quotient, so the top-form-annihilator translation has no referent and the block algebra is absent'
        closed_form_value: '5 (the digit value at s = 2)'
        computed_first_fall: >-
          d_ff 6 = B + 2, fall_dim 2; profile (4;3,3,3,0) (5;6,6,6,0)
          (6;9,9,7,2). The fall at 6 is the counting-forced one (9 rows into a
          7-dimensional degree-6 space) and the semi-regular first strictly
          negative degree of (1-z^4)^3/(1-z)^2 is also 6, so there is no early
          fall - reproducing IDEA-20260808-afe4ce.
        failure_signature_seen: true
      - object: 'out-of-regime s < 2^{m-1}: m = 3, s = 3, n = 9'
        what_the_argument_did: 'stops at the (D3)->(D4) substitution: ell_k^4 = 0 in three squarefree variables, so the claimed degree-12 top form does not exist and delta = 12 is wrong'
        closed_form_value: 'delta 12, d_ff 12'
        computed_first_fall: >-
          generator degree 9 (matching EXP-PFDR-cbdefb's '(3,2,3) generator
          degree 9'), single top monomial, d_ff 10 = n + 1, fall_dim 9 at
          D_max = 12 (cbdefb reported 'no computable arm at D_max = 7')
        failure_signature_seen: true
    verdict: >-
      The argument does NOT prove too much on the three objects the plan named
      for it plus the out-of-regime cell; it is not reading the degree profile.
      One added object produces a partial survival on d_ff only, whose location
      in the argument is named above and which re-scopes what d_ff alone can
      certify.

  objections:
    - id: OBJ-1
      severity: breaking-as-written
      target: 'H-PFDR-4148b8 (D4), second clause; prediction P2 at (2,2,2); quantifier_order'
      statement: >-
        The identity fall_dim(d_ff) = m[C(s,a_0) - C(s,a_0+e)] is stated
        without the hypothesis it needs (linear independence of the rows
        mu S~ in B) and is FALSE inside the record's own quantifier range.
        Explicit counterexample, re-checkable by a self-contained 60-line
        script with no shared code: p = 13, E: y^2 = x^3 + 12x + 3, x_R = 11,
        m = 2, s = 2 gives (5, 3), not (5, 4); likewise p = 19, a = 2, b = 15,
        x_R = 9. Both curves pass the experiment's own filter (non-singular,
        a, b nonzero, at least two on-curve x in the window), and at p = 13 all
        four window x are on the curve and x_R has 8 decompositions.
      repair: >-
        State (D4) as 'fall_dim(d_ff) = m[C(s,a_0) - C(s,a_0+e)] whenever no
        nonzero squarefree form of degree a_0 vanishes on supp(S~); a
        sufficient condition is N_sol < 2^{ms - a_0}'. The repaired statement
        is true at every draw in the package.
    - id: OBJ-2
      severity: breaking-as-written
      target: 'H-PFDR-4148b8 (D6) and prediction P3'
      statement: >-
        'The block-factored null reproduces d_ff AND fall_dim exactly' /
        'FORCED 0 at every cell' is not merely unobserved at (2,2,2) and
        (3,2,4) - it is unsatisfiable there. A homogeneous block-factored null
        at s = e is a scalar times the product of all ms variables, supported
        at one point of {0,1}^{ms}, so its fall_dim is 1 for any m, s, p. The
        clause 'and fall_dim' was added between IDEA-20260903-e1e38b (D6),
        which claims only d_ff, and the hypothesis record.
      repair: >-
        Restrict (D6)/P3 to d_ff at all cells and to fall_dim at the
        strict-early-fall cells, and record that the two boundary cells cannot
        test either integer (see OBJ-3).
    - id: OBJ-3
      severity: scope
      target: 'the evidential weight of the boundary cells (2,2,2) and (3,2,4)'
      statement: >-
        At those cells delta = n = ms, so A_delta is one-dimensional (every
        degree-delta generator has the same top form up to a scalar) and
        A_{delta+1} = 0, so top_rank = 0 and d_ff = n + 1 for EVERY generator
        of degree delta. The measured agreement of the Semaev arm, NULL-1 and
        NULL-2 on d_ff there is degree exhaustion, not a degree fall, and it
        could not have come out otherwise. Control: a dense random polynomial
        with no block structure returns (5, 4) and (13, 12) at those cells.
        Two of the seven cells in the residual table carry zero dynamic range
        on the mechanism question.
      repair: 'Score the closed form on the five strict-early-fall cells and label the two boundary cells as instrument checks.'
    - id: OBJ-4
      severity: correctness-of-justification
      target: 'H-PFDR-4148b8 (D4) exactness justification'
      statement: >-
        'for p > s every binom(k - i, t - i) is a positive integer below p' is
        false (witness s = 10, j = 4, e = 2, p = 11, entry 15 >= p); the rank
        is nevertheless full. The correct reason under p > s is Kummer/Lucas.
        The proposal had it right under 2^s <= p; the ledger record lost the
        bound and weakened the hypothesis.
      repair: 'Adopt the Kummer argument (stronger) or restore the proposal 2^s <= p bound, in a superseding annotation.'
    - id: OBJ-5
      severity: scope
      target: "the phrase 'refuted by derivation' in the hypothesis title and F6"
      statement: >-
        Refuting 84cdb7 H1 (boundedness in s) requires the LOWER bound only,
        hence H-WIL/Wilson only. The s <= 8 direct check therefore contributes
        no unconditional refutation - no finite s-range can refute a
        boundedness statement. The unconditional content is 'd_ff takes the
        closed-form values 5,5,6,6,7 at s = 2..6, m = 2, two primes'.
      repair: >-
        Write 'H1 refuted at d = 2, m = 2, conditional on Wilson's rank
        theorem; H-WIL verified directly at e = 2 for s <= 8 (package) and
        s <= 10 (this review), and at e = 4 for s <= 10 (this review)'.
    - id: OBJ-6
      severity: correctness-of-citation
      target: 'HEUR-001 random_model_justification and its supporting_results entry'
      statement: >-
        The archived EXP-ALPF-011 list [4, 4, 4, 12] is a generator-degree
        list, not a per-variable profile of S_4 - decisive because the entry
        becomes [5, 5, 5, 12] when |FB| = 5. The m = 3 inference therefore
        rested on a misread, and the supporting_results entry carries
        'verified_by: coordinator ... (file not reopened)'.
      repair: >-
        Supersede with an annotation recording that the archive supports only
        'total degree 12' and that the symbolic run RUN-PFDR-5726af-htop (and
        this review's independent reproduction) now carries m = 3, with m = 4
        added here and m >= 5 open.
    - id: OBJ-7
      severity: scope
      target: "CTRL-CONFOUNDERS-NAMED (i), 'named and excluded by construction'"
      statement: >-
        The ideal-level confound is excluded numerically, not structurally.
        full_rank(D) <= 2^{ms} - N_sol always, and the row-collapse term is
        exactly 'a degree-(D-delta) form vanishing on supp(S~)'. That is the
        channel through which OBJ-1's counterexample arrives.
      repair: "Replace 'excluded by construction' with the inequality and the margin at each tested cell."
    - id: OBJ-8
      severity: scope
      target: "the analysis's D_null_84cdb7 column at m = 3"
      statement: >-
        84cdb7's ceil((ms(d-1) + 2m)/2) uses 2m for the summation generator's
        total degree, correct only at m = 2; the digit generator has degree
        m 2^{m-1} = 12 at m = 3 (confirmed: generator_degree 12 in both m = 3
        runs). The printed values 9 and 11 are the null of a system that does
        not exist. Harmless because never scored.
      repair: 'Drop or annotate the column at m >= 3.'
    - id: OBJ-9
      severity: scope
      target: "F5 and the reading of the mixed-block result"
      statement: >-
        The mixed-block object at 6 shows that a GENERIC destruction of the
        block structure raises d_ff; it does not show that d_ff = 5 identifies
        block structure. A non-tensor top form (ell_1^2 ell_2^2 +
        ell_1^3 ell_2) gives d_ff = 5 with fall_dim 2.
      repair: 'Carry the mechanism claim on the pair (d_ff, fall_dim) or on the kernel dimension, not on d_ff alone.'
    - id: OBJ-10
      severity: replication-counting
      target: 'analysis.md table C'
      statement: 'The P3 comparison rests on 10 distinct null objects per m = 2 cell and 5 per m = 3 cell, not on 60 and 10; the null takes no curve or target input (D-NULL2-ONCE).'
      repair: 'Annotate table C as section K already does.'

  required_controls:
    - id: CTRL-RT-1
      name: 'degree-matched, structure-free null (run here; recommended as standing)'
      statement: >-
        A uniformly random homogeneous degree-delta form on all ms variables
        plus dense random sub-top terms. It holds the generator degree and the
        inhomogeneity fixed and varies ONLY the block factorisation, which
        NULL-1 does not (NULL-1 also changes the degree profile). Measured:
        (6, 14) at (2,2,3) and (14, 90) at (3,2,5) against the Semaev (5, 4)
        and (13, 12) - a clean one-degree separation at both strict cells.
    - id: CTRL-RT-2
      name: 'inhomogeneous block-factored null at the boundary cells'
      statement: >-
        The homogeneous NULL-2 is degenerate at s = e. Any successor must use
        a block-factored null WITH sub-top terms there, or drop the cell.
        Measured: (5, 4) and (13, 12), i.e. exact agreement with the Semaev
        arm, at sub-top densities 1.0 and 0.25.
    - id: CTRL-RT-3
      name: 'exhaustive small-prime sweep for the fall_dim identity'
      statement: >-
        The cheapest control that can expose the row-collapse channel, because
        the exception needs N_sol >= 2^{ms - a_0} and is therefore invisible at
        p in {4099, 65537}. Exhaustive over all non-singular curves and all
        affine targets: s = 2 at p in {5,...,41} (195,094 instances, 2
        deviations) and s = 3 at p in {11,...,23} (26,000 instances, 0
        deviations).
    - id: CTRL-RT-4
      name: 'p-sweep of the H-WIL table (dynamic range)'
      statement: >-
        The 112-cell table at p in {4099, 65537} could not have failed. Sweep
        p down through p <= s to show the control has range: 79 rank drops at
        e = 2 and 32 at e = 4, all at p <= s, none at p > s.
    - id: CTRL-RT-5
      name: 'e = 4 H-WIL cells'
      statement: 'The package checked e = 2 only. Any m = 3 closed-form claim at s > 5 needs e = 4 exactness; supplied here for s <= 10.'
    - id: CTRL-RT-6
      name: 'row-independence readout in the meter'
      statement: >-
        Record (rows, full_rank) per layer and flag full_rank < rows. It is
        free, it is exactly the hypothesis (D4) needs, and it separates a
        genuine fall from a row collapse. Post hoc it fires at 35 of 240 NULL-2
        layers and at none of the 272 Semaev or 1490 NULL-1 layers.

  counterexample_or_mutation: >-
    COUNTEREXAMPLE CERTIFICATE (docs/claims-and-verification.md 'Refutation
    artifacts', item 1). Instance: m = 2, d = 2, s = 2, p = 13,
    E: y^2 = x^3 + 12x + 3 (4a^3 + 27b^2 = 5 != 0; a, b != 0), x_R = 11.
    Frozen prediction (d_ff, fall_dim) = (5, 4); actual (5, 3). Cause: S~
    vanishes exactly on the 8 digit vectors with a_{1,0} != a_{2,0}, so the
    linear form a_{1,0} - a_{2,0} kills every row and full_rank drops from 4 to
    3. Second instance: p = 19, a = 2, b = 15, x_R = 9. Re-checked by three
    independent implementations (polynomial arithmetic in B; direct numeric
    evaluation of S_3 at all 16 digit points; a standalone point-value plus
    Moebius-transform script sharing no code with the others), all agreeing.
    Verifier: counterexample_certificate.py, prints PASS.

  baseline_comparison: >-
    Nothing on any attack axis moves, and the record says so
    (interpretation_limits; reduction_chain.core_problem: 'No attack problem is
    reduced'). A first fall degree is not a solving degree and not a cost, so
    there is no Pollard-rho / BSGS / specialized-baseline comparison to make
    and no dominated_by field to check for this claim - the honest entry is
    'not applicable, no cost claim'. The ONE cost-bearing statement in the
    record is the negative one: (D7)'s closure of IDEA-20260830-84cdb7's
    Outcome 3, which asserts that no index-calculus exponent beats rho by this
    route at d = 2. That closure is costed under cost_model_challenges and
    survives at the parameters that exist, for a reason other than the one
    given. Pollard rho at O(sqrt(N)) time and O(1) memory therefore remains the
    baseline everywhere, unchallenged and unapproached by anything in this
    package.

  heuristic_challenges:
    - id: HC-1
      heuristic: 'HEUR-001 (H-TOP)'
      challenge: >-
        The random-model justification cites an archived per-variable profile
        that does not exist (OBJ-6). After the correction the heuristic is
        supported at m = 2 by hand, at m = 3 by the package's symbolic run and
        my independent reproduction, and at m = 4 by this review (deg 32,
        coefficient 1, constant in x_R and in (a, b)). m >= 5 is an open
        symbolic obligation. The general argument offered ('the resultant
        recursion multiplies leading coefficients') is a GENERIC statement, and
        the degenerate specialisations I hit (c_1 = c_2, x_3 = x_4 kill the
        leading T-coefficient) are exactly where genericity fails, so the
        general claim needs the non-vanishing of both leading T-coefficients
        and is not established.
      cheapest_exposing_experiment: 'S_6 at m = 5 by the same one-variable specialisation; it is seconds of sympy and settles the next case.'
    - id: HC-2
      heuristic: 'HEUR-002 (H-WIL)'
      challenge: >-
        Load-bearing for exactness and therefore for the entire refutation of
        84cdb7 H1, and cited at snippet level. Its own random-model status is
        not distributional at all - it is a classical exact theorem - so the
        right challenge is transfer of the CONDITION, not of a distribution:
        the record states p > s where its source states 2^s <= p, and the
        stated reason is false under the weaker condition (OBJ-4). Direct
        computation replaces the citation for s <= 10 at e in {2, 4}.
      cheapest_exposing_experiment: >-
        Already run: sweep p including p <= s. 111 rank drops appear, all at
        p <= s; none at p > s. This also shows the condition p > s is
        sufficient but not necessary (s = 6, j = 2, p = 5 is full rank).
    - id: HC-3
      heuristic: "the unstated heuristic behind (D4)'s fall_dim clause"
      challenge: >-
        Row independence in B is an unnumbered, unstated assumption doing real
        work. Under the program's own standard (every heuristic explicit and
        numbered) it should be HEUR-003, with the rigorous bound
        N_sol < 2^{ms - a_0} attached and with the observation that the object
        it concerns - a Semaev generator, not a uniformly random polynomial -
        has a structured zero set (the decomposition set), which is precisely
        why the random model can fail.
      cheapest_exposing_experiment: 'CTRL-RT-3, already run: it produced the counterexample.'

  cost_model_challenges:
    - id: CC-1
      target: '(D7): sigma >= 1 from the reduced column count, hence Outcome 3 closed at d = 2'
      challenge: >-
        Recomputed. With T_solve >= columns^omega and
        columns ~ B^{m H(1/(2m))}, the bound is
        sigma >= omega m H(1/(2m))/(m-1), which at omega = 1 is 1.623 (m = 2),
        0.975 (m = 3), 0.725 (m = 4), 0.586 (m = 5), 0.497 (m = 6), 0.433
        (m = 7), 0.318 (m = 10). So 'sigma >= 1' is true only at m = 2, and
        asymptotically the bound falls BELOW IDEA-20260808-812554's admission
        threshold 1 - 2/(m-1) from m = 6 upward (from m = 10 with omega = 2).
        The literal claim in (D7) is wrong for every m >= 3.
      what_survives: >-
        The conclusion, for a reason the record does not give. The standing
        assumption 2^s <= p caps s (<= 256 for 256-bit p) while the regime
        condition s >= 2^{m-1} caps m at 9 for s = 256 and at 7 for s = 64
        (the beta = 1/4 balance point of 812554). At those finite points the
        EXACT column count gives sigma >= 1.015 (3, 256), 0.901 (4, 128),
        0.818 (4, 256), 0.779 (5, 256), 0.859 (6, 256), 1.031 (7, 256), 1.125
        (9, 256) - above the threshold everywhere the closed form applies.
      what_remains_open: >-
        For m >= 10 at 256-bit p, s < 2^{m-1} and the hypothesis is in its own
        excluded regime, so it closes nothing there - and 812554's table says
        large m is exactly where the admission threshold is loosest
        (m -> infinity needs only sigma < 1). The closure is weakest where the
        stake is most attractive. This should be in the record's closure text
        as forward guidance, per docs/inventor-protocol.md section 4.
    - id: CC-2
      target: "(D7)'s premise d_solve = d_ff"
      challenge: >-
        The package's own covariate says d_solve was NOT reached within D_max
        at any draw (sol(D) never fired), so the premise is not supported by
        measurement. It is conservative in direction (a larger solving degree
        only increases the column count and hence sigma), and EXP-PFDR-cbdefb's
        d_lf = d_ff at every cell makes it more plausible, so this weakens
        nothing; it should be stated as an assumption rather than as 'even
        under'.
    - id: CC-3
      target: 'memory and per-entry cost, for completeness'
      challenge: >-
        No memory claim is made and none is needed: the tested matrices are at
        most 4096 columns (32768 at m = 3, s = 5) and peak RSS is recorded per
        run (58-407 MB). At any parameter where the column count matters, the
        Macaulay matrix is dense in the sense that memory ~ columns, so the
        CC-1 column count is simultaneously the memory exponent; the sigma
        table above is therefore also a memory statement. Nothing in the
        package claims otherwise.

  reduction_and_scope_challenges:
    - id: RS-1
      statement: >-
        The title's 'refuted by derivation' and 'closed at d = 2' are the two
        strongest claims in the record and are both negative claims, so they
        carry the closure standard of docs/inventor-protocol.md section 4: a
        named obstruction, an argument, and forward guidance naming what
        remains open. The obstruction is named (the tensor factorisation of a
        monomial top form) and the argument is real, but the forward guidance
        is missing on two axes identified here: (i) the refutation is
        conditional on Wilson and unconditional nowhere (OBJ-5); (ii) the
        exponent closure does not reach m >= 10 at 256-bit p because the
        closed form is out of regime there (CC-1). Neither is a fatigue
        report; both are precise and both should be recorded.
    - id: RS-2
      statement: >-
        Scope not inflated elsewhere: the record says plainly that a first
        fall is not a solving degree, that nothing transfers to cryptographic
        s, that novelty is unverified, and that exactness is conditional. Those
        limits are correctly stated and I found no place where the analysis
        exceeds them.
    - id: RS-3
      statement: >-
        The quantifier is stated over all m, all p > 3, all s with
        2^{m-1} <= s and 2^s <= p, all non-singular curves and all affine
        targets, while the evidence is m in {2, 3}, s <= 6, two primes, three
        curves, two targets. That gap is exactly where OBJ-1's counterexample
        lives. The narrowest supported statement below removes it.
    - id: RS-4
      statement: >-
        Cross-experiment consistency, checked and favourable:
        EXP-PFDR-cbdefb's execution report records the same boundary-cell
        phenomenon from a different engine ('NULL-3 is ... a single monomial at
        s = 2 (no closure fall) although the graded-rank meter reports a fall
        there; the closure and the graded-rank definitions differ on this
        object at the boundary cell'), which independently supports OBJ-2 and
        OBJ-3 and shows the boundary-cell d_ff is itself convention-dependent.
        Its non-curve cubic arm reproduces the Semaev pair at every cell,
        supporting curve-independence from a second direction.

  proof_architecture_challenges:
    - id: PA-1
      kind: observation-fiber
      finding: >-
        Holding the observable (d_ff) fixed and varying the object places a
        non-tensor top form (ell_1^2 ell_2^2 + ell_1^3 ell_2) on the same side
        as the Semaev arm. Missing separator: the fall DIMENSION, or
        equivalently the kernel dimension of the top-form multiplication.
    - id: PA-2
      kind: quantifier-order
      finding: >-
        The construction does not choose a witness after seeing the instance -
        S~_top is fixed before any (a, b, x_R) is drawn, which is the content
        of the curve-independence claim and is correct. The quantifier defect
        is elsewhere: an unstated per-instance hypothesis (row independence)
        that the FOR ALL cannot carry (OBJ-1).
    - id: PA-3
      kind: boundary-and-strictness
      finding: >-
        The claimed baseline embedding is 'the direct presentation has its
        first non-Koszul syzygy at B + 2 > D_null = B + 1, no early fall'. I
        measured d_ff = 6 = B + 2 for the direct presentation at B = 4 and
        computed the semi-regular first-strictly-negative degree of
        (1-z^4)^3/(1-z)^2 to be 6 as well. So under the contract's OWN
        floor+1 convention the correct statement is d_ff = D_null (no early
        fall), not d_ff > D_null; the strict inequality is an artefact of the
        84cdb7 ceil convention. The embedding is genuine and the digit
        presentation's strict gain at s >= 3 is genuine; only the inequality
        sign in the baseline sentence is wrong.
    - id: PA-4
      kind: method-ceiling
      finding: >-
        The stated ceiling ('cannot certify any solving degree, any cost, any
        statement at cryptographic s, or exactness at d > 2') is honest and is
        respected by the analysis. One addition: it also cannot certify
        fall_dim outside the row-independence region, and it cannot certify
        anything at s < 2^{m-1}, which is the regime the exponent question
        reaches at m >= 10.
    - id: PA-5
      kind: nearby-object
      finding: >-
        The contract's own nearby object (NEARBY-NON-MONOMIAL-TOP) collapsed
        and tested nothing; the substitute objects are supplied here, one of
        which is the partial proves-too-much hit. The missing problem-specific
        ingredient the collapse hides is that at s = 3 a single block admits no
        degree-4 squarefree form at all, so 'non-monomial top form' must be
        built across blocks, not inside one.
    - id: PA-6
      kind: compositional-invariant
      finding: >-
        Deleting the tensor structure from the invariant breaks (D4) at the
        kernel step, as it should (mixed-block object). Deleting the
        squarefree quotient breaks it at (D1) (direct presentation). Deleting
        s >= 2^{m-1} breaks it at the substitution (the (3,2,3) object). The
        strong invariant does imply the final target where it applies.

  narrowest_supported_statement: >-
    For the d = 2 digit presentation with a single Semaev generator, in the
    squarefree ring B over F_p with the per-layer meter convention: at
    (m, s) in {(2,2), (2,3), (2,4), (2,5), (2,6), (3,4), (3,5)} and
    p in {4099, 65537}, over the 3 curves x 2 targets tested (2 targets at
    m = 3), the first fall degree is exactly
    d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1 = 5, 5, 6, 6, 7, 13, 13,
    identical across every curve, target and prime, strictly below the
    measured support-matched null at the five cells where a strict early fall
    is possible, and reproduced exactly by a curve-free block-factored null.
    The fall dimension equals m[C(s,a_0) - C(s,a_0+e)] at every draw tested,
    and equals it in general only when no nonzero squarefree form of degree
    a_0 vanishes on supp(S~) - a condition that holds whenever
    N_sol < 2^{ms - a_0} and that FAILS at explicitly exhibited instances
    (p = 13, a = 12, b = 3, x_R = 11 and p = 19, a = 2, b = 15, x_R = 9 at
    (2,2,2)), so the 'for all p, all curves, all targets' form of the fall_dim
    clause is false. The two cells with s = 2^{m-1} test neither claim: there
    d_ff = ms + 1 is forced for every generator of degree ms. Exactness rests
    on the maximal rank of multiplication by ell^e, verified directly here for
    e in {2, 4}, s <= 10, at every prime tested with p > s, and conditional on
    Wilson's theorem beyond; consequently IDEA-20260830-84cdb7's H1 is refuted
    at d = 2, m = 2 CONDITIONAL on that rank statement and unconditionally at
    no s. H-TOP holds at m = 2, 3, 4 (checked) and is open at m >= 5. Nothing
    here moves any attack cost; the closure of 84cdb7's Outcome 3 holds for
    2^s <= p <= 2^256 and every m for which the closed form applies (m <= 9 at
    s = 256, m <= 7 at s = 64), and does not reach m >= 10, where the
    presentation is in the hypothesis's own excluded regime.

  next_concrete_action: >-
    One action, cheap and decisive: run the exhaustive small-prime fall_dim
    sweep at (m, s) = (2, 3) and (3, 4) - all non-singular curves, all affine
    targets, p in {11, ..., 43} at s = 3 and p in {17, ..., 31} at s = 4 -
    with the row-independence readout (rows, full_rank) recorded per layer
    (CTRL-RT-6), to find whether the row-collapse exception exists at a
    STRICT-early-fall cell or only at the boundary cells. My sweep found it
    twice at (2,2,2) and never in 26,000 exhaustive instances at (2,2,3),
    which is suggestive but not decisive; the answer determines whether the
    repaired (D4) needs the N_sol side condition only at s = 2^{m-1} or
    everywhere, and therefore how the knowledge finding must be worded. It is
    minutes of single-core Python on 64- and 4096-column matrices and needs no
    new tooling: r1b_rowdep_sweep.py already takes (p, s) as parameters.

