red_team_report:
  id: RT-20260904-8c5f97
  task_id: TASK-20260904-8c5f97
  id_allocation_provenance: >-
    RT-* is not an allocatable ledger record type in tools/allocate_id.py and
    this report is not a ledger record, so no identifier was minted. The report
    id mirrors the handoff id supplied by the Coordinator; this agent allocated
    no identifiers and scanned no state for a next free number.
  experiment_id: EXP-PFDR-fd901a
  hypothesis_id: H-PFDR-09e1b0
  question_id: RQ-PFDR-ae2fba
  joints_owned_result:
    R1: holds
    R2: breaks
    R3: holds
    R4: breaks
  scope_of_verdict: >-
    Per-joint results above, and one verdict for the four joints owned. This is
    NOT a verdict on the whole claim, on the sibling joints V1-V4, or on any
    recorded integer: every number in the six run records that I recomputed
    reproduced exactly under an implementation sharing no code with the
    producer's. What breaks at R2 and R4 is the INTERPRETATION of what the
    experiment measured and the exclusion claimed for one named confound.

  claim_under_review: >-
    As frozen in the review plan: criterion (3) "40 of 40 paired draws identical
    on EVERY recorded invariant"; criterion (4) "0 rank-drop events in 40 draws,
    rate 0.0000, exact Clopper-Pearson 95% interval [0.0000, 0.0881]"; criterion
    (5) "Identical Semaev-minus-null table at 4099, 2^64 - 59 and the P-256
    prime, nonzero differences only at D = 5: top_rank -4, fall_dim +4, d_ff -1";
    the Semaev profile [(0,0),(1,1),(6,2),(15,1)] with d_ff = 5 and fall_dim
    [0,0,4,14] at each of the three primes; the non-curve cubic identical at
    every p; and stage 2's "B = 64: first-fall d_ff = 66, top-block-full-rank
    degree 65, frozen value 65 ... B = 128: 130 / 129 / 129, strictly_increasing
    true, first_fall_equals_frozen_integer false"; against H-PFDR-09e1b0's title
    claim of p-independence at fixed digit shape with the p-sweep as pipeline
    calibration.

  joints:
    - joint: 'R1 the derivation: generic rank, Schwartz-Zippel and the planted subvariety'
      result: holds
      attack_executed: >-
        (a) Independent symbolic expansion of S_3(ell_1, ell_2, x_R) over
        Z[A, B, x_R] from my own S_3 expression (itself checked against real
        group arithmetic, 40/40 at p = 10007), reducing a_i^2 -> a_i:
        49 entries, maximum parameter degree 2, row content 1, degree-3 entry
        content 4, degree-4 entry content 16, degree-4 part parameter-free and
        equal to 16 Q_1 Q_2. Stage 0's table reproduces exactly.
        (b) Audit of the maximal-minor bound in both forms (single minor:
        deg <= 2 r_D; product of minors as written in the ledger record).
        (c) Specialization inequality checked with the characteristic caveat
        (char-p generic rank, not char-0, is what a specialization can reach).
        (d) Planted-versus-uniform: 40 recorded planted draws plus 20 uniform
        (A, B, x_R) per prime at 4099, 2^64 - 59 and the P-256 prime, my own
        elimination.
        (e) Exact characterisation of the rank-drop locus, then an EXHAUSTIVE
        search over the whole x_R axis at p = 4099 for 19 992 random curves plus
        the 8 contract curves and 8 singular cubics.
      derivation_or_computation: >-
        Deciding steps. (i) The degree-4 part of S~ is the parameter-free
        integer form 16 Q_1 Q_2, so top_rank(D) is the rank of a fixed integer
        matrix: the D = 5 top block CANNOT drop for any (A, B, x_R) at any odd
        prime, and the explicit rank-drop point the plan asks for does not
        exist. (ii) In the multilinear quotient full_rank(D) equals the rank of
        the degree-(D-4) squarefree-monomial evaluation matrix on
        supp(S~) subset {0,1}^6, so by the multilinear minimum-weight bound
        (2^{n-k}) a drop at D = 6, 5, 4 needs at least 16, 32, 64 zeros of S~ on
        the 64-point cube. (iii) For fixed (A, B) each cube point contributes a
        QUADRATIC in x_R, so at most 128 (point, root) incidences exist and at
        most 8 values of x_R in all of F_p can carry 16 zeros: density of the
        D = 6 drop locus <= 8/p, union over D <= 14/p (against Stage 0's 44/p).
      deciding_number: >-
        Exhaustive over all 4099 targets for 19 992 curves (81 947 208
        curve-target pairs) at p = 4099: the maximum number of zeros of S~ on
        the cube is 6, against a threshold of 16. The rank-drop locus is EMPTY
        on the searched axis, and the planted design contributes exactly 2 zeros
        in 120 of 120 recorded draws. Planted and uniform profiles agree at all
        three primes.
      breaking_artifact_found: false
      breaking_artifact_note: >-
        Neither stated breaking artifact appeared: there is no p = 4099
        rank-drop point (proved structurally for the top block, exhaustively in
        x_R for the full ranks on every curve tested) and no planted-versus-
        uniform profile difference. The derivation holds, and the planted step
        is unproblematic for a reason stronger than the plan's: the locus it
        worries about is empty here, not merely thin.
      artifacts:
        - note-r1-minor-degree-and-rank-drop-locus.md
        - out/r1_symbolic_entries.json
        - out/r1_derivation.json
        - out/r1_rankdrop_locus.json

    - joint: 'R2 information content of the sweep and the inverted structural tell'
      result: breaks
      attack_executed: >-
        Derived the ENTIRE per-layer profile at (2, 2, 3) over Z from the tensor
        structure of the top form and the evaluation-rank identity, computed its
        content primes exactly (integer invariant factors of the top blocks),
        located the threshold p_0 by measurement at p = 2, 3, 5, 7, 11, 4099,
        ran the one-integer-instance prime ladder the specialization claim
        actually describes, audited the "pairing" in analysis.md against the raw
        records, and traced the artifact budget into both consuming siblings.
      derivation_or_computation: >-
        top_rank(D) = sum_{j+k=D-4} r_1(j) r_2(k) = [1, 2, 1] at D = 4, 5, 6,
        with r_k(0) = r_k(1) = 1 for multiplication by the block quadric Q_k;
        the integer top blocks have invariant factors (16), (16, 16), (16), so
        the top half is characteristic-independent away from p = 2 and 2 is the
        ONLY content prime. full_rank = [1, 6, 15] unless S~ has >= 64, 32, 16
        zeros on the cube. Hence the whole recorded vector -- profile, fall_dim
        [0,0,4,14], syzygy_dim 0, d_ff 5, deficit_series -- is forced for every
        odd p and every instance with fewer than 16 zeros.
      deciding_number: >-
        The frozen fixture triple (941, 428, 3690), taken as INTEGERS and
        reduced modulo every prime in {3, 5, 7, ..., 199, 4099, 2^64 - 59,
        P-256}, gives the reference profile at every one of them; the only
        deviating prime is 2. p_0 = 3, three orders of magnitude below the
        battery's smallest prime, and the computation costs under a second.
      breaking_artifact_found: true
      breaking_artifact_note: >-
        The joint's stated breaking artifact was produced. Consequences, stated
        narrowly: (1) criteria (3) and (5) could fail only by an instrument
        fault, so their evidence strength is the derivation's, not 120 draws';
        (2) the "40 of 40 paired" statistic is a SEED pairing, not an instance
        pairing -- curve seed 1101 is (941, 428) at 4099 and a different curve
        at each larger prime, so no instance exists at two primes and the paired
        count carries exactly the information of the marginal counts; (3)
        criterion (4)'s interval bounds an event set that is empty at the prime
        it names; (4) no reading that calls the 256-bit cells a cryptographic-
        scale validation is supportable -- they are exact ranks of a 64-column
        matrix whose value was forced before the run. The contract's own
        scale_relevance.tier "toy" and interpretation_limits already say this
        and must not be upgraded in composition.
      artifacts:
        - note-r2-forced-profile-and-content-primes.md
        - out/r2_forced_profile.json
        - out/proves_too_much.json

    - joint: 'R3 positive-control reading: provenance of the frozen 65/129 and the measured 66/130'
      result: holds
      attack_executed: >-
        Re-derived the first fall of the direct presentation at m = 2 from the
        syzygies of the top-form monomial ideal; reproduced it with my own dense
        implementation at B in {4, 5, 6, 8, 10, 12, 64, 128} and p in {4099,
        16411, 1000003, 2^64 - 59}; read IDEA-20260808-093497's actual formula;
        checked analyze.py and analysis.md for substitution of the reading;
        diffed specification.yaml against the approval commit; and tested the
        control's dynamic range on the p-axis at FIXED B.
      derivation_or_computation: >-
        The top forms are (x_1^2 x_2^2, x_1^B, x_2^B) in two variables; their
        syzygy module is generated by three lcm syzygies at degrees B + 2,
        B + 2 and 2B, so no top-form dependency exists below B + 2 and exactly
        two exist at B + 2, neither of which lifts. Therefore the contract's own
        d_ff (first D with fall_dim > 0) MUST return B + 2 with fall_dim 2. The
        frozen B + 1 is IDEA-20260808-093497's d_reg = ceil((m(B-1) + D_S)/2),
        which is ceil((2B + 2)/2) = B + 1 at m = 2, D_S = 4 -- a degree of
        regularity, and also the first degree at which the top block is of full
        column rank.
      deciding_number: >-
        My independent code returns first fall 66 with fall_dim 2 and full top
        rank at 65 for (B = 64, p = 4099), and 130 / 2 / 129 for (B = 128,
        p = 16411), with no fall below B + 2 at any B tested. The measured
        66 / 130 is correct; the frozen 65 / 129 was unsatisfiable under the
        contract's own definition.
      breaking_artifact_found: false
      breaking_artifact_note: >-
        Neither breaking artifact appeared: no derivation gives B + 1 as a first
        fall, and the reading was recorded rather than substituted (analyze.py
        keeps FROZEN.posctrl_d_ff = 65/129 and emits both
        first_fall_equals_frozen (False, False) and d_top_full_equals_frozen
        (True, True); the stopping rule's flatness test uses the FIRST-FALL
        histogram; git diff of specification.yaml against the approval commit
        c5742969 is empty). Criterion (2)'s literal failure is a contract
        transcription error, not an instrument fault. Recorded separately as
        objection RT-O5: the control's dynamic range is in B, not in p.
      artifacts:
        - note-r3-first-fall-B-plus-2.md
        - out/r3_direct_firstfall.json

    - joint: 'R4 confounds and secondary arms: CRT artifact, output-degree proxy, nodal cubic, named curve'
      result: breaks
      attack_executed: >-
        Read run_experiment.py and analyze.py for any ideal-level quantity in a
        metric or label; derived what the reported invariants are functions of;
        ran two degree-preserving mutations on all 40 recorded Semaev draws at
        each of the three primes; recomputed the non-curve arm's zero counts;
        checked the null-seed mixing against the raw records and the Semaev
        support histogram.
      derivation_or_computation: >-
        full_rank(D) is invariant under any rescaling of the nonzero values of
        S~ on the cube, hence is a function of the CRT point set Z(S~) ALONE;
        top_rank(D) is a function of the fixed integer top form ALONE. fall_dim,
        syzygy_dim, deficit_series and d_ff are functions of those two. The ideal
        generated by S~ in the membership quotient IS the vanishing ideal of
        Z(S~) -- IDEA-20260830-cb8e46 (A) for the digit encoding -- so the
        contract's exclusion of that confound "by construction, only
        generator-level observables are read" does not hold for this
        presentation.
      deciding_number: >-
        Mutation M1 (same zero set, same 49-monomial support, random
        coefficients): 40/40 draws at each of the three primes give
        [(0,0),(1,1),(6,6),(15,1)] -- the recorded NULL arm's profile exactly.
        Mutation M2 (same top form 16 Q_1 Q_2, random sub-top coefficients; NO
        curve, NO target, NO decomposition): 40/40 at each prime give
        [(0,0),(1,1),(6,2),(15,1)] -- the recorded SEMAEV profile exactly.
      breaking_artifact_found: true
      breaking_artifact_note: >-
        The first stated breaking artifact is present: an ideal-level (point-set
        determined) reading is found in four of the five reported invariants.
        The second is NOT: no arm's profile depends on the curve coefficients at
        this shape, and the nodal cubic's agreement at every prime is forced
        (identical top form; planted root gives 2 zeros, verified 40/40 per
        prime), as is the named P-256 cell's. The output-degree proxy of
        IDEA-20260807-899c5e is genuinely excluded: no Groebner basis, quotient
        dimension, solution count or solving degree appears anywhere in the
        package. The null-seed mixing (D3) is justified: the Semaev support is
        the same 49 monomials in all 40 draws at every prime, so verbatim seeds
        would have collapsed 200 null draws to 5 distinct polynomials; the mixed
        seeds are 200 distinct values per prime with 0 collisions.
      artifacts:
        - note-r4-pointset-determination.md
        - out/r4_pointset_mutation.json
        - out/r2_forced_profile.json

  proves_too_much:
    assigned: true
    objects:
      - object: 'the same (2, 2, 3) digit system at p = 2'
        argument_did: >-
          PREDICTED the drop. Every degree-4 entry has content 16, so the top
          form vanishes mod 2 and the content clause fires; the integer top
          blocks have invariant factors (16), (16, 16), (16) at D = 4, 5, 6.
        exact_rank_showed: >-
          24 uniform draws, my own code AND the producer's meter agreeing draw
          for draw: 0 of 24 at the 2^64 profile; four distinct profiles with
          top_rank [4, 6, 4, 1] at D = 3..6 and full_rank in {[4,6,4,1],
          [5,11,14,11], [6,14,16,9], [6,15,20,15]}; mean 33.3 zeros on the cube.
        failure_signature: appeared
      - object: 'the same (2, 2, 3) digit system at p = 3'
        argument_did: >-
          DECLINED as written (its bound 30/3 exceeds 1); the sharpened
          criterion of the R1 note predicts drops, because the mean zero count
          25.96 is above the 16-zero threshold for a D = 6 full-rank drop.
        exact_rank_showed: >-
          23 of 24 at the reference profile and one draw with full_rank@6 = 13,
          reproduced identically by my own code and by the meter (an independent
          route to Stage 0's 23/24).
        failure_signature: appeared
      - object: 'the inclusion map W_{1,3} (multiplication by ell^2, degree 1 to 3) on F_3[a_1..a_6]/(a_i^2), s = 6 > p = 3'
        argument_did: >-
          PARTIAL SURVIVAL, and this is the finding. Read literally ("p not
          dividing the content of P_D" with P_D a maximal minor) the argument
          declines correctly. Read as Stage 0 section 4 OPERATIONALIZES it --
          content of the ENTRIES, "content gcd = 1, so no prime divides the
          whole row ... no odd prime divides any entry's content in the table"
          -- it concludes p-independence, which is false here. The survival
          happens exactly at the entry-content-for-minor-content substitution.
        exact_rank_showed: >-
          rank by prime: p = 2 -> 0, p = 3 -> 5 (< 6 = min(C(6,1), C(6,3))),
          p = 5, 7, 11, 13, 4099 -> 6. The entries are 2! times a 0/1 inclusion
          matrix, so their content is 2 and 3 divides no entry while dropping
          the rank.
        failure_signature: >-
          survived where its conclusion is false, under the record's own
          operationalization. Repair computed here: the invariant factors of the
          (2, 2, 3) top blocks over Z are (16), (16, 16), (16), so p = 2 is the
          only content prime and Stage 0's odd-prime exclusion is, after this
          computation, correct.
      - object: 'the direct presentation with B = round(p^{1/2}) (the positive control)'
        argument_did: >-
          DECLINED, correctly: row and column counts depend on p, so there is no
          single integer matrix family and claim (A)'s size-independence
          hypothesis is absent. No p-flatness statement is derivable.
        exact_rank_showed: >-
          first fall 66 (B = 64, p = 4099) -> 130 (B = 128, p = 16411),
          reproduced independently at B in {4, 5, 6, 8, 10, 12, 64, 128}, always
          B + 2 with fall_dim 2 and full top rank at B + 1.
        failure_signature: appeared
    meter_version_recorded: >-
      out/proves_too_much.json field meter_version_sha256 lists the sha256 of
      all ten harness/macaulay_fp modules as used, matching
      harness/macaulay_fp/VALIDATION.md section 1.

  objections:
    - id: RT-O1
      target: 'H-PFDR-09e1b0.statement and IDEA-20260903-26aa81 claim (A)'
      severity: material
      statement: >-
        The committed records define P_D as the PRODUCT of the nonzero maximal
        minors and quote Prob[rank drop] <= deg(P_D)/p. At D = 6 the 15 x 64
        matrix has C(64, 15) = 159 518 999 862 720 maximal minors, so
        deg(P_D) <= 4.79e15 and the bound is VACUOUS at p = 4099 and p = 16411
        -- exactly the primes where criterion (4) claims to measure the rate.
        The usable constant (30/4099) comes from Stage 0's single-minor
        refinement, which is correct but is not in the ledger record.
      requested_fix: >-
        Any evidence or knowledge record citing the constant must cite Stage 0's
        single-minor form, or the record must be superseded with it.
    - id: RT-O2
      target: 'experiments/EXP-PFDR-fd901a/stage0-derivation.md section 4'
      severity: material
      statement: >-
        "Content primes" are computed as the gcd of the ENTRIES of the D = 4
        row and the conclusion drawn is "no odd prime divides any entry's
        content". Entry content is not minor content: proves-too-much object 2
        is a matrix of entry content 2 whose rank drops at p = 3. The check as
        implemented cannot exclude odd content primes.
      requested_fix: >-
        Replace with the integer invariant factors of the top blocks, computed
        here: (16), (16, 16), (16) at D = 4, 5, 6, so p = 2 is the only content
        prime and top_rank = [1, 2, 1] over every field of characteristic != 2.
    - id: RT-O3
      target: 'criterion (4) and the "small-p artifact budget" handed to EXP-PFDR-20ee58 and EXP-PFDR-cbdefb'
      severity: material
      statement: >-
        The reported "rate 0.0000, exact 95% CI [0, 0.0881]" is an upper bound,
        at coarseness 0.088, on an event set that is empty at p = 4099: a drop
        requires >= 16 zeros of S~ on the 64-point cube and the exhaustive x_R
        search over 19 992 curves found a maximum of 6. Both siblings consumed
        the NUMBER and its interval as a pass-threshold ("within the fd901a
        budget"); a threshold no plausible artifact rate could exceed
        discriminates nothing.
      requested_fix: >-
        Label it a derived bound, not a measurement, and replace the
        pass-threshold with the per-draw structural criterion |Z(S~)| >= 16,
        computable in 64 field evaluations per draw.
    - id: RT-O4
      target: 'analysis.md p-flatness tables ("paired by curve seed, target seed, null seed")'
      severity: material
      statement: >-
        (A, B) are drawn in F_p from the seed, so curve seed 1101 is (941, 428)
        at p = 4099 and different curves at the two larger primes; the null
        mixed seed contains p. No instance exists at two primes, so "40 of 40
        pairs identical" carries exactly the information of "all 80 draws hit
        the modal profile" and cannot test a statement about one integer point
        read modulo different primes.
      requested_fix: >-
        Report the marginal counts, and run the instance ladder (RT-C1) if the
        specialization claim is to be tested at all.
    - id: RT-O5
      target: 'CTRL-POSITIVE-P-DEPENDENCE and falsification condition F2'
      severity: material
      statement: >-
        d_ff = B + 2 is a function of B alone -- verified at fixed B = 8 across
        p = 4099, 16411 and 2^64 - 59, all giving 10. Since B = round(p^{1/2})
        is a deterministic function of p, the control's 66 -> 130 movement is
        explained entirely by the change of matrix shape, and a pipeline that
        ignored p would produce the same integers. The control therefore has NO
        dynamic range on the axis it is supposed to gate, and does not discharge
        F2 ("the instrument is blind to p") for the fixed-shape sweep. Stage 0's
        small-prime table does not close the gap either: it uses the
        sympy/naive route (independent_macaulay_ranks), not the meter.
      requested_fix: >-
        Adopt RT-C2 (already executed here): the meter itself, on the sweep's
        own construction at p = 2 and p = 3, returns a different profile and
        reproduces the p = 3 drop, so the instrument IS p-sensitive.
    - id: RT-O6
      target: 'CTRL-CONFOUNDERS-NAMED (i) and analysis.md "only generator-level rank profiles are read; no ideal-level invariant appears"'
      severity: material
      statement: >-
        full_rank(D) is invariant under rescaling of the nonzero values of S~,
        hence a function of the CRT point set Z(S~) alone; the ideal generated
        by S~ in the membership quotient is exactly I(Z(S~)), which is
        IDEA-20260830-cb8e46 (A) for the digit encoding. Four of the five
        reported invariants are therefore point-set quantities and the fifth is
        a parameter-free constant. The confound is not excluded by
        construction; it is neutralised only by the separate fact that planting
        pins |Z(S~)| = 2, far below every threshold that could move a rank.
      requested_fix: >-
        Restate the exclusion as conditional on |Z(S~)| < 16 and record the
        point-set determination as the scope of the observable.
    - id: RT-O7
      target: 'success criterion (2) as frozen'
      severity: minor
      statement: >-
        The frozen 65 / 129 is IDEA-20260808-093497's d_reg =
        ceil((m(B-1) + D_S)/2), a degree of regularity, transcribed into a
        prediction about a first fall. Under the contract's own d_ff definition
        it was unsatisfiable by any instance.
      requested_fix: >-
        Record criterion (2) as a contract transcription error with the correct
        integer B + 2, and leave the instrument uncharged.
    - id: RT-O8
      target: 'HEUR-001 (rank-drop density c_D/p) and its falsification condition F4'
      severity: material
      statement: >-
        For the Semaev arm the c/p law is the wrong functional form: a drop
        requires >= 16 zeros, a codimension->=14 coincidence, so the true rate
        at p = 4099 is 0 (exhaustively, on the x_R axis, for every curve tested)
        rather than c/p. The arm where a c/p law is real and measurable is the
        support-matched null's top_rank at D = 5 -- measured drop rate 0.2800,
        0.1835, 0.1035, 0.0935, 0.0130, 0.0005 at p = 5, 7, 11, 13, 101, 4099
        (2000 draws each), consistent with c ~ 2 -- and the contract sampled it
        with 200 draws at p = 4099, where the expected event count is 0.1.
        HEUR-001 is therefore neither supported nor tested by this experiment.
      requested_fix: >-
        Do not record HEUR-001 as supported. If it is to be tested, measure the
        null top-rank rate on the ladder p in {5, 7, 11, 13, 101} with >= 2000
        draws per rung (RT-C4).
    - id: RT-O9
      target: 'HEUR-002 / the F5 reading "Semaev-specific structure carried p-independently by exactly those integers"'
      severity: material
      statement: >-
        Mutation M2 -- the fixed top form 16 Q_1 Q_2 with random sub-top
        coefficients, containing no curve, no target, no planted decomposition
        and no Semaev polynomial beyond its top monomial x_1^2 x_2^2 --
        reproduces the recorded Semaev profile exactly, 40/40 at each of the
        three primes. The whole offset (top_rank@5 -4, fall_dim@5 +4, d_ff -1)
        is carried by a constant of the digit map at (m, s) = (2, 3). This is a
        controlled null matching the finding, so "Semaev-specific structure"
        overstates it, and the correction IDEA-20260731-009's HEUR-FF-1 needs is
        a closed-form tensor defect, not a measured offset.
      requested_fix: >-
        State the offset as derived from the top form, cite M2 as its null
        object, and change no status on IDEA-20260731-009.
    - id: RT-O10
      target: "the composition's evidence-strength and scale labels"
      severity: material
      statement: >-
        "Replicated (three primes, two independent engines)" overstates.
        EXP-PFDR-5726af's H-WIL table covers only p in {4099, 65537}, both far
        above p_0 = 3, so the second engine is a cross-implementation check of
        one forced value, not replication across the p-axis; and three primes
        are three evaluations of a forced integer. Mechanically the P-256 run
        would derive claim_tier "crypto" from its field size
        (docs/claims-and-verification.md), which for a 64-column forced rank
        would be misleading; the contract's own "toy" self-label and
        interpretation_limits are correct and must be carried through.
      requested_fix: >-
        Label the evidence "derivation confirmation plus one instrument check",
        keep tier toy with the field size disclosed, and do not assert
        cryptographic-scale validation.

  required_controls:
    - id: RT-C1
      control: >-
        ONE integer instance across a prime ladder: fix (A, B, x_R) in Z and
        reduce modulo p for p in {3, 5, ..., 199, 4099, 2^64 - 59, P-256},
        recording the profile per prime. This is what "specialization of one
        integer matrix family" means and it is the only version of the sweep
        that tests it.
      status: >-
        EXECUTED HERE for the fixture triple (941, 428, 3690): reference profile
        at every prime except 2. Runtime under one second.
    - id: RT-C2
      control: >-
        The METER (not the sympy/naive route) on the sweep's own fixed-shape
        construction at p = 2 and p = 3, i.e. a fixed-shape p-sensitivity check
        of the instrument that CTRL-POSITIVE-P-DEPENDENCE cannot provide.
      status: >-
        EXECUTED HERE: 0 of 24 at the reference profile at p = 2, 23 of 24 with
        one full_rank@6 = 13 at p = 3, matching my own code draw for draw.
    - id: RT-C3
      control: >-
        Record |Z(S~)| (the number of cube points where the generator vanishes)
        per draw, and use "|Z| >= 16" as the per-draw artifact criterion in
        place of the Clopper-Pearson interval.
      status: >-
        NOT RUN by the producer; computed here for all 120 Semaev draws (2 in
        every draw at every prime) and for the non-curve arm (2 in every draw).
    - id: RT-C4
      control: >-
        Measure the one non-forced invariant where the c/p law lives: the
        support-matched null's top_rank at D = 5, with >= 2000 draws at
        p in {5, 7, 11, 13, 101, 4099}.
      status: 'EXECUTED HERE (rates 0.2800 / 0.1835 / 0.1035 / 0.0935 / 0.0130 / 0.0005).'
    - id: RT-C5
      control: >-
        Adopt mutation M2 (top-form-only object: keep the integer top form,
        randomise everything below it) as a standing null arm for any
        fixed-shape profile claim in this lane. It is the null object that
        detects "the profile is a constant of the digit map".
      status: 'EXECUTED HERE (reproduces the Semaev profile 40/40 at all three primes).'
    - id: RT-C6
      control: >-
        Compute integer invariant factors (or the gcd of maximal minors) of any
        parameter-free block whose p-independence is asserted, in place of an
        entry-content gcd.
      status: 'EXECUTED HERE for the (2, 2, 3) top blocks: (16), (16, 16), (16).'

  counterexample_or_mutation: >-
    Mutation M2, the cheapest discriminating object: keep the parameter-free
    integer top form 16 Q_1 Q_2 of the (2, 2, 3) digit map and randomise every
    sub-top coefficient. The resulting object has no elliptic curve, no target,
    no planted decomposition and no Semaev polynomial, and it reproduces the
    recorded Semaev profile [(0,0),(1,1),(6,2),(15,1)] with d_ff = 5 and
    fall_dim [0,0,4,14] in 40 of 40 draws at p = 4099, 2^64 - 59 and the P-256
    prime. Its companion M1 (same zero set, random coefficients on the same
    support) reproduces the NULL arm's profile exactly, 40/40 at each prime.
    Together they separate the observable into (point set, top form) and show
    that neither half carries curve, target or prime information at this shape.

  baseline_comparison: >-
    No attack, cost, yield or solve is claimed anywhere in this package, so
    Pollard rho, BSGS and specialized index-calculus baselines are NOT the
    relevant comparison and asserting one would be a category error; the
    contract says so itself (interpretation_limits). The correct comparison is
    against the cheapest route to the same deliverable, and on that axis the
    experiment is dominated on every axis by two objects it does not contain:
    (i) the Stage-0 derivation extended by the tensor top-rank computation and
    the evaluation-rank identity, which yields the entire profile, its content
    primes and its threshold p_0 = 3 at ZERO compute; and (ii) the
    one-integer-instance prime ladder (RT-C1) which exhibits the same flatness
    from p = 3 to p = 2^256 in under a second, against six runs, 8 CPU-seconds
    of measured wall time and 722 recorded draws. The eliminated dimension is
    honestly charged in this case (KN-LIT-7593): the invariance that removes p
    is Stage 0, and Stage 0 is in the package and is cheap -- but the deliverable
    it eliminates was then re-measured anyway, and reported as if measured.

  heuristic_challenges:
    - heuristic: 'HEUR-001 (rank-drop density c_D/p)'
      challenge: >-
        Explicit and numbered (good). Its random-model justification is
        Schwartz-Zippel on a maximal-minor product for UNIFORM (A, B, x_R) --
        but the object is not a uniformly random point: planting fixes x_R on a
        subvariety and, more importantly, the drop event is not "a polynomial
        vanishes" but ">= 16 of 64 cube values vanish", a codimension->=14
        coincidence. The transfer therefore fails in the SAFE direction (the
        bound is valid but loose by tens of orders of magnitude at p = 4099),
        which is why 0 of 40 cannot discriminate c/p from p^{-14}. Cheapest
        experiment that exposes the deviation: the null top_rank ladder at
        p = 5..101 (RT-C4), where a real c/p rate exists and is measurable.
    - heuristic: 'HEUR-002 (shape determination) and its pre-registered failure by the integers (-4, +4, -1)'
      challenge: >-
        The pre-registered failure occurred, but M2 shows it is produced by an
        object with no Semaev, curve or target content, so the heuristic's
        failure is a property of the digit map's monomial top form. A conditional
        statement is not rejected for being conditional; what is rejected is the
        reading that the measured integers evidence Semaev-specific structure.
        Per docs/claims-and-verification.md, experimental agreement at any scale
        does not discharge either heuristic, and none is discharged here.

  cost_model_challenges:
    - >-
      No cost model is claimed, so there is nothing to recompute with hidden
      overheads; the honest cost disclosure that IS load-bearing is that the
      P-256 cells are 64-column exact ranks costing 3.25 s wall and 62 MB peak
      RSS, i.e. the "cryptographic scale" of the run is field-element size only.
      This is stated in the contract and must survive composition unchanged.
    - >-
      Per-attempt versus total expected cost does not arise (no success
      probability); the analogous bookkeeping error that DOES arise is treating
      an upper bound on an event probability as a measured rate (RT-O3).
    - >-
      Memory and time were charged and reported per run; the eliminated
      dimension (p) has its own cost charged as Stage 0, which is zero compute.

  reduction_and_scope_challenges:
    - >-
      No reduction to an attack problem is claimed and none is instantiated;
      reduction_chain.core_problem says so. Nothing to instantiate, nothing
      inflated on that axis.
    - >-
      Scope inflation risk is on the p-axis and the scale label, not on scheme
      lists: the affected scope of every statement I own is (m, d, s) = (2, 2, 3)
      at p in {4099, 2^64 - 59, P-256} plus my own auxiliary primes; nothing
      about the s-axis, yield, solving degree, cost or ECDLP follows, and the
      contract's interpretation_limits already say this correctly.
    - >-
      Do not let "reached the P-256 prime" become "validated at cryptographic
      scale". The claim-tier table derives "crypto" mechanically from field bit
      size; here that mechanical label would misdescribe a 64-column forced rank.

  proof_architecture_challenges:
    - attack: observation-fiber
      finding: >-
        The observable's fiber is enormous and I exhibited two points of it on
        each side: M1 (a different polynomial with the same zero set) lands on
        the null profile, M2 (a different polynomial with the same top form)
        lands on the Semaev profile. The missing separator is anything sensitive
        to S~ beyond (Z(S~) coarsened at 16/32/64, top form).
    - attack: quantifier-order
      finding: >-
        The derived order (FOR ALL shape THERE EXIST r_D, p_0 such that FOR ALL
        p > p_0 ...) is respected, and I can now instantiate the witnesses:
        r = [1, 6, 15] / [1, 2, 1] and p_0 = 3. No witness is chosen after
        seeing the instance.
    - attack: boundary-and-strictness
      finding: >-
        The positive control is the declared boundary object (shape varying with
        p) and it is genuinely embedded, but it is strictly better only on the
        B-axis: at fixed B the direct presentation is as p-flat as the digit one
        (d_ff = 10 at B = 8 for all three primes), so the boundary does not
        certify p-sensitivity (RT-O5).
    - attack: method-ceiling
      finding: >-
        The ceiling of this observable at (2, 2, 3) is exactly two integers
        (|Z(S~)| thresholded, and the top-form rank profile). It cannot reach
        any statement about s, yield, solving degree or cost -- which matches the
        record's own method_ceiling and is worth stating as a positive.
    - attack: nearby-object
      finding: >-
        The nodal cubic is NOT a discriminating nearby object here: it shares
        both determinants (identical top form, |Z| = 2), so its agreement is
        forced and tests nothing. A discriminating nearby object would change
        the top form -- e.g. a non-monomial degree-4 top form of the same
        support, or the s = 2 boundary cell where d_ff = D_null.
    - attack: compositional-invariant
      finding: >-
        Deleting the top form from the invariant (M1) leaves the null profile;
        deleting the point set (M2) leaves the Semaev profile. The strengthened
        invariant "profile" therefore decomposes cleanly, and neither component
        implies anything about the target problem.

  narrowest_supported_statement: >-
    At (m, d, s) = (2, 2, 3) with window [0, 8), for the planted digit-presented
    decomposition system and its support-matched null and singular-cubic arms,
    the graded Macaulay invariants recorded by EXP-PFDR-fd901a
    (full_rank [0,1,6,15], top_rank [0,1,2,1], fall_dim [0,0,4,14],
    syzygy_dim 0, d_ff 5; null top_rank@5 = 6, d_ff 6) are DERIVABLE, not
    merely observed: the top half is the rank of the parameter-free integer form
    16 Q_1 Q_2 whose integer invariant factors are (16), (16, 16), (16), hence
    p-independent for every odd p; the full half is the evaluation rank of the
    degree-(D-4) monomials on the non-vanishing set of the generator, hence
    equal to [1, 6, 15] whenever that generator has fewer than 16 zeros among the
    64 digit points. The six committed runs are consistent with this at
    p in {4099, 2^64 - 59, the P-256 prime}, and every draw I recomputed
    independently agreed exactly; the positive control's measured first fall
    B + 2 (66 and 130) is likewise the derivable value, the frozen 65 / 129 being
    a degree of regularity. Nothing here supports a claim about the s-axis, the
    solving degree, yield, cost, any curve-specific or prime-specific content at
    this shape, or any validation at cryptographic scale; and the rank-drop rate
    at p = 4099 was not measured -- it is zero by derivation and zero on an
    exhaustive search of the whole x_R axis for 19 992 curves.
  next_concrete_action: >-
    Before any further cell of this battery is read as calibration, run RT-C1
    and RT-C2 as a single sub-minute addendum under EXP-PFDR-fd901a (one integer
    instance reduced modulo the ladder p = 3..199, 4099, 2^64 - 59, P-256; and
    the meter itself on the (2, 2, 3) construction at p = 2 and p = 3), record
    |Z(S~)| per draw, and replace the "artifact budget" handed to EXP-PFDR-20ee58
    and EXP-PFDR-cbdefb with the structural criterion |Z(S~)| >= 16. Scripts and
    outputs for all of it are already in this directory and can be re-run
    verbatim.

