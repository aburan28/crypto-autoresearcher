      blocking: true
      contract: 'direct presentation, m = 2, B = round(p^{1/2}), p in {4099, 16411}, 3 curves, 2 planted targets each'
      realised: >-
        6 draws at each prime (curve seeds 2101..2103 x target seeds 1..2),
        B = 64 and B = 128 as round(sqrt(p)) requires; certificates 6 of 6 and
        6 of 6 re-verified by me
      result: present_and_forced_disposition_met
      detail: >-
        The forced disposition is "d_ff strictly increasing ... with no early
        fall. Flatness here means the instrument is blind to p and no O1 may be
        reported." Measured, and re-derived by me from per_layer: first fall 66
        at B = 64 and 130 at B = 128 (6 of 6 draws each), strictly increasing;
        fall_dim = 0 at D = 64 and D = 65, first nonzero fall_dim = 2 at D = 66,
        so there is no early fall; the instrument is not blind to p. The O1 bar
        therefore does not fire. The frozen INTEGERS are a separate matter; see
        criterion (2) below.
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: NULL-SUPPORT
      blocking: true
      contract: 'random same-support polynomial, coefficients uniform in F_p, 5 seeds per (curve, target, p)'
      realised: '200 draws per sweep prime (8 x 5 x 5) plus 25 on the named curve'
      result: present
      detail: >-
        200 distinct mixed RNG seeds per prime, 0 collisions, exactly 5 per
        (curve, target) cell. This is the null object of the same shape that
        docs/inventor-protocol.md section 3 requires before a structural
        difference may be called evidence, and it is present at every prime and
        at full count. The measured Semaev-minus-null offset (top_rank@5 -4,
        fall_dim@5 +4, d_ff -1) is therefore measured against a null, not
        against nothing. What the null arm does NOT do here is decay: it is the
        same three integers at 4099, at 2^64 - 59 and at the P-256 prime, which
        is what the derivation predicts for a p-independent quantity, so the
        usual "quantity that fails to decay is an artifact tell" reading does
        not apply on the p-axis. The axis on which a decay test WOULD be
        informative -- the shape axis s -- is out of this contract's scope and
        is stated as such by the contract itself.
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: NEARBY-NON-CURVE-CUBIC
      blocking: false
      contract: 'S_3 at (A, B) with 4A^3 + 27B^2 = 0, same digit generators, planted via a root of the formula'
      realised: '40 draws per sweep prime'
      result: present
      detail: >-
        I confirmed independently that all 120 cubics satisfy
        4A^3 + 27B^2 = 0 (so the group law genuinely does not exist there) and
        that all 120 planted x_R are genuine roots of S_3. The arm's profile is
        integer-identical to the Semaev arm at every prime, which the contract
        pre-committed to report without a direction. What that identity MEANS
        is joint R4's question, not mine.
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: CTRL-SECONDARY-DIRECT-FIXED-B
      blocking: false
      contract: 'direct presentation at fixed B = 8, m = 2, three primes, 3 curves, 2 targets'
      realised: '6 draws per sweep prime, B = 8'
      result: present
      detail: 'first fall 10 = B + 2 in 6 of 6 at each prime; top-block-full-rank degree 9 = B + 1; the same offset as the positive control.'
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: CTRL-NAMED-CURVE
      blocking: false
      contract: 'NIST P-256 named curve at the 256-bit prime'
      realised: '5 planted Semaev draws + 25 null draws in RUN-PFDR-fd901a-sweep-p256'
      result: present
      detail: >-
        a = p - 3 and b equal to the standard P-256 constant, both checked by
        me. All 5 planted certificates re-verified with my own group law and
        all 5 profiles independently recomputed: identical to the random-curve
        mode. The contract's "within the random-curve spread" test is a
        comparison against a point, since the spread has zero width (the
        executor recorded this as A3); with 5 draws over 4 distinct instances
        the arm could not have detected a rare curve-specific drop anyway.
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: CTRL-CONFOUNDERS-NAMED
      blocking: false
      contract: 'CRT/complete-splitting artifact and output-degree proxy named and excluded by construction'
      realised: 'statement in analysis.md and in the execution report'
      result: present_and_substantiated
      detail: >-
        Not merely asserted: every invariant I recomputed (245 profiles) is a
        generator-level graded rank of a Macaulay layer, computed from S~ and
        monomial multipliers alone. No Groebner basis, quotient dimension or
        solution count enters any quantity I checked. Invalidation rule 4 (a
        Groebner output degree used as a metric, a subset-column rank, or a
        timing used as evidence) does not fire in anything I recomputed.
    - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
      control: 'frozen success criterion (1)-(5), literal accounting'
      blocking: n/a
      contract: 'specification.yaml success_criterion, unchanged since the approving commit'
      realised: see below
      result: 'four of five met as written; criterion (2) not met as written'
      detail: >-
        (1) fixture agrees exactly -- MET, by the fallback route, reproduced by
        me. (2) "the positive control shows d_ff = 65 and 129 (strictly
        increasing)" -- NOT MET AS WRITTEN: under the contract's own d_ff
        definition (first D with per-layer fall_dim > 0, the definition applied
        to every other arm and stated in the manifests' conventions block) the
        measured integers are 66 and 130 in 6 of 6 draws each, which I
        re-derived from per_layer myself. The frozen integers 65 and 129 are
        exactly the recorded d_top_full (first D with top_rank = #monomials(D))
        and the recorded series d_reg = B + 1, both present per draw in the raw
        records. Strictly increasing holds under every reading. (3) 40 of 40
        >= 38 -- MET as written (see the pairing qualification above). (4) rate
        0.0000 below 0.1 with its interval reported -- MET as written on the
        rate; the interval's coverage claim is weaker than n = 40 (see the
        instance-multiplicity recomputation). (5) the Semaev-minus-null table
        identical at both large primes -- MET, and in fact identical at all
        three primes.
      prediction_integrity: >-
        `git diff c5742969 HEAD -- experiments/EXP-PFDR-fd901a/specification.yaml`
        is EMPTY: the contract is byte-identical to its approving commit
        (c5742969, 2026-09-03T19:42:47Z), which precedes the first run
        (20:29:17Z) by 46 minutes. The only change from the design commit
        (23593cc6) to approval was status review_required -> approved plus the
        approval note; preregistered_prediction, success_criterion, controls
        and invalidation_rules were untouched. No amendments directory exists
        and no amendment was recorded. There is no evidence of a prediction
        edited after execution, and the alternative reading (top-block-full-rank
        degree) is RECORDED ALONGSIDE the failing one in the raw per-draw
        records, the manifests, analysis.md and the execution report -- it was
        added, not substituted.

  heuristic_validation_checks:
    - item: pre-registered prediction
      result: pass
      detail: >-
        The prediction under test (HEUR-001's rank-drop density, with HEUR-002
        read as a secondary arm) is written in specification.yaml
        preregistered_prediction with its source (IDEA-20260903-26aa81 claims A
        and D; IDEA-20260808-093497; IDEA-20260903-e1e38b D5), frozen at the
        approving commit before any run, and verified above to be byte-unchanged
        since. This is a pre-registered prediction, not a post-hoc fit.
    - item: sample integrity
      result: pass_with_qualification
      detail: >-
        Sample size, every seed, the sampling procedure and the RNG mixing rule
        are all in the manifests, and every reported statistic recomputes from
        the raw per-draw records. The qualification is the instance
        multiplicity recorded above: the nominal sample size (40 draws per
        cell) exceeds the number of distinct sampled objects (29-31), because
        the planted-target sampler draws from a window that sometimes contains
        only two or three on-curve x-values. The manifest does record the
        window per curve, so the shortfall is derivable from the package; it is
        simply not carried into the interval.
    - item: correspondence validity
      result: pass
      detail: >-
        The substitution here is the fixed-shape specialization of one integer
        matrix family over Z[A, B, x_R] (the contract's own `correspondence`
        field), used as a sampling shortcut for THESE invariants. The contract
        states plainly that uniformity is over random (A, B) and planted x_R
        and is NOT uniform in x_R -- which is exactly the quantity HEUR-001 is
        about. The planted-versus-uniform generic-rank question that this
        non-uniformity raises is assigned to joint R1 and I do not adjudicate
        it. The digit substitution itself I verified directly: my independent
        S~ reproduces the producer's coefficient for coefficient.
    - item: scale binding
      result: pass
      detail: >-
        Bit lengths (13, 15, 64, 256), sample counts, the toy tier and the
        transfer assumption ("transfers across p at FIXED s and says nothing
        about the s-axis") are all recorded in specification.yaml
        scale_relevance and repeated in the interpretation limits. The 256-bit
        cells are exact ranks of a 64-column matrix, not solves. Nothing in
        this receipt is a cryptographic-scale result, and the package does not
        claim one.
    - item: tail checks
      result: pass
      detail: >-
        The contract's three tail checks are reported and all three are
        degenerate for the reason the executor gives in A3: every arm has a
        single profile at every prime, so "highest rank-drop cell", "deviating
        draw" and "named curve versus the spread" all evaluate against a point.
        I confirmed independently that there is no off-mode draw in any arm at
        any prime.

  cost_model_checks:
    - item: applicability
      result: not_applicable
      detail: >-
        This experiment reports no cost table, no operation-count estimate, no
        memory-time tradeoff and no claimed speedup, and the contract forbids
        using a timing as evidence (invalidation rule 4). Wall time and peak
        RSS appear only as covariates (longest run 3.25 s, peak RSS 64 MB
        against an 8 GB cap). There is therefore nothing for the cost-unit,
        memory-alongside-time or per-attempt-cost-times-inverse-success-
        probability checks to bind to. Recorded as not applicable rather than
        as passed.

  proof_architecture_checks:
    - item: baseline fixture
      result: pass
      detail: >-
        The declared baseline fixture (the (2, 2, 3), p = 4099 instance)
        reproduces exactly under three implementations in-run and a fourth
        (mine) out of run, at the coefficient level and at every degree. The
        contract's cross-contract baseline is not reproducible for the reason
        recorded under CTRL-FROZEN-FIXTURE (different instances at the same
        seed labels).
    - item: strictness witness
      result: not_applicable
      detail: >-
        No improvement over any baseline is claimed by this experiment; it is a
        calibration that changes no status. The scaled-down-instance ladder of
        docs/inventor-protocol.md section 6 has nothing to bind to here: there
        is no claimed speedup, no projection, and no partial run standing in
        for a real-scale one. The 256-bit cells are direct exact computations
        at 256 bits, not extrapolations -- what they are small in is the shape
        parameter s, which the contract says explicitly and repeatedly.
    - item: observation collisions / bounded search scope
      result: pass
      detail: >-
        Every reported count is bound to its enumerated scope: 40 draws per
        cell per prime, 200 nulls, three primes, one shape. The package does
        not convert "0 of 40" into a global statement; the executor's own A3
        and the "rank_drop_rate_versus_p" note say plainly that the falsification
        clause about the rate falling between 4099 and 64 bits cannot be tested
        for a rate that is 0 at both.
    - item: interface preservation
      result: pass
      detail: >-
        The one representation change in the pipeline -- x_k -> sum_i a_{k,i}
        d^i followed by reduction modulo a_i^2 - a_i -- is exact and I verified
        it end to end: the planted digit vector decodes to the recorded
        (x1, x2) and is a root of my independently built S~ in 245 of 245
        draws.
    - item: ceiling and nearby control
      result: pass
      detail: >-
        The pre-registered nearby object (the nodal non-curve cubic) was run
        with the identical implementation at all three primes, 40 draws each,
        and its result is reported rather than suppressed.
    - item: quantifier fidelity
      result: pass_with_note
      detail: >-
        Per-draw invariants are reported per draw and the modal profile is
        labelled as modal; no per-instance witness is presented as a uniform
        one. The note is the pairing point recorded under V2: "identical in 40
        of 40 paired draws" reads as a per-object statement but is a per-label
        one, since no object is shared between the two primes.

  verdict: passed

  verdict_scope: >-
    `passed` means exactly this: the six-run package of EXP-PFDR-fd901a is an
    admissible research receipt for the joints assigned to
    TASK-20260904-4c0d7d. Its artifacts are present and hash-bound to a
    Coordinator-committed snapshot, its pinned code and meter are identical
    across runs and reproduce their self-test, its primes are prime, its seeds
    are the frozen seeds, its summary tables are what the raw records say, its
    certificates re-verify under an implementation that shares no code with the
    producer's, and its rank profile at 2^64 - 59 and at the P-256 prime is
    reproduced exactly by an independent elimination. It does NOT mean that
    criterion (2) was met (it was not, as written), that H-PFDR-09e1b0 is
    supported, that HEUR-001 or HEUR-002 is validated, that any speedup or
    ECDLP claim is licensed, or that any promotion is authorised. Nothing in
    this report changes any status.

  limitations:
    - >-
      I own joints V1-V4 only. The derivation itself (generic rank,
      Schwartz-Zippel, the planted subvariety), the information content of the
      sweep, the provenance of the frozen 65/129, and the confound/secondary-arm
      reading are joints R1-R4 of TASK-20260904-8c5f97 and I neither checked
      nor voted on them. In particular: whether the (2, 2, 3) profile was forced
      before the sweep ran, and therefore what the 40-of-40 agreements are
      evidence OF, is not decided here.
    - >-
      Ten inference sub-fields required by the Minimum run manifest of
      docs/evidence-and-reproducibility.md are absent from all six manifests
      (canonical_policy, backend, provider, model_provenance, model_verified,
      requested_reasoning_effort, fallback_reason, degraded_requirements,
      independent_session, config_digest), caused by the disclosed D9 harness
      defect. Most content survives in inputs.parameters.
      executor_session_inference; config_digest and model_provenance are absent
      everywhere. No measured quantity depends on them.
    - >-
      The reported exact Clopper-Pearson interval [0, 0.0881] for criterion (4)
      treats 40 draws as 40 independent trials. The graded profile is a
      deterministic function of (A, B, x_R) and only 31 distinct triples occur
      at p = 4099 (30 at 2^64 - 59, 29 at the P-256 prime), so the honest exact
      upper bound is 0.1122 at 4099 -- above the criterion's own 0.1 threshold.
      Criterion (4) is still met as written, because what the frozen text
      requires below 0.1 is the RATE (0.0000), but the interval should not be
      quoted as if it were below 0.1.
    - >-
      The 64-bit and 256-bit draws share no (A, B, x_R) triple and no null RNG
      seed, so the "40 of 40 paired" reading is a pairing of seed labels. With
      zero within-arm spread at every prime, the pairing carries no information
      beyond the equality of the two modal profiles.
    - >-
      The null_support arm's polynomials cannot be rebuilt from the run package
      (only the mixed RNG seed is stored, not the coefficients), so its 200
      draws per prime were checked for internal consistency and seed
      distinctness but NOT independently recomputed. The positive-control and
      secondary-direct ranks and the syzygy_dim / deficit_series columns were
      likewise not independently recomputed; the first two are outside the
      plan's V3 scope and the last needs the producer's series convention.
    - >-
      The contract's primary frozen-fixture route (agreement with
      EXP-PFDR-5726af on the SAME instance) is not executable from these
      artifacts in either direction, because the two contracts derive different
      (A, B, x_R) from the same seed labels. The fallback route was the
      applicable one and it passed; no cross-contract same-instance agreement
      may be claimed.
    - >-
      Scope of everything above: toy tier, one digit shape (2, 2, 3), a
      64-column matrix, three primes, one solver, one host. Nothing here touches
      the s-axis, yield, cost, or ECDLP.
    - >-
      I did not re-execute the producer's runs. Reproduction was by
      recomputation from the committed raw records plus independent
      construction of the objects they describe; the executor's own
      re-run-from-command check (recorded in execution-report.yaml
      completion_gate.reproduction_check) is the producer's claim, not mine.

