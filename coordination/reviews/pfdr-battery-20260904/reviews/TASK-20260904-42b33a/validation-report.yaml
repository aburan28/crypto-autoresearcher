  joints:
    - joint: 'V1 blind re-derivation of (d_ff, d_lf) under the HKY closure on the declared subsample and the slope over s = 2..5'
      result: holds
      attack_executed: >-
        Implemented the quantity from its statement with my own code: S~ =
        S_3(ell_1, ell_2, x_R) built from the formula given, the field equations,
        and V_{F,D} for D = 0..7 computed to a fixed point by exact linear algebra
        mod p. Ran all 48 systems. Executed the literal polynomial-ring reading in
        R = F_p[a] with the field equations adjoined at s = 2 (12/12 instances) and
        s = 3 (1 instance) and proved the general equivalence with the squarefree
        computation used at s = 4, 5. Fitted d_lf on s per draw, per (s,p) cell and
        per s with 95 percent t-intervals, and evaluated the contract's rule on each.
      deciding_fact: >-
        Every one of the 48 systems gives exactly (5,5), (5,5), (6,6), (6,6) at
        s = 2..5 with a single fall degree, uncensored under my own certificate.
        No breaking artifact exists: no (s, instance) departs from the pattern and
        no system has more than one fall degree. The slope is 0.4 on all three
        aggregations; the interval is [0.3406, 0.4594] per draw, [0.2591, 0.5409]
        per cell and [-0.2085, 1.0085] on the four independent s-points, and the
        contract's label is UNRESOLVED on all three.
      qualification: >-
        The quantity is CONVENTION-DEPENDENT and I can bound how much. A third
        reading -- the quotient ring with the condition deg_B(h v) <= D instead of
        deg(h) + deg_B(v) <= D, i.e. allowing degree-D elements to be multiplied
        because idempotency keeps the product's reduced degree at D -- gives the
        ladder 4, 5, 5, 6 and a four-point slope of 0.6 instead of 0.4. It is NOT
        the reading the plan designates, and it is NOT the plan's named reduced-ring
        variant (which multiplies only elements of degree <= D-1 and is the reading
        I proved equivalent to the literal one). The producer's convention_id string
        in all 23 manifests -- 'cumulative-Macaulay W0 + V_{F,D-1}; fallen x
        variables to fixed point; reduced degree; fall iff dim(V_D cap B_{<=D-1}) >
        dim V_{D-1}' -- describes the designated reading, not the third one:
        multiplying FALLEN elements (degree <= D-1) by VARIABLES is exactly the
        constraint I implemented, seeding with V_{F,D-1} is a no-op by monotonicity,
        and the fall test is identical. So the agreement is on the intended object.
    - joint: 'V2 run-set validity, manifest schema and pinning, the two closure.py hashes, the convention hash binding, seeds'
      result: breaks
      attack_executed: >-
        Checked all 23 run directories for the seven files, recomputed every sidecar
        hash, parsed every manifest strictly, compared status / commit / dirty /
        pinned source hashes / seeds / D_max / plant_window / engine_policy / budget /
        timing source / stderr size / session inference, recomputed the convention
        hash without opening the file, recomputed the 14 meter hashes against
        VALIDATION.md, verified the dense exactness bound arithmetically, counted
        runs and wall time against the caps, and searched git history for both
        closure.py blobs.
      deciding_fact: >-
        Nothing on the plan's breaking-artifact list fires: no hash mismatch, no
        third closure.py version, the convention hash matches the file, the seed
        sets are the contract's (3101-3108 x 1-5 with null seeds 7, 11, 13, 17, 19
        in the 15 ladder cells; 1101-1103 x 1-2 in the dff-agreement run; 3101-3103
        for the equal-d^s and m = 3 cells), D_max is 7 and plant_window 4 wherever
        the contract says so, and the exactness bound holds with a 2164x margin at
        p = 65537 and 968 columns. The joint nonetheless BREAKS on a fact the plan
        did not anticipate: closure.py 74e659bb -- the version that produced
        RUN-PFDR-cbdefb-fixture, -s1-slice and -dff-agreement, i.e. all three
        blocking instrument controls in their Stage-1 form -- exists in NO reachable
        commit and not in the tree. Those three receipts pin a file that no longer
        exists, so they cannot be re-run, and the plan's own disposition for this
        joint ('a disclosed change whose metric-neutrality only the red team, who
        may read the file, can judge') is not executable by anyone.
      scope_of_the_break: >-
        The 20 runs that produced EVERY number in the ladder, the equal-d^s cells
        and the m = 3 cells are pinned to 63475db5, which is committed in a3a81e33
        and hashes identically in the tree; those receipts are reproducible. The
        break is confined to the three Stage-1 control runs, and it is partly
        mitigated: the s = 1 floor was re-measured under 63475db5 in the three
        m2-s1 ladder cells, and the closure-vs-graded d_ff identity (P1) is
        recomputed inside all 15 ladder cells under 63475db5. What is unmitigated
        is the comparison against EXP-PFDR-5726af's recorded values, which exists
        only under the lost version -- and which my own independent re-derivation
        of the (1101, 1) instance reproduces.
    - joint: 'V3 instance and certificate checks on the declared subsample and the distinct-instance count'
      result: holds
      attack_executed: >-
        Rebuilt each of the 12 declared instances with my own F_p and elliptic-curve
        arithmetic (Tonelli-Shanks for p = 65537): discriminant, j-invariant,
        on-curve x in [0,4), all window points with both signs, every x(P_1 + P_2)
        over ordered pairs including doublings, and the digit solution set of S~ at
        each s by a subset transform.
      deciding_fact: >-
        No breaking artifact: every declared x_R is a window-pair sum with an
        exhibited witness, every curve is non-singular with generic j, and every
        digit solution lies in the window. The distinct-system bound: a curve
        contributes at most as many distinct generator systems as it has reachable
        x(P_1 + P_2), which is 9 for the four curves with three on-curve window x
        and 4 for the two curves (both at p = 16411) with two. A curve of the second
        kind cannot supply 5 distinct targets, so at least one duplicate per such
        curve is FORCED -- which is exactly the plan's declared duplicate at
        p = 16411 curve 3101 (target seeds 2 and 3 share x_R = 4634). A cell
        therefore holds at most 8 x 9 = 72 and at least 8 x 4 = 32 distinct systems
        among its 40 draws, so the distinct-system count alone does not collapse
        n = 40 by much.
      stronger_replication_finding: >-
        The binding replication fact is not the distinct-system count but the
        observable's variance: (d_ff, d_lf) is the SAME integer pair on all 12
        instances at each s, across two curves, two targets and three primes, and
        the manifests record a single distinct pair among all 40 draws of every
        cell. Within-cell variance is exactly 0. The 480 draws behind the reported
        fit are therefore 4 numbers, and the per-draw standard error shrinks as
        1/sqrt(480) for no statistical reason. Evaluating the reported statistic on
        independent units is joint R1's business; the zero-variance fact is mine and
        I record it as measured.
      unexpected_observation: >-
        Three of the twelve declared instances have a DEGENERATE decomposition: the
        only digit solution is diagonal, ell_1 = ell_2, so x_R = x(2P) rather than
        x(P_1 + P_2) for distinct points -- p = 65537 curve 3101 target 1 gives
        (0,0), target 2 gives (1,1), and curve 3102 target 2 gives (3,3). These are
        legitimate window pairs and the pair (d_ff, d_lf) is unaffected, but a
        quarter of the subsample carries a doubling rather than a genuine
        two-summand decomposition and the solution set has size 1 rather than 2.
        Recorded as an unexpected observation under AGENTS.md rule 8.
      limitation: >-
        The manifests do not record per-draw (a, b, x_R); those live in
        raw-result.json, which is blind_from for me. I therefore could not compare
        the plan's transcribed triples with a producer artifact. What I could
        establish is internal validity, which is nearly as strong: a mis-transcribed
        x_R would fail the window-pair-sum test except with probability about 9/p.
    - joint: 'V4 CTRL-DFF-AGREEMENT and cross-engine coverage from the manifests'
      result: holds
      attack_executed: >-
        Read the dff-agreement manifest and the four EXP-PFDR-5726af cell manifests,
        verified the pinned sibling raw-result.json hashes by hashing (not opening),
        tabulated engine / cross_checked / cross_check_agree_all / censoring /
        iteration counts / P1 per cell per arm from the 15 ladder manifests, and
        re-derived the (1101, 1) agreement instance with my own closure.
      deciding_fact: >-
        No breaking artifact: no dff-agreement row disagrees with 5726af's recorded
        value (24/24, disagreements empty, same_instance_all true), no censored
        Semaev draw exists anywhere on the ladder (right_censored 0 and
        no_fall_in_window 0 in all 15 cells), and no cell has a false cross-check
        flag. 5726af's own manifests record 5, 5, 6, 6, and my independent closure
        returns 5, 5, 6, 6 on the same instance.
      limitation: >-
        Cross-engine coverage is 40/40 at s <= 4 and 1/40 at s = 5, so 117 of the
        120 s = 5 Semaev draws rest on the dense engine alone. That engine is not
        the validated meter: harness/macaulay_fp/VALIDATION.md states 'no floating
        point anywhere in a rank', so the dense float64 path lives in closure.py and
        its correctness rests on the declared exactness bound rather than on the
        meter's test suite. The bound holds at the recorded sizes; the code that
        applies it is outside my read set.

  heuristic_validation_checks:
    - check: 'pre-registered prediction'
      result: pass
      detail: >-
        The frozen contract (specification.yaml, approved 2026-09-03, DEC-20260903-93862f)
        pre-registers d_ff = 5, 5, 6, 6 at s = 2..5, the null band c in {0,1,2}, the
        three-outcome rule and the joint-label reconciliation, before any run. My
        blind re-derivation reproduces the d_ff prediction exactly on 48 systems.
        The prediction was not fitted after the data.
    - check: 'sample integrity (sizes, seeds, procedure in the manifest)'
      result: pass
      detail: 'seeds, curve/target/null seed sets, window, D_max, per-cell draw counts (40 Semaev, 200 NULL-1, 5 NULL-2, 5 NULL-3, 40 non-curve) are all in the manifests and match the contract'
    - check: 'correspondence validity'
      result: not_applicable
      detail: 'no correspondence or substitute sampler is used; all systems are computed directly at the tested primes'
    - check: 'scale binding'
      result: pass_with_limitation
      detail: >-
        The contract labels the tier toy (p <= 2^16, s <= 5, <= 1024 columns) and
        states that no transfer in s is claimed. My re-derivation is at exactly that
        scale and carries no transfer either. The measured law d_ff = d_lf =
        4 + floor(s/2) is a statement about s in {2,3,4,5} only: four points at
        resolution 0.25.
    - check: "HEUR-001 band, where testable"
      result: recorded
      detail: 'null band offsets 0, 1, 1, 1 at s = 1..4 (inside {0,1,2}); at s = 5 all null draws are right-censored by D_max = 7, so the top cell of the null is not testable'
    - check: "HEUR-002 falsifier statistic"
      result: aggregation_dependent
      detail: 'see metric_recomputations; true per draw and per cell, false on the four independent s-points'

  cost_model_checks:
    - check: 'concrete cost table present in this experiment'
      result: not_applicable
      detail: >-
        EXP-PFDR-cbdefb produces no cost table; the cost consequences of a measured
        D_0(s) belong to EXP-PFDR-c04716 / H-PFDR-06fd60 and are outside this
        experiment and outside my joints. I record only the datum they would need:
        my own closure reaches the full ideal cap at D = 4 + floor(s/2) on every one
        of the 48 systems, so the solving degree measured here GROWS with s and is
        6 already at s = 4, 5. Any cost statement that assumes a constant D_0 <= 6
        must state what it does at s >= 6, which this ladder does not test.
    - check: 'resource records present per run'
      result: pass
      detail: 'peak_rss_bytes and cpu_seconds in all 23 manifests; per-cell pre-flight column counts, dense-equivalent byte bounds and the 50000-column / 4 GiB caps recorded and within contract in every ladder cell'

  proof_architecture_checks:
    - check: 'baseline fixture reproduces exactly'
      result: pass_at_the_ladder_level
      detail: >-
        The inherited d_ff law (H-PFDR-4148b8 / IDEA-20260903-e1e38b: 5, 5, 6, 6) is
        reproduced exactly by an independent implementation on 48 systems and by the
        dff-agreement control against EXP-PFDR-5726af. The known-answer fixture run
        itself is one of the three runs whose code is not retained (see V2).
    - check: 'quantifier fidelity'
      result: pass
      detail: >-
        Nothing I computed licenses 'there exists D_0 for all s'. What is measured is
        'for all cells of the declared ladder, the pair and the fitted slope', which
        is what H-PFDR-c88f14's proof_search_map.quantifier_order says is claimed.
    - check: 'ceiling and nearby control'
      result: recorded
      detail: 'the non-curve cubic reproduces the Semaev pair in all 15 cells; the interpretation of that is joint R4, not mine'

  verdict: incomplete
  verdict_rationale: >-
    The load-bearing quantity is confirmed. An implementation that never saw the
    producer's code, notes or report reproduces (d_ff, d_lf) = (5,5), (5,5), (6,6),
    (6,6) on all 48 systems of the declared subsample, reproduces the
    CTRL-DFF-AGREEMENT instance, and obtains the same slope 0.4; the run set is
    schema-complete, hash-consistent, correctly seeded, within budget, and its
    convention hash and meter pinning bind. The receipt is nevertheless INCOMPLETE
    rather than passed, for one reason that cannot be repaired: three of the 23
    runs -- the known-answer fixture, the s = 1 baseline slice and the
    d_ff-agreement control, i.e. all three blocking instrument controls in their
    Stage-1 form -- pin a closure.py version that is retained in no commit and no
    working tree. A pin to a blob nobody has is not retention, those three runs
    cannot be re-run, and no reviewer can judge whether the change between the two
    versions was metric-neutral. Per docs/evidence-and-reproducibility.md a missing
    reproduction-package element is incomplete evidence, not invalid evidence: I
    found no wrong number anywhere, and the numbers the controls were meant to
    guard are independently confirmed by this re-derivation, which is why the
    verdict is incomplete and not failed. Admissibility of the 20 measurement runs
    is not in question. This verdict is about the receipt only. It supports no
    ECDLP claim, demonstrates no speedup, and authorises no promotion or status
    change.

  limitations:
    - >-
      I own four joints of ten. Joints R0-R5 and the proves-too-much control are
      invisible to me by construction, and nothing here is a verdict on the claim.
    - >-
      closure.py 74e659bb is retained nowhere, so the metric-neutrality of the
      disclosed code change cannot be established by me or by any later reviewer.
      The remedy is not a re-read: it is a re-run of the three Stage-1 controls
      under the retained version 63475db5, which would cost about 13 minutes
      (dff-agreement was 762 s, the other two under 25 s).
    - >-
      117 of the 120 s = 5 Semaev draws rest on the dense float64 engine with no
      second engine agreeing. The engine's exactness bound is declared and I
      verified it holds arithmetically at p = 65537 with 968 columns (margin 2164x),
      but the code implementing it is in blind_from and the validated meter
      explicitly contains no floating point in a rank. My own independent
      computation at s = 5 used a different exact method and agrees on all 12
      instances, which is the strongest cross-check available to me.
    - >-
      The quantity is convention-dependent at the level that matters: a defensible
      third reading of 'closed under multiplication' in the quotient ring moves the
      ladder from 5, 5, 6, 6 to 4, 5, 5, 6 and the slope from 0.4 to 0.6. My
      primary reading is the one the plan designates, and the manifests'
      convention_id string describes that same reading, but the frozen convention
      document itself is load-bearing for every number in the package and I did not
      open it (only hashed it).
    - >-
      My subsample is 12 of the 120 draws per cell (2 curves of 8, 2 targets of 5,
      all three primes). Because the manifests record a single distinct pair per
      cell, agreement on my 12 implies agreement with every recorded draw; but I
      verified 12 instances, not 120, and only the Semaev arm.
    - >-
      Pass counts are not comparable between implementations without stating the
      multiplier granularity. The producer's convention multiplies fallen elements
      by VARIABLES; mine multiplies them by ALL monomials of the admissible degree.
      Both reach the same fixed point (iterating single variables generates every
      admissible monomial multiple, since the intermediate degrees stay within the
      bound), but the producer's counts are necessarily larger: their
      min_iteration_count_at_falls is 3, 5, 6, 8 at s = 2..5 against my 2, 4, 4, 5.
      Any comparison of iteration counts across the two must say which convention it
      is using; CTRL-ITERATION-COUNT's floor of 2 is met under both.
    - >-
      run.inference in all 23 manifests is an abbreviated block missing 10 template
      fields and naming the legacy policy alias; the content is present under
      inputs.parameters.session_inference. Disclosed as a schema deviation.
    - >-
      Three of my twelve instances carry a doubling (ell_1 = ell_2) rather than a
      two-summand decomposition.
    - >-
      Everything here is at the contract's declared toy scale: p <= 2^16, s <= 5,
      at most 968 columns, four points on the s-axis at resolution 0.25. No
      statement about larger s or about any cryptographic parameter follows.

