        common d_lf: the longest such run is 2 (s = 2,3 at 5 and s = 4,5 at 6), so
        the flat clause fails on the integers themselves at every aggregation.
    - metric: "HEUR-002 falsifier statistic ('the d_lf interval excludes 0')"
      recomputed: 'TRUE on the per-draw fit [0.3406, 0.4594] and on the per-cell fit [0.2591, 0.5409]; FALSE on the per-s fit [-0.2085, 1.0085]'
      note: >-
        Reported as a recomputation, not as a judgement. Whether the statistic is a
        valid instrument is joint R1, which I do not own. What I can say from my own
        numbers: the statistic's truth value is decided entirely by which
        aggregation is used, and the aggregation with independent units is the one
        on which it is false.
    - metric: 'analytic reproduction of the producer-reported n = 480 fit'
