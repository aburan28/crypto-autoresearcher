rederivation:
  task_id: TASK-20260904-42b33a
  experiment_id: EXP-PFDR-cbdefb
  hypothesis_id: H-PFDR-c88f14
  phase: A
  written_at_utc: '2026-09-04T02:34:02Z'
  derived_from:
    - ledger/handoffs/TASK-20260904-42b33a.yaml (review_plan.blind_rederivation: quantity + parameters)
    - ledger/hypotheses/H-PFDR-c88f14.yaml (statement (A)/(B) and mechanism)
    - experiments/EXP-PFDR-cbdefb/specification.yaml (contract: D_max, arms, rule)
  producer_artifacts_read: none (blind_from respected; see review_attestation)

  quantity_as_implemented:
    ring_primary: >-
      READING 1, literal polynomial ring. R = F_p[a_{1,0..s-1}, a_{2,0..s-1}],
      n = 2s, F = { S~ } u { a_{k,i}^2 - a_{k,i} } with S~ = S_3(ell_1, ell_2, x_R)
      reduced modulo the field equations (multilinear representative, deg_B 4 for
      s >= 2). V_{F,D} = smallest F_p-subspace of R_{<=D} containing F n R_{<=D}
      and closed under v -> h v for every MONOMIAL h with deg(h) + deg(v) <= D
      (in a domain deg(h v) = deg h + deg v, so this is the definition verbatim).
    fall_test: 'fall at D  <=>  dim(V_{F,D} n R_{<=D-1}) > dim V_{F,D-1}'
    d_ff: least D <= D_max = 7 with a fall
    d_lf: greatest D <= D_max = 7 with a fall
    computed_in: >-
      the squarefree quotient B = R/(a_i^2 - a_i) with the multiplication condition
      deg(h) + deg_B(v) <= D (call it reading 2a), which is the plan's named
      'reduced-ring variant, multiplying only the elements of degree <= D - 1'.
      Reading 1 and reading 2a have IDENTICAL fall histories; this is proved in the
      validation report (equivalence lemma) and verified numerically by running
      reading 1 literally in R at s = 2 (all 12 instances) and s = 3 (1 instance).
    linear_algebra: >-
      own float64-exact Gaussian elimination mod p (entries < p, at most N terms per
      inner product, N (p-1)^2 < 2^53 asserted at construction); harness/macaulay_fp
      is NOT imported anywhere.
    pass_count_convention: >-
      iteration_count = 1 + productive_rounds, where round 0 is the degree-<=D
      Macaulay row space span{ h S~ : deg h <= D - 4 } and a round is productive if
      it strictly increases dim. rounds_executed is also recorded. A round that
      reaches dim = dim(I(Z) n B_{<=D}) is a proven fixed point (V is always inside
      the ideal cap), so the confirming no-growth round is skipped there.
    censoring_basis: >-
      OWN CERTIFICATE (derived from the definition, not read from any producer
      artifact). B = R/(a^2-a) is a product of copies of F_p, so the ideal generated
      by S~ in B is exactly I(Z) with Z = { z in {0,1}^n : S~(z) = 0 }, and
      V_{F,D} is contained in J_D := I(Z) n B_{<=D} for every D. LEMMA: if the
      evaluation map B_{<=D-1} -> F_p^Z is surjective then J_{D+1} = J_D + sum_i a_i
      J_D. COROLLARY: if V_{F,7} = J_7 and rank(eval on B_{<=6}) = |Z|, then
      V_{F,D} = J_D and there is NO fall at any D > 7, so the draw is uncensored.
      Both premises are recorded per draw below and hold on all 48 systems.
      The plan's structural criterion (D_max >= n + 1) additionally holds for s <= 3.

