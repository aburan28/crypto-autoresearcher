        every instance run, which is the equivalence lemma's dimension count.
    reading_2b_reduced_ring_with_deg_B_of_the_product:
      what: >-
        B = R/(a^2-a) with the multiplication condition deg_B(h v) <= D instead of
        deg(h) + deg_B(v) <= D. This is NOT the reading the plan designates and NOT
        the plan's named reduced-ring variant (which multiplies only elements of
        degree <= D-1, i.e. reading 2a). It is reported because it is the reading an
        implementation that works in the quotient can slip into, and it MOVES the
        answer.
