    - id: P3
      frozen_wording: "argmin_k C(k) under HEUR-001 at D_0 in {4,6,8}, n = ms in the hundreds: FORCED k* = 0 with C increasing in k until n - k falls below 3.41 D_0 (omega 2) or 4.57 D_0 (omega 2.807)"
      reported: "k* = 0 at 50/54 table cells; k* = leaf at 4 cells, all at 64 bits; at (64, m 5, D_0 8, omega 2.807) the ratio first drops below 1 at k = 131, residual 34, prediction 36.56"
      verified:
        under_the_frozen_C_k_formula_alone: "k* = 0 at 54 of 54 cells (my independent computation), matching the archived field bounded_argmin_k_formula_leaf = 0 at 54/54"
        under_the_model_including_the_root_finding_leaf: "k* != 0 at exactly 4 cells, and my independent leaf probe selects the SAME four: (64, m 3, D_0 6, omega 2.807), (64, m 3, D_0 8, omega 2), (64, m 3, D_0 8, omega 2.807), (64, m 4, D_0 8, omega 2.807)"
        second_clause: "reproduced independently: the marginal ratio drops below 1 inside the guessing range at exactly 1 of 54 cells, (64, m 5, D_0 8, omega 2.807), at residual 33-34 against the predicted crossing 36.5616 (my crossing constants 13.66/20.49/27.31 at omega 2 and 18.28/27.42/36.56 at omega 2.807 equal the reported ones)"
      is_P3_contradicted_or_out_of_scope: >-
        NOT out of scope. P3's scope is "n = ms in the hundreds"; the four
        exception cells have n = 119, 110, 139, 154 -- all in the hundreds --
        so the scope clause does not excuse them. Whether P3 is contradicted
        depends on which cost function "C(k)" names: under the C(k) frozen in
        specification.inputs.cost_model (C(k) = 2^k Ncols(n-k, D(k))^omega)
        P3 holds at 54/54; under the same model plus the enumeration-leaf
        charge frozen in H-PFDR-06fd60.assumptions ("enumeration leaf charged
        by root-finding plus O(1) lookup") it fails at 4/54. The package
        emits BOTH argmins per cell and reports the failing reading as
        anomaly A1 rather than selecting the flattering one. No cell's
        tabulated T changes either way: all 54 T values use the k = 0 charge.
      met: "yes under the formula-only reading; no at 4 of 54 cells under the leaf-charge reading; both readings emitted by the package"

    - id: P4
      frozen_wording: "the D_0 threshold at which T crosses rho at log2 N = 256, per (m, omega): m 5 omega 2 between 8 and 10; m 5 omega 2.807 between 4 and 6; m 4 omega 2 below 4"
      reported: "all three match the frozen brackets"
      verified: "all three brackets reproduced exactly (see item 4)"
      met: true

    - id: P5
      frozen_wording: "interior-band optimum under HEUR-002 only: cost 2^{k_c} binom(2(D_0 - m), D_0)^omega with k_c = n - 2(D_0 - m), exponential in n"
      reported: "A2: 'P5's binomial binom(2(D_0-m), D_0) is zero at 7 of the 9 (m, D_0) pairs, and k_c is outside the guessing range at every table cell'"
      verified:
        binomial_zero_pairs_recomputed: 6
        binomial_zero_pairs_in_the_emitted_artifact: 6
        binomial_zero_pairs_claimed_in_the_execution_report: 7
        discrepancy: "-1 pair: the execution report's anomaly A2 (and the same sentence in its embedded execution_report.observations) overstates the count by one. thresholds.yaml.interior_band_HEUR002_only_fixture_ms carries binom = 0 at exactly 6 of the 9 (m, D_0) pairs -- (3,4), (4,4), (4,6), (5,4), (5,6), (5,8) -- and nonzero at (3,6) = 1, (3,8) = 45, (4,8) = 1. My independent computation gives the same 6. The report's own P5 prose section states the correct RULE ('zero whenever D_0 < 2m', which yields 6) but its explicit enumeration omits (m = 3, D_0 = 4), and A2's headline count of 7 matches neither the rule, the enumeration, nor the artifact."
        severity: "narrative-only. No emitted number, cell, threshold, fixture or scope statement depends on the count; the artifact is correct."
        k_c_outside_guessing_range: "reproduced: k_c > n - s at 54 of 54 table cells (0 of 54 in range), because 2(D_0 - m) <= 10 < s everywhere"
      was_P5_evaluable_as_frozen: >-
        No. As frozen, P5 prices a k_c that lies outside the guessing range at
        every one of the 54 table cells, and its top binomial is 0 at 6 of the
        9 (m, D_0) pairs (all of m = 5 and two thirds of m = 4). P5 is therefore
        vacuous at every table cell and evaluable only at three of the small
        fixture (m, s) pairs. The package reported it UNREPAIRED ("the P5
        formula as frozen is reported, not repaired"), which is what the
        contract requires; the correction of the formula is joint R3's.
      met: "not evaluable at any table cell; reported unrepaired, correctly"

