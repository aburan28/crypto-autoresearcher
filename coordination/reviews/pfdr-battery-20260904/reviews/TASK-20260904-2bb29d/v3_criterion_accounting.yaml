      frozen_wording: "argmin_k C(k) under the null slice at (m,s) in {(3,6),(4,8),(5,8)}: FORCED the enumerative leaf, C strictly decreasing, both omega"
      reported: "PASS at all 6 cells and all 54 table null curves"
      verified: "reproduced independently at all 6 fixture cells and, from my own balanced (m, n), at all 54 table null curves: strictly decreasing, argmin at the leaf, 54/54"
