      reported: "PASS -- (5,2): 8-10; (5,2.807): 4-6; (4,2): T >= rho at D_0 = 4 ('below 4'; bracket 2-4)"
      verified: "reproduced independently on an even-D_0 grid: (m 5, omega 2) largest below 8 (124.1300), smallest at/above 10 (131.3298); (m 5, omega 2.807) 4 (116.5991) / 6 (128.0516); (m 4, omega 2) 2 (118.6414) / 4 (128.7391). All three brackets identical to the archived ones; my per-D_0 log2 T values agree with thresholds.yaml to 0.0000 at every scanned point."
      literal_reading_met: true
      note: "'below 4' and the emitted 'between 2 and 4' are consistent: both assert T >= rho at D_0 = 4. The emitted form is the more precise one."

    - item: 5
      frozen_wording: "the concrete_cost block is filled with every optimistic assumption flagged and the affected-vs-safe scope stated"
      reported: "PASS (concrete-cost.yaml)"
      verified_structurally: "cost_unit 'F_p field operations (log2)'; bound_kind heuristic_estimate; status draft; 8 optimistic_assumptions each carrying an explicit bias direction '[UNDER-estimates cost]'; 2 overestimating_factors each '[OVER-estimates cost]'; hidden_overhead_disclosure, parallelism, time_memory_tradeoff, affected_scope (3 entries, first is 'NONE unconditionally'), safe_scope (4 entries), dominated_by, sota_delta all present and non-empty; 54 parameter_sets, every one tagged (D_0, omega) and carrying 'assuming HEUR-001' in its name, with time_log2, memory_log2, prior_time_log2 and prior_memory_log2 = 0."
      literal_reading_met: true
