  predictions:
    - id: P1
      frozen_wording: "Stage 0 script reproduction of every table cell; within 1 in log2 of the hand values listed in statement (D)"
      reported: "8 contract-listed cells max |disc| 0.15; H (D) extras max 0.19; dcf857-only 'about 2^150' cell +1.60"
