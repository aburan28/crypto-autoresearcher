      margin_note: "the criterion is met by 0.1189 in log2 at the binding cell; a 0.12-in-log2 change of the model would flip it. The archived per-cell n +/- 1 rounding sensitivity is at most 0.119, i.e. of the same order as the margin at that one cell."

    - item: 3
      frozen_wording: "every table cell is within 1 in log2 of the hand values, at both omega, with (D_0, omega) tags"
      reported: "PASS against the contract's listed hand values (8 primary cells, max 0.15) and H-PFDR-06fd60 (D) (max 0.19); one dcf857-only approximate value exceeded by +1.60 at (256, m = 4, D_0 = 6, omega 2.807); 'whether it falls under item (3) is not the executor's call'"
      three_readings_all_recorded:
        reading_A_contract_inputs_hand_values_to_reproduce:
          scope: "the 8 cells enumerated in specification.inputs.hand_values_to_reproduce"
          my_max_abs_discrepancy: 0.1516
          at_cell: "(log2 N 256, m 5, D_0 6, omega 2.807)"
          item_3_met: true
        reading_B_H_PFDR_06fd60_statement_D:
          scope: "the further cells stated in H-PFDR-06fd60 (D)"
          my_max_abs_discrepancy: 0.1884
          at_cell: "(log2 N 256, m 4, D_0 8, omega 2.807)"
          item_3_met: true
        reading_C_IDEA_20260903_dcf857_statement_D:
          scope: "every hand value in dcf857 (D), including the one written 'about 2^150'"
          my_max_abs_discrepancy: 1.5966
          at_cell: "(log2 N 256, m 4, D_0 6, omega 2.807): my 151.5966 vs hand 150.0, sign +"
          item_3_met: false
      which_reading_the_frozen_text_selects: >-
        The contract's own preregistered_prediction.formula says "Table cells
        within 1 in log2 of the hand values LISTED UNDER INPUTS", and
        specification.inputs.hand_values_to_reproduce is the only enumerated
        list in the contract. H-PFDR-06fd60's prediction P1 independently says
        "the hand values listed in statement (D)" of that hypothesis. Both
        selected lists are met (0.15 and 0.19). The +1.60 cell is in neither:
        it appears only in dcf857 (D) and only as "about 2^150". On the
        contract's own definition, item (3) is met; under reading C it is not.
        This reviewer records all three and does not adjudicate the choice,
        which is a Coordinator composition decision.
      collateral_facts:
        - "dcf857's own assumptions say 'All hand numbers are to about 0.5 in log2'; +1.60 exceeds that self-declared accuracy as well as the 1.0 tolerance, so under any reading the 'about 2^150' value is superseded by 151.60."
        - "H-PFDR-06fd60.assumptions prescribes the remedy: 'any disagreement above 1 in log2 is a transcription error corrected by a superseding record'. The package reports it and does not repair it, which is the contract-compliant behaviour."
        - "tags: all 54 cells in cost-table.yaml and all 54 parameter sets in concrete-cost.yaml carry (D_0, omega) tags and the 'assuming HEUR-001' qualifier; value_kind is 'estimate (derived); never measured' on every cell. Both omega emitted everywhere (CTRL-BOTH-OMEGA)."
        - "A3 (m = 3 row): dcf857 writes the constant as 2^{2.8}, the script as log2(2 sqrt 48) = 3.7925. The difference is +0.9925, i.e. the missing leading factor 2 -- still inside the 1-in-log2 tolerance, and dcf857's m = 3 statement is a LOWER bound (T >= 2^{2.8} N^{1/2}) which remains true at 2^{3.79}."
      literal_reading_met: "true under readings A and B (the readings the frozen texts name); false under reading C"

    - item: 4
      frozen_wording: "the D_0 thresholds per (m, omega) at 256 bits are emitted and bracket the predicted ranges"
