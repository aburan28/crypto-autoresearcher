      frozen_wording: "the three fixtures pass (null slice = da1428 with full guessing and N^1; direct-presentation ratio; balance limits)"
      reported: "PASS, PASS, PASS"
      verified:
        F1: "reproduced independently: strictly decreasing at all 6 fixture (m,s,omega) cells, argmin at the enumerative leaf k = n-s; my max log2 step -0.9293/-0.9404/-0.9590 (omega 2) and -1.7078/-1.7234/-1.7495 (omega 2.807) equal the archived values to 4 dp; log2C(k=0) agrees to <=4e-5; all 54 balanced-cell null curves also strictly decreasing with argmin at the leaf; enumerative balance slope d log2 T / d log2 N = 1.0 exactly at m = 3,4,5"
        F2: "reproduced independently ONLY on the second pass. First pass (frozen before cost_table.py was opened) implemented the review-plan paraphrase literally -- dense columns binom(D+r,r) for every r including r=1 -- and obtained slope omega-1 = 1.0000 / 1.8070, NOT 2 omega - 1. Second pass applying IDEA-20260808-da1428's explicit LEAF-COSTING CONTROL ('the k=m-1 leaf must be charged by root-finding, never by a Macaulay reduction'; leaf = B^{m-1} 2^{m-1}), also frozen in H-PFDR-06fd60.assumptions, reproduces 3.0000/2.9999/2.9998 (omega 2) and 4.6139/4.6139/4.6137 (omega 2.807) exactly, m = 3/4/5. The archived fixture is right and the plan's paraphrase was the incomplete statement."
        F3: "reproduced independently: C = 1 slope 2/(m+1) = 0.5 / 0.4 / 0.33333 exactly; C = B^{m-1} 2^{m-1} slope 1.0 exactly, m = 3,4,5"
      literal_reading_met: true
      note: "F2's headline exponent is not a property of the column counting alone: with the r = 1 endpoint charged as a Macaulay solve the exponent is omega-1. The root-finding charge is mandated by the baseline record and by the hypothesis's own assumptions, so the fixture is correctly implemented; the DERIVATION question (whether 2 omega - 1 is the right target and whether it is independent of D_S) is joint R3's, not this reviewer's."

    - item: 2
      frozen_wording: "every bounded-slice cell at 64 bits loses to rho by at least 2^9"
      reported: "PASS; minimum gap 9.12 at (m = 5, D_0 = 4, omega 2)"
      verified: "reproduced independently for all 18 cells; my gaps identical to the archived ones to <=5e-5; minimum gap 9.1189 at (m = 5, D_0 = 4, omega = 2) [assuming HEUR-001]; next smallest 15.3922 at (m = 4, D_0 = 4, omega = 2); largest 62.1362"
