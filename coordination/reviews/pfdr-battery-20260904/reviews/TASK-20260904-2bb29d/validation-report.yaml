    - id: V2-M7
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "the 18 bounded cells at 64 bits and their gap to rho"
      result: agrees
      detail: >-
        All 18 gaps identical to the archive to <= 5e-5. Minimum gap 9.1189 at
