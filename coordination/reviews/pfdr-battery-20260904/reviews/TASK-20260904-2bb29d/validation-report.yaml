    - check: sample integrity
      result: not_applicable_declared
      detail: "Zero sampling, zero seeds, zero curves, by frozen contract (replication.seeds: [], independent_instances: 0). The declared analogue -- exact re-derivation -- was performed: byte-identical re-emission (V1-A4) plus an independent reimplementation of every load-bearing quantity (V2)."
    - check: correspondence validity
      result: not_applicable_declared
      detail: "specification.scale_relevance.correspondence is 'none; no sampling occurs'. No substitute sampler is used, so no correspondence theorem is required."
    - check: scale binding
      result: pass_with_observation
      detail: >-
        Parameter sizes are recorded on every cell (log2 N in {64,128,256};
        m in {3,4,5}; D_0 in {4,6,8}; omega in {2, 2.807}; n and s per cell),
        scale_relevance.tier is declared 'toy' with the justification that no
        curve at any scale is examined and the 64/128/256 rows are estimates,
        and the transfer assumption (HEUR-001) is named on every cell. The
        scale mismatch is therefore declared as an assumption, not concealed.
        OBSERVATION, not an adjudication: docs/evidence-and-reproducibility.md
        "Concrete-cost estimation artifacts" asks for the standardized sizes
        "plus at least one larger size"; the grid stops at 256. The full audit
        of concrete-cost.yaml against that document is joint R4's.

  cost_model_checks:
    - check: cost-unit honesty
      result: pass
      detail: >-
        cost_unit is declared ("F_p field operations (log2)") in
        concrete-cost.yaml and repeated in the header comment of every emitted
        YAML. Memory is a first-class column on every one of the 54 cells and
        54 parameter sets, with the prior's memory recorded as 0 (O(1)).
        Optimistic assumptions are listed individually (8) with an explicit
        bias direction "[UNDER-estimates cost]" on each, and 2
        overestimating factors with "[OVER-estimates cost]". Parallelism,
        time_memory_tradeoff and hidden_overhead_disclosure (the o(1) as
        2^m Ncols(ms, D_0)^omega per cell) are present and non-empty. Both
        omega columns are emitted everywhere. bound_kind is
        heuristic_estimate and value_kind on every cell is "estimate
        (derived); never measured".
    - check: cost bookkeeping (per-attempt cost x inverse success probability)
      result: pass
      detail: >-
        Success is NOT treated as certain. I verified the balance as an
        algebraic identity from the frozen model: with per-target success
        probability B^m/(m! N) and the 2^m filter charged in the oracle,
        relation collection costs B x (m! N / B^m) x 2^m C = m! 2^m C N /
        B^{m-1}, which balanced against the B^2 sparse linear algebra gives
        B^{m+1} = m! 2^m C N and T = 2 B^2 -- exactly the frozen
        T = 2 (m! 2^m C N)^{2/(m+1)}. My independent implementation of that
        balance reproduces all 54 archived cells to 5e-5, so the inverse
        success probability is genuinely carried in every tabulated number.
    - check: conditionality carried on every quotation
      result: pass
      detail: >-
