    - id: V2-M10
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "the modelling choices the frozen formulas leave open (report D5 a-d) and the size of each"
      result: recorded
      detail: >-
        (a) n = round(m s): my own rounding sweep over round/ceil/floor moves
        log2 T by at most 0.0324 at the five probed cells, and the archived
        per-cell n +/- 1 sensitivity is at most 0.119 over all 54 cells. Below
        0.2, but see the limitation on criterion (2)'s margin.
        (b) D_S = m 2^{m-1} in the direct fixture: I confirm the F2 slope is
        unchanged by D_S (it enters only an additive constant); the value of
        D_S itself is joint R1's business, not mine.
        (c) 2^m filter charged inside C(0) rather than in the balance
        constant: EXACTLY equivalent -- both are the same additive +m in the
        numerator of s. My implementation placed it in the balance and matched
        the archive to 5e-5, which demonstrates the equivalence numerically.
        Effect on any cell: 0.
        (d) leaf charged both ways: 0 effect on every tabulated T (all 54 use
        the k = 0 charge); it decides 4 of 54 argmins and the F2 exponent, as
        recorded in V2-M4 and V2-M8.
        ADDITIONAL, not in D5: the curve diagnostics are evaluated at
        n = m * s_int with s_int = round(s), while the table cells use
        n = round(m s). This moves the curve-diagnostic log2 C(0) by up to
        ~0.21 (e.g. 89.383 at n = 120 vs my 89.177 at n = 119) and moves no
        table cell at all.
      effect_over_0_2_on_any_cell: false

  control_checks:
    - control_id: CTRL-NULL-SLICE-DA1428
      row_class: fixture
      blocking: true
      status: reproduced_pass
      detail: "strictly decreasing, argmin at the enumerative leaf, 6/6 fixture cells and 54/54 table null curves; enumerative assembly slope exactly 1.0 (N^1). Independently recomputed."
    - control_id: CTRL-DIRECT-PRESENTATION-RATIO
      row_class: fixture
      blocking: true
      status: reproduced_pass_with_recorded_modelling_dependence
      detail: "argmin k = m-1 (the flip does NOT occur in the nearby object where the conclusion is known false) confirmed independently at every B on and below the emitted grid; the exponent 2 omega - 1 reproduced exactly only under da1428's mandated root-finding leaf charge (V2-M4)."
