    - id: V2-M3
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "null-slice monotonicity and argmin (fixture F1)"
      result: agrees
      detail: >-
        At (m, s) in {(3,6),(4,8),(5,8)} and both omega: C(k) strictly
        decreasing over the whole range 0..n-s with argmin at the enumerative
        leaf, 6 of 6. My max log2 step -0.9293 / -0.9404 / -0.9590 (omega 2)
        and -1.7078 / -1.7234 / -1.7495 (omega 2.807) equal the archived
        values to 4 dp; log2 C(k=0) agrees to <= 4.0e-5. Independently at the
