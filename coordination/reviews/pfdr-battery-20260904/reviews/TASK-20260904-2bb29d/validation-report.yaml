      row_class: honesty
      blocking: true
      status: verified
      detail: "both omega present on all 54 cost-table cells, all 54 concrete-cost parameter sets, every threshold row, every curve and every fixture row; no single-omega number found in the package."
    - control_id: PARETO-RHO
      row_class: pareto_control
      blocking: false
      status: verified_structurally
      detail: "prior_rho_log2_T and prior_rho_log2_memory = 0 present on every cell; the four sub-rho cells are stated as time-only at 2^53.9-2^61.6 memory; dominated_by states rho dominates every cell unconditionally and on memory conditionally; sota_delta states +0 unconditionally. No unconditional domination claim found. The SUBSTANTIVE audit of this control is joint R4's."
    - control_id: CTRL-CONFOUNDERS-NAMED
      row_class: honesty
      blocking: false
      status: verified_structurally
      detail: "(i) bounded-last-fall vs bounded-solve, with the Huang-Kosters-Yeo pointer marked RECALLED and never presented as checked; (ii) omega; (iii) rounding of s; (iv) S_6 at m = 5 and KN-OPEN-5b3a08; (v) the CRT/output-degree artifacts -- all appear in concrete-cost.yaml's flagged assumptions and in the report. Whether (iv)'s degree claim is TRUE is joint R1's; I record only that it is named."
    - control_id: NULL-OBJECT-CONTROL (structural, inventor-protocol section 3)
      status: present_and_reproduced
      detail: >-
        The analogue of a null-object control here is the semi-regular null
        slice: remove the bounding assumption and the same machinery must
        produce no advantage. It does -- N^1, worse than rho by N^{1/2}, at
        every arity, reproduced independently at 6 fixture cells and 54 table
        null curves. There is no sampling and therefore no statistical signal
        in this package; the quantity that must decay when the bound is
        removed does decay, completely. The remaining "proves too much"
        objects of the plan (direct presentation under the bounded-slice
        arithmetic, m = 2, D_0 below the generator degree) are assigned to
        TASK-20260904-6681da and are NOT assessed here.

