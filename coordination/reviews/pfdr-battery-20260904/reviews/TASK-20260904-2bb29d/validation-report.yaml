    - check: pre-registered prediction
      result: pass
      detail: >-
        The prediction was frozen before the derivation and was not touched
        afterwards. `git diff c5742969 HEAD` is EMPTY for
        experiments/EXP-PFDR-c04716/specification.yaml,
        ledger/hypotheses/H-PFDR-06fd60.yaml and
        ledger/proposals/IDEA-20260903-dcf857.yaml. The only design ->
