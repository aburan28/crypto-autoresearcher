    - id: V2-M8
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "bounded-slice argmin under both leaf charges (P3), and the marginal-ratio crossing"
      result: agrees
      detail: >-
        Under the C(k) formula alone my argmin is k = 0 at 54 of 54 cells,
        matching the archived bounded_argmin_k_formula_leaf = 0 at 54/54.
        Under the root-finding leaf charge my independent probe selects
        exactly the same four exception cells as the package: (64, m 3, D_0 6,
