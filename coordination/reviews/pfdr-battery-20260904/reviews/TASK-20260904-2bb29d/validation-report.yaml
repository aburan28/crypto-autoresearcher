      evidence: [v2_leaf_and_p5_probe.txt, v3_p3_crossing_check.txt]

    - id: V2-M9
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "P5 interior-band binomial binom(2(D_0 - m), D_0) over the 9 (m, D_0) pairs"
      result: DISAGREES_WITH_THE_REPORT_PROSE_ONLY
      detail: >-
        My independent count of pairs with a zero binomial is 6 of 9, and the
        emitted artifact (thresholds.yaml.interior_band_HEUR002_only_fixture_ms)
        also carries 6 of 9: zero at (3,4), (4,4), (4,6), (5,4), (5,6), (5,8);
