      quantity: "log2 T and log2 memory at all 54 table cells"
      recomputed_from: "s = (log2 m! + m + omega log2 Ncols(n, min(D_0, d_reg(n))) + log2 N)/(m+1), n = round(m s) iterated to a fixed point; log2 T = 1 + 2s; log2 memory = s; Ncols exact integer binomials"
