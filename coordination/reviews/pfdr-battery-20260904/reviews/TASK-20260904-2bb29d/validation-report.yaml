    - id: V2-M4
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "direct-presentation ratio slope at B = 2^20 (fixture F2)"
      result: agrees_only_after_applying_the_frozen_leaf_costing_control
      detail: >-
        FIRST PASS (frozen before the script was opened): implementing the
        review-plan paraphrase literally -- residual degree
        ceil((r(B-1)+D_S)/2), D_S = m 2^{m-1}, dense columns binom(D+r, r) for
        EVERY r including r = 1 -- gives slope omega - 1, i.e. 1.0000 (omega 2)
        and 1.8070 (omega 2.807), against the archived 3.0000/2.9999/2.9998 and
        4.6139/4.6139/4.6137. That is a discrepancy of 2.0 in the exponent.
        RESOLUTION: the discrepancy is in the paraphrase, not in the package.
        IDEA-20260808-da1428 -- the baseline this fixture must reproduce --
        carries an explicit LEAF-COSTING CONTROL ("the k = m-1 leaf must be
        charged by root-finding, never by a Macaulay reduction"; the leaf "is
        not solved by Macaulay linear algebra at all but by root-finding plus
        an O(1) hash"), and H-PFDR-06fd60.assumptions repeats it
        ("enumeration leaf charged by root-finding plus O(1) lookup"). The
        script charges leaf = B^{m-1} 2^{m-1}, which is that control.
        SECOND PASS applying it and changing nothing else reproduces
        3.0000 / 2.9999 / 2.9998 and 4.6139 / 4.6139 / 4.6137 exactly for
        m = 3/4/5, including the m-dependent drift in the last digit. My
        first-pass implementation was the one at fault -- it committed
        precisely the error da1428's control exists to forbid.
      order_disclosure: >-
        The second pass was written AFTER cost_table.py was opened and AFTER
        IDEA-20260808-da1428 was read; it is recorded as a second pass and
        not as a blind reproduction. The first-pass value is preserved in the
        pre-hashed v2_recomputation.json.
      note_for_composition: >-
        F2's headline exponent is not a property of the Macaulay column
        counting alone: with the r = 1 endpoint charged as a Macaulay solve
        the exponent is omega - 1, and the target 2 omega - 1 is reached only
        under the leaf charge. The charge is mandated by the frozen baseline,
        so the fixture is correctly IMPLEMENTED. Whether 2 omega - 1 is the
        right target, and whether it is independent of D_S as the report
        asserts, is joint R3's question, not this reviewer's.
      also_checked: >-
        The report's "argmin k = m-1 from B = 16 on" is not a threshold: 16 is
        the smallest point of the emitted grid (B = 2^4..2^20), and my
        computation has argmin = m-1 at every B from 2 up. The field name in
        fixtures.yaml is honest about this
        ("B_0_smallest_grid_B_from_which_argmin_is_leaf"), as is the report's
        wording "at every grid point"; a hurried reader could still misread
        16 as a crossover.
      evidence: [v2_f2_secondpass.py, v2_f2_secondpass.txt]

    - id: V2-M5
      joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
      quantity: "balance limits C = 1 and C = B^{m-1} 2^{m-1} (fixture F3)"
      result: agrees
      detail: >-
        C = 1: d log2 T / d log2 N = 0.5 / 0.4 / 0.333333 = 2/(m+1) exactly at
