      decisive_number: >-
        75 cell-arm rows x 17 fields regenerated with ZERO differences; the
        primary d_lf fit reproduces slope 0.400000, CI [0.38202515,
        0.41797485], residual variance 0.050209, n = 480 exactly; per-prime CI
        [0.36858, 0.43142] exactly; 0 of 600 Semaev draws censored, so no
        censored draw entered any fit; count-1 fall entries occur at s = 1 only
        (120 semaev + 120 non-curve + 165 of 600 NULL-1, matching
        analysis.json cell for cell). Independent reconstruction of the
        instance p = 4099, a = 3245, b = 455, x_R = 1960 gives (5,5), (5,5),
        (6,6) at s = 2, 3, 4.
      artifacts: [r0-regeneration-note.md, r0_regenerated_ladder.json, r0_controls.json, r0r1_fits.json]
    - joint: >-
        R1 pseudo-replication: the slope interval, the outcome rule and the
        HEUR-002 falsifier statistic
      result: breaks
      attack_executed: >-
        Recomputed the slope and 95 percent t-interval on four units of
        replication (per draw; one draw per distinct (curve, x_R) system; per
        (s, p) cell mean; per s-level mean), re-evaluated the pre-registered
        three-outcome rule and the falsifier statistic on each, swept the
        interval against the replication count, and computed the OLS slope of
        the derived step law 4 + floor(s/2) over windows [2, S].
      decisive_number: >-
        Within-cell range of d_lf is 0 at all twelve cells and the
        between-prime range at fixed s is 0, so the 480 observations are FOUR
        integers each repeated 120 times. On the four independent s-points the
        interval is [-0.2085, 1.0085] (t_{2,0.975} = 4.30, s^2 = 0.1,
        S_xx = 5), which CONTAINS 0, 0.25, 0.5 and 1: the 'excludes 0'
        falsifier statistic DOES NOT FIRE. Five draws per s-level already buy
        'excludes 0.5'. And the OLS slope of the law the data follow exactly,
        4 + floor(s/2), is 0.4 on [2,5] but 0.5 asymptotically, so the reported
        interval [0.382, 0.418] excludes the true growth rate of the generating
        law.
      artifacts: [r1-corrected-intervals.md, r0r1_fits.json]
    - joint: >-
        R2 is the frozen closure HKY invariant, and is the completeness
        certificate sound?
      result: holds
      attack_executed: >-
        Checked stage1-closure-convention.md section 2 line by line and read
        closure.py and harness/macaulay_fp/linalg.py for the fixed-point
        semantics; re-derived the C1/C2 induction; reimplemented the C2 test
        independently (kernel basis of the evaluation map, multiplied out and
        echelonised, no annihilator argument); constructed a system with a
        KNOWN fall above D_max and ran the producer's unchanged
        certify_history on it; bounded every partial sum in the dense engine.
      decisive_number: >-
        On the planted late-fall object (n = 10, p = 4099, g = u f1 + v f2 + h
        of degree 8) the certificate REFUSED: dim V_7 = 112 against
        dim(I cap B_{<=7}) = 582, C1 false, route 'not certified',
        right_censored true; run to D = 9 the true history is falls = [8]. The
        two independent C2 implementations agree at D = 4..8 on the declared
        s = 4 instance (codim = r_D = |Z| = 2). Largest dense partial sum at
        the largest cell is 65537^2 x 969 = 2^41.92, eleven binary orders below
        2^53.
      artifacts: [r2-closure-and-certificate-note.md, r2_certificate.json, ptm_objects.json]
    - joint: >-
        R3 the single-fall observation: does the closure solve at d_ff, what
        does it imply for HEUR-002, c04716 and 84cdb7?
      result: holds
      attack_executed: >-
        Wrote a derivation note (Lemmas 0-4 and Theorem A) reducing the
        single-fall identity to one checkable condition, verified that
        condition per draw on every arm from the raw records, checked the
        degree condition d_ff >= e(Z) + 2 per draw, and recomputed the cost
        consequence for IDEA-20260830-84cdb7 and EXP-PFDR-c04716.
      decisive_number: >-
        DERIVED: if V_{F,D0} = I cap B_{<=D0} for some D0 >= e(Z) + 1 then
        V_{F,D} = I cap B_{<=D} for all D >= D0 and NO fall occurs above D0 at
        any degree, because I cap B_{<=D} = (I cap B_{<=D-1}) + sum_i a_i
        (I cap B_{<=D-1}) for every D >= e(Z) + 2 (Lemma 3). MEASURED: the
        recorded diagnostic V_complete_at_D is TRUE at the first fall on all
        3752 fallen systems, the hypothesis fall_dim(d_ff) =
        dim(I cap B_{<=d_ff-1}) holds on all of them, and the degree condition
        is met on 3660 of them (all Semaev, non-curve, NULL-1, NULL-2 at
        m = 2). d_lf = d_ff is therefore DERIVED on those 3660 systems, not
        fitted. NOT derived: that the first fall saturates at every s, so
        'd_lf = d_ff for all s at m = 2' is NOT established -- what is
        established is a derivation-tier reduction of it to that one condition.
      artifacts: [derivation-r3-single-fall.md, r3_single_fall_check.json, r3_interpolation_degree.json, r3_consequence.json]
    - joint: >-
        R4 nulls, nearby object, censoring design, presentational budget and
        the named confounds
      result: holds
      attack_executed: >-
        Regenerated the F5 flags, the band table and the NULL-3 comparison from
        raw; audited the whole package for statements exceeding what the
        controls license; cross-tabulated the count-1 tell against the
        certificate's Z_size on all 1200 s = 1 systems; read the equal-d^s and
        m = 3 raw records for the design ceilings; traced in closure.py which
        quantities are generator-level and which are ideal-level.
      decisive_number: >-
        The NON-CURVE (singular, nodal) cubic reproduces the Semaev
        (d_ff, d_lf) pair AND the censoring status at all 15 cells on 600
        draws: F5 noncurve = true. The count-1 tell separates perfectly on the
        s = 1 systems: iteration count 1 exactly when Z_size >= 1 (405
        Semaev/non-curve + 165 NULL-1) and 2 exactly when Z_size = 0 (450
        NULL-1/NULL-2). CTRL-EQUAL-DS-SPREAD observed 0 falls on 45 of 45
        instances (D_max = 6 sits below the derived first fall 7 at B = 64), so
        the presentational artifact budget is the empty set.
      artifacts: [r4-nulls-and-design-note.md, ptm4_s1.json, r0_controls.json]
    - joint: >-
        R5 claim (A) of H-PFDR-c88f14: the non-transferring steps B1/B2 and
        whether any bound could exist
      result: holds
      attack_executed: >-
        Re-read stage0-transfer.md sections 1-3 and the hypothesis; retrieved
        the source (arXiv abstract page and the ar5iv HTML of 2103.07282, and
        the ePrint page of 2015/573) to check the theorem statements the claim
        rests on; asked whether the data alone exclude a uniform bound; looked
        for a surviving route to one.
      decisive_number: >-
        Theorem 2.6 as displayed reads 'Suppose F is a finite set of
        k'-LINEARIZED polynomials of maximum degree d = q^c ... If F is
        reducible for k, then d_{F'_1} <= max((q-1)m+1, qd)'. The package names
        only the reducibility hypothesis. The missing linearized hypothesis is
        a third, cheaper non-transferring step (S~ has degree 4 and is not
        additive) and it makes the 'formal analogue constant 4m = 8' a
        substitution into a formula whose variable ranges over linearized
        generators. Claim (A)'s CONCLUSION holds; its stated grounds are
        incomplete, and the step 'Lemma 2.1 has no analogue, therefore no
        version transfers' leans on a proof body nobody read.
      artifacts: [r5-claim-A-note.md]
  proves_too_much:
    assigned: true
    instrument: >-
      experiments/EXP-PFDR-cbdefb/closure.py, sha256
      63475db53f5d34859d638327a7082834da0b81209059d0b871bab5b4e32cfb98 (the
      version pinned by runs 3-23), unchanged, with harness/macaulay_fp at the
      sha256 set recorded in harness/macaulay_fp/VALIDATION.md; D_max = 7
      unless stated. No experiment run was produced (maximum_runs 0).
    objects:
      - object: 'NULL-1 support-matched random generator, p = 4099, seeds 7 and 11, s = 2, 3, 4'
        known_false: 'a flat or Semaev-valued d_lf'
        observed: >-
          d_lf = 5, 6, 7 at s = 2, 3, 4 (exactly s + 3, rising) on both seeds,
          single fall each, certified structurally at s <= 3 and by C1+C2 at
          s = 4; the Semaev arm on the same instance gives 5, 5, 6, so the arms
          differ at s = 3 and s = 4.
        failure_signature: absent
      - object: >-
          planted LATE fall: n = 10 squarefree variables, p = 4099, f1, f2 of
          degree 5, u, v of degree 3, h of degree 7, g = u f1 + v f2 + h of
          degree 8, seed 20260904
        known_false: '"certified complete at D_max = 7"'
        observed: >-
          at D_max = 7: falls = [], dim V_7 = 112 vs dim(I cap B_{<=7}) = 582,
          C1 = false, certified = false, route 'not certified', right_censored
          = true. Run to D_max = 9: falls = [8], iteration count 2,
          dim V_8 = 627 = dim(I cap B_{<=8}).
        failure_signature: absent
      - object: >-
          direct presentation at m = 2 with B = 8 (ordinary ring, generators
          [S_3(x1, x2, x_R), f_V(x1, 8), f_V(x2, 8)], degrees [4, 8, 8])
        known_false: 'a bounded or observed d_lf below 8 (IDEA-20260808-afe4ce floor d_lf >= B)'
        observed: >-
          no fall in (4, 7]: falls = [], no_fall_in_window = true,
          right_censored = true, certificate not attempted ('ordinary ring: no
          structural bound and no certificate').
        failure_signature: absent
      - object: 'the s = 1 saturated digit systems (n = 2, four monomials), all 1200 systems in the three s = 1 runs'
        known_false: 'that a count-1 fall is an instrument fault'
        observed: >-
          the tell fires exactly when the system has a root (Z_size >= 1, dim
          W_0(3) = dim V = dim(I cap B): 405 Semaev/non-curve entries and 165
          of 600 NULL-1) and never when it does not (Z_size = 0, dim W_0 = 3 <
          dim V = 4, count 2: 435 NULL-1 + 15 NULL-2). At n = 2 the ring has 4
          monomials and B_{<=3} = B, so W_0(3) is already the ideal cap
          whenever a root exists.
        failure_signature: >-
          PRESENT AS DESIGNED. An argument that reads every count-1 fall as an
          instrument fault does prove too much. Corrected reading: the artifact
          tell is 'iteration_count = 1 AND W0_saturated = false'; with
          W0_saturated = true it is a saturated ring and a correct measurement.
          No number in the package changes (s = 1 is outside the primary fit
          and raw values are reported beside the rule-applied ones).
    artifacts: [proves-too-much-table.md, ptm_objects.json, ptm4_s1.json]
  objections:
    - id: OBJ-1
      severity: high
      target: "the execution report's 'heur_002_falsifier_statistic ... the pre-registered condition fires'"
      objection: >-
        The interval that makes the statistic fire is computed on 480
        pseudo-replicates of four integers. Within-cell variance is exactly 0
        at all twelve cells and the between-prime variance at fixed s is
        exactly 0, so the residual sum of squares is pure lack of fit and the
        standard error shrinks as 1/sqrt(n) with no statistical content. On the
        four independent s-points the interval is [-0.2085, 1.0085] and the
        condition does NOT fire. The producer's own bootstrap over draws within
        cells returns the degenerate [0.4, 0.4], which is the same tell.
      what_the_quantity_should_have_done: >-
        The parameter that must destroy a slope signal is the replication
        count: adding curves or primes must not sharpen a statement about the
        s-dependence. Here it halves the interval width per fourfold increase,
        and five draws per s-level already buy 'excludes 0.5'.
    - id: OBJ-2
      severity: high
      target: "the pre-registered three-outcome rule and the label 'unresolved'"
      objection: >-
        Outcome II's clause 'the d_ff interval lies strictly below the d_lf
        point estimate' asks an interval to lie strictly below its own centre
        whenever d_ff = d_lf on every draw, which is the case here; it is
        unsatisfiable on any single-fall system. With n = 480 the interval
        half-width is 0.018, so Outcome I reduces to 'd_lf = s + const exactly'
        and Outcome III to 'd_lf constant on s = 2..5'. Every integer step
        between them -- including the contract's own frozen prediction
        5, 5, 6, 6 for d_ff -- lands in 'unresolved' by construction.
        'Unresolved' is therefore a fact about the rule, not about the last
        fall degree, and the rule was mis-specified rather than the world being
        surprising.
    - id: OBJ-3
      severity: medium
      target: "the reported interval read as a statement about growth"
      objection: >-
        The measured values are exactly H-PFDR-4148b8's derived step
        4 + floor(s/2), whose asymptotic slope is 1/2. The finite-window OLS
        slope of that step is 0.4 on [2,5], 0.5 on [2,6], 0.4571 on [2,7], and
        tends to 0.5. So 0.400 is a property of the window and the reported
        interval [0.382, 0.418] EXCLUDES the true growth rate of the law the
        data reproduce with residual 0.
    - id: OBJ-4
      severity: medium
      target: "'certified C1+C2' as two independent checks"
      objection: >-
        C2(D) is a theorem for every D >= e(Z) + 2 (Lemma 3 of the derivation
        note). All 480 recorded Semaev C2 checks are at D >= 8 with e(Z) <= 3,
        so none of them could have failed. The censoring decision rests on C1
        alone. C1 is the right test and it refuses correctly on the known-false
        object, so this is a scope statement, not a defect -- but the
        certificate should not be read as two tests.
    - id: OBJ-5
      severity: medium
      target: "'the ladder is uncensored at its top' read as a property of the measurement"
      objection: >-
        C1 says the closure has already computed the whole ideal cap at D_max,
        i.e. the system has SOLVED by D_max. Certification is therefore
        equivalent to a low last fall, and censoring is a deterministic
        consequence of a high one -- which is exactly why NULL-1/NULL-2 are
        fully censored at s = 5 and the Semaev arm is not. Since censored draws
        are excluded from the d_lf fit, any future cell with d_lf > D_max would
        be dropped and the fit biased toward Outcome III. No bias was realised
        at s <= 5, but the fitted SAMPLE is selected by an ideal-level
        predicate even though each d_lf value is generator-level; the
        IDEA-20260830-cb8e46 confound should be recorded in that form.
    - id: OBJ-6
      severity: medium
      target: "the ladder as an extensible design"
      objection: >-
        At m = 2, s = 6 the frozen instrument cannot produce an uncensored d_lf
        at ANY D_max: n = 12 gives 2^n = 4096 > CERTIFICATE_COLUMN_LIMIT =
        1024, so certify_history returns 'certificate not attempted' and every
        draw is right-censored by declaration. The primary fit therefore cannot
        be lengthened past s = 5 without changing the frozen convention, and
        Outcome III's 'four consecutive uncensored cells' clause can never be
        satisfied on more than the four cells already measured.
    - id: OBJ-7
      severity: medium
      target: "CTRL-EQUAL-DS-SPREAD as a calibration of the presentational artifact budget"
      objection: >-
        All 45 instances at B = 64 report no fall and are right-censored,
        because D_max = 6 sits below the derived first fall 4 + floor(6/2) = 7
        of the (2, 6) arm and below the membership degrees of the ordinary-ring
        arms. The observed spread is the empty set, so 84cdb7's 'a claimed
        effect must exceed the presentational spread by a factor 2' rule has no
        denominator anywhere in this lane.
    - id: OBJ-8
      severity: medium
      target: "CTRL-ITERATION-COUNT as written, and the s = 1 rows of the analysis"
      objection: >-
        The tell 'a fall with iteration count 1' is, at s = 1, a perfect
        detector of solvability rather than of a non-iterating closure (1200 of
        1200 systems separate on Z_size). Applying it literally erased 405
        correct measurements and, on NULL-1, conditioned the s = 1 band row on
        the subsample with no root. It changed no fitted number here, but the
        rule discards precisely the systems the lane is about and should be
        re-worded before reuse.
    - id: OBJ-9
      severity: medium
      target: "claim (A)'s stated grounds and the 'formal analogue constant 4m'"
      objection: >-
        Theorem 2.6 of arXiv:2103.07282 (Ming-Deh Huang, 2021) as displayed has
        TWO hypotheses -- 'F is a finite set of k'-linearized polynomials of
        maximum degree d = q^c' AND 'F is reducible for k'. The package names
        only the second. The first is decisive, cheaper and needs no proof-body
        reading (S~ has degree 4 and is not additive), and it makes the
        substitution deg S_3 = 4 into max((q-1)m+1, qd) a category error rather
        than merely a theorem-less number. Separately, the step from 'Lemma 2.1
        has no F_p analogue' to 'no version of the theorem transfers' is an
        inference about a proof body that the retrieved material does not
        license; B2 and the missing linearized hypothesis carry the conclusion
        on their own.
    - id: OBJ-10
      severity: medium
      target: "KN-LIT-7605 as a load-bearing citation"
      objection: >-
        The corpus note records authors [] and year null (actual: Ming-Deh
        Huang, 2021, as its own 'Not verified here' section asks to be filled)
        and states as a key claim 'Bounded-fall-degree results are stated for
        summation-polynomial systems over F_2 specifically'. The abstract and
        the displayed theorems name LINEARIZED POLYNOMIALS and no summation
        polynomials; H-PFDR-c88f14's own retrieval note says the retrieved text
        has 'no mention of summation polynomials, Semaev or ECDLP'. The note
        overstates the paper's scope in exactly the direction that makes a
        bounded last fall for Semaev systems look like established prior art.
    - id: OBJ-11
      severity: low
      target: "'Huang-Kosters-Yeo's V_{F,D}' as the name of the measured invariant"
      objection: >-
        The definition is `recalled` in H-PFDR-c88f14 ('corpus note read, paper
        not opened'). I confirmed the paper's title, authors, year and its
        order-independence and first-fall-degree claims from
        eprint.iacr.org/2015/573, but that page does not contain the definition
        of V_{F,i}, so the definition the experiment measures remains
        unverified against the source. Internal validity is unaffected (the
        convention is frozen, explicit and pinned by CTRL-S1-BASELINE), but an
        outward-facing statement should say so or open the paper.
    - id: OBJ-12
      severity: low
      target: "the tail check 'band offset grows with s: True'"
      objection: >-
        The growth is entirely the s = 1 cell (c = 0 there, c = 1 at s = 2, 3,
        4). At s = 1 the ring has 4 monomials and no fall above D = 3 is
        possible, so c = 0 is a ring-size boundary effect. On s = 2..4 the
        offset is constant. The boolean fires on a boundary artifact; the
        executor's prose discloses the pattern but the flag does not.
    - id: OBJ-13
      severity: low
      target: "cross-engine coverage at the top of the ladder"
      objection: >-
        At every s = 5 cell only 1 of 40 Semaev draws per arm was cross-checked
        against the reference sparse engine; 39 of 40 rest on the dense
        float64/BLAS engine alone. The exactness bound is sound with margin
        (largest partial sum 2^41.92 against 2^53) and every history agreed
        where both engines ran, so this is a coverage limitation to record, not
        a defect.
  required_controls:
    - >-
      Report the d_lf slope with the s-level as the unit of replication (n = 4,
      2 degrees of freedom), or drop the slope statistic entirely and report the
      integers. Any interval computed on per-draw replicates of a
      zero-variance-within-cell response must be labelled as lack-of-fit, not
      as sampling uncertainty.
    - >-
      Before any future use of the three-outcome rule, restate it for a
      lattice-valued response: it currently tests exact linearity with slope 0
      or 1 and has no branch for an integer step, and its Outcome II clause is
      unsatisfiable whenever d_ff = d_lf.
    - >-
      Record V_complete_at_D at the first fall, fall_dim(d_ff),
      dim(I cap B_{<=d_ff - 1}) and |Z| as first-class metrics: they are what
      makes the single-fall statement derivable, and they are currently
      diagnostics added after the first two runs.
    - >-
      Re-word CTRL-ITERATION-COUNT as 'iteration_count = 1 AND W0_saturated =
      false' and re-report the s = 1 rows under the corrected rule, so the
      analysis does not read 'no valid fall' where the correct answer is
      (3, 3).
    - >-
      Re-run CTRL-EQUAL-DS-SPREAD at a D_max above the derived first fall of
      the matched digit presentation (D_max >= 8 at B = 64) or record the
      presentational artifact budget as UNMEASURED and stop citing 84cdb7's
      factor-2 rule until it is.
    - >-
      Add the null-object control that the round did not run: the identical
      closure on a UNIFORMLY RANDOM multilinear generator of the same degree
      and DENSE support (not support-matched) at s = 2..5, to separate 'digit
      complete intersection with a monomial top form' from 'any degree-4
      multilinear form'. The non-curve cubic already shows the curve does not
      enter; the remaining question is whether the monomial top form does.
  counterexample_or_mutation: >-
    The cheapest discriminating object I ran is the planted late fall (n = 10,
    p = 4099, g = u f1 + v f2 + h of degree 8, fall at D = 8 > D_max = 7): the
    completeness certificate refuses it (C1 false, dim V_7 = 112 vs 582), which
    is the mutation that would have exposed a certificate biased toward
    flatness, and it did not fire. The cheapest mutation that would decide the
    open step of R3 is not this one but the s = 6 cell: raise
    CERTIFICATE_COLUMN_LIMIT to 4096 and D_max to 9 and run ONE m = 2, s = 6
    Semaev draw (n = 12, 4017 columns, dense exactness bound
    p^2 (N+1) = 1.73e13 < 2^53 at p = 65537). Predicted under the derivation
    plus the d_ff law: a single fall at D = 7 with V_complete_at_D true. A
    second fall degree there would bound the reach of Theorem A and is the
    interesting outcome.
  baseline_comparison: >-
    The package claims no speedup and none is created by this review. For the
    record, with the measured solving degree D_0(s) = d_lf = d_ff =
    4 + floor(s/2) at m = 2, the reduced column count is
    N_D = sum_{j <= D} binom(2s, j) ~ B^{2H(1/4 + 2/s)} with B = 2^s, giving
    log_B N_D = 1.99, 1.95, 1.95 at s = 3, 4, 5 and tending to
    2H(1/4) = 1.6226; the linear-algebra cost is then about B^{3.9} at s = 4, 5
    and tends to B^{3.245} at omega = 2 (B^{4.55} at omega = 2.807), against
    B^{1} for exhaustive enumeration of one digit block and O(sqrt(N)) for
    Pollard rho. So sigma > 1 by a wide margin at every s -- the algebraic route
    at its own measured solving degree is dominated by brute-force enumeration
    of the digit cube, let alone by rho or BSGS. Memory is the same N_D columns.
    This CONFIRMS IDEA-20260903-e1e38b (D7) with a concrete factor and extends
    it: e1e38b assumed d_solve = d_ff optimistically, and the closure histories
    show that assumption is the measured truth (the cascade computes the whole
    ideal cap, including I cap B_{<=1}, at D = d_ff), so the optimistic
    assumption cannot be improved. dominated_by is therefore NOT null for this
    lane at m = 2, d = 2: it is enumeration on time and rho on both time and
    memory. Scope: EXP-PFDR-c04716's cost table starts at m = 3 and needs
    D_0 <= 6 at 256 bits with omega = 2 (its most favourable row, m = 5,
    omega = 2, allows D_0 <= 8); the measured m = 2 law exceeds 6 from s = 6
    on, and H-PFDR-4148b8's m >= 3 closed form gives d_ff = m 2^{m-1} + ... =
    at least 81 at m = 5, an order of magnitude above what that table needs --
    conditional on H-TOP at m >= 3, which is an unproved symbolic obligation.
  heuristic_challenges:
    - heuristic: 'HEUR-002 (bounded last fall, digit form)'
      challenge: >-
        The ladder is the wrong instrument for it, and a cheaper one already
        decides it: d_lf >= d_ff by definition, so any growth of d_ff in s
        refutes HEUR-002 without measuring d_lf at all. The refutation
        therefore rests on H-PFDR-4148b8's closed form d_ff = 4 + floor(s/2)
        (reproduced with residual 0 on all 480 draws) and inherits its
        conditions: H-TOP (derived at m = 2), Wilson's rank theorem for the
        EXACTNESS direction (the unconditional part is only the upper bound),
        and the fact that H-PFDR-4148b8's status is `specified`, not confirmed.
        The d_lf ladder's own contribution is the opposite direction, that
        d_lf does not EXCEED d_ff, which R3 derives. At the tested scale the
        honest statement is: HEUR-002 is not supported, and is contradicted in
        substance by the integers (d_lf rises from 5 to 6 between s = 3 and
        s = 4 on 480 of 480 draws at three primes with certified histories);
        a bound uniform in s is excluded only through the derived d_ff law.
    - heuristic: 'HEUR-001 (last-fall semi-regularity of the null)'
      challenge: >-
        Supported where testable and NOT TESTED where it matters most. The
        offset c = d_lf - (s + 2) is exactly 1 on every uncensored NULL-1 and
        NULL-2 draw at s = 2, 3, 4 (i.e. the null's last fall is exactly
        s + 3, EXP-PFDR-5726af's D_null convention with offset 0), and at s = 5
        every one of the 615 null objects is censored by D_max = 7, so the top
        cell -- the one where a widening band would first show -- was not
        measured. The 'c grows with s' flag is an s = 1 ring-size artifact
        (OBJ-12). The heuristic's own random-model justification names 'the
        falls cascade to completion within O(1) degrees of the first' as its
        heuristic content; R3's Theorem A shows that on this family the
        cascade completes within ZERO degrees, so the O(1) band is not the
        operative uncertainty here -- the operative uncertainty is whether the
        first fall saturates, which is a different statement and is the one
        that should be carried forward.
    - heuristic: "the frozen prediction P3 (d_ff = 5, 5, 6, 6) treated as inherited fact"
      challenge: >-
        P3 is reproduced exactly (residual 0 at all 12 cells, 480 draws), and
        it is now doing more work than the contract assigned it: because
        d_lf = d_ff, P3 is the whole quantitative content of the ladder. Its
        source record is `specified`, so the strongest statement this battery
        can make about growth is conditional on a hypothesis that has not
        itself been through review.
  cost_model_challenges:
    - >-
      'D_0' in EXP-PFDR-c04716's table is a CONSTANT parameter; the measurement
      shows it is a growing function of s at m = 2 (4 + floor(s/2)). Any use of
      that table must substitute the function, not a constant, and the table's
      D_0 <= 6 requirement at 256 bits (omega = 2) is exceeded from s = 6 on.
    - >-
      The o(1)-style overheads are not the issue in this lane; the exponent is.
      The column count at the measured solving degree is B^{1.95} at s = 4, 5
      and B^{1.62} asymptotically, so even a linear-time solve of the Macaulay
      system would cost more than enumerating the digit cube. No memory-time
      interpolation rescues it: memory is also N_D.
    - >-
      Total-expected-cost bookkeeping is not attempted anywhere in this
      package, and correctly so -- it measures a degree, not an algorithm. Any
      downstream record that converts D_0(s) into a running time must multiply
      the per-attempt Macaulay cost by the inverse probability that a random
      target decomposes, which this battery does not measure (the soundness
      subsample reports 1-3 zeros per draw at toy scale and explicitly does not
      model yield; KN-FIND-007).
  reduction_and_scope_challenges:
    - >-
      SCOPE, hard limit. The non-curve (singular, nodal) cubic reproduces the
      Semaev (d_ff, d_lf) pair and the censoring status at every one of the 15
      cells. By the contract's own pre-registered F5 reading this is a
      controlled null: no Semaev-specific, no elliptic-curve-specific and no
      ECDLP statement is licensed by any number in this package. Everything
      here is a statement about a single degree-4 multilinear generator in 2s
      squarefree digit variables whose top form is the tensor square of the
      digit linear forms.
    - >-
      NULL-3 (block-factored) matches the full pair at s = 3, 4, 5 with
      difference 0 in BOTH coordinates, which is H-PFDR-4148b8's prediction for
      d_ff and, for d_lf, further evidence that the observable is a property of
      the top form alone.
    - >-
      The corollary chain 'closure solves at d_ff -> D_0(s) known -> 84cdb7's
      conditional exponent priced' is validly instantiated at m = 2, d = 2 only.
      c04716's table has no m = 2 row; extending the law to m >= 3 uses
      H-PFDR-4148b8's closed form, whose H-TOP ingredient is 'a symbolic
      obligation at m >= 3', and this experiment's own m = 3 evidence is one
      cell at s = 2 (below the formula's range) plus one cell that is not
      computable at D_max = 7.
    - >-
      Nothing here closes a lane. The negative reading ('no bounded last fall
      survives at m = 2, d = 2, s <= 5') is scoped to the tested ladder and to
      a d_ff law that is conditional and unreviewed. The named remaining open
      object is the one R5 section 5 identifies: a uniform bound would require
      Wilson's rank formula for the inclusion matrices W_{j, j+2} to fail at
      large s with 2^s <= p. That is a classical combinatorial question, not an
      elliptic-curve one, and it is the concrete successor this line should
      carry rather than a fatigue count of screened mechanisms.
  proof_architecture_challenges:
    - attack: observation-fiber
      finding: >-
        The observable (d_ff, d_lf) does NOT separate the Semaev system from a
        singular cubic with the same digit generators: the fibre contains at
        least two preimages on the same side of every conclusion. The missing
        separator is anything sensitive to sub-top terms; the top form
        determines the whole fall history here, which is exactly
        H-PFDR-4148b8's mechanism claim and is now confirmed for the LAST fall
        too.
    - attack: quantifier-order
      finding: >-
        The contract's own quantifier_order block is correct and was respected:
        'THERE EXISTS D_0 FOR ALL s' is not claimed. But the OUTCOME RULE
        silently chooses its witness after seeing the window: the OLS slope of
        a step law depends on [2, S], so 'excludes 0.5' at S = 5 and 'contains
        0.5' at S = 6 are both available from the same object. A slope test on
        a lattice-valued response must fix the window before it can quantify
        over s at all.
    - attack: boundary-and-strictness
      finding: >-
        The s = 1 boundary is embedded correctly (the digit closure reproduces
        the reduced-generator polynomial-ring closure exactly, history for
        history, on all 120 draws, and afe4ce's floor d_lf >= 2 holds on the
        raw values), and the 84cdb7 literal unreduced list differs by exactly
        the initial reduction fall at nominal degree 4, as section 2 of the
        convention predicts.
    - attack: method-ceiling
      finding: >-
        The largest claim this instrument can support is a slope statement at
        resolution 0.25 on four integer points, and it cannot reach any of the
        four branch values with an honest interval (the 4-point half-width,
        0.61, exceeds the whole spread of the branch values 0 to 1). The
        ceiling does not reach the headline. What DOES reach a headline is the
        per-draw certificate plus Theorem A, which is a derivation and needs no
        slope.
    - attack: nearby-object
      finding: >-
        Both nearby objects behave correctly: the support-matched null returns
        s + 3 rising (so the instrument is not measuring 'any multilinear
        system'), and the singular cubic returns the Semaev values (so the
        instrument is not measuring 'a smooth elliptic curve'). Together they
        localise the measurement to the digit complete intersection with a
        monomial top form -- which is a real result and is the narrowest
        supported statement.
    - attack: compositional-invariant
      finding: >-
        Deleting the iteration from the closure (multiplying only once) would
        turn the instrument into the graded-rank meter; the package checks that
        the two agree on d_ff at every cell (P1 true on 600 draws) and diverge
        exactly where they should (NULL-3 at the degenerate s = 2 boundary,
        anomaly A-NULL3-BOUNDARY). The strong invariant (the whole fall
        history) does imply the reported pair, and the reported pair is a
        strictly lossy projection of it that happens to lose nothing here
        because every history has length one.
  narrowest_supported_statement: >-
    On the tested ladder only -- m = 2, d = 2, s in {2, 3, 4, 5}, p in {4099,
    16411, 65537}, 8 curves x 5 planted targets per cell, D_max = 7, planting
    window [0, 4), the frozen convention cbdefb-closure-v1 and its C1
    certificate -- every fallen system of the digit presentation has EXACTLY ONE
    fall degree, and at that degree the closure has already computed the entire
    degree-<= d_ff part of the vanishing ideal I(Z); consequently d_lf = d_ff
    with values 5, 5, 6, 6 on all 480 Semaev draws, with residual 0 against
    H-PFDR-4148b8's derived first-fall law 4 + floor(s/2). Given the recorded
    saturation diagnostic, the identity d_lf = d_ff and the absence of any fall
    above d_ff at ANY degree are DERIVED (not fitted) on 3660 of the package's
    fallen systems. The fitted slope 0.400 with interval [0.382, 0.418] is not
    a supported statement about growth: on the four independent s-points the
    interval is [-0.2085, 1.0085], the 'HEUR-002 falsifier fires' statistic
    does not fire, and the frozen three-outcome rule could not have returned
    anything but 'unresolved' on a single-fall integer step. Because the
    singular non-curve cubic reproduces the same pair at every cell, none of
    this is a statement about summation polynomials, elliptic curves or the
    ECDLP: it is a statement about a single degree-4 multilinear generator in
    2s squarefree digit variables whose top form is the tensor square of the
    digit linear forms. HEUR-002 is not supported at this scale and is
    contradicted in substance by the integers on s = 2..5; that it fails for
    ALL s follows from d_lf >= d_ff and the derived d_ff law, and inherits that
    law's conditions (H-TOP at m = 2, Wilson's rank theorem, and the
    `specified` status of H-PFDR-4148b8). No bound uniform in s is refuted by
    the data alone, and no impossibility is claimed.
  next_concrete_action: >-
    Run ONE m = 2, s = 6 Semaev draw (p = 65537, curve seed 3101, target seed 1,
    window [0, 4)) through the frozen closure with CERTIFICATE_COLUMN_LIMIT
    raised to 4096 and D_max = 9 -- n = 12, 4017 columns, dense exactness bound
    p^2 (N + 1) = 1.73e13 < 2^53, minutes of compute under a protocol amendment
    that reports both conventions side by side -- and record the full fall
    history with dim_I_at_D, V_complete_at_D and fall_dim at every degree. This
    is the single cheapest object that (i) tests Theorem A's one undetermined
    hypothesis at the first s beyond the ladder, (ii) tests the d_ff law's next
    value (predicted 7), and (iii) removes the structural censoring that makes
    s = 6 unmeasurable under the current cap. It costs one run and it is the
    only measurement that can convert 'd_lf = d_ff at m = 2' from a per-draw
    derivation into a statement with a growth direction.
