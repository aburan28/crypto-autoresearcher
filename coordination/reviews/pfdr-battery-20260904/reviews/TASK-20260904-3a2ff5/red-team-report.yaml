  id: RT-20260904-3a2ff5
  task_id: TASK-20260904-3a2ff5
  experiment_id: EXP-PFDR-cbdefb
  hypothesis_id: H-PFDR-c88f14
  question_id: RQ-PFDR-ae2fba
  recorded_at: '2026-09-04'
  scope: >-
    m = 2, d = 2, s in {1..5} (primary fit s = 2..5), p in {4099, 16411,
    65537}, 8 curves x 5 planted targets per cell, D_max = 7, planting window
    [0, 4), the frozen closure convention cbdefb-closure-v1, toy tier. Nothing
    below transfers to cryptographic s. Joints owned: R0-R5 and the
    proves_too_much control; no verdict on the whole claim is offered.
  claim_under_review: >-
    The producer's observations block of experiments/EXP-PFDR-cbdefb/
    execution-report.yaml as quoted verbatim in review_plan.claim_under_review:
    the per-cell (d_ff, d_lf) pairs after the iteration rule, the single-fall
    statement, the slope d_lf_primary_s2_to_5 = 0.4 with ci95_t [0.3820,
    0.4180] on n = 480, the outcome label 'unresolved' on both readings, the
    'HEUR-002 falsifier statistic fires', the HEUR-001 null band, the F5
    controlled-null flags and the NULL-3 comparison.
  per_joint_result:
    - joint: >-
        R0 raw/summary agreement: slopes, labels, band table, iteration counts
        and the count-1 rule from the raw records
      result: holds
      attack_executed: >-
        Regenerated analysis.md sections C-M from runs/*/raw-result.json only,
        with my own loader and my own OLS / t-interval code (r0_regenerate.py,
        r0_controls.py, r0r1_fits.py), then diffed against analysis.json,
        analysis.md and execution-report.yaml. Also rebuilt S~ =
        S_3(ell_1, ell_2, x_R) from the review plan's formula with the meter's
