  task_id: TASK-20260904-642cf5
  joint: V1 blind re-derivation of (d_ff, fall_dim) and the per-layer profile at the deciding cell
  phase: A (blind) -- written before any manifest result block, sidecar or stage0-predictions.yaml was
    opened
  written_at_utc: '2026-09-04T02:15:12Z'
  derived_from: review_plan.blind_rederivation.quantity and .parameters of ledger/handoffs/TASK-20260904-642cf5.yaml,
    plus the run.inputs.parameters block of experiments/EXP-PFDR-5726af/runs/RUN-PFDR-5726af-m2-s3/manifest.yaml
    (convention string only). No producer implementation, note or report was read; harness/macaulay_fp
    was neither read nor imported.
  conventions_used:
    ring: B = F_p[a_{1,0},a_{1,1},a_{1,2},a_{2,0},a_{2,1},a_{2,2}]/(a_{k,i}^2 - a_{k,i}); 64 squarefree
      monomials; monomial product = union of variable supports; grading = squarefree degree of the reduced
      representative
    linear_forms: ell_k = a_{k,0} + 2 a_{k,1} + 4 a_{k,2}
    S3_formula: S_3(x1,x2,x3) = (x1-x2)^2*x3^2 - 2*((x1+x2)*(x1*x2+a) + 2*b)*x3 + (x1*x2-a)^2 - 4*b*(x1+x2)
    generator: S~ = S_3(ell_1, ell_2, x_R) reduced in B; delta = deg S~ = 4
    rows: 'PER-LAYER: rows { mu * S~ reduced in B : mu squarefree monomial with deg mu = D - 4 } for D
      = 4,5,6,7 (1, 6, 15, 20 rows)'
    full_rank: rank over F_p of the rows as vectors on all 64 monomial columns
    top_rank: rank over F_p of the same rows restricted to the columns of squarefree degree exactly D
    fall_dim: full_rank(D) - top_rank(D)
    d_ff: least D in {4,...,7} with fall_dim(D) > 0
    arithmetic: exact Gaussian elimination modulo p on Python integers (own code); no floating point;
      no import of harness/macaulay_fp
  self_checks:
    C1_boolean_evaluation_identity: PASS -- for all 12 instances and all 64 digit assignments, S~ evaluated
      at the assignment equals S_3(x1,x2,x_R) in plain F_p arithmetic with x_k = sum_i 2^i a_{k,i}
    C2_top_form: PASS -- degree-4 part of S~ equals top(ell_1^2)*top(ell_2^2) = (4 a10a11 + 8 a10a12 +
      16 a11a12)(4 a20a21 + 8 a20a22 + 16 a21a22) at all 12 instances (9 monomials, leading coefficient
      16)
    C3_rank_cross_check: PASS -- rank_mod_p agrees with sympy DomainMatrix(GF(p)).rank() on every row
      matrix of 4 instances at D = 4..7 (full and top) and on 20 random matrices
    script: v1_selfcheck.py / v1_selfcheck_output.txt
