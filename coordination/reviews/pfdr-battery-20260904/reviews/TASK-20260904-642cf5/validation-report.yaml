        would need step 2 (a measured ratio against a baseline) in its own right.
    - check: resource records
      result: pass
      detail: >-
        Every manifest carries wall_seconds, peak_rss_bytes and cpu_seconds
        (0.30 s / 60 MB at the gate to 1267.9 s / 132 MB at m2-s6, and 427 MB
