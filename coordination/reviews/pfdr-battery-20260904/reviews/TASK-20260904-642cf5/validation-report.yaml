      caveat: >-
        experiments/EXP-PFDR-5726af/stage0-predictions.yaml was itself first
        committed WITH the run package (89dc58e3), so its own
        "written_before_any_official_rank: true" is self-attested. That does not
        weaken the binding, because every number in it restates the contract
        committed earlier; but the independent evidence is the contract commit,
        not the file's own flag. The file also discloses a pre-registration
        scratch benchmark that printed rank profiles at m = 2, s in {3,4,5,6},
        p = 4099 on an ad-hoc curve before it was written -- disclosed by the
        producer, and neutralised by the earlier contract commit.
    - check: sample integrity
      result: partial
      detail: >-
        Sample sizes, seeds and the sampling procedure are in every manifest and
        match the contract. The per-draw null values are in raw-result.json,
        which is blind_from for this task, so I did not recompute the producer's
        null samples; I generated my own nulls instead and they reproduce the
        predicted dispositions. Regeneration from the raw records is joint R0.
    - check: correspondence validity
      result: not applicable
      detail: no substitute sampling; every quantity is computed directly at the tested primes
    - check: scale binding
      result: pass
      detail: >-
        The contract declares scale_relevance tier "toy", p in {4099, 65537},
        s <= 6 (s <= 8 for H-WIL), matrices of at most 64 columns at the deciding
        cell, and states that no transfer to cryptographic s is claimed. That is
