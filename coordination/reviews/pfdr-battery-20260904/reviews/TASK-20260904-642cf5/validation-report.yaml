      recorded_value: >-
        manifest RUN-PFDR-5726af-m2-s3 semaev_d_ff_values = twelve 5s,
        semaev_fall_dim_values = twelve 4s, spreads [5] and [4]
      agreement: exact on all 12
      note: >-
