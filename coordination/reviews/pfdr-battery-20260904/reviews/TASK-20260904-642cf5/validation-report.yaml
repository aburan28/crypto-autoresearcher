        term and its degree-4 part is 16 a10 a11 a20 a21.
    - check: ceiling and nearby control
      result: not owned
      detail: 'the nearby objects and the proves-too-much control are assigned to TASK-20260904-ed0e8f (R4 and proves_too_much); I neither ran nor assessed them'
    - check: quantifier fidelity
      result: not owned
      detail: >-
        The hypothesis quantifies over all s with 2^{m-1} <= s and 2^s <= p while
        the direct check covers s <= 8 at two primes. Scoping that gap is joint
