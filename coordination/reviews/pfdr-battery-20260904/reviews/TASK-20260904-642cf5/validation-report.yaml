    - quantity: 'support-matched null d_ff at (2,2,3)'
      method: BLIND; my own random polynomial on S~'s exact support, two per instance (24 draws)
      my_value: 'd_ff = 6 on all 24 draws with fall_dim(6) = 14; per-layer (1,1,0), (6,6,0), (15,1,14), (20,0,20)'
      recorded_value: 'manifest null1_d_ff_histogram = 60 draws at 6, null1_at_D_null 60, null1_below_D_null 0'
      agreement: exact on d_ff; the manifest records no fall_dim for this arm, so 14 is uncompared
    - quantity: 'S~ itself at the s = 2 gate cell (p = 4099, a = 527, b = 72, x_R = 2374)'
      method: >-
        own construction in 4 squarefree variables, compared term by term with
        the generator string printed in the gate manifest's CTRL-S2-HAND-FIXTURE
        block (v2_s2_generator_check.py)
      my_value: '16 terms; degree-4 part 16*a10*a11*a20*a21; per-layer (1,1,0), (4,0,4), (6,0,6); d_ff 5, fall_dim 4'
      recorded_value: identical 16-term generator, identical profile, identical meter oracle
      agreement: >-
        term-by-term identical. This is the sharpest available check that the
        producer's S~ is the object the task card defines, because it is the one
        cell whose generator the manifests print in full.
    - quantity: 'N_sol, the number of digit-space solutions per draw at (2,2,3)'
      method: own enumeration of (x1, x2) in {0..7}^2 with S_3(x1, x2, x_R) = 0 mod p
      my_value: '[2,2,2,2,2,2,2,2,1,1,2,2] in the manifest''s draw order'
      recorded_value: manifest N_sol_values, identical
      agreement: exact on all 12; every solution also lies inside the planting window [0,4)^2
    - quantity: 'H-WIL rank table, 112 cells'
      method: own construction of multiplication by ell^2 from degree j to j+2 on F_p[a]/(a_i^2) and own elimination, cross-checked against sympy DomainMatrix over GF(p) on every cell
      my_value: '112 of 112 at rank min(C(s,j), C(s,j+2)); nothing below the maximum; the 16 square-map cells (s = 2,4,6,8 at j = (s-2)/2) at ranks 1, 4, 15, 56 per prime per ell variant'
      recorded_value: 'manifest cells 112, all_full_rank true, below_maximum [], square_maps 16 entries with rank_meter_top = rank_independent = expected'
      agreement: exact, cell by cell on the 16 recorded square maps and on the three aggregate assertions
    - quantity: 'S_4 top form at m = 3'
      method: own sympy resultant Res_T(S_3(x1,x2,T), S_3(x3,x_R,T)) over Z[a,b,x_R]
      my_value: 'total degree 12 in (x1,x2,x3), per-variable degrees [4,4,4], 125 monomials; the degree-12 part is the single monomial x1^4 x2^4 x3^4 with coefficient exactly 1, free of a, b and x_R'
      recorded_value: 'manifest S4_total_degree_in_x 12, S4_per_variable_degree [4,4,4], S4_term_count 125, top_form_is_single_monomial true, c = 1, c_is_nonzero_integer_constant true'
      agreement: exact, including the term count

  control_checks:
    - control: NULL-2-BLOCK-FACTORED at the deciding cell
      status: reproduced independently
      detail: >-
        My own homogeneous block-factored nulls return (5, 4), the Semaev value,
        confirming the contract's forced disposition at s = 3. What this means
        is a scope point, not a defect: a curve-free object reproduces the
        observable exactly, so the deciding cell carries NO curve information
        and is a statement about the block-tensor structure of the presentation,
        not about any elliptic curve.
    - control: NULL-1-SUPPORT-MATCHED at the deciding cell
      status: reproduced independently
      detail: >-
        My own support-matched nulls fall at 6 = D_null, never at 5, on 24 of 24
        draws. This is the null object that must destroy the effect, and it does:
        the strict early fall is not a degree-profile or support artifact. Note a
        wording difference: the task card asks for uniformly random NONZERO
        coefficients and the contract says uniform F_p coefficients. I used
        nonzero; at p >= 4099 the difference is negligible and would only make
        the null more degenerate, not less.
    - control: CTRL-H-WIL-DIRECT-RANK
      status: recomputed independently, 112/112
      detail: 'a curve-free control; my table agrees with the manifest at every recorded cell'
    - control: CTRL-H-TOP-SYMBOLIC
      status: recomputed independently
      detail: >-
        Top form confirmed as the single monomial with constant coefficient 1.
        I added a control the run did not record: on 8 random curves at p = 65537
        S_4 vanishes 8/8 on planted 4-tuples P1+P2+P3+P4 = O AND is nonzero 8/8
        when x_R is replaced by a uniformly random value. Without that negative
        leg, "S_4 vanishes on planted triples" is compatible with S_4 vanishing
        identically; it does not.
    - control: CTRL-S2-HAND-FIXTURE (instrument gate)
      status: recomputed independently
      detail: 'gate_pass true; my independent rebuild of the generator and profile agrees exactly'
    - control: 'null-object discipline (docs/inventor-protocol.md section 3)'
      status: satisfied for the joints checked
      detail: >-
        The design measures the observable against three nulls of the same
        shape, and the report states what each should do. The discriminating
        quantity is the gap D_null - d_ff, which is 0 at s = 2, 1 at s = 3 and 4,
        2 at s = 5 and 6 -- it grows as the derivation says it should rather than
        staying constant, which is the decay behaviour a real effect owes.

  heuristic_validation_checks:
    - check: pre-registered prediction
      result: pass
      detail: >-
        Verified from git rather than from the producer's word. The contract
        carrying the deciding-cell prediction (Semaev (5,4), NULL-2 identical,
        NULL-1 at 6, mixed-block at 6, the full ladder and the m = 3 values) was
