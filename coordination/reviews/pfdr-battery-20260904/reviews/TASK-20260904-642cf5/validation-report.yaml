  joints:
    - joint: 'V1 blind re-derivation of (d_ff, fall_dim) and the per-layer profile at the deciding cell'
      result: holds
      attack_executed: >-
        Implemented review_plan.blind_rederivation.quantity from its statement
        alone in phase A (v1_blind_rederive.py): B on 6 squarefree variables as
        the union-convolution algebra on 64 masks, ell_k = a_{k,0} + 2 a_{k,1} +
        4 a_{k,2}, S~ = S_3(ell_1, ell_2, x_R) reduced, per-layer rows
        {mu S~ : deg mu = D - 4} for D = 4..7, full rank on all 64 columns and
        rank on the degree-D columns, by my own exact elimination mod p. Run on
        the 12 declared instances and on my own block-factored and
        support-matched nulls. Three self-checks: the Boolean-evaluation
        identity against plain F_p arithmetic at all 64 digit assignments of all
        12 instances; the degree-4 top form against
        top(ell_1^2) top(ell_2^2); and every rank against sympy DomainMatrix
        over GF(p). All three pass.
      numbers: >-
        Semaev arm 12/12 at (d_ff, fall_dim) = (5, 4) with (full, top) =
        (1,1), (6,2), (15,1) at D = 4,5,6 and (20,0) at D = 7. Block-factored
        nulls 4/4 at (5, 4). Support-matched nulls 24/24 at d_ff = 6 with
        fall_dim(6) = 14. Supplementary (not part of the quantity): 40 random
        curves per prime, 80/80 at (5, 4) with the same profile.
      deciding_fact: >-
        The quantity was NOT underspecified: the task card's statement fixes the
        ring, the grading, the generator, the per-layer row convention and both
        ranks, and I needed nothing from the producer to compute it. The blind
        value equals the contract's frozen (5, 4) on every declared instance and
        equals the manifests' recorded values. An implementation that was wrong
        but self-consistent would have had to be wrong in exactly the same way
        as an implementation that never saw it, on 12 instances, two primes and
        four degree layers.
    - joint: 'V2 run-set validity, manifest schema and pinning, seed integrity, frozen-prediction binding'
      result: holds
      attack_executed: >-
        v2_runset_check.py over all ten run directories: file presence, sidecar
        digest recomputation, status, commit and dirty flag, run-script and
        meter hash identity, stage0 binding, seeds, convention, D_max, workers
        and the session inference block; plus git ancestry, an exact
        reconstruction of the m3-s5 dirty diff, and a git-based check that the
        contract predates the runs and was never edited.
      numbers: >-
        10/10 completed_valid; 7/7 files each; 60/60 sidecar digests match;
        1 distinct run-script hash across ten manifests; 15/15 pinned executed
        files identical across ten manifests; 10/10 stage0 digests equal the
        file; seeds equal to the contract in 10/10; D_max = D_null + 1 at 8/8
        cells; workers 1 in 10/10.
      deciding_fact: >-
        None of the plan's breaking artifacts occurred. The two apparent
        anomalies both resolve completely: the m2-s6 commit differs only by an
        unrelated experiment's package, and the m3-s5 dirty tree reproduces byte
        for byte as `git diff 3a9c1b02 1b49d491`, 49 paths all under
        experiments/EXP-PFDR-fd901a/, touching no executed file. Recorded
        deviations that are not breaks: run.inference omits 10 of 15 template
        fields (content present in inputs.parameters.session_inference), and
        run.code.commit appears to be resolved at manifest-write time rather
        than at launch (m2-s6 records a commit created 47 s after its
        started_at), which is immaterial because every executed file is pinned
        by digest.
    - joint: 'V3 instance and certificate checks on the declared deciding-cell instances'
      result: holds
      attack_executed: >-
        v3_instance_certificates.py with my own F_p and elliptic-curve
        arithmetic (Tonelli-Shanks, affine addition and doubling): singularity
        and special-j screen, enumeration of on-curve x in the planting window
        [0,4), and every pair of window points under every sign choice summed to
        test whether x_R is among the resulting x-coordinates. Plus an
        independent recomputation of the digit-space solution count.
      numbers: >-
        12/12 non-singular (4a^3 + 27b^2 != 0) with a, b != 0; window x-sets
        {1,2,3}, {0,2}, {2,3}, {2,3}, {0,3}, {0,2,3}; 12/12 have at least two
        distinct on-curve window x; 12/12 x_R values are window-pair sums, so
        every planted target carries an independent decomposition certificate
        that needs no summand from the raw record. N_sol recomputes 12/12
        against the manifest.
      deciding_fact: >-
        The certificates all verify, and the anticipated duplicate is real: at
        p = 65537, curve seed 1103, target seeds 1 and 2 both give x_R = 47685,
        so the twelve declared draws cover ELEVEN distinct (p, a, b, x_R)
        instances, not twelve. Two further draws (p = 65537, curve 1102)
        certify only through a doubling P + P and have N_sol = 1 rather than 2.
        The replication count for the deciding cell should be stated as 12 draws
        over 11 distinct instances on 6 curves, not as 12 independent instances.
    - joint: 'V4 independent recomputation of the H-WIL rank table and the S_4 top form'
      result: holds
      attack_executed: >-
        v4a_hwil_table.py builds multiplication by ell^2 from degree j to j+2 on
        F_p[a_1..a_s]/(a_i^2) for s = 2..8, every j with j+2 <= s, both primes
        and both ell variants, and takes the rank with my own elimination and
        again with sympy DomainMatrix over GF(p). v4b_s4_topform.py builds S_3
        from the formula, takes Res_T over Z[a,b,x_R], extracts the degree-12
        part in (x1,x2,x3) and adds a positive and a negative numeric control.
      numbers: >-
        112 cells computed, 112 at rank min(C(s,j), C(s,j+2)), zero below the
        maximum, my rank equal to sympy's on 112/112; the 16 square maps
        (s = 2,4,6,8 at j = 0,1,2,3) at ranks 1, 4, 15, 56 per prime per variant,
        equal to the 16 entries the hwil manifest records. S_4: degree 12,
        per-variable [4,4,4], 125 monomials, top form x1^4 x2^4 x3^4 with
        coefficient 1, constant; planted 4-tuples 8/8 vanish, random x_R 8/8
        does not.
      deciding_fact: >-
        No (s, j, p) has rank below the maximum, so exactness is not withdrawn
        anywhere in the tested range, and the top form is a single monomial
        whose coefficient is the integer 1 and therefore cannot vanish modulo any
        prime. Both of the plan's breaking artifacts are absent. Scope: this
        establishes the H-WIL statement AT s <= 8 and p in {4099, 65537} by
        direct computation and nothing beyond it; the general-s claim still rests
        on Wilson's formula, which is joint R2's business, not mine.

  observations_for_the_composer:
    - >-
      Boundary-cell degeneracy at s = 2, recorded not adjudicated: the gate run
      records P3_null2_minus_semaev_all_zero FALSE with 60 entries at
      fall_dim_diff -3, and F4_null1_falls_at_semaev_value_any_seed TRUE, while
      gap_D_null_minus_d_ff is 0 there. Both flags are set honestly by the
      producer. At that cell d_ff = D_null = 5, so "falls early" and "falls at
      D_null" are the same event and the arm has no discriminating power by
      construction. The deciding cell s = 3 records P3 true and F4 false. The
      contract's stopping rule and falsification criterion F2 are worded
      "at the deciding cell" and "on any draw" respectively; whether the s = 2
      result should have gated the ladder is a protocol question for the
      composition task and the fall_dim identity is joint R1. I record only the
      numbers as the manifests carry them.
    - >-
      Contract wording inconsistency, harmless at m = 2: the frozen prediction
      formula for D_null is floor((m s + m e)/2) + 1 in
      inputs.frozen_prediction_file and in stage0-predictions.yaml, but is
      written floor((m s + 2 m)/2) + 1 in the CTRL-CONFOUNDERS-NAMED control.
      The two agree at m = 2 (m e = 2 m = 4) and disagree at m = 3 (13 versus
      10). Every recorded D_null follows the first form, which is the one the
      frozen prediction file uses, so no scored comparison is affected.
    - >-
      Scope point a reader can get wrong: the block-factored null reproduces the
      Semaev arm exactly at the deciding cell, which is the hypothesis's own
      prediction. It follows that nothing measured at this cell is evidence
      about elliptic curves; the observable is a property of the block-tensor
      structure of the digit presentation. Any downstream sentence of the form
      "the Semaev system at (2,2,3) behaves thus" should read "any generator
      with this block-tensor top form behaves thus".

  limitations:
    - >-
      L1. The twelve instances are as DECLARED in the task card by the
      Coordinator. The seed -> (a, b, x_R) derivation is implemented in
      run_pfdr_5726af.py, which is blind_from for this task, so I could not
      check that curve seed 1102 at p = 65537 really yields a = 703, b = 52025.
      Every checkable consequence is consistent: each declared instance is a
      genuine non-singular curve, each x_R is a genuine window-pair sum, my
      recomputed N_sol matches the manifest draw for draw, and my independently
      built S~ matches the gate manifest's printed generator term by term.
    - >-
      L2. The per-layer rank profile at the deciding cell could not be compared
      with a recorded value; the manifests expose only d_ff and fall_dim there.
      My (1,1), (6,2), (15,1) stands as an independent value awaiting R0's
      regeneration from the raw records.
    - >-
      L3. Two files per run (raw-result.json, stdout.log) are blind_from. I
      verified their digests against package-sha256.json without reading them,
      so their INTEGRITY is checked and their CONTENT is not. Raw/summary
      agreement is joint R0.
    - >-
      L4. My verdict covers joints V1-V4 only. I did not examine R0-R4, the
      proves-too-much control, the fall_dim identity, the Wilson dependence, the
      ALPF-011 citation, or the nearby objects, and I read no sibling report.
    - >-
      L5. Everything here is at toy scale: p in {4099, 65537}, 64 columns at the
      deciding cell, s <= 8 for H-WIL. Nothing in this report speaks to
      cryptographic parameters, and a first fall degree is not a solving degree,
      a cost or an exponent.
    - >-
      L6. model_verified is false. The adapter binding and the runtime-reported
      identifier agree (claude-opus-5) but no backend probe was run from this
      session.

