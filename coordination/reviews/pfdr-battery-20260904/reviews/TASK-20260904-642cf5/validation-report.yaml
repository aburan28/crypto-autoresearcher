  cost_model_checks:
    - check: cost table present
      result: not applicable
      detail: >-
        The package reports no concrete-cost table and claims no speedup. Its own
        interpretation_limits state that a first fall degree "is not a solving
        degree, not a cost, and not an exponent; nothing on any attack axis
        moves." Because no improvement is claimed, the scaled-down-measurement
        ladder of docs/inventor-protocol.md section 6 is not triggered here; any
