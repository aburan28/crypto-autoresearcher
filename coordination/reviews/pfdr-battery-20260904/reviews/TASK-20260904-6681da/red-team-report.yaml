red_team_report:
  id: RT-20260904-6681da
  id_allocation_provenance: >-
    Derived from the task id, not minted: RT-* is not a ledger record type in
    tools/allocate_id.py and this agent allocated no identifier. The report is
    a review artifact under the task's write scope, not a ledger record.
  task_id: TASK-20260904-6681da
  experiment_id: EXP-PFDR-c04716
  hypothesis_id: H-PFDR-06fd60
  question_id: RQ-PFDR-ae2fba
  reviewed_snapshot: >-
    Coordinator-committed state at HEAD 6468b25e ("review-plan(TASK-20260904-*):
    open the blinded evidence-review round for the RQ-PFDR-ae2fba battery"),
    branch claude/degree-regularity-polynomial-systems-pssesi, clean tree apart
