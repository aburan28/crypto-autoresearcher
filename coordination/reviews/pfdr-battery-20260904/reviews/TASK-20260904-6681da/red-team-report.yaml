  claim_under_review: >-
    The joints R1-R4 of the review plan of TASK-20260904-6681da, applied to the
    producer's observations for EXP-PFDR-c04716 / runs/STATIC-001 and to the
    arithmetic of H-PFDR-06fd60: specifically (R1) the generator degree behind
    the null slice and the Macaulay degree of every bounded-slice cell at
    m >= 3; (R2) HEUR-001's second clause, "the degree-D_0 Macaulay matrix
    determines the solutions"; (R3) the marginal-cost sign flip, the null-slice
    reproduction, the interior band and the four k* anomalies; (R4) the honesty
    and scope of concrete-cost.yaml. NOT reviewed here and deliberately not
    voted on: package integrity and determinism (V1), independent recomputation
    of the archived cells (V2), the literal accounting of the frozen success
    criterion and P1-P5 (V3), and therefore the claim as a whole.

  joint_results:
    - joint: 'R1 generator degree at m >= 3 and the Macaulay degree floor of every bounded-slice cell'
      attack_executed: >-
        (i) Measured the total degree and per-variable degrees of
        S_{m+1}(x_1..x_m, x_R) for m = 2, 3, 4, 5 with my own instrument
        (rt_degree_probe.py: numeric Sylvester resultants over F_p,
        p = 2^61 - 1, plus exact Lagrange interpolation along a random line;
        no CAS, no harness/semaev.py, no sympy substitution -- deliberately
        avoiding the confirmed s4_expr defect of KN-OPEN-5b3a08). (ii)
        Validated that instrument against a known answer (rt_semaev_control.py:
        S_3..S_6 vanish on 5/5 genuine zero-sum point tuples on a real curve and
        do not vanish at random tuples) and against EXP-PFDR-5726af's symbolic
        S_4. (iii) Derived that the digit substitution and the multilinear
        reduction preserve the degree (block-multigrading argument, no
        cancellation), and checked it directly at (m,s) = (2,2), (2,3), (2,5),
        (3,4) by Moebius inversion over the Boolean cube. (iv) Recomputed the
        row count Ncols(n, D_0 - delta) at all 54 table cells and at the
        thresholds grid, re-solving the package's balance myself
        (rt_cost_recheck.py reproduces (256, m 5, D_0 4, omega 2) as
        s = 53.8813, n = 269, log2 T = 108.7625, identical to the archived
        cell). (v) Recomputed the null slice with the corrected degree. (vi)
        Priced the two corrected D_0 floors.
      derivation: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da/derivation-R1-generator-degree.md
      result: breaks
      deciding_number: >-
        deg S_{m+1} in the m unknowns = m 2^{m-1} = 4 / 12 / 32 / 80 at
        m = 2 / 3 / 4 / 5 (per-variable degree 2^{m-1}, matching the program's
        own KN-TECH-002 "deg of S_n in each variable is 2^{n-2}"), and the
        substitution preserves it, so delta = m min(2^{m-1}, s) = m 2^{m-1} at
        every table cell. Hence D_0 - delta < 0 and
        rows(D_0) = Ncols(n, D_0 - delta) = 0 at ALL 54 cells and at every
        D_0 = 2 threshold row. The '2m' of H-PFDR-06fd60 (A) and
        IDEA-20260830-84cdb7 (A) ("degree 2 in each x_k") is correct only at
        m = 2, which is not in the grid.
    - joint: 'R2 bounded last fall versus bounded solve: the row-count obstruction to HEUR-001'
      attack_executed: >-
        Took the cost model at face value with an arbitrary generator degree
        delta and derived rank <= rows(D) = Ncols(n, D - delta) against
        cols(D) = Ncols(n, D); computed the smallest D at which the deficiency
        falls to N_sol for N_sol in {1, m!, 2^m m!}; then examined the closure
        (degree-fall) loophole that the plain count ignores, bounded the first
        fall below by delta + 1, and priced the closure reading at the
        package's own balance point against the full-guessing leaf and against
        the whole digit cube. Checked the derived bound against
        EXP-PFDR-cbdefb's measured (d_ff, d_lf) at m = 2 and its m = 3 Stage 3
        cell.
      derivation: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da/derivation-R2-row-count.md
      result: breaks
      deciding_number: >-
        For the plain matrix the deficiency Ncols(n, D) - Ncols(n, D - delta)
        does not fall to O(1) until D >= n + delta - 1 (348 at n = 269,
        delta = 80), so no D_0 fixed independently of n can determine the
        solutions. The closure loophole cannot act below the generator degree
        (a fall needs a multiplier of degree >= 1, so d_ff >= delta + 1 = 81 at
        m = 5 -- and cbdefb measures exactly d_ff = delta + 1 at its boundary
        cells: 5 at (m 2, s 2), 7 at (m 3, s 2)). At the derived first-fall
        degree the one rank costs 2^504 at the (256, m 5) balance versus 2^216
        for full guessing and 2^269 for the whole cube.
    - joint: 'R3 marginal-cost sign flip, null-slice reproduction, interior band and the k* anomalies'
      attack_executed: >-
        Re-derived C(k+1)/C(k) under both slices with the finite-n correction
        and compared the exact ratio with the asymptotic 2 (1 - D_0/(n-k))^omega
        at and around the predicted crossing for all (D_0, omega); recomputed
        the null-slice fixture with the CORRECTED generator degree; re-derived
        k_c and the interior-band cost under both degree conventions; and
        recomputed the four 64-bit cells where P3's k* = 0 fails, including the
        total the frozen model's own optimum implies there.
      derivation: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da/derivation-R3-marginal-and-interior-band.md
      result: holds
      deciding_number: >-
        The sign derivation is right: exact log2 ratios bracket 0 within 1-3
        residual variables of the predicted crossing D_0/(1 - 2^{-1/omega})
        (e.g. D_0 = 4, omega = 2: predicted 13.66, exact sign change between
        n-k = 11 and 13), and the null slice stays strictly decreasing with
        argmin at the leaf even with delta = m 2^{m-1} (ratios -1.00 and
        -1.807 = 1 - omega). P5's binom(2(D_0-m), D_0) is a formula slip
        (the residual column count is Ncols(2(D_0-m), D_0) = 2^{2(D_0-m)} for
        D_0 <= 2m, e.g. 4 not 0 at (m 3, D_0 4)); the corrected band cost
        2^{n - (2 - 2 omega)(D_0 - m)} is still exponential in n, so the
        qualitative claim survives. A1 is the model's own leaf charge: at the
        four cells the model's optimum is the enumerative balance
        (log2 T = 72.58 at m = 3, 76.58 at m = 4), not the tabulated k = 0
        value, and all four stay >= 2^40 above rho either way.
    - joint: 'R4 concrete-cost honesty, cost-unit bookkeeping and scope against the target profile'
      attack_executed: >-
        Audited concrete-cost.yaml line by line against
        docs/evidence-and-reproducibility.md "Concrete-cost estimation
        artifacts" and docs/target-result-profile.md A8 / C13-C15: declared
        unit versus the unit of the prior; both omega; memory as a first-class
        column including the solver's own working set; the o(1) disclosure;
        parallelism; the time-memory interpolation; total-versus-per-attempt
        cost; affected-vs-safe scope; the unpriced S_{m+1} construction. Two
        new computations: the group-op/field-op conversion at which each
        near-tie cell flips, and a lower bound on the number of nonzero terms
        of the generator that must be written down.
      derivation: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da/derivation-R4-cost-honesty.md
      result: breaks
      deciding_number: >-
        (a) cost_unit is "F_p field operations" but prior_time_log2 = 127.8254
        is 0.886 sqrt(N) GROUP operations, subtracted directly; any conversion
        of >= 2 field ops per group operation (every addition formula exceeds
        it) flips (256, m 4, D_0 4, omega 2) at +0.914, (256, m 5, D_0 6,
        omega 2.807) at +0.226 and (128, m 5, D_0 4, omega 2) at +0.219, and
        moves the frozen 256-bit threshold row for (m 4, omega 2) from
        "T >= rho at D_0 = 4" to "T < rho at D_0 = 4". (b) The top-degree part
        of the generator alone has binom(s, 2^{m-1})^m = 2^221.3 nonzero terms
        at the (256, m 5, D_0 4, omega 2) cell, exceeding that cell's ENTIRE
        claimed cost 2^108.76 by 2^112.5, and the same at every m = 5 cell;
        the assumption is flagged but unquantified. (c) The tabulated memory is
        the factor base only: the dense Ncols(n, D_0)^2 working set the
        Ncols^omega charge presupposes exceeds it by up to 2^39.9 at three of
        the four cells declared affected.

  proves_too_much_control:
    assigned: true
    table: coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da/proves-too-much-table.md
    objects:
      - object: 'the direct presentation with membership degree B under the same table machinery'
        conclusion_known_false_because: >-
          IDEA-20260808-afe4ce's floor d_lf >= B for a set-theoretically
          described factor base and IDEA-20260808-da1428's full-guessing
          optimum (which the package's own fixture F2 reproduces).
        what_the_argument_did: >-
          Ran unchanged with D(k) = D_0 and the package's own dense residual
          column count binom(D_0 + (m-k), m-k); emitted 12 sub-rho cells of 18
          at 256 bits (every m in {4,5} cell, both omega, every D_0), the best
          at log2 T = 94.95 against rho 127.83, with B = 2^47..2^70 at the
          balance, i.e. an assumed D_0 in {4,6,8} against a proven floor of
          2^47 or more.
        failure_signature_appeared: true
        where_the_survival_happens: >-
          Nowhere localised: no step of the argument ever compares D_0 with any
          generator degree. D_0 enters only through Ncols(., D_0); the object
          enters only through n, m and a column-count convention. The row count
          Ncols(n, D_0 - delta) appears nowhere in the model, so the generator
          degree is not an input to any cell.
      - object: 'the digit presentation at m = 2 (generator degree exactly 4 = 2m)'
        conclusion_known_false_because: 'the assembly exponent 2/(m+1) = 2/3 exceeds 1/2, so no m = 2 cell can beat rho'
        what_the_argument_did: >-
          All 18 m = 2 cells emitted above rho, minimum margin +40.48 in log2
          (64 bits, D_0 4, omega 2), maximum +137.44. m = 2 is also the only
          region of the grid where the priced matrix has any rows
          (delta = 4, so D_0 in {6,8} gives 2.5e4..2.0e8 rows).
        failure_signature_appeared: false
        note: 'the object passes; the arithmetic is right where the object is right'
      - object: 'the m in {3,4,5} cells with D_0 below the generator degree m 2^{m-1}'
        conclusion_known_false_because: 'a Macaulay matrix at degree D_0 < delta has no rows and cannot determine anything'
        what_the_argument_did: >-
          Emitted a finite cost and a finite total for every one of the 54
          cells, including the four it reports as beating rho, with
          rows = Ncols(n, D_0 - delta) = 0 at every one.
        failure_signature_appeared: true
        where_the_survival_happens: >-
          At the cost primitive itself: C(k) = 2^k Ncols(n-k, D(k))^omega is a
          COLUMN count raised to a matrix-multiplication exponent, so an empty
          matrix and a solving matrix of the same width are charged the same.
      - object: 'D_0 = 2 (below the generator degree even at m = 2)'
        conclusion_known_false_because: 'delta >= 4 for every m >= 2, so the degree-2 Macaulay matrix has no rows'
        what_the_argument_did: >-
          Emitted four sub-rho cells at 256 bits: (m 4, omega 2) 118.64,
          (m 4, omega 2.807) 123.54, (m 5, omega 2) 100.25, (m 5, omega 2.807)
          104.36, reproducing thresholds.yaml's own 118.6. These cells are
          load-bearing: they are the "largest even D_0 with T < rho" entries
          behind the frozen bracket "(m 4, omega 2): between 2 and 4".
        failure_signature_appeared: true
        where_the_survival_happens: 'same primitive as object 3'

  objections:
    - id: OBJ-1
      severity: fatal_to_the_m_ge_3_cells
      statement: >-
        The digit-substituted generator has reduced total degree
        delta = m 2^{m-1} (12, 32, 80 at m = 3, 4, 5), not the 2m of
        H-PFDR-06fd60 (A). Every bounded-slice cell in the table, and every
        threshold row, charges Ncols(n, D_0)^omega for a Macaulay matrix at a
        degree BELOW the generator's own degree, i.e. for a matrix with zero
        rows. The four cells reported as beating rho are among them.
      evidence: >-
        rt_degree_probe.py (this task, instrument validated by
        rt_semaev_control.py and by EXP-PFDR-5726af's symbolic degree 12);
        KN-TECH-002 / KN-LIT-001 record the classical per-variable law
        2^{n-2}; rt_cost_recheck.py R1.cells for the row counts.
    - id: OBJ-2
      severity: fatal_to_HEUR_001_at_the_tabulated_D_0
      statement: >-
        HEUR-001 with D_0 in {2,4,6,8} is not merely unmeasured at m >= 3, it
        is excluded by the generator's degree: a degree fall needs a multiplier
        of degree at least 1, so d_lf >= d_ff >= delta + 1 = 13 / 33 / 81 at
        m = 3 / 4 / 5. Any D_0 that could satisfy HEUR-001 is at least
        m 2^{m-1}. This is a floor, in the sense of IDEA-20260808-afe4ce,
        that H-PFDR-c88f14 (structural_ingredients) states as "vacuous
        (d_lf >= d)" for the digit presentation; that statement is wrong.
      evidence: >-
        derivation-R2-row-count.md step 3; the frozen closure definition of
        EXP-PFDR-cbdefb stage1-closure-convention.md (W_0 uses nominal
        multiplier degree, so W_0(D) = 0 for D < deg S~); cbdefb's own
        measured d_ff = delta + 1 at (m 2, s 2), (m 2, s 3) and (m 3, s 2).
    - id: OBJ-3
      severity: fatal_to_the_priced_solve
      statement: >-
        Even granting a generator of degree delta and ignoring OBJ-1, the
        priced object cannot do what HEUR-001's second clause asks. The
        degree-D_0 Macaulay matrix has at most Ncols(n, D_0 - delta) rows
        against Ncols(n, D_0) columns, so its corank is at least
        sum_{D_0 - delta < i <= D_0} binom(n, i), which stays astronomically
        above N_sol = O(1) until D_0 ~ n + delta. A bounded solve is available
        only through degree falls, i.e. through a closure whose degree is
        d_lf -- the quantity HEUR-001 assumes bounded and cbdefb measures
        growing at m = 2.
      evidence: derivation-R2-row-count.md steps 1-3; rt_cost_recheck.py R2.
    - id: OBJ-4
      severity: fatal_to_the_affected_cells_independently_of_HEUR_001
      statement: >-
        The generator cannot be written down at the cells that carry the
        claim. Its top-degree part alone has binom(s, 2^{m-1})^m nonzero terms
        = 2^221.3 at (256, m 5, D_0 4, omega 2), against that cell's entire
        claimed total of 2^108.76. This is unconditional on HEUR-001, on D_0
        and on omega; it holds at every m = 5 cell (excess 2^81.8 to 2^115.7)
        and is marginal at m = 4 (-0.57).
      evidence: rt_support_size.py; derivation-R1-generator-degree.md step 3
        for the exact count of the substituted top form.
    - id: OBJ-5
      severity: moves_a_frozen_threshold
      statement: >-
        The artifact declares cost_unit "F_p field operations" and then
        compares against a prior stated in elliptic-curve group operations,
        subtracting the two directly. Any honest conversion (>= 2 field
        operations per group operation) flips three cells and moves the frozen
        256-bit threshold row for (m 4, omega 2) from "T >= rho at D_0 = 4" to
        "T < rho at D_0 = 4". The bias direction is conservative for the
        claim, but the near-tie verdicts are not robust to the artifact's own
        declared unit.
      evidence: derivation-R4-cost-honesty.md B1; rt_cost_recheck.py R4.
    - id: OBJ-6
      severity: memory_column_understated
      statement: >-
        memory_log2 is the factor base only. The Ncols(n, D_0)^omega time
        charge presupposes dense fast linear algebra, whose working set is
        Ncols(n, D_0)^2 -- 2^55.4, 2^79.0 and 2^101.5 at three of the four
        cells declared affected, against tabulated 2^53.9, 2^57.8 and 2^61.6.
        The listed over-estimating factor (a sparse Wiedemann charge) is the
        only escape and it contradicts the time charge; the artifact does not
        say which reading it means.
      evidence: derivation-R4-cost-honesty.md B2.
    - id: OBJ-7
      severity: minor_formula_slip_no_verdict_change
      statement: >-
        P5's interior-band cost keeps only the top binomial
        binom(2(D_0 - m), D_0), which is 0 whenever D_0 < 2m (7 of the 9
        (m, D_0) pairs). The residual Macaulay matrix at k_c has
        Ncols(2(D_0-m), D_0) columns, equal to 2^{2(D_0-m)} for D_0 <= 2m. The
        corrected band cost is 2^{n - (2 - 2 omega)(D_0 - m)}, still
        exponential in n, so the qualitative conclusion stands. The package
        reported the degenerate values as null and did not repair the frozen
        prediction, which is the correct handling.
      evidence: derivation-R3-marginal-and-interior-band.md section 2.
    - id: OBJ-8
      severity: internal_inconsistency_disclosed
      statement: >-
        At four 64-bit cells the model's own optimum is the enumerative leaf,
        so the total the frozen model implies is the full-guessing balance
        (72.58 at m = 3, 76.58 at m = 4), not the tabulated k = 0 value. The
        package discloses this as A1 and does not repair it; the tabulated
        value is the conservative one at three of the four cells and no verdict
        moves (all >= 2^40 above rho).
      evidence: derivation-R3-marginal-and-interior-band.md section 3.
    - id: OBJ-9
      severity: provenance
      statement: >-
        The error is traceable and pre-dates this package: IDEA-20260830-84cdb7
        claim (A) states "one generator of total degree 2m (degree 2 in each
        x_k)", which contradicts this program's own curated corpus entry
        KN-TECH-002 ("deg of S_n in each variable is 2^{n-2}"). It propagates
        into 84cdb7's null d_reg = ceil((ms(d-1) + 2m)/2), into
        H-PFDR-06fd60 (A)-(B), into the contract's CTRL-CONFOUNDERS-NAMED (iv)
        ("the reduction caps the degree at 2m = 10 at m = 5"), and into every
        cell here. IDEA-20260903-e1e38b (D3-D4) already corrected it on
        2026-09-03; the correction had not reached this contract.
      evidence: 84cdb7 lines 33-36 and 74-83; KN-TECH-002 header; e1e38b (D3).

  required_controls:
    - >-
      C1 (cheapest, zero new machinery): run EXP-PFDR-cbdefb's frozen closure
      meter at (m, s) = (3, 5) -- n = 15 squarefree variables, 2^15 columns,
      D_max >= 14 -- and check whether the first fall occurs at
      d_ff = 13 = delta + 1 as the floor predicts, with the block-factored
      NULL-3 arm beside it. This is the cheapest measurement that tests the
      degree floor at an arity above 2; cbdefb has only reached (3, 2), where
      it already saw d_ff = 7 = delta + 1.
    - >-
      C2 (zero compute): re-emit the cost table with delta = m min(2^{m-1}, s)
      in BOTH slices and with a feasibility gate that refuses to price a cell
      whose row count Ncols(n, D_0 - delta) is zero. A cost script that cannot
      represent an empty matrix will keep manufacturing cells.
    - >-
      C3 (zero compute, honesty): restate every cell with the prior converted
      into the declared unit, or restate the whole table in group-operation
      equivalents, and add the solver's own working set to the memory column.
    - >-
      C4: the null-object control the table still lacks -- the same arithmetic
      applied to a random multilinear generator of degree delta in n variables.
      My proves-too-much object 1 already shows the arithmetic is insensitive
      to the object; C4 would put that in the package where a reader meets it.
    - >-
      C5: before any future cell is quoted, charge the construction of S_{m+1}
      and of the reduced S~ (OBJ-4); a bound of binom(s, 2^{m-1})^m terms is
      exact arithmetic and costs nothing to include.

  counterexample_or_mutation: >-
    Counterexample certificate (docs/claims-and-verification.md "Refutation
    artifacts" item 1) for the load-bearing degree claim: S_4(x_1,x_2,x_3,x_R)
    has total degree 12 in the unknowns, not 2m = 6, and S_5, S_6 have total
    degree 32 and 80, not 8 and 10. Independently recheckable in seconds by
    rt_degree_probe.py (deterministic, standard library, seed 20260904), and
    already in the repository symbolically for m = 3
    (RUN-PFDR-5726af-htop: top form x_1^4 x_2^4 x_3^4, coefficient 1). The
    instrument's known-answer control is rt_semaev_control.py (S_3..S_6 vanish
    on genuine zero-sum tuples, 5/5 each, and not at random tuples).
    Cheapest mutation that separates artifact from signal: change nothing but
    the object -- feed the direct presentation to the same bounded-slice
    arithmetic (proves-too-much object 1). It returns BETTER cells (2^94.95)
    for an object with a proven floor d_lf >= B = 2^47.

  baseline_comparison: >-
    Pollard rho, 0.886 N^{1/2} group operations at O(1) memory, is the correct
    baseline for prime-field ECDLP at these sizes and the package uses it. BSGS
    and the memory-rich alternatives do not improve on it in total work for a
    single instance (BSGS at 2^53.9 memory would need 2^202 time at 256 bits),
    and van Oorschot-Wiener parallelisation reduces rho's wall time, not its
    total work -- so no memory-based baseline dominates rho on the axis the
    table compares, and the package's dominated_by ("rho dominates every cell
    unconditionally; conditionally on HEUR-001 rho still dominates every cell on
    memory") is correctly signed rather than a null. IDEA-20260903-dcf857's
    dominated_by is checked row by row against parallel rho with negation, BSGS,
    kangaroo, automorphism-discounted rho, Pohlig-Hellman, S T^2 = N and
    algebra-free MITM, which is the standard this program asks for. What the
    comparison is missing is on the NEW side, not the baseline side: the route's
    own time-memory curve (choose B below the balance: time
    m! 2^m C N / B^{m-1} at memory B) is never drawn, and it shows the
    conditional advantage lives in a 1.2-5.0 bit memory window above a hard
    floor of 2^48.9 at 256 bits, below which rho wins on both axes. With OBJ-1
    and OBJ-4 applied, no cell of the table is a comparison at all: the priced
    object has no rows and cannot be written down.

  heuristic_challenges:
    - >-
      HEUR-001 is explicit and numbered, and the record states honestly that no
      random model transfers (random_model_justification: "NONE transfers from
      the extension-field theorem"), with an honest prior of 0.05 against it.
      That is the profile's inventory requirement met in form. What the record
      does not do is check the heuristic against the object's own degree: with
      delta = m 2^{m-1}, HEUR-001 at D_0 in {2,4,6,8} is inconsistent for
      m >= 3 before any measurement (OBJ-2). A heuristic that is refutable by
      counting the generator's degree should not have reached a cost table.
    - >-
      The two clauses of HEUR-001 are not independent and are treated as if
      they were. "d_lf <= D_0" is a statement about where falls stop; "the
      degree-D_0 Macaulay matrix determines the solutions" is a statement about
      rank. The second does not follow from the first for a plain Macaulay
      matrix at fixed D_0 (OBJ-3); the Huang-Kosters-Yeo relation that would
      connect them is carried as provenance: recalled, verified_by: null. It
      is correctly flagged as an optimistic assumption, but the table's
      headline exponent rests entirely on it. I did not open the source either;
      it stays a pointer in this report too.
    - >-
      Random-model transfer: the object is not a random polynomial. Its top
      form is a single monomial prod_k x_k^{2^{m-1}}, which is exactly why the
      digit map produces early falls (IDEA-20260903-e1e38b) -- a structured
      deviation from the semi-regular null in the direction that HELPS the
      heuristic, and the same structure fixes the generator degree that kills
      the tabulated D_0. The cheapest computation that exposes the deviation
      is the block-factored null (NULL-3) already in cbdefb, which reproduces
      the Semaev arm's d_ff exactly at every uncensored cell: the early fall is
      a controlled null with respect to the curve, not a curve-specific signal.
    - >-
      HEUR-002 enters only the interior band, which is empty at every table cell
      under either degree convention, so nothing in the table depends on it.
      Correctly scoped by the record.
    - >-
      Scale honesty: the package says plainly that no scale was tested (a
      zero-run static derivation, tier toy, "no tested scale exists"). That is
      honest, and it also means the profile's validation requirement is not
      met and cannot be met by this artifact -- which the record states.

  cost_model_challenges:
    - 'OBJ-1: the priced matrix has no rows at 54 of 54 cells (and at the D_0 = 2 threshold rows).'
    - 'OBJ-3: corank >= Ncols(n, D_0) - Ncols(n, D_0 - delta) >= 2^27 at every headline cell, against N_sol = O(1).'
    - 'OBJ-4: the generator cannot be written down at any m = 5 cell (2^221.3 terms against a claimed total of 2^108.76).'
    - 'OBJ-5: unit mismatch between cost_unit and the prior; three cells and one frozen threshold bracket flip.'
    - 'OBJ-6: memory omits the solver working set (up to 2^39.9 understatement at an affected cell).'
    - >-
      Checked and NOT an objection: total expected cost is per-attempt cost
      times inverse success probability. Re-deriving the balance from B
      relations, P = B^m/(m! N) and 2^m C per call gives exactly
      B^{m+1} = m! 2^m C N and T = 2 B^2, the frozen formula; the probability
      is never set to 1, and the apparent 2^m clash with HEUR-003 resolves
      (2^m sign choices times 2^{-m} on-curve fraction).
    - >-
      Checked and NOT an objection: both omega on every cell, the o(1)
      disclosed as 2^m Ncols(ms, D_0)^omega per cell with its log2 value,
      parallelism stated for both sides, eight optimistic assumptions each with
      a bias direction, dominated_by filled and correctly signed.
    - >-
      Gap against docs/evidence-and-reproducibility.md rather than against the
      contract: no 384/512 rows. Direction: conservative -- the claimed margin
      GROWS with N (m 5, D_0 4, omega 2: -19.06 at 256, -39.08 at 384, -59.43
      at 512), so the omitted sizes are where the claim would look strongest.

  reduction_and_scope_challenges:
    - >-
      No published reduction is cited for the corollary (the assembly is
      IDEA-20260830-84cdb7's own index-calculus balance, declared internal),
      so exemplar challenge 6 has nothing to instantiate. The one imported
      internal reduction -- H-PFDR-c88f14's HEUR-002 into HEUR-001 -- is
      correctly attributed.
    - >-
      Scope is not inflated in form: "affected_scope: NONE unconditionally" is
      correct, the conditional list carries its memory column and the sentence
      "worthless until EXP-PFDR-cbdefb reports". It IS inflated in substance
      once OBJ-1/OBJ-2 are applied: the conditional affected scope is empty for
      a reason internal to the presentation (no admissible D_0 in the grid),
      not merely unmeasured, and at m = 5 it is refuted by OBJ-4 independently
      of HEUR-001. Any future citation of the four cells must carry that.
    - >-
      One safe_scope entry is unconditionally sound and worth keeping: "m = 3
      at every N: T >= 2^3.79 N^{1/2} for C >= 1, by arithmetic". Three others
      are unit-dependent (OBJ-5).
    - >-
      A scope statement the artifact does NOT make and should: the degree floor
      it violates is a property of the summation polynomial, so it applies to
      every presentation that keeps S_{m+1} as a generator, at every base d,
      not only at d = 2.

  proof_architecture_challenges:
    - >-
      Observation-fiber attack: the observable is (k*, T). Holding the
      arithmetic fixed and varying the object places the direct presentation
      (floor d_lf >= B) and the digit presentation on the SAME side of the
      conclusion, with the known-false object scoring better (2^94.95 versus
      2^108.76). The missing separator is precisely the row count -- the
      generator degree never enters the cost. This is the strongest single
      finding in this report and it needs no degree measurement to state.
    - >-
      Method-ceiling attack: the largest claim this resource measure can
      support, once D_0 is required to be at least delta, is
      T = 2^342.97 at m = 5, omega = 2, 256 bits (D_0 = 80, one Macaulay row),
      against rho 2^127.83. The ceiling is 2^215 above the baseline, so the
      headline "beats rho at m = 5 for D_0 <= 6" fails before any
      implementation question is reached. Under the alternative reading of D_0
      as a MULTIPLIER degree (rows Ncols(n, D_0), columns Ncols(n, D_0 +
      delta)) the cost model charges the wrong dimension: the matrix would have
      2^240 columns at the (256, m 5) cell, so that reading does not rescue the
      cells either. I could find no reading of D_0 under which the tabulated
      cells price a matrix that could solve.
    - >-
      Boundary and strictness attack: the old method IS genuinely embedded --
      the null slice reproduces da1428's full-guessing optimum and N^1, and it
      still does with the corrected generator degree (fixture F1 survives). The
      proposed perturbation is not strictly better; it is not defined at the
      tabulated parameters.
    - >-
      Quantifier order: the derived quantifiers of H-PFDR-06fd60's
      proof_search_map are honest ("FOR ALL cells listed, assuming HEUR-001").
      The failure is not a quantifier swap; it is that the inner statement is
      unsatisfiable at m >= 3 for the listed D_0.
    - >-
      Nearby-object control: the contract names the right one
      (CTRL-DIRECT-PRESENTATION-RATIO) and the package runs it -- but only
      under the NULL slice, where it passes. Run under the BOUNDED slice, which
      is the arithmetic actually being defended, the same control fails
      (proves-too-much object 1). A nearby-object control exercised only in the
      regime where the mechanism is not claimed does not test the mechanism.

  narrowest_supported_statement: >-
    On my joints, and scoped to the tested arithmetic (d = 2 digit
    presentation, m in {2,3,4,5}, D_0 in {2,4,6,8}, omega in {2, 2.807},
    log2 N in {64, 128, 256}, exact integer binomials, no curve): (1) The
    digit-substituted summation generator has reduced total degree
    m min(2^{m-1}, s), which is m 2^{m-1} at every cell of the table; the
    degree 2m of H-PFDR-06fd60 (A) is right only at m = 2. (2) Consequently
    every bounded-slice cell of cost-table.yaml and every row of
    thresholds.yaml at m in {3,4,5}, and the D_0 = 2 rows at every m, price a
    Macaulay matrix with zero rows; the four cells reported as beating rho are
    among them, so the headline "beats rho at m = 5 for D_0 <= 6 at omega = 2"
    is void by derivation, independently of HEUR-001. (3) Any D_0 that could
    satisfy HEUR-001 is at least m 2^{m-1} (81 at m = 5 counting the first
    fall), and at that floor the same balance gives log2 T = 342.97 at
    (256, m 5, omega 2) against rho 127.83. (4) Independently of HEUR-001 and
    of D_0, writing the generator down at any m = 5 cell costs at least
    2^221.3, exceeding that cell's entire claimed total. (5) What SURVIVES my
    joints: the null-slice reproduction of IDEA-20260808-da1428 (strictly
    decreasing C(k), argmin at the enumerative leaf, N^1) holds with the
    CORRECTED generator degree at all six fixture cells and both omega; the
    marginal-cost sign derivation of claim (C) is correct within the model, with
    the exact crossing 1-3 residual variables below the asymptotic formula; the
    interior band is exponential in n after P5's formula is corrected; the m = 2
    arithmetic is right, above rho by 2^40 to 2^137; and the cost bookkeeping
    charges total rather than per-attempt cost. (6) What I do NOT conclude: that
    a bounded last fall degree is impossible for the digit presentation (a
    D_0 = m 2^{m-1} + O(1) constant in s is not excluded by any argument here
    -- what cbdefb measures at m = 2 is a growth term floor((s - 2^{m-1})/2),
    which is a different question); that the digit presentation is worse than
    the direct one (its floor m 2^{m-1} does not grow with the factor base,
    unlike afe4ce's B, which is a real structural gain); or anything about the
    package's integrity, determinism, or literal compliance with its frozen
    success criterion, which are not my joints.

  next_concrete_action: >-
    Re-run EXP-PFDR-cbdefb's frozen closure meter at (m, s) = (3, 5), p in
    {4099, 65537}, D_max = 14 (n = 15 variables, 2^15 columns -- within the
    contract's 50000-column cap and comparable to the (2,5) cells that already
    ran in about 8 minutes each), with the NULL-3 block-factored arm beside it,
    and record whether d_ff = 13 = delta + 1. It is the cheapest measurement
    that tests the generator-degree floor at an arity above 2, it is the
    prediction of IDEA-20260903-e1e38b (D5) at that cell, and either outcome is
    decisive: 13 confirms the floor and closes the tabulated D_0 grid
    empirically as well as by derivation; anything below 13 would falsify my
    OBJ-2 and reopen the cells. Pair it with the zero-compute action C2 (a
    corrected cost table with a feasibility gate that refuses to price a cell
    with no rows), so that the arithmetic can no longer emit a cell for an
    empty matrix.

