        recomputation): every recorded integer reproduces under my own GF(2)
        code. The manifest's calibration_reproduced, deficit_D3_equals_1,
        deficit_D4_equals_31, cumulative_D4_equals_8k and
        null_deficits_all_zero are all true and all four are confirmed.
      scope_limitation_found: >-
        The fixture is NOT the byte-exact archived EXP-DREG-001 system. Its own
        field matches_archived_system_hash is false (system_hash 18e0fc8b...
        vs archived c47d17c3...), and VALIDATION.md section 5 discloses this as
        DEVIATION D1 with the attempts made: Sage is absent on this host, so the
        system was rebuilt by a pure-Python reimplementation of the same
        construction. Every archived invariant is reproduced (nb = 24, degree
        histogram, and at D = 5 rows 31512, realised support 46717, pred 29418,
        rank 28096, deficit 1322). CTRL-BINARY-CALIBRATION is therefore a
        SAME-CONSTRUCTION known-answer test, not a byte-exact replay of the
        archived polynomials. Properly disclosed by the producer; recorded here
        so the composition scopes it that way.
    - control: CTRL-S1-SLICE
      blocking: true
      realised_by: 'RUN-PFDR-20ee58-s1-slice, 6 cells (p in {4099, 16411, 65537} x base B in {4, 8}), D = 4..10'
      present: true
      result: >-
