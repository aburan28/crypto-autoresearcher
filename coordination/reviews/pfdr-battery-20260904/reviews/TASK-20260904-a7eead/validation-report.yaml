    - control: 'ADDITIONAL - my own GF(2) null (not the producer''s null arm)'
      blocking: false
      realised_by: 'this review: 5 random GF(2) systems with the fixture''s exact degree profile and per-generator term counts, seeds 7/11/13/17/19'
      present: true
      result: >-
        deficit 0 at D = 2, 3, 4 on all five, with rank 3834 at D = 4 - which is
        exactly the pred_D4 = 3834 recorded by the calibration run. So the
        Semaev fixture's rank 3802 is 32 short of the rank a same-shaped random
        system attains, under MY code. This is an independent confirmation that
        the 32 / 1322 is structure rather than predictor bias, and it is the
        null-object control that makes the binary number evidence at all.
        Note: at p = 2 an IDENTICAL-support null is the identity map on the
        system (VALIDATION.md section 4.6 flags it degenerate_at_p2), which is
        why the matched null must be a degree/histogram-matched one; mine is.

