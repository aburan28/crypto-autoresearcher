      result: 'PRESENT at the declared count; max_abs_deficit 0 on every cell. Whether it controls anything BEYOND the support null is joint R4 (anomaly A4); I check presence and count only.'
    - control: NEARBY-NON-CURVE-CUBIC
      blocking: true
      realised_by: '12 cell runs x 3 seeds (51, 53, 59) = 36 draws'
      present: true
      result: 'PRESENT at the declared count; max_abs_deficit 0 on every cell. Its discriminating power when every arm reads 0 is joint R4.'
    - control: CTRL-P-LADDER
      blocking: true
      realised_by: 'RUN-PFDR-20ee58-s4-p{4099,16411,65537} (declared stage "stage-3-separating-cells+stage-4-p-ladder"), 6 curves each; and in fact the full ladder at s = 3, 5 and 6 as well'
      present: true
      result: 'PRESENT: three primes at fixed s = 4 (and at every other s), all cells max_abs_deficit 0, so the ladder is flat. A flat ladder at an identically zero quantity cannot fire the artifact tell; it also cannot fail. Recorded as such.'
    - control: CTRL-CURVE-SPREAD
