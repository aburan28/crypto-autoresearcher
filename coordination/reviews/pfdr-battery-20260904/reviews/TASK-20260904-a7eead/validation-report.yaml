        The branch rule and its priors are in the frozen contract, not in the
        analysis.
    - check: 'sample size, seeds and sampling procedure in the manifest'
      result: pass
      detail: >-
        Every manifest records the curve/target/null/non-curve seed sets, the
        hash-based curve and target derivation rules
        (A, B = sha256(EXP:curve:p:seed:A|B:attempt) mod p with the rejection
        conditions), the null constructions with their RNG (random.Random(seed)
        "with the frozen seed verbatim"), and the per-arm draw counts. Draw
        arithmetic checks out: SEM 3 x 12 + 9 x 6 = 90, NULL-SUPPORT 60,
        NULL-TOPOLOGY 60, non-curve cubic 36, total 246 twin draws, which is the
        number the claim states.
    - check: 'correspondence validity (a substitute sampler standing in for the object of interest)'
      result: not_applicable
      detail: >-
        No correspondence is used: the contract states scale_relevance.
        correspondence "none; direct computation at the tested primes". The one
        substitution present is the calibration FIXTURE (a rebuilt binary system
        standing in for the archived one), which is checked above and is
        disclosed, not silent.
    - check: 'scale binding and transfer assumptions recorded'
      result: pass
      detail: >-
        scale_relevance.tier is "toy" with the parameters spelled out
        (p <= 2^16, s <= 5 at D = 8, m = 3, d = 2) and "nothing at
        cryptographic scale and no extrapolation in s". interpretation_limits
        states "No attack, no exponent, no security claim". The scale mismatch
        with the binary law is stated as a limitation rather than bridged.
    - check: 'the null-object control that makes a measured quantity evidence (docs/inventor-protocol.md section 3)'
      result: pass
      detail: >-
        The measured quantity here is an ABSENCE (deficit 0), so the usual
        artifact tell - a signal that fails to decay - is inverted: the risk is
        a blind instrument, not a spurious correlation. The package does carry
        null objects of the same shape for both directions: on the binary side
        a same-shape random system where the deficit must vanish and does (I
        reproduced this myself, rank 3834), and on the prime-field side three
        null arms. What the report should say the quantity SHOULD do is stated
        in the contract as the M1/M2/M3 branch rule with the p-independence and
        s-growth tells. The remaining gap - a positive control at the TWIN
        shape, without which "deficit 0 at D <= 8" could be near-vacuous - is
        the coordinator prior's own named weak point and is joint R2. My own
        instrument's positive control (deficit 1 / 11 / 56 on a planted
        degree-6 syzygy) shows the gap is closable at this shape, but it does
        not close it for the producer's meter.

  cost_model_checks:
    - check: 'concrete cost table with declared unit'
      result: not_applicable
      detail: >-
        The package reports no cost model, no operation count and no exponent.
        The only resource figures are wall time, CPU seconds and peak RSS per
        run, all recorded with units in every manifest and all far inside the
        contract's caps. interpretation_limits states the cost image of a
        nonzero deficit is zero unless the solve bit flips, and sol(D) is
        carried as a covariate only (False on every draw I read).
    - check: 'total expected cost as per-attempt cost x inverse success probability'
      result: not_applicable
      detail: 'No success probability and no attempt model is claimed; there is nothing to multiply.'

  proof_architecture_checks:
    - check: 'baseline fixture reproduces the cited baseline exactly'
      result: pass
      detail: >-
        The cited baseline is KN-FIND-006's binary integers. They reproduce
        exactly under my own independent GF(2) code (1 and 31 graded, 32 and
        1322 cumulative), on the same-construction fixture whose deviation from
        the archived system is disclosed.
    - check: 'strictness witness for an improvement claim'
      result: not_applicable
      detail: 'No improvement is claimed; the experiment is a control between two mechanisms for a measured binary law. The ladder of docs/inventor-protocol.md section 6 is not triggered because no speedup, exponent or scaled projection is asserted anywhere in the package I read.'
    - check: 'method ceiling and nearby-object control'
      result: 'partially in scope'
      detail: >-
        The nearby object (a non-curve nodal cubic with the same tree and digit
        generators) is preregistered and was run, 36 draws, deficit 0. The
        METHOD CEILING - the largest deficit any two-quartic system in this ring
        could show at D <= 8, which is what says how much M1 actually excludes -
        is joint R2's deliverable and is not established here. Until it is, the
        strength of "deficit 0" is bounded above by an unknown.
    - check: 'quantifier fidelity'
      result: pass
      detail: >-
        The claim is per-instance and is recorded per-instance (12 draws at the
        deciding cell, 246 in total), never as one uniform witness. My
        re-derivation is likewise per-instance: twelve separate builds and
        twelve separate rank computations, with no caching between them, so a
        duplicate agrees by computation rather than by construction.

  instance_and_certificate_checks:
    method: >-
      Own arithmetic at p = 4099 (sqrt by a^((p+1)/4) since p = 3 mod 4, own
      affine point addition), from the (A, B, u, x_R) in the plan alone. No
      summand was taken from any producer record.
    per_instance_result: >-
      All 12: 4 A^3 + 27 B^2 != 0, A != 0, B != 0, j not in {0, 1728}
      (j = 179, 1320, 3263, 1223, 1824, 1192 on the six curves), at least three
      on-curve x in the window [0, 8) (6, 6, 7, 7, 4, 4, 4, 4, 3, 3, 3, 3
      window points; the minimum is exactly 3 on curves 4105 and 4106), u
      realised as x(P_1 +- P_2) for two DISTINCT window points, and x_R realised
      as x((P_1 +- P_2) +- P_3) for a DISTINCT third window point. Twelve
      chained decomposition certificates, all independent of the raw record.
    witnesses: 'recorded in v3_instances.json and v3_instances.log (e.g. 4101/t1: P(2) - P(3) -> u = 3091, then + P(5) -> x_R = 2292)'
    replication_count_finding: >-
      The 12 deciding-cell draws realise only ELEVEN distinct generator systems.
      The generators depend on (p, A, B, x_R) alone - u stays a free variable
      and is never substituted - and curve 4106's two targets share
      x_R = 1845. My certificates show why: target 1 is P(1) + P(2) then + P(3)
      and target 2 is P(1) + P(3) then + P(2), i.e. the SAME three window
      points summed in a different chaining order, so the same target point with
      a different internal node u. Both draws therefore build the identical
      886 x 2304 matrix. I computed both from scratch and they agree, which
      confirms the duplication rather than hiding it. Consequence for the
      composition: the deciding cell replicates over 11 independent generator
      systems, not 12; the SEM total of 90 draws contains at most 89 distinct
      systems on this account. This weakens nothing about the measurement; it
      is a count that should be stated accurately in any evidence record.

  verdict: passed
  verdict_scope: >-
    `passed` applies to the four joints assigned to TASK-20260904-a7eead (V1,
    V2, V3, V4) and to nothing else. It says the fourteen-run package is an
    admissible research receipt on those joints: the artifacts exist, are bound
    to the cited runs and to a committed Coordinator snapshot, the pinned code
    and meter are identical across the HEAD move, the deciding-cell instances
    are genuine, the controls the contract declares are present at their
    declared counts, and both load-bearing numbers - the deciding-cell deficit
    vector and the binary calibration integers - recompute under code that
    never saw the producer's implementation. It is NOT a verdict on the claim:
    joints R0-R4 (raw/summary agreement, the (S2)-(S3) derivation and the
    Koszul-only baseline, meter sensitivity at the twin shape, the convention
    adjudication, null adequacy) are owned by TASK-20260904-0d66e3 and I cannot
    see them. A passed validation report does not support an ECDLP claim, does
    not demonstrate a speedup, and does not authorise any promotion or status
    change.

  limitations:
    - >-
      ONLY V1 WAS BLIND. The re-derivation was written and hashed before any
      manifest was opened. V2, V3 and V4 were performed in phase B with the
      recorded values visible; V4 in particular is an independent RECOMPUTATION
      (own code, own conventions) but not a blind re-derivation, since the
      calibration manifest's integers had been read by then. Its independence
      is that of the code, not of the expectation.
    - >-
      My re-derivation covers 12 of the 246 twin draws and 12 of the 90 SEM
      draws: the deciding cell only (s = 3, p = 4099, SEM). The other 234 draws,
      the s = 4, 5, 6 cells and the other two primes are validated only through
      manifest summaries, and their per-draw values live in raw-result.json,
      which is in blind_from for me. Raw/summary agreement is joint R0.
    - >-
      Because those 12 draws are 11 distinct generator systems, the deciding
      cell's independent replication count is 11.
    - >-
      "Deficit 0 at D <= 8" is measured on a shape with only two quartic
      generators and multipliers of degree at most 4 - 886 rows against 2304
      columns. Whether that excludes anything quantitatively (the method
      ceiling) is joint R2. My own positive control shows a planted degree-6
      syzygy IS visible at this shape as deficit 1 / 11 / 56 under MY meter,
      which makes the reading non-vacuous for my instrument; it does not
      establish it for the producer's meter, and I did not run the producer's
      meter at all.
    - >-
      CTRL-BINARY-CALIBRATION runs on a rebuilt, not byte-exact, copy of the
      archived EXP-DREG-001 system (disclosed deviation D1). Every archived
      invariant reproduces, but the known-answer test is same-construction
      rather than same-bytes.
    - >-
      The calibration criterion's two readings (graded 31 versus cumulative 32
      at D = 4) both recompute here; which one the frozen criterion means, and
      whether F3 fires, is joint R3's adjudication and is deliberately left open
      by this report.
    - >-
      The snapshot commit message's "132/132 certificates" cannot be
      reconstructed from the manifests alone (they carry 126 totals across the
      12 cell runs plus a failure count of 0 on the s = 1 run). The missing 6
      are almost certainly the s = 1 cells, but confirming that needs a
      blind_from artifact.
    - >-
      Inference: model_verified is FALSE for this review session.
      `python3 -m orchestration.adapter resolve --role validator
      --independent-session` returns review-adversarial ->
      anthropic:claude-opus-5 (effort=xhigh) and the runtime reports
      claude-opus-5, but `doctor --probe` cannot verify any backend from inside
      this session ($ANTHROPIC_API_KEY unset; the local backend refuses
      connection). The identifiers agree, but agreement is not verification.
    - >-
      Scope of everything above: m = 3, d = 2, s in {3, 4, 5, 6}, p in
      {4099, 16411, 65537}, D <= 8, window [0, 2^s). Nothing here transfers to
      cryptographic parameters and nothing here changes any status.

