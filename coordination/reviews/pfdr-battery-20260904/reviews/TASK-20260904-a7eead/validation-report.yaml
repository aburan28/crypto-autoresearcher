  metric_recomputations:
    - metric: 'V1 (BLIND) deficit(D) = rows(D) - rank(Mac_D) - koszul(D), D = 5..8, deciding cell s = 3, p = 4099, SEM arm, 12 instances'
      method: >-
        Own implementation from the statement alone. Ring built as squarefree
        9-bit digit masks x u-exponent with a^2 -> a as a mask OR; leaves
        x_k = a_{k,0} + 2 a_{k,1} + 4 a_{k,2}; E1 = S_3(x1, x2, u),
        E2 = S_3(u, x3, x_R) from the stated S_3 formula; cumulative rows
        {m E_i : deg m <= D - 4}; columns all monomials of total degree <= D;
        exact rank over F_4099 by own prefix-incremental echelon elimination
        (numpy int64 carrier, modular arithmetic, no floating point);
        koszul(D) = [D >= 8]. No import of harness/macaulay_fp.
      recomputed:
        D5: {rows: 22, columns: 825, support_columns: 549, rank: 22, koszul: 0, deficit: 0}
        D6: {rows: 114, columns: 1291, support_columns: 1170, rank: 114, koszul: 0, deficit: 0}
        D7: {rows: 374, columns: 1793, support_columns: 1754, rank: 374, koszul: 0, deficit: 0}
        D8: {rows: 886, columns: 2304, support_columns: 2275, rank: 885, koszul: 1, deficit: 0}
      per_instance: >-
        IDENTICAL on all twelve instances (4101/t1, 4101/t2, 4102/t1, 4102/t2,
        4103/t1, 4103/t2, 4104/t1, 4104/t2, 4105/t1, 4105/t2, 4106/t1,
        4106/t2): deficit vector (0, 0, 0, 0) at D = 5, 6, 7, 8, with the row,
        column, support and rank counts above. deg E1 = deg E2 = 4; 98 terms in
        E1 and 21 in E2 on every instance; zero-product rows 0 on every
        instance.
      agrees_with_producer: >-
        YES. The producer's claim as quoted in review_plan.claim_under_review
        ("886 rows x 2304 columns per arm; rank 885; koszul 1;
        SEM_deficit_D8: twelve zeros") is reproduced exactly, and the
        manifest of RUN-PFDR-20ee58-s3-p4099 records
        deficit_vector_histogram.semaev = {'[0, 0, 0, 0]': 12}, which is the
        same twelve vectors. Comparison made only after the phase boundary.
      why_this_zero_is_not_an_accident:
        - >-
          The column space was sized twice and independently: the closed form
          columns(D) = sum_j C(9, j) (D - j + 1) gives 825 / 1291 / 1793 / 2304,
          and enumerating the monomial basis gives the same four numbers. 2304
          is the contract's own D = 8 figure.
        - >-
          The row count was likewise derived, not read: rows(D) = 2 x
          (number of monomials of degree <= D - 4) = 22 / 114 / 374 / 886, and
          886 is the contract's figure. Zero-product rows were counted and are 0.
        - >-
          2275 of the 2304 columns are actually reached by a row. The 29 that
          are not are exactly u^8, u^7, the 9 monomials a_i u^7, and 18 of the
          36 pairs a_i a_j u^6 - which is what the generators force: the largest
          u-power a row can carry is 4 (multiplier) + 2 (generator) = 6, and the
          reachable digit-pairs at u^6 are the 15 pairs of (x1 - x2)^2 plus the
          3 pairs of x3^2. The space is neither empty nor mis-sized.
        - >-
          At D = 8, rows - rank = 1 and the EXPLICIT Koszul vector (the
          coefficients of E2 placed on the rows {m E1} minus the coefficients of
          E1 placed on the rows {m E2}) is nonzero and annihilates the matrix on
          every instance. So the kernel is exactly the span of the Koszul
          relation: "deficit 0" here means "no syzygy beyond the Koszul one",
          not "no rows". At D <= 7 the matrix has full row rank.
        - >-
          POSITIVE CONTROL ON MY OWN INSTRUMENT: two quartics sharing a random
          quadratic factor (F1 = h q1, F2 = h q2, seed 20260904) carry a planted
          non-Koszul syzygy at multiplier degree 2. My meter returns deficit
          (0, 1, 11, 56) at D = 5, 6, 7, 8 - nonzero from exactly the predicted
          degree D = 6. NEGATIVE CONTROL: two independent random elements of
          degree <= 4 with dense support return (0, 0, 0, 0) with rank 885 at
          D = 8. My zero on the twin is therefore a measurement, not a blind
          instrument. This bounds MY instrument only; the sensitivity of the
          PRODUCER's meter at this shape is joint R2 and is not mine.
    - metric: 'V4 binary n = 12 calibration integers, recomputed with own GF(2) code from the committed fixture'
      method: >-
        Own Python-int bitset GF(2) elimination over the Boolean ring on the
        fixture's 24 squarefree variables; generators taken from the fixture's
        monomial lists only; cumulative multipliers; koszul(D) computed as the
        cumulative count of the CLASSICAL trivial syzygies (Koszul pairs of
        degree deg f_i + deg f_j and Frobenius f^2 = f of degree 2 deg f_i,
        each with its own multipliers of degree <= D - d0). No import of
        harness/macaulay_fp.
      fixture: harness/macaulay_fp/fixtures/chained_gf2_n12_t3_seed2026.json
      fixture_sha256_recomputed: 62d89109f94ef658885ddb5289504df159de01ee4341852b34349d01724bf8e5
      fixture_sha256_matches_declared: true
      system_read_back: 'n = 12, k = 4, t = 3, nb = 24, 24 generators with degree histogram {2: 12, 3: 12} recomputed from the monomial lists themselves'
      recomputed:
        rows_D2_D5: [12, 312, 3912, 31512]
        columns_D2_D5: [301, 2325, 12951, 55455]
        rank_D2_D5: [12, 311, 3802, 28096]
        koszul_D2_D5: [0, 0, 78, 2094]
        zero_product_rows_D2_D5: [0, 0, 0, 0]
        deficit_cumulative_D2_D5: [0, 1, 32, 1322]
        deficit_graded_D2_D5: [0, 1, 31, 1290]
        n_q: 12
        frobenius_count: 12
        binom_nq_2: 66
        koszul_D4_breakdown: '66 Koszul pairs + 12 Frobenius = 78'
        koszul_D5_breakdown: '66 x 25 quadric pairs (1650) + 12 x 25 Frobenius (300) + 144 quadric-cubic pairs = 2094'
      agrees_with_producer: >-
        EXACTLY, on all six vectors. RUN-PFDR-20ee58-calib-gf2-n12 records
        rows [12, 312, 3912, 31512], rank [12, 311, 3802, 28096],
        koszul_pairwise [0, 0, 78, 2094], deficit_cumulative/pairwise
        [0, 1, 32, 1322] and deficit_graded [0, 1, 31, 1290]. My koszul
        breakdown at D = 5 also matches VALIDATION.md section 7's independent
        arithmetic (300 + 1650 + 144).
      convention_adjudication_input: >-
        KN-FIND-006 states deficit(3) = 1 and deficit(4) = 8k - 1 = 31 for
        k = 4, AND "cumulative deficit at D = 4 = 8k" = 32. My recomputation
        returns 1 and 31 under the GRADED (per-degree increment) reading and
        1 and 32 under the CUMULATIVE reading, which is the contract's own
        literal formula. So the contract's frozen criterion "deficit(3) = 1 and
        deficit(4) = 31" matches KN-FIND-006's graded convention while the
        contract's own formula gives 32 at D = 4; BOTH integers are
        KN-FIND-006's own, and neither is a miss. Whether falsification
        criterion F3 fires literally is joint R3's adjudication, not mine; the
        numbers are recorded here so that it can be made on measured values.
      D5_optional_extension: 'computed within budget (3.8 s): 31512 rows, rank 28096, koszul 2094, cumulative deficit 1322 - equal to the archived RUN-DREG-001-VALIDATE-N12-A value cited in VALIDATION.md section 7.'

  control_checks:
    - control: CTRL-BINARY-CALIBRATION
      blocking: true
      realised_by: 'RUN-PFDR-20ee58-calib-gf2-n12 (p = 2, D = 2..5, plus 5 null seeds 7/11/13/17/19)'
      present: true
      result: >-
