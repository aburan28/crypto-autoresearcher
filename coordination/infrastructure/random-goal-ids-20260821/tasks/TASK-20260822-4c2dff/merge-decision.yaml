    blocking_findings:
      - id: B2-GITLINK
        title: Initialized gitlink bypasses whole-ledger trusted-prefix validation
        observation: >-
          A Git mode-160000 entry at ledger/goals or ledger is rejected by
          check_merge_hygiene.py, but an initialized checkout presents an
          ordinary directory to validate_ledger.py lstat checks. Whole-ledger
          validation then traverses the checkout, registers a hidden target-only
          GOAL, and reads GITLINK_TARGET_INTERPRETED or
          LEDGER_GITLINK_INTERPRETED.
        consequence: >-
          Whole-ledger validation does not establish the effective Git object
          type of protected prefixes before filesystem traversal, so its result
          can depend on initialized submodule contents outside the
          repository-owned ledger tree.
        disposition: blocks_merge
    nonblocking_findings:
      - id: B2-SCOPE-WORDING
        title: Non-traversal claim must be narrowly stated
        disposition: adopt_in_successor
        required_wording: >-
          Validation does not traverse through a protected ledger or
          ledger/goals alias and does not access objects available only through
          that protected alias target. No broader no-filesystem-access claim is
          made.
