  gitlink_policy:
    protected_prefixes:
      - ledger
      - ledger/goals
    forbidden_git_modes:
      - '160000'
      - '120000'
    permitted_git_type: ordinary tree represented by repository-owned entries
    forbidden_filesystem_types:
      - symlink
      - regular file
      - special file
      - non-directory object
    behavior_on_forbidden_prefix:
      - emit an explicit trusted-prefix validation error
      - skip goal discovery beneath the prefix
      - do not open or parse target files
      - do not register target-only goal IDs
      - do not derive question, status, or handoff data from target contents
  effective_candidate_metadata:
    - Determine the repository root without following a protected alias.
    - Inspect effective index entries for exact ledger and ledger/goals paths.
    - Reject exact mode 160000 or 120000 before traversal.
    - Distinguish exact entries from normal tracked descendants.
    - Preserve existing non-following filesystem checks.
    - Fail closed inside a Git worktree when candidate type cannot be determined.
    - For non-Git absolute fixtures, retain filesystem checks and make no Git-provenance claim.
    - Never initialize, fetch, or execute a submodule target.
  required_controls:
    gitlink_prefixes:
      - initialized, uninitialized, unavailable, internal, and malformed ledger/goals gitlinks
      - initialized, uninitialized, unavailable, internal, and malformed ledger ancestor gitlinks
      - hidden legacy and random-suffix GOAL sentinels
      - GITLINK_TARGET_INTERPRETED and LEDGER_GITLINK_INTERPRETED non-read markers
    candidate_states:
      - committed exact mode-160000 entry
      - staged replacement by mode-160000 entry
      - staged index versus later working-tree disagreement
      - exact-entry versus descendant parsing
      - explicit untracked boundary until staged
    retained:
      - mode-120000 and protected-prefix file rejection
      - all B2 symlink-prefix controls
      - B1 child-symlink controls
      - ordinary-directory and flat-to-sharded controls
      - N1, N2, N4, and prior regular-path matrix
      - zero live repository record changes
  claim_scope:
    proved_if_tests_pass: >-
      Validation does not traverse through a protected ledger or ledger/goals
      symlink/gitlink alias and does not access objects available only through
      that protected alias target.
    not_claimed:
      - no filesystem access anywhere outside ledger/goals
      - no interaction with unrelated repository paths
      - protection for arbitrary non-ledger gitlinks
      - untracked-object provenance without Git metadata
