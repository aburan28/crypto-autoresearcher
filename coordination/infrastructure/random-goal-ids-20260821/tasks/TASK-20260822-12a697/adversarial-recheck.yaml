blocking_objections:
  - id: B2
    title: Protected-root and ancestor symlinks bypass the corrected child-path check
    severity: blocking_for_coordinator_merge_decision
    affected_claims:
      - Every Git-representable symlink alias for a goal source is rejected.
      - Symlink targets are never followed or interpreted by authoritative validation.
      - Candidate merge hygiene and campaign projection agree on goal source kind.
      - A new legacy GOAL identity cannot be hidden behind a tracked alias.
    mechanism: >-
      The corrected index scan sees mode 120000 entries, but
      _first_path_component() and goal_symlink_component() accept only strings
      beginning with ledger/goals/ and therefore skip the exact ledger/goals
      entry; _index_symlink_paths() is also too narrowly pathspec-scoped to see
      a ledger ancestor alias. Whole-ledger check_goal_symlinks() silently
      returns when lstat(ledger/goals) is not a directory, and when ledger is
      the alias its lstat of the final goals component sees a normal target
      directory. load_goal_documents() then calls scandir() through either
      alias and parses target bytes. Campaign projection independently walks
      every component and rejects the same source, exposing the split.
    immutable_snapshot_evidence:
      - file: tools/check_merge_hygiene.py
        lines: 132-147
        observation: >-
          The staged-object scan requests only the ledger/goals pathspec and
          retains only mode 120000 entries returned under it.
      - file: tools/check_merge_hygiene.py
        lines: 150-176
        observation: >-
          Both helpers require ledger/goals/ with a trailing slash; the exact
          protected root and its ledger ancestor return no component.
      - file: tools/check_merge_hygiene.py
        lines: 179-198
        observation: >-
          The source check consequently emits no problem for the touched alias
          path even though its Git object mode is 120000.
      - file: tools/validate_ledger.py
        lines: 1349-1401
        observation: >-
          load_goal_documents() scans ledger/goals and loads regular target
          entries without first proving that the root and every ancestor are
          non-symlink directories.
      - file: tools/validate_ledger.py
        lines: 1446-1468
        observation: >-
          A non-directory lstat at the protected root returns silently; a
          parent alias is followed before the final-component lstat and is not
          enumerated as a child entry.
      - file: orchestration/campaign/projection.py
        lines: 114-145
        observation: >-
          Projection walks every path component with lstat and rejects either
          alias, which is the source-kind behavior the other consumers must
          match.
    committed_root_alias_reproducer:
      fixture_path: /private/tmp/goalid-redteam2.ootkrg/root-alias-fixture
      base: regular ledger/goals/GOAL-BASE-001.yaml tagged base-tree
      candidate:
        - >-
          Move the base goal into committed docs/goal-root-alias and add
          committed docs/goal-root-alias/GOAL-BYPASS-002.yaml containing
          objective sentinel TARGET_FOLLOWED_SENTINEL.
        - >-
          Replace ledger/goals with a tracked symlink to
          ../docs/goal-root-alias and commit the candidate.
      exact_index_entries:
        - '100644 7a9e866f42aedb07c0aca6e1743c8a12bacc704a 0 docs/goal-root-alias/GOAL-BASE-001.yaml'
        - '100644 2084c124cd1a69803c18ed74c98b6e0ce393d358 0 docs/goal-root-alias/GOAL-BYPASS-002.yaml'
        - '120000 628a391b26059ea45c0c43f95bf59dc3740ed5b1 0 ledger/goals'
      command: python3 tools/check_merge_hygiene.py --base base-tree
      merge_hygiene_exit_code: 0
      merge_hygiene_stdout: >-
        PASS: no conflict markers, no unparseable records, no identifier
        collisions, no new legacy GOAL identifiers
      merge_hygiene_stderr: >-
        note: parseability scoped to 3 committed, staged, or
        tracked-worktree candidate path(s) vs base-tree; the absolute sweep
        runs on main
      validator_registered_GOAL_BYPASS_002: true
      validator_read_target_sentinel: true
      validator_symlink_errors: []
      projection_result: >-
        REJECT: goal projection source may not traverse symlink component
        /private/tmp/goalid-redteam2.ootkrg/root-alias-fixture/ledger/goals
    committed_parent_alias_variant:
      fixture_path: /private/tmp/goalid-redteam2.ootkrg/ledger-parent-alias-fixture
      exact_index_entries:
        - '120000 a18e14e4c8e5ec5f3f9a623227b118b6e9c51a9d 0 ledger'
        - '100644 6e2fe6fb4db82ac7361b4cd28dfa21b99e3335ee 0 state/ledger-alias/goals/GOAL-BASE-001.yaml'
        - '100644 f2ecf261eed6e13e86808b978bc335b80819931a 0 state/ledger-alias/goals/GOAL-BYPASS-003.yaml'
      merge_hygiene_exit_code: 0
      validator_registered_GOAL_BYPASS_003: true
      validator_read_target_sentinel: true
      validator_symlink_errors: []
      projection_result: >-
        REJECT: goal projection source may not traverse symlink component
        /private/tmp/goalid-redteam2.ootkrg/ledger-parent-alias-fixture/ledger
      interpretation: >-
        Fixing only the exact ledger/goals component would leave the immediate
        ledger ancestor variant open.
    why_target_following_is_proven: >-
      The sentinel exists only in the committed alias target and the Validator
      context registered the hidden legacy ID with that exact objective. This
      is positive evidence of interpretation, not an inference from a missing
      error.
    cheapest_literal_fix:
      - >-
        In check_merge_hygiene.py, enumerate candidate index entries broadly
        enough to see exact ledger and ledger/goals entries; treat ledger,
        ledger/goals, and every component below them as protected components.
        Reject a candidate mode 120000 at either boundary before reading any
        target. Prefer a shared plain-source predicate that also fails closed
        on non-regular/non-directory Git object kinds.
      - >-
        In validate_ledger.py, lstat each component from REPO/ledger through
        REPO/ledger/goals without following parents. A symlink or wrong object
        kind must emit a forced error and stop load_goal_documents() before
        scandir; a non-directory protected root must not silently return.
      - >-
        Add committed and staged regressions for both ledger/goals and ledger
        mode-120000 aliases, assert merge-hygiene exit 1, assert the validator
        never registers the sentinel goal, and retain projection rejection as
        the agreement oracle.
      - >-
        Retain ordinary real ledger and ledger/goals directory controls so the
        broader ancestor walk does not reject the canonical tree.
    resolution_gate:
      - Root and parent alias fixtures both fail merge hygiene.
      - Whole-ledger validation emits an explicit source-kind error for both.
      - Neither target sentinel nor hidden legacy ID is interpreted.
      - Projection, validation, and merge hygiene agree on rejection.
      - Original child-path B1 and all known-valid controls continue to hold.

nonblocking_objections:
  - id: N4
    title: Repeated --area selectors silently choose the last value
    evidence:
      - file: tools/allocate_id.py
        lines: 342-380
        observation: >-
          argparse stores one scalar area and the post-parse check proves only
          that it is nonempty; it cannot distinguish one occurrence from two.
      - command: >-
          python3 tools/allocate_id.py --next goal --area ERANK --area OTHER
          --seed 11
        exit_code: 0
        output: 'free goal id for ''OTHER'': GOAL-OTHER-eee65f'
    boundary: >-
      The emitted identifier still has a random six-hex suffix, matches the
      frozen GOAL grammar, and names one of the explicitly supplied areas. It
      does not bypass legacy rejection or create a malformed goal. The risk is
      silent campaign-area misclassification in an ambiguous invocation, so it
      is nonblocking relative to B2 but contradicts a strict reading of
      "requires exactly --area".
    cheapest_control: >-
      Parse --area with an occurrence-counting action and reject any count
      other than one for --next goal; add a repeated-area CLI regression while
      preserving one-area allocation. Alternatively document last-wins
      semantics explicitly if that behavior is deliberate.

