counterexample_or_mutation: >-
  Commit a target directory containing GOAL-BYPASS-002 and replace the exact
  ledger/goals protected root with a mode-120000 relative symlink to it. The
  candidate admission gate says PASS and the authoritative Validator registers
  and reads the hidden legacy record, while projection refuses the source.

baseline_comparison: >-
  Relative to the incomplete snapshot, the correction genuinely closes the
  original child-path and staged-index B1 variants without rejecting the
  regular flat-to-sharded or random-goal baselines. The remaining B2 is a
  boundary-completeness failure, not evidence that the corrected staged-index
  mechanism is ineffective on the paths it actually inspects.

heuristic_challenges: []
cost_model_challenges: []
reduction_and_scope_challenges:
  - >-
    The correction's scope cannot be described as every goal-tree symlink;
    the supported scope is child paths strictly below ledger/goals. Coverage
    of the protected root, its ancestors, untracked paths before staging, and
    non-120000 special Git modes must remain explicit.
proof_architecture_challenges:
  - attack: observation_fiber_source_kind
    result: breaks
    detail: >-
      Holding target YAML bytes and semantic GOAL ID fixed while changing only
      the alias location from a child below ledger/goals to the exact protected
      root changes merge-hygiene and Validator acceptance without changing
      projection rejection. The missing separator is an ancestor-complete
      plain-source predicate.

residual_risks:
  - >-
    The 24-bit random suffix has probabilistic rather than absolute collision
    resistance; allocation --check and cross-branch collision checks remain
    mandatory.
  - >-
    A mode-160000 gitlink was not executed in this recheck. Because the helper
    selects only mode 120000, the successor should make source-kind rejection
    general and pin the gitlink case rather than adding another symlink-only
    special case.

narrowest_supported_statement: >-
  Snapshot 6a27a4da44d8613bd4a9863bdd322f1233aaa039 is a valid correction for
  staged, committed, and worktree-divergent symlinks strictly below the
  ordinary ledger/goals directory, and its allocator N1/N2 repairs hold. It is
  not a complete plain-source or random-only admission repair because aliases
  at ledger/goals or ledger remain an accepted path to an interpreted new
  legacy goal.

next_concrete_action: >-
  Freeze and archive a root-and-ancestor plain-source correction, then replay
  B2, B1, N1/N2, rename/copy/type-change, and known-valid controls under new
