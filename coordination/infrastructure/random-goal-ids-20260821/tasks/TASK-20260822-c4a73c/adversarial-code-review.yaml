residual_risks:
  - risk: >-
      text=True strictly decodes raw `git ls-files -z`; a non-UTF8 filename
      could raise before a controlled fail-closed diagnostic.
    observed: false
    observation_boundary: >-
      Darwin rejected invalid-byte filename creation with Errno 92, so this is
      an untested portability risk, not a finding.
    cheapest_control: >-
      Run on a bytes-capable Linux filesystem and parse bytes or use an explicit
      surrogateescape policy.
  - risk: >-
      A disappearing/replaced Git executable between the probe and ls-files can
      raise or hang because the second call lacks OSError handling and timeout.
    observed: false
    cheapest_control: >-
      Mock second-call OSError/timeout and convert it to the explicit
      target-not-read error used for probe failures.

