blocking_objections:
  - id: B2-CANDIDATE-ASYMMETRY
    title: Reverse gitlink-to-descendants candidate state launders an initialized target into whole-ledger traversal
    severity: blocking_for_B2_closure_and_coordinator_merge_decision
    affected_claims:
      - Protected-prefix Git classification represents all effective candidate states.
      - Validation does not traverse through a protected ledger or ledger/goals gitlink alias.
      - Target-only initialized-checkout objects are not accessed or registered.
      - Index/worktree mode changes and rename routes are closed in both directions.
    mechanism: >-
      protected_prefix_git_errors queries only `git ls-files --stage`, counts
      any descendant as proof of an ordinary protected directory, and does not
      inspect committed HEAD mode. Start from an initialized mode-160000 HEAD
      entry at ledger or ledger/goals. In the index, remove that exact entry,
      add a 100644 descendant at the protected path, and put the same 160000
      entry at a rename destination while retaining the initialized target
      directory. The index-only classifier returns no error; lstat sees a
      directory; goal discovery scandirs and parses the retained target.
      Selecting a benign alternate GIT_INDEX_FILE produces the same mismatch.
    immutable_snapshot_evidence:
      - file: tools/validate_ledger.py
        lines: 1446-1528
        observation: >-
          The classifier probes only the effective index and records only exact
          modes plus a descendant count; it never checks HEAD or binds worktree
          files to candidate blobs.
      - file: tools/validate_ledger.py
        lines: 1531-1557
        observation: >-
          With no index error, ordinary-directory lstat is accepted even when
          that directory is the retained checkout of the committed gitlink.
      - file: tools/validate_ledger.py
        lines: 1370-1443
        observation: Goal discovery scandirs and opens flat and sharded YAML beneath ledger/goals.
      - file: tools/validate_ledger.py
        lines: 1585-1598
        observation: check_goals registers each target-only goal ID after the asymmetric guard.
      - file: tools/test_goal_id_random_suffix.py
        lines: 346-355
        observation: >-
          The disagreement regression covers only index=gitlink followed by
          worktree=ordinary, not the reverse HEAD/index direction.
    reverse_mode_transition_reproducer:
      ledger:
        committed_HEAD_entry: '160000 at ledger'
        candidate_index_entry: '100644 at ledger/goals/GOAL-CANDIDATE-a1b2c3.yaml'
        renamed_gitlink_entry: '160000 at moved-ledger'
        classifier_prefix_errors: []
        target_scandir_attempts: 2
        target_yaml_load_attempts: 3
        target_ids_registered: [GOAL-GITLINK-999, GOAL-GITLINK-a1b2c3]
        malformed_target_yaml_load_attempted: true
      ledger_goals:
        committed_HEAD_entry: '160000 at ledger/goals'
        candidate_index_entry: '100644 at ledger/goals/GOAL-CANDIDATE-a1b2c3.yaml'
        renamed_gitlink_entry: '160000 at ledger/moved-goals'
        classifier_prefix_errors: []
        target_scandir_attempts: 2
        target_yaml_load_attempts: 3
        target_ids_registered: [GOAL-GITLINK-999, GOAL-GITLINK-a1b2c3]
        malformed_target_yaml_load_attempted: true
      merge_hygiene_control: >-
        Existing merge hygiene rejects both cases from committed HEAD mode
        160000. Composed admission is safe, but standalone whole-ledger
        validation and its frozen narrow claim are not.
    alternate_index_variant:
      setup: >-
        Preserve a benign descendant index, commit and materialize a protected
        gitlink in the primary index, then set GIT_INDEX_FILE to the benign index.
      ledger_classifier_errors: []
      ledger_goals_classifier_errors: []
      target_ids_registered_at_each_prefix: [GOAL-GITLINK-999, GOAL-GITLINK-a1b2c3]
      target_scandir_attempts_at_each_prefix: 2
      target_yaml_load_attempts_at_each_prefix: 3
    why_blocking: >-
      This is a static, repository-representable staged type-change and rename
      state at each explicitly protected prefix. It requires no race, network,
      submodule fetch, or malformed Git command and directly falsifies the
      standalone target-nonread claim named by the handoff.
    cheapest_falsification_control: >-
      At each prefix commit an initialized 160000 entry containing valid
      legacy/random goals and malformed YAML; stage removal of the exact entry,
      an ordinary descendant, and a 160000 rename destination; retain the
      worktree. Require a trusted-prefix error before any scandir/load and zero
      target registrations. Repeat with a benign alternate GIT_INDEX_FILE.
    cheapest_fix: >-
      Inspect exact protected-prefix modes in both HEAD and the effective index
      before traversal; reject any exact 160000/120000/non-tree state or
      unresolved HEAD/index provenance transition. Sanitize Git redirection
      variables or bind and report the selected git-dir, worktree, and index.
    resolution_gate:
      - Reverse gitlink-to-descendants states at ledger and ledger/goals reject before target scandir.
      - Rename variants retain zero target YAML loads and zero target registrations.
      - Alternate-index redirection cannot substitute benign metadata for the traversed worktree.
      - Direct exact-index gitlink, symlink, ordinary-directory, migration, and retained controls still pass.

nonblocking_objections:
  - id: B2-DESCENDANT-GITLINK-SCOPE
    title: A mode-160000 goal child counts as an ordinary descendant and is traversed
    severity: nonblocking_under_the_adopted_exact_prefix_scope
    observation: >-
      With mode 160000 at ledger/goals/GOAL-CHILD-a1b2c3 and no exact protected
      entry, the classifier returned no errors, made three protected-tree
      scandirs, loaded child goal.yaml, and registered GOAL-CHILD-a1b2c3 with
      marker CHILD_GITLINK_TARGET.
    scope_disposition: >-
      The Coordinator excluded arbitrary non-prefix gitlinks, so this does not
      independently block the exact-prefix claim. It shows descendant_count
      accepts every mode and that target-only child objects remain a residual.
    cheapest_control: >-
      Add a child-gitlink fixture. Reject mode 160000 anywhere on a goal source
      path if sources must be repository-owned; otherwise disclose that
      initialized descendant gitlinks may be read.

  - id: B2-STABLE-WORKTREE-PRECONDITION
    title: Component lstat and later scandir are not descriptor-bound
    severity: nonblocking_static_scope_residual
    observation: >-
      A deterministic mutation immediately after check_goal_symlinks replaced
      ledger/goals with an external symlink. load_goal_documents followed it,
      loaded target YAML, and registered GOAL-SWAP-a1b2c3 without a prefix error.
    scope_disposition: >-
      The frozen matrix is static and does not claim concurrent-mutation
      resistance, but the adopted wording must disclose this precondition.
    cheapest_control: >-
      Declare a stable-worktree precondition plus before/after identity check,
      or use directory-descriptor and no-follow traversal.

  - id: B2-NESTED-NONGIT-OVERBREADTH
    title: A filesystem fixture nested under an unrelated Git worktree is classified as Git
    severity: nonblocking_fail_closed_overbreadth
    observation: >-
      A directory without its own .git marker passed standalone, but the same
      ordinary ledger/goals fixture nested under an unrelated worktree was
      classified in_git=true and rejected because the parent index lacked it.
    scope_disposition: >-
      This is fail-closed and does not enable traversal. It narrows non-Git to
      outside every Git worktree, not merely a non-checkout-root directory.
    cheapest_control: >-
      Compare `git rev-parse --show-toplevel` with normalized REPO, or document
      and test that nested directories inherit the parent Git boundary.

