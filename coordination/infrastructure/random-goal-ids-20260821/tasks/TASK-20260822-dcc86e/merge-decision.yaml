    blocking_findings:
      - id: B2-REPLACE-OBJECT-LAUNDERING
        title: Git replacement objects launder a raw protected-prefix gitlink into an effective ordinary tree
        observation: >-
          Raw HEAD contains an exact mode-160000 entry at ledger or
          ledger/goals. A default refs/replace mapping, or a caller-selected
          GIT_REPLACE_REF_BASE namespace, replaces the commit or tree observed
          by ordinary Git object resolution. The protected-prefix query then
          reports effective mode 040000. validate_ledger.py accepts the
          apparently ordinary state, traverses the initialized target, registers
          hidden legacy and random-suffix GOAL records, and parses malformed
          target YAML.
        control: >-
          Setting GIT_NO_REPLACE_OBJECTS=1 restores raw-object classification
          and rejection.
        consequence: >-
          The repair binds Git metadata to the explicit repository root but
          still allows Git replace-object semantics to rewrite the provenance
          objects used to classify protected prefixes.
        disposition: blocks_merge
    retained_controls:
      - Explicit-root GIT_INDEX_FILE handling passed.
      - Explicit-root GIT_DIR and GIT_WORK_TREE handling passed.
      - HEAD/index/worktree candidate-asymmetry controls passed without replace-object mappings.
