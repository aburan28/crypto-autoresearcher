nonblocking_objections:
  - id: N1
    title: --check labels a free legacy GOAL ID as OK
    evidence:
      - file: tools/allocate_id.py
        lines: 185-218
      - command: python3 tools/allocate_id.py --check GOAL-FREE-001
        exit_code: 0
        output: >-
          well-formed YES; zero occurrences; OK: well-formed and free across
          the union.
    boundary: >-
      Ordinary staging/commit still triggers the prospective rejection, and
      every new-goal document forbids manual suffix choice. This therefore does
      not independently bypass the regular-file merge path.
    cheapest_falsification_control: >-
      Add a test for an unused three-digit GOAL and either return nonzero or
      emit an explicit non-authoritative legacy-history warning; verify an
      existing legacy ID remains recognized as historical/taken.
  - id: N2
    title: The goal allocator does not enforce its area option channel
    evidence:
      - file: tools/allocate_id.py
        lines: 337-373
      - command: python3 tools/allocate_id.py --next goal --date 20260821 --seed 11
        exit_code: 0
        output: GOAL-20260821-eee65f
      - command: >-
          python3 tools/allocate_id.py --next goal --area ERANK --date 20260821 --seed 11
        exit_code: 0
        output: GOAL-ERANK-eee65f; the date was silently ignored
    boundary: >-
      Both outputs satisfy the frozen alphanumeric GOAL area grammar and use a
      random suffix, so this does not mint a legacy ID. It violates the declared
      area-scoped CLI contract and can misclassify the campaign area.
    cheapest_falsification_control: >-
      Make --area and --date mutually exclusive and require the option mapped
      to the selected type; add wrong-option and both-option tests.
  - id: N3
    title: Untracked additions and deletions are not policy-covered
    evidence:
      - file: tools/check_merge_hygiene.py
        lines: 89-92
      - observation: >-
          An untracked GOAL-NEW-004 regular head and a staged deletion of
          GOAL-BASE-001 each produced no prospective problem.
    boundary: >-
      git ls-files coverage is documented as tracked index/worktree state;
      untracked content must be staged before commit and then becomes visible.
      A deletion is not new minting. Neither condition independently breaks the
      stated regular-path newness policy.
    cheapest_falsification_control: >-
      Document these two exclusions in the CLI help and add explicit tests so
      later users do not mistake the gate for general goal immutability.

residual_risks:
  - >-
    The 24-bit random space still permits chance collision; allocation/check
    plus cross-branch collision checks remain mandatory. No uniqueness proof is
    implied by one random draw.
  - >-
    Projection, MCP, and dispatch intentionally do not duplicate the
    authoritative identifier grammar. Their acceptance of safe opaque strings
    remains dependent on merge and ledger gates operating before committed use.
  - >-
    A semantic set cannot expose duplicate layouts because it deduplicates by
    definition; the separate whole-ledger registry and projection ambiguity
    checks must remain required.
  - >-
    The base Python environment lacks the optional FastMCP dependency. The
    isolated dependency command passed 10 MCP tests, but dependency availability
    remains an operational property, not evidence that aliases are safe.

required_controls:
  - id: C1
    purpose: Close blocking B1.
    test: >-
      Commit docs/legacy-alias/goal.yaml and a tracked directory symlink
      ledger/goals/GOAL-BYPASS-002 -> ../../docs/legacy-alias; require both
      merge hygiene and whole-ledger validation to fail before projection.
  - id: C2
    purpose: Preserve legitimate migration.
    test: >-
      Replace a base regular flat GOAL-BASE-001 head with a regular sharded head
      of the same semantic ID; require prospective and whole-ledger passes.
  - id: C3
    purpose: Align source-kind semantics.
    test: >-
      Commit a random flat goal-head symlink to an in-repository YAML target;
      require merge hygiene, ledger validation, and projection all to reject it.
  - id: C4
    purpose: Prevent misleading legacy confirmation.
    test: >-
      Check a free GOAL-FREE-001 and an existing historical GOAL; require a
      distinction between prohibited new legacy use and compatible history.
  - id: C5
    purpose: Enforce area-scoped CLI selection.
    test: >-
      Require --next goal --date and simultaneous --area/--date to fail while
      --next goal --area P13 remains valid under the frozen area grammar.

