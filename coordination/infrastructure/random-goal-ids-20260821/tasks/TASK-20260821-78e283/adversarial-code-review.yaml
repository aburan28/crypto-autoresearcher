executive_disposition:
  blocking_objection_count: 1
  nonblocking_objection_count: 3
  semantic_mechanism_disposition: breaks_on_tracked_sharded_symlink_alias
  narrowest_supported_statement: >-
    For ordinary regular-file goal heads, the snapshot correctly admits a new
    random six-hex ID, rejects newly introduced three-digit flat and sharded
    IDs from staged or committed candidate state, and preserves an existing
    legacy ID across a flat-to-sharded migration. It does not enforce that
    policy for every Git-representable goal head: a tracked symlink directory
    can introduce a new legacy sharded semantic goal without entering the
    candidate semantic-ID set, while the ledger validator follows the alias.
  next_concrete_action: >-
    Add one shared plain-source invariant for goal heads, enforce it in both
    merge hygiene and whole-ledger validation, add the sharded-symlink bypass
    regression below, archive a successor implementation snapshot, and rerun
    the independent review round.

blocking_objections:
  - id: B1
    title: A tracked sharded-directory symlink bypasses new-legacy rejection
    affected_claims:
      - Newly introduced legacy flat and sharded goal forms are rejected.
      - Candidate-minus-base semantic GOAL identities are complete for Git candidate state.
      - Whole-ledger acceptance and campaign projection acceptance agree on a goal head.
    severity: blocking_for_coordinator_merge_decision
    mechanism: >-
      Git records a directory symlink as one index entry named
      ledger/goals/GOAL-BYPASS-002, not as the syntactic head path
      ledger/goals/GOAL-BYPASS-002/goal.yaml. tracked_files() therefore supplies
      no matching head to goal_id_from_head_path(), so the candidate semantic
      set omits the new legacy ID. Python globbing in load_goal_documents()
      follows the symlink into a committed target directory and validates the
      target goal as if it were a normal sharded head. The campaign projection
      correctly rejects every symlink component, producing an end-to-end split.
    immutable_snapshot_evidence:
      - file: tools/check_merge_hygiene.py
        lines: 79-82
        observation: >-
          Only literal flat *.yaml and sharded */goal.yaml paths define a
          semantic head.
      - file: tools/check_merge_hygiene.py
        lines: 89-145
        observation: >-
          Candidate IDs are derived from git ls-files path strings; neither Git
          modes nor symlink aliases are inspected before candidate-minus-base.
      - file: tools/validate_ledger.py
        lines: 1369-1420
        observation: >-
          Flat and sharded documents are discovered with glob and passed to
          load_yaml without a lstat/plain-source check.
      - file: orchestration/campaign/projection.py
        lines: 114-163
        observation: >-
          The committed projection deliberately rejects both a symlink head and
          any symlink component in its path.
      - file: tests/test_campaign_projection.py
        lines: 333-353
        observation: >-
          The projection's tracked-symlink refusal is already an explicit
          regression invariant.
      - file: tools/test_goal_id_random_suffix.py
        lines: 17-99
        observation: >-
          Prospective-policy tests create only regular heads and contain no
          symlink-directory alias control.
    worked_reproducer:
      base_fixture:
        - Create and commit regular ledger/goals/GOAL-BASE-001.yaml.
        - Tag that commit base-tree.
      candidate_fixture:
        - >-
          Create committed regular target docs/legacy-alias/goal.yaml whose
          research_goal.id is GOAL-BYPASS-002 and whose required goal fields are complete.
        - >-
          Create tracked symlink ledger/goals/GOAL-BYPASS-002 pointing to
          ../../docs/legacy-alias and commit both candidate paths.
      executed_command: >-
        PYTHONPATH=/tmp/goalid-rt-src.hlCvJw:/tmp/goalid-rt-src.hlCvJw/tools
        python3 - [inline deterministic tempfile Git fixture invoking the
        snapshot modules check_merge_hygiene, validate_ledger, and projection]
      exact_observations:
        git_ls_files:
          - docs/legacy-alias/goal.yaml
          - ledger/goals/GOAL-BASE-001.yaml
          - ledger/goals/GOAL-BYPASS-002
        derived_candidate_semantic_ids:
          - GOAL-BASE-001
        prospective_problems: []
        full_merge_hygiene_exit_code: 0
        full_merge_hygiene_output: >-
          PASS: no conflict markers, no unparseable records, no identifier
          collisions, no new legacy GOAL identifiers
        ledger_goal_errors: []
        projection_result: >-
          ProjectionError: goal projection source may not traverse symlink
          component ledger/goals/GOAL-BYPASS-002
    second_alias_control:
      setup: >-
        A tracked flat random head implemented as a symlink to a committed
        in-repository YAML target.
      prospective_problems: []
      merge_parse_errors: []
      ledger_goal_errors: []
      projection_result: >-
        ProjectionError: goal projection source may not be a symlink
      interpretation: >-
        Even when the suffix policy is satisfied, whole-ledger validation and
        projection disagree about whether the record is an admissible source.
    why_it_matters: >-
      The stronger fixture is not merely a projection availability issue: it
      commits a genuinely new three-digit sharded goal while the new
      prospective gate announces that no new legacy GOAL exists. That is the
      exact policy the repair is intended to make impossible. The same alias
      also means a goal accepted by the authoritative ledger pass cannot be
      materialized by the campaign observer or MCP status path.
    cheapest_literal_fix:
      - >-
        In tools/check_merge_hygiene.py, inspect Git index/tree modes (or lstat
        every tracked ledger/goals/GOAL-* candidate path) and reject a goal head
        whose head or parent goal directory is a symlink. Do not infer sharded
        heads solely from git ls-files names.
      - >-
        In tools/validate_ledger.py load_goal_documents(), require every goal
        head and path component below ledger/goals to be a regular non-symlink
        source before load_yaml, matching projection._assert_plain_source_path.
      - >-
        Add a regression that commits the exact GOAL-BYPASS-002 directory
        symlink fixture and requires nonzero prospective/full-gate and ledger
        outcomes; add a random flat-symlink control requiring the same source
        invariant, while retaining the regular flat-to-sharded legacy control.
    resolution_gate:
      - Successor snapshot rejects the symlink-directory fixture before projection.
      - Regular historical flat and sharded goals still validate.
      - Regular flat-to-sharded migration of the same base semantic ID still passes.
      - Independent Reviewer and Validator rerun against the successor snapshot.

semantic_base_candidate_disposition:
  verdict: breaks
  holds_for:
    - case: staged_new_legacy_flat_regular
      expected: reject
      observed: one prospective problem naming GOAL-NEW-002
    - case: committed_new_legacy_sharded_regular
      expected: reject
      observed: one prospective problem naming GOAL-NEW-003
    - case: staged_new_random_flat_and_sharded_regular
      expected: accept_prospective_policy
      observed: no prospective problem
    - case: existing_legacy_flat_to_sharded_regular
      expected: preserve_same_semantic_id
      observed: no prospective problem and no whole-goal validation error
    - case: rename_existing_legacy_to_distinct_legacy_id
      expected: reject_new_semantic_id
      observed: one prospective problem naming GOAL-RENAMED-001
  breaks_for:
    - case: committed_new_legacy_sharded_directory_symlink
      expected: reject
      observed: >-
        Full merge hygiene exit 0 and whole-goal validation emitted no error;
        projection rejected the alias later.
  interpretation: >-
    Set subtraction is the right abstraction for regular heads, but the
    function collecting the semantic set is incomplete over Git path modes.

