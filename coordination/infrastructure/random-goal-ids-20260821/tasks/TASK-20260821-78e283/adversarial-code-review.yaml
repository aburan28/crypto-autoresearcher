    disposition: known_valid_proves_too_much_control_holds
  - attack: existing legacy flat renamed to different legacy semantic ID
    candidate_state: staged
    prospective: rejected
    disposition: holds
  - attack: duplicate regular flat and sharded heads with same legacy ID
    prospective: no_problem_because_semantic_set_deduplicates
    ledger_result: duplicate ID error
    projection_result: ambiguous layout error
    disposition: rejected_by_preserved_downstream_identity_checks
  - attack: random path containing a legacy research_goal.id
    prospective: no_problem_for_random_path
    ledger_result:
      - filename must match id
      - goal directory must be named the content id
    disposition: rejected_by_preserved_path_content_checks_for_regular_files
  - attack: legacy path containing a random research_goal.id
    prospective: rejected_for_legacy_path
    ledger_result:
      - filename must match id
      - goal directory must be named the content id
    disposition: rejected_twice
  - attack: four-character suffix GOAL-NEW-abcd
    prospective: rejected
    ledger_result: invalid goal id
    disposition: holds
  - attack: seven-character suffix GOAL-NEW-abcdef0
    prospective: rejected_by_random_pattern
    ledger_result: invalid goal id
    disposition: holds
  - attack: uppercase suffix GOAL-NEW-ABCDEF
    prospective: rejected
    ledger_result: invalid goal id
    disposition: holds
  - attack: lowercase area GOAL-new-a1b2c3
    prospective: rejected
    ledger_result: invalid goal id
    disposition: holds
  - attack: digit-bearing area GOAL-P13-a1b2c3
    prospective: accepted
    ledger_result: accepted
    disposition: >-
      Matches the frozen GOAL-specific [A-Z0-9]+ area grammar and historical
      P13 compatibility; this is not a bypass.
  - attack: committed sharded directory symlink for GOAL-BYPASS-002
    prospective: accepted_in_error
    ledger_result: accepted_in_error
    projection_result: rejected
    disposition: blocking_B1

candidate_state_coverage:
  committed: >-
    Regular committed flat/sharded paths are covered by git ls-files and the
    exact-base comparison. A committed directory symlink is not represented as
    */goal.yaml and is the B1 hole.
  staged: >-
    git ls-files reflects staged additions and removals; the ordinary staged
    legacy flat fixture is rejected. Content is not used to derive semantic
    identity, so authoritative path/content validation is a required companion.
  untracked: >-
    Not covered by git ls-files and explicitly outside the implementation's
    tracked candidate promise. An untracked legacy head passes both this
    prospective function and the combined historical ledger grammar, but it
    cannot enter a commit without first becoming staged, where the ordinary
    path is rejected.
  rename: >-
    A rename to a distinct legacy ID is rejected as candidate-minus-base; a
    flat-to-sharded rename with the same ID is correctly preserved.
  deletion: >-
    Deletions reduce the candidate set and generate no prospective problem.
    This is consistent with a newness gate but does not enforce general goal
    immutability or anti-deletion policy.

proves_too_much_controls:
  - control: flat_to_sharded_same_legacy_id
    known_valid: true
    observed: passes prospective and whole-goal validation
  - control: checkpoint_path_bearing_existing_goal_id
    known_valid: true
    evidence: >-
      goal_ids_from_paths recognizes only the two head patterns; the committed
      test excludes ledger/goals/GOAL-Z-001/checkpoints/BATCH-001.yaml.
    observed: not classified as a new goal
  - control: handoff_queue_and_reference_text_naming_existing_legacy_goal
    known_valid: true
    evidence: >-
      Semantic newness is path-head based, not a content/reference scan;
      dispatch keeps goal_id as opaque nonempty text at
      tools/research_dispatch.py lines 519-529.
    observed: not classified as a new goal
  - control: duplicate_same_semantic_id
    known_invalid: true
    observed: >-
      Prospective set subtraction alone is silent, but the whole-goal registry
      emits a duplicate-ID error and projection rejects ambiguous layout.

