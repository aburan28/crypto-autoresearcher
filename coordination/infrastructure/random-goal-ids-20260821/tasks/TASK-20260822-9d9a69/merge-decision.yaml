  protected_prefix_state_policy:
    protected_prefixes:
      - ledger
      - ledger/goals
    metadata_sources:
      - committed HEAD tree entry
      - effective candidate or index entry
      - non-following working-tree object type
    required_before_traversal:
      - inspect exact HEAD entry for each protected prefix
      - inspect exact effective index entry for each protected prefix
      - inspect working-tree object without following aliases
      - prove states coherent for the declared validation mode
    hard_fail_conditions:
      - HEAD or index has exact mode 160000
      - HEAD or index has exact mode 120000
      - candidate metadata and traversed worktree contents are not proven coherent
      - alternate index or Git environment changes classification without changing checkout
      - protected-prefix metadata cannot be determined in a Git worktree
    behavior_on_fail:
      - explicit candidate-state trusted-prefix error
      - no protected-prefix traversal
      - no target-only goal registration or YAML parsing
      - no target-derived malformed-record errors
  alternate_index_policy: >-
    Choose and document one coherent model: sanitize or reject caller-supplied
    alternate indexes for protected-prefix provenance, or validate the supplied
    candidate entirely without mixing its metadata with ordinary checkout
    contents.
  required_controls:
    - reverse HEAD gitlink to index descendants at ledger/goals and ledger
    - rename destination under the same reverse transition
    - hidden legacy/random goals, both interpretation markers, and malformed target YAML
    - benign alternate GIT_INDEX_FILE with actual initialized checkout target
    - ordinary HEAD and ordinary index agreement
    - exact gitlink agreement and exact symlink in either metadata source
    - coherent ordinary worktree traversal and mismatched-state fail closed
    - prior direct gitlink, B1, B2-symlink, migration, N1, N2, N4, and regular-path controls
    - exact scope boundaries for descendant gitlinks and nested non-Git directories
  claim_scope:
    supported_if_gates_pass: >-
      Whole-ledger validation does not traverse protected ledger or
      ledger/goals worktree contents when HEAD, candidate-index, and filesystem
      states are inconsistent or either Git state identifies an exact alias.
      Objects available only through such an alias are not accessed or registered.
    not_supported:
      - arbitrary descendant gitlink rejection beyond existing rules
      - globally stable worktree outside protected prefixes
      - no filesystem access outside protected aliases
      - blanket rejection of ordinary nested non-Git directories
