      new legacy GOAL identifiers. The successful CLI banner contains those
      words when reporting their absence, so three ordinary controls were
      mislabeled FAIL by the validator wrapper although each product exit was
      zero and its output was the expected PASS banner.
    correction: >-
      Re-ran those three controls with the negative assertion scoped to an
      actual FAIL group. All three passed. No repository artifact was changed.
    product_effect: none
  - id: validator_fixture_allocator_output_shape
    observation: >-
      The first N1/N2 wrapper expected shorter phrases and a bare identifier,
      while the allocator prints a descriptive multi-line receipt. Product
      exits and semantics were already correct, but eight wrapper assertions
      were too narrow.
    correction: >-
