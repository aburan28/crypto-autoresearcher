implementation_contract:
  task_id: TASK-20260821-87762f
  approved_by_scope_task: TASK-20260821-6c509d
  archive_owner: TASK-20260821-2a2411
  objective: >-
    Implement canonical allocation, whole-tree compatibility validation, and
    base-aware prospective enforcement for random-suffix GOAL identifiers while
    preserving every existing legacy GOAL record and reference byte-for-byte.
  base_ref: origin/main
  base_commit: 76b860c1ba1364b6a74695a09d1ae995a6ba8ebe
  inventory_snapshot_commit: 3263ed07562a401fb8a7ef9923784a80c6603207
  goal_id_grammars:
    legacy:
      conceptual_regex: '^GOAL-[A-Z0-9]+-[0-9]{3}$'
      valid_for_existing_records_and_references: true
      valid_for_new_goal_minting: false
    random:
      conceptual_regex: '^GOAL-[A-Z0-9]+-[0-9a-f]{6}$'
      valid_for_existing_records_and_references: true
      valid_for_new_goal_minting: true
    combined_reference:
      accepts: [legacy, random]
    prospective_new_goal:
      accepts: [random]
  allocator_requirements:
    canonical_cli_type: goal
    area_scoped: true
    output_shape: GOAL-<AREA>-<random-6-hex>
    random_token_mechanism: existing allocator mechanism
    sequential_goal_allocation_allowed: false
    check_supported: true
    flat_collision_detection: required
    sharded_collision_detection: required
    audit_covers_both_layouts: true
    live_erank_goal_created_by_tests: false
  prospective_enforcement:
    mechanism: semantic base-set versus candidate-set comparison
    new_legacy_flat_rejected: true
    new_legacy_sharded_rejected: true
    new_random_flat_or_sharded_accepted_subject_to_other_checks: true
    flat_to_sharded_existing_legacy_not_misclassified: true
    duplicate_and_path_identity_checks_preserved: true
    timestamps_or_grandfather_list_used: false
  documentation_policy:
    new_goal: allocate with canonical goal allocator and confirm with --check
    existing_goal: legacy three-digit IDs remain valid and are never renamed only for style
    prohibited:
      - minting GOAL-AREA-NNN for a new goal
      - choosing a suffix manually
      - scanning for max plus one
      - renaming an archived legacy goal
  exact_write_scope:
    - tools/allocate_id.py
    - tools/validate_ledger.py
    - tools/check_merge_hygiene.py
    - tools/test_allocate_id.py
    - tools/test_goal_closure_quorum.py
    - tools/test_research_dispatch.py
    - tools/test_goal_id_random_suffix.py
    - tests/test_campaign_projection.py
    - tests/test_campaign_mcp.py
