    blindness:
      validator_report_read: false
    blocking_findings:
      - id: B2
        title: Ledger-root or goals-root symlink bypasses candidate validation
        observation: >-
          A committed Git mode-120000 alias at ledger/goals, or at its ledger
          ancestor, causes check_merge_hygiene.py --base to exit zero.
          Whole-ledger validation follows the alias and registers and reads a
          target-only hidden legacy GOAL sentinel, while campaign projection
          rejects the same filesystem object.
        consequence: >-
          The repair validates children beneath ledger/goals without first
          establishing that ledger and ledger/goals are repository-owned
          ordinary directories. A trusted-prefix replacement changes the
          effective goal corpus outside the candidate-tree boundary.
        disposition: blocks_merge
    retained_findings:
      - B1 child and staged symlink rejection holds.
      - Committed, staged-index, and promised tracked-worktree path union holds.
      - N1 free legacy GOAL --check rejection holds.
      - N2 goal allocation scope rejection holds.
    included_nonblocking_findings:
      - id: N4
        title: Repeated --area silently uses the last occurrence
        disposition: include_in_successor
        rationale: >-
          The canonical contract requires exactly one --area occurrence for
          --next goal. Last-wins behavior makes namespace selection ambiguous,
          including when the repeated values happen to be identical.
  validator_evidence:
    task_id: TASK-20260822-623567
    archive_task: TASK-20260822-c978bb
