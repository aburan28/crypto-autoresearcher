  trusted_prefix_policy:
    protected_components:
      - ledger
      - ledger/goals
    allowed_candidate_type:
      git_mode: '040000'
      filesystem_type: ordinary_directory
    forbidden_candidate_types:
      - Git mode 120000 symlink
      - filesystem symlink
      - regular file
      - special file
      - missing required component
      - any object whose directory behavior depends on following a link
    state_coverage:
      - committed candidate or HEAD tree entry mode
      - staged index mode, even when the worktree differs
      - promised tracked-worktree non-following metadata
      - absolute-tree lstat before resolve, glob, recursion, or read
    failure_semantics:
      merge_hygiene: nonzero with explicit trusted-prefix error
      ledger_validation: explicit ledger or goal-root error
      traversal: prohibited
      target_read: prohibited
    untracked_boundary: outside coverage until staged
  whole_ledger_requirements:
    - Inspect ledger and ledger/goals without following either component.
    - Emit an explicit error when either component is a symlink or non-directory.
    - Skip all goal traversal after a trusted-prefix error.
    - Never register, cite, parse, count, or resolve a target-only goal.
    - Prevent every whole-ledger entrypoint from traversing the same invalid prefix.
  b2_required_controls:
    committed:
      - ledger/goals alias with external target and target-only sentinel
      - ledger ancestor alias with goals target and target-only sentinel
      - dangling prefix aliases
      - internal repository-relative target aliases
      - targets carrying valid random-suffix and legacy goal heads
    staged_index:
      - staged ledger/goals type change to a symlink
      - staged ledger type change to a symlink
      - staged symlink followed by an ordinary worktree replacement
    tracked_worktree:
      - promised-scope unstaged prefix type change to a symlink
    compatibility:
      - ordinary ledger and ledger/goals directories pass
      - legitimate flat-to-sharded migration passes
      - prior child symlink B1 remains rejected
      - an outside-prefix symlink is not mislabeled as B2
      - existing regular-path and candidate-state controls pass
    sentinel_non_read: >-
      A unique target-only goal ID and parse marker must be absent from
      discovered IDs, parsed records, status counts, references, and
      target-derived validation output.
  repeated_area_policy:
    command: tools/allocate_id.py --next goal
    accepted:
      - exactly one --area AREA occurrence
    rejected:
      - no --area
      - one or more --date arguments
      - simultaneous --area and --date
      - repeated --area with different values
      - repeated --area with identical values
    failure:
      exit_status: nonzero
      identifier_emitted: false
      message: goal allocation requires exactly one --area occurrence
    compatibility:
      - N1 free legacy --check rejection remains effective.
      - N2 date and simultaneous-scope rejection remains effective.
      - Unrelated allocator types do not change.
