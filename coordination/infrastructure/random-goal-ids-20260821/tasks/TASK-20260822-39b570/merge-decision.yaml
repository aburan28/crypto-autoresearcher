    retained_scope: >-
      The declared regular-path, child-symlink, candidate-state, allocator,
      scope, hash, and zero-new-error matrix.
    limitation: >-
      The declared matrix did not establish the non-symlink integrity of the
      ledger and ledger/goals prefix components. PASS does not cover B2.
  composition:
