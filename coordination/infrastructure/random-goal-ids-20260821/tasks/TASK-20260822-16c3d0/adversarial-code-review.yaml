  blocking_objections:
    - id: B2-REPLACE-OBJECT-LAUNDERING
      severity: blocking
      status: reproduced
      claim_joint: >-
        Bound Git metadata must describe the raw committed HEAD tree rather
        than a caller- or repository-selected replacement object.
      mechanism: >-
        _explicit_git_environment removes six repository/index redirects but
        leaves GIT_REPLACE_REF_BASE, and bound_git invokes ordinary git without
        --no-replace-objects or a validator-owned GIT_NO_REPLACE_OBJECTS=1.
        Consequently Git replacement refs can replace the HEAD commit during
        ls-tree object resolution even though --git-dir, --work-tree, and the
        actual index are correctly rebound. This is object-identity laundering,
        not repository-root redirection.
      immutable_snapshot_evidence:
        - provenance: internal
          path: tools/validate_ledger.py
          snapshot: 0fbccff386c2e5e47da21ba4024137fa8a9b4500
          lines: 1446-1455
          observation: >-
            The scrub set omits GIT_REPLACE_REF_BASE and passes every other
            caller variable through.
        - provenance: internal
          path: tools/validate_ledger.py
          snapshot: 0fbccff386c2e5e47da21ba4024137fa8a9b4500
          lines: 1515-1527
          observation: >-
            bound_git fixes the actual index, Git directory, and worktree but
            does not disable replacement-object semantics before ls-tree HEAD.
        - provenance: internal
          path: tools/validate_ledger.py
          snapshot: 0fbccff386c2e5e47da21ba4024137fa8a9b4500
          lines: 1556-1562
          observation: >-
            An effective 040000 HEAD entry and ordinary index descendants are
            accepted, so a replaced HEAD tree reaches filesystem traversal.
      worked_fixture:
        setup:
          - Initialize a local repository with ordinary tracked ledger/goals descendants and commit it as the benign base.
          - Replace the exact ledger/goals index entry with mode 160000 pointing at the base commit and commit that raw malicious HEAD.
          - Restore the actual candidate index from the benign base so it exposes ordinary descendants while retaining the initialized ledger/goals working-tree directory.
          - Add hidden GOAL-999, hidden GOAL-a1b2c3, and malformed-YAML sentinels only in that initialized working-tree target.
          - Point a custom refs/red-team-replace namespace from the raw malicious HEAD commit to the benign base and set caller GIT_REPLACE_REF_BASE to that namespace.
        expected: >-
          Raw HEAD mode 160000 must be detected; validation must stop before
          scanning ledger/goals, register neither sentinel, and not parse the
          malformed target-only YAML.
        actual:
          raw_head_entry: '160000 commit 9f4ebec9be28cb552d9f3ebab1d04b00f6ab82f5 ledger/goals'
          replacement_head_entry: '040000 tree e7159bd6840f2c0c23a826e02052479b2b1c94ce ledger/goals'
          protected_prefix_git_errors: []
          hidden_legacy_goal_registered: true
          hidden_random_goal_registered: true
          target_only_malformed_yaml_read: true
          malformed_error: 'ledger/goals/GOAL-MALFORMED-deadbe.yaml: invalid YAML: while parsing a flow sequence'
        result: BREAKS
      default_namespace_variant:
        setup: >-
          The same raw HEAD/index/worktree fixture used ordinary git replace,
          with no GIT_REPLACE_REF_BASE environment variable.
        actual:
          raw_head_entry: '160000 commit 0284476c04bb28397c449f8c87dc070c10274508 ledger/goals'
          effective_head_entry: '040000 tree e7159bd6840f2c0c23a826e02052479b2b1c94ce ledger/goals'
          protected_prefix_git_errors: []
          hidden_random_goal_registered: true
        implication: >-
          Merely adding GIT_REPLACE_REF_BASE to the scrub list is insufficient;
          repository-local refs/replace state produces the same bypass.
      cheapest_falsification_control:
        implementation: >-
          Force GIT_NO_REPLACE_OBJECTS=1 in the validator-owned clean/bound
          environment after caller variables are removed, or place
          --no-replace-objects on every Git metadata command. Do not accept a
          caller value as the binding.
        regression: >-
          Add one deterministic fixture with raw HEAD mode 160000, ordinary
          actual-index descendants, an initialized target containing both GOAL
          sentinels and malformed YAML, and (a) default refs/replace and (b) a
          caller-selected GIT_REPLACE_REF_BASE. Assert exact gitlink rejection,
          no registration, and no malformed-YAML read for ledger/goals; replay
          the same loop for ledger.
        control_observation: >-
          On the default replacement fixture, setting
          GIT_NO_REPLACE_OBJECTS=1 changed protected_prefix_git_errors from []
          to the exact HEAD-tree mode-160000 rejection and changed hidden GOAL
          registration from true to false.

