    - Replay the retained B1/B2/N1/N2/N4 and ordinary-state matrices after the repair.
    - Either exclude concurrent mutation explicitly or add an atomic post-guard prefix-swap control.
    - Preserve the explicit arbitrary-descendant-gitlink non-claim.

  counterexample_or_mutation: >-
    A raw HEAD commit whose ledger/goals entry is mode 160000, combined with an
    ordinary actual index, initialized target-bearing worktree directory, and a
    Git replacement ref mapping that HEAD commit to an ordinary-tree commit.

  baseline_comparison:
    applicability: infrastructure_only
    result: >-
      Pollard-rho, BSGS, specialized ECDLP baselines, rank costs, and scientific
      performance claims are not implicated. The relevant baseline is raw
      git --no-replace-objects ls-tree HEAD, which reports mode 160000 where the
      snapshot's effective Git invocation reports replacement mode 040000.

  heuristic_challenges: []
  cost_model_challenges: []
  reduction_and_scope_challenges:
    - Replacement-object semantics are outside the producer's environment-variable model but inside Git object resolution, so explicit root/index binding alone does not imply raw-HEAD binding.
    - Arbitrary descendant gitlink protection is not claimed beyond existing rules and was not promoted into the narrow statement.
    - No global filesystem non-access claim is supported or made.
  proof_architecture_challenges:
    - attack: proves_too_much
      result: holds
      evidence: Ordinary nested non-Git directories remained accepted.
    - attack: observation_collision
      result: breaks
      evidence: >-
        Raw HEAD gitlink and benign raw HEAD states collide at the validator's
        observed effective 040000 metadata when Git replacement refs are active.
      missing_separator: replacement objects must be disabled for metadata queries.

  narrowest_supported_statement: >-
    At snapshot 0fbccff386c2e5e47da21ba4024137fa8a9b4500, when Git replacement
    objects are absent or externally disabled and no concurrent prefix swap
    occurs, the tested static fixtures bind the explicit validation root's raw
    ordinary HEAD/index/filesystem states against direct exact-prefix modes
    160000 and 120000, caller GIT_INDEX_FILE/GIT_DIR/GIT_WORK_TREE redirection,
    index/worktree disagreement, and missing metadata without reading protected
    alias targets. The committed claim without the replacement-object condition
    is false. No protection is established for arbitrary descendant gitlinks or
    global filesystem access.

  residual_risks:
    - Git replacement-object binding is a confirmed bypass, not merely residual risk.
    - Static check-to-traversal TOCTOU remains unbounded.
    - Arbitrary descendant initialized gitlinks remain outside the claim.
    - Non-UTF-8 Git path decoding has not been exercised.

  next_concrete_action: >-
    Coordinator should preserve this snapshot and finding, commission a fresh
    scoped repair that forces replacement objects off in every Git probe/query,
    add default and custom replacement-ref sentinels at ledger and ledger/goals,
    archive a new immutable successor snapshot, and request fresh independent
    review. This report does not authorize merge or status transition.

  procedure_deviations:
