    - id: RT-A3-RENAME-DESTINATION
      setup: retain initialized HEAD gitlink at ledger/goals; restore ordinary index and replace the original descendant with GOAL-RENAMED-a1b2c3.yaml via update-index cacheinfo.
      expected: rename destination must not authorize the raw HEAD gitlink.
      actual: raw HEAD mode 160000 rejected; no sentinel registration or malformed-YAML read.
      disposition: holds_absent_replace_objects
    - id: RT-A4-ALTERNATE-INDEX
      setup: caller supplies benign alternate GIT_INDEX_FILE while the explicit root has a committed protected gitlink.
      expected: bind the explicit root actual index and reject.
      actual: exact HEAD gitlink rejected; target not read.
      disposition: holds
    - id: RT-A5-MISLEADING-GIT-DIR
      setup: caller supplies only GIT_DIR for a benign repository while explicit root HEAD has exact ledger gitlink.
      expected: ignore caller GIT_DIR and reject explicit-root alias.
      actual: exact explicit-root HEAD gitlink rejected; target not read.
      disposition: holds
    - id: RT-A6-MISLEADING-GIT-WORK-TREE
      setup: caller supplies only GIT_WORK_TREE for a benign repository while explicit root HEAD has exact ledger gitlink.
      expected: ignore caller GIT_WORK_TREE and reject explicit-root alias.
