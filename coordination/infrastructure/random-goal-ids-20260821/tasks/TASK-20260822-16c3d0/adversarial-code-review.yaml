      disposition: holds
    - id: RT-A7-COMBINED-GIT-ENVIRONMENT
      setup: caller supplies benign GIT_DIR, GIT_WORK_TREE, and GIT_INDEX_FILE together while explicit root HEAD has exact ledger/goals gitlink.
      expected: sanitize all three and reject explicit-root alias.
      actual: exact explicit-root HEAD gitlink rejected; target not read.
      disposition: holds
    - id: RT-A8-INDEX-GITLINK-DISAGREEMENT
      setup: ordinary HEAD mode 040000 and ordinary initialized filesystem, but actual index exact ledger/goals mode 160000.
      expected: index state must block filesystem traversal.
      actual: exact Git index gitlink rejected; target not read.
      disposition: holds
    - id: RT-A9-COHERENT-ORDINARY
      setup: coherent ordinary HEAD tree, actual-index descendants, and ordinary filesystem directories.
      expected: protected-prefix gate accepts and base goal remains discoverable.
      actual: no prefix error; GOAL-BASE-001 registered.
      disposition: holds
    - id: RT-A10-DIRECT-EXACT-MODES
      setup: replay exact mode 160000 and exact mode 120000 separately at ledger/goals and ledger, with initialized target sentinels.
      expected: reject before target access.
      actual: all four cases rejected with the correct gitlink/symlink mode; no sentinel registered and malformed YAML not read.
      disposition: holds_absent_replace_objects
    - id: RT-A11-B1-CHILD-SYMLINK
      setup: ordinary protected prefixes plus a staged child goal-record symlink to an external marker-bearing goal.
      expected: child symlink rejected without target registration.
      actual: prefix metadata accepted, child-symlink error emitted, target ID not registered, marker absent from errors.
      disposition: holds
    - id: RT-A12-MISSING-METADATA
      setup: remove the actual index from an otherwise coherent temporary Git worktree.
      expected: fail closed before goal registration.
      actual: actual Git directory or index unavailable; target was not read; GOAL-BASE-001 not registered.
      disposition: holds
    - id: RT-A13-EXACT-VERSUS-DESCENDANT
      setup: compare ordinary protected-prefix descendants with an exact mode entry; separately stage a deeper vendor mode-160000 entry.
      expected: accept only the ordinary exact-prefix representation and do not misclassify arbitrary descendants as exact aliases.
      actual: ordinary descendant state passed; exact 160000/120000 states rejected; deeper vendor gitlink was outside the exact-prefix guard and accepted as declared.
      disposition: holds_with_explicit_scope_boundary
    - id: RT-A14-PROVES-TOO-MUCH
      setup: non-Git validation root with ordinary ledger/goals directories, a valid sharded goal, and additional ordinary nested directories.
      expected: filesystem-only boundary accepts ordinary directories rather than requiring Git metadata.
      actual: in_git false; no prefix error; sharded goal registered; no symlink or gitlink error.
      disposition: holds
    - id: RT-A15-N1-N2-N4
      setup: >-
        Review immutable N1 tests for staged flat and committed sharded legacy
