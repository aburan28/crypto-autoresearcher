  nonblocking_objections:
    - id: RISK-TOCTOU-PREFIX-SWAP
      status: unresolved_residual
      rationale: >-
        The prefix check and later inventories/goal scans are separate path-based
        operations. Snapshot lines 1793-1804 correctly put the check first, but
        no directory descriptor or other atomic binding prevents a concurrent
        process from replacing an ordinary directory after the check. The
        deterministic static-state handoff does not establish concurrent safety.
      claim_effect: >-
        Not needed to break this snapshot because replacement refs already do;
        any successor claim should explicitly exclude concurrent mutation or
        add an atomic traversal design.
      cheapest_falsification_control: >-
        Insert a test-only barrier immediately after check_trusted_goal_prefixes,
        swap ledger/goals to a target-bearing symlink or initialized gitlink,
        resume main, and assert no target marker is opened. If concurrency is
        out of scope, state that assumption in the narrow claim.
    - id: RISK-ARBITRARY-DESCENDANT-GITLINK
      status: accepted_scope_boundary
      rationale: >-
        The exact-prefix parser intentionally counts any ordinary descendant
        entry and does not reject a mode-160000 entry deeper than ledger/goals.
        A worked descendant gitlink at
        ledger/goals/GOAL-BASE-001/vendor produced no protected-prefix error.
      claim_effect: >-
        This is not a contradiction because the producer explicitly excludes
        arbitrary descendant gitlink protection beyond existing rules. It must
        remain explicit in every successor claim.
      cheapest_falsification_control: >-
        Retain a negative-scope test proving the exact-prefix guard accepts the
        descendant case, alongside a separate test for whichever downstream
        traversal rule is intended to govern initialized descendant gitlinks.
    - id: RISK-NONUTF8-GIT-PATH-DECODE
      status: untested_robustness_risk
      rationale: >-
        bound_git uses text=True and then parses NUL-delimited Git output. A
        non-UTF-8 tracked descendant could raise UnicodeDecodeError rather than
        produce the structured indeterminate-metadata error. Such a crash is
        still before target traversal but is not the documented fail-closed
        diagnostic path.
      cheapest_falsification_control: >-
        Add a byte-oriented index entry with an invalid UTF-8 descendant name
        under ledger/goals and require a controlled rejection with no target
        access; alternatively parse stdout as bytes.

  worked_attacks:
    - id: RT-A1-HEAD-GITLINK-GOALS
      setup: raw HEAD exact ledger/goals mode 160000; actual index restored to one ordinary descendant; initialized target contains both GOAL sentinels and malformed YAML.
      expected: reject raw HEAD and do not read target.
      actual: exact Git HEAD tree gitlink mode 160000 rejected; neither ID registered; malformed YAML not read.
      disposition: holds_absent_replace_objects
    - id: RT-A2-HEAD-GITLINK-LEDGER
      setup: raw HEAD exact ledger mode 160000; actual index restored to one ordinary descendant; initialized target contains both sentinels and malformed YAML.
      expected: reject raw HEAD and do not read target.
      actual: exact Git HEAD tree gitlink mode 160000 rejected; neither ID registered; malformed YAML not read.
