counterexample_or_mutation: >-
  Replace ledger/goals or ledger in HEAD and the index with a mode-160000
  gitlink, then materialize its worktree path as an ordinary directory carrying
  GOAL-HIDDEN-a1b2c3. Merge hygiene rejects the Git object, but
  validate_ledger's filesystem-only guard accepts the directory and registers
  and reads the hidden goal.

baseline_comparison: >-
  Relative to the predecessor snapshot, the repair genuinely closes B2 for
  mode-120000 prefix aliases and closes N4 without breaking the exercised
  regular path. Relative to the required plain-source invariant, it remains
  incomplete because the whole-ledger consumer conflates a gitlink checkout
  directory with a canonical mode-040000 tree. This is infrastructure source
  validation; Pollard-rho, BSGS, and specialized ECDLP baselines are not
  applicable.

heuristic_challenges: []
cost_model_challenges: []
reduction_and_scope_challenges:
  - >-
    Do not compose the merge-hygiene rejection into a claim that every
    accepting consumer validates Git object kind independently. The supported
    end-to-end admission statement and the unsupported whole-ledger standalone
    statement are distinct.
  - >-
    Do not describe an independently tracked internal target inode as literally
    unread; describe the enforced property as no traversal through the alias
    and no access to target-only objects.
proof_architecture_challenges:
  - attack: nearby_object_gitlink_checkout
    result: breaks
    detail: >-
      Hold the visible worktree type and hidden goal bytes fixed while changing
      only the committed/index source object from tree mode 040000 to gitlink
      mode 160000. Merge hygiene distinguishes the objects; whole-ledger
      validation does not. The missing separator is Git object kind in the
      whole-ledger pre-read guard.
  - attack: observation_fiber_internal_target
    result: inconclusive_for_literal_inode_nonaccess_but_holds_for_alias_nontraversal
    detail: >-
      The same inode may be read through an independently tracked candidate
      path even though it is never traversed through ledger/goals. Source-path
      identity, not inode identity, is the relevant separator for the unrelated
      marker scan.

residual_risks:
  - risk: time_of_check_to_time_of_use_swap
    boundary: >-
      The lstat checks and later scandir/open operations are path-based rather
      than descriptor-relative and atomic. A concurrent local process able to
      mutate the worktree could swap an ordinary directory after the guard.
    severity: residual_outside_declared_static_candidate_state_tests
    cheapest_falsification_control: >-
      Insert a deterministic hook after the prefix check that swaps the
      directory to an external symlink before goal discovery; decide whether
      hostile concurrent worktree mutation belongs in the threat model. If it
      does, use descriptor-relative non-following opens or revalidate at use.
  - risk: probabilistic_24_bit_suffix_collision
    boundary: >-
      Random allocation reduces but does not make collisions impossible, and
      this task does not change cross-ref visibility.
    severity: retained_known_residual
    cheapest_falsification_control: >-
      Require the printed --check step immediately before authoring and retain
      cross-branch merge-hygiene comparison against current remote refs.
  - risk: untracked_paths_before_add
