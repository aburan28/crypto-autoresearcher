    staged-index, tracked-worktree, and absolute-tree ledger and ledger/goals
    symlink aliases that motivated B2; rejects regular, missing, and FIFO
    protected components; prevents external target-only valid, legacy, random,
    and malformed sentinels from being opened or registered; closes repeated
