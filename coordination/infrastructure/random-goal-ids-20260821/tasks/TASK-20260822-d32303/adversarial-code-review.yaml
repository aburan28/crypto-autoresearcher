    rejection and all retained controls.

blocking_objections:
  - id: B2-GITLINK
    title: Whole-ledger validation treats a forbidden Git gitlink checkout as an ordinary source directory
    severity: blocking_for_claimed_B2_closure_and_coordinator_merge_decision
    affected_claims:
      - Every promised candidate state establishes Git mode 040000 before traversal.
      - Whole-ledger validation independently rejects every forbidden trusted-prefix object type.
      - The ledger and ledger/goals prefixes are repository-owned ordinary directories in every accepting consumer.
      - Target-only goal records cannot be interpreted from a noncanonical Git source object.
    mechanism: >-
      Merge hygiene correctly asks Git for the committed and staged mode and
      accepts only conceptual mode 040000. Whole-ledger validation does not.
      Its guard applies os.lstat to ledger and ledger/goals and accepts any
      stat.S_ISDIR result. A checked-out mode-160000 gitlink is represented in
      the worktree as an ordinary directory, so that guard succeeds. The
      validator then calls load_goal_documents, scandirs the directory, opens
      goal.yaml or flat YAML heads, registers their IDs, and reads their fields.
      This creates exactly the source-kind disagreement the predecessor Red
      Team's mode-160000 control was intended to expose.
    immutable_snapshot_evidence:
      - file: tools/check_merge_hygiene.py
        lines: 152-195
        observation: >-
          _tree_mode and _index_mode preserve exact Git modes; only 040000 is
          described as an ordinary directory and all other modes are
          non-directory Git modes.
      - file: tools/check_merge_hygiene.py
        lines: 198-239
        observation: >-
          The committed HEAD and staged-index loops reject any trusted-prefix
          mode other than 040000 before later ledger reads.
      - file: tools/validate_ledger.py
        lines: 1446-1466
        observation: >-
          The whole-ledger trusted-prefix guard uses only os.lstat and accepts
          stat.S_ISDIR without consulting committed or staged Git mode.
      - file: tools/validate_ledger.py
        lines: 1370-1443
        observation: >-
          After the filesystem-only guard, load_goal_documents uses scandir and
          load_yaml on flat and sharded goal heads beneath ledger/goals.
      - file: tools/validate_ledger.py
        lines: 1494-1507
        observation: >-
          check_goals invokes that guard and then registers every discovered
          goal; it has no intervening Git-object-kind check.
      - file: tools/validate_ledger.py
        lines: 1633-1643
        observation: >-
          main correctly runs the guard before inventories, but the guard's
          filesystem predicate is insufficient for a gitlink checkout.
    ledger_goals_gitlink_reproducer:
      setup:
        - Initialize a repository with ordinary ledger/goals/GOAL-BASE-001.yaml and tag it base-tree.
        - Replace ledger/goals in HEAD and the index with mode 160000 using git update-index --cacheinfo.
        - Materialize the worktree path as an ordinary directory containing GOAL-HIDDEN-a1b2c3.yaml with objective GITLINK_TARGET_INTERPRETED.
      exact_index_entry: '160000 e7267add188c36b3b9657d821b8a75c5962d4c34 0 ledger/goals'
      merge_hygiene:
        command: python3 tools/check_merge_hygiene.py --base base-tree
        exit_code: 1
        observed: rejected as non-directory Git mode 160000
      whole_ledger_validation:
        command: >-
          Invoke immutable validate_ledger.main against the fixture with only
          unrelated corpus loaders isolated to empty fixture state; capture the
          real check_goals context.
        exit_code: 0
        trusted_prefix_errors: []
        hidden_goal_registered: true
        target_sentinel_read: GITLINK_TARGET_INTERPRETED
    ledger_ancestor_gitlink_variant:
      setup: >-
        Replace ledger itself with mode 160000, materialize an ordinary
        ledger/goals checkout directory, and place a hidden random-suffix goal
        below it.
      exact_index_entry: '160000 642366a5489f073448d88fc4a0305a3987f8ae96 0 ledger'
      merge_hygiene_exit_code: 1
      merge_hygiene_160000_error: true
      validator_trusted_prefix_errors: []
      validator_hidden_goal_registered: true
      validator_target_sentinel_read: LEDGER_GITLINK_INTERPRETED
    why_blocking: >-
      The composed merge-hygiene admission path is safe for these fixtures, but
      the frozen objective and completion gates claim independent trusted-prefix
      object validation in whole-ledger validation, not reliance on another
      command having run first. Mode 160000 was also an explicit retained
      adversarial control in the cited predecessor report. Accepting and parsing
      a forbidden gitlink checkout therefore leaves B2 open at a named consumer.
    cheapest_falsification_control: >-
      Add one isolated fixture for each protected prefix whose HEAD and index
      entry is mode 160000 while the worktree path is an ordinary directory
      containing a valid hidden goal and a malformed target-only YAML sentinel.
      Run validate_ledger.main directly and require exit 1, an explicit
      non-040000 trusted-prefix error, no hidden ID in the captured context, and
      no sentinel parse error. Replay the same fixtures staged-only with a later
      ordinary worktree representation.
    cheapest_fix: >-
      Make validate_ledger's pre-inventory guard establish the committed and
      staged mode for ledger and ledger/goals just as merge hygiene does, and
      accept only conceptual 040000. If whole-ledger validation is intentionally
      supported outside a Git checkout, specify and test a fail-closed or
      explicitly reduced-mode contract instead of silently treating lstat
      directory as proof of repository ownership.
    resolution_gate:
      - Both ledger and ledger/goals mode-160000 fixtures produce an explicit whole-ledger trusted-prefix error.
      - Neither hidden valid goal nor malformed sentinel is opened, parsed, or registered.
      - Committed, staged-only, and staged-index/later-worktree-divergence forms are pinned.
      - Merge hygiene retains its current 160000 rejection.
      - Ordinary directories, legacy goals, random goals, and flat-to-sharded migration still pass.

nonblocking_objections:
  - id: B2-SCOPE-WORDING
    title: Literal target-access absence is too broad for an internal target that is independently tracked
    severity: nonblocking_reporting_scope
    evidence:
      - file: tools/check_merge_hygiene.py
        lines: 364-380
        observation: >-
          check_markers intentionally opens every candidate text path in its
          scoped list.
      - file: tools/check_merge_hygiene.py
        lines: 541-555
        observation: >-
          On an invalid trusted prefix, only ledger paths are removed. A
          separately tracked internal target below prefix-fixtures remains an
          ordinary changed path and is still checked for conflict markers.
      - fixture: internal target independently tracked at prefix-fixtures/ledger-goals/marker.txt
        result: >-
          Merge hygiene rejected the alias and also named the independent
          target path in its unresolved-conflict-marker finding, proving that
          path was read through its own candidate identity rather than through
          ledger/goals.
    boundary: >-
      This is not an alias traversal or hidden-goal registration bypass. The
      external target-only tripwire recorded zero open or scandir attempts, and
      suppressing checks on independently changed files would weaken unrelated
      merge hygiene. The overstatement is the producer report's unqualified
      target_access absent phrase; the defensible property is that a forbidden
      target is never accessed through the protected alias, and that a
      target-only object is not accessed at all.
    cheapest_falsification_control: >-
      Keep the external target-only open/scandir tripwire for literal nonaccess,
      and add a separate internal-target test that expects the ordinary changed
      path to receive normal conflict-marker checking while asserting that no
      goal is discovered through the alias.
    cheapest_fix: >-
      Narrow report and diagnostic language to distinguish no alias traversal
      from no access to the same inode through an independently tracked path.

