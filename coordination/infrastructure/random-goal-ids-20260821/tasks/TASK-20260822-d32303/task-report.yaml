cheapest_falsification_controls:
  B2_GITLINK: >-
    Add one direct whole-ledger fixture per protected prefix with HEAD and index
    mode 160000, an ordinary worktree directory, a valid hidden goal, and a
    malformed target-only sentinel. Require an explicit non-040000 prefix
    error, no hidden registration, and no sentinel parse before any inventory.
    Repeat staged-only with a later ordinary worktree representation.
  B2_SCOPE_WORDING: >-
    Keep the external target-only open/scandir tripwire for literal nonaccess,
    and separately require normal conflict-marker checking for an independently
    tracked internal target while asserting no discovery through the alias.
  time_of_check_to_time_of_use: >-
    Add a deterministic post-guard hook that swaps an ordinary directory to an
    external alias before discovery; either declare concurrent mutation out of
    scope or move to descriptor-relative non-following access.
  random_suffix_collision: >-
    Keep the required --check immediately before authoring and compare current
    remote refs during merge hygiene; a 24-bit random suffix is probabilistic,
    not collision-free.
  untracked_before_add: >-
    Preserve the paired untracked-before-add acceptance and same-path-after-add
    rejection test, and keep pre-add paths outside the protection claim.

