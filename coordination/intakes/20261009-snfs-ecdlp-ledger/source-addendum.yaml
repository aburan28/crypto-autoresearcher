# Addendum to the hypothesis ledger SNFS-ECDLP-LEDGER-2026-10-09.
# Origin: chat session 2026-10-09, follow-up question "other angles for SNFS-style
# exploitation of special prime structure, informed by how the SNFS for 2^c +/- 1 was
# realized (Cunningham project)". Four records, G1-G4, same field vocabulary as the
# source ledger; the intake notes of source.yaml apply unchanged. Authored by the
# intake session from the user's question; no idea-generator run.

batch:
  provisional_id: SNFS-ECDLP-LEDGER-2026-10-09
  addendum: G
  record_count: 4
  priority_order_addendum: [SNFS-G1, SNFS-G2, SNFS-G3, SNFS-G4]
  dependency_notes:
    - G1 and G3 extend F1 (number-field lifts); G1 reuses the EXP-ECDLP-3e8403 degree ladder as its sibling null
    - G2 extends B4 and EXP-ECDLP-6dacdb with the exact k in {1, 2, 3, 4} conditions over Mersenne primes; its (d) part is the B4 (b) measurement at p = 2^521 - 1
    - G4 is a second control arm for A4 and reuses the A1 harness

records:

  - provisional_id: SNFS-G1
    title: Cyclotomic lift with complete splitting - one K-point gives phi(c) residues and a free Galois trace relation
    lane: [ecdlp]
    status: negative-control (quantitative; alive only if the relation yield ratio reaches 1 or the covering exponent grows with the degree beyond the random-field null)
    mechanism: >-
      For p = 2^c - 1 with c prime, ord_p(2) = c, so p = 1 mod c and p splits completely in Q(zeta_c); F_p is
      Z[zeta_c]/P_i for each of the phi(c) primes P_i above p, i.e. F_p is a quotient of the group ring Z[C_c] via
      x -> 2, which is the ring the Cunningham SNFS exploited (2^c - 1 = prod_{d | c} Phi_d(2)). Lift E to a subfield
      K of Q(zeta_c) of degree d dividing c - 1; p still splits completely, a K-point P reduces to d points
      P_i = P mod P_i of E(F_p), and the Galois trace gives sum_i P_i = Tr_{K/Q}(P) mod p with Tr(P) in E(Q). With E(Q)
      finite this is one free linear relation among d factor-base residues per small K-point; index calculus needs
      at least one relation per residue, and the canonical-height obstruction says small K-points are rare.
    hypothesis: >-
      (i) the relation yield ratio R(H) = #trace relations from K-points of height <= H divided by #distinct residues
      they produce stays below 1 and decreases in H, as on a random field of the same degree and discriminant in
      which p splits completely; (ii) the covering exponent of E(F_p) residues against enumeration work does not grow
      with d beyond the random-field null; (iii) rank E(K) - rank E(Q) matches matched random fields. Alive if
      R(H) >= 1 at some H with the random-field control below 1, or the covering exponent exceeds the null by > 0.2
      across >= 3 primes.
    experiment:
      - Toy Mersenne primes p = 2^c - 1 for c in {13, 17, 19, 31}; curves E/Q of rank 0 from small-conductor tables with good reduction at p, so Tr(P) is torsion.
      - Subfields K of Q(zeta_c) of degree d dividing c - 1 with d <= 12; descent over K (Sage / Magma) or point search to height H; reduce at every prime above p.
      - Count distinct residues, trace relations, R(H), covering exponent, rank gain, smallest non-torsion height.
      - Random-field control at every (p, d) with three fields of the same degree and similar discriminant in which p splits completely (found by search), same curves.
    measurements:
      - "relation yield ratio R(H) vs H and d"
      - "covering exponent gamma vs d, special vs random field"
      - "rank gain vs d"
      - "min non-torsion height / log p"
    controls: random number fields of the same degree in which p splits completely; the EXP-ECDLP-3e8403 Q(c^(1/d)) ladder as the sibling null; rank-0 E so the trace lands in torsion
    stopping_rule: 4 primes x all subfields with d <= 12, plus 3 random fields per (prime, d)
    cost_estimate_cpu_hours: 40-120
    assumptions: descent over fields of degree <= 12 is feasible at toy conductor; complete splitting is checked per prime and is the whole point
    sources: [Lenstra-Lenstra 1993 The development of the number field sieve, Aoki-Franke-Kleinjung-Lenstra-Osvik 2007 kilobit SNFS, Washington Introduction to Cyclotomic Fields, Silverman SAC 2008 Lifting and elliptic curve discrete logarithms, Jacobson-Koblitz-Silverman-Stein-Teske 2000, Mazur 1972 rational points in towers of number fields]
    novelty: medium; the trace-relation yield ratio over completely split cyclotomic lifts is not in the literature; the height obstruction it must beat is
    claim_boundary: a yield ratio >= 1 at toy p is a finite control until it reproduces across c and against the random-field control

  - provisional_id: SNFS-G2
    title: Embedding degree over a Mersenne prime - k = 2 is impossible and k in {1, 3, 4} are Cunningham / Aurifeuillean conditions on l
    lane: [ecdlp]
    status: theorem-closed-control with a census and one reusable public-parameter computation
    mechanism: >-
      For p = 2^c - 1 the embedding degree k of an odd prime l | #E is the least k with
      l | Phi_k(p), and Phi_1(p) = 2 (2^(c-1) - 1), Phi_2(p) = 2^c, Phi_3(p) = 2^(2c) - 2^c + 1 =
      Phi_6(2^c), Phi_4(p) = 2 (2^(2c-1) - 2^c + 1) with (2^(2c-1) - 2^c + 1)(2^(2c-1) + 2^c + 1) =
      2^(4c-2) + 1 (Aurifeuille). So: k = 1 iff ord_l(2) | c - 1; k = 2 is impossible for odd l;
      k = 3 iff ord_l(2^c) = 6; k = 4 iff l divides the Aurifeuillean factor 2^(2c-1) - 2^c + 1,
      so ord_l(2) | 8c - 4. Beyond k = 4 no cyclotomic-in-2 condition exists (Phi_6(p) =
      2^(2c) - 3 2^c + 3 already has none). CORRECTED AT DESIGN TIME: the first filing stated
      k(l) = ord_l(2)/gcd(ord_l(2), c), which is false because p is 2^c - 1, not 2^c, modulo l;
      the design-session smoke test's identity control caught it (H-ECDLP-281dd6). The
      multiplicative side is the mirror image: p + 1 = 2^c is fully
      smooth and F_p^* has a degree-5 SNFS polynomial at p = 2^521 - 1 (16 p = (2^105)^5 - 16). For generalized
      Mersenne p = 2^a - 2^b - 1, p + 1 = 2^b (2^(a-b) - 1), so k = 2 needs l dividing 2^(a-b) - 1. The curve side
      is therefore slightly MORE protected against pairing transfer than a random prime in exactly this sense,
      while F_p^* and F_(p^2)^* are more exposed.
    hypothesis: >-
      (a) over random prime-order curves over Mersenne p the distribution of k equals the
      Balasubramanian-Koblitz null except for the exact conditions on k in {1, 2, 3, 4} (k = 2 absent;
      k = 1, 3, 4 exactly when the Cunningham / Aurifeuillean conditions hold); (b) the fraction of curve orders with a prime factor l with ord_l(2) <= 10^4
      matches the density predicted from the factors of 2^d - 1, d <= 10^4; (c) for P-521 ord_l(p) > 10^6 by direct exponentiation and k is not in {1, 2, 3, 4} by the four
      exact conditions evaluated modulo l, and for P-192, P-224, P-256 ord_l(p) > 10^6 likewise; (d) the special pair for F_p^* at p = 2^521 - 1 beats a budgeted GNFS polyselect
      in Murphy-E by a large factor, as B4 (b) predicts for 2^255 - 19.
    experiment:
      - (a) 10^4 random curves over each of 2^31 - 1, 2^61 - 1, 2^89 - 1, 2^127 - 1 and over matched random primes; k of the large prime factor l via ord_l(p); ord_l(2) recorded on the Mersenne arm; KS test with k = 2 removed and the exact k = 2 count reported per arm.
      - (b) census of l with ord_l(2) <= 10^4 against the Cunningham-density prediction.
      - (c) one direct-exponentiation lower bound per public curve (P-521, P-192, P-224, P-256) plus the four exact conditions for P-521; public parameters only, no secret scalar; exact k only where l - 1 factors.
      - (d) CADO-NFS polyselect with a fixed 24 CPU-h budget for p = 2^521 - 1 against the special pair (x^5 - 16, x - 2^105); Murphy-E and norm sizes; no sieving.
    measurements:
      - "KS statistic for k distributions with k = 2 removed"
      - "exact k = 2 count per arm (expect 0 on Mersenne, > 0 on random) and violations of the k in {1, 3, 4} conditions (expect 0)"
      - "ord_l(2) <= 10^4 census vs prediction"
      - "k lower bound per public curve"
      - "Murphy-E ratio special / GNFS at 2^521 - 1"
    controls: matched random primes; BN254 as the positive small-k case; the k = 2 count on the random arm
    stopping_rule: 4 Mersenne primes x 10^4 curves; one computation per public curve; no sieving under any circumstances
    cost_estimate_cpu_hours: 10-30
    assumptions: the Balasubramanian-Koblitz random model is the right null; a lower bound by direct exponentiation is reported as a bound, never as the exact k
    sources: [Balasubramanian-Koblitz 1998, Menezes-Okamoto-Vanstone 1993, Brent-Montgomery-te Riele Cunningham tables, Granger-Scott 2015 Faster ECC over 2^521 - 1, Aoki-Franke-Kleinjung-Lenstra-Osvik 2007 kilobit SNFS, Solinas 1999 generalized Mersenne numbers]
    novelty: low; the four conditions are elementary; the census, the exact k = 2 exclusion and the P-521 bound are reusable facts
    claim_boundary: (c) and (d) concern public parameters and F_p^*, never a key; "more protected" is a statement about k = 2 and the k in {1, 3, 4} conditions only; k >= 5 is unconstrained
    reuse: EXP-ECDLP-6dacdb census code and shared prime generator

  - provisional_id: SNFS-G3
    title: Solinas number fields - does small root discriminant of K_f = Q[t]/(f) give E(K_f) anything a random field lacks?
    lane: [ecdlp]
    status: negative-control
    mechanism: >-
      Generalized Mersenne primes are p = f(2^k) for a low-weight f (P-192: t^3 - t - 1 at 2^64; P-224: t^7 - t^3 + 1
      at 2^32; P-256: t^8 - t^7 + t^6 + t^3 - 1 at 2^32; P-384: t^12 - t^4 - t^3 + t - 1 at 2^32). K_f = Q[t]/(f)
      has small discriminant and a degree-one prime of norm p (t -> 2^k): it is the SNFS field for F_p^*. Small root
      discriminant means unusually many algebraic integers of small height, the resource a lift would want. The
      question is whether E(K_f) inherits anything (rank, height of new points, residues covered) relative to a random
      field of the same degree and coefficient size. F1 is the special case f = t^d - c.
    hypothesis: >-
      Over toy analogues p = f(2^k) prime with the four NIST f shapes and random low-weight f, rank E(K_f) - rank E(Q),
      the minimal new-point height divided by log p, and coverage of E(F_p) by K_f-points of height <= 20 log p all
      match random f of the same degree and coefficient bound within sampling error, and coverage is uncorrelated
      with the root discriminant of K_f. Alive if the coverage exponent on Solinas f exceeds the random-f null by
      > 0.2 across >= 3 primes.
    experiment:
      - Toy primes f(2^k) for k in 4..12 with the four NIST f shapes, plus 20 random f per degree with coefficients in {-1, 0, 1}.
      - Descent over K_f (degree 3..12) for 5 curves per prime; heights; residues at the degree-one prime; root discriminant and class number of K_f recorded.
      - Regress coverage on root discriminant across all fields.
    measurements:
      - "rank gain over Q"
      - "min new-point height / log p"
      - "coverage of E(F_p)"
      - "root discriminant of K_f vs random f"
      - "correlation of coverage with root discriminant"
    controls: random f of the same degree and weight; the F1 Q(c^(1/d)) arm; Q itself (d = 1)
    stopping_rule: 4 f shapes x 5 primes x 5 curves plus 20 random f per degree
    cost_estimate_cpu_hours: 50-150
    assumptions: descent over degree <= 12 fields is feasible at toy conductor; toy f(2^k) primes model the deployed shapes for rank and height statistics
    sources: [Solinas 1999 generalized Mersenne numbers, Silverman AEC, Huang-Kueh-Tan 2000, Jacobson-Koblitz-Silverman-Stein-Teske 2000, this session]
    novelty: low; generalizes F1 to arbitrary low-weight f; the root-discriminant correlation is the only new quantity
    claim_boundary: public f only; toy primes; no deployed curve is lifted

  - provisional_id: SNFS-G4
    title: Rotation-class factor base control - multiplication by 2 is a bit rotation for Mersenne p and acts on nothing in E
    lane: [ecdlp]
    status: negative-control (second control arm for A4)
    mechanism: >-
      For p = 2^c - 1, F_p = Z[x]/(x^c - 1, p) with x -> 2, and multiplication by 2 is a cyclic rotation of the
      c-bit representation: a cost-free Z/c action on coordinates. The scaling (x, y) -> (2x, 2^(3/2) y) maps E_(a,b)
      to the isomorphic E_(4a,8b) and the isomorphism back is the inverse scaling, so the action composes to the
      identity on E and respects nothing of the group law (HEUR-002 of H-ECDLP-bd1572). The factor base
      D_rot = {P : rotation-minimal representative of x(P) < 2^(c - m)} has size about p / 2^m and is a cheaply
      decidable candidate; the expected closure ratio is 1.
    hypothesis: >-
      Pr[P + Q in D_rot | P, Q in D_rot] = |D_rot| / p within sampling error for m in {1, 2, 4, 8}, and the fraction of
      random targets decomposing over D_rot x D_rot equals the random-subset value; no gain at any (c, m).
    experiment:
      - p = 2^c - 1 for c in {13, 17, 19, 31, 61}; m in {1, 2, 4, 8}; 10^6 sampled pairs; closure ratio.
      - Decomposition fraction by S_3 root counting, exhaustive at c <= 31 and sampled at c = 61.
      - Controls at every cell: random subset of the same size; the A4 digit-graded base; a random prime of the same bit length with a size-based base of the same density.
    measurements:
      - "closure ratio (observed / expected, expect 1.00 +/- 0.01)"
      - "decomposition fraction ratio vs random subset"
      - "membership-test cost"
    controls: random subset of the same size; A4 digit-graded base; random prime with a size-based base of the same density
    stopping_rule: 5 c x 4 m, one run each
    cost_estimate_cpu_hours: 3
    assumptions: the rotation-minimal representative is a canonical orbit label computable in O(c)
    sources: [Granger-Scott 2015 Faster ECC over 2^521 - 1, this session]
    novelty: none as a mechanism (expected negative); recorded so the intuition has a number
    claim_boundary: a control; cannot be promoted
    reuse: A1 / A4 harness
