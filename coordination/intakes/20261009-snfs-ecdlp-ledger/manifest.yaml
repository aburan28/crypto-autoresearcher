    SNFS-G1: 'cyclotomic lift with complete splitting: Galois multiplier and trace relation (extends F1)'
    SNFS-G2: 'embedding degree over Mersenne p as ord_l(2)/gcd(ord_l(2), c): k = 2 exclusion, Cunningham census,
