id: LEAD-RHO-cheon-aux-acquisition
family: generic
title: Run Cheon's auxiliary-input algorithm on ordinary ECDLP by generating [x^d]P yourself
mechanism: >-
  Cheon recovers x from P, [x]P, [x^d]P in ~sqrt(r/d) + sqrt(d) when d | r-1 (or r+1). If
  the attacker could produce [x^d]P from (P, [x]P) cheaply, ordinary ECDLP would fall to ~r^{1/4}
  on curves with a good divisor.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Generic scope: from (P, [x]P) a generic algorithm can only form linear combinations [a
    + bx]P; [x^2]P is outside that span, and computing it is the square-DH problem, which
    has the same Omega(sqrt r) generic lower bound as DH (Shoup). Producing [x^d]P therefore
    costs rho-scale work, which DEC-20260802-204 records as the acquisition gate (APR-206
    classified as Cheon prior art). Scope: generic algorithms on any curve; non-generic acquisition
    is not excluded.
  revisit_when: >-
    A non-generic (representation-using) way to compute [x^2]P from [x]P below sqrt(r), or
    a protocol that releases powers (LEAD-RHO-cheon-deployed-applicability).
evidence:
- repo: crypto-autoresearcher
  path: ledger/decisions/DEC-20260802-204.yaml
  note: acquisition gate; Cheon prior art; no ordinary-ECDLP improvement
- repo: crypto-autoresearcher
  path: ledger/hypotheses/H-AUXIN-269efd.yaml
  note: Stage 0 generic-span identity {1,x} excludes x^2
- repo: crypto-autoresearcher
  path: knowledge/literature/KN-LIT-6736.md
  note: Cheon auxiliary-input DLP solved at 160 bits
