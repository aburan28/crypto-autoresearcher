id: LEAD-RHO-batched-inversion-shared-pm
family: generic
title: >-
  Batched affine steps: Montgomery simultaneous inversion and the free x(P-Q) beside x(P+Q)
mechanism: >-
  Montgomery's trick replaces n inversions by one plus about 3(n-1) multiplications, and x(P-Q)
  shares the slope denominator of x(P+Q). Both make affine parallel rho cheap per step.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Known (KR-RHO-cb1c58, KR-RHO-fbd582) and reproduced: batch inversion proved correct in
    Lean (rho_assurance); GPU NIST W-sweep 1.52x/2.61x cumulative with by-reference inversion;
    plain-step cost falls with batch size (179 ns at 1024 walks on P-256). The remaining use
    of the free P-Q is the best-of lead.
  revisit_when: An inversion-free step cheaper than 1I/n + 3M per walk.
best_measured: P-256 plain step 179 ns at 1024 walks/inversion (CPU); GPU W=32 1.632 B it/s
  P-256
