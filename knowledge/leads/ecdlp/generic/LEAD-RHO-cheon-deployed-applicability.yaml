id: LEAD-RHO-cheon-deployed-applicability
family: generic
title: >-
  Where Cheon stops on deployed parameters: exact r+-1 divisor census times priced auxiliary
  supply
mechanism: >-
  With the divisor lattices of r-1 and r+1 for standardized orders, E(r) = min_d log(sqrt((r+-1)/d)
  + sqrt(d))/log r says how far Cheon could go; a typed supply roster (powers-of-tau SRS,
  q-SDH and VRF query channels) says which degree d any protocol actually releases.
disposition: open_blocked
next_action:
  step: >-
    Approve a revised protocol for the typed quantity of H-AUXIN-6db354 (per-branch, supply-capped
    E(r)), then join the completed census (RUN-AUXIN-fd1edc) with the supply roster of IDEA-20260930-68326c
    under a cap on released powers.
  discriminates: >-
    A row with E(r) <= 0.40 at a degree some protocol releases is a named protocol-conditional
    weakness; no such row confirms Cheon is inert at deployed supply. Neither moves ordinary
    ECDLP.
  blocked_by: >-
    DEC-20260923-a4c3d5 refused AMD-EXP-AUXIN-7e2e3d-20260923-d1d10; H-AUXIN-6db354 is approved
    only with a future revised protocol
best_measured: >-
  census RUN-AUXIN-fd1edc: P-256 and secp256k1 E(r) ~ 0.254 at d ~ 2^128 (r-1), P-224 0.394
  (r+1), P-521 E_bound 0.452; values need d-degree supply, not a vulnerability
