id: LEAD-RHO-grumpy-store-all-schedules
family: generic
title: >-
  Exact average-case constant of store-all generic schedules (grumpy giants, compiled tiered
  walks)
mechanism: >-
  Two grumpy giants and a baby (and adaptive or compiled store-everything schedules) solve
  more targets per operation than BSGS or a random walk (0.71875 vs 0.6753 at 1.5 sqrt l).
  Theorem A makes the solved set target-independent, so the mean is an exact integer ratio.
disposition: open_next_step
next_action:
  step: >-
    Run EXP-GRUMPY-eb8675 (certified exhaustive ladder, Z/l from 2^10 to 2^20, covered-set
    counter against per-target simulation, negation map as a separate arm) and file the evidence
    record for EXP-GRUMPY-cd7b82's Stage 1.
  discriminates: >-
    A certified constant below bsgs.negation's 1.10x floor (per-op) would be a new ops leader
    for store-all schedules at toy scale; it cannot beat rho at cryptographic size because
    memory stays Theta(sqrt l) (LEAD-RHO-bsgs-family-memory).
best_measured: >-
  EXP-GRUMPY-cd7b82 Stage 1 O-SUPPORT-M12 at l = 101, 257 (envelope >= covered set); compiled
  tiered walk 0.45% below unguided at 2^16
