id: LEAD-RHO-bsgs-family-memory
family: generic
title: >-
  Baby-step giant-step family (textbook, interleaved, negation, paired, signed-Frobenius claw)
mechanism: >-
  BSGS variants reach low operation counts (with negation 1.10x the floor at toy size) by
  storing Theta(sqrt r) points; the claw pair table is a randomised BSGS on signed Frobenius
  classes.
disposition: closed_known
obstruction:
  kind: cost_model
  statement: >-
    Known (KN-LIT-732e36, KN-LIT-2135) and reproduced: bsgs.negation is the prime-toy ops
    leader at 1.100 [0.978, 1.225] x sqrt(pi/4) but needs 0.50 sqrt(r) table entries (rho
    0.034); at log2 r = 256 that is 2^127 entries, so rho with DPs dominates at every cryptographic
    size (KR-RHO-7d93f6). claw.pair_table costs (c + 1/c)/sqrt(n) >= 2/sqrt(n), i.e. >= 2.26x
    sqrt(pi/4n) rho: measured 2.20x [1.90, 2.55] strong rho at its best shape.
  revisit_when: >-
    A BSGS-type schedule with o(sqrt r) memory and BSGS-level operations (would contradict
    KR-RHO-7d93f6).
best_measured: >-
  bsgs.negation 1.100 [0.978, 1.225] x sqrt(pi/4), memory 0.502 sqrt(r), prime toy (ECBND1he8163c29cc39)
evidence:
- repo: crypto
  path: docs/bounds/FRONTIER.md
  note: 'sealed frontier ECFR1h8b45b672c283: ops x floor sqrt(pi/2A), memory, alpha per method'
- repo: crypto
  path: research/ecbench_pair_claw_20261003/README.md
  note: claw = randomised BSGS, 2.20x strong rho
- repo: crypto
  path: research/generic_dlp_memory_parallelism_20261017/README.md
  note: BSGS paired 1.74-1.98x wall, counted outputs identical
- repo: crypto
