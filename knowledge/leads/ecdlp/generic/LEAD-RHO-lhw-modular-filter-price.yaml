id: LEAD-RHO-lhw-modular-filter-price
family: generic
title: Residue-guess price of modular (mod-M) representation filters in prime-order groups
mechanism: >-
  Subset-sum techniques (Schroeppel-Shamir, BCJ, Esser-May) filter partial sums by a congruence
  mod M. In a prime-order group the residue of a partial log is not visible, so each filter
  must guess it; the claim is that every algorithm of class F_M pays the multiplier G_M =
  |rho_M(W)|.
disposition: open_next_step
next_action:
  step: >-
    Run EXP-LHW-9adf78 (residue-guess price on W(m, w) with Mersenne/Fermat M) or write the
    proof obligation of H-LHW-371a91 as a checked derivation.
  discriminates: >-
    A proved G_M multiplier closes representation filters for the group LHW-DLP as closed_obstructed
    (proof); a counterexample filter is a new LHW lead.
