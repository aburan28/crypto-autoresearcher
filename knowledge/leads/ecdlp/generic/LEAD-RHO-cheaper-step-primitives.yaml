id: LEAD-RHO-cheaper-step-primitives
family: generic
title: >-
  Cheaper step primitives never measured here: tag tracing on EC, point-halving steps on binary
  curves
mechanism: >-
  Tag tracing (Cheon-Hong-Kim) decides most steps from partial information with precomputed
  tables, skipping full products; point halving can replace addition-based steps on binary
  curves (Zhang-Wang). Either would lower native cost per step without changing the counted
  constant.
disposition: open_unexamined
next_action:
  step: >-
    Port a tag-tracing r-adding walk to a 64-bit prime toy curve in research/rho_walk_leads'
    harness (ns/step paired against the plain step at 8-1024 walks/inversion, steps/collision
    with DP replay) and a halving-step walk on sect113r1-size binary curves.
  discriminates: >-
    A net ns per useful step < 0.95 opens an engineering lead for the pool and GPU kernels;
    >= 1.0 with matching steps closes each as closed_obstructed (cost_model) for affine batched
    EC walks.
