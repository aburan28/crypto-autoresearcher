id: LEAD-RHO-matched-rho-calibration
family: generic
title: 'The matched rho reference itself: finite-size bias and the missing prime medium tier'
mechanism: >-
  Every IC row and every rho variant is ranked against a matched rho reference. Toy rho bounds
  carry fixed set-up costs (fitted alpha 0.31-0.45 below 0.5), and the sealed frontier has
  a medium-tier domain for Koblitz curves only. A calibrated prime medium-tier rho bound would
  fix the denominator of every prime-field gap.
disposition: open_next_step
next_action:
  step: >-
    Seal ecbench bounds for rho.negation, rho.plain and bsgs.negation on prime curves at log2
    r 32-48 (the Koblitz medium-tier ladder's sizes), >= 24 runs per size, with replay certificates
    and the section 5a band, and fit R(N) = 1 + c/N^beta to the toy-to-medium ratio (H-ECDLP-ff38dc).
  discriminates: >-
    If medium-tier rho.negation lands within 1.10x of sqrt(pi/4) the toy excess is set-up
    and every prime gap shrinks by the toy factor; a persistent 1.3-1.5x would point to a
    real walk shortfall (reopen LEAD-RHO-negation-map-fruitless-cycles).
best_measured: >-
  prime toy rho.negation 1.453 x floor with alpha 0.398 [0.308, 0.476]; no prime medium-tier
  bound exists
