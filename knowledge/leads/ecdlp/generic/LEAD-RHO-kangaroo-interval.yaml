id: LEAD-RHO-kangaroo-interval
family: generic
title: Kangaroo / lambda (van Oorschot-Wiener, Gaudry-Schost) as a full-group ECDLP solver
mechanism: >-
  Kangaroo methods solve an interval DLP of width N in ~2 sqrt(N) and run with distinguished
  points; applied to the whole group they compete with rho.
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    On every sealed domain kangaroo.vow is dominated on ops and memory: prime toy 2.203 [1.803,
    2.527] x floor vs rho.negation 1.453; Koblitz medium 15.558 [13.742, 17.597] vs signed-Frobenius
    rho 1.188; constants match the literature (KR-RHO-898783). Scope: full-group single target;
    interval DLP is the kangaroo's own domain and is not an ECDLP improvement.
  revisit_when: A target with a known short interval or low-entropy secret (LHW leads).
dominated_by: LEAD-RHO-negation-map-fruitless-cycles
best_measured: kangaroo.vow 2.203 [1.803, 2.527] x sqrt(pi/4), prime toy (ECBND1hb4b4be548e88)
evidence:
- repo: crypto
  path: docs/bounds/FRONTIER.md
  note: 'sealed frontier ECFR1h8b45b672c283: ops x floor sqrt(pi/2A), memory, alpha per method'
known_results:
- KR-RHO-898783
forecloses:
- kangaroo for full ECDLP
- Pollard lambda constant
- four-kangaroo method
- Gaudry-Schost on the whole group
areas:
- RHO
last_reviewed: '2026-10-24'
