id: LEAD-RHO-ecc2k130-iteration-function
family: generic
title: 'ECC2K-130 iteration function: sigma walk vs v3 table walk vs class-signed sigma steps'
mechanism: >-
  The campaign walks R <- R + sigma^j(R) (injective penalty c ~ 1.07). A table walk R + eps
  sigma^k(T_h) runs 9-15% faster per update; a class-derived sign (SIGMA_SIGN=2) cuts the
  branch-probability penalty. Each change starts a new DP corpus, so the choice is made once.
disposition: open_next_step
next_action:
  step: >-
    Measure the v3 table-walk kernel's paired rate on the RTX PRO 6000 against the fused sigma-table
    control (five alternating pairs, A/A drift), plus a planted-log and re-walk gate, then
    price iterations x rate per solve for sigma, SIGMA_SIGN=2 and table-v3.
  discriminates: >-
    If table-v3 loses < 14-19% rate the switch pays (projected 0.81-0.86x cost per solve)
    and the campaign owner decides; a larger loss leaves sigma (+ optionally SIGMA_SIGN=2,
    ~0.96-0.97x) as the walk.
best_measured: >-
  SIGMA_SIGN=2: iterations 0.958-0.967 at n = 41, rate 0.9965 -> 0.961-0.970 time per solve;
  table walk projected 0.81-0.86x (unmeasured on v3 kernel)
