id: LEAD-RHO-native-step-cost
family: generic
title: 'Native cost of one rho step: canonicalisation, field arithmetic and admitted CPU timing'
mechanism: >-
  GAE counts group additions; the native step also pays class canonicalisation (Koblitz rotations,
  counted but not charged), modular reduction and branch behaviour. Cutting instructions per
  step speeds every walk without changing the counted constant.
disposition: open_next_step
next_action:
  step: >-
    Price the Koblitz canonicaliser in field-multiplication equivalents: run EXP-CERTBIN-b4d29c
    (design C canonicalising every step vs Bailey sigma walk normalising only at DPs) at n
    = 131 and the rotation-invariant polynomial key of IDEA-20261015-2d8e5a, with callgrind
    Ir (no PMU needed).
  discriminates: >-
    If canonicalisation stays > 2x the ~6-7 multiplication floor, Koblitz rho constants in
    GAE understate native cost and the section 5a band must price it; if it falls near the
    floor the GAE constant is native.
best_measured: >-
  strong rho 1,196 -> 718 instructions/step (canon2 + step3, outputs identical; floor ~6-7
  field mults); fp64 branch-free rho_parallel 98.9 -> 68.2 ns/step; ecbench rho 0.802 callgrind
  Ir
