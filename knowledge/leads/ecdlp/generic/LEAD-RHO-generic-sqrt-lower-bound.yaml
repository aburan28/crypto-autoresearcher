id: LEAD-RHO-generic-sqrt-lower-bound
family: generic
title: Beat the square-root exponent with any generic collision algorithm
mechanism: >-
  Any algorithm that uses only group operations and equality tests (rho, kangaroo, BSGS, grumpy
  giants, multi-walk, GPU variants) is a generic algorithm. If one of them could find logs
  in o(sqrt r) operations, every curve would weaken at once.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Shoup/Nechaev generic-group lower bound: any generic algorithm needs Omega(sqrt r) group
    operations for a prime-order-r group (KR-RHO-13bf67). Every lead in this family moves
    only the constant (automorphism classes divide it by sqrt|Aut|, KR-RHO-0528e7). Scope:
    all generic algorithms, any field, any r.
  revisit_when: >-
    Never for generic algorithms; only a method that reads the representation (index calculus,
    transfer) can change the exponent.
best_measured: >-
  all generic arms fit alpha <= 0.53 in FRONTIER (e.g. bsgs.negation 0.529 [0.485, 0.596],
  prime toy); no generic arm below the floor beyond CI noise
evidence:
- repo: crypto-autoresearcher
  path: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  note: generic-group lower bound row
- repo: crypto
  path: docs/bounds/FRONTIER.md
  note: 'sealed frontier ECFR1h8b45b672c283: ops x floor sqrt(pi/2A), memory, alpha per method'
