id: LEAD-RHO-r-adding-walk-mixing
family: generic
title: 'Iteration-function choice: Teske r-adding walks, mixing, hashed partitions'
mechanism: >-
  The walk constant depends on how close the iteration function is to a random mapping. r-adding
  walks with r of 16-20 are near random; a partition read from few bits or a small r costs
  extra steps.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Known (KR-RHO-cd86f5, KR-RHO-93979e) and reproduced: plain rho on 3,200 solves over whole
    26-bit volcanoes averages 659,263 +- 12,422 iterations against sqrt(pi n/2) = 654,547
    (1.007x); a precomputed pair table R_i+R_j gives 1.027 [0.982, 1.073] (no gain, one addition
    still advances one step). Scope: prime-field toy and 26-bit curves.
  revisit_when: >-
    A walk family with provable mixing strictly better than a random mapping (in-degree concentration
    is LEAD-RHO-best-of-candidates-indegree).
best_measured: plain rho 1.007x sqrt(pi n/2) over 3,200 solves at 26 bits (isogeny-volcano-rho)
evidence:
- repo: crypto
  path: benchmarks/20261016-isogeny-volcano-rho
  note: 659,263 +- 12,422 iterations vs 654,547 predicted, 3,200/3,200 correct
- repo: crypto
  path: research/rho_walk_leads_20261014/README.md
  note: lead 3 pair table 1.027 [0.982, 1.073]
