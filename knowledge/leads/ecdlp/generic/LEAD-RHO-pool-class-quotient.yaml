id: LEAD-RHO-pool-class-quotient
family: generic
title: >-
  Distributed pool v2 walk has no class quotient: add negation (sqrt 2) and Frobenius (sqrt
  2m)
mechanism: >-
  ecc-challenges' generic v2 worker walks plain rho, so a solve expects sqrt(pi n/2) steps
  on all 23 non-ECC2K-130 campaigns. A negation-map walk saves sqrt(2) on every curve and
  signed Frobenius saves sqrt(2m) on ECC2K-163/238/358; both are established and reproduced
  in crypto.
disposition: open_next_step
next_action:
  step: >-
    Implement a negation-map (and, for Koblitz entries, signed-Frobenius) v2 walk namespace
    in worker/generic/ec_core.h with fruitless-cycle escape; validate on ECCp-79 / ECC2-79
    by planted solves and DP replay, and measure steps per solve and points/s against the
    current v2 walk.
  discriminates: >-
    Steps/solve near 0.71x at <= 10% rate loss halves the remaining work on prime campaigns
    (ECC2K: ~1/sqrt(2m)); a larger rate loss on GPU (canonicalisation, cycle checks) prices
    it per backend.
best_measured: >-
  current v2 expectation sqrt(pi n/2) (no quotient); crypto rho.negation/rho.plain 0.757 at
  toy
