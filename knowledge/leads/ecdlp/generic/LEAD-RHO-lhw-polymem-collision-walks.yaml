id: LEAD-RHO-lhw-polymem-collision-walks
family: generic
title: 'Low-Hamming-weight DLP with polynomial memory: collision walks on the weight-w class'
mechanism: >-
  For a log of bit-length m and weight w, meet-in-the-middle reaches sqrt(binom(m, w)) with
  large memory; a collision walk whose states are low-weight representations (jump sums, carry-run
  mixtures, nonbacktracking lifts) could reach it with polylog memory.
disposition: open_next_step
next_action:
  step: >-
    Re-run EXP-LHW-b49bc6 Stage 1 (hash-realisable jump sums on the frozen (m, w) ladder,
    m in {20, 24}) with checkpointed sumset counts and a run length inside the claim TTL;
    score E1 vs E2.
  discriminates: >-
    E1 (Def ratio <= 2000 millirho at all T >= 64) supports a polymem walk near the MITM bound
    at toy m; E2 (>= 8000 and rising) shows the fibre deficit grows and the walk family cannot
    reach sqrt(binom(m, w)).
