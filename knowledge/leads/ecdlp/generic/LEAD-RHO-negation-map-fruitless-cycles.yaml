id: LEAD-RHO-negation-map-fruitless-cycles
family: generic
title: Negation-map rho on {+-P} classes with fruitless-cycle escape (prime curves)
mechanism: >-
  Walking on x-coordinate classes {P, -P} halves the state space and should save sqrt(2) in
  steps, but makes 2-cycles (and longer fruitless cycles) that trap walks unless an escape
  rule is used. The constant the program pays depends on the escape rule and the r-adding
  table size.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Known: the sqrt(2) gain and fruitless-cycle handling are established (KR-RHO-fb88e6).
    The program reproduced the gain: on prime toy curves (log2 r 15.7-25.3) rho.negation measures
    1.453 [1.184, 1.772] x sqrt(pi/4) against rho.plain 1.920 [1.633, 2.221] (ratio 0.757
    vs ideal 0.707); fruitless 2-cycle rate 487 per 1e6 steps against 1/(2r) = 488 (rho_walk_leads
    lead 4); collab dead trails fixed 50->1 (generic_dlp_correctness). Nothing new remains
    in the mechanism; the remaining ~7% toy shortfall is a calibration question (LEAD-RHO-matched-rho-calibration).
  revisit_when: >-
    A medium-tier (log2 r >= 32) prime rho.negation bound shows a gain over rho.plain below
    1.30 with disjoint CIs, or a new escape rule beats the literature constant.
best_measured: >-
  rho.negation 1.453 [1.184, 1.772] x sqrt(pi/4), S ~ 1.29 GAE/sqrt(r), log2 r 15.7-25.3 (ECBND1ha6fbf0c678d0)
