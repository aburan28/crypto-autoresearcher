id: LEAD-RHO-best-of-candidates-indegree
family: generic
title: Step to the better of k candidate images (best of P+R, P-R) to concentrate in-degree
mechanism: >-
  Choosing the best-scoring of k candidate images gives image points in-degree k*u^(k-1),
  so collisions arrive sqrt(k^2/(2k-1)) sooner (1.155 for k = 2). P+R and P-R share one inversion,
  so the second candidate costs about 1M+1S; the net depends on how many walks share an inversion.
disposition: open_next_step
next_action:
  step: >-
    Build best-of-P+-R into the gpu/nist kernel at W = 16-32 walks per thread with the kernel's
    own inversion and fruitless-cycle escape; paired rate and steps-to-collision against the
    shipping kernel on P-256, with DP-corpus replay. On ECC2K-130, price the best-of-two sigma
    step (emulated 0.836x iterations) against its +38% carry-less work.
  discriminates: >-
    Net cost per solve < 0.97 at W = 16-32 makes it the GPU default (a constant improvement
    on live walks); >= 1.0 closes it as closed_obstructed (cost_model) for batched GPU walks.
best_measured: >-
  steps speedup 1.129 [1.081, 1.184] under DPs (predicted 1.155); net per-step 0.95 at 1024
  walks/inversion, 1.03-1.12 predicted at 8-64
