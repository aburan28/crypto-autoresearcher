id: LEAD-RHO-prime-gpu-rho
family: generic
title: GPU rho on prime and generic binary curves with an admitted CPU/GPU comparison
mechanism: >-
  Batched affine rho on GPUs (NIST P-256/P-384 kernel, generic Certicom workers) multiplies
  walk throughput; an admitted ecbench GPU arm would put device results on the same frontier
  as CPU arms.
disposition: open_blocked
next_action:
  step: >-
    Run the gpu-match workload on a CUDA host with qualified traffic telemetry: interleaved
    CPU/GPU repeats with A/A controls, then a matched P-256 toy-to-medium ladder in ecbench.gae.
  discriminates: >-
    An admitted interval lets GPU rho rows enter FRONTIER and the pool's capacity estimates;
    without it every GPU figure stays descriptive.
  blocked_by: >-
    crypto problems/ecbench-gpu-matched-workload-contract.md (PCIe telemetry and admission
    rule missing); problems/certicom-binary-gpu-rho-integration.md
best_measured: >-
  P-256 1.632 B it/s, P-384 0.548 B it/s on one RTX PRO 6000 (W=32, descriptive); seeding
  17.4x faster
