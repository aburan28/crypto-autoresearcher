id: LEAD-ICB-large-prime-variants
family: ic-binary
title: >-
  Single and double large-prime relation collection for binary and Koblitz IC (free-leg, GTTD
  on subspace bases)
mechanism: >-
  Accept decompositions with one or two points outside the base and combine partial relations
  through cycles in a large-prime graph, trading more linear algebra for fewer full decompositions;
  in the Gaudry-Theriault-Thome-Diem setting it lowers the exponent to q^{2-2/n}. On prime-degree
  binary subspace bases the free-leg form is a birthday search in the large base.
disposition: open_next_step
next_action:
  step: >-
    Implement and run the approved Stage 0 of EXP-BINSTD-e066d8 (large-prime rows of the KN-FIND-aa2efc
    free-oracle floor), and add a 1LP/2LP arm to the compact-orbit relation stage at n = 53
    and 61 (Table C sizes where relation collection is 56-79% of S), paired against the incumbent
    in the counted unit; the orphan module large_prime_filter.rs is the starting point.
  discriminates: >-
    A counted-S ratio below 1 is a constant advance on the relation phase; Stage 0 confirming
    the free-leg birthday dominance by matched rho closes the subspace-base large-prime line
    in the enumeration oracle class.
