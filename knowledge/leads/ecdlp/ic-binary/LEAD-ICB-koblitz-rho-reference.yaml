id: LEAD-ICB-koblitz-rho-reference
family: ic-binary
title: >-
  The matched Koblitz rho reference for binary IC rows: step pricing, signed-Frobenius canonicalisation,
  a 131-bit walk
mechanism: >-
  Every gap in this family divides by a rho reference. Table A divides by rho as built (32
  lanes, 9.7-11.8 units a step) while the canonical step costs 4.6-5.4 and the IC arm gets
  the 1,024-lane batched unit; normal-basis canonicalisation makes signed-Frobenius rho 4.1x
  cheaper (cryptanalysis); and no 131-bit walk exists, so no ECC2K-130 lane has a matched
  rho. Strengthening the reference is accounting, not an IC improvement, but it fixes the
  distance remaining.
disposition: open_next_step
next_action:
  step: >-
    Re-price Table A against the canonical step and the current optimized strong rho in the
    same process (a rule v4), apply the section 5a band, and build the 131-bit signed-Frobenius
    walk (IDEA-20261015-c6f017; H-CERTBIN-7e3a51 predicts <= 2.5x the n = 83 per-step cost).
  discriminates: >-
    Establishes the true distance remaining for Tables A and C and supplies K at n = 131 for
    LEAD-ICB-prime-degree-algebraic-decomposition; it cannot by itself count as an IC improvement.
best_measured: >-
  Table A re-priced at the canonical step: 9.13x (n47), 10.25x (n57), 14.60x (n41), 23.11x
  (n59), 25.40x (n53), 41.12x (n61); rho has since improved 19.8% in instructions.
