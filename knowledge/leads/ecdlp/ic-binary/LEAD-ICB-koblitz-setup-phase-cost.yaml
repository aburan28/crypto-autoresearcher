id: LEAD-ICB-koblitz-setup-phase-cost
family: ic-binary
title: >-
  Cutting the reusable set-up of the one-target Koblitz pipeline (Table A), where 98.5-99.7%
  of S sits
mechanism: >-
  In Table A the target-independent set-up (pair table, relation rank, linear algebra) is
  98.5-99.7% of S and the descent at most 1.4%. Constant levers already measured outside the
  board (per-size K retune, production free relations, orbit fast path, cache-blocked pair-table
  build) attack exactly that phase. It cannot change the exponent, but every verified cut
  shrinks the distance to rho.
disposition: open_next_step
next_action:
  step: >-
    Re-run the rule-v3 Table A protocol (six curves, 64 unseen targets each) with (i) production
    free relations on, (ii) K re-tuned on training seeds for the one-target objective (the
    improve-2 study found the repository K at n = 41 costs 2.2x the tuned K), (iii) the blocked
    pair-table builder ported to the Koblitz table where it applies; price rho in the same
    process at the canonical step and with the current optimized strong rho; land with a VALIDATION.json
    and the section 5a band.
  discriminates: >-
    A paired ratio below 1 with CI excluding 1 at >= 4 of 6 sizes is a verified baseline improvement
    and moves Table A; a ratio near 1 means the levers measured in examples/koblitz_orbit_dlp_fast_online.rs
    do not transfer to the ic price pipeline.
best_measured: >-
  Table A S_IC 9.51-24.9 units/sqrt(r) against reference 1.19-1.82 (5.23x-21.0x); outside
  the board: K retune 0.46x at n = 41, free relations 0.960x [0.946, 0.976] pooled, orbit
  fast path 1.63x whole process, blocked builder 0.12-0.13x whole run (prime table, N >= 4096).
  cryptanalysis Koblitz n = 83 ratchet (docs/ic/BASELINES.md, rank-finder row, 2026-10-21):
  end-to-end cold IC / tuned rho 3.92 (point estimate, wall time on one host class,
  factor-base construction uncharged, section 5a band unresolved), the smallest cold gap
  recorded in any repository; about ten stacked engineering improvements since 2026-10-16.
