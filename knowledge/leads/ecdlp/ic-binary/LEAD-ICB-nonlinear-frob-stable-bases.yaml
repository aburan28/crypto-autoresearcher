id: LEAD-ICB-nonlinear-frob-stable-bases
family: ic-binary
title: >-
  Non-subspace Frobenius-stable factor bases at prime n: trace-spectrum, Hamming ball, multiplicative
  subgroup, tau-adic, algebraic-group (Couveignes-Lercier) points
mechanism: >-
  Prime n with 2 primitive leaves no Frobenius-stable F_2-subspace of useful dimension, but
  non-linear stable sets exist: V_E = {x : Tr(x^e) = 0, e in E}, Hamming balls in a normal
  basis, multiplicative subgroups x^d = 1, tau-adic patterns over an orbit-union base, and
  F_2-rational points of low-dimensional algebraic groups or Jacobians. If one keeps the n-fold
  orbit gain with a membership system no costlier than a subspace, it restores the Koblitz
  lever at n = 131.
disposition: open_next_step
next_action:
  step: >-
    Run the approved matched-|F| per-attempt cost comparison: trace-spectrum V_E (H-CERTBIN-5a81ca)
    and normal-basis Hamming ball B_w (H-CERTBIN-ec0945) against a random subspace on RC-1
    (n = 17) and a Koblitz n = 19 cell, in D <= 5 closure work and WDSat conflicts with a
    size-matched null; in parallel finish the dimension-5/6 Weil-polynomial census over F_2
    for 131 | #A (H-FROB-ff99bf hit an impediment at dims 5-6; H-BINSTD-944a66 has preliminary
    support) and read the Couveignes-Lercier primary source.
  discriminates: >-
    Per-attempt cost within [0.5, 2] of the subspace arm keeps the n-fold gain at prime n
    and justifies an n = 131 price; cost above 2x means the stable structure is paid back
    in membership cost and the non-linear stable lane closes. A census with no dimension-5/6
    abelian variety having 131 | #A closes the Couveignes-Lercier route at g <= 6.
best_measured: >-
  Cyclotomic-sparse bases yield-neutral at n = 23 (effects -0.49%..+0.65%, positive control
  p = 0.001), cost ratio 0.88-1.12 vs compact; orbit-union buys exactly log2(n) bits (7.03
  at n = 131); tau-adic base is a Gamma_w-orbit quotient that reaches rho only at w >= 13.
