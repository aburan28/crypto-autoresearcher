id: LEAD-ICE-syzygy-cascade-signatures
family: ic-engine
title: >-
  Exploiting the degree-born non-rewritable syzygy (F5 signature) cascade of Semaev systems
mechanism: >-
  If the chained Semaev system carries more non-rewritable low-degree syzygies than a generic
  system, an F5-type solver falls earlier and the solving degree drops. GOAL-SIG-001 counts
  the D-born non-rewritable signatures; D <= 5 cascades are admissible, the D >= 6 null needs
  recalibration, and the trivial-syzygy subtraction family itself may be miscounted.
disposition: open_next_step
next_action:
  step: >-
    Run the repaired SIG-D6-NULL-RECAL-v2 calibration, adding the planted-syzygy unit-slope
    control (H-SIG-22ec42) and the Boolean-ring trivial-syzygy repair (IDEA-20260805-bbfca9).
  discriminates: >-
    Unit slope on the planted family plus an extra_D excess over the matched D >= 6 null means
    the cascade is a curve fact to price as a degree drop; no excess (or a failed planted
    control) closes exploitability at toy scale or retires the instrument.
