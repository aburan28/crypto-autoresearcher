id: LEAD-ICE-semaev-cover-monodromy
family: ic-engine
title: Semaev summation-cover monodromy / Frobenius cycle types as a relation-rate gate
mechanism: >-
  If the monodromy of the m-th Semaev cover were smaller than the symmetric/wreath group on
  some curve family, Chebotarev would give that family a higher relation rate. The geometric
  monodromy is uniform in the curve: (Z/2)^{m-2} over the ordered base and (Z/2)^{m-2} semidirect
  S_{m-1} over the symmetric base, and on the factor-base locus the fibre splits completely.
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: >-
    For every p > 3 and nonsingular E/F_p, the generic monodromy is (Z/2)^{m-2} (ordered base)
    and (Z/2)^{m-2} x| S_{m-1} (symmetric base, m >= 4) with an exact Frobenius rule on unramified
    fibres (KN-FIND-bdcd60, two blind re-derivations); on the factor-base locus S_m splits
    completely with an exact root multiset, so the generic-fibre cycle-type census is a no-go
    as a relation-rate probe at every m >= 3 (KN-FIND-4f0d84). GOAL-MONO-001 completed under
    DEC-20261022-a0f165.
  revisit_when: >-
    A rule-12 review breaks KN-FIND-4f0d84 or KN-FIND-bdcd60, or a factor-base statistic answering
    KN-OPEN-62c870 Q1/Q3 carries curve-specific relation-rate information.
