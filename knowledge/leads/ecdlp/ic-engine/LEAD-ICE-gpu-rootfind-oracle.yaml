id: LEAD-ICE-gpu-rootfind-oracle
family: ic-engine
title: >-
  CUDA root-finding 2-decomposition oracle (embarrassingly parallel target x factor-base cells)
mechanism: >-
  Each (target, F_i) cell is two slopes, one squaring and two probes, with one Montgomery-batched
  inversion per target, so the oracle maps onto a GPU at an estimated 5e10-1e11 cells/s. It
  can only lower the relation-phase constant (68-95% of Table B S); a matched comparison needs
  rho on the same GPU, which already has a measured Blackwell kernel.
disposition: open_blocked
next_action:
  step: >-
    Execute `./bench throughput` and the fail-closed validation harness of gpu/rootfind on
    a real sm_120 (or sm_89) device, then run one ecbench cold session with IC relation phase
    on GPU against same-GPU rho at matched targets.
  discriminates: >-
    Measured cells/s confirm or falsify the 300-1000x host-emulation estimate; the matched
    GPU-IC / GPU-rho S ratio says whether the constant gain survives once rho gets the same
    device.
  blocked_by: >-
    no NVIDIA device has executed the kernel (RESEARCH_GPU_ROOTFIND_DECOMPOSITION.md status
    line); cryptanalysis RunPod attempts failed at CUDA device init
