id: LEAD-ICE-boolean-f4-f5-f6-engines
family: ic-engine
title: >-
  Faster Boolean F4 / F5 / F6-IC / inherited-F4 / matrix-F5 engines for the descended Semaev
  system
mechanism: >-
  Engineering of Groebner engines (word-packed XOR, M4RI, bitmaps, signature F5, GPU RREF,
  learn/apply trace reuse) on the Weil-descended S_3 chain. Engine speedups of 1.4x-2.3x (cryptanalysis)
  and 1.56x-1.67x (packed residuals) are real, but priced F4 is far above both the pair table
  and rho at every measured m = 2, 3, 4 cell.
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    Dominated by LEAD-ICE-rootfind-pairtable-oracle on Koblitz and random-binary curves n
    <= 31, m in {2,3,4}: once its word XORs are priced (#1774), inherited F4 is about 22x-33x
    strong rho at K13 (n13) and the complete-S pair table is about 17x-22x cheaper than F4;
    F6-IC is 55x-6,483x rho (lower bound); in ic_m3_algebraic_vs_mitm F4 on the S_3 chain
    and F6-IC grow faster in n than the MITM floor (slope-difference CI above 0) at m = 3
    and m = 4.
  revisit_when: >-
    A descended cell where the pair table is infeasible (m >= 4 at large n) and the algebraic
    degree stays bounded (LEAD-ICE-descent-closure-degree-at-scale), or a priced engine beats
    the MITM floor slope on >= 3 cells.
best_measured: >-
  priced inherited F4 about 22x-33x strong rho at n13 (sweep D, from #2247 re-run); pair table
  17x-22x cheaper than F4
