id: LEAD-ICE-hybrid-guess-determine-l7
family: ic-engine
title: One-variable specialisation priced as hybrid guess-and-determine on the l = 7 descent cells
mechanism: >-
  dreg_closure_specialise shows that fixing one variable usually brings an l = 7
  draw from closure degree 5 back to degree 4. The ECC2K-130 m = 4 row depends on
  that degree (+7.6 bits over rho at degree 4, +10.3 at degree 5, closed at 6 or
  more). No study has priced the 2^k guessing factor against the degree-5 closure.
  Crossbred was tried only at m = 2 and 3 with n = 7 or 9.
disposition: open_unexamined
next_action:
  step: >-
    On the (m, l) = (3, 7) and (4, 7) cells, measure the closure degree and the
    Macaulay or F4 cost after fixing k = 1, 2 and 3 variables. Charge 2^k times the
    specialised cost, and compare it with the unspecialised degree-5 cost on the
    same draws.
  discriminates: >-
    If guess-and-determine is cheaper, it reprices the ECC2K-130 m = 4 row without
    the 250 GB host that LEAD-ICE-descent-closure-degree-at-scale is blocked on. If
    it costs more, the degree-5 closure stands and that row stays at about +10 bits.
best_measured: null
