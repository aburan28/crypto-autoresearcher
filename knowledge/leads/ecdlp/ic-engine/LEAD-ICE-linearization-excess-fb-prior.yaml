id: LEAD-ICE-linearization-excess-fb-prior
family: ic-engine
title: Linearization excess as a factor-base design prior inside descent cells
mechanism: >-
  cryptanalysis fitted the solving degree of PDP-style decomposition systems as
  D = 2 + [e < -3.5] + [e < -8.5] in the linearization excess e (MAE 0.06 over 656
  bases). KN-FIND-007 shows that mean yield depends only on the factor-base size, so
  choosing the factor-base subspace to maximise e should lower the per-query degree
  without costing yield. Nobody has applied this to crypto's m = 3/4 closure cells,
  or priced it against the MITM floor.
disposition: open_unexamined
next_action:
  step: >-
    On the m = 3 and m = 4 descent cells, rank candidate factor-base subspaces of
    equal size by e. Measure the closure degree and charged cost per query for the
    top-e and the median-e bases, with a random-subspace control.
  discriminates: >-
    If the degree is lower at the same yield, a constant- or exponent-level
    improvement in the IC baseline is possible and the fitted rule transfers. If the
    degree is unchanged, the rule is specific to PDP systems and the lead closes as
    exhausted at that scale.
best_measured: null
evidence:
- {repo: cryptanalysis, path: experiments/pdp-degree-heuristics/README.md, note: fitted
    solving-degree rule in the linearization excess (656 bases)}
- {repo: crypto-autoresearcher, path: knowledge/findings/KN-FIND-007.md, note: mean
    yield depends only on the factor-base size}
- {repo: crypto, path: research/dreg_closure_specialise_20261017/RESULTS.md, note: the
    closure degree on the descent cells it would apply to}
related: [LEAD-ICE-descent-closure-degree-at-scale, LEAD-ICB-factor-base-subspace-choice]
forecloses:
- linearization excess factor base
- choose factor base to lower solving degree
- degree-aware factor base selection
- excess-maximising subspace
areas: [ICEX, DREG, SDEG]
