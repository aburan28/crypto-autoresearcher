id: LEAD-ICP-gfp5-symmetrized-gaudry
family: ic-prime
title: >-
  Symmetrization-aware Gaudry/Diem decomposition on EcGFp5/EcMasFp5 (n = 5) using rational
  2-torsion ((Z/2)^4 x| S_5) and side dichotomy
mechanism: >-
  EcGFp5's rational 2-torsion allows FGHR/FHJRV symmetrization, predicted to cut the ideal
  degree from ~2^20 to ~2^9 and so lower the design note's >= 2^142 Gaudry floor; the side
  dichotomy says every F_q-rational root of the descended system is an all-E or all-twist
  decomposition.
disposition: open_next_step
next_action:
  step: >-
    Run H-GFPN-6cc6aa (degree-4 Macaulay rank of the double-odd 2-torsion quotient against
    a cofactor-1 null) at toy p', then re-run the C1 ladder with an honest memory envelope
    (the m = 5 cells died at the degree-33 F4 round under 11 GiB) on >= 3 primes spanning
    >= 12 bits.
  discriminates: >-
    Rank ratio <= 1/2 with the null above 1/2 supports the symmetrized degree drop and gives
    a measured band to compare with 2^142 (still far above rho's ~2^160 only if the band collapses);
    no drop leaves the published estimate standing and closes the symmetrization arm.
best_measured: >-
  H-GFPN-9a29be inconclusive: m = 5 cells memory_exhausted at p' = 4111, arm (i) at m = 5
  never attempted (EV-GFPN-fc5950)
