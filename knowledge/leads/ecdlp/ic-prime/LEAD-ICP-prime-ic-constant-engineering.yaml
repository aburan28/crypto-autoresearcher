id: LEAD-ICP-prime-ic-constant-engineering
family: ic-prime
title: >-
  Constant-factor engineering of the prime-field IC pipeline (native arithmetic, batching,
  pair-table build, generator, LA filter, planner)
mechanism: >-
  Montgomery u64 fields, simultaneous inversion, blocked pair-table construction, a fixed-window
  repeated-base generator for aP+bQ, CADO-style filtering and an automatic stage planner lower
  the constant of each Table B phase (relations 68-93 % of S, factor base 5-30 %). Each verified
  gain is an improvement over the current IC baseline under the owner's success criterion
  even though the exponent is fixed.
disposition: open_next_step
next_action:
  step: >-
    Put the eight Table B prime rows through the validation gate (replay certificate, validator
    report, matched rho with the section 5a band, VALIDATION.json), then run the unimplemented
    two-level target batching (step 1024 targets in lock-step so the R <- R + G inverse is
    amortised) as a paired ecbench arm against the current folded/walked m = 2 recipe at fp20-fp28.
  discriminates: >-
    Gate pass keeps the 5.5-13.5x distances as the validated baseline (fail demotes them);
    a paired ratio with the interval below 1 at every size is a measured constant improvement
    of the relation phase (~2x predicted); an interval spanning 1 closes the batching item.
best_measured: >-
  fixed-window aP+bQ generator: full-solve reference/candidate 1.161 [1.127, 1.198], A/A 1.044,
  54 toy prime solves (EV-ICPERF-92c130); planner: alternatives 1.36-1.60x worse than plan
  at w = 0
