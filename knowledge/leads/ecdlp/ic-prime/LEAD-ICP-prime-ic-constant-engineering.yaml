id: LEAD-ICP-prime-ic-constant-engineering
family: ic-prime
title: >-
  Constant-factor engineering of the prime-field IC pipeline (native arithmetic, batching,
  pair-table build, generator, LA filter, planner)
mechanism: >-
  Montgomery u64 fields, simultaneous inversion, blocked pair-table construction, a fixed-window
  repeated-base generator for aP+bQ, CADO-style filtering and an automatic stage planner lower
  the constant of each Table B phase (relations 68-93 % of S, factor base 5-30 %). Each verified
  gain is an improvement over the current IC baseline under the owner's success criterion
  even though the exponent is fixed.
disposition: open_next_step
next_action:
  step: >-
    Put the eight Table B prime rows through the validation gate (replay certificate, validator
    report, matched rho with the section 5a band, VALIDATION.json). The wide-batching item is
    closed (2026-10-28, below); the remaining constant is the hash-table floor of the relation
    trial (guard insert plus oracle probe, about 137 ns of a ~318 ns trial at the 16-32 lane knee),
    which needs a table with exposed slot addresses for software prefetch or a compact lane layout.
  discriminates: >-
    Gate pass keeps the 5.5-13.5x distances as the validated baseline (fail demotes them);
    a prefetchable or compact table with a paired relation-phase ratio whose interval is below 1
    is a measured constant improvement; an interval spanning 1 closes the item.
best_measured: >-
  wide target batching closed (crypto PR #2783, #2806): 64/256/1024 lock-step walks do not beat
  16 lanes, the knee is flat over 16-48 lanes (shared inversion amortised by ~32 lanes; lane
  start-up ~12 us and L1 reach grow with width), 1024 lanes at 28 bits interval spans 1;
  walk-prime-fast fixed by Fp64::inv on 32-bit words (relation phase 1.658x -> 1.042x of the
  walk, new/old 0.625x, 240/240 records identical outside timing);   fixed-window aP+bQ generator: full-solve reference/candidate 1.161 [1.127, 1.198], A/A 1.044,
  54 toy prime solves (EV-ICPERF-92c130); planner: alternatives 1.36-1.60x worse than plan
  at w = 0
