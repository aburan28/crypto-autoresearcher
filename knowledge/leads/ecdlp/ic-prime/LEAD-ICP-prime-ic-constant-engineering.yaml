id: LEAD-ICP-prime-ic-constant-engineering
family: ic-prime
title: >-
  Constant-factor engineering of the prime-field IC pipeline (native arithmetic, batching,
  pair-table build, generator, LA filter, planner)
mechanism: >-
  Montgomery u64 fields, simultaneous inversion, blocked pair-table construction, a fixed-window
  repeated-base generator for aP+bQ, CADO-style filtering and an automatic stage planner lower
  the constant of each Table B phase (relations 68-93 % of S, factor base 5-30 %). Each verified
  gain is an improvement over the current IC baseline under the owner's success criterion
  even though the exponent is fixed.
disposition: open_next_step
next_action:
  step: >-
    Replay the 20-bit holdout session of prime_base_oracle_tuning_20261029 (ECBS1h685271327a8a,
    N 32 -> 45 with mitm negation_folded) on a distinct host class (isolab-eks or ecbench-independent-runner)
    as its PROTOCOL.md section 13 requires before the leaderboard promotion, and add the missing
    random-base control; then file a claims/*.json record from the matched per-pair measurements
    (AGENTS.md progress-fidelity gate; until then the figure is unqualified here); then test N > 45 at 20 bits on a fresh holdout (the train minimum was
    shallow). The other open constant is the hash-table floor of the relation trial (guard insert
    plus oracle probe, about 137 ns of a ~318 ns trial at the 16-32 lane knee; with the lane
    round's demand-read touch of both maps it is about 168 ns at 28 bits and 188 ns at 32 bits,
    about 53 % of the trial, derived in crypto research/prime_ic_program_20261029/hashtable_prefetch
    from PR #2806's TSC split converted at 2.1 GHz), which needs a table with exposed slot
    addresses for software prefetch or a compact lane layout (that directory has an uncompiled
    layout=lines patch and a draft protocol). Scope
    note: under the owner criterion of 2026-10-24 these pair-table pipelines are the prime-table
    track (reference only, never ranked against the algebraic track; docs/ic/SWEEPER.md), so
    a gain here improves the reference baseline, not a counted algebraic IC row. Pending:
    crypto research/prime_ic_program_20261029/DECISIONS.md R1 (Option C, delegated, confirmed
    when its PR merges) makes these pipelines a counted generic-decomposition track, so a verified
    gain would count there, labelled generic, never as algebraic progress.
  discriminates: >-
    A second-host replay that reproduces the 20-bit holdout keeps 0.818 [0.773, 0.866] (w = 0)
    as the new prime-field pair-table (generic-track under DECISIONS.md R1) baseline at 20 bits
    and lets the leaderboard section follow; a
    failed replay demotes it. A prefetchable or compact table with a paired relation-phase
    ratio whose interval is below 1 across the section 5a band is a measured constant improvement;
    an interval spanning 1 closes the item.
best_measured: >-
  Progress-fidelity status: UNQUALIFIED in this repository - quoted from crypto's study, no claims/*.json record yet (AGENTS.md 'Mandatory progress-fidelity gate'); same-host replay only. Quoted: factor-base size at 20 bits (crypto PR #2811, prime_base_oracle_tuning_20261029): prime-abscissa
  N 32 -> 45 with the incumbent mitm oracle, holdout sel/inc 0.818 [0.773, 0.866] at w = 0,
  0.798 [0.752, 0.847] at w = 0.1, 0.726 [0.677, 0.778] at w = 1 (96 pairs, same-host replay
  only); gap to matched rho.negation 9.47x -> 7.75x [6.92, 8.70] at w = 0 and 12.88x -> 9.35x
  at w = 1; 24 and 28 bits (N 162 -> 115, 407 -> 288) fall at w = 0 but rise 13-19 % at w = 1
  (relabelling, incumbent kept); 32 bits null by construction. Earlier: wide target batching
  closed (64/256/1024 lanes do not beat 16, knee 16-48); fixed-window aP+bQ generator 1.161
  [1.127, 1.198] over 54 toy solves (EV-ICPERF-92c130); planner weight rules withdrawn out of
  sample (ic-planner/4). Table B prime rows 5.47x-13.5x matched rho now render validated with
  caveats (validation sweep: pricing_ok False).
