id: LEAD-ICP-coppersmith-smallroot-semaev
family: ic-prime
title: >-
  Small-root (Coppersmith / Jochemsz-May) decomposition with lattice-describable (window,
  AP, GAP) factor bases
mechanism: >-
  A small-x or windowed factor base turns decomposition into a multivariate small-root problem
  for S_{m+1}, whose cost is set by lattice reach rather than solving degree. With binary
  addition trees and kept windowed internal nodes, all-S_3 degree-2 blocks have the largest
  reach; if reach exceeded the index-calculus demand the decomposition would cost polynomial
  time per attempt at a factor base large enough to beat rho.
disposition: open_next_step
next_action:
  step: >-
    Compute the provably optimal shift set (Ryan, EUROCRYPT 2025; Feng-Luo-Chen-Nitaj-Pan
    sumset bounds) for the 13-monomial S_3 polytope and the full-tree (m, w) = (4, 2) system,
    and the rank-r >= 2 GAP substitution of H-PFDR-3c7d1e, with tools/smallroot_reach.py as
    the calibrated calculator; then a planted direct-box S_4/S_5 recovery (H-PFDR-621852)
    at 40-56 bits only if the computed reach clears 8/9.
  discriminates: >-
    Optimal reach >= 0.8889 at (4,2) (or any rank-r GAP cell with positive margin) reopens
    a concrete lattice decomposition oracle to be measured; optimal reach < 0.8889 everywhere
    turns the current heuristic -0.0481 closure into a strategy-independent one and closes
    the family.
best_measured: >-
  S_3 reach rigorous delta <= 0.10, heuristic 0.12-0.16 (needs 1/2), Probes B/C at 40/56 bits;
  epsilon margin -0.0481 at (m,w) = (4,2) (JM extended 0.8408 vs demand 8/9)
