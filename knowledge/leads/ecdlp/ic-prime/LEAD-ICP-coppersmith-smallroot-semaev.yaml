id: LEAD-ICP-coppersmith-smallroot-semaev
family: ic-prime
title: >-
  Small-root (Coppersmith / Jochemsz-May) decomposition with lattice-describable (window,
  AP, GAP) factor bases
mechanism: >-
  A small-x or windowed factor base turns decomposition into a multivariate small-root problem
  for S_{m+1}, whose cost is set by lattice reach rather than solving degree. With binary
  addition trees and kept windowed internal nodes, all-S_3 degree-2 blocks have the largest
  reach; if reach exceeded the index-calculus demand the decomposition would cost polynomial
  time per attempt at a factor base large enough to beat rho.
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: >-
    Every Coppersmith lattice built from (p, f)^t on a convex monomial set, the provably optimal
    (Ryan, EUROCRYPT 2025) shift set and Jochemsz-May basic/extended included, has reach at
    most (n! vol Newt(S_3))^{-1/n} per S_3 block with equal per-variable bounds: 0.3293 in
    three unknowns and 0.3536 in two (proved by layering, Ostrowski and Brunn-Minkowski; the
    bound is attained by the exact lattice gain in 11/11 checked cases). With unequal bounds
    a region optimiser (3-10 facets, 6 restarts) finds nothing above the univariate degree-2
    value 1/2 (0.4357 and 0.4892, rising to 1/2 with resolution; numerical, not proved). The
    index-calculus demand at (m, w) = (4, 2) is 8/9 = 0.8889, so the margin is about -0.56
    (proved, equal bounds) and at best about -0.39 within the search, replacing the superseded
    JM margin -0.048, itself corrected to an HG reach of 0.2803 (CORR-20261024-b2a799). Scope:
    one S_3 block, convex monomial sets, lattices of polynomials in (p, f)^t.
  revisit_when: >-
    A joint lattice for the three-block (4, 2) system (three equations in six unknowns) reaches
    more than the per-block sum, a non-convex monomial set or an unequal-bound allocation beats
    1/2 per block, a rank-r >= 2 GAP substitution (H-PFDR-3c7d1e) changes the block polynomial
    beyond S_3, or a non-Coppersmith small-root solver is proposed.
atlas_scope: >-
  Source-attributed single-S_3-block obstruction from crypto
  research/smallroot_optimal_reach_20261026/README.md sections 2 and 5 at
  a6855c198089433512890375299caf71c4d898eb. The source labels this analysis,
  not an index-calculus measurement. Its proof scope is convex monomial sets,
  equal per-variable bounds and one ideal (p, f)^t; unequal-bound results are
  numerical within the recorded search. The disposition and forecloses labels
  have that scope only. Joint three-equation/six-unknown lattices, non-convex
  sets, other solvers and rank-r GAP substitutions outside that block remain
  revisit cases. This derived-index merge makes no new mathematical verdict,
  hypothesis/goal transition or verified IC improvement claim.
former_next_action:
  step: >-
    Independently review the finite determinant accounting in
    research/joint_smallroot_reach_20261024/ and reconcile the historical
    modulus-budget calculation; do not use 0.8408 or its 0.0481 gap as validated
    reach. Then verify applicability of the proposed optimal-shift machinery
    to the joint three-equation system and rank-r >= 2 GAP substitutions,
    and implement root extraction with full costs.
  discriminates: >-
    Correct finite determinant identities qualify the accounting only. A justified joint
    bound above the rederived, fully charged demand motivates planted-root and random-target
    experiments. Finite diagnostic failures or a single shift-family optimum do not close
    arbitrary joint-system methods or the prime-field ECDLP.
best_measured: >-
  source-reported analysis bound (crypto research/smallroot_optimal_reach_20261026):
  one S_3 block, convex monomial sets and equal per-variable bounds,
  0.3293 (S_3 in 3 unknowns) / 0.3536 (2 unknowns); numerical best region 0.4357 / 0.4892
  (-> 1/2); demand 8/9 at (m,w) = (4,2); HG-corrected JM extended reach 0.2803 (CORR-20261024-b2a799).
  Earlier probe figures (S_3 rigorous delta <= 0.10, Probes B/C at 40/56 bits) are consistent.
  These per-block bounds and the HG analysis correction do not supply the pending
  EXP-ECDLP-64fa3d convention audit, joint-system applicability, executed parity,
  root extraction or complete IC improvement.
