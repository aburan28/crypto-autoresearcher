id: LEAD-ICP-char0-lifting-xedni-smoothness
family: ic-prime
title: >-
  Lifting to characteristic zero - classical xedni, prescribed rational lifts (Cheon 2-isogeny
  form) and smoothness of integer lifts of x
mechanism: >-
  Lift E and the factor-base or target points to E/Q so that rational relations reduce to
  free relations mod p (xedni), construct rational lifts of a prescribed finite-field pair
  that are dependent (Cheon-style 2-isogeny family), or treat integer lifts of x(kP) as smooth
  numbers as in F_p^* index calculus.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Jacobson-Koblitz-Silverman-Stein-Teske (2000) show xedni does not beat rho: the logs span
    rank(E(Q)) unknowns and the target must still be a bounded combination of generators.
    The program reproduced the published p = 353 Cheon example and certified both historical
    prescribed pairs independent modulo torsion (rank exactly two), with a derived signed-square
    independence lemma; the integer-lift route has no compositional identity because the x-line
    addition law is 2-valued (H-PFDR-e0988d).
  revisit_when: >-
    A certified exact dependent lift found by the frozen bounded search (H-XEDN-4a5b50) with
    lift and certificate costs charged, or a lifting family whose relation coefficients stay
    bounded at crypto-relevant rank.
best_measured: >-
  p = 353 example reproduced; 2/2 historical pairs certified independent; Xedni V2 curve-fitting
  0 certified dependencies among 20 bounded pairs
