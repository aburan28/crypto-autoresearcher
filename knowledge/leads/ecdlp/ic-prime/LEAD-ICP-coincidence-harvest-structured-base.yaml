external_evidence:   # repo not in tools/lead_atlas.py REPOS; paths unverified by --check; local toy-scale, PR #53 open stacked on #52
- repo: aburan28/ml-cryptanalysis
  path: experiments/fb-prime-transfer/report.md
  note: >-
    Planted additive structure (logap, loggap2) costs 3.9..6.4 bits as a positive control, yet real structured families show no yield difference and additive/multiplicative energy does not predict collision count at cofactor 1 (local, N <= 2^20).
- repo: aburan28/ml-cryptanalysis
  path: experiments/fb-prime-learned-2p24/report.md
  note: >-
    Structured families at N 2^24..2^26 within 0.0003 bits of random at m = 2; no excess to harvest in mean yield. Does not test kappa_rel growth.
