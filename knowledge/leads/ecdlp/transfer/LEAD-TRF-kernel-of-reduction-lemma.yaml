id: LEAD-TRF-kernel-of-reduction-lemma
family: transfer
title: Kernel-of-reduction lemma - a short kernel vector of a lift to characteristic zero is a discrete log, in any ring and rank
mechanism: >-
  Let L be a finitely generated group of global points (E(Q), E(K), E(F_p(t)) or the span of an explicit
  family) with reduction or specialisation homomorphism red onto G = Z/N, and K = ker(red). A lift of the
  ECDLP wants short vectors of K or of the coset red^(-1)(Q). The lemma states that for any rank at
  least 2 a kernel vector of prescribed support on two coordinates whose images are P and Q returns k in
  O(1) calls, so finding it is DL-hard; lattice reduction cannot find K without the logs because K is
  defined by them.
disposition: open_next_step
next_action:
  step: >-
    Write the lemma with the p-adic formal-group channel of anomalous curves excluded explicitly, then run
    the designed floor test: the Z arm replicates the D2 kernel-height floor (about 2 log p, EV-CZLIFT-376eee)
    on named curves, and the F_p(t) arm measures the minimum height of a section with s(t0) = O on the
    XEDN rational-surface families at small p over all fibres, against a random-homomorphism control of the
    same index.
  discriminates: >-
    A kernel floor that is constant in p over F_p(t) (about the minimal intersection number, 2) while the
    Z floor grows as 2 log p confirms that the coverage excess is ring-specific and useless to an attacker
    in both rings, and collapses the revisit_when clauses of five leads into one obstruction. A floor that
    grows with p over F_p(t), or any ring where kernel vectors are found below meet-in-the-middle without
    the discrete log, is a real lead.
