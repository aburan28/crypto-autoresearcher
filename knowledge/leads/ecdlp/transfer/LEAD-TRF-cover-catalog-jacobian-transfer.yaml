id: LEAD-TRF-cover-catalog-jacobian-transfer
family: transfer
title: >-
  Catalogued cover maps (1,940 prime quadratic pullbacks, 160 binary cubic pullbacks): executable
  pushforward and subgroup recovery
mechanism: >-
  The cover catalog lists explicit maps H -> E; executable Jacobian arithmetic, norm maps
  and subgroup certificates would let any future destination algorithm on H be tested as an
  ECDLP transfer for the 977 linked EC1 representations.
disposition: open_blocked
next_action:
  step: >-
    Build even-degree (two points at infinity) odd-characteristic Mumford arithmetic and the
    general binary norm phi_*: Jac(H) -> E, then certify subgroup order, kernel and image
    for each binding.
  discriminates: >-
    Executable maps let the catalog be screened end to end (most rows should land in the same-field
    obstruction); without them the 2,572 assessments stay classification-only.
  blocked_by: >-
    crypto problems/prime-cover-balanced-jacobian-and-induced-maps-missing.md; problems/binary-cover-arbitrary-jacobian-norm-missing.md;
    problems/catalog-cover-subgroup-certificates-incomplete.md
best_measured: >-
  classification complete for 2,572 maps / 977 EC1 bindings; one order-29 binary fixture fully
  certified
