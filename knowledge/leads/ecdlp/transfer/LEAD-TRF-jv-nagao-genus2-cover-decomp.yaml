id: LEAD-TRF-jv-nagao-genus2-cover-decomp
family: transfer
title: >-
  Nagao decomposition on a genus-2 cover of E(F_{p^6}) (examples/jv_cover.rs), with F4 and
  sparse-FGLM engineering
mechanism: >-
  Each relation is one Nagao decomposition test solved by F4 then a linear stage; engineering
  (sparse FGLM, F5 signatures, large-prime variation) lowers the per-test cost and S/rho.
disposition: closed_dominated
obstruction:
  kind: measured
  statement: >-
    On the same weak-class instances the Nagao route sits at S/rho 151-293 after sparse FGLM
    (p <= 251) while the JV sieve (LEAD-TRF-jv-sieve-fp6-weak-class) was historically below
    rho; per-test engineering (1.28x) cannot close a two-order gap, and only a large-prime
    variation (lead L6 of ic_cover_leads) could change the exponent.
  revisit_when: the sieve row fails validation, or a large-prime variation for the Nagao route
    is built
best_measured: >-
  S/rho 664/286/151/293 at four (p, seed) after sparse FGLM (was 851/369/194/373), lower-bound
  comparison
evidence:
- repo: crypto
  path: research/jv_cover_sparse_fglm_20261018/README.md
  note: 'sparse FGLM: C_cov 1.27-1.31x, S 1.28x cheaper'
- repo: crypto
  path: research/ic_cover_leads_20261018/README.md
  note: cost breakdown and ranked leads L1-L6
- repo: crypto
