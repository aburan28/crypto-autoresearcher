id: LEAD-TRF-padic-canonical-section
family: transfer
title: >-
  Canonical point sections E(F_p) -> E(Q_p) and their p-adic digits on non-anomalous curves
mechanism: >-
  Look for a computable section of reduction on a non-anomalous curve (torsion section, Teichmuller-like
  or Hensel lifts) whose formal logarithm or p-adic digits linearise the discrete log, generalising
  Smart beyond trace one.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    For p not dividing #E(F_p) the only homomorphic section is the prime-to-p torsion section,
    which the formal logarithm kills (log vanishes on torsion), exactly as log_p kills the
    Teichmuller section of F_p^*; any non-homomorphic section recovers d only at the random
    1/p rate. Toy runs (p < 2000 and 10^4..10^5) met the frozen criteria; the only failure
    (naive F_p^* section) is a size effect for g^d < p, not a p-adic one. Scope: non-anomalous
    prime-field curves, all lifts of E.
  revisit_when: >-
    a section is found whose carry is small for a positive fraction of targets (that would
    be a height lead, see LEAD-TRF-global-lift-small-height)
best_measured: >-
  toy: functional vanishing and homomorphism rates as predicted on all EXP-CZLIFT trials;
  evidence records not filed
