id: LEAD-TRF-teske-trapdoor-fp6-weak-class
family: transfer
title: Teske-style trapdoor over F_{p^6} built on the Joux-Vitse weak class
mechanism: >-
  Over prime fields, Tate's theorem leaves an isogeny trapdoor nothing to hide.
  Over F_{p^6}, Joux-Vitse weakness belongs to individual curves rather than
  whole isogeny classes: only 55-63% of classes contain a weak curve, and the ISO-1
  walk reaches one. That is the structure Teske's binary-field trapdoor uses. A
  search of crypto's research reports found no trapdoor work on F_{p^6} or JV.
disposition: open_unexamined
next_action:
  step: >-
    For random ordinary classes over F_{p^6}, measure the cost of the public ISO-1
    walk to the nearest weak curve. Then ask whether any class places its weak curve
    beyond a public walk, at a cost far above 1e5-1e8 F_p multiplications against
    about 1e10 for the attack.
  discriminates: >-
    If the walk is always cheap, the trapdoor hides nothing and the lead closes with
    a cost-model obstruction. If some classes have far or unreachable weak curves, a
    hidden-weakness construction exists and needs a security definition.
best_measured: null
