id: LEAD-TRF-global-lift-small-height
family: transfer
title: >-
  Global lifts to E(Q) or E(K) with small canonical height (xedni, SNFS / cyclotomic / Solinas
  number fields, rational 2-torsion lifts)
mechanism: >-
  Lift (E, P, Q) to a curve over Q or a number field and hope the relation between the lifts
  is a short Mordell-Weil relation, readable from heights or a rank deficiency (Silverman's
  xedni calculus and its number-field / SNFS variants).
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    Jacobson-Koblitz-Silverman-Stein-Teske: lifted points have canonical height of order log
    of the group size per relation and the number of points of height <= B grows like (log
    B)^{r/2}, so covering a target residue mod p needs exponentially large height; the program
    re-measured uniform reduction of small points on rank 0-11 curves and over Q(2^{1/3})
    (CZLIFT, review pending). Scope: lifts to E(Q) and E(K) for bounded-degree K, any rank
    reachable by known constructions.
  revisit_when: >-
    a lift family with rank growing like log p and provably small regulator, or an exact dependent-lift
    finder (RQ-XEDN-3bfe2e) that hits a prescribed residue faster than p^{1/2}
best_measured: >-
  toy: small points reduce like uniform points; xedni dependence never seen within relation
  bound 6 (planted dependence detected)
