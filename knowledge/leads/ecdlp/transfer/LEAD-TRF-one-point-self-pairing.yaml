id: LEAD-TRF-one-point-self-pairing
family: transfer
title: >-
  A non-degenerate self-pairing or distortion map computable from one point of the prime-order
  subgroup
mechanism: >-
  If e(P,P) were non-trivial and computable for a single point (via a CM endomorphism acting
  as a distortion map, or a partial pairing-return cycle), MOV would apply without a second
  independent N-torsion point, and pairings could give a DDH/ECDLP lever on ordinary prime-field
  curves.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    On a cyclic group G of prime order N every bilinear map G x G -> H is a scalar multiple
    of one fixed map; a non-trivial self-pairing on the rational N-torsion line needs the
    full E[N] rational (Balasubramanian-Koblitz: E[N] subset E(F_{p^k}) iff N | p^k - 1),
    i.e. embedding degree 1, and every geometric endomorphism of an ordinary curve commutes
    with Frobenius and preserves the rational eigenline, so it is not a distortion map. Scope:
    ordinary curves over prime fields, N || #E, N != p.
  revisit_when: >-
    a non-bilinear, efficiently computable map out of G with a verified partial return property
    is exhibited (ECDLP-IDEA-008 style), or an ordinary family with k=1 and prime N of crypto
    size is needed
