id: LEAD-TRF-cm-canonical-lift-heights
family: transfer
title: >-
  Serre-Tate canonical lift with CM: does the CM order shrink the heights of lifted points
  enough for xedni to bite?
mechanism: >-
  The canonical lift of an ordinary curve is a CM curve whose Mordell-Weil group is an O-module;
  CM might halve the needed points, pin the rank by an L-value or give a structured family
  of lifts, changing the specific height quantity that kills xedni.
disposition: closed_obstructed
obstruction:
  kind: cost_model
  statement: >-
    Writing the canonical lift down needs the Hilbert/ring class polynomial of D = t^2 - 4p,
    of degree h(D) = |D|^{1/2+o(1)} ~ p^{1/2}, already the rho budget; for small |D| (cheap
    lifts) the height-coverage obstruction of LEAD-TRF-global-lift-small-height applies unchanged.
    Lane L9 was closed reject_scoped (DEC-20260810-2c7e3c); the red team confirmed the closure
    but replaced its load-bearing norm-form argument (DEC-20260810-3110d5). Scope: ordinary
    prime-field curves, canonical and CM lifts.
  revisit_when: >-
    a CM lift whose field of definition has degree O(p^{epsilon}) and whose lifted points
    have height o(log N), or the cheap stage-0/1 checks of IDEA-20260815-93f483 return something
    unexpected
best_measured: one run (EXP-CANL-96b0ad, doubling-denominator check); no attack metric
