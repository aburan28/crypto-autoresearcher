id: LEAD-TRF-pairing-target-field-recost
family: transfer
title: >-
  Recompute the post-MOV target-field DLP cost (exTNFS in GF(p^12)) for BLS12-381 and BN254
  with memory charged
mechanism: >-
  For pairing curves the ECDLP is bounded by the DLP in GF(p^k) after MOV; the quoted 128/100-bit
  labels come from one family of exTNFS estimates. Running the polynomial selection, charging
  linear-algebra memory and descent, and reporting the tail over selections could move the
  effective security of the transferred problem.
disposition: open_next_step
next_action:
  step: >-
    Run the certified toy tower-field DLP that RQ-PAIR-f2e31f already specifies (H-PAIR-62e9cc:
    coprime tower splits n in {4,5,6,8,12} and one certified discrete log in F_121), then
    a small same-shape GF(p^12) calibration against a published record before any deployed
    estimate.
  discriminates: >-
    If the cost model retrodicts the published record within its stated band, the BLS12-381/BN254
    re-estimate is admissible; if it cannot, every downstream bit label in this lane stays
    unpriced. Either way it says nothing about ECDLP on non-pairing curves.
