id: LEAD-TRF-same-field-genus-g-embedding
family: transfer
title: >-
  Embed E/F_p as an isogeny factor of a genus-g Jacobian over the same field (covers, quadric
  pencils, quartic/bielliptic models)
mechanism: >-
  Map the ECDLP into the Jacobian of a curve C over the same field with Jac(C) ~ E x A (a
  cover C -> E, a bielliptic quartic, a surface or quadric-pencil model) and use genus-g index
  calculus there.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Tate multiplicativity gives #Jac(C)(F_p) = N * #A(F_p) with #A = Theta(N^{g-1}); genus-g
    index calculus costs O~(q^{2-2/g}) >= q for g >= 2, at least a full exponent above rho's
    N^{1/2}; quadric-pencil and quartic models of E itself are isomorphic models with the
    same group. Scope: prime-field source curves, any same-field cover (DEC-20260902-4c82fd).
  revisit_when: never for same-field covers; extension-field sources are separate leads
best_measured: >-
  bielliptic quartic and GF(2^83) quartic transfers verified for correctness only; no cost
  advantage expected or measured
