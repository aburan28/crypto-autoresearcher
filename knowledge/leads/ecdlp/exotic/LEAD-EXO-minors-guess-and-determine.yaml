id: LEAD-EXO-minors-guess-and-determine
family: exotic
title: Minors-based and guess-and-determine ECDLP attacks (Mahalanobis line) - charged cost versus matched rho at toy size
mechanism: >-
  A published line (Mahalanobis and Mallick, Abdullah-Mahalanobis-Mallick, 'Minors solve the ECDLP', and a
  2026 guess-and-determine variant) searches for a zero minor of a matrix built from the curve and the
  two points, using a hyperplane-arrangement poset or guessed entries to fix the scalar. The recorded
  claims are an order-2^50 toy solve and no complexity bound; the latest paper says it is no security
  risk. The program has never charged its cost against matched rho.
disposition: open_next_step
next_action:
  step: >-
    Implement the algorithm from the papers at toy group orders (20 to 40 bit, at least four sizes), charge
    every minor or determinant evaluation and linear-algebra step in the counted unit, and run it on the
    same planted instances as matched rho; fit the scaling exponent with an interval.
  discriminates: >-
    A fitted exponent at or above 1/2 with a constant above rho's closes the lead with a measured
    obstruction. An exponent clearly below 1/2 at matched constant is a real lead and goes to independent
    replication before any claim.
