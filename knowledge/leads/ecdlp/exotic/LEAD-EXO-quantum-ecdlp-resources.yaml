id: LEAD-EXO-quantum-ecdlp-resources
family: exotic
title: >-
  Quantum ECDLP: reversible secp256k1 point-addition circuits for Shor (resource reduction)
mechanism: >-
  Reduce Toffoli count x peak qubits of the reversible point-addition circuit that dominates
  Shor's ECDLP algorithm on secp256k1 (dialog-GCD affine adder, Karatsuba/Solinas squaring).
  This lowers the fault-tolerant cost of a known polynomial-time quantum attack; it does not
  change classical cost and has no matched-rho comparison.
disposition: open_next_step
next_action:
  step: >-
    Replace the per-step cswaps of the binary-GCD inverse by a safegcd/jump-GCD structure
    to narrow the apply and ipmul/quotient phases together (the 1,434-qubit peak is a 6-phase
    co-bind), validated on the full input space rather than only on a Fiat-Shamir reroll island.
  discriminates: >-
    A peak below 1,434 qubits with exact correctness on all inputs is a real resource gain;
    gains that exist only on a reroll island are test-set fitting and should not count.
best_measured: >-
  score 2,490,847,962 (avg Toffoli 1,736,993 x 1,434 qubits), -0.124% vs HEAD, valid on the
  9024-shot island only
evidence:
- repo: crypto
  path: quantum_circuit_secp256k1/README.md
  note: 'Work log: HEAD baseline, binding phases, validated island improvement'
- repo: cryptanalysis
  path: suite/src/cryptanalysis/shor.rs
  note: Shor implementation in the cryptanalysis suite
- repo: cryptanalysis
  path: suite/src/cryptanalysis/quantum_estimator.rs
  note: Quantum resource estimator
forecloses:
- quantum circuit for secp256k1 point addition
- Shor ECDLP resource estimate
- Toffoli count of elliptic curve addition
- reversible modular inversion for Shor
areas:
