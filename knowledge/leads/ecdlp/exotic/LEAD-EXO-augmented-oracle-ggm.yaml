id: LEAD-EXO-augmented-oracle-ggm
family: exotic
title: >-
  Augmented oracles (x-, y-, full-point, halving, endomorphism-image, incidence) and GGM simulability
mechanism: >-
  Give the solver an extra public oracle (x-coordinate, y-coordinate, full point, halving
  query, endomorphism image, factor-base incidence, jet) and hope it supplies sub-birthday
  information or guided decomposition.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Each named oracle is GGM-simulable (jet, endomorphism O(1); incidence O(m); halving equivalent
    to x; net O(log N)), so the Shoup lower bound closes its candidate family at exponent
    1/2 (KN-FIND-002, KN-FIND-b7e091, KN-FIND-194294; EV-GGM-001 strong). Measured: the x-oracle
    gives Y_A = Y_B exactly (no yield advantage, EV-ECDLP-fd61e4 recorded strong, preliminary per CORR-20261026-c94668) and the m=3 MITM
    split saving is attributable to the split, not the oracle (EV-ECDLP-7367e2). Scope: oracles,
    not resources (see IDEA-20260808-ea3b4f).
  revisit_when: >-
    A publicly computable oracle that is NOT GGM-simulable is exhibited (the threshold oracle
    is the minimal non-simulable identifier, KN-FIND-982fdf, but needs private data).
best_measured: x-oracle yield Y_A = Y_B exactly; oracle increases candidates (EV-ECDLP-284817)
evidence:
- repo: crypto-autoresearcher
  path: knowledge/findings/KN-FIND-002.md
  note: GGM simulability test; jet/endomorphism closed at 1/2
- repo: crypto-autoresearcher
