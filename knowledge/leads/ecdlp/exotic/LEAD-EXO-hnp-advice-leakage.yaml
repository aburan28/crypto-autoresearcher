id: LEAD-EXO-hnp-advice-leakage
family: exotic
title: Bit-security / hidden-number conversion of DL leakage, auxiliary inputs and advice
mechanism: >-
  Turn any weak correlation between public coordinates and bits of the logarithm (or leaked
  auxiliary inputs [alpha^i]G, or stored advice) into full DL recovery via hidden-number-problem
  lattices or Cheon-style divisor walks. A conversion with exponent 2*beta below 1/2 would
  make a small statistic advantage an attack.
disposition: open_blocked
next_action:
  step: >-
    Price the Thue-Morse/Rudin-Shapiro conversion of H-ECDLP-a4be60 (IDEA-20260904-f68c7f:
    exponent 2*beta vs 1/2, memory and cost table) once a statistic with a measured nonzero
    log-bit advantage exists.
  discriminates: >-
    With a measured advantage, 2*beta < 1/2 gives a sub-rho conversion to test against matched
    rho; without one the conversion has nothing to convert and stays a cost model.
  blocked_by: >-
    No coordinate-to-log-bit statistic with measured nonzero advantage exists (LEAD-EXO-coordinate-statistic-leakage,
    LEAD-EXO-dl-character-sum-pseudorandom); auxiliary inputs require protocol leakage, not
    the plain ECDLP (GOAL-AUXIN-a93442).
best_measured: >-
  Cheon auxiliary-input walk: measured exponent 0.23 vs rho 0.50 from 24 bits up, ONLY when
  [alpha^i]G is leaked (crypto torsion_auxiliary_inputs, toy)
