id: LEAD-EXO-lossy-object-propagation
family: exotic
title: >-
  Lossy tracked objects propagated through scalar multiplication (doubling coordinates, rigidity,
  belief propagation)
mechanism: >-
  Track a lossy function of the point (x+y, xy, doubling slope, low bits, residue symbols,
  split-quotient certificates, latent linear embeddings) through the double-and-add chain
  and prune scalars by constraint/belief propagation, hoping the object propagates cheaply
  while still reading the instance.
disposition: open_next_step
next_action:
  step: >-
    Run the disjoint projection panel of IDEA-20260817-84755b in the probabilistic regime
    that the rigidity theorem (IDEA-20260807-df906f, IDEA-20260806-c5d183) leaves open, with
    exact-arithmetic fibre tests (KN-FIND-7d098b caveat) and a random-relabelling null.
  discriminates: >-
    Propagation advantage at the null level for every projection closes the probabilistic
    regime too (the deterministic regime is already constant-or-injective); a projection with
    above-null propagation that is not injective is a genuine new lever.
