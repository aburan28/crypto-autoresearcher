id: LEAD-EXO-dl-character-sum-pseudorandom
family: exotic
title: Additive-character bias of the discrete log on structured factor bases (H-PSEUDO)
mechanism: >-
  If max_k |sum_{P in F} e(2 pi i k DL(P)/N)| over the small-x set F were well above sqrt(B),
  the factor base would have super-random additive yield; by the Betti-yield duality (KN-FIND-9d2f56)
  exactly this is what a sub-rho combinatorial IC needs.
disposition: exhausted_at_scale
obstruction:
  kind: measured
  statement: >-
    Measured the character-sum constant against a matched random null at 2^20-2^26 (EV-ECDLP-f83a17):
    R = C_EC/C_null is flat at about 1.28-1.34, i.e. the curve behaves like a random set up
    to a constant; all six standard analytic proof routes are closed (KN-FIND-e7a3b1), so
    neither a proof nor a measured bias exists. EXP7 Fourier flatness (8-14 bit) found no
    candidate predicate.
  revisit_when: >-
    R trends upward with p beyond 2^30 on the same matched null, or a structured set other
    than small-x shows R growing with N.
best_measured: R = C_EC/C_null ~ 1.28-1.34, flat across 2^20..2^26 (EV-ECDLP-f83a17, toy)
