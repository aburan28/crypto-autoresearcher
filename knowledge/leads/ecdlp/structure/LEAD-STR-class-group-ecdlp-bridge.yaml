id: LEAD-STR-class-group-ecdlp-bridge
family: structure
title: Reduction between Cl(O)-vectorization (or CM self-pairings) and ECDLP in the same class
mechanism: >-
  The crater is a Cl(O)-torsor, and curves in the class carry class-group data (edge characters,
  ray-class fibers, Castryck-Houben-Merz self-pairings). A bridge map could carry a vectorization
  oracle to an ECDLP solver or back. The ray-class view writes ECDLP on a conductor-1 curve
  as vectorization inside the fiber of Cl_n(O) -> Cl(O).
disposition: open_next_step
next_action:
  step: >-
    Write and review the simulation lemma of H-CLGP-63f471 / IDEA-20260807-1b7241. In a curve-aware
    generic group model where the adversary also gets free class-group action on curves, show
    ECDLP still needs Omega(sqrt N) group operations. State quantifier order and the size-gap
    argument (h ~ p^{1/2} vs N ~ p, IDEA-20260807-bbdcf3).
  discriminates: >-
    A checked simulator closes the lane at exponent 1/2 with a theorem. A place where the
    simulation fails names the one bridge (for example the ray-class level fiber of IDEA-20260812-a3720a)
    that a concrete reduction must use.
evidence:
- repo: crypto-autoresearcher
  path: analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
  note: L10 lane, any reduction must build the bridge map explicitly
- repo: crypto
