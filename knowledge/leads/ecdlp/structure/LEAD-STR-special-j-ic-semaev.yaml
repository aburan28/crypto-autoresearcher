id: LEAD-STR-special-j-ic-semaev
family: structure
title: >-
  Special j (0, 1728, small height, Semaev degeneration locus) in Semaev and index-calculus
  systems
mechanism: >-
  At j=0 (a=0) or j=1728 (b=0) the Semaev summation polynomials lose monomials (S_3 support
  9 and 10 against 13 generic), and the automorphism group acts on the x-line. A sparser or
  more symmetric decomposition system might lower the solving degree or the relation cost
  by more than the sqrt(|Aut|) rho constant. The JINV lane also proposed a Semaev degeneration
  divisor on the j-line and small-height models.
disposition: open_next_step
next_action:
  step: >-
    On matched-order families (fixed N, as in MATCHED-ORDER-DESIGN.md), measure the first-fall
    degree, F4 solve time and complete charged IC cost S for S_3/S_4 decompositions on j=0
    and j=1728 curves against generic-j curves. Use the automorphism-orbit factor base and
    a sham-curve null of the same support shape. Report the gap to matched rho with the automorphism
    discount applied to rho too.
  discriminates: >-
    An equal or higher charged S at matched N closes the lead: support reduction is cost-invisible,
    consistent with the callgrind j=0 order-6 base costing 4% more Ir. A lower S that survives
    the sham null and exceeds the sqrt(|Aut|) rho discount is a measured IC improvement on
    special-j classes, which include secp256k1.
best_measured: >-
  S_3 support 9 (j=0) / 10 (j=1728) / 13 generic (EV-ENDO-e8d3e5); j=0 order-6 base 3x signed
  points at +4% Ir (crypto perf history), no cost gain
