id: LEAD-STR-level-structure-torsor
family: structure
title: Level-structure and modular-curve reformulation of the ECDLP (pairs (E,P) as points of X_1(N), diamond-operator torsor)
mechanism: >-
  The pair (E,P) is an F_p-point of X_1(N); (E,Q) with Q = kP has the same image in X_0(N), so the DLP is
  the diamond-operator coordinate k of a torsor under (Z/N)^*/{+-1}. The hope is that modular units,
  diamond eigenfunctions, Hecke operators or monodromy words on the level structure separate the fibre
  points and expose k.
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: >-
    Three forced values decide the lens before any compute (IDEA-20260806-0c9de1): F1, rationality
    trivialises the torsor in the correct group scheme; F2, the diamond action is free except at extra
    automorphisms (j = 0 and 1728), so the fibre coordinate is exactly the secret; F3, Eichler-Shimura
    pins only the already-known diamond <p>, and the Hecke operators T_ell act compatibly and give forced
    zeros. Functions that separate fibre points (modular units, diamond eigenfunctions) have degree and
    gonality growing with N, which makes them non-evaluable at cryptographic size (rejected ECDLP-IDEA-112,
    -023, -026). No algorithmic content beyond the representation. Scope: prime N, ordinary prime-field
    curves.
  revisit_when: >-
    A function separating the fibre points of X_1(N) over X_0(N) whose degree grows slower than N^(1/2)
    and that is evaluable from (E,P) alone.
