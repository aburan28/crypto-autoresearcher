id: LEAD-STR-isogeny-class-generic-invariance
family: structure
title: Generic (rho, BSGS) ECDLP cost across an isogeny class and across volcano levels
mechanism: >-
  ECDLP transports along any F_p-isogeny of degree prime to N (T1), so if any curve in the
  class, at any volcano level or endomorphism-ring depth, were cheaper for rho or BSGS, the
  whole class would fall. The VOLC lane asked whether depth, level, conductor or a level label
  read from the group structure changes any measurable generic cost.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    Isogenous curves have F_p-isomorphic prime-order subgroups (T1), and rho and BSGS depend
    only on the group order and the automorphism group. The automorphism group is a class
    invariant except at the j=0/1728 crater. Measured with controls: the crypto 26-bit census
    of three whole volcanoes (403,168 runs, every instance carried by verified Velu maps)
    found 33/35 level ratios equivalent under TOST (±5% rho/BSGS), 0 different, and no curve
    effect beyond the isomorphic-control spread. v2.1 rho floor/crater is 1.004 [0.990, 1.016].
    40- and 48-bit volcano-rho studies found no level effect. Transport is exact and costs
    at most 1.3% of a solve.
  revisit_when: >-
    A generic-model algorithm whose cost depends on more than the group and Aut, or a level-dependent
    change in step cost (field-arithmetic model cost). The latter is a constant and belongs
    to LEAD-STR-class-representative-ic-selection.
best_measured: 33/35 level ratios equivalent (TOST ±5%), rho floor/crater 1.004 [0.990, 1.016]
