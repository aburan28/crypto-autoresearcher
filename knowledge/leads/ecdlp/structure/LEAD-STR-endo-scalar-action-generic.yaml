id: LEAD-STR-endo-scalar-action-generic
family: structure
title: Endomorphism-augmented generic and witness-lattice attacks on a prime-order subgroup
mechanism: >-
  Give a generic or lattice attack extra oracles or coordinates from efficiently computable
  endomorphisms (phi(P), phi(Q), eigenvalue relations), hoping the augmented witness lattice
  or oracle beats the sqrt(N) birthday bound. On a prime-order subgroup G every endomorphism
  acts as a scalar lambda in Z/N, so each endomorphism adds coordinates but no new congruence.
disposition: closed_obstructed
obstruction:
  kind: theorem
  statement: >-
    For G of prime order N, End(G) = Z/N, so every endomorphism-image oracle is simulable
    by group operations and Shoup's bound applies (KN-FIND-b7e091, EV-GGM-79e710, DEC-20260804-3b4258).
    Augmenting the witness lattice with r eigenvalues leaves the index at N and the meet-in-the-middle
    exponent at 1/2 (H-ENDO-001). The one EV-ENDO-001 contradiction (first minimum exactly
    1 on the J0 cells, by Vieta 1 + lambda_2 + lambda_3 = 0) is a certificate-void k-independent
    vector. It does not touch the exponent. Scope: any prime-field or binary curve, any size,
    prime-order subgroup.
  revisit_when: >-
    A proposed oracle is shown not to be GGM-simulable (it returns field data or curve data,
    resource R1/R2 in DECOMPOSITION.md, not a group element).
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-GGM-79e710.yaml
  note: incidence and endomorphism-image oracles simulable, closed at exponent 1/2
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-ENDO-001.yaml
  note: >-
