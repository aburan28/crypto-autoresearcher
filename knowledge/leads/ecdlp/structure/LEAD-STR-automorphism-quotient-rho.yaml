id: LEAD-STR-automorphism-quotient-rho
family: structure
title: Rho on E/Aut (negation, j=0 order-6, j=1728 order-4) and anything beyond sqrt(|Aut|)
mechanism: >-
  Run Pollard rho on equivalence classes under the automorphism group, which shrinks the search
  space by |Aut| and the expected steps by sqrt(|Aut|) (sqrt 2 generic, sqrt 4 at j=1728,
  sqrt 6 at j=0). The EWALK lane asked whether any walk design (orbit-choice mixing, GLV-split
  walks, full-End quotients) exceeds the sqrt(|Aut|) ceiling.
disposition: closed_known
obstruction:
  kind: literature
  statement: >-
    The automorphism quotient gives exactly a sqrt(|Aut|) constant (KR-RHO-0528e7, KR-RHO-fb88e6,
    KN-TECH-018), reproduced here: the 26-bit volcano census j=0 crater rho.cubic/rho.negation
    is 0.573 [0.562, 0.585] against 0.577 theory, and EV-ENDO-10109d puts the j=0 and j=1728
    ratio-to-ceiling at 1.0043 and 1.0442 over 20 seeds at p=100057. Quotienting by the full
    End(E) action leaves two classes and is useless, because a non-unit endomorphism has orbits
    of size ord_N(lambda), so the ceiling is sqrt(|Aut|) for any equivalence-class walk on
    a prime-order group.
  revisit_when: >-
    A canonicalisation with per-step cost kappa below 1 group operation is found for a group
    larger than Aut, or a curve class with a cheap small-orbit non-unit endomorphism is constructed
    (see LEAD-STR-small-cm-disc-nonunit-endo).
best_measured: >-
  j=0 rho.cubic/rho.negation 0.573 [0.562, 0.585] vs sqrt(1/3)=0.577 (crypto volcano census,
  26-bit)
