id: LEAD-STR-isogeny-transport-preprocessing
family: structure
title: Multi-target and preprocessing tables shared across an isogeny class
mechanism: >-
  Build one preprocessing table (BSGS, Bernstein-Lange distinguished points) on one curve
  and reuse it for targets on every curve of the class by isogeny transport, amortising precomputation
  over many curves.
disposition: closed_obstructed
obstruction:
  kind: proof
  statement: >-
    Transporting each target to the table's curve costs O(1) isogeny evaluations and reduces
    "M targets on M isogenous curves" exactly to M targets on one curve. That is the known
    single-curve multi-target and Bernstein-Lange frontier, which it ties and cannot beat
    (IDEA-20260807-406fef, IDEA-20260807-a2fb45). Transporting the table instead is dominated
    by transporting the targets, and was measured to lose against rebuild for baby-step tables
    at every odd l from 3 to 31, 1.5x to 21x with no crossover (EV-ENDO-10109d N4). It also
    needs a known path, and finding one to a specified curve is vectorization.
  revisit_when: >-
    A preprocessing object whose value is not a function of the (point, scalar) pairing, so
    not carried by target transport, is shown to beat the single-curve Bernstein-Lange frontier.
best_measured: >-
  table transport / correctly costed rebuild 1.5x (l=3) to 21x (l=31), p=50021 and 60013,
  no crossover
evidence:
- repo: crypto-autoresearcher
  path: ledger/evidence/EV-ENDO-10109d.yaml
  note: N4 transport loses against rebuild at every odd l tested
