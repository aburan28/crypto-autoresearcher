schema: crypto.autoresearch.symmetric_frontier.v2
as_of: '2026-08-25'
status: canonical_compilation_schema
supersedes_for_compilation: crypto.autoresearch.symmetric_frontier.v1
supersession_scope: >-
  Version 2 repairs the target-identity omission found by TASK-20260825-bb6d5d.
  It does not edit or rename the immutable version-1 producer artifacts. Their
  literal eleven-field comparison_key remains historical input; canonical
  dominance uses the target-qualified domain below.

frontier_definition: >-
  A frontier is the nondominated set inside one exact dominance_domain_key.
  A row marked is_frontier=true is nondominated only within the reviewed,
  admitted corpus named by that row. It is not a statement that the literature
  search is globally complete, and it is never a ranking across primitives,
  variants, notions, models, round conventions, or result kinds.

dominance_domain_key:
  identity:
    - primitive
    - primitive_variant
    - primitive_class
  comparison_key:
    - security_property
    - attacker_model
    - oracle_access
    - key_relation
    - target_component
    - round_scope
    - rounds_attacked
    - total_rounds
    - round_convention
    - result_kind
    - success_probability_convention

required_row_fields:
  identity: [row_id, primitive, primitive_variant, primitive_class]
  comparison_key:
    - security_property
    - attacker_model
    - oracle_access
    - key_relation
    - target_component
    - round_scope
    - rounds_attacked
    - total_rounds
    - round_convention
    - result_kind
    - success_probability_convention
  method: [attack_family, method_summary]
  costs: [time, data, memory, preprocessing, queries, success_probability]
  evidence:
    - practicality
    - certificate_or_artifact
    - verification_state
    - citation
    - provenance
    - retrieved_at
    - source_locator
    - exact_claim_location
  frontier: [is_frontier, dominated_by, dominance_reason, limitations]
  canonical_review:
    - disposition
    - producer_task
    - producer_frontier_value
    - target_qualified_key_sha256
    - review_refs
    - corpus_completeness

allowed_null_reason:
  - not_stated_by_source
  - not_applicable
  - source_unavailable
  - incompatible_unit_not_normalized
  - unresolved_transcription

verification_states:
  - author_reported_primary_text_read
  - independently_reproduced_internal
  - machine_verified_certificate
  - secondary_pointer_only
  - recalled_pointer_only

canonical_dispositions:
  admitted_partial_frontier: >-
    The row survived its applicable structure and source checks and is
    nondominated inside the reviewed admitted corpus for its exact target-
    qualified key. Literature completeness remains partial.
  admitted_verified_baseline_frontier_unresolved: >-
    The row's sampled primary-source fields survived review, but dominance or
    completeness is unresolved. Its canonical is_frontier value is false.
  pending_source_correction: >-
    A reviewer identified a source-level field error or omitted charged cost.
    The immutable producer row is not admitted.
  pending_completeness_successor: >-
    A primary-source attack or incomparable tradeoff was located after the
    snapshot and requires a create-only, fully structured successor plus review.
  not_individually_reviewed: >-
    The producer row remains available in the snapshot but did not receive the
    row-specific source support needed for this compilation.

dominance_rules:
  - Compare rows only when every dominance_domain_key field is identical.
  - Compare time, data, memory, preprocessing, queries, and success probability together.
  - A row dominates only if it is no worse on every comparable charged axis and strictly better on at least one.
  - Null, unresolved, qualitative, compound, or incompatible units never create a favorable ordering by inference.
  - A qualitative value such as negligible is not ordered against a numeric exponent without a source-supported bound or normalization.
  - Success probabilities or advantages with different conventions do not dominate each other.
  - Author-reported complexity and measured wall-clock/hardware expenditure remain separate result kinds.
  - The canonical compiler may set a producer frontier flag to false but may not turn a disputed or unreviewed row true.

anti_laundering_rules:
  - A differential trail is not an end-to-end distinguisher unless the source supplies the conversion and every charged cost.
  - A distinguisher is not key recovery, and partial-key recovery is not master-key recovery.
  - A semi-free-start, free-start, compression-function, or chosen-IV collision is not a standard hash collision.
  - A related-key or chosen-key result is not single-key key recovery.
  - Reduced-round reach is not a full-round break.
  - Quantum and classical rows never dominate each other.
  - A recalled-only, secondary-only, source-unavailable, or unresolved-transcription row cannot be canonical is_frontier=true.
  - Time-only comparisons never hide data, memory, preprocessing, queries, or success probability.

sha1_required_partition:
  - identical_prefix_collision_theoretical
  - identical_prefix_collision_demonstration
  - chosen_prefix_collision_theoretical
  - chosen_prefix_collision_demonstration
  - detector_or_countercryptanalysis_scope
  - reduced_round_preimage
  - reduced_round_second_preimage
  - full_round_long_message_second_preimage

