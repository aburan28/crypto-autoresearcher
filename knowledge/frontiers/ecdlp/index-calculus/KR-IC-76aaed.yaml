id: KR-IC-76aaed
area: index-calculus
kind: known_bound
title: >-
  Coppersmith reach on Semaev's fixed-target polynomial is exactly the Jochemsz–May
  generalized-rectangle bound, δ_max = 2/(m(m+1)·2^{m−1}); the monomial support is the full
  box, so Newton-polytope-aware basic strategies cannot improve it
claim: >-
  For a modular polynomial in m variables with Newton polytope N and equal root bounds
  X_i = p^δ, the Jochemsz–May basic strategy at shift level t has |M_0| ≈ Vol(N)·t^m,
  |M_k| = #((t−k)N + k·l) ≈ Vol(N)(t−k)^m for any l ∈ N, hence s_N ≈ Vol·t^{m+1}·m/(m+1),
  Σ_j s_j ≈ Vol·t^{m+1}·c_N with c_N the coordinate sum of the centroid of N, and the
  determinant condition gives δ_max = 1/((m+1)·c_N) (unequal bounds: Σ_j δ_j·centroid_j <
  1/(m+1)). For a box of degree d per variable c_N = md/2 and δ_max = 2/(m(m+1)d), the
  "generalized rectangle" of Jochemsz–May Appendix A. S_{m+1}(x_1..x_m, x_R) with x_R fixed
  has degree 2^{m−1} in each variable and, computed in Sage for S_3, S_4, S_5 (9 of 9,
  125 of 125, 6561 of 6561 box monomials present; total degree of S_n is (n−1)·2^{n−2},
  equal to free variables × degree per variable, so the box is uncut), its support is the
  full box: δ_max = 1/6, 1/24, 1/80, 1/240 for m = 2..5 against the 1/m the decomposition
  needs (the lattice must reach ∏X_i ≈ p; it reaches p^{2/((m+1)2^{m−1})}). Galbraith's
  textbook: "no efficient algorithm is known for solving [the equation] even for n = 5 ...
  Coppersmith's method seems not to be useful for this task"; Diem 2011: "no efficient
  algorithm for this task is known (except for very special equations)". No paper from 2004
  to 2026 applies lattices to summation polynomials beyond those two sentences. Scope: the
  basic strategy (and the extended shifts and symmetric rewriting measured in aburan28/crypto
  Probes B/C, which reach the same threshold) with equal bounds; provably optimal shift sets
  (Ryan, EUROCRYPT 2025) and rank-r GAP substitutions are not covered and remain the open
  step of LEAD-ICP-coppersmith-smallroot-semaev.
