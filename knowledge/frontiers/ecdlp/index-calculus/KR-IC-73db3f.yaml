title: Choosing the factor-base vector space V (small product spaces)
claim: 'In binary-field point decomposition the factor base is {P : x(P) ∈ V} for an F_2-subspace V; choosing
  V so that the product spaces V^(i) have small dimension (e.g. V = span{1, z, …, z^{l−1}} in polynomial
  basis, or subfield/linearised structure) lowers degree and variable count after Weil descent (FPPR,
  Petit–Quisquater, Huang–Petit–Shinohara–Takagi 2013); Shantz–Teske study factor-base choices experimentally.'
