id: KR-IC-889857
area: index-calculus
kind: dispute
title: Subexponential binary ECDLP under the first fall degree assumption
claim: Petit–Quisquater (2^{c·n^{2/3}·log n}, crossover n ≈ 2000), FPPR, Semaev 2015 (2^{c√(n ln n)},
  claimed below rho for some FIPS curves under 'Assumption 1', regularity ≤ 4) and Nagao 2015 (polynomial)
  all rest on first-fall-degree-type assumptions. Huang–Kosters–Yeo, Kosters–Yeo, HPST 2015 and later
  work give evidence the assumption fails for these systems; the Galbraith–Gaudry survey records no consensus
  that binary ECDLP is subexponential.
