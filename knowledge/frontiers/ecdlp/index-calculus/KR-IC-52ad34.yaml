id: KR-IC-52ad34
area: index-calculus
kind: known_negative
title: >-
  Known-log (random) factor bases over F_p and the "one relation suffices" trick are bounded
  below twice over, generically by Wagner's k-sum theorem and algebraically by the Yokoyama
  et al. Groebner floor
claim: >-
  Amadori–Pintore–Sala build the factor base from s random points R_j = u_j P + v_j Q with
  s^m ≈ q, partition it into m parts, and solve S_m(X_1..X_m) = 0, f_i(X_i) = 0 (f_i the
  split polynomial of part i, degree ≈ s/m) once; one solution gives the logarithm. Their own
  cost is (q·m^m/s^m)·T ≈ m^m Groebner solves and they write "We do not claim" to beat
  q^{1/2}. The trick cannot change the exponent: (i) with the base random, finding m base
  points with a vanishing signed sum is the k-sum problem in E(F_p); Wagner's Theorem 2
  (W. Dai) gives discrete logarithms in the same time as any cyclic-group k-sum solver, so
  every generic solver needs Ω(√p), and the k-tree algorithm needs a subgroup chain or an
  order-compatible coordinate that a prime-order E(F_p) does not have; (ii) the only
  non-generic route, Groebner bases on the split constraints, needs ≥ (m·d^{m−1})^{1−ε} field
  operations per system with d = deg f_i > 2^{m−1} (Yokoyama–Yasuda–Takahashi–Kogure, Lemma 8
  and Proposition 9, under semi-normality and genericness assumptions checked to 25 bits),
  i.e. total > q^{m(1−ε)/(m−1)}; applied to APS's own parameters this is ≈ m²·2^{m−2}·q^{(m−1)/m}
  (≈ 18·q^{2/3} at m = 3, the "at least p^{2/3}" quoted for the Kudo-accelerated variant).
  Known logs and algebraic structure on the base are mutually exclusive (a structured base has
  unknown logs and needs B relations), so the trick is a constant-factor reorganisation inside
  the generic class. McGuire–Mueller: the base is regenerated m^m/2^{m−1} times, "not only one"
  Groebner computation. Scope: prime-order E(F_p), any base defined by random points with known
  log coordinates (APS, McGuire–Mueller, distinguished points of a rho walk).
status: heuristic
