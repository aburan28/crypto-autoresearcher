id: KR-IC-585a96
area: index-calculus
kind: known_negative
title: >-
  No algebraic small set over F_p: a factor base of size B ≪ p/D cut out by degree-≤D equations
  in any number of auxiliary variables comes from a 0-dimensional variety, so its constraint
  algebra is F_p^{B^m} however it is presented; subgroup, coset and isogeny-kernel bases are
  Petit–Kosters–Messeng 2016 §3.3–3.4
claim: >-
  Let V ⊂ F_p, |V| = B, with V = π(W(F_p)) for a variety W ⊂ A^{1+r} cut out by polynomials
  of degree ≤ D and π the x-projection. By Lang–Weil, an absolutely irreducible component of
  W of positive dimension that is not contained in a fibre of π contributes ≥ (p − c·D²·√p)/D^r
  distinct x-values (fibres are 0-dimensional of size ≤ D^r by Bézout; non-absolutely-irreducible
  components have their F_p-points in a lower-dimensional intersection of conjugates); so for
  B ≪ p/D^r every point of V comes from a 0-dimensional piece or a vertical component, and B is
  bounded by the Bézout number of W. Consequently F_p[x_1..x_m]/I_W^m ≅ F_p^{B^m} by the Chinese
  remainder theorem, whether the constraint is written as one split polynomial of degree B or as
  PKM's chain x_{i,j+1} = L_j(x_{i,j}) of low-degree maps: low degree of the generators does not
  change the quotient, and the Yokoyama et al. floor applies to both. This is why PKM found
  "intriguingly" that Groebner bases on Semaev's split interval system were easier than on their
  chained system, and why Yokoyama et al.'s random-rooted, x^k − 1 and x^{k−1}+⋯+1 families all
  behave alike. Over F_{q^n} the escape is Weil restriction: V = F_q is the set of F_q-points of
  the affine line over the subfield, and "x ∈ F_q" is linear in F_q-coordinates; F_p has no
  proper subfield, so the only varieties whose F_p-points could form a base are varieties over
  F_p itself, with ≈ p^{dim} points unless 0-dimensional. Corollaries: bit-descent
  (x_i = Σ_j x_{ij}2^j, x_{ij}² = x_{ij} over F_p) lands in the split algebra F_p^{2^N}, and any
  polynomial map F_p → S has degree ≥ p/|S|, so no low-degree projection of F_p to a small set
  exists; multiplied bases ∪_{k≤N}[k](F) or endomorphism orbits enlarge the enumeration by the
  same factor they add. The multiplicative-subgroup base {x : x^B = 1} and its cosets are PKM
  §3.3 (smooth-order subgroup, chain of x^{p_j}), the auxiliary-curve isogeny-kernel coset base
  is PKM §3.4, and both were tested at m = 2 up to p ≈ 2^22 with growing degree of regularity.
  Scope: prime-order E/F_p; bases described algebraically over F_p; the lemma is a derivation
  recorded with the decision, not a peer-reviewed theorem; non-algebraic (size-defined) bases are
  the lattice case of KR-IC-76aaed.
