title: Largest practical algebraic ECDLP computations
claim: Cover-and-decomposition index calculus solved a 149-bit prime-order subgroup of E(F_{p^6}) in ~110,000
  CPU-hours (Joux–Vitse, EUROCRYPT 2012); GLS-assisted GHS descent broke a prime-order subgroup over F_{2^{5·31}}
  in ~1,035 CPU-days (Chi-Domínguez–Rodríguez-Henríquez–Smith 2021). No summation-polynomial method has
  beaten rho on a cryptographic-size prime-field or prime-degree binary curve.
