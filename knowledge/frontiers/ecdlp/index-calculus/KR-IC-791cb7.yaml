id: KR-IC-791cb7
area: index-calculus
kind: known_mechanism
title: Weak binary fields under GHS and generalized GHS with isogeny walks (Menezes-Teske-Weng, Menezes-Teske), with the exact densities and costs
claim: >-
  Over F_{2^N}, N = n l composite, the (generalized) GHS descent plus a
  Galbraith-Hess-Smart isogeny walk gives, for N in [160, 600]: N = 5l weak
  (every non-subfield curve has magic number 5, genus 15 or 16 over F_{2^l},
  exactly 2^{4l+1}-2 classes genus 15; Enge-Gaudry R1 ~ (128l-288) 2^{l+43}
  F_{2^l}-mults, R2 ~ 2^{2l+2} mod-r mults, versus rho ~ 2^{2.5l+2}
  F_{2^N}-mults; speedup 2^6 at N = 185 to 2^69 at N = 600 on 2003 timing
  ratios); N = 210 particularly weak (2^13 for all curves, 2^20 for the
  quarter with Tr(a) = Tr(b) = 0, equivalently 8 | #E, via the (n, m) = (6, 5)
  family of density 2^-(N/6-1) = 2^-34 reached by a ~2^34-step walk costing
  ~2^60 F_{2^210}-operations plus O(2^{N/4}) for the explicit isogeny); N = 3l
  partially weak (genus-3 hyperelliptic family Ord_b = X^2+X+1 of density
  2^-(l-1) in the #E = 0, 2 (mod 8) classes, q/2 walk steps, Gaudry-Thome
  O(q^{4/3})); N = 6l potentially weak (Hess genus-14 family of density ~1,
  genus-12 family of density 2^-(l-1)); N = 7l potentially partially weak
  (Hess genus-7 family in the Tr(a) = 0 half, density ~2^-(2l+1), 2q^2 walk
  steps; Tr(a) = 1 open); N = 8l potentially partially weak (genus 24 or 32,
  density 2^-(2l-1) in the 8 | #E classes); N = 4l only slightly weak (genus 8);
  N prime, and N not divisible by 3, 5, 6, 7, 8, not weak under either attack.
  "Weak" means cheaper than the hardest rho instance over the same field, in
  time only; no field is known to be bad (every instance feasible). The
  Hess-family densities rest on Assumptions A, B (non-hyperelliptic Jacobian
  costs) and C (uniform density across endomorphism classes); the n = 5 and
  n = 3 results do not need A or B. A curve defined over a proper subfield
  is not weakened by GHS at all (the descent map kills the large subgroup,
  Maurer-Menezes-Teske Remark 21); for the ANSI X9.62 c2pnb176w1 curve the
  best isogenous instance (n, m) = (8, 5), genus 16 over F_{2^22}, would
  cost 2^61 to 2^65 against rho 2^87 but has density ~2^-66 in the class and
  was judged harder to reach than rho; no Menezes-Teske paper reports it
  broken.
status: heuristic
setting:
  field: binary
  curve_family: ordinary non-subfield
  model: single_target
cost: >-
  N = 210: rho 2^110.5, GHS n = 5 relations 2^97 / matrix 2^89, n = 6
  relations 2^90 / matrix 2^75 (F_{2^l}-multiplications, 2003 PII timing
  ratios); walk 2^60 F_{2^210}-ops. N = 600: rho 2^306.5, thinned
  Enge-Gaudry 2^237 / 2^238. N = 161: 2^94 of 2^162 classes descend to genus
  7/8 over F_{2^23} with relations 2^37, matrix 2^47 versus rho 2^80 EC
  additions, but no walk into those classes is known.
