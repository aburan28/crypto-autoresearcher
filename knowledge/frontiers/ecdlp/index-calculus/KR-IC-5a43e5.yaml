id: KR-IC-5a43e5
area: index-calculus
kind: known_mechanism
title: Semaev summation polynomials
claim: S_m(x_1,…,x_m) vanishes exactly when points with those x-coordinates sum to O (with some signs);
  S_2 = x_1 − x_2, S_3 explicit, S_m = Res_X(S_{m−k+1}, S_{k+1}); degree 2^{m−2} in each variable. Using
  them to decompose points over a factor base is the index-calculus framework itself — novelty must lie
  in representation, factor base, elimination or solver, never in 'use summation polynomials'.
