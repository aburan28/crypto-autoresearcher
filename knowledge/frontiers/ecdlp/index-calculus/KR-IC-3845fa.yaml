id: KR-IC-3845fa
area: index-calculus
kind: known_bound
title: >-
  Product/norm formulation of the prime-field point decomposition problem — one-dimensional
  norms over intervals (Õ(√B), Bostan–Gaudry–Schost) and subgroups (Õ(log B), resultant with
  X^B − 1) are sublinear, but the m-fold norm costs Õ(B^{m−1}) with known tools, at or above
  enumeration and above meet-in-the-middle
claim: >-
  For a split base V and target z the PDP is "is N_V(z) := ∏_{u ∈ V^m} S_{m+1}(u, z) zero?", the
  norm of S_{m+1} from the algebra F_p[x]/(g_V(x_i)) (the extended-Euclid structure of Yokoyama
  et al. in another guise; PKM's generalized root-finding Problem 1). One-dimensional norms are
  sublinear in |V| = B: for V = μ_B, ∏_{u∈μ_B} g(u) = Res(g, X^B − 1) from X^B mod g in
  Õ(deg g · log B); for V = [0, B), ∏_{u<B} g(u) by Bostan–Gaudry–Schost baby-step/giant-step
  in Õ(√B · deg g). So the last variable of a decomposition costs polylog or √B instead of B.
  The next level is a product over a polynomial of degree 2^{m−1}·B (the resultant in the last
  variable), costing Õ(B) for subgroups and Õ(B^{3/2}) for intervals; a direct two-dimensional
  baby/giant split with s² baby steps produces a bivariate baby polynomial with ≈ 4s⁴
  coefficients and costs B^{4/3}. All known routes are ≥ B (enumeration) and the m-fold norm
  is ≥ Õ(B^{m−1}), against the MITM table's B^{⌈m/2⌉}. Checked numerically (p = 65537, B = 64,
  both a j = 0 and a random curve): the degree-8064 polynomial Ψ_2(z) = ∏_{u≠v∈V} S_3(u,v,z)
  has 8034-8065 nonzero coefficients for the subgroup μ_64 and the interval [0,64) — dense, no
  compact representation to exploit. The only collapse found is for a linear polynomial:
  Res(X^B − 1, (X+a)^B − 1) = a^B ∏_{u∈μ_e}(a^B − u)^{r_u} with e = (p−1)/B and r_u the
  cyclotomic numbers of order e (verified for p = 10009, B = 72), and it still costs ≥ e = p/B
  per evaluation plus Õ(√p) per cyclotomic number. Scope: split bases over F_p of either type;
  solvers that evaluate or eliminate; the multidimensional problem (∏_{u∈[0,B)^4} S_5(u,z) in
  B^{1−ε}, which an m = 4 oracle would need) has no known algorithm and is KN-OPEN-1fa083.
