id: KR-IC-dbf1b0
area: index-calculus
kind: known_negative
title: >-
  Every Groebner, hybrid or GCD decomposition route on a split prime-field base is dominated by
  meet-in-the-middle enumeration; McGuire–Mueller's Algorithm 4.1 (sum m−1 base points, test
  membership) is the enumeration oracle and the literature's best prime-field index calculus
claim: >-
  For a split factor base of size d ≈ p^{1/m} the Groebner floor per decomposition is
  m·2^{m−1}·d^{m−1} (Yokoyama et al.), whereas a pair/half-sum table decides the same
  membership in d^{⌈m/2⌉} lookups; the ratio d^{⌊m/2⌋−1}·m·2^{m−1} ≥ 1 for every m ≥ 2.
  Kudo–Yokota–Takahashi–Yasuda's hybrid method (fix some variables, Groebner on the rest)
  pays the floor on the remaining variables, so it costs ≥ d^{m−1} > d^{⌈m/2⌉}; their GCD
  solving gcd(f_3(x_1, x_Q, x_R), f(x_1)) computes the same set as x(R ∓ F_i) by direct
  subtraction, at Õ(d) instead of O(d). McGuire–Mueller's Algorithm 4.1 costs O(p) per
  logarithm with a random base of size s ≥ (m−2) log² p and is "the best index calculus
  algorithm for prime order fields at the present time"; their Groebner (Algorithm 2.5)
  estimate is O(p^{ω−ω/m}) and their pointwise-evaluation Algorithm 3.1 is O(p log² p),
  both "worse than the well known square-root algorithms such as Pollard-Rho". With a
  structured base of size p^{1/m} and the pair table the total is ≈ m!·p^{1/2+1/m}
  (Semaev's t_{p,n}·p^{1/n} with t = p^{1/2}; PKM's break-even is a per-system cost below
  p^{1/2−1/m}). Scope: prime-order E(F_p), bases given by a split univariate polynomial
  (random, interval, subgroup, isogeny coset); oracles that read coordinates only through
  the group law or through Groebner bases on split constraints.
status: heuristic
