title: Symmetries and torsion speed up point decomposition
claim: Exploiting S_m symmetry and small-order torsion (twisted Edwards / Jacobi models, 2- and 4-torsion)
  reduces PDP cost by about 2^{ω(n−1)}; FGHR estimate ~2^130 word operations for twisted Edwards curves
  over F_{q^5}, q ≈ 2^64 (vs 2^160 generic). Symmetrised summation polynomials (FHJRV) use small-order
  torsion to shrink systems further.
