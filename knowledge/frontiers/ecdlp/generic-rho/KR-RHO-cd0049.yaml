id: KR-RHO-cd0049
area: generic-rho
kind: known_bound
title: 'Measured (toy, prime): negation-map BSGS at 1.160 [1.068, 1.248] x the generic floor with a 0.50 sqrt(r) table'
claim: >-
  On four prime-order toy curves (log2 r 17.70, 19.10, 21.22, 23.97; 18- to
  24-bit prime fields; A = 2), bsgs.negation measures 1.160 [1.068, 1.248]
  times the generic floor sqrt(pi/4) in ecbench.gae (group-addition
  equivalents), fitted alpha 0.460 [0.377, 0.502], storing 0.5015 [0.5005,
  0.5028] table entries per sqrt(r), 96 verified runs, table inserts and
  lookups counted but not charged. Paired against rho.negation on the same
  frozen workloads (standing challenge ECCH1h904625668686, epoch 1) it reads
  TRADE: 0.8250 [0.725, 0.945] of the walk's operations for 15.79 [13.38,
  19.06] times its table. A new Pareto point, not a dominating one; no
  exponent moved. Sealed bound ECBND1he0aea8671f10, verdict
  ECVD1h0b0f5e0d7f67, aburan28/crypto commit
  031811fb80958a2efa9a75d0793a8d9f136fdee9.
