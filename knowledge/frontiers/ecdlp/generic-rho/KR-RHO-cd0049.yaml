  Checked against the generic-rho rows on disk and the rebuilt frontier
  ECFR1h8b45b672c283: no row improves on both ops and memory. In the sealed
  frontier the prime-toy ops leader is the earlier calibration bsgs.negation
  bound ECBND1he8163c29cc39 (1.100 [0.978, 1.225]), whose interval overlaps
