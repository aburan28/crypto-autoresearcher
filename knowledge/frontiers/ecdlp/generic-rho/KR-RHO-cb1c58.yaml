id: KR-RHO-cb1c58
area: generic-rho
kind: known_mechanism
title: Simultaneous (batched) inversion
claim: Montgomery's trick computes n field inversions with one inversion plus about 3(n−1) multiplications,
  so affine-coordinate rho steps are batched across many walks (one inversion per batch). Product-tree
  variants and their GPU/SIMD scheduling are engineering on this trick.
