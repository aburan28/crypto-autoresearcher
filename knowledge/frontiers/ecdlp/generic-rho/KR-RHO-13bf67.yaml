title: Generic-group lower bound for discrete logarithms
claim: In the generic group model any algorithm computing discrete logarithms in a group of prime order
  p needs Ω(√p) group operations; Pollard rho meets this up to a constant. No generic algorithm (one using
  only group operations and equality) beats √p; a sub-√ ECDLP algorithm must exploit the representation.
