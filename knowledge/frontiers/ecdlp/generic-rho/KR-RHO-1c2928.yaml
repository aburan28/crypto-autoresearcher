id: KR-RHO-1c2928
area: generic-rho
kind: known_bound
title: 'Measured (toy, Koblitz): lean signed-Frobenius rho at 4.996 [2.985, 7.374] x the generic floor; beats the strong lock-step reference at the constant level because the reference set-up is 71 % of its total at these sizes'
claim: >-
  On four toy Koblitz curves over F_{2^n}, n in {17, 19, 23, 29} (log2 r
  15.37, 16.00, 17.00, 21.00; A = 2n usable automorphisms), rho.signed_frobenius
  with cap_multiple = 64 measures 4.996 [2.985, 7.374] times the generic
  floor sqrt(pi / 4n) in ecbench.gae, fitted alpha 0.229 [-0.013, 0.491]
  (fixed-cost signature, not a law; r_squared 0.379), storing 0.0167 [0.0100,
  0.0217] table entries per sqrt(r), 96 verified runs, canonicalisations
  counted but not charged. Paired against rho.signed_frobenius_strong
  (dp_bits 4, lanes 32, step_cap_factor 2000) on the same frozen workloads
  (standing challenge ECCH1h76d71da2a89c, epoch 1) it reads ADVANCES at the
  CONSTANT level: 0.2991 [0.235, 0.402] of the strong walk's operations and
  0.560 [0.483, 0.656] of its table, the move located in setup (incumbent
  setup share 0.713 vs candidate 0.356). This is a statement about the strong
  reference walk's fixed 32-lane set-up at sizes where sqrt(r) is a few
  hundred; it says nothing about medium scale, where the strong walk's own
  sealed bound ECBND1h05a2ea918f3c reads 1.089 [0.927, 1.261] x floor over
  degrees 41-61. Sealed bound ECBND1hbc8602528f48, verdict ECVD1h53a3dfe36118,
  aburan28/crypto commit 031811fb80958a2efa9a75d0793a8d9f136fdee9.
