id: KR-RHO-46c2c6
area: generic-rho
kind: known_bound
title: Multi-target and batch discrete logarithms
claim: Solving L discrete logs in one group by reusing distinguished points costs about √(2Ln) in total
  rather than L·√n (Kuhn–Struik); multi-user collision frameworks (Fouque–Joux–Mavromati) and generic
  lower bounds (Yun 2015) make this tight. A 'batch speedup' over per-target rho is this effect unless
  it beats √(L·n).
