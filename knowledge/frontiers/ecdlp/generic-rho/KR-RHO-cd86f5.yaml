id: KR-RHO-cd86f5
area: generic-rho
kind: known_mechanism
title: r-adding walks and the walk constant
claim: Teske's r-adding walks with r of about 16–20 behave close to a random mapping; smaller r measurably
  costs extra iterations, and additive walks lose a small constant to local anti-collisions. Choosing
  r and measuring the resulting walk constant is established practice, not a new mechanism.
