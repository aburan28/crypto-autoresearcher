id: KR-RHO-fb88e6
area: generic-rho
kind: known_mechanism
title: 'Negation map: sqrt(2) gain and fruitless cycles'
claim: Walking on {±P} classes gives a √2 reduction in expected iterations but creates fruitless cycles
  (2-cycles with probability about 1/(2r) per step for r-adding walks, plus longer cycles and recurring
  cycles under naive escapes). Best practical gain was 1.29 (Bos–Kleinjung–Lenstra 2010); branch-free
  cycle handling reaches close to √2 (Bernstein–Lange–Schwabe 2011, 362 cycles/iteration on Cell for secp112r1);
  measured 0.947·√2 on P-256 (Bos–Costello–Miele 2014).
