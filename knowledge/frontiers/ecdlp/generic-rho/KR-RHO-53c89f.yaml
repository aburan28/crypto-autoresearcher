title: Transfer attacks apply only to special curves
claim: MOV/Frey–Rück reduce ECDLP to a finite-field DLP when the embedding degree is small; Semaev/Satoh–Araki/Smart
  solve anomalous (trace-one) curves in polynomial time. Generic curves have astronomically large embedding
  degree and trace ≠ 1, so these are curve checks, not ECDLP algorithms.
