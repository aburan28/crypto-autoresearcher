id: KR-RHO-482ed3
area: generic-rho
kind: known_mechanism
title: 'Koblitz signed-Frobenius rho: sqrt(m) beyond negation'
claim: >-
  On a Koblitz (anomalous binary) curve over F_{2^m}, when Frobenius has exact
  order m on the target prime-order subgroup, the 2m-element classes of
  <sigma,-1> give random-map expectation sqrt(pi*r/(4m)). The reduction is
  sqrt(m) against the same curve's negation-only baseline sqrt(pi*r/4), and
  sqrt(2m) only against unquotiented rho sqrt(pi*r/2). This is an expected
  transition count, not measured time: orbit canonicalization, distinguished
  points, collision recovery, and verification remain charged.
status: proven
