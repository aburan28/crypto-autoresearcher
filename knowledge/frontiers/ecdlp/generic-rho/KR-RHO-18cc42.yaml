title: 'ECC2K-130: expected work and 2009–2010 implementation rates'
claim: 'Breaking ECC2K-130 needs about 2^60.9 iterations (≈2^77 bit operations). Published rates: Core
  2 quad 22.45M it/s (≈530 cycles/iteration/core); Cell/PS3 27.67M it/s (749 cycles/iteration/SPU; <2700
  PS3s for one year); GTX 295 >63M it/s; Spartan-3 33.67M it/s (2009) and 111M it/s (Fan et al. 2010,
  as cited); 90 nm ASIC estimate 800M it/s. No completed solution has been published (checked 2026-09-26).'
