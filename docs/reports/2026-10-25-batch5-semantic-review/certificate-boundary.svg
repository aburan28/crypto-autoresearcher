<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Batch-five discriminant certificate boundaries</title>
  <desc id="desc">Exact literal arithmetic and abstract order norm are checked. Primality of listed factors is needed for a fundamental discriminant. A named curve model and trace are needed for an endomorphism statement.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34495e"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#f7fafc"/>
  <text x="34" y="48" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Exact arithmetic, conditional meaning</text>
  <text x="34" y="76" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">gost/gost512 literal card · reviewed source 9e0431c · batch BATCH-54bc4d</text>

  <rect x="34" y="110" width="440" height="150" rx="12" fill="#e5f4f1" stroke="#16806f" stroke-width="2"/>
  <text x="56" y="142" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#07574d">Checked literal integers</text>
  <text x="56" y="174" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">p + 1 − t = n</text>
  <text x="56" y="202" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">N = 4p − t² = product of listed factors</text>
  <text x="56" y="231" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">Lean · blind arithmetic · mutation control</text>

  <rect x="526" y="110" width="440" height="150" rx="12" fill="#e5f4f1" stroke="#16806f" stroke-width="2"/>
  <text x="548" y="142" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#07574d">Checked abstract order</text>
  <text x="548" y="174" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">D₀ = −N;  D₀ ≡ 1 (mod 4)</text>
  <text x="548" y="202" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#172b4d">least nonscalar norm = (N + 1) / 4</text>
  <text x="548" y="231" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">2⁵⁰⁹ ≤ norm &lt; 2⁵¹⁰</text>

  <path d="M255 260 V304" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M746 260 V304" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="34" y="314" width="440" height="170" rx="12" fill="#fff2dc" stroke="#bb7a19" stroke-width="2"/>
  <text x="56" y="347" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#82520c">Premise: listed factors are prime</text>
  <text x="56" y="379" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172b4d">Then N is squarefree, D₀ is fundamental, f = 1.</text>
  <text x="56" y="411" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">Archived GP replay reports isprime = 1.</text>
  <text x="56" y="438" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">Lean retains the prime condition explicitly.</text>

  <rect x="526" y="314" width="440" height="170" rx="12" fill="#fbe9ea" stroke="#af4f58" stroke-width="2"/>
  <text x="548" y="347" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#8a3038">Separate named-curve bridge</text>
  <text x="548" y="379" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#172b4d">Prime field · actual trace · ordinary-curve theory</text>
  <text x="548" y="411" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">No formal map from this card to End(E).</text>
  <text x="548" y="438" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#53657a">No curve endomorphism-degree conclusion here.</text>

  <text x="34" y="526" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#53657a">Boundary finding: the frozen target calls the odd-factor product “squarefree” before its prime premise is proved.</text>
</svg>
