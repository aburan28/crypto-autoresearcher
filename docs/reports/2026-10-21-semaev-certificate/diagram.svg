<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
  <title id="title">Semaev decomposition certificate decision boundary</title>
  <desc id="desc">A raw tuple of finite-field coordinate pairs passes an explicit Weierstrass equation check, a finite coefficient search for span membership, and a curve-group sum check. A Lean theorem equates a true decision result with the mathematical predicate. It does not assert that a decomposition exists or is likely.</desc>
  <rect width="1060" height="430" fill="#f8fafc"/>
  <text x="38" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172338">Finite-field decomposition certificate checker</text>
  <text x="38" y="70" font-family="Arial,sans-serif" font-size="15" fill="#46566c">THM-SEMAEV-FALL1 Lemma 3 / frozen task TASK-20260916-b55948 / Lean 4.35.0-rc1</text>
  <g font-family="Arial,sans-serif" fill="#172338">
    <rect x="38" y="105" width="210" height="110" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="55" y="138" font-size="18" font-weight="700">Raw certificate</text>
    <text x="55" y="165" font-size="15">m coordinate pairs</text>
    <text x="55" y="189" font-size="15">target curve point R</text>
    <rect x="278" y="105" width="230" height="110" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="295" y="138" font-size="18" font-weight="700">Curve equation</text>
    <text x="295" y="165" font-size="15">explicit field arithmetic</text>
    <text x="295" y="189" font-size="15">invalid pairs rejected</text>
    <rect x="538" y="105" width="230" height="110" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="555" y="138" font-size="18" font-weight="700">Declared F-span</text>
    <text x="555" y="165" font-size="15">finite coefficient search</text>
    <text x="555" y="189" font-size="15">exact x membership</text>
    <rect x="798" y="105" width="224" height="110" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="815" y="138" font-size="18" font-weight="700">Group sum</text>
    <text x="815" y="165" font-size="15">Mathlib curve addition</text>
    <text x="815" y="189" font-size="15">sum equals R</text>
    <rect x="38" y="260" width="478" height="90" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="55" y="292" font-size="18" font-weight="700">Kernel-checked theorem</text>
    <text x="55" y="319" font-size="15">decide = true iff curve, span and group conditions hold</text>
    <rect x="544" y="260" width="478" height="90" rx="11" fill="#fff1dc" stroke="#b6832c" stroke-width="2"/>
    <text x="561" y="292" font-size="18" font-weight="700">Empirical questions remain</text>
    <text x="561" y="319" font-size="15">existence rate, solver cost and ECDLP impact need data</text>
  </g>
  <g stroke="#6a7d91" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M248 160 H272"/><path d="M508 160 H532"/><path d="M768 160 H792"/>
    <path d="M908 215 V238 H277 V254"/>
  </g>
  <g fill="#6a7d91"><path d="M272 160 l-9 -6 v12z"/><path d="M532 160 l-9 -6 v12z"/><path d="M792 160 l-9 -6 v12z"/><path d="M277 254 l-6 -9 h12z"/></g>
  <text x="38" y="394" font-family="Arial,sans-serif" font-size="14" fill="#46566c">The target receipt proves correctness of the predicate; it does not validate a particular archived run or measurement.</text>
</svg>
