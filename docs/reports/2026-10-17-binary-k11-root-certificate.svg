<text class="small" x="293" y="187">8 memberships</text>
<text class="small" x="293" y="209">7 field equations</text>
<text class="small" x="293" y="231">8 curve point lifts</text>
<path d="M479 191 H512" stroke="#64748b" stroke-width="2"/>
