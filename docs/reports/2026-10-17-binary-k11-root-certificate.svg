<text class="small" x="771" y="187">signed log columns</text>
<text class="small" x="771" y="209">[4] subgroup check</text>
<text class="small" x="771" y="231">distinct-row count</text>
<text class="small" x="490" y="324" text-anchor="middle">Synthetic known-point controls pass for both bases and four channel labels; archived targets remain untested by a solver.</text>
<text class="small" x="490" y="354" text-anchor="middle">A parsed root alone is neither a relation-yield sample nor an end-to-end index-calculus result.</text>
