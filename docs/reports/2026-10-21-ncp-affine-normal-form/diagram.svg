<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="440" viewBox="0 0 1060 440" role="img" aria-labelledby="title desc">
  <title id="title">NCP affine normal-form proof and implementation boundary</title>
  <desc id="desc">A word over translations and negation is evaluated left to right. The Lean theorem proves its action equals a sign times the starting point plus a signed translation sum. The archived instrument uses the same convention, but the theorem does not verify its elliptic curve arithmetic or performance.</desc>
  <rect width="1060" height="440" fill="#f8fafc"/>
  <text x="38" y="42" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172338">NCP word action: proved algebra, bounded implementation replay</text>
  <text x="38" y="69" font-family="Arial,sans-serif" font-size="15" fill="#46566c">Source claim: THM-COMMUTATOR-KERNEL1 Lemma 1 / Lean 4.35.0-rc1 / task TASK-20260822-a0e34f</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#172338">
    <rect x="38" y="102" width="284" height="91" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="55" y="133" font-weight="700">Word w, leftmost letter first</text>
    <text x="55" y="160">t_i: X to X + s_i P; neg: X to -X</text>
    <rect x="388" y="102" width="284" height="91" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="405" y="133" font-weight="700">Shadow (sign, counts)</text>
    <text x="405" y="155">sign = (-1)^#neg</text>
    <text x="405" y="179">count signs use negs to right</text>
    <rect x="738" y="102" width="284" height="91" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="755" y="133" font-weight="700">Lean theorem, all words</text>
    <text x="755" y="155">action = sign*X</text>
    <text x="755" y="179">+ (sum a_i*s_i)*P</text>
    <rect x="38" y="249" width="456" height="96" rx="11" fill="#edf3ff" stroke="#5f7eaf" stroke-width="2"/>
    <text x="55" y="280" font-weight="700">Archived EXP-NCP-001 replay</text>
    <text x="55" y="306">12/12 value sets; 12,000 shadow words</text>
    <text x="55" y="328">0 mismatches on recorded toy inputs</text>
    <rect x="568" y="249" width="454" height="96" rx="11" fill="#fff1dc" stroke="#b6832c" stroke-width="2"/>
    <text x="585" y="280" font-weight="700">Further obligations</text>
    <text x="585" y="306">Kernel ideal, reachability and code refinement</text>
    <text x="585" y="328">No speed or ECDLP-cost theorem</text>
  </g>
  <g stroke="#6a7d91" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M322 148 H382"/><path d="M672 148 H732"/>
    <path d="M266 249 V204 H880 V200" stroke-dasharray="7 6"/>
    <path d="M880 200 V224 H795 V244"/>
  </g>
  <g fill="#6a7d91"><path d="M382 148 l-9 -6 v12z"/><path d="M732 148 l-9 -6 v12z"/><path d="M880 200 l-6 9 h12z"/><path d="M795 244 l-6 -9 h12z"/></g>
  <text x="38" y="390" font-family="Arial,sans-serif" font-size="14" fill="#46566c">Dashed link: matching word convention and archived synthetic checks, not a formal proof about Sage or elliptic-curve code.</text>
  <text x="38" y="412" font-family="Arial,sans-serif" font-size="14" fill="#46566c">The theorem quantifies over the word and an arbitrary additive group; its target receipt still requires independent semantic review.</text>
</svg>
