<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#597187"/></marker></defs>
<rect width="1200" height="630" fill="#fbfcfe"/>
<text x="55" y="55" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#1c3448" text-anchor="start">Orbit-base evidence to full index-calculus cost</text>
<text x="55" y="91" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#4c657a" text-anchor="start">Accepted finite receipts feed a new same-point, cold-job gate; their ratios are not combined.</text>
<rect x="55" y="132" width="505" height="142" rx="16" fill="#edf3f8" stroke="#85a6bf" stroke-width="2"/>
<text x="78" y="167" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c3448" text-anchor="start">N53 complete IC comparator</text>
<text x="78" y="199" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1c3448" text-anchor="start">Cold IC median: 3.081 s</text>
<text x="78" y="225" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1c3448" text-anchor="start">Paired IC / strengthened rho: 3.295</text>
<text x="78" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#526c80" text-anchor="start">75-column signed Frobenius-orbit base</text>
<rect x="640" y="132" width="505" height="142" rx="16" fill="#eaf6f1" stroke="#75ad99" stroke-width="2"/>
<text x="663" y="167" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1c3448" text-anchor="start">N23 point-decomposition receipt</text>
<text x="663" y="199" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1c3448" text-anchor="start">Canonical / expanded, 512 queries: 0.647</text>
<text x="663" y="225" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#1c3448" text-anchor="start">Table saved time; queries cost slightly more</text>
<text x="663" y="251" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#527366" text-anchor="start">Different curve, base, and target panel</text>
<path d="M310 276 L440 321" fill="none" stroke="#597187" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M890 276 L760 321" fill="none" stroke="#597187" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="310" y="323" width="580" height="115" rx="16" fill="#fff4dc" stroke="#d6a44a" stroke-width="2"/>
<text x="600" y="359" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#1c3448" text-anchor="middle">Proposed N53 same-base integration</text>
<text x="600" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1c3448" text-anchor="middle">A  Exact support + inverse witness replay</text>
<text x="600" y="414" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1c3448" text-anchor="middle">B  Paired complete IC + matched rho on unseen points</text>
<path d="M600 440 L600 477" fill="none" stroke="#597187" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="145" y="478" width="910" height="91" rx="16" fill="#f3f0fb" stroke="#9b89bf" stroke-width="2"/>
<text x="600" y="511" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1c3448" text-anchor="middle">Full cost: base selection + build + table + relations + rank/LA</text>
<text x="600" y="540" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#1c3448" text-anchor="middle">+ target extraction + certificates + verification + I/O; CPU, wall, RSS</text>
<text x="55" y="606" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#455f72" text-anchor="start">Next: freeze target-blind elite-base selection separately; 50–63-bit prime/binary and m=2..8 remain open.</text>
