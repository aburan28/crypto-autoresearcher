<svg xmlns="http://www.w3.org/2000/svg" width="920" height="375" viewBox="0 0 920 375">
<rect width="920" height="375" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:17px}.small{font-size:14px;fill:#475569}</style>
<text class="title" x="55" y="45">Same-width binary factor-base control</text>
<text class="small" x="55" y="73">One GF(2^61) curve; both bases use 11-bit coordinates and 316 projected columns.</text>
<text class="label" x="55" y="146">Weighted cut</text>
<rect x="242" y="122" width="293" height="37" rx="4" fill="#14965a"/>
<text class="label" x="548" y="147">1,276 attempts</text>
<text class="label" x="55" y="238">Local random</text>
<rect x="242" y="214" width="470" height="37" rx="4" fill="#2563eb"/>
<text class="label" x="725" y="239">2,048 attempts</text>
<text class="small" x="55" y="320">632 accepted raw coordinates each; 194 of 316 projected columns overlap.</text>
<text class="small" x="55" y="346">Input preparation counts only; no relation, solver, degree, rank or ECDLP timing.</text>
</svg>
