<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc">
  <title id="title">NCP shadow reachability and shortest-word construction</title>
  <desc id="desc">A shadow with signed translation vector a needs at least the L1 weight of a translation letters. The sign and negative coordinates require zero, one, or two negations. Three explicit word forms attain the bound.</desc>
  <rect width="1060" height="470" fill="#f8fafc"/>
  <text x="38" y="43" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#172338">NCP shadow reachability: exact minimum word length</text>
  <text x="38" y="71" font-family="Arial,sans-serif" font-size="15" fill="#46566c">THM-COMMUTATOR-KERNEL1 Lemma 2(b) / TASK-20260822-3dd086 / Lean 4.35.0-rc1</text>
  <rect x="38" y="98" width="984" height="75" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
  <text x="56" y="130" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">Reachable at degree d  iff  L1(a) + m(e,a) &lt;= d</text>
  <text x="56" y="155" font-family="Arial,sans-serif" font-size="15" fill="#46566c">L1(a) = sum |a_i|; T+ lists positive counts; T- lists negative counts; v is negation.</text>
  <g font-family="Arial,sans-serif" fill="#172338">
    <rect x="38" y="210" width="300" height="122" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="56" y="244" font-size="18" font-weight="700">e = +1, all a_i nonnegative</text>
    <text x="56" y="273" font-size="17">m = 0</text>
    <text x="56" y="301" font-size="16">word: T+</text>
    <rect x="380" y="210" width="300" height="122" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="398" y="244" font-size="18" font-weight="700">e = -1</text>
    <text x="398" y="273" font-size="17">m = 1</text>
    <text x="398" y="301" font-size="16">word: T-  v  T+</text>
    <rect x="722" y="210" width="300" height="122" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="740" y="244" font-size="18" font-weight="700">e = +1, some a_i negative</text>
    <text x="740" y="273" font-size="17">m = 2</text>
    <text x="740" y="301" font-size="16">word: T+  v  T-  v</text>
    <rect x="38" y="366" width="984" height="65" rx="11" fill="#fff1dc" stroke="#b6832c" stroke-width="2"/>
    <text x="56" y="394" font-size="17" font-weight="700">Lower bound:</text>
    <text x="186" y="394" font-size="16">L1(a) &lt;= number of translations; parity and any negative count force m(e,a) negations.</text>
    <text x="56" y="416" font-size="14" fill="#46566c">The construction reaches equality for every integer vector a, every factor-base size B, and both allowed signs.</text>
  </g>
  <g stroke="#6a7d91" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M188 173 V204"/><path d="M530 173 V204"/><path d="M872 173 V204"/>
  </g>
  <g fill="#6a7d91"><path d="M188 204 l-6 -9 h12z"/><path d="M530 204 l-6 -9 h12z"/><path d="M872 204 l-6 -9 h12z"/></g>
</svg>
