<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330"><rect width="1000" height="330" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#183247}.h{font-size:20px;font-weight:bold}.b{font-size:16px}</style><text x="28" y="35" class="h">PROPOSED: compact known-endomorphism certificate; no expanded-map score</text><g fill="#fff" stroke="#477c9c" stroke-width="2"><rect x="25" y="65" width="290" height="155" rx="9"/><rect x="355" y="65" width="290" height="155" rx="9"/><rect x="685" y="65" width="290" height="155" rx="9"/></g><g class="b"><text x="42" y="95">Exact secp256k1 E/Fp → same E</text><text x="42" y="124">p = 2^256 − 2^32 − 977; a=0,b=7</text><text x="42" y="153">Pin full (p,a,b,n,G), beta</text><text x="42" y="182">phi(x,y) = (beta*x,y)</text><text x="372" y="95">Prime / norm proof obligations</text><text x="372" y="124">ell = 2^8191 − 1; LL replay</text><text x="372" y="153">unreduced signed a,b</text><text x="372" y="182">deg(alpha) = a² − ab + b²</text><text x="702" y="95">Independent point evaluation</text><text x="702" y="124">alpha = [a] + [b]phi</text><text x="702" y="153">dual, source and mutation checks</text><text x="702" y="182">points alone do not prove degree</text></g><g stroke="#477c9c" stroke-width="2" stroke-dasharray="6 5"><path d="M315 140H350"/><path d="M645 140H680"/></g><text x="28" y="264" class="h">Required collision control: alpha and alpha+[n] agree on E(Fp), with different norms</text><text x="28" y="295" class="b">Next: independent proof review → native implementation/tests → frozen scientific protocol → independent evidence</text></svg>