<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="1180" height="620" fill="#ffffff"/>
  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="bold">Prime-field point decomposition: the three structures a factor base can have, and what blocks each (2026-10-24 review)</text>
  <!-- column 1: known logs -->
  <rect x="30" y="70" width="350" height="110" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="205" y="95" text-anchor="middle" font-weight="bold">Base of random points with KNOWN logs</text>
  <text x="205" y="118" text-anchor="middle">R_j = u_j P + v_j Q  (Amadori–Pintore–Sala 2018;</text>
  <text x="205" y="138" text-anchor="middle">McGuire–Mueller 2017; rho distinguished points)</text>
  <text x="205" y="160" text-anchor="middle" font-style="italic">one vanishing signed m-sum = the logarithm</text>
  <line x1="205" y1="180" x2="205" y2="230" stroke="#333" marker-end="url(#a)"/>
  <rect x="30" y="230" width="350" height="150" rx="8" fill="#fbeeee" stroke="#a54a4a"/>
  <text x="205" y="255" text-anchor="middle" font-weight="bold">Blocked twice</text>
  <text x="45" y="280">Generic: relation search = k-sum in E(F_p);</text>
  <text x="45" y="298">Wagner Thm 2 (Dai): k-sum solver ⇒ DL solver,</text>
  <text x="45" y="316">so Ω(√p) for every generic algorithm.</text>
  <text x="45" y="340">Algebraic: split constraints ⇒ F_p^{s^m} (CRT);</text>
  <text x="45" y="358">YYTK 2020: ≥ m·2^{m−1}·d^{m−1} per Gröbner solve.</text>
  <text x="205" y="405" text-anchor="middle" font-size="12">KR-IC-52ad34, KR-IC-dbf1b0</text>
  <!-- column 2: algebraic structure -->
  <rect x="415" y="70" width="350" height="110" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="590" y="95" text-anchor="middle" font-weight="bold">Base with ALGEBRAIC structure</text>
  <text x="590" y="118" text-anchor="middle">x in a subgroup / coset / isogeny-kernel coset /</text>
  <text x="590" y="138" text-anchor="middle">image of low-degree maps (PKM 2016 §3.3–3.4)</text>
  <text x="590" y="160" text-anchor="middle" font-style="italic">logs unknown: B relations needed</text>
  <line x1="590" y1="180" x2="590" y2="230" stroke="#333" marker-end="url(#a)"/>
  <rect x="415" y="230" width="350" height="150" rx="8" fill="#fbeeee" stroke="#a54a4a"/>
  <text x="590" y="255" text-anchor="middle" font-weight="bold">Blocked by dimension</text>
  <text x="430" y="280">Lang–Weil + Bézout: a set of size ≪ p/D cut out</text>
  <text x="430" y="298">by degree-D equations is 0-dimensional, so its</text>
  <text x="430" y="316">constraint algebra is F_p^{B^m} however written;</text>
  <text x="430" y="340">chains of low-degree maps change nothing.</text>
  <text x="430" y="358">F_p has no subfield: no Weil restriction.</text>
  <text x="590" y="405" text-anchor="middle" font-size="12">KR-IC-585a96 (extends IDEA-20260801-021)</text>
  <!-- column 3: size structure -->
  <rect x="800" y="70" width="350" height="110" rx="8" fill="#eef3fb" stroke="#4a6fa5"/>
  <text x="975" y="95" text-anchor="middle" font-weight="bold">Base with SIZE structure</text>
  <text x="975" y="118" text-anchor="middle">x in an interval [0, p^{1/m}) (Semaev 2004)</text>
  <text x="975" y="138" text-anchor="middle">decomposition = small roots of S_{m+1}</text>
  <text x="975" y="160" text-anchor="middle" font-style="italic">or the norm ∏_{V^m} S_{m+1}(u, z)</text>
  <line x1="975" y1="180" x2="975" y2="230" stroke="#333" marker-end="url(#a)"/>
  <rect x="800" y="230" width="350" height="150" rx="8" fill="#fbeeee" stroke="#a54a4a"/>
  <text x="975" y="255" text-anchor="middle" font-weight="bold">Blocked by reach</text>
  <text x="815" y="280">Lattice: δ_max = 1/((m+1)c_N) = 2/(m(m+1)2^{m−1})</text>
  <text x="815" y="298">= 1/6, 1/24, 1/80, 1/240 vs 1/m needed; support of</text>
  <text x="815" y="316">S_3, S_4, S_5 is the full box (9/9, 125/125, 6561/6561).</text>
  <text x="815" y="340">Norm: 1-D sublinear (BGS √B, X^B−1 log B);</text>
  <text x="815" y="358">≥2-D costs ≥ B; Ψ_2 dense; MITM is B^{⌈m/2⌉}.</text>
  <text x="975" y="405" text-anchor="middle" font-size="12">KR-IC-76aaed, KR-IC-3845fa, KN-OPEN-1fa083</text>
  <!-- bottom: accounting -->
  <rect x="30" y="440" width="1120" height="150" rx="8" fill="#f4f4f4" stroke="#888"/>
  <text x="590" y="465" text-anchor="middle" font-weight="bold">Accounting that every route must satisfy (PKM §3.2; Semaev §3; aburan28/crypto RESEARCH_PRIME_FIELD_BREAKTHROUGH_PROGRAM §2.4)</text>
  <text x="45" y="492">cost(B) ≈ (m!/2^m) · p · T_dec / B^{m−1} + m·B²,  optimum B = (p·T_dec)^{1/(m+1)},  total ≈ (p·T_dec)^{2/(m+1)}</text>
  <text x="45" y="516">m = 2 never beats √p · m = 3 ties only with T_dec = O(1) · m = 4 beats √p iff T_dec ≪ p^{1/4} · m = 5 iff T_dec ≪ p^{1/2}</text>
  <text x="45" y="540">Enumeration / MITM oracle: T_dec = B^{⌈m/2⌉} ⇒ total m!·p^{1/2+1/m} (never below rho). Gröbner on any split base: T_dec ≥ m·2^{m−1}·d^{m−1} ≥ MITM.</text>
  <text x="45" y="564">What survives: constant factors on special curves (|Aut| ≤ 6; 2-torsion symmetrisation ≤ 8× on columns) and the two open problems of KN-OPEN-1fa083.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
