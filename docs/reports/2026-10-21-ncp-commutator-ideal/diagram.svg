<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
  <title id="title">Commutator ideal cannot be the affine evaluation kernel</title>
  <desc id="desc">The free algebra has a torsion witness v squared minus one. Negation squared is identity, so evaluation kills it. The zero-generator augmentation sends all commutators to zero but sends the witness to negative one, proving it is outside the commutator ideal.</desc>
  <rect width="1060" height="430" fill="#f8fafc"/>
  <text x="38" y="43" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172338">NCP commutator-ideal refutation</text>
  <text x="38" y="72" font-family="Arial,sans-serif" font-size="15" fill="#46566c">THM-COMMUTATOR-KERNEL1 Proposition 1 / TASK-20260822-b69d29 / Lean 4.35.0-rc1</text>
  <rect x="38" y="105" width="984" height="77" rx="11" fill="#e8efff" stroke="#5f7eaf" stroke-width="2"/>
  <text x="58" y="137" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">A = free associative Z-algebra on translations t_i and negation v</text>
  <text x="58" y="165" font-family="Arial,sans-serif" font-size="16" fill="#46566c">w = v² − 1;  I = two-sided ideal generated by all xy − yx</text>
  <g font-family="Arial,sans-serif" fill="#172338">
    <rect x="38" y="225" width="469" height="115" rx="11" fill="#e2f4ea" stroke="#36845a" stroke-width="2"/>
    <text x="58" y="257" font-size="19" font-weight="700">Affine evaluation ρ</text>
    <text x="58" y="286" font-size="17">ρ(v)² = 1, so ρ(w) = 0</text>
    <text x="58" y="315" font-size="16" fill="#46566c">Thus w belongs to ker ρ.</text>
    <rect x="553" y="225" width="469" height="115" rx="11" fill="#fff1dc" stroke="#b6832c" stroke-width="2"/>
    <text x="573" y="257" font-size="19" font-weight="700">Zero-generator augmentation ε</text>
    <text x="573" y="286" font-size="17">ε(xy − yx) = 0; ε(w) = −1</text>
    <text x="573" y="315" font-size="16" fill="#46566c">Thus w is outside I.</text>
  </g>
  <g stroke="#6a7d91" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M272 182 V218"/><path d="M788 182 V218"/>
  </g>
  <g fill="#6a7d91"><path d="M272 220 l-6 -10 h12z"/><path d="M788 220 l-6 -10 h12z"/></g>
  <rect x="38" y="370" width="984" height="43" rx="11" fill="#f0eaff" stroke="#8060ad" stroke-width="2"/>
  <text x="58" y="399" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#332052">Therefore ker ρ is different from I for every B, n, and translation list s.</text>
</svg>
