<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Trace cancellation does not establish a degree two first fall; finite S3 sample first falls at degree three</title>
  <desc id="desc">Left: cancellation places q in the degree two low-degree intersection, while nonmembership in degree one is missing. Right: for the eight-variable n four sample, full ranks at degrees one, two, three are 1, 11, 53 and new-fall dimensions are 0, 0, 1.</desc>
  <rect width="1080" height="600" fill="#f8fafc"/>
  <text x="44" y="54" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#172554">S₃ first-fall boundary · exact finite Boolean model</text>
  <text x="44" y="82" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#475569">n = n′ = 4 · F₂[t]/(t⁴+t+1) · x_R = 1 · basis [9, 3, 2, 12] · J1 and blind J3</text>
  <rect x="42" y="112" width="465" height="379" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="64" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#1e293b">The theorem-to-claim gap</text>
  <rect x="64" y="175" width="421" height="78" rx="8" fill="#dbeafe"/>
  <text x="82" y="207" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#1e3a8a">Trace theorem: degree 2 coefficients cancel</text>
  <text x="82" y="232" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#1e3a8a">⇒ q ∈ V₂ ∩ R≤1</text>
  <text x="266" y="284" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" fill="#64748b">↓</text>
  <rect x="64" y="303" width="421" height="94" rx="8" fill="#fee2e2"/>
  <text x="82" y="336" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#991b1b">Missing premise: q ∉ V₁</text>
  <text x="82" y="365" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#7f1d1d">In the named finite sample, every degree 2</text>
  <text x="82" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#7f1d1d">low-degree class is already in V₁.</text>
  <text x="64" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" fill="#475569">A valid cancellation identity cannot supply nonmembership.</text>
  <rect x="532" y="112" width="506" height="379" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="556" y="149" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#1e293b">Independent finite dimensions</text>
  <line x1="602" y1="410" x2="990" y2="410" stroke="#64748b" stroke-width="2"/>
  <line x1="602" y1="204" x2="602" y2="410" stroke="#64748b" stroke-width="2"/>
  <text x="581" y="414" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#475569">0</text>
  <text x="581" y="341" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#475569">20</text>
  <text x="581" y="268" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#475569">40</text>
  <text x="581" y="209" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#475569">55</text>
  <line x1="602" y1="337" x2="990" y2="337" stroke="#e2e8f0"/>
  <line x1="602" y1="264" x2="990" y2="264" stroke="#e2e8f0"/>
  <rect x="646" y="406" width="76" height="4" fill="#2563eb"/>
  <rect x="769" y="370" width="76" height="40" fill="#2563eb"/>
  <rect x="892" y="217" width="76" height="193" fill="#2563eb"/>
  <text x="684" y="399" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">1</text>
  <text x="807" y="362" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">11</text>
  <text x="930" y="209" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="700" fill="#1e40af">53</text>
  <text x="684" y="438" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155">D = 1</text>
  <text x="807" y="438" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155">D = 2</text>
  <text x="930" y="438" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155">D = 3</text>
  <text x="684" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#64748b">new fall 0</text>
  <text x="807" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#b91c1c">new fall 0</text>
  <text x="930" y="473" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="700" fill="#047857">new fall 1</text>
  <text x="44" y="530" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#334155">Blue bars: dim(V_D). New fall = dim(V_D ∩ R≤D−1) − dim(V_D−1).</text>
  <text x="44" y="554" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#64748b">Derived exact arithmetic, not performance measurement · source: TASK-20261025-0df6aa and TASK-20261025-29fa5a</text>
</svg>
