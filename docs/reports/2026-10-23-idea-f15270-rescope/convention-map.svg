<?xml version="1.0" encoding="UTF-8"?>
<!-- Hand-written, editable. IDEA-20261023-f15270 convention map. No data: zero runs.
     Solid edge = derived in the record (report.md section 4), not independently re-derived.
     Dashed edge = proposed or conjectural. There is no measured edge. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4a00"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a01010"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#ffffff"/>
  <text x="620" y="30" text-anchor="middle" font-size="20" font-weight="bold">IDEA-20261023-f15270: counted events under four conventions and the ratios between them</text>
  <text x="620" y="52" text-anchor="middle" font-size="13" fill="#333333">E over F_Q, Q = q^n; base D = {P : x(P) in F_q}, B = |D|, t2 = |D n E[2]|, |X| = (B+t2)/2; summation index m = n+1; n = number of summed points.</text>

  <!-- Universe boxes -->
  <rect x="40" y="90" width="350" height="110" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="215" y="115" text-anchor="middle" font-size="15" font-weight="bold">A: ordered point tuples</text>
  <text x="215" y="138" text-anchor="middle" font-size="13">(P_1..P_n) in D^n with sum R</text>
  <text x="215" y="160" text-anchor="middle" font-size="13">universe B^n; all-target mean B^n / N</text>
  <text x="215" y="182" text-anchor="middle" font-size="12" fill="#444444">T_A(R) = sum over multisets of n!/prod(m_j!)</text>

  <rect x="470" y="90" width="350" height="110" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="645" y="115" text-anchor="middle" font-size="15" font-weight="bold">M: point multisets</text>
  <text x="645" y="138" text-anchor="middle" font-size="13">size-n multisets from D with sum R</text>
  <text x="645" y="160" text-anchor="middle" font-size="13">universe C(B+n-1, n); mean C(B+n-1,n) / N</text>
  <text x="645" y="182" text-anchor="middle" font-size="12" fill="#444444">KN-FIND-007; at B = q: (1/n!) prod(1+i/q)</text>

  <rect x="40" y="330" width="350" height="120" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="215" y="355" text-anchor="middle" font-size="15" font-weight="bold">S: (ordered x-tuple, sign class) hits</text>
  <text x="215" y="378" text-anchor="middle" font-size="13">class [eps] with sum = +-R (eps_1 = +)</text>
  <text x="215" y="400" text-anchor="middle" font-size="13">incidences 2^(n-1) |X|^n = (B+t2)^n / 2</text>
  <text x="215" y="422" text-anchor="middle" font-size="12" fill="#444444">= root multiplicity of x(R) in S_{n+1}(x_1..x_n, T)</text>
  <text x="215" y="440" text-anchor="middle" font-size="12" fill="#444444">(KN-FIND-4f0d84 root multiset)</text>

  <rect x="470" y="330" width="350" height="120" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="645" y="355" text-anchor="middle" font-size="15" font-weight="bold">X: x-multisets with a hit at x(R)</text>
  <text x="645" y="378" text-anchor="middle" font-size="13">size-n multisets from X, some class hits +-R</text>
  <text x="645" y="400" text-anchor="middle" font-size="13">universe C(|X|+n-1, n)</text>
  <text x="645" y="422" text-anchor="middle" font-size="12" fill="#444444">T_M - T_X = excess point multisets per x-multiset</text>
  <text x="645" y="440" text-anchor="middle" font-size="12" fill="#444444">(double roots at x(R) only)</text>

  <!-- Solid derived edges -->
  <line x1="390" y1="145" x2="468" y2="145" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="429" y="128" text-anchor="middle" font-size="12" fill="#1f3a5f">n!/prod(1+i/B)</text>
  <text x="429" y="170" text-anchor="middle" font-size="11" fill="#1f3a5f">derived, exact</text>

  <line x1="215" y1="200" x2="215" y2="328" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="225" y="255" font-size="12" fill="#1f3a5f">T_S = T_A  (t2 = 0)</text>
  <text x="225" y="272" font-size="11" fill="#1f3a5f">sum of 2^j over tuples</text>
  <text x="225" y="288" font-size="11" fill="#1f3a5f">with j 2-torsion entries</text>
  <text x="225" y="304" font-size="11" fill="#1f3a5f">derived (2R != O)</text>

  <line x1="645" y1="200" x2="645" y2="328" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="655" y="255" font-size="12" fill="#1f3a5f">T_X = T_M</text>
  <text x="655" y="272" font-size="11" fill="#1f3a5f">except double roots (derived);</text>
  <text x="655" y="288" font-size="11" fill="#1f3a5f">their expected size ~ 2^(n-1)/N</text>
  <text x="655" y="304" font-size="11" fill="#1f3a5f">is heuristic</text>

  <line x1="390" y1="390" x2="468" y2="390" stroke="#1f3a5f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="429" y="373" text-anchor="middle" font-size="12" fill="#1f3a5f">~ n!</text>
  <text x="429" y="412" text-anchor="middle" font-size="11" fill="#1f3a5f">derived</text>

  <!-- Right column: note -->
  <rect x="880" y="90" width="320" height="360" rx="8" fill="#f6f6f6" stroke="#777777" stroke-width="1.5"/>
  <text x="1040" y="115" text-anchor="middle" font-size="14" font-weight="bold">Why no convention gains 2^(n-1)</text>
  <text x="893" y="142" font-size="12">Every tuple has exactly one sum, so each</text>
  <text x="893" y="159" font-size="12">convention's all-target mean is its universe</text>
  <text x="893" y="176" font-size="12">size over N (KN-FIND-007; ordered form too).</text>
  <text x="893" y="204" font-size="12">Bookkeeping factors that cancel [derived]:</text>
  <text x="893" y="224" font-size="12">  roots per x-tuple             2^(n-1)</text>
  <text x="893" y="241" font-size="12">  x-tuples vs point tuples      2^(-n)</text>
  <text x="893" y="258" font-size="12">  R and -R share one x-class    2</text>
  <text x="893" y="275" font-size="12">  net                           1</text>
  <text x="893" y="303" font-size="12">Half base F vs signed base F u -F:</text>
  <text x="893" y="320" font-size="12">  |D^n| / |X^n| = (2B/(B+t2))^n ~ 2^n</text>
  <text x="893" y="348" font-size="12">At n = 2, n! = 2^(n-1) = 2: not separable.</text>
  <text x="893" y="365" font-size="12">From n = 3 they separate: 6/prod(1+i/B), 4.</text>
  <text x="893" y="393" font-size="12">Targets: N points; about N/2 x-classes.</text>
  <text x="893" y="410" font-size="12">Counts at R and -R are identical (D = -D).</text>
  <text x="893" y="435" font-size="11" fill="#555555">Only the per-target distribution (coverage) can</text>
  <text x="893" y="448" font-size="11" fill="#555555">separate a true gain from bookkeeping.</text>

  <!-- Raw fibre degree box between S and QR -->
  <rect x="40" y="474" width="350" height="52" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="215" y="493" text-anchor="middle" font-size="13" font-weight="bold">Raw fibre degree 2^(m-2) = 2^(n-1) roots per x-tuple</text>
  <text x="215" y="513" text-anchor="middle" font-size="11" fill="#444444">cancels against 2^(-n) and N/2 [derived]; a solve-cost factor in the literature</text>
  <line x1="215" y1="474" x2="215" y2="452" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Proxy versus exact -->
  <rect x="40" y="560" width="350" height="100" rx="8" fill="#fff4e0" stroke="#7a4a00" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="215" y="585" text-anchor="middle" font-size="14" font-weight="bold">QR proxy (model)</text>
  <text x="215" y="607" text-anchor="middle" font-size="12">each x-tuple fibre splits with prob phi_n = 2^(1-n)</text>
  <text x="215" y="625" text-anchor="middle" font-size="12">(Chebotarev, (Z/2)^(m-2) regular, KN-FIND-bdcd60 (3))</text>
  <text x="215" y="646" text-anchor="middle" font-size="11" fill="#7a4a00">proposed: transfer T1 from F_p to F_Q</text>

  <rect x="470" y="560" width="350" height="100" rx="8" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="2"/>
  <text x="645" y="585" text-anchor="middle" font-size="14" font-weight="bold">Exact count on the locus</text>
  <text x="645" y="607" text-anchor="middle" font-size="12">fibre splits completely, prob 1 (KN-FIND-4f0d84)</text>
  <text x="645" y="625" text-anchor="middle" font-size="12">mean hits per target = (B+t2)^n / N</text>
  <text x="645" y="646" text-anchor="middle" font-size="11" fill="#1f3a5f">derived for F_p; over F_Q it is transfer T1</text>

  <line x1="390" y1="610" x2="468" y2="610" stroke="#7a4a00" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#arrd)"/>
  <text x="429" y="592" text-anchor="middle" font-size="12" fill="#7a4a00">x 2^(n-1)</text>
  <text x="429" y="632" text-anchor="middle" font-size="11" fill="#7a4a00">= 1/phi_n, proposed</text>

  <line x1="645" y1="560" x2="645" y2="452" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr)"/>
  <text x="655" y="510" font-size="11" fill="#1f3a5f">same events, counted as S and X</text>

  <!-- Conjectural yield lever, red dashed -->
  <rect x="880" y="560" width="320" height="100" rx="8" fill="#fdecec" stroke="#a01010" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="1040" y="585" text-anchor="middle" font-size="14" font-weight="bold">Hypothesised yield lever (reading Y)</text>
  <text x="1040" y="607" text-anchor="middle" font-size="12">relation rate = 2^(n-1) x (1/n!)</text>
  <text x="1040" y="625" text-anchor="middle" font-size="12">conjectural; predicted absent</text>
  <text x="1040" y="646" text-anchor="middle" font-size="11" fill="#a01010">violates coverage &lt;= min(1, mu_M)</text>
  <line x1="900" y1="560" x2="822" y2="196" stroke="#a01010" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrr)"/>
  <text x="893" y="480" font-size="11" fill="#a01010">red dashed edge: a yield lever would exceed</text>
  <text x="893" y="496" font-size="11" fill="#a01010">the cap (L5, derived); predicted absent</text>

  <!-- Legend -->
  <rect x="40" y="690" width="1160" height="80" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <text x="55" y="710" font-size="13" font-weight="bold">Legend</text>
  <line x1="55" y1="725" x2="115" y2="725" stroke="#1f3a5f" stroke-width="2.5"/>
  <text x="125" y="729" font-size="12">derived in this record, not independently re-derived (report.md section 4)</text>
  <line x1="55" y1="743" x2="115" y2="743" stroke="#7a4a00" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="125" y="747" font-size="12">proposed (needs the F_p-to-F_Q transfer T1 and a blind re-derivation)</text>
  <line x1="55" y1="761" x2="115" y2="761" stroke="#a01010" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="125" y="765" font-size="12">conjectural (the clause read as a yield lever); there is no measured edge, zero runs</text>
</svg>
