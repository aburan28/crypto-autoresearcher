<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Frob C5 review evidence boundary</title>
  <desc id="desc">Independent arithmetic and Lean review support quotient algebra C5 controls. Archived code review finds source custody and independent trace checks missing, so the historical run verdict remains open.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#52657b"/></marker>
    <style>
      .title{font:700 27px/1.2 Arial,Helvetica,sans-serif;fill:#14263b}
      .subtitle{font:15px Arial,Helvetica,sans-serif;fill:#41556b}
      .heading{font:700 17px Arial,Helvetica,sans-serif;fill:#172c42}
      .body{font:14px Arial,Helvetica,sans-serif;fill:#31465a}
      .small{font:12px Arial,Helvetica,sans-serif;fill:#566b7f}
      .badge{font:700 12px Arial,Helvetica,sans-serif;letter-spacing:.05em}
      .arrow{stroke:#52657b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f7f9fc"/>
  <text x="48" y="55" class="title">Frob C5: reviewed mathematics, open run provenance</text>
  <text x="48" y="82" class="subtitle">Frozen q = 11, 13, 19 cells · three independent joints · no new scientific run</text>

  <rect x="45" y="124" width="274" height="120" rx="12" fill="#e9f4f5" stroke="#76b4b7" stroke-width="2"/>
  <text x="65" y="153" class="badge" fill="#17676e">J3 · BLIND DERIVATION</text>
  <text x="65" y="182" class="heading">75 q-power matrix entries</text>
  <text x="65" y="207" class="body">Trace, kernels, direct sums</text>
  <text x="65" y="228" class="small">All three moduli irreducible by arithmetic</text>

  <rect x="45" y="267" width="274" height="120" rx="12" fill="#eaf0fb" stroke="#8aa5d4" stroke-width="2"/>
  <text x="65" y="296" class="badge" fill="#315a9c">J2 · LEAN THEOREMS</text>
  <text x="65" y="325" class="heading">Exact quotient C5 controls</text>
  <text x="65" y="350" class="body">Pinned types and standard axioms</text>
  <text x="65" y="371" class="small">No formal quotient-to-field equivalence</text>

  <rect x="403" y="172" width="286" height="168" rx="14" fill="#e6f3e9" stroke="#65a879" stroke-width="2.5"/>
  <text x="425" y="203" class="badge" fill="#276b3b">SUPPORTED · MATHEMATICAL SCOPE</text>
  <text x="425" y="237" class="heading">F⁵ = I; trace nullity 4</text>
  <text x="425" y="266" class="body">Factor kernels sum directly</text>
  <text x="425" y="288" class="body">to the five-term trace kernel</text>
  <text x="425" y="319" class="small">q = 5 and mutated q = 13 controls reject</text>
  <path d="M319 184 H401" class="arrow"/>
  <path d="M319 327 H365 Q385 327 385 305 V285 H401" class="arrow"/>

  <rect x="45" y="430" width="274" height="117" rx="12" fill="#fff0e9" stroke="#d8a382" stroke-width="2"/>
  <text x="65" y="460" class="badge" fill="#9a4e28">J1 · ARCHIVED CODE</text>
  <text x="65" y="489" class="heading">Coordinate paths coherent</text>
  <text x="65" y="514" class="body">Original loaded bytes unbound</text>
  <text x="65" y="535" class="small">Direct trace flag is self-consistency</text>

  <rect x="722" y="407" width="233" height="140" rx="14" fill="#fff4df" stroke="#dda842" stroke-width="2.5"/>
  <text x="744" y="438" class="badge" fill="#8c5c12">OPEN · HISTORICAL SCOPE</text>
  <text x="744" y="471" class="heading">Run C5 verdict</text>
  <text x="744" y="500" class="body">Source/process custody and</text>
  <text x="744" y="522" class="body">independent trace check needed</text>
  <path d="M689 257 H836 Q848 257 848 270 V405" class="arrow dashed"/>
  <path d="M319 489 H721" class="arrow dashed"/>

  <line x1="45" y1="582" x2="955" y2="582" stroke="#cbd5df"/>
  <text x="48" y="603" class="small">C8, full experiment success, ECDLP cost and performance remain outside this C5 review.</text>
</svg>
