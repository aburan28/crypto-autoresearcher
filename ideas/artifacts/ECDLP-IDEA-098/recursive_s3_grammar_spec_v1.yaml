schema: crypto.autoresearch.ecdlp_recursive_s3_grammar.v1
idea_id: ECDLP-IDEA-098
experiment_id: P1515
record_type: theorem_only_symbolic_specification
status: SCOPED_NEGATIVE_NATURAL_SERIAL_GRAMMAR_B3_PROVENANCE__NONLOCAL_ORDER_OPEN
independently_verified: false
contract_executed: false
prototype_executed: false
breakthrough_claimed: false

objective:
  statement: >-
    Freeze one concrete target-independent recursive-S3 grammar for exact signed
    five-source fibers and charge its first unavoidable provenance separator
    before any Grobner computation or toy run.
  success_gate:
    setup_exponent_in_B_max: 2.25
    per_target_query_exponent_in_B_max: 1.25
    complete_time_exponent_in_N_max: 0.45
    complete_memory_exponent_in_N_max: 0.45

frozen_asymptotic_interface:
  subgroup:
    notation: G
    order: N
    order_property: prime
  factor_alphabet:
    notation: A
    signed: true
    size: Theta(B)
  factor_base_balance:
    equation: B=N^(1/5)
  source_arity: 5
  target:
    notation: R
    public: true
  campaign:
    random_known_scalar_targets: Omega(B)
    expected_rows_per_target: Theta(1)
    rank_rows_required: Theta(B)

curve_model:
  form: short_weierstrass
  affine_equation: y^2=x^3+a*x+b
  characteristic_exclusions:
    - 2
    - 3
  ordinary_curve_required: true
  projective_completion_required: true

source_slots:
  items:
    - point: P1
      alphabet: A
    - point: P2
      alphabet: A
    - point: P3
      alphabet: A
    - point: P4
      alphabet: A
    - point: P5
      alphabet: A
  conventions:
    ordering: canonical_unordered_multiset_with_constant_size_sign_charts
    repetitions: retained
    infinity: retained
    sign_fixed_points: retained
    nonreduced_strata: retained

recursive_addition_graph:
  signed_projective_equations_required: true
  x_coordinate_core:
    semaev_polynomial: >-
      S3(X1,X2,X3)=(X1-X2)^2*X3^2
      -2*((X1+X2)*(X1*X2+a)+2*b)*X3
      +(X1*X2-a)^2-4*b*(X1+X2)
    warning: >-
      The x-coordinate equations alone do not preserve coherent y-sign branches.
      Every grammar branch must also satisfy the frozen projective addition graph.
  stages:
    - id: ADD12
      projective_relation: U2=P1+P2
      x_core: S3(x1,x2,u2)=0
    - id: ADD123
      projective_relation: U3=U2+P3
      x_core: S3(u2,x3,u3)=0
    - id: ADD1234
      projective_relation: U4=U3+P4
      x_core: S3(u3,x4,u4)=0
    - id: TARGET
      projective_relation: R=U4+P5
      x_core: S3(u4,x5,xR)=0
  projective_charts:
    generic_chord:
      constraints:
        - t*(xB-xA)=yB-yA
        - xC=t^2-xA-xB
        - yC=-yA+t*(xA-xC)
        - yA^2=xA^3+a*xA+b
        - yB^2=xB^3+a*xB+b
        - yC^2=xC^3+a*xC+b
    tangent:
      constraints:
        - 2*yA*t=3*xA^2+a
        - xC=t^2-2*xA
        - yC=-yA+t*(xA-xC)
    vertical:
      condition: xA=xB and yA=-yB
      output: infinity
    infinity:
      policy: identity_law_with_projective_closure

target_independent_weight_order:
  id: SERIAL_PREFIX_ELIMINATION_V1
  target_dependent: false
  high_to_low_blocks:
    - chart_and_slope_variables
    - U4_projective_coordinates
    - P5_projective_coordinates
    - U3_projective_coordinates
    - P4_projective_coordinates
    - U2_projective_coordinates
    - P3_projective_coordinates
    - P2_projective_coordinates
    - P1_projective_coordinates
    - target_projective_coordinates
  within_block_tie_break: graded_reverse_lexicographic
  squarefree_initial_ideal_status: unproved_and_not_credited
  reason_not_computed: >-
    The symbolic source-provenance recurrence already violates the setup gate;
    a Grobner computation cannot rescue this declared serial grammar without
    changing its representation.

symbolic_grammar:
  provenance_policy: exact_biconditional_parent_edges
  nonterminals:
    - id: SLOT1
      meaning: one signed source
      alternatives: Theta(B)
    - id: PREFIX2
      meaning: exact source-labelled derivations of U2=P1+P2
      alternatives: Theta(B^2)
    - id: PREFIX3
      meaning: exact source-labelled derivations of U3=P1+P2+P3
      alternatives: Theta(B^3)
    - id: PREFIX4
      meaning: exact source-labelled derivations of U4=P1+P2+P3+P4
      alternatives: Theta(B^4)
    - id: ACCEPT5
      meaning: exact source-labelled derivations satisfying U4+P5=R
      average_output: Theta(1)
  recurrences:
    - output: PREFIX2
      rule: JOIN(SLOT1,SLOT2,ADD12)
      explicit_derivation_traffic: Theta(B^2)
    - output: PREFIX3
      rule: JOIN(PREFIX2,SLOT3,ADD123)
      explicit_derivation_traffic: Theta(B^3)
    - output: PREFIX4
      rule: JOIN(PREFIX3,SLOT4,ADD1234)
      explicit_derivation_traffic: Theta(B^4)
    - output: ACCEPT5
      rule: JOIN(PREFIX4,SLOT5,TARGET)
      output_sensitive_target_routing: not_supplied

state_charge:
  first_failing_stage: PREFIX3
  explicit_parent_alternatives: Theta(B^3)
  setup_exponent_in_B: 3
  setup_exponent_in_N: 0.6
  allowed_setup_exponent_in_B: 2.25
  gate_passed: false
  collision_scope: >-
    Endpoint collisions do not remove exact parent alternatives. On the generic
    low-additive-energy control, canonical noncancelling three-source sums also
    occupy Theta(B^3) endpoints up to lower-order collisions. This generic
    support statement is model-bound and is not asserted for every factor base.

source_lift_charge:
  exact_parent_pointer_per_derivation: required_by_this_version
  aggregation_without_unranking: forbidden
  post_hoc_source_dictionary: forbidden
  all_strata_complete: required
  result: >-
    This serial version exposes Theta(B^3) source alternatives before target
    filtering. Replacing the alternatives by one aggregate endpoint polynomial
    removes the source inverse unless a new output-sensitive unranking operation
    is proved.

semantic_control_routing:
  explicit_prefix_or_balanced_states:
    disposition: merge_into_P1511_and_IDEA134
    obstruction: B^3 state_or_traffic
  product_or_norm_encoding_of_prefixes:
    disposition: merge_into_P1510_P1513
    obstruction: cubic_degree_or_base_field_coordinate_charge
  dense_elimination_or_moment_object:
    disposition: merge_into_P1514
    obstruction: dense_Macaulay_or_supplied_moment_constructor
  universal_squarefree_facets:
    disposition: closed_by_ECFG_P1515_R1
    obstruction: exponent_5_over_9_for_five_sources

scope_boundary:
  closed:
    - the_declared_natural_serial_prefix_order
    - explicit_parent_edges_for_every_three_source_prefix
    - endpoint_hashing_that_retains_the_same_parent_lists
    - a_shelling_order_isomorphic_to_this_serial_derivation_DAG
  open:
    - a_nonlocal_target_independent_squarefree_order
    - a_factored_grammar_with_exact_output_sensitive_source_unranking
    - a_finite_field_coordinate_identity_not_reducible_to_P1511_P1513_or_P1514
  nonclaims:
    - no_unconditional_lower_bound_for_all_term_orders
    - no_squarefree_initial_ideal_was_constructed
    - no_relation_campaign_or_factor_log_solve
    - no_blind_descent
    - no_generic_group_lower_bound_improvement
    - no_ECDLP_breakthrough

falsification_and_promotion:
  falsify_this_version_on:
    - any_PREFIX3_or_equivalent_state_stage_of_size_at_least_B^3
    - any_post_hoc_source_label_or_parent_table
    - any_target_specific_weight_order
  successor_requires:
    - target_independent_nonlocal_weight_order
    - proved_squarefree_source_biconditional_initial_complex
    - setup_at_most_B^2.25
    - query_at_most_B^1.25
    - exact_all_strata_source_unranking
    - finite_field_representation_separation_witness

exactly_one_next_action:
  action: >-
    Write recursive_s3_local_separator_trichotomy_v1.md proving or refuting that
    every source-biconditional recursive-S3 grammar with a local serial or
    balanced separator either exposes B^3 provenance, computes a P1513-style
    product/norm object, or restores a P1514-style dense elimination object.
  implementation_allowed: false
  toy_run_allowed: false

primary_references:
  - https://eprint.iacr.org/2004/031
  - https://arxiv.org/abs/2512.04258
  - https://www.shoup.net/papers/dlbounds1.pdf
