# STAGING DRAFT — not a ledger record. Promote via Coordinator only.
# ID verified free 2026-08-07 with tools/allocate_id.py --check.
# Advances IDEA-20260807-abacec (already on main, status: proposed, zero
# downstream references) into an executable hypothesis. Not a new claim about
# Simon's proof -- a claim about what the reduction chain delivers IF granted.
hypothesis:
  id: H-MLKEM-b477fd
  question_id: RQ-MLKEM-001
  statement: >-
    Independently of whether Simon's DCP algorithm (ePrint 2026/1591,
    KN-LIT-e204ab) is correct, the reduction chain DCP -> Regev -> BKSW ->
    IP-M-EDCP, taken at face value from primary sources, delivers a
    polynomial-time quantum SVP approximation factor and sample/qubit count
    that -- when substituted into ML-KEM's actual rank k in {2,3,4} and
    q = 3329 -- requires Q = k*n^(c+1) samples/qubits with c >= 12, making the
    reach polynomial in the abstract sense and astronomically impractical in
    the concrete sense, at every FIPS 203 parameter set.
  mechanism: >-
    KN-OPEN-8a5965 already isolates the gap: the chain's approximation factor
    alpha does not parse under the standard alpha-in-(0,1) convention, so
    which LWE regime is actually reached is unstated in the entry as recorded;
    and the bridge from unstructured LWE to MODULE-LWE at fixed small rank
    runs through IP-M-EDCP and is unaddressed. This hypothesis proposes to
    close both gaps by reading Regev 2004 (KN-LIT-21383c), BKSW (KN-LIT-4706),
    and IP-M-EDCP (KN-LIT-1744) directly and computing the delivered regime
    under each stated normalization convention, then substituting FIPS 203's
    actual (k, n, q). The deliverable is a REACH MAP: for each convention, the
    concrete (samples, qubits, approximation factor) triple at k in {2,3,4},
    compared against FIPS 203.
  assumptions: []
  proof_search_map:
    bottleneck: >-
      The reduction chain's own stated cost, NOT Simon's proof -- if the
      chain's asymptotic form already places Q at n^(c+1), c>=12 for any
      granted alpha, the reach question is answered without touching Q1 at
      all, and that is the intended shortcut this hypothesis takes.
    baseline_embedding:
      parameter_slice: >-
        the seven goals KN-OPEN-8a5965 names as resting on MLWE hardness
        (GOAL-MLKEM-001..005, GOAL-MLDSA-001..002) and their published k, n, q
      reproduction_check: >-
        recompute Q = k*n^(c+1) at FIPS 203's actual k for each of ML-KEM-512/
        768/1024 and compare against the entry's own worked c>=12 example
    observation_collision:
      observable: the reach map's (samples, qubits, approximation factor) triple per convention
      distinct_preimage_search: >-
        check whether any stated convention in Regev/BKSW/IP-M-EDCP produces a
        SMALLER Q than the entry's flagged c>=12 example -- if one does, the
        reach conclusion changes and that convention is the one to report, not
        the least favorable one
    constructive_transforms: []
    quantifier_order: >-
      FOR the specific FIPS 203 parameter sets (not asymptotic n), FOR EACH
      stated normalization convention in the three cited primary sources:
      compute Q. The hypothesis is a concrete substitution, not a general-n
      asymptotic claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        A conditional reach map -- "even granting Simon's claim, the reached
        regime is X and FIPS 203 sits at Y" -- never a verdict on whether
        Simon's proof is correct (that is Q1, explicitly out of scope here and
        deferred to a community verdict per KN-OPEN-8a5965's own posture).
      nearby_object_control: >-
        cross-check the reach map's Q against Chen's withdrawn 2024 quantum
        LWE claim's own reach analysis, if the corpus has one, as a sanity
        check that this reach-map methodology produces sane numbers on a
        precedent case.
    proof_obligations:
      - claim: the alpha-parsing ambiguity is resolved with a cited convention, not assumed
        responsibility: interface
      - claim: the IP-M-EDCP bridge to fixed small module rank is read from primary text, not inferred
        responsibility: scope
      - claim: Q is computed at FIPS 203's actual (k,n,q), not a generic asymptotic n
        responsibility: size
    not_applicable_reason: null
  rerandomization: null
  asymptotic_claim:
    problem: Module-LWE at ML-KEM's deployed parameters
    prior_best: not_applicable -- this is a reach question about a reduction chain, not a new attack
    time_exponent: null
    memory_exponent: null
    hidden_cofactor: >-
      the entry's own flagged c>=12 example is the suspected hidden cofactor;
      this hypothesis exists to confirm or correct that number from primary
      sources rather than repeat the entry's own unverified figure
    claim_kind: not_applicable
  heuristic_assumptions: []
  structural_ingredients:
    - description: Regev's quantum reduction from DCP to LWE
      citation: KN-LIT-21383c
      role: base reduction whose stated parameters this hypothesis reads directly
    - description: BKSW noise-tolerance improvement to the DCP-to-LWE reduction
      citation: KN-LIT-4706
      role: determines the faulty-sample-rate tolerance the chain requires
    - description: IP-M-EDCP bridge from unstructured LWE to Module-LWE
      citation: KN-LIT-1744
      role: the specific unaddressed gap KN-OPEN-8a5965 flags -- this hypothesis reads it directly
  reduction_chain:
    core_problem: Dihedral Coset Problem (quantum)
    corollaries:
      - problem: LWE (via Regev/BKSW)
        reduction_ref: KN-LIT-21383c, KN-LIT-4706
        asymptotics_preserved: to be determined by this hypothesis, not assumed
      - problem: Module-LWE at fixed small rank (via IP-M-EDCP)
        reduction_ref: KN-LIT-1744
        asymptotics_preserved: to be determined by this hypothesis, not assumed
  predictions:
    - metric: Q_samples_qubits_at_FIPS203_parameters
      direction: higher
      minimum_effect: exceeds_any_practical_budget_by_many_orders_of_magnitude
  test_boundary:
    instances: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
    parameters: {k: [2,3,4], n: 256, q: 3329}
    implementation: >-
      symbolic/arithmetic substitution into the reduction chain's stated
      formulas, not a computational experiment against real lattices -- this
      is a literature-arithmetic task, cheap and bounded
    budget: {}
  falsification_conditions:
    - >-
      Any stated convention in the three primary sources yields a Q that is
      NOT astronomically impractical at FIPS 203 parameters -- i.e. the reach
      conclusion flips and the seven dependent goals' threat model genuinely
      changes.
    - >-
      The IP-M-EDCP bridge, once read directly, does not apply to fixed small
      module rank at all (rather than applying with a large cost) -- in which
      case the reach question is "does not compose" rather than "composes
      impractically", a different and still-reportable answer.
  interpretation_limits:
    - >-
      This hypothesis says NOTHING about whether Simon's proof (Q1) is
      correct. A large Q under this hypothesis does not mean Simon's claim is
      false; it means even a correct claim would not currently threaten FIPS
      203 in practice. Both facts can and should be reported together.
    - >-
      If Q1 is later found to fail (the community verdict KN-OPEN-8a5965
      already anticipates as the likely path), this hypothesis's reach map
      becomes moot for THIS specific preprint but the reach-mapping
      METHODOLOGY remains reusable for the next DCP-family claim -- worth
      recording as a technique, not just a one-off answer.
  status: proposed
  proposed_by: session
