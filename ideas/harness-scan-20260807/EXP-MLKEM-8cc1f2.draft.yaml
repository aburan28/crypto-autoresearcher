experiment:
  id: EXP-MLKEM-8cc1f2
  hypothesis_id: H-MLKEM-b477fd
  version: 1
  title: >-
    Compute the Simon-DCP-chain reach map at FIPS 203 parameters from primary
    sources, independent of Q1 (proof correctness)
  status: draft
  objective: >-
    Read Regev 2004, BKSW, and IP-M-EDCP directly (full text, not the
    KN-OPEN-8a5965 entry's summary) and extract, for each stated normalization
    convention: the delivered LWE approximation factor as a function of n, the
    sample/qubit count as a function of n and the noise-tolerance parameter,
    and the module-rank bridge's own multiplicative or additive cost. Then
    substitute FIPS 203's actual (k,n,q) for ML-KEM-512/768/1024 and report Q.
  inputs:
    primary_sources: [KN-LIT-21383c (Regev 2004), KN-LIT-4706 (BKSW), KN-LIT-1744 (IP-M-EDCP)]
    target_parameters:
      ML-KEM-512: {k: 2, n: 256, q: 3329}
      ML-KEM-768: {k: 3, n: 256, q: 3329}
      ML-KEM-1024: {k: 4, n: 256, q: 3329}
    entry_flagged_example: KN-OPEN-8a5965's own worked figure, Q = k*n^(c+1), c >= 12 -- treated as a claim to VERIFY, not a given
  controls:
    - >-
      Reproduce the entry's own c>=12 example from the primary sources before
      trusting any new computation -- if this cannot be reproduced, the entry
      itself may have mis-stated the chain, and that is reported before
      anything else.
    - >-
      Where alpha's convention is ambiguous (the entry's flagged gap), compute
      Q under EVERY plausible reading found in the primary sources, not just
      the most or least favorable -- report the full set with each convention
      cited by page/theorem number.
  independent_variables: [normalization_convention, k]
  metrics:
    primary:
      - Q_samples_or_qubits, per convention, per k
      - approximation_factor_alpha, per convention
    secondary:
      - whether IP-M-EDCP's bridge applies to fixed small rank at all, as a boolean, before its cost is even computed
  heuristic_under_test: null
  preregistered_prediction:
    quantity: Q_samples_or_qubits at k=2,3,4
    formula: "Q = k*n^(c+1) with c >= 12, i.e. astronomically impractical at every FIPS 203 rank"
    source: H-MLKEM-b477fd, extending KN-OPEN-8a5965's own flagged example
  scale_relevance:
    tier: not_applicable
    justification: >-
      This is literature arithmetic against FIPS 203's actual deployed
      parameters, not a toy-scale computational experiment -- there is no
      scale gap to bridge because the target IS the crypto-scale parameter
      set from the outset.
    correspondence: null
  tail_checks: []
  replication:
    seeds: []
    independent_instances: 0
  budget:
    wall_clock_seconds_per_run: null
    total_cpu_hours: 0
    maximum_memory_gb: null
    maximum_runs: 1
  stopping_rules:
    - >-
      If the entry's own flagged c>=12 example cannot be reproduced from
      primary sources, STOP and report the discrepancy before computing
      anything new -- a reach map built on a mis-stated baseline is worse than
      no reach map.
  invalidation_rules:
    - A reach-map number sourced from a secondary summary rather than the three named primary texts is invalidated.
  success_criterion: >-
    A reach map exists, per normalization convention, at k in {2,3,4}, with
    every number traceable to a specific theorem/page in the three primary
    sources, and the entry's own flagged example is either reproduced or the
    discrepancy is explained.
  falsification_criterion: >-
    Any convention yields a Q that is NOT astronomically impractical at any
    tested k -- this flips the reach conclusion and is the single most
    consequential outcome available in the current active portfolio.
  required_artifacts:
    - the reach map table (convention x k -> Q, alpha)
    - direct citations (theorem/page) for every number in the table
    - explicit note on whether Q1 (proof correctness) was touched (it must not be)
  assigned_to: executor
  approved_by: null
