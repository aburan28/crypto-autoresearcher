# Not ledger records. IDs verified free 2026-08-07.
# Each targets an open problem with ZERO active-goal coverage, found by
# cross-referencing knowledge/open-problems/*.md (status: open) against
# ledger/goals/*.yaml -- not a re-derivation of already-staged work.

ideas:

  - id: IDEA-20260807-ea0291
    question_id: RQ-CRYPTO-001
    title: >-
      Is the rank-2 nrd-PIP obstruction (Heuristic 4 failure) rank-intrinsic?
      Test it directly at rank 1 instead of waiting for new machinery
    class: gate_test
    claim: >-
      KN-OPEN-024 asks whether the rank-1 (quaternion-order) principal ideal
      problem inherits the tractability Castryck-Eriksen-Invernizzi-Vercauteren
      showed for M_g(O), g>=2. This program already holds the sharpest
      available datum for the ADJACENT rank-2 question: KN-OPEN-028 records
      that the HAWK-relevant rank-2 nrd-PIP route via Lenstra-Silverberg is
      super-polynomial because Heuristic 4 specifically fails, while
      Heuristics 1-3 verify. Nobody has asked whether Heuristic 4's failure
      mode is intrinsic to the RANK of the construction or an artifact of
      routing through Lenstra-Silverberg subfields specifically -- and that is
      directly testable by running the SAME heuristic check at rank 1, where a
      different (non-Lenstra-Silverberg) machinery must be used, without
      waiting for new tractability results to appear.
    mechanism: >-
      Reuses the existing rank-2 heuristic-verification methodology (whatever
      produced KN-OPEN-028's Heuristics 1-3 verified / Heuristic 4 failed
      result) and asks the analogous question at rank 1: does an equivalent
      heuristic hold or fail, and if it fails, does it fail for the SAME
      underlying reason (traced back to the specific number-theoretic step)
      or a different one? A different failure mode at rank 1 would suggest
      the rank-2 obstruction is NOT intrinsic to rank generally; the same
      failure mode would strengthen the case that it is.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED. KN-OPEN-024's own source_refs (KN-LIT-7641, KN-LIT-7647,
      KN-TECH-081) and KN-OPEN-028 are the starting corpus; whether anyone has
      already run this specific cross-rank comparison is unknown and cheap to
      check (a handful of KN-LIT entries) before any computation.
    predicted_effect: >-
      No prediction offered -- this is explicitly a comparison of two
      independent heuristic-failure investigations, and which way it falls is
      the entire point of asking.
    cheapest_decisive_test: >-
      Literature-first: read KN-LIT-7647 (Mendelsohn-Nelson) and whatever
      produced KN-OPEN-028's Heuristic 4 finding side by side, and determine
      whether the rank-1 construction admits an analogous heuristic
      statement at all before any new computation is attempted.
    risks:
      - If the rank-1 and rank-2 constructions use genuinely different machinery (not just different rank), the comparison may not be apples-to-apples and the literature-first step should catch this before computation is attempted.
      - Gated behind GOAL-HAWK-001's own findings remaining stable -- if KN-OPEN-028 is later corrected, this idea's premise needs re-checking.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-ccfe0d
    question_id: RQ-CRYPTO-001
    title: >-
      Scoped remediation: sample-audit the 7457 unverified-citation corpus
      entries rather than leave KN-OPEN-3f7a21 as a standing integrity gap
    class: infrastructure
    claim: >-
      KN-OPEN-3f7a21 records that 7457 of 7666 KN-LIT entries claim
      citation_verified against a downloads/ tree that has never existed in
      this repository -- a corpus-wide integrity gap with no owner and no
      active remediation goal. A full re-verification of 7457 entries is not
      proportionate, but a STATISTICAL SAMPLE AUDIT is: draw a random sample
      (e.g. 50-100 entries, stratified by area so no single goal's citation
      base is systematically under- or over-represented), attempt to verify
      each against a genuinely reachable primary source, and report the
      fraction that check out. This converts an open, unbounded integrity
      question into a bounded, reportable error-rate estimate that every
      other goal in the portfolio implicitly depends on.
    mechanism: >-
      Stratified random sampling plus manual/tool-assisted verification
      against reachable sources (arXiv abstracts, eprint HTML -- confirmed
      reachable per the 2026-08-06 pressure test finding that eprint HTML/
      search return HTTP 200 even though PDFs 403). No new theory; this is a
      measurement of the corpus's own reliability.
    novelty_status: not_a_mechanism
    novelty_screen: >-
      Not applicable -- this is a corpus-integrity measurement, not a
      cryptanalytic claim, and does not compete with any active goal's
      novelty space.
    predicted_effect: >-
      Unknown error rate. Given KN-OPEN-3f7a21's own framing (citations marked
      verified against a directory that never existed), a nontrivial failure
      rate is plausible, but whether entries are substantively wrong or just
      procedurally mis-marked (right paper, wrong verification method
      recorded) is exactly what the sample would distinguish.
    cheapest_decisive_test: >-
      Draw the stratified sample, attempt verification via the now-confirmed-
      reachable eprint HTML/search route first (cheaper than chasing PDFs),
      and report per-entry: confirmed / wrong paper / unreachable / correct
      but wrongly labeled as downloads/-verified.
    risks:
      - A small sample may not generalize across areas with very different citation practices; stratification is meant to catch this but should be checked, not assumed sufficient.
      - This is unglamorous infrastructure work with no cryptanalytic payoff of its own -- but every goal citing an unverified KN-LIT entry inherits this program's own stated uncertainty, and quantifying it is cheap relative to what it de-risks.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-13901e
    question_id: RQ-CRYPTO-001
    title: >-
      KN-OPEN-025 (TNFS Galois-symmetry speedup) has NO active goal at all --
      scope the cheapest end-to-end gain estimate before opening a full campaign
    class: mechanism
    claim: >-
      KN-OPEN-025 asks for which automorphism orders k Galois symmetry can
      accelerate the TNFS (Tower Number Field Sieve) linear-algebra step, and
      what the END-TO-END gain is -- and a scan of ledger/goals/*.yaml against
      every open-problem entry found this is the ONE open problem in the
      corpus with literally zero referencing goal, question, or proposal
      record. TNFS underlies finite-field discrete log (pairing-based crypto
      security), and Galois-symmetry speedups are exactly this program's
      stated core expertise (structure-exploiting cryptanalysis, per
      KN-OPEN-012's framing of the program's own methodological identity).
      This idea proposes the SCOPING step only: before any goal opens, produce
      a literature-grounded end-to-end gain estimate (linear-algebra step
      speedup times whatever fraction of TNFS's total cost that step actually
      represents) for a small number of concrete automorphism orders k, to
      determine whether a full campaign is warranted at all.
    mechanism: >-
      Galois automorphisms of order k acting on the number field sieve's
      relation lattice induce a block-circulant or block-structured linear
      system, whose solve can in principle be accelerated by a factor related
      to k -- the OPEN part is which k are realizable for TNFS's specific
      tower construction and whether the linear-algebra step is enough of
      TNFS's total cost for the gain to matter end-to-end (a large speedup on
      a small fraction of total cost is a small net gain, and TNFS's dominant
      cost may be relation collection, not linear algebra).
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED beyond the ledger/goals cross-reference already performed
      (zero hits). A literature search for existing TNFS Galois-symmetry
      results is the first step of the scoping work itself, not yet done.
    predicted_effect: >-
      No prediction offered on the gain's existence or size -- the explicit
      point of this idea is to produce that estimate cheaply BEFORE
      recommending a full campaign, per this program's own inventor-protocol
      discipline (cheap pre-compute falsification checks before expensive
      commitment).
    cheapest_decisive_test: >-
      Identify TNFS's published cost breakdown (relation collection vs linear
      algebra, by phase) for a representative parameter set, then estimate
      what fraction of total cost the linear-algebra step actually is -- if
      it is a small fraction, the end-to-end gain ceiling is already bounded
      without needing to resolve which k are realizable at all.
    risks:
      - If TNFS's cost is dominated by relation collection (plausible; sieving/relation-finding often dominates NFS-family costs), this idea may resolve to "bounded gain, not worth a full campaign" quickly and cheaply -- which is still the correct and valuable outcome, not a failure of the idea.
      - Genuinely adjacent to but distinct from this program's ECDLP focus (index calculus over prime fields); TNFS targets extension-field discrete log, so scope creep beyond the scoping estimate itself should be treated cautiously.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'
