experiment:
  id: EXP-ECDLP-IDEA-002-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-002
  lane: representation_changing
  version: 1
  title: Split-Jacobian projected-smoothness preflight
  status: review_required
  objective: >-
    Test whether conorm-image classes from a prime-field elliptic subgroup have a
    reproducible E-projected smoothness and target-descent advantage over matched random
    Jacobian and same-field isogeny controls, after cover construction and projection
    costs are charged.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 13, 15, 17, 19]
    independent_base_curves_per_size: 30
    cover_degrees: [2, 3, 4]
    permitted_genera: [2, 3, 4]
    factor_base_beta_targets: [0.10, 0.15, 0.20]
    seeds: [2026071721, 2026071722, 2026071723]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - deliberately split small-genus Jacobian with planted smooth conorm classes
    - same-genus random curves and Jacobians with matched atom-base size
    - same-field small-degree E-to-E isogeny neighbors from the ledger mechanism
    - atoms with matched divisor smoothness but randomized E-factor images
    - exhaustive conorm, norm, projector, and divisor-equality checks at the smallest sizes
  independent_variables:
    - field bit size
    - cover degree and genus
    - base curve
    - conorm-image versus random-Jacobian class
    - atom-base exponent beta
    - permitted kernel or auxiliary-factor dither
  metrics:
    primary:
      - projected-smoothness probability and exponent delta
      - matched-control smoothness probability
      - divisor reduction and factor-test exponent r
      - cover and projector construction exponent c
      - admissible-cover reciprocal-density exponent zeta
      - individual target-descent exponent tau
      - full time exponent lambda=max(c+zeta,beta+delta+r,2*beta,tau)
    secondary:
      - conorm/norm identity failures
      - unexplained kernel terms
      - projected relation-matrix rank
      - atom-image collision count
      - peak memory and exponent mu
      - invalid and censored class counts
  replication:
    independent_instances: 150
    randomized_classes_per_arm: 1000
    target_descents_per_largest_size: 100
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 300
    maximum_memory_gb: 48
    maximum_runs: 5000
    maximum_output_gb: 50
  stopping_rules:
    - Stop a cover family after every instance at two consecutive sizes fails construction for the same validated mathematical reason; record the exact coverage boundary.
    - Stop larger cells after two consecutive sizes exceed 44 GB median peak memory; mark remaining cells censored_by_budget.
    - Halt on an accepted divisor or projected relation that fails independent verification and audit implementation validity before inference.
  invalidation_rules:
    - A run with an untracked kernel or auxiliary-factor contribution is invalid.
    - A cover with degree divisible by the target subgroup order is outside this contract.
    - Smoothness without a norm-compatible atom-logarithm path cannot enter promotion metrics.
    - Timeouts, missing Sage functionality, and construction crashes are infrastructure or coverage outcomes, not negative observations.
  success_criterion: >-
    Exact conorm/norm correctness; projected-smoothness exponent advantage at least 0.20
    over controls with a 95 percent interval excluding zero at the two largest sizes; and
    a preregistered beta<=0.20 with c+zeta<=0.20, delta+r<=0.20, tau<=0.45,
    mu<=0.45, upper 95 percent full-cost lambda<=0.45, and conclusions stable under the
    preregistered finite-size sensitivity.
  falsification_criterion: >-
    Validated noninjective conorm on the tested subgroup, no norm-compatible atom-log path,
    projected advantage slope at most 0.05, or lower 95 percent full-cost lambda>=0.50 for
    every constructed preregistered family.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-002/implementation.md
    - ideas/artifacts/ECDLP-IDEA-002/covers.jsonl
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/relations.jsonl
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-002/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-002/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-002
  from: coordinator
  to: executor
  objective: Implement and run the split-cover projection preflight exactly after approval.
  uncertainty_reduced: Whether the E factor has a projected smoothness/descent advantage rather than merely a valid cover representation.
  inputs:
    - ideas/ECDLP-IDEA-002_split_jacobian_projected_smoothness_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-002_split_jacobian_projection_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve construction failures and every kernel term.
    - Treat cover correctness and relation validity as non-promotion observations.
  deliverables:
    - immutable cover and run records
    - projected-smoothness comparison
    - complete target-descent traces
    - full rho and BSGS cost fit
  budget:
    wall_clock_seconds: 1080000
    memory_gb: 48
    maximum_runs: 5000
  completion_gate:
    - Every planned cover cell has a terminal state.
    - All accepted relations verify before and after norm projection.
    - Raw and summarized metrics agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
