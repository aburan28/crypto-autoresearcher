experiment:
  id: EXP-ECDLP-IDEA-056-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-056
  lane: conservative
  version: 1
  title: Shared-module transition-intersection and source-lift preflight
  status: review_required
  objective: >-
    Test whether the accepted logarithmic one-transition subgroup-norm primitive
    composes through a shared quotient module whose common-state nullspace is
    exactly the two-transition witness set and lifts to all source endpoints below
    the dense L^2 resultant and full rho/BSGS costs.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22, 24]
    independent_curves_per_size: 20
    deck_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    block_sizes: [2, 4, 8]
    exhaustive_truth_max_bits: 16
    seeds: [20260717561, 20260717562, 20260717563]
    phase_1: exact_biconditional_and_source_lift_before_scaling
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - reproduced logarithmic one-transition norm and endpoint extractor
    - planted implicit sparse operators with known shared module and source labels
    - matched random sparse operators with no shared state
    - exhaustive two-transition roots and sources through 16 bits
    - dense two-transition resultant with all construction and solve costs
    - explicit L^2 pair matrix
    - block Wiedemann after materializing the resultant barred from mechanism credit
  independent_variables:
    - field bit size
    - curve instance
    - deck size L and factor-base exponent beta
    - block size and projection seed
    - known random relation target versus randomized challenge target
    - implicit shared-module method versus matched controls
    - permitted Krylov iteration and cache budget
  metrics:
    primary:
      - exact common-state biconditional and endpoint source-lift agreement
      - shared-module dimension and minimal-polynomial degree exponents in L
      - matvec setup Krylov iteration and source-lift exponent alpha in L
      - independent emitted rows per successful batch
      - build exponent a and relation and target density exponents delta and delta_t
      - full time exponent lambda=max(a,delta+beta*alpha,2*beta,delta_t+beta*alpha)
      - full memory exponent mu including operators projections sequences and caches
    secondary:
      - false missed ambiguous repeated and exceptional witness counts
      - block size extension degree coefficient height and output costs
      - relation rank target recoveries operation counts timings and peak memory
      - any materialized object with quadratic size in L
  replication:
    independent_instances: 180
    relation_batches_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 420
    maximum_memory_gb: 48
    maximum_runs: 14000
    maximum_output_gb: 70
  stopping_rules:
    - Stop before Phase 2 if any Phase 1 biconditional multiplicity or source-lift mismatch is independently reproduced.
    - Stop an arm if module dimension minimal-polynomial degree iterations setup or lift reaches an exact L^2 object.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve it as censored_by_budget.
    - Halt inference after any accepted relation or scalar fails independent curve verification.
  invalidation_rules:
    - Skipping the reproduced one-transition primitive invalidates the composition inference.
    - Materializing the dense resultant pair matrix or endpoint table invalidates the mechanism arm.
    - Target-selected projections scalar advice post-hoc row filters or discarded failed batches invalidate the arm.
    - A nullspace without endpoint sources cannot enter relation or target metrics.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 exact biconditional multiplicity and source-lift agreement with zero
    errors; at least 0.8L independent verified rows per accepted batch, 1000
    verified relations and 100 verified target descents at each of the two largest
    completed sizes; upper 95 percent alpha<=1.25 in the focal beta=0.20 arm,
    a<=0.45, lambda<=0.45, and mu<=0.45; stable sensitivity fits; and no
    materialized L^2 object in code artifacts or resource traces.
  falsification_criterion: >-
    An independently reproduced Phase 1 false positive false negative or source
    lift error; lower 95 percent exponent at least 2 in L for module dimension,
    iterations, setup, or source lift; fewer than 0.5L independent rows per batch
    at the two largest sizes; or lower 95 percent lambda>=0.50 for every
    complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-056/implementation.md
    - ideas/artifacts/ECDLP-IDEA-056/shared_module_identity.md
    - ideas/artifacts/ECDLP-IDEA-056/transition_intersection.sage
    - ideas/artifacts/ECDLP-IDEA-056/verify_sources.sage
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-056/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-056/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-056
  from: coordinator
  to: executor
  objective: Execute the shared-module Phase 1 identity and source-lift gate, then scale only after approval and an independent pass.
  uncertainty_reduced: Whether the accepted one-transition norm primitive composes without the dense L^2 resultant and emits source-labelled rows.
  inputs:
    - ideas/ECDLP-IDEA-056_block_krylov_transition_intersection_extractor_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-056_transition_intersection_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not enter Phase 2 after any Phase 1 error.
    - Preserve every operator projection sequence root source miss rank cache and censored cell.
    - Do not interpret a recurrence common root relation or toy scalar recovery as promotion.
  deliverables:
    - exact shared-module and biconditional derivation
    - exhaustive endpoint source-lift comparison
    - complete build density rank descent time and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 14000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
