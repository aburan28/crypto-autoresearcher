experiment:
  id: EXP-ECDLP-IDEA-160-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-160
  lane: high_risk
  version: 1
  title: Nonlogarithmic ramification-break scalar-digit theorem preflight
  status: review_required
  objective: >-
    Decide whether one canonical public local tower has a nonconstant
    prime-to-p scalar-sensitive ramification invariant with a typed return to
    Z/NZ and complete cost below rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    canonical_tower: unresolved
    nonlogarithmic_invariant: unresolved
    scalar_transformation_law: unresolved
    typed_digit_return: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-160" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - good-reduction prime-to-p torsion with trivial inertia
    - Lubin-Tate and field-of-norms p-primary towers
    - supplied N-torsion orientations and formal logarithms
    - Pollard rho and BSGS
  independent_variables:
    - curve instance, field size, and reduction type
    - tower functor, ramification numbering, and precision
    - known scalar endpoint versus masked blind target
    - digit ambiguity and reconstruction rule
  metrics:
    primary:
      - nonconstant scalar law and typed digit correctness
      - tower degree, precision, ambiguity, and verified full recovery
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - discriminant, branches, failures, reconstruction, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while status is review_required or the scalar law is unresolved.
    - Stop if inertia is trivial, the map is additive, or an N-torsion orientation is required.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied torsion basis, scalar-labelled tower, or post-hoc digit selector invalidates the arm.
    - Formal-logarithm and precision-only variants are controls.
    - Omitted tower degree, precision, branches, reconstruction, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proof supplies a canonical tower, nonlogarithmic scalar law,
    typed full return, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Trivial inertia, prime-to-p additive annihilation, N-scale orientation or
    tower state, false digits, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-160/ramification_data_gate.md
    - ideas/artifacts/ECDLP-IDEA-160/tower_digit_spec.md
    - ideas/artifacts/ECDLP-IDEA-160/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-160/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-160/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-160
  from: coordinator
  to: executor
  objective: Preserve the high-risk theorem preflight; do not dispatch it before independent approval.
  uncertainty_reduced: Whether public prime-to-p elliptic orbit data can affect a nonlogarithmic ramification invariant without N-scale orientation.
  inputs:
    - ideas/ECDLP-IDEA-160_nonlogarithmic_ramification_break_scalar_digits_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-160_ramification_break_digits_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied torsion orientation, scalar labels, or formal-log proxy.
    - Charge tower degree, precision, ambiguity, and full return.
  deliverables:
    - scalar-sensitive ramification theorem or trivial-inertia proof
    - typed digit/full-return theorem or orientation obstruction
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this review-required contract.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
