experiment:
  id: EXP-ECDLP-IDEA-435-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-435
  lane: conservative
  version: 1
  title: Function-field lifting face target-coefficient audit preflight
  status: review_required
  objective: >-
    Decide whether the infinity-norm-1 Mordell-Weil relations already recorded
    by EV-XEDN-* have a nonzero coefficient on the target section, and therefore
    whether face F5 escapes the canonical-height obstruction or is closed by
    target-blindness.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: artifact_read_no_new_lifting_runs
    target_section_existence_in_frozen_design: unresolved
    relation_vector_retention_in_EV-XEDN: unresolved
    planted_relation_positive_control: unresolved
    audited_evidence_records: "EV-XEDN-* as recorded for KN-FIND-003/004/005/010/011"
    audited_primes: [7, 13, 19, 31]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-435" || evidence_id || "20260809")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - planted dependent target section, where the audit must report a nonzero coefficient
    - provably independent target section, where the audit must report zero
    - forbidden-advice flag for any construction that used the scalar to place the target section
    - Pollard rho and BSGS as the standing baselines for any successor experiment
  independent_variables:
    - surface family and degree window
    - prime p in the audited set
    - identity of the target section versus the generator and auxiliary sections
  metrics:
    primary:
      - coefficient on the target section for every recorded relation
      - distribution of that coefficient per family and per p
      - detection rate of the planted positive control
    secondary:
      - relation infinity norm, as a consistency check against the recorded findings
      - count of relations for which the target section is undefined in the frozen design
  replication:
    audit_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 0
    future_relation_queries_at_each_of_two_largest_sizes: 0
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 0
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 0
    future_target_descents_at_each_of_two_largest_sizes: 0
    independent_verifier: required
  budget:
    audit_review_wall_clock_seconds: 259200
    maximum_runs: 0
    future_maximum_memory_gb: 8
    future_maximum_output_gb: 4
  stopping_rules:
    - Do not run while status is review_required.
    - Stop and report a derivation if the frozen experiment design never distinguished a target section; that alone establishes target-blindness by construction.
    - An audit that cannot detect the planted positive control is uninformative and must not be reported as a null result.
  invalidation_rules:
    - Re-running the lift at larger p, changing the degree window, or densifying enumeration are controls and do not substitute for the coefficient audit.
    - Post-hoc identification of the target section after seeing the relation invalidates the arm.
    - Reporting relation norm without the target coefficient invalidates the audit.
  success_criterion: >-
    A complete per-relation target-coefficient distribution with the planted
    positive control detected, yielding either a scoped negative that names
    target-blindness as the face-F5 obstruction, or one group-law-verified
    relation with nonzero target coefficient on a surface whose target section
    was frozen before the search.
  falsification_criterion: >-
    Failure of the planted positive control falsifies the instrument, not the
    hypothesis, and blocks reporting either outcome.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-435/relation_vector_extract.md
    - ideas/artifacts/ECDLP-IDEA-435/planted_control.py
    - ideas/artifacts/ECDLP-IDEA-435/target_coefficient_audit.md
    - ideas/artifacts/ECDLP-IDEA-435/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260809-435
  from: coordinator
  to: executor
  objective: Preserve the conservative audit preflight; do not dispatch it before independent approval.
  uncertainty_reduced: Whether this program's recorded function-field Mordell-Weil relations constrain the scalar at all.
  inputs:
    - ideas/ECDLP-IDEA-435_function_field_lift_target_coefficient_audit_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-435_target_coefficient_audit_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not re-run any lifting experiment; this is a read of stored evidence.
    - The planted positive control gates every reported outcome.
  deliverables:
    - determination of whether a distinguished target section existed in the frozen design
    - target-coefficient distribution or the derivation that makes it moot
    - proposed amendment to the KN-TECH-06bb4e face-F5 entry
  budget:
    wall_clock_seconds: 259200
    memory_gb: 8
    maximum_runs: 0
  completion_gate:
    - Every audit obligation is answered, or explicitly recorded as unresolved.
    - No experiment or scaling run occurred under this review-required contract.
    - All required artifact paths exist and are checksummed.
  return_format: audit_review
