experiment:
  id: EXP-ECDLP-IDEA-159-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-159
  lane: representation_changing
  version: 1
  title: Non-diagonal conormal-polar source blowup theorem preflight
  status: review_required
  objective: >-
    Decide whether one explicit target-independent non-diagonal polar ideal is
    nonunit on the generic all-distinct relation stratum and whether its
    normalized Rees valuations invert canonically to exact sources below rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    polar_ideal: unresolved
    generic_stalk: unresolved
    normalized_rees_bounds: unresolved
    valuation_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-159" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - IDEA-085 diagonal blowup and IDEA-097 generic unit-ideal no-go
    - published polar and Nash blowups with known exceptional data
    - random degree-matched ideals and dense normalization
    - Pollard rho and BSGS
  independent_variables:
    - curve instance, field size, and beta
    - frozen polar ideal and projective chart
    - generic all-distinct versus collision and ramification strata
    - known relation endpoint versus masked blind target
  metrics:
    primary:
      - generic-stalk nonunitness and normalized Rees degree
      - exact source and multiplicity recall with false-atom count
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - coefficients, charts, output, rank, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while status is review_required or the generic-stalk theorem is unresolved.
    - Stop if the ideal is unit generically or only labels branch/collision strata.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A target-selected polar direction or source-labelled exceptional divisor invalidates the arm.
    - A blowup backend change without a new ideal is a control.
    - Omitted normalization, outputs, rank, descent, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proofs give a generic nonunit ideal, bounded Rees construction,
    exact all-strata atom inverse, and complete exponents at most 0.45.
  falsification_criterion: >-
    A unit generic stalk, branch-only support, source collision, hidden
    annotation, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-159/non_diagonal_polar_theorem.md
    - ideas/artifacts/ECDLP-IDEA-159/rees_source_inverse_spec.md
    - ideas/artifacts/ECDLP-IDEA-159/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-159/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-159/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-159
  from: coordinator
  to: executor
  objective: Preserve the representation-changing theorem preflight; do not dispatch it before independent approval.
  uncertainty_reduced: Whether any non-diagonal polar ideal remains nonunit and source-separating on the generic relation stratum.
  inputs:
    - ideas/ECDLP-IDEA-159_non_diagonal_conormal_polar_source_blowup_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-159_conormal_polar_source_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No target-selected ideal or source-labelled exceptional data.
    - Charge normalization, atom output, rank, and descent.
  deliverables:
    - generic-stalk theorem or exact unit-ideal proof
    - valuation/source biconditional or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this review-required contract.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
