experiment:
  id: EXP-ECDLP-IDEA-012-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-012
  lane: conservative
  version: 1
  title: Aggregate complement-divisor witness and cost preflight
  status: review_required
  objective: >-
    Determine whether an aggregate line-bundle section/complement query can recover
    actual factor-base-supported divisors at a full build, query, density, linear-algebra,
    target-descent, and memory cost compatible with an exponent below 1/2, rather than
    returning only counts or reconstructing the known membership quotient.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [13, 14, 15, 16, 18, 20, 22]
    independent_curves_per_size: 20
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.16, 0.18, 0.20, 0.22]
    exhaustive_truth_max_bits: 16
    focal_arm:
      arity: 4
      beta: 0.20
    seeds: [20260717121, 20260717122, 20260717123]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - cyclic additive group with known scalar coordinates and FFT-recoverable witnesses
    - exhaustive symmetric-power divisor enumeration through 16 bits
    - random point sets with matched size and relation density
    - ledger membership-quotient Semaev solve on identical inputs
    - count-only aggregate query barred from witness and promotion metrics
    - explicitly charged B^m tuple table and target-indexed cache
    - matched generic 3SUM and kSUM preprocessing/query tradeoff at base size B
  independent_variables:
    - field bit size
    - curve instance
    - decomposition arity m
    - factor-base exponent beta
    - target point
    - aggregate versus membership-quotient implementation
    - allowed product-tree and cache budget
  metrics:
    primary:
      - target-independent build exponent a
      - aggregate witness-query exponent beta*kappa
      - relation and target reciprocal-density exponents delta and delta_t
      - applicable sparse linear-algebra exponent omega_s*beta
      - full time exponent lambda=max(a,beta+delta+beta*kappa,omega_s*beta,delta_t+beta*kappa)
      - full bit-memory exponent mu including every cache and product-tree node
    secondary:
      - exact count and witness agreement
      - false-witness and missed-witness counts
      - repeated-point and exceptional-divisor counts
      - relation-matrix rank and density
      - operations touching factor-base data per query
      - matched 3SUM and kSUM preprocessing time-space-query point
      - peak resident memory
  replication:
    independent_instances: 140
    relation_queries_per_cell: 1000
    target_descents_per_largest_size: 100
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 360
    maximum_memory_gb: 48
    maximum_runs: 12000
    maximum_output_gb: 60
  stopping_rules:
    - Stop larger exhaustive cells after 16 bits and continue only the preregistered aggregate and matched-control arms.
    - Stop a parameter arm after two consecutive sizes exceed 44 GB median peak memory; retain remaining cells as censored_by_budget.
    - Halt after any accepted divisor fails independent curve and section verification and audit implementation validity before inference.
  invalidation_rules:
    - Any mismatch with exhaustive counts or witnesses invalidates that implementation and cell; it is not mathematical falsification until independently reproduced.
    - A count without factor-base point witnesses cannot enter relation or target-descent metrics.
    - A target-indexed cache, scalar-coordinate oracle, explicit B^m table, or post-hoc base change is invalid for the mechanism arm.
    - A timeout, dependency failure, unsupported divisor case, or crash is infrastructure or coverage evidence only.
  success_criterion: >-
    Exact exhaustive agreement and zero incorrect accepted divisors; at least 1000
    independently verified relation witnesses and 100 target descents at each of the two
    largest completed sizes; upper 95 percent bounds kappa<=0.25, a<=0.45,
    delta<=0.22, delta_t<=0.22, omega_s*beta<=0.45, lambda<=0.45, and mu<=0.45 in
    the focal arm; stable conclusions under the preregistered finite-size sensitivity;
    and an explicit elliptic operation beyond matched generic preprocessing controls.
  falsification_criterion: >-
    After implementation validation, aggregate queries cannot recover witnesses; lower
    95 percent kappa>=0.50 in the focal arm; build or memory reaches exponent 0.50; the
    implementation reconstructs the membership quotient or an explicit tuple table; or
    every complete-cost configuration has lower 95 percent lambda>=0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-012/implementation.md
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/queries.jsonl
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/relations.jsonl
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-012/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-012/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-012
  from: coordinator
  to: executor
  objective: Implement and run the aggregate-divisor witness and cost preflight exactly after approval.
  uncertainty_reduced: Whether complement-divisor compression returns witnesses below the membership-quotient and kSUM preprocessing baselines.
  inputs:
    - ideas/ECDLP-IDEA-012_aggregate_complement_divisor_compression_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-012_aggregate_divisor_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every query, miss, ambiguity, exceptional divisor, cache, and censored cell.
    - Do not interpret counts, relations, or toy scalar recovery as promotion.
  deliverables:
    - immutable query and witness records
    - exhaustive-agreement and preprocessing-control report
    - relation and target-descent density fits
    - full rho and BSGS comparison with finite-size sensitivity
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 12000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted divisor and recovered scalar independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
