experiment:
  id: EXP-ECDLP-IDEA-158-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-158
  lane: conservative
  version: 1
  title: Nonfaithful x-only WNU and signed-source-lift theorem preflight
  status: review_required
  objective: >-
    Decide symbolically whether one nonfaithful x-only elliptic relation
    language avoids pp-definition of signed addition, admits a non-affine WNU,
    and has an exact all-sign-strata source lift within the full cost gate.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    signature: unresolved
    signed_addition_nondefinability: unresolved
    non_affine_wnu: unresolved
    exact_source_lift: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-158" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - faithful signed-addition signature and IDEA-146 affine-WNU no-go
    - manufactured nonfaithful bounded-width CSP with supplied source lift
    - bit-vector and Mal'tsev solver substitutions
    - Pollard rho and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - x-only signature and WNU arity
    - sign, repetition, infinity, and tangent strata
    - known relation endpoint versus masked blind target
  metrics:
    primary:
      - signed-addition pp-definability and WNU preservation
      - exact source and multiplicity recall with false-output count
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, query, lift branches, output, rank, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while status is review_required or any Phase 0 theorem is unresolved.
    - Stop if the signature pp-defines signed addition or the lift needs a source table.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A solver substitution without a new preserving operation is a control.
    - A supplied source, scalar label, or post-hoc sign rule invalidates the arm.
    - Omitted failures, branches, output, rank, descent, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proofs establish nondefinability, a non-affine sparse-base WNU,
    exact all-strata source lifting, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Signed-addition definability, affine collapse, one missed or false source,
    hidden source advice, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-158/nonfaithful_signature_theorem.md
    - ideas/artifacts/ECDLP-IDEA-158/wnu_signed_lift_spec.md
    - ideas/artifacts/ECDLP-IDEA-158/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-158/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-158/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-158
  from: coordinator
  to: executor
  objective: Preserve the conservative theorem preflight; do not dispatch it before independent approval.
  uncertainty_reduced: Whether an x-only quotient truly escapes the faithful-addition WNU no-go while retaining exact sources.
  inputs:
    - ideas/ECDLP-IDEA-158_x_only_nonfaithful_wnu_signed_lift_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-158_x_only_nonfaithful_wnu_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied source tuples, scalar labels, or post-hoc signatures.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - nondefinability and WNU theorem or scoped no-go
    - exact signed-source-lift theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this review-required contract.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
