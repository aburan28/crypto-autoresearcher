experiment:
  id: EXP-ECDLP-IDEA-050-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-050
  lane: representation_changing
  version: 1
  title: Spinor-matchgate identity and source-recovery preflight
  status: review_required
  objective: >-
    Determine whether complete prime-field elliptic addition signatures admit one
    public target-independent basis change into the matchgate variety, with exact
    Pfaffian witness self-reduction and complete fitted time and memory exponents
    below 1/2.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22]
    independent_curves_per_size: 20
    decomposition_arities: [3, 4]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    exhaustive_truth_max_bits: 16
    seeds: [20260717501, 20260717502, 20260717503]
    phase_1: symbolic_identity_only_before_any_scaling
    basis_search:
      grammar: degree_bounded_entries_in_complete_addition_signature_coordinates
      maximum_entry_degree: 2
      coefficient_enumeration: canonical_shortlex_over_base_field
      tie_break: lexicographically_first_exact_generic_identity
      reselection_per_curve_or_target: forbidden
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - known planar matchgate network under a random invertible basis
    - random signatures with matched arity sparsity and field
    - untransformed complete elliptic signature
    - ordinary flattening rank and generic tensor contraction
    - exhaustive factor-base tuple truth through 16 bits
    - target-selected or post-hoc basis arm barred from promotion
  independent_variables:
    - field bit size
    - curve instance
    - decomposition arity
    - factor-base exponent beta
    - target point
    - transformed versus untransformed signature
    - permitted planar width and cache budget
  metrics:
    primary:
      - exact Grassmann-Pluecker residual count in every addition chart
      - planar width exponent w
      - build exponent a and query plus self-reduction exponent q
      - relation and target reciprocal-density exponents delta and delta_t
      - full time exponent lambda=max(a,beta+delta+q,2*beta,delta_t+q)
      - full memory exponent mu including bases Pfaffian matrices and caches
    secondary:
      - exhaustive count and source-witness agreement
      - false missed ambiguous and exceptional witness counts
      - independent relation rank and target recoveries
      - coefficient heights operation counts timings and peak memory
  replication:
    independent_instances: 160
    relation_queries_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 360
    maximum_memory_gb: 48
    maximum_runs: 12000
    maximum_output_gb: 60
  stopping_rules:
    - Stop before scaling unless Phase 1 finds and independently verifies one generic basis satisfying every matchgate identity in every chart.
    - Stop scaling the mechanism after a symbolic generic matchgate-invariant violation is independently reproduced.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve it as censored_by_budget.
    - Halt inference after any accepted source witness fails independent curve verification.
  invalidation_rules:
    - Missing addition charts denominators or exceptional fibers invalidate the implementation.
    - Target-specific basis selection scalar coordinates explicit tuple tables or post-hoc planar subgraphs invalidate the mechanism arm.
    - Approximate Pfaffian values or count-only outputs cannot enter witness metrics.
    - Timeout crash unsupported dependency and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 exact generic matchgate identities under the frozen deterministic
    grammar and tie-break, exact exhaustive identities, zero incorrect source
    witnesses, at least 1000 verified relations and 100 verified target descents at
    each of the two largest completed sizes, upper 95 percent a<=0.45, q<=0.20,
    lambda<=0.45, and mu<=0.45, stable sensitivity fits, and an explicit public
    basis transform unavailable to the matched generic controls.
  falsification_criterion: >-
    Exhaustion of the frozen Phase 1 grammar without a generic exact basis, a
    generic matchgate-invariant violation, an independently reproduced false
    witness, required width or memory exponent at least 0.50, or lower 95 percent
    lambda>=0.50 for every complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-050/implementation.md
    - ideas/artifacts/ECDLP-IDEA-050/spinor_identities.sage
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-050/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-050/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-050
  from: coordinator
  to: executor
  objective: Implement and run the frozen matchgate identity and witness preflight only after approval.
  uncertainty_reduced: Whether elliptic addition lies in a useful public matchgate orbit with sub-rho witness recovery.
  inputs:
    - ideas/ECDLP-IDEA-050_spinor_matchgate_addition_transform_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-050_matchgate_identity_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every failed identity chart witness miss ambiguity cache and censored cell.
    - Do not interpret a Pfaffian value relation or toy scalar recovery as promotion.
  deliverables:
    - symbolic identity and complete-chart audit
    - exact source-witness comparison
    - full time memory density and sensitivity fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 12000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
