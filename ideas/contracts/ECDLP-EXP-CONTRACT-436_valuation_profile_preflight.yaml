experiment:
  id: EXP-ECDLP-IDEA-436-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-436
  lane: high_risk
  version: 1
  title: Local-torsion coordinate-valuation profile simulability preflight
  status: review_required
  objective: >-
    Decide whether any member of one frozen coordinate-valuation family on the
    canonical prime-to-p torsion lift is non-simulable in the generic group
    model, non-constant in the scalar, and invertible at precision growth
    strictly below one half.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: simulability_gate_only_no_runs
    ggm_simulability_of_valuation_family: unresolved
    nonconstant_scalar_law: unresolved
    precision_growth_exponent_rho_r: unresolved
    typed_inversion_with_bounded_ambiguity: unresolved
    frozen_functional_family: "v_p(x([k]S_hat) - x([j]S_hat)) truncated at precision r, and fixed digit statistics of [k]S_hat"
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-436" || field_bits || curve_index || "20260809")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - anomalous curves with #E(F_p) = p, where a p-adic separation is known to exist, as instrument calibration only and outside the ordinary target regime
    - random profiles at the same precision budget with no scalar dependence
    - supplied torsion orientations, charged as forbidden advice
    - Pollard rho, BSGS, known-scalar, and masked-target controls on every instance
  independent_variables:
    - curve instance, field size, and reduction type
    - precision r and the chosen functional member (j, r)
    - known scalar endpoint versus masked blind target
    - inversion ambiguity and reconstruction rule
  metrics:
    primary:
      - generic-group simulability verdict for the frozen family
      - non-constancy of the profile in k at fixed precision
      - fitted precision growth exponent rho_r across at least three n
      - lambda=max(a,delta+q,ell,u+q)
      - mu=max(a_m,q_m,u,ell_m)
    secondary:
      - per-query precision, ambiguity set size, failed inversions, and verification cost
  replication:
    gate_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    gate_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 32
    future_maximum_output_gb: 40
  stopping_rules:
    - Do not run while status is review_required or the simulability verdict is unresolved.
    - Stop immediately if the family is generic-group simulable; it is then closed at exponent one half by KN-FIND-002 and KN-FIND-b7e091 without any p-adic computation.
    - Stop if every member is constant in k, or if rho_r is at or above one half.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Any mapping into the formal group exits this mechanism and re-enters the closed classical face-F2 route.
    - Post-hoc selection of (j, r) after seeing the scalar is forbidden advice and scores zero.
    - Amortising away per-query precision invalidates the cost model.
    - Omitted ambiguity enumeration, verification, or peak memory invalidates the model.
  success_criterion: >-
    A proved non-simulability result for one frozen functional, a nonconstant
    scalar law that does not factor through any additive map killed by n, a
    fitted precision exponent strictly below one half, and a typed full-scalar
    return with complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Generic-group simulability, constancy on the orbit, rho_r at or above one
    half, required orientation advice, or a complete exponent at least 0.50
    closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate.md
    - ideas/artifacts/ECDLP-IDEA-436/profile_spec.md
    - ideas/artifacts/ECDLP-IDEA-436/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-436/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-436/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260809-436
  from: coordinator
  to: executor
  objective: Preserve the high-risk simulability gate; do not dispatch it before independent approval.
  uncertainty_reduced: Whether a non-group-theoretic coordinate invariant on the canonical torsion lift can be anything other than generic-group simulable.
  inputs:
    - ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-436_valuation_profile_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Produce the simulability gate memo before any other artifact.
    - No formal-group map, no supplied torsion orientation, no post-hoc functional selection.
    - Charge precision per query, ambiguity, and full return.
  deliverables:
    - generic-group simulability memo, or the precise operation that is not simulable
    - nonconstant scalar law and precision growth fit, or the constancy proof
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 32
    maximum_runs: 0
  completion_gate:
    - Every gate obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this review-required contract.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
