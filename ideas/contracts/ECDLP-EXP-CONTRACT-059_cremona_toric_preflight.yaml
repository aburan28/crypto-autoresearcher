experiment:
  id: EXP-ECDLP-IDEA-059-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-059
  lane: high_risk
  version: 1
  title: Cremona saturation and toric source-recovery preflight
  status: review_required
  objective: >-
    Determine whether a public target-independent elliptic-syzygy Cremona map
    lowers saturated mixed volume and exact source-resolving solve cost, rather
    than moving degree into exceptional components coefficients or inverse branches.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22, 23]
    independent_curves_per_size: 20
    decomposition_arities: [3, 4]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    exhaustive_truth_max_bits: 16
    seeds: [20260717591, 20260717592, 20260717593]
    phase_1: exact_map_inverse_saturation_and_solution_correspondence_before_scaling
    map_search:
      grammar: degree_bounded_cremona_words_from_frozen_generators
      maximum_word_length: 6
      coefficient_enumeration: canonical_shortlex_over_base_field
      tie_break: lexicographically_first_map_passing_phase_1
      reselection_per_curve_or_target: forbidden
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - documented equivalent-system lifting with certified strict mixed-volume decrease and invertible solution correspondence
    - random sparse systems with matched supports and degree
    - original saturated Semaev system
    - random birational maps of matched degree
    - unsaturated transformed system barred from promotion
    - exhaustive factor-base tuples through 16 bits
  independent_variables:
    - field bit size
    - curve instance
    - decomposition arity
    - factor-base exponent beta
    - target point
    - original versus transformed saturated system
    - permitted mixed-cell and inverse-branch budget
  metrics:
    primary:
      - saturated original and transformed mixed volumes
      - exceptional component and inverse branch counts
      - build exponent a and source-resolving query exponent q
      - relation and target reciprocal-density exponents delta and delta_t
      - full time exponent lambda=max(a,beta+delta+q,2*beta,delta_t+q)
      - full memory exponent mu including mixed cells coefficients and caches
    secondary:
      - false missed ambiguous and multiplicity witness counts
      - coefficient heights and saturation time
      - relation rank target recoveries operation counts timings and peak memory
  replication:
    independent_instances: 180
    relation_queries_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 540
    maximum_memory_gb: 48
    maximum_runs: 14000
    maximum_output_gb: 80
  stopping_rules:
    - Stop before scaling unless Phase 1 verifies the frozen map inverse saturation and exact solution correspondence independently.
    - Stop scaling after an independently reproduced generic saturation counterexample.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve censored results.
    - Halt inference after any transformed source witness fails independent verification.
  invalidation_rules:
    - Unsaturated mixed volume cannot enter promotion metrics.
    - Target-selected maps post-hoc discarded components scalar advice or tuple tables invalidate the mechanism arm.
    - Missing inverse branches denominators or exceptional components invalidate the implementation.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 exact map inverse saturation and solution correspondence under the
    frozen grammar and tie-break, exact exhaustive solution preservation, zero incorrect witnesses, at least
    1000 verified relations and 100 target descents at each of the two largest
    completed sizes, upper 95 percent transformed v<=0.20, a<=0.45, q<=0.20,
    lambda<=0.45, and mu<=0.45 with every exceptional branch and coefficient
    charged, stable sensitivity fits, and a map-specific advantage over controls.
  falsification_criterion: >-
    Saturation restores the original volume asymptotically, an independently
    reproduced lost or false source appears, inverse or coefficient exponent is
    at least 0.50, or lower 95 percent lambda>=0.50 in every complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-059/implementation.md
    - ideas/artifacts/ECDLP-IDEA-059/cremona_map.sage
    - ideas/artifacts/ECDLP-IDEA-059/polytopes/manifest.json
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-059/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-059/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-059
  from: coordinator
  to: executor
  objective: Implement and run the frozen Cremona toric preflight only after approval.
  uncertainty_reduced: Whether elliptic syzygies cause a saturated source-resolving mixed-volume reduction below rho.
  inputs:
    - ideas/ECDLP-IDEA-059_cremona_shrunk_toric_decomposition_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-059_cremona_toric_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every ideal mixed cell inverse branch witness miss cache and censored cell.
    - Do not interpret an unsaturated volume drop sparse solve or toy recovery as promotion.
  deliverables:
    - frozen map and saturation audit
    - exhaustive source-witness comparison
    - full time memory density and sensitivity fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 14000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
