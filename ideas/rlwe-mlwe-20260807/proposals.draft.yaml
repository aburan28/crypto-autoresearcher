# STAGING DRAFT — five new idea records extending the 2026-08-06 portfolio
# after its pressure test. Not ledger records. IDs verified free 2026-08-07.
# Each targets a specific gap the pressure test exposed rather than a fresh
# untested speculation, per the "close what's open before opening what's new"
# ordering GOAL-RLWE-001/003 already establish.

ideas:

  - id: IDEA-20260807-7caf6e
    question_id: RQ-RLWE-be8f64
    title: >-
      Measure the CIRCULANT NTRU fatigue point directly -- GOAL-RLWE-001's
      success criterion currently has no legitimate reference value
    class: prerequisite_measurement
    claim: >-
      Ducas-van Woerden's concrete fatigue constant 0.004 is calibrated on
      MATRIX NTRU (their Fig. 7), and DvW explicitly note matrix "slightly
      favours the attacker" while circulant shows "a larger variance in the
      concrete hardness". GOAL-RLWE-001's fitted exponent q*(n) for the
      R-LWE/M-LWE module has nothing correct to compare against until a
      circulant-NTRU reference point exists. This is a small, self-contained
      measurement: run the SAME DSD detector already built and validated for
      EXP-RLWE-59d3fb on CIRCULANT NTRU instances specifically (not matrix),
      across the same n sweep, to obtain a circulant-calibrated q*_circ(n).
    mechanism: >-
      No new theory -- reuse the detector, apply it to the correct object.
      The only reason this is a separate idea rather than a line item is that
      it is a PREREQUISITE for interpreting GOAL-RLWE-001's main result, not
      an optional extra, and the pressure test flagged its absence as a
      blocking gap in the goal's own completion criterion.
    novelty_status: not_a_mechanism
    novelty_screen: >-
      Not a novelty claim. If DvW or a follow-up already reports a circulant
      constant this reduces to confirming it against a primary source, which
      is itself useful (this program has never independently reproduced ANY
      NTRU fatigue constant, matrix or circulant).
    predicted_effect: >-
      A circulant q*_circ(n) close to but distinct from the matrix curve, with
      the higher variance DvW describe qualitatively -- i.e. a wider
      confidence interval at fixed n, not necessarily a shifted mean.
    cheapest_decisive_test: >-
      Identical harness to EXP-RLWE-59d3fb's NTRU control, run at n in
      {16,32,64} with circulant (not matrix) NTRU sampling, sweeping q around
      the matrix-curve prediction to bracket where circulant instances
      actually flip.
    risks:
      - If DvW's own paper (once obtained) already reports the circulant constant with sufficient precision, this idea reduces to a primary-source read rather than an experiment -- cheaper, and should be checked first.
      - Circulant NTRU sampling conventions vary across papers (which coefficient distribution, which normalization); pin one explicitly before running.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-a80c17
    question_id: RQ-RLWE-912fdb
    title: >-
      Cheap discriminating test against Ogilvie 2026/279 -- does her
      primal+dual ring-symmetry framework predict the same kappa=128 ML-KEM
      point as the corrected kappa-surface
    class: novelty_resolution
    claim: >-
      The 2026-08-06 pressure test found Ogilvie's abstract-only paper is the
      highest-value unresolved gap in the kappa-surface lane: it incorporates
      a ring-symmetry mechanism into "both primal and dual hybrid frameworks",
      which could subsume the kappa-surface entirely or could be a different
      construction that happens to share a description. Full text is
      Cloudflare-blocked. Rather than wait on acquisition, this idea proposes
      a DISTINGUISHING PREDICTION: if her framework and the kappa-surface
      compute the same object, they must agree on the specific ML-KEM
      operating point (n=256, kappa=128, the corrected beta_resid=152.445 /
      max(beta_c,beta_resid)=233 figures from the pressure test). If a
      reviewable summary, talk recording, or any secondary source states her
      framework's ML-KEM-scale number, comparing it against 233 resolves the
      collision question WITHOUT needing the PDF.
    mechanism: >-
      Not a new algorithm -- an acquisition-independent falsification test for
      a prior-art question. If no secondary source states a comparable number,
      this idea has no cheap resolution and the goal remains genuinely gated
      on the PDF.
    novelty_status: not_a_mechanism
    novelty_screen: >-
      This IS the novelty screen for IDEA-20260806-b37e8e, made concrete and
      actionable rather than left as "read the full text eventually".
    predicted_effect: >-
      Unknown by design -- either the numbers agree (collision, fold the
      kappa-surface framing into hers with attribution) or disagree (distinct
      constructions, proceed independently) or no comparable number is found
      anywhere (inconclusive, PDF acquisition remains the only route).
    cheapest_decisive_test: >-
      Search for any talk slides, thesis chapter, follow-up citing paper, or
      author social-media summary that states a concrete ML-KEM-scale
      block-size or bit-count result from her framework. Compare directly
      against 233 (this program's corrected figure) before concluding
      anything about collision.
    risks:
      - If no secondary source exists, this costs a bounded search with a null result and changes nothing -- cheap enough to attempt regardless.
      - A superficial numeric match does not prove the frameworks are identical; treat agreement as suggestive, not conclusive, without reading her actual construction.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-aee47c
    question_id: RQ-RLWE-be8f64
    title: >-
      Cheap gate-clearing test for the merged M7/M8 lane: does CDPR-style
      log-embedding machinery beat brute force on toy rank-2 BDD at all,
      before any Stickelberger-scale investment
    class: gate_test
    claim: >-
      M8 was reopened (its collapse argument was false) and merged into M7's
      gate. M7 itself is a moonshot correctly held pending M1+M9. But the
      MINIMAL version of M8's original question -- can log-embedding /
      l-infinity unit-group geometry help BDD on the rank-2 R-LWE module AT
      ALL -- is answerable far more cheaply than resolving whether the
      Stickelberger rank-2 barrier is intrinsic. At m=1 (already rank-2 per
      the pressure test's off-by-one correction), run CDPR-style
      log-embedding search on TOY instances (n<=16, small search space) and
      compare its search cost against brute-force BDD. This is a gate test,
      not an attempt at the full moonshot: a negative result here (no
      improvement even at toy scale) is informative and cheap; a positive
      result is the first real evidence to justify opening the expensive M7
      lane early.
    mechanism: >-
      Directly reuses CDPR/DPW's unit-group reduction machinery (the same
      machinery M7 names), applied to the ERROR vector of a toy rank-2
      instance rather than to an ideal generator -- the move M8 originally
      proposed and that PORTFOLIO.md's corrected text says is "genuinely open".
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED. This is the same open question PORTFOLIO.md already flags;
      screening it is inherited from M7's existing (HIGH) prior-art risk and
      is not repeated here. The contribution of this idea is scoping it down
      to a toy-scale gate test rather than leaving it as an unscoped moonshot.
    predicted_effect: >-
      No prediction offered -- the point of a gate test is that the outcome is
      genuinely unknown at this scale, unlike M9 where the mechanism already
      predicted (and proved) the answer.
    cheapest_decisive_test: >-
      n in {4,8,16}, m=1, small q. Brute-force BDD search cost vs
      log-embedding-guided search cost, same instances, same success
      criterion (recover the unique short-short (s,e) pair, per the
      pressure test's uniqueness finding at n=8).
    risks:
      - Toy-scale results here may not be indicative of anything at the ring degrees where M7 would matter -- this is explicitly a gate test, not a scaling study, and must not be reported as more.
      - Still gated behind M1 and M9 per the existing goal ordering; do not open early even though it is cheap.
    status: deferred
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-04d21f
    question_id: RQ-RLWE-fe4e1f
    title: >-
      Use the kappa-surface's non-ideal machinery to SEARCH FOR concrete weak
      non-ideal R'-submodules, rather than only testing known ideal instances
    class: mechanism
    claim: >-
      Two threads in the corrected portfolio point at the same gap without
      connecting to each other. M4's residual (post-Peikert) novelty is
      narrowly the non-ideal R'-submodule case, where Peikert's algebraic-norm
      immunity bound provably fails -- but M4 as scoped only TESTS whether a
      given L smooths, it does not search for weak L. Separately, the
      kappa-surface's subring-descent endpoint (kappa=n-n/f) already
      constructs non-ideal R'-submodule structure as a byproduct of computing
      alpha in R'_q. This idea merges them: use the descent machinery's
      already-built R'-submodule objects as CANDIDATES fed into M4's smoothing
      test, searching for a non-ideal L with anomalously large bias, rather
      than only confirming ML-KEM is flat against the ideal case.
    mechanism: >-
      For each short c with alpha = sum c_i a_i in R'_q (already computed by
      the descent construction), the kernel of the associated R'-module map is
      a candidate L for M4's bias test. This is a NEW search strategy for M4,
      not a new theoretical claim -- it reuses machinery from two already-built
      lanes instead of a uniform or hand-constructed L family.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED. Depends on M2/M5's Stange 2019/183 and Ogilvie 2026/279
      screening (HIGH risk, per the pressure test) and on M4's Peikert
      2016/351 re-scoping both landing first -- if either upstream lane
      changes shape, this connector idea needs re-deriving, not just
      re-running.
    predicted_effect: >-
      Most likely: no anomalous L found, since the descent construction's
      alpha values are engineered for a different purpose (short
      combinations) and there is no a priori reason they concentrate bias.
      A discovery here would be the most surprising positive result available
      in the whole portfolio and should be treated with proportionate
      skepticism (independent re-derivation, positive control) before being
      believed.
    cheapest_decisive_test: >-
      At n=8-16, generate the descent construction's R'-submodule candidates
      already computed for the kappa-surface sweep, feed each through M4's
      bias instrument (once it passes its own EHL/ELOS positive control), and
      report the bias distribution against the null (random L of matched
      index).
    risks:
      - Gated behind BOTH M2/M5's novelty resolution and M4's re-scoping; do not build before either lands.
      - Repurposing objects built for one purpose (short vectors) as candidates for an unrelated property (smoothing failure) has no structural reason to work; treat a negative result as the likely and uninformative default, not a failure of the search.
    status: deferred
    proposed_by: session
    proposed_at: '2026-08-07'

  - id: IDEA-20260807-b2ccb3
    question_id: RQ-RLWE-912fdb
    title: >-
      Test the boundary of H-RLWE-1fb603's Arora-Ge proof: does the deficit
      reopen for ASYMMETRIC bounded error support
    class: boundary_test
    claim: >-
      H-RLWE-1fb603's mechanism is a proof, not a heuristic, but it has an
      explicit precondition: the error support [-B,B] must be SYMMETRIC about
      0, which is what lets prod_k(-A-k) = (-1)^(2B+1)*prod_k(A-k) collapse
      the Galois orbit. ML-KEM's CBD error is symmetric by construction, so
      the proof applies there cleanly -- but some FHE schemes and some
      side-channel-hardened variants use deliberately SKEWED or biased error
      distributions (e.g. asymmetric rounding, or masked share reconstruction
      that shifts the effective support). This idea tests whether the deficit
      reopens -- whether ring structure supplies genuinely new equations --
      once the symmetry precondition is dropped.
    mechanism: >-
      Direct extension of EXP-RLWE-a2253c's harness: rerun the same rank
      comparison against the same unstructured control, but with error support
      [-B, B+k] for k>0 (asymmetric), and separately with a non-uniform weight
      on the support (biased rather than shifted). The signed-permutation
      identity P_t*Neg(a)=Neg(sigma_t(a))*P_t still holds (it is about the
      RING, not the error distribution) -- what changes is whether
      prod_k(-A-k) still equals +/-prod_k(A-k) once the support is not
      symmetric, which is the step the mechanism's proof needs and which an
      asymmetric support breaks by construction.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED for asymmetric-error Arora-Ge specifically. Standard
      Arora-Ge literature typically assumes symmetric or uniform bounded
      error; whether anyone has examined the ring-structured asymmetric case
      is unknown and cheap to check once this idea is prioritized.
    predicted_effect: >-
      PREDICTED: the deficit reopens, i.e. ring structure DOES supply new
      equations once symmetry breaks, because the proof mechanism's collapse
      step explicitly requires it. This is a testable, falsifiable prediction
      in the same spirit as M9's original one -- and if confirmed, it would be
      a genuinely new (if narrow) positive result: a concrete regime where
      ring structure measurably helps an algebraic attack.
    cheapest_decisive_test: >-
      Rerun EXP-RLWE-a2253c's rank comparison at n in {4,8,16} with
      deliberately asymmetric support (e.g. [-1,3] instead of [-2,2]) and
      check whether rank_structured - rank_unstructured_control becomes
      strictly positive.
    risks:
      - If confirmed, the practical relevance is narrow (which real schemes actually use asymmetric error is a separate, non-trivial question to establish before treating this as anything beyond a structural curiosity).
      - Directly dependent on EXP-RLWE-a2253c's harness existing and working first; sequence after it, not in parallel.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-07'
