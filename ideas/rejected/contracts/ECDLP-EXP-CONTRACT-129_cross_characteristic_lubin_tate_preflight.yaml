experiment:
  id: EXP-ECDLP-IDEA-129-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-129
  lane: representation_changing
  version: 1
  title: Cross-characteristic Lubin-Tate formal-logarithm no-go preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: formal_logarithm_annihilates_finite_torsion
  objective: >-
    Preserve and independently verify the exact theorem that a characteristic-zero
    Lubin-Tate formal logarithm kills every in-domain finite torsion point, so it
    cannot normalize a public prime-order elliptic generator to one.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    formal_group_logarithm_identity: log_F_of_N_torsion_is_zero
    additive_target_characteristic: zero
    convergence_domain_boundary: required
    nonlogarithmic_successor: outside_this_id
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-129" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - native Lubin-Tate torsion with a supplied generator
    - characteristic-zero additive groups with no nonzero finite torsion
    - points outside the formal-logarithm convergence domain
    - random global lifts, scalar-normalized torsion bases, and explicit torsion tables
    - same-field formal jets, pairings, isogenies, Pollard rho, and BSGS
  independent_variables:
    - formal module and torsion level
    - convergence domain and coefficient field
    - globalization, ramification, basis, precision, and height
    - known relation target versus fresh masked blind target
    - ambiguity, source output, verification, and memory budgets
  metrics:
    primary:
      - exact identity log_F([N]_F T)=N*log_F(T)=0
      - proof that the characteristic-zero additive target is torsion-free
      - setup exponents s and s_m including globalization and torsion fields
      - complete query and source-output exponents alpha and m_q
      - lambda=max(s*ell,1+(alpha-4)*ell,2*ell,1+(alpha-5)*ell)
      - mu=max(s_m*ell,m_q*ell,ell)
    secondary:
      - convergence failures, ramification branches, coefficient heights, and precision
      - confirmation that no relation, factor-log, or blind-descent run was dispatched
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run; the declared formal-logarithm coordinate is closed by the torsion theorem.
    - Stop if a proposed repair leaves the logarithm convergence domain or replaces the logarithm with a different operation.
    - Any nonlogarithmic ramification or Galois digit mechanism requires a new idea ID and semantic fingerprint.
    - A theorem correction must be versioned and independently reviewed before any state change.
  invalidation_rules:
    - A formal logarithm evaluated outside its convergence domain is not this mechanism.
    - A supplied torsion generator, scalar-labelled basis, or post-hoc normalization is forbidden advice.
    - Omitting globalization, height, precision, output, rank, blind descent, verification, or memory invalidates cost claims.
    - A toy coordinate on nontorsion points does not refute the finite-torsion no-go.
  success_criterion: >-
    An independent theorem note proves the torsion-annihilation identity on the exact
    convergence domain, records the outside-domain boundary, and confirms that zero
    ECDLP runs were authorized under this retired draft.
  falsification_criterion: >-
    The algorithmic hypothesis is already falsified: every in-domain finite torsion
    point maps to zero, while outside-domain evaluation is not the claimed formal
    logarithm. Any different operation is outside this ID.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-129/globalization_gate.md
    - ideas/artifacts/ECDLP-IDEA-129/marked_global_model.yaml
    - ideas/artifacts/ECDLP-IDEA-129/lubin_tate_coordinate.sage
    - ideas/artifacts/ECDLP-IDEA-129/verify_globalized_sources.py
    - ideas/artifacts/ECDLP-IDEA-129/analysis.md
  assigned_to: none
  approved_by: null

