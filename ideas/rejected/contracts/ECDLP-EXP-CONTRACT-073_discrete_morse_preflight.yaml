  from: coordinator
  to: executor
  objective: Preserve the retired theorem gate; do not implement or scale until a successor freezes the chain complex and proves the universal matching and source-lift theorem.
  uncertainty_reduced: Whether algebraic discrete-Morse cancellation removes source-labelled addition-complex cells without losing exact witnesses or paying rho-scale paths.
  inputs:
    - ideas/deferred/ECDLP-IDEA-073_algebraic_discrete_morse_source_contraction_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-073_discrete_morse_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch; a versioned successor requires coordinator approval.
    - Do not enter scaling after any Phase 1 identity acyclicity or source-lift error.
    - Preserve every cell match path source miss rank cache and censored cell.
    - Do not interpret preserved homology a valid relation or toy scalar recovery as promotion.
  deliverables:
    - frozen matching specification and acyclicity proof artifact
    - exhaustive chain-homotopy and source-lift comparison
    - complete setup density rank descent time and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 14000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
