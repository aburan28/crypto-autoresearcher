experiment:
  id: EXP-ECDLP-IDEA-073-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-073
  lane: conservative
  version: 1
  title: Source-labelled algebraic discrete-Morse contraction preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: missing_explicit_chain_complex_universal_matching_and_source_lift_theorem
  objective: >-
    Determine whether a frozen acyclic matching on the source-labelled elliptic
    addition complex cancels nonwitness cells while preserving an exact chain
    homotopy from every critical relation cell to its factor-base sources, with
    complete relation, rank, target-descent, time, and memory costs below rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22, 24]
    independent_curves_per_size: 20
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    matching_grammars:
      - frozen_lexicographic_source_pivot
      - frozen_degree_then_source_pivot
    exhaustive_truth_max_bits: 16
    seeds: [20260717731, 20260717732, 20260717733]
    phase_1: exact_acyclicity_chain_homotopy_and_source_lift_before_scaling
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - exhaustive source-labelled boundary complex and homology
    - planted acyclic complexes with known source-preserving contractions
    - matched random acyclic matchings with no elliptic source rule
    - deliberately cyclic matching rejected by the Phase 1 verifier
    - dense boundary reduction with full construction and source-backsubstitution cost
    - Pollard rho and BSGS under matched operation accounting
  independent_variables:
    - field bit size and curve instance
    - decomposition arity and factor-base exponent beta
    - frozen matching grammar
    - relation target versus masked blind target
    - critical-cell and gradient-path budget
    - sparse implicit versus materialized dense boundary representation
  metrics:
    primary:
      - exact acyclicity and chain-complex identity agreement
      - critical-cell to exhaustive-witness biconditional agreement
      - exact source lift and gradient-path reconstruction rate
      - full complex construction exponent c_full and implicit setup exponent s
      - critical-cell exponent gamma per-query/source-lift exponent q and output exponent o
      - reciprocal relation and target-density exponents delta and delta_t
      - full time exponent lambda=max(c_full,s,gamma,beta+delta+q+o,2*beta,delta_t+q+o)
      - full memory exponent mu including cells matching data paths and caches
    secondary:
      - critical-cell count and gradient-path length distributions
      - relation rank and blind target recovery rate
      - operation counts timings peak memory and serialized output bytes
  replication:
    independent_instances: 180
    relation_queries_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 540
    maximum_memory_gb: 48
    maximum_runs: 14000
    maximum_output_gb: 80
  stopping_rules:
    - Stop before scaling unless Phase 1 proves acyclicity, chain homotopy, and exact source lift independently.
    - Stop after one independently reproduced generic cyclic matching or false or lost source.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve censored results.
    - Halt inference after any accepted relation or recovered scalar fails independent verification.
  invalidation_rules:
    - Target-selected matching rules post-hoc cell deletion and hidden source tables invalidate the mechanism arm.
    - Counting only critical cells while omitting complex construction matching gradient paths or output invalidates cost claims.
    - A matching that queries target reachability or fails the universal-target tuple test assumes the missing source oracle.
    - A homology-preserving contraction without a source inverse is a relation-only control.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 exact identities and source lift pass on every exhaustive instance;
    at least 1000 verified relations and 100 blind target descents pass at each
    of the two largest completed sizes; upper 95 percent bounds satisfy
    s<=0.45, q<=0.20, lambda<=0.45, and mu<=0.45 with all cells, paths, rank,
    output, and setup charged; and the frozen elliptic matching beats every
    matched control without target-specific selection.
  falsification_criterion: >-
    A generic matching cycle, lost or ambiguous source, nonwitness critical
    cell, chain-homotopy failure, or lower 95 percent lambda>=0.50 in every
    complete-cost arm falsifies the stated mechanism at the tested boundary.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-073/implementation.md
    - ideas/artifacts/ECDLP-IDEA-073/matching_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-073/verifier.py
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-073/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-073/analysis.md
  assigned_to: none
  approved_by: null

