experiment:
  id: EXP-ECDLP-IDEA-341-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-341
  lane: representation_changing
  version: 1
  title: Butterfly source-transform preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: complementary_low_rank_factorization_requires_the_dense_source_matrix_and_exact_inverse_restores_source_state
  objective: >-
    Preserve the representation-changing theorem and input audit for the proposed
    butterfly source transform without dispatching an experiment.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    implicit_public_complementary_low_rank_operator: unresolved
    target_update_without_refactorization: unresolved
    exact_all_strata_source_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-341" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - explicit complementary-low-rank matrices with supplied row and column labels
    - random dense matrices, source-permuted matrices, exact tables, rho, and BSGS
  independent_variables:
    - operator construction, exact finite-field complementary block rank, block depth, inverse ambiguity, target update, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - implicit construction, exact block rank, inverse source recall, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - operator access, factor blocks, precision, inverse output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any operator, rank, update, or inverse theorem is unresolved.
    - Stop if construction reads the dense source matrix, exact inverse state reaches source-deck scale, or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied dense source matrix, source-labelled blocks, post-hoc low rank, or approximate-only inverse invalidates the arm.
    - Correct transforms of supplied complementary-low-rank matrices are only positive controls.
    - Omitted construction, precision, output, rank, logs, descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an implicit exact complementary-low-rank operator,
    cheap target update, exact source inverse, campaign/state at most B^(9/4),
    query at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Dense operator access, approximate-only rank, source-sized inverse state, one
    missed source, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-341/operator_ordering_spec.md
    - ideas/artifacts/ECDLP-IDEA-341/exact_block_rank_receipt.md
    - ideas/artifacts/ECDLP-IDEA-341/source_causal_cone_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-341/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-341
  from: coordinator
  to: executor
  objective: Preserve the retired butterfly-transform theorem review; do not dispatch it.
  uncertainty_reduced: Whether an implicit exact low-rank operator and source inverse exist.
  inputs:
    - ideas/rejected/ECDLP-IDEA-341_butterfly_complementary_low_rank_source_transform_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-341_butterfly_source_transform_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply a dense source matrix, source-labelled factor blocks, or post-hoc selector.
    - Charge construction, precision, inverse output, rank, logs, descent, verification, and memory.
  deliverables:
    - operator-access and exact-rank theorem receipt
    - target-update and all-strata inverse audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
