experiment:
  id: EXP-ECDLP-IDEA-231-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-231
  lane: representation-changing
  version: 1
  title: Operator-scaling shrunk-subspace exact-source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_operator_tuple_materializes_source_tensor_and_span_not_atoms
  objective: >-
    Decide theorem-first whether an endpoint relation fiber has a compact
    implicit operator tuple whose scaling limit and minimum shrunk subspace
    canonically return all exact signed point sources without a dense tensor.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    implicit_operator_compiler: unresolved
    canonical_shrunk_subspace_point_inverse: unresolved
    source_tensor_factorization_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-231" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied operator tuples with known capacity, noncommutative rank, and shrunk subspaces
    - basis-conjugated and source-permuted tuples plus IDEA-001, IDEA-056, IDEA-135, and IDEA-142
    - dense relation tensors, Semaev fibers, rho, and BSGS
  independent_variables:
    - tuple grammar, dimensions, basis, scaling precision, rounding rule, source inverse, and mask
    - known-log endpoint versus fresh masked blind target
    - signs, repeats, boundary strata, condition number, ambiguity, and retained tuple state
  metrics:
    primary:
      - exact-source recall, false sources, tuple traffic, iterations, output, rank, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, matvecs, precision, rounding, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the implicit operator/source theorem is unresolved.
    - Stop if the tuple materializes source tensor entries or if atom labels depend on an arbitrary basis.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source tensor, hidden rounding dictionary, or uncharged precision/output invalidates the arm.
    - Toy scaling convergence is a control and cannot establish point-source recovery or asymptotics.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a compact endpoint operator and canonical
    all-strata shrunk-subspace-to-point inverse, with complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    One basis-equivalent/different-source collision, explicit tensor payload,
    missed or false source, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-231/implicit_operator_source_theorem.md
    - ideas/artifacts/ECDLP-IDEA-231/operator_scaling_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-231/independent_shrunk_subspace_verifier.py
    - ideas/artifacts/ECDLP-IDEA-231/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-231
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether operator scaling exposes canonical exact point sources without materializing the relation tensor.
  inputs:
    - ideas/rejected/ECDLP-IDEA-231_operator_scaling_shrunk_subspace_source_atomizer_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-231_operator_scaling_source_atomizer_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply a relation tensor or treat capacity, rank, or a subspace span as exact sources.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - implicit operator/source theorem or source-tensor factorization proof
    - all-strata source biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
