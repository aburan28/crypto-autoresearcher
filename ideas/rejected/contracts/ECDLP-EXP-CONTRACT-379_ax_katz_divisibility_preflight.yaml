experiment:
  id: EXP-ECDLP-IDEA-379-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-379
  lane: high_risk
  version: 1
  title: Ax-Katz exact-existence divisibility preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: aggregate_divisibility_does_not_separate_empty_from_positive_multiple_fibres_and_deck_encoding_restores_source_scale
  objective: >-
    Preserve a theorem-only high-risk audit of whether Ax-Katz valuations can
    supply an exact restricted-existence bit and occurrence-source bisection for
    the complete finite-deck relation fibre.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    low_degree_endpoint_only_deck_encoding: unresolved
    empty_nonempty_valuation_gap: unresolved
    exact_restricted_occurrence_source_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-379" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_low_degree_systems_with_independently_known_zero_counts
    - positive_exact_Ax_Katz_valuation_reproduction
    - negative_empty_and_positive_p_power_count_with_equal_receipt
    - negative_high_degree_finite_deck_indicator_encoding
  independent_variables:
    - polynomial_degrees_variables_and_field_characteristic
    - restricted_fibre_cardinality_and_p_adic_valuation
    - signed_chart_and_nonreduced_stratum
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - valuation_receipt_exactly_separates_empty_and_nonempty_restricted_fibres
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - deck_indicator_degrees_variables_and_exact_counting_work_are_fully_charged
      - exact_source_bisection_preserves_occurrence_labels_and_all_strata
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_one_empty_and_nonempty_fibre_share_the_proposed_divisibility_receipt
    - stop_if_deck_encoding_requires_source_selectors_or_supergate_degree
    - stop_if_exact_counting_or_restriction_replay_is_source_scale
    - stop_if_one_signed_or_nonreduced_stratum_is_missed
  invalidation_rules:
    - invalidate_if_a_divisibility_bound_is_reported_as_an_exact_count
    - invalidate_if_a_nonzero_count_is_inferred_from_zero_modulo_p_power
    - invalidate_if_relation_validity_is_substituted_for_source_recovery
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem gives an endpoint-only low-degree deck encoding, an exact
    empty/nonempty valuation gap, subgate computation, and restriction-stable
    occurrence-source lift satisfying every complete path gate.
  falsification_criterion: >-
    The preflight is falsified by one empty/nonempty receipt collision, source-
    scale deck encoding or exact counting, one missed stratum, or complete time
    or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-379/valuation_gap_obligations.md
    - ideas/artifacts/ECDLP-IDEA-379/empty_nonempty_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-379/source_bisection_receipt.json
    - ideas/artifacts/ECDLP-IDEA-379/cost_analysis.md
  assigned_to: none
  approved_by: null

