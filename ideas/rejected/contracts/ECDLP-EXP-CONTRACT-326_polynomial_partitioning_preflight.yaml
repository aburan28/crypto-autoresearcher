experiment:
  id: EXP-ECDLP-IDEA-326-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-326
  lane: conservative
  version: 1
  title: Polynomial-partitioned Abel-Jacobi incidence theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: partitioning_requires_pair_pair_hyperplanes_and_has_no_frozen_finite_field_source_theorem
  objective: >-
    Preserve the conservative theorem audit locating the first pair-pair query or
    conflict-list object and testing whether any finite-field partition theorem avoids it.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_free_finite_field_partition: unresolved
    pair_pair_query_avoidance: unresolved
    exact_all_strata_source_replay: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-326" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied real point-hyperplane instances with independently verified incidences
    - random finite-field pair-wedge families, explicit pair-pair routing, rho, and BSGS
  independent_variables:
    - partition degree, field size, pair-family size, boundary recursion, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, pair-pair queries, crossed cells, relation rank, factor-log completion, blind descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - partition construction, conflict lists, boundary state, output, ambiguity, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or either partition/source theorem is unresolved.
    - Stop if constructing queries or conflict lists materializes B^3 state or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Supplied source incidences, pair-pair hyperplanes, post-hoc partitions, or real-sign cells used as finite-field cells invalidate the arm.
    - Correct reporting on supplied incidence objects is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a source-free finite-field partition and routing theorem,
    exact all-strata replay, campaign/state at most B^(9/4), query at most B^(5/4),
    blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Pair-pair query or conflict state at B^3, one missed source stratum, real/finite-field
    domain failure, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-326/partition_query_materialization_receipt.md
    - ideas/artifacts/ECDLP-IDEA-326/finite_field_partition_obligations.md
    - ideas/artifacts/ECDLP-IDEA-326/incidence_controls.json
    - ideas/artifacts/ECDLP-IDEA-326/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-326
  from: coordinator
  to: executor
  objective: Preserve the retired partition/materialization theorem review; do not dispatch it.
  uncertainty_reduced: Whether polynomial partitioning can avoid constructing the pair-pair query family and still replay exact finite-field sources.
  inputs:
    - ideas/rejected/ECDLP-IDEA-326_polynomial_partitioning_abel_jacobi_incidence_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-326_polynomial_partitioning_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply pair-pair hyperplanes, source incidences, post-hoc partitions, or real-sign-cell assumptions.
    - Charge partition construction, conflicts, output, rank, factor logs, blind descent, verification, and memory.
  deliverables:
    - pair-pair query materialization theorem receipt
    - finite-field partition-domain audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
