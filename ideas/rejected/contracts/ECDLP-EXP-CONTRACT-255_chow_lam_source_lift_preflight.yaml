experiment:
  id: EXP-ECDLP-IDEA-255-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-255
  lane: representation_changing
  version: 1
  title: Chow-Lam incidence-form source-lift theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: global_incidence_form_degree_and_contact_fiber_restore_source_deck
  objective: >-
    Decide theorem-first whether the coloured P1539 incidence projection has a compact
    endpoint-derived Chow-Lam form with a canonical exact contact-to-row inverse.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    p1539_evaluation_blocks: supplied_interface_only
    compact_incidence_form: unresolved
    unique_contact_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-255" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied low-degree Grassmannian varieties with known forms and unique contacts
    - finite point unions, source permutations, IDEA-065, IDEA-115, IDEA-159, IDEA-248, P1539, rho, and BSGS
  independent_variables:
    - embedding, projection flag, form degree, coefficient representation, and polar chart
    - ordinary versus supersingular curve family
    - distinct, repeated, signed, infinity, singular, and multiple-contact strata
  metrics:
    primary:
      - exact row recall, false sources, form degree, coefficient traffic, contacts, output, rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - projection charts, polar branches, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the compact-form/source-inverse theorem is unresolved.
    - Stop if coefficient construction enumerates the source cycle or contact inversion searches rows.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source variety, contact point, tuple, or uncharged form compiler invalidates the arm.
    - Form vanishing or a polar identity without exact row return is only a control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish endpoint-only compact form construction, unique exact
    all-strata contact inversion, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Source-degree coefficient traffic, one nonunique contact requiring row search, a
    supplied contact point, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-255/chow_lam_source_lift_theorem.md
    - ideas/artifacts/ECDLP-IDEA-255/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-255/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-255/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-255
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether a compact incidence form can return exact finite row contacts without encoding the source cycle.
  inputs:
    - ideas/rejected/ECDLP-IDEA-255_chow_lam_incidence_form_source_lift_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-255_chow_lam_source_lift_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply the source cycle, contact point, tuple, or source-indexed form coefficients.
    - Charge degree, coefficients, contact branches, output, rank, factor logs, blind descent, and memory.
  deliverables:
    - compact unique-contact form theorem or cycle-degree/contact-fiber no-go
    - all-strata exact-row and multiplicity audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
