experiment:
  id: EXP-ECDLP-IDEA-063-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-063
  lane: conservative
  version: 1
  title: Provenance-preserving subresultant-forest preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: exact_collision_with_ECFG_H669_and_P1428_source_resolved_control
  objective: >-
    Test whether the verified source-losing row-norm union product can be refined
    by a multiplicity-aware subresultant forest that returns every row, root, and
    endpoint source without materializing the full incidence table, and measure
    complete relation, rank, descent, time, output, and memory costs.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22, 24]
    independent_curves_per_size: 20
    factor_base_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    seeds: [20260717631, 20260717632, 20260717633]
    exhaustive_truth_max_bits: 16
    phase_1: exact_union_multiplicity_provenance_and_source_lift
    fit: preregistered_log_log_with_leave_largest_out
  controls:
    - reproduced normalized row norms and P1428 union roots
    - exhaustive row-root-endpoint incidence table through 16 bits
    - planted unique shared and repeated polynomial factors with leaf labels
    - independent per-row gcd baseline
    - materialized row-root incidence table
    - all-rows-share-one-factor adversarial overlap control
    - matched random polynomial rows with identical degree profile
  independent_variables:
    - field bit size and curve instance
    - factor-base size B and beta
    - row count overlap profile and factor multiplicity
    - known random relation target versus randomized challenge target
    - provenance forest versus union-only independent-gcd and materialized controls
  metrics:
    primary:
      - exact union multiplicity row root and endpoint agreement
      - total live polynomial degree and visited tree nodes
      - forest arithmetic exponent and provenance output exponent in B
      - independent verified rows per accepted collection
      - relation and target density exponents
      - complete time exponent lambda including setup output linear algebra and descent
      - complete retained memory exponent mu
    secondary:
      - shared repeated inseparable zero and exceptional factor counts
      - polynomial operation counts timings coefficient bytes and peak RSS
      - relation rank calibrated factor logs target recoveries and verification failures
  replication:
    independent_instances: 180
    relation_batches_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 360
    maximum_memory_gb: 48
    maximum_runs: 12000
    maximum_output_gb: 60
  stopping_rules:
    - Stop before scaling on any independently reproduced union multiplicity provenance or endpoint mismatch.
    - Stop an arm if the forest materializes or emits the full row-root incidence table outside the explicit control.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve it as censored_by_budget.
    - Halt inference after any accepted relation factor log or scalar fails independent curve verification.
  invalidation_rules:
    - Omitting shared or repeated factors invalidates provenance correctness.
    - Target-selected trees post-hoc row deletion scalar advice or discarded failed queries invalidate the arm.
    - Union roots without exact row and endpoint sources cannot enter relation metrics.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Zero Phase-1 errors; at least 0.8B independent verified rows per accepted
    collection; 1000 relations and 100 target descents at each of the two largest
    completed sizes; upper 95 percent forest exponent at most 1.20 plus charged
    output in B; upper 95 percent lambda<=0.45 and mu<=0.45; stable sensitivity
    fits; and no uncharged materialized incidence table.
  falsification_criterion: >-
    Any independently reproduced provenance/source error; lower 95 percent total
    live-degree or output exponent at least 2 in B; fewer than 0.5B independent
    rows at both largest sizes; or lower 95 percent lambda>=0.50 in every
    complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-063/implementation.md
    - ideas/artifacts/ECDLP-IDEA-063/provenance_identity.md
    - ideas/artifacts/ECDLP-IDEA-063/provenance_forest.sage
    - ideas/artifacts/ECDLP-IDEA-063/verify_provenance.sage
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-063/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-063/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-063
  from: coordinator
  to: executor
  objective: Execute only the exact union multiplicity provenance and endpoint-source gate before any scaling.
  uncertainty_reduced: Whether P1428 union-root amortization can retain sources without reconstructing the full incidence table.
  inputs:
    - ideas/rejected/ECDLP-IDEA-063_provenance_preserving_subresultant_forest_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-063_provenance_forest_preflight.yaml
  constraints:
    - Retired evidence only; do not dispatch this contract.
    - Do not run while status is review_required.
    - Do not enter scaling after any Phase-1 mismatch.
    - Preserve every factor multiplicity branch source miss output and censored cell.
    - Do not interpret a fast gcd valid relation or toy scalar as promotion.
  deliverables:
    - exact propagation and multiplicity derivation
    - exhaustive row-root-endpoint comparison
    - complete relation rank descent time output and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 12000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation factor log and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
