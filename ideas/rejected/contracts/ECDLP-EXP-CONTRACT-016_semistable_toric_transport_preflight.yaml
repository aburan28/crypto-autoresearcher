experiment:
  id: EXP-ECDLP-IDEA-016-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-016
  lane: representation_changing
  version: 1
  title: Semistable marked-torsion transport and toric-order preflight
  status: review_required
  objective: >-
    Determine whether a target-independent semistable family can transport public
    marked prime-order points injectively into a split toric fiber without using the
    hidden scalar, and whether extension degree, monodromy, finite-field descent, and
    bit-memory costs remain below the generic square-root boundary.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [10, 12, 14, 16, 18, 21, 24, 27, 30]
    independent_curves_per_size: 50
    deformation_families: [legendre_nodal, weierstrass_discriminant, modular_cusp]
    exhaustive_truth_max_bits: 18
    seeds: [20260717161, 20260717162, 20260717163]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - a Tate curve with split multiplicative reduction and known uniformization
    - transported small torsion with exhaustive specialization checks
    - good-reduction families whose special fiber stays elliptic
    - MOV-compatible curves with embedding-degree costs charged separately
    - same-field small-degree isogeny controls from the ledger
    - blinded Q with a construction-dependency audit
  independent_variables:
    - field bit size
    - curve instance
    - deformation family
    - base-change and extension degree
    - reduction type
    - marked section
    - torus factor-base and descent parameters
  metrics:
    primary:
      - marked-family and section construction exponent c
      - specialization and extension-field construction exponent d
      - torus relation exponent r
      - individual-descent exponent tau
      - full time exponent lambda=max(c,d,r,tau)
      - full bit-memory exponent mu
    secondary:
      - specialization homomorphism and injectivity checks
      - exact subgroup-order retention
      - field degree and discriminant
      - monodromy branch and section ambiguity counts
      - finite-field relation precision and rank
      - end-to-end original-curve verification rate
  replication:
    independent_instances: 450
    specialization_attempts_per_instance: 100
    target_descents_per_largest_size: 100
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 720
    maximum_memory_gb: 64
    maximum_runs: 18000
    maximum_output_gb: 100
  stopping_rules:
    - Stop exhaustive section and specialization checks after 18 bits.
    - Stop a deformation arm after two consecutive sizes exceed 60 GB median peak memory or all 50 instances are noninjective.
    - Halt inference after any accepted transported relation or recovered scalar fails independent verification.
  invalidation_rules:
    - A nodal equation without certified public marked sections is a positive control only.
    - Any section, base change, or branch choice that depends on x invalidates the mechanism arm.
    - Failure to prove or exhaustively verify injectivity invalidates transport claims for that cell.
    - Extension-field size and finite-field index-calculus input length must be charged in bits, not treated as free subexponential terms.
    - A timeout, symbolic-construction failure, or unsupported reduction type is infrastructure or coverage evidence only.
  success_criterion: >-
    Zero transport and relation failures; injective order-N specialization on every
    promoted instance; at least 100 end-to-end original-curve recoveries at each of
    the two largest completed sizes; upper 95 percent bounds c<=0.30, d<=0.30,
    r<=0.40, tau<=0.45, lambda<=0.45, and mu<=0.45; and stable conclusions under
    the preregistered finite-size sensitivity.
  falsification_criterion: >-
    After implementation validation, transport is always trivial or noninjective on
    the prime-order subgroup; field, component, section, or monodromy degree has lower
    95 percent exponent at least 0.50; a construction dependency exposes x; or every
    full-cost arm has lower 95 percent lambda>=0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-016/implementation.md
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/specializations.jsonl
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/torus_descent.jsonl
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-016/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-016/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-016
  from: coordinator
  to: executor
  objective: Implement and run the marked-section transport and toric-order preflight exactly after approval.
  uncertainty_reduced: Whether the prime-order scalar relation can survive a representation change to a cheap toric DLP.
  inputs:
    - ideas/ECDLP-IDEA-016_semistable_toric_transport_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-016_semistable_toric_transport_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every failed family, branch, section ambiguity, noninjective specialization, and censored cell.
    - Do not interpret a valid degeneration or a solved positive-control torus DLP as promotion.
  deliverables:
    - immutable family and marked-section records
    - transport injectivity and construction-dependency audit
    - torus relation and individual-descent cost fits
    - complete rho and BSGS comparison with finite-size sensitivity
  budget:
    wall_clock_seconds: 2592000
    memory_gb: 64
    maximum_runs: 18000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted specialization and recovered scalar independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
