experiment:
  id: EXP-ECDLP-IDEA-212-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-212
  lane: representation-changing
  version: 1
  title: Delta-matroid source-router exchange theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: rejected_fixed_cardinality_exchange_and_skew_principal_minor_obstruction
  objective: >-
    Prove the scoped parity, open-versus-closed, and basis-exchange obstruction
    for a direct universal skew-kernel representation of exact signed five-source
    elliptic fibers, or exhibit a genuinely new bounded source-free coding operation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    universal_skew_kernel: unresolved
    source_biconditional: rejected_in_direct_form
    exchange_obstruction: requires_formal_receipt
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-212" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied representable even delta-matroids with planted feasible sets
    - nonrepresentable fixed-size families and odd skew principal minors
    - source-marked matrices, completion graphs, rho, and BSGS
  independent_variables:
    - kernel degree, endpoint gadget, pivot set, and ground-set encoding
    - generic versus repeated or degenerate signed source tuples
    - feasible versus infeasible principal minors and exact source output
  metrics:
    primary:
      - parity, basis exchange, source recall, false sets, matrix state, and output
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - construction, pivots, rank, factor logs, masked descent, verification, and memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the formal obstruction receipt is incomplete.
    - Stop on odd-minor parity, a generic basis-exchange violation, or source-marked coefficients.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A completion oracle, explicit source graph, signature table, or finite-field indicator polynomial invalidates the arm.
    - A supplied feasible family is a control rather than an endpoint router.
    - Omitted matrix state, output, rank, factor logs, blind descent, or memory invalidates the model.
  success_criterion: >-
    A new source-free coding operation evades parity and exchange, proves exact
    all-strata inversion, and has complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Odd-principal-minor parity, open-versus-closed mismatch, generic exchange
    failure, source advice, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-212/delta_matrix_spec.md
    - ideas/artifacts/ECDLP-IDEA-212/symbolic_exchange_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-212/independent_pivot_verifier.py
    - ideas/artifacts/ECDLP-IDEA-212/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-212
  from: coordinator
  to: executor
  objective: Preserve the retired representation theorem preflight as scoped no-go evidence; do not dispatch it.
  uncertainty_reduced: Whether a direct principal-pivot representation can encode exact five-source fibers.
  inputs:
    - ideas/rejected/ECDLP-IDEA-212_principal_pivot_delta_matroid_signed_source_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-212_delta_matroid_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied feasible family, completion oracle, source labels, or uncharged indicator polynomial.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - parity and open-versus-closed theorem receipt
    - generic basis-exchange witness or evading coding theorem
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
