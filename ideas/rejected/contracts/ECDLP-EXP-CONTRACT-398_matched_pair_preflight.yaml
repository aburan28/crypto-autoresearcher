experiment:
  id: EXP-ECDLP-IDEA-398-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-398
  lane: high-risk
  version: 1
  title: Matched-pair bicrossproduct source-factorization preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: prime_order_group_has_no_nontrivial_matched_factorization_and_auxiliary_actions_encode_sources
  objective: >-
    Preserve a theorem-only audit of whether endpoint data construct a nontrivial
    matched pair with restriction-stable typed back-actions to exact factor occurrences.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_factor_groups: unresolved
    endpoint_only_mutual_actions: unresolved
    restriction_stable_typed_source_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-398" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_finite_matched_pair_with_labelled_back_actions
    - positive_exact_product_and_inverse_replay
    - negative_prime_cyclic_group_factorization
    - negative_equal_product_with_relabelled_source_occurrences
  independent_variables:
    - factor_group_and_mutual_action_interface
    - word_length_and_action_state
    - source_label_and_back_action_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_endpoint_constructed_matched_factors
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_factor_action_word_back_action_and_occurrence_label_is_fully_charged
      - matched_pair_state_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_prime_order_factorization_is_trivial
    - stop_if_one_factor_or_mutual_action_requires_source_incidence
    - stop_if_setup_or_state_exceeds_B_to_the_9_over_4
    - stop_if_restriction_replay_or_source_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_occurrence_label_or_complete_chart_stratum_is_merged_or_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_matched_pair_is_confused_with_endpoint_construction
    - invalidate_if_actions_or_words_are_target_fitted_or_source_enumerated
    - invalidate_if_product_validity_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs a nontrivial matched pair from endpoint data,
    proves exact restriction-stable typed back-actions, and satisfies every state,
    query, campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by trivial factorization, source-bearing factors or
    actions, one product/source collision, supergate work, or complete exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-398/matched_pair_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-398/back_action_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-398/restricted_source_receipt.json
    - ideas/artifacts/ECDLP-IDEA-398/cost_analysis.md
  assigned_to: none
  approved_by: null

