experiment:
  id: EXP-ECDLP-IDEA-388-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-388
  lane: representation_changing
  version: 1
  title: Seymour regular-matroid sum source-decomposition preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: regularity_and_implicit_sum_decomposition_are_unproved_and_materialized_ground_sets_restore_source_scale
  objective: >-
    Preserve a theorem-only representation audit of whether the complete
    finite-deck occurrence incidence admits an endpoint-constructible regular
    matroid whose implicit Seymour 1-, 2-, and 3-sum decomposition supports
    subgate restricted existence and exact occurrence-source lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_regular_matroid_oracle: unresolved
    implicit_subgate_seymour_sum_decomposition: unresolved
    restriction_stable_exact_occurrence_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-388" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_graphic_cographic_and_R10_regular_matroids
    - positive_known_1_sum_2_sum_and_3_sum_decomposition_replay
    - negative_nonregular_Fano_and_dual_Fano_minors
    - negative_equal_unlabelled_sum_tree_with_permuted_occurrence_sources
  independent_variables:
    - matroid_oracle_representation_and_regular_minor_certificate
    - sum_tree_arity_separator_size_and_depth
    - implicit_state_and_occurrence_label_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_an_implicit_regular_matroid_sum_tree
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_oracle_query_minor_test_sum_node_separator_and_label_lift_is_fully_charged
      - decomposition_state_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_the_actual_occurrence_incidence_has_a_nonregular_minor
    - stop_if_matroid_oracle_or_sum_decomposition_requires_materialized_source_ground_elements
    - stop_if_sum_tree_state_exceeds_B_to_the_9_over_4
    - stop_if_restriction_replay_or_occurrence_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_occurrence_label_or_complete_chart_stratum_is_merged_or_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_regular_matroid_is_confused_with_endpoint_constructibility
    - invalidate_if_regular_matroid_recognition_is_confused_with_implicit_subgate_decomposition
    - invalidate_if_relation_validity_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs a regular-matroid oracle from endpoints,
    excludes forbidden minors, bounds an implicit Seymour sum tree below every
    gate, proves restriction-stable exact occurrence lift, and closes the full
    factor-base-to-target-descent path.
  falsification_criterion: >-
    The preflight is falsified by one nonregular minor, source-sized ground-set
    or sum-tree materialization, one restriction or label failure, or complete
    time or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-388/regular_matroid_obligations.md
    - ideas/artifacts/ECDLP-IDEA-388/forbidden_minor_cases.json
    - ideas/artifacts/ECDLP-IDEA-388/circuit_source_receipt.json
    - ideas/artifacts/ECDLP-IDEA-388/cost_analysis.md
  assigned_to: none
  approved_by: null

