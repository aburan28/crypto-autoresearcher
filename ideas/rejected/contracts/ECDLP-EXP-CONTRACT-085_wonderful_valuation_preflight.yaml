  invalidation_rules:
    - A coordinate blowup or exceptional divisor without individual source recovery is a representation control.
    - Target-selected centers post-hoc branch deletion and hidden tuple tables invalidate the arm.
    - Omitting blowup construction charts inverse branches output rank descent or memory invalidates cost claims.
    - Timeout dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 proves a target-independent building set, complete chart
    coverage, an exact valuation-word/source biconditional and inverse, and full
    relation, rank, blind-descent, output, time, and memory exponents below 0.50.
  falsification_criterion: >-
    A generic lost or false source, building-set or inverse/output exponent at
    least 0.50, or proof that all partial diagonals or tuples must be retained
    closes the stated mechanism.
  required_artifacts:
