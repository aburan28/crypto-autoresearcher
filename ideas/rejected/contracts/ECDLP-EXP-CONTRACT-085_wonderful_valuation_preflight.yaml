    future_maximum_runs: 12000
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or a Phase 0 mathematical input is unresolved.
    - Stop after a generic counterexample to the valuation-source biconditional or proper-transform inverse.
