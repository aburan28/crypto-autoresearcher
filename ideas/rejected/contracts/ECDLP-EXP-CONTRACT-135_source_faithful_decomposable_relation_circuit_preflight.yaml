experiment:
  id: EXP-ECDLP-IDEA-135-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-135
  lane: representation_changing
  version: 1
  title: Source-faithful decomposable compilation theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: sub_rho_source_complete_compilation_theorem_missing
  objective: >-
    Gate all computation on a pre-leaf deterministic decomposable compiler,
    exact model-to-source biconditional, and full rho/BSGS accounting.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_complete_compiler: unresolved
    vtree_rectangle_bound: unresolved
    target_conditioning_biconditional: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-135" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - bounded-treewidth CSP and planted decomposable source circuits
    - exhaustive tiny elliptic relation fibers including exceptional strata
    - OBDD order sweeps, P1480 SMT, P1477 states, and P1510 leaf circuits
    - random group tables, Pollard rho, and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - vtree, compiler, circuit size, compilation work, and target conditioning
    - source multiplicity, output delay, relation density, and ambiguity
    - known-log relation target versus fresh masked blind target
  metrics:
    primary:
      - exact model/source recall and false-model count
      - compiler, serialized-circuit, query, enumeration, and peak-memory exponents
      - lambda=max(a,c,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,c,q_m,beta+o,ell_m,u)
    secondary:
      - vtree width, rectangle count, duplicate models, exceptional strata, and rank
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or the Phase 0 theorem is unresolved.
    - Stop if compilation consumes source leaves, target fibers, scalar labels, or a dense quotient.
    - Bounds strictly above 0.45 and below 0.50 are inconclusive and cannot promote.
  invalidation_rules:
    - A small circuit produced after expensive enumeration is invalid evidence.
    - Approximate counts, membership only, or missing multiplicities are insufficient.
    - Omitting compile work, serialization, output, rank, descent, or memory invalidates costs.
    - Timeout or infrastructure failure is not mathematical falsification.
  success_criterion: >-
    An independently checked theorem constructs a source-complete pre-leaf compiler
    and gives complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    One source mismatch, enumerated-leaf input, hidden scalar coordinate, or
    complete time or peak-memory exponent at least 0.50 closes the mechanism.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-135/source_faithful_dDNNF_theorem.md
    - ideas/artifacts/ECDLP-IDEA-135/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-135/compile_relation.py
    - ideas/artifacts/ECDLP-IDEA-135/verify_models.py
    - ideas/artifacts/ECDLP-IDEA-135/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260717-135
  from: coordinator
  to: executor
  objective: Preserve the retired representation theorem gate; do not dispatch before source-complete compilation is proved.
  uncertainty_reduced: Whether a pre-leaf deterministic decomposable representation can retain every source below rho.
  inputs:
    - ideas/rejected/ECDLP-IDEA-135_source_faithful_decomposable_relation_circuit_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-135_source_faithful_decomposable_relation_circuit_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired and any successor requires coordinator approval.
    - Do not compile from enumerated leaves, source tables, scalar labels, or dense quotients.
  deliverables:
    - source-complete compiler or explicit vtree/rectangle lower bound
    - exact model/source and target-conditioning biconditional
    - full relation, rank, factor-log, blind-descent, output, time, and memory model
    - independent theorem review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
