experiment:
  id: EXP-ECDLP-IDEA-220-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-220
  lane: high-risk
  version: 1
  title: Twisted-torsion exact-source factor theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_torsion_consumes_source_complex_and_aggregates_based_cells
  objective: >-
    Decide theorem-first whether a source-free endpoint complex and scalar-blind
    twist have a basis-independent torsion factorization whose primitive factors
    return every exact signed factor-base source.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_free_endpoint_complex: unresolved
    canonical_scalar_blind_twist: unresolved
    basis_and_source_collision_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-220" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - planted based complexes, basis changes, acyclic expansions, and shuffled twists
    - IDEA-208 Fox Jacobians, determinant-resultant controls, and explicit source complexes
    - scalar characters, dense source graphs, rho, and BSGS
  independent_variables:
    - chain complex, basis, twist, torsion normalization, factorization, and mask
    - known endpoint versus fresh masked blind target
    - signs, repeats, infinity strata, units, ambiguity, and retained cell labels
  metrics:
    primary:
      - exact-source recall, false factors, basis sensitivity, rank, output, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - complex setup, determinants, factorization, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the source-factor theorem is unresolved.
    - Stop if the complex lists source cells or the twist imports scalar orientation.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source presentation, scalar character, or uncharged determinant output invalidates the arm.
    - Toy torsion factorization is a control and cannot establish asymptotic performance.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a source-free endpoint complex, canonical twist,
    and exact basis-independent factor-to-point inverse, with complete time and
    memory exponents at most 0.45.
  falsification_criterion: >-
    One basis/source torsion collision, source-labelled complex, scalar-oriented
    twist, missed or false factor, or exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-220/twisted_torsion_source_theorem.md
    - ideas/artifacts/ECDLP-IDEA-220/torsion_basis_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-220/independent_torsion_verifier.py
    - ideas/artifacts/ECDLP-IDEA-220/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-220
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether source-free twisted torsion has a basis-independent exact factor-to-point inverse.
  inputs:
    - ideas/rejected/ECDLP-IDEA-220_twisted_reidemeister_torsion_source_factorization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-220_twisted_torsion_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply source-labelled cells or a scalar character as the twist.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - canonical source-free complex theorem or basis/source collision proof
    - exact factor-to-point biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
