experiment:
  id: EXP-ECDLP-IDEA-069-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-069
  lane: high_risk
  version: 1
  title: Normalized Massey functional and map-span quotient preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: non_executable_until_finite_field_defining_system_and_target_law_exist
  objective: >-
    Test whether a completely normalized source-evaluable triple Massey product
    survives quotient by all known map and pairing functionals, obeys the claimed
    composition identity, and yields a bounded masked-scalar equation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [8, 9, 10, 11, 12, 13, 14, 16, 18]
    independent_curves_per_size: 20
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    bundle_grammars: [degree_zero_one, fixed_cover_pullback, complete_chart_control]
    seeds: [20260717691, 20260717692, 20260717693]
    exhaustive_truth_max_bits: 14
    phase_1: symbolic_normalization_map_span_quotient_and_target_equation
    fit: preregistered_log_log_with_leave_largest_out
  controls:
    - published triple-product identity on a supported tiny model
    - planted extensions with known nonzero m3 and normalization
    - complete pullback norm trace binary relation and pairing map-span basis
    - random ordinary prime-order curves without exceptional automorphisms
    - randomized masked known scalars and fully blind challenge targets
    - unnormalized and target-selected defining systems as invalid controls
  independent_variables:
    - field bit size curve and factor-base beta
    - bundle grammar and defining-system seed
    - known random relation target versus masked and blind challenge target
    - raw higher product versus exact map-span quotient
    - residual scalar equation and complete candidate-list policy
  metrics:
    primary:
      - exact representative independence and A-infinity composition agreement
      - quotient rank after all known map-span columns
      - masked-scalar equation degree collision count and residual-list exponent
      - per-source evaluation relation and target density exponents
      - calibrated secondary-state completeness
      - complete time exponent lambda and memory exponent nu
    secondary:
      - undefined ambiguous zero exceptional and normalization-failure counts
      - extension dimensions coefficients denominator fields timings and peak RSS
      - relation rank target recoveries candidate verifications and false scalars
  replication:
    independent_instances: 180
    relation_batches_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 5400
    total_cpu_hours: 480
    maximum_memory_gb: 48
    maximum_runs: 15000
    maximum_output_gb: 80
  stopping_rules:
    - Stop before scaling on any representative-independence composition or source mismatch.
    - Stop if the quotient by the complete known map span is zero on every exhaustive ordinary curve.
    - Stop an arm when the residual scalar list or representation reaches the rho boundary.
    - Halt inference after any accepted relation calibrated state or scalar fails independent verification.
  invalidation_rules:
    - Target-selected bundles defining systems bases or normalizations invalidate the arm.
    - Omitting a known map pairing trace or norm column invalidates the quotient claim.
    - Discarding undefined products residual candidates or failed targets invalidates the arm.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Zero Phase-1 errors; quotient rank at least one after the complete map-span
    basis; a nonconstant masked-scalar equation; 1000 verified relations and 100
    blind targets at each of the two largest completed sizes; zero false scalar
    recoveries; upper 95 percent residual-list exponent<=0.20; upper 95 percent
    lambda<=0.45 and nu<=0.45; and stable sensitivity fits.
  falsification_criterion: >-
    Any independently reproduced normalization composition or source error; zero
    quotient on every exhaustive ordinary curve; lower 95 percent residual-list
    exponent>=0.50; or lower 95 percent lambda>=0.50 in every complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-069/implementation.md
    - ideas/artifacts/ECDLP-IDEA-069/massey_identity.md
    - ideas/artifacts/ECDLP-IDEA-069/map_span.yaml
    - ideas/artifacts/ECDLP-IDEA-069/massey_functional.sage
    - ideas/artifacts/ECDLP-IDEA-069/verify_functional.sage
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-069/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-069/analysis.md
  assigned_to: executor
  approved_by: null

