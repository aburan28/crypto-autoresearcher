  constraints:
    - Retired evidence only; do not dispatch this contract.
    - Do not run while status is review_required.
    - Do not enter scaling after any Phase-1 mismatch or zero complete quotient.
    - Preserve every defining system undefined value candidate source miss and censored cell.
    - Do not interpret a nonzero higher product relation label or toy scalar as promotion.
  deliverables:
    - exact normalization and A-infinity derivation
    - complete known map-span quotient
    - exhaustive source and masked-scalar comparison
    - independent verification report
  budget:
    wall_clock_seconds: 1728000
    memory_gb: 48
    maximum_runs: 15000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation calibrated state and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
