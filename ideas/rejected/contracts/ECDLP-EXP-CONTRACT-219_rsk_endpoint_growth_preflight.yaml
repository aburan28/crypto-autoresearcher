experiment:
  id: EXP-ECDLP-IDEA-219-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-219
  lane: conservative
  version: 1
  title: RSK endpoint-growth exact-source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_recording_tableau_requires_the_source_word_or_matrix
  objective: >-
    Decide theorem-first whether an elliptic endpoint determines both tableaux
    required by reverse RSK, and hence every exact signed source, without
    supplying the recording tableau, source word, or completion graph.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_growth_rule: unresolved
    recording_tableau_from_endpoint: unresolved
    same_visible_tableau_collision_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-219" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - planted words with paired tableaux, insertion-tableau-only arms, and shuffled recording tableaux
    - IDEA-188 plactic insertion, IDEA-190 Tamari normal forms, and serial-state controls
    - dense source dictionaries, Semaev fibers, rho, and BSGS
  independent_variables:
    - alphabet, word or matrix encoding, tableau shape, local growth rule, and mask
    - known endpoint versus fresh masked blind target
    - signs, repeats, infinity strata, reverse branches, and retained recording state
  metrics:
    primary:
      - exact-source recall, false words, tableau state, rank, output, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, reverse insertion, factor logs, masked descent, verification, and memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the endpoint-growth theorem is unresolved.
    - Stop if inverse growth requires the recording tableau, source word, matrix, or explicit completion edges.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied recording tableau, planted word, or uncharged reverse output invalidates the arm.
    - Toy RSK inversion is a control and cannot establish asymptotic performance.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish endpoint-derived paired tableaux and exact
    all-strata reverse insertion without source data, with complete time and
    memory exponents at most 0.45.
  falsification_criterion: >-
    One same-endpoint/same-visible-tableau source collision, a required recording
    tableau or source deck, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-219/rsk_endpoint_growth_theorem.md
    - ideas/artifacts/ECDLP-IDEA-219/tableau_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-219/independent_rsk_verifier.py
    - ideas/artifacts/ECDLP-IDEA-219/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-219
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether an elliptic endpoint determines the RSK recording data needed for exact-source inversion.
  inputs:
    - ideas/rejected/ECDLP-IDEA-219_rsk_growth_diagram_source_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-219_rsk_endpoint_growth_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply the recording tableau or treat planted reverse insertion as source recovery.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - endpoint paired-tableau theorem or source-collision proof
    - exact all-strata reverse-insertion biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
