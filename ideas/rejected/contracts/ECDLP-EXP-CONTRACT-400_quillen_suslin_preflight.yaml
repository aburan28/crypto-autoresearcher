experiment:
  id: EXP-ECDLP-IDEA-400-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-400
  lane: conservative
  version: 1
  title: Quillen-Suslin source-module completion preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: module_generators_encode_relations_and_unimodular_basis_has_no_factor_atom_inverse
  objective: >-
    Preserve a theorem-only audit of whether endpoint-only local source frames form
    a compact projective module with bounded completion and exact factor-atom inverse.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_projective_module_generators: unresolved
    certified_subgate_unimodular_completion: unresolved
    restriction_stable_basis_to_factor_atom_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-400" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_projective_module_with_known_unimodular_completion
    - positive_exact_global_basis_and_labelled_atom_replay
    - negative_equal_module_span_with_relabelled_generators
    - negative_free_basis_that_mixes_primitive_factor_atoms
  independent_variables:
    - module_generator_and_local_frame_interface
    - completion_degree_coefficient_and_state_growth
    - global_basis_and_factor_atom_inverse_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_endpoint_constructed_global_module_basis
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_generator_completion_coefficient_basis_change_and_atom_label_is_fully_charged
      - completed_module_state_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_one_module_generator_requires_explicit_source_incidence
    - stop_if_projectivity_fails_on_one_complete_chart_stratum
    - stop_if_setup_completion_or_state_exceeds_B_to_the_9_over_4
    - stop_if_specialization_or_atom_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_occurrence_label_or_complete_chart_stratum_is_merged_or_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_source_module_is_confused_with_endpoint_construction
    - invalidate_if_completion_is_target_fitted_or_source_enumerated
    - invalidate_if_module_freeness_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs compact projective-module generators from endpoint
    data, proves bounded completion and exact restriction-stable atom lift, and satisfies
    every state, query, campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by source-bearing generators, nonprojective strata,
    one basis/atom collision, supergate work, or complete exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-400/module_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-400/unimodular_completion_bounds.md
    - ideas/artifacts/ECDLP-IDEA-400/basis_atom_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-400/cost_analysis.md
  assigned_to: none
  approved_by: null

