experiment:
  id: EXP-ECDLP-IDEA-044-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-044
  lane: high_risk
  version: 1
  title: p-adic stationary-phase witness extraction preflight
  status: review_required
  objective: >-
    Determine whether a frozen p-adic critical-stratum decomposition of the elliptic
    addition phase emits complete factor-base atom witnesses at relation-batch,
    target-descent, and bit-memory exponents below 1/2, rather than returning only a
    count or reconstructing the membership-quotient solver.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [10, 11, 12, 13, 14, 15, 16, 17, 18]
    independent_curves_per_size: 24
    decomposition_arities: [3, 4]
    factor_base_sizes: [16, 32, 64, 128, 256]
    exhaustive_truth_max_bits: 16
    character_normalizations:
      - canonical_teichmuller_additive_character
      - deterministic_trace_scaled_character
      - seed_bound_nonzero_character_control
    affine_chart_rules:
      - short_weierstrass_x_first
      - short_weierstrass_y_first_control
    critical_resolution:
      - exact_jacobian_rank_stratification
      - deterministic_blowup_order_by_lexicographic_minor
    hensel_precisions: [2, 3, 4, 6]
    seeds: [20260717441, 20260717442, 20260717443]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - planted nondegenerate phases with known sparse critical points and exact liftable witnesses
    - exhaustive tuple enumeration through 16 bits
    - random phases with matched Newton polytope, variable count, and solution density
    - ordinary membership-quotient Semaev solving on identical curves, bases, and targets
    - count-only stationary-phase evaluation barred from witness and promotion metrics
    - explicitly charged materialized factor-base tuple table
    - blinded target labels with target-selected phases, cells, and precision forbidden
  independent_variables:
    - field bit size
    - curve instance
    - decomposition arity
    - factor-base size
    - character normalization
    - affine chart rule
    - critical-resolution rule
    - Hensel precision
    - known-scalar relation target versus masked ECDLP target
  metrics:
    primary:
      - target-independent stratification build exponent a
      - total known-target batch exponent q_rel including all misses and branches
      - total masked-target batch exponent q_t including all misses and branches
      - full time exponent lambda=max(a,q_rel,2*beta,q_t)
      - full bit-memory exponent mu including coefficients, precision, cells, and branches
      - exact complete atom-witness correctness
    secondary:
      - critical and degenerate cell counts by dimension
      - Hensel branches attempted, rejected, merged, and accepted
      - stationary count versus exhaustive count discrepancy
      - false, missed, duplicate, and exceptional witnesses
      - relation-matrix rank and density
      - operations touching factor-base membership data
      - membership-quotient ablation cost
      - peak resident memory and serialized artifact bytes
  replication:
    planned_curve_instances: 216
    relation_targets_per_cell: 500
    masked_targets_per_largest_completed_cell: 100
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 420
    maximum_memory_gb: 48
    maximum_runs: 20000
    maximum_output_gb: 80
  stopping_rules:
    - Stop exhaustive tuple enumeration above 16 bits and retain all larger cells under the frozen non-oracle implementation and matched controls.
    - Stop a parameter arm after two consecutive sizes exceed 44 GB median peak memory; mark remaining cells censored_by_budget.
    - Stop an individual cell at 3600 seconds and record timeout rather than imputing a favorable exponent.
    - Halt after any accepted atom tuple or scalar fails independent curve verification and audit implementation validity before inference.
  invalidation_rules:
    - Any phase, chart, critical cell, precision, or base chosen after observing target success invalidates the cell.
    - A stationary count without explicit factor-base atom witnesses cannot enter relation or target-descent metrics.
    - Calling the ordinary membership-quotient, Groebner, SAT, dense-resultant, or known-log oracle inside local lifting invalidates the mechanism arm.
    - Omitting degenerate cells, failed Hensel branches, coefficient precision, misses, or output bytes invalidates the cost fit.
    - A timeout, crash, unsupported chart, or dependency failure is infrastructure or coverage evidence only.
  success_criterion: >-
    Exact exhaustive count agreement and zero incorrect accepted witnesses; at least 500
    independently verified relation witnesses and 100 masked-target descents at each of
    the two largest completed cells; upper 95 percent bounds a<=0.40, q_rel<=0.45,
    q_t<=0.45, lambda<=0.45, and mu<=0.45; no target-selected cells or hidden
    membership solver; and stable conclusions under the preregistered finite-size and
    character-normalization sensitivities.
  falsification_criterion: >-
    After implementation validation, any exhaustive count mismatch persists; no
    non-oracle complete atom witnesses are emitted; critical-state size has lower 95
    percent exponent at least 0.50; local lifting reconstructs the membership quotient;
    or every complete-cost configuration has lower 95 percent lambda>=0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-044/implementation.md
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/critical_cells.jsonl
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/hensel_branches.jsonl
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/witnesses.jsonl
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-044/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-044/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-044
  from: coordinator
  to: executor
  objective: Implement and run the frozen stationary-phase witness preflight exactly after approval.
  uncertainty_reduced: Whether sparse p-adic critical strata produce complete decomposition witnesses below rho rather than only compressed counts.
  inputs:
    - ideas/ECDLP-IDEA-044_p_adic_stationary_phase_witness_extraction_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-044_stationary_phase_witness_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every critical and degenerate cell, Hensel branch, miss, ambiguity, timeout, and censored cell.
    - Do not interpret count agreement, critical sparsity, relation validity, or toy scalar recovery as promotion.
    - Do not invoke a hidden membership solver or target-selected phase.
  deliverables:
    - immutable critical-stratum and Hensel-branch records
    - exhaustive count and witness agreement report
    - relation and target batch cost fits
    - circularity and membership-solver ablation audit
    - full rho and BSGS comparison with finite-size sensitivity
  budget:
    wall_clock_seconds: 1512000
    memory_gb: 48
    maximum_runs: 20000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted atom tuple and recovered scalar independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
