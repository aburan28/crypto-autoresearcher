experiment:
  id: EXP-ECDLP-IDEA-263-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-263
  lane: high_risk
  version: 1
  title: Arithmetic delta-character scalar-digit theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: additive_delta_character_kills_prime_to_p_torsion_or_nonhomomorphic_lift_loses_scalar_equation
  objective: >-
    Decide theorem-first whether any canonical arithmetic lift supports a nonzero
    additive delta-character that preserves the finite subgroup scalar equation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    canonical_scalar_compatible_lift: unresolved
    nonzero_prime_to_p_delta_character: unresolved
    exact_digit_or_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-263" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied non-torsion p-adic points with an independently known scalar relation
    - prime-to-p torsion, arbitrary coordinate lifts, incompatible Frobenius lifts, IDEA-004, IDEA-109, IDEA-140, IDEA-160, rho, and BSGS
  independent_variables:
    - characteristic-zero model, Frobenius lift, p-derivation, character order, and precision
    - ordinary versus supersingular curve family
    - torsion, non-torsion, signed, repeated, infinity, ramified, and ambiguous strata
  metrics:
    primary:
      - character nonvanishing, scalar compatibility, exact source recall, false outputs, precision, rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - lift traffic, ramification, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the lift/character compatibility theorem is unresolved.
    - Stop if the group-compatible character vanishes or the nonzero lift fails scalar additivity.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A scalar-labelled lift table, known-log lift, or uncharged precision invalidates the arm.
    - Nonzero values on unrelated non-torsion lifts are only a control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a canonical scalar-compatible subgroup lift, nonzero
    additive delta-character, exact digit/source return, and complete exponents at most 0.45.
  falsification_criterion: >-
    Torsion-kernel vanishing, one failure of lift additivity, a scalar-labelled lift,
    unresolved precision, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-263/delta_character_torsion_or_lift_theorem.md
    - ideas/artifacts/ECDLP-IDEA-263/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-263/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-263/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-263
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether a nonzero arithmetic delta-character can preserve a prime-to-p subgroup scalar equation.
  inputs:
    - ideas/rejected/ECDLP-IDEA-263_arithmetic_differential_character_scalar_digits_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-263_arithmetic_differential_character_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use scalar-labelled lifts, known logs, pointwise source advice, or uncharged p-adic precision.
    - Charge model construction, ramification, precision, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - nonzero scalar-compatible subgroup character or torsion-kernel/lift-incompatibility theorem
    - exact digit/source and all-strata compatibility audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
