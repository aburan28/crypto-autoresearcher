experiment:
  id: EXP-ECDLP-IDEA-287-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-287
  lane: high_risk
  version: 1
  title: Motivic Donaldson-Thomas wall-crossing source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: wall_crossing_counts_classes_without_object_level_factor_return
  objective: >-
    Decide theorem-first whether a compact endpoint category and motivic wall crossing
    can factor an endpoint into exact source objects without materializing the source alphabet.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    compact_witness_free_source_category: unresolved
    tuple_injective_stable_object_encoding: unresolved
    exact_all_strata_object_factor_return: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-287" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied finite quivers with known stable objects, explicit DT data, and checked wall-crossing products
    - shared-charge and S-equivalent objects, source-indexed quivers, expanded products, rho, and BSGS
  independent_variables:
    - source dimension, quiver size, charge-lattice rank, stability-wall count, product support, and factor-base beta
    - stable versus strictly semistable and tuple-injective versus charge-colliding objects
    - signed, repeated, infinity, ramified, singular, and ambiguous source tuples
  metrics:
    primary:
      - category construction, object recall, charge collisions, false outputs, relation rank, target descent, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - quiver and potential state, stability rays, motive coefficients, product branches, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the object-level factorization theorem is unresolved.
    - Stop if category construction enumerates the source alphabet or wall crossing omits any source stratum.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A source-labelled category, known-log stability path, or uncharged product expansion invalidates the arm.
    - Correct wall crossing for a supplied finite quiver is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact witness-free categorical compilation,
    tuple-injective object-level factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Charge or S-equivalence collisions, source-alphabet materialization at least N^0.50,
    one missing source stratum, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-287/motivic_wall_crossing_factor_theorem.md
    - ideas/artifacts/ECDLP-IDEA-287/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-287/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-287/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-287
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether motivic wall crossing can return exact source objects rather than aggregate charge classes without source materialization.
  inputs:
    - ideas/rejected/ECDLP-IDEA-287_motivic_donaldson_thomas_wall_crossing_source_factorization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-287_motivic_dt_wall_crossing_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled categories, known-log stability paths, pointwise advice, dense resultants, or uncharged product expansion.
    - Charge category construction, charge state, product output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - compact witness-free category and object-factorization theorem or source-materialization lower bound
    - exact all-strata stable-object-to-factor inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
