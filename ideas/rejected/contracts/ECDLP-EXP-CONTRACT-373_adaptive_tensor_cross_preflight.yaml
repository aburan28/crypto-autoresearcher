experiment:
  id: EXP-ECDLP-IDEA-373-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-373
  lane: representation_changing
  version: 1
  title: Adaptive tensor-cross exact-oracle preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: adaptive_tensor_cross_requires_query2p1_entry_oracle_and_has_no_exact_rare_zero_low_rank_guarantee
  objective: >-
    Preserve a theorem-only representation-changing audit of whether adaptive
    tensor cross can construct an exact low-rank endpoint interpolant and decide
    a target zero using only sub-gate, source-blind probes and subset-stable
    restrictions.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    subgate_exact_mask_entry_oracle: unresolved
    target_uniform_exact_tt_rank_bound: unresolved
    source_blind_cross_pivot_rule: unresolved
    subset_stable_exact_zero_decision: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-373" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_exact_low_tt_rank_tensor_with_known_target_zero
    - positive_synthetic_subset_restrictions_preserving_rank_and_zero_status
    - negative_rare_singleton_zero_mask_with_maximal_or_full_tt_rank
    - negative_entry_or_fiber_probe_requiring_query2p1_source_enumeration
  independent_variables:
    - entry_or_fiber_oracle_definition
    - exact_tt_rank_and_cross_pivot_rule
    - rare_zero_density_and_location
    - subset_restriction_depth
    - beta_sensitivity_and_all_p1553_deck_strata
  metrics:
    primary:
      - exact_target_zero_is_decided_by_a_source_blind_subgate_cross_interpolant
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - exact_tt_rank_bound_is_uniform_over_targets_curves_and_subset_restrictions
      - pivot_selection_is_predeclared_and_independent_of_known_zero_locations
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_any_entry_or_fiber_probe_requires_query2p1_or_source_enumeration
    - stop_if_the_exact_tt_rank_bound_fails_on_a_rare_zero_or_random_curve_control
    - stop_if_cross_pivots_depend_post_hoc_on_known_zero_locations
    - stop_if_subset_restriction_requires_rebuilding_at_super_gate_cost
  invalidation_rules:
    - invalidate_if_the_positive_low_rank_controls_are_not_reconstructed_exactly
    - invalidate_if_numerical_low_rank_is_substituted_for_exact_finite_field_rank
    - invalidate_if_target_zero_status_is_only_a_relation_validity_receipt
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_a_curve_scale_result
  success_criterion: >-
    A complete theorem receipt proves a source-blind sub-gate exact entry oracle,
    a target-uniform low tensor-train rank bound, predeclared adaptive pivots, and
    subset-stable exact zero decisions while satisfying every campaign, online,
    memory, and factor-log gate.
  falsification_criterion: >-
    The preflight is falsified if an entry or fibre probe is Query2P1, if rare
    zeros admit no uniform exact low-rank representation, if pivots are post-hoc,
    or if restrictions require a super-gate rebuild.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-373/exact_tt_cross_obligations.md
    - ideas/artifacts/ECDLP-IDEA-373/rare_zero_rank_cases.json
    - ideas/artifacts/ECDLP-IDEA-373/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-373/cost_analysis.md
  assigned_to: none
  approved_by: null

