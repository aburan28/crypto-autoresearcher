experiment:
  id: EXP-ECDLP-IDEA-254-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-254
  lane: conservative
  version: 1
  title: Dodgson-octahedron source-router theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: adjacent_minor_seeds_restore_source_deck_and_zero_localization_is_singular
  objective: >-
    Decide theorem-first whether the coloured P1539 transversal-minor predicate admits
    a bounded zero-safe octahedron recurrence with an exact row-source inverse.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    p1539_evaluation_blocks: supplied_interface_only
    target_uniform_row_order: unresolved
    division_free_source_recurrence: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-254" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied planar solid-minor arrays with nonzero central minors
    - permuted colour rows, planted central zeros, source-label erasure, IDEA-052, IDEA-077, IDEA-243, P1539, rho, and BSGS
  independent_variables:
    - row order, seed boundary, recurrence chart, and zero-safe rule
    - ordinary versus supersingular curve family
    - distinct, repeated, signed, infinity, singular, and ambiguous source strata
  metrics:
    primary:
      - exact row recall, false sources, seed/state size, branch count, output, rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - adjacent-minor traffic, zero charts, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the bounded source-recurrence theorem is unresolved.
    - Stop if seeds materialize pair/triple catalogues or zero handling uses source advice.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied transversal, source ordering, or uncharged perturbation invalidates the arm.
    - Determinant-recurrence correctness without exact row return is only a control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish target-uniform bounded seeds, zero-safe propagation,
    exact all-strata row return, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Pair/triple source decks, one recurrence-trace collision, source-advised zero charts,
    or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-254/octahedron_source_router_theorem.md
    - ideas/artifacts/ECDLP-IDEA-254/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-254/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-254/cost_analysis.md
  assigned_to: none
  approved_by: null

