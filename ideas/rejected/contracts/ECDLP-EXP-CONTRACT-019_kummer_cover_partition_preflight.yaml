experiment:
  id: EXP-ECDLP-IDEA-019-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-019
  lane: conservative
  version: 2
  title: Blinded Kummer-cover zeta-partition preflight
  status: review_required
  objective: >-
    Determine whether an explicit public degree-2/3 Kummer cover attached to a marked
    point yields a canonical zeta fingerprint with nontrivial hidden-scalar partition
    information, while charging cover availability, isomorphism, point counting,
    collisions, residual list, verification, and bit memory.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  frozen_derivation:
    field_bit_sizes: [8, 9, 10, 11, 12, 13, 14]
    independent_curves_per_size: 12
    cover_recipe: C_R_r_colon_z_pow_r_equals_x_minus_xR_over_x_minus_xT
    public_anchor_rule: first_nonexceptional_hash_to_curve_point
    cover_degrees: [2, 3]
    fingerprint: goncalves_kedlaya_exact_cyclic_cover_zeta_polynomial
    point_count_applicability: smooth_cyclic_cover_and_characteristic_not_dividing_cover_degree
    brute_force_truth_max_bits: 9
    exhaustive_truth_max_bits: 11
    marked_points_per_larger_instance: 64
    label_protocol: freeze_canonical_fingerprint_partition_before_reveal
    seeds: [20260717191, 20260717192, 20260717193]
  controls:
    - exhaustive scalar enumeration revealed only after partition freeze
    - brute-force zeta agreement through 9 bits
    - coordinate-changed isomorphic covers with identical canonical fingerprints
    - random curves with matched genus and point-count cost
    - target-independent anchor-only cover
    - explicit scalar-multiple tables barred from construction and charged only as blind truth
  independent_variables:
    - field bit size
    - curve instance
    - public anchor
    - cover degree
    - marked point
    - canonicalization method
  metrics:
    primary:
      - cover-recipe applicability and construction cost
      - genus, conductor, extension degree, and precision
      - canonicalization and isomorphism cost
      - blinded scalar-partition mutual information
      - collision and residual-list exponent
      - cohomological point-count time exponent and applicability
      - full time exponent lambda
      - full bit-memory exponent mu
    secondary:
      - coordinate-change invariance
      - exceptional cover count
      - target-independent fingerprint frequency
      - verification and post-selection audit
  replication:
    independent_instances: 84
    all_group_elements_through_bits: 11
    marked_points_per_larger_instance: 64
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 180
    maximum_memory_gb: 32
    maximum_runs: 6000
    maximum_output_gb: 40
  stopping_rules:
    - Stop at 14 bits; no extrapolated child-cover chain is part of this contract.
    - Stop an instance after every preregistered marked point and both cover degrees have a terminal fingerprint or exceptional state.
    - Halt inference after a supposedly canonical fingerprint changes under an audited isomorphism.
  invalidation_rules:
    - Scalar labels or scalar-indexed tables visible before partition freeze invalidate the run.
    - Post-hoc anchor, degree, curve, or coordinate selection invalidates the cell.
    - A raw point count without canonical cover/isomorphism handling cannot enter information metrics.
    - A crash, unsupported cover, or point-count timeout is infrastructure or coverage evidence only.
  success_criterion: >-
    Canonical fingerprints invariant under every control isomorphism; zero label leakage;
    collision-adjusted information at least 0.5 bits per charged comparison on at least
    90 percent of the two largest completed sizes; zero wrong labels after reveal; and
    upper 95 percent a<=0.35, point-count/refinement<=0.45, residual-list<=0.20,
    lambda<=0.45, and mu<=0.45. Success promotes only to a preregistered refinement-chain
    study, not an ECDLP claim.
  falsification_criterion: >-
    Every canonical fingerprint is scalar-independent or isomorphic across marked points;
    information vanishes after collision and isomorphism correction; residual lists have
    lower 95 percent exponent at least 0.50; or one accepted label is wrong.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-019/preflight_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-019/kummer_zeta_decoder.sage
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/covers.jsonl
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/fingerprints.jsonl
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-019/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-019/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-019
  from: coordinator
  to: executor
  objective: Implement and run the blinded explicit Kummer-cover zeta-partition preflight after approval.
  uncertainty_reduced: Whether the explicit cover fingerprint contains scalar information before any refinement chain is assumed.
  inputs:
    - ideas/ECDLP-IDEA-019_target_dependent_kummer_cover_zeta_decoder_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-019_kummer_cover_partition_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Freeze canonical fingerprints and partition hashes before revealing scalar labels.
    - Preserve every exceptional cover, collision, isomorphism, miss, and censored instance.
    - A correct zeta function or toy partition is not an ECDLP speedup.
  deliverables:
    - immutable cover, zeta, canonicalization, and partition records
    - leakage, isomorphism, collision, and information audit
    - complete point-count, residual-list, time, and bit-memory report
  budget:
    wall_clock_seconds: 648000
    memory_gb: 32
    maximum_runs: 6000
  completion_gate:
    - Every frozen instance, preregistered marked point, and cover degree has a terminal state.
    - Partition hashes precede label reveals and canonicalization independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
