  id: TASK-20260717-103
  from: coordinator
  to: executor
  objective: Preserve the retired representation theorem gate; do not dispatch without a finite source-faithful atlas and exact residue inverse.
  uncertainty_reduced: Whether finite joint tropicalization changes source recovery rather than only preserving a skeleton or valuation class.
  inputs:
    - ideas/deferred/ECDLP-IDEA-103_faithful_tropical_source_atlas_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-103_tropical_atlas_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch and any successor requires coordinator approval.
    - Do not substitute inverse-limit or metric-faithfulness results for the missing finite point-source theorem.
    - Preserve every source collision, overlap ambiguity, and atlas-size lower bound.
  deliverables:
    - finite target-uniform tropical atlas theorem or no-go proof
    - exact cell/residue-to-source inverse or counterexample
    - complete relation, rank, descent, time, and memory model
    - independent verification report
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
