experiment:
  id: EXP-ECDLP-IDEA-103-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-103
  lane: representation_changing
  version: 1
  title: Finite faithful tropical atlas and exact residue-source inverse preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_finite_target_uniform_source_faithful_atlas_or_exact_residue_inverse_theorem
  objective: >-
    Gate all computation on a finite target-uniform family of tropicalizations
    that jointly separates every accepted signed factor-base tuple and has a
    canonical exact residue/source inverse with fully charged atlas, overlap,
    output, rank, and blind-descent costs.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    universal_marked_addition_family: unresolved
    valued_field_and_lift: unresolved
    finite_joint_tropical_atlas: unresolved
    overlap_and_boundary_policy: unresolved
    exact_residue_source_inverse: unresolved
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: sha256("ECDLP-IDEA-103" || field_bits || curve_index || "20260717")
    future_prng: ChaCha20-IETF
    future_prng_key: full_32_byte_seed_digest
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published faithful tropicalizations of fixed finite skeleta
    - planted toric curves with exact residue and point-source inverses
    - matched random embeddings with deliberate valuation and residue collisions
    - single Newton-polytope, cluster-atlas, and stable-log degeneration controls
    - explicit source-indexed charts as a forbidden full-table control
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance, field size, and decomposition arity
    - factor-base exponent beta
    - valued lift, embedding family, chart count, and coefficient height
    - overlap, residue-branch, and ambiguity budgets
    - known relation target versus masked blind target
  metrics:
    primary:
      - joint tropical injectivity and exact overlap agreement
      - cell-word-to-source biconditional and residue-source inverse agreement
      - B=N^beta and target-independent atlas setup time and memory exponents a and a_m
      - complete chart/overlap record-count exponent g and per-record encoded-height exponent h
      - unshared chart/height time and storage exponent g+h
      - tropical evaluation, overlap traversal, and exact inverse time and memory exponents q and q_m
      - emitted source and target ambiguity exponents o and u
      - reciprocal relation and target success exponents delta and delta_t
      - factor-log linear-algebra time and memory exponents ell and ell_m
      - per-output verification time and memory exponents v and v_m
      - lambda=max(a,g+h,beta+delta+q+o+v,ell,delta_t+q+o+u+v)
      - mu=max(a_m,g+h,q_m,ell_m,beta+o,o+u,v_m)
    secondary:
      - lost, false, ambiguous, repeated, and exceptional source counts
      - relation rank, blind recovery, coefficient height, operations, and serialized bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    exhaustive_truth_through_field_bits: 18
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or any finite-atlas/source theorem is unresolved.
    - Stop after one generic joint-tropical collision or proof that residue inversion recreates the source table.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after an independent proof of target-uniform injectivity and exact source inversion.
  invalidation_rules:
    - Metric or skeletal faithfulness without point-source inversion is a representation control.
    - Target-selected embeddings, source-indexed charts, hidden factor logs, or post-hoc residue branches invalidate the arm.
    - Omitting valued-field construction, coefficient height, overlaps, output, rank, descent, or memory invalidates cost claims.
    - Every relation attempt, miss, duplicate, and rejected row counts against the frozen attempt ceiling and charged cost.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 proves a finite target-uniform jointly source-injective
    atlas, a chart-complete exact residue/source inverse, and full relation,
    rank, blind-descent, output, time, and memory exponents at most 0.45.
  falsification_criterion: >-
    One generic source collision, atlas/chart/height or inverse-output exponent
    at least 0.50, or proof that exact residue inversion reconstructs the full
    incidence table closes the mechanism.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-103/finite_atlas_source_inverse.md
    - ideas/artifacts/ECDLP-IDEA-103/tropical_atlas.yaml
    - ideas/artifacts/ECDLP-IDEA-103/build_atlas.sage
    - ideas/artifacts/ECDLP-IDEA-103/verify_sources.py
    - ideas/artifacts/ECDLP-IDEA-103/analysis.md
  assigned_to: none
  approved_by: null

