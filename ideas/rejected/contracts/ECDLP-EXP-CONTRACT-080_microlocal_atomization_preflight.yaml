experiment:
  id: EXP-ECDLP-IDEA-080-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-080
  lane: high_risk
  version: 1
  title: Microlocal characteristic-cycle source-atomization preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: ordinary_characteristic_cycle_collapses_source_tuples_to_one_conormal_multiplicity
  objective: >-
    Determine whether a frozen source-labelled sheaf under elliptic addition
    convolution has target-local characteristic-cycle components in exact
    bicondition with factor-base source tuples and an effective inverse whose
    rank, cycle, output, relation, descent, time, and memory costs beat rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [5, 6, 7, 8, 9, 10, 11, 12, 13]
    independent_curves_per_size: 24
    decomposition_arities: [2, 3]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    coefficient_fields: [ell_2, ell_3]
    sheaf_grammar: frozen_skyscraper_extension_and_finite_pushforward_models
    exhaustive_truth_max_bits: 11
    seeds: [20260717801, 20260717802, 20260717803]
    phase_1: exact_convolution_cycle_component_biconditional_and_source_inverse_before_scaling
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - published characteristic-cycle and index identities on finite maps
    - planted source-labelled conormal branches with known inverse
    - constant and skyscraper sheaves under elliptic addition convolution
    - trace-function and stationary-phase witness-count controls
    - exhaustive addition-incidence tuples and materialized source fibers
    - Pollard rho and BSGS under matched operation accounting
  independent_variables:
    - field bit size and curve instance
    - decomposition arity and factor-base exponent beta
    - coefficient field and frozen sheaf constructor
    - relation target versus masked blind target
    - convolution depth cycle-degree and component budget
    - annotated versus annotation-forgetting control
  metrics:
    primary:
      - component to exhaustive-source biconditional agreement
      - multiplicity sign and source-inverse agreement
      - sheaf setup and convolution exponent s
      - characteristic-cycle degree exponent c
      - specialization inverse and output exponents k and o
      - reciprocal relation and target-density exponents delta and delta_t
      - full time exponent lambda=max(s,c,beta+delta+k+o,2*beta,delta_t+k+o)
      - full memory exponent mu including ranks cycles components annotations and output
    secondary:
      - sheaf rank and extension-data size by convolution depth
      - conormal component and multiplicity distributions
      - relation rank blind target recovery operation counts timings and peak memory
  replication:
    independent_instances: 216
    relation_queries_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 10800
    total_cpu_hours: 720
    maximum_memory_gb: 64
    maximum_runs: 18000
    maximum_output_gb: 120
  stopping_rules:
    - Stop before scaling unless Phase 1 independently verifies convolution cycle computation the biconditional and exact source inverse.
    - Stop after one independently reproduced source collision lost annotation false source or missing component.
    - Stop an arm after two consecutive sizes exceed 60 GB median peak memory and preserve censored results.
    - Halt inference after any accepted relation or recovered scalar fails independent verification.
  invalidation_rules:
    - A trace count singular-support location or relation-only cycle without exact source inversion is a control.
    - Target-selected sheaves post-hoc components and explicit incidence tables invalidate the mechanism arm.
    - Omitting convolution construction extension data rank cycle degree component output or descent invalidates cost claims.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 passes exact component/source bicondition, multiplicity, and inverse
    checks on every exhaustive instance; at least 1000 verified relations and
    100 blind target descents pass at each of the two largest completed sizes;
    upper 95 percent bounds satisfy s<=0.35, c<=0.35, k+o<=0.20,
    lambda<=0.45, and mu<=0.45 under complete accounting; and the source-labelled
    construction beats trace-only and materialized-incidence controls.
  falsification_criterion: >-
    A generic component collision, annotation loss, false or missing source,
    characteristic-cycle or output exponent at least 0.50, or lower 95 percent
    lambda>=0.50 in every complete-cost arm falsifies the stated mechanism at
    the tested boundary.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-080/implementation.md
    - ideas/artifacts/ECDLP-IDEA-080/sheaf_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-080/verifier.sage
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-080/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-080/analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260717-080
  from: coordinator
  to: executor
  objective: Preserve the rejected draft and its characteristic-cycle no-go; do not dispatch or tune this contract.
  uncertainty_reduced: Whether microlocal components retain exact source atoms without materializing the full elliptic addition incidence object.
  inputs:
    - ideas/rejected/ECDLP-IDEA-080_microlocal_characteristic_cycle_atomization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-080_microlocal_atomization_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch; a richer invariant would require a new idea ID and contract.
    - Do not enter scaling after any Phase 1 cycle biconditional or source-inverse error.
    - Preserve every sheaf rank cycle component multiplicity annotation source miss and censored cell.
    - Do not interpret a trace identity characteristic-cycle count or toy scalar recovery as promotion.
  deliverables:
    - frozen sheaf and convolution specification
    - exhaustive component multiplicity and source-inverse comparison
    - complete rank cycle output density descent time and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1728000
    memory_gb: 64
    maximum_runs: 18000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
