experiment:
  id: EXP-ECDLP-IDEA-244-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-244
  lane: conservative
  version: 1
  title: Balanced type-II collision-residue theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_transposed_relative_norm_backend_without_source_recurrence
  objective: >-
    Decide theorem-first whether a balanced type-II relative norm has a
    source-blind transposed recurrence whose first collision residue returns both
    exact source sides without ordered period rows or a dense resultant.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    balanced_relative_norm_recurrence: unresolved
    collision_residue_source_biconditional: unresolved
    period_payload_factorization_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-244" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied polynomial products with planted simple collisions and exact residues
    - explicit period rows, dense resultants, and orbit BSGS
    - IDEA-003, IDEA-053, IDEA-194, P1533, P1536, rho, and BSGS
  independent_variables:
    - balanced split, deformation direction, residue order, source bisection, and mask
    - known-log endpoint versus fresh masked blind target
    - simple, multiple, repeated, signed, infinity, and nonreduced collision branches
  metrics:
    primary:
      - exact two-sided source recall, false sources, residue state, output, rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, power projections, derivative traffic, factor logs, blind descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the recurrence/source theorem is unresolved.
    - Stop if construction needs ordered period rows, a dense resultant, orbit BSGS, or post-hoc bisection.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied collision ideal, period table, or uncharged primary split invalidates the arm.
    - A correct local residue or relation is a control and cannot establish asymptotic performance.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a source-blind relative-norm recurrence, exact
    two-sided source residue on every stratum, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    One equal-residue/different-source collision, retained period/resultant
    payload, missed source, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-244/type2_collision_residue_theorem.md
    - ideas/artifacts/ECDLP-IDEA-244/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-244/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-244/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-244
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate as semantic-merge evidence; do not dispatch it.
  uncertainty_reduced: Whether a type-II collision residue can create exact sources without the full period or resultant payload.
  inputs:
    - ideas/rejected/ECDLP-IDEA-244_balanced_type2_collision_residue_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-244_type2_collision_residue_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply ordered rows, a collision ideal, dense resultants, or source bisection advice.
    - Charge the complete factor-base-to-target path and both time and memory.
  deliverables:
    - relative-norm recurrence or period-payload factorization proof
    - exact two-sided source residue theorem and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
