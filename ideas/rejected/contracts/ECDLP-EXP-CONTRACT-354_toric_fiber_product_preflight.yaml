  id: TASK-20260718-354
  from: coordinator
  to: executor
  objective: Preserve the retired toric fibre-product theorem review; do not dispatch it.
  uncertainty_reduced: Whether an endpoint-only grading supports subset-stable exact restricted-fibre decisions or a direct section with a bounded gluing basis.
  inputs:
    - ideas/rejected/ECDLP-IDEA-354_toric_fiber_product_source_gluing_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-354_toric_fiber_product_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply source gradings, ancestry bases, dense resultants, post-hoc selectors, or uncharged fibre traversal.
    - Charge ideal construction, gluing, source output, rank, logs, descent, verification, and memory.
  deliverables:
    - endpoint-only grading, restricted-decision, and bounded-basis theorem receipt
    - projected-fibre collision and all-strata source audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
