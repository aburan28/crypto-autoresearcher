experiment:
  id: EXP-ECDLP-IDEA-278-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-278
  lane: representation_changing
  version: 1
  title: Gelfand-Levitan-Marchenko source-potential theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: scattering_data_or_finite_field_inverse_materializes_the_source_deck
  objective: >-
    Decide theorem-first whether endpoint-only scattering data and a finite-field
    Gelfand-Levitan-Marchenko inverse can return exact factors without materializing the source fiber.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_source_faithful_scattering_data: unresolved
    canonical_finite_field_glm_inverse: unresolved
    exact_all_strata_factor_return: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-278" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied finite-support potentials with complete reflection, bound-state, and norming data and a known inverse
    - omitted norming constants, phase-scrambled or isoscattering data, source-labelled scattering tables, rho, and BSGS
  independent_variables:
    - source dimension, potential support, reflection-sample count, bound-state count, norming state, and factor-base beta
    - complete versus truncated scattering data and unique versus isoscattering potentials
    - signed, repeated, infinity, ramified, singular, and ambiguous source tuples
  metrics:
    primary:
      - scattering compilation, inverse uniqueness, exact source recall, false outputs, relation rank, target descent, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - reflection samples, poles, norming constants, kernel state, potential branches, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the endpoint-scattering/finite-field-inverse theorem is unresolved.
    - Stop if scattering compilation enumerates the source fiber or the inverse omits any source stratum.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled scattering data, known-log branch selection, or uncharged norming data invalidates the arm.
    - Correct inversion of supplied complete scattering data is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only scattering data, a canonical
    all-strata finite-field inverse, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Source-deck materialization, scattering or potential state at least N^0.50, one missing
    source stratum, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-278/marchenko_source_potential_theorem.md
    - ideas/artifacts/ECDLP-IDEA-278/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-278/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-278/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-278
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether endpoint-only scattering data and a finite-field GLM inverse can return exact factors without source materialization.
  inputs:
    - ideas/rejected/ECDLP-IDEA-278_gelfand_levitan_marchenko_source_potential_decoder_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-278_gelfand_levitan_marchenko_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled scattering data, known-log selectors, pointwise advice, dense resultants, or uncharged inverse data.
    - Charge scattering compilation, spectral state, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - compact endpoint-only scattering and finite-field inverse theorem or source-materialization lower bound
    - exact all-strata potential-to-factor inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
