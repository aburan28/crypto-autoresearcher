experiment:
  id: EXP-ECDLP-IDEA-266-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-266
  lane: conservative
  version: 1
  title: Equiproj dynamic-evaluation source-tree theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: source_tree_construction_or_exact_inverse_materializes_the_factor_fiber
  objective: >-
    Decide theorem-first whether an equiprojectable dynamic-evaluation source tree can
    be generated and inverted to exact factors without materializing the source fiber.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    target_uniform_equiprojectable_tree: unresolved
    compact_dynamic_evaluation_state: unresolved
    exact_all_strata_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-266" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied triangular sets with labelled equiprojectable fibers and known exact inverse
    - permuted source labels, generic dense fibers, explicit source tables, large-prime tables, dense resultants, rho, and BSGS
  independent_variables:
    - source dimension, fiber degree, projection order, branch regularity, and factor-base beta
    - split versus nonsplit and squarefree versus repeated projection strata
    - signed, repeated, infinity, ramified, singular, and ambiguous source tuples
  metrics:
    primary:
      - tree construction, branch count, exact source recall, false outputs, relation rank, target descent, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - projection failures, coefficient traffic, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the compact-tree/source-inverse theorem is unresolved.
    - Stop if the tree construction enumerates the source fiber or the inverse omits any source stratum.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A source-labelled tree, known-log branch selector, or uncharged factorization invalidates the arm.
    - Correct evaluation on a supplied triangular set is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a target-uniform compact equiprojectable tree, exact
    all-strata source inverse, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Source-fiber materialization, projection-branch output at least N^0.50, one missing
    source stratum, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-266/equiprojectable_source_tree_theorem.md
    - ideas/artifacts/ECDLP-IDEA-266/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-266/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-266/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-266
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether dynamic evaluation can construct and invert a compact ECDLP source tree without source enumeration.
  inputs:
    - ideas/rejected/ECDLP-IDEA-266_equiprojectable_dynamic_evaluation_source_tree_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-266_equiprojectable_dynamic_evaluation_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled trees, known-log selectors, pointwise advice, dense resultants, or uncharged factorization.
    - Charge tree construction, branches, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - compact target-uniform source-tree theorem or source-materialization lower bound
    - exact all-strata source inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
