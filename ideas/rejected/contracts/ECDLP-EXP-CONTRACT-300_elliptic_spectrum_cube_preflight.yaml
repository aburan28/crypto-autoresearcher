experiment:
  id: EXP-ECDLP-IDEA-300-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-300
  lane: high_risk
  version: 1
  title: Elliptic-spectrum cubical source-factor theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: cubical_orientation_records_curve_data_not_labelled_source_fibers
  objective: >-
    Decide theorem-first whether cubical power operations can return exact factors
    without point-indexed level structure or source-sized spectrum state.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_point_faithful_spectrum: unresolved
    exact_power_operation_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-300" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied small elliptic spectra with independently known cubical orientations and power operations
    - same-endpoint source tuples, unmarked cube data, explicit N-level dictionaries, rho, and BSGS
  independent_variables:
    - spectrum height, coefficient extension, level size, operation arity, primitive count, source arity, and factor-base beta
    - signed, repeated, singular, infinity, level-ambiguous, and nonreduced source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - spectrum and level state, operation coefficients, primitives, inverse branches, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the point-faithful operation inverse theorem is unresolved.
    - Stop if level or spectrum state materializes sources or any source stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Point-indexed level data, source-labelled spectrum classes, target-trained operations, or uncharged state invalidate the arm.
    - Correct cube or power-operation identities on supplied classes are only positive controls.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish endpoint-only point-faithful spectrum construction,
    exact all-strata factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Curve-only data, source-sized level/state/output, one missing stratum, target advice,
    or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-300/cubical_power_source_theorem.md
    - ideas/artifacts/ECDLP-IDEA-300/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-300/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-300/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-300
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether cubical elliptic operations can return exact factors without source-sized level state.
  inputs:
    - ideas/rejected/ECDLP-IDEA-300_elliptic_spectrum_theorem_of_cube_source_factorization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-300_elliptic_spectrum_cube_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use point-indexed level dictionaries, source-labelled spectrum classes, or uncharged operation state.
    - Charge spectrum construction, level data, operations, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - point-faithful cubical-operation theorem or curve-only/source-state obstruction
    - exact all-strata primitive-to-factor inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
