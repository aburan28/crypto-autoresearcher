experiment:
  id: EXP-ECDLP-IDEA-313-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-313
  lane: high_risk
  version: 1
  title: Rota-Baxter Birkhoff source-factorization preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: factorization_consumes_supplied_source_word_or_aggregate_character
  objective: >-
    Decide theorem-first whether an endpoint-only Hopf character and public
    Rota-Baxter split can return exact factor sources without a source forest.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_hopf_character_compiler: unresolved
    all_strata_primitive_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-313" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied rooted-forest Hopf characters with independently labelled primitives
    - equal aggregate characters with different source words, source-sized primitive bases, rho, and BSGS
  independent_variables:
    - Hopf degree, basis size, coproduct width, filtration depth, source arity, and factor-base beta
    - reduced, repeated, singular, infinity, signed, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - character compiler size, coproduct terms, convolution recursion, primitives, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the character-to-source theorem is unresolved.
    - Stop if character compilation enumerates source words, primitives lose point labels, or one stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled trees, known-log projections, or uncharged Hopf basis state invalidates the arm.
    - Correct Birkhoff factorization of a supplied character is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only character construction, canonical
    Rota-Baxter splitting, exact all-strata factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Source-word materialization, aggregate-only primitives, one missing stratum,
    state/output at least N^0.50, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-313/rota_baxter_source_biconditional.md
    - ideas/artifacts/ECDLP-IDEA-313/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-313/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-313/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-313
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether algebraic Birkhoff factorization can reveal exact source leaves from an endpoint character.
  inputs:
    - ideas/rejected/ECDLP-IDEA-313_rota_baxter_birkhoff_source_factorization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-313_rota_baxter_birkhoff_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled forests, known-log projections, primitive point tables, or uncharged Hopf state.
    - Charge character compilation, coproducts, convolution, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - endpoint-only character/source biconditional theorem or equal-character counterexample
    - exact all-strata primitive-to-point audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
