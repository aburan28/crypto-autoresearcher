experiment:
  id: EXP-ECDLP-IDEA-233-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-233
  lane: high-risk
  version: 1
  title: Conley connection-matrix exact-source router theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_flow_and_morse_sets_require_source_transition_deck
  objective: >-
    Decide theorem-first whether an endpoint-derived compact flow and Morse
    decomposition admit a canonical connection-matrix inverse to every exact
    signed elliptic source without materializing source transitions.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_flow_compiler: unresolved
    canonical_connection_matrix_point_inverse: unresolved
    continuation_collision_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-233" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied Morse decompositions with independently known connection matrices and orbits
    - continuation-equivalent source permutations plus IDEA-073, IDEA-174, IDEA-218, and IDEA-220
    - explicit source-transition decks, Semaev fibers, rho, and BSGS
  independent_variables:
    - flow, discretization, isolating cells, Morse order, basis, matrix normalization, and mask
    - known-log endpoint versus fresh masked blind target
    - signs, repeats, boundary strata, continuation choices, ambiguity, and retained state
  metrics:
    primary:
      - exact-source recall, false sources, state cells, matrix traffic, output, rank, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, orbit steps, homology, continuation, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the flow/source inverse theorem is unresolved.
    - Stop if source-faithful Morse sets require labelled transition cells or if the inverse depends on an arbitrary basis.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source flow, hidden orbit labels, or uncharged state/output invalidates the arm.
    - Toy Conley or connection-matrix correctness is a control and cannot establish asymptotics.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a compact endpoint flow, source-faithful Morse
    decomposition, and canonical all-strata matrix inverse, with complete time
    and memory exponents at most 0.45.
  falsification_criterion: >-
    One continuation-equivalent/different-source collision, explicit transition
    deck, missed or false source, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-233/conley_source_router_theorem.md
    - ideas/artifacts/ECDLP-IDEA-233/connection_matrix_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-233/independent_conley_verifier.py
    - ideas/artifacts/ECDLP-IDEA-233/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-233
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether connection-matrix continuation data canonically return exact elliptic sources without a source-transition deck.
  inputs:
    - ideas/rejected/ECDLP-IDEA-233_conley_connection_matrix_source_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-233_conley_source_router_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply source-labelled flow states or treat a homology invariant as exact point recovery.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - endpoint flow/source inverse theorem or continuation-collision proof
    - all-strata source biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
