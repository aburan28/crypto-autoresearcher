experiment:
  id: EXP-ECDLP-IDEA-115-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-115
  lane: representation_changing
  version: 1
  title: Source-labelled Ulrich sheaf and linear Chow-complex theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: scoped_strict_ulrich_single_map_source_length_floor
  objective: >-
    Preserve the scoped negative for a target-independent strict-Ulrich square
    linear source atomizer: exact independent source atoms force full
    cycle-length payload above rho, so no computation may be dispatched.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_labelled_incidence: resolved_full_unordered_cycle_length_theta_r5
    target_independent_ulrich_sheaf: scoped_negative_for_strict_single_map_atomizer
    linear_chow_complex: multiterm_extension_requires_separate_no_cancellation_proof
    exact_kernel_source_inverse: incompatible_with_subrho_scalar_linear_payload
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-115" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published determinantal varieties with explicit Ulrich sheaves and Chow complexes
    - planted zero-dimensional schemes with independently known point-labelled kernels
    - dense resultants and quotient-algebra solvers matched for degree and arithmetic work
    - source-labelled versus label-dropped complexes matched for serialized payload
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance, field size, and relation arity
    - factor-base exponent beta
    - projective embedding, sheaf, resolution, and kernel normalization
    - known relation target versus masked blind target
    - complex, kernel, source-output, and ambiguity budgets
  metrics:
    primary:
      - exact Ulrich and linear-complex verification
      - kernel-to-source biconditional on complete fibers
      - sheaf, resolution, and factor-base setup time and memory exponents a and a_m
      - serialized complex and working-state exponents c and c_m
      - reciprocal relation and target success exponents delta and delta_t
      - specialization, kernel, source-inverse, and exact EC verification exponent k
      - source-output and target-ambiguity exponents o and u
      - factor-log linear-algebra time and memory exponents ell and ell_m
      - lambda=max(a,c,beta+delta+k+o,ell,delta_t+k+o+u,beta)
      - mu=max(a_m,c_m,beta+o,ell_m,u)
    secondary:
      - missed, mixed, repeated, nonreduced, and exceptional kernel atoms
      - relation rank, blind recovery, wall time, operations, and serialized bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run; the declared strict-Ulrich single-map mechanism is closed by theorem and this draft is retired.
    - Preserve the source-length payload proof and the exclusion of multiterm, rectangular, succinct, and nonlinear target-specialized representations.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - Any nonlinear target-specialized representation requires a new idea ID and contract.
  invalidation_rules:
    - A dense resultant, generic syzygy solver, or post-hoc source annotation is a control.
    - Constructing the complex from enumerated source tuples invalidates the arm.
    - Omitting coefficient payload, kernel output, relation density, rank, descent, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    Historic promotion would have required a target-independent Ulrich sheaf, a
    subdegree linear complex, an exact source-biconditional kernel on complete
    fibers, and full relation, rank, blind-descent, output, time, and memory
    exponents at most 0.45; the declared strict-Ulrich single-map mechanism cannot satisfy it.
  falsification_criterion: >-
    No suitable sheaf, one generic missing or mixed source atom, payload or output
    exponent at least 0.50, or proof that the source-biconditional complex exposes
    the complete relation fiber closes the mechanism; the cycle-length receipt
    satisfies the final branch for the declared strict-Ulrich single-map atomizer.
  current_theorem_receipts:
    - ideas/artifacts/ECDLP-IDEA-115/ulrich_source_gate.md
    - ideas/artifacts/ECDLP-IDEA-115/p1512_scoped_negative_audit.md
  future_successor_boundary_artifacts:
    - ideas/artifacts/ECDLP-IDEA-115/nonlinear_successor_requirements.md
  assigned_to: none
  approved_by: null

