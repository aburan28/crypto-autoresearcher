experiment:
  id: EXP-ECDLP-IDEA-386-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-386
  lane: conservative
  version: 1
  title: Twin-width red-edge contraction source-quotient preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: actual_source_graph_construction_and_red_degree_control_retain_source_incidence_or_lose_exact_occurrence_labels
  objective: >-
    Preserve a theorem-only audit of whether a target-independent bounded
    twin-width contraction sequence for the complete finite-deck source graph
    yields a subgate quotient with restriction-stable exact occurrence lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_source_graph_constructor: unresolved
    certified_subgate_red_degree_contraction_sequence: unresolved
    restriction_stable_exact_occurrence_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-386" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_bounded_twin_width_graph_with_known_contraction_sequence
    - positive_exact_red_edge_and_occurrence_label_replay
    - negative_equal_final_quotient_with_distinct_occurrence_sources
    - negative_actual_source_graph_family_with_unbounded_red_degree_growth
  independent_variables:
    - source_graph_vertex_edge_and_label_interface
    - contraction_order_and_maximal_red_degree
    - quotient_state_and_occurrence_label_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_a_bounded_red_degree_contraction_quotient
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_source_graph_edge_red_edge_contraction_and_label_lift_is_fully_charged
      - contraction_state_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_source_graph_construction_requires_explicit_source_incidence
    - stop_if_maximal_red_degree_or_contraction_state_exceeds_B_to_the_9_over_4
    - stop_if_restriction_replay_or_occurrence_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_occurrence_label_or_complete_chart_stratum_is_merged_or_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_bounded_twin_width_graph_is_confused_with_the_actual_source_graph
    - invalidate_if_the_contraction_sequence_is_target_fitted_or_source_enumerated
    - invalidate_if_relation_validity_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs the source graph from endpoint data, proves a
    subgate red-degree bound and target-independent contraction sequence, gives
    restriction-stable exact occurrence lift, and satisfies every state, query,
    campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by explicit source-incidence construction,
    supergate red degree or quotient state, one restriction or label failure,
    or complete time or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-386/twin_width_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-386/red_edge_scaling.json
    - ideas/artifacts/ECDLP-IDEA-386/quotient_source_receipt.json
    - ideas/artifacts/ECDLP-IDEA-386/cost_analysis.md
  assigned_to: none
  approved_by: null

