experiment:
  id: EXP-ECDLP-IDEA-309-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-309
  lane: conservative
  version: 1
  title: Cartier test-ideal source-stratification preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: test_ideal_is_unit_on_generic_reduced_source_locus
  objective: >-
    Decide theorem-first whether endpoint-derived Cartier/test-ideal data can separate
    every generic factor source without factoring or materializing the source algebra.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_cartier_algebra_compiler: unresolved
    all_strata_test_ideal_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-309" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied singular toy fibers with independently labelled Frobenius-compatible strata
    - generic reduced etale fibers, primitive-idempotent factorization, source-labelled ideals, rho, and BSGS
  independent_variables:
    - Frobenius power, Cartier generators, test-ideal depth, source arity, and factor-base beta
    - reduced, repeated, singular, infinity, signed, inseparable, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - Cartier compiler size, ideal chain length, components, extension points, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the source-biconditional theorem is unresolved.
    - Stop if the full-Cartier-algebra test ideal is unit on the unadorned regular finite-etale locus, source factorization is required, or one stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled ideals, known-log selectors, or uncharged component factorization invalidates the arm.
    - Detecting a supplied singular stratum is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only Cartier construction, exact
    generic and all-strata factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    A unit full-Cartier-algebra test ideal on the unadorned regular finite-etale locus,
    source factorization, one missing stratum, state/output at
    least N^0.50, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-309/cartier_test_ideal_stratification_theorem.md
    - ideas/artifacts/ECDLP-IDEA-309/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-309/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-309/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-309
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether intrinsic Cartier/test-ideal strata can label generic source points without factorization.
  inputs:
    - ideas/rejected/ECDLP-IDEA-309_cartier_test_ideal_source_stratifier_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-309_cartier_test_ideal_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled ideals, known-log selectors, dense factorization, or uncharged point tables.
    - Charge Cartier construction, Frobenius and ideals, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - unit-ideal boundary or endpoint-only test-ideal/source biconditional theorem
    - exact all-strata source inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
