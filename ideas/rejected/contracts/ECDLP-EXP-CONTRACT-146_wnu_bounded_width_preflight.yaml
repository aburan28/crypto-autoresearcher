experiment:
  id: EXP-ECDLP-IDEA-146-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-146
  lane: conservative
  version: 1
  title: WNU bounded-width source-descent theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: exact_sparse_factor_base_wnu_affine_collapse
  objective: >-
    Decide symbolically whether the elliptic decomposition CSP admits a public,
    factor-base-preserving weak-near-unanimity polymorphism of constant width
    whose local-consistency witnesses lift to exact source tuples.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: scoped_all_arity_no_go_proved
    csp_signature: faithful_addition_plus_factor_base_unary_relation
    wnu_polymorphism: disproved_by_affine_averaging_and_cauchy_davenport
    source_lift: not_reached_after_factor_base_preservation_no_go
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-146" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied bounded-width affine CSPs with exact witnesses
    - random factor bases and Maltsev-coset encodings
    - generalized-birthday relation search, Pollard rho, and BSGS
  metrics:
    primary:
      - factor-base closure and constant relational width
      - exact source tuple recovery without tuple enumeration
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - arity, width, ambiguity, relation density, rank, and blind descent
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while the draft is retired or the Phase 0 theorem is unresolved.
    - Stop because every WNU preserving the faithful addition graph is affine averaging and cannot preserve a proper nontrivial factor base.
  invalidation_rules:
    - Supplied satisfying assignments or hidden scalar coordinates are positive controls only.
    - A consistency certificate without an exact source tuple is insufficient.
    - Omitted setup, query, output, rank, descent, ambiguity, or memory costs invalidate the model.
  success_criterion: >-
    Independent proof gives a target-uniform constant-width WNU operation,
    factor-base preservation, exact public source lift, and complete exponents at most 0.45.
  falsification_criterion: >-
    The proved all-arity affine-averaging collapse closes the stated mechanism;
    a supplied source oracle or a complete time or memory exponent at least 0.50
    closes any separately scoped successor.
  existing_evidence_artifacts:
    - ideas/artifacts/ECDLP-IDEA-146/bounded_width_theorem.md
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-146/bounded_width_theorem_audit.md
    - ideas/artifacts/ECDLP-IDEA-146/csp_encoder_spec.md
    - ideas/artifacts/ECDLP-IDEA-146/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-146/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-146/cost_analysis.md
  assigned_to: none
  approved_by: null

