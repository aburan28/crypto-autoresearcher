    - ideas/artifacts/ECDLP-IDEA-076/scattering_diagram.yaml
    - ideas/artifacts/ECDLP-IDEA-076/theorem_verifier.md
    - ideas/artifacts/ECDLP-IDEA-076/cost_model.json
    - ideas/artifacts/ECDLP-IDEA-076/analysis.md
