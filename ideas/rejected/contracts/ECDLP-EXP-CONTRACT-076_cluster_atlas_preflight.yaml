  hypothesis_id: ECDLP-IDEA-076
  lane: high_risk
  version: 1
  title: Marked elliptic cluster-atlas and broken-line charge theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_explicit_marked_elliptic_atlas_wall_data_or_scalar_fiber_theorem_is_frozen
  objective: >-
    Gate any future computation on an explicit finite-field marked elliptic or
    log-Calabi-Yau space, complete seed and wall data, path-independent
    broken-line continuation, an addition-compatible charge, and a proved
    scalar-fiber/source-descent bound under complete rho and BSGS accounting.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    marked_space: unresolved
    seed_set: unresolved
    wall_functions: unresolved
    finite_field_evaluation_rule: unresolved
    factor_base_definition: unresolved
    decomposition_arities: [3, 4]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [7, 8, 9, 10, 11, 12, 14, 16]
    seeds: [20260717761, 20260717762, 20260717763]
  controls:
    - published finite-type cluster mutations and broken-line products
    - planted piecewise-linear group actions with known charge paths
    - mutation-equivalent seeds and all wall-order permutations
    - random toric coordinates matched for dimension and codomain size
    - full chamber and residual-candidate enumeration
    - Pollard rho and BSGS under matched operation accounting
  independent_variables:
    - marked-space and seed choice after a versioned successor freezes them
    - wall order and mutation path
    - field bit size curve instance and decomposition arity
    - factor-base exponent beta
    - relation target versus masked blind target
    - chamber residual-list and coefficient-growth budget
  metrics:
    primary:
      - complete chart coverage and finite-field evaluation agreement
      - path-independent broken-line charge agreement
      - elliptic addition law and exact scalar-fiber bound
      - atlas setup exponent s chamber exponent chi and coefficient exponent h
      - inverse relation and target-density exponents delta and delta_t
      - continuation output and residual-list exponents k o and r
      - factor-log linear algebra exponent ell
      - full time exponent lambda=max(s,chi,h,beta+delta+k+o,ell,delta_t+k+o,r)
      - full memory exponent mu including seeds walls chambers coefficients and output
    secondary:
      - exceptional-chart and path-disagreement counts
      - relation rank blind target recovery timings and peak memory
  replication:
    theorem_instances: 1
    future_independent_instances: 192
    future_relation_queries_per_largest_cell: 1000
    future_target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    theorem_review_wall_clock_seconds: 1209600
    future_maximum_memory_gb: 48
    future_maximum_runs: 12000
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run any experiment while this draft is retired or any mathematical input is unresolved.
    - Stop after a proof that no generic marked elliptic cluster atlas or path-independent scalar-sensitive charge exists.
    - A versioned successor may scale only after independent verification of the full Phase 0 theorem artifact.
    - Halt inference after any accepted relation or recovered scalar fails independent verification.
  invalidation_rules:
    - A coordinate mutation Laurent expansion Newton polytope or chamber label without an exact scalar-fiber/source theorem is a control.
    - Target-selected seeds walls paths post-hoc chambers or scalar-labelled dictionaries invalidate the mechanism arm.
    - Omitting seed wall codomain chamber coefficient rank output relation descent or memory cost invalidates asymptotic claims.
    - Timeout dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    A future versioned Phase 0 must freeze one generic marked space, all seeds
    and walls, prove path independence and elliptic addition compatibility,
    prove a source-resolving scalar-fiber bound below exponent 0.50, and specify
    complete relation collection, factor-log solving, blind descent, output,
    time, and memory accounting before any run matrix can be approved.
  falsification_criterion: >-
    Nonexistence of the required atlas, path dependence, factorization through
    scalar-blind curve invariants, an order-N chamber or theta dictionary, or a
    residual candidate/codomain exponent at least 0.50 closes this draft.
  required_artifacts:
