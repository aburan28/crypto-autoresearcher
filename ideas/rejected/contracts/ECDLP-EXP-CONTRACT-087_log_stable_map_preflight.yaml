experiment:
  id: EXP-ECDLP-IDEA-087-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-087
  lane: high_risk
  version: 1
  title: Log-stable-map degeneration and source-gluing theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_explicit_addition_degeneration_contact_atom_or_source_gluing_theorem
  objective: >-
    Gate any future run on an explicit logarithmic degeneration of the elliptic
    addition correspondence whose gluing types produce individual contact-labelled
    factor atoms and whose evaluation fiber product has an exact source inverse.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    logarithmic_target_and_degeneration: unresolved
    basic_stable_map_class: unresolved
    contact_and_gluing_data: unresolved
    component_source_inverse: unresolved
    decomposition_arities: [3, 4]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [11, 12, 13, 14, 16, 18, 20]
    seeds: [20260717871, 20260717872, 20260717873]
  controls:
    - published stable-log-map degeneration identities on frozen toy targets
    - exhaustive source-labelled decompositions on tiny elliptic curves
    - virtual-cycle and point-count degeneration without source labels
    - random semistable degenerations with matched component and contact counts
    - Pollard rho and BSGS under matched operation accounting
  independent_variables:
    - degeneration and curve class after a successor freezes them
    - field size curve instance and decomposition arity
    - factor-base exponent beta
    - known relation target versus masked blind target
    - tropical type contact order automorphism and gluing-branch budgets
  metrics:
    primary:
      - exact degeneration and evaluation-fiber-product agreement
      - gluing-type to factor-source biconditional and source inverse
      - setup exponent a tropical-type exponent tau and gluing exponent g
      - reciprocal relation and target-density exponents delta and delta_t
      - per-source inverse and output exponents q and o
      - factor-log linear algebra exponent ell
      - full time exponent lambda=max(a,tau,g,beta+delta+q+o,ell,delta_t+q+o)
      - full memory exponent mu including moduli charts types contacts branches and output
    secondary:
      - automorphism multiplicity lost false and ambiguous source counts
      - relation rank blind recovery timings and serialized bytes
  replication:
    theorem_instances: 1
    future_independent_instances: 160
    future_relation_queries_per_largest_cell: 1000
    future_target_descents_per_largest_cell: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    future_maximum_memory_gb: 48
    future_maximum_runs: 12000
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while the logarithmic target gluing data or source inverse is unresolved.
    - Stop after proof that only virtual counts survive or gluing branches retain the full tuple set.
    - A successor may scale only after independent verification of exact contact-labelled source lifting.
  invalidation_rules:
    - A virtual class count or degeneration identity without individual sources is a relation-only control.
    - Target-selected degenerations post-hoc tropical types and hidden tuple annotations invalidate the arm.
    - Omitting automorphisms contact multiplicities gluing output rank descent or memory invalidates costs.
    - Timeout dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 freezes the degeneration and map class, proves complete
    contact-labelled source lifting and an exact evaluation-fiber-product inverse,
    and derives complete relation, rank, blind-descent, output, time, and memory
    exponents below 0.50.
  falsification_criterion: >-
    Aggregate-only virtual data, a generic false or lost source, tropical/gluing
    or output exponent at least 0.50, or full-cost exponent at least 0.50 closes
    the stated mechanism.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-087/log_component_source_lift.md
    - ideas/artifacts/ECDLP-IDEA-087/log_family.yaml
    - ideas/artifacts/ECDLP-IDEA-087/stable_log_atomizer.sage
    - ideas/artifacts/ECDLP-IDEA-087/verify_log_sources.py
    - ideas/artifacts/ECDLP-IDEA-087/analysis.md
  assigned_to: none
  approved_by: null

