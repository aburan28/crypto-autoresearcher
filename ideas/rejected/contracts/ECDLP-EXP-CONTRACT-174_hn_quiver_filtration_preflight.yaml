    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-174_hn_quiver_filtration_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No source-labelled representations, supplied incidence matrices, or post-hoc refinements.
    - Charge the complete factor-base-to-target path.
  deliverables:
