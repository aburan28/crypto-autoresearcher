experiment:
  id: EXP-ECDLP-IDEA-174-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-174
  lane: representation_changing
  version: 1
  title: Harder-Narasimhan quiver source-filtration theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_quiver_factor_backend_after_independent_review
  objective: >-
    Decide symbolically whether public endpoint equations compile without source
    advice to a framed quiver representation whose unique Harder-Narasimhan factors
    invert biconditionally to exact signed factor-base points below rho and BSGS.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_quiver_compiler: unresolved
    unique_all_strata_filtration: unresolved
    stable_factor_point_biconditional: unresolved
    exact_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-174" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - quivers with planted stable factors and supplied point labels
    - unframed, semistable, and repeated-isomorphism-type representations
    - Hall and module backends operating after source materialization
    - direct source enumeration, Pollard rho, and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - quiver, framing, dimension vector, and stability weight
    - known endpoint versus masked blind target
    - repeated factors, signs, multiplicities, infinity, and unstable strata
  metrics:
    primary:
      - stable-factor point recall, precision, and inverse ambiguity
      - compiler, filtration, and refinement exponents
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - compilation, factor dictionaries, branches, output, rank, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or any Phase 0 theorem is unresolved.
    - Stop if compilation needs a source tuple or factor refinement needs a source dictionary or B^m choices.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied incidence matrix, point-labelled stable factor, or post-hoc stability weight invalidates the arm.
    - A Hall-algebra or module solver applied after sources are materialized is a control.
    - Omitted representation construction, refinement, output, rank, descent, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proofs establish an endpoint-only compiler, the unique all-strata
    filtration, exact stable-factor point inverse, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Source-dependent compilation, one lost or false point, unresolved isomorphism
    collision, B^m refinement, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-174/hn_compiler_theorem.md
    - ideas/artifacts/ECDLP-IDEA-174/quiver_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-174/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-174/cost_analysis.md
  assigned_to: none
  approved_by: null

