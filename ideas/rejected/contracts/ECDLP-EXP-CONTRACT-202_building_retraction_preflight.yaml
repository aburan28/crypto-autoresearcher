experiment:
  id: EXP-ECDLP-IDEA-202-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-202
  lane: high-risk
  version: 1
  title: Bruhat-Tits building scalar-retraction theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_finite_image_fixed_point_or_dlp_oriented_apartment_after_theorem_review
  objective: >-
    Decide symbolically whether a bounded-dimensional public reductive local-field
    lift can evade the finite CAT(0) fixed-point gate and expose nonconstant
    scalar-compatible building digits without hidden DLP orientation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    public_reductive_lift: unresolved
    finite_image_fixed_point_gate: unresolved
    orientation_free_scalar_retraction: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-202" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - infinite split-torus translations with public cocharacters
    - finite cyclic isometric building actions with verified fixed points
    - target-conditioned apartments, scalar-labelled lifts, and full torsion fields
    - Pollard rho, BSGS, known-log endpoints, and fresh masked blind targets
  independent_variables:
    - local field, reductive group, building dimension, and representation degree
    - lift homomorphism, apartment rule, retraction, precision, and digit alphabet
    - known endpoint versus masked blind target
    - fixed points, stabilizers, apartment ambiguity, infinity, and empty fibers
  metrics:
    primary:
      - fixed-point status, stable displacement, and scalar-compatible digit recall
      - setup, extension, building-state, query, output, rank, and ambiguity exponents
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or Phase 0 is unresolved.
    - Stop if the finite image has a fixed point or apartment orientation uses target scalar data.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A nonhomomorphic lift, target-conditioned apartment, scalar-labelled section, or uncharged extension invalidates the arm.
    - A finite toy displacement without asymptotic scalar compatibility is a control.
    - Omitted setup, building state, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a public bounded-dimensional lift with nonzero
    scalar-compatible retraction, exact all-strata inversion, no hidden orientation,
    and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    A global fixed point, zero stable displacement, DLP-equivalent apartment
    choice, one missed or false source, or complete exponent at least 0.50 closes
    this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-202/building_action_fixed_point_theorem.md
    - ideas/artifacts/ECDLP-IDEA-202/apartment_orientation_reduction.md
    - ideas/artifacts/ECDLP-IDEA-202/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-202/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-202
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as scoped no-go evidence; do not dispatch it.
  uncertainty_reduced: Whether a public building retraction can evade finite-image fixed points without encoding the scalar.
  inputs:
    - ideas/rejected/ECDLP-IDEA-202_bruhat_tits_building_retraction_scalar_digits_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-202_building_retraction_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No target-conditioned apartment, full torsion field, scalar label, or uncharged building state.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - finite-action fixed-point theorem or explicit evading lift
    - apartment-orientation reduction or public digit theorem
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
