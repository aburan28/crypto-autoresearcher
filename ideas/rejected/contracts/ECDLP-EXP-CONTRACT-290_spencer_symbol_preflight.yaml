experiment:
  id: EXP-ECDLP-IDEA-290-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-290
  lane: conservative
  version: 1
  title: Spencer-symbol source-split theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: formal_integrability_does_not_create_finite_source_branches
  objective: >-
    Decide theorem-first whether an endpoint-only Spencer-symbol construction can
    return every exact factor branch without materializing the source algebra.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_jet_compiler: unresolved
    all_strata_symbol_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-290" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied involutive toy systems with independently labelled components
    - generic reduced zero-dimensional systems, source-labelled jet tables, dense primary decomposition, rho, and BSGS
  independent_variables:
    - jet and prolongation order, symbol rank, cohomology dimension, source arity, and factor-base beta
    - reduced, repeated, singular, infinity, signed, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - compiler size, prolongation rows, symbol components, cohomology bases, branch ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the source-biconditional theorem is unresolved.
    - Stop if the compiler enumerates sources, generic symbols are trivial, or any source stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled jets, known-log branch advice, or uncharged primary decomposition invalidates the arm.
    - Formal integrability of a supplied system is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only symbol construction, exact
    all-strata factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Trivial symbols, source materialization, one missing stratum, state/output at least
    N^0.50, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-290/spencer_source_split_theorem.md
    - ideas/artifacts/ECDLP-IDEA-290/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-290/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-290/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-290
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether formal-integrability symbols can produce exact source branches without a source algebra.
  inputs:
    - ideas/rejected/ECDLP-IDEA-290_spencer_symbol_formal_integrability_source_splitter_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-290_spencer_symbol_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled jets, known-log selectors, dense decomposition, or uncharged branch tables.
    - Charge compiler, prolongation, cohomology, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - endpoint-only symbol/source biconditional theorem or trivial-symbol/materialization proof
    - exact all-strata source inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
