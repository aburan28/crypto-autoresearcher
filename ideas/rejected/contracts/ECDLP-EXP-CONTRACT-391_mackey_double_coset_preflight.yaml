experiment:
  id: EXP-ECDLP-IDEA-391-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-391
  lane: high_risk
  version: 1
  title: Mackey double-coset source-decomposition preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_endpoint_constructible_nonhomomorphic_correspondence_avoids_source_coset_enumeration_and_stabilizer_label_loss
  objective: >-
    Preserve a theorem-only high-risk audit of whether a nonhomomorphic Mackey
    double-coset correspondence decomposes complete finite-deck occurrence
    sources into subgate target-independent blocks with exact restricted lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_nonhomomorphic_correspondence: unresolved
    subgate_double_coset_and_stabilizer_decomposition: unresolved
    restriction_stable_exact_occurrence_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-391" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_finite_group_subgroups_and_known_double_coset_decomposition
    - positive_Mackey_restriction_induction_formula_and_stabilizer_replay
    - negative_nonhomomorphic_endpoint_correspondence_without_compatible_group_action
    - negative_equal_unlabelled_double_coset_receipt_with_distinct_occurrence_sources
  independent_variables:
    - group_subgroup_and_correspondence_interface
    - double_coset_count_representatives_and_stabilizers
    - block_state_and_occurrence_label_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_a_nonhomomorphic_Mackey_double_coset_decomposition
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_group_operation_coset_representative_stabilizer_and_label_lift_is_fully_charged
      - double_coset_state_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_no_endpoint_constructible_group_action_or_nonhomomorphic_correspondence_exists
    - stop_if_double_coset_or_stabilizer_construction_requires_source_enumeration
    - stop_if_double_coset_state_exceeds_B_to_the_9_over_4
    - stop_if_restriction_replay_or_occurrence_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_stabilizer_occurrence_label_or_complete_chart_stratum_is_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_group_action_is_confused_with_an_endpoint_constructed_correspondence
    - invalidate_if_a_homomorphic_transfer_or_same_field_isogeny_is_reported_as_the_new_operation
    - invalidate_if_relation_validity_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs a compatible nonhomomorphic correspondence
    from endpoints, bounds every double coset and stabilizer below the gates,
    proves restriction-stable exact occurrence lift, and closes the complete
    factor-base-to-target-descent path.
  falsification_criterion: >-
    The preflight is falsified by absent compatible action, source-scale coset or
    stabilizer enumeration, one restriction or label failure, or complete time
    or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-391/double_coset_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-391/scalar_label_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-391/component_source_receipt.json
    - ideas/artifacts/ECDLP-IDEA-391/cost_analysis.md
  assigned_to: none
  approved_by: null

