experiment:
  id: EXP-ECDLP-IDEA-323-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-323
  lane: representation-changing
  version: 1
  title: Cohn-Umans TPP Abel-Jacobi embedding theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: tpp_maps_and_witness_decoder_encode_source_incidence
  objective: >-
    Preserve the representation-changing merge audit: TPP embeds a supplied tensor,
    while the elliptic incidence maps and exact witness decoder are the missing operation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    public_tpp_embedding_constructor: unresolved
    all_strata_identity_coefficient_biconditional: unresolved
    exact_six_source_witness_decoder: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-323" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published supplied TPP matrix-multiplication subsets with externally tagged witnesses
    - random size-matched group subsets, aggregate-only identity coefficients, direct 3+3, rho, and BSGS
  independent_variables:
    - group order, representation degrees, subset sizes, transform cost, witness-tag size, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, group-algebra work, relation rank, factor-log completion, blind descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - embedding construction, group order, representation traffic, coefficient multiplicity, witness tags, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any embedding/biconditional/decoder theorem is unresolved.
    - Stop if construction materializes ternary incidences, ordinary B^2 TPP subsets force dense state |G|>=B^4, group/representation/witness state exceeds B^(9/4), or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled TPP maps, incidence tables, known-log selectors, or uncharged witness tags invalidate the arm.
    - Fast group-algebra multiplication on supplied subsets is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish public source-free TPP maps, exact all-strata identity
    coefficient and witness replay, campaign/state at most B^(9/4), fresh-target work at
    most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Incidence/source materialization, aggregate-only coefficients, one false or missed
    source, state above B^(9/4), or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-323/tpp_incidence_embedding_merge_receipt.md
    - ideas/artifacts/ECDLP-IDEA-323/tpp_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-323/independent_tpp_verifier.py
    - ideas/artifacts/ECDLP-IDEA-323/cost_analysis.md
  assigned_to: none
  approved_by: null

