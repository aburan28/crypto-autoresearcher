experiment:
  id: EXP-ECDLP-IDEA-102-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-102
  lane: high_risk
  version: 1
  title: Finite-field dynamical-R identity and provenance-preserving transfer preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_exact_finite_field_R_identity_for_factor_base_addition_with_source_backsampling
  objective: >-
    Gate all computation on an exact finite-field dynamical Yang-Baxter or
    star-triangle identity for the complete factor-base addition constraint,
    together with a contraction rule and conditioned inverse that retain every
    signed source label below rho and BSGS cost.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    finite_field_local_state_space: unresolved
    dynamical_R_or_star_triangle_identity: unresolved
    factor_base_indicator_compatibility: unresolved
    provenance_preserving_contraction: unresolved
    conditioned_source_backsample: unresolved
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: sha256("ECDLP-IDEA-102" || field_bits || curve_index || "20260717")
    future_prng: ChaCha20-IETF
    future_prng_key: full_32_byte_seed_digest
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published dynamical-R and star-triangle identities on their native state spaces
    - planted integrable networks with exact conditioned source marginals
    - random local tensors matched for domain, rank, sparsity, and bond dimension
    - spinor-matchgate, full-rank character, and explicit serial-S3 controls
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance, field size, and decomposition arity
    - factor-base exponent beta and indicator family
    - frozen spectral and dynamical parameters
    - contraction order, bond dimension, and backsampling budget
    - known relation target versus masked blind target
  metrics:
    primary:
      - exact finite-field identity and factor-base-indicator agreement
      - contraction-to-source biconditional and conditioned backsample agreement
      - B=N^beta, spin/dynamical-state exponent v, and setup time and memory exponents a and am
      - transfer/spectral state exponent s and per-network contraction, spectral solve, and conditioning exponent k
      - reciprocal relation and target success exponents delta and delta_t
      - emitted source/path and target ambiguity exponents o and u
      - extension-degree/coefficient exponent h and factor-log linear-algebra exponents ell and ell_m
      - lambda=max(a,v,s,h,beta+delta+k+o,ell,delta_t+k+o+u,beta)
      - mu=max(am,v,s,h,beta+o,ell_m,u)
    secondary:
      - lost, false, ambiguous, repeated, and exceptional source counts
      - rank, blind recovery, exact operations, precision, and serialized bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or any finite-field identity/source theorem is unresolved.
    - Stop after an exact identity failure, provenance collision, or proof that arbitrary factor-base indicators destroy integrability.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after an independent symbolic verifier passes the complete identity and source inverse.
  invalidation_rules:
    - A complex-analytic partition-function identity without exact finite-field specialization is a control.
    - Aggregate contraction without conditioned exact source recovery is relation-only evidence.
    - Target-selected parameters, hidden scalar phases, or post-hoc state deletion invalidate the arm.
    - Every relation attempt, miss, duplicate, and rejected row counts against the frozen attempt ceiling and charged cost.
    - Omitting setup, bond state, precision, output, rank, descent, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 proves an exact finite-field dynamical-R identity compatible
    with arbitrary frozen factor-base indicators, a complete provenance-preserving
    contraction and conditioned source inverse, and full relation, rank, blind-
    descent, output, time, and memory exponents at most 0.45.
  falsification_criterion: >-
    No exact finite-field identity, one generic wrong or lost source, bond or
    conditioned-output exponent at least 0.50, or proof that source recovery
    restores the dense transition state closes the mechanism.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-102/finite_field_identity_gate.md
    - ideas/artifacts/ECDLP-IDEA-102/dynamical_r_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-102/dynamical_r_transfer.sage
    - ideas/artifacts/ECDLP-IDEA-102/verify_transfer_sources.py
    - ideas/artifacts/ECDLP-IDEA-102/analysis.md
  assigned_to: none
  approved_by: null

