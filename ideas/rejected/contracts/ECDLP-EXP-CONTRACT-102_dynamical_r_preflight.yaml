  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate; do not dispatch without an exact finite-field identity and source backsample.
  uncertainty_reduced: Whether dynamical-R rewrites change the source-complete elliptic relation contraction rather than only its aggregate partition function.
  inputs:
    - ideas/deferred/ECDLP-IDEA-102_elliptic_dynamical_r_transfer_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-102_dynamical_r_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch and any successor requires coordinator approval.
    - Preserve every finite-field identity failure, provenance collision, and bond-dimension lower bound.
    - Do not interpret a valid partition identity, relation, or toy scalar as promotion.
  deliverables:
    - exact finite-field dynamical-R or star-triangle identity or no-go proof
    - provenance-preserving contraction and conditioned source inverse or counterexample
    - complete relation, rank, descent, time, and memory model
    - independent verification report
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: theorem_review
