experiment:
  id: EXP-ECDLP-IDEA-045-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-045
  lane: conservative
  version: 1
  title: Algebraic hard-bit affine-shift decoder preflight
  status: review_required
  objective: >-
    Determine whether a predicate fixed from public curve data has a reproducible
    scalar-hard-bit correlation and supports complete affine hidden-number recovery at
    full construction, query, erasure, decoding, output, verification, and bit-memory
    exponents below 1/2, rather than benefiting from scalar-labeled predicate selection.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [8, 9, 10, 11, 12, 13, 14, 16]
    independent_curves_per_size: 24
    curve_rule: lexicographically first 24 supported ordinary prime-order curves per size, or every supported curve if fewer exist
    exhaustive_scalar_truth_max_bits: 12
    scalar_bit: balanced_msb_sign_on_Z_mod_N
    primary_predicate:
      id: quadratic_character_x_minus_xP
      formula: chi(x(R)-x(P))
      zero_rule: emit erasure
      pole_rule: emit erasure
    frozen_secondary_controls:
      - quadratic_character_y_minus_yP
      - quadratic_character_x_plus_curve_a
      - quadratic_character_product_x_minus_xP_y_plus_yP
    affine_mask_rule: counter-mode SHA-256 expansion of the declared seed into nonzero t and arbitrary a modulo N
    sample_counts: [32, 64, 128, 256, 512, 1024]
    planted_biases: [0.25, 0.125, 0.0625]
    seeds: [20260717451, 20260717452, 20260717453]
    finite_size_fit: preregistered log-log bias and complete-cost slopes with inverse-log correction, leave-largest-size-out, and leave-curve-family-out sensitivity
  controls:
    - planted noisy balanced-MSB oracle at every declared bias
    - exhaustive predicate and affine-equation truth through 12 bits
    - independent random bits with the same erasure rate
    - scalar-label permutation preserving predicate marginals
    - ordinary low-degree coordinate character with its complete character-sum control
    - both global correlation signs passed through the same decoder
    - invalid scalar-indexed truth table measured only as an oracle lower bound
    - invalid best-after-label predicate selection measured but barred from inference
  independent_variables:
    - field bit size
    - curve instance
    - primary versus control predicate
    - sample count
    - planted bias
    - global correlation sign
    - affine-mask seed
  metrics:
    primary:
      - exact per-curve correlation epsilon and exponent delta
      - target-independent predicate construction exponent c
      - complete per-query exponent e including scalar multiplication
      - sample exponent 2*delta including erasures
      - total robust-decoder exponent z
      - candidate-list exponent zeta
      - full time exponent lambda=max(c,e+2*delta,z,zeta)
      - full bit-memory exponent mu including predicate state, masks, decoder, and output
      - verified blinded scalar-recovery rate
    secondary:
      - zero and pole rates
      - predicate evaluation mismatches
      - affine-equation mismatches
      - decoder false-positive and false-negative counts
      - both-sign candidate overlap
      - predicate degree and straight-line-program size
      - group and field operation counts
      - peak resident memory
  replication:
    planned_curve_instances: 192
    target_scalars_per_curve: 64
    rerun_same_seed: true
    independent_decoder_implementation: required_for_exhaustive_cells
  budget:
    wall_clock_seconds_per_run: 1800
    total_cpu_hours: 240
    maximum_memory_gb: 24
    maximum_runs: 6000
    maximum_output_gb: 40
  stopping_rules:
    - Stop exhaustive scalar enumeration above 12 bits; retain the frozen sampled target schedule.
    - Stop a predicate arm after two consecutive sizes exceed 22 GB median peak memory; retain remaining cells as censored_by_budget.
    - Halt after any predicate, affine-equation, or accepted-scalar mismatch and audit implementation validity before inference.
    - Do not add predicates, change zero rules, or resample masks after observing scalar labels.
  invalidation_rules:
    - Any exhaustive predicate, affine-equation, or planted-oracle decoder mismatch invalidates that implementation and cell.
    - Any target-dependent predicate choice, scalar-labeled training, scalar-indexed table, or post-hoc arm selection invalidates the mechanism arm.
    - Omitted erasures, failed masks, output candidates, scalar multiplications, construction work, or memory invalidate the cost measurement.
    - A timeout, dependency failure, unsupported curve, or crash is infrastructure or coverage evidence only.
    - A nonzero correlation or correct toy scalar without full-cost accounting cannot satisfy success.
  success_criterion: >-
    Zero exhaustive mismatches; at least 99 percent planted-oracle recovery at every
    declared bias after the required sample threshold; a multiplicity-corrected lower
    95 percent correlation bound for the fixed primary predicate corresponding to
    delta<=0.20 on both largest completed sizes; at least 95 percent independently
    verified blinded scalar recovery on held-out curves; upper 95 percent bounds
    lambda<=0.45 and mu<=0.45 with all construction, affine queries, erasures, decoding,
    candidate output, and verification charged; and stable conclusions under both
    preregistered finite-size sensitivities.
  falsification_criterion: >-
    After implementation validation, every fixed non-oracle predicate has a lower
    95 percent fitted delta>=0.25; any complete-cost lower 95 percent bound reaches
    lambda>=0.50 or mu>=0.50; the decoder requires an N^(1/2) candidate list; held-out
    recovery is below 50 percent; or the only useful predicate depends on scalar labels,
    target data, a truth table, or post-hoc selection.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-045/predicates.yaml
    - ideas/artifacts/ECDLP-IDEA-045/implementation.md
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/queries.jsonl
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/candidates.jsonl
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/resources.json
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-045/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-045/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-045
  from: coordinator
  to: executor
  objective: Implement and run the frozen algebraic hard-bit affine-shift preflight exactly after approval.
  uncertainty_reduced: Whether a public algebraic predicate supplies enough uniform scalar-bit bias for complete sub-rho affine hidden-number decoding.
  inputs:
    - ideas/ECDLP-IDEA-045_algebraic_hard_bit_shift_decoder_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-045_hard_bit_shift_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not add or choose predicates after scalar labels are visible.
    - Preserve every affine mask, erasure, failed decode, candidate, timing, and memory measurement.
    - Do not interpret predicate correctness, nonzero toy bias, or toy scalar recovery as a breakthrough.
  deliverables:
    - immutable predicate and affine-query records
    - exhaustive truth and planted-oracle validation
    - per-curve correlation and held-out recovery report
    - full rho and BSGS time/bit-memory comparison with sensitivity analyses
  budget:
    wall_clock_seconds: 864000
    memory_gb: 24
    maximum_runs: 6000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted scalar independently verifies on the original curve.
    - Raw queries, decoder outputs, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
