experiment:
  id: EXP-ECDLP-IDEA-304-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-304
  lane: representation-changing
  version: 1
  title: Jeffrey-Kirwan chamber-residue source-extraction preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: chamber_data_and_fixed_cones_encode_source_incidences
  objective: >-
    Decide theorem-first whether an endpoint-only compact arrangement and public
    Jeffrey-Kirwan chamber can return every exact factor source without enumerating cones.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_arrangement_compiler: unresolved
    all_strata_residue_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-304" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied toric toy arrangements with independently enumerated fixed cones
    - permuted source labels, dense resultants, ordinary residues, post-hoc chambers, rho, and BSGS
  independent_variables:
    - arrangement rank, cone count, chamber count, source arity, and factor-base beta
    - reduced, repeated, singular, infinity, signed, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - compiler size, weights, cones, chambers, residue terms, branch ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the endpoint-only source-return theorem is unresolved.
    - Stop if arrangement weights enumerate sources, chamber choice is post-hoc, or one source stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled cones, known-log chamber advice, or uncharged cone enumeration invalidates the arm.
    - Correct localization on a supplied arrangement is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only arrangement construction, a
    public target-uniform chamber, exact all-strata factor return, blind descent, and
    complete exponents at most 0.45.
  falsification_criterion: >-
    Source-labelled weights, post-hoc chamber choice, one missing stratum, state/output
    at least N^0.50, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-304/chamber_residue_identity.md
    - ideas/artifacts/ECDLP-IDEA-304/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-304/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-304/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-304
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether chamber-residue localization can create exact source labels without a source arrangement.
  inputs:
    - ideas/rejected/ECDLP-IDEA-304_jeffrey_kirwan_chamber_residue_source_extractor_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-304_jeffrey_kirwan_chamber_residue_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled weights, cone tables, known-log selectors, or post-hoc chambers.
    - Charge arrangement construction, cones, residues, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - endpoint-only arrangement/chamber/source biconditional theorem or materialization proof
    - exact all-strata source inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
