experiment:
  id: EXP-ECDLP-IDEA-194-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-194
  lane: conservative
  version: 1
  title: Implicit fiber log-derivative reverse-source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_implicit_eliminant_restores_dense_provenance_after_semantic_and_literature_review
  objective: >-
    Decide symbolically whether a sub-B^2.25 endpoint fiber circuit can expose
    logarithmic/Hasse derivative data with exact labelled leaf ancestry, or whether
    reverse source recovery necessarily restores Omega(B^3) represented state.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    compact_endpoint_fiber_circuit: unresolved
    reverse_hasse_source_biconditional: unresolved
    dense_provenance_lower_bound: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-194" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied source-labelled product circuit with reverse automatic differentiation
    - aggregate union-root gcd and logarithmic derivative without source labels
    - explicit transition tables, dense resultants, Pollard rho, and BSGS
    - known-log endpoints and fresh masked blind targets
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - circuit grammar, derivative order, multiplicity, and endpoint batch size
    - known endpoint versus masked blind target
    - signs, repeats, vertical pairs, infinity, nonreduced fibers, and empty fibers
  metrics:
    primary:
      - compact-circuit status and exact labelled-source recall
      - setup, query, represented-state, output, rank, and ambiguity exponents
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or Phase 0 is unresolved.
    - Stop if the circuit materializes source-labelled transition state or a dense eliminant.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A post-hoc root join, explicit source table, dense resultant, or supplied fiber invalidates the arm.
    - A solver substitution, derivative-only speedup, or parameter-only improvement is a control.
    - Omitted setup, failed batches, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a sub-B^2.25 target-uniform fiber circuit,
    exact all-strata reverse-Hasse source replay, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Omega(B^3) represented state, aggregate-only jets, one missed or false source,
    hidden source advice, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-194/implicit_fiber_circuit_theorem.md
    - ideas/artifacts/ECDLP-IDEA-194/reverse_hasse_source_spec.md
    - ideas/artifacts/ECDLP-IDEA-194/jet_collision_family.md
    - ideas/artifacts/ECDLP-IDEA-194/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-194/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-194
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether reverse circuit derivatives can recover exact factor-base leaves without dense provenance.
  inputs:
    - ideas/rejected/ECDLP-IDEA-194_implicit_fiber_log_derivative_source_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-194_fiberjet_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied fiber, explicit source deck, dense eliminant, or post-hoc source selector.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - compact-circuit theorem or represented-state lower bound
    - exact reverse-Hasse source theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
