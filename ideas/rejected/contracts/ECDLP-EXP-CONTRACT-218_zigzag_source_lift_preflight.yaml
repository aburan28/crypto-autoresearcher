experiment:
  id: EXP-ECDLP-IDEA-218-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-218
  lane: representation-changing
  version: 1
  title: Zigzag-persistence exact-source lift theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_barcode_forgets_generators_and_exact_source_correspondence
  objective: >-
    Decide theorem-first whether an endpoint-only zigzag module admits a
    functorial interval-generator lift to every exact signed factor-base source
    without retaining the source-labelled complex or its reduction matrices.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_sparse_complex: unresolved
    functorial_exact_source_lift: unresolved
    equal_barcode_collision_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-218" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - planted point-labelled zigzags and basis-scrambled isomorphic zigzags
    - IDEA-073 discrete Morse, IDEA-174 HN filtration, and explicit source complexes
    - dense source tables, Semaev fibers, rho, and BSGS
  independent_variables:
    - complex grammar, zigzag order, basis, interval representative, and mask
    - known endpoint versus fresh masked blind target
    - signs, repeats, infinity strata, ambiguity, and retained basis state
  metrics:
    primary:
      - exact-source recall, false sources, basis-state size, rank, output, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, barcode reduction, point lifts, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the source-lift theorem is unresolved.
    - Stop if exact lifting requires point-labelled cells, source edges, or retained reduction matrices.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source complex, planted basis, or uncharged lift/output invalidates the arm.
    - Toy barcode correctness is a control and cannot establish asymptotic performance.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an endpoint-only complex and functorial exact
    interval-to-point lift on every stratum, with complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    One equal-barcode/different-source collision, retained source deck, missed or
    false source, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-218/zigzag_source_lift_theorem.md
    - ideas/artifacts/ECDLP-IDEA-218/barcode_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-218/independent_barcode_verifier.py
    - ideas/artifacts/ECDLP-IDEA-218/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-218
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether a barcode admits an endpoint-only, basis-independent lift to exact signed source points.
  inputs:
    - ideas/rejected/ECDLP-IDEA-218_zigzag_persistence_source_barcode_lift_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-218_zigzag_source_lift_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply point-labelled cells or treat barcode correctness as source recovery.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - functorial exact-source lift theorem or equal-barcode collision proof
    - all-strata source biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
