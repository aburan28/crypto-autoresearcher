experiment:
  id: EXP-ECDLP-IDEA-195-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-195
  lane: representation-changing
  version: 1
  title: Non-Cartesian complete-branch intertwiner theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: deferred_pending_explicit_noncanonical_map_support_and_exact_inverse_theorem
  objective: >-
    Decide symbolically whether one noncanonical rational map and non-Cartesian
    recursive support has a positive-dimensional nonfixed simultaneous Kummer
    trace/norm component with an exact all-strata source inverse.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    explicit_noncanonical_map_target_family: unresolved
    simultaneous_trace_norm_component: unresolved
    exact_branch_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-195" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied two-valued Kummer maps with exact branch inverses
    - P1526 auxiliary and target-isogeny gates
    - P1527 canonical-map branch-locus gate and P1528 rational-kernel cofactor gate
    - trace-only filters, explicit pair tables, dense resultants, Pollard rho, and BSGS
  independent_variables:
    - curve and map family, field size, and factor-base exponent beta
    - support equations, recursion depth, branch charts, and inverse-list bound
    - known endpoint versus masked blind target
    - deck-fixed points, poles, signs, repeats, infinity, nonreduced fibers, and empty fibers
  metrics:
    primary:
      - simultaneous trace/norm component dimension and exact labelled-source recall
      - setup, support-query, inverse-output, row-rank, and ambiguity exponents
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or Phase 0 is unresolved.
    - Stop if the component is deck-fixed, bounded, trace-only, or requires an explicit pair table.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A same-field target isogeny, canonical psi_c control, dense resultant, or post-hoc selector invalidates the arm.
    - Uncharged extension-field descent, geometric preimages, or duplicate factor-log columns invalidate the model.
    - Omitted setup, support construction, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a positive-dimensional nonfixed simultaneous
    trace/norm component, exact all-strata source inversion, P1515 setup/query
    bounds, and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Deck-fixed or bounded support, explicit B^2 correction data, one missed or
    false source, hidden descent cost, or a complete exponent at least 0.50
    closes the frozen family.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-195/noncartesian_intertwiner_theorem.md
    - ideas/artifacts/ECDLP-IDEA-195/branch_source_inverse_spec.md
    - ideas/artifacts/ECDLP-IDEA-195/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-195/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-195/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-195
  from: coordinator
  to: executor
  objective: Preserve the retired representation theorem preflight; do not dispatch it before Phase 0 succeeds.
  uncertainty_reduced: Whether a noncanonical non-Cartesian complete-branch intertwiner survives P1526-P1528.
  inputs:
    - ideas/deferred/ECDLP-IDEA-195_noncartesian_s3_intertwiner_source_router_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-195_noncartesian_intertwiner_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No canonical-map control, same-field kernel multiplicity, explicit pair table, or trace-only component.
    - Charge exact all-strata inversion and the complete factor-base-to-target path.
  deliverables:
    - simultaneous trace/norm component theorem or elimination no-go
    - exact branch-source inverse theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
