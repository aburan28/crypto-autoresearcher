experiment:
  id: EXP-ECDLP-IDEA-270-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-270
  lane: high_risk
  version: 1
  title: Prismatic Nygaard scalar-digit theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: p_primary_prismatic_invariants_do_not_orient_prime_to_p_scalar
  objective: >-
    Decide theorem-first whether canonical prismatic Frobenius and Nygaard data can
    retain and invert the prime-to-p subgroup scalar without a source-labelled basis.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    canonical_target_uniform_prism: unresolved
    prime_to_p_scalar_sensitive_observable: unresolved
    exact_digit_or_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-270" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied p-power torsion with known Dieudonne coordinates and scalar digits
    - prime-to-p subgroup relabeling, unmarked isomorphic curves, arbitrary lifts, formal-group digits, same-field isogenies, rho, and BSGS
  independent_variables:
    - ordinary versus supersingular curve family, prism, Frobenius lift, Nygaard grade, and precision
    - p-primary versus prime-to-p torsion and changed subgroup generators
    - signed, repeated, infinity, ramified, filtered, and ambiguous strata
  metrics:
    primary:
      - scalar sensitivity, generator invariance, exact source recall, false outputs, precision, relation rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - prism traffic, filtration ambiguity, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the prime-to-p sensitivity theorem is unresolved.
    - Stop if the observable factors through p-primary data or the comparison basis contains scalar orientation.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A scalar-labelled comparison basis, known-log lift, or uncharged precision invalidates the arm.
    - Nonzero behavior on supplied p-primary torsion is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a canonical prime-to-p scalar-sensitive observable,
    exact digit/source return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    P-primary factorization, generator invariance, source-labelled comparison data,
    unresolved return, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-270/prismatic_nygaard_scalar_theorem.md
    - ideas/artifacts/ECDLP-IDEA-270/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-270/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-270/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-270
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether prismatic Nygaard data can orient and invert a prime-to-p subgroup scalar.
  inputs:
    - ideas/rejected/ECDLP-IDEA-270_prismatic_nygaard_scalar_digits_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-270_prismatic_nygaard_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use scalar-labelled comparison bases, known-log lifts, pointwise source advice, or uncharged p-adic precision.
    - Charge prism construction, filtration, precision, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - prime-to-p scalar-sensitive observable or p-primary/generator-invariance theorem
    - exact digit/source and all-strata return audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
