experiment:
  id: EXP-ECDLP-IDEA-230-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-230
  lane: conservative
  version: 1
  title: Break-divisor burning exact-source section theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_graph_jacobian_requires_source_incidence_deck
  objective: >-
    Decide theorem-first whether a public endpoint admits a sub-rho graph
    Jacobian encoding whose canonical break or reduced divisor returns every
    exact signed elliptic source without a source-labelled incidence graph.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_graph_compiler: unresolved
    break_divisor_to_point_bijection: unresolved
    source_incidence_factorization_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-230" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied graph Jacobians with independently enumerated break divisors and spanning trees
    - source-label permutations, unlabeled quotient graphs, IDEA-144, and IDEA-203
    - explicit source-incidence decks, Semaev fibers, rho, and BSGS
  independent_variables:
    - graph compiler, sink, reduction order, tie rule, source inverse, and mask
    - known-log endpoint versus fresh masked blind target
    - signs, repeats, infinity strata, ambiguity, and retained graph state
  metrics:
    primary:
      - exact-source recall, false sources, graph size, output, full rank, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, burning moves, spanning-tree traffic, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the endpoint graph/source theorem is unresolved.
    - Stop if graph construction requires point-labelled incidence edges or one state per source tuple.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source graph, post-hoc point labels, or uncharged tree/output traffic invalidates the arm.
    - Toy burning correctness is a control and cannot establish asymptotic performance.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an endpoint-only sub-rho graph, canonical
    break-divisor-to-point-source bijection on every stratum, and complete time
    and memory exponents at most 0.45.
  falsification_criterion: >-
    One equal-class/different-source collision, retained source deck, missed or
    false source, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-230/endpoint_graph_section_theorem.md
    - ideas/artifacts/ECDLP-IDEA-230/burning_source_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-230/independent_break_divisor_verifier.py
    - ideas/artifacts/ECDLP-IDEA-230/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-230
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether canonical graph-divisor reduction can create exact elliptic sources without a source-incidence deck.
  inputs:
    - ideas/rejected/ECDLP-IDEA-230_break_divisor_burning_source_section_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-230_break_divisor_source_section_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply a source graph or treat a canonical graph divisor as point-source recovery.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - endpoint graph/source bijection theorem or source-incidence factorization proof
    - all-strata source biconditional and independent review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
