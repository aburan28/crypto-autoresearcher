experiment:
  id: EXP-ECDLP-IDEA-134-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-134
  lane: conservative
  version: 1
  title: Group-native preprocessed three-sum theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: strict_sub_three_halves_source_reporting_theorem_missing
  objective: >-
    Gate all computation on a source-complete group-native batch theorem with
    strict exponent below three halves and full relation-to-blind-descent costs.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    group_native_equality: unresolved
    exact_source_reporting: unresolved
    strict_alpha_bound: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-134" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - integer and scalar-indexed cyclic preprocessed-universe 3SUM positive controls
    - exhaustive tiny elliptic five-source fibers with all source labels
    - independent ordinary queries, explicit A3, P1477 states, and P1478 resultants
    - random prime-order groups, Pollard rho, and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - setup and batch exponents s, s_m, alpha, and m_q
    - relation and target densities, source output, and ambiguity
    - known-log relation target versus fresh masked blind target
  metrics:
    primary:
      - exact source recall and false-source count
      - setup, batch, output, rank, blind-descent, and peak-memory operations
      - lambda=max(s*beta,(1+alpha+delta+o)*beta,ell*beta,(alpha+delta_t+o+u)*beta,beta)
      - mu=max(s_m*beta,m_q*beta,(1+o)*beta,ell_m*beta,u*beta)
    secondary:
      - exceptional strata, multiplicities, failed batches, rank, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or the Phase 0 theorem is unresolved.
    - Stop on a hidden scalar index, explicit A3, B-cubed stage, or incomplete sources.
    - Bounds strictly above 0.45 and below 0.50 are inconclusive and cannot promote.
  invalidation_rules:
    - Scalar-indexed integer 3SUM is only a positive control.
    - Membership or participation without complete source tuples is insufficient.
    - Omitting setup, output, failed batches, rank, descent, or memory invalidates costs.
    - Timeout or infrastructure failure is not mathematical falsification.
  success_criterion: >-
    An independently checked theorem constructs the group-native source reporter,
    proves alpha at most 1.25, and gives complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    One missed or false source, a hidden scalar index, an explicit B-cubed object,
    or complete time or peak-memory exponent at least 0.50 closes the mechanism.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-134/group_native_three_sum_theorem.md
    - ideas/artifacts/ECDLP-IDEA-134/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-134/batched_three_sum_oracle.py
    - ideas/artifacts/ECDLP-IDEA-134/verify_sources.py
    - ideas/artifacts/ECDLP-IDEA-134/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260717-134
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate; do not dispatch before the group-native source-reporting theorem exists.
  uncertainty_reduced: Whether a shared elliptic three-sum batch can beat the strict three-halves gate without scalar indexing or source loss.
  inputs:
    - ideas/rejected/ECDLP-IDEA-134_preprocessed_three_sum_source_oracle_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-134_preprocessed_three_sum_source_oracle_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired and any successor requires coordinator approval.
    - Do not materialize A3, scalar-indexed ambient arrays, dense resultants, or source tables.
  deliverables:
    - group-native batch theorem or explicit reduction obstruction
    - exact source completeness and exceptional-strata proof
    - full setup, relation, rank, factor-log, blind-descent, output, time, and memory model
    - independent theorem review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
