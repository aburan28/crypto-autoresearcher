experiment:
  id: EXP-ECDLP-IDEA-128-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-128
  lane: high_risk
  version: 1
  title: Filtered mirror-triangle non-merge and source-inverse theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: mirror_triangle_operation_merges_with_existing_theta_and_scattering_lanes
  objective: >-
    Gate all computation on a theorem that separates the proposed finite-field
    filtered-triangle operation from IDEA-076 and aggregate categorical reporters,
    and that gives an exact public triangle-to-source inverse below rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    finite_field_mirror_specialization: unresolved
    non_merge_theorem_against_idea_076: unresolved
    action_separated_triangle_biconditional: unresolved
    exact_triangle_to_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-128" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published elliptic mirror triple products with exact coefficient checks
    - planted action-separated labelled triangles with blinded source inversion
    - equal-action polygons, wall crossing, and noncanonical lift choices
    - IDEA-076 scattering coordinates and theta or categorical aggregate reporters
    - dense polygon enumeration, post-hoc selection, same-field isogenies, rho, and BSGS
  independent_variables:
    - curve instance and field size
    - factor-base exponent beta
    - coefficient specialization, filtration, precision, and lift convention
    - known relation target versus fresh masked blind target
    - polygon ambiguity, source output, verification, and memory budgets
  metrics:
    primary:
      - finite-field mirror and point-atom round-trip biconditional
      - non-merge theorem against IDEA-076 and aggregate reporter lanes
      - setup exponents s and s_m including advice and precision
      - complete query and source-output exponents alpha and m_q
      - lambda=max(s*ell,1+(alpha-4)*ell,2*ell,1+(alpha-5)*ell)
      - mu=max(s_m*ell,m_q*ell,ell)
    secondary:
      - action ties, wall crossings, lift branches, misses, and duplicate polygons
      - relation rank, verified factor logs, blind recovery, operations, and bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or any Phase 0 theorem input is unresolved.
    - Stop if the construction is only IDEA-076, a theta sum, or a polygon reporter under new notation.
    - Any complete exponent strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after independent review of the non-merge and source-inverse theorems.
  invalidation_rules:
    - A mirror equivalence, product identity, or coefficient equality without exact point sources is a control.
    - Target-dependent lift choices or source-selected triangles invalidate the arm.
    - Omitting advice, precision, polygons, output, rank, blind descent, verification, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 proves a concrete finite-field operation distinct from
    IDEA-076 and aggregate categorical reporters, proves its exact triangle/source
    biconditional, and derives complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    Semantic reduction to an occupied lane, one unresolved action/source collision,
    target-dependent lift advice, or a complete time or peak-memory exponent at least
    0.50 keeps this record rejected.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-128/mirror_triangle_gate.md
    - ideas/artifacts/ECDLP-IDEA-128/mirror_model.yaml
    - ideas/artifacts/ECDLP-IDEA-128/isolate_triangles.sage
    - ideas/artifacts/ECDLP-IDEA-128/verify_triangle_sources.py
    - ideas/artifacts/ECDLP-IDEA-128/analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260717-128
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate; do not dispatch without a non-merge theorem and exact finite-field triangle/source inverse.
  uncertainty_reduced: Whether filtered mirror triangles provide a new source-generating operation rather than an occupied aggregate theta or scattering coordinate.
  inputs:
    - ideas/rejected/ECDLP-IDEA-128_filtered_mirror_triangle_source_descent_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-128_filtered_mirror_triangle_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch and any successor requires coordinator approval.
    - Do not use source-selected triangles, target-specific lift advice, dense polygon tables, or post-hoc labels.
    - Preserve every action tie, wall crossing, failed lift, ambiguity, and emitted source.
  deliverables:
    - explicit non-merge theorem or semantic reduction certificate
    - finite-field mirror and triangle/source biconditional theorem or counterexample
    - complete rank, factor-log, blind-descent, output, precision, time, and memory model
    - independent theorem review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
