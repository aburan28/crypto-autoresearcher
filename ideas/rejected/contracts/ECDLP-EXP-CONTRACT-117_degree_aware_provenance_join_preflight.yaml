experiment:
  id: EXP-ECDLP-IDEA-117-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-117
  lane: conservative
  version: 1
  title: Factorized source-marked semijoin theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: scoped_p1510_product_circuit_cubic_input_floor
  objective: >-
    Preserve the scoped negative for the declared source-marked P1510
    product-circuit semijoin: its Theta(L^3) input floor exceeds rho before
    gcd, rank, or descent, so no computation may be dispatched.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    exact_relational_schema: resolved_by_fd_width_receipt
    explicit_join_and_dense_p1510_routes: scoped_negative
    p1510_product_circuit_leaf_floor: resolved_theta_L3_scoped_negative
    independent_F65537_synthetic_replay: passed
    factor_base_ell_targets: [0.18, 0.20, 0.22]
    relation_arity: 5
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-117" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - Loomis-Whitney and bounded-degree joins with planted endpoint provenance
    - exhaustive tiny elliptic five-source truth including exceptional branches
    - matched random incidence relations without the claimed functional dependencies
    - explicit A_2 and A_3 tables, dense resultants, Z3, and Groebner solvers
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance and field size
    - factor-base exponent ell
    - product-circuit representation, common-factor strategy, and source-jet encoding
    - known relation query versus masked blind target query
    - circuit construction, semijoin, source-output, and memory budgets
  metrics:
    primary:
      - exact common-factor and source-jet biconditional on complete fibers
      - target-independent join setup time and memory exponents s and s_m
      - complete source-query time and memory exponents alpha and m_q
      - emitted source-tuple exponent z with alpha at least z
      - relation success probability pi=min(1,L^5/N)
      - lambda=max(s*ell,1+(alpha-4)*ell,2*ell,1+(alpha-5)*ell)
      - mu=max(s_m*ell,m_q*ell,ell)
    secondary:
      - circuit branches, misses, duplicates, ambiguities, and exceptional sources
      - relation rank, verified factor logs, blind recovery, operations, and bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run; the declared mechanism is closed by theorem and this draft is retired.
    - Preserve the Theta(L^3) source-labelled input floor and the exact scope exclusion for arbitrary pre-leaf representations.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - Any pre-leaf or target-uniform representation change requires a new idea ID and contract.
  invalidation_rules:
    - Materialized quadratic pair state, a join-order-only change, or a solver substitution is a control.
    - Membership or counts without exact indices, signs, and multiplicities invalidate the arm.
    - Omitting circuit construction, semijoin work, misses, output, rank, blind descent, verification, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    Historic promotion would have required the common-factor/source-jet
    biconditional, setup below L^2.5, source-query exponent below L^1.5, and
    complete relation, rank, blind-descent, output, time, and memory exponents
    at most 0.45; the current grammar cannot satisfy this criterion.
  falsification_criterion: >-
    One false source, unavoidable dense expansion or all-pair surface queries,
    or a complete time or peak-memory exponent at least 0.50 closes the mechanism.
  current_theorem_receipts:
    - ideas/artifacts/ECDLP-IDEA-117/fd_width_gate.md
    - ideas/artifacts/ECDLP-IDEA-117/p1511_factorized_semijoin_derivation.md
    - ideas/artifacts/ECDLP-IDEA-117/p1511_scoped_negative_audit.md
  future_successor_boundary_artifacts:
    - ideas/artifacts/ECDLP-IDEA-117/preleaf_successor_requirements.md
  assigned_to: none
  approved_by: null

