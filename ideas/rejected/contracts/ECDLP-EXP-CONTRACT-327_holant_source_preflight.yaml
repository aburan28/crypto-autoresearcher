experiment:
  id: EXP-ECDLP-IDEA-327-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-327
  lane: representation_changing
  version: 1
  title: Holant exact-source provenance theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: direct_duplicate_of_idea_050_supplied_signature_matchgate_transform
  objective: >-
    Preserve the representation-changing merge audit and locate the first supplied
    signature tensor or source-sized noncancellation tag.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_free_signature_compiler: unresolved
    tractable_finite_field_Holant_basis: unresolved
    exact_noncancelling_provenance_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-327" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied planar matchgate networks with independently labelled noncancelling witnesses
    - equal-Holant-value networks with permuted support, IDEA-050, dense tensor contraction, rho, and BSGS
  independent_variables:
    - signature arity, basis, network topology, contraction width, provenance-tag size, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, signature state, cancellation collisions, relation rank, factor-log completion, blind descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - signature construction, transforms, intermediates, tags, output, ambiguity, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any signature/provenance theorem is unresolved.
    - Stop if a signature, iterator, or provenance tag materializes source state or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Supplied source signatures, dense transitions, planted noncancelling tags, or post-hoc basis selection invalidate the arm.
    - Correct contraction or counting of a supplied network is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish source-free tractable signatures, a compact exact
    provenance inverse, campaign/state at most B^(9/4), query at most B^(5/4), blind
    descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Source-sized signatures or tags, one aggregate-equal support collision, one missed
    source stratum, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-327/idea050_holant_merge_receipt.md
    - ideas/artifacts/ECDLP-IDEA-327/signature_realizability_obligations.md
    - ideas/artifacts/ECDLP-IDEA-327/provenance_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-327/cost_analysis.md
  assigned_to: none
  approved_by: null

