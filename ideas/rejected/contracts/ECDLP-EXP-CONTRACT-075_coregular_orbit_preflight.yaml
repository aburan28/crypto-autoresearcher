experiment:
  id: EXP-ECDLP-IDEA-075-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-075
  lane: representation_changing
  version: 1
  title: Coregular orbit composition and exact source-inverse preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_exact_point_marked_representation_composition_factorization_or_source_inverse_is_frozen
  objective: >-
    Test whether one frozen coregular genus-one representation admits public
    point-to-orbit encoding, addition-compatible orbit composition, a useful
    target-independent atom factorization, and a stabilizer-complete inverse to
    exact factor-base point sources without moving the ECDLP into orbit labels.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [7, 8, 9, 10, 11, 12, 13, 14, 16, 18]
    independent_curves_per_size: 24
    representation_family: unresolved_no_dispatch_until_one_exact_point_marked_model_is_frozen
    decomposition_arities: [2, 3, 4]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    exhaustive_truth_max_bits: 13
    seeds: [20260717751, 20260717752, 20260717753]
    phase_1: exact_point_orbit_composition_stabilizer_and_source_inverse_before_scaling
    fit: preregistered_log_log_with_inverse_log_and_leave_largest_out
  controls:
    - published invariant and covariant identities on soluble genus-one models
    - planted orbit compositions with known ordered point sources
    - nonsoluble and twisted orbits sharing coarse invariants
    - random coordinate encodings matched for dimension coefficient size and stabilizer
    - direct elliptic factor-base decomposition with exhaustive source output
    - Pollard rho and BSGS under matched operation accounting
  independent_variables:
    - field bit size and curve instance
    - decomposition arity and factor-base exponent beta
    - orbit stabilizer size and exceptional branch type
    - relation target versus masked blind target
    - original point model versus frozen coregular representation
    - permitted factorization minimization and inverse-covariant budget
  metrics:
    primary:
      - point-orbit injectivity modulo explicitly enumerated stabilizer
      - exact addition-composition identity agreement
      - orbit-atom to exact point-source biconditional agreement
      - setup and normalization exponent s
      - factorization and inverse exponent k plus u
      - reciprocal relation and target-density exponents delta and delta_t
      - full time exponent lambda=max(s,h,beta+delta+k+u,2*beta,delta_t+k+u)
      - full memory exponent mu including orbit coefficients stabilizers branches and output
    secondary:
      - coefficient-height exponent h and minimization cost
      - stabilizer branch and ambiguity distributions
      - relation rank blind target recovery operation counts timings and peak memory
  replication:
    independent_instances: 240
    relation_queries_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 600
    maximum_memory_gb: 48
    maximum_runs: 16000
    maximum_output_gb: 100
  stopping_rules:
    - Stop before scaling unless Phase 1 independently verifies encoding composition stabilizers and exact source inversion.
    - Stop after one independently reproduced orbit collision orientation ambiguity or false or lost source.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve censored results.
    - Halt inference after any accepted relation or recovered scalar fails independent verification.
  invalidation_rules:
    - Scalar-labelled orbit dictionaries target-selected normalizations or post-hoc stabilizer branches invalidate the mechanism arm.
    - Invariants without explicit orbit composition atom factorization and source inverse are controls only.
    - Omitting minimization coefficient height field extensions stabilizers output rank or descent invalidates cost claims.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Phase 1 passes exact encoding, composition, stabilizer, and source-inverse
    checks on every exhaustive instance; at least 1000 verified relations and
    100 blind target descents pass at each of the two largest completed sizes;
    upper 95 percent bounds satisfy s<=0.35, h<=0.20, k+u<=0.20,
    lambda<=0.45, and mu<=0.45 under complete accounting; and the frozen orbit
    model beats direct elliptic decomposition and matched representation controls.
  falsification_criterion: >-
    A generic orbit collision, scalar-orientation choice, noncanonical
    stabilizer branch, false or lost source, factorization density no better
    than direct decomposition, or lower 95 percent lambda>=0.50 in every
    complete-cost arm falsifies the stated mechanism at the tested boundary.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-075/implementation.md
    - ideas/artifacts/ECDLP-IDEA-075/representation_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-075/verifier.sage
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-075/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-075/analysis.md
  assigned_to: none
  approved_by: null

