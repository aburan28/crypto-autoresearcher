  from: coordinator
  to: executor
  objective: Preserve the retired theorem gate; do not implement or scale until a successor freezes one exact point-marked representation and proves composition factorization and source inversion.
  uncertainty_reduced: Whether a coregular genus-one orbit operation changes additive source factorization rather than relabeling point orientation.
  inputs:
    - ideas/deferred/ECDLP-IDEA-075_coregular_genus_one_orbit_composition_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-075_coregular_orbit_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch; a versioned successor requires coordinator approval.
    - Do not enter scaling after any Phase 1 identity stabilizer or source-inverse error.
    - Preserve every orbit coefficient branch stabilizer source miss rank cache and censored cell.
    - Do not interpret an invariant identity a soluble orbit or toy scalar recovery as promotion.
  deliverables:
    - frozen representation and orbit-composition specification
    - exhaustive stabilizer-complete source-inverse comparison
    - complete setup height density rank descent time and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1296000
    memory_gb: 48
    maximum_runs: 16000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
