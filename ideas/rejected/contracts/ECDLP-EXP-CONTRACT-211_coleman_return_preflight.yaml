experiment:
  id: EXP-ECDLP-IDEA-211-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-211
  lane: high-risk
  version: 1
  title: Coleman prime-to-p source-return theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_p_primary_formal_or_miller_s_unit_route_after_independent_review
  objective: >-
    Decide whether a canonical norm-fixed Coleman coefficient can retain generic
    prime-to-p subgroup information and factor biconditionally to exact sources
    without a full torsion field or Miller S-unit problem.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    canonical_lift_and_tower: unresolved
    prime_to_p_sensitivity: unresolved
    exact_source_return: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-211" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied Lubin-Tate norm-coherent sequences on p-primary torsion
    - shuffled prime-to-p torsion and formal-log characters
    - Miller S-units, ramification returns, full torsion fields, rho, and BSGS
  independent_variables:
    - lift, local tower, truncation, coefficient, factorization, and return map
    - p-primary versus generic prime-to-p subgroup points
    - known endpoint versus fresh masked blind target
  metrics:
    primary:
      - prime-to-p separation, source recall, false atoms, extension degree, and precision
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, factorization, output, rank, factor logs, descent, verification, and memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or prime-to-p sensitivity is unresolved.
    - Stop on formal-log, character, Miller-unit, or full-torsion-field reduction.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A noncanonical lift, source-labelled unit, uncharged extension, or supplied factorization invalidates the arm.
    - A p-primary toy separation is a control and cannot establish generic prime-to-p behavior.
    - Omitted setup, output, rank, factor logs, blind return, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a canonical bounded prime-to-p-sensitive coefficient,
    exact all-strata source factorization and return, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Formal/Miller reduction, collision on generic prime-to-p points, unbounded
    extension or precision, one false source, or exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-211/coleman_prime_to_p_source_return_theorem.md
    - ideas/artifacts/ECDLP-IDEA-211/norm_coefficient_inverse_spec.md
    - ideas/artifacts/ECDLP-IDEA-211/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-211/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-211
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as semantic-merge evidence; do not dispatch it.
  uncertainty_reduced: Whether Coleman norm coherence can retain and return prime-to-p elliptic sources.
  inputs:
    - ideas/rejected/ECDLP-IDEA-211_coleman_norm_coherent_elliptic_unit_return_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-211_coleman_return_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No full torsion field, scalar-labelled lift, Miller S-unit factorization, or uncharged extension.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - prime-to-p coefficient theorem or formal-control reduction
    - exact source-return proof or collision witness
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
