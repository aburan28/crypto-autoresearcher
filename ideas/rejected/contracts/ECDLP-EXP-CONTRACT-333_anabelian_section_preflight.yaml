experiment:
  id: EXP-ECDLP-IDEA-333-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-333
  lane: high_risk
  version: 1
  title: Anabelian section-to-source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: section_or_decomposition_group_is_the_point_label_and_theorem_domain_does_not_match_finite_relation_fibres
  objective: >-
    Preserve the high-risk domain and input audit for the proposed arithmetic
    fundamental-group section-to-source lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    domain_correct_auxiliary_hyperbolic_object: unresolved
    endpoint_only_compact_group_extension: unresolved
    canonical_all_strata_section_to_point_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-333" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied arithmetic hyperbolic curves with known point decomposition groups
    - conjugate sections, relabelled source points, explicit cover enumeration, rho, and BSGS
  independent_variables:
    - auxiliary category, profinite quotient depth, section equivalence, stabilizer ambiguity, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - theorem-domain match, exact source recall, group state, conjugacy ambiguity, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - group presentation, quotient schedule, sections, conjugacy classes, output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any domain/group/section theorem is unresolved.
    - Stop if a point section or decomposition group is supplied, group state reaches B^3, or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Supplied point sections, point decomposition groups, source-labelled quotient generators, or an arithmetic-domain mismatch invalidate the arm.
    - Correct reconstruction from supplied point-theoretic data is only a positive control.
    - Omitted setup, output, rank, logs, descent, verification, bit cost, conjugacy, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a domain-correct compact endpoint group object,
    canonical exact section-to-point inversion, campaign/state at most B^(9/4), query
    at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Any supplied point section, category mismatch, unresolved conjugacy, B^3 group state,
    one missed source, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-333/section_domain_and_input_receipt.md
    - ideas/artifacts/ECDLP-IDEA-333/conjugacy_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-333/section_to_point_obligations.md
    - ideas/artifacts/ECDLP-IDEA-333/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-333
  from: coordinator
  to: executor
  objective: Preserve the retired anabelian-domain theorem review; do not dispatch it.
  uncertainty_reduced: Whether the cited section machinery applies and can construct rather than receive point-labelled sections.
  inputs:
    - ideas/rejected/ECDLP-IDEA-333_anabelian_section_source_lift_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-333_anabelian_section_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply point sections, decomposition groups, source-labelled quotients, or use a theorem outside its domain.
    - Charge group construction, quotients, sections, output, rank, logs, descent, verification, and memory.
  deliverables:
    - theorem-domain and point-labelled-input receipt
    - conjugacy and section-to-point audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
