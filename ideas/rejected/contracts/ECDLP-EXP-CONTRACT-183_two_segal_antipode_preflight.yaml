experiment:
  id: EXP-ECDLP-IDEA-183-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-183
  lane: high_risk
  version: 1
  title: 2-Segal antipode endpoint-source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_antipode_acts_on_supplied_decomposition_space_and_returns_aggregate_after_independent_review
  objective: >-
    Decide symbolically whether an elliptic endpoint alone compiles a locally finite
    2-Segal decomposition space whose incidence antipode returns every exact signed
    factor-base source rather than an alternating aggregate over a supplied fiber.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_to_decomposition_space_compiler: unresolved
    locally_finite_antipode: unresolved
    exact_labelled_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-183" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published antipodes on explicitly supplied decomposition spaces
    - alternating aggregate incidence sums without point labels
    - exhaustive labelled source enumeration, Pollard rho, and BSGS
    - known-log endpoints and fresh masked blind targets
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - simplicial degree, decomposition arity, incidence basis, and antipode truncation
    - known endpoint versus masked blind target
    - signs, multiplicities, collisions, infinity, and empty fibers
  metrics:
    primary:
      - endpoint compiler status, local finiteness, and exact labelled-source recall
      - construction, antipode, output, and target-ambiguity exponents
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, rank, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or a Phase 0 theorem is unresolved.
    - Stop if the decomposition object must enumerate, label, or otherwise supply the endpoint source fiber.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied decomposition space, source-labelled simplex deck, post-hoc selector, or dense resultant invalidates the arm.
    - An antipode identity or relation-only certificate without an endpoint compiler is a control.
    - Omitted construction, output, rank, descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a target-uniform endpoint compiler, a locally finite
    incidence antipode with exact labelled-source inversion on every stratum, and
    complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    A supplied decomposition fiber, aggregate-only antipode output, B^m simplex
    materialization, one missed source, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-183/two_segal_endpoint_compiler_theorem.md
    - ideas/artifacts/ECDLP-IDEA-183/antipode_source_spec.md
    - ideas/artifacts/ECDLP-IDEA-183/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-183/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-183/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-183
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether an endpoint can compile a decomposition space whose antipode returns exact point sources without first supplying them.
  inputs:
    - ideas/rejected/ECDLP-IDEA-183_two_segal_incidence_antipode_source_extraction_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-183_two_segal_antipode_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied decomposition fiber, source-labelled simplex deck, scalar orientation, or post-hoc selector.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - endpoint-to-decomposition-space theorem or compiler lower bound
    - exact antipode/source biconditional or aggregate collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
