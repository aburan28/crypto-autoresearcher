experiment:
  id: EXP-ECDLP-IDEA-324-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-324
  lane: high_risk
  version: 1
  title: Strassen laser exact-source degeneration preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: direct_duplicate_of_idea_060_bounded_order_border_deformation_decoder
  objective: >-
    Preserve the high-risk merge audit showing that laser block selection plus Bini
    exactification and source conditioning is the existing IDEA-060 operation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    implicit_incidence_tensor_constructor: unresolved
    exact_source_preserving_degeneration: unresolved
    all_strata_witness_backsolve: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-324" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied direct-sum tensors with independently tagged noncancelling monomials
    - equal-border-rank tensors with different witness supports, source-sized tags, rho, and BSGS
  independent_variables:
    - tensor power, degeneration weights, block count, interpolation precision, witness-tag size, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, represented tensor work, relation rank, factor-log completion, blind descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - tensor powers, block dimensions/count, sum of matrix-multiplication costs, extraction, interpolation precision, witness tags, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any tensor/source-preservation theorem is unresolved.
    - Stop if witness tags materialize source support, finite-field interpolation is inexact, or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Supplied source tensors, planted source tags, post-hoc weights, or uncharged tensor powers invalidate the arm.
    - Correct border-rank contraction of a supplied tensor is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish implicit tensor construction, exact source-preserving
    degeneration and backsolve, campaign/state at most B^(9/4), fresh-target work at most
    B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Equal-degeneration source collisions, source-sized tags, one false or missed source,
    inexact interpolation, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-324/idea060_laser_merge_receipt.md
    - ideas/artifacts/ECDLP-IDEA-324/degeneration_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-324/independent_laser_verifier.py
    - ideas/artifacts/ECDLP-IDEA-324/cost_analysis.md
  assigned_to: none
  approved_by: null

