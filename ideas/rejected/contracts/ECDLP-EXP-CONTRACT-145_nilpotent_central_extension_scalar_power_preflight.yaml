experiment:
  id: EXP-ECDLP-IDEA-145-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-145
  lane: high_risk
  version: 1
  title: Nilpotent central-extension scalar-power theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: canonical_nonsplit_section_and_return_map_missing
  objective: >-
    Gate all computation on an explicit N-primary nonsplit class, canonical
    gauge-independent cyclic lift, typed scalar/group return map, and complete
    conversion or auxiliary-input cost model.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    cyclic_restriction_class: unresolved
    canonical_section: unresolved
    nonlinear_return_map: unresolved
    return_type_scalar_or_group: unresolved
    same_group_orientation_maps: unresolved
    center_dlp_exclusion: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-145" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - finite Heisenberg groups with supplied canonical matrix coordinates
    - externally supplied Cheon auxiliary inputs
    - split and cohomologous sections with randomized gauges
    - coprime centers, N-torsion centers with charged center DLP, Pollard rho, and BSGS
  independent_variables:
    - extension class, center order, section gauge, and coordinate field
    - curve instance, subgroup order, and target scalar
    - section/readout, auxiliary-input density, Cheon recovery, and ambiguity
    - known-log versus fresh masked blind target
  metrics:
    primary:
      - gauge-independent nonlinear scalar law and public return correctness
      - cyclic restriction/cohomology classification and center-DLP reduction
      - scalar direct-recovery versus group-valued Cheon interface
      - chi=max((1-kappa)/2,kappa/2) when d=N^kappa in the stated Cheon regime
      - lambda=max(a,q+delta,chi+u,ell,beta)
      - mu=max(a_m,q_m,chi_m,ell_m,u)
    secondary:
      - section collisions, split classes, auxiliary verification, and final scalar checks
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or the Phase 0 theorem is unresolved.
    - Stop on a split cyclic restriction, gauge-dependent coordinate, proved center-DLP reduction, or fixed-degree chi=0.50.
    - Bounds strictly above 0.45 and below 0.50 are inconclusive and cannot promote.
  invalidation_rules:
    - An externally supplied auxiliary input is only a positive control.
    - A cocycle identity without canonical public section/readout is insufficient.
    - Omitting return type, center orientation, conversion, retries, ambiguity, verification, or memory invalidates costs.
    - Cheon is inadmissible unless Z, [x]Z, and [x^d]Z lie in the same order-N group with d dividing N-1 and all orientation maps supplied.
    - Timeout or infrastructure failure is not mathematical falsification.
  success_criterion: >-
    An independently checked theorem supplies an N-primary nonsplit class, canonical
    section, typed nonlinear return and all conversion/orientation maps with complete
    time and memory exponents at most 0.45.
  falsification_criterion: >-
    Split cyclic restriction, gauge dependence, a construction-specific reduction to
    an order-N center DLP/self-bilinear map, fixed-degree Cheon exponent 0.50, or
    complete exponent at least 0.50 closes the corresponding branch.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-145/cyclic_section_no_go.md
    - ideas/artifacts/ECDLP-IDEA-145/canonical_nonlinear_section.md
    - ideas/artifacts/ECDLP-IDEA-145/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-145/verify_auxiliary.py
    - ideas/artifacts/ECDLP-IDEA-145/cost_analysis.md
  assigned_to: none
  approved_by: null

