    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-145_nilpotent_central_extension_scalar_power_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired and any successor requires coordinator approval.
