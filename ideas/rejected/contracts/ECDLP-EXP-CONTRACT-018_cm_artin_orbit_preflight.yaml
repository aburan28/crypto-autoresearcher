experiment:
  id: EXP-ECDLP-IDEA-018-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-018
  lane: representation_changing
  version: 2
  title: Blinded CM ray-invariant and Artin-orbit partition preflight
  status: review_required
  objective: >-
    On an explicitly special CM family, determine whether published ray invariants and
    Artin actions give a public scalar-separating coordinate after reduction, without a
    known point logarithm, target-selected invariant, or uncharged ray-field degree.
  claim_boundary:
    evidence_scale: toy_special_family
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  frozen_derivation:
    CM_discriminants: [-3, -4, -7, -8, -11]
    canonical_order_basis: one_and_omega_with_omega_minimal_polynomial_declared_by_discriminant
    ray_modulus_ideal_rule: ideal_generated_by_norm_and_omega_minus_smallest_declared_root
    ray_modulus_ideals:
      - {discriminant: -3, norm: 7, omega_root: 3}
      - {discriminant: -3, norm: 13, omega_root: 4}
      - {discriminant: -3, norm: 19, omega_root: 8}
      - {discriminant: -3, norm: 31, omega_root: 6}
      - {discriminant: -4, norm: 5, omega_root: 2}
      - {discriminant: -4, norm: 13, omega_root: 5}
      - {discriminant: -4, norm: 17, omega_root: 4}
      - {discriminant: -4, norm: 29, omega_root: 12}
      - {discriminant: -7, norm: 2, omega_root: 0}
      - {discriminant: -7, norm: 7, omega_root: 4}
      - {discriminant: -7, norm: 11, omega_root: 5}
      - {discriminant: -7, norm: 23, omega_root: 10}
      - {discriminant: -8, norm: 3, omega_root: 1}
      - {discriminant: -8, norm: 11, omega_root: 3}
      - {discriminant: -8, norm: 17, omega_root: 7}
      - {discriminant: -8, norm: 19, omega_root: 6}
      - {discriminant: -11, norm: 3, omega_root: 0}
      - {discriminant: -11, norm: 5, omega_root: 2}
      - {discriminant: -11, norm: 11, omega_root: 6}
      - {discriminant: -11, norm: 23, omega_root: 5}
    reduction_prime_rule: first_five_ascending_good_ordinary_primes_with_declared_subgroup
    maximum_prime_subgroup_order: 31
    invariant_formulas:
      - normalized_weierstrass_wp_prime_torsion_ordinate_from_Koo_Shin_Yoon
      - Siegel_Ramachandra_invariant_power_12m_over_gcd_6_m
    label_protocol: freeze_unlabeled_orbit_partition_before_reveal
    exhaustive_truth: true
    seeds: [20260717181, 20260717182, 20260717183]
  controls:
    - published complex-multiplication reciprocity examples
    - random permutations with matched orbit sizes
    - target-independent class invariant with no marked-point information
    - known-log table forbidden until the partition hash is frozen
    - generic non-CM curves recorded as outside-scope applicability controls
  independent_variables:
    - CM discriminant and conductor
    - reduction prime and subgroup order
    - ray modulus
    - ray invariant family
    - Artin element and orbit
  metrics:
    primary:
      - CM-family applicability
      - ray-field degree and discriminant
      - coefficient and elliptic-unit height
      - marked-lift branch count
      - blinded scalar-partition mutual information
      - coordinate collision-list size
      - full time exponent lambda
      - full bit-memory exponent mu
    secondary:
      - exact reciprocity agreement
      - target-independent partition frequency
      - use-of-log and post-selection audit
      - ideal factorization and orbit-construction costs
  replication:
    declared_cells: 200
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 144
    maximum_memory_gb: 32
    maximum_runs: 3000
    maximum_output_gb: 30
  stopping_rules:
    - Stop an invariant formula after every frozen discriminant, modulus, and deterministic reduction-prime cell has a terminal construction or applicability state.
    - Stop a ray modulus after field degree or coefficient height exceeds the exact 30 GB materialization budget.
    - Halt inference after any reciprocity or blinded-label verification failure.
  invalidation_rules:
    - Revealing point logarithms before partition freeze invalidates the run.
    - A target-selected invariant, scalar-labeled lift, or post-hoc discriminant invalidates the mechanism cell.
    - A public partition identical to the target-independent control carries zero scalar information.
    - Non-CM inapplicability is outside scope and cannot be omitted from the report.
    - A construction crash or unavailable class-field routine is infrastructure evidence only.
  success_criterion: >-
    Exact published reciprocity checks; no point-log dependence; nontrivial public
    scalar-partition information on at least 90 percent of all 200 preregistered cells,
    with inapplicable cells retained in the denominator; zero wrong labels after reveal;
    and upper 95 percent field-degree, height,
    lambda, and mu bounds each at most 0.45. Success promotes only to a CM-family scaling
    contract and makes no generic-curve claim.
  falsification_criterion: >-
    Every frozen public partition is target-independent; lift selection needs the point
    logarithm; ray-field degree or coefficient height has lower 95 percent exponent at
    least 0.50; or one accepted scalar label is wrong.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-018/preflight_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-018/cm_artin_descent.sage
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/ray_invariants.jsonl
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-018/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-018/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-018
  from: coordinator
  to: executor
  objective: Implement and run the blinded CM ray-invariant partition preflight after approval.
  uncertainty_reduced: Whether an explicit special-family Artin coordinate separates hidden scalars without knowing their logs.
  inputs:
    - ideas/ECDLP-IDEA-018_cm_ray_class_artin_descent_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-018_cm_artin_orbit_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Freeze and hash every unlabeled partition before scalar labels are revealed.
    - Preserve all failed lifts, target-independent partitions, branch collisions, and out-of-scope instances.
    - A correct reciprocity law or special-family toy label is not a generic ECDLP result.
  deliverables:
    - immutable CM construction and blinded partition records
    - lift-dependency and post-selection audit
    - degree, height, information, time, and bit-memory report
  budget:
    wall_clock_seconds: 518400
    memory_gb: 32
    maximum_runs: 3000
  completion_gate:
    - Every frozen discriminant, modulus, reduction-prime cell, and invariant formula has a terminal state.
    - Partition hashes precede label reveals and exact reciprocity independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
