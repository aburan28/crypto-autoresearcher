experiment:
  id: EXP-ECDLP-IDEA-276-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-276
  lane: representation_changing
  version: 1
  title: Riemann-Kempf theta tangent-cone theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: singular_theta_encoding_requires_source_divisor_and_omits_generic_strata
  objective: >-
    Decide theorem-first whether every ECDLP source fiber has a target-uniform singular
    theta encoding whose compact tangent-cone rulings invert to exact source factors.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    all_strata_singular_theta_encoding: unresolved
    source_independent_compact_cone: unresolved
    exact_ruling_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-276" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied special divisor on a small Jacobian with known theta tangent cone and labelled summands
    - generic nonsingular theta points, ambiguous linearly equivalent divisors, permuted summands, secant pencils, dense resultants, rho, and BSGS
  independent_variables:
    - auxiliary genus, divisor degree, theta stratum, singular multiplicity, osculating order, and factor-base beta
    - generic versus special theta points and split versus nonsplit rational rulings
    - signed, repeated, infinity, ramified, singular, and ambiguous divisor strata
  metrics:
    primary:
      - stratum coverage, cone compactness, ruling recall, false factors, relation rank, target descent, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - theta derivative traffic, divisor ambiguity, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the all-strata theta/source-return theorem is unresolved.
    - Stop if generic endpoints miss the singular theta stratum or cone construction requires a source divisor.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source divisor, known-log ruling selector, or uncharged cone output invalidates the arm.
    - Reconstruction on one special labelled divisor is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an all-strata target-uniform singular-theta encoding,
    exact ruling-to-factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Missing generic strata, source-divisor input, ambiguous rulings, cone state at least
    N^0.50, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-276/riemann_kempf_source_split_theorem.md
    - ideas/artifacts/ECDLP-IDEA-276/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-276/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-276/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-276
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether theta tangent-cone rulings can return all ECDLP source factors without a supplied divisor.
  inputs:
    - ideas/rejected/ECDLP-IDEA-276_riemann_kempf_theta_tangent_cone_source_split_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-276_riemann_kempf_theta_tangent_cone_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use supplied source divisors, known-log ruling selectors, pointwise source advice, or uncharged cone enumeration.
    - Charge auxiliary geometry, theta data, cone/ruling output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - all-strata compact singular-theta encoding or divisor-input/stratum obstruction theorem
    - exact ruling-to-factor and source-return audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
