experiment:
  id: EXP-ECDLP-IDEA-209-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-209
  lane: conservative
  version: 1
  title: Simultaneous Pade full-cycle recurrence theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_low_recurrence_or_compact_orbit_membership_tester_after_independent_review
  objective: >-
    Decide theorem-first whether a generic factor-base translation observable has
    a short full-cycle joint approximant and exact zero router outside existing
    elliptic-net, orbit, finite-state, and exponent-coset controls.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    generic_factor_base_recurrence: unresolved
    full_cycle_zero_router: unresolved
    collision_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-209" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - manufactured low-recurrence vectors and random periodic vectors
    - IDEA-006 elliptic nets, IDEA-011 orbit invariants, and IDEA-070 reverse automata
    - Gallant/P1530 type-1 membership, the P1531 partial-period type-2 label, dense tables, rho, and BSGS
  independent_variables:
    - generic factor-base family, companions, approximant order, and mask
    - known endpoint versus fresh masked blind target
    - poles, repeats, signs, zero multiplicity, prefix length, and full-cycle validity
  metrics:
    primary:
      - joint degree, full-cycle recall, false indices, rank, output, and peak state
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, samples, queries, factor logs, masked descent, verification, and memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the generic full-cycle theorem is unresolved.
    - Stop on reduction to an existing recurrence, Gallant type-1 membership, or the partial-period type-2 label.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A fitted prefix, known-scalar orbit, point table, or uncharged output invalidates the arm.
    - Toy recurrence quality is a control and cannot establish asymptotic performance.
    - Omitted setup, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a generic-factor-base full-cycle approximant and
    exact zero router outside all recorded controls, with complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Existing-mechanism reduction, one missed or false zero, fitted-prefix failure,
    or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-209/simultaneous_pade_recurrence_theorem.md
    - ideas/artifacts/ECDLP-IDEA-209/p1530_and_orbit_collision_audit.md
    - ideas/artifacts/ECDLP-IDEA-209/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-209/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-209
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as scoped merge evidence; do not dispatch it.
  uncertainty_reduced: Whether generic divisor samples yield a new short full-cycle recurrence and exact zero router.
  inputs:
    - ideas/rejected/ECDLP-IDEA-209_simultaneous_hermite_pade_orbit_denominator_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-209_simultaneous_pade_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not fit toy prefixes or treat P1530 producer evidence as independently final.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - generic full-cycle recurrence theorem or semantic-merge proof
    - exact zero-router proof or collision witness
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
