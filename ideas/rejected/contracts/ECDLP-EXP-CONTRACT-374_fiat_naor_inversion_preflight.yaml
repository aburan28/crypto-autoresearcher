experiment:
  id: EXP-ECDLP-IDEA-374-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-374
  lane: conservative
  version: 1
  title: Fiat-Naor restricted function-inversion preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: function_evaluation_and_restriction_stable_advice_require_source_incidence_or_exceed_query2p1_gates
  objective: >-
    Preserve a theorem-only audit of whether collision-aware arbitrary-function
    inversion advice can be built from elliptic endpoints and replayed under
    arbitrary restrictions without enumerating the source domain.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_function_evaluator: unresolved
    restriction_stable_inversion_advice: unresolved
    exact_occurrence_source_replay: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-374" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_random_function_with_known_preimages
    - positive_collision_probability_and_tradeoff_reproduction
    - negative_equal_endpoint_advice_with_toggled_singleton_restricted_source
    - negative_chain_step_requiring_explicit_source_transition
  independent_variables:
    - endpoint_function_interface
    - advice_size_and_chain_policy
    - collision_probability_and_false_alarm_rate
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_source_is_recovered_by_target_independent_restriction_stable_advice
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_function_evaluation_and_chain_transition_has_endpoint_only_constructor
      - advice_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_any_function_step_requires_source_incidence_or_scalar_orientation
    - stop_if_arbitrary_restrictions_require_source_sized_advice_rebuilds
    - stop_if_one_singleton_source_is_missed_or_false
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_function_is_confused_with_an_endpoint_constructed_function
    - invalidate_if_target_fitted_advice_or_hashes_are_used
    - invalidate_if_relation_validity_is_substituted_for_source_recovery
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs every function step from endpoints, proves
    target-independent restriction-stable inversion and exact occurrence replay,
    and satisfies every state, query, campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by source-labelled function access, advice or
    restricted replay above the gates, one singleton/stratum miss, or complete
    time or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-374/function_interface_theorem.md
    - ideas/artifacts/ECDLP-IDEA-374/restricted_chain_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-374/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-374/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-374
  from: coordinator
  to: executor
  objective: >-
    Preserve the retired theorem-only Fiat-Naor inversion preflight; do not
    dispatch it.
  uncertainty_reduced: >-
    Whether endpoint-only function access and restriction-stable advice can
    avoid the source-incidence boundary.
  inputs:
    - ideas/rejected/ECDLP-IDEA-374_fiat_naor_function_inversion_source_index_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-374_fiat_naor_inversion_preflight.yaml
  constraints:
    - No experiment, solver, relation campaign, or scaling run is authorized.
    - Treat all prospective evidence as toy, heuristic, model-bound, and novelty-unverified.
    - Do not create the prospective artifact root under this retired draft.
  deliverables:
    - theorem audit of endpoint-only function access and advice construction
    - collision and arbitrary-restriction obstruction inventory
    - exact source-replay proof or explicit disproof
    - complete factor-base-to-target-descent cost audit
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review

