experiment:
  id: EXP-ECDLP-IDEA-024-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-024
  lane: high_risk
  version: 1
  title: Pontryagin-square Chow-regulator readability preflight
  status: review_required
  objective: >-
    Determine whether an explicitly constructed finite-field zero-cycle quotient has
    a nonzero N-primary regulator satisfying a quadratic scalar law and exposing the
    coefficient x^2 in a public basis without a pairing, hidden order-N discrete
    logarithm, or square-root-sized representation.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [8, 10, 12, 14, 16, 18, 21, 24, 26]
    independent_curves_per_size: 100
    regulator_quotients: [somekawa_symbol, zero_cycle_filtration, motivic_residue]
    exhaustive_truth_max_bits: 16
    scalar_law_trials_per_cell: 10000
    seeds: [20260717241, 20260717242, 20260717243]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - synthetic bilinear cycle module with a planted readable square coordinate
    - exhaustive scalar squares and zero-cycle relations on tiny groups
    - finite-field cycle quotients predicted to vanish
    - Weil and Tate pairing traces on matched inputs
    - blinded module coordinates with known-log tables forbidden
    - explicit representation-size and basis-construction accounting
  independent_variables:
    - field bit size
    - curve instance
    - cycle quotient
    - regulator construction
    - scalar multiplier
    - extension field
    - module basis
  metrics:
    primary:
      - cycle and regulator construction exponent c
      - evaluation plus reciprocal usable-density exponent e+delta
      - module-coordinate recovery exponent u
      - representation-size exponent k
      - ambiguity exponent a
      - full time exponent lambda=max(c,e+delta,u,k,a)
      - full bit-memory exponent mu
    secondary:
      - exact quadratic-law pass rate
      - nonzero usable-coordinate density
      - zero and torsion-correction counts
      - pairing-equivalence evidence
      - module-basis and coordinate-read complexity
      - end-to-end original-curve verification rate
  replication:
    independent_instances: 900
    scalar_law_trials_per_cell: 10000
    target_recoveries_per_largest_size: 100
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 960
    maximum_memory_gb: 64
    maximum_runs: 24000
    maximum_output_gb: 120
  stopping_rules:
    - Stop exhaustive cycle enumeration after 16 bits.
    - Stop a quotient after two consecutive sizes have zero usable coordinates on all 100 instances.
    - Halt inference after any accepted scalar fails independent original-curve verification.
  invalidation_rules:
    - A quadratic identity in the synthetic module validates instrumentation only.
    - A nonzero regulator without a public-basis coordinate cannot enter scalar-recovery metrics.
    - Equivalence to a Weil or Tate pairing, or an order-N module or field DLP, invalidates the proposed operation.
    - Known-log tables, scalar-labeled bases, target-indexed preprocessing, and post-hoc quotient selection invalidate the mechanism arm.
    - Missing symbolic machinery, a timeout, or a crash is infrastructure or coverage evidence only.
  success_criterion: >-
    Exact quadratic laws in 10000 trials per promoted cell; nonzero usable coordinates
    on at least 90 percent of instances at each of the two largest completed sizes;
    zero wrong scalars and at least 100 end-to-end recoveries per largest size; no
    pairing or order-N-DLP equivalence; upper 95 percent bounds c<=0.30,
    e+delta<=0.30, u<=0.40, k<=0.30, lambda<=0.45, and mu<=0.45; and stable
    finite-size sensitivity.
  falsification_criterion: >-
    After implementation validation, every regulator vanishes on the target subgroup;
    the claimed coordinate is pairing- or DLP-equivalent; representation or module
    labeling has lower 95 percent exponent at least 0.50; the quadratic law fails; an
    accepted scalar is wrong; or every complete-cost arm has lower 95 percent
    lambda>=0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-024/implementation.md
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/cycles.jsonl
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/regulators.jsonl
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-024/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-024/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-024
  from: coordinator
  to: executor
  objective: Implement and run the vanishing-versus-readable-regulator preflight exactly after approval.
  uncertainty_reduced: Whether a nonzero quadratic cycle coordinate exists and is readable without hiding the original DLP.
  inputs:
    - ideas/ECDLP-IDEA-024_pontryagin_square_chow_regulator_coordinate_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-024_chow_regulator_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every zero regulator, torsion correction, failed scalar law, basis cost, ambiguity, and censored cell.
    - Do not interpret a cycle identity, regulator value, or recovered toy square as promotion.
  deliverables:
    - immutable cycle, regulator, and coordinate records
    - nonvanishing, scalar-law, and pairing-equivalence audit
    - representation-size and coordinate-recovery cost fits
    - complete rho and BSGS comparison with finite-size sensitivity
  budget:
    wall_clock_seconds: 3456000
    memory_gb: 64
    maximum_runs: 24000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted coordinate and recovered scalar independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
