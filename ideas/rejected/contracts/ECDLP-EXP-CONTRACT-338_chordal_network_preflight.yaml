experiment:
  id: EXP-ECDLP-IDEA-338-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-338
  lane: conservative
  version: 1
  title: Chordal-network source-elimination preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: chordal_elimination_requires_the_missing_sparse_source_graph_or_restores_dense_source_state
  objective: >-
    Preserve the conservative theorem and input audit for the proposed
    chordal-network source eliminator without dispatching an experiment.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    public_source_graph_without_tuple_enumeration: unresolved
    bounded_treewidth_all_strata_elimination: unresolved
    exact_source_replay_from_separators: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-338" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - explicit bounded-treewidth factor graphs with supplied source labels
    - source-permuted graphs, dense completions, explicit tuple enumeration, rho, and BSGS
  independent_variables:
    - graph construction, separator width, elimination order, source ambiguity, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - source-free graph construction, separator width, exact source recall, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - graph construction, fill, separators, source output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any graph, width, or replay theorem is unresolved.
    - Stop if graph construction enumerates sources, fill reaches source-deck scale, or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source graph, source-labelled bags, tuple deck, or hidden enumeration invalidates the arm.
    - Correct elimination on an explicitly supplied sparse graph is only a positive control.
    - Omitted setup, fill, output, rank, logs, descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish source-free sparse graph construction, bounded
    all-strata fill, exact source replay, campaign/state at most B^(9/4), query
    at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Any supplied source graph, source-sized fill, one missed or false source, or
    either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-338/chordal_width_obligations.md
    - ideas/artifacts/ECDLP-IDEA-338/separator_source_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-338/all_strata_replay_spec.md
    - ideas/artifacts/ECDLP-IDEA-338/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-338
  from: coordinator
  to: executor
  objective: Preserve the retired chordal-network theorem review; do not dispatch it.
  uncertainty_reduced: Whether a source-free sparse graph and bounded exact elimination exist.
  inputs:
    - ideas/rejected/ECDLP-IDEA-338_chordal_network_source_elimination_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-338_chordal_network_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply a source graph, source-labelled bags, tuple deck, or relation oracle.
    - Charge graph construction, fill, output, rank, logs, descent, verification, and memory.
  deliverables:
    - source-graph construction and input receipt
    - all-strata treewidth and exact replay audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
