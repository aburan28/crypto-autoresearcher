experiment:
  id: EXP-ECDLP-IDEA-349-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-349
  lane: high_risk
  version: 1
  title: Vector-discrepancy source-rounding preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: real_discrepancy_rounding_has_no_public_exact_finite_field_encoding_or_subgate_correction
  objective: >-
    Preserve the high-risk theorem and input audit for the proposed constructive
    vector-discrepancy source rounding without dispatching an experiment.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    public_homomorphic_low_dimensional_vector_encoding: unresolved
    discrepancy_to_exact_finite_field_residual_theorem: unresolved
    source_replaying_subgate_correction: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-349" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied integer lattices with exact homomorphic embeddings and planted bounded corrections
    - equal-vector different-residual pairs, source permutations, randomized rounding, rho, and BSGS
  independent_variables:
    - vector dimension, norm, precision, discrepancy, correction radius, source ambiguity, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact encoding, discrepancy, correction radius, source recall, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - vector construction, precision, rounding, correction, source output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any encoding, residual, or correction theorem is unresolved.
    - Stop if the encoding enumerates sources, exact correction invokes rho or DLP, or one stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source decomposition, nonhomomorphic real map, hidden DLP oracle, or approximate-only equality invalidates the arm.
    - Correct rounding with a supplied exact lattice embedding is only a positive control.
    - Omitted encoding, precision, correction, output, rank, logs, descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a public exact homomorphic vector encoding,
    discrepancy-to-exact-correction theorem, source replay, campaign/state at most
    B^(9/4), query at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Equal vectors with different exact residuals, rho/DLP correction, source-sized
    precision or state, one missed source, or either exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-349/vector_encoding_and_correction_obligations.md
    - ideas/artifacts/ECDLP-IDEA-349/wraparound_counterexamples.json
    - ideas/artifacts/ECDLP-IDEA-349/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-349/cost_analysis.md
  assigned_to: none
  approved_by: null

