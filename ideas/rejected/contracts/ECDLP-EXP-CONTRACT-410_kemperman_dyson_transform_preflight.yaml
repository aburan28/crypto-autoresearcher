experiment:
  id: EXP-ECDLP-IDEA-410-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-410
  lane: conservative
  version: 1
  title: Kemperman-Dyson fixed-target e-transform preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: e_transform_preserves_only_sumset_inclusion_and_no_endpoint_only_target_nonemptiness_pivot_is_constructed
  objective: >-
    Preserve a theorem-only audit of a public fixed-target-biconditional e-transform
    tree, reversible ancestry, exact restricted existence, and charged bisection.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_fixed_target_pivot_rule: unresolved
    strict_transform_potential_and_reversible_ancestry: unresolved
    exact_restricted_existence_and_bisection: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-410" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_critical_pair_and_witness_preserving_pivot
    - positive_parent_negative_child_restricted_existence_and_singleton_verification
    - negative_same_public_pair_different_witness_preserving_pivots
    - negative_generic_noncritical_prime_cyclic_decks_and_B_squared_pivot_branching
  independent_variables:
    - deck_pair_schedule_and_pivot_rule
    - transform_potential_branching_and_ancestry_state
    - exact_existence_biconditional_and_bisection_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_restricted_existence_is_preserved_by_endpoint_e_transforms_and_charged_bisection_recovers_a_verified_singleton
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q charges failed pivots plus all O(log B) positive-parent/negative-child bisection queries and singleton verification; direct output o is charged separately if used; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_set_translation_union_intersection_pivot_branch_and_ancestry_token_is_fully_charged
      - deck_indices_and_pivot_rule_are_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_one_witness_is_destroyed_by_the_public_pivot_rule
    - stop_if_one_pivot_requires_a_hidden_summand_or_target_fitted_advice
    - stop_if_pivot_branching_is_Omega_B_squared
    - stop_if_setup_transform_or_ancestry_state_exceeds_B_to_the_9_over_4
    - stop_if_total_online_transform_restriction_bisection_and_singleton_sequence_exceeds_B_to_the_5_over_4
    - stop_if_one_restricted_existence_bit_or_singleton_verification_is_wrong
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_witness_preserving_pivot_is_confused_with_endpoint_construction
    - invalidate_if_critical_pair_structure_is_assumed_for_generic_decks_without_proof
    - invalidate_if_sumset_inclusion_is_substituted_for_fixed_target_biconditional_existence
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs a public fixed-target-biconditional e-transform tree,
    proves reversible ancestry and exact restricted existence, supports charged bisection,
    and satisfies every descent gate.
  falsification_criterion: >-
    The preflight is falsified by one destroyed witness, a source-bearing pivot,
    B-squared branching, one ancestry or existence collision, supergate work,
    or complete exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-410/e_transform_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-410/fixed_target_pivot_counterexamples.json
    - ideas/artifacts/ECDLP-IDEA-410/restricted_existence_bisection_receipt.json
    - ideas/artifacts/ECDLP-IDEA-410/cost_analysis.md
  assigned_to: none
  approved_by: null

