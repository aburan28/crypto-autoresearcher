experiment:
  id: EXP-ECDLP-IDEA-320-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-320
  lane: conservative
  version: 1
  title: Independent-component source-separation preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: endpoint_rows_are_not_shared_linear_source_mixtures_and_ica_gauge_is_source_dictionary
  objective: >-
    Decide theorem-first whether public scalar-blind endpoint features form exact
    repeated linear mixtures of fixed independent factor sources and whether cumulant
    unmixing returns exact signed points without a source dictionary.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    exact_shared_mixture_identity: unresolved
    finite_field_cumulant_identifiability: unresolved
    gauge_to_signed_point_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-320" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied real or finite-field synthetic shared mixtures with planted independent components
    - shuffled endpoint tuples, equal-cumulant controls, gauge-permuted source dictionaries, rho, and BSGS
  independent_variables:
    - feature channels, cumulant orders, component laws, sample count, source arity, and factor-base beta
    - reduced, repeated, singular, infinity, signed, gauge-ambiguous, and masked-target strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - mixture residual, cumulant rank, gauge multiplicity, sample count, uncertainty, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the mixture/source theorem is unresolved.
    - Stop if endpoint rows are not repeated mixtures of fixed components, gauge resolution names sources, or one stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled mixtures, scalar-oriented features, target retraining, or uncharged point dictionaries invalidate the arm.
    - Correct ICA recovery on a supplied synthetic mixture is only a positive control.
    - Omitted samples, setup, output, uncertainty, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an exact public shared-mixture law, applicable
    cumulant identifiability, canonical all-strata signed-point return, blind descent,
    and complete exponents at most 0.45.
  falsification_criterion: >-
    Absence of a shared-mixture law, source-labelled gauge resolution, one missing
    stratum, state/output at least N^0.50, target advice, or either complete exponent
    at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-320/ica_mixture_identity.md
    - ideas/artifacts/ECDLP-IDEA-320/cumulant_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-320/independent_ica_verifier.py
    - ideas/artifacts/ECDLP-IDEA-320/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-320
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether endpoint cumulants define a source-free exact shared mixture and point inverse.
  inputs:
    - ideas/rejected/ECDLP-IDEA-320_independent_component_cumulant_source_separation_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-320_ica_source_separation_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use source-labelled mixtures, scalar-oriented features, target retraining, or uncharged point tables.
    - Charge sample generation, cumulants, diagonalization, gauge resolution, output, ambiguity, rank, factor logs, blind descent, and memory.
  deliverables:
    - exact shared-mixture identity or endpoint/nonmixture theorem
    - exact all-strata gauge-to-point audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, statistical fit, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
