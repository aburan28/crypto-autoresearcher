experiment:
  id: EXP-ECDLP-IDEA-066-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-066
  lane: representation_changing
  version: 1
  title: Frobenius-Ore transition-module and source-lift preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: semantic_collision_with_active_ECDLP_IDEA_056
  objective: >-
    Test whether five-term forward and backward transition states admit a
    faithful low-order Frobenius-Ore module whose right intersection is exactly
    the witness set and lifts to every endpoint source without dense states.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [11, 12, 13, 14, 16, 18, 20, 22, 24]
    independent_curves_per_size: 20
    deck_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    extension_policies: [minimal_split, fixed_degree_ladder, full_truth_control]
    seeds: [20260717661, 20260717662, 20260717663]
    exhaustive_truth_max_bits: 16
    phase_1: exact_frobenius_module_intersection_and_source_lift
    fit: preregistered_log_log_with_leave_largest_out
  controls:
    - exhaustive forward A2 backward R-A3 and five-term source states
    - planted low-order Frobenius modules with known right intersection and sources
    - matched random transition sets with full Frobenius orbit degree
    - materialized backward-state polynomial
    - dense two-transition resultant
    - fast Ore arithmetic after dense materialization barred from mechanism credit
  independent_variables:
    - field bit size curve and deck size L
    - extension policy and degree
    - known random relation target versus randomized challenge target
    - Ore module representation versus dense and random controls
    - skew multiplication right-gcd and source-lift policy
  metrics:
    primary:
      - exact Frobenius closure module action intersection biconditional and source lift
      - faithful Ore order exponent alpha in L
      - extension skew-operation and source-output exponents
      - independent verified row output theta
      - relation and target density exponents
      - complete time exponent lambda and memory exponent mu
    secondary:
      - false missed repeated exceptional and ambiguous state counts
      - extension degree coefficients operator bytes timings and peak RSS
      - relation rank calibrated logs target recoveries and verification failures
  replication:
    independent_instances: 180
    relation_batches_per_largest_cell: 1000
    target_descents_per_largest_cell: 100
    independent_verifier: required
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 420
    maximum_memory_gb: 48
    maximum_runs: 14000
    maximum_output_gb: 70
  stopping_rules:
    - Stop before scaling on any Frobenius closure module biconditional multiplicity or source-lift mismatch.
    - Stop an arm when extension degree module order intersection output or source lift materializes the dense state object.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory and preserve it as censored_by_budget.
    - Halt inference after any relation factor log or recovered scalar fails independent verification.
  invalidation_rules:
    - An Ore solver applied only after dense materialization invalidates the mechanism arm.
    - Target-specific extensions scalar advice source tables post-hoc roots or discarded misses invalidate the arm.
    - A common state without exact endpoint sources cannot enter relation metrics.
    - Timeout crash dependency failure and budget censoring are not mathematical falsification.
  success_criterion: >-
    Zero Phase-1 errors; at least 0.9L independent verified rows per accepted
    collection; 1000 relations and 100 target descents at each of the two largest
    completed sizes; upper 95 percent alpha times skew exponent <=1.25; upper
    95 percent lambda<=0.45 and mu<=0.45; stable fits; and no dense state artifact.
  falsification_criterion: >-
    Any independently reproduced identity or source error; lower 95 percent Ore
    order or source-lift exponent at least 2 in L; theta<0.5 at both largest
    sizes; or lower 95 percent lambda>=0.50 in every complete-cost arm.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-066/implementation.md
    - ideas/artifacts/ECDLP-IDEA-066/ore_module_identity.md
    - ideas/artifacts/ECDLP-IDEA-066/ore_intersection.sage
    - ideas/artifacts/ECDLP-IDEA-066/verify_sources.sage
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/results.jsonl
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-066/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-066/analysis.md
  assigned_to: executor
  approved_by: null

