    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-066_ore_transition_preflight.yaml
  constraints:
    - Retired evidence only; do not dispatch this contract.
    - Do not run while status is review_required.
    - Do not enter scaling after any Phase-1 mismatch.
    - Preserve every extension operator intersection root source miss and censored cell.
    - Do not interpret a short skew polynomial common state relation or toy scalar as promotion.
  deliverables:
    - exact Frobenius and Ore-module derivation
    - exhaustive common-state and endpoint-source comparison
    - complete extension relation rank descent time output and memory fits
    - independent verification report
  budget:
    wall_clock_seconds: 1512000
    memory_gb: 48
    maximum_runs: 14000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted relation factor log and recovered scalar independently verifies.
    - Raw results resource metrics and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
