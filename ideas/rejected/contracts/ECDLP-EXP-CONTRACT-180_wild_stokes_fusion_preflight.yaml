experiment:
  id: EXP-ECDLP-IDEA-180-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-180
  lane: high_risk
  version: 1
  title: Wild-Stokes fusion source-factorization theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_monoidal_fusion_source_inverse_backend_after_independent_review
  objective: >-
    Decide symbolically whether a target-uniform scalar-blind finite-field map
    sends elliptic addition to quasi-Hamiltonian fusion and admits a gauge-canonical
    ordered Stokes-factor inverse to every exact signed factor-base source.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    finite_field_point_connection_map: unresolved
    fusion_addition_compatibility: unresolved
    gauge_canonical_factorization: unresolved
    exact_point_atom_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-180" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published characteristic-zero framed meromorphic-connection fusion examples
    - synthetic Stokes products with supplied ordered factors
    - gauge, braid, sector-order, and characteristic-lift perturbations
    - exhaustive source enumeration, Pollard rho, and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - connection type, framing, sector order, and gauge representative
    - known endpoint versus masked blind target
    - signs, multiplicities, collisions, infinity, and braid branches
  metrics:
    primary:
      - finite-field encoding and fusion/addition compatibility status
      - exact point-atom recall, precision, gauge invariance, and ambiguity
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - lifting, connection construction, gauges, factors, output, rank, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or any Phase 0 theorem is unresolved.
    - Stop if encoding requires a scalar orientation or canonical factorization requires source ordering.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A characteristic-zero-only lift, supplied connection factorization, or post-hoc gauge or sector selector invalidates the arm.
    - A generic factorization solver without a new finite-field fusion operation is a control.
    - Omitted lifting, gauges, branches, output, rank, descent, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proofs establish the scalar-blind finite-field encoding,
    fusion/addition compatibility, gauge-canonical exact source factorization,
    and complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    No compatible finite-field encoding, gauge/order-equivalent data with different
    sources, one missed or false atom, hidden source advice, or a complete exponent
    at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-180/wild_stokes_encoding_theorem.md
    - ideas/artifacts/ECDLP-IDEA-180/fusion_factorization_spec.md
    - ideas/artifacts/ECDLP-IDEA-180/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-180/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-180/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-180
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether finite-field elliptic addition can be encoded as fusion with a gauge-canonical exact point-atom inverse.
  inputs:
    - ideas/rejected/ECDLP-IDEA-180_wild_stokes_fusion_source_factorization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-180_wild_stokes_fusion_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No characteristic-zero-only proxy, supplied factors, scalar orientation, or post-hoc gauge selector.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - finite-field point-connection and fusion/addition theorem or obstruction
    - gauge-canonical exact factor/source inverse theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
