experiment:
  id: EXP-ECDLP-IDEA-119-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-119
  lane: high_risk
  version: 1
  title: Elliptic Bloch-polylog regulator source-inverse theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_finite_regulator_source_inverse_theorem
  objective: >-
    Gate all computation on a finite elliptic Bloch-polylog regulator quotient
    whose marked atoms invert exactly to factor-base points without scalar
    advice and whose complete charged descent remains below rho.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    finite_regulator_quotient: unresolved
    marked_point_boundary_biconditional: unresolved
    exact_atom_to_point_inverse: unresolved
    public_kernel_disambiguation: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-119" || field_bits || curve_index || "20260717")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published elliptic Bloch-complex identities with exact boundary verification
    - planted finite symbolic complexes with blinded exact atom inverses
    - ordinary divisor relations, random group symbols, and regulator-kernel collisions
    - Miller and S-unit relations, tame symbols, linear features, and post-hoc symbol assignment
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance and field size
    - factor-base exponent beta
    - coefficient moduli, regulator residues, and atom normal form
    - known relation target versus masked blind target
    - kernel ambiguity, source output, verification, and memory budgets
  metrics:
    primary:
      - marked-point and Bloch-boundary biconditional on complete fibers
      - setup time and memory exponents a and a_m
      - marked-symbol reduction and inverse exponents q and q_m
      - accepted source-output exponent o and residual kernel ambiguity exponent u
      - source verification time and memory exponents v and v_m
      - reciprocal relation and target success exponents delta and delta_t
      - linear-algebra time and memory exponents ell_LA and m_LA
      - lambda=max(a,beta+delta+q+o+v,ell_LA,delta_t+q+o+u+v)
      - mu=max(a_m,q_m,m_LA,beta+o,o+u,v_m)
    secondary:
      - trivial residues, torsion, coincident atoms, kernel branches, and failed reductions
      - relation rank, verified factor logs, blind recovery, operations, and bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or any Phase 0 theorem input is unresolved.
    - Stop after proof that the finite regulator is trivial, too small, or requires solving the original DLP to invert.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after independent verification of the exact regulator-atom source inverse.
  invalidation_rules:
    - A functional equation, regulator equality, or boundary certificate without exact point sources is a control.
    - A target-specific or scalar-labelled atom dictionary invalidates the arm.
    - Omitting modulus construction, kernel enumeration, output, rank, blind descent, verification, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 constructs a finite scalar-blind regulator quotient,
    proves the marked-point boundary biconditional and exact atom/source inverse,
    and derives full relation, rank, blind-descent, output, time, and memory
    exponents at most 0.45.
  falsification_criterion: >-
    One false source or boundary, an unresolved regulator collision, circular
    inversion through the DLP, or a complete time or peak-memory exponent at
    least 0.50 closes the mechanism.
  future_successor_artifacts:
    - ideas/artifacts/ECDLP-IDEA-119/regulator_source_inverse_gate.md
    - ideas/artifacts/ECDLP-IDEA-119/bloch_complex.yaml
    - ideas/artifacts/ECDLP-IDEA-119/regulator_reduce.sage
    - ideas/artifacts/ECDLP-IDEA-119/verify_regulator_sources.py
    - ideas/artifacts/ECDLP-IDEA-119/analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260717-119
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate; do not dispatch without a finite scalar-blind regulator quotient and exact atom/source inverse.
  uncertainty_reduced: Whether elliptic regulator structure generates exact sources more cheaply rather than merely certifying relations found elsewhere.
  inputs:
    - ideas/deferred/ECDLP-IDEA-119_elliptic_bloch_polylog_regulator_descent_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-119_elliptic_bloch_polylog_regulator_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - This draft is retired from dispatch and any successor requires coordinator approval.
    - Do not use scalar labels, target-specific dictionaries, or post-hoc symbols as hidden inputs.
    - Preserve every trivial residue, collision, torsion branch, failed reduction, and emitted source.
  deliverables:
    - finite regulator quotient and boundary theorem or explicit no-go
    - exact marked-atom-to-point inverse theorem or counterexample
    - complete relation, rank, descent, time, output, and memory model
    - independent verification report
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation has a terminal proved, disproved, or unresolved state.
    - No experiment or scaling run occurred under this retired draft.
    - Raw derivations and summaries agree.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
