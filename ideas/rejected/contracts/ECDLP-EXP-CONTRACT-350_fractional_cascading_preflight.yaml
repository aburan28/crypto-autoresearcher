experiment:
  id: EXP-ECDLP-IDEA-350-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-350
  lane: conservative
  version: 1
  title: Translation-catalog fractional-cascading source-router preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: elliptic_translation_orders_have_source_sized_run_complexity_and_no_subset_stable_exact_restricted_decision
  objective: >-
    Preserve the conservative theorem and input audit for public ordered translation
    catalogs without dispatching an experiment.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_monotone_translation_catalog: unresolved
    subgate_run_complexity_theorem: unresolved
    subset_stable_exact_restriction_decision: unresolved
    direct_source_router_or_logarithmic_bisection: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-350" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied sorted catalogs with planted bounded-run translations and exact source labels
    - independently permuted source decks, random orders, explicit scans, P1553-FD-R2, rho, and BSGS
  independent_variables:
    - catalog order, translation, run count, bridge density, source ambiguity, target update, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - exact catalog construction, restricted decision correctness, bisection, run complexity, source recall, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - catalog construction, bridges, target updates, source output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any ordering, run-complexity, or subset-stable decision theorem is unresolved.
    - Stop if catalogs or bridge tables enumerate the relation-source surface or one source stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source order, post-hoc run selector, omitted rebuild, or source-labelled bridge oracle invalidates the arm.
    - Correct lookup in a supplied monotone catalog is only a positive control.
    - Omitted construction, update, output, rank, logs, descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish an endpoint-only translation order with bounded
    run complexity, a subset-stable exact restricted-complement decision and charged
    O(log B) bisection or a direct source router, campaign/state at most B^(9/4),
    fresh query at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Source-sized run count, translation-dependent rebuild, restricted catalog views
    with different exact nonemptiness for which every public correction exceeds the gates,
    one missed stratum, or either exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-350/translation_order_obligations.md
    - ideas/artifacts/ECDLP-IDEA-350/run_count_counterexamples.json
    - ideas/artifacts/ECDLP-IDEA-350/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-350/cost_analysis.md
  assigned_to: none
  approved_by: null

