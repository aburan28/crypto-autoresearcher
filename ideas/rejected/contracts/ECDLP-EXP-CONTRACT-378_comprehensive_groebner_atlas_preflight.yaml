experiment:
  id: EXP-ECDLP-IDEA-378-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-378
  lane: representation_changing
  version: 1
  title: Comprehensive Groebner target-atlas preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: specialization_atlas_retains_parametric_source_branches_and_dense_elimination_cost
  objective: >-
    Preserve a theorem-only representation audit of whether a comprehensive
    Groebner atlas for the complete finite-deck relation ideal has subgate total
    state, fresh-target specialization, and exact occurrence-source lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    complete_chart_parametric_relation_ideal: unresolved
    subgate_comprehensive_atlas_bound: unresolved
    exact_specialization_source_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-378" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_low_degree_parametric_zero_dimensional_ideal
    - positive_known_comprehensive_specialization_cells_and_roots
    - negative_deck_indicator_branch_and_degree_growth
    - negative_equal_elimination_ideal_with_permuted_occurrence_labels
  independent_variables:
    - parametric_ideal_and_term_order
    - atlas_branch_degree_and_coefficient_growth
    - specialization_and_restriction_depth
    - source_label_and_nonreduced_stratum_policy
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_a_subgate_target_specialization_atlas
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_specialization_branch_degree_coefficient_and_reduction_is_charged
      - source_labels_and_all_complete_chart_strata_are_preserved
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_atlas_state_or_branch_growth_exceeds_B_to_the_9_over_4
    - stop_if_fresh_specialization_or_restriction_replay_exceeds_B_to_the_5_over_4
    - stop_if_source_labels_require_materialized_quotient_basis
    - stop_if_one_specialization_or_complete_chart_stratum_is_missed
  invalidation_rules:
    - invalidate_if_ordinary_solver_correctness_is_substituted_for_atlas_compression
    - invalidate_if_source_product_or_dense_resultant_input_is_free
    - invalidate_if_relation_validity_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem bounds all atlas branches, degrees, coefficients and state,
    proves exact restriction-stable specialization and source lift, and satisfies
    every state, query, campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by source-sized atlas/quotient state, supergate
    specialization or restriction replay, one missed stratum, label ambiguity,
    or complete time or memory exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-378/comprehensive_atlas_obligations.md
    - ideas/artifacts/ECDLP-IDEA-378/specialization_branch_cases.json
    - ideas/artifacts/ECDLP-IDEA-378/source_lift_receipt.json
    - ideas/artifacts/ECDLP-IDEA-378/cost_analysis.md
  assigned_to: none
  approved_by: null

