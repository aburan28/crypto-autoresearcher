experiment:
  id: EXP-ECDLP-IDEA-242-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-242
  lane: representation_changing
  version: 1
  title: Coloured norm-jet composition-tower theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_duplicate_of_idea_195_p1537_composition_gate
  objective: >-
    Preserve the IDEA-195/P1537 merge and freeze the remaining question whether a
    generic-prime compositional factor deck has a compact seven-channel evaluator
    with a bounded exact rational-point inverse before the B^5 Cartesian product.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    composition_tower: unresolved
    relative_norm_jet_intertwiner: proved_interface_only_by_ECFG_P1537_R1
    rational_source_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-242" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied finite-etale towers with independently enumerated norm jets
    - dense P1536 B^5 quotient and B^3 two-plus-three split
    - IDEA-133, IDEA-195, monomial and Chebyshev special-family decks, rho, and BSGS
  independent_variables:
    - tower degrees, relative norm maps, colour classes, branch inverse, and mask
    - generic-prime rational deck versus restricted smooth-p-minus-one control
    - known-log endpoint versus fresh masked blind target
  metrics:
    primary:
      - exact-source recall, false sources, tower state, output, row rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - setup, relative-norm traffic, failed colours, branch ambiguity, factor logs, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the compact generic-prime seven-channel evaluator and exact source inverse are unresolved.
    - Stop if a level restores a B^3 transition deck, source-labelled correction tensor, or special-prime-only deck.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied source tower, post-hoc colouring, or uncharged branch list invalidates the arm.
    - A trace-only identity or correct supplied jet is only a control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Starting from P1537's proved first-jet transport, independent proofs establish
    a generic-prime source-free compact evaluator, exact all-source inverse, and
    complete time and memory exponents at most 0.45.
  falsification_criterion: >-
    A B^5 leaf expansion, B^3 transition state, whole-fiber multiplicity that kills
    the first jet, source correction deck, missed or false source, special-family
    restriction, or complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-242/semantic_merge_receipt.md
    - ideas/artifacts/ECDLP-IDEA-242/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-242/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-242/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-242
  from: coordinator
  to: executor
  objective: Preserve the retired IDEA-195/P1537 semantic merge; do not dispatch it.
  uncertainty_reduced: Exact seven-channel transport is proved by P1537; compact generic-prime evaluation and rational-source return are not supplied.
  inputs:
    - ideas/rejected/ECDLP-IDEA-242_coloured_norm_jet_compositional_tower_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-242_norm_jet_tower_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply a source-labelled tower, colour after observing a source, or accept a trace-only intertwiner.
    - Charge the complete factor-base-to-target path and both time and memory.
  deliverables:
    - semantic merge map to IDEA-195 and ECFG-P1536-R1/P1537-R1
    - compact generic-prime seven-channel evaluator or scoped no-candidate proof
    - all-strata rational-source inverse and independent theorem review
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
