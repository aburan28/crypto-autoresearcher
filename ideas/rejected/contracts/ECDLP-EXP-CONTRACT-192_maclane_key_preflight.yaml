experiment:
  id: EXP-ECDLP-IDEA-192-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-192
  lane: representation_changing
  version: 1
  title: MacLane compact key-chain source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_valuation_chain_requires_dense_eliminant_or_source_orientation_after_independent_review
  objective: >-
    Decide symbolically whether an elliptic endpoint directly yields a compact target-uniform
    MacLane key-polynomial chain that separates every exact signed factor-base source on all
    strata without constructing a dense eliminant, selecting a root, or materializing B^m branches.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    compact_endpoint_key_chain: unresolved
    all_strata_source_biconditional: unresolved
    exact_residual_source_lift: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-192" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published MacLane chains built from supplied valued polynomials and augmentations
    - dense endpoint eliminants with explicit root or branch orientation
    - exhaustive labelled source enumeration, Pollard rho, and BSGS
    - known-log endpoints and fresh masked blind targets
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - key-chain length, key degree, residual degree, value group, and branch multiplicity
    - known endpoint versus masked blind target
    - smooth all-distinct, collision, repeated, infinity, and empty strata
  metrics:
    primary:
      - endpoint-derived key-chain status and exact labelled-source recall
      - eliminant, chain, residual lift, output, and ambiguity exponents
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, rank, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or a Phase 0 theorem is unresolved.
    - Stop if the chain requires a dense eliminant, a chosen source root, or source-indexed augmentation data.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied valued polynomial, dense resultant, root orientation, post-hoc selector, or explicit branch table invalidates the arm.
    - Replacing elimination with a valuation backend without a compact endpoint compiler is a control.
    - Omitted construction, chain growth, output, rank, descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a compact endpoint-derived key chain, an all-strata
    exact source biconditional and residual lift, and complete time and memory exponents
    at most 0.45.
  falsification_criterion: >-
    Dense eliminant input, shared generic valuations, source-indexed augmentations,
    B^m total key/output size, one missed source, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-192/compact_key_chain_theorem.md
    - ideas/artifacts/ECDLP-IDEA-192/source_biconditional_spec.md
    - ideas/artifacts/ECDLP-IDEA-192/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-192/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-192/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-192
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether endpoint-derived MacLane keys can separate point sources without importing dense elimination or source orientation.
  inputs:
    - ideas/rejected/ECDLP-IDEA-192_maclane_key_polynomial_valuation_chain_source_lift_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-192_maclane_key_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No dense eliminant, supplied root, scalar orientation, source-indexed key data, or post-hoc selector.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - compact endpoint-derived key-chain theorem or dense-input lower bound
    - all-strata exact source biconditional or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
