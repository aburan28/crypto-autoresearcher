experiment:
  id: EXP-ECDLP-IDEA-182-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-182
  lane: conservative
  version: 1
  title: Lagrange-Good endpoint coefficient-oracle theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_source_generating_function_requires_source_deck_after_independent_review
  objective: >-
    Decide symbolically whether an endpoint-conditioned multivariate source species
    admits compact Lagrange-Good coefficient access and exact labelled leaf recovery
    without enumerating or materializing the B^m source deck.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_coefficient_oracle: unresolved
    labelled_leaf_inverse: unresolved
    source_deck_lower_bound: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-182" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published multivariate Lagrange-Good inversion with an explicitly supplied series
    - unmarked endpoint generating series returning aggregate counts only
    - exhaustive labelled source enumeration, Pollard rho, and BSGS
    - known-log endpoints and fresh masked blind targets
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - relation arity, marking alphabet, truncation order, and coefficient query
    - known endpoint versus masked blind target
    - signs, multiplicities, collisions, infinity, and empty fibers
  metrics:
    primary:
      - endpoint-only coefficient-oracle status and exact labelled-source recall
      - source-series support, construction, query, output, and ambiguity exponents
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - relation density, rank, factor logs, masked descent, verification, and peak memory
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or a Phase 0 theorem is unresolved.
    - Stop if coefficient access presupposes source enumeration or point-labelled support.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied recursive series, explicit source table, post-hoc selector, or dense resultant invalidates the arm.
    - A solver substitution or parameter-only improvement is a control.
    - Omitted construction, query, output, rank, descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish target-uniform endpoint-only coefficient access,
    exact labelled source recovery on every stratum, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Required B^m marked support, aggregate-only coefficients, one missed or false
    source, hidden source advice, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-182/lagrange_good_coefficient_oracle_theorem.md
    - ideas/artifacts/ECDLP-IDEA-182/source_species_spec.md
    - ideas/artifacts/ECDLP-IDEA-182/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-182/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-182/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-182
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether Lagrange-Good inversion can obtain exact point-labelled leaves from an endpoint without a source-series oracle.
  inputs:
    - ideas/rejected/ECDLP-IDEA-182_multivariate_lagrange_good_source_species_inversion_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-182_lagrange_good_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied series, explicit source deck, scalar orientation, or post-hoc source selector.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - endpoint-only coefficient-oracle theorem or source-deck lower bound
    - exact labelled-leaf inverse theorem or collision family
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
