  from: coordinator
  to: executor
  objective: Preserve the retired Elekes-Szabo group-chart theorem review; do not dispatch it.
  uncertainty_reduced: Whether classification as group-like can yield a subset-stable exact restricted-fibre decision or discrete-log-free direct section over the finite fields in scope.
  inputs:
    - ideas/rejected/ECDLP-IDEA-360_elekes_szabo_group_chart_source_uniformization_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-360_elekes_szabo_group_chart_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply scalar/source sections, DLP oracles, complex-only theorems, post-hoc selectors, or uncharged exceptional loci.
    - Charge classification, chart construction, inversion, source output, rank, logs, descent, verification, and memory.
  deliverables:
    - finite-field theorem-domain, restricted-decision, and chart-separation receipt
    - chart-automorphism and all-strata source audit
    - complete zero-run P1553 cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
