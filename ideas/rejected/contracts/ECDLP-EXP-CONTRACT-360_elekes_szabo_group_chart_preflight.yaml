experiment:
  id: EXP-ECDLP-IDEA-360-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-360
  lane: high_risk
  version: 1
  title: Elekes-Szabo group-chart source-uniformization preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: group_like_classification_restates_public_curve_law_without_subset_stable_exact_restricted_fibre_decision
  objective: >-
    Preserve the high-risk theorem and input audit for a finite-field group-chart
    source section without dispatching an experiment.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    positive_characteristic_classification_domain: unresolved
    endpoint_only_rational_group_chart: unresolved
    subset_stable_exact_restriction_decision: unresolved
    discrete_log_free_direct_section_or_logarithmic_bisection: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-360" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied rational group surfaces with explicit labelled sections and known chart inverses
    - chart automorphisms, source permutations, exceptional loci, P1434, H676, P1553-FD-R2, rho, and BSGS
  independent_variables:
    - chart dimension, degree, exceptional locus, fibre size, source ambiguity, target update, and factor-base beta
    - distinct, repeated, singular, infinity, signed, coloured, and ambiguous source strata
  metrics:
    primary:
      - theorem domain, chart construction, restricted decision correctness, bisection, exact source recall, relation rank, logs, blind descent, time, and memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - classification, chart, exceptions, inverse section, source output, verification, and bit cost
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any classification, chart, exception, or subset-stable decision theorem is unresolved.
    - Stop if chart inversion invokes DLP, enumerates source fibres, or omits one rational/exceptional stratum.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied scalar chart, source-labelled section, hidden DLP oracle, or complex-characteristic-only theorem invalidates the arm.
    - Correct classification of the known elliptic-curve law as group-like is only a positive control.
    - Omitted theorem, exception, inversion, output, rank, logs, descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish the finite-field theorem domain, an endpoint-only
    chart with a subset-stable exact restricted-fibre decision and charged O(log B)
    bisection or a discrete-log-free direct section, campaign/state at most B^(9/4),
    fresh query at most B^(5/4), blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    A chart equivalent to the public curve law that supplies no subset-stable exact
    restricted decision under the gates, reduction of every correction or direct section
    to DLP/source enumeration, one missed stratum, or either exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-360/theorem_domain_and_chart_obligations.md
    - ideas/artifacts/ECDLP-IDEA-360/chart_automorphism_collisions.json
    - ideas/artifacts/ECDLP-IDEA-360/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-360/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
