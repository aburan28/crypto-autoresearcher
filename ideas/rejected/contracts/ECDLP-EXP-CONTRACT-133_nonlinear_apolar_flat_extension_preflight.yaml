    - truncation degree, Hankel rank, nilpotent structure, and exceptional stratum
    - known relation target versus fresh masked blind target
    - source multiplicity, ambiguity, verification, and memory budgets
  metrics:
    primary:
      - target-local constructor and flat-extension biconditional
      - independent non-reduction proof against P1512 and P1513
      - setup, serialized-state, and memory exponents a, c, a_m, and c_m
      - query time/memory, output, ambiguity, density, and linear-algebra exponents k, k_m, o, u, delta, delta_t, ell, and ell_m
