  stopping_rules:
    - Do not run while this draft is retired or any Phase 0 theorem input is unresolved.
    - Stop if moment construction reduces to P1512, P1513, dense quotient materialization, or enumerated sources.
    - Any complete exponent strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after independent review of the constructor, biconditional, and non-reduction proofs.
  invalidation_rules:
    - A flat supplied moment matrix without a compact elliptic constructor is only a positive control.
    - A relation certificate or aggregate spectrum without exact source multiplicity is insufficient.
    - Omitting coefficient growth, flatness work, output, rank, blind descent, verification, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 constructs the nonlinear target-local functional directly
    from compact elliptic equations, proves the complete source biconditional and
    non-reduction boundary, and derives full time and memory exponents at most 0.45.
  falsification_criterion: >-
    One missed or false source, reduction to a closed P1512/P1513 route, an
    Omega(r^(5/2)) intermediate, or a complete time or peak-memory exponent at
    least 0.50 closes the mechanism.
