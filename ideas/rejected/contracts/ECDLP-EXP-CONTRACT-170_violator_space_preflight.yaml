experiment:
  id: EXP-ECDLP-IDEA-170-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-170
  lane: conservative
  version: 1
  title: Violator-space source-basis theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: merged_completion_oracle_backend_after_independent_review
  objective: >-
    Decide symbolically whether endpoint factor constraints define a bounded-dimension
    violator space with an endpoint-only violation oracle and an exact all-strata
    basis-to-source inverse within the complete rho/BSGS cost gate.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    violator_consistency: unresolved
    violator_locality: unresolved
    bounded_dimension: unresolved
    exact_basis_source_biconditional: unresolved
    endpoint_only_oracle: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-170" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published low-dimensional violator spaces with independently checkable oracles
    - planted elliptic tuples with supplied extension answers
    - direct source enumeration and materialized pair or triple decks
    - Pollard rho and BSGS
  independent_variables:
    - curve instance, field size, and factor-base exponent beta
    - known endpoint versus masked blind target
    - sign, repetition, infinity, collision, and no-decomposition strata
    - sampled basis size and oracle-call count
  metrics:
    primary:
      - consistency and locality counterexamples
      - exact source recall, false bases, and endpoint-only oracle status
      - lambda=max(a,beta+delta+q+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - sampling, retries, failures, output, rank, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired, status is review_required, or any Phase 0 theorem is unresolved.
    - Stop at the first locality failure, circular completion oracle, or lost or false source.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied completion bit, source tuple, post-hoc basis, or materialized tuple table invalidates the arm.
    - A solver substitution without a new endpoint-only violation operation is a control.
    - Omitted oracle calls, retries, output, rank, descent, verification, or memory invalidate the model.
  success_criterion: >-
    Independent proofs establish the violator axioms, bounded dimension, exact
    all-strata source biconditional, endpoint-only oracle, and complete time and
    memory exponents at most 0.45.
  falsification_criterion: >-
    One locality failure, source-completion reduction, missed or false source,
    hidden source advice, or a complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-170/violator_axiom_theorem.md
    - ideas/artifacts/ECDLP-IDEA-170/violation_oracle_spec.md
    - ideas/artifacts/ECDLP-IDEA-170/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-170/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-170/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-170
  from: coordinator
  to: executor
  objective: Preserve the retired conservative theorem preflight as merge evidence; do not dispatch it.
  uncertainty_reduced: Whether a valid endpoint-only violator oracle exposes exact sources without solving source completion.
  inputs:
    - ideas/rejected/ECDLP-IDEA-170_violator_space_source_basis_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-170_violator_space_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - No supplied completion answers, source tuples, post-hoc bases, or source tables.
    - Charge the complete factor-base-to-target path.
  deliverables:
    - violator-axiom and bounded-dimension theorem or counterexample
    - exact source-basis and endpoint-only-oracle theorem or obstruction
    - complete cost receipt and independent review
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
