experiment:
  id: EXP-ECDLP-IDEA-279-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-279
  lane: conservative
  version: 1
  title: Stieltjes-Jacobi Gaussian-quadrature source theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: source_faithful_moments_or_atom_pairing_materializes_the_source_fiber
  objective: >-
    Decide theorem-first whether compact endpoint-only moments and Stieltjes-Jacobi
    quadrature can return exact paired factors without materializing the source fiber.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    compact_endpoint_source_moments: unresolved
    all_strata_stieltjes_jacobi_atomizer: unresolved
    exact_signed_atom_pairing_and_return: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-279" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied discrete measures with labelled atoms, identifying moments, and nonsingular Jacobi recurrences
    - truncated colliding moments, unpaired coordinate marginals, source-labelled moments, rho, and BSGS
  independent_variables:
    - source dimension, moment order, Hankel rank, atom count, pairing ambiguity, and factor-base beta
    - distinct versus repeated atoms and nonsingular versus isotropic or inseparable recurrences
    - signed, repeated, infinity, ramified, singular, and ambiguous source tuples
  metrics:
    primary:
      - moment construction, atom recall, pairing recall, false outputs, relation rank, target descent, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - Hankel and Jacobi state, roots, weights, pairing branches, factor logs, masked descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the compact-moment/atom-pairing theorem is unresolved.
    - Stop if moment generation enumerates the source fiber or atomization omits any source stratum.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled moments, known-log pairing advice, or uncharged mixed moments invalidate the arm.
    - Correct atomization of a supplied discrete measure is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish compact endpoint-only source-faithful moments, exact
    all-strata atom pairing and factor return, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Moment collisions, unpaired marginals, moment or atom state at least N^0.50, one missing
    source stratum, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-279/stieltjes_jacobi_atomizer_theorem.md
    - ideas/artifacts/ECDLP-IDEA-279/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-279/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-279/cost_analysis.md
  assigned_to: none
  approved_by: null

