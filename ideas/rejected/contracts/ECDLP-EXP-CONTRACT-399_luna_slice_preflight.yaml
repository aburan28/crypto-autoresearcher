experiment:
  id: EXP-ECDLP-IDEA-399-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-399
  lane: representation-changing
  version: 1
  title: Luna etale-slice occurrence-lift preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: slice_requires_supplied_action_and_local_quotient_lift_does_not_return_factor_occurrences
  objective: >-
    Preserve a theorem-only audit of whether endpoint data construct a complete
    finite Luna-slice atlas with an exact restriction-stable quotient-to-occurrence lift.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_reductive_action: unresolved
    complete_subgate_slice_atlas: unresolved
    restriction_stable_quotient_source_lift: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-399" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_supplied_reductive_action_with_labelled_closed_orbits_and_slices
    - positive_exact_quotient_and_lift_replay
    - negative_equal_quotient_with_permuted_factor_occurrences
    - negative_nonclosed_orbit_and_stabilizer_ambiguity
  independent_variables:
    - action_orbit_stabilizer_and_slice_interface
    - atlas_chart_count_and_transition_state
    - quotient_point_and_occurrence_lift_policy
    - restriction_depth_and_target_freshness
    - beta_sensitivity_and_all_p1553_strata
  metrics:
    primary:
      - exact_occurrence_source_is_lifted_from_endpoint_constructed_slice_data
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - every_action_orbit_stabilizer_slice_transition_and_occurrence_label_is_fully_charged
      - slice_atlas_is_frozen_before_targets_and_reused_under_all_restrictions
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_action_or_slice_construction_requires_explicit_source_incidence
    - stop_if_one_quotient_point_has_multiple_unresolved_occurrence_lifts
    - stop_if_setup_or_atlas_state_exceeds_B_to_the_9_over_4
    - stop_if_restriction_replay_or_source_lift_exceeds_B_to_the_5_over_4
    - stop_if_one_occurrence_label_or_complete_chart_stratum_is_merged_or_missed
    - stop_if_any_complete_exponent_reaches_0_50
  invalidation_rules:
    - invalidate_if_a_supplied_action_or_slice_is_confused_with_endpoint_construction
    - invalidate_if_orbits_or_charts_are_target_fitted_or_source_enumerated
    - invalidate_if_quotient_membership_is_substituted_for_occurrence_source_lift
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_curve_scale
  success_criterion: >-
    A complete theorem constructs the action and finite slice atlas from endpoint
    data, proves exact restriction-stable occurrence lift, and satisfies every state,
    query, campaign, memory, and descent gate.
  falsification_criterion: >-
    The preflight is falsified by source-bearing action or slice data, one quotient/source
    collision, missing chart, supergate work, or complete exponent at least 0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-399/luna_slice_source_obligations.md
    - ideas/artifacts/ECDLP-IDEA-399/quotient_lift_collisions.json
    - ideas/artifacts/ECDLP-IDEA-399/slice_transition_receipt.json
    - ideas/artifacts/ECDLP-IDEA-399/cost_analysis.md
  assigned_to: none
  approved_by: null

