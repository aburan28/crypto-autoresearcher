experiment:
  id: EXP-ECDLP-IDEA-250-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-250
  lane: high_risk
  version: 1
  title: Frobenius-compatible source-strata theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: generic_etale_splitting_is_point_blind_and_nonreduced_multiplicity_unresolved
  objective: >-
    Decide theorem-first whether a source-free compatible Frobenius splitting can
    distinguish every rational point and multiplicity of an endpoint relation
    fiber without primitive idempotents or point ideals.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    compactification_and_splitting: unresolved
    compatible_source_strata: unresolved
    finite_etale_point_blindness_audit: required
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-250" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied compatibly split Schubert and diagonal varieties
    - finite reduced algebras with independently supplied primitive idempotents
    - source permutations, generic etale and nilpotent fibers, IDEA-094, IDEA-197, IDEA-222, rho, and BSGS
  independent_variables:
    - compactification, splitting section, compatible strata, residue map, and mask
    - ordinary versus supersingular curve family
    - reduced, repeated, infinity, signed, and nonreduced source strata
  metrics:
    primary:
      - exact point and multiplicity recall, false sources, splitting state, output, rank, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - compactification size, Frobenius iterations, residue traffic, factor logs, descent, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the compatible point-section theorem is unresolved.
    - Stop if compatibility requires primitive idempotents, point ideals, or source-labelled boundary divisors.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - A supplied point decomposition or uncharged nonreduced primary split invalidates the arm.
    - Cohomology vanishing or a tautological etale splitting is only a control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a source-free compatible splitting, exact point
    and multiplicity section on every stratum, and complete time and memory
    exponents at most 0.45.
  falsification_criterion: >-
    Point-blind etale splitting, one source permutation collision, lost nilpotent
    multiplicity, retained point ideals, or exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-250/frobenius_split_source_theorem.md
    - ideas/artifacts/ECDLP-IDEA-250/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-250/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-250/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-250
  from: coordinator
  to: executor
  objective: Preserve the retired high-risk theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether Frobenius splitting can separate exact relation-fiber points rather than only split the structure sheaf.
  inputs:
    - ideas/rejected/ECDLP-IDEA-250_frobenius_split_source_strata_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-250_frobenius_split_source_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not supply primitive idempotents, point ideals, or source-labelled compatible strata.
    - Charge reduced, nonreduced, ordinary, supersingular, rank, factor-log, and blind-descent branches.
  deliverables:
    - compatible splitting/source-section theorem or finite-etale point-blindness proof
    - nonreduced multiplicity and supersingular-family audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
