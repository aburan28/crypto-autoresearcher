experiment:
  id: EXP-ECDLP-IDEA-362-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-362
  lane: conservative
  version: 1
  title: Sparse nonnegative-convolution endpoint-index preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: sparse_convolution_requires_dlp_free_endpoint_index_and_source_ancestry_while_generic_output_restores_cubic_or_quartic_traffic
  objective: >-
    Preserve a theorem-only conservative audit of whether endpoint-indexed sparse
    nonnegative convolution can expose an exact target coefficient without a
    discrete-log oracle, source replay, or super-gate output traffic.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    dlp_free_addition_compatible_endpoint_index: unresolved
    subgate_sparse_input_and_output_support: unresolved
    subset_stable_exact_restriction_updates: unresolved
    nonnegative_coefficient_source_biconditional: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-362" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_planted_sparse_integer_sumsets_with_exact_known_target_coefficient
    - positive_synthetic_subset_restrictions_with_preserved_endpoint_index
    - negative_random_elliptic_endpoint_decks_with_coordinate_carries
    - negative_p1435_p1553_source_blind_query2p1_boundary
  independent_variables:
    - endpoint_index_construction
    - input_and_output_support_exponents
    - endpoint_collision_multiplicity
    - subset_restriction_depth
    - beta_sensitivity_and_all_p1553_deck_strata
  metrics:
    primary:
      - exact_target_coefficient_is_computable_from_endpoint_data_with_no_source_ancestry
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - endpoint_index_is_dlp_free_addition_compatible_and_subset_stable
      - every_reported_positive_coefficient_has_a_source_blind_biconditional_certificate
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_any_endpoint_index_evaluation_requires_a_discrete_log_or_source_tuple
    - stop_if_sparse_output_or_update_traffic_exceeds_the_campaign_or_online_gate
    - stop_if_subset_restriction_invalidates_the_exact_target_coefficient_test
    - stop_if_the_coefficient_certificate_is_only_a_relation_validity_receipt
  invalidation_rules:
    - invalidate_if_the_positive_controls_fail_to_recover_the_planted_coefficient
    - invalidate_if_endpoint_collisions_or_coordinate_carries_merge_incompatible_sources
    - invalidate_if_any_cost_term_or_rebuild_is_omitted_from_the_exponent_ledger
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_a_curve_scale_result
  success_criterion: >-
    A complete theorem receipt proves a DLP-free, addition-compatible endpoint
    index with sub-gate sparse support, subset-stable exact restrictions, and a
    source-blind target-coefficient biconditional while satisfying every stated
    campaign, online, memory, and factor-log gate.
  falsification_criterion: >-
    The preflight is falsified if every compatible endpoint index requires a
    discrete log or source ancestry, if generic support/output traffic breaches
    the gates, or if exact subset restriction cannot preserve the coefficient
    decision.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-362/endpoint_index_obligations.md
    - ideas/artifacts/ECDLP-IDEA-362/sparse_support_collision_cases.json
    - ideas/artifacts/ECDLP-IDEA-362/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-362/cost_analysis.md
  assigned_to: none
  approved_by: null

