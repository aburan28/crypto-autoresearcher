experiment:
  id: EXP-ECDLP-IDEA-367-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-367
  lane: high_risk
  version: 1
  title: AMP-Onsager exact-support preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: endpoint_measurement_channel_lacks_proved_iid_universality_and_exact_support_certificate_without_source_dictionary
  objective: >-
    Preserve a theorem-only high-risk audit of whether an endpoint-derived
    measurement channel supports AMP with an Onsager correction, valid state
    evolution, and zero-error source support recovery without emitting a source
    dictionary or replaying Query2P1.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    endpoint_only_measurement_ensemble: unresolved
    source_free_sparse_dictionary: unresolved
    finite_field_amp_universality_theorem: unresolved
    zero_error_exact_support_certificate: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-367" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - positive_iid_gaussian_planted_sparse_channel_with_known_support
    - positive_synthetic_ensemble_satisfying_a_proved_state_evolution_hypothesis
    - negative_structured_finite_field_endpoint_channel_with_correlated_columns
    - negative_source_dictionary_and_query2p1_replay_boundaries
  independent_variables:
    - endpoint_measurement_ensemble
    - column_correlation_and_sparsity
    - onsager_correction_definition
    - denoiser_and_exact_support_threshold
    - beta_sensitivity_and_all_p1553_deck_strata
  metrics:
    primary:
      - zero_error_support_recovery_is_certified_from_endpoint_measurements_without_source_columns
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - a_finite_field_universality_theorem_justifies_state_evolution_for_the_actual_channel
      - exact_support_certification_has_zero_false_positive_and_false_negative_probability
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - stop_if_constructing_a_measurement_column_requires_source_enumeration_or_query2p1
    - stop_if_iid_or_universality_assumptions_fail_for_the_endpoint_channel
    - stop_if_state_evolution_only_predicts_average_error_instead_of_exact_support
    - stop_if_any_campaign_online_memory_or_factor_log_gate_is_breached
  invalidation_rules:
    - invalidate_if_the_positive_controls_fail_under_their_stated_ensemble_assumptions
    - invalidate_if_the_onsager_term_is_fitted_post_hoc_to_known_support
    - invalidate_if_exact_support_is_replaced_by_relation_validity_or_nonzero_correlation
    - invalidate_if_toy_or_model_bound_evidence_is_reported_as_a_curve_scale_result
  success_criterion: >-
    A complete theorem receipt proves an endpoint-only source-free measurement
    ensemble, a valid finite-field AMP universality result with its Onsager term,
    and zero-error exact support certification while satisfying every campaign,
    online, memory, and factor-log gate.
  falsification_criterion: >-
    The preflight is falsified if the measurement ensemble requires source
    columns, if structured endpoint correlations invalidate state evolution, or
    if AMP supplies only heuristic average-error recovery rather than an exact
    source certificate.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-367/measurement_ensemble_obligations.md
    - ideas/artifacts/ECDLP-IDEA-367/state_evolution_and_support_cases.json
    - ideas/artifacts/ECDLP-IDEA-367/source_replay_receipt.json
    - ideas/artifacts/ECDLP-IDEA-367/cost_analysis.md
  assigned_to: none
  approved_by: null

