experiment:
  id: EXP-ECDLP-IDEA-013-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-013
  lane: conservative
  version: 1
  title: Elliptic-normal secant-syzygy witness and cost preflight
  status: review_required
  objective: >-
    Determine whether an elliptic-normal secant syzygy can recover actual
    factor-base-supported point tuples, rather than only detect secant membership,
    with complete relation, linear-algebra, target-descent, and bit-memory exponents
    below 1/2 and with a measured separation from aggregate-divisor and Semaev controls.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    field_bit_sizes: [13, 14, 15, 16, 17, 19, 21, 24]
    independent_curves_per_size: 30
    embedding_degrees: [5, 6, 8, 10]
    decomposition_arities: [3, 4]
    factor_base_beta_targets: [0.15, 0.18, 0.20]
    exhaustive_truth_max_bits: 17
    focal_arm:
      embedding_degree: 6
      arity: 3
      beta: 0.18
    seeds: [20260717131, 20260717132, 20260717133]
    finite_size_fit: preregistered log-log slope with inverse-log correction and leave-largest-size-out sensitivity
  controls:
    - planted elliptic-normal secants with known factor-base atoms
    - exhaustive support enumeration through 17 bits
    - random tensors with matched dimensions and rank
    - aggregate complement-divisor queries from ECDLP-IDEA-012 on identical inputs
    - ordinary Semaev membership-quotient queries on identical inputs
    - rank-only outputs barred from witness and promotion metrics
    - explicit construction and storage of every flattening matrix charged
  independent_variables:
    - field bit size
    - curve instance
    - embedding degree
    - decomposition arity
    - factor-base exponent
    - target point
    - decoder and matched-control mechanism
  metrics:
    primary:
      - target-independent build exponent a
      - witness-query exponent beta*kappa
      - reciprocal relation and target density exponents delta and delta_t
      - sparse-linear-algebra exponent omega_s*beta
      - full time exponent lambda=max(a,beta+delta+beta*kappa,omega_s*beta,delta_t+beta*kappa)
      - full bit-memory exponent mu
    secondary:
      - exhaustive support precision and recall
      - rank-only versus atom-recovering query counts
      - ambiguous and exceptional secant counts
      - verified relation-matrix rank and density
      - operations and bytes per matrix construction and query
      - matrix equivalence to aggregate and membership-quotient controls
  replication:
    independent_instances: 240
    relation_queries_per_cell: 1000
    target_descents_per_largest_size: 100
    rerun_same_seed: true
  budget:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 480
    maximum_memory_gb: 48
    maximum_runs: 16000
    maximum_output_gb: 80
  stopping_rules:
    - Stop exhaustive enumeration after 17 bits and continue only preregistered mechanism and control arms.
    - Stop an arm after two consecutive sizes exceed 44 GB median peak memory; retain cells as censored_by_budget.
    - Halt inference after any accepted support fails independent curve addition and implementation validation.
  invalidation_rules:
    - A mismatch with exhaustive truth invalidates the implementation cell, not the mathematical hypothesis, until independently reproduced.
    - A rank drop, determinant zero, or secant-membership certificate without point witnesses cannot enter relation metrics.
    - A target-indexed table, known-log oracle, explicit B^m tuple table, or post-hoc selector invalidates the mechanism arm.
    - Matrix equivalence to an occupied aggregate or membership-quotient operation without a cost separation makes the arm a duplicate control.
    - A timeout, crash, unsupported exceptional divisor, or dependency failure is infrastructure or coverage evidence only.
  success_criterion: >-
    Zero wrong witnesses and at least 99.9 percent exhaustive agreement; at least
    1000 independently verified relations and 100 target descents at each of the two
    largest completed sizes; upper 95 percent bounds kappa<=0.25, a<=0.45,
    lambda<=0.45, and mu<=0.45 in the focal arm; stable finite-size sensitivity;
    and a demonstrated operation and cost separation from both matched controls.
  falsification_criterion: >-
    After implementation validation, useful flattenings cannot recover atoms; their
    dimension, rank, build, query, or memory has lower 95 percent exponent at least
    0.50; the construction is matrix-equivalent to an occupied mechanism without a
    cost separation; or every complete-cost arm has lower 95 percent lambda>=0.50.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-013/implementation.md
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/supports.jsonl
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/costs.tsv
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-013/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-013/analysis.md
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-013
  from: coordinator
  to: executor
  objective: Implement and run the frozen secant-syzygy witness and cost preflight exactly after approval.
  uncertainty_reduced: Whether a syzygy flattening returns factor-base atoms below occupied support-recovery baselines.
  inputs:
    - ideas/ECDLP-IDEA-013_elliptic_normal_secant_syzygy_decoder_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-013_secant_syzygy_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Preserve every query, miss, rank-only result, ambiguity, exceptional secant, and censored cell.
    - Do not interpret correct syzygies, valid relations, or toy scalar recovery as promotion.
  deliverables:
    - immutable support and cost records
    - exhaustive-agreement and matrix-equivalence report
    - relation and target-descent density fits
    - complete rho and BSGS comparison with finite-size sensitivity
  budget:
    wall_clock_seconds: 1728000
    memory_gb: 48
    maximum_runs: 16000
  completion_gate:
    - Every planned cell has a terminal state.
    - Every accepted support and recovered scalar independently verifies.
    - Raw results, resource metrics, and summaries agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
