experiment:
  id: EXP-ECDLP-IDEA-098-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-098
  lane: conservative
  version: 1
  title: Squarefree degeneration, shelling, and exact source-lift theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: no_universal_squarefree_weight_facet_navigation_or_exact_source_lift_theorem
  objective: >-
    Gate all computation on an explicit target-independent weight whose complete
    relation ideal has a squarefree initial ideal, a shelling or navigation rule
    that does not enumerate the relation fiber, and a unique exact lift from each
    accepted facet to signed factor-base sources.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    source_complete_relation_ideal: unresolved
    target_independent_weight: unresolved
    squarefree_initial_ideal: unresolved
    shelling_or_navigation_rule: unresolved
    exact_generic_source_lift: unresolved
    decomposition_arities: [3, 4, 5]
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: sha256("ECDLP-IDEA-098" || field_bits || curve_index || "20260717")
    future_prng: ChaCha20-IETF
    future_prng_key: full_32_byte_seed_digest
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - published squarefree Grobner degenerations with independently checkable shellings
    - planted zero-dimensional ideals whose facets lift bijectively to labelled roots
    - generic and non-squarefree initial ideals matched for degree and arithmetic work
    - saturated Semaev elimination and explicit source enumeration baselines
    - Pollard rho and BSGS under matched operation and memory accounting
  independent_variables:
    - curve instance, field size, and decomposition arity
    - factor-base exponent beta
    - frozen term order, weight, and shelling order
    - known relation target versus masked blind target
    - facet, lift-branch, ambiguity, and output budgets
  metrics:
    primary:
      - exact initial-ideal and squarefreeness verification
      - facet-to-source biconditional and unique-lift agreement
      - B=N^beta and weight/Grobner setup time and memory exponents g and gm
      - Stanley-Reisner complex/facet-state exponent f and per-facet shelling, lift, and source-inverse exponent k
      - reciprocal relation and target success exponents delta and delta_t
      - emitted facet/source and target ambiguity exponents o and u
      - factor-log linear-algebra time and memory exponents ell and ell_m
      - lambda=max(g,f,beta+delta+k+o,ell,delta_t+k+o+u,beta)
      - mu=max(gm,f,beta+o,ell_m,u)
    secondary:
      - lost, false, ambiguous, repeated, and exceptional source counts
      - relation rank, blind recovery, wall time, operations, and serialized bytes
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while this draft is retired or any Phase 0 mathematical input is unresolved.
    - Stop after proof that accepted facets or lift branches enumerate the complete generic relation fiber.
    - Any complete exponent bound strictly above 0.45 and strictly below 0.50 is inconclusive and cannot promote.
    - A versioned successor may scale only after independent verification of a universal weight and exact source lift.
  invalidation_rules:
    - A solver or term-order substitution without a source-biconditional degeneration is a control.
    - Target-selected weights, post-hoc facets, hidden source tables, or factor-log labels invalidate the arm.
    - Every relation attempt, miss, duplicate, and rejected row counts against the frozen attempt ceiling and charged cost.
    - Omitting Grobner construction, facet output, lift branches, rank, descent, or memory invalidates cost claims.
    - Timeout, dependency failure, and budget censoring are not mathematical falsification.
  success_criterion: >-
    A versioned Phase 0 proves a target-independent squarefree degeneration,
    sub-rho accepted-facet navigation, an exact unique source lift on complete
    charts, and full relation, rank, blind-descent, output, time, and memory
    exponents at most 0.45.
  falsification_criterion: >-
    No universal squarefree weight, one generic lost or ambiguous source, facet
    or lift output exponent at least 0.50, or proof that source-biconditional
    navigation enumerates the complete relation fiber closes the mechanism.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-098/squarefree_source_gate.md
    - ideas/artifacts/ECDLP-IDEA-098/compressed_navigator_gate_v1.md
    - ideas/artifacts/ECDLP-IDEA-098/recursive_s3_grammar_spec_v1.yaml
    - ideas/artifacts/ECDLP-IDEA-098/recursive_s3_local_separator_trichotomy_v1.md
    - ideas/artifacts/ECDLP-IDEA-098/recursive_s3_field_router_candidate_v1.md
    - ideas/artifacts/ECDLP-IDEA-098/p1515_r1_r5_independent_audit.md
    - ideas/artifacts/ECDLP-IDEA-098/degeneration_spec.yaml
    - ideas/artifacts/ECDLP-IDEA-098/squarefree_shelling.sage
    - ideas/artifacts/ECDLP-IDEA-098/verify_shelling_sources.py
    - ideas/artifacts/ECDLP-IDEA-098/analysis.md
  assigned_to: none
  approved_by: null

