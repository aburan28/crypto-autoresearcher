experiment:
  id: EXP-ECDLP-IDEA-296-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-296
  lane: representation_changing
  version: 1
  title: Ronkin-amoeba source-section theorem preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: amoeba_spine_lacks_canonical_root_labels_and_depends_on_noncanonical_lift
  objective: >-
    Decide theorem-first whether a canonical bounded Laurent lift and Ronkin-spine
    chamber can return every exact finite-field factor without source-sized phase data.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    canonical_source_faithful_lift: unresolved
    exact_chamber_to_factor_inverse: unresolved
    factor_base_beta_targets: [0.18, 0.20, 0.22]
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-296" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied Laurent polynomials with independently known amoebas, spines, phases, and roots
    - alternate lifts of one reduction, phase-permuted roots, source-labelled coamoebas, rho, and BSGS
  independent_variables:
    - lift height, coefficient precision, Newton support, chamber count, phase state, source arity, and factor-base beta
    - signed, repeated, singular, infinity, reduction-colliding, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, relation rank, factor-log completion, target descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - lift height, precision bits, cells, coamoeba phases, reduction branches, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or the canonical-lift/source-inverse theorem is unresolved.
    - Stop if phase labels or lift branches materialize the source fiber or any source stratum is absent.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Target-selected lifts, source-labelled phases, post-hoc chambers, or uncharged precision invalidate the arm.
    - Correct amoeba computation for a supplied polynomial is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a canonical bounded source-faithful lift, exact
    all-strata chamber inverse, blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Lift dependence, phase collision, source state/output at least N^0.50, one missing
    source stratum, target advice, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-296/ronkin_source_section_theorem.md
    - ideas/artifacts/ECDLP-IDEA-296/fixtures.json
    - ideas/artifacts/ECDLP-IDEA-296/independent_verifier.py
    - ideas/artifacts/ECDLP-IDEA-296/cost_analysis.md
  assigned_to: none
  approved_by: null

handoff:
  id: TASK-20260718-296
  from: coordinator
  to: executor
  objective: Preserve the retired representation-changing theorem gate as scoped negative evidence; do not dispatch it.
  uncertainty_reduced: Whether canonical Ronkin-spine data can section exact finite-field sources without phase materialization.
  inputs:
    - ideas/rejected/ECDLP-IDEA-296_ronkin_amoeba_spine_source_section_hypothesis.md
    - ideas/rejected/contracts/ECDLP-EXP-CONTRACT-296_ronkin_amoeba_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not use target-selected lifts, source-labelled phase tables, post-hoc chambers, or uncharged precision.
    - Charge lift height, Ronkin/spine construction, phase state, output, rank, factor logs, blind descent, and memory.
  deliverables:
    - canonical finite-field-faithful lift theorem or lift/phase/source-state obstruction
    - exact all-strata chamber inverse audit
    - complete cost receipt
  budget:
    wall_clock_seconds: 1209600
    memory_gb: 48
    maximum_runs: 0
  completion_gate:
    - Every theorem obligation is proved, disproved, or explicitly unresolved.
    - No experiment, solver, relation campaign, or scaling run occurred under this retired draft.
    - Any artifact actually produced is ID-scoped and checksummed; prospective paths need not exist under this retired draft.
  return_format: theorem_review
