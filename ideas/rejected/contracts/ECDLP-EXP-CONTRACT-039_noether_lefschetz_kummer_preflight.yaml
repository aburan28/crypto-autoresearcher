experiment:
  id: EXP-ECDLP-IDEA-039-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-039
  lane: representation_changing
  version: 1
  title: Noether-Lefschetz Kummer marked-class lifting preflight
  status: review_required
  objective: >-
    Determine, before any ECDLP recovery experiment, whether a non-generic divisor class
    constructed on a Picard-rank-jump Kummer fiber can pass exact first- and second-order
    lifting obstructions, be algebraized with bounded equations, and retain marked
    intersection data that gives a scalar-blind relation on the original elliptic curve.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
    correctness_is_not_promotion: true
  inputs:
    characteristics: [101, 103, 107, 109, 127]
    excluded_characteristics: [2, 3]
    curves_per_characteristic: 4
    curve_selection_rule: >-
      Enumerate short Weierstrass pairs (a,b) lexicographically with least nonnegative
      residues; retain nonsingular ordinary curves whose group order has a prime factor
      N at least p/2; choose the first four, and choose P as the lexicographically first
      affine point of exact order N.
    known_scalar_relation_points: [1, 2, 3, 5, 7, 11]
    factor_base_sizes: [4, 6, 8]
    deformation_pencils:
      - symmetric_coefficient_pencil_Km_Et_times_Et
      - asymmetric_coefficient_pencil_Km_Et_times_E0
    pencil_rule: >-
      Use E_t:y^2=x^3+(a+t)x+b and the least t in 1..16 for which both factors and the
      Kummer model are smooth; retain every rejected t with its exact reason.
    special_fiber_scan: >-
      Scan t in 1..16 in increasing order and retain the first two smooth fibers whose
      independently bounded geometric Picard rank exceeds the pencil-generic lower bound;
      absence of two such fibers is an applicability outcome.
    obstruction_orders: [1, 2]
    class_height_bounds: [2, 4, 8]
    finite_size_fit: preregistered exact-cost census plus log-log sensitivity; no crypto-scale extrapolation
  class_panel:
    persistent_positive_controls:
      - two factor classes
      - diagonal class
      - sixteen node exceptional classes
      - sixteen trope classes when present in the chosen model
    planted_special_control: >-
      Include the first eligible CM curve in the same enumeration as a separate labeled
      arm and its known extra endomorphism graph; never pool it with the generic arm.
    negative_controls:
      - first extra jump-fiber class failing the first-order obstruction
      - intersection-form-preserving random lattice vector outside the effective cone
    candidate_order: >-
      Primitive lattice vectors ordered by absolute self-intersection, then coefficient
      l1 norm, then lexicographic coordinates; no target-dependent reordering.
  controls:
    - persistent factor, diagonal, node, and trope classes must lift and verify
    - certified jump-only classes must be rejected by the obstruction gate
    - planted CM extra-endomorphism graph checks non-generic-class detection
    - random marked points measure accidental incidence at matched class height
    - known scalar correspondences are removed before relation rank or cost is scored
    - oracle lifted equations test only downstream intersection and group verification
  stage_gates:
    stage_0_geometry:
      - verify every Kummer equation, resolution chart, and intersection matrix
      - compute independent Picard-rank lower and upper bounds for every retained fiber
    stage_1_lifting:
      - run first-order obstruction on the complete frozen class panel
      - run second-order obstruction only on exact first-order survivors
      - require explicit equations or a separately verified algebraization certificate
    stage_2_marked_incidence:
      entry_condition: >-
        At least one non-generic non-CM class survives both obstruction orders on three
        unrelated ordinary curves and is not in the known factor/diagonal lattice.
      steps:
        - impose the frozen marked slices for R=[a]P with a in the known scalar list
        - pull back the lifted curve to E times E and compute complete intersection cycles
        - verify every induced elliptic-curve relation independently
    stage_3_target_plumbing:
      entry_condition: >-
        Stage 2 produces at least 100 scalar-blind verified relations with nonzero target
        coefficient and no known-scalar explanation.
      steps:
        - run ten blinded toy target descents per eligible curve using frozen public randomizers
        - treat successful scalar recovery only as plumbing correctness
  independent_variables:
    - characteristic and base curve
    - symmetric versus asymmetric pencil
    - generic, CM-control, and Picard-jump fiber
    - divisor-class height bound
    - obstruction order
    - factor-base size
    - known relation point versus blinded target
  metrics:
    primary:
      - exact first-order survivor count by class type
      - exact second-order survivor count by class type
      - non-generic algebraized lift count
      - useful marked-intersection relation count
      - known-scalar-explanation count
      - full time exponent lambda=max(s,nu_plus_h,beta_plus_delta_plus_kappa,2_beta,delta_t_plus_kappa_t,v)
      - full bit-memory exponent m=max(beta,nu,h,m_eq,m_class)
    secondary:
      - Picard-rank bounds and discriminants
      - class self-intersection and coefficient height
      - equation degree and coefficient bit length
      - obstruction construction and solve operations
      - intersection multiplicity and exceptional-component counts
      - projected relation rank
      - failed applicability and censored class counts
      - peak resident bytes and retained artifact bytes
  replication:
    planned_generic_curves: 20
    known_relation_points_per_curve: 6
    minimum_independent_non_generic_lift_curves: 3
    minimum_useful_relations_before_target_stage: 100
    blinded_targets_per_eligible_curve: 10
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 500
    maximum_memory_gb: 48
    maximum_runs: 2000
    maximum_output_gb: 80
  stopping_rules:
    - Stop before marked incidence if no non-generic class passes both obstruction orders on three unrelated ordinary curves.
    - Stop a pencil after every frozen special-fiber candidate fails for the same independently verified mathematical obstruction; retain the exact boundary.
    - Stop larger class-height panels after two consecutive cells exceed 44 GB peak memory; mark remaining cells censored_by_budget.
    - Halt on any accepted class, equation, intersection cycle, or group relation that fails independent verification and audit implementation validity before inference.
  invalidation_rules:
    - A class without exact lattice coordinates and an independently checked intersection form is invalid.
    - A formal survivor without explicit algebraization evidence cannot enter relation metrics.
    - A class in the factor, diagonal, node, trope, negation, or known-endomorphism span is a control, not a mechanism success.
    - Target-dependent special-fiber selection, class ordering, equation choice, or factor-base change invalidates the run.
    - An intersection certificate without complete exceptional-component accounting is invalid.
    - Timeouts, missing K3 functionality, and construction crashes are infrastructure or coverage outcomes, not mathematical negative evidence.
  success_criterion: >-
    Every positive and negative control has the expected exact disposition; at least one
    non-generic non-CM class passes both obstruction orders and algebraizes on at least
    three unrelated ordinary curves; at least 100 scalar-blind marked relations verify
    with nonzero target coefficient and no known-scalar explanation; and preregistered
    upper 95 percent bounds satisfy nu+h<=0.20, lambda<=0.45, and bit-memory m<=0.45.
    Success promotes only to a larger scaling contract, never to a breakthrough claim.
  falsification_criterion: >-
    Exact obstruction rejects every non-generic class, every survivor lies in the known
    generic correspondence lattice, all apparent marked relations disappear after
    exceptional and known-scalar controls, or the lower 95 percent full-cost lambda is at
    least 0.50 for every valid frozen cell.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-039/implementation.md
    - ideas/artifacts/ECDLP-IDEA-039/class_panel.json
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/manifest.yaml
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/command.txt
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/environment.json
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/geometry.json
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/obstructions.jsonl
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/intersections.jsonl
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/relations.jsonl
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/stdout.log
    - ideas/artifacts/ECDLP-IDEA-039/runs/<run-id>/stderr.log
    - ideas/artifacts/ECDLP-IDEA-039/analysis.md
    - ideas/artifacts/ECDLP-IDEA-039/checksums.sha256
  assigned_to: executor
  approved_by: null

handoff:
  id: TASK-20260717-039
  from: coordinator
  to: executor
  objective: Implement and execute the theorem-first Kummer marked-class lifting preflight exactly after approval.
  uncertainty_reduced: >-
    Whether any non-generic Picard-jump divisor survives exact lifting and marked-incidence
    gates, rather than special-fiber geometry merely disappearing or acting by a known scalar.
  inputs:
    - ideas/ECDLP-IDEA-039_noether_lefschetz_kummer_relation_lift_hypothesis.md
    - ideas/contracts/ECDLP-EXP-CONTRACT-039_noether_lefschetz_kummer_preflight.yaml
  constraints:
    - Do not run while status is review_required.
    - Do not enter marked incidence before the non-generic lift gate passes.
    - Preserve every failed class, obstruction, special-fiber applicability result, and known-scalar control.
    - Treat geometry, correctness, and toy scalar recovery as non-promotion observations.
  deliverables:
    - immutable geometry and class-panel records
    - independently verified obstruction traces
    - explicit lifted equations or algebraization certificates
    - complete marked-intersection and relation certificates when gated
    - full rho, BSGS, and bit-memory accounting
  budget:
    wall_clock_seconds: 1800000
    memory_gb: 48
    maximum_runs: 2000
  completion_gate:
    - Every frozen curve, pencil, fiber, and class cell has a terminal state.
    - Every positive and negative control has an independently verified disposition.
    - No marked-incidence or target arm ran without satisfying its stage entry condition.
    - All accepted equations, intersections, and relations verify independently.
    - Raw and summarized metrics agree.
    - All required artifact paths exist and are checksummed.
  return_format: execution_report
