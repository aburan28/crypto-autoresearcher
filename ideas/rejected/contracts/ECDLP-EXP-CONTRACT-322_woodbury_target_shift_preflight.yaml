experiment:
  id: EXP-ECDLP-IDEA-322-PREFLIGHT
  hypothesis_id: ECDLP-IDEA-322
  lane: abandoned_conservative_control
  version: 1
  title: Woodbury target-shift source-resolvent merge preflight
  status: review_required
  retired_from_dispatch: true
  retirement_reason: woodbury_backend_requires_supplied_source_resolvent_and_backsolve
  objective: >-
    Preserve a zero-run merge audit showing that the compact source-faithful resolvent,
    singular-hit kernel lemma, and exact backsolve are the missing P1552/P1553 operations.
  claim_boundary:
    evidence_scale: toy
    model_status: heuristic_model_bound
    novelty_status: novelty_unverified
    breakthrough_claim: false
  inputs:
    phase_0: theorem_only_no_runs
    implicit_resolvent_constructor: unresolved
    bounded_rank_target_shift_identity: unresolved
    all_strata_kernel_to_factor_inverse: unresolved
    promotion_factor_base_beta: 0.20
    nonpromoting_beta_sensitivity_controls: [0.18, 0.22]
    p1553_deck_policy: pairwise_disjoint_actual_point_decks_replace_colliding_known_targets_charge_blind_mask_resampling_and_rebuilds
    future_field_bit_sizes: [14, 16, 18, 20]
    future_curve_indices_per_size: "0..19"
    deterministic_seed_rule: 'sha256("ECDLP-IDEA-322" || field_bits || curve_index || "20260718")'
    future_prng: ChaCha20-IETF
    future_prng_nonce_hex: "000000000000000000000000"
    future_prng_initial_counter: 0
    future_byte_mapping: unsigned_big_endian_rejection_sampling
  controls:
    - supplied rank-one matrix updates with independently labelled kernel vectors
    - full-rank target shifts, equal-determinant source collisions, direct resultants, rho, and BSGS
  independent_variables:
    - resolvent dimension, target-shift rank, kernel dimension, back-substitution traffic, and factor-base beta
    - reduced, repeated, singular, infinity, signed, and ambiguous source strata
  metrics:
    primary:
      - exact source recall, false outputs, update rank, relation rank, factor-log completion, blind descent, time, and peak memory
      - lambda=max(a,beta+delta+q-r+o,ell,delta_t+q+o+u,beta)
      - mu=max(a_m,q_m,beta+o,ell_m,u)
    secondary:
      - q excludes exact-source emission; output o is charged separately; verified rank credit satisfies 0<=r<=o
      - campaign beta+delta+q-r+o<=0.45, online delta_t+q+o+u<=0.25, and setup/state/factor-log terms <=0.45 at beta=0.20
      - setup exponent, per-target query exponent, singular updates, back-substitution state, ambiguity, and verification
  replication:
    theorem_instances: 1
    future_independent_curves_per_size: 20
    future_total_curve_size_cells: 80
    future_relation_queries_at_each_of_two_largest_sizes: 1000
    future_independently_verified_accepted_rows_at_each_of_two_largest_sizes: 1000
    future_relation_attempt_ceiling_at_each_of_two_largest_sizes: 1000000
    future_target_descents_at_each_of_two_largest_sizes: 100
    independent_verifier: required
  budget:
    theorem_review_wall_clock_seconds: 1209600
    maximum_runs: 0
    future_maximum_memory_gb: 48
    future_maximum_output_gb: 80
  stopping_rules:
    - Do not run while retired, review_required, or any resolvent/update/source theorem is unresolved.
    - Stop if target-shift rank, resolvent state, or back-substitution reaches B^3, or one source stratum is absent.
    - Stop if a colliding target or blind mask is silently retained without the frozen resampling or rebuild charge.
    - Costs strictly above 0.45 and below 0.50 are inconclusive and non-promoting.
  invalidation_rules:
    - Source-labelled matrices, precomputed source kernels, known-log selectors, or uncharged inverse state invalidate the arm.
    - Fast Woodbury maintenance on a supplied matrix is only a positive control.
    - Omitted setup, output, rank, factor logs, blind descent, verification, bit cost, or memory invalidates the model.
  success_criterion: >-
    Independent proofs establish a source-free implicit resolvent, bounded-rank target
    shifts, exact all-strata kernel back-substitution, per-target exponent at most 0.25,
    blind descent, and complete exponents at most 0.45.
  falsification_criterion: >-
    Full-rank updates, B^3 state/back-substitution, source-labelled input, one missing
    stratum, or either complete exponent at least 0.50 closes this version.
  required_artifacts:
    - ideas/artifacts/ECDLP-IDEA-322/woodbury_source_resolvent_merge_receipt.md
    - ideas/artifacts/ECDLP-IDEA-322/rank_update_collision_fixtures.json
    - ideas/artifacts/ECDLP-IDEA-322/independent_woodbury_verifier.py
    - ideas/artifacts/ECDLP-IDEA-322/cost_analysis.md
  assigned_to: none
  approved_by: null

