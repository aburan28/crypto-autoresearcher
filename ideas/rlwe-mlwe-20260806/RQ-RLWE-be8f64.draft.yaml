research_question:
  id: RQ-RLWE-be8f64
  title: >-
    Does the dense-sublattice (DSD) phenomenon that makes NTRU overstretched
    transfer to Ring-LWE and Module-LWE, and if so where is the fatigue point?
  scope:
    curve_families: []
    field_types:
      - power-of-two cyclotomic rings Z[x]/(x^n+1)
      - free R-modules of rank m+2 over those rings
    bit_sizes:
      - toy ring degrees n in {8, 16, 32, 64} for measurement
      - extrapolation targets only, never claims: FHE-scale n in {2^13, 2^14, 2^15}
    methods:
      - homogeneous module-lattice formulation retaining the Kannan coordinate as a ring coordinate
      - BKZ with a dense-sublattice-discovery detector
      - matched NTRU positive control at identical (n, q)
      - fatigue-exponent fitting and comparison against the published NTRU curve
  motivation: >-
    The standard attack pipeline reduces the Kannan-embedded lattice, whose last
    coordinate is a scalar; that embedding destroys the R-module structure by
    construction, so the lattice every estimator models contains no dense
    submodule and no estimator has a DSD term. Keeping the last coordinate as a
    ring coordinate gives M = {(x,y_1..y_m,z) in R^(m+2) : y_i = a_i x + b_i z
    mod q}, which provably contains the rank-1 R-submodule N = R*(-s,e,1) of
    Z-rank n SPANNED BY n VECTORS OF EQUAL NORM ||(s,e,1)|| -- the same
    configuration that makes NTRU overstretched (KN-LIT-114, KN-LIT-112). (Not
    "consisting of short vectors": N contains r*(-s,e,1) for every r and
    ||r*v|| >= ||r|| is unbounded.) The trade is explicit and unfavourable at
    the uSVP event: the module formulation costs n-1 extra dimensions (NOT n)
    and lowers normalized covolume from the EXACT Kannan value
    q^(mn/((m+1)n+1)) -- whose n->infinity limit q^(m/(m+1)) runs 12-21% high at
    the sizes actually swept -- to q^(m/(m+2)). Equivalently and airtightly: the
    Kannan lattice with tau=1 IS the section M intersect (R^(m+1) x Z*1) of
    identical determinant, so M is Kannan plus n-1 dimensions of unit density.
    Whether the DSD event repays that cost is unmeasured at scale, though it
    already fires at n=8 under BKZ-20 (Z-rank 8 on M, Z-rank 1 on matched
    Kannan), and N is verified primitive in M and outside qR^(m+2).
  decision_target: >-
    Whether a DSD event occurs at all for R-LWE/M-LWE in the module formulation;
    if it does, the fitted fatigue exponent q*(n) and whether the module-
    formulation block size at q > q* is below the Kannan-formulation block size
    AFTER charging the n-1 extra dimensions and computing the Kannan side at its
    exact normalized covolume rather than the limit form.
  constraints:
    - >-
      Prior-art gate is binding and comes first, and RE-POINTED 2026-08-06: the
      real collision risk is Karenin-Kirshanova, AfricaCrypt 2024 / eprint
      2024/844 (ABSTRACT ONLY; absent from the corpus), which already coins the
      "DSD event" and supplies an algebraic Pataki-Tural lemma, an algebraic
      GSA, and a module-level algebraic LLL for NTRU as a rank-2 module with a
      rank-1 dense submodule. PIVOT: arbitrary-rank or rank-2 only? The record
      must also distinguish itself from Ducas-Loyer 2025/1694's no-go. By
      contrast Felderhoff-Pellet-Mary-Stehle
      "On Module Unique-SVP and NTRU", Kirchner-Fouque 2017, and
      Albrecht-Bai-Ducas (KN-LIT-112) must be read from primary text and filed
      as KN-LIT entries before any implementation. RQ-FHE-001 records that
      eprint.iacr.org is unreachable from this harness; if that blocker holds it
      is the reported outcome of the gate, not a reason to proceed blind.
    - >-
      The matched NTRU positive control is mandatory and is part of the
      instrument, not an optional extra. A null result for R-LWE means nothing
      unless the same detector fires on NTRU at matched (n, q) where the
      literature says it must.
    - >-
      DSD is exponential. The only claim available is a reduction in required
      block size, reported in bits, never a break. No batch may report a fatigue
      point as a polynomial-time result.
    - >-
      Toy ring degrees are hypothesis-generating only. No fitted exponent is
      stated as a claim about any FHE or NIST parameter set (AGENTS.md rule 4).
    - >-
      Every cost comparison charges both formulations in the same cost model,
      including the n extra dimensions the module formulation adds.
    - >-
      The RNS observation (R-LWE mod q = prod q_i yields R-LWE mod q_i with the
      SAME error, so hardness at q is bounded above by the small-modulus
      instances) is recorded as a one-line derivation with its direction stated;
      it must not be cited as evidence that large q is safe.
  status: draft
  owner: coordinator
