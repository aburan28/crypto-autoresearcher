# STAGING DRAFT — not a ledger record. Promote via Coordinator only.
research_goal:
  id: GOAL-RLWE-002
  title: >-
    Weak instances of R-LWE: measure the tail over a (which no self-reduction
    can smooth away), and build a decidable weak-parameter test with a working
    positive control
  objective: >-
    Turn a folklore observation into two measured objects. The observation:
    R-LWE has a perfect random self-reduction over the SECRET but none over the
    public element a -- multiplying by a unit u requires u*e to stay small and
    the only short units are roots of unity, so the reachable set is only
    a -> +/- x^k a. A set of weak a therefore cannot be re-randomized away, and
    the average-case hardness claim over a is a statement about an unmeasured
    distribution. Object one: the left tail of instance-specific hardness over a
    at toy degrees, plus whether planted-weak a are distinguishable from random.
    Object two: a decidable weak-parameter test built on the correct invariant
    -- the error distribution failing to SMOOTH a sublattice L, with L ranging
    over kernels of R_q-module maps -- which strictly contains the known
    ring-homomorphism attacks (EHL, ELOS, Chen-Lauter-Stange) and additionally
    admits non-ideal R'-submodules from the subfield tower that the homomorphism
    framing cannot express.
  question_ids: [RQ-RLWE-fe4e1f]
  active_hypothesis_ids: []
  status: draft
  runtime:
    provider: none
    goal_id: null
  campaign_budget:
    maximum_batches: 5
    total_wall_clock_seconds: 10800
    max_concurrent: 3
  current_batch_id: null
  dispatch_queue_path: null
  latest_verified_commit: null
  ceiling_known_in_advance: >-
    THIS GOAL CANNOT BREAK ML-KEM AND HAS ALREADY CONFIRMED IT PASSES.
    MEASURED 2026-08-06, no longer an envelope: max character bias 2^-381.15,
    exact total variation from uniform 2^-378.0 by big-integer convolution,
    about 2^756 samples to distinguish -- ML-KEM passes with about 373 bits of
    margin. That is a NULL CONTROL, is reported as one, is not a security claim,
    and is already DISCHARGED, so no batch need re-run it.
    TWO CORRECTIONS to the first draft, both material to the instrument.
    (1) The prime ideal's normalized determinant is NOT 3329^(1/256) = 1.032:
    3329 = 1 mod 256 but NOT mod 512, so every prime above q has residue
    degree 2 and norm q^2, giving (q^2)^(1/256) = q^(1/128) = 1.06541. The 1.032
    figure is the degree-1 value and contradicted this program's own slot-degree
    claim elsewhere in the portfolio.
    (2) "Its dual contains Z^n, so lambda_1(L*) = 1" is true but WORTHLESS as a
    diagnostic and must not be built into the instrument -- see
    instrument_discipline.forbidden_diagnostic.
    The underlying smoothing logic WAS right and is now confirmed by controlled
    experiment: short vectors in the PRIMAL lattice do not hurt smoothing, only
    short DUAL vectors do. The deliverable is the instrument plus the scan of parameter families
    nobody has scanned. Separately, the seed-search framing is bounded in
    advance: nothing here bears on an honestly random ML-KEM seed rho, and
    relevance is confined to protocols that reuse, derive, or let a party choose
    rho, and to schemes with a fixed global a.
  instrument_discipline:
    binding: true
    positive_control: >-
      The bias test MUST reproduce a published weak instance from the EHL/ELOS
      families before any of its negative outputs are interpreted. An instrument
      that cannot detect a known break detects nothing, and a null result from
      it is not evidence about anything.
    forbidden_diagnostic: >-
      The instrument must NOT use lambda_1 of the full dual as its smoothing
      diagnostic. lambda_1(L*) = 1 for every sublattice of Z^n, so that test has
      zero discriminating power and falsely predicts smoothing failure
      everywhere. Use the shortest NONTRIVIAL character in L*/Z^n.
    scope_correction: >-
      The headline generalization -- from "a ring homomorphism R_q -> F_q under
      which the error stays small" to "the error fails to smooth a sublattice L"
      -- is NOT new. It is Peikert, "How (Not) to Instantiate Ring-LWE",
      2016/351, section 3.2.1, read in full text: he re-expresses EHL/ELOS/CLS
      through duality and trace pairings and states verbatim that the framework
      is "strictly more general", with Lemma 3.1 the smoothing-failure criterion
      for an ARBITRARY lattice L and Theorem 5.2 proving immunity via the
      smoothing parameter by name. THIS GOAL WITHDRAWS THAT CLAIM.
      Residual novelty, narrow but real: Peikert's POSITIVE (immunity) result
      quantifies over IDEALS ONLY, and its proof uses an algebraic-norm bound
      valid for ideal lattices that FAILS for a non-ideal sublattice of large
      index. So "L ranging over kernels of R_q-module maps INCLUDING NON-IDEAL
      R'-submodules" is a genuine gap in the published positive result, and that
      gap -- not the framing -- is this goal's contribution. Re-scope
      accordingly before any batch opens.
    null_control: ML-KEM parameters must come out flat.
    ordering: Both controls are established BEFORE any new parameter family is scanned.
  completion_criteria:
    - >-
      Positive and null controls both established, in that order, with the
      instrument's demonstrated sensitivity recorded as a number so that later
      null results are bounded rather than open-ended.
    - >-
      A measured left-tail exponent for required block size over sampled a at
      toy degrees, with the sampling design and the success criterion fixed in
      advance.
    - >-
      A stated answer on planted-weak a: constructed, and either shown
      distinguishable from random (a curiosity, recorded as such) or argued
      indistinguishable (a warning, recorded with its argument). "Not
      investigated" does not discharge this.
    - >-
      The instrument applied to at least three unscanned families -- FHE moduli,
      NTT-unfriendly q, PLWE with general defining polynomial f -- with results
      reported in whichever direction they fall.
    - >-
      Any claimed weak instance carries a certificate the run wrapper
      re-verifies independently (docs/claims-and-verification.md), and
      independent Validator and Red Team review is committed through a verified
      ledger archive.
  pause_conditions:
    - The positive control cannot be reproduced, in which case the instrument is wrong, that is the finding, and no scan is run on top of it.
    - The five-batch budget is exhausted with controls established but no family scanned, in which case the instrument is the deliverable and the scan is the successor.
  first_batch:
    - >-
      Reproduce one published EHL/ELOS weak instance end to end. Nothing else in
      this goal runs until that works.
    - >-
      Confirm the ML-KEM null and record the instrument's sensitivity as a
      number.
    - >-
      Only then: the tail measurement and the first unscanned family.
  owner: coordinator
  created_at: '2026-08-06'
