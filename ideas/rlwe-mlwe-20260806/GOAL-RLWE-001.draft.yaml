    - >-
      The five structural facts this goal rests on have ALREADY been verified by
      exact computation on 2026-08-06 and need not be re-derived, only re-read:
      (-s,e,1) in M (0 failures, 24 instances); R*(-s,e,1) subset M (0 failures,
