# STAGING DRAFT — not a ledger record. Promote via Coordinator only.
research_goal:
  id: GOAL-RLWE-001
  title: >-
    Is there an overstretched Ring-LWE? Measure whether the NTRU dense-sublattice
    event transfers to the module formulation of R-LWE/M-LWE, and where it fires
  objective: >-
    Decide, by measurement with a matched positive control, whether the
    dense-sublattice-discovery (DSD) event that makes NTRU overstretched occurs
    at all for Ring-LWE and Module-LWE, and if it does, fit its fatigue curve.
    The tracked object is the pair (homogeneous module lattice
    M = {(x,y_1..y_m,z) in R^(m+2) : y_i = a_i x + b_i z mod q}; its rank-1
    R-submodule N = R*(-s,e_1..e_m,1) of Z-rank n). The mechanism is that N is
    provably inside M and is SPANNED BY n VECTORS OF EQUAL NORM ||(s,e,1)|| --
    the NTRU configuration -- while the Kannan embedding every estimator models
    appends a SCALAR coordinate and therefore contains no dense submodule and
    carries no DSD term in any published cost model. (NOT "consists of short
    vectors": N contains r*(-s,e,1) for every r in R, and since the z-coordinate
    of r*v is r itself, ||r*v|| >= ||r|| is unbounded. The DSD-relevant invariant
    is lambda_1(N) = ... = lambda_n(N) = ||(s,e,1)||, equivalently
    det(N)^(1/n) << det(M)^(1/((m+2)n)) -- measured 6.29 vs 57.70 at n=8, m=2,
    q=3329.)
    The trade is explicit and unfavourable at the uSVP event: the module
    formulation costs n-1 extra dimensions (NOT n) and lowers normalized
    covolume from q^(mn/((m+1)n+1)) -- the EXACT Kannan value; its n->infinity
    limit q^(m/(m+1)) runs 12-21% high at the sizes this goal actually sweeps --
    to q^(m/(m+2)). The airtight form of that comparison: the Kannan lattice
    with tau=1 is literally the section M intersect (R^(m+1) x Z*1), of
    identical determinant q^(mn), so M IS the Kannan lattice plus n-1 dimensions
    of UNIT DENSITY.
    Whether DSD repays that is the question, and it is measurable at toy ring
    degrees today -- it already fires at n=8: BKZ-20 on M recovers all eight
    vectors of N (Z-rank 8; next norm^2 31410 against 41), while the matched
    Kannan lattice yields Z-rank 1. N is additionally verified PRIMITIVE
    (saturated) in M and not contained in qR^(m+2) in any coordinate block --
    the two conditions that would have made it invisible to BKZ. There is no
    lattice-theoretic obstruction.
