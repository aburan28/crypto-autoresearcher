      normalized covolume q^(m/(m+2)) exact; N primitive in M and outside
      qR^(m+2). What DID fail is the prose claim that N "consists of short
      vectors" -- see the corrected objective.
    - >-
      Obtain a legitimate CIRCULANT NTRU reference value for the fitted
      exponent. DvW's constant 0.004 is calibrated on matrix NTRU, and without a
      circulant reference the success criterion has nothing to compare against.
    - Build the DSD detector to the two requirements above and demonstrate it on NTRU, calibrated on the CONCRETE curve, before generating a single R-LWE instance.
