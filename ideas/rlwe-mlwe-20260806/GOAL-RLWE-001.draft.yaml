  ceiling_known_in_advance: >-
    DSD IS EXPONENTIAL AND STAYS EXPONENTIAL. Inside the overstretched regime
    the attack cost drops relative to the uSVP estimate; it does not become
    polynomial, subexponential, or anything else. The strongest claim this goal
    can ever produce is a block-size reduction stated in bits, at toy ring
    degrees, with an extrapolation labelled as extrapolation. Stated here so no
    batch can rediscover it as a finding.
    CORRECTED 2026-08-06 after independent pressure test. The previous text
    asserted ML-KEM is "almost certainly OUT of the payoff regime" because the
    fatigue point at n = 256 is 2^19.9 against q = 2^11.7. THAT IS WRONG AND IS
    WITHDRAWN. Ducas-van Woerden's CONCRETE fatigue point -- same abstract,
    stated valid for n > 100 -- is q = 0.004*n^2.484, not the bare asymptotic.
    At n = 256 that is 3838 = 2^11.906, so ML-KEM's q = 3329 = 2^11.701 sits
    0.205 bits BELOW it, not 8 bits above. Charged against module dimension kn
    rather than ring degree, the margin is +2.69 / +4.14 / +5.17 bits for
    ML-KEM-512/768/1024. ML-KEM is therefore NOT demonstrably outside the
    regime; this goal claims neither that it is outside nor that it is inside.
    The withdrawn sentence was also an AGENTS.md rule 4 violation: a
    quantitative safety assertion about a standardized scheme, inside a document
    declaring that it made no such assertions.
    Three qualifications the exponent carries and the first draft dropped:
    2.484 holds only for ternary secrets (Q*(S) = 2.15 / 2.48 / 2.78 / 3.18 /
    3.73 at S = 0.4 / 0.5 / 0.6 / 0.75 / 1.0); the constant 0.004 is calibrated
    on MATRIX NTRU while this goal's object is CIRCULANT, which DvW explicitly
    differentiate (matrix "slightly favours the attacker"; circulant shows
    "a larger variance in the concrete hardness"); and therefore this goal
    currently has NO legitimate NTRU reference value for the fitted exponent in
    its success criterion. Obtaining one is a prerequisite, not a detail.
  prior_art_gate:
    binding: true
    rationale: >-
      RE-POINTED 2026-08-06. Prior-art risk is MEDIUM, and the first draft named
      the wrong paper. Felderhoff-Pellet-Mary-Stehle 2022/1203 (NOT 2022/1332,
      which recall would have produced) has now been read in FULL TEXT and is
      SUPPORTING EVIDENCE, not a collision: worst-case reduction, no
      experiments, strictly rank-2, and it explicitly disclaims the overstretched
      regime ("distinct from ours, but in the opposite direction"), leaving the
      regime intersection an open problem.
      The real collision risk is Karenin and Kirshanova, "Finding Dense
      Submodules with Algebraic Lattice Reduction", AfricaCrypt 2024 / eprint
      2024/844 -- ABSTRACT ONLY (PDF 403, OpenAlex closed, author homepage dead)
      and ABSENT from all 7,819 KN-LIT corpus entries. It already coins the
      "Dense Submodule Discovery (DSD) event", an algebraic Pataki-Tural lemma
      over any number field, an algebraic GSA, and a module-level algebraic LLL,
      applied to NTRU as a rank-2 module with a rank-1 dense submodule. This
      goal CANNOT claim to introduce any of those.
      Ducas-van Woerden 2021/999 has also been read in full text: it uses
      Ring-LWE only as the baseline NTRU departs from and never analyses it, so
      it neither establishes nor rules out this goal's object.
      Kirchner-Fouque 2017 remains UNREAD as primary by this program (no eprint
      version, Springer paywalled) and has only ever been cited at second hand.
    pivot_question: >-
      THE GATE REDUCES TO ONE QUESTION: is Karenin-Kirshanova's machinery
      arbitrary-rank, or rank-2 only? If arbitrary-rank, this goal reduces to
      "apply an existing published tool to a new object" and collision rises to
      HIGH. Second question in the same gate: how does this goal's object differ
      from Ducas-Loyer "Lattice Reduction via Dense Sublattices: A Cryptanalytic
      No-Go" (2025/1694), which is a no-go for a DIFFERENT object (DSP_k-BKZ on
      random lattices with no planted submodule)? This goal must distinguish
      itself explicitly or be mistaken for something already ruled out.
    required_before: any implementation work
    known_blocker: >-
      CORRECTED 2026-08-06. The previous text repeated RQ-FHE-001's "eprint
      unreachable (proxy CONNECT 403)". Actual status: eprint HTML abstract
      pages and /search return HTTP 200; PDFs return 403 behind a Cloudflare
      interstitial; and the WebSearch/WebFetch TOOLS are hard-broken in this
      harness with a model-availability error, which is not a network block.
      EARLIER "UNREACHABLE" VERDICTS ACROSS THIS PROGRAM MAY BE MISATTRIBUTED
      TOOL FAILURES AND ARE WORTH RE-TESTING. The live blocker for this gate is
      narrow: 2024/844's PDF. It needs an out-of-band copy, an interlibrary
      request, or the AfricaCrypt proceedings. Guessing does not discharge it.
  completion_criteria:
    - >-
      The matched NTRU positive control fires at (n, q) where the CONCRETE
      fatigue curve q = 0.004*n^2.484 says it must -- at n = 64 that is
      q about 2^7.0, NOT the naive 2^14.9 -- establishing that the DSD detector
      works, BEFORE any R-LWE reading is interpreted. Calibrating the control on
      the naive curve puts it about 250x too high in q, where it fires
      everywhere and would be misread as validating a saturated detector. A
      control that cannot FAIL discharges nothing.
    - >-
      A measured answer to whether DSD occurs for R-LWE/M-LWE in the module
      formulation at n in {8,16,32,64}: either a fitted fatigue curve q*(n) with
      its uncertainty, or a null result bounded by the control's demonstrated
      sensitivity.
    - >-
      If DSD occurs: a matched-cost comparison of module-formulation block size
      against Kannan-formulation block size at q > q*, in one cost model, with
      the n-1 extra dimensions charged (not n) and the Kannan side computed at
      its EXACT normalized covolume q^(mn/((m+1)n+1)), not the limit form.
    - >-
      Two detector requirements, both established before any sweep: (i) Z-rank
      and x-stability are NOT inferred from vector lengths alone -- the rotation
      basis is not near-orthogonal, its per-dimension orthogonality defect tends
      to 1.145 (m=1) / 1.092 (m=2), so a length-thresholded detector is off by
      1.14^n and misclassifies at the n = 32-64 end of the sweep; (ii) vol(N) is
      computed per instance as the exact integer isqrt(det Gram), never from
      sigma*sqrt((m+1)n), which is a strict AM-GM over-estimate erring in the
      direction that makes the dense submodule look LESS dense and so biases the
      experiment toward this goal's own null.
    - >-
      Per-instance spread is wide (0.88-1.51 at n=8 over 12 exact instances), so
      the sweep reports distributions, never a fatigue point read off single
      instances.
    - >-
      Independent Validator and Red Team review of the detector, the control,
      and the charging, committed through a verified ledger archive.
  pause_conditions:
    - The prior-art gate establishes the mechanism is published, in which case the goal closes with a KN-LIT entry and a pointer.
    - The five-batch budget is exhausted without the positive control firing, which is an instrument failure and is reported as one.
    - Lattice reduction at n = 64 exceeds the wall-clock budget, which is an infrastructure outcome and never negative mathematical evidence (AGENTS.md rule 3).
