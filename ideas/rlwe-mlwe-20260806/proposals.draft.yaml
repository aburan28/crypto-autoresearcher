ideas:

  - id: IDEA-20260806-d810ed
    question_id: RQ-RLWE-be8f64
    title: >-
      Keep the Kannan coordinate as a ring coordinate, exposing a rank-1 dense
      R-submodule, and test for an NTRU-style overstretched regime in R-LWE
    class: mechanism
    claim: >-
      The homogeneous module lattice
      M = {(x,y_1..y_m,z) in R^(m+2) : y_i = a_i x + b_i z mod q} provably
      contains N = R*(-s,e_1..e_m,1), a rank-1 R-submodule of Z-rank n
      spanned by n vectors of equal norm ||(s,e,1)||. (NOT "made entirely of
      short vectors" -- N contains r*(-s,e,1) for every r and ||r*v|| >= ||r||
      is unbounded; the DSD-relevant invariant is lambda_1(N) = ... =
      lambda_n(N).) This is the same configuration that makes NTRU
      overstretched, and it is absent from the Kannan lattice every estimator
      models, because Kannan appends a SCALAR coordinate. If the DSD event fires
      in M, there is a fatigue point q*(n) for R-LWE and M-LWE, and no published
      cost model contains a term for it.
    mechanism: >-
      Two one-line verifications: a_i(-s) + b_i*1 = e_i puts (-s,e,1) in M, and
      a_i(-rs) + b_i*r = r*e_i puts R*(-s,e,1) in M. covol(M) = q^(mn) in
      dimension (m+2)n. BKZ on M can then discover N as a dense sublattice
      before it solves uSVP, exactly as in the NTRU analysis.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      SCREENED 2026-08-06, INCOMPLETE. The first draft named the wrong paper.
      Felderhoff-Pellet-Mary-Stehle 2022/1203 was read in FULL TEXT and is
      SUPPORTING EVIDENCE, not a collision: worst-case, no experiments, strictly
      rank-2, and it explicitly disclaims the overstretched regime. The real
      risk is Karenin-Kirshanova, AfricaCrypt 2024 / eprint 2024/844 -- ABSTRACT
      ONLY -- which already coins the "DSD event", an algebraic Pataki-Tural
      lemma, an algebraic GSA, and a module-level algebraic LLL, applied to NTRU
      as a rank-2 module with a rank-1 dense submodule. This record CANNOT claim
      to introduce any of those. PIVOT: is their machinery arbitrary-rank or
      rank-2 only? If arbitrary-rank, collision rises to HIGH. Also unresolved:
      distinguishing this object from Ducas-Loyer 2025/1694's no-go.
    predicted_effect: >-
      At toy degrees, DSD fires for R-LWE above some q*(n) and the fitted
      exponent is comparable to but not equal to NTRU's, because the module
      formulation pays n-1 extra dimensions (not n) and a lower normalized
      covolume (q^(m/(m+2)) versus Kannan's EXACT q^(mn/((m+1)n+1)), not its
      n->infinity limit q^(m/(m+1))). Already fires at n=8 under BKZ-20: Z-rank
      8 recovered on M, Z-rank 1 on matched Kannan.
    cheapest_decisive_test: >-
      n in {8,16,32,64}, m in {1,2,4}, sweep log q. Build M's module basis, run
      BKZ with a DSD detector (is the span of recovered short vectors of Z-rank
      n and x-stable?), against a MATCHED NTRU positive control at identical
      (n,q). Falsified if the control fires reliably and R-LWE never does.
    risks:
      - Published. The gate exists to find this out cheaply.
      - The n-dimension penalty swamps any DSD gain at every q, which is the most likely single outcome.
      - The detector is miscalibrated; the NTRU control exists precisely to catch that.
      - CORRECTED 2026-08-06: ML-KEM is NOT out of the payoff regime by 8 bits. DvW's CONCRETE fatigue point 0.004*n^2.484 puts n=256 at 2^11.906 against q=2^11.701 -- ML-KEM sits 0.205 bits BELOW it. No scoping claim about ML-KEM is made in either direction.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-e4c374
    question_id: RQ-RLWE-912fdb
    title: >-
      Settle Arora-Ge starvation for R-LWE: does the ring supply algebraically
      independent equations that plain LWE cannot? (Answer obtained: no)
    class: lane_closure
    claim: >-
      ML-KEM's error is bounded so Arora-Ge applies in principle, at a degree
      that is PARAMETER-SET-DEPENDENT: ML-KEM-768/1024 use eta_1 = 2, support
      [-2,2], degree 5; ML-KEM-512 uses eta_1 = 3 for BOTH s and e, support
      [-3,3], degree 7, C(519,7) = 2^50.78 monomials. It fails only on sample
      starvation: 1536 equations -- 768 sample plus 768 secret, since the secret
      is CBD-bounded too -- against C(773,5) = 2,270,319,562,049 = 2^41.05
      degree-<=5 monomials (NOT 2^44, and NOT 768 equations). The ring
      supplies no algebraically independent equations that plain LWE does not:
      Galois conjugates are the rotations already counted. WITHDRAWN 2026-08-06:
      the further claim that "the rank deficit is exactly n per ring sample" is
      unsupported and ill-posed -- measured Galois redundancy is n(n-1), and the
      deficit against an unstructured control with matched equation and variable
      counts is 0. The surviving claim is rank increase EXACTLY 0 from four
      independent sources, now proved: Galois acts as a signed permutation and
      the symmetric support [-B,B] absorbs the sign.
    mechanism: >-
      A rank computation over F_q on the Macaulay matrix at tiny n, followed by
      the symbolic argument that the deficit is invariant.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED, but risk graded LOW for the ring-specific rank statement.
      Arora-Ge and its sample-starvation limit are standard; the invariance
      claim is the new part.
    predicted_effect: >-
      CONFIRMED 2026-08-06 and upgraded from measurement to proof: rank increase
      exactly 0 from Galois conjugates, rotations, pairwise products, and
      short-multiplier equations (||c||_1 = 2, which this record did not
      originally consider). P_t*Neg(a) = Neg(sigma_t(a))*P_t makes conjugation a
      signed permutation, and the symmetric support absorbs the sign. This
      CLOSES the algebraic lane with a proof instead of an assertion.
    cheapest_decisive_test: >-
      Rank over F_q at n in {4,8,16} for each of the three equation sources,
      then the symbolic argument. Days, not weeks. Falsified if any source
      raises the rank above the m*n baseline at any n.
    risks:
      - A rank table at n<=16 is toy-scale; without the symbolic argument it is not an invariance claim.
      - A positive result here (independent equations DO appear) would be the single most valuable outcome in the portfolio and must not be dismissed as noise.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-35d60b
    question_id: RQ-RLWE-912fdb
    title: >-
      Subring descent: short combinations landing in R' give an honest R'-LWE
      instance in half the dimension, at a computable noise price
    class: mechanism
    claim: >-
      For R = R'[omega] free of rank f over a subring R', if a short c satisfies
      alpha := sum c_i a_i in R'_q, then multiplication by alpha is R'-linear
      and preserves the omega-decomposition, so the omega_0 component of
      y := sum c_i b_i satisfies y_0 = alpha*s_0 + E_0 with E = sum c_i e_i:
      an R'-LWE-SHAPED sample in dimension n/f -- 'shaped', not 'honest':
      alpha is measurably NOT uniform in R'_q over short c (specific Fourier
      modes carry 3.8-6.1x the max bias uniform sampling produces, and the
      deviation STRENGTHENS as c shortens), and descended samples are NOT
      independent beyond about 2m. The constraint costs only
      (f-1)n/f F_q-conditions versus the classical dual attack's n, so the
      required combination vectors are SHORTER by q^(1/(fm)).
    mechanism: >-
      Descent along the power-of-two cyclotomic tower Z[zeta_2n] = Z[zeta_n][zeta_2n],
      f = 2, basis {1, zeta_2n}. Recursion gives an FFT-shaped attack shape.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED. Subfield attacks on NTRU (KN-LIT-112) and Albrecht-Deo's
      M-LWE-to-R-LWE reduction are adjacent; the omega_0-component derivation
      above is stated here in a form the author has not seen, which is weak
      evidence and no more.
    predicted_effect: >-
      CORRECTED 2026-08-06. Still a quantified negative, but BOTH numbers in the
      first draft were wrong and the stated reason was backwards. At
      (n=256,q=3329,sigma~1,m=2,f=2): ||c|| = 41.59 and the descended
      PER-COEFFICIENT noise sd is 41.59 against q = 3329 -- 80x headroom, NOT
      death (670 was an L2 norm across 256 coefficients, wrongly compared to a
      scalar modulus). Block size 152.444 -> 152.445: noise-NEUTRAL. At
      (n=2^15, log q=800, sigma=3.2, m=2) the one-parameter law gives 367 -> 201
      -- descent WINS, and that is the artifact. Charging beta_c:
      max(beta_c,beta_resid) = 560 vs 367 (FHE), 233 vs 152 (ML-KEM). Descent
      loses because ||c|| cannot REACH the Gaussian heuristic, not because it
      be beaten.
    cheapest_decisive_test: >-
      Reproduce both envelope computations independently, then verify at toy n
      that the descended instance really is R'-LWE (recover s_0 and certify it
      against the original samples). Falsified as a viable attack if the noise
      exchange rate is confirmed; falsified as a CORRECT REDUCTION if s_0 cannot
      be certified, which would be a bug in the derivation and is the cheaper
      thing to check first.
    risks:
      - RESOLVED 2026-08-06: the uniformity heuristic is FALSE, not merely unproven. Bias is concentrated in specific Fourier modes, landing precisely on the FFT-over-V step the unified family depends on.
      - RESOLVED 2026-08-06: the ring expansion constant is EXACTLY 1 (proved symbolically at n=8, measured at n=64,256). The sqrt(n) is correct for the NORM but not for the per-coefficient sd, and the first draft compared the norm to a scalar modulus.
      - Reporting the negative as "descent does not work" without the exchange rate wastes the result.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-b37e8e
    question_id: RQ-RLWE-912fdb
    title: >-
      Slot-restricted dual attack with a ring-native FFT, and the kappa-curve
      that contains it and every neighbour
    class: mechanism
    claim: >-
      Requiring sum c_i a_i to vanish on all-but-one CRT slot is n - deg(slot)
      F_q-conditions instead of the classical dual attack's n, so strictly
      shorter combination vectors suffice, and the residual guess is over a slot
      of size q^deg and is FFT-able. For ML-KEM (q = 3329 = 1 mod 256 but not
      mod 512) the slots are degree 2, size q^2 = 2^23.4. Generalizing the
      codimension to a free parameter kappa makes primal (kappa=0),
      slot-restricted dual (kappa=n-2), subring descent (kappa=n-n/f) and
      classical dual (kappa=n) four points on ONE SURFACE, settled by optimizing
      TWO parameters.
    mechanism: >-
      ||c(beta_c)|| = delta(beta_c)^(mn) * q^(kappa/(mn)) is what BKZ ACTUALLY
      returns; L(kappa) = q^(kappa/(mn)) * sqrt(mn/2*pi*e) is an UNATTAINABLE
      lower bound (reaching it needs beta_c = 516 > d = 512 at n = 256 and
      beta_c = 65539 > d at n = 2^15, i.e. exact SVP). Residual instance has
      dimension n-kappa, modulus q, PER-COEFFICIENT noise sd ||c||*sigma (ring
      expansion constant exactly 1; the sqrt belongs to the norm
      ||E_0|| = ||c||*sigma*sqrt(n-kappa)). Total cost =
      max(beta_c, beta_resid) + FFT over V. Minimize over the SURFACE
      (kappa, beta_c). CORRECTED 2026-08-06: the first draft minimized over
      kappa alone with ||c|| = L(kappa), which INVERTS the answer and reports
      descent beating the primal attack at FHE scale.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      SCREENED 2026-08-06, INCOMPLETE, and the grade moves LOW -> HIGH. Stange
      2019/183 (read in full text) is direct collision territory on subring
      descent. Ogilvie 2026/279 (ABSTRACT ONLY, Cloudflare-blocked) incorporates
      a ring-symmetry mechanism into "both primal and dual hybrid frameworks" --
      the closest published thing to this record's unified framework, and it
      cannot be told from the abstract whether her parameterization subsumes the
      kappa-surface. That is the highest-value gap in this lane.
      Kirchner-Espitau-Fouque 2019/1436 is a plausible collision and is UNREAD
      beyond its title; "Espitau et al. on subfield/ring descent" was never
      pinned down and is effectively UNSCREENED. Guo-Johansson and MATZOV are
      UNREACHABLE and known only through Ducas-Pulles; MATZOV's
      dimension-reduction parameter may already be the kappa-parameterization in
      other terms. Cheapest next check: Stange 2019/183's forward citation
      graph.
      Prior text follows. MATZOV-style FFT dual attacks guess coordinates; the ring
      version guesses a SLOT, and the codimension relaxation is a move the
      unstructured formulation cannot express. The kappa-parameterization as a
      family statement is where the novelty claim actually sits, and it is
      methodologically descended from KN-OPEN-019.
    predicted_effect: >-
      The optimum sits at or very near an endpoint, i.e. the family is closed
      and the interior buys O(1) bits at most. The durable output is the
      correlation structure: slot-restricted dual vectors form an R'-module, so
      their correlations are exactly computable rather than assumed -- a new
      instrument for the independence heuristic that KN-OPEN-016 disputes.
    cheapest_decisive_test: >-
      Derive the exchange law; reproduce the kappa=n cost against a published
      dual-attack figure at one named parameter set; only then sweep kappa. If
      the parameterization cannot reproduce a known point it is wrong and
      nothing downstream matters.
    risks:
      - Binding gate: the dual endpoint's score model is under active suspicion in this program (KN-OPEN-016, GOAL-MLKEM-004). Compute in that model's successor or report both.
      - The FFT cost over a degree-2 slot may dominate the vector-length saving; charge it.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-a51421
    question_id: RQ-RLWE-fe4e1f
    title: >-
      R-LWE has no random self-reduction over a; measure the weak-instance tail
      that no re-randomization can smooth away
    class: measurement
    claim: >-
      R-LWE's self-reduction over the secret (s -> s + t) has no counterpart
      over a: multiplying by a unit u needs u*e small and the only short units
      are roots of unity, so the reachable set is a -> +/- x^k a. A set of weak
      a therefore cannot be argued away by re-randomization and is bounded only
      through the LPR worst-case reduction, whose concrete parameters are far
      from deployment. The average-case claim over a is a statement about an
      unmeasured distribution.
    mechanism: >-
      Sample many a at toy degrees; measure required BKZ block size for fixed
      success probability; characterize the left tail. Separately, plant a short
      vector in M_a and test whether the resulting a is distinguishable from
      random.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED; risk graded LOW-MEDIUM. Chen-Lauter-Stange and
      Elias-Lauter-Ozman-Stange construct weak RINGS and MODULI. Weak a inside a
      fixed good ring is the novelty axis. The no-re-randomization point is
      folklore not, to the author's knowledge, turned into a measurement.
    predicted_effect: >-
      A light tail at toy degrees, with the interesting outcome being the
      exponent rather than its sign. The planted-instance question has no
      predicted answer, which is why it is worth asking.
    cheapest_decisive_test: >-
      Fixed-in-advance sampling design and success criterion at n in {8..64};
      then the planted construction and a distinguisher attempt.
    risks:
      - Bounded relevance, and the bound must be stated: nothing here bears on an honestly random ML-KEM seed rho. Relevance is confined to protocols that reuse/derive/choose rho and to schemes with a fixed global a.
      - A distinguishable planted family is a curiosity, not a warning; only indistinguishability makes it one.
      - Toy-degree exponents do not extrapolate and must not be presented as if they do.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-e2ed7a
    question_id: RQ-RLWE-fe4e1f
    title: >-
      Replace "is there a small-error ring homomorphism" with "does the error
      smooth this sublattice", and ship it as a decidable weak-parameter test
    class: instrument
    claim: >-
      The known weak-instance attacks require a ring homomorphism R_q -> F_q
      under which the error stays small. The correct and strictly larger
      invariant is that the error distribution fails to SMOOTH a sublattice L,
      with L ranging over kernels of R_q-module maps -- which admits non-ideal
      R'-submodules from the subfield tower that the homomorphism framing cannot
      express. Bias is about sum over short v in L* of exp(-pi*sigma^2*||v||^2),
      and the instance is attackable when that exceeds the inverse sample count.
    mechanism: >-
      Given (n, f(x), q, error distribution), compute maximum bias over a family
      of L and report. A decidable parameter-selection test rather than an
      attack.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED; risk MEDIUM. The ideal case is the known EHL/ELOS/CLS
      setting stated in different language. The non-ideal R'-submodule case is
      the claimed new content.
    predicted_effect: >-
      ML-KEM passes with room: at (n=256,q=3329,CBD eta=2) the prime ideal above
      q has normalized determinant 1.032, its dual contains Z^n, and e(omega)
      mod q is a 256-term modular sum against a 2^11.7 modulus. The value is the
      instrument plus the scan of FHE moduli, NTT-unfriendly q, non-power-of-two
      cyclotomics, and PLWE with general f.
    cheapest_decisive_test: >-
      POSITIVE CONTROL FIRST: reproduce a published EHL/ELOS weak instance. Then
      the ML-KEM null, recording sensitivity as a number. Only then scan. An
      instrument that cannot detect a known break detects nothing.
    risks:
      - Building the scan before the control makes every null result meaningless. Ordering is binding.
      - The family of L is infinite; the enumeration actually searched must be stated, and silently truncating it reads as "we checked everything".
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-e5e694
    question_id: RQ-RLWE-be8f64
    title: >-
      Module-native reduction: ask whether the basis PROFILE SHAPE changes, not
      whether the reduction is faster
    class: measurement
    claim: >-
      Every known structured speedup is polynomial (rotations give <= 2n in
      sieving; symplectic gives a constant), so the asymptotic question is
      settled. The unsettled and sharper question is whether tower-recursive
      reduction yields a PIECEWISE GSA profile with a flatter head -- because
      the top of the subfield tower is reduced exactly -- since BKZ's cost is
      driven entirely by the profile slope, and a shape change is not a constant.
    mechanism: >-
      Kirchner-Espitau-Fouque-style tower reduction and Lee-Pellet-Mary-Stehle-
      Wallet module-LLL, compared against fplll/G6K on the SAME lattices, with
      the profile recorded rather than only the wall clock.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED; risk HIGH. Throughput comparisons exist. The profile-shape
      framing is the claimed distinction and may well also exist.
    predicted_effect: >-
      Constant-factor or log-factor. Stated as the ceiling in advance so no
      batch reports 2n as an exponent.
    cheapest_decisive_test: >-
      n in {64..256}: run both, record the full GS profile, test for a
      shape difference rather than a slope difference.
    risks:
      - High prior-art risk; gate behind GOAL-RLWE-001.
      - Implementation-quality differences masquerade as algorithmic ones; the comparison must be on identical lattices with identical budgets.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-53e680
    question_id: RQ-RLWE-be8f64
    title: >-
      Is the 2^(sqrt n) quantum barrier a limit of the Stickelberger technique
      or of rank 1? Localize the obstruction using this program's own HAWK result
    class: theory
    claim: >-
      Biasse-Song gives quantum polynomial-time class-group and S-unit
      computation for Z[zeta_2^k]; CDPR/DPW convert it to 2^(O~(sqrt n))-approx
      ideal-SVP, while every deployed scheme sits at polynomial approximation
      factors. The machinery is about principal ideals -- RANK 1. R-LWE with >= 2
      samples and M-LWE are rank >= 2, and by the organizing claim in
      PORTFOLIO.md a rank-2 method would hit R-LWE, NTRU and HAWK's module-LIP
      at once. This program already holds the sharpest available datum:
      KN-OPEN-028 records that the rank-2 nrd-PIP route is super-polynomial
      because Heuristic 4 FAILED while 1-3 verified.
    mechanism: >-
      Not an attack proposal. A localization: determine whether the step where
      Heuristic 4 failed is intrinsic to rank 2 or an artifact of the nrd-PIP
      presentation, and whether a different rank-2 invariant avoids it.
    novelty_status: unscreened_candidate
    novelty_screen: NOT SCREENED; risk HIGH. This is an active research area with many groups in it.
    predicted_effect: >-
      An obstruction, not an algorithm. A PROVEN obstruction to rank-2
      Stickelberger would be as valuable as a positive result and is far more
      likely; it would also retire a recurring source of speculative proposals.
    cheapest_decisive_test: >-
      Read KN-OPEN-028's source and the Eurocrypt 2025 module-LIP-to-nrd-PIP
      reduction, and write down precisely which quantity Heuristic 4 controls
      and whether its failure mode is rank-indexed. No implementation.
    risks:
      - Very high cost, very low success probability. Gate behind GOAL-RLWE-001 and the Arora-Ge result; do not open it early.
      - Overlaps GOAL-HAWK-001; coordinate rather than duplicate.
    status: deferred
    proposed_by: session
    proposed_at: '2026-08-06'

  - id: IDEA-20260806-0f4843
    question_id: RQ-RLWE-912fdb
    title: >-
      l-infinity / log-embedding BDD, recorded as CLOSED ON ARRIVAL with its
      one-line reason
    class: lane_closure
    claim: >-
      Reduction algorithms optimize l2, while the R-LWE error is small in EVERY
      embedding -- a polydisc in the canonical embedding, a box in the log
      embedding, which is exactly the geometry the unit group acts on by
      translation and exactly what CDPR machinery manipulates. Running that
      machinery on the ERROR rather than on an ideal generator looks like an
      unexplored lane. IT IS NOT A LANE: with m = 1 and a invertible mod q,
      aR + qR = R, so the coset is everything -- every e is realizable with
      s = a^(-1)(b-e) -- and there is nothing to search. The method needs
      m >= 2, which lands on a rank-2 module, i.e. it IS IDEA-20260806-53e680's
      setting.
    mechanism: Not applicable; the record exists to close the lane.
    correction_20260806: >-
      THE CLOSURE REASON ABOVE IS FALSE AND THIS RECORD IS REOPENED. The premise
      is correct (5000/5000 random e are realizable) but the inference DROPS THE
      SHORTNESS CONSTRAINT ON s. R-LWE asks for the pair (s,e) with BOTH short,
      and that needle is unique: exhaustive search at n = 8, q = 3329, B = 1
      finds exactly ONE short-short solution among 6561; at ML-KEM scale the
      space is 5^256 = 2^594 with expected solution count 2^-1806.6. m = 1
      R-LWE is the NTRU-shaped 2n-dimensional BDD instance -- if "there is
      nothing to search" were true, m = 1 R-LWE would be trivially broken.
      Off by one in the same argument: the m = 1 lattice {(s,e) in R^2} ALREADY
      has R-rank 2, so this lane is in IDEA-20260806-53e680's setting at m = 1,
      and the collapse argument does not even do the work of routing it there.
      Freezing this into the ledger as closed, with an instruction to future
      batches not to re-examine it, is precisely the failure mode AGENTS.md
      rule 9 forbids. The real question -- can log-embedding / l-infinity
      geometry help BDD on the rank-2 R-LWE module? -- is open, and this lane is
      MERGED INTO IDEA-20260806-53e680's gate rather than closed.
    novelty_status: unscreened_candidate
    novelty_screen: >-
      NOT SCREENED. The first draft claimed no screen was needed because the
      lane was closed on an elementary argument; that argument was wrong, so the
      screen is now owed.
    predicted_effect: Unknown. The first draft's "None -- this is a negative record" is withdrawn.
    cheapest_decisive_test: >-
      Inherited from IDEA-20260806-53e680: establish whether S-unit /
      log-embedding machinery says anything about BDD on a rank-2 module before
      any implementation.
    risks:
      - Reopened on a corrected argument, not on new evidence that the lane is promising. It may still be dead; it is not dead FOR THE STATED REASON.
      - Gated behind IDEA-20260806-53e680 and therefore behind M1 and M9. Do not open early.
    status: proposed
    proposed_by: session
    proposed_at: '2026-08-06'
