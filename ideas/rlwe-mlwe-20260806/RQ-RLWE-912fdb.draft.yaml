research_question:
  id: RQ-RLWE-912fdb
  title: >-
    Is the structured-attack family on R-LWE/M-LWE a one-parameter curve, and is
    that enumeration closed? (primal, dual, slot-restricted dual, and subring
    descent as points on it)
  scope:
    curve_families: []
    field_types:
      - power-of-two cyclotomic rings and their subfield towers
      - CRT slot decomposition of R_q at NTT-friendly and partially-NTT-friendly q
    bit_sizes:
      - closed-form curve at ML-KEM-512/768/1024 and at representative FHE parameter shapes
      - toy ring degrees n in {4, 8, 16, 32} for the Macaulay rank computation
    methods:
      - one-parameter kappa family, kappa = F_q-codimension of the allowed image of sum c_i a_i
      - Gaussian-heuristic exchange law and its optimization over kappa
      - Arora-Ge Macaulay matrix rank over F_q, as an R-module
      - subring descent to R'-LWE via the omega_0 component
  motivation: >-
    Four attacks that are discussed as separate families are the same move at
    different budgets. Constrain alpha = sum c_i a_i to lie in a subspace
    V of F_q-codimension kappa: kappa = n gives the classical dual attack
    (alpha = 0); kappa = n - deg(slot) gives a slot-restricted dual with a
    ring-native FFT; kappa = n - n/f gives subring descent, which yields an
    honest R'-LWE sample in dimension n/f because multiplication by alpha in R'
    preserves the omega-decomposition, so y_0 = alpha*s_0 + E_0; kappa = 0 gives
    the primal attack. The exchange law is closed-form under the Gaussian
    heuristic, so optimizing over the single parameter kappa settles the family
    rather than one member of it. This is KN-OPEN-019's question -- what object
    does each attack family track, and is the enumeration closed -- applied to
    structured lattices. The companion question is whether the ring supplies
    algebraically independent Arora-Ge equations that plain LWE cannot; the
    predicted answer is no, with a rank deficit of exactly n per ring sample,
    which would close the algebraic lane with a proof instead of an assertion.
  decision_target: >-
    The kappa-curve at named parameter sets, with each published attack marked as
    a point on it, the location of the optimum, and whether any interior kappa
    beats both endpoints. Separately: the exact Arora-Ge rank deficit and whether
    it is invariant under Galois conjugation, sample products, and the R-module
    structure of the Macaulay matrix.
  constraints:
    - >-
      Binding internal gate: the dual endpoint's cost model is under active
      suspicion in this program (KN-OPEN-016, GOAL-MLKEM-004 measured the score
      distribution the model assumes). The kappa-curve is computed in whichever
      model GOAL-MLKEM-004 lands on, or reported in both with the divergence
      shown. Do not build a ring-native dual attack on a score model this
      program has evidence to distrust.
    - >-
      Ceiling known in advance and not rediscoverable as a finding: relaxing
      kappa from n to n-k is worth a factor q^(k/(mn)) in required vector
      length, i.e. O(1) bits for k = O(1), and is self-defeating for
      k = Theta(n) -- because ||c|| cannot REACH the Gaussian heuristic, not
      because noise outgrows the dimension saving. Attaining L(kappa) needs
      beta_c = 516 > d = 512 at n = 256 and beta_c = 65539 > d at n = 2^15:
      exact SVP. THIS FAMILY CANNOT MOVE AN EXPONENT.
    - >-
      The optimization is over the TWO-parameter surface (kappa, beta_c). Any
      formulation that minimizes over kappa alone, holding ||c|| at the Gaussian
      heuristic, is a FALSE-POSITIVE GENERATOR aimed at deployed parameter sets
      and is forbidden.
    - >-
      "Honest R'-LWE sample" is downgraded to "R'-LWE-SHAPED sample" throughout.
      Two measured facts require it: alpha is NOT uniform in R'_q over short c
      (specific Fourier modes carry 3.8-6.1x the maximum bias uniform sampling
      produces, z = +37 to +66, deviation STRENGTHENING as c shortens, and
      landing precisely on the FFT-over-V step), and the descended samples are
      NOT independent beyond about 2m (noise-tuple rank measured 12 = mn - n/2
      for N = 10 samples). The heuristic flagged as "unproven" in the first
      draft is FALSE, not merely unproven. Multi-level descent may not be costed
      as a clean recursion until both are charged.
    - >-
      REPLACED 2026-08-06. The previous constraint instructed batches to
      reproduce a QUANTIFIED NEGATIVE resting on two numbers that are both
      wrong: "noise about 670 against q = 3329" compared an L2 norm across 256
      coefficients to a scalar modulus (per-coefficient sd is 41.6, i.e. 80x
      headroom), and "block size moves the wrong way, about 370 -> 420" is wrong
      in magnitude AND SIGN (367 -> 201 under its own assumption). A batch could
      not have reproduced it, because it is not true.
      The correct constraint: the descent endpoint is a quantified negative ONLY
      once beta_c -- the block size needed to PRODUCE c -- is charged. Under the
      one-parameter law it is a POSITIVE, and that positive is an artifact.
      Charged honestly: max(beta_c, beta_resid) = 560 vs 367 direct at FHE
      scale, 233 vs 152 at ML-KEM scale. Any batch output showing descent
      beating the primal attack must be treated as a symptom that beta_c was
      dropped, never as a mechanism.
    - >-
      Every envelope number in PORTFOLIO.md is a back-of-envelope derivation by
      its author and is re-derived independently by the Executor. A disagreement
      is a finding about that document.
    - >-
      Heuristic to be stated and tested, not assumed: that alpha = sum c_i a_i
      over short random c behaves as a uniform element of V, and that the ring
      multiplication expansion factor c_ring in the noise term is what the
      envelope assumes. Both are measurable.
    - >-
      A rank computation at n in {4,8,16} is toy-scale. Promoting it to an
      invariant statement requires the symbolic argument, not the table.
  status: draft
  owner: coordinator
