# STAGING DRAFT — not a ledger record. Promote via Coordinator only.
# Numbered 003 to match RQ ordering; scheduled FIRST (cheapest, most decisive).
research_goal:
  id: GOAL-RLWE-003
  title: >-
    The kappa-surface: settle the structured-attack family on R-LWE/M-LWE as a
    TWO-parameter optimization, and settle the Arora-Ge starvation question
  objective: >-
    Replace four separately-discussed attack families with one surface and
    locate its optimum. Tracked object: the pair (subspace V of R_q of
    F_q-codimension kappa, allowed as the image of alpha = sum c_i a_i; the
    resulting residual instance of dimension n - kappa with PER-COEFFICIENT
    noise sd ||c||*sigma -- the ring expansion constant is exactly 1, measured,
    and the sqrt(n) belongs to the norm ||E_0|| = ||c||*sigma*sqrt(n - kappa),
    not to the per-coefficient quantity).
    kappa = n is the classical dual attack; kappa = n - deg(slot) is a
    slot-restricted dual with a ring-native FFT; kappa = n - n/f is subring
    descent, which yields an R'-LWE-SHAPED sample in dimension n/f because
    multiplication by alpha in R' preserves the omega-decomposition
    (y_0 = alpha*s_0 + E_0, verified exactly in R'_q, 48/48 and 32/32 per
    configuration, against a control that fails 100%); kappa = 0 is the primal
    attack. The family is settled by optimizing over the TWO-parameter surface
    (kappa, beta_c) -- NOT over kappa alone. beta_c is the block size needed to
    PRODUCE the combination vector c; the Gaussian heuristic L(kappa) is a lower
    bound on ||c|| that lattice reduction cannot attain, and omitting beta_c
    inverts the answer.
    "R'-LWE-SHAPED" is deliberate, not a hedge: alpha is measurably NOT uniform
    in R'_q over short c (specific Fourier modes carry 3.8-6.1x the maximum bias
    uniform sampling ever produces, z = +37 to +66, and the deviation
    STRENGTHENS as c gets shorter -- landing precisely on the FFT-over-V step
    that kappa < n depends on), and the descended samples are NOT independent
    beyond roughly 2m of them (noise-tuple rank measured 12 = mn - n/2 for
    N = 10 samples in Z^40). Both must be charged before any multi-level descent
    is costed as a recursion.
    Second, independent object: the rank of the Arora-Ge Macaulay matrix as an
    R-module, to determine whether the ring supplies algebraically independent
    equations that plain LWE cannot. Predicted answer NO -- already confirmed and
    upgraded to a proof (Galois acts as a signed permutation and the symmetric
    support absorbs the sign, so conjugation returns the same polynomials; rank
    increase exactly 0 from four independent sources, including short-multiplier
    equations this program did not originally consider). The previously recorded
    prediction "deficit exactly n per ring sample" is WITHDRAWN as unsupported
    and ill-posed: measured Galois redundancy is n(n-1), and the deficit against
    an unstructured control with matched equation and variable counts is 0.
  question_ids: [RQ-RLWE-912fdb]
