  ceiling_known_in_advance: >-
    REWRITTEN 2026-08-06 after independent pressure test; the previous text was
    VOID and is preserved verbatim under ceiling_superseded, because the shape
    of that error is the most important thing this goal has to teach.
    THIS FAMILY CANNOT MOVE AN EXPONENT. Relaxing the constraint from kappa = n
    to kappa = n - k shortens the required combination vector by exactly
    q^(k/(mn)): O(1) bits for k = O(1). Taking k = Theta(n) to buy a dimension
    reduction is self-defeating -- but NOT for the reason previously recorded.
    It is self-defeating because ||c|| cannot REACH the Gaussian heuristic
    L(kappa): doing so needs beta_c = 516 > d = 512 at n = 256 and
    beta_c = 65539 > d at n = 2^15, i.e. exact SVP in both cases. Under the
    previously recorded one-parameter law descent WINS (block size 367 -> 201 at
    FHE scale; noise-neutral 152.444 -> 152.445 at ML-KEM scale). Once the cost
    of producing c is charged, descent loses: max(beta_c, beta_resid) = 560 vs
    367 direct at FHE scale, 233 vs 152 at ML-KEM scale. The deliverable is a
    CLOSED FAMILY and a located optimum on a TWO-dimensional surface
    (kappa, beta_c), not an attack.
  ceiling_superseded:
    superseded_on: '2026-08-06'
    previous_text: >-
      THIS FAMILY CANNOT MOVE AN EXPONENT ... the envelope in PORTFOLIO.md puts
      one descent level at ML-KEM-like parameters at noise about 670 against
      q = 3329 (instance dead) and at FHE-like parameters at block size moving
      370 -> 420 (wrong direction).
    reason: >-
      Both load-bearing numbers were wrong. "Noise about 670 against q = 3329
      (instance dead)" compared an L2 norm across 256 coefficients to a scalar
      modulus; the per-coefficient standard deviation is 41.6, i.e. 80x
      headroom, and even at face value 670 < 3329. "Block size moving
      370 -> 420" was wrong in magnitude AND IN SIGN: under its own assumption
      the correct figure is 367 -> 201. A batch instructed to reproduce that
      pre-registered negative could not have done so, because it is not true.
    hazard_if_reinstated: >-
      FALSE-POSITIVE GENERATOR AIMED AT DEPLOYED PARAMETER SETS. An Executor
      implementing the one-parameter law as written would compute that subring
      descent BEATS the primal attack on FHE-scale Ring-LWE. Any such output is
      an artifact of omitting beta_c and must never be reported as a mechanism.
  internal_gate:
    binding: true
    statement: >-
      Do not build a ring-native dual attack on top of a dual-attack score model
      this program has evidence to distrust. KN-OPEN-016 is open and
      GOAL-MLKEM-004 measured the score distribution the model assumes. The
      kappa-curve is computed in whichever model GOAL-MLKEM-004 lands on, or in
      both with the divergence shown.
    bonus: >-
      Slot-restricted dual vectors form an R'-module, so their correlation
      structure is EXACTLY COMPUTABLE rather than assumed. That makes the
      kappa < n region a new instrument for testing the independence heuristic,
      independent of its value as an attack, and it is the part of this goal
      most likely to outlive it.
  completion_criteria:
    - >-
      The kappa-curve derived in closed form, with each of the four named
      attacks marked as a point on it and each point's cost reproduced against
      its published value at one named parameter set.
    - >-
      The optimum located at ML-KEM-512/768/1024 and at representative FHE
      parameter shapes, with an explicit statement of whether any interior kappa
      beats both endpoints, in a single named cost model.
    - >-
      The descent endpoint's negative reproduced independently at both parameter
      shapes, so it is recorded as closed by measurement rather than by the
      envelope in PORTFOLIO.md.
    - >-
      The Arora-Ge rank deficit measured at n in {4,8,16} under Galois
      conjugation, sample products, and the R-module Macaulay structure, plus
      the symbolic argument if the deficit is invariant. A table without the
      argument does not discharge this criterion.
    - >-
      Independent Validator and Red Team review, committed through a verified
      ledger archive.
  pause_conditions:
    - GOAL-MLKEM-004 has not reported and neither cost model can be defended, in which case the curve is reported in both and the divergence is the deliverable.
    - The closed-form exchange law fails its own reproduction check against a published attack cost, which voids the parameterization and is the reported outcome.
  first_batch:
    - >-
      Arora-Ge rank computation at n in {4,8}. Highest information per token in
      the whole portfolio; independent of everything else; run it first.
    - >-
      Derive the exchange law and reproduce the classical dual attack cost
      (kappa = n) against a published figure. If the parameterization cannot
      reproduce a known point, it is wrong and nothing downstream matters.
    - >-
      Only then sweep kappa.
