research_question:
  id: RQ-RLWE-fe4e1f
  title: >-
    R-LWE admits no random self-reduction over the public element a: how heavy
    is the weak-instance tail, and is there a decidable test for weak
    (ring, modulus, error) triples?
  scope:
    curve_families: []
    field_types:
      - power-of-two cyclotomic rings, and PLWE with general defining polynomial f
      - prime ideals, products of prime ideals, and non-ideal R'-submodules from the subfield tower
    bit_sizes:
      - toy ring degrees n in {8, 16, 32, 64, 128} for tail measurement
      - full-size arithmetic for the smoothing/bias test, which is a finite computation
    methods:
      - empirical distribution of required BKZ block size over sampled a
      - constructive planted-weak-a search and indistinguishability check
      - smoothing-parameter / dual-bias computation over families of sublattices L
      - reproduction of a known-weak EHL/ELOS instance as positive control
  motivation: >-
    R-LWE has a perfect random self-reduction over the SECRET (s -> s + t for
    public t) and none over a: multiplying by a unit u requires u*e to stay
    small, and the only short units are roots of unity, so the reachable set is
    just a -> +/- x^k a. A set of weak a therefore cannot be argued away by
    re-randomization; it can only be bounded through the LPR worst-case
    reduction, whose concrete parameters are far from deployment. The
    average-case hardness claim over a is thus a statement about a distribution
    nobody has measured. Separately, the known weak-instance attacks (EHL, ELOS,
    Chen-Lauter-Stange) all require a ring homomorphism R_q -> F_q under which
    the error stays small; the correct and strictly larger invariant is that the
    error distribution fails to SMOOTH a sublattice L, with L ranging over
    kernels of R_q-module maps -- which admits non-ideal R'-submodules the
    homomorphism framing cannot express.
  decision_target: >-
    (a) The left-tail exponent of instance-specific hardness over a at toy
    degrees, and whether planted-weak a are distinguishable from random.
    (b) A decidable weak-parameter test that reproduces a known-weak instance
    (positive control) and returns flat on ML-KEM (null control), together with
    the result of applying it to the unscanned zoo: FHE moduli, NTT-unfriendly
    q, non-power-of-two cyclotomics, PLWE with general f.
  constraints:
    - >-
      The instrument is validated before it is trusted. A negative result from a
      bias test that cannot reproduce a published weak instance is not evidence
      about anything; the positive control gates every downstream reading.
    - >-
      ML-KEM is expected to pass the smoothing test with room. The envelope in
      ideas/rlwe-mlwe-20260806/PORTFOLIO.md gives negligible bias for the
      natural ideal candidates at (n=256, q=3329, CBD eta=2). A confirmation is
      a null control, is reported as such, and is not a security claim.
    - >-
      Seed-search framing is bounded: ML-KEM derives A from a public seed rho
      via SHAKE-128, and nothing here bears on honestly-generated rho. Relevance
      is confined to protocols that reuse, derive, or allow a party to choose
      rho, and to schemes with a fixed global a. That boundary is stated in any
      deliverable.
    - >-
      A constructive weak-a family that is DISTINGUISHABLE from random is a
      curiosity, not a result. Only indistinguishability makes it a warning, and
      indistinguishability must be argued, not assumed.
    - >-
      Toy-degree tail exponents are hypothesis-generating only (AGENTS.md
      rule 4).
    - >-
      No claimed weak instance is recorded without a certificate: the recovered
      secret reproduces the public samples under independent recomputation
      (docs/claims-and-verification.md).
  status: draft
  owner: coordinator
