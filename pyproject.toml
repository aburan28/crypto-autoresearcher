[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-autoresearcher"
version = "0.1.0"
description = "A dependency-free orchestration harness for reproducible cryptanalysis experiments"
requires-python = ">=3.10"

[project.scripts]
crypto-autoresearcher = "crypto_autoresearcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
