# Add to ~/.codex/config.toml.
#
# NOT to .codex/config.toml in this repository -- that file is generated by
# tools/generate_runtime_agents.py and hand edits are overwritten.
#
# ~/.codex/config.toml is user-scoped, so `--directory` cannot be relative:
# fill in the absolute path to this checkout's kb/ directory. Machine-specific
# settings (CRYPTO_KB_QDRANT_URL above all) belong in kb/.env, which is
# gitignored; anything set here overrides it.

[mcp_servers.crypto-kb]
command = "uv"
args = [
  "run",
  "--directory",
  "/absolute/path/to/crypto-autoresearcher/kb",
  "--extra",
  "index",
  "--extra",
  "mcp",
  "python",
  "-m",
  "crypto_kb.mcp.server",
]

[mcp_servers.crypto-kb.env]
CRYPTO_KB_CLIENT = "codex"
