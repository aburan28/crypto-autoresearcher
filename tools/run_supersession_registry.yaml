      was all present under other keys -- `command`, `environment`, `revision`,
      `parameters`, `randomness` -- and the companion files existed as
      stdout.txt and stderr.txt. THE CAUSE IS A COORDINATOR CONTRACT DEFECT, not
      an Executor error: the frozen EXP-SSIQ-4de240 contract named
      required_artifacts stdout.txt/stderr.txt and never named the run-manifest
      schema, and the Executor followed the frozen contract exactly as
      instructed. Recorded as GD-5 on GOAL-SSIQ-001.
    notes: >-
      The superseded manifest is hash-bound at 75468646 in the
      TASK-20260805-556a74 snapshot receipt (commit 41a4aebd) and stays
      byte-identical at its original path. The superseding record declares the
      supersession from its own side in `run.supersedes`, with the same prior
      sha256, and states that the prior manifest GOVERNS every field it carries.
      The four companion artifacts are derived only from bytes already frozen at
      that commit: stdout.log and stderr.log are byte-identical copies,
      environment.json and command.txt are re-serialisations of the superseded
      manifest's own blocks. NOTHING WAS RE-RUN, RE-MEASURED OR INVENTED, and no
      measurement, fitted value, control verdict or decision-rule branch differs
      between the two records. Adding files leaves the receipt's declared path
      hashes valid, because a receipt pins paths and not directory contents.
