      validator's bounded vocabulary. The superseding record changes only the
      certificate label to none and retains the exact raw result and metrics.
    notes: >-
      No measurement was rerun. The original manifest and snapshot remain
      byte-identical; this registry routes schema validation to manifest_v2.
