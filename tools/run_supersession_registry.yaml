    superseding_path: experiments/EXP-SSIQ-4de240/runs/RUN-SSIQ-4de240-a/manifest_v2.yaml
    superseding_sha256: f2a4a9fa19d75586d72e6d02d894758b6dfb75befd2716a7da3fcb3b36a7ebe9
    registered: 2026-08-05
    supersession_kind: additive_schema_completion
    defect: >-
      The superseded manifest omits the RUN_REQUIRED_TOP keys `code` and
      `inputs`, and the run directory lacked the companion artifacts
