# Registry of superseded run manifests.
#
# AGENTS.md core rule 4: results are immutable records and corrections create
# new records. When a run manifest is found to be INCOMPLETE after it has been
# archived and hash-bound in an attested snapshot receipt, the repair is a new
# manifest record written beside it -- never an edit of the frozen file, which
# would make an already-verified commit unverifiable.
#
# tools/validate_ledger.py discovers runs by globbing
# experiments/*/runs/*/manifest.yaml and has no notion of supersession, so
# without this registry it would keep reading the superseded file forever and
# keep reporting a defect that a committed record has already repaired. Each
# entry below routes the run-schema check to the superseding record, and PINS
# BOTH FILES by sha256. Supersession is therefore not a way to hide drift: if
# either file changes by one byte the validator reports an error, and the
# superseded file must remain present at its original path.
#
# Entries are explicit and auditable. There is no globbing, pattern matching,
# or inference: a path is superseded only because it is named here, and every
# hash can be rechecked with `shasum -a 256 <path>`.
#
# This is NOT tools/legacy_run_inventory.yaml, which grandfathers manifests
# that PREDATE the validator, and it is NOT tools/validate_ledger_baseline.txt,
# whose lines may only ever be removed. Both of those record debt. An entry
# here makes the stronger, checkable claim that a COMPLETE replacement record
# exists, hashes to the recorded value, and is what the schema check now reads.
#
# Adding an entry requires: (a) the superseding record already exists and
# validates cleanly on its own; (b) it declares the same run id as the record
# it supersedes; (c) the superseding record is not itself named
# `manifest.yaml` under experiments/*/runs/*, so it cannot be discovered by the
# run glob and register the same run id twice. All three are enforced --
# (a) by the ordinary run-schema check, (b) and (c) by
# tools/validate_ledger.py's registry loader and sweep. Failure modes are
# pinned in tools/test_run_supersession.py.
#
# A registry entry is a tooling record. It asserts nothing about the research
# content of either manifest and changes no research disposition.
schema: run-supersession-registry-v1
records:
  - run_id: RUN-LPF-001-plantz
    superseded_path: experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml
    superseded_sha256: c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4
    superseding_path: experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest_v2.yaml
    superseding_sha256: 0831526becbad2337a12c223c05eeaff37952e9fd8e252ddde9991d30430c2ba
    registered: 2026-08-01
    supersession_kind: additive_schema_completion
    defect: >-
      The superseded manifest omits the RUN_REQUIRED_TOP fields `environment`
      and `inputs`; the substance of `inputs` was present under a top-level
      `parameters` key, which is not the key the schema names. It also omits
      the resource measurements AGENTS.md's artifact policy requires, which the
      validator does not check. The superseding record supplies `environment`,
      `inputs`, and `resources` and restates nothing else.
    notes: >-
      The superseded manifest is hash-bound at c8812fb4 in the
      TASK-20260801-064 snapshot receipt, so it must stay byte-identical at its
      original path; that is what this registry pins rather than relaxes. The
      superseding record declares the supersession from its own side in
      `run.supersedes`, including the same prior sha256 recorded here, and
      states the precedence rule that the prior manifest governs every field it
      carries. This entry only tells the validator which record to read.
