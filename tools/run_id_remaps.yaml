schema: run-id-remap-v1

# Declared, CORR-authorised renames of committed run directories.
#
# Run records are append-only: tools/check_run_immutability.py fails any
# modification or deletion under experiments/*/runs/. A duplicate RUN id is the
# one defect that rule cannot repair, because superseding under a new id leaves
# the collision in place. This file is the narrow exception.
#
# It is not a waiver. check_run_immutability.py accepts a listed rename ONLY if
# the new manifest is byte-identical to the old one after substituting the
# declared id -- so a rename can never smuggle in a data edit -- and every other
# file in the directory is byte-identical. Anything else still fails.
#
# Each entry names the correction that authorises it. Entries are permanent:
# they are how a historical run id stays resolvable.
correction_id: CORR-20260802-004
