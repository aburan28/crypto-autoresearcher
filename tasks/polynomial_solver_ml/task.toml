schema_version = "1.1"
artifacts = [
  { source = "/app/output", destination = "polynomial-ml-output" }
]

[task]
name = "local/polynomial-solver-ml"
description = "Train and verify general synthetic finite-field polynomial solver selectors."
keywords = ["computational-algebra", "machine-learning", "contextual-bandit"]

[metadata]
difficulty = "medium"
category = "machine-learning"
reward_semantics = "Binary software completion and integrity; no required speedup."

[agent]
timeout_sec = 660

[verifier]
timeout_sec = 120

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 2048
gpus = 0
allow_internet = false
