# Paths are relative to this file, independent of the caller's working directory.
[[sources]]
name = "crypto-autoresearcher"
root = "../../crypto-autoresearcher"
include = ["knowledge/**/*.md", "inputs/*/paper_fulltext.md", "research/**/*.md", "formal/**/*.lean"]

[[sources]]
name = "crypto"
root = "../../crypto"
include = ["research/notes/**/*.md", "papers/**/*.tex", "papers/**/*.md", "**/*.lean"]

[[sources]]
name = "cryptanalysis"
root = "../../cryptanalysis"
include = ["research/**/*.md", "papers/**/*.tex", "papers/**/*.md", "**/*.lean"]

[[sources]]
name = "crypto-lean"
root = "../../crypto-lean"
include = ["CryptoLean/**/*.lean", "CryptoLeanCore/**/*.lean"]

[[sources]]
name = "cryptologic-archives"
root = "../../cryptologic-archives"
include = ["docs/**/*.md", "profiles/**/*.md", "sources/originals/*.pdf", "sources/originals/*.txt", "data/*.json"]

