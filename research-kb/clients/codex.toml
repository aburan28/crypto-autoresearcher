# Native HTTP transport where supported. Token is a runtime secret, not config text.
[mcp_servers.research-kb]
url = "https://kb.example.com/mcp"
bearer_token_env_var = "RESEARCH_KB_TOKEN"

# Alternative for clients accepting only stdio:
# [mcp_servers.research-kb]
# command = "/absolute/path/to/research-kb"
# args = ["connect", "https://kb.example.com"]
# Pass RESEARCH_KB_TOKEN through the client's runtime environment.
