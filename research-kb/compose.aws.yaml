services:
  qdrant:
    volumes:
      - /srv/research-kb/qdrant:/qdrant/storage
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      KB_HOSTNAME: ${KB_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/research-kb/caddy-data:/data
      - /srv/research-kb/caddy-config:/config
    networks: [edge]
    depends_on: [api]
