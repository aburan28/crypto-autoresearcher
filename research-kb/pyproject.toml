[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-kb"
version = "0.1.0"
description = "One research library for papers, evidence and Lean declarations, over local or authenticated remote MCP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3", "pydantic-settings>=2,<3", "typer>=0.12,<1",
  "structlog>=24", "tenacity>=8", "prometheus-client>=0.20",
  "PyYAML>=6", "fastmcp>=2.14,<3", "httpx>=0.28,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
index = ["qdrant-client>=1.12,<1.13"]
pdf = ["pymupdf>=1.24,<2"]
docling = ["docling>=2,<3"]
transformers = ["sentence-transformers>=3,<6"]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "python-hcl2>=7"]

[project.scripts]
research-kb = "research_kb.cli:app"
crypto-kb = "crypto_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_kb = ["eval/corpus_manifest.txt"]
research_kb = ["lean/*.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
