schema_version: "1.0"

# One role definition, many runtimes.
#
# A role's authority and its tool surface are research-contract facts: the
# Coordinator may change official state and may not run experiments, the
# Executor is the reverse. Those facts belong here, once, in runtime-neutral
# terms — not duplicated in each runtime's own agent format, where they drift.
#
# `tools/check_runtime_bindings.py` enforces that every runtime binding on disk
# still matches this table, so adding a runtime is a table entry plus a
# generated binding file, never a re-derivation of who may do what.

# Runtime-neutral capability vocabulary, and the tool names each runtime uses
# for it. A runtime that cannot express a capability declares it unsupported;
# a role needing that capability then cannot run on that runtime.
capabilities:
  read_files:    {claude_code: [Read],           codex_cli: [read],   opencode: [read],              api_direct: [read_file]}
  search_files:  {claude_code: [Grep, Glob],     codex_cli: [search], opencode: [grep, glob, list],  api_direct: [list_files, search_files]}
  # OpenCode gates file creation and modification behind one `edit` permission,
  # so write_files and edit_files map to the same key there. Comparison is by
  # set, not by list, precisely so a runtime may coarsen the vocabulary without
  # being misreported as a mismatch.
  write_files:   {claude_code: [Write],          codex_cli: [write],  opencode: [edit],              api_direct: [write_file]}
  edit_files:    {claude_code: [Edit],           codex_cli: [edit],   opencode: [edit],              api_direct: [edit_file]}
  run_commands:  {claude_code: [Bash],           codex_cli: [shell],  opencode: [bash],              api_direct: [run_command]}
  # api_direct has no web capability: it is a bounded repository runtime, so a
  # role that needs the open web runs under a runtime that has it rather than
  # silently doing without. `tools/check_runtime_bindings.py --list` shows
  # which roles that excludes.
  web_search:    {claude_code: [WebSearch, WebFetch], codex_cli: [web], opencode: [webfetch, websearch]}

# Capabilities a runtime grants unconditionally and cannot withhold from a
# role, whatever the contract says.
#
# This is the inverse of an unsupported capability, and it is recorded rather
# than assumed away. The Codex CLI always exposes a shell -- its `read-only`
# sandbox restricts what a command may write, not whether commands may run --
# so a role whose contract excludes `run_commands` is, on that runtime,
# restrained by its prompt rather than by the harness. `--list` prints these
# as OVER-GRANT so the gap is visible when choosing where to run a role.
runtime_grants_always:
  codex_cli: [run_commands]

# Capabilities a runtime cannot separate: granting any member grants them all.
#
# Codex exposes a single write switch -- `sandbox_mode = "workspace-write"`
# permits creating and modifying files alike -- and OpenCode puts the same pair
# behind one `edit` permission. Neither can express "may create files, may not
# modify them", which is the Idea Generator's contract. Recorded here for the
# same reason as the grants above: the alternative is a checker that quietly
# tolerates the difference, and then tolerates a real one.
runtime_capability_coupling:
  codex_cli: [[write_files, edit_files]]
  opencode: [[write_files, edit_files]]

# Reasoning effort is a POLICY fact, and one runtime can now express it.
#
# `orchestration/model-policies.yaml` calibrates `reasoning_effort` per policy
# and explains why: deciding whether evidence justifies a state transition is
# reasoning-bound, running a frozen protocol is instruction-bound. Until now
# that number could only be applied process-level, by launching a session with
# the resolved environment, because no runtime agent format could carry it.
#
# Claude Code subagent definitions accept an `effort` field
# (low|medium|high|xhigh|max), so on that runtime the number is carried by the
# binding itself and `tools/check_runtime_bindings.py` fails the build when a
# binding's effort stops matching its policy's `reasoning_effort`. A runtime
# absent from this map still resolves effort process-level via
# `python -m orchestration.adapter env`; nothing about the policy layer changes.
#
# MODEL SELECTION IS STILL NOT EXPRESSIBLE and must not be added here. Effort is
# a capability contract stated once in the policy; a model identifier is the
# output of policy x backend resolution and belongs to the adapter.
runtime_reasoning_effort:
  claude_code:
    frontmatter_field: effort
    levels: [low, medium, high, xhigh, max]

# Execution limits for the api_direct runtime (orchestration/agent/). These are
# defaults; a task's own budget narrows them and never widens them.
api_direct:
  max_steps: 40
  command_timeout_seconds: 300
  # `run_command` takes an argument list and never a shell string, so these are
  # program names, not command lines. Only read-only git subcommands are
  # accepted (see orchestration/agent/tools.py): a worker never commits.
  command_allowlist: [python3, python, pytest, sage, git, ls, wc]

roles:
  coordinator:
    contract: agents/coordinator.md
    default_policy: coordinator-orchestration-code
    authority:
      may_change_official_state: true
      may_approve_experiments: true
      may_execute_experiments: false
      independent_of_producer: false
    capabilities: [read_files, search_files, write_files, edit_files]
    runtime_bindings:
      claude_code: .claude/agents/coordinator.md
      codex_cli: .codex/agents/coordinator.toml
      opencode: .opencode/agent/coordinator.md

  idea-generator:
    contract: agents/idea-generator.md
    default_policy: research-deep
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: false
      independent_of_producer: false
    capabilities: [read_files, search_files, write_files, web_search]
    runtime_bindings:
      claude_code: .claude/agents/idea-generator.md
      codex_cli: .codex/agents/idea-generator.toml
      opencode: .opencode/agent/idea-generator.md

  executor:
    contract: agents/executor.md
    default_policy: executor-implementation
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: true
      independent_of_producer: false
    capabilities: [read_files, search_files, write_files, edit_files, run_commands]
    runtime_bindings:
      claude_code: .claude/agents/executor.md
      codex_cli: .codex/agents/executor.toml
      opencode: .opencode/agent/executor.md

  validator:
    contract: agents/validator.md
    default_policy: review-adversarial
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: false
      independent_of_producer: true
    capabilities: [read_files, search_files, write_files, edit_files, run_commands]
    runtime_bindings:
      claude_code: .claude/agents/validator.md
      codex_cli: .codex/agents/validator.toml
      opencode: .opencode/agent/validator.md

  red-team:
    contract: agents/red-team.md
    default_policy: review-adversarial
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: false
      independent_of_producer: true
    capabilities: [read_files, search_files, write_files, edit_files, run_commands, web_search]
    runtime_bindings:
      claude_code: .claude/agents/red-team.md
      codex_cli: .codex/agents/red-team.toml
      opencode: .opencode/agent/red-team.md

  # ------------------------------------------------------------------
  # Policy-tier variants.
  #
  # `model-policies.yaml` routing_rules already send SOME tasks of an existing
  # role to a different policy: a claimed breakthrough goes to
  # `review-breakthrough`, a re-run of a frozen command goes to
  # `executor-mechanical`. Those routes had no runtime binding, so under Claude
  # Code they could not be honoured at all -- a breakthrough review had to run
  # at the adversarial tier (a silent downgrade, forbidden) or pause the goal.
  #
  # A variant is the SAME ROLE at a different policy tier: identical contract,
  # identical authority, identical capabilities, different reasoning effort.
  # The checker enforces exactly that, so a variant can never become a
  # privilege-escalation route -- the only thing it may change is how hard the
  # model thinks. Dispatch queues keep naming the canonical role
  # (`tools/research_dispatch.py` ROLES is unchanged); the runtime picks the
  # variant from the task's `inference.policy`.
  # ------------------------------------------------------------------

  executor-mechanical:
    variant_of: executor
    contract: agents/executor.md
    default_policy: executor-mechanical
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: true
      independent_of_producer: false
    capabilities: [read_files, search_files, write_files, edit_files, run_commands]
    runtime_bindings:
      claude_code: .claude/agents/executor-mechanical.md

  validator-breakthrough:
    variant_of: validator
    contract: agents/validator.md
    default_policy: review-breakthrough
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: false
      independent_of_producer: true
    capabilities: [read_files, search_files, write_files, edit_files, run_commands]
    runtime_bindings:
      claude_code: .claude/agents/validator-breakthrough.md

  red-team-breakthrough:
    variant_of: red-team
    contract: agents/red-team.md
    default_policy: review-breakthrough
    authority:
      may_change_official_state: false
      may_approve_experiments: false
      may_execute_experiments: false
      independent_of_producer: true
    capabilities: [read_files, search_files, write_files, edit_files, run_commands, web_search]
    runtime_bindings:
      claude_code: .claude/agents/red-team-breakthrough.md

# Roles whose `independent_of_producer` is true must resolve to a policy with
# `independent_session_required: true`; the checker enforces this so a review
# role can never be quietly routed through a non-independent session.
#
# A role carrying `variant_of` must match its base role's contract, authority
# and capabilities EXACTLY, and must resolve to a different policy than the
# base -- otherwise it is either a second name for the same thing or a way to
# gain authority without saying so. Both are checker errors.
