# Repo radar: what to look for on GitHub and which repositories to follow.
# Read by tools/repo_radar.py and the daily `repo-radar` workflow; see
# docs/repo-radar.md. Changes take effect on the next run after they reach main.
# To check how a repo scores: python3 tools/repo_radar.py score OWNER/REPO

[search]
# GitHub topics. Each one is searched twice a day: repos created, and repos
# pushed, since the last run.
topics = [
  "ecdlp",
  "discrete-logarithm",
  "cryptanalysis",
  "elliptic-curves",
  "elliptic-curve-cryptography",
  "isogeny",
  "isogeny-based-cryptography",
  "lattice-reduction",
  "lattice-cryptography",
  "post-quantum-cryptography",
  "groebner-basis",
  "side-channel",
  "cryptography",
  "zero-knowledge",
  "fully-homomorphic-encryption",
]
# Free-text searches over name, description and README. Quote phrases.
keywords = [
  '"discrete logarithm"',
  '"pollard rho"',
  '"index calculus"',
  '"summation polynomial"',
  "ecdlp",
  "kangaroo secp256k1",
  "isogeny attack",
  '"lattice attack"',
  '"dual attack"',
  '"lattice sieving"',
  "cryptanalysis",
]
# Topics and keywords too broad to search by push date: only repos created
# since the last run are searched for these.
created_only = [
  "cryptography",
  "zero-knowledge",
  "fully-homomorphic-encryption",
  "cryptanalysis",
]
# Further queries used as written; {since} becomes the window start, e.g.
# "language:sage elliptic pushed:>={since}".
extra_queries = []
qualifiers = "fork:false archived:false"
# Owners whose repos are never reported (your own show up in topic searches).
ignore_owners = ["aburan28"]
max_pages = 3          # 100 results a page; GitHub stops at 1,000 per query
first_run_days = 7     # search window when no earlier run is recorded
overlap_days = 1       # re-read this much of the previous window
max_window_days = 14   # after a long gap, look back no further than this

[scoring]
# A repo is reported and remembered at or above this score.
min_score = 4

# Weight per GitHub topic on the repo.
[scoring.topics]
ecdlp = 6
discrete-logarithm = 5
cryptanalysis = 5
isogeny = 5
isogeny-based-cryptography = 4
elliptic-curves = 4
elliptic-curve-cryptography = 3
lattice-reduction = 4
lattice-cryptography = 3
groebner-basis = 4
post-quantum-cryptography = 3
side-channel = 3
cryptography = 2
zero-knowledge = 1
fully-homomorphic-encryption = 1

# Case-insensitive regular expressions over the repo name and description.
# Each pattern counts once.
[scoring.terms]
'\becdl?p\b' = 6
'discrete[ -]?log' = 5
'index[ -]calculus' = 5
'summation polynomial|semaev|weil descent' = 5
'cryptanaly' = 5
'pollard' = 4
'isogen' = 4
'gr(ö|oe?)bner|\bf4\b|\bf5\b|xl algorithm' = 3
'kangaroo|baby[ -]step|\bbsgs\b' = 3
'elliptic[ -]curve' = 3
'(lattice|lll|bkz)[ -]?(reduction|attack|sieve|sieving|estimator)|dual attack|\busvp\b|\blwe\b' = 4
'ml[- ]?kem|ml[- ]?dsa|slh[- ]?dsa|kyber|dilithium|falcon|sphincs|mceliece|\bhqc\b' = 2
'post[- ]?quantum|\bpqc\b' = 2
'side[- ]channel|fault (attack|injection)|timing attack' = 3
'secp256k1|ed25519|curve25519|\bp-?256\b|bls12' = 2
'\b(attack|break|broken|solver|recovery)\b' = 1

# Cryptocurrency and promotion noise subtracts but never excludes outright:
# a kangaroo solver for Bitcoin puzzles still clears the bar.
[scoring.negative]
'\b(bitcoin|btc|ethereum|eth|solana|nft|defi|airdrop|memecoin|altcoin|blockchain|web3|tokens?)\b' = -2
'\b(trading|trader|prices?|arbitrage|sniper|pump|wallets?)\b|\b(crypto|coin)[ -]?exchange' = -3
'\b(bot|signals?|telegram)\b' = -1

[archive]
# GH Archive events carry a repo name and nothing else, so this
# case-insensitive pattern is a first cut. It is matched against the repo
# name (not the owner) split into lowercase words: `ECDLPSolver_gpu` is
# `ecdlp solver gpu`. Matches the radar has not seen are looked up through
# the API and scored like search hits.
name_pattern = '\b(ecdl?p|dlp|discrete|pollard\w*|kangaroo\w*|rho|bsgs|isogen\w*|sqi ?sign|csidh|csi ?fi ?sh|elliptic|ecc|secp\d+\w*|ed25519|curve25519|lattices?|lll|bkz|g6k|fplll|sieve|sieving|lwe|kyber|dilithium|ml ?kem|ml ?dsa|slh ?dsa|sphincs\w*|mceliece|pqc|post ?quantum|cryptanaly\w*|cryptograph\w*|groebner|grobner|gröbner|msolve|m4ri\w*|side ?channel\w*|homomorphic|fhe|zk ?snarks?|zk ?starks?|zkp)\b'
enrich_limit = 40   # API lookups per archive day
min_events = 2      # events a lead needs, unless it was made public or released
catch_up_days = 3   # days scanned per run after missed runs
workers = 4

[watch]
# Followed commit by commit. Seeded from the third-party repositories most
# often cited across aburan28/crypto, cryptanalysis and crypto-autoresearcher.
# `repo_radar.py opml` exports their Atom feeds for an RSS reader.
repos = [
  "mtrimoska/EC-Index-Calculus-Benchmarks",
  "mtrimoska/WDSat",
  "kevin-carrier/CodedDualAttack",
  "icarm/elliptic-rank",
  "malb/lattice-estimator",
  "malb/m4ri",
  "fplll/fplll",
  "christellevincent/WISDE",
  "KULeuven-COSIC/CSI-FiSh",
  "cpeikert/CollimationSieve",
  "ZeroWang030221/Space-Efficient-Quantum-Algorithm-for-Elliptic-Curve-Discrete-Logarithms-with-Resource-Estimation",
  "pq-crystals/security-estimates",
  "manschga/M5GB",
  "cbouilla/libfes-lite",
  "sam-jaques/sieve-memory-estimates",
  "ludopulles/DoesDualSieveWork",
  "SQISign/the-sqisign",
  "cr-marcstevens/hashclash",
  "RetiredC/RCKangaroo",
  "JeanLucPons/Kangaroo",
  "pq-code-package/mlkem-native",
]
max_commits = 10   # listed per repo per digest

[digest]
max_rows = 30            # rows per table
rising_min_stars = 10    # star gain since last seen that counts as rising
retention_days = 365     # forget repos not seen for this long
