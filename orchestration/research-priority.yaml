# Research priority and budget policy.
#
# Declared on user instruction (2026-09-04):
#   1. All ECC goals have UNLIMITED budget.
#   2. ECC goals take priority over every other goal, always.
#   3. Open ECC ideas must be designed into experiments.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH for what counts as ECC. It is read by
# tools/ecc_priority.py, and through it by tools/goal_portfolio_health.py and
# tools/validate_ledger.py. Do not re-derive the set anywhere else, and do not
# infer it from an identifier prefix: several ECC areas are NOT named for
# elliptic curves (CRYPTO-001 is an ECDLP search; DREG/MONO/RELN/SDEG/SIG/ICEX
# are Semaev and index-calculus machinery), and several elliptic-sounding ones
# are not ECC. Membership below was decided by reading each area's goal titles,
# not its acronym.
#
# To change the classification, edit THIS FILE. Every consumer follows.

version: 1
declared_on: '2026-09-04'
declared_by: user instruction

# ---------------------------------------------------------------------------
# ECC areas. A goal, question, hypothesis, experiment or idea whose identifier
# carries one of these area tokens is an ECC record.
# ---------------------------------------------------------------------------
ecc_areas:
  # --- prime-field ECDLP and its index-calculus machinery ---
  - ECDLP     # prime-field ECDLP breakthrough search
  - CRYPTO    # "Reproducible cryptographically relevant ECDLP breakthrough search"
  - PATH      # tiered path toward prime-field ECDLP complexity reduction
  - ENDO      # ECDLP via endomorphisms, isogenous curves, j-invariant structure
  - ECTD      # prime-field elliptic-curve trapdoors, secret isogenies
  - PFDR      # prime-field degree-of-regularity / small-root reach
  - ISOU      # isogeny-class search over prime fields
  # --- Semaev summation polynomials, solving degree, relations ---
  - SATIC     # SAT/Semaev correctness and measurement prerequisites
  - DREG      # boolean Semaev m=3 degree of regularity
  - SDEG      # certificate-backed Semaev solving-degree scaling law
  - SIG       # Semaev syzygy-cascade exploitability
  - MONO      # Semaev-cover monodromy / relation-rate gate
  - RELN      # factor-base decomposition probability audit
  - ICEX      # charged toy index-calculus exponent vs rho
  - ICLIFT    # index-calculus factor-base geometry and xedni lifting
  - XEDN      # function-field xedni lifting controls
  # --- isogenies and supersingular curves ---
  - SSI       # supersingular-isogeny cryptanalysis after the SIDH break
  - SSIQ      # toward p^{1/4} on the supersingular isogeny problem
  - P13       # Wesolowski 2026 p^{1/3+o(1)} supersingular isogeny attack
  - CSIDH     # commutative supersingular isogeny Diffie-Hellman
  - SQISIGN   # isogeny-based signature
  - SCURVE    # SafeCurves parameter audits (per-curve elliptic goals)
  # --- curves over Q, rank records ---
  - ECQ       # Mordell-Weil rank over Q
  - ECRANK    # certified elliptic-curve rank records
  # --- elliptic-curve signature schemes ---
  - ECDSA
  - EDDSA
  - TECDSA    # threshold ECDSA
  # --- discrete log on elliptic-curve groups ---
  - AUXIN     # auxiliary-input discrete logarithm (Cheon-type) at deployed params
  - PAIR      # BLS12-381 / BN254 pairing-friendly curves
  # --- user-named targets, added 2026-09-06 (RQ-GRUMPY-964876, RQ-LHW-1877bb,
  #     RQ-FROB-7d8dd4). GRUMPY and LHW are generic-group ECDLP algorithms whose
  #     baseline is this program's rho/BSGS baseline on prime-order elliptic
  #     subgroups; FROB is index calculus on subfield elliptic curves. ---
  - GRUMPY    # exact average-case constant of two-grumpy-giants-and-a-baby
  - LHW       # low-storage low-Hamming-weight DLP at sqrt(binom(m, w)) time
  - FROB      # Frobenius exploitation in subfield-curve index calculus

# ---------------------------------------------------------------------------
# Considered and EXCLUDED, with the reason. Recorded so the judgement is
# reviewable and so nobody re-litigates it from the acronym alone. Move an
# entry up into `ecc_areas` to reclassify it; nothing else needs editing.
# ---------------------------------------------------------------------------
excluded_areas:
  CLGRP:  imaginary-quadratic class groups as hidden-order groups; CM-adjacent
          but not an elliptic-curve target
  QALG:   quantum mechanism search across ML-KEM, HQC and CSIDH; only the CSIDH
          third is ECC, the goal as scoped is PQC-wide
  QRE:    quantum resource estimates for RSA-2048 AND 256-bit ECDLP; half ECC,
          but the goal is a costing-pipeline reproduction, not an ECC attack
  SYMF:   symmetric-cryptanalysis frontier (hashes and block ciphers)
  KEX:    key-exchange construction, not curve-specific
  HYBRID: hybrid KEM combiners
  ROS:    ROS problem / concurrent Schnorr signatures
  WFS:    Fiat-Shamir transcript completeness
  SIMSPK: SIMON and SPECK rotation constants
  SNFS:   special number field sieve (finite fields / factoring)
  DIFFP:  MD5 differential paths

# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------
budget:
  # Instruction 1. An ECC goal's campaign budget is unbounded: these fields
  # must be null. A finite value on an ECC goal is a validation error.
  ecc_unlimited: true
  unbounded_fields: [maximum_batches, total_wall_clock_seconds]
  # `max_concurrent` is NOT unbounded. It is a machine-headroom limit, not a
  # research budget, and oversizing it degrades runs rather than buying any.
  # See launch-research-harness "Concurrency".
  max_concurrent_still_bounded: true
  # What unlimited does NOT mean: it removes the batch ceiling, not the duty to
  # rank. Never dispatch a task you cannot rank ahead of doing nothing.

priority:
  # Instruction 2. ECC first, always, across every selection point.
  ecc_first: true
  applies_to:
    - launch-research-harness step 3 goal selection
    - goal_portfolio_health ordering within every bucket
    - coordinate-research-goal reranking after a checkpoint
    - which impediment to re-check first
  # A non-ECC goal is worked only when NO ECC goal offers a ranked, justified
  # task. Priority orders the queue; it never manufactures ECC work, and it
  # never licenses dispatching an unranked ECC task ahead of a ranked non-ECC
  # one that is already in flight.

idea_design:
  # Instruction 3. An open ECC idea is one whose record is `proposed` and which
  # no hypothesis or experiment references. These are ranked work, not backlog.
  ecc_open_ideas_must_be_designed: true
  worklist: python3 tools/ecc_priority.py --open-ideas
  # Designing means /design-experiment: a hypothesis plus a frozen contract.
  # It does NOT mean approving one. Approval stays a Coordinator act on a
  # committed decision, and a designed contract sits at approved_by: null.
