# Declared research focus: what this program pursues first, and why.
#
# The portfolio holds 102 goals across 66 areas. Goal selection
# (`/launch-research-harness` step 3) previously ranked only by
# dispatchability, so whichever goal happened to be `ready` got the session --
# and on any given day that is far more likely to be one of the twenty SafeCurves
# census goals, or a symmetric-primitive lane, than the ECDLP attack itself.
# Nothing was wrong with any individual choice; the aggregate was a program
# named for ECDLP that mostly did not work on ECDLP.
#
# This file is that ranking, made explicit and reviewable. It changes which
# goal a session reaches for FIRST. It does not change what any goal is allowed
# to conclude, does not close or deprioritize anything (every goal keeps its
# status, its records and its next action), and grants no authority: a tier-1
# goal still needs a dispatchable queue, still archives, and is still reviewed
# and scoped exactly as before.
#
# Edit the tiers to re-aim the program. `tools/goal_portfolio_health.py` reads
# this file on every sweep; `--focus-only` restricts a session to tier 1.

schema: crypto.autoresearch.research_focus.v1
focus: ecdlp
declared_by: user
declared_at: "2026-09-04"
rationale: >-
  Direct instruction to pursue the ECDLP goals relentlessly. ECDLP is the
  program's founding target (README, AGENTS.md) and the one its documents call
  the central hard problem; the portfolio had drifted to where a single goal
  record carried it.

tiers:

  - tier: 1
    name: ECDLP attack and its cost machinery
    dispatch_first: true
    why: >-
      Each of these is either the prime-field ECDLP attack itself or a
      measurement the attack's cost model depends on. GOAL-PATH-001 is the
      coordinating lane for the rest and names them as its Tier 0-2 series.
    goals:
      - GOAL-ECDLP-001   # prime-field ECDLP attack cost reduction -- the core goal
      - GOAL-PATH-001    # coordinates the Tier 0-2 series toward a charged ECDLP reduction
      - GOAL-CRYPTO-001  # discover + verify an ECDLP algorithmic mechanism, fully charged
      - GOAL-ENDO-001    # partitions prime-field ECDLP by the non-generic resource each needs
      - GOAL-ECTD-001    # trapdoor curves over generic prime fields (Teske-style)
      - GOAL-DREG-001    # solving degree of chained Semaev -- index calculus feasibility
      - GOAL-ICEX-001    # charged index calculus vs Pollard rho / BSGS exponent comparison
      - GOAL-RELN-001    # P(decomp) vs factor-base size for prime-field Semaev
      - GOAL-SDEG-001    # C_decomp(p,m) cost model for prime-field Semaev S_3/S_4
      - GOAL-SIG-001     # degree-born syzygy cascade -- algebraic structure the lane exploits

  - tier: 2
    name: Elliptic-curve parameter and security census
    dispatch_first: false
    why: >-
      Genuinely elliptic-curve work that bounds what an ECDLP result would mean
      in practice, but it reproduces published criteria rather than attacking
      the problem. Twenty near-identical SafeCurves goals should not outrank the
      attack lane simply by being numerous.
    areas:
      - SCURVE

  - tier: 3
    name: Adjacent hard problems
    dispatch_first: false
    why: >-
      Isogeny and quantum lanes share technique with the ECDLP lane and supply
      its exemplar (Wesolowski's p^{1/3+o(1)} result, docs/target-result-profile.md),
      but they attack different hard problems.
    areas: [SSI, SSIQ, SQISIGN, CSIDH, QALG, ECQ, ECRANK, ECDSA, EDDSA, TECDSA, PAIR]

# Everything unlisted -- symmetric primitives, lattice and code-based PQC,
# hash functions, the deployment-gap lanes -- ranks after the tiers above. It
# is NOT closed, deprioritized on the merits, or excluded from dispatch: a
# session with no tier-1 or tier-2 work available still picks it up, and any of
# it can be promoted by editing this file.
default_tier: 4
