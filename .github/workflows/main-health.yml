name: main-health

# The absolute sweep, moved OFF the pull-request path.
#
# `validate.yml` used to run the parseability check absolutely on every PR. That
# made one campaign's broken artifact every other campaign's failure: six
# truncated JSON run records from a single AES batch red-lighted PRs whose diffs
# touched none of them and which could not have repaired them without fabricating
# run output. With 115 open branches that coupling was the dominant CI failure.
#
# Absolute checking is still necessary -- it is the only thing that finds
# breakage already sitting on main. It just belongs HERE, where the failure
# reaches the campaign that owns the artifact, instead of on every PR.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  absolute-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Conflict markers, parseability, across every tracked file
        id: hygiene
        run: python3 tools/check_merge_hygiene.py --absolute

      # REPORTED, NOT FATAL, and the count is why. 61 of 101 queues already fail
      # to render on main -- historical archives bound knowledge entries and goal
      # records that have since been legitimately superseded, so their declared
      # path hashes no longer match. Failing the job on that would put main
      # permanently red and recreate precisely the cross-campaign coupling this
      # workflow exists to remove. The number is surfaced so it can be driven
      # down deliberately, by the campaigns that own the archives.
      - name: Dispatch queue render census
        if: always()
        run: |
          fail=0; total=0
          for q in $(git ls-files 'coordination/goals/*/batches/*/dispatch_queue.json'); do
            total=$((total+1))
            d=$(mktemp -d)
            python3 tools/research_dispatch.py "$q" \
              --output "$d/plan.json" --report "$d/plan.md" >/dev/null 2>&1 \
              || { echo "does not render: $q"; fail=$((fail+1)); }
            rm -rf "$d"
          done
          echo "queues failing to render: $fail of $total" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$fail of $total dispatch queues do not render"

      - name: Knowledge corpus builds
        if: always()
        run: python3 tools/build_knowledge_index.py --verify-corpus

      - name: Open or update the main-health issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "main is failing the absolute health sweep";
            const body = [
              "`main-health` failed on commit `" + context.sha.slice(0, 12) + "`.",
              "",
              "This is breakage **already on `main`**, not a pull request's fault.",
              "It no longer blocks other campaigns' PRs, which is the point — but it",
              "does need the owning campaign to repair or supersede the artifact.",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Reproduce locally:",
              "```sh",
              "python3 tools/check_merge_hygiene.py --absolute",
              "```",
              "",
              "---",
              "_Generated by [Claude Code](https://claude.ai/code)_",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "main-health",
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["main-health"],
              });
            }
