name: sync-main

# Compatibility entry point only. sync-branches owns the six-hour schedule;
# both use the same report/apply tool, so scheduling both duplicated the sweep.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only; false explicitly applies safe merges"
        type: boolean
        default: true

concurrency:
  group: sync-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Report or apply safe branch syncs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/sync_open_branches.py --limit 25 \
            ${{ inputs.dry_run == false && '--apply' || '' }}
