name: blobstore

# A committed blob pointer (`*.blob.json`, tools/artifact_store.py) is only as
# good as the object it names. After each merged PR that adds pointers,
# confirm every object exists in S3 at its recorded size. The PR gate
# (tools/repo_size.py) already refused pointers that do not address the shared
# store; this proves the upload happened. docs/artifact-storage.md.

on:
  pull_request_target:
    branches: [main]
    types: [closed]
    paths:
      - '**/*.blob.json'
      - '.github/workflows/blobstore.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blobstore
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.BLOBSTORE_AWS_REGION || vars.REPORTS_AWS_REGION || 'us-west-2' }}
      ROLE_ARN: ${{ vars.BLOBSTORE_S3_ROLE_ARN }}
      KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    steps:
      - name: Which credentials
        id: creds
        run: |
          if [ -n "$ROLE_ARN" ]; then mode=role
          elif [ -n "$KEY_ID" ]; then mode=keys
          else
            mode=none
            echo "::notice::No S3 credentials (vars.BLOBSTORE_S3_ROLE_ARN or secrets.AWS_ACCESS_KEY_ID): blob pointers were not checked. See docs/artifact-storage.md."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.creds.outputs.mode != 'none'
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/artifact_store.py
            **/*.blob.json
            /tools/artifacts/
      - name: Pull store data this workflow reads (tools/artifacts)
        if: steps.creds.outputs.mode != 'none'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: python3 tools/artifacts/artifacts.py pull --jobs 16 docs

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.mode == 'role'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.creds.outputs.mode == 'keys'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check this merge's pointers resolve
        if: steps.creds.outputs.mode != 'none'
        run: |
          set -euo pipefail
          pip install --quiet boto3
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            before=$(git rev-parse HEAD^)
            git diff -z --name-only --diff-filter=AM "$before" "$GITHUB_SHA" -- ':(glob)**/*.blob.json' > pointers.z
          else
            git ls-files -z -- ':(glob)**/*.blob.json' > pointers.z
          fi
          if [ ! -s pointers.z ]; then echo "no pointers to check"; exit 0; fi
          xargs -0 python3 tools/artifact_store.py check-remote < pointers.z
