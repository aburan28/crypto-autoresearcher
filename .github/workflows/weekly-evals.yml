name: weekly-evals

# docs/track-record-review-20261006.md item P2.12: run the harness's own eval
# suites once a week so its token cost per task class is a measured number.
# Results are evidence about the harness and the backend, never about ECDLP
# (evals/README.md); they are uploaded as a workflow artifact and never
# committed (evals/results/ is gitignored). The run step is skipped, loudly,
# when no backend credential is configured: a suite that ran with no key
# produces trial_error rows with zero tokens, which is an infrastructure stop
# and not a result (AGENTS.md rule 5).

on:
  schedule:
    # Off the hour; GitHub schedules are best effort and run on main.
    - cron: "19 05 * * 1"
  workflow_dispatch:
    inputs:
      trials:
        description: repeats per task (one trial is an anecdote)
        default: "3"

permissions:
  contents: read

concurrency:
  group: weekly-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EVAL_BACKEND: ${{ vars.EVAL_BACKEND || 'anthropic' }}
      EVAL_TRIALS: ${{ inputs.trials || vars.EVAL_TRIALS || '3' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull store data this workflow reads (tools/artifacts)
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ARTIFACTS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ARTIFACTS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.ARTIFACTS_AWS_REGION || 'us-west-2' }}
        run: |
          if ! command -v aws >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/artifacts-awscli"
            artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/bin/python"
            artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/bin/aws"
            if [ -d "$RUNNER_TEMP/artifacts-awscli/Scripts" ]; then
              artifacts_cli_python="$RUNNER_TEMP/artifacts-awscli/Scripts/python.exe"
              artifacts_cli_aws="$RUNNER_TEMP/artifacts-awscli/Scripts/aws.exe"
            fi
            "$artifacts_cli_python" -m pip install --disable-pip-version-check awscli==1.46.2
            export ARTIFACTS_AWS="$artifacts_cli_aws"
          fi
          python3 tools/artifacts/artifacts.py pull --jobs 16 docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python3 -m pip install -q -e ".[dev,agent,gf2]"

      # Offline. Fails the job when a suite stops being well-formed, whether
      # or not a backend is available.
      - name: Validate suites
        run: |
          for suite in evals/suites/*.yaml; do
            python3 -m orchestration.eval validate --suite "$suite"
          done

      - name: Check for a usable backend
        id: backend
        run: |
          if python3 -m orchestration.adapter doctor 2>&1 | grep -q "^OK *${EVAL_BACKEND}:"; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::backend ${EVAL_BACKEND} has no credentials; suites validated, not run"
          fi

      - name: Run suites
        if: steps.backend.outputs.usable == 'true'
        run: |
          stamp="$(date -u +%Y%m%d)"
          for suite in evals/suites/*.yaml; do
            name="$(basename "$suite" .yaml)"
            python3 -m orchestration.eval run --suite "$suite" \
              --backend "$EVAL_BACKEND" --trials "$EVAL_TRIALS" \
              --out "evals/results/${stamp}/${name}" \
              $( [ -f "evals/baselines/${name}.json" ] && echo "--baseline evals/baselines/${name}.json" )
          done

      - name: Upload results
        if: steps.backend.outputs.usable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          retention-days: 90
