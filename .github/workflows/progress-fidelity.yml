name: progress-fidelity
on:
  pull_request:
  push:
jobs:
  progress-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_progress_fidelity.py' -v
      - name: Validate all submitted claims
        run: python3 -m tools.progress_fidelity portfolio claims/
