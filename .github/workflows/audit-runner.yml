name: audit-runner
on:
  pull_request:
    paths:
      - 'tools/audit_process.py'
      - 'tools/test_audit_process.py'
      - 'tools/test_audit_manifest_schema.py'
      - 'schemas/run-manifest.schema.json'
      - '.github/workflows/audit-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-resource-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'jsonschema>=4,<5'
      - run: python -m unittest tools.test_audit_process tools.test_audit_manifest_schema -v
